 # =======================================================
 # NATIONAL CRISIS EVENTS
 # =======================================================
 ww1_crisis.1.t:0 "The Turnip Winter: Allied Blockade"
 ww1_crisis.1.d:0 "Prolonged naval warfare and the British North Sea blockade have cut off fertilizer, food, and raw material imports into the German Empire. Bread rations have collapsed, coal supplies are dwindling, and the civilian population is reduced to eating turnips. In the factories and streets, hunger protests threaten the home front."
 ww1_crisis.1.a:0 "The Reich will endure through science!"
 ww1_crisis_ger_tooltip:0 "The German Empire suffers severe resource, factory output, and stability penalties until Britain and France capitulate, or crisis relief decisions are enacted."

 ww1_crisis.2.t:0 "The Submarine Menace: Convoys in Peril"
 ww1_crisis.2.d:0 "German U-boats prowl the Atlantic shipping lanes without mercy. Hundreds of thousands of merchant tons are sent to the sea floor every month. Britain's grain reserves are dangerously thin, and our factories face a famine of imported raw rubber, oil, and ores."
 ww1_crisis.2.a:0 "Ration the kingdom and tighten escorts!"
 ww1_crisis_eng_tooltip:0 "The United Kingdom suffers severe dockyard, trade, and consumer goods penalties until Germany capitulates, or Admiralty relief decisions are completed."

 ww1_crisis.3.t:0 "Trench Weariness: Mutinies of the Poilus"
 ww1_crisis.3.d:0 "Years of futile frontal assaults against barbed wire and machine guns have broken the patience of the French infantry. In several divisions, exhausted soldiers refuse suicidal offensive orders, shouting 'No more blood for incompetent generals!' The High Command must act before the front collapses."
 ww1_crisis.3.a:0 "Improve rations and restore discipline!"
 ww1_crisis_fra_tooltip:0 "France suffers severe offensive and division organization penalties until the war ends, or High Command relief decisions pacify the trenches."

 ww1_crisis.4.t:0 "Munitions Famine: Petrograd Strikes"
 ww1_crisis.4.d:0 "Frontline commanders report that batteries have only five shells per day, and fresh conscripts are being thrown into the mud with no rifles. Behind the lines in Moscow and Petrograd, bread lines and runaway inflation have sparked mass strikes. The Imperial throne trembles."
 ww1_crisis.4.a:0 "Mobilize industry and deploy loyal troops!"
 ww1_crisis_sov_tooltip:0 "Russia suffers severe army organization, factory output, and stability debuffs until Central Powers capitulate, or emergency relief measures take effect."

 ww1_crisis.5.t:0 "Fracture of the Dual Monarchy"
 ww1_crisis.5.d:0 "The immense strain of modern industrial war is tearing the Austro-Hungarian Empire apart along ethnic lines. Czech regiments show open sympathy for Slavic enemies, Hungarian grain barons hoard food from starving Austrian cities, and nationalist agitators demand full independence."
 ww1_crisis.5.a:0 "Negotiate with the Diets and hold together!"
 ww1_crisis_aus_tooltip:0 "Austria-Hungary suffers severe recruitable population, stability, and combat penalties until the war is won, or Danubian relief decisions are enacted."

 ww1_crisis.6.t:0 "Slaughter of the Isonzo: Command Crisis"
 ww1_crisis.6.d:0 "Eleven bloody offensives on the karst plateau of the Isonzo River have yielded only tens of thousands of Italian graves and minimal ground. General Cadorna's brutal discipline and decimation tactics have destroyed morale. Political turmoil in Rome threatens to bring down the cabinet."
 ww1_crisis.6.a:0 "Reinforce river lines and hold Monte Grappa!"
 ww1_crisis_ita_tooltip:0 "Italy suffers severe war support, reinforcement rate, and factory output penalties until the war ends, or command reorganization decisions are taken."

 ww1_crisis.7.t:0 "Desert Breakdown: Levant Logistics"
 ww1_crisis.7.d:0 "Across the scorching sands of Sinai, Palestine, and Mesopotamia, Ottoman supply lines have ruptured. Camels die by the thousands, British-backed Arab insurgents sever the Hejaz railway, and Turkish garrisons are isolated without food, clean water, or medical supplies."
 ww1_crisis.7.a:0 "Fortify the heartland and rail passes!"
 ww1_crisis_tur_tooltip:0 "The Ottoman Empire suffers critical supply consumption, attrition, and reinforcement penalties until the Entente is beaten, or desert relief decisions are completed."

 ww1_crisis.8.t:0 "The Expeditionary Transport Bottleneck"
 ww1_crisis.8.d:0 "America has declared war, but our peacetime army is smaller than that of Belgium! Industry is struggling to switch to war footing, training camps lack basic uniforms and rifles, and Atlantic troop transport ships are desperately short. The Allies beg for immediate reinforcements, but the bottleneck is severe."
 ww1_crisis.8.a:0 "Requisition liners for troop transport!"
 ww1_crisis_usa_tooltip:0 "The United States suffers training time, factory conversion, and consumer goods penalties until major enemies capitulate, or War Production Board decisions are enacted."
# BALKAN & MINOR POWERS (SER, BUL, GRE, BEL, ROM)
 SER_balkan_defiance:0 "Balkan Defiance"
 SER_balkan_defiance_desc:0 "Hardened by centuries of struggle against imperial hegemony, Serbian soldiers fight with fierce devotion defending their homeland, ready to mobilize the nation at a moment's notice."
 BUL_prussia_of_the_balkans:0 "Prussia of the Balkans"
 BUL_prussia_of_the_balkans_desc:0 "Bulgaria possesses the most disciplined, rigorously trained, and thoroughly mobilized army in Southeastern Europe, capable of executing rapid mass mobilizations and hard-hitting offensives."
 GRE_hellenic_megali_ambition:0 "Hellenic Megali Ambition"
 GRE_hellenic_megali_ambition_desc:0 "Driven by the dream of liberating fellow Greeks across the Aegean and Balkans, the Hellenic Army maintains high morale and defensive solidarity."
 BEL_fortress_belgium:0 "Fortress Belgium and the Meuse Forts"
 BEL_fortress_belgium_desc:0 "Anchored on the state-of-the-art armored concrete fortresses of Liege and Namur, Belgian defenders and FN Herstal arms works form an unyielding bastion guarding the nation's neutrality."
 ROM_danubian_granary_and_oil:0 "Danubian Granary and Oilfields"
 ROM_danubian_granary_and_oil_desc:0 "Blessed with the abundant grain harvests of the Wallachian plains and the burgeoning oil refineries of Ploiesti, Romania sustains robust population growth and strategic fuel self-sufficiency."
