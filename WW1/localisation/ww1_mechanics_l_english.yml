l_english:
 # =======================================================
 # DECISION CATEGORIES
 # =======================================================
 ww1_tactical_war_powers:0 "Tactical War Powers"
 ww1_tactical_war_powers_desc:0 "Command staff doctrines, emergency war mobilization, and battlefield tactical deployments available during times of total war."
 ww1_crisis_management_ger:0 "Turnip Winter & Blockade Relief"
 ww1_crisis_management_ger_desc:0 "State economic interventions and synthetic production programs to combat the starvation and resource strangulation caused by the Allied blockade."
 ww1_crisis_management_eng:0 "Admiralty Convoy Escort & Rations"
 ww1_crisis_management_eng_desc:0 "Emergency maritime reorganization and domestic food rationing to withstand unrestricted submarine warfare."
 ww1_crisis_management_fra:0 "High Command Morale & Trenches"
 ww1_crisis_management_fra_desc:0 "Measures to restore soldiers' confidence, improve rotational trench leave, and overcome mutinies across the Western Front."
 ww1_crisis_management_sov:0 "Munitions Crisis & State Stability"
 ww1_crisis_management_sov_desc:0 "Administrative reorganization of railway logistics, domestic arms production, and imperial authority to quell social unrest."
 ww1_crisis_management_aus:0 "Dual Monarchy Danubian Order"
 ww1_crisis_management_aus_desc:0 "Compromises with regional diets and rationalization of the polyglot imperial armies to prevent internal imperial fracture."
 ww1_crisis_management_ita:0 "Isonzo Front Reconstruction"
 ww1_crisis_management_ita_desc:0 "Command shakeups, defensive redeployments along the Piave and Monte Grappa, and relief for frontline troops."
 ww1_crisis_management_tur:0 "Desert Logistics & Anatolian Lifeline"
 ww1_crisis_management_tur_desc:0 "Camelry supply trains, mountain fortification of strategic passes, and Ottoman defensive resilience."
 ww1_crisis_management_usa:0 "War Production Board Mobilization"
 ww1_crisis_management_usa_desc:0 "Federal coordination of heavy industry, standardization of armaments, and expeditionary troop transport."

 # =======================================================
 # GERMAN EMPIRE (GER)
 # =======================================================
 GER_grosser_generalstab:0 "Great Prussian General Staff"
 GER_grosser_generalstab_desc:0 "Heir to Scharnhorst, Gneisenau, and Moltke the Elder, the Grosser Generalstab represents the pinnacle of operational planning, staff work, and rapid railway mobilization in continental Europe."
 GER_krupp_chemical_conglomerates:0 "Krupp & Chemical Conglomerates"
 GER_krupp_chemical_conglomerates_desc:0 "The industrial titans of the Ruhr Valley—Krupp, BASF, Bayer, and Thyssen—provide the German Empire with unparalleled metallurgy, artillery foundries, and chemical syntheses."
 GER_tirpitz_naval_ambition:0 "Tirpitz Fleet Expansion"
 GER_tirpitz_naval_ambition_desc:0 "Grand Admiral von Tirpitz's 'Risk Theory' has built the Kaiserliche Marine into the second largest battlefleet on Earth, designed to challenge British dominance in the North Sea."
 GER_encirclement_paranoia:0 "Encirclement Anxiety (Einkreisung)"
 GER_encirclement_paranoia_desc:0 "Surrounded by the Franco-Russian alliance and British sea power, the Reich is locked in perpetual existential anxiety, driving intense militarization and preventive war doctrines."
 GER_burgfrieden_social_peace:0 "Burgfrieden Social Truce"
 GER_burgfrieden_social_peace_desc:0 "At the outbreak of national struggle, Kaiser Wilhelm II declared he 'no longer recognizes parties, only Germans.' All political strikes and partisan strife have been suspended."

 GER_turnip_winter_crisis_3:0 "Turnip Winter & Starvation III"
 GER_turnip_winter_crisis_3_desc:0 "The Allied distant blockade has severed food and fertilizer imports. The civilian population is reduced to eating turnips, and strikes threaten war industries."
 GER_turnip_winter_crisis_2:0 "Turnip Winter & Starvation II"
 GER_turnip_winter_crisis_2_desc:0 "Initial rationing programs have stabilized grain reserves, but food lines remain long and shortages persist."
 GER_turnip_winter_crisis_1:0 "Turnip Winter & Starvation I"
 GER_turnip_winter_crisis_1_desc:0 "Synthetic nitrogen plants and strict state rationing have largely contained the food crisis."
 GER_hindenburg_program_victory:0 "Hindenburg Total War Program"
 GER_hindenburg_program_victory_desc:0 "By reorganizing all civilian labor into heavy armaments production and overcoming the blockade, Germany achieves total industrial mastery."

 GER_relief_step_1:0 "Rationing Office & Synthetic Ammonia"
 GER_relief_step_1_desc:0 "Establish the Imperial Food Office (Kriegsernährungsamt) and finance the Haber-Bosch process to produce synthetic nitrates for explosives and agriculture."
 GER_relief_step_2:0 "War Raw Materials Section (KRA)"
 GER_relief_step_2_desc:0 "Walther Rathenau's War Raw Materials Section coordinates private industry cartels, requisitioning stocks of brass, rubber, and iron."
 GER_relief_step_3:0 "The Hindenburg Mobilization Act"
 GER_relief_step_3_desc:0 "Mandatory industrial labor for all males aged 16 to 60, doubling weapons output and breaking the domestic economic crisis."

 # =======================================================
 # UNITED KINGDOM (ENG)
 # =======================================================
 ENG_splendid_isolation_legacy:0 "Legacy of Splendid Isolation"
 ENG_splendid_isolation_legacy_desc:0 "For decades, Britain preserved the continental balance of power from across the Channel. While diplomacy was peerless, maintaining a large standing conscript army was traditionally rejected."
 ENG_pax_britannica_dreadnoughts:0 "Pax Britannica & Royal Navy"
 ENG_pax_britannica_dreadnoughts_desc:0 "Rule, Britannia! The Royal Navy commands the global sea lanes, fortified by superior battleship tonnage, dockyards across all oceans, and the Two-Power Standard doctrine."
 ENG_imperial_cable_and_trade:0 "All-Red Line & Global Commerce"
 ENG_imperial_cable_and_trade_desc:0 "Undersea telegraph cables linking London to every dominion and colony ensure instant worldwide intelligence, merchant shipping dominance, and vast colonial resource inflows."
 ENG_continental_commitment_hesitation:0 "Continental Commitment Hesitation"
 ENG_continental_commitment_hesitation_desc:0 "Parliament and the public remain cautious about sending mass British expeditionary forces to bleed in European land wars, constraining army expansion during peacetime."
 ENG_white_feather_social_pressure:0 "Volunteer Spirit & Pals Battalions"
 ENG_white_feather_social_pressure_desc:0 "Civic societies and patriotic organizations exert overwhelming social pressure to enlist, filling volunteer 'Pals Battalions' with eager recruits from town halls, universities, and factories."

 ENG_submarine_blockade_crisis_3:0 "Submarine Blockade & Convoy Famine III"
 ENG_submarine_blockade_crisis_3_desc:0 "German U-boats are sinking hundreds of merchantmen every month. Wheat and fuel reserves have shrunk to mere weeks of supply."
 ENG_submarine_blockade_crisis_2:0 "Submarine Blockade & Convoy Famine II"
 ENG_submarine_blockade_crisis_2_desc:0 "Armed merchant cruisers and basic defensive routing have slowed losses, though shipping strains remain intense."
 ENG_submarine_blockade_crisis_1:0 "Submarine Blockade & Convoy Famine I"
 ENG_submarine_blockade_crisis_1_desc:0 "The introduction of the convoy system and depth-charge escorts has curbed U-boat successes."
 ENG_arsenal_of_the_empire:0 "Arsenal of the British Empire"
 ENG_arsenal_of_the_empire_desc:0 "Full industrial mobilization of the Home Isles alongside vast Canadian, Australian, Indian, and South African manufacturing triumphs over all maritime threats."

 ENG_relief_step_1:0 "Admiralty Convoy Reorganization"
 ENG_relief_step_1_desc:0 "Group merchant shipping into tightly escorted naval convoys protected by destroyers and hydrophones."
 ENG_relief_step_2:0 "Ministry of Munitions Rationalization"
 ENG_relief_step_2_desc:0 "David Lloyd George's Ministry of Munitions standardizes shell production and mobilizes millions of women into weapons factories."
 ENG_relief_step_3:0 "Imperial War Cabinet Coordination"
 ENG_relief_step_3_desc:0 "Integrate dominion prime ministers directly into wartime governance, unlocking limitless empire-wide supplies and food."

 # =======================================================
 # FRANCE (FRA)
 # =======================================================
 FRA_revanchism_alsace_lorraine:0 "Alsace-Lorraine Revanchism"
 FRA_revanchism_alsace_lorraine_desc:0 "The bitter loss of Alsace-Moselle in 1871 remains an open national wound. Statues in Paris draped in black mourning await the day the Tricolour is raised once again upon the Rhine."
 FRA_elan_vital_offensive:0 "Doctrine of Élan Vital"
 FRA_elan_vital_offensive_desc:0 "French military doctrine preaches the spiritual power of relentless offensive spirit (l'offensive à outrance). Soldiers taught to attack without hesitation inspire fear, yet pay a heavy price against modern firepower."
 FRA_canon_75mm_reign:0 "Reign of the Canon de 75mm"
 FRA_canon_75mm_reign_desc:0 "The Canon de 75 modèle 1897, with its revolutionary hydro-pneumatic recoil mechanism, can fire up to 15 aimed shells per minute, forming the backbone of French field artillery."
 FRA_low_birthrate_crisis:0 "Demographic Stagnation"
 FRA_low_birthrate_crisis_desc:0 "A century of low birth rates means France's male conscription pool is half that of Germany's, necessitating the prolonged Three-Year Service Law to muster sufficient standing manpower."
 FRA_sacred_union_republic:0 "L'Union Sacrée"
 FRA_sacred_union_republic_desc:0 "Republicans, royalists, socialists, and Catholics have set aside deep domestic hatreds to form a sacred union in defense of the French Republic and national soil."

 FRA_trench_mutiny_crisis_3:0 "Trench Weariness & Mutinies III"
 FRA_trench_mutiny_crisis_3_desc:0 "Disastrous frontal charges have pushed the Poilus beyond endurance. Refusals of suicidal orders and front-line disobedience spread across whole divisions."
 FRA_trench_mutiny_crisis_2:0 "Trench Weariness & Mutinies II"
 FRA_trench_mutiny_crisis_2_desc:0 "Clemenceau's political leadership and promises of improved living standards have begun to restore soldier discipline."
 FRA_trench_mutiny_crisis_1:0 "Trench Weariness & Mutinies I"
 FRA_trench_mutiny_crisis_1_desc:0 "Rest camps, regular home leave, and defensive doctrine have restored trust between the ranks and high command."
 FRA_union_sacree_victory:0 "Triumphant Union Sacrée"
 FRA_union_sacree_victory_desc:0 "France stands unified and unbroken. The sacrifices of Verdun and the Marne culminate in total victory and the recovery of lost national soil."

 FRA_relief_step_1:0 "Pétain's Frontline Reforms"
 FRA_relief_step_1_desc:0 "End bloody frontal assaults, increase hot canteen rations, guarantee regular rotational leave, and restore troop trust."
 FRA_relief_step_2:0 "Heavy Artillery & Tank Priorities"
 FRA_relief_step_2_desc:0 "Convert civilian automotive workshops into Renault FT-17 light tank assembly lines to let steel bleed instead of men."
 FRA_relief_step_3:0 "Clemenceau's Total Mobilization"
 FRA_relief_step_3_desc:0 "'Je fais la guerre!' Georges Clemenceau eliminates domestic defeatism and drives the French nation to decisive victory."

 # =======================================================
 # RUSSIAN EMPIRE (SOV)
 # =======================================================
 SOV_tsarist_autocracy:0 "Tsarist Autocracy"
 SOV_tsarist_autocracy_desc:0 "Nicholas II rules by divine right as Emperor and Autocrat of All the Russias. While executive authority is absolute, the bureaucratic machinery and imperial court are rigid and prone to intrigue."
 SOV_the_steamroller:0 "The Russian Steamroller"
 SOV_the_steamroller_desc:0 "With an empire stretching across one-sixth of the globe, the Russian peasantry offers an almost limitless reservoir of sturdy, resilient soldiers ready to march under the Imperial Double-Headed Eagle."
 SOV_rifle_famine_scar:0 "Shell & Rifle Famine"
 SOV_rifle_famine_scar_desc:0 "Russian heavy industry cannot match the voracious appetite of modern warfare. In battle, men are sent to the front unarmed, told to pick up rifles from fallen comrades."
 SOV_broad_gauge_vastness:0 "Broad-Gauge Vastness"
 SOV_broad_gauge_vastness_desc:0 "Russia's unique railway broad gauge and vast distances impede enemy supply lines and strategic depth, making invasion an agonizing ordeal for foreign armies."
 SOV_pan_slavic_protector:0 "Protector of the Slavs"
 SOV_pan_slavic_protector_desc:0 "Holy Russia regards herself as the spiritual and military guardian of the Balkan Orthodox and Slavic peoples, bound by honor and faith to intervene when Slavic brethren are threatened."

 SOV_rifle_famine_crisis_3:0 "Munitions Famine & Strikes III"
 SOV_rifle_famine_crisis_3_desc:0 "Frontline artillery is limited to a handful of shells per day, grain transport has broken down, and food riots shake Petrograd."
 SOV_rifle_famine_crisis_2:0 "Munitions Famine & Strikes II"
 SOV_rifle_famine_crisis_2_desc:0 "War Industry Committees are expanding domestic shell production, but railway bottlenecks still choke shipments."
 SOV_rifle_famine_crisis_1:0 "Munitions Famine & Strikes I"
 SOV_rifle_famine_crisis_1_desc:0 "Allied imports arriving through Archangelsk and Vladivostok have alleviated the worst shortages."
 SOV_unbreakable_union_victory:0 "Indomitable Imperial Mobilization"
 SOV_unbreakable_union_victory_desc:0 "By overcoming logistical collapse and modernizing imperial industry, Holy Russia stands as an unbeatable continental titan."

 SOV_relief_step_1:0 "Special Council for State Defense"
 SOV_relief_step_1_desc:0 "Coordinate private industrialists, the Duma, and the military staff to streamline shell and rifle deliveries."
 SOV_relief_step_2:0 "Trans-Siberian & Murmansk Rail Overhaul"
 SOV_relief_step_2_desc:0 "Expand double-tracking and rush construction of the Arctic Murmansk railway to guarantee uninterrupted Allied supply inflows."
 SOV_relief_step_3:0 "Imperial War Economy Directive"
 SOV_relief_step_3_desc:0 "Subordinate all grain distribution and heavy industry directly to the military governorates, crushing strikes and sustaining the front."

 # =======================================================
 # AUSTRIA-HUNGARY (AUS)
 # =======================================================
 AUS_dual_monarchy_compromise:0 "Austro-Hungarian Dual Monarchy"
 AUS_dual_monarchy_compromise_desc:0 "The Ausgleich of 1867 divides the realm into Austrian Cisleithania and Hungarian Transleithania. Every budgetary and military decision requires tortuous parliamentary haggling between Vienna and Budapest."
 AUS_tower_of_babel_army:0 "Army of a Hundred Tongues"
 AUS_tower_of_babel_army_desc:0 "The Imperial and Royal Army comprises German, Hungarian, Czech, Polish, Croat, Slovene, Romanian, Ukrainian, and Italian troops, leading to serious communication and command frictions."
 AUS_skoda_siege_arsenals:0 "Škoda Heavy Siege Arsenals"
 AUS_skoda_siege_arsenals_desc:0 "The Škoda Works in Pilsen produce the finest super-heavy siege howitzers in the world, including the 30.5 cm Mörser M.11 capable of pulverizing concrete fortifications."
 AUS_alpine_carpathian_bastion:0 "Alpine-Carpathian Bastion"
 AUS_alpine_carpathian_bastion_desc:0 "From the jagged peaks of the Dolomites and Tyrolean Alps to the frozen passes of the Carpathians, Habsburg forces possess unmatched mountain defense expertise."
 AUS_balkan_destiny:0 "Balkan Imperial Ambition"
 AUS_balkan_destiny_desc:0 "Vienna views the western Balkans as its natural sphere of influence. Any spark in Bosnia or Serbia commands immediate imperial mobilization."

 AUS_nationalities_fracture_crisis_3:0 "Fracture of the Nationalities III"
 AUS_nationalities_fracture_crisis_3_desc:0 "Desertions along nationality lines increase, food supplies in Vienna hit starvation levels, and Hungarian politicians refuse grain sharing."
 AUS_nationalities_fracture_crisis_2:0 "Fracture of the Nationalities II"
 AUS_nationalities_fracture_crisis_2_desc:0 "Emergency food distribution and concessions to regional leaders have stemmed immediate rebellions."
 AUS_nationalities_fracture_crisis_1:0 "Fracture of the Nationalities I"
 AUS_nationalities_fracture_crisis_1_desc:0 "Imperial unity has stabilized under centralized Austro-Hungarian military administration."
 AUS_danubian_triumph:0 "Danubian Imperial Triumph"
 AUS_danubian_triumph_desc:0 "Against all internal division and external foes, the Habsburg Empire has triumphed, securing its undisputed primacy over Central and Southeastern Europe."

 AUS_relief_step_1:0 "Joint Food Distribution Board"
 AUS_relief_step_1_desc:0 "Enforce a unified Austro-Hungarian grain pool under imperial decree to prevent urban starvation in Vienna and Prague."
 AUS_relief_step_2:0 "Linguistic Standardization of Command"
 AUS_relief_step_2_desc:0 "Enforce bilingual command manuals and pair multi-ethnic regiments with veteran officer cadres to eliminate battlefield confusion."
 AUS_relief_step_3:0 "Federal Imperial Charter"
 AUS_relief_step_3_desc:0 "Promise equal federal autonomy for Slavs and Hungarians under the Habsburg crown, consolidating total loyalty to the Emperor."

 # =======================================================
 # ITALY (ITA)
 # =======================================================
 ITA_terre_irredente_dream:0 "Italia Irredenta"
 ITA_terre_irredente_dream_desc:0 "Trentino, Trieste, and the Dalmatian coast remain under Austrian rule. The passionate cry for 'unredeemed lands' drives Italian foreign policy and public fervor."
 ITA_alpini_tradition:0 "Alpini Mountain Elites"
 ITA_alpini_tradition_desc:0 "Formed in 1872, the Alpini are the world's oldest active mountain infantry. Recruited from alpine valleys, they are masters of high-altitude rock and ice combat."
 ITA_coal_iron_scarcity:0 "Coal & Iron Scarcity"
 ITA_coal_iron_scarcity_desc:0 "Italy possesses almost no domestic coking coal or heavy iron deposits, leaving her blast furnaces and naval yards heavily dependent on maritime imports."
 ITA_southern_question_gap:0 "The Southern Question"
 ITA_southern_question_gap_desc:0 "A profound economic divide separates the industrialized north from the impoverished agrarian south, creating domestic social tensions and uneven industrial development."
 ITA_sacro_egoismo_policy:0 "Sacro Egoismo"
 ITA_sacro_egoismo_policy_desc:0 "Foreign Minister Sonnino declared that Italy's foreign diplomacy must be guided exclusively by 'sacred egoism,' unswervingly seeking maximum territorial gain for minimal sacrifice."

 ITA_isonzo_attrition_crisis_3:0 "Isonzo Slaughter & Morale Crisis III"
 ITA_isonzo_attrition_crisis_3_desc:0 "Repeated bloody stalemates on the Karst and Cadorna's brutal discipline have pushed the Royal Army to the brink of collapse."
 ITA_isonzo_attrition_crisis_2:0 "Isonzo Slaughter & Morale Crisis II"
 ITA_isonzo_attrition_crisis_2_desc:0 "Defensive reorganization behind river lines and dismissal of incompetent commanders begins restoring army confidence."
 ITA_isonzo_attrition_crisis_1:0 "Isonzo Slaughter & Morale Crisis I"
 ITA_isonzo_attrition_crisis_1_desc:0 "Allied artillery support and improved rations have stabilized Italian mountain positions."
 ITA_vittorio_veneto_triumph:0 "Vittorio Veneto Triumph"
 ITA_vittorio_veneto_triumph_desc:0 "The Italian armed forces shatter the enemy lines, liberating Trento and Trieste and completing the Risorgimento in glory."

 ITA_relief_step_1:0 "Dismissal of General Cadorna"
 ITA_relief_step_1_desc:0 "Appoint General Diaz to command: abolish decimation punishments, improve medical care, and treat frontline troops with human dignity."
 ITA_relief_step_2:0 "Ansaldo Heavy Industrial Expansion"
 ITA_relief_step_2_desc:0 "Subsidize the Ansaldo and Fiat engineering plants in Turin and Genoa to overcome chronic shortages of artillery and motor transport."
 ITA_relief_step_3:0 "National Liberation Proclamation"
 ITA_relief_step_3_desc:0 "Rally every Italian worker and peasant behind the sacred defense of the Piave, ensuring decisive victory on the front."

 # =======================================================
 # OTTOMAN EMPIRE (TUR)
 # =======================================================
 TUR_straits_fortress_cannons:0 "Straits Fortress Bastion"
 TUR_straits_fortress_cannons_desc:0 "The Dardanelles and Bosphorus are fortified with heavy coastal batteries, searchlights, and dense minefields, turning the Turkish Straits into an impenetrable maritime chokepoint."
 TUR_sick_man_debt:0 "Ottoman Public Debt Administration"
 TUR_sick_man_debt_desc:0 "Foreign creditors control key Ottoman tax revenues, monopolies, and custom duties, severely restricting the Sultan's treasury and industrial reinvestment."
 TUR_mehmetcik_tenacity:0 "Tenacity of the Mehmetçik"
 TUR_mehmetcik_tenacity_desc:0 "The Turkish soldier (Mehmetçik) is renowned for stoic endurance, religious devotion, and ferocious defensive resilience in trenches, even when starved of supplies and boots."
 TUR_three_pashas_dictatorship:0 "Rule of the Three Pashas (CUP)"
 TUR_three_pashas_dictatorship_desc:0 "Enver, Talaat, and Djemal Pasha hold authoritarian grip over the Committee of Union and Progress, pursuing rapid militarization and pan-Turkic ambitions."
 TUR_caliphate_global_banner:0 "Banner of the Ottoman Caliphate"
 TUR_caliphate_global_banner_desc:0 "The Ottoman Sultan holds the title of Caliph of Islam. When war threatens, the declaration of holy struggle resonates across Muslim populations across Asia and Africa."

 TUR_desert_supply_collapse_crisis_3:0 "Desert Logistics Breakdown III"
 TUR_desert_supply_collapse_crisis_3_desc:0 "Stretching from the Taurus Mountains to Medina, Ottoman supply caravans are exhausted. Desert garrisons suffer thirst, sickness, and guerrilla attacks."
 TUR_desert_supply_collapse_crisis_2:0 "Desert Logistics Breakdown II"
 TUR_desert_supply_collapse_crisis_2_desc:0 "German military advisors and railway engineers are restoring standard logistics along key rail junctions."
 TUR_desert_supply_collapse_crisis_1:0 "Desert Logistics Breakdown I"
 TUR_desert_supply_collapse_crisis_1_desc:0 "Anatolian depots and camelry supply lines are securely established, stabilizing frontline defenses."
 TUR_anatolian_sovereignty_victory:0 "Sovereignty of Anatolia Secured"
 TUR_anatolian_sovereignty_victory_desc:0 "Defying all predictions of collapse, the Ottoman Empire smashes invasion forces and guarantees the eternal sovereignty of the Anatolian heartland."

 TUR_relief_step_1:0 "Taurus Mountain Tunnel Construction"
 TUR_relief_step_1_desc:0 "Blast gaps through the rugged Taurus Mountains to link the Berlin-Baghdad railway directly to Syrian and Mesopotamian fronts."
 TUR_relief_step_2:0 "Bedouin Camelry Reorganization"
 TUR_relief_step_2_desc:0 "Mobilize traditional nomad camel supply caravans to bypass severed railways and supply distant desert redoubts."
 TUR_relief_step_3:0 "Anatolian National Citadel Order"
 TUR_relief_step_3_desc:0 "Concentrate all national grain, munitions, and veteran divisions in the Anatolian interior, building an unbreakable fortress nation."

 # =======================================================
 # UNITED STATES OF AMERICA (USA)
 # =======================================================
 USA_fordist_industrial_miracle:0 "Fordist Mass Production Miracle"
 USA_fordist_industrial_miracle_desc:0 "Standardized assembly lines, interchangeable parts, and boundless steel mills grant the United States the largest industrial production capacity in human history."
 USA_monroe_isolationism:0 "Monroe Doctrine & Isolationism"
 USA_monroe_isolationism_desc:0 "Following George Washington's farewell advice against 'entangling foreign alliances,' the American public vehemently resists participating in bloody European dynastic wars."
 USA_wall_street_credit:0 "Wall Street Global Credit Engine"
 USA_wall_street_credit_desc:0 "New York has become the financial capital of the world. Belligerent powers take billions in loans from American banks, financing massive purchase of supplies and raw materials."
 USA_great_white_fleet_heritage:0 "Heritage of the Great White Fleet"
 USA_great_white_fleet_heritage_desc:0 "The legacy of Theodore Roosevelt's Great White Fleet ensures a robust naval tradition and expanding modern battlefleet to protect Atlantic and Pacific sea lanes."
 USA_firearms_pioneer_culture:0 "Pioneer Marksmanship Culture"
 USA_firearms_pioneer_culture_desc:0 "A widespread civilian hunting tradition and iconic arms manufacturers—Winchester, Colt, Browning, Remington—yield infantrymen skilled with rifles and trench shotguns."

 USA_mobilization_bottleneck_crisis_3:0 "Expeditionary Bottleneck III"
 USA_mobilization_bottleneck_crisis_3_desc:0 "America's small peacetime standing army and lack of ocean transports create severe delays in deploying soldiers across the Atlantic."
 USA_mobilization_bottleneck_crisis_2:0 "Expeditionary Bottleneck II"
 USA_mobilization_bottleneck_crisis_2_desc:0 "Emergency shipyards and cantonment camps are beginning to turn out thousands of trained doughboys and liberty transports."
 USA_mobilization_bottleneck_crisis_1:0 "Expeditionary Bottleneck I"
 USA_mobilization_bottleneck_crisis_1_desc:0 "The flow of American men and materiel across the ocean is now smooth, steady, and unstoppable."
 USA_arsenal_of_democracy_unleashed:0 "Arsenal of Democracy Unleashed"
 USA_arsenal_of_democracy_unleashed_desc:0 "The total economic and military fury of the United States is fully realized, dictating terms across all continents and oceans."

 USA_relief_step_1:0 "Emergency Fleet Corporation"
 USA_relief_step_1_desc:0 "Construct pre-fabricated steel merchant ships (Hog Islanders) in record time to bridge the Atlantic supply gap."
 USA_relief_step_2:0 "Standardized Armaments Board"
 USA_relief_step_2_desc:0 "Standardize production on the M1917 Enfield, Browning Automatic Rifle, and Liberty aircraft engines to eliminate logistical chaos."
 USA_relief_step_3:0 "The American Expeditionary Force"
 USA_relief_step_3_desc:0 "General Pershing's independent American Army deploys en masse, carrying the Stars and Stripes to absolute victory."

 # =======================================================
 # SHOCK SUBUNITS
 # =======================================================
 ottoman_ghazi_militia:0 "Ghazi Desert Raiders"
 ottoman_ghazi_militia_desc:0 "Irregular Bedouin and Ottoman desert horsemen adept at flanking enemy supply lines across arid wastes."
 german_stosstruppen:0 "Stosstruppen (Stormtroopers)"
 german_stosstruppen_desc:0 "Elite shock infiltration troops equipped with submachine guns, flamethrowers, and hand grenades to bypass strongpoints and assault trench systems."
 french_75mm_rapid_brigade:0 "Rapid 75mm Artillery Brigade"
 french_75mm_rapid_brigade_desc:0 "Concentrated batteries of rapid-fire 75mm guns delivering devastating rolling barrages right ahead of advancing infantry."
 russian_opolcheniye:0 "Opolcheniye Mass Levies"
 russian_opolcheniye_desc:0 "Peasant militia raised in haste to plug breaches along thousands of miles of Eastern Front with sheer mass and fortitude."
 austrian_gebirgsjager:0 "Imperial Gebirgsjäger"
 austrian_gebirgsjager_desc:0 "Specialized mountain troops trained to fight in sub-zero alpine blizzards and fortified dolomite ridges."
 italian_arditi_shock:0 "Arditi Assault Battalions"
 italian_arditi_shock_desc:0 "Daredevil Italian shock troops ('The Daring Ones') armed with trench daggers, body armor, and Thevenot grenades who lead attacks with fearless fervor."
 anzac_corps:0 "ANZAC Corps"
 anzac_corps_desc:0 "Australian and New Zealand Army Corps volunteers celebrated for rugged physical endurance, high morale, and amphibious tenacity."
 american_doughboys:0 "American Doughboys"
 american_doughboys_desc:0 "Fresh, robust American expeditionary divisions armed with Springfield rifles, Browning automatics, and Winchester trench shotguns."

 # =======================================================
 # TACTICAL DECISIONS & TEMPORARY COMBAT SPIRITS
 # =======================================================
 TUR_nusret_minefield_defense:0 "Deploy Nusret Strait Minefields"
 TUR_nusret_minefield_defense_desc:0 "Lay clandestine naval mine lines across the narrows of the Dardanelles to sink approaching enemy dreadnoughts."
 TUR_kemal_fanatic_order:0 "Mustafa Kemal: 'I Order You to Die!'"
 TUR_kemal_fanatic_order_desc:0 "Lieutenant Colonel Mustafa Kemal rallies the 57th Infantry Regiment at Chunuk Bair: 'I do not order you to fight, I order you to die. In the time it takes us to die, other troops and commanders will come and take our place!'"
 kemal_fanatic_defence_idea:0 "Fanatic Trench Defense"
 kemal_fanatic_defence_idea_desc:0 "Ottoman forces hold their trenches with uncompromising suicidal resolve."

 GER_chemical_gas_assault:0 "Release Chlorine Gas Canisters"
 GER_chemical_gas_assault_desc:0 "Open thousands of pressurized poison gas cylinders along the enemy frontline to asphyxiate defending garrisons."
 chemical_gas_disruption:0 "Gas Disruption & Choking Panic"
 chemical_gas_disruption_desc:0 "Troops are choking, disoriented, and scrambling for masks, causing mass disorganization across the front."
 GER_activate_unrestricted_u_boats:0 "Declare Unrestricted Submarine Warfare"
 GER_activate_unrestricted_u_boats_desc:0 "Order all Kaiserliche Marine U-boats to sink any merchant ship sailing for British ports on sight."
 GER_deactivate_unrestricted_u_boats:0 "Suspend Unrestricted Submarine Warfare"
 GER_deactivate_unrestricted_u_boats_desc:0 "Halt unrestricted sinkings to ease diplomatic pressure with neutral maritime powers."

 ENG_landships_mark_i_push:0 "Deploy Mark I Landships at Flers"
 ENG_landships_mark_i_push_desc:0 "Unleash Britain's revolutionary armored tracked landships to crush barbed wire and roll over enemy machine-gun nests."
 landships_breakthrough_boost:0 "Landships Armored Breakthrough"
 landships_breakthrough_boost_desc:0 "Armored fighting vehicles create massive shock and breakthrough potential against entrenched positions."
 ENG_call_dominion_anzac_levies:0 "Mobilize Dominion ANZAC Levies"
 ENG_call_dominion_anzac_levies_desc:0 "Issue an urgent appeal to Canberra and Wellington to send volunteer divisions to the Mediterranean and Western Front."

 FRA_activate_voie_sacree:0 "Open La Voie Sacrée Supply Highway"
 FRA_activate_voie_sacree_desc:0 "Organize a non-stop day-and-night convoy of thousands of trucks along the Bar-le-Duc to Verdun road to supply the fortress."
 voie_sacree_resilience_idea:0 "La Voie Sacrée Logistics"
 voie_sacree_resilience_idea_desc:0 "Relentless logistics throughput keeps frontline artillery fed with endless shells and reinforcements."
 FRA_messines_tunnel_explosion:0 "Detonate Underground Tunnel Mines"
 FRA_messines_tunnel_explosion_desc:0 "Sappers tunnel deep beneath enemy trench bastions and detonate hundreds of tons of high explosives in a single thunderous roar."

 SOV_launch_brusilov_offensive:0 "Launch General Brusilov's Offensive"
 SOV_launch_brusilov_offensive_desc:0 "Execute General Alexei Brusilov's revolutionary shock doctrine: simultaneous surprise barrages across a 300-mile front with no prior warning."
 brusilov_offensive_shock_idea:0 "Brusilov Offensive Shock"
 brusilov_offensive_shock_idea_desc:0 "Russian armies advance along multiple axes, smashing enemy trenches and capturing vast amounts of equipment."

 AUS_skoda_siege_barrage:0 "Deploy Škoda 30.5cm Siege Batteries"
 AUS_skoda_siege_barrage_desc:0 "Bring up Škoda 305mm heavy howitzers to blast mountain fortresses and enemy fortifications into rubble."
 skoda_siege_bombardment_idea:0 "Škoda Siege Bombardment"
 skoda_siege_bombardment_idea_desc:0 "Heavy artillery barrages pulverize enemy fortifications and entrenchments."

 ITA_arditi_night_infiltration:0 "Launch Arditi Night Trench Raid"
 ITA_arditi_night_infiltration_desc:0 "Send dagger-wielding Arditi assault teams into enemy forward trenches under cover of darkness."
 arditi_infiltration_shock_idea:0 "Arditi Infiltration Shock"
 arditi_infiltration_shock_idea_desc:0 "Terror in enemy frontline trenches as hand grenades and combat knives clear machine-gun positions."

 USA_winchester_trench_sweep:0 "Issue Winchester M1897 Trench Guns"
 USA_winchester_trench_sweep_desc:0 "Equip American doughboys with 12-gauge slam-fire pump-action shotguns, devastating in close-quarters trench combat."
 trench_sweeper_shotgun_idea:0 "Trench Sweeper Shotguns"
 trench_sweeper_shotgun_idea_desc:0 "Devastating close-range firepower clears enemy trenches in seconds."

