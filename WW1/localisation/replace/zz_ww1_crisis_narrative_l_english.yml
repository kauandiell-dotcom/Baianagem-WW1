l_english:
 ww1_crisis.1.t:0 "The Turnip Winter: Allied Blockade"
 ww1_crisis.1.d:0 "Transport disruption or sustained political and casualty pressure is damaging civilian supply. The episode starts at a mild level and worsens only if pressure persists."
 ww1_crisis.2.t:0 "The Submarine Menace: Convoys in Peril"
 ww1_crisis.2.d:0 "Convoy pressure or sustained military and domestic strain is threatening the war economy. Protect routes, preserve forces and address the causes; relief projects require industrial time."
 ww1_crisis.3.t:0 "Trench Weariness: Mutinies of the Poilus"
 ww1_crisis.3.d:0 "Sustained losses and weakened support have damaged confidence in the war effort. The first warning is limited; further deterioration depends on conditions, while sustained improvement brings recovery."
 ww1_crisis.4.t:0 "Munitions Famine: Petrograd Strikes"
 ww1_crisis.4.d:0 "The deployed infantry equipment ratio is [?ww1_infantry_equipment_ratio|%0]. Sustained shortages and losses, or a severe political crisis, have strained the mobilisation system. Repair supply and restore confidence; this episode is not a scheduled defeat."
 ww1_crisis.5.t:0 "Austria-Hungary: Imperial Cohesion under Strain"
 ww1_crisis.5.d:0 "Losses, political strain and equipment shortages can undermine the joint war effort. Recovery depends on improving the underlying position rather than purchasing a permanent victory spirit."
 ww1_crisis.6.t:0 "Slaughter of the Isonzo: Command Crisis"
 ww1_crisis.6.d:0 "Losses and military reverses are testing domestic confidence. The warning can worsen or subside with the actual course of the war; Caporetto is not forced by a date."
 ww1_crisis.7.t:0 "Desert Breakdown: Levant Logistics"
 ww1_crisis.7.d:0 "Territorial reverses and sustained equipment shortages are straining distant campaigns. Preserve forces, improve transport and equipment, and use relief projects while addressing the underlying cause."
 ww1_crisis.8.t:0 "The Expeditionary Transport Bottleneck"
 ww1_crisis.8.d:0 "Losses, weakened domestic confidence or dangerous transport routes are straining the expeditionary effort. Mobilisation and delivery must keep pace with the commitments already assumed."
 ww1_crisis_ger_tooltip:0 "The crisis starts mild. Sustained material or political pressure can worsen it; six weeks of improved conditions reduce one tier. Relief projects reserve two civilian factories for 90 days."
