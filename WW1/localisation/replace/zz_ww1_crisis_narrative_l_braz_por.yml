l_braz_por:
 ww1_crisis.1.t:0 "Alemanha: abastecimento civil sob pressão"
 ww1_crisis.1.d:0 "A interrupção dos transportes ou a pressão persistente das perdas e da situação política prejudica o abastecimento civil. A crise começa leve e piora somente se suas causas persistirem."
 ww1_crisis.2.t:0 "Reino Unido: rotas marítimas sob pressão"
 ww1_crisis.2.d:0 "A pressão sobre os comboios ou o desgaste militar e interno ameaça a economia de guerra. Proteja as rotas, preserve as forças e trate as causas; os projetos de recuperação exigem tempo industrial."
 ww1_crisis.3.t:0 "França: o exército e a frente interna"
 ww1_crisis.3.d:0 "As perdas persistentes e a redução do apoio prejudicam a confiança no esforço de guerra. O primeiro alerta é limitado; o agravamento depende das condições e a melhoria sustentada permite a recuperação."
 ww1_crisis.4.t:0 "Rússia: equipamento e legitimidade"
 ww1_crisis.4.d:0 "A proporção de equipamento disponível na infantaria é [?ww1_infantry_equipment_ratio|%0]. A escassez persistente e as perdas, ou uma crise política grave, pressionam a mobilização. Repare o abastecimento e recupere a confiança; esta crise não determina uma derrota por calendário."
 ww1_crisis.5.t:0 "Áustria-Hungria: coesão imperial sob pressão"
 ww1_crisis.5.d:0 "As perdas, o desgaste político e a escassez de equipamento podem enfraquecer o esforço comum. A recuperação depende da melhoria das condições."
 ww1_crisis.6.t:0 "Itália: desgaste e confiança"
 ww1_crisis.6.d:0 "As perdas e os reveses militares colocam a confiança interna à prova. O alerta pode piorar ou recuar conforme a guerra; Caporetto não é imposto por uma data."
 ww1_crisis.7.t:0 "Império Otomano: os limites das campanhas distantes"
 ww1_crisis.7.d:0 "Os reveses territoriais e a escassez persistente de equipamento pressionam as campanhas distantes. Preserve as forças, melhore os transportes e o equipamento e execute projetos de recuperação enquanto trata a causa."
 ww1_crisis.8.t:0 "Estados Unidos: uma guerra expedicionária sob pressão"
 ww1_crisis.8.d:0 "As perdas, a redução da confiança interna ou o perigo nas rotas de transporte pressionam o esforço expedicionário. A mobilização e as entregas precisam acompanhar os compromissos assumidos."
 ww1_crisis_ger_tooltip:0 "A crise começa leve. A pressão material ou política persistente pode agravá-la; seis semanas de condições melhores reduzem um estágio. Os projetos reservam duas fábricas civis por 90 dias."
