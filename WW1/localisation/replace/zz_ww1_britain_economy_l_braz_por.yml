l_braz_por:
 ENG_ww1_industrial_district_surveys_desc:0 "Inspetores percorrem Midlands, Clyde, Tyne e Lancashire para listar oficinas, estaleiros e minas. Ganha 15 de poder político e reduz dívida em 1; as regiões industriais ficam prontas para contratos."
 ENG_ww1_midlands_machine_shops_desc:0 "As oficinas de máquinas-ferramenta de Birmingham e Coventry passam a trabalhar com contratos do Estado. Abre uma vaga de construção e enfileira um complexo industrial nas Midlands Ocidentais; a dívida sobe 1."
 ENG_ww1_clyde_shipyard_contracts_desc:0 "Os estaleiros do Clyde recebem encomendas de casco e máquinas. Abre uma vaga e enfileira um estaleiro em Strathclyde; a dívida sobe 1."
 ENG_ww1_tyne_steel_and_ordnance_desc:0 "Armstrong e Vickers ampliam o aço e a artilharia no Tyne. Abre uma vaga e enfileira uma fábrica de armas no norte da Inglaterra; a dívida sobe 1."
 ENG_ww1_lancashire_engineering_desc:0 "As oficinas de locomotivas e teares de Lancashire convertem parte da capacidade para máquinas pesadas. Abre uma vaga e enfileira um complexo industrial no noroeste; apoio trabalhista +1."
 ENG_ww1_the_city_credit_market_desc:0 "A City de Londres financia o governo com títulos e aceita letras de câmbio de aliados. A dívida cai 2 e ganha 15 de poder político."
 ENG_ww1_railway_freight_coordination_desc:0 "O Comitê Executivo das Ferrovias coordena cargas e duplica a linha Londres-Southampton. Substitui o crédito financeiro pelo Executivo Ferroviário (consumo de suprimento -2%), ferrovia nível 2 e 10 de poder político."
 ENG_ww1_domestic_coal_allocation_desc:0 "O carvão galês é a base da indústria, da frota e das exportações. Adiciona 1 nível de infraestrutura no País de Gales, complexo industrial em Yorkshire e instituição Alocação do Carvão."
 ENG_ww1_national_munitions_contracts_desc:0 "Contratos nacionais ampliam Woolwich e Birmingham com duas fábricas militares. Substitui alocação de carvão por Contratos de Munição (capacidade +1,5%); dívida sobe 2."
 ENG_ww1_the_ministry_of_munitions_desc:0 "Lloyd George assume a produção de guerra em maio de 1915. O Ministério substitui contratos dispersos por Ministério de Munições (capacidade industrial +4%, eficiência máxima +2,5%); apoio trabalhista -3."
 ENG_ww1_shell_inspection_boards_desc:0 "Inspetores reorganizam a produção de projéteis em Sheffield com fábrica militar em Yorkshire. Substitui contratos preliminares pela instituição Inspeção de Projéteis."
 ENG_ww1_wartime_labour_dilution_desc:0 "O Acordo do Tesouro de 1915 permite mulheres e operários sem ofício em funções técnicas. Substitui inspeções locais pela instituição Diluição da Mão de Obra; apoio trabalhista -4."
 ENG_ww1_the_shop_stewards_agreement_desc:0 "Delegados de oficina ganham voz nas fábricas de guerra. Substitui diluição unilateral pelo Pacto Trabalhista e apoio trabalhista +6."
 ENG_ww1_emergency_factory_controls_desc:0 "O Estado assume controle direto de contratações e salários fabris. Substitui acordos voluntários por Controles Emergenciais; apoio trabalhista -6."
 ENG_ww1_the_ministry_of_food_desc:0 "Em dezembro de 1916 nasce o Ministério da Alimentação. O governo precisa decidir entre racionamento obrigatório e apelo voluntário. A dívida sobe 1."
 ENG_ww1_austerity_and_public_credit_desc:0 "Impostos de guerra e empréstimos forçados reduzem a pressão sobre o crédito público. A dívida cai 3, apoio trabalhista cai 2 e ganha 10 de poder político. Abre a decisão da campanha de poupança de guerra."
 ENG_ww1_debt_service_commission_desc:0 "Uma comissão organiza o pagamento dos juros da dívida de guerra. A dívida cai 4, mas o corte de gastos custa 1% de estabilidade."
 ENG_ww1_convert_the_war_plants_desc:0 "Depois do armistício, fábricas de munição voltam a produzir máquinas e locomotivas. Ganha 20 de poder político, 2% de estabilidade e apoio trabalhista +3."
 ENG_ww1_housing_and_civilian_employment_desc:0 "A Lei Addison promove casas para veteranos com um complexo industrial nas Midlands. Substitui controles de guerra por Programa de Habitação; dívida +3 e apoio trabalhista +4."
 ENG_ww1_the_peace_administration_office_desc:0 "Um escritório civil assume a transição da guerra para a paz. Ganha 15 de poder político e abre as etapas da reconstrução."
 ENG_ww1_military_demobilisation_planning_desc:0 "Listas por idade, ofício e tempo de serviço organizam a volta dos soldados. Ganha 10 de poder político e 1% de estabilidade."
 ENG_ww1_shipping_repatriation_coordination_desc:0 "Navios de transporte levam tropas de volta da França, do Oriente Médio e dos domínios. A dívida sobe 1 e a estabilidade sobe 1%."
 ENG_ww1_veterans_welfare_register_desc:0 "Um registro nacional liga cada veterano a pensão e emprego. Substitui conversão preliminar pelo Assentamento de Veteranos; estabilidade +1% e dívida +1."
 ENG_ww1_disability_pension_administration_desc:0 "Centenas de milhares de mutilados e viúvas passam a receber pensão regular. Ganha 10 de poder político, estabilidade sobe 2% e apoio trabalhista +4; dívida sobe 2."
 ENG_ww1_civilian_training_for_returning_soldiers_desc:0 "Escolas técnicas e oficinas reciclam ex-soldados para empregos civis. Ganha 10 de poder político e apoio trabalhista +2."
 ENG_ww1_public_housing_contracts_desc:0 "Prefeituras assinam contratos para construir moradias populares com subsídio do Estado, ampliando a infraestrutura das Midlands. A dívida sobe 2, apoio trabalhista +3 e 1% de estabilidade."
 ENG_ww1_industrial_conversion_planning_desc:0 "Planos de conversão de aço e químicos para uso civil substituem ministérios e programas bélicos. Instituição Conversão Industrial (bens de consumo -2%)."
 ENG_ww1_the_employment_exchanges_desc:0 "Bolsas de emprego ligam desempregados e vagas em todo o país. Apoio trabalhista +3 e 1% de estabilidade."
 ENG_ww1_restore_civilian_railway_traffic_desc:0 "As companhias retomam o controle das linhas. Ganha 15 de poder político, estabilidade +1% e desfaz o Executivo Ferroviário; dívida +1."
 ENG_ww1_public_debt_repayment_desc:0 "O Tesouro usa receitas para resgatar títulos de guerra. A dívida cai 5 e apoio trabalhista cai 2 pelo custo fiscal."
 ENG_ww1_treasury_expenditure_review_desc:0 "O Comitê de Economia revisa cada ministério. A dívida cai 3, ganha 10 de poder político e apoio trabalhista cai 2."
 ENG_ww1_merchant_marine_renewal_desc:0 "A marinha mercante perdeu milhões de toneladas na guerra. Enfileira um estaleiro extra em Strathclyde (abrindo uma vaga); a dívida sobe 2."
 ENG_ww1_the_public_health_settlement_desc:0 "O Ministério da Saúde de 1919 reúne hospitais, seguros e saneamento. Estabilidade +2%, dívida +1 e apoio trabalhista +2."
 ENG_ww1_the_education_reconstruction_programme_desc:0 "A Lei Fisher eleva a idade escolar e cria continuação educacional. Estabilidade +1% e dívida +1."
 ENG_ww1_local_government_finance_desc:0 "Municípios recebem uma nova fórmula de impostos locais e subsídios. A dívida cai 1, ganha 10 de poder político e apoio trabalhista cai 1."
 ENG_ww1_the_industrial_relations_conference_desc:0 "A Conferência Industrial Nacional reúne patrões e sindicatos para evitar greves. Apoio trabalhista +4 e 10 de poder político."
 ENG_ww1_the_postwar_parliamentary_mandate_desc:0 "Com os temas da paz resolvidos, o governo busca um mandato claro no Parlamento. Estabilidade +2% e 25 de poder político."
 ENG_ww1_the_nineteen_twenty_two_cabinet_desc:0 "A queda da coalizão em outubro de 1922 leva Bonar Law ao poder. O novo gabinete herda cortes e greves já marcados."
 ENG_ww1_the_nineteen_twenty_three_settlement_desc:0 "Baldwin tenta estabilizar finanças e política com a dívida americana acertada. Ganha 15 de poder político e a dívida cai 2."
 ww1_britain_eco.1.t:0 "As greves de aluguel do Clyde"
 ww1_britain_eco.1.d:0 "Senhorios aumentam aluguéis perto das fábricas de guerra em Glasgow. Operárias e mulheres de soldados montam piquetes nas portas dos despejos, e os delegados de oficina ameaçam parar o Clyde."
 ww1_britain_eco.1.a:0 "Congelar os aluguéis por lei. (apoio trabalhista +5, dívida +1, estabilidade +1%)"
 ww1_britain_eco.1.b:0 "Quebrar a greve e prender os líderes. (apoio trabalhista -6, estabilidade -2%, +10 de poder político)"
 ww1_britain_eco.3.t:0 "O racionamento de alimentos"
 ww1_britain_eco.3.d:0 "Os submarinos cortam importações de trigo e açúcar, e as filas crescem. O Ministério da Alimentação pode impor racionamento obrigatório ou pedir contenção voluntária."
 ww1_britain_eco.3.a:0 "Impor racionamento obrigatório. (instituição Controle de Alimentos, estabilidade +1%)"
 ww1_britain_eco.3.b:0 "Pedir contenção voluntária. (estabilidade -1%, +10 de poder político, instituição Controle de Alimentos)"
 ww1_britain_eco.5.t:0 "O Machado de Geddes"
 ww1_britain_eco.5.d:0 "O Comitê Geddes propõe cortes profundos em gastos militares, educação e habitação. Os economistas pedem equilíbrio; os sindicatos e os veteranos prometem resistir."
 ww1_britain_eco.5.a:0 "Aceitar todos os cortes. (dívida -6, apoio trabalhista -5, +15 de poder político, estabilidade -1%)"
 ww1_britain_eco.5.b:0 "Aceitar só metade. (dívida -3, apoio trabalhista -2)"
 ww1_britain_eco.5.c:0 "Recusar os cortes. (apoio trabalhista +3, -10 de poder político)"
 ww1_britain_eco.6.t:0 "A Sexta-feira Negra dos mineiros"
 ww1_britain_eco.6.d:0 "Com o fim do controle estatal das minas, os donos cortam salários. A Aliança Tríplice de mineiros, ferroviários e transportadores ameaça greve geral, e os aliados do governo hesitam."
 ww1_britain_eco.6.a:0 "Apoiar os donos das minas. (apoio trabalhista -8, estabilidade -2%, dívida -1)"
 ww1_britain_eco.6.b:0 "Subsidiar os salários por alguns meses. (dívida +4, apoio trabalhista +4)"
 ww1_britain_eco.10.t:0 "Carvão britânico para os aliados"
 ww1_britain_eco.10.d:0 "Londres oferece navios de carvão para manter fábricas, ferrovias e esquadras aliadas em funcionamento. O preço é crédito e tonelagem que a marinha mercante britânica também poderia usar."
 ww1_britain_eco.10.a:0 "Aceitar o carvão. (estabilidade +2%; a dívida britânica sobe 1)"
 ww1_britain_eco.10.b:0 "Recusar a oferta."
 ENG_ww1_railway_executive:0 "Executivo ferroviário"
 ENG_ww1_railway_executive_desc:0 "As companhias ferroviárias operam sob uma direção única."
 ENG_ww1_coal_allocation:0 "Alocação do carvão"
 ENG_ww1_coal_allocation_desc:0 "A indústria tem preferência sobre o consumo doméstico."
 ENG_ww1_munitions_contracts:0 "Contratos de munição"
 ENG_ww1_munitions_contracts_desc:0 "Muitos fornecedores, qualidade desigual."
 ENG_ww1_shell_inspection:0 "Inspeção de projéteis"
 ENG_ww1_shell_inspection_desc:0 "Lotes defeituosos são rejeitados antes do embarque."
 ENG_ww1_labour_dilution:0 "Diluição da mão de obra"
 ENG_ww1_labour_dilution_desc:0 "Mulheres e operários sem ofício ocupam postos qualificados."
 ENG_ww1_food_control:0 "Controle de alimentos"
 ENG_ww1_food_control_desc:0 "Preços e racionamento sob o Ministério da Alimentação."
 ENG_ww1_industrial_conversion:0 "Conversão industrial"
 ENG_ww1_industrial_conversion_desc:0 "A indústria de guerra volta ao uso civil."
 ENG_ww1_coal_to_allies:0 "Enviar carvão aos aliados"
 ENG_ww1_coal_to_allies_desc:0 "Gasta 15 de poder político. Em guerra, oferece carvão a cada aliado da facção britânica; quem aceita ganha 2% de estabilidade e a dívida britânica sobe 1 por aceite. Exige a alocação do carvão."
 ENG_ww1_war_savings_drive:0 "Campanha de poupança de guerra"
 ENG_ww1_war_savings_drive_desc:0 "Gasta 20 de poder político. A dívida cai 2 e o apoio trabalhista cai 1 pelo sacrifício. Exige medidas de austeridade."
