 FRA_tirailleurs_senegalais_desc:0 "Organise colonial recruitment and training. Eligible non-core recruitment expands through a single colonial service institution; equipment, manpower and training are still required."
 FRA_tirailleurs_algeriens_et_goumiers_desc:0 "Extend the colonial service organisation to North African contingents. This uses the existing institution rather than adding a second permanent army bonus."
 FRA_dreadnoughts_classe_courbet_desc:0 "Prepare the Courbet construction programme: a targeted capital-ship research credit and a dockyard project in Provence. Ships must be designed and built."
 FRA_rupture_de_la_ligne_hindenburg_desc:0 "Study and prepare the assault on fortified positions. The reform improves doctrinal learning temporarily; the line must still be broken on the battlefield."
