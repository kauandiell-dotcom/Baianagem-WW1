l_english:
 FRA_ww1_eight_hour_day:0 "The Eight-Hour Settlement"
 FRA_ww1_eight_hour_day_desc:0 "A shorter work day strengthens the social settlement, while increasing civilian claims on production."
 FRA_ww1_workers_councils:0 "Negotiated Factory Councils"
 FRA_ww1_workers_councils_desc:0 "Worker participation improves coordination, but negotiated changes consume political attention."
 FRA_ww1_employer_compact:0 "The Industrial Compact"
 FRA_ww1_employer_compact_desc:0 "A management-led compact coordinates output at the cost of renewed social tension."
 FRA_ww1_bank_credit:0 "Mobilisation Credit"
 FRA_ww1_bank_credit_desc:0 "Credit accelerates investment temporarily; servicing the commitment reserves civilian production."
 FRA_ww1_industrial_mobilisation:0 "Coordinated War Arsenals"
 FRA_ww1_industrial_mobilisation_desc:0 "Military coordination directs labour and investment to war production, slowing civilian development."
 FRA_ww1_rationing:0 "Wartime Rationing"
 FRA_ww1_rationing_desc:0 "Rationing prioritises the war economy, with a persistent civilian political cost."
 FRA_ww1_colonial_service:0 "Colonial Service Organisation"
 FRA_ww1_colonial_service_desc:0 "Recruitment requires training and administration. Colonial service expands the eligible pool; it does not create ready divisions."
 FRA_ww1_imperial_citizenship:0 "An Imperial Civic Settlement"
 FRA_ww1_imperial_citizenship_desc:0 "Extended rights carry administrative and social commitments. Recruitment still requires equipment and training."
 FRA_ww1_naval_escorts:0 "Organised Escort Training"
 FRA_ww1_naval_escorts_desc:0 "Escort coordination benefits ships actually assigned to protect the sea lanes."
 FRA_ww1_salonika_transport:0 "Salonika Transport Administration"
 FRA_ww1_salonika_transport_desc:0 "A temporary transport administration supports a distant theatre while reserving civilian capacity."
 FRA_ww1_observation_balloons:0 "Observation and Survey Sections"
 FRA_ww1_observation_balloons_desc:0 "Surveying helps field preparation; observation sections still rely on supply and protection."
 FRA_ww1_offensive_school:0 "The Offensive School"
 FRA_ww1_offensive_school_desc:0 "Aggressive methods exchange defensive flexibility and supplies for limited offensive efficiency."
 FRA_ww1_concentration:0 "Army Concentration Schedule"
 FRA_ww1_concentration_desc:0 "A temporary staff schedule coordinates mobilisation; it does not move divisions or win battles automatically."
 FRA_ww1_fighting_retreat:0 "Organised Fighting Withdrawal"
 FRA_ww1_fighting_retreat_desc:0 "Temporary withdrawal arrangements protect a retreat at the expense of offensive initiative."
 FRA_ww1_field_fortification:0 "Field Engineering Programme"
 FRA_ww1_field_fortification_desc:0 "Improved field positions require engineering and logistical effort."
 FRA_ww1_division_rotation:0 "Division Relief Schedule"
 FRA_ww1_division_rotation_desc:0 "Rest and relief support recovery while limiting immediate offensive activity."
 FRA_ww1_allied_staff:0 "Allied Staff Liaison"
 FRA_ww1_allied_staff_desc:0 "Temporary liaison improves preparation. Allied units and supplies must still be committed by their owners."
 FRA_ww1_infantry_training:0 "Conscript Training Organisation"
 FRA_ww1_infantry_training_desc:0 "Additional training administration shortens preparation modestly while using civilian capacity."
