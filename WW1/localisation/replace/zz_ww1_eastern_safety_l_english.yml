l_english:
 ww1_eastern_terms_expired_tt:0 "The negotiations have lapsed or their conditions have changed. No territory is transferred and no war is ended."
 ww1_diplomacy.32.d:0 "Germany demands recognition of its occupation in the Polish and Baltic frontier districts it actually controls. These terms remain valid for thirty days and only for the government addressed. Accepting withdraws us from the alliance and ends our wars with the Central Powers. Our interior and unoccupied districts remain ours; economic recovery is separate."
