l_braz_por:
 ENG_ww1_edward_grey_and_the_entente_desc:0 "Sir Edward Grey conduz a política externa pela Entente Cordiale sem assinar uma aliança formal. Ganha 15 de poder político; os acordos com a França e a Rússia ficam sob a sua direção."
 ENG_ww1_the_french_naval_understanding_desc:0 "Em 1912 a Marinha Real concentra-se no Mar do Norte e a francesa no Mediterrâneo. Ganha 4 de experiência naval e propõe o entendimento à França, que pode aceitar ou recusar."
 ENG_ww1_french_staff_conversations_desc:0 "Oficiais britânicos e franceses estudam, em sigilo, como um corpo expedicionário poderia chegar à França. Ganha 5 de experiência de exército; nenhum compromisso formal é assumido."
 ENG_ww1_belgian_treaty_obligations_desc:0 "O Tratado de 1839 garante a neutralidade belga. Ganha 10 de poder político e 1% de estabilidade; se a política continental está ativa, a garantia à Bélgica é renovada."
 ENG_ww1_channel_expeditionary_coordination_desc:0 "Portos, ferrovias e transportes são preparados para enviar a Força Expedicionária Britânica à França. Ganha 5 de experiência de exército."
 ENG_ww1_russian_procurement_liaison_desc:0 "Londres oferece crédito e armas à Rússia, que paga em grãos e matérias-primas. A dívida sobe 1; a Rússia decide se aceita."
 ENG_ww1_neutral_shipping_assurances_desc:0 "A Declaração de Londres e garantias aos navios neutros reduzem atritos com os Estados Unidos e com países do Norte. A dívida cai 1 e ganha 5 de poder político."
 ENG_ww1_american_credit_negotiations_desc:0 "Os bancos de Nova York financiam compras britânicas de munição e alimentos. Londres faz o pedido; os Estados Unidos decidem se concedem o crédito."
 ENG_ww1_italian_coalition_talks_desc:0 "Londres oferece à Itália Trentino, Trieste e a Dalmácia em troca de entrar na guerra. A Itália decide se ouve os termos; a resposta fica registrada."
 ENG_ww1_the_portuguese_connection_desc:0 "A aliança de 1373 é a mais antiga da Europa. Londres pede acesso a portos e colônias; Lisboa decide se renova as obrigações."
 ENG_ww1_balkan_allied_coordination_desc:0 "Sérvia, Grécia e Romênia recebem oferta de coordenação de suprimentos e de transporte. Cada um decide."
 ENG_ww1_coalition_shipping_priorities_desc:0 "Um conselho aliado decide quais cargas têm prioridade: tropas, munição, trigo ou carvão. A dívida cai 1 e ganha 3 de experiência naval."
 ENG_ww1_the_supreme_war_council_desc:0 "Depois de Caporetto, aliados criam em Versalhes um Conselho Supremo de Guerra. A questão é se o comando passa a ser unificado."
 ENG_ww1_armistice_consultations_desc:0 "Os aliados discutem as condições do armistício. Londres decide se defende termos moderados ou duros para os derrotados."
 ENG_ww1_reconstruction_credit_negotiations_desc:0 "Reestruturar a dívida de guerra depende de quem emprestou. Com crédito americano concedido, a dívida cai 3; sem ele, sobe 2. Ganha 10 de poder político."
 ENG_ww1_the_naval_disarmament_conference_desc:0 "Washington, 1921: os Estados Unidos propõem limites à construção de couraçados. Londres decide se aceita a paridade naval."
 ENG_ww1_a_european_security_settlement_desc:0 "Locarno e a Liga das Nações buscam garantir a fronteira ocidental. Ganha 20 de poder político e 1% de estabilidade."
 ENG_ww1_the_national_physical_laboratory_desc:0 "O laboratório de Teddington padroniza medidas, ligas e instrumentos. Um bônus de pesquisa de 25% (uso único) em tecnologia industrial."
 ENG_ww1_university_military_contracts_desc:0 "Cambridge, Manchester e Imperial College assinam contratos de pesquisa com o governo. Ganha 10 de poder político e bônus de pesquisa de 25% em eletrônica (uso único)."
 ENG_ww1_ordnance_metallurgy_research_desc:0 "Woolwich e as siderúrgicas estudam ligas para canos e projéteis. Bônus de pesquisa de 25% em artilharia (uso único)."
 ENG_ww1_machine_tool_standards_desc:0 "Padrões de ferramentas e calibres permitem trocar peças entre fábricas. Bônus de pesquisa de 25% em engenharia (uso único)."
 ENG_ww1_railway_engineering_standards_desc:0 "Bitolas, pontes e locomotivas seguem padrões comuns, duplicando o tronco ferroviário entre Birmingham e Manchester. Bônus de 25% em logística e ferrovia nível 2 construída."
 ENG_ww1_naval_architecture_research_desc:0 "O tanque de provas de Haslar testa cascos e hélices. Bônus de pesquisa de 25% em contratorpedeiros (uso único)."
 ENG_ww1_explosive_safety_research_desc:0 "Normas de armazenagem e fabricação diminuem explosões em fábricas de cordite. Estabilidade +1% e bônus de pesquisa de 25% em armas de infantaria (uso único)."
 ENG_ww1_field_wireless_research_desc:0 "Rádios portáteis e válvulas de campanha para o Corpo de Sinais. Bônus de pesquisa de 25% em sinais (uso único)."
 ENG_ww1_signals_intelligence_organisation_desc:0 "Admiralty e War Office reúnem interceptações de rádio e cabo em um só escritório. Ganha 10 de poder político e abre o escritório da Sala 40."
 ENG_ww1_the_room_forty_office_desc:0 "A Sala 40 lê códigos navais alemães e intercepta despachos globais. Substitui a teia imperial inicial pela instituição Sala 40 (velocidade de decifração +10%)."
 ENG_ww1_aerial_photography_research_desc:0 "Câmeras em aviões mapeiam trincheiras e baterias. Bônus de pesquisa de 25% em reconhecimento (uso único)."
 ENG_ww1_artillery_survey_mathematics_desc:0 "Matemáticos e topógrafos calculam alcance, vento e desgaste de canos. Ganha 5 de experiência de exército."
 ENG_ww1_chemical_protection_research_desc:0 "Depois do primeiro gás, cientistas criam respiradores e tratamentos. Bônus de pesquisa de 25% em serviços médicos (uso único)."
 ENG_ww1_the_landships_technical_committee_desc:0 "O Comitê dos Navios Terrestres de 1915 financia os primeiros tanques. Ganha 5 de experiência de exército; a dívida sobe 1. Nenhum tanque é entregue por este foco."
 ENG_ww1_aircraft_engine_research_desc:0 "Rolls-Royce e Royal Aircraft Factory testam motores mais confiáveis. Bônus de pesquisa de 25% em equipamento aéreo (uso único)."
 ENG_ww1_hydrophone_analysis_laboratory_desc:0 "O laboratório de Hawkcraig analisa ruídos de submarinos em hidrofones. Bônus de pesquisa de 25% em torpedos e armas submarinas (uso único)."
 ENG_ww1_production_quality_standards_desc:0 "Padrões de qualidade reduzem refugo e acidentes nas fábricas de guerra. Ganha 10 de poder político e 1% de estabilidade."
 ENG_ww1_the_postwar_research_council_desc:0 "O Conselho de Pesquisa Científica e Industrial sobrevive à desmobilização. Ganha 15 de poder político e bônus de 25% em tecnologia industrial; dívida sobe 1."
 ENG_ww1_industrial_patent_exchanges_desc:0 "Patentes alemãs confiscadas são licenciadas a empresas britânicas. Ganha 15 de poder político, bônus de 25% em eletrônica e dívida cai 1."
 ENG_ww1_technical_education_for_reconstruction_desc:0 "Escolas técnicas qualificam operários para a transição pacífica. Ganha 15 de poder político, 2% de estabilidade e bônus de 25% em tecnologia de engenharia."
 ww1_britain_dip.2.t:0 "O Conselho Supremo de Guerra"
 ww1_britain_dip.2.d:0 "Depois de Caporetto, britânicos, franceses e italianos criam um conselho em Versalhes. Os generais discutem se um comando aliado único é melhor que seis estados-maiores nacionais."
 ww1_britain_dip.2.a:0 "Aceitar um comando aliado unificado. (-10 de poder político, apoio à guerra +2%)"
 ww1_britain_dip.2.b:0 "Manter o comando britânico independente. (+10 de poder político)"
 ww1_britain_dip.3.t:0 "As condições do armistício"
 ww1_britain_dip.3.d:0 "Foch e os governos discutem o que exigir da Alemanha. Lloyd George teme um bloqueio prolongado e um colapso social; a opinião pública exige punição."
 ww1_britain_dip.3.a:0 "Defender termos moderados. (+10 de poder político, estabilidade +1%)"
 ww1_britain_dip.3.b:0 "Defender termos duros. (+15 de poder político, estabilidade -1%)"
 ww1_britain_dip.4.t:0 "A Conferência Naval de Washington"
 ww1_britain_dip.4.d:0 "Os Estados Unidos propõem uma proporção de 5:5:3 para os maiores couraçados. O Almirantado resiste, mas o Tesouro não consegue sustentar uma corrida naval."
 ww1_britain_dip.4.a:0 "Aceitar a paridade naval. (dívida -3, -10 de poder político)"
 ww1_britain_dip.4.b:0 "Recusar os limites. (dívida +2, +10 de poder político)"
 ww1_britain_dip.10.t:0 "Um pedido britânico de crédito"
 ww1_britain_dip.10.d:0 "O embaixador britânico pede que os bancos americanos financiem compras de munição, trigo e algodão. Wall Street está disposta; o governo, dividido entre neutralidade e interesse comercial."
 ww1_britain_dip.10.a:0 "Conceder o crédito. (+20 de poder político; a dívida britânica cai 5)"
 ww1_britain_dip.10.b:0 "Recusar. (a dívida britânica sobe 2, estabilidade britânica -1%)"
 ww1_britain_dip.11.t:0 "As ofertas de Londres"
 ww1_britain_dip.11.d:0 "Sonnino e Salandra recebem os termos de Londres: Trentino, Alto Ádige, Trieste, Ístria e parte da Dalmácia, em troca de entrar na guerra ao lado da Entente. Viena faz uma oferta rival, menor."
 ww1_britain_dip.11.a:0 "Ouvir os termos de Londres. (a Itália registra a proposta)"
 ww1_britain_dip.11.b:0 "Manter a Tríplice Aliança por ora. (a Itália registra a recusa)"
 ww1_britain_dip.12.t:0 "A aliança mais antiga"
 ww1_britain_dip.12.d:0 "Londres invoca o Tratado de Windsor de 1386 e pede acesso aos portos e às colônias portuguesas. Lisboa teme a Alemanha nas colônias africanas e busca garantias de proteção."
 ww1_britain_dip.12.a:0 "Renovar as obrigações da aliança. (estabilidade +2%; a dívida britânica sobe 1)"
 ww1_britain_dip.12.b:0 "Permanecer neutro. (sem efeitos)"
 ww1_britain_dip.13.t:0 "Crédito britânico em munição"
 ww1_britain_dip.13.d:0 "Londres oferece armas e crédito ao exército russo, que paga em trigo, linho e madeira. A entrega depende de portos no Báltico e no Ártico."
 ww1_britain_dip.13.a:0 "Aceitar o crédito. (+10 de poder político; a dívida britânica sobe 1)"
 ww1_britain_dip.13.b:0 "Recusar. (a Grã-Bretanha nota a recusa russa)"
 ww1_britain_dip.14.t:0 "O entendimento naval anglo-francês"
 ww1_britain_dip.14.d:0 "Londres propõe que a Marinha Real proteja o Canal e o Mar do Norte, e a frota francesa o Mediterrâneo. Paris aceita, mas quer saber até onde vai o compromisso britânico."
 ww1_britain_dip.14.a:0 "Aceitar a divisão de áreas. (estabilidade +1%; experiência naval britânica +3)"
 ww1_britain_dip.14.b:0 "Recusar o compromisso. (a Grã-Bretanha mantém patrulhas próprias)"
 ww1_britain_dip.15.t:0 "Suprimentos para os Bálcãs"
 ww1_britain_dip.15.d:0 "Londres oferece coordenar transporte e suprimentos aliados para o exército local, usando portos gregos e ferrovias romenas e sérvias."
 ww1_britain_dip.15.a:0 "Aceitar a coordenação. (estabilidade +2%; a dívida britânica sobe 1)"
 ww1_britain_dip.15.b:0 "Recusar. (a Grã-Bretanha poupa suprimentos)"
 ENG_ww1_room_forty:0 "Sala 40"
 ENG_ww1_room_forty_desc:0 "Criptoanalistas do Almirantado leem os códigos navais alemães."
 ENG_ww1_renew_american_credit:0 "Renovar o crédito americano"
 ENG_ww1_renew_american_credit_desc:0 "Gasta 20 de poder político. Em guerra, repete o pedido de crédito aos Estados Unidos, que podem conceder ou recusar. Exige que o primeiro crédito tenha sido concedido."
