l_english:
 FRA_renault_ft_revolution_desc:0 "A light-tank production and employment programme. French light-tank designs receive a limited cost reduction; speed and attack improvements remain moderate. Medium and heavy equipment receive no production discount."
 FRA_air_supremacy_spad_desc:0 "Improved fighter coordination increases mission efficiency modestly. Aircraft must still be researched, produced, trained and assigned to the appropriate theatre."
 FRA_firepower_doctrine_desc:0 "Artillery coordination and field preparation support defensive operations. These benefits require an equipped, supplied army and do not automatically stop an enemy offensive."
