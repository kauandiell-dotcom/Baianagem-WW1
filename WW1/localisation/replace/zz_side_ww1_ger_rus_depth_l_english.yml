l_english:
 side_ww1_GER_administration:0 "The German War Economy"
 side_ww1_GER_administration_desc:0 "Military programmes compete for the same workshops, trains and workforce. Institutions replace their predecessors; a temporary allocation can favour only one priority."
 side_ww1_SOV_administration:0 "Russian Mobilisation and Supply"
 side_ww1_SOV_administration_desc:0 "Industrial coordination, railway capacity and imported arms must develop together. Foreign supplies require an allied response, an open receiving port and a supplier with actual reserves."
 side_ww1_GER_armaments_priority:0 "Priority for Army Orders"
 side_ww1_GER_armaments_priority_desc:0 "Concentrate workshops on army orders for 180 days. Civilian construction slows and the civilian share increases."
 side_ww1_GER_armaments_priority_project:0 "Priority for Army Orders"
 side_ww1_GER_armaments_priority_project_desc:0 "Commit 2 civilian factories for 60 days and 40 political power. Concentrate workshops on army orders for 180 days. Civilian construction slows and the civilian share increases. Another allocation cannot start until the current one ends."
 side_ww1_GER_naval_priority:0 "Priority for the Fleet"
 side_ww1_GER_naval_priority_desc:0 "Shipyards gain priority for 180 days, at the expense of military factory output. A naval investment cannot simultaneously maximise army production."
 side_ww1_GER_naval_priority_project:0 "Priority for the Fleet"
 side_ww1_GER_naval_priority_project_desc:0 "Commit 2 civilian factories for 60 days and 40 political power. Shipyards gain priority for 180 days, at the expense of military factory output. A naval investment cannot simultaneously maximise army production. Another allocation cannot start until the current one ends."
 side_ww1_GER_distribution_priority:0 "Railway and Distribution Priority"
 side_ww1_GER_distribution_priority_desc:0 "Railway construction and political confidence take priority for 180 days. Armaments output falls; this programme does not conjure food or remove the blockade."
 side_ww1_GER_distribution_priority_project:0 "Railway and Distribution Priority"
 side_ww1_GER_distribution_priority_project_desc:0 "Commit 2 civilian factories for 60 days and 40 political power. Railway construction and political confidence take priority for 180 days. Armaments output falls; this programme does not conjure food or remove the blockade. Another allocation cannot start until the current one ends."
 side_ww1_SOV_state_contracts:0 "Centralised Military Contracts"
 side_ww1_SOV_state_contracts_desc:0 "Central coordination improves output and production efficiency for 180 days, while increasing the civilian share required by administration."
 side_ww1_SOV_state_contracts_project:0 "Centralised Military Contracts"
 side_ww1_SOV_state_contracts_project_desc:0 "Commit 2 civilian factories for 60 days and 40 political power. Central coordination improves output and production efficiency for 180 days, while increasing the civilian share required by administration. Another allocation cannot start until the current one ends."
 side_ww1_SOV_civic_contracts:0 "Contracts with Civic Industry"
 side_ww1_SOV_civic_contracts_desc:0 "Cooperation with industrial and civic committees produces a smaller industrial gain and greater confidence for 180 days, while negotiations consume political capacity."
 side_ww1_SOV_civic_contracts_project:0 "Contracts with Civic Industry"
 side_ww1_SOV_civic_contracts_project_desc:0 "Commit 2 civilian factories for 60 days and 40 political power. Cooperation with industrial and civic committees produces a smaller industrial gain and greater confidence for 180 days, while negotiations consume political capacity. Another allocation cannot start until the current one ends."
 side_ww1_SOV_railway_priority:0 "Priority for Military Railways"
 side_ww1_SOV_railway_priority_desc:0 "Railway works and military supply organisation take priority for 180 days, diverting workshops from armaments production."
 side_ww1_SOV_railway_priority_project:0 "Priority for Military Railways"
 side_ww1_SOV_railway_priority_project_desc:0 "Commit 2 civilian factories for 60 days and 40 political power. Railway works and military supply organisation take priority for 180 days, diverting workshops from armaments production. Another allocation cannot start until the current one ends."
 side_ww1_GER_gas_drills:0 "Chemical Safety Drills"
 side_ww1_GER_gas_drills_desc:0 "Protective training reduces experience losses slightly and adds supply demand. It neither guarantees a successful gas attack nor weakens every enemy army."
 side_ww1_GER_danubian_distribution:0 "Danubian Distribution Agreement"
 side_ww1_GER_danubian_distribution_desc:0 "An accepted allied allocation supports confidence for 180 days, with an additional civilian burden. Its effect is limited; shortages and the blockade retain their own causes."
 side_ww1_AUS_export_commitment:0 "German Export Commitment"
 side_ww1_AUS_export_commitment_desc:0 "One civilian factory and a modest share of military output are committed for 90 days. Helping Germany consumes resources at home."
 side_ww1_GER_reconversion:0 "Industrial Reconversion"
 side_ww1_GER_reconversion_desc:0 "Temporary support for repairs and civilian construction after dismantling wartime industrial institutions."
 side_ww1_SOV_reconversion:0 "Repairing the Russian Economy"
 side_ww1_SOV_reconversion_desc:0 "Temporary repair and railway support after dismantling wartime industrial institutions. Supply credits remain a separate obligation."
 side_ww1_SOV_allied_supply_credit:0 "Allied Supply Credit"
 side_ww1_SOV_allied_supply_credit_desc:0 "Imported armaments carry continuing administrative and civilian obligations. Settle each outstanding tranche after the war."
 side_ww1_GER_reconversion_project:0 "Reconvert the War Economy"
 side_ww1_GER_reconversion_project_desc:0 "Commit 2 civilian factories for 90 days and 40 political power after peace. Replace wartime industrial institutions with 180 days of modest reconstruction support; no factories, equipment or victory are awarded."
 side_ww1_SOV_reconversion_project:0 "Reconvert the War Economy"
 side_ww1_SOV_reconversion_project_desc:0 "Commit 2 civilian factories for 90 days and 40 political power after peace. Replace wartime industrial institutions with 180 days of modest reconstruction support; no factories, equipment or victory are awarded."
 side_ww1_SOV_request_FRA_arms:0 "Request French Armaments"
 side_ww1_SOV_request_FRA_arms_desc:0 "Administration commits 1 civilian factory for 60 days and costs 35 political power. If our ally agrees, a 6000-rifle and 120-gun tranche is checked after 30 days. The supplier must retain another equivalent reserve; a lost port, broken alliance, peace or stock shortage prevents transfer. Each delivered tranche adds a postwar credit obligation. Maximum 6 unpaid tranches."
 side_ww1_SOV_request_ENG_arms:0 "Request British Armaments"
 side_ww1_SOV_request_ENG_arms_desc:0 "Administration commits 1 civilian factory for 60 days and costs 35 political power. If our ally agrees, a 6000-rifle and 120-gun tranche is checked after 30 days. The supplier must retain another equivalent reserve; a lost port, broken alliance, peace or stock shortage prevents transfer. Each delivered tranche adds a postwar credit obligation. Maximum 6 unpaid tranches."
 side_ww1_SOV_supply_audit:0 "Audit Frontline Equipment and Reserves"
 side_ww1_SOV_supply_audit_desc:0 "Commit 1 civilian factory for 90 days and 30 political power. Completion checks at least 90% of required rifles,85% of required guns,3000 reserve rifles and 100 reserve guns, with underlying crisis pressure absent. Empty armies do not qualify. Only a successful audit removes the inherited industrial shortage scar; current national crises remain separate."
 side_ww1_SOV_settle_supply_credit:0 "Settle an Allied Supply Tranche"
 side_ww1_SOV_settle_supply_credit_desc:0 "Outstanding tranches: [?side_ww 1_SOV_supply_debt|0]. After peace, commit 2 civilian factories for 90 days and 40 political power to settle one tranche. The continuing credit burden ends only after the last tranche is settled. A new war cancels the programme."
 side_ww1_GER_hindenburg_conversion:0 "Implement the Hindenburg Programme"
 side_ww1_GER_hindenburg_conversion_desc:0 "Commit 2 civilian factories for 120 days and 50 political power. Reorganisation initially reduces military output by 3%. Delivery replaces the previous industrial institution rather than stacking on it, with a continuing civilian and political cost. Peace or capitulation cancels implementation."
 side_ww1_GER_request_danubian_grain:0 "Negotiate a Danubian Allocation"
 side_ww1_GER_request_danubian_grain_desc:0 "Commit 1 civilian factory for 60 days and 35 political power. Austria-Hungary may decline or commit its own budget. After 30 days, continued alliance, a shared border and the absence of an Austrian crisis are checked. The limited distribution agreement does not erase the German food crisis."
 side_ww1_industry_programmes_tt:0 "Opens timed industrial allocation projects. Each uses civilian factories; priorities replace one another."
 side_ww1_import_contract_tt:0 "Opens allied armament requests. Supplies require consent, actual allied stock and an open receiving port; delivered tranches create postwar obligations."
 side_ww1_supply_audit_tt:0 "Opens a 90-day supply audit. Researching a focus alone cannot end material shortages."
 side_ww1_grain_request_tt:0 "Opens negotiations with Austria-Hungary. Its government can refuse; relief is limited and never deletes an active crisis."
 side_ww1_hindenburg_project_tt:0 "Opens a 120-day industrial conversion with an initial production loss and continuing civilian burden."
 side_ww1_ger_rus.1.t:0 "The Price of the Hindenburg Programme"
 side_ww1_ger_rus.1.d:0 "The OHL asks for a rapid increase in weapons output. Workshops, skilled labour and transport cannot multiply overnight. We can prepare a costly conversion, or retain the current organisation."
 side_ww1_ger_rus.1.a:0 "Prepare the conversion programme."
 side_ww1_ger_rus.1.b:0 "Retain the existing organisation."
 side_ww1_ger_rus.2.t:0 "Chemical Warfare: Training before Triumph"
 side_ww1_ger_rus.2.d:0 "Chemical weapons introduce risks to their own operators and troops. Our programme develops protective procedures. Combat, weather and equipment will decide what happens at the front."
 side_ww1_ger_rus.2.a:0 "Enforce protective procedures."
 side_ww1_ger_rus.3.t:0 "Who Will Coordinate Russian Industry?"
 side_ww1_ger_rus.3.d:0 "The army demands deliveries, while ministries and industrial committees dispute contracts and capacity. The administration now permits temporary allocations to state contracts, civic cooperation or military railways. Each draws on the same civilian resources."
 side_ww1_ger_rus.3.a:0 "Allocate resources according to our priorities."
 side_ww1_ger_rus.5.t:0 "The German Allocation Takes Effect"
 side_ww1_ger_rus.5.d:0 "After the preparatory work, our selected allocation is in effect for 180 days. Increased output in one area comes at a cost elsewhere. The programme will end automatically, and peace will close wartime priorities."
 side_ww1_ger_rus.5.a:0 "Review the new allocation."
 side_ww1_ger_rus.6.t:0 "Russian Contracts Enter Execution"
 side_ww1_ger_rus.6.d:0 "The selected programme is now in effect for 180 days. It does not create weapons or rails instantly: production and construction still depend on our factories and resources."
 side_ww1_ger_rus.6.a:0 "Keep deliveries under review."
 side_ww1_ger_rus.7.t:0 "German Industrial Reconversion"
 side_ww1_ger_rus.7.d:0 "The war economy has been dismantled. Limited reconstruction support now assists repairs and civilian works for 180 days. Peace offers a new economic task rather than a permanent combat reward."
 side_ww1_ger_rus.7.a:0 "Rebuild civilian production."
 side_ww1_ger_rus.8.t:0 "Russia Returns to Civilian Works"
 side_ww1_ger_rus.8.d:0 "Wartime industrial institutions have been dismantled. Repairs and railway work receive temporary support. Foreign supply obligations have not vanished with the ceasefire."
 side_ww1_ger_rus.8.a:0 "Rebuild, and review our obligations."
 side_ww1_ger_rus.9.t:0 "The Supply Audit Is Approved"
 side_ww1_ger_rus.9.d:0 "The front has sufficient rifles and artillery, reserves exist and the underlying pressure has subsided. The inherited industrial shortage scar can now be removed. Other political or wartime crises require their own resolution."
 side_ww1_ger_rus.9.a:0 "Maintain the reserves."
 side_ww1_ger_rus.10.t:0 "The Supply Audit Finds Gaps"
 side_ww1_ger_rus.10.d:0 "The programme is complete, but frontline equipment, reserves or internal conditions still fall short. The shortage scar remains. More production or deliveries are needed before another audit."
 side_ww1_ger_rus.10.a:0 "Correct the material deficit."
 side_ww1_ger_rus.11.t:0 "The Conversion Is Complete"
 side_ww1_ger_rus.11.d:0 "The new industrial institution replaces the previous organisation. Output rises, but the civilian and political burden remains; this is no unlimited multiplication of our resources."
 side_ww1_ger_rus.11.a:0 "Account for the continuing burden."
 side_ww1_ger_rus.20.t:0 "Russia Requests an Armament Tranche"
 side_ww1_ger_rus.20.d:0 "The requesting Russian government asks for 6000 reserve rifles and 120 artillery pieces. Agreeing schedules a check in 30 days; the weapons must come from our actual stock, leaving an equivalent reserve. If the alliance or receiving route fails, there will be no transfer."
 side_ww1_ger_rus.20.a:0 "Authorise the proposed tranche."
 side_ww1_ger_rus.20.b:0 "Our reserves cannot support this commitment."
 side_ww1_ger_rus.21.t:0 "Report on the Allied Supply Contract"
 side_ww1_ger_rus.21.d:0 "The conditions of the proposed tranche have been checked. Successful delivery transfers actual allied equipment and creates a credit obligation. A failed check leaves the weapons with the supplier."
 side_ww1_ger_rus.21.a:0 "The tranche has arrived; record the obligation."
 side_ww1_ger_rus.21.b:0 "The contract could not be delivered."
 side_ww1_ger_rus.22.t:0 "One Supply Tranche Settled"
 side_ww1_ger_rus.22.d:0 "The civilian settlement programme has cleared one tranche. If other tranches remain, the credit burden continues. The final settlement ends that obligation."
 side_ww1_ger_rus.22.a:0 "Review the remaining commitments."
 side_ww1_ger_rus.23.t:0 "Our Ally Declines the Armament Request"
 side_ww1_ger_rus.23.d:0 "Our partner has declined the proposed transfer. Its own front and reserves limit what can be supplied. The administration remains paid for; no weapons or debt were created."
 side_ww1_ger_rus.23.a:0 "We must find another source."
 side_ww1_ger_rus.30.t:0 "Germany Requests a Danubian Allocation"
 side_ww1_ger_rus.30.d:0 "German distribution officials request an allied commitment. Acceptance diverts one civilian factory and part of our industrial effort for 90 days. Our own food crisis may make the proposal impossible."
 side_ww1_ger_rus.30.a:0 "Commit the limited allocation."
 side_ww1_ger_rus.30.b:0 "Domestic needs take precedence."
 side_ww1_ger_rus.31.t:0 "The Danubian Agreement Is Reviewed"
 side_ww1_ger_rus.31.d:0 "The allied commitment has reached its review date. A continuing alliance and border permit a limited distribution agreement; a new Austrian crisis or a broken relationship prevents it. German shortages are not automatically cured."
 side_ww1_ger_rus.31.a:0 "The distribution agreement is in effect."
 side_ww1_ger_rus.31.b:0 "The proposed allocation could not proceed."
 side_ww1_ger_rus.32.t:0 "Vienna Cannot Support the Request"
 side_ww1_ger_rus.32.d:0 "Austria-Hungary has declined the allocation. Allied solidarity cannot remove scarcity inside the partner country. We must address our distribution needs through another programme."
 side_ww1_ger_rus.32.a:0 "Revise our distribution priorities."
 GER_rathenau_war_raw_materials_board:0 "War Raw Materials Administration"
 GER_rathenau_war_raw_materials_board_desc:0 "Opens timed industrial allocation projects. Each uses civilian factories; priorities replace one another."
 GER_british_starvation_blockade_strain:0 "Assess the British Distant Blockade"
 GER_british_starvation_blockade_strain_desc:0 "Assess maritime vulnerability while at war with Britain. This records an administrative review; it does not create a food crisis by decree."
 GER_steckrubenwinter_crisis_management:0 "Prepare Wartime Distribution"
 GER_steckrubenwinter_crisis_management_desc:0 "Opens timed industrial allocation projects. Each uses civilian factories; priorities replace one another."
 GER_danubian_grain_imports:0 "Negotiate Danubian Supplies"
 GER_danubian_grain_imports_desc:0 "Opens negotiations with Austria-Hungary. Its government can refuse; relief is limited and never deletes an active crisis."
 GER_hindenburg_program:0 "The Hindenburg Programme"
 GER_hindenburg_program_desc:0 "Opens a 120-day industrial conversion with an initial production loss and continuing civilian burden."
 GER_chemical_warfare_initiative:0 "Chemical Warfare Procedures"
 GER_chemical_warfare_initiative_desc:0 "Develop protective training and gain limited experience. No blanket combat debuff is applied to ourselves or the enemy."
 GER_synthetic_buna_rubber_development:0 "Experimental Synthetic Rubber"
 GER_synthetic_buna_rubber_development_desc:0 "Investigate period substitutes for imported rubber. This is an experimental industrial research programme; the later Buna technology is not available by completing this focus."
 SOV_special_council_for_defense:0 "The Special Defence Council"
 SOV_special_council_for_defense_desc:0 "Opens timed industrial allocation projects. Each uses civilian factories; priorities replace one another."
 SOV_end_the_shell_shortage:0 "Verify Sustained Armament Supply"
 SOV_end_the_shell_shortage_desc:0 "Opens a 90-day supply audit. Researching a focus alone cannot end material shortages."
 SOV_the_shell_shortage_crisis:0 "Review the Frontline Shortage"
 SOV_the_shell_shortage_crisis_desc:0 "Opens a 90-day supply audit. Researching a focus alone cannot end material shortages."
 SOV_scovill_and_vickers_foreign_shells:0 "Negotiate Allied Armament Contracts"
 SOV_scovill_and_vickers_foreign_shells_desc:0 "Opens allied armament requests. Supplies require consent, actual allied stock and an open receiving port; delivered tranches create postwar obligations."
 SOV_murmansk_convoys_arrival:0 "Organise the Allied Receiving Routes"
 SOV_murmansk_convoys_arrival_desc:0 "Opens allied armament requests. Supplies require consent, actual allied stock and an open receiving port; delivered tranches create postwar obligations."
 SOV_fedorov_avtomat_early_rifle:0 "Fedorov Automatic Rifle Trials"
 SOV_fedorov_avtomat_early_rifle_desc:0 "An experimental weapons programme gives one 30% infantry-weapons research bonus and 5 army experience. Trials do not deliver thousands of production weapons."
 SOV_vezdekhod_and_tsar_tank_experiments:0 "Evaluate the Vezdekhod and Tsar Tank"
 SOV_vezdekhod_and_tsar_tank_experiments_desc:0 "Evaluate mobility and engineering limitations. Gain a single 30% armour research bonus and 5 army experience, without free tanks or cumulative experimental research rewards."
 SOV_murmansk_ice_free_port_lifeline:0 "Develop the Murmansk Lifeline"
 SOV_murmansk_ice_free_port_lifeline_desc:0 "Queue a port expansion and infrastructure work in Murmansk, and build its railway connection if both endpoints are controlled. Construction requires the normal civilian capacity; the port is not built at Arkhangelsk."
 SOV_arsenal_of_the_russian_empire:0 "An Arsenal for the Russian State"
 SOV_arsenal_of_the_russian_empire_desc:0 "Replace the preceding industrial institution with an improved arsenal organisation. Queue two owned industrial-site expansions; production and construction still consume real capacity."
 GER_peacetime_industrial_giants_desc:0 "This institution replaces other stages of the same organisation. Its current effects are shown below; later focus completion cannot restore an earlier stage."
