l_english:
 ENG_ww1_industrial_district_surveys_desc:0 "Inspectors tour the Midlands, Clydeside, Tyneside and Lancashire to list workshops, yards and mines. It grants 15 political power and eases debt by 1; the industrial districts are ready for contracts."
 ENG_ww1_midlands_machine_shops_desc:0 "The machine-tool shops of Birmingham and Coventry take on state contracts. It opens a construction slot and queues an industrial complex in the West Midlands; debt rises by 1."
 ENG_ww1_clyde_shipyard_contracts_desc:0 "The Clyde yards receive hull and engine orders. It opens a slot and queues a dockyard in Strathclyde; debt rises by 1."
 ENG_ww1_tyne_steel_and_ordnance_desc:0 "Armstrong and Vickers expand steel and ordnance on the Tyne. It opens a slot and queues an arms factory in Northern England; debt rises by 1."
 ENG_ww1_lancashire_engineering_desc:0 "Lancashire's locomotive and loom works convert part of their capacity to heavy machinery. It opens a slot and queues an industrial complex in the North-West; labour support +1."
 ENG_ww1_the_city_credit_market_desc:0 "The City of London finances the government through bonds and accepts bills from allies. Debt falls by 2 and it grants 15 political power."
 ENG_ww1_railway_freight_coordination_desc:0 "The Railway Executive Committee coordinates freight and expands London-Southampton link. Establishes Railway Executive (supply consumption -2%), level 2 railway and 10 political power."
 ENG_ww1_domestic_coal_allocation_desc:0 "Welsh coal underpins industry, the fleet and exports. Adds 1 infrastructure level in Wales, industrial complex in Yorkshire and Coal Allocation institution."
 ENG_ww1_national_munitions_contracts_desc:0 "National contracts expand Woolwich and Birmingham with two arms factories. Munitions Contracts institution (capacity +1.5%); debt rises by 2."
 ENG_ww1_the_ministry_of_munitions_desc:0 "Lloyd George takes charge of war production in May 1915. Establishes Ministry of Munitions (industrial capacity +4%, maximum efficiency +2.5%); labour support -3."
 ENG_ww1_shell_inspection_boards_desc:0 "Inspectors reorganise shell production in Sheffield with an arms factory in Yorkshire. Shell Inspection institution."
 ENG_ww1_wartime_labour_dilution_desc:0 "The 1915 Treasury Agreement allows women and unskilled hands in technical posts. Labour Dilution institution; labour support -4."
 ENG_ww1_the_shop_stewards_agreement_desc:0 "Shop stewards gain a voice in war plants. Establishes Labour Compact and labour support +6."
 ENG_ww1_emergency_factory_controls_desc:0 "The state takes direct control of hiring and plant wages. Establishes Emergency Controls; labour support -6."
 ENG_ww1_the_ministry_of_food_desc:0 "The Ministry of Food is born in December 1916. The government must choose between compulsory rationing and a voluntary appeal. Debt rises by 1."
 ENG_ww1_austerity_and_public_credit_desc:0 "War taxes and forced loans ease pressure on public credit. Debt falls by 3, labour support falls by 2 and it grants 10 political power. Unlocks the war savings campaign decision."
 ENG_ww1_debt_service_commission_desc:0 "A commission organises service of the war debt. Debt falls by 4, but the spending squeeze costs 1% stability."
 ENG_ww1_convert_the_war_plants_desc:0 "After the armistice, munition plants return to machines and locomotives. It grants 20 political power, 2% stability and labour support +3."
 ENG_ww1_housing_and_civilian_employment_desc:0 "The Addison Act builds homes for veterans with an industrial complex in the East Midlands. Establishes Housing Programme; debt rises by 3 and labour support +4."
 ENG_ww1_the_peace_administration_office_desc:0 "A civil office takes charge of the transition from war to peace. It grants 15 political power and opens the reconstruction steps."
 ENG_ww1_military_demobilisation_planning_desc:0 "Lists by age, trade and length of service organise the soldiers' return. It grants 10 political power and 1% stability."
 ENG_ww1_shipping_repatriation_coordination_desc:0 "Transports carry troops home from France, the Middle East and the Dominions. Debt rises by 1 and stability rises by 1%."
 ENG_ww1_veterans_welfare_register_desc:0 "A national register links each veteran to pension and employment. Grants Veterans' Settlement; stability +1% and debt +1."
 ENG_ww1_disability_pension_administration_desc:0 "Hundreds of thousands of disabled men and widows receive regular pensions. Grants 10 political power, stability rises by 2% and labour support +4; debt rises by 2."
 ENG_ww1_civilian_training_for_returning_soldiers_desc:0 "Technical schools and workshops retrain ex-soldiers for civilian jobs. It grants 10 political power and labour support +2."
 ENG_ww1_public_housing_contracts_desc:0 "Local authorities sign contracts to build council housing with state subsidies, expanding infrastructure in the Midlands. Debt rises by 2, labour support +3 and 1% stability."
 ENG_ww1_industrial_conversion_planning_desc:0 "Plans to convert steel and chemicals to civilian use organise peacetime priorities. Industrial Conversion institution (consumer goods -2%)."
 ENG_ww1_the_employment_exchanges_desc:0 "Labour exchanges match the unemployed with vacancies across the country. Labour support +3 and 1% stability."
 ENG_ww1_restore_civilian_railway_traffic_desc:0 "The companies regain control of civilian lines. Grants 15 political power, stability +1% and demobilises state railway control; debt +1."
 ENG_ww1_public_debt_repayment_desc:0 "The Treasury uses revenue to redeem war bonds. Debt falls by 5 and labour support falls by 2 because of the fiscal squeeze."
 ENG_ww1_treasury_expenditure_review_desc:0 "The Economy Committee reviews every department. Debt falls by 3, it grants 10 political power and labour support falls by 2."
 ENG_ww1_merchant_marine_renewal_desc:0 "The merchant marine lost millions of tons in the war. It queues an extra dockyard in Strathclyde (opening a slot); debt rises by 2."
 ENG_ww1_the_public_health_settlement_desc:0 "The 1919 Ministry of Health unites hospitals, insurance and sanitation. Stability +2%, debt +1 and labour support +2."
 ENG_ww1_the_education_reconstruction_programme_desc:0 "The Fisher Act raises the school-leaving age and creates continuation schools. Stability +1% and debt +1."
 ENG_ww1_local_government_finance_desc:0 "Local authorities receive a new formula of rates and grants. Debt falls by 1, it grants 10 political power and labour support falls by 1."
 ENG_ww1_the_industrial_relations_conference_desc:0 "The National Industrial Conference brings employers and unions together to avoid strikes. Labour support +4 and 10 political power."
 ENG_ww1_the_postwar_parliamentary_mandate_desc:0 "With the questions of the peace settled, the government seeks a clear mandate in Parliament. Stability +2% and 25 political power."
 ENG_ww1_the_nineteen_twenty_two_cabinet_desc:0 "The fall of the coalition in October 1922 brings Bonar Law to power. The new cabinet inherits cuts and strikes already in motion."
 ENG_ww1_the_nineteen_twenty_three_settlement_desc:0 "Baldwin tries to stabilise finance and politics with the American debt settled. It grants 15 political power and debt falls by 2."
 ww1_britain_eco.1.t:0 "The Clydeside Rent Strikes"
 ww1_britain_eco.1.d:0 "Landlords raise rents near the war factories of Glasgow. Working women and soldiers' wives picket evictions, and shop stewards threaten to stop the Clyde."
 ww1_britain_eco.1.a:0 "Freeze rents by law."
 ww1_britain_eco.1.b:0 "Break the strike and jail the leaders."
 ww1_britain_eco.3.t:0 "Food Rationing"
 ww1_britain_eco.3.d:0 "U-boats cut wheat and sugar imports, and the queues grow. The Ministry of Food can impose compulsory rationing or ask for voluntary restraint."
 ww1_britain_eco.3.a:0 "Impose compulsory rationing."
 ww1_britain_eco.3.b:0 "Appeal for voluntary restraint."
 ww1_britain_eco.5.t:0 "The Geddes Axe"
 ww1_britain_eco.5.d:0 "The Geddes Committee proposes deep cuts in military, education and housing spending. Economists call for balance; unions and veterans promise resistance."
 ww1_britain_eco.5.a:0 "Accept every cut."
 ww1_britain_eco.5.b:0 "Accept half."
 ww1_britain_eco.5.c:0 "Refuse the cuts."
 ww1_britain_eco.6.t:0 "Black Friday for the Miners"
 ww1_britain_eco.6.d:0 "With state control of the mines ended, owners cut wages. The Triple Alliance of miners, railwaymen and transport workers threatens a general strike, and the government's allies hesitate."
 ww1_britain_eco.6.a:0 "Back the mine owners."
 ww1_britain_eco.6.b:0 "Subsidise wages for some months."
 ww1_britain_eco.10.t:0 "British Coal for the Allies"
 ww1_britain_eco.10.d:0 "London offers shiploads of coal to keep allied factories, railways and fleets running. The price is credit and tonnage that the British merchant marine could also use."
 ww1_britain_eco.10.a:0 "Accept the coal."
 ww1_britain_eco.10.b:0 "Decline the offer."
 ENG_ww1_railway_executive:0 "Railway Executive"
 ENG_ww1_railway_executive_desc:0 "The railway companies run under one direction."
 ENG_ww1_coal_allocation:0 "Coal Allocation"
 ENG_ww1_coal_allocation_desc:0 "Industry has priority over household use."
 ENG_ww1_munitions_contracts:0 "Munitions Contracts"
 ENG_ww1_munitions_contracts_desc:0 "Many suppliers, uneven quality."
 ENG_ww1_shell_inspection:0 "Shell Inspection"
 ENG_ww1_shell_inspection_desc:0 "Defective lots are rejected before shipment."
 ENG_ww1_labour_dilution:0 "Labour Dilution"
 ENG_ww1_labour_dilution_desc:0 "Women and unskilled hands fill skilled posts."
 ENG_ww1_food_control:0 "Food Control"
 ENG_ww1_food_control_desc:0 "Prices and rationing under the Ministry of Food."
 ENG_ww1_industrial_conversion:0 "Industrial Conversion"
 ENG_ww1_industrial_conversion_desc:0 "War industry returns to civilian use."
 ENG_ww1_coal_to_allies:0 "Ship Coal to the Allies"
 ENG_ww1_coal_to_allies_desc:0 "Spend 15 political power. At war, offer coal to each member of the British faction; each one that accepts gains 2% stability and British debt rises by 1 per acceptance. Requires the coal allocation."
 ENG_ww1_war_savings_drive:0 "War Savings Campaign"
 ENG_ww1_war_savings_drive_desc:0 "Spend 20 political power. Debt falls by 2 and labour support falls by 1 from the sacrifice asked. Requires the austerity measures."
