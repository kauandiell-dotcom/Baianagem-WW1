l_english:
 ENG_ww1_edward_grey_and_the_entente_desc:0 "Sir Edward Grey conducts foreign policy through the Entente Cordiale without signing a formal alliance. It grants 15 political power; the understandings with France and Russia stay under his direction."
 ENG_ww1_the_french_naval_understanding_desc:0 "In 1912 the Royal Navy concentrates in the North Sea and the French fleet in the Mediterranean. It grants 4 naval experience and proposes the understanding to France, which may accept or decline."
 ENG_ww1_french_staff_conversations_desc:0 "British and French officers quietly study how an expeditionary force could reach France. It grants 5 army experience; no formal commitment is made."
 ENG_ww1_belgian_treaty_obligations_desc:0 "The 1839 Treaty guarantees Belgian neutrality. It grants 10 political power and 1% stability; if the continental policy is active, the guarantee to Belgium is renewed."
 ENG_ww1_channel_expeditionary_coordination_desc:0 "Ports, railways and transports are prepared to send the British Expeditionary Force to France. It grants 5 army experience."
 ENG_ww1_russian_procurement_liaison_desc:0 "London offers credit and arms to Russia, which pays in grain and raw materials. Debt rises by 1; Russia decides whether to accept."
 ENG_ww1_neutral_shipping_assurances_desc:0 "The Declaration of London and assurances to neutral ships reduce friction with the United States and the Northern countries. Debt falls by 1 and it grants 5 political power."
 ENG_ww1_american_credit_negotiations_desc:0 "New York banks finance British purchases of munitions and food. London makes the request; the United States decides whether to grant the credit."
 ENG_ww1_italian_coalition_talks_desc:0 "London offers Italy the Trentino, Trieste and Dalmatia in exchange for entering the war. Italy decides whether to hear the terms; the answer is recorded."
 ENG_ww1_the_portuguese_connection_desc:0 "The 1373 alliance is the oldest in Europe. London asks for access to ports and colonies; Lisbon decides whether to renew its obligations."
 ENG_ww1_balkan_allied_coordination_desc:0 "Serbia, Greece and Romania receive an offer of coordinated supply and transport. Each decides."
 ENG_ww1_coalition_shipping_priorities_desc:0 "An allied council decides which cargoes come first: troops, munitions, wheat or coal. Debt falls by 1 and it grants 3 naval experience."
 ENG_ww1_the_supreme_war_council_desc:0 "After Caporetto, the Allies create a Supreme War Council at Versailles. The question is whether command becomes unified."
 ENG_ww1_armistice_consultations_desc:0 "The Allies discuss the terms of the armistice. London decides whether to press for moderate or hard terms on the defeated."
 ENG_ww1_reconstruction_credit_negotiations_desc:0 "Restructuring the war debt depends on who lent. With American credit granted, debt falls by 3; without it, it rises by 2. It grants 10 political power."
 ENG_ww1_the_naval_disarmament_conference_desc:0 "Washington, 1921: the United States proposes limits on battleship construction. London decides whether to accept naval parity."
 ENG_ww1_a_european_security_settlement_desc:0 "Locarno and the League of Nations seek to guarantee the western frontier. It grants 20 political power and 1% stability."
 ENG_ww1_the_national_physical_laboratory_desc:0 "The Teddington laboratory standardises measures, alloys and instruments. A one-use research bonus of 25% on industrial technology."
 ENG_ww1_university_military_contracts_desc:0 "Cambridge, Manchester and Imperial College sign research contracts with the government. It grants 10 political power and a one-use 25% research bonus on electronics."
 ENG_ww1_ordnance_metallurgy_research_desc:0 "Woolwich and the steelworks study alloys for barrels and shells. A one-use 25% research bonus on artillery."
 ENG_ww1_machine_tool_standards_desc:0 "Tool and gauge standards let parts be swapped between factories. A one-use 25% research bonus on engineering."
 ENG_ww1_railway_engineering_standards_desc:0 "Gauges, bridges and locomotives follow common standards, expanding the railway trunk between Birmingham and Manchester. A 25% research bonus on logistics and level 2 railway built."
 ENG_ww1_naval_architecture_research_desc:0 "The Haslar test tank tests hulls and propellers. A one-use 25% research bonus on destroyers."
 ENG_ww1_explosive_safety_research_desc:0 "Storage and manufacturing rules reduce explosions in cordite factories. Stability +1% and a one-use 25% research bonus on infantry weapons."
 ENG_ww1_field_wireless_research_desc:0 "Portable sets and field valves for the Signal Service. A one-use 25% research bonus on signals."
 ENG_ww1_signals_intelligence_organisation_desc:0 "The Admiralty and War Office pool wireless and cable intercepts in one office. It grants 10 political power and opens the Room 40 office."
 ENG_ww1_the_room_forty_office_desc:0 "Room 40 reads German naval codes and global intercepts. Room 40 institution (decryption speed +10%)."
 ENG_ww1_aerial_photography_research_desc:0 "Aircraft cameras map trenches and batteries. A one-use 25% research bonus on reconnaissance."
 ENG_ww1_artillery_survey_mathematics_desc:0 "Mathematicians and surveyors calculate range, wind and barrel wear. It grants 5 army experience."
 ENG_ww1_chemical_protection_research_desc:0 "After the first gas attack, scientists devise respirators and treatments. A one-use 25% research bonus on medical services."
 ENG_ww1_the_landships_technical_committee_desc:0 "The Landships Committee of 1915 funds the first tanks. It grants 5 army experience; debt rises by 1. No tank is delivered by this focus."
 ENG_ww1_aircraft_engine_research_desc:0 "Rolls-Royce and the Royal Aircraft Factory test more reliable engines. A one-use 25% research bonus on air equipment."
 ENG_ww1_hydrophone_analysis_laboratory_desc:0 "The Hawkcraig laboratory analyses submarine noises on hydrophones. A one-use 25% research bonus on torpedoes and underwater weapons."
 ENG_ww1_production_quality_standards_desc:0 "Quality standards reduce scrap and accidents in war factories. It grants 10 political power and 1% stability."
 ENG_ww1_the_postwar_research_council_desc:0 "The Department of Scientific and Industrial Research survives demobilisation. Grants 15 political power and a 25% bonus on industrial tech; debt rises by 1."
 ENG_ww1_industrial_patent_exchanges_desc:0 "Confiscated German patents are licensed to British firms. Grants 15 political power, 25% electronics bonus and debt falls by 1."
 ENG_ww1_technical_education_for_reconstruction_desc:0 "Technical schools qualify workers for peaceful reconstruction. Grants 15 political power, 2% stability and a 25% engineering tech bonus."
 ww1_britain_dip.2.t:0 "The Supreme War Council"
 ww1_britain_dip.2.d:0 "After Caporetto, British, French and Italians create a council at Versailles. Generals debate whether one Allied command is better than six national staffs."
 ww1_britain_dip.2.a:0 "Accept a unified Allied command."
 ww1_britain_dip.2.b:0 "Keep the British command independent."
 ww1_britain_dip.3.t:0 "The Terms of the Armistice"
 ww1_britain_dip.3.d:0 "Foch and the governments discuss what to demand of Germany. Lloyd George fears a prolonged blockade and social collapse; public opinion demands punishment."
 ww1_britain_dip.3.a:0 "Press for moderate terms."
 ww1_britain_dip.3.b:0 "Press for hard terms."
 ww1_britain_dip.4.t:0 "The Washington Naval Conference"
 ww1_britain_dip.4.d:0 "The United States proposes a 5:5:3 ratio for capital ships. The Admiralty resists, but the Treasury cannot sustain a naval race."
 ww1_britain_dip.4.a:0 "Accept naval parity."
 ww1_britain_dip.4.b:0 "Refuse the limits."
 ww1_britain_dip.10.t:0 "A British Request for Credit"
 ww1_britain_dip.10.d:0 "The British ambassador asks American banks to finance purchases of munitions, wheat and cotton. Wall Street is willing; the government is split between neutrality and commercial interest."
 ww1_britain_dip.10.a:0 "Grant the credit."
 ww1_britain_dip.10.b:0 "Decline."
 ww1_britain_dip.11.t:0 "London's Offer"
 ww1_britain_dip.11.d:0 "Sonnino and Salandra receive London's terms: the Trentino, South Tyrol, Trieste, Istria and part of Dalmatia in exchange for joining the Entente. Vienna makes a rival, smaller offer."
 ww1_britain_dip.11.a:0 "Hear London's terms."
 ww1_britain_dip.11.b:0 "Keep the Triple Alliance for now."
 ww1_britain_dip.12.t:0 "The Oldest Alliance"
 ww1_britain_dip.12.d:0 "London invokes the Treaty of Windsor of 1386 and asks for access to Portuguese ports and colonies. Lisbon fears Germany in its African colonies and seeks guarantees of protection."
 ww1_britain_dip.12.a:0 "Renew the alliance obligations."
 ww1_britain_dip.12.b:0 "Remain neutral."
 ww1_britain_dip.13.t:0 "British Munitions Credit"
 ww1_britain_dip.13.d:0 "London offers arms and credit to the Russian army, which pays in wheat, flax and timber. Delivery depends on ports on the Baltic and the Arctic."
 ww1_britain_dip.13.a:0 "Accept the credit."
 ww1_britain_dip.13.b:0 "Decline."
 ww1_britain_dip.14.t:0 "The Anglo-French Naval Understanding"
 ww1_britain_dip.14.d:0 "London proposes that the Royal Navy guard the Channel and the North Sea while the French fleet guards the Mediterranean. Paris agrees but wants to know how far the British commitment goes."
 ww1_britain_dip.14.a:0 "Accept the division of areas."
 ww1_britain_dip.14.b:0 "Decline the commitment."
 ww1_britain_dip.15.t:0 "Supplies for the Balkans"
 ww1_britain_dip.15.d:0 "London offers to coordinate allied transport and supply for the local army through Greek ports and Romanian and Serbian railways."
 ww1_britain_dip.15.a:0 "Accept the coordination."
 ww1_britain_dip.15.b:0 "Decline."
 ENG_ww1_room_forty:0 "Room 40"
 ENG_ww1_room_forty_desc:0 "Admiralty cryptanalysts read German naval codes."
 ENG_ww1_renew_american_credit:0 "Renew the American Credit"
 ENG_ww1_renew_american_credit_desc:0 "Spend 20 political power. At war, repeat the credit request to the United States, which may grant or decline. Requires the first credit to have been granted."
