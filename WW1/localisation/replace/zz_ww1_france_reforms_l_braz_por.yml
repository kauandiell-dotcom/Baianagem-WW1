l_braz_por:
 FRA_ww1_eight_hour_day:0 "Acordo da jornada de oito horas"
 FRA_ww1_eight_hour_day_desc:0 "Uma jornada menor fortalece o acordo social e aumenta a parcela da produção destinada à vida civil."
 FRA_ww1_workers_councils:0 "Conselhos de fábrica negociados"
 FRA_ww1_workers_councils_desc:0 "A participação dos trabalhadores melhora a coordenação, mas as negociações exigem atenção política."
 FRA_ww1_employer_compact:0 "Pacto industrial"
 FRA_ww1_employer_compact_desc:0 "Um pacto dirigido pelos empregadores coordena a produção ao custo de novas tensões sociais."
 FRA_ww1_bank_credit:0 "Crédito de mobilização"
 FRA_ww1_bank_credit_desc:0 "O crédito acelera os investimentos temporariamente; cumprir o compromisso exige produção civil."
 FRA_ww1_industrial_mobilisation:0 "Arsenais de guerra coordenados"
 FRA_ww1_industrial_mobilisation_desc:0 "A coordenação militar direciona trabalho e investimento à produção de guerra e desacelera o desenvolvimento civil."
 FRA_ww1_rationing:0 "Racionamento de guerra"
 FRA_ww1_rationing_desc:0 "O racionamento prioriza a economia de guerra e impõe um custo político persistente à população civil."
 FRA_ww1_colonial_service:0 "Organização do serviço colonial"
 FRA_ww1_colonial_service_desc:0 "O recrutamento exige treinamento e administração. O serviço colonial amplia a reserva elegível e não cria divisões prontas."
 FRA_ww1_imperial_citizenship:0 "Acordo de cidadania imperial"
 FRA_ww1_imperial_citizenship_desc:0 "A ampliação de direitos exige compromissos administrativos e sociais. O recrutamento continua exigindo equipamento e treinamento."
 FRA_ww1_naval_escorts:0 "Treinamento organizado de escoltas"
 FRA_ww1_naval_escorts_desc:0 "A coordenação beneficia os navios efetivamente designados para proteger as rotas marítimas."
 FRA_ww1_salonika_transport:0 "Administração do transporte para Salônica"
 FRA_ww1_salonika_transport_desc:0 "Uma administração temporária sustenta o teatro distante e reserva capacidade civil."
 FRA_ww1_observation_balloons:0 "Seções de observação e topografia"
 FRA_ww1_observation_balloons_desc:0 "A topografia ajuda na preparação de posições; as seções de observação dependem de abastecimento e proteção."
 FRA_ww1_offensive_school:0 "Escola ofensiva"
 FRA_ww1_offensive_school_desc:0 "Os métodos agressivos trocam flexibilidade defensiva e suprimentos por eficiência ofensiva limitada."
 FRA_ww1_concentration:0 "Cronograma de concentração dos exércitos"
 FRA_ww1_concentration_desc:0 "Um cronograma temporário coordena a mobilização; ele não move divisões nem vence batalhas automaticamente."
 FRA_ww1_fighting_retreat:0 "Retirada organizada em combate"
 FRA_ww1_fighting_retreat_desc:0 "As medidas temporárias protegem a retirada ao custo da iniciativa ofensiva."
 FRA_ww1_field_fortification:0 "Programa de engenharia de campanha"
 FRA_ww1_field_fortification_desc:0 "As posições melhoradas exigem engenharia e esforço logístico."
 FRA_ww1_division_rotation:0 "Cronograma de rendição das divisões"
 FRA_ww1_division_rotation_desc:0 "O descanso e a rendição das unidades apoiam a recuperação e limitam a atividade ofensiva imediata."
 FRA_ww1_allied_staff:0 "Ligação entre estados-maiores aliados"
 FRA_ww1_allied_staff_desc:0 "A ligação temporária melhora a preparação. As unidades e os suprimentos aliados dependem do compromisso de seus respectivos governos."
 FRA_ww1_infantry_training:0 "Organização do treinamento de conscritos"
 FRA_ww1_infantry_training_desc:0 "A administração adicional reduz modestamente o tempo de preparação e utiliza capacidade civil."
 FRA_journee_de_huit_heures_rework_tt:0 "Esta reforma possui um efeito definido de pesquisa, organização ou preparação temporária. Ela não vence uma batalha nem cria homens treinados automaticamente."
