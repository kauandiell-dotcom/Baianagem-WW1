 FRA_tirailleurs_senegalais_desc:0 "Organiza o recrutamento e o treinamento colonial. A reserva elegível aumenta por uma única instituição de serviço colonial; equipamento, homens e treinamento continuam necessários."
 FRA_tirailleurs_algeriens_et_goumiers_desc:0 "Amplia a organização do serviço colonial para os contingentes norte-africanos. A instituição existente é utilizada sem acrescentar outro bônus permanente ao exército."
 FRA_dreadnoughts_classe_courbet_desc:0 "Prepara o programa de construção Courbet: um incentivo de pesquisa específico e um projeto de estaleiro na Provença. Os navios precisam ser projetados e construídos."
 FRA_rupture_de_la_ligne_hindenburg_desc:0 "Estuda e prepara o assalto às posições fortificadas. A reforma melhora temporariamente o aprendizado doutrinário; a linha continua precisando ser rompida no campo de batalha."
