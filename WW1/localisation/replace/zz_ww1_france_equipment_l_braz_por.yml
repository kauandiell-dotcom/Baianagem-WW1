l_braz_por:
 FRA_renault_ft_revolution_desc:0 "Programa de produção e emprego de carros de combate leves. Os projetos franceses recebem uma redução limitada de custo; as melhorias de velocidade e ataque permanecem moderadas. Os equipamentos médios e pesados não recebem desconto de produção."
 FRA_air_supremacy_spad_desc:0 "A coordenação dos caças melhora modestamente a eficiência das missões. As aeronaves continuam precisando de pesquisa, produção, treinamento e emprego no teatro adequado."
 FRA_firepower_doctrine_desc:0 "A coordenação da artilharia e a preparação de posições apoiam as operações defensivas. Os benefícios exigem um exército equipado e abastecido e não interrompem automaticamente uma ofensiva inimiga."
