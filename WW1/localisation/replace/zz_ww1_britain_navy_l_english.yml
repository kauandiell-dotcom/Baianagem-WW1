l_english:
 ENG_ww1_admiralty_fleet_survey_desc:0 "The Admiralty measures the readiness of the fleet and admits what everyone knows: there is no real naval staff. The Admiralty War Staff is born in 1912. It grants 10 political power and the Admiralty War Staff institution (+10% naval experience gain)."
 ENG_ww1_the_naval_estimates_desc:0 "The Admiralty expands the Birkenhead and Cammell Laird yards for the battleship race. It queues 1 dockyard in the North-West; debt rises by 1 and grants 3 naval experience."
 ENG_ww1_dreadnought_construction_planning_desc:0 "The Queen Elizabeth class swaps 13.5-inch guns for 15-inch and coal for oil, a bold gamble. Debt rises by 1 and it grants a one-use 25% research bonus on battleships."
 ENG_ww1_battlecruiser_squadron_planning_desc:0 "Beatty commands a fast squadron of big guns and thin hulls, built to hunt German cruisers. It grants 2 naval experience and a one-use 25% research bonus on battlecruisers."
 ENG_ww1_destroyer_flotilla_planning_desc:0 "Harland & Wolff and yards in Belfast receive orders for destroyers. It queues 1 dockyard in Northern Ireland, grants 2 naval experience and a one-use 25% research bonus on destroyers."
 ENG_ww1_submarine_service_development_desc:0 "The E-class submarines are meant for coastal defence and watching the German Bight, not for commerce raiding. It grants 1 naval experience and a one-use 25% research bonus on submarines."
 ENG_ww1_naval_gunnery_calibration_desc:0 "The fire-control tables of Dreyer and Pollen promise hits at nearly 15 kilometres. It grants 3 naval experience and a one-use 25% research bonus on naval artillery."
 ENG_ww1_the_north_sea_watch_desc:0 "Old cruisers and armed merchant ships close the gap between Scotland and Norway. It grants the Northern Patrol institution (naval detection +10%) and 2 naval experience."
 ENG_ww1_grand_fleet_maintenance_desc:0 "Scapa Flow and Rosyth gain coastal defences and naval base expansions to shelter the Grand Fleet. Expands naval bases in the Scottish Highlands and Lowlands, Grand Fleet Anchorages institution (naval repair +10%); debt rises by 1."
 ENG_ww1_merchant_shipping_register_desc:0 "The Lloyd's and Board of Trade registers list the merchant ships that can become transports, escorts or hospital ships. It grants 2 naval experience and 1% stability."
 ENG_ww1_maritime_blockade_coordination_desc:0 "The blockade of Germany chokes German trade and irritates the neutrals. It grants 3 naval experience; Germany feels the hunger, and the United States decides whether to protest the Orders in Council."
 ENG_ww1_hydrophone_trials_desc:0 "The Hawkcraig station tests underwater microphones to hear submarine engines. It grants 1 naval experience and a one-use 25% research bonus on anti-submarine warfare."
 ENG_ww1_depth_charge_trials_desc:0 "The Type D depth charge of 1916 is dropped by destroyers on the spot where the submarine dived. It grants 2 naval experience and a one-use 25% research bonus on destroyers."
 ENG_ww1_convoy_system_organisation_desc:0 "In 1917 submarines sink one in four ships that put to sea. Lloyd George presses the Admiralty, which resists forming convoys. It triggers the convoy debate: the choice changes the war in the Atlantic."
 ENG_ww1_escort_refit_contracts_desc:0 "Yards convert old destroyers, sloops and trawlers to escort duty. Debt rises by 1 and it grants a one-use 25% research bonus on destroyers; if the convoy system is already running, it also grants 4 naval experience."
 ENG_ww1_naval_signals_and_direction_finding_desc:0 "Radio stations fix the position of German ships and submarines from the signals they emit. It grants 10 political power and a one-use 25% research bonus on decryption."
 ENG_ww1_mediterranean_convoy_liaison_desc:0 "Allied navies share escort duty in the Mediterranean, where Austrian and German submarines strike. It grants 2 naval experience and proposes cooperation to each naval ally, who decides whether to accept."
 ENG_ww1_the_postwar_fleet_review_desc:0 "With the armistice the Admiralty reviews the fleet: what to keep, what to sell and what to lay up. It grants 15 political power and 2 naval experience; the next step is a choice between saving and learning."
 ENG_ww1_naval_budget_retrenchment_desc:0 "The Treasury cuts the naval budget, retires old battleships and cancels orders. Debt falls by 3; it grants 15 political power and 1% stability. Excludes the technical lessons."
 ENG_ww1_naval_technical_lessons_desc:0 "The Admiralty studies Jutland and the submarine war: safer magazines, deck armour, fire control. Debt rises by 1; it grants 8 naval experience and a one-use 25% research bonus on naval equipment. Excludes the budget cuts."
 ENG_ww1_the_air_battalion_experiments_desc:0 "The Air Battalion of the Royal Engineers tests balloons, airships and aeroplanes at Larkhill. It grants 2 air experience and a one-use 25% research bonus on air equipment."
 ENG_ww1_royal_flying_corps_organisation_desc:0 "The Royal Flying Corps is born in 1912, with a military wing, a naval wing and the Central Flying School at Upavon. It grants the Royal Flying Corps institution (+10% air experience gain) and 2 air experience."
 ENG_ww1_military_pilot_instruction_desc:0 "Officers and sergeants learn to fly at Upavon and Netheravon, with their own aeronaut certificate. It grants 5 air experience and 5 political power."
 ENG_ww1_aerial_reconnaissance_reports_desc:0 "Aerial observation reports enter the army staff manuals. It grants 3 army experience and 2 air experience."
 ENG_ww1_royal_naval_air_service_organisation_desc:0 "In 1914 the naval wing separates and becomes the Royal Naval Air Service, with seaplanes, airships and fighters. It grants 2 naval experience and 3 air experience."
 ENG_ww1_wireless_and_aircraft_observation_desc:0 "Spark wireless sets, though heavy, let the observer correct artillery fire from the air. It grants 2 air experience and a one-use 25% research bonus on electronics."
 ENG_ww1_bristol_scout_trials_desc:0 "The Bristol Scout, small and fast, is the first British aircraft conceived to escort and hunt. It grants 2 air experience and a one-use 25% research bonus on light aircraft."
 ENG_ww1_naval_seaplane_stations_desc:0 "Seaplane stations and anchorages at Calshot, Felixstowe and Great Yarmouth watch the North Sea. Adds 1 naval base level in East Anglia, grants 2 naval experience and 2 air experience."
 ENG_ww1_aircraft_production_contracts_desc:0 "The Royal Aircraft Factory and private firms such as Sopwith, Vickers and Bristol compete for contracts. Debt rises by 1; it grants 5 political power and a one-use 25% research bonus on air equipment."
 ENG_ww1_fighter_squadron_instruction_desc:0 "After the Fokker, fighter squadrons learn to fly in formation and attack as a group, not alone. It grants 4 air experience and a one-use 25% research bonus on light fighters."
 ENG_ww1_artillery_spotting_liaison_desc:0 "Aerial observers and batteries begin to work together, with shared radio codes and maps. It grants 3 army experience and 3 air experience."
 ENG_ww1_night_flying_experiments_desc:0 "Pilots learn to take off and land at night, with flares and signals, to intercept the Zeppelins. It grants 4 air experience and 5 political power."
 ENG_ww1_bomber_range_experiments_desc:0 "Long test flights, with extra tanks and new sights, measure how far a bomber can go. It grants 2 air experience and a one-use 25% research bonus on tactical bombers."
 ENG_ww1_aircraft_engine_reliability_desc:0 "Rolls-Royce Eagle engines and Le Rhône rotaries fail less when parts are standardised and field workshops exist. Debt rises by 1; it grants the Reliable Engines institution (air accidents -15%)."
 ENG_ww1_home_air_defence_coordination_desc:0 "Anti-aircraft guns, searchlights and home defence squadrons protect London and the industrial cities. It grants the Home Air Defence institution (stability +1%) and 5 political power; air raids will cost less war support."
 ENG_ww1_the_independent_air_service_debate_desc:0 "After the Gotha raids on London, General Smuts investigates air defence. The question is whether the Army and the Navy keep separate air services or an independent force is born. It triggers the Smuts Report."
 ENG_ww1_royal_air_force_unification_desc:0 "On 1 April 1918 the Royal Air Force is born, merging the Flying Corps and the Naval Service. It replaces the Royal Flying Corps institution with the Royal Air Force (+15% air experience gain, +5% air mission efficiency). If the independent force was chosen, it grants 10 air experience and costs 10 political power; otherwise it grants 4 air experience and 10 political power."
 ENG_ww1_postwar_aircraft_demobilisation_desc:0 "Thousands of surplus aeroplanes remain. The Aircraft Disposal Company sells the surplus and the RAF shrinks. Debt falls by 2; it grants 10 political power and 1% stability."
 ENG_ww1_civil_aviation_research_desc:0 "The Civil Air Transport Committee studies routes to the Empire and the Continent. Debt falls by 1; it grants 1% stability and a one-use 25% research bonus on air equipment. Excludes the sustainable air force plan."
 ENG_ww1_a_sustainable_air_establishment_desc:0 "Trenchard's memorandum defends a small but permanent RAF, with schools, squadrons in the Empire and its own industry. Debt rises by 1; it grants 10 air experience and 15 political power. Excludes civil aviation research."
 ww1_britain_nav.2.t:0 "The Convoy Debate"
 ww1_britain_nav.2.d:0 "In April 1917 submarines sink nearly one in four ships leaving the islands. The Admiralty fears convoys would be slow, easy targets, but Lloyd George already threatens to walk into the operations room himself."
 ww1_britain_nav.2.a:0 "Adopt the convoy system. (-10 political power; escort efficiency +15%, dockyard capacity -5%)"
 ww1_britain_nav.2.b:0 "Keep the patrols. (+10 political power, naval experience +2, debt +2)"
 ww1_britain_nav.3.t:0 "The Battle of Jutland"
 ww1_britain_nav.3.d:0 "The Grand Fleet and the High Seas Fleet collide off Denmark. The British lose more ships, yet the German fleet returns to port and never again seeks a decisive battle. The Admiralty communique reads like a defeat."
 ww1_britain_nav.3.a:0 "Publish Jellicoe's sober report. (naval experience +5, war support -1%)"
 ww1_britain_nav.3.b:0 "Stress the German flight to port. (+15 political power, war support +1%)"
 ww1_britain_nav.4.t:0 "Zeppelins over England"
 ww1_britain_nav.4.d:0 "German airships drop bombs on Great Yarmouth and King's Lynn and later on London. Few die, but panic is wide. The newspapers ask where the Navy and the Army are."
 ww1_britain_nav.4.a:0 "Order the blackout and trust the guns. (war support -1%, stability -0.5%)"
 ww1_britain_nav.4.b:0 "Recall squadrons from the Continent for home defence. (-10 political power, air experience +2)"
 ww1_britain_nav.5.t:0 "The Gotha Raids"
 ww1_britain_nav.5.d:0 "Gotha bombers strike London in broad daylight in June 1917, killing over a hundred people. Public fury is immense and the factories ask for protection. The cabinet demands answers."
 ww1_britain_nav.5.a:0 "Reorganise the defence of London. (-15 political power; war support falls only 0.5% with home air defence, otherwise 2%)"
 ww1_britain_nav.5.b:0 "Appoint General Smuts to investigate. (-10 political power)"
 ww1_britain_nav.6.t:0 "The Smuts Report"
 ww1_britain_nav.6.d:0 "Smuts concludes that air warfare will in future be an operation independent of sea and land. The Army and the Navy resist losing their aircraft, and the Air Council needs a decision."
 ww1_britain_nav.6.a:0 "Create an independent air service. (-10 political power; war support +1% if the Smuts commission was appointed)"
 ww1_britain_nav.6.b:0 "Keep the Flying Corps and the Naval Service separate. (+10 political power)"
 ww1_britain_nav.10.t:0 "The Hunger Blockade"
 ww1_britain_nav.10.d:0 "The Royal Navy closes the North Sea and the Channel. Grain, fertiliser, saltpetre and rubber stop arriving. In German cities bread and potatoes run short and food queues grow."
 ww1_britain_nav.10.a:0 "Ration bread and potatoes. (stability -1%, war support -1%)"
 ww1_britain_nav.10.b:0 "Blame British piracy in the neutral press. (stability -1.5%, war support +1%)"
 ww1_britain_nav.11.t:0 "The Orders in Council"
 ww1_britain_nav.11.d:0 "The British search American ships at Kirkwall and seize cargoes bound for Holland and Scandinavia. Cotton and copper exporters complain, but New York banks profit from Allied orders."
 ww1_britain_nav.11.a:0 "Protest firmly in London. (+10 political power; British stability -1%, British debt +1)"
 ww1_britain_nav.11.b:0 "Accept the blockade and keep trading. (stability +1%)"
 ww1_britain_nav.12.t:0 "Escorts in the Mediterranean"
 ww1_britain_nav.12.d:0 "London proposes to share convoy escort in the Mediterranean: Allied destroyers cover Malta, Brindisi and Salonika while the British cover Egypt. Enemy submarines sink ships every week."
 ww1_britain_nav.12.a:0 "Accept the cooperation. (naval experience +2; British naval experience +2)"
 ww1_britain_nav.12.b:0 "Decline. (no effects)"
 ENG_ww1_admiralty_war_staff:0 "Admiralty War Staff"
 ENG_ww1_admiralty_war_staff_desc:0 "Staff officers plan the war at sea, not just the next manoeuvre."
 ENG_ww1_northern_patrol:0 "Northern Patrol"
 ENG_ww1_northern_patrol_desc:0 "Old cruisers and armed merchant ships watch the gateway to the Atlantic."
 ENG_ww1_grand_fleet_anchorage:0 "Grand Fleet Anchorages"
 ENG_ww1_grand_fleet_anchorage_desc:0 "Scapa Flow and Rosyth give the Grand Fleet shelter, coal and workshops."
 ENG_ww1_convoy_system:0 "Convoy System"
 ENG_ww1_convoy_system_desc:0 "Merchant ships travel in groups under escort. Escorts are more effective, but the yards spend capacity on escort vessels."
 ENG_ww1_royal_flying_corps:0 "Royal Flying Corps"
 ENG_ww1_royal_flying_corps_desc:0 "A new arm of wood and fabric, learning on every flight."
 ENG_ww1_engine_reliability:0 "Reliable Engines"
 ENG_ww1_engine_reliability_desc:0 "Standard parts and field workshops reduce engine failures."
 ENG_ww1_home_air_defence:0 "Home Air Defence"
 ENG_ww1_home_air_defence_desc:0 "Guns, searchlights and watchers protect London. The public sleeps a little easier."
 ENG_ww1_royal_air_force:0 "Royal Air Force"
 ENG_ww1_royal_air_force_desc:0 "The first independent air service in the world, with its own staff, schools and budget."
 ENG_ww1_tighten_the_blockade:0 "Tighten the Blockade"
 ENG_ww1_tighten_the_blockade_desc:0 "Spend 25 political power. At war with Germany, Germany suffers a new shortage (stability and war support fall), debt rises by 1 and it grants 1 naval experience. Can be used three times, eight months apart."
 ENG_ww1_lend_escort_flotillas:0 "Share Escort Flotillas"
 ENG_ww1_lend_escort_flotillas_desc:0 "Spend 20 political power. At war, repeats the joint escort offer to each naval ally in the faction, who decides whether to accept. Requires the Mediterranean cooperation."
 ENG_ww1_fund_home_air_defence:0 "Fund Home Air Defence"
 ENG_ww1_fund_home_air_defence_desc:0 "Spend 30 political power. At war, war support +1%, debt +1 and 2 air experience. Available once a year after the home air defence coordination."
 ENG_ww1_services_policy:0 "Armed Services Policy"
 ENG_ww1_services_policy_desc:0 "Decisions tied to the Navy, the Air Force and the Army: blockade, escorts, air defence and staff work."
