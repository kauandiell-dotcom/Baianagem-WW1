l_braz_por:
 ww1_germany_events.100.t:0 "Um conselho de guerra na OHL"
 ww1_germany_events.100.d:0 "O Estado-Maior exige autoridade sobre as prioridades estratégicas e as demandas impostas à indústria. Concentrar o comando pode reduzir atrasos no planejamento, mas os ministros alertam que o exército não pode governar salários, alimentos e confiança pública por decreto. O Kaiser continua chefe de Estado; a questão é quem dirige a guerra."
 ww1_germany_events.100.a:0 "Confiar a coordenação da guerra à OHL."
 ww1_germany_events.100.b:0 "Exigir que o comando responda ao gabinete."
 ww1_germany_events.101.t:0 "O Reichstag debate uma resolução de paz"
 ww1_germany_events.101.d:0 "Deputados propõem um compromisso público com uma solução negociada. Apoiar a resolução pode recuperar a confiança dos exaustos pela guerra, mas expõe divergências sobre anexações e objetivos militares. Uma declaração parlamentar não silencia os canhões: os governos estrangeiros ainda precisam concordar em negociar."
 ww1_germany_events.101.a:0 "Aprovar a resolução."
 ww1_germany_events.101.b:0 "Rejeitar limites aos objetivos de guerra."
 ww1_germany_events.102.t:0 "Instrutores alemães para o exército otomano"
 ww1_germany_events.102.d:0 "Berlim propõe uma missão militar limitada: exercícios de estado-maior, instrução de oficiais e intercâmbio de métodos operacionais. Aceitá-la exige esforço administrativo e confiança política. Os instrutores trazem experiência, não um exército ou um carregamento de fuzis, e a missão não nos obriga a entrar em guerra."
 ww1_germany_events.102.a:0 "Autorizar a missão de treinamento."
 ww1_germany_events.102.b:0 "Manter o controle da instrução militar."
 ww1_germany_events.103.t:0 "Resposta de Constantinopla sobre Treino"
 ww1_germany_events.103.d:0 "O gabinete otomano respondeu ao convite. Se a missão foi aceita, o estado-maior alemão deverá fornecer instrutores e coordenar seis meses de intercâmbio. A recusa encerra a proposta sem alterar as alianças dos dois países."
 ww1_germany_events.103.a:0 "Enviar os instrutores."
 ww1_germany_events.103.b:0 "Respeitar a decisão do gabinete."
 ww1_germany_events.104.t:0 "Uma oferta de aliança de Berlim"
 ww1_germany_events.104.d:0 "A Alemanha oferece ingresso em sua coalizão. É um compromisso com uma posição diplomática comum, com obrigações e riscos muito maiores que os de uma missão de treinamento. A ratificação integra a facção, mas participar de uma guerra em andamento continua sendo uma decisão militar e política separada."
 ww1_germany_events.104.a:0 "Ratificar a aliança."
 ww1_germany_events.104.b:0 "Preservar a neutralidade armada."
 ww1_germany_events.105.t:0 "A aliança otomana foi ratificada"
 ww1_germany_events.105.d:0 "O governo otomano ratificou o acordo e entrou em nossa coalizão. Oficiais de ligação deverão coordenar o planejamento naval e militar, enquanto os governos avaliam suas obrigações. A assinatura não deslocou tropas, criou equipamento ou abriu automaticamente uma nova frente."
 ww1_germany_events.105.a:0 "Iniciar a coordenação da coalizão."
 ww1_germany_events.106.t:0 "Constantinopla preserva sua neutralidade"
 ww1_germany_events.106.d:0 "O gabinete otomano recusou o ingresso na coalizão. O comércio e os contatos militares podem continuar quando as circunstâncias permitirem, mas não podemos considerar uma aliança concluída apenas por enviar um convite. O planejamento deve prosseguir sem presumir participação otomana."
 ww1_germany_events.106.a:0 "Rever nossas premissas diplomáticas."
 ww1_germany_events.16.t:0 "Uma proposta cifrada da Alemanha"
 ww1_germany_events.16.d:0 "Um telegrama alemão convida o México a explorar uma cooperação caso as relações com os Estados Unidos se deteriorem. A oferta é ambiciosa, mas os ganhos prometidos exigiriam recursos e uma guerra que o governo talvez não consiga sustentar. Discutir a proposta não constitui aliança nem autoriza hostilidades. Sua interceptação teria consequências além desta sala."
 ww1_germany_events.16.a:0 "Explorar a proposta em sigilo."
 ww1_germany_events.16.b:0 "Recusar um compromisso além de nossos meios."
 ww1_germany_events.107.t:0 "O México responde ao telegrama"
 ww1_germany_events.107.d:0 "A embaixada transmitiu a resposta mexicana. A disposição para discutir não garante aliança, apoio financeiro ou participação militar. A recusa nos deixa sem a distração estratégica prevista na proposta. Em qualquer caso, a possibilidade de interceptação da correspondência permanece um risco diplomático grave."
 ww1_germany_events.107.a:0 "Manter expectativas proporcionais à resposta."
 ww1_germany_events.107.b:0 "Encerrar a iniciativa."
 ww1_germany_events.108.t:0 "O telegrama alemão interceptado"
 ww1_germany_events.108.d:0 "Correspondência decifrada revela uma tentativa alemã de explorar cooperação com o México contra interesses americanos. A publicação fortaleceria os que exigem uma resposta mais firme a Berlim. Manter o material em sigilo preservaria espaço diplomático, mas exigiria defender a escolha caso as provas se tornassem públicas. Nenhum dos caminhos constitui declaração de guerra."
 ww1_germany_events.108.a:0 "Publicar as provas."
 ww1_germany_events.108.b:0 "Manter o assunto nos canais diplomáticos."
 ww1_germany_events.54.t:0 "Defesa contra Intervenção Estrangeira"
 ww1_germany_events.54.d:0 "Governos estrangeiros desconfiam de nossa transformação revolucionária. Sua oposição é um risco diplomático, mas não prova que seus exércitos já estejam marchando. O gabinete acompanhará os compromissos e preparará uma política defensiva, julgando as ações de cada governo. Não criaremos uma intervenção declarando nós mesmos a guerra."
 ww1_germany_events.54.a:0 "Manter vigilância diplomática e defensiva."
 ww1_germany_events.70.t:0 "A proposta de ofensiva no Mosa"
 ww1_germany_events.70.d:0 "O estado-maior propõe uma operação concentrada contra a frente fortificada francesa na Champagne e no setor do Mosa. O sucesso exige um avanço real, com materiais de apoio, atenção do comando e entregas industriais comprometidos previamente. As perdas francesas serão determinadas pelo combate. Após o preparo, a operação terá um período limitado para alcançar seu objetivo."
 ww1_germany_events.70.a:0 "Examinar os requisitos de preparação."
 ww1_germany_events.109.t:0 "A operação no Mosa alcança seu objetivo"
 ww1_germany_events.109.d:0 "Nossas forças assumiram o controle do setor designado da Champagne antes do prazo da operação. A concentração planejada pode ser dispersada, e o estado-maior estudará os métodos que funcionaram. O avanço foi conquistado por tropas no mapa; os relatórios registram o resultado sem transformar um sucesso operacional em força nacional ilimitada."
 ww1_germany_events.109.a:0 "Consolidar e examinar as lições."
 ww1_germany_events.110.t:0 "A ofensiva no Mosa está esgotada"
 ww1_germany_events.110.d:0 "O prazo terminou sem controle do setor designado da Champagne. Concentrar mais homens e materiais prolongaria a pressão sem restaurar o plano original. O comando encerrou o esforço especial; as formações precisam de tempo para se reorganizar. A frente continua determinada pelas posições realmente ocupadas."
 ww1_germany_events.110.a:0 "Encerrar o esforço especial e reagrupar."
 ww1_germany_events.75.t:0 "Limited Western Offensive Concentration"
 ww1_germany_events.75.d:0 "O estado-maior coordenou uma concentração temporária de métodos de assalto e entregas para a frente ocidental. O esforço pode ser sustentado por sessenta dias e aumenta a demanda de suprimento. Ele não garante uma ruptura, gera recrutas ou causa perdas inimigas por uma declaração."
 ww1_germany_events.75.a:0 "A Kaiserschlacht começou! Rumo ao Canal!"
 ww1_russia.100.t:0 "A Frente Sudoeste planeja uma ofensiva"
 ww1_russia.100.d:0 "O estado-maior de Brusilov propõe preparações simultâneas ao longo da frente da Galícia, em vez de uma única concentração facilmente identificável. O plano ainda precisa ser abastecido e executado. Materiais de apoio e esforço do comando serão comprometidos durante trinta e cinco dias de preparação; depois teremos sessenta dias para assegurar Stanisławów e Lwów."
 ww1_russia.100.a:0 "Preparar a operação pelas decisões da frente."
 ww1_russia.101.t:0 "O objetivo na Galícia foi assegurado"
 ww1_russia.101.d:0 "Nossas forças controlam Stanisławów e Lwów dentro do prazo da operação. As entregas concentradas podem voltar ao ritmo normal. Os oficiais examinarão os métodos que possibilitaram o avanço; manter as conquistas ainda exige tropas, suprimento e coordenação na frente."
 ww1_russia.101.a:0 "Consolidar as conquistas e transmitir as lições."
 ww1_russia.102.t:0 "A ofensiva na Galícia perde impulso"
 ww1_russia.102.d:0 "A operação terminou sem assegurar os dois objetivos. A concentração especial foi dissolvida, e as formações esgotadas precisam de um período de recuperação. O revés não determina o colapso da Rússia, mas consumiu materiais e prejudicou a confiança no plano."
 ww1_russia.102.a:0 "Recuperar as formações e reavaliar a frente."
 ww1_russia.103.t:0 "Chega uma missão médica russa"
 ww1_russia.103.d:0 "Profissionais e organizadores médicos russos chegaram para cooperar com nossos hospitais militares. A missão pode ajudar a preservar homens experientes que retornam ao serviço nos próximos quatro meses. Seu valor está no atendimento e na coordenação, não em um carregamento imaginário de recrutas ou em uma vitória automática."
 ww1_russia.103.a:0 "Coordenar os hospitais com a missão."
 ww1_russia.40.t:0 "Solicitação de um armistício no leste"
 ww1_russia.40.d:0 "O governo autoriza um pedido de negociações com a Alemanha. Um armistício ainda exige resposta e acordo sobre as condições. Até que isso aconteça, o exército deve manter suas posições: este pedido não encerra a guerra, entrega territórios ou resolve nossa crise interna."
 ww1_russia.40.a:0 "Enviar o pedido e aguardar a resposta."
 GER_eastern_armistice_request_tt:0 "§YSolicita negociações com o Estado russo contra o qual estamos em guerra.§! A paz, mudanças territoriais e recuperação interna exigem um acordo separado."
 SOV_eastern_armistice_request_tt:0 "§YEnvia um pedido de armistício à Alemanha.§! A guerra continua até que os dois lados aceitem as condições."
 GER_ohl_command_contract_tt:0 "A OHL substitui a doutrina anterior do estado-maior. Sua vantagem de planejamento acompanha custos econômicos e políticos civis. O Kaiser permanece chefe de Estado."
 GER_ohl_oversight_tt:0 "Mantém a supervisão civil em vez de acrescentar os espíritos de supremacia da OHL."
 GER_reichstag_resolution_tt:0 "Registra um compromisso com a paz negociada. §YEsta resolução não conclui, por si só, um armistício.§!"
 GER_ottoman_training_only_tt:0 "Um programa de seis meses melhora em §Y10% o ganho de domínio da doutrina terrestre otomana§!. Os dois governos organizam o intercâmbio; §Ynão inclui ingresso em facção, declaração de guerra ou equipamento gratuito§!."
 GER_ottoman_alliance_terms_tt:0 "Participação otomana na facção alemã. §YA participação militar em guerras existentes é uma decisão separada.§!"
 GER_zimmermann_no_automatic_war_tt:0 "Registra a resposta diplomática. §YNenhuma aliança, transferência territorial ou declaração de guerra é automática.§!"
 GER_intervention_watch_tt:0 "Registra uma postura defensiva. A intervenção deve resultar de uma decisão estrangeira real; este evento não declara guerra à Entente."
 GER_michael_temporary_tt:0 "§Y60 dias§! de concentração de métodos ofensivos, com maior demanda de suprimento. Não concede um espírito ofensivo permanente."
 GER_meuse_preparation_tt:0 "Preparação: §Y35 dias§!, §Y30 de poder político§!, §Y40 de poder de comando§! e §Y50 equipamentos de apoio§!. Exige uma reserva de §Y40 peças de artilharia§!. A produção das fábricas diminui §R5%§! durante o preparo. Depois, controlar o setor da Champagne em §Y60 dias§!; a vantagem de ruptura contra o inimigo expira com a operação."
 SOV_southwestern_preparation_tt:0 "Preparação: §Y35 dias§!, §Y30 de poder político§!, §Y40 de poder de comando§! e §Y50 equipamentos de apoio§!. Exige uma reserva de §Y40 peças de artilharia§!. A produção das fábricas diminui §R5%§! durante o preparo. Depois, controlar Stanisławów e Lwów em §Y60 dias§!; a vantagem de ruptura contra o inimigo expira com a operação."
 GER_wartime_operations:0 "Planejamento operacional alemão"
 GER_wartime_operations_desc:0 "Preparar operações concentradas com objetivos, prazos e custos materiais."
 SOV_southwestern_front:0 "A Frente Sudoeste"
 SOV_southwestern_front_desc:0 "Coordenar uma ofensiva limitada na Galícia contra a Áustria-Hungria."
 GER_prepare_meuse_operation:0 "Preparar a operação no Mosa"
 GER_prepare_meuse_operation_desc:0 "Comprometer a atenção do comando, materiais de apoio e trinta e cinco dias de entregas antes do início da operação de sessenta dias."
 GER_meuse_preparation_mission:0 "Concentrar entregas para o Mosa"
 GER_meuse_preparation_mission_desc:0 "O período de preparo deve ser concluído. A paz ou a capitulação cancela a concentração e remove sua penalidade industrial."
 GER_meuse_objective:0 "Assegurar o setor da Champagne"
 GER_meuse_objective_desc:0 "Controlar a Champagne antes do prazo. O sucesso encerra a concentração e produz lições operacionais; o fracasso exige trinta dias de recuperação. A paz ou a capitulação cancela a operação."
 SOV_prepare_southwestern_offensive:0 "Preparar a ofensiva da Frente Sudoeste"
 SOV_prepare_southwestern_offensive_desc:0 "Comprometer a atenção do comando, materiais de apoio e trinta e cinco dias de entregas antes da operação de sessenta dias na Galícia."
 SOV_southwestern_preparation_mission:0 "Concentrar as entregas para a Galícia"
 SOV_southwestern_preparation_mission_desc:0 "Exercícios de estado-maior, materiais de apoio e entregas estão sendo organizados. A paz ou a capitulação cancela a concentração especial."
 SOV_southwestern_objective:0 "Assegurar Stanisławów e Lwów"
 SOV_southwestern_objective_desc:0 "Controlar os dois objetivos em sessenta dias. O sucesso produz lições operacionais; o fracasso encerra a concentração e exige trinta dias de recuperação."
 SOV_aviation_school_program:0 "Programa de escola de aviação militar"
 SOV_aviation_school_program_desc:0 "Uma base institucional inicial para treinar pilotos. Melhorias posteriores substituem esta etapa."
 SOV_aviation_combat_school:0 "Lições de combate no treinamento de pilotos"
 SOV_aviation_combat_school_desc:0 "Lições operacionais melhoram a instrução, mas os métodos experimentais trazem risco de acidentes. Substitui o programa escolar inicial."
 SOV_ace_training_system:0 "Instrução por pilotos experientes"
 SOV_ace_training_system_desc:0 "Pilotos experientes organizam um sistema contínuo de treinamento. Substitui as etapas anteriores da escola de aviação."
 SOV_aerial_recon_network:0 "Rede de reconhecimento aéreo"
 SOV_aerial_recon_network_desc:0 "As observações de aeronaves são organizadas em um serviço de reconhecimento utilizável."
 SOV_air_naval_coordination:0 "Ligação entre observação aérea e naval"
 SOV_air_naval_coordination_desc:0 "Um serviço único de ligação substitui a rede anterior de reconhecimento e melhora a circulação dos relatórios."
 SOV_integrated_air_service:0 "Serviço aéreo imperial integrado"
 SOV_integrated_air_service_desc:0 "As instituições de reconhecimento foram consolidadas em um serviço integrado. As etapas anteriores não permanecem como bônus adicionais."
 SOV_southwestern_preparation:0 "Preparativos da ofensiva sudoeste"
 SOV_southwestern_preparation_desc:0 "Entregas e materiais de apoio são concentrados durante trinta e cinco dias, impondo custos industriais e de suprimento."
 SOV_southwestern_offensive:0 "A oportunidade operacional na Galícia"
 SOV_southwestern_offensive_desc:0 "Uma vantagem de coordenação por sessenta dias contra formações austro-húngaras, acompanhada de maior demanda de suprimento. Removida ao terminar a operação."
 SOV_southwestern_exhaustion:0 "Reorganização da Frente Sudoeste"
 SOV_southwestern_exhaustion_desc:0 "Um período de recuperação de trinta dias após a operação não assegurar seus objetivos."
 SOV_serbian_medical_mission:0 "Cooperação médica russa"
 SOV_serbian_medical_mission_desc:0 "Uma missão médica de quatro meses ajuda a preservar soldados experientes que retornam ao serviço."
 GER_meuse_preparation:0 "Preparativos da ofensiva no Mosa"
 GER_meuse_preparation_desc:0 "Entregas e materiais de apoio são concentrados durante trinta e cinco dias, com custos industriais e de suprimento."
 GER_meuse_offensive:0 "A oportunidade operacional no Mosa"
 GER_meuse_offensive_desc:0 "Uma vantagem limitada de coordenação contra formações francesas. A maior demanda de suprimento dura até o fim da operação."
 GER_meuse_exhaustion:0 "Reorganização das formações do Mosa"
 GER_meuse_exhaustion_desc:0 "Um período de recuperação de trinta dias após a operação não assegurar seu objetivo."
 GER_silent_dictatorship_ohl:0 "Convocar o conselho de guerra da OHL"
 GER_treaty_of_brest_litovsk:0 "Negociar um armistício no leste"
 GER_battle_of_verdun_attrition:0 "Planejar a ofensiva no Mosa"
 SOV_brusilov_breakthrough_1916:0 "Planejar a ofensiva da Frente Sudoeste"
 SOV_red_cross_missions_to_serbia:0 "Uma missão médica para a Sérvia"
 SOV_peace_of_brest_litovsk:0 "Solicitar um armistício no leste"
 SOV_nesterov_aerial_ramming_tactics:0 "Aprender com os experimentos de Nesterov"
 GER_silent_dictatorship_ohl_desc:0 "Debater até onde o comando militar deve alcançar o governo civil durante a guerra. O conselho escolhe entre supremacia militar e supervisão do gabinete; ele não substitui o Kaiser por um general nem produz um sucesso militar."
 GER_reichstag_peace_resolution_desc:0 "Apresentar um compromisso parlamentar com negociações. A aprovação e a rejeição têm consequências políticas diferentes, enquanto o cessar-fogo depende de um acordo separado com o inimigo."
 GER_ottoman_military_mission_sanders_desc:0 "Oferecer uma missão de treinamento de oficiais ao gabinete otomano. A aceitação inicia um programa de seis meses de aprendizagem doutrinária, sem equipamento gratuito ou ingresso automático em nossa facção."
 GER_secret_ottoman_alliance_august_1914_desc:0 "Convidar o governo otomano para uma aliança formal. O gabinete pode ratificar ou recusar; integrar a facção e entrar militarmente na guerra são compromissos distintos."
 GER_treaty_of_brest_litovsk_desc:0 "Procurar o Estado russo contra o qual realmente estamos em guerra e propor negociações de armistício. Nenhum tratado, transferência territorial ou fim da escassez é presumido antes do acordo."
 GER_battle_of_verdun_attrition_desc:0 "Preparar o plano de uma ofensiva concentrada no setor do Mosa e da Champagne. O foco abre decisões operacionais; os suprimentos, a preparação e um avanço real devem produzir o resultado."
 GER_entente_anti_bolshevik_intervention_desc:0 "Avaliar o risco de intervenção estrangeira contra o governo revolucionário e estabelecer vigilância defensiva. As hostilidades devem decorrer de decisões estrangeiras reais."
 SOV_brusilov_breakthrough_1916_desc:0 "Estudar a preparação dispersa e os assaltos coordenados contra a frente austro-húngara. O foco desbloqueia uma operação limitada, com período de preparo e objetivos reais na Galícia. Ele não concede a vitória antecipadamente."
 SOV_red_cross_missions_to_serbia_desc:0 "Financiar uma missão médica e de ligação hospitalar para a Sérvia. A missão exige esforço político e auxilia o destinatário por quatro meses, em vez de conceder população mobilizável ou estabilidade doméstica."
 SOV_peace_of_brest_litovsk_desc:0 "Solicitar negociações com a Alemanha enquanto a guerra no leste continua. O governo adversário precisa responder antes que um armistício ou acordo territorial entre em vigor."
 SOV_kacha_military_flying_school_desc:0 "Construir uma instituição inicial de formação de pilotos. A instrução de combate posterior substitui esta etapa, evitando que as melhorias escolares se acumulem indefinidamente."
 SOV_nesterov_aerial_ramming_tactics_desc:0 "Investigar os primeiros experimentos de combate e incorporar suas lições à instrução dos pilotos. Métodos experimentais trazem riscos; eles não tornam todas as aeronaves universalmente mais letais."
 SOV_kazakov_ace_fighter_groups_desc:0 "Colocar pilotos experientes no centro de um sistema contínuo de treinamento, substituindo as etapas escolares anteriores."
 SOV_lebed_reconnaissance_corps_desc:0 "Organizar os relatórios de observação aérea e apoiar pesquisas de aeronaves de reconhecimento. Instituições posteriores de coordenação substituem a rede inicial."
 SOV_integrated_air_naval_reconnaissance_desc:0 "Ligar observadores aéreos e relatórios da frota por um único serviço de ligação, substituindo a rede anterior de reconhecimento."
 SOV_mastery_of_the_imperial_skies_desc:0 "Consolidar as instituições do serviço aéreo em uma organização integrada. Isso substitui as etapas anteriores de reconhecimento em vez de acrescentar outro bônus amplo de combate."
 SOV_strategic_air_bombardment_doctrine_desc:0 "Estudar as capacidades limitadas das primeiras aeronaves pesadas. O programa apoia a pesquisa de aviões pesados e seis meses de aprendizagem doutrinária aérea."
 SOV_seaplane_carriers_in_the_black_sea_desc:0 "Desenvolver métodos de aviação naval e observação marítima. Apoiar a pesquisa aérea adequada em vez de tratar os primeiros navios de hidroaviões como porta-aviões modernos."
 SOV_trans_siberian_double_tracking_desc:0 "Melhorar para o nível ferroviário dois o trecho Moscou–Perm da linha de bitola larga. As obras dependem do controle dos dois extremos e de passagem aliada."
 SOV_poland_strategic_railway_grid_desc:0 "Conectar Varsóvia, Łódź e Lublin por ligações ferroviárias estratégicas de nível dois onde os extremos permaneçam sob nosso controle."
 SOV_amur_railway_link_desc:0 "Melhorar para o nível dois a ligação ferroviária Khabarovsk–Vladivostok enquanto os dois extremos permanecerem sob nosso controle."
 SOV_arkhangelsk_broad_gauge_conversion_desc:0 "Conectar Petrogrado a Arkhangelsk por uma ferrovia de nível dois e melhorar o porto e as instalações de suprimento reais de Arkhangelsk. As obras exigem controle dos extremos pertinentes."
 SOV_military_railway_battalions_desc:0 "Empregar engenheiros ferroviários no corredor Moscou–Smolensk–Minsk, construindo conexões reais de nível dois sob controle aliado."
 SOV_broad_gauge_streamlining_desc:0 "Elevar ao nível três a ligação Petrogrado–Moscou e transmitir ao estado-maior as lições de transporte militar."

 GER_sealed_train_proposal_tt:0 "Solicita deliberação russa sobre o retorno de exilados políticos. O destinatário decide as consequências; este foco não remove estabilidade nem apoio à guerra."
 SOV_moonsund_mine_barrage_desc:0 "Estudar a defesa por minas no Báltico e treinar o estado-maior naval. A pesquisa de minagem exige Man the Guns; sem esse recurso, o programa apoia a pesquisa de artilharia naval. Nenhum equipamento fictício de minas é criado."

 ww1_germany_events.17.t:0 "O equilíbrio eleitoral no Reichstag"
 ww1_germany_events.17.d:0 "A eleição alterou o equilíbrio entre interesses conservadores e uma oposição parlamentar crescente. O gabinete precisa decidir entre defender um bloco político inflexível ou buscar um acordo mais amplo sobre a legislação de defesa. O resultado afeta a cooperação interna; ele não fortalece o exército por si só."
 ww1_germany_events.17.a:0 "Manter o bloco conservador unido."
 ww1_germany_events.17.b:0 "Governar pelo apelo ao dever patriótico."
 ww1_germany_events.18.t:0 "Uma conferência de estado-maior austro-alemã"
 ww1_germany_events.18.d:0 "Oficiais alemães e austro-húngaros se reúnem para comparar planos de mobilização, procedimentos de ligação e os limites de suas redes ferroviárias. A conferência constrói familiaridade profissional e confiança diplomática. Os exércitos e equipamentos ainda precisam ser preparados por cada governo."
 ww1_germany_events.18.a:0 "Intercambiar os planos de estado-maior."
