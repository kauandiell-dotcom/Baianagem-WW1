l_braz_por:
 ENG_ww1_parliament_act_desc:0 "A Lei do Parlamento de 1911 tira dos Lordes o poder de barrar leis financeiras e limita o veto às demais leis a dois anos. Ganha 25 de poder político, 1% de estabilidade, a tensão irlandesa cai 2 pontos e o caminho da autonomia irlandesa se abre."
 ENG_ww1_national_insurance_desc:0 "O Seguro Nacional de Lloyd George cobre saúde e desemprego de milhões de trabalhadores. Dá a instituição Seguro Nacional (estabilidade +2%, bens de consumo +1%), apoio trabalhista +5 e dívida +1."
 ENG_ww1_the_liberal_cabinet_desc:0 "O gabinete liberal de Asquith depende dos votos irlandeses e trabalhistas para governar. Ganha 15 de poder político; as próximas reformas dependem dessa maioria apertada."
 ENG_ww1_the_lords_and_the_commons_desc:0 "Depois do orçamento de 1909 e das duas eleições de 1910, a convenção constitucional assenta: os Comuns mandam. Ganha 10 de poder político e 1% de estabilidade."
 ENG_ww1_irish_parliamentary_support_desc:0 "O Partido Parlamentar Irlandês de Redmond sustenta a maioria liberal em troca de uma promessa: autonomia para a Irlanda. Ganha 15 de poder político e a tensão irlandesa cai 5, mas a promessa precisa ser cumprida no projeto de lei."
 ENG_ww1_home_rule_bill_desc:0 "Em abril de 1912 Asquith apresenta o Terceiro Projeto de Autonomia. Os Lordes só podem atrasá-lo por dois anos, mas os unionistas do Ulster ameaçam resistir pelas armas. A forma do projeto decide quanto problema virá depois."
 ENG_ww1_ulster_conference_desc:0 "Com o Ulster armado e o exército incerto, o rei convoca líderes de todos os lados para uma conferência. O resultado define se o Ulster será excluído da autonomia."
 ENG_ww1_electoral_registration_desc:0 "A reforma do registro eleitoral acaba com o voto plural e simplifica a inscrição. Ganha 10 de poder político e apoio trabalhista +2."
 ENG_ww1_the_defence_of_the_realm_desc:0 "A Lei de Defesa do Reino, de agosto de 1914, dá ao governo poderes de emergência sobre imprensa, ofício e deslocamentos. Instituição: apoio à guerra +5%, estabilidade -2%, poder político -3%."
 ENG_ww1_wartime_parliamentary_scrutiny_desc:0 "Mesmo em guerra, o Parlamento mantém o direito de interpelar ministros. Ganha a instituição Consulta ao Gabinete (poder político -2,5%), estabilidade +2% e apoio trabalhista +2."
 ENG_ww1_the_coalition_cabinet_desc:0 "A crise dos projéteis e a demissão de Fisher derrubam o gabinete liberal em maio de 1915. O governo precisa decidir se divide o poder com conservadores e trabalhistas."
 ENG_ww1_the_military_service_act_desc:0 "A Lei do Serviço Militar de janeiro de 1916 encerra o voluntariado em toda a Grã-Bretanha e remove a antiga força profissional estrita. Autoriza leis de recrutamento geral, com apoio trabalhista -6 e tensão irlandesa +4."
 ENG_ww1_reserved_civilian_occupations_desc:0 "Mineiros, operários de munição e ferroviários ficam fora do alistamento. Instituição Ofícios Reservados: capacidade industrial +2%, recrutamento -0,15%."
 ENG_ww1_the_war_cabinet_desc:0 "Em dezembro de 1916 a crise de liderança opõe Asquith a Lloyd George. O país escolhe entre um pequeno gabinete de guerra e a reorganização de comitês."
 ENG_ww1_the_franchise_debate_desc:0 "A Conferência do Presidente da Câmara reúne todos os partidos para discutir o voto. Ganha 10 de poder político e apoio trabalhista +3."
 ENG_ww1_representation_of_the_people_desc:0 "A Lei da Representação do Povo de 1918 dá voto a todos os homens e às mulheres acima de 30 anos. Instituição Eleitorado Ampliado (estabilidade +2%, poder político -2%) e apoio trabalhista +8."
 ENG_ww1_the_coalition_election_desc:0 "A eleição de dezembro de 1918 põe à prova a coalizão de guerra: lançar o aval do governo aos candidatos ou disputar como partidos separados."
 ENG_ww1_liberal_reconstruction_desc:0 "Habitação, saúde e educação: o programa de reconstrução de 1919 promete 'uma terra digna dos heróis'. Ganha 25 de poder político e 3% de estabilidade, mas a dívida sobe 3."
 ENG_ww1_the_labour_alternative_desc:0 "Sem maioria conservadora, o Partido Trabalhista aparece como alternativa de governo. Exclui o Acordo Conservador. Ganha o Pacto Trabalhista, apoio trabalhista +10, 10 de poder político e estabilidade -2%."
 ENG_ww1_the_conservative_settlement_desc:0 "O fim da coalizão e a volta dos conservadores trazem cortes de gastos. Exclui a Alternativa Trabalhista. Ganha 20 de poder político e 2% de estabilidade; apoio trabalhista cai 8 e a dívida cai 4."
 ENG_ww1_the_imperial_conference_desc:0 "A Conferência Imperial de 1911 reúne os primeiros-ministros dos domínios em Londres. Ganha 10 de poder político, consentimento dos domínios +8 e abre o debate sobre quem paga a defesa naval."
 ENG_ww1_canadian_defence_consultation_desc:0 "Borden chega ao poder em 1911 contra o pagamento de couraçados para Londres. Consultar o Canadá rende consentimento +3 e dá um pouco mais de liberdade ao domínio."
 ENG_ww1_australian_defence_consultation_desc:0 "A Austrália já tem a sua própria esquadra. Consultá-la rende consentimento +3 e um pouco mais de liberdade ao domínio."
 ENG_ww1_new_zealand_naval_consultation_desc:0 "A Nova Zelândia pagou um couraçado para a Marinha Real em 1909. Consultá-la rende consentimento +3 e um pouco mais de liberdade."
 ENG_ww1_south_african_cooperation_desc:0 "A União Sul-Africana reconcilia bôeres e britânicos, mas a lealdade é frágil. A cooperação rende consentimento +3 e um pouco mais de liberdade."
 ENG_ww1_indian_army_liaison_desc:0 "O Exército Indiano é a reserva imperial. A ligação com o Estado-Maior rende consentimento +2 e permite pedir tropas indianas depois."
 ENG_ww1_colonial_medical_services_desc:0 "Médicos coloniais e hospitais de campanha compartilham experiência contra febres e feridas. Ganha 1% de estabilidade e consentimento +2."
 ENG_ww1_dominion_procurement_offices_desc:0 "Escritórios de compras nos domínios ligam a indústria de Londres a lã, trigo, metais e munições dos domínios. Instituição: capacidade industrial +1,5%, bens de consumo +0,5%. Consentimento +2."
 ENG_ww1_the_mediterranean_stations_desc:0 "Malta, Gibraltar, Chipre e Suez sustentam a frota do Mediterrâneo. Ganha 5 de experiência naval."
 ENG_ww1_singapore_maritime_coordination_desc:0 "Singapura e Hong Kong coordenam a defesa marítima do Extremo Oriente com Austrália e Nova Zelândia. Ganha 4 de experiência naval e consentimento +1."
 ENG_ww1_imperial_troop_transport_desc:0 "Comboios de tropas trazem canadenses, australianos e indianos à Europa e ao Oriente Médio. Instituição Transporte Imperial: escolta de comboios +3%, uso de fábricas civis +1."
 ENG_ww1_the_imperial_war_conference_desc:0 "Em 1917 Londres convoca os domínios para decidir a direção da guerra. Consentimento +6; o formato da participação é decidido em evento."
 ENG_ww1_dominion_war_cabinet_delegates_desc:0 "Delegados dos domínios passam a sentar nas reuniões do gabinete imperial. Ganha 15 de poder político e consentimento +4."
 ENG_ww1_indian_constitutional_consultation_desc:0 "A Declaração Montagu de 1917 promete autogoverno responsável à Índia. Consentimento +3 e a Índia ganha 5% de estabilidade."
 ENG_ww1_colonial_labour_contracts_desc:0 "Trabalhadores da Índia, China e Caribe cavam trincheiras e descarregam navios. Ganha 12.000 de mão de obra, mas o consentimento cai 1 pela forma dos contratos."
 ENG_ww1_a_commonwealth_consultation_charter_desc:0 "A Carta de Consulta transforma o império em uma comunidade de nações com voz própria. Instituição: poder político +3%, bens de consumo +0,5%. Consentimento +5."
 ENG_ww1_the_irish_settlement_conference_desc:0 "A Convenção Irlandesa reúne nacionalistas, unionistas e o governo. O resultado define o rumo da Irlanda: autonomia, partilha ou repressão."
 ENG_ww1_dominion_status_for_ireland_desc:0 "Depois da guerra de independência, o governo precisa escolher entre assinar o tratado do Estado Livre Irlandês ou seguir a repressão."
 ENG_ww1_egyptian_political_negotiations_desc:0 "A revolução de 1919 e a Missão Milner forçam Londres a negociar com os nacionalistas egípcios. Ganha 15 de poder político e o Egito ganha 3% de estabilidade."
 ENG_ww1_imperial_defence_after_the_war_desc:0 "O Comitê de Defesa Imperial revisa a estratégia depois da guerra, com Chanak e o Pacífico no horizonte. Ganha 5 de experiência naval, 15 de poder político e consentimento +3."
 ww1_britain_pol.1.t:0 "O Terceiro Projeto de Autonomia"
 ww1_britain_pol.1.d:0 "Em abril de 1912 Asquith apresenta o Projeto de Governo da Irlanda. O Partido Irlandês, de cujos votos depende a maioria liberal, exige o texto sem exclusões. Os unionistas do Ulster, liderados por Carson, prometem resistir, e os Lordes podem atrasá-lo por dois anos. A forma do projeto decide quanto problema virá depois."
 ww1_britain_pol.1.a:0 "Apresentar o projeto sem exclusões. (tensão irlandesa -8, tensão no Ulster +15)"
 ww1_britain_pol.1.b:0 "Apresentar com uma emenda que permite exclusão por condado. (tensão irlandesa +3, Ulster +4)"
 ww1_britain_pol.1.c:0 "Adiar o projeto até a questão dos Lordes esfriar. (tensão irlandesa +8, Ulster -5, +10 de poder político)"
 ww1_britain_pol.2.t:0 "A Conferência do Palácio de Buckingham"
 ww1_britain_pol.2.d:0 "O rei convoca liberais, conservadores, nacionalistas e unionistas ao palácio para evitar a guerra civil. O ponto de atrito é geográfico: quais condados do Ulster ficam de fora da autonomia e por quanto tempo."
 ww1_britain_pol.2.a:0 "Aceitar a exclusão temporária dos condados do Ulster. (tensão no Ulster -20, tensão irlandesa +10)"
 ww1_britain_pol.2.b:0 "Recusar qualquer exclusão. (tensão no Ulster +10, tensão irlandesa -5)"
 ww1_britain_pol.3.t:0 "A crise dos projéteis e a coalizão"
 ww1_britain_pol.3.d:0 "A falta de projéteis na frente ocidental e a demissão do almirante Fisher deixam o gabinete liberal exposto. Os conservadores de Bonar Law pedem lugar no governo, e o líder trabalhista Henderson aceita entrar."
 ww1_britain_pol.3.a:0 "Formar um governo de coalizão. (+25 de poder político, estabilidade +2%, apoio trabalhista +3)"
 ww1_britain_pol.3.b:0 "Continuar com um gabinete só liberal. (+10 de poder político, estabilidade -2%)"
 ww1_britain_pol.4.t:0 "A crise de dezembro de 1916"
 ww1_britain_pol.4.d:0 "Lloyd George exige um pequeno gabinete de guerra, sem Asquith na presidência dos trabalhos. A alternativa é reorganizar os comitês existentes, sem romper com o primeiro-ministro."
 ww1_britain_pol.4.a:0 "Criar o Gabinete de Guerra. (instituição Gabinete de Guerra, +20 de poder político, apoio trabalhista -2)"
 ww1_britain_pol.4.b:0 "Reorganizar os comitês existentes. (+10 de poder político, estabilidade +2%)"
 ww1_britain_pol.5.t:0 "A eleição do 'cupom'"
 ww1_britain_pol.5.d:0 "Com o armistício assinado, Lloyd George quer um mandato para a paz. O 'cupom' é uma carta de apoio do governo aos candidatos da coalizão; quem fica sem ele enfrenta o eleitorado sozinho."
 ww1_britain_pol.5.a:0 "Emitir o cupom aos candidatos da coalizão. (+25 de poder político, estabilidade +2%, apoio trabalhista -6)"
 ww1_britain_pol.5.b:0 "Disputar como partidos separados. (+5 de poder político, estabilidade -1%, apoio trabalhista +3)"
 ww1_britain_pol.5.c:0 "Adiar as eleições para um mandato de reconstrução. (-20 de poder político, estabilidade -3%)"
 ww1_britain_pol.6.t:0 "A Conferência Imperial de 1911"
 ww1_britain_pol.6.d:0 "Os primeiros-ministros dos domínios discutem com Asquith e Grey a defesa comum. O Almirantado quer uma contribuição em dinheiro; os domínios preferem marinhas próprias, sob comando local em tempo de paz."
 ww1_britain_pol.6.a:0 "Insistir em uma contribuição comum para a Marinha Real. (consentimento -2, dívida -1)"
 ww1_britain_pol.6.b:0 "Aceitar marinhas locais sob coordenação do Almirantado. (consentimento +4, dívida +1)"
 ww1_britain_pol.7.t:0 "Os Voluntários do Ulster e o exército"
 ww1_britain_pol.7.d:0 "Oficiais do exército em Curragh avisam que prefeririam ser demitidos a marchar contra o Ulster. Os Voluntários do Ulster já têm armas vindas da Alemanha. O governo precisa escolher entre disciplina e apaziguamento."
 ww1_britain_pol.7.a:0 "Exigir disciplina do exército. (-25 de poder político, estabilidade -2%, tensão no Ulster -10)"
 ww1_britain_pol.7.b:0 "Aceitar as garantias dos oficiais e não coagir o Ulster. (tensão no Ulster -15, tensão irlandesa +10)"
 ww1_britain_pol.8.t:0 "O Gabinete Imperial de Guerra"
 ww1_britain_pol.8.d:0 "Em 1917 os primeiros-ministros dos domínios chegam a Londres. Lloyd George precisa decidir se eles se sentam no gabinete como pares ou apenas são ouvidos."
 ww1_britain_pol.8.a:0 "Dar assento pleno aos primeiros-ministros. (consentimento +8, -10 de poder político)"
 ww1_britain_pol.8.b:0 "Consultá-los sem dar assento. (consentimento +2, +10 de poder político)"
 ww1_britain_pol.9.t:0 "A Convenção Irlandesa"
 ww1_britain_pol.9.d:0 "Nacionalistas, unionistas do sul e o governo discutem um acordo para a ilha inteira. Carson exige a partilha; Redmond já não fala por todos os nacionalistas. Depois de 1916 e de 1918, o Sinn Féin pesa mais que o Partido Irlandês."
 ww1_britain_pol.9.a:0 "Negociar um acordo de autonomia para toda a ilha. (tensão irlandesa -15, tensão no Ulster +12)"
 ww1_britain_pol.9.b:0 "Partilhar: um parlamento no sul e outro no norte. (tensão irlandesa +5, Ulster -10)"
 ww1_britain_pol.9.c:0 "Impor lei marcial. (tensão irlandesa +10, instituição Repressão Irlandesa)"
 ww1_britain_pol.10.t:0 "O Tratado Anglo-Irlandês"
 ww1_britain_pol.10.d:0 "Depois de dois anos de guerra, Lloyd George, Churchill e Collins negociam em Londres. A oferta é um Estado Livre da Irlanda com status de domínio; seis condados do nordeste permanecem no Reino Unido."
 ww1_britain_pol.10.a:0 "Assinar o Tratado: Estado Livre como domínio. (tensão irlandesa cai para 20, consentimento +5)"
 ww1_britain_pol.10.b:0 "Recusar e continuar a guerra. (tensão irlandesa +15, -20 de poder político)"
 ww1_britain_pol.11.t:0 "A Revolta da Páscoa"
 ww1_britain_pol.11.d:0 "Na segunda-feira de Páscoa, voluntários irlandeses e o Exército dos Cidadãos tomam pontos de Dublin e proclamam uma república. A revolta é esmagada em seis dias, mas a resposta do governo vai decidir o que a Irlanda lembra dela."
 ww1_britain_pol.11.a:0 "Lei marcial e conselhos de guerra. (tensão irlandesa +20, poder político +10)"
 ww1_britain_pol.11.b:0 "Clemência e inquérito civil. (tensão irlandesa +8, -20 de poder político)"
 ww1_britain_pol.12.t:0 "A crise do recrutamento na Irlanda"
 ww1_britain_pol.12.d:0 "A ofensiva alemã de março de 1918 esgota as reservas. O gabinete discute estender o serviço militar à Irlanda. Nacionalistas, a Igreja e os sindicatos prometem resistir, e a greve geral já está marcada."
 ww1_britain_pol.12.a:0 "Estender a lei de serviço militar à Irlanda. (tensão irlandesa +25, fim da isenção irlandesa)"
 ww1_britain_pol.12.b:0 "Aprovar o poder de aplicar a lei, sem usá-lo por ora. (tensão irlandesa +8, -10 de poder político)"
 ww1_britain_pol.12.c:0 "Retirar a proposta. (tensão irlandesa -5, -15 de poder político)"
 ww1_britain_pol.20.t:0 "Um pedido de Londres"
 ww1_britain_pol.20.d:0 "Londres pede voluntários para a frente europeia. O gabinete do domínio pesa a lealdade ao império contra as necessidades da lavoura, da fábrica e das famílias."
 ww1_britain_pol.20.a:0 "Enviar voluntários. (15.000 de mão de obra passam ao Reino Unido; o consentimento britânico sobe +2)"
 ww1_britain_pol.20.b:0 "Manter os homens em casa. (consentimento do Reino Unido -3, estabilidade +1%)"
 ENG_ww1_national_insurance:0 "Seguro Nacional"
 ENG_ww1_national_insurance_desc:0 "Saúde e desemprego cobertos por contribuições de patrões, operários e Estado."
 ENG_ww1_defence_of_the_realm:0 "Defesa do Reino"
 ENG_ww1_defence_of_the_realm_desc:0 "Poderes de emergência sobre imprensa, ofício e deslocamentos."
 ENG_ww1_reserved_occupations:0 "Ofícios reservados"
 ENG_ww1_reserved_occupations_desc:0 "Mineiros, operários de munição e ferroviários ficam fora do alistamento."
 ENG_ww1_enlarged_franchise:0 "Eleitorado ampliado"
 ENG_ww1_enlarged_franchise_desc:0 "Milhões de novos eleitores, homens e mulheres, exigem mais do Parlamento."
 ENG_ww1_dominion_procurement:0 "Compras nos domínios"
 ENG_ww1_dominion_procurement_desc:0 "Escritórios de compras ligam a indústria de Londres às matérias-primas dos domínios."
 ENG_ww1_imperial_sealift:0 "Transporte imperial"
 ENG_ww1_imperial_sealift_desc:0 "Navios mercantes e escoltas ligam a metrópole, os domínios e a Índia."
 ENG_ww1_commonwealth_consultation:0 "Consulta imperial"
 ENG_ww1_commonwealth_consultation_desc:0 "O império passa a ser uma comunidade de nações com voz própria."
 ENG_ww1_empire_policy:0 "Política imperial e irlandesa"
 ENG_ww1_empire_policy_desc:0 "Consultas aos domínios e medidas de emergência na Irlanda. Consentimento dos domínios: [?ww1_britain_dominion_consent|0]. Tensão irlandesa: [?ww1_britain_irish_tension|0]. Tensão no Ulster: [?ww1_britain_ulster_tension|0]."
 ENG_ww1_request_dominion_contingent_CAN:0 "Pedir voluntários a o Canadá"
 ENG_ww1_request_dominion_contingent_CAN_desc:0 "Gasta 20 de poder político. Em guerra, pede a o Canadá que envie 15.000 de mão de obra. Exige a consulta prévia e consentimento acima de 29. O domínio decide; nada é criado, a mão de obra passa de um país ao outro."
 ENG_ww1_request_dominion_contingent_AST:0 "Pedir voluntários a a Austrália"
 ENG_ww1_request_dominion_contingent_AST_desc:0 "Gasta 20 de poder político. Em guerra, pede a a Austrália que envie 15.000 de mão de obra. Exige a consulta prévia e consentimento acima de 29. O domínio decide; nada é criado, a mão de obra passa de um país ao outro."
 ENG_ww1_request_dominion_contingent_NZL:0 "Pedir voluntários a a Nova Zelândia"
 ENG_ww1_request_dominion_contingent_NZL_desc:0 "Gasta 20 de poder político. Em guerra, pede a a Nova Zelândia que envie 15.000 de mão de obra. Exige a consulta prévia e consentimento acima de 29. O domínio decide; nada é criado, a mão de obra passa de um país ao outro."
 ENG_ww1_request_dominion_contingent_SAF:0 "Pedir voluntários a a África do Sul"
 ENG_ww1_request_dominion_contingent_SAF_desc:0 "Gasta 20 de poder político. Em guerra, pede a a África do Sul que envie 15.000 de mão de obra. Exige a consulta prévia e consentimento acima de 29. O domínio decide; nada é criado, a mão de obra passa de um país ao outro."
 ENG_ww1_reconvene_imperial_conference:0 "Reunir nova conferência imperial"
 ENG_ww1_reconvene_imperial_conference_desc:0 "Gasta 30 de poder político. Consentimento dos domínios +6 e dívida +1. Disponível a cada ano depois da primeira conferência."
 ENG_ww1_release_irish_prisoners:0 "Libertar presos irlandeses"
 ENG_ww1_release_irish_prisoners_desc:0 "Gasta 20 de poder político. A tensão irlandesa cai 8 e a tensão no Ulster sobe 4. Exige tensão irlandesa acima de 40."
 ENG_ww1_emergency_suppression:0 "Reprimir a agitação"
 ENG_ww1_emergency_suppression_desc:0 "Gasta 15 de poder político. A tensão irlandesa cai 5, a do Ulster cai 3 e a estabilidade cai 1%. Exige tensão irlandesa acima de 50."
 ENG_ww1_autonomy_consultation:0 "Consulta imperial"
 ww1_britain.3.t:0 "Agita??o na Irlanda"
 ww1_britain.3.d:0 "Pris?es, boatos de recrutamento e a autonomia irlandesa parada levaram a tens?o al?m da administra??o comum. O Castelo de Dublin pergunta se o gabinete vai negociar, reprimir ou esperar. Conciliar custa capital pol?tico; reprimir derruba a tens?o por pouco tempo e deixa ressentimento duradouro; esperar mant?m o problema aberto."
 ww1_britain.3.a:0 "Abrir conversas com os representantes irlandeses. (-30 de poder pol?tico, tens?o cai para 45, institui??o de concilia??o)"
 ww1_britain.3.b:0 "Usar os poderes de emerg?ncia. (tens?o 55, institui??o de repress?o, estabilidade -2%)"
 ww1_britain.3.c:0 "Esperar por uma esta??o mais calma. (tens?o +4, +10 de poder pol?tico)"
 ENG_ww1_cabinet_policy_desc:0 "As dota??es de defesa reservam a administra??o civil e desviam a produ??o entre as armas. Carga da d?vida: [?ww1_britain_debt_burden|0]. Reverter uma pol?tica neutra exige novas consultas; os aliados podem recusar a admiss?o."
