l_english:
 ENG_ww1_parliament_act_desc:0 "The Parliament Act of 1911 strips the Lords of their power over money bills and limits their veto on other bills to a two-year delay. The cabinet gains 25 political power, 1% stability, Irish tension falls by 2 and the road to Irish self-government opens."
 ENG_ww1_national_insurance_desc:0 "Lloyd George's National Insurance covers sickness and unemployment for millions of workers. Replaces City credit with the National Insurance institution (stability +2%, consumer goods +1%), labour support +5 and debt +1."
 ENG_ww1_the_liberal_cabinet_desc:0 "Asquith's Liberal cabinet governs on Irish and Labour votes. It gains 15 political power; the reforms that follow depend on that narrow majority."
 ENG_ww1_the_lords_and_the_commons_desc:0 "After the 1909 budget and the two elections of 1910 the constitutional convention settles: the Commons rule. It grants 10 political power and 1% stability."
 ENG_ww1_irish_parliamentary_support_desc:0 "Redmond's Irish Parliamentary Party props up the Liberal majority in exchange for a promise: self-government for Ireland. It grants 15 political power and Irish tension falls by 5, but the promise must be delivered in the Bill."
 ENG_ww1_home_rule_bill_desc:0 "In April 1912 Asquith introduces the Third Home Rule Bill. The Lords can only delay it for two years, but the Ulster Unionists threaten armed resistance. How the Bill is framed decides how much trouble follows."
 ENG_ww1_ulster_conference_desc:0 "With Ulster armed and the army uncertain, the King calls leaders from every side to a conference. The outcome decides whether Ulster will be excluded from Home Rule."
 ENG_ww1_electoral_registration_desc:0 "Electoral registration reform ends plural voting and simplifies enrolment. It grants 10 political power and labour support +2."
 ENG_ww1_the_defence_of_the_realm_desc:0 "The Defence of the Realm Act of August 1914 gives emergency powers over press and trades. Replaces social insurance with Defence of the Realm institution (war support +5%, stability -2%, political power -3%)."
 ENG_ww1_wartime_parliamentary_scrutiny_desc:0 "Even at war Parliament keeps the right to question ministers. Replaces insurance with Cabinet Consultation institution (political power -2.5%), stability +2% and labour support +2."
 ENG_ww1_the_coalition_cabinet_desc:0 "The shell crisis and Fisher's resignation bring down the Liberal cabinet in May 1915. The government must decide whether to share power with Conservatives and Labour."
 ENG_ww1_the_military_service_act_desc:0 "The Military Service Act of January 1916 ends voluntary enlistment across Britain and retires the old professional service idea. Authorises conscription laws, labour support falls by 6 and Irish tension rises by 4."
 ENG_ww1_reserved_civilian_occupations_desc:0 "Miners, munition workers and railwaymen are exempted from military enlistment. Replaces general restrictions with Reserved Occupations institution (industrial capacity +2%, recruitment -0.15%)."
 ENG_ww1_the_war_cabinet_desc:0 "In December 1916 a leadership crisis pits Asquith against Lloyd George. The country chooses between a small War Cabinet and a reorganisation of committees."
 ENG_ww1_the_franchise_debate_desc:0 "The Speaker's Conference brings every party together to discuss the vote. It grants 10 political power and labour support +3."
 ENG_ww1_representation_of_the_people_desc:0 "The Representation of the People Act of 1918 enfranchises all men and women over 30. Replaces emergency laws with Enlarged Electorate institution (stability +2%, political power -2%) and labour support +8."
 ENG_ww1_the_coalition_election_desc:0 "The December 1918 election tests the wartime coalition: issue the government's coupon to its candidates or fight as separate parties."
 ENG_ww1_liberal_reconstruction_desc:0 "Housing, health and education: the 1919 reconstruction programme retires wartime restrictions. Grants 25 political power and 3% stability, but debt rises by 3."
 ENG_ww1_the_labour_alternative_desc:0 "Without a Conservative majority, Labour assumes office as an alternative government. Replaces war measures with the Labour Compact, labour support +10, 15 political power and stability -2%."
 ENG_ww1_the_conservative_settlement_desc:0 "The end of the coalition and the return of the Conservatives ends war restrictions with fiscal retrenchment. Grants 25 political power and 2% stability; labour support falls by 8 and debt falls by 4."
 ENG_ww1_the_imperial_conference_desc:0 "The 1911 Imperial Conference brings the Dominion premiers to London. It grants 10 political power, dominion consent +8 and opens the debate over who pays for naval defence."
 ENG_ww1_canadian_defence_consultation_desc:0 "Borden takes office in 1911 against paying for battleships for London. Consulting Canada earns consent +3 and gives the Dominion a little more freedom."
 ENG_ww1_australian_defence_consultation_desc:0 "Australia already has its own fleet. Consulting it earns consent +3 and gives the Dominion a little more freedom."
 ENG_ww1_new_zealand_naval_consultation_desc:0 "New Zealand paid for a battlecruiser for the Royal Navy in 1909. Consulting it earns consent +3 and a little more freedom."
 ENG_ww1_south_african_cooperation_desc:0 "The Union of South Africa reconciles Boer and Briton, but loyalty is fragile. Cooperation earns consent +3 and a little more freedom."
 ENG_ww1_indian_army_liaison_desc:0 "The Indian Army is the imperial reserve. Liaison with the General Staff earns consent +2 and allows a later call for Indian troops."
 ENG_ww1_colonial_medical_services_desc:0 "Colonial medical services share experience against fever and wounds. It grants 1% stability and consent +2."
 ENG_ww1_dominion_procurement_offices_desc:0 "Procurement offices link London to overseas raw materials. Replaces imperial web with Dominion Procurement (industrial capacity +1.5%); consent +2."
 ENG_ww1_the_mediterranean_stations_desc:0 "Malta, Gibraltar, Cyprus and Suez sustain the Mediterranean fleet. It grants 5 naval experience."
 ENG_ww1_singapore_maritime_coordination_desc:0 "Singapore and Hong Kong coordinate the maritime defence of the Far East with Australia and New Zealand. It grants 4 naval experience and consent +1."
 ENG_ww1_imperial_troop_transport_desc:0 "Troop convoys bring Dominion soldiers to Europe. Replaces procurement offices with Imperial Sealift (convoy escort +3%)."
 ENG_ww1_the_imperial_war_conference_desc:0 "In 1917 London summons the Dominions to decide the direction of the war. Consent +6; the format of their participation is decided in an event."
 ENG_ww1_dominion_war_cabinet_delegates_desc:0 "Dominion delegates now sit in the imperial cabinet meetings. It grants 15 political power and consent +4."
 ENG_ww1_indian_constitutional_consultation_desc:0 "The 1917 Montagu Declaration promises responsible government to India. Consent +3 and India gains 5% stability."
 ENG_ww1_colonial_labour_contracts_desc:0 "Workers from India, China and the Caribbean dig trenches and unload ships. It grants 12,000 manpower, but consent falls by 1 because of the contract terms."
 ENG_ww1_a_commonwealth_consultation_charter_desc:0 "The Consultation Charter turns empire into a commonwealth of nations, ending colonial restrictions. Consultation Charter institution (PP gain +3%); consent +5."
 ENG_ww1_the_irish_settlement_conference_desc:0 "The Irish Convention brings nationalists, unionists and the government together. The outcome sets Ireland's course: self-government, partition or repression."
 ENG_ww1_dominion_status_for_ireland_desc:0 "After the war of independence the government must choose between signing the Irish Free State treaty or pursuing repression."
 ENG_ww1_egyptian_political_negotiations_desc:0 "The 1919 revolution and the Milner Mission force London to negotiate with Egyptian nationalists. It grants 15 political power and Egypt gains 3% stability."
 ENG_ww1_imperial_defence_after_the_war_desc:0 "The Committee of Imperial Defence reviews strategy after the war, with Chanak and the Pacific in view. It grants 5 naval experience, 15 political power and consent +3."
 ww1_britain_pol.1.t:0 "The Third Home Rule Bill"
 ww1_britain_pol.1.d:0 "In April 1912 Asquith introduces the Government of Ireland Bill. The Irish Party, whose votes sustain the Liberal majority, demands it without exclusions. The Ulster Unionists under Carson promise resistance, and the Lords can delay it for two years. How the Bill is framed decides how much trouble follows."
 ww1_britain_pol.1.a:0 "Press the Bill without exclusions. (Irish tension -8, Ulster tension +15)"
 ww1_britain_pol.1.b:0 "Introduce it with an amendment allowing county opt-outs. (Irish tension +3, Ulster +4)"
 ww1_britain_pol.1.c:0 "Shelve the Bill until the Lords question cools. (Irish tension +8, Ulster -5, +10 political power)"
 ww1_britain_pol.2.t:0 "The Buckingham Palace Conference"
 ww1_britain_pol.2.d:0 "The King summons Liberals, Conservatives, nationalists and unionists to the Palace to avert civil war. The sticking point is geographic: which Ulster counties stand outside Home Rule and for how long."
 ww1_britain_pol.2.a:0 "Accept temporary exclusion of the Ulster counties. (Ulster tension -20, Irish tension +10)"
 ww1_britain_pol.2.b:0 "Refuse any exclusion. (Ulster tension +10, Irish tension -5)"
 ww1_britain_pol.3.t:0 "The Shell Crisis and the Coalition"
 ww1_britain_pol.3.d:0 "The shell shortage on the Western Front and Admiral Fisher's resignation leave the Liberal cabinet exposed. Bonar Law's Conservatives ask for seats, and Labour's Henderson agrees to join."
 ww1_britain_pol.3.a:0 "Form a coalition government. (+25 political power, stability +2%, labour support +3)"
 ww1_britain_pol.3.b:0 "Carry on with a Liberal-only cabinet. (+10 political power, stability -2%)"
 ww1_britain_pol.4.t:0 "The December Crisis of 1916"
 ww1_britain_pol.4.d:0 "Lloyd George demands a small War Cabinet without Asquith chairing its business. The alternative is reorganising existing committees without breaking with the prime minister."
 ww1_britain_pol.4.a:0 "Create the War Cabinet. (War Cabinet institution, +20 political power, labour support -2)"
 ww1_britain_pol.4.b:0 "Reorganise the existing committees. (+10 political power, stability +2%)"
 ww1_britain_pol.5.t:0 "The Coupon Election"
 ww1_britain_pol.5.d:0 "With the armistice signed, Lloyd George wants a mandate for the peace. The 'coupon' is a letter of support for coalition candidates; those without it face the electorate alone."
 ww1_britain_pol.5.a:0 "Issue the coupon to coalition candidates. (+25 political power, stability +2%, labour support -6)"
 ww1_britain_pol.5.b:0 "Fight as separate parties. (+5 political power, stability -1%, labour support +3)"
 ww1_britain_pol.5.c:0 "Delay the election for a reconstruction mandate. (-20 political power, stability -3%)"
 ww1_britain_pol.6.t:0 "The Imperial Conference of 1911"
 ww1_britain_pol.6.d:0 "The Dominion premiers discuss common defence with Asquith and Grey. The Admiralty wants a cash contribution; the Dominions prefer navies of their own under local control in peacetime."
 ww1_britain_pol.6.a:0 "Press for a common contribution to the Royal Navy. (consent -2, debt -1)"
 ww1_britain_pol.6.b:0 "Accept local navies coordinated by the Admiralty. (consent +4, debt +1)"
 ww1_britain_pol.7.t:0 "The Ulster Volunteers and the Army"
 ww1_britain_pol.7.d:0 "Army officers at the Curragh warn that they would rather be dismissed than march against Ulster. The Ulster Volunteers already hold rifles landed from Germany. The government must choose between discipline and appeasement."
 ww1_britain_pol.7.a:0 "Demand army discipline. (-25 political power, stability -2%, Ulster tension -10)"
 ww1_britain_pol.7.b:0 "Accept the officers' assurances and do not coerce Ulster. (Ulster tension -15, Irish tension +10)"
 ww1_britain_pol.8.t:0 "The Imperial War Cabinet"
 ww1_britain_pol.8.d:0 "In 1917 the Dominion premiers arrive in London. Lloyd George must decide whether they sit in the cabinet as equals or are merely heard."
 ww1_britain_pol.8.a:0 "Give the premiers full seats. (consent +8, -10 political power)"
 ww1_britain_pol.8.b:0 "Consult them without seats. (consent +2, +10 political power)"
 ww1_britain_pol.9.t:0 "The Irish Convention"
 ww1_britain_pol.9.d:0 "Nationalists, southern unionists and the government seek a settlement for the whole island. Carson demands partition; Redmond no longer speaks for all nationalists. After 1916 and 1918 Sinn Féin outweighs the Irish Party."
 ww1_britain_pol.9.a:0 "Negotiate self-government for the whole island. (Irish tension -15, Ulster tension +12)"
 ww1_britain_pol.9.b:0 "Partition: one parliament in the south and one in the north. (Irish tension +5, Ulster -10)"
 ww1_britain_pol.9.c:0 "Impose martial law. (Irish tension +10, Irish Repression institution)"
 ww1_britain_pol.10.t:0 "The Anglo-Irish Treaty"
 ww1_britain_pol.10.d:0 "After two years of fighting, Lloyd George, Churchill and Collins negotiate in London. The offer is an Irish Free State with Dominion status; six north-eastern counties remain in the United Kingdom."
 ww1_britain_pol.10.a:0 "Sign the Treaty: a Free State as a Dominion. (Irish tension falls to 20, consent +5)"
 ww1_britain_pol.10.b:0 "Refuse and continue the war. (Irish tension +15, -20 political power)"
 ww1_britain_pol.11.t:0 "The Easter Rising"
 ww1_britain_pol.11.d:0 "On Easter Monday, Irish Volunteers and the Citizen Army seize points in Dublin and proclaim a republic. The revolt is crushed within a week, but the government's response will decide how Ireland remembers it."
 ww1_britain_pol.11.a:0 "Martial law and courts-martial. (Irish tension +20, +10 political power)"
 ww1_britain_pol.11.b:0 "Clemency and a civil inquiry. (Irish tension +8, -20 political power)"
 ww1_britain_pol.12.t:0 "The Irish Conscription Crisis"
 ww1_britain_pol.12.d:0 "The German offensive of March 1918 drains the reserves. The cabinet debates extending conscription to Ireland. Nationalists, the Church and the unions promise resistance, and a general strike is already called."
 ww1_britain_pol.12.a:0 "Extend the Military Service Act to Ireland. (Irish tension +25, Irish exemption ends)"
 ww1_britain_pol.12.b:0 "Pass the enabling power but hold it in reserve. (Irish tension +8, -10 political power)"
 ww1_britain_pol.12.c:0 "Withdraw the proposal. (Irish tension -5, -15 political power)"
 ww1_britain_pol.20.t:0 "A Request from London"
 ww1_britain_pol.20.d:0 "London asks for volunteers for the European front. The Dominion cabinet weighs loyalty to the empire against the needs of farm, factory and family."
 ww1_britain_pol.20.a:0 "Send volunteers. (15,000 manpower pass to the United Kingdom; British consent rises +2)"
 ww1_britain_pol.20.b:0 "Keep the men at home. (British consent -3, stability +1%)"
 ENG_ww1_national_insurance:0 "National Insurance"
 ENG_ww1_national_insurance_desc:0 "Sickness and unemployment covered by employer, worker and state contributions."
 ENG_ww1_defence_of_the_realm:0 "Defence of the Realm"
 ENG_ww1_defence_of_the_realm_desc:0 "Emergency powers over the press, trades and movement."
 ENG_ww1_reserved_occupations:0 "Reserved Occupations"
 ENG_ww1_reserved_occupations_desc:0 "Miners, munition workers and railwaymen are kept out of enlistment."
 ENG_ww1_enlarged_franchise:0 "Enlarged Electorate"
 ENG_ww1_enlarged_franchise_desc:0 "Millions of new voters, men and women, demand more of Parliament."
 ENG_ww1_dominion_procurement:0 "Dominion Procurement"
 ENG_ww1_dominion_procurement_desc:0 "Procurement offices link London's industry to the Dominions' raw materials."
 ENG_ww1_imperial_sealift:0 "Imperial Sealift"
 ENG_ww1_imperial_sealift_desc:0 "Merchant ships and escorts link the metropole, the Dominions and India."
 ENG_ww1_commonwealth_consultation:0 "Commonwealth Consultation"
 ENG_ww1_commonwealth_consultation_desc:0 "The empire becomes a community of nations with a voice of its own."
 ENG_ww1_empire_policy:0 "Imperial and Irish Policy"
 ENG_ww1_empire_policy_desc:0 "Dominion consultations and emergency measures in Ireland. Dominion consent: [?ww1_britain_dominion_consent|0]. Irish tension: [?ww1_britain_irish_tension|0]. Ulster tension: [?ww1_britain_ulster_tension|0]."
 ENG_ww1_request_dominion_contingent_CAN:0 "Request Volunteers from Canada"
 ENG_ww1_request_dominion_contingent_CAN_desc:0 "Spend 20 political power. At war, ask Canada to send 15,000 manpower. Requires the earlier consultation and consent above 29. The Dominion decides; nothing is created, manpower moves from one country to the other."
 ENG_ww1_request_dominion_contingent_AST:0 "Request Volunteers from Australia"
 ENG_ww1_request_dominion_contingent_AST_desc:0 "Spend 20 political power. At war, ask Australia to send 15,000 manpower. Requires the earlier consultation and consent above 29. The Dominion decides; nothing is created, manpower moves from one country to the other."
 ENG_ww1_request_dominion_contingent_NZL:0 "Request Volunteers from New Zealand"
 ENG_ww1_request_dominion_contingent_NZL_desc:0 "Spend 20 political power. At war, ask New Zealand to send 15,000 manpower. Requires the earlier consultation and consent above 29. The Dominion decides; nothing is created, manpower moves from one country to the other."
 ENG_ww1_request_dominion_contingent_SAF:0 "Request Volunteers from South Africa"
 ENG_ww1_request_dominion_contingent_SAF_desc:0 "Spend 20 political power. At war, ask South Africa to send 15,000 manpower. Requires the earlier consultation and consent above 29. The Dominion decides; nothing is created, manpower moves from one country to the other."
 ENG_ww1_reconvene_imperial_conference:0 "Reconvene the Imperial Conference"
 ENG_ww1_reconvene_imperial_conference_desc:0 "Spend 30 political power. Dominion consent +6 and debt +1. Available once a year after the first conference."
 ENG_ww1_release_irish_prisoners:0 "Release Irish Prisoners"
 ENG_ww1_release_irish_prisoners_desc:0 "Spend 20 political power. Irish tension falls by 8 and Ulster tension rises by 4. Requires Irish tension above 40."
 ENG_ww1_emergency_suppression:0 "Suppress the Agitation"
 ENG_ww1_emergency_suppression_desc:0 "Spend 15 political power. Irish tension falls by 5, Ulster tension falls by 3 and stability falls by 1%. Requires Irish tension above 50."
 ENG_ww1_autonomy_consultation:0 "Imperial consultation"
 ww1_britain.3.t:0 "Unrest in Ireland"
 ww1_britain.3.d:0 "Arrests, conscription rumours and the stalled Home Rule settlement have pushed Irish tension past ordinary administration. Dublin Castle asks whether the cabinet will negotiate, suppress the agitation or wait. Conciliation costs political capital; repression lowers tension briefly and leaves lasting resentment; delay keeps the problem open."
 ww1_britain.3.a:0 "Open talks with the Irish representatives. (-30 political power, tension falls to 45, conciliation institution)"
 ww1_britain.3.b:0 "Use the emergency powers. (tension 55, repression institution, stability -2%)"
 ww1_britain.3.c:0 "Wait for a calmer season. (tension +4, +10 political power)"
 ENG_ww1_cabinet_policy_desc:0 "Defence allocations reserve civilian administration and divert production between services. Debt burden: [?ww1_britain_debt_burden|0]. Reversing a neutral policy requires new consultations; allies may refuse admission."
