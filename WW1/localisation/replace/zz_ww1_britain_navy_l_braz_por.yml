l_braz_por:
 ENG_ww1_admiralty_fleet_survey_desc:0 "O Almirantado mede a prontidão da frota e admite o que todos sabem: não existe um estado-maior naval de verdade. O Estado-Maior de Guerra Naval nasce em 1912. Ganha 10 de poder político e a instituição Estado-Maior Naval (+10% de experiência naval ganha)."
 ENG_ww1_the_naval_estimates_desc:0 "O Almirantado amplia os estaleiros de Birkenhead e Cammell Laird para a corrida de couraçados. Enfileira 1 estaleiro no noroeste; a dívida sobe 1 e ganha 3 de experiência naval."
 ENG_ww1_dreadnought_construction_planning_desc:0 "A classe Queen Elizabeth troca os canhões de 13,5 por 15 polegadas e o carvão pelo óleo, uma aposta ousada. A dívida sobe 1 e ganha bônus de pesquisa de 25% em couraçados (uso único)."
 ENG_ww1_battlecruiser_squadron_planning_desc:0 "Beatty comanda uma esquadra rápida, de canhões grandes e casco fino, feita para caçar cruzadores alemães. Ganha 2 de experiência naval e bônus de pesquisa de 25% em cruzadores de batalha (uso único)."
 ENG_ww1_destroyer_flotilla_planning_desc:0 "Harland & Wolff e estaleiros em Belfast recebem encomendas para contratorpedeiros. Enfileira 1 estaleiro na Irlanda do Norte, ganha 2 de experiência naval e bônus de pesquisa de 25% em contratorpedeiros (uso único)."
 ENG_ww1_submarine_service_development_desc:0 "Os submarinos classe E são pensados para a defesa costeira e a vigia da baía alemã, não para o comércio. Ganha 1 de experiência naval e bônus de pesquisa de 25% em submarinos (uso único)."
 ENG_ww1_naval_gunnery_calibration_desc:0 "As mesas de controle de fogo de Dreyer e Pollen prometem acertar a quase 15 quilômetros. Ganha 3 de experiência naval e bônus de pesquisa de 25% em artilharia naval (uso único)."
 ENG_ww1_the_north_sea_watch_desc:0 "Cruzadores velhos e navios mercantes armados fecham o espaço entre a Escócia e a Noruega. Ganha a instituição Patrulha do Norte (detecção naval +10%) e 2 de experiência naval."
 ENG_ww1_grand_fleet_maintenance_desc:0 "Scapa Flow e Rosyth ganham defesas costeiras e expansão de bases navais para abrigar a Grande Frota. Amplia as bases navais nas Terras Altas e Baixas da Escócia, instituição Fundeadouros da Grande Frota (reparo naval +10%); a dívida sobe 1."
 ENG_ww1_merchant_shipping_register_desc:0 "O registro do Lloyd's e do Board of Trade lista os navios mercantes que podem virar transporte, escolta ou navio-hospital. Ganha 2 de experiência naval e 1% de estabilidade."
 ENG_ww1_maritime_blockade_coordination_desc:0 "O Bloqueio da Alemanha sufoca o comércio alemão e irrita os neutros. Ganha 3 de experiência naval; a Alemanha sente a fome, e os Estados Unidos decidem se protestam contra as Ordens em Conselho."
 ENG_ww1_hydrophone_trials_desc:0 "A estação de Hawkcraig testa microfones submersos para ouvir os motores dos submarinos. Ganha 1 de experiência naval e bônus de pesquisa de 25% em guerra antissubmarina (uso único)."
 ENG_ww1_depth_charge_trials_desc:0 "A carga de profundidade tipo D, de 1916, é lançada por contratorpedeiros sobre o ponto onde o submarino mergulhou. Ganha 2 de experiência naval e bônus de pesquisa de 25% em contratorpedeiros (uso único)."
 ENG_ww1_convoy_system_organisation_desc:0 "Em 1917 os submarinos afundam um navio em cada quatro que saem para o mar. Lloyd George pressiona o Almirantado, que resiste a formar comboios. Dispara o debate do comboio: a escolha muda a guerra no Atlântico."
 ENG_ww1_escort_refit_contracts_desc:0 "Estaleiros convertem contratorpedeiros velhos, sloops e traineiras para escolta. A dívida sobe 1 e ganha bônus de pesquisa de 25% em contratorpedeiros (uso único); se o sistema de comboios já funciona, ganha mais 4 de experiência naval."
 ENG_ww1_naval_signals_and_direction_finding_desc:0 "Estações de rádio marcam a posição dos navios e submarinos alemães só pelo sinal que emitem. Ganha 10 de poder político e bônus de pesquisa de 25% em decifração (uso único)."
 ENG_ww1_mediterranean_convoy_liaison_desc:0 "Marinhas aliadas dividem a escolta no Mediterrâneo, onde os submarinos austríacos e alemães atacam. Ganha 2 de experiência naval e propõe a cooperação a cada aliado naval, que decide se aceita."
 ENG_ww1_the_postwar_fleet_review_desc:0 "Com o armistício, o Almirantado faz a revista da frota: o que manter, o que vender e o que desarmar. Ganha 15 de poder político e 2 de experiência naval; o próximo passo é escolher entre economizar e aprender."
 ENG_ww1_naval_budget_retrenchment_desc:0 "O Tesouro corta o orçamento naval, aposenta couraçados velhos e cancela encomendas. A dívida cai 3; ganha 15 de poder político e 1% de estabilidade. Exclui as lições técnicas."
 ENG_ww1_naval_technical_lessons_desc:0 "O Almirantado estuda Jutland e a guerra submarina: munição com menos risco de explosão, blindagem de convés, controle de fogo. A dívida sobe 1; ganha 8 de experiência naval e bônus de pesquisa de 25% em equipamento naval (uso único). Exclui o corte orçamentário."
 ENG_ww1_the_air_battalion_experiments_desc:0 "O Batalhão Aéreo dos Engenheiros Reais testa balões, dirigíveis e aeroplanos em Larkhill. Ganha 2 de experiência aérea e bônus de pesquisa de 25% em equipamento aéreo (uso único)."
 ENG_ww1_royal_flying_corps_organisation_desc:0 "O Corpo Aéreo Real nasce em 1912, com uma ala militar, uma ala naval e a Escola Central de Voo em Upavon. Ganha a instituição Corpo Aéreo Real (+10% de experiência aérea ganha) e 2 de experiência aérea."
 ENG_ww1_military_pilot_instruction_desc:0 "Oficiais e sargentos aprendem a voar nas escolas de Upavon e Netheravon, com um diploma aeronáutico próprio. Ganha 5 de experiência aérea e 5 de poder político."
 ENG_ww1_aerial_reconnaissance_reports_desc:0 "Relatórios de observação aérea entram nos manuais do estado-maior do Exército. Ganha 3 de experiência de exército e 2 de experiência aérea."
 ENG_ww1_royal_naval_air_service_organisation_desc:0 "Em 1914 a ala naval se separa e vira o Serviço Aéreo Naval Real, com hidroaviões, dirigíveis e caças. Ganha 2 de experiência naval e 3 de experiência aérea."
 ENG_ww1_wireless_and_aircraft_observation_desc:0 "Rádios de faísca, mesmo pesados, deixam o observador corrigir o tiro da artilharia pelo ar. Ganha 2 de experiência aérea e bônus de pesquisa de 25% em eletrônica (uso único)."
 ENG_ww1_bristol_scout_trials_desc:0 "O Bristol Scout, pequeno e rápido, é a primeira aeronave britânica pensada para escoltar e caçar. Ganha 2 de experiência aérea e bônus de pesquisa de 25% em aviação leve (uso único)."
 ENG_ww1_naval_seaplane_stations_desc:0 "Estações de hidroaviões e ancoradouros em Calshot, Felixstowe e Great Yarmouth vigiam o Mar do Norte. Adiciona 1 nível de base naval em East Anglia, ganha 2 de experiência naval e 2 de experiência aérea."
 ENG_ww1_aircraft_production_contracts_desc:0 "A Fábrica Real de Aeronaves e empresas privadas como Sopwith, Vickers e Bristol disputam contratos. A dívida sobe 1; ganha 5 de poder político e bônus de pesquisa de 25% em equipamento aéreo (uso único)."
 ENG_ww1_fighter_squadron_instruction_desc:0 "Depois do Fokker, os esquadrões de caça aprendem a voar em formação e a atacar em grupo, e não mais sozinhos. Ganha 4 de experiência aérea e bônus de pesquisa de 25% em caças leves (uso único)."
 ENG_ww1_artillery_spotting_liaison_desc:0 "Observadores aéreos e baterias passam a trabalhar juntos, com códigos de rádio e mapas comuns. Ganha 3 de experiência de exército e 3 de experiência aérea."
 ENG_ww1_night_flying_experiments_desc:0 "Pilotos aprendem a decolar e pousar de noite, com lanternas e sinais, para interceptar os Zeppelins. Ganha 4 de experiência aérea e 5 de poder político."
 ENG_ww1_bomber_range_experiments_desc:0 "Voos longos de teste, com tanques extras e miras novas, medem até onde um bombardeiro chega. Ganha 2 de experiência aérea e bônus de pesquisa de 25% em bombardeiros táticos (uso único)."
 ENG_ww1_aircraft_engine_reliability_desc:0 "Os motores Rolls-Royce Eagle e os rotativos Le Rhône falham menos quando há peças padronizadas e oficinas de campanha. A dívida sobe 1; ganha a instituição Motores Confiáveis (acidentes aéreos -15%)."
 ENG_ww1_home_air_defence_coordination_desc:0 "Canhões antiaéreos, holofotes e esquadrões de defesa doméstica protegem Londres e as cidades industriais. Ganha a instituição Defesa Aérea Doméstica (estabilidade +1%) e 5 de poder político; os ataques aéreos vão custar menos ao apoio à guerra."
 ENG_ww1_the_independent_air_service_debate_desc:0 "Depois dos ataques dos Gotha a Londres, o general Smuts investiga a defesa aérea. A questão é se o Exército e a Marinha continuam com serviços aéreos separados ou se nasce uma força independente. Dispara o Relatório Smuts."
 ENG_ww1_royal_air_force_unification_desc:0 "Em 1º de abril de 1918 nasce a Força Aérea Real, com o Corpo Aéreo e o Serviço Naval fundidos. Troca a instituição Corpo Aéreo Real por Força Aérea Real (+15% de experiência aérea ganha, +5% de eficiência de missão aérea). Se a força independente foi escolhida, ganha 10 de experiência aérea e perde 10 de poder político; senão, ganha 4 de experiência aérea e 10 de poder político."
 ENG_ww1_postwar_aircraft_demobilisation_desc:0 "Milhares de aviões sobram. A Companhia de Alienação de Aeronaves vende os excedentes e a RAF encolhe. A dívida cai 2; ganha 10 de poder político e 1% de estabilidade."
 ENG_ww1_civil_aviation_research_desc:0 "O Comitê de Transporte Aéreo Civil estuda rotas para o Império e para o Continente. A dívida cai 1; ganha 1% de estabilidade e bônus de pesquisa de 25% em equipamento aéreo (uso único). Exclui o plano de uma força aérea sustentável."
 ENG_ww1_a_sustainable_air_establishment_desc:0 "O memorando de Trenchard defende uma RAF pequena, mas permanente, com escolas, esquadrões no Império e indústria própria. A dívida sobe 1; ganha 10 de experiência aérea e 15 de poder político. Exclui a pesquisa civil."
 ww1_britain_nav.2.t:0 "O debate do comboio"
 ww1_britain_nav.2.d:0 "Em abril de 1917 os submarinos afundam quase um em cada quatro navios que deixam as ilhas. O Almirantado teme que comboios sejam alvos fáceis e lentos, mas Lloyd George já ameaça ir pessoalmente à sala de operações."
 ww1_britain_nav.2.a:0 "Adotar o sistema de comboios. (-10 de poder político; escolta +15%, capacidade de estaleiro -5%)"
 ww1_britain_nav.2.b:0 "Manter as patrulhas. (+10 de poder político, experiência naval +2, dívida +2)"
 ww1_britain_nav.3.t:0 "A Batalha da Jutlândia"
 ww1_britain_nav.3.d:0 "A Grande Frota e a Frota de Alto-Mar se chocam ao largo da Dinamarca. Os britânicos perdem mais navios, mas a frota alemã volta ao porto e nunca mais busca a batalha decisiva. O comunicado do Almirantado soa como derrota."
 ww1_britain_nav.3.a:0 "Publicar o relatório sóbrio de Jellicoe. (experiência naval +5, apoio à guerra -1%)"
 ww1_britain_nav.3.b:0 "Destacar a fuga alemã para o porto. (+15 de poder político, apoio à guerra +1%)"
 ww1_britain_nav.4.t:0 "Zeppelins sobre a Inglaterra"
 ww1_britain_nav.4.d:0 "Dirigíveis alemães lançam bombas em Great Yarmouth e King's Lynn e depois em Londres. Há poucas mortes, mas o pânico é grande. Os jornais perguntam onde estão a Marinha e o Exército."
 ww1_britain_nav.4.a:0 "Ordenar o apagão e confiar nos canhões. (apoio à guerra -1%, estabilidade -0,5%)"
 ww1_britain_nav.4.b:0 "Chamar esquadrões do continente para a defesa. (-10 de poder político, experiência aérea +2)"
 ww1_britain_nav.5.t:0 "Os ataques dos Gotha"
 ww1_britain_nav.5.d:0 "Bombardeiros Gotha atacam Londres em pleno dia, em junho de 1917, e matam mais de cem pessoas. A fúria pública é enorme e as fábricas pedem proteção. O gabinete exige respostas."
 ww1_britain_nav.5.a:0 "Reorganizar a defesa de Londres. (-15 de poder político; o apoio à guerra cai só 0,5% se há defesa doméstica, senão 2%)"
 ww1_britain_nav.5.b:0 "Nomear o general Smuts para uma investigação. (-10 de poder político)"
 ww1_britain_nav.6.t:0 "O Relatório Smuts"
 ww1_britain_nav.6.d:0 "Smuts conclui que a guerra aérea será, no futuro, uma operação independente do mar e da terra. O Exército e a Marinha resistem a perder seus aviões, e o Conselho Aéreo precisa de uma decisão."
 ww1_britain_nav.6.a:0 "Criar um serviço aéreo independente. (-10 de poder político; apoio à guerra +1% se a comissão Smuts foi criada)"
 ww1_britain_nav.6.b:0 "Manter o Corpo Aéreo e o Serviço Naval separados. (+10 de poder político)"
 ww1_britain_nav.10.t:0 "O bloqueio da fome"
 ww1_britain_nav.10.d:0 "A Marinha Real fecha o Mar do Norte e o Canal. Trigo, fertilizantes, salitre e borracha deixam de chegar. Nas cidades alemãs faltam pão e batatas, e as filas de comida crescem."
 ww1_britain_nav.10.a:0 "Racionar pão e batatas. (estabilidade -1%, apoio à guerra -1%)"
 ww1_britain_nav.10.b:0 "Culpar a pirataria britânica na imprensa neutra. (estabilidade -1,5%, apoio à guerra +1%)"
 ww1_britain_nav.11.t:0 "As Ordens em Conselho"
 ww1_britain_nav.11.d:0 "Os britânicos revistam navios americanos em Kirkwall e apreendem cargas destinadas à Holanda e à Escandinávia. Os exportadores de algodão e cobre reclamam, mas os bancos de Nova York lucram com os pedidos aliados."
 ww1_britain_nav.11.a:0 "Protestar com firmeza em Londres. (+10 de poder político; estabilidade britânica -1%, dívida britânica +1)"
 ww1_britain_nav.11.b:0 "Aceitar o bloqueio e manter o comércio. (estabilidade +1%)"
 ww1_britain_nav.12.t:0 "Escoltas no Mediterrâneo"
 ww1_britain_nav.12.d:0 "Londres propõe dividir a escolta dos comboios no Mediterrâneo: contratorpedeiros aliados cobrem Malta, Brindisi e Salonica, enquanto os britânicos cobrem o Egito. Os submarinos inimigos afundam navios todas as semanas."
 ww1_britain_nav.12.a:0 "Aceitar a cooperação. (experiência naval +2; a experiência naval britânica +2)"
 ww1_britain_nav.12.b:0 "Recusar. (sem efeitos)"
 ENG_ww1_admiralty_war_staff:0 "Estado-Maior Naval"
 ENG_ww1_admiralty_war_staff_desc:0 "Oficiais de estado-maior planejam a guerra no mar, e não só a próxima manobra."
 ENG_ww1_northern_patrol:0 "Patrulha do Norte"
 ENG_ww1_northern_patrol_desc:0 "Cruzadores velhos e navios mercantes armados vigiam o acesso ao Atlântico."
 ENG_ww1_grand_fleet_anchorage:0 "Fundeadouros da Grande Frota"
 ENG_ww1_grand_fleet_anchorage_desc:0 "Scapa Flow e Rosyth dão abrigo, carvão e oficinas à Grande Frota."
 ENG_ww1_convoy_system:0 "Sistema de Comboios"
 ENG_ww1_convoy_system_desc:0 "Navios mercantes viajam em grupo sob escolta. Escolta mais eficaz, mas os estaleiros gastam capacidade em escoltas."
 ENG_ww1_royal_flying_corps:0 "Corpo Aéreo Real"
 ENG_ww1_royal_flying_corps_desc:0 "Uma arma nova, de madeira e pano, que aprende a cada voo."
 ENG_ww1_engine_reliability:0 "Motores Confiáveis"
 ENG_ww1_engine_reliability_desc:0 "Peças padronizadas e oficinas de campanha reduzem falhas de motor."
 ENG_ww1_home_air_defence:0 "Defesa Aérea Doméstica"
 ENG_ww1_home_air_defence_desc:0 "Guardas, holofotes e canhões protegem Londres. A população dorme um pouco mais tranquila."
 ENG_ww1_royal_air_force:0 "Força Aérea Real"
 ENG_ww1_royal_air_force_desc:0 "O primeiro serviço aéreo independente do mundo, com estado-maior, escolas e orçamento próprios."
 ENG_ww1_tighten_the_blockade:0 "Apertar o bloqueio"
 ENG_ww1_tighten_the_blockade_desc:0 "Gasta 25 de poder político. Em guerra contra a Alemanha, a Alemanha sente nova escassez (estabilidade e apoio à guerra caem), a dívida sobe 1 e ganha 1 de experiência naval. Pode ser usado três vezes, com intervalo de oito meses."
 ENG_ww1_lend_escort_flotillas:0 "Partilhar flotilhas de escolta"
 ENG_ww1_lend_escort_flotillas_desc:0 "Gasta 20 de poder político. Em guerra, repete a proposta de escolta conjunta a cada aliado naval da facção, que decide se aceita. Exige a cooperação do Mediterrâneo."
 ENG_ww1_fund_home_air_defence:0 "Financiar a defesa aérea doméstica"
 ENG_ww1_fund_home_air_defence_desc:0 "Gasta 30 de poder político. Em guerra, apoio à guerra +1%, dívida +1 e 2 de experiência aérea. Disponível uma vez por ano, depois da coordenação da defesa aérea."
 ENG_ww1_services_policy:0 "Política das Forças Armadas"
 ENG_ww1_services_policy_desc:0 "Decisões ligadas à Marinha, à Força Aérea e ao Exército: bloqueio, escoltas, defesa aérea e estado-maior."
