l_braz_por:
 ENG_ww1_admiralty_fleet_survey_desc:0 "O Almirantado mede a prontidão da frota e cria o Estado-Maior de Guerra Naval em 1912. Ganha 15 de poder político e a instituição Estado-Maior Naval (+10% de ganho de XP naval)."
 ENG_ww1_the_naval_estimates_desc:0 "O Almirantado amplia os estaleiros de Birkenhead e Cammell Laird para a corrida de couraçados. Enfileira 1 estaleiro no noroeste, ganha 5 de experiência naval e 10 de poder político; a dívida sobe 1."
 ENG_ww1_dreadnought_construction_planning_desc:0 "A classe Queen Elizabeth adota canhões de 15 polegadas e óleo nos estaleiros do Clyde. Enfileira 1 estaleiro em Strathclyde e bônus de 25% em couraçados; dívida sobe 1."
 ENG_ww1_battlecruiser_squadron_planning_desc:0 "Beatty comanda uma esquadra rápida produzida nos estaleiros do Tyne. Enfileira 1 estaleiro no norte da Inglaterra, ganha 5 de experiência naval e bônus de 25% em cruzadores de batalha."
 ENG_ww1_destroyer_flotilla_planning_desc:0 "Harland & Wolff e estaleiros em Belfast recebem encomendas para contratorpedeiros. Enfileira 1 estaleiro na Irlanda do Norte, ganha 5 de experiência naval e bônus de 25% em contratorpedeiros."
 ENG_ww1_submarine_service_development_desc:0 "Os submarinos classe E são pensados para a defesa costeira e a vigia da baía alemã. Ganha 5 de experiência naval, 10 de poder político e bônus de pesquisa de 25% em submarinos."
 ENG_ww1_naval_gunnery_calibration_desc:0 "As mesas de controle de fogo de Dreyer e Pollen prometem disparos precisos a longa distância. Ganha 10 de experiência naval e bônus de pesquisa de 25% em artilharia naval."
 ENG_ww1_the_north_sea_watch_desc:0 "Cruzadores e navios armados patrulham entre a Escócia e a Noruega. Substitui o estado-maior inicial pela instituição Patrulha do Norte (detecção naval +10%) e 5 de experiência naval."
 ENG_ww1_grand_fleet_maintenance_desc:0 "Scapa Flow e Rosyth ganham baterias costeiras e bases navais. Substitui patrulhas pela instituição Fundeadouros da Grande Frota (reparo naval +10%); dívida sobe 1."
 ENG_ww1_merchant_shipping_register_desc:0 "O registro do Lloyd's lista navios mercantes que podem virar transportes e escoltas. Ganha 5 de experiência naval, 2% de estabilidade e 15 de poder político."
 ENG_ww1_maritime_blockade_coordination_desc:0 "O Bloqueio da Alemanha sufoca o comércio imperial alemão. Ganha 5 de experiência naval e 10 de poder político; a Alemanha sente a fome e os EUA debatem protestos."
 ENG_ww1_hydrophone_trials_desc:0 "A estação de Hawkcraig testa microfones submersos para detectar motores submarinos. Ganha 5 de experiência naval e bônus de pesquisa de 25% em guerra antissubmarina."
 ENG_ww1_depth_charge_trials_desc:0 "A carga de profundidade tipo D é lançada por contratorpedeiros sobre áreas de mergulho. Ganha 5 de experiência naval e bônus de pesquisa de 25% em contratorpedeiros."
 ENG_ww1_convoy_system_organisation_desc:0 "Em 1917 os submarinos afundam um navio em cada quatro que saem para o mar. Lloyd George pressiona o Almirantado, que resiste a formar comboios. Dispara o debate do comboio: a escolha muda a guerra no Atlântico."
 ENG_ww1_escort_refit_contracts_desc:0 "Estaleiros em Devonport e Portsmouth convertem embarcações para escolta. Enfileira 1 estaleiro no sudeste, bônus de 25% em contratorpedeiros e dívida +1; ganha até 10 de experiência naval."
 ENG_ww1_naval_signals_and_direction_finding_desc:0 "Estações de radiogoniometria triangulam sinais de submarinos alemães. Ganha 15 de poder político e bônus de pesquisa de 25% em decifração."
 ENG_ww1_mediterranean_convoy_liaison_desc:0 "Marinhas aliadas compartilham a escolta no Mediterrâneo contra submarinos. Ganha 10 de experiência naval, 10 de poder político e propõe a cooperação aos aliados."
 ENG_ww1_the_postwar_fleet_review_desc:0 "Com o armistício, o Almirantado faz a revista da frota, desmobilizando fundeadouros de guerra. Ganha 20 de poder político e 5 de experiência naval."
 ENG_ww1_naval_budget_retrenchment_desc:0 "O Tesouro corta o orçamento naval, aposenta couraçados velhos e cancela encomendas. A dívida cai 3; ganha 20 de poder político e 2% de estabilidade. Exclui as lições técnicas."
 ENG_ww1_naval_technical_lessons_desc:0 "O Almirantado estuda Jutland e a guerra submarina: munição com menos risco de explosão, blindagem de convés, controle de fogo. A dívida sobe 1; ganha 15 de experiência naval e bônus de pesquisa de 25% em equipamento naval (uso único). Exclui o corte orçamentário."
 ENG_ww1_the_air_battalion_experiments_desc:0 "O Batalhão Aéreo dos Engenheiros Reais testa dirigíveis e aeroplanos em Larkhill. Ganha 5 de experiência aérea e bônus de pesquisa de 25% em equipamento aéreo."
 ENG_ww1_royal_flying_corps_organisation_desc:0 "O Corpo Aéreo Real nasce em 1912 com a Escola Central de Voo em Upavon. Ganha a instituição Corpo Aéreo Real (+10% de ganho de XP aérea) e 5 de experiência aérea."
 ENG_ww1_military_pilot_instruction_desc:0 "Pilotos aprendem navegação e tiro aéreo com manuais de instrução formais. Ganha 15 de experiência aérea, 10 de poder político e bônus de 25% em doutrina aérea."
 ENG_ww1_aerial_reconnaissance_reports_desc:0 "Relatórios de reconhecimento aéreo abastecem o planejamento do Estado-Maior. Ganha 5 de experiência de exército, 5 de experiência aérea e bônus de 25% em reconhecimento."
 ENG_ww1_royal_naval_air_service_organisation_desc:0 "O Serviço Aéreo Naval Real desenvolve hidroaviões e dirigíveis costeiros. Ganha 5 de experiência naval, 5 de experiência aérea e bônus de 25% em equipamentos aéreos."
 ENG_ww1_wireless_and_aircraft_observation_desc:0 "Rádios de faísca transmitem dados de tiro de artilharia em tempo real. Ganha 5 de experiência aérea e bônus de pesquisa de 25% em eletrônica."
 ENG_ww1_bristol_scout_trials_desc:0 "O Bristol Scout é a primeira aeronave britânica projetada para caçar no ar. Ganha 5 de experiência aérea e bônus de pesquisa de 25% em aviação leve."
 ENG_ww1_naval_seaplane_stations_desc:0 "Estações de hidroaviões em Calshot e Felixstowe vigiam o Mar do Norte. Adiciona 1 nível de base naval em East Anglia, ganha 5 de experiência naval e 5 aérea."
 ENG_ww1_aircraft_production_contracts_desc:0 "Contratos com Sopwith, Vickers e Bristol multiplicam a fabricação aeronáutica. Ganha 10 de poder político, 5 de experiência aérea e bônus de 25% em aviões; dívida sobe 1."
 ENG_ww1_fighter_squadron_instruction_desc:0 "Esquadrões de caça aprendem formações de voo e ataques em grupo coordenados. Ganha 15 de experiência aérea e bônus de pesquisa de 25% em caças leves."
 ENG_ww1_artillery_spotting_liaison_desc:0 "Observadores aéreos e baterias de artilharia sincronizam zonas de bombardeio. Ganha 5 de experiência de exército, 5 aérea e bônus de 25% em artilharia."
 ENG_ww1_night_flying_experiments_desc:0 "Pilotos treinam voos noturnos e pousos com holofotes para combater Zeppelins. Ganha 10 de experiência aérea, 10 de poder político e bônus de 25% em equipamentos."
 ENG_ww1_bomber_range_experiments_desc:0 "Voos de longo curso com tanques ampliados preparam bombardeios estratégicos. Ganha 5 de experiência aérea e bônus de pesquisa de 25% em bombardeiros táticos."
 ENG_ww1_aircraft_engine_reliability_desc:0 "Motores Rolls-Royce Eagle e Le Rhône recebem peças padronizadas. Substitui o corpo inicial pela instituição Motores Confiáveis (acidentes aéreos -15%); dívida sobe 1."
 ENG_ww1_home_air_defence_coordination_desc:0 "Canhões AA, holofotes e patrulhas protegem Londres contra Zeppelins. Substitui melhorias de motores pela instituição Defesa Aérea Doméstica (estabilidade +1%) e 10 de poder político."
 ENG_ww1_the_independent_air_service_debate_desc:0 "Depois dos ataques dos Gotha a Londres, o general Smuts investiga a defesa aérea. A questão é se o Exército e a Marinha continuam com serviços aéreos separados ou se nasce uma força independente. Dispara o Relatório Smuts."
 ENG_ww1_royal_air_force_unification_desc:0 "Em 1º de abril de 1918 nasce a Força Aérea Real, substituindo a defesa aérea provisória. Instituição Força Aérea Real (+15% de XP aérea, +5% de eficiência de missão)."
 ENG_ww1_postwar_aircraft_demobilisation_desc:0 "A Companhia de Alienação de Aeronaves vende excedentes, desmobilizando a força de guerra. A dívida cai 2; ganha 15 de poder político e 1% de estabilidade."
 ENG_ww1_civil_aviation_research_desc:0 "O Comitê de Transporte Aéreo Civil estuda rotas aéreas imperiais. A dívida cai 1; ganha 2% de estabilidade e bônus de pesquisa de 25% em equipamento aéreo. Exclui a força militar permanente."
 ENG_ww1_a_sustainable_air_establishment_desc:0 "O memorando de Trenchard define uma RAF pequena, permanente e altamente qualificada. Remove instituições de guerra, ganha 15 de experiência aérea e 20 de poder político; dívida sobe 1. Exclui a pesquisa civil."
 ww1_britain_nav.2.t:0 "O debate do comboio"
 ww1_britain_nav.2.d:0 "Em abril de 1917 os submarinos afundam quase um em cada quatro navios que deixam as ilhas. O Almirantado teme que comboios sejam alvos fáceis e lentos, mas Lloyd George já ameaça ir pessoalmente à sala de operações."
 ww1_britain_nav.2.a:0 "Adotar o sistema de comboios. (-10 de poder político; escolta +15%, capacidade de estaleiro -5%)"
 ww1_britain_nav.2.b:0 "Manter as patrulhas. (+10 de poder político, experiência naval +2, dívida +2)"
 ww1_britain_nav.3.t:0 "A Batalha da Jutlândia"
 ww1_britain_nav.3.d:0 "A Grande Frota e a Frota de Alto-Mar se chocam ao largo da Dinamarca. Os britânicos perdem mais navios, mas a frota alemã volta ao porto e nunca mais busca a batalha decisiva. O comunicado do Almirantado soa como derrota."
 ww1_britain_nav.3.a:0 "Publicar o relatório sóbrio de Jellicoe. (experiência naval +5, apoio à guerra -1%)"
 ww1_britain_nav.3.b:0 "Destacar a fuga alemã para o porto. (+15 de poder político, apoio à guerra +1%)"
 ww1_britain_nav.4.t:0 "Zeppelins sobre a Inglaterra"
 ww1_britain_nav.4.d:0 "Dirigíveis alemães lançam bombas em Great Yarmouth e King's Lynn e depois em Londres. Há poucas mortes, mas o pânico é grande. Os jornais perguntam onde estão a Marinha e o Exército."
 ww1_britain_nav.4.a:0 "Ordenar o apagão e confiar nos canhões. (apoio à guerra -1%, estabilidade -0,5%)"
 ww1_britain_nav.4.b:0 "Chamar esquadrões do continente para a defesa. (-10 de poder político, experiência aérea +2)"
 ww1_britain_nav.5.t:0 "Os ataques dos Gotha"
 ww1_britain_nav.5.d:0 "Bombardeiros Gotha atacam Londres em pleno dia, em junho de 1917, e matam mais de cem pessoas. A fúria pública é enorme e as fábricas pedem proteção. O gabinete exige respostas."
 ww1_britain_nav.5.a:0 "Reorganizar a defesa de Londres. (-15 de poder político; o apoio à guerra cai só 0,5% se há defesa doméstica, senão 2%)"
 ww1_britain_nav.5.b:0 "Nomear o general Smuts para uma investigação. (-10 de poder político)"
 ww1_britain_nav.6.t:0 "O Relatório Smuts"
 ww1_britain_nav.6.d:0 "Smuts conclui que a guerra aérea será, no futuro, uma operação independente do mar e da terra. O Exército e a Marinha resistem a perder seus aviões, e o Conselho Aéreo precisa de uma decisão."
 ww1_britain_nav.6.a:0 "Criar um serviço aéreo independente. (-10 de poder político; apoio à guerra +1% se a comissão Smuts foi criada)"
 ww1_britain_nav.6.b:0 "Manter o Corpo Aéreo e o Serviço Naval separados. (+10 de poder político)"
 ww1_britain_nav.10.t:0 "O bloqueio da fome"
 ww1_britain_nav.10.d:0 "A Marinha Real fecha o Mar do Norte e o Canal. Trigo, fertilizantes, salitre e borracha deixam de chegar. Nas cidades alemãs faltam pão e batatas, e as filas de comida crescem."
 ww1_britain_nav.10.a:0 "Racionar pão e batatas. (estabilidade -1%, apoio à guerra -1%)"
 ww1_britain_nav.10.b:0 "Culpar a pirataria britânica na imprensa neutra. (estabilidade -1,5%, apoio à guerra +1%)"
 ww1_britain_nav.11.t:0 "As Ordens em Conselho"
 ww1_britain_nav.11.d:0 "Os britânicos revistam navios americanos em Kirkwall e apreendem cargas destinadas à Holanda e à Escandinávia. Os exportadores de algodão e cobre reclamam, mas os bancos de Nova York lucram com os pedidos aliados."
 ww1_britain_nav.11.a:0 "Protestar com firmeza em Londres. (+10 de poder político; estabilidade britânica -1%, dívida britânica +1)"
 ww1_britain_nav.11.b:0 "Aceitar o bloqueio e manter o comércio. (estabilidade +1%)"
 ww1_britain_nav.12.t:0 "Escoltas no Mediterrâneo"
 ww1_britain_nav.12.d:0 "Londres propõe dividir a escolta dos comboios no Mediterrâneo: contratorpedeiros aliados cobrem Malta, Brindisi e Salonica, enquanto os britânicos cobrem o Egito. Os submarinos inimigos afundam navios todas as semanas."
 ww1_britain_nav.12.a:0 "Aceitar a cooperação. (experiência naval +2; a experiência naval britânica +2)"
 ww1_britain_nav.12.b:0 "Recusar. (sem efeitos)"
 ENG_ww1_admiralty_war_staff:0 "Estado-Maior Naval"
 ENG_ww1_admiralty_war_staff_desc:0 "Oficiais de estado-maior planejam a guerra no mar, e não só a próxima manobra."
 ENG_ww1_northern_patrol:0 "Patrulha do Norte"
 ENG_ww1_northern_patrol_desc:0 "Cruzadores velhos e navios mercantes armados vigiam o acesso ao Atlântico."
 ENG_ww1_grand_fleet_anchorage:0 "Fundeadouros da Grande Frota"
 ENG_ww1_grand_fleet_anchorage_desc:0 "Scapa Flow e Rosyth dão abrigo, carvão e oficinas à Grande Frota."
 ENG_ww1_convoy_system:0 "Sistema de Comboios"
 ENG_ww1_convoy_system_desc:0 "Navios mercantes viajam em grupo sob escolta. Escolta mais eficaz, mas os estaleiros gastam capacidade em escoltas."
 ENG_ww1_royal_flying_corps:0 "Corpo Aéreo Real"
 ENG_ww1_royal_flying_corps_desc:0 "Uma arma nova, de madeira e pano, que aprende a cada voo."
 ENG_ww1_engine_reliability:0 "Motores Confiáveis"
 ENG_ww1_engine_reliability_desc:0 "Peças padronizadas e oficinas de campanha reduzem falhas de motor."
 ENG_ww1_home_air_defence:0 "Defesa Aérea Doméstica"
 ENG_ww1_home_air_defence_desc:0 "Guardas, holofotes e canhões protegem Londres. A população dorme um pouco mais tranquila."
 ENG_ww1_royal_air_force:0 "Força Aérea Real"
 ENG_ww1_royal_air_force_desc:0 "O primeiro serviço aéreo independente do mundo, com estado-maior, escolas e orçamento próprios."
 ENG_ww1_tighten_the_blockade:0 "Apertar o bloqueio"
 ENG_ww1_tighten_the_blockade_desc:0 "Gasta 25 de poder político. Em guerra contra a Alemanha, a Alemanha sente nova escassez (estabilidade e apoio à guerra caem), a dívida sobe 1 e ganha 1 de experiência naval. Pode ser usado três vezes, com intervalo de oito meses."
 ENG_ww1_lend_escort_flotillas:0 "Partilhar flotilhas de escolta"
 ENG_ww1_lend_escort_flotillas_desc:0 "Gasta 20 de poder político. Em guerra, repete a proposta de escolta conjunta a cada aliado naval da facção, que decide se aceita. Exige a cooperação do Mediterrâneo."
 ENG_ww1_fund_home_air_defence:0 "Financiar a defesa aérea doméstica"
 ENG_ww1_fund_home_air_defence_desc:0 "Gasta 30 de poder político. Em guerra, apoio à guerra +1%, dívida +1 e 2 de experiência aérea. Disponível uma vez por ano, depois da coordenação da defesa aérea."
 ENG_ww1_services_policy:0 "Política das Forças Armadas"
 ENG_ww1_services_policy_desc:0 "Decisões ligadas à Marinha, à Força Aérea e ao Exército: bloqueio, escoltas, defesa aérea e estado-maior."
