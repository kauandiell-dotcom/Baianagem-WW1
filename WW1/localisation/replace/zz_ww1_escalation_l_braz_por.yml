l_braz_por:
 ww1_escalation.1.t:0 "A Bélgica e a decisão britânica"
 ww1_escalation.1.d:0 "Alemanha e Bélgica estão em guerra. A intervenção exige uma decisão do governo, mobilização e transporte. A neutralidade preparada continua sendo um compromisso; ela pode ser reconsiderada pela política nacional."
 ww1_escalation.1.a:0 "Autorizar a intervenção contra a Alemanha"
 ww1_escalation.1.b:0 "Manter nossa política e ficar fora da guerra."
 ww1_escalation.2.t:0 "A intervenção russa e a responsabilidade alemã"
 ww1_escalation.2.d:0 "O governo russo escolheu a guerra contra a Áustria-Hungria. A Alemanha decide entre participar desse conflito ou buscar mediação. A guerra existente continua até que seus participantes aceitem um acordo."
 ww1_escalation.2.a:0 "Entrar em guerra contra o governo russo"
 ww1_escalation.2.b:0 "Buscar mediação sem declarar guerra"
 ww1_diplomacy.5.d:0 "A Sérvia solicita auxílio contra a Áustria-Hungria. Honrar o pedido significa intervir efetivamente se os dois países estiverem em guerra. Uma garantia não permite entrar retroativamente em um conflito existente. A Alemanha receberá sua própria decisão."
 ww1_diplomacy.5.a:0 "Mobilização Geral! Defender a Sérvia!"
 ww1_diplomacy.5.b:0 "A Rússia não pode travar esta guerra."
 ww1_diplomacy.2.b:0 "Aceitar concessões, preservando o governo sérvio"
 ww1_germany_events.22.d:0 "A Alemanha solicita passagem pela Bélgica durante sua guerra contra a França. A recusa permite um ataque alemão; o governo britânico decide sua própria resposta. A aceitação concede acesso e o plano operacional respeitará essa autorização."
