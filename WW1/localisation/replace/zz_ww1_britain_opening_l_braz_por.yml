l_braz_por:
 ENG_ww1_naval_establishment:0 "O estabelecimento naval"
 ENG_ww1_naval_establishment_desc:0 "A frota existente sustenta nossa vantagem naval. Apoiar seus estaleiros e estações globais ocupa a administração civil; não concede proteção automática aos comboios."
 ENG_ww1_london_market:0 "O mercado financeiro de Londres"
 ENG_ww1_london_market_desc:0 "A experiência comercial facilita mudanças na política de comércio, mas manter os escritórios financeiros tem custo econômico civil. Programas de guerra financiados ainda aumentam a dívida."
 ENG_ww1_imperial_administration:0 "Administração das comunicações imperiais"
 ENG_ww1_imperial_administration_desc:0 "As estações estabelecidas reduzem parte das perdas marítimas, enquanto as consultas pelo império consomem atenção política. Forças e material dos domínios exigem acordos próprios."
 ENG_ww1_irish_divisions:0 "Divisões constitucionais irlandesas"
 ENG_ww1_irish_divisions_desc:0 "A disputa enfraquece a cooperação interna. A penalidade nacional inicial é limitada; tensões sem solução podem evoluir para uma crise política real. A devolução de poderes ou um acordo irlandês pode encerrar esta penalidade inicial."
