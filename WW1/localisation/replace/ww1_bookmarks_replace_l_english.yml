 # ========================================================
 # Bookmark: La Belle Époque (1911) - Hearts of Iron IV
 # Date: June 1, 1911
 # ========================================================
 GATHERING_STORM_NAME:0 "La Belle Époque (1911)"
 WW1_GATHERING_STORM_NAME:0 "La Belle Époque (1911)"
 GATHERING_STORM_DESC:0 "June 1911. The great empires of Europe stand at the peak of the Belle Époque in an era of armed peace and intense industrial and naval rivalry. As the Moroccan Agadir Crisis brews and the Balkans approach boiling point, the continent hurtles inexorably toward the catastrophe of the Great War."
 WW1_GATHERING_STORM_DESC:0 "June 1911. The great empires of Europe stand at the peak of the Belle Époque in an era of armed peace and intense industrial and naval rivalry. As the Moroccan Agadir Crisis brews and the Balkans approach boiling point, the continent hurtles inexorably toward the catastrophe of the Great War."

 # --- German Empire (Wilhelm II) ---
 GER_GATHERING_STORM_DESC:0 "In June 1911, the German Empire stands at the apex of its continental power under Kaiser Wilhelm II. Blessed with the world's most disciplined and formidable army, guided by the Großer Generalstab under Helmuth von Moltke the Younger, and equipped by Krupp's cutting-edge industrial might, the Empire nevertheless feels hemmed in by the hostile encirclement of the Franco-Russian alliance. Grand Admiral Alfred von Tirpitz relentlessly pursues the expansion of the High Seas Fleet to contest British maritime dominance, while imperial strategists place their faith in the Schlieffen Plan to deliver a decisive knockout blow should war ignite. As gunboat SMS Panther departs for Morocco to trigger the Agadir Crisis and colonial tensions reach fever pitch, Berlin must decide whether aggressive brinkmanship will secure its rightful 'place in the sun' or precipitate a continental conflagration."
 WW1_GER_GATHERING_STORM_DESC:0 "In June 1911, the German Empire stands at the apex of its continental power under Kaiser Wilhelm II. Blessed with the world's most disciplined and formidable army, guided by the Großer Generalstab under Helmuth von Moltke the Younger, and equipped by Krupp's cutting-edge industrial might, the Empire nevertheless feels hemmed in by the hostile encirclement of the Franco-Russian alliance. Grand Admiral Alfred von Tirpitz relentlessly pursues the expansion of the High Seas Fleet to contest British maritime dominance, while imperial strategists place their faith in the Schlieffen Plan to deliver a decisive knockout blow should war ignite. As gunboat SMS Panther departs for Morocco to trigger the Agadir Crisis and colonial tensions reach fever pitch, Berlin must decide whether aggressive brinkmanship will secure its rightful 'place in the sun' or precipitate a continental conflagration."

 # --- Austro-Hungarian Empire (Franz Joseph I) ---
 AUS_GATHERING_STORM_DESC:0 "Reigning for over six decades, the venerable Emperor Franz Joseph I presides over the fragile mosaic of the Austro-Hungarian Dual Monarchy. Beneath imperial pomp and Vienna's cultural golden age, centrifugal nationalist forces threaten the Habsburg realm from within, exacerbated by fierce South Slav resistance following the controversial 1908 annexation of Bosnia-Herzegovina. Relations with the Kingdom of Serbia and Imperial Russia remain dangerously strained. Chief of the General Staff General Franz Conrad von Hötzendorf persistently advocates a preventive strike to crush Serbian agitation before the empire unravels. Firmly anchored to Berlin by the Dual Alliance, Austria-Hungary faces a fateful choice between comprehensive federal reform, military confrontation, and internal dissolution."
 WW1_AUS_GATHERING_STORM_DESC:0 "Reigning for over six decades, the venerable Emperor Franz Joseph I presides over the fragile mosaic of the Austro-Hungarian Dual Monarchy. Beneath imperial pomp and Vienna's cultural golden age, centrifugal nationalist forces threaten the Habsburg realm from within, exacerbated by fierce South Slav resistance following the controversial 1908 annexation of Bosnia-Herzegovina. Relations with the Kingdom of Serbia and Imperial Russia remain dangerously strained. Chief of the General Staff General Franz Conrad von Hötzendorf persistently advocates a preventive strike to crush Serbian agitation before the empire unravels. Firmly anchored to Berlin by the Dual Alliance, Austria-Hungary faces a fateful choice between comprehensive federal reform, military confrontation, and internal dissolution."

 # --- Ottoman Empire (Mehmed V) ---
 TUR_GATHERING_STORM_DESC:0 "Nominally led by Sultan Mehmed V, the Ottoman Empire is undergoing tumultuous political and military upheaval steered by the revolutionary Committee of Union and Progress (İttihat ve Terakki). The Young Turk government labors tirelessly to modernize the empire's decaying institutions, restructure taxation, and rebuild its armed forces with the assistance of German military advisory missions under Colmar Freiherr von der Goltz. Yet external threats mount rapidly: the Kingdom of Italy prepares an imperialist expedition against Ottoman Tripolitania in North Africa, Albanian uprisings flare, and hostile Balkan states eye Ottoman territories in Rumelia with predatory ambition. Surrounded by existential perils, the Sublime Porte must modernize rapidly or face the total partition of its ancient domain."
 WW1_TUR_GATHERING_STORM_DESC:0 "Nominally led by Sultan Mehmed V, the Ottoman Empire is undergoing tumultuous political and military upheaval steered by the revolutionary Committee of Union and Progress (İttihat ve Terakki). The Young Turk government labors tirelessly to modernize the empire's decaying institutions, restructure taxation, and rebuild its armed forces with the assistance of German military advisory missions under Colmar Freiherr von der Goltz. Yet external threats mount rapidly: the Kingdom of Italy prepares an imperialist expedition against Ottoman Tripolitania in North Africa, Albanian uprisings flare, and hostile Balkan states eye Ottoman territories in Rumelia with predatory ambition. Surrounded by existential perils, the Sublime Porte must modernize rapidly or face the total partition of its ancient domain."

 # --- British Empire (George V / H. H. Asquith) ---
 ENG_GATHERING_STORM_DESC:0 "In June 1911, King George V celebrates his solemn coronation in London as monarch of an empire spanning one-quarter of the globe, guarded by the Royal Navy under the aegis of Pax Britannica. Yet beneath the imperial majesty, Great Britain grapples with intense domestic turmoil: Prime Minister H. H. Asquith's Liberal administration is locked in bitter constitutional struggle over the powers of the House of Lords and the incendiary issue of Irish Home Rule. On the oceans, the Admiralty is forced to pour colossal funds into dreadnought construction to preserve the vital Two-Power Standard against German naval expansion. Bound to France through the Entente Cordiale and to Russia through diplomatic accord, London finds itself drawn inexorably into the continental vortex to protect the delicate balance of European power."
 WW1_ENG_GATHERING_STORM_DESC:0 "In June 1911, King George V celebrates his solemn coronation in London as monarch of an empire spanning one-quarter of the globe, guarded by the Royal Navy under the aegis of Pax Britannica. Yet beneath the imperial majesty, Great Britain grapples with intense domestic turmoil: Prime Minister H. H. Asquith's Liberal administration is locked in bitter constitutional struggle over the powers of the House of Lords and the incendiary issue of Irish Home Rule. On the oceans, the Admiralty is forced to pour colossal funds into dreadnought construction to preserve the vital Two-Power Standard against German naval expansion. Bound to France through the Entente Cordiale and to Russia through diplomatic accord, London finds itself drawn inexorably into the continental vortex to protect the delicate balance of European power."

 # --- French Third Republic (Armand Fallières / Joseph Caillaux) ---
 FRA_GATHERING_STORM_DESC:0 "Forty years after the catastrophe of the Franco-Prussian War, the French Third Republic remains steadfastly dedicated to the sacred memory of 1870 and the redemption of the lost provinces of Alsace-Lorraine. Presided over by President Armand Fallières and the newly installed ministry of Joseph Caillaux, France radiates cultural brilliance and commands a vast colonial empire. The French Army, placing absolute faith in the offensive spirit of 'Élan Vital' and the rapid-fire perfection of the Canon de 75mm modèle 1897, stands prepared for total conflict. With French forces deployed deep into Morocco and German gunboat SMS Panther steaming toward Agadir, Paris looks to its ironclad alliance with Imperial Russia and the Entente Cordiale with Great Britain to resist German intimidation."
 WW1_FRA_GATHERING_STORM_DESC:0 "Forty years after the catastrophe of the Franco-Prussian War, the French Third Republic remains steadfastly dedicated to the sacred memory of 1870 and the redemption of the lost provinces of Alsace-Lorraine. Presided over by President Armand Fallières and the newly installed ministry of Joseph Caillaux, France radiates cultural brilliance and commands a vast colonial empire. The French Army, placing absolute faith in the offensive spirit of 'Élan Vital' and the rapid-fire perfection of the Canon de 75mm modèle 1897, stands prepared for total conflict. With French forces deployed deep into Morocco and German gunboat SMS Panther steaming toward Agadir, Paris looks to its ironclad alliance with Imperial Russia and the Entente Cordiale with Great Britain to resist German intimidation."

 # --- Russian Empire (Tsar Nicholas II) ---
 SOV_GATHERING_STORM_DESC:0 "Under the autocratic scepter of Tsar Nicholas II, the Russian Empire is experiencing a profound resurgence following the convulsive shocks of the 1905 Revolution and defeat in Manchuria. Driven by Prime Minister Pyotr Stolypin's bold agrarian reforms and unprecedented industrial expansion funded by massive French loans, Russia's economic and demographic strength is expanding exponentially. Sweeping reorganization and re-equipment programs are rapidly rebuilding the Imperial Army and Navy, stoking dread in Berlin and Vienna. Standing proudly as the historical protector and patron of Orthodox and Slavic nations across the Balkans, Saint Petersburg is determined that any further Austro-Hungarian expansion will be met with the full, unyielding fury of the Russian empire."
 WW1_SOV_GATHERING_STORM_DESC:0 "Under the autocratic scepter of Tsar Nicholas II, the Russian Empire is experiencing a profound resurgence following the convulsive shocks of the 1905 Revolution and defeat in Manchuria. Driven by Prime Minister Pyotr Stolypin's bold agrarian reforms and unprecedented industrial expansion funded by massive French loans, Russia's economic and demographic strength is expanding exponentially. Sweeping reorganization and re-equipment programs are rapidly rebuilding the Imperial Army and Navy, stoking dread in Berlin and Vienna. Standing proudly as the historical protector and patron of Orthodox and Slavic nations across the Balkans, Saint Petersburg is determined that any further Austro-Hungarian expansion will be met with the full, unyielding fury of the Russian empire."

 # --- Kingdom of Italy (Victor Emmanuel III / Giovanni Giolitti) ---
 ITA_GATHERING_STORM_DESC:0 "The Kingdom of Italy stands at a decisive crossroads under King Victor Emmanuel III and the veteran statesman Prime Minister Giovanni Giolitti. While the northern industrial triangle of Milan, Turin, and Genoa experiences dynamic technological and manufacturing growth, the agrarian south suffers deep poverty and mass emigration. Although formally bound to Germany and Austria-Hungary within the Triple Alliance, Rome's popular passions remain consumed by irredentist claims to Habsburg-ruled Trento and Trieste. To bolster national prestige and satisfy aggressive colonialist clamor, Giolitti's ministry is actively preparing diplomatic maneuvers and a military assault to conquer Ottoman Tripolitania and Cyrenaica, risking regional war in the Mediterranean."
 WW1_ITA_GATHERING_STORM_DESC:0 "The Kingdom of Italy stands at a decisive crossroads under King Victor Emmanuel III and the veteran statesman Prime Minister Giovanni Giolitti. While the northern industrial triangle of Milan, Turin, and Genoa experiences dynamic technological and manufacturing growth, the agrarian south suffers deep poverty and mass emigration. Although formally bound to Germany and Austria-Hungary within the Triple Alliance, Rome's popular passions remain consumed by irredentist claims to Habsburg-ruled Trento and Trieste. To bolster national prestige and satisfy aggressive colonialist clamor, Giolitti's ministry is actively preparing diplomatic maneuvers and a military assault to conquer Ottoman Tripolitania and Cyrenaica, risking regional war in the Mediterranean."

 # --- United States of America (William Howard Taft) ---
 USA_GATHERING_STORM_DESC:0 "Entering the summer of 1911, the United States stands as the preeminent economic colossus of the Western Hemisphere, surpassing all Old World empires in industrial output, raw materials, and agricultural riches. Guided by President William Howard Taft, the Progressive Era transforms American society through rigorous antitrust enforcement, judicial reform, and manufacturing breakthroughs spearheaded by Henry Ford's revolution in mass production. Devoted to the Monroe Doctrine and utilizing 'Dollar Diplomacy' to project influence across Latin America and the Pacific, the American public remains deeply wedded to historic isolationism and suspicious of European militarism. Yet as its modern steel navy grows, America's burgeoning might is destined to shape global history."
 WW1_USA_GATHERING_STORM_DESC:0 "Entering the summer of 1911, the United States stands as the preeminent economic colossus of the Western Hemisphere, surpassing all Old World empires in industrial output, raw materials, and agricultural riches. Guided by President William Howard Taft, the Progressive Era transforms American society through rigorous antitrust enforcement, judicial reform, and manufacturing breakthroughs spearheaded by Henry Ford's revolution in mass production. Devoted to the Monroe Doctrine and utilizing 'Dollar Diplomacy' to project influence across Latin America and the Pacific, the American public remains deeply wedded to historic isolationism and suspicious of European militarism. Yet as its modern steel navy grows, America's burgeoning might is destined to shape global history."

 # --- Other Countries (Global Overview) ---
 OTHER_GATHERING_STORM_DESC:0 "In June 1911, human civilization reaches the glittering zenith of the Belle Époque. In the grand capitals of Europe and across the burgeoning metropolises of the Americas, extraordinary advances in electricity, aviation, wireless telegraphy, and industry proclaim a golden age of human triumph. Yet beneath this brilliant facade, the global order is fraught with peril. Across Africa and Asia, subjugated millions chafe under colonial rule, while revolution shakes Mexico and tremors of rebellion ripple through Qing China. Chained together by secret military pacts, inflexible mobilization timetables, and an unprecedented arms race of dreadnoughts and machine guns, the great nations of the world march blissfully unaware toward the brink of unprecedented slaughter."
