l_english:
 ww1_diplomacy.30.t:0 "An Eastern Peace Proposal"
 ww1_diplomacy.30.d:0 "The Russian delegation requests terms. Authorising a settlement sends an offer back; the war continues until both governments accept."
 ww1_diplomacy.30.a:0 "Send conditional territorial terms"
 ww1_diplomacy.30.b:0 "Continue the war"
 ww1_diplomacy.31.t:0 "An Invitation to Eastern Negotiations"
 ww1_diplomacy.31.d:0 "Germany proposes talks. Our delegates may request terms without surrendering territory or ending the war at this stage."
 ww1_diplomacy.31.a:0 "Request the terms"
 ww1_diplomacy.31.b:0 "Decline the invitation"
 ww1_diplomacy.32.t:0 "The Price of an Eastern Settlement"
 ww1_diplomacy.32.d:0 "Germany demands recognition of its occupation in the Polish and Baltic frontier districts it actually controls. Accepting withdraws us from the alliance and ends our wars with the Central Powers. Our interior and unoccupied districts remain ours; the economic consequences of the war remain."
 ww1_diplomacy.32.a:0 "Accept the settlement"
 ww1_diplomacy.32.b:0 "Reject these terms"
 ww1_diplomacy.33.t:0 "The Negotiations Have Been Refused"
 ww1_diplomacy.33.d:0 "The German government refuses the proposed talks. No territorial or military settlement has taken effect."
 ww1_diplomacy.33.a:0 "The war continues"
 ww1_eastern.1.t:0 "Deadlock at the Eastern Talks"
 ww1_eastern.1.d:0 "The other government has declined. Negotiations do not end the war or transfer territory without an agreement."
 ww1_eastern.1.a:0 "Maintain our position"
 ww1_eastern.2.t:0 "The Eastern Settlement Enters into Force"
 ww1_eastern.2.d:0 "Russia has accepted the conditions. The signed agreement changes only occupied frontier districts and Russia has withdrawn from the war against the Central Powers. Other belligerents remain bound by their own decisions."
 ww1_eastern.2.a:0 "Prepare for the next task"
 ww1_france.93.t:0 "Military Justice and the Mutinies"
 ww1_france.93.d:0 "The disciplinary crisis requires a response. Collective punishment risks undermining legitimacy; a programme of relief and leave consumes resources and temporarily reduces offensive activity."
 ww1_france.93.a:0 "Maintain the harsh disciplinary policy"
 ww1_france.93.b:0 "Order leave and relief arrangements"
 ww1_eastern_territorial_terms_tt:0 "Only Russian-owned Polish/Baltic frontier districts already controlled by Germany are transferred. No unoccupied district or Russian interior is ceded."
 ww1_france.131.t:0 "O Armistício de Compiègne"
 ww1_france.131.d:0 "Hostilities have already ended. The government records the armistice and opens reconstruction; this record does not force other countries to accept a peace."
 ww1_france.132.d:0 "Alsace is already under French sovereignty. The government restores its constitutional integration; this decision makes no additional territorial transfer."
 ww1_france.253.d:0 "The American government authorises a supply offer. Rifles and artillery are dispatched only if the requested stocks exist; the agreement does not manufacture tanks or equipment by decree."
