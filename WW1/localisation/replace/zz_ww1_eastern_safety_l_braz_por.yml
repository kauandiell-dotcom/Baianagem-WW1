l_braz_por:
 ww1_eastern_terms_expired_tt:0 "As negociações expiraram ou suas condições mudaram. Nenhum território é transferido e nenhuma guerra é encerrada."
 ww1_diplomacy.32.d:0 "A Alemanha exige o reconhecimento de sua ocupação nos distritos fronteiriços poloneses e bálticos que realmente controla. As condições valem por trinta dias e somente para o governo destinatário. Aceitar nos retira da aliança e encerra nossas guerras com as Potências Centrais. O interior e os distritos não ocupados permanecem nossos; a recuperação econômica é separada."
