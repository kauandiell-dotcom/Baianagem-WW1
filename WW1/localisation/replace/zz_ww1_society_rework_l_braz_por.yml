l_braz_por:
 GER_relief_step_1_desc:0 "Reserva duas fábricas civis por 90 dias para executar um programa de recuperação. A crise melhora somente quando o projeto termina; paz ou capitulação o cancelam."
 GER_relief_step_2_desc:0 "Reserva duas fábricas civis por 90 dias para executar um programa de recuperação. A crise melhora somente quando o projeto termina; paz ou capitulação o cancelam."
 GER_relief_step_3_desc:0 "Reserva duas fábricas civis por 90 dias para executar um programa de recuperação. A crise melhora somente quando o projeto termina; paz ou capitulação o cancelam. A recuperação final exige que a pressão causadora tenha terminado."
