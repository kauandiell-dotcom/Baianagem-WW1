l_braz_por:
 ww1_diplomacy.30.t:0 "Proposta de paz no leste"
 ww1_diplomacy.30.d:0 "A delegação russa solicita condições. Autorizar a negociação envia uma proposta de volta; a guerra continua até os dois governos aceitarem."
 ww1_diplomacy.30.a:0 "Enviar condições territoriais"
 ww1_diplomacy.30.b:0 "Continuar a guerra"
 ww1_diplomacy.31.t:0 "Convite para negociações no leste"
 ww1_diplomacy.31.d:0 "A Alemanha propõe conversações. Nossos delegados podem solicitar condições sem ceder território ou encerrar a guerra nesta etapa."
 ww1_diplomacy.31.a:0 "Solicitar as condições"
 ww1_diplomacy.31.b:0 "Recusar o convite"
 ww1_diplomacy.32.t:0 "O preço de um acordo no leste"
 ww1_diplomacy.32.d:0 "A Alemanha exige o reconhecimento da ocupação nos distritos poloneses e bálticos que efetivamente controla. Aceitar retira nosso país da aliança e encerra nossas guerras com as Potências Centrais. O interior e os distritos não ocupados permanecem nossos; as consequências econômicas da guerra continuam."
 ww1_diplomacy.32.a:0 "Aceitar o acordo"
 ww1_diplomacy.32.b:0 "Rejeitar estas condições"
 ww1_diplomacy.33.t:0 "As negociações foram recusadas"
 ww1_diplomacy.33.d:0 "O governo alemão recusa as conversações propostas. Nenhum acordo territorial ou militar entrou em vigor."
 ww1_diplomacy.33.a:0 "A guerra continua"
 ww1_eastern.1.t:0 "Impasse nas conversações do leste"
 ww1_eastern.1.d:0 "O outro governo recusou. As negociações não encerram a guerra nem transferem território sem um acordo."
 ww1_eastern.1.a:0 "Manter nossa posição"
 ww1_eastern.2.t:0 "O acordo do leste entra em vigor"
 ww1_eastern.2.d:0 "A Rússia aceitou as condições. O acordo modifica apenas os distritos fronteiriços ocupados e encerra a participação russa na guerra contra as Potências Centrais. Os demais beligerantes continuam sujeitos às suas próprias decisões."
 ww1_eastern.2.a:0 "Preparar a próxima tarefa"
 ww1_france.93.t:0 "Justiça militar e os motins"
 ww1_france.93.d:0 "A crise disciplinar exige uma resposta. A punição coletiva pode enfraquecer a legitimidade; um programa de descanso e permissões exige recursos e reduz temporariamente a atividade ofensiva."
 ww1_france.93.a:0 "Manter a política disciplinar severa"
 ww1_france.93.b:0 "Organizar descanso e rendição das unidades"
 ww1_eastern_territorial_terms_tt:0 "Somente distritos fronteiriços poloneses e bálticos de propriedade russa já controlados pela Alemanha são transferidos. Nenhum distrito não ocupado ou região do interior russo é cedido."
 ww1_france.131.t:0 "Registro do armistício"
 ww1_france.131.d:0 "As hostilidades já terminaram. O governo registra o armistício e inicia a reconstrução; este registro não obriga outros países a aceitarem uma paz."
 ww1_france.132.d:0 "A Alsácia já está sob soberania francesa. O governo restaura sua integração constitucional; esta decisão não realiza novas transferências territoriais."
 ww1_france.253.d:0 "O governo americano autoriza uma oferta de suprimentos. Fuzis e artilharia são enviados somente se os estoques solicitados existirem; o acordo não fabrica tanques ou equipamentos por decreto."
