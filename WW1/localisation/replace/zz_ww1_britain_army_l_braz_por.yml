l_braz_por:
 ENG_ww1_the_haldane_establishment_desc:0 "As reformas de Haldane criam um Estado-Maior Geral, uma Força Expedicionária e uma Força Territorial. Ganha 15 de poder político, 3 de experiência de exército e a instituição Reformas de Haldane (tempo de treinamento -10%)."
 ENG_ww1_territorial_force_camps_desc:0 "Todo verão, voluntários da Força Territorial acampam por duas semanas, entre o emprego e a família. Ganha 2 de experiência de exército e 1% de estabilidade."
 ENG_ww1_the_special_reserve_desc:0 "A Reserva Especial treina ex-soldados e novos recrutas para completar os batalhões regulares no dia da mobilização. Ganha 15.000 de mão de obra; a dívida sobe 1."
 ENG_ww1_officer_training_corps_desc:0 "Escolas públicas e universidades formam jovens oficiais que, em 1914, comandarão pelotões. Ganha 4 de experiência de exército."
 ENG_ww1_regular_army_mobilisation_desc:0 "Tabelas de mobilização dizem em que trem, em que dia e em que porto cada batalhão regular embarca. Ganha 10 de poder político e 3 de experiência de exército."
 ENG_ww1_army_service_corps_offices_desc:0 "O Corpo de Serviço do Exército organiza depósitos, caminhões e pão de campanha. Ganha bônus de pesquisa de 25% em logística (uso único)."
 ENG_ww1_the_expeditionary_establishment_desc:0 "A Força Expedicionária ganha seis divisões de infantaria e uma de cavalaria, prontas para cruzar o Canal. Ganha 5 de experiência de exército e 10 de poder político; a dívida sobe 1."
 ENG_ww1_kitchener_new_armies_desc:0 "Kitchener pede um milhão de voluntários: o pequeno exército profissional cede lugar ao exército de massa. Remove a força voluntária restrita inicial, ganha 25.000 de mão de obra e a instituição Novos Exércitos (moral do exército +5%, capacidade industrial -3%); apoio trabalhista -2."
 ENG_ww1_the_pals_battalion_system_desc:0 "Amigos, vizinhos e colegas de trabalho se alistam juntos e servem juntos. Ganha 10.000 de mão de obra e a instituição Batalhões de Amigos (organização do exército +5%); uma só batalha pode destruir uma cidade inteira."
 ENG_ww1_the_rifle_training_depots_desc:0 "A Fábrica Real de Enfield e a Escola de Hythe ampliam a produção e o treino de tiro rápido. Enfileira 1 fábrica militar em Londres, ganha 2 de experiência de exército e bônus de 25% em armas de infantaria."
 ENG_ww1_field_medical_organisation_desc:0 "Postos de socorro, hospitais de evacuação e trens-hospital salvam feridos que antes morreriam. Ganha 1% de estabilidade e bônus de pesquisa de 25% em hospitais de campanha (uso único)."
 ENG_ww1_the_artillery_observation_school_desc:0 "A escola de Larkhill ensina a observar o alvo, medir o erro e corrigir o tiro de artilharia. Ganha 2 de experiência de exército e bônus de pesquisa de 25% em reconhecimento (uso único)."
 ENG_ww1_machine_gun_corps_formation_desc:0 "O Corpo de Metralhadoras concentra as armas em companhias próprias, com oficiais treinados para cada tiro. Ganha 5 de experiência de exército; a dívida sobe 1."
 ENG_ww1_trench_mortar_sections_desc:0 "Oficinas em Birmingham produzem morteiros Stokes para dar artilharia de trincheira à infantaria. Enfileira 1 fábrica militar nas Midlands, ganha 2 de experiência de exército e bônus de 25% em artilharia."
 ENG_ww1_gas_protection_training_desc:0 "Depois de Ypres, máscaras de flanela dão lugar ao respirador em caixa, e a disciplina de gás vira exercício diário. Ganha 3 de experiência de exército e 1% de apoio à guerra; a dívida sobe 1."
 ENG_ww1_the_infantry_training_directorate_desc:0 "A Diretoria de Treinamento de Infantaria padroniza o manual, da seção ao batalhão. Ganha 10 de poder político e a instituição Diretoria de Treinamento (tempo de treinamento -10%, experiência de exército +5%)."
 ENG_ww1_combined_arms_staff_courses_desc:0 "Cursos de estado-maior unem infantaria, artilharia, engenharia e aviação no mesmo plano. Ganha 6 de experiência de exército e a instituição Armas Combinadas (velocidade de planejamento +10%)."
 ENG_ww1_the_demobilisation_register_desc:0 "Milhões de homens querem voltar para casa. O registro decide a ordem: tempo de serviço, emprego garantido ou unidades inteiras. Dispara o evento da desmobilização."
 ENG_ww1_a_smaller_professional_force_desc:0 "O Exército volta a ser pequeno e profissional, com o Império como missão principal. A dívida cai 3; ganha 15 de poder político e 1% de estabilidade. Exclui a renovação territorial."
 ENG_ww1_territorial_defence_renewal_desc:0 "O Exército Territorial renasce em 1920 com os veteranos voluntários. A dívida sobe 1; ganha 5 de experiência de exército, 10 de poder político e 1% de estabilidade. Exclui a força profissional menor."
 ENG_ww1_the_channel_mobilisation_timetable_desc:0 "Depois de Agadir, o general Henry Wilson e o Estado-Maior fixam horários de trem e navios para o Canal. Ganha 10 de poder político e 3 de experiência de exército."
 ENG_ww1_embarkation_depot_preparation_desc:0 "Southampton, Portsmouth e Folkestone recebem depósitos, cais e ampliação de base naval. Adiciona 1 nível de base naval no sudeste e bônus de pesquisa de 25% em transporte ferroviário."
 ENG_ww1_the_bef_deployment_plan_desc:0 "Em agosto de 1914, a Força Expedicionária Britânica cruza o Canal. A França recebe os ingleses com entusiasmo. Ganha 5 de experiência de exército; a França ganha apoio à guerra."
 ENG_ww1_the_flanders_supply_organisation_desc:0 "Boulogne, Calais e Dunquerque viram portos de suprimento, com ferrovias e canais até a linha. A dívida sobe 1; ganha a instituição Suprimento de Flandres (consumo de suprimentos -5%)."
 ENG_ww1_holding_the_continental_line_desc:0 "Mons, Le Cateau e a Primeira Ypres custam o exército regular quase inteiro, mas a linha resiste. Ganha 6 de experiência de exército; o apoio à guerra cai 1%."
 ENG_ww1_artillery_ammunition_concentration_desc:0 "Antes da ofensiva, caixas de munição são empilhadas atrás das baterias, por dias. A dívida sobe 1 e ganha 3 de experiência de exército."
 ENG_ww1_a_limited_offensive_doctrine_desc:0 "Rawlinson defende morder um pedaço limitado da linha e segurá-lo contra os contra-ataques. Ganha 4 de experiência de exército e 10 de poder político."
 ENG_ww1_the_dardanelles_staff_study_desc:0 "Churchill quer forçar os Dardanelos e abrir o caminho até Constantinopla. Fisher e Kitchener duvidam. Dispara o debate sobre o estreito: tentativa naval, desembarque conjunto ou arquivar o plano."
 ENG_ww1_mediterranean_landing_preparation_desc:0 "Lemnos e Mudros viram bases de desembarque, com barcaças, cais e hospitais. Ganha 3 de experiência de exército e 2 de experiência naval."
 ENG_ww1_mesopotamian_supply_review_desc:0 "Um exército no Tigre precisa de rios, barcos, ferrovias e água potável que ninguém planejou. Ganha bônus de pesquisa de 25% em manutenção (uso único); o cerco de Kut será menos pesado."
 ENG_ww1_the_western_offensive_staff_study_desc:0 "Loos e Festubert mostram o que falta: munição, reservas e comando. O estado-maior anota cada erro. Ganha 4 de experiência de exército e 10 de poder político."
 ENG_ww1_the_creeping_barrage_school_desc:0 "A cortina de fogo avança poucos metros por minuto, à frente da infantria. Ganha a instituição Cortina de Fogo (ataque de artilharia +5%) e bônus de pesquisa de 25% em artilharia (uso único)."
 ENG_ww1_tank_committee_experiments_desc:0 "O Comitê dos Navios Terrestres financia protótipos de um veículo blindado sobre esteiras. A dívida sobe 1 e ganha bônus de pesquisa de 25% em blindados (uso único)."
 ENG_ww1_assault_coordination_exercises_desc:0 "Infantaria, artilharia e tanques ensaiam o ataque em terreno marcado com fitas e estacas. Ganha 4 de experiência de exército, mais 2 se o programa de tanques existe."
 ENG_ww1_palestine_railway_liaison_desc:0 "Allenby constrói ferrovia e canal de água potável no Sinai para alcançar Gaza. Adiciona 1 nível de infraestrutura no Sinai, ganha 3 de experiência de exército, 10 de poder político e bônus de pesquisa de 25% em ferrovias."
 ENG_ww1_the_spring_defence_plan_desc:0 "O estado-maior espera a grande ofensiva alemã de 1918 e prepara defesa em profundidade: zona avançada fraca, zona de batalha forte, reservas atrás. Ganha 10 de poder político e 3 de experiência de exército."
 ENG_ww1_the_allied_counteroffensive_plan_desc:0 "Foch coordena os exércitos aliados para uma ofensiva geral. Haig, Rawlinson e os canadenses planejam Amiens. Dispara o evento da ofensiva."
 ENG_ww1_operational_reserve_restoration_desc:0 "Lloyd George retinha reservas na Inglaterra, e a Quinta Exército quase desaparece em março. Reconstruir a reserva custa chamar homens mais velhos e mais jovens. Ganha 15.000 de mão de obra e 3 de experiência de exército; o apoio trabalhista cai 2."
 ENG_ww1_the_armistice_stand_down_plan_desc:0 "O armistício de 11 de novembro suspende as operações. O plano organiza a ocupação da Renânia e a volta das tropas. Ganha 15 de poder político e 1% de estabilidade."
 ENG_ww1_lessons_for_the_general_staff_desc:0 "O Estado-Maior Geral escreve a história oficial e os manuais de 1919, com o que a guerra ensinou. Ganha 10 de experiência de exército, 15 de poder político e a instituição Lições da Guerra (experiência de exército ganha +10%)."
 ww1_britain_mil.2.t:0 "A decisão dos Dardanelos"
 ww1_britain_mil.2.d:0 "Churchill defende que a frota force o estreito e chegue a Constantinopla. Fisher e Kitchener duvidam da aventura, e o Conselho de Guerra precisa de uma decisão rápida, antes que a Turquia reforce as fortalezas."
 ww1_britain_mil.2.a:0 "Tentar só com a frota. (experiência naval +3, dívida +1)"
 ww1_britain_mil.2.b:0 "Fazer um desembarque conjunto. (experiência de exército +4, experiência naval +2, estabilidade -1%)"
 ww1_britain_mil.2.c:0 "Arquivar o plano. (+10 de poder político)"
 ww1_britain_mil.3.t:0 "O cerco de Kut"
 ww1_britain_mil.3.d:0 "A Sexta Divisão indiana, cercada em Kut-al-Amara pelos turcos, está sem comida. Os ataques de socorro falham na lama e nas inundações do Tigre. A rendição é questão de semanas."
 ww1_britain_mil.3.a:0 "Tentar mais um ataque de socorro. (-10 de poder político, experiência de exército +4; apoio à guerra -1% com revisão de suprimento, senão -2%)"
 ww1_britain_mil.3.b:0 "Negociar a saída com os oficiais turcos. (dívida +1, apoio à guerra -1%)"
 ww1_britain_mil.4.t:0 "O primeiro dia do Somme"
 ww1_britain_mil.4.d:0 "Em 1º de julho de 1916 os batalhões de voluntários sobem das trincheiras em linha. Em poucas horas há quase sessenta mil baixas, e cidades inteiras perdem seus jovens. Haig exige continuar a batalha."
 ww1_britain_mil.4.a:0 "Aceitar as perdas e continuar a ofensiva. (experiência de exército +6, apoio à guerra -3%)"
 ww1_britain_mil.4.b:0 "Espalhar as perdas entre os regimentos. (estabilidade +1%, apoio à guerra -1%, experiência de exército +2)"
 ww1_britain_mil.5.t:0 "A desmobilização"
 ww1_britain_mil.5.d:0 "Milhões de homens esperam a volta para casa. O gabinete decide se vale o tempo de serviço, o emprego garantido ou a manutenção de unidades inteiras. Quem fica mais tempo na França pensa que é injusto."
 ww1_britain_mil.5.a:0 "Liberar por tempo de serviço e necessidade civil. (estabilidade +2%, dívida +1, apoio trabalhista +3)"
 ww1_britain_mil.5.b:0 "Manter as unidades juntas e liberar devagar. (estabilidade -1%, apoio trabalhista -3, dívida -1)"
 ww1_britain_mil.6.t:0 "A ofensiva de primavera alemã"
 ww1_britain_mil.6.d:0 "Em 21 de março de 1918 os alemães atacam na Picardia com nevoeiro e bombardeio de gás. A Quinta Exército cede, e a linha aliada corre o risco de se partir entre britânicos e franceses."
 ww1_britain_mil.6.a:0 "Trocar terreno por tempo. (-10 de poder político, experiência de exército +6; apoio à guerra -0,5% com o plano de defesa, senão -2%)"
 ww1_britain_mil.6.b:0 "Manter a zona avançada a qualquer custo. (experiência de exército +3, apoio à guerra -3%, dívida +1)"
 ww1_britain_mil.7.t:0 "Amiens, o dia negro"
 ww1_britain_mil.7.d:0 "Em 8 de agosto de 1918 tanques, canadenses e australianos rompem a linha alemã sob a neblina. Ludendorff chama o dia de o dia negro do exército alemão. Haig e Foch precisam decidir se aprofundam o avanço."
 ww1_britain_mil.7.a:0 "Pressionar em toda a frente. (experiência de exército +8, apoio à guerra +3%, dívida +1)"
 ww1_britain_mil.7.b:0 "Parar para trazer as armas. (experiência de exército +4, +10 de poder político)"
 ww1_britain_mil.8.t:0 "Os motins de Calais"
 ww1_britain_mil.8.d:0 "Soldados cansados de esperar em Folkestone e Calais se recusam a embarcar de volta à França e elegem comitês. Os generais temem uma revolução, e Churchill, no Ministério da Guerra, prepara uma resposta."
 ww1_britain_mil.8.a:0 "Acelerar as liberações imediatamente. (estabilidade +1%, dívida +1)"
 ww1_britain_mil.8.b:0 "Enviar unidades leais para restabelecer a ordem. (estabilidade -2%, +10 de poder político, apoio trabalhista -4)"
 ww1_britain_mil.10.t:0 "Os ingleses chegam"
 ww1_britain_mil.10.d:0 "Desembarcam em Boulogne e Le Havre os primeiros batalhões da Força Expedicionária Britânica. A multidão aplaude os soldados cáqui, e Paris recupera a esperança de que não estará só."
 ww1_britain_mil.10.a:0 "Receber a Força Expedicionária. (apoio à guerra +2%, estabilidade +1%)"
 ww1_britain_mil.11.t:0 "A frota aliada no estreito"
 ww1_britain_mil.11.d:0 "Navios aliados bombardeiam as fortalezas de Dardanelos. O governo em Constantinopla tem poucos canhões e pouca munição, mas o país se levanta: a ameaça contra a capital une até os adversários."
 ww1_britain_mil.11.a:0 "Defender os estreitos a qualquer custo. (apoio à guerra +3%, estabilidade +2%)"
 ww1_britain_mil.12.t:0 "O dia negro do exército alemão"
 ww1_britain_mil.12.d:0 "Divisões inteiras se rendem com poucos tiros. Ludendorff diz ao Kaiser que a guerra não pode mais ser ganha pela força. O estado-maior precisa decidir como falar disso ao país."
 ww1_britain_mil.12.a:0 "Ordenar que as tropas resistam. (apoio à guerra -2%, estabilidade -1%)"
 ww1_britain_mil.12.b:0 "Procurar o chanceler para pedir o armistício. (apoio à guerra -3%, estabilidade -2%)"
 ww1_britain_mil.13.t:0 "Oficiais de ligação britânicos"
 ww1_britain_mil.13.d:0 "Londres oferece enviar oficiais de estado-maior ao quartel-general aliado para coordenar planos, suprimentos e transporte. Os comandantes locais ficam divididos entre a utilidade e o orgulho."
 ww1_britain_mil.13.a:0 "Aceitar os oficiais. (experiência de exército +2; a experiência de exército britânica +2)"
 ww1_britain_mil.13.b:0 "Recusar. (sem efeitos)"
 ENG_ww1_haldane_reforms:0 "Reformas de Haldane"
 ENG_ww1_haldane_reforms_desc:0 "Um exército pequeno, mas organizado, com reservas treinadas e um estado-maior."
 ENG_ww1_kitchener_armies:0 "Novos Exércitos"
 ENG_ww1_kitchener_armies_desc:0 "Milhares de voluntários entram no exército, e as fábricas sentem a falta deles."
 ENG_ww1_pals_battalions:0 "Batalhões de Amigos"
 ENG_ww1_pals_battalions_desc:0 "Homens da mesma rua lutam juntos. A coesão é maior, mas uma batalha pode destruir uma cidade."
 ENG_ww1_flanders_supply:0 "Suprimento de Flandres"
 ENG_ww1_flanders_supply_desc:0 "Portos, canais e ferrovias levam suprimentos à frente com menos desperdício."
 ENG_ww1_training_directorate:0 "Diretoria de Treinamento"
 ENG_ww1_training_directorate_desc:0 "Um só manual e uma só doutrina, da seção ao batalhão."
 ENG_ww1_combined_arms_staff:0 "Armas Combinadas"
 ENG_ww1_combined_arms_staff_desc:0 "Estados-maiores aprendem a planejar infantaria, artilharia e aviação como um só sistema."
 ENG_ww1_creeping_barrage:0 "Cortina de Fogo"
 ENG_ww1_creeping_barrage_desc:0 "A artilharia avança à frente da infantria, segundo o relógio."
 ENG_ww1_general_staff_lessons:0 "Lições da Guerra"
 ENG_ww1_general_staff_lessons_desc:0 "O estado-maior transforma quatro anos de erros em manuais."
 ENG_ww1_staff_college_course:0 "Curso do Colégio de Estado-Maior"
 ENG_ww1_staff_college_course_desc:0 "Gasta 25 de poder político. Em guerra, ganha 5 de experiência de exército e a dívida sobe 1. Disponível uma vez por ano, depois dos cursos de armas combinadas."
 ENG_ww1_send_liaison_officers:0 "Enviar oficiais de ligação"
 ENG_ww1_send_liaison_officers_desc:0 "Gasta 20 de poder político. Em guerra, oferece oficiais de estado-maior a cada aliado da facção, que decide se aceita. Quem aceita e o Reino Unido ganham 2 de experiência de exército. Exige o plano de implantação da Força Expedicionária."
