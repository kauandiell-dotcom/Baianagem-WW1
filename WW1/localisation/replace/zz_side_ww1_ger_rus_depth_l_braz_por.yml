l_braz_por:
 side_ww1_GER_administration:0 "A Economia de Guerra Alemã"
 side_ww1_GER_administration_desc:0 "Os programas militares disputam as mesmas oficinas, ferrovias e mão de obra. Instituições substituem suas antecessoras; uma alocação temporária pode favorecer apenas uma prioridade."
 side_ww1_SOV_administration:0 "Mobilização e Abastecimento Russos"
 side_ww1_SOV_administration_desc:0 "Coordenação industrial, capacidade ferroviária e armas importadas precisam avançar juntas. O fornecimento externo exige resposta aliada, porto receptor disponível e reservas reais do fornecedor."
 side_ww1_GER_armaments_priority:0 "Prioridade às Encomendas do Exército"
 side_ww1_GER_armaments_priority_desc:0 "Concentrar as oficinas nas encomendas do exército por 180 dias. A construção civil desacelera e a parcela destinada aos bens de consumo aumenta."
 side_ww1_GER_armaments_priority_project:0 "Prioridade às Encomendas do Exército"
 side_ww1_GER_armaments_priority_project_desc:0 "Comprometer 2 fábricas civis durante 60 dias e 40 de poder político. Concentrar as oficinas nas encomendas do exército por 180 dias. A construção civil desacelera e a parcela destinada aos bens de consumo aumenta. Outra alocação não pode começar antes do término da atual."
 side_ww1_GER_naval_priority:0 "Prioridade à Frota"
 side_ww1_GER_naval_priority_desc:0 "Os estaleiros recebem prioridade por 180 dias, em detrimento da produção das fábricas militares. Um investimento naval não maximiza simultaneamente a produção do exército."
 side_ww1_GER_naval_priority_project:0 "Prioridade à Frota"
 side_ww1_GER_naval_priority_project_desc:0 "Comprometer 2 fábricas civis durante 60 dias e 40 de poder político. Os estaleiros recebem prioridade por 180 dias, em detrimento da produção das fábricas militares. Um investimento naval não maximiza simultaneamente a produção do exército. Outra alocação não pode começar antes do término da atual."
 side_ww1_GER_distribution_priority:0 "Prioridade às Ferrovias e à Distribuição"
 side_ww1_GER_distribution_priority_desc:0 "A construção ferroviária e a confiança política recebem prioridade por 180 dias. A produção bélica cai; o programa não cria alimentos nem remove o bloqueio."
 side_ww1_GER_distribution_priority_project:0 "Prioridade às Ferrovias e à Distribuição"
 side_ww1_GER_distribution_priority_project_desc:0 "Comprometer 2 fábricas civis durante 60 dias e 40 de poder político. A construção ferroviária e a confiança política recebem prioridade por 180 dias. A produção bélica cai; o programa não cria alimentos nem remove o bloqueio. Outra alocação não pode começar antes do término da atual."
 side_ww1_SOV_state_contracts:0 "Contratos Militares Centralizados"
 side_ww1_SOV_state_contracts_desc:0 "A coordenação central melhora a produção e a eficiência produtiva por 180 dias, aumentando a parcela de bens de consumo necessária à administração."
 side_ww1_SOV_state_contracts_project:0 "Contratos Militares Centralizados"
 side_ww1_SOV_state_contracts_project_desc:0 "Comprometer 2 fábricas civis durante 60 dias e 40 de poder político. A coordenação central melhora a produção e a eficiência produtiva por 180 dias, aumentando a parcela de bens de consumo necessária à administração. Outra alocação não pode começar antes do término da atual."
 side_ww1_SOV_civic_contracts:0 "Contratos com a Indústria Civil"
 side_ww1_SOV_civic_contracts_desc:0 "A cooperação com comitês industriais e civis gera um ganho industrial menor e maior confiança por 180 dias, enquanto as negociações consomem capacidade política."
 side_ww1_SOV_civic_contracts_project:0 "Contratos com a Indústria Civil"
 side_ww1_SOV_civic_contracts_project_desc:0 "Comprometer 2 fábricas civis durante 60 dias e 40 de poder político. A cooperação com comitês industriais e civis gera um ganho industrial menor e maior confiança por 180 dias, enquanto as negociações consomem capacidade política. Outra alocação não pode começar antes do término da atual."
 side_ww1_SOV_railway_priority:0 "Prioridade às Ferrovias Militares"
 side_ww1_SOV_railway_priority_desc:0 "As obras ferroviárias e a organização do abastecimento militar recebem prioridade por 180 dias, desviando oficinas da produção bélica."
 side_ww1_SOV_railway_priority_project:0 "Prioridade às Ferrovias Militares"
 side_ww1_SOV_railway_priority_project_desc:0 "Comprometer 2 fábricas civis durante 60 dias e 40 de poder político. As obras ferroviárias e a organização do abastecimento militar recebem prioridade por 180 dias, desviando oficinas da produção bélica. Outra alocação não pode começar antes do término da atual."
 side_ww1_GER_gas_drills:0 "Exercícios de Proteção Química"
 side_ww1_GER_gas_drills_desc:0 "O treinamento de proteção reduz ligeiramente a perda de experiência e aumenta a demanda de suprimentos. Não garante um ataque químico bem-sucedido nem enfraquece todos os exércitos inimigos."
 side_ww1_GER_danubian_distribution:0 "Acordo de Distribuição Danubiana"
 side_ww1_GER_danubian_distribution_desc:0 "Uma alocação aceita pelo aliado sustenta a confiança por 180 dias, com um encargo civil adicional. O efeito é limitado; a escassez e o bloqueio conservam suas próprias causas."
 side_ww1_AUS_export_commitment:0 "Compromisso de Exportação à Alemanha"
 side_ww1_AUS_export_commitment_desc:0 "Uma fábrica civil e uma pequena parcela da produção militar ficam comprometidas por 90 dias. Ajudar a Alemanha consome recursos domésticos."
 side_ww1_GER_reconversion:0 "Reconversão Industrial"
 side_ww1_GER_reconversion_desc:0 "Apoio temporário aos reparos e à construção civil após desmobilizar as instituições industriais de guerra."
 side_ww1_SOV_reconversion:0 "Reparação da Economia Russa"
 side_ww1_SOV_reconversion_desc:0 "Apoio temporário aos reparos e às ferrovias após desmobilizar as instituições industriais de guerra. Os créditos de fornecimento continuam como obrigação separada."
 side_ww1_SOV_allied_supply_credit:0 "Crédito de Fornecimento Aliado"
 side_ww1_SOV_allied_supply_credit_desc:0 "As armas importadas trazem obrigações administrativas e civis contínuas. Quite cada parcela pendente depois da guerra."
 side_ww1_GER_reconversion_project:0 "Reconverter a Economia de Guerra"
 side_ww1_GER_reconversion_project_desc:0 "Comprometer 2 fábricas civis durante 90 dias e 40 de poder político após a paz. Substituir as instituições industriais de guerra por 180 dias de apoio moderado à reconstrução; não concede fábricas, equipamentos ou vitória."
 side_ww1_SOV_reconversion_project:0 "Reconverter a Economia de Guerra"
 side_ww1_SOV_reconversion_project_desc:0 "Comprometer 2 fábricas civis durante 90 dias e 40 de poder político após a paz. Substituir as instituições industriais de guerra por 180 dias de apoio moderado à reconstrução; não concede fábricas, equipamentos ou vitória."
 side_ww1_SOV_request_FRA_arms:0 "Solicitar Armamento Francês"
 side_ww1_SOV_request_FRA_arms_desc:0 "A administração compromete 1 fábrica civil durante 60 dias e custa 35 de poder político. Se o aliado concordar, uma parcela de 6000 fuzis e 120 peças de artilharia é verificada após 30 dias. O fornecedor precisa conservar outra reserva equivalente; perder o porto, romper a aliança, alcançar a paz ou faltar estoque impede a transferência. Cada parcela entregue gera uma obrigação de crédito no pós-guerra. Máximo de 6 parcelas não quitadas."
 side_ww1_SOV_request_ENG_arms:0 "Solicitar Armamento Britânico"
 side_ww1_SOV_request_ENG_arms_desc:0 "A administração compromete 1 fábrica civil durante 60 dias e custa 35 de poder político. Se o aliado concordar, uma parcela de 6000 fuzis e 120 peças de artilharia é verificada após 30 dias. O fornecedor precisa conservar outra reserva equivalente; perder o porto, romper a aliança, alcançar a paz ou faltar estoque impede a transferência. Cada parcela entregue gera uma obrigação de crédito no pós-guerra. Máximo de 6 parcelas não quitadas."
 side_ww1_SOV_supply_audit:0 "Auditar o Equipamento da Frente e as Reservas"
 side_ww1_SOV_supply_audit_desc:0 "Comprometer 1 fábrica civil durante 90 dias e 30 de poder político. A conclusão verifica ao menos 90% dos fuzis necessários,85% das peças de artilharia necessárias,3000 fuzis e 100 peças em reserva, sem pressão de crise subjacente. Exércitos vazios não se qualificam. Apenas uma auditoria aprovada remove a marca industrial herdada da escassez; as crises nacionais atuais permanecem separadas."
 side_ww1_SOV_settle_supply_credit:0 "Quitar uma Parcela do Fornecimento Aliado"
 side_ww1_SOV_settle_supply_credit_desc:0 "Parcelas pendentes: [?side_ww 1_SOV_supply_debt|0]. Após a paz, comprometa 2 fábricas civis durante 90 dias e 40 de poder político para quitar uma parcela. O encargo contínuo do crédito termina apenas após quitar a última parcela. Uma nova guerra cancela o programa."
 side_ww1_GER_hindenburg_conversion:0 "Executar o Programa Hindenburg"
 side_ww1_GER_hindenburg_conversion_desc:0 "Comprometer 2 fábricas civis durante 120 dias e 50 de poder político. A reorganização inicialmente reduz a produção militar em 3%. A entrega substitui a instituição industrial anterior, em vez de acumular seus bônus, com um custo civil e político contínuo. A paz ou a capitulação cancela a execução."
 side_ww1_GER_request_danubian_grain:0 "Negociar uma Alocação Danubiana"
 side_ww1_GER_request_danubian_grain_desc:0 "Comprometer 1 fábrica civil durante 60 dias e 35 de poder político. A Áustria-Hungria pode recusar ou comprometer seu próprio orçamento. Após 30 dias, verificam-se a continuidade da aliança, a fronteira compartilhada e a ausência de uma crise austríaca. O acordo limitado de distribuição não apaga a crise alimentar alemã."
 side_ww1_industry_programmes_tt:0 "Abre projetos temporários de alocação industrial. Cada um utiliza fábricas civis; as prioridades substituem umas às outras."
 side_ww1_import_contract_tt:0 "Abre solicitações de armamento aliado. O fornecimento exige consentimento, estoque aliado real e porto receptor disponível; as parcelas entregues criam obrigações no pós-guerra."
 side_ww1_supply_audit_tt:0 "Abre uma auditoria de abastecimento de 90 dias. Concluir um foco, por si só, não encerra a escassez material."
 side_ww1_grain_request_tt:0 "Abre negociações com a Áustria-Hungria. Seu governo pode recusar; o auxílio é limitado e nunca elimina uma crise ativa."
 side_ww1_hindenburg_project_tt:0 "Abre uma reconversão industrial de 120 dias, com perda inicial de produção e encargo civil contínuo."
 side_ww1_ger_rus.1.t:0 "O Custo do Programa Hindenburg"
 side_ww1_ger_rus.1.d:0 "A OHL pede um rápido aumento na produção de armas. Oficinas, mão de obra especializada e transportes não se multiplicam de uma hora para outra. Podemos preparar uma reconversão custosa ou conservar a organização atual."
 side_ww1_ger_rus.1.a:0 "Preparar o programa de reconversão."
 side_ww1_ger_rus.1.b:0 "Conservar a organização existente."
 side_ww1_ger_rus.2.t:0 "Guerra Química: Treinar Antes de Triunfar"
 side_ww1_ger_rus.2.d:0 "As armas químicas trazem riscos aos próprios operadores e soldados. Nosso programa desenvolve procedimentos de proteção. Combate, clima e equipamento decidirão o que ocorre na frente."
 side_ww1_ger_rus.2.a:0 "Aplicar os procedimentos de proteção."
 side_ww1_ger_rus.3.t:0 "Quem Coordenará a Indústria Russa?"
 side_ww1_ger_rus.3.d:0 "O exército exige entregas, enquanto ministérios e comitês industriais disputam contratos e capacidade. A administração agora permite alocações temporárias aos contratos estatais, à cooperação civil ou às ferrovias militares. Todas utilizam os mesmos recursos civis."
 side_ww1_ger_rus.3.a:0 "Alocar os recursos conforme nossas prioridades."
 side_ww1_ger_rus.5.t:0 "A Alocação Alemã Entra em Vigor"
 side_ww1_ger_rus.5.d:0 "Após o trabalho preparatório, a alocação escolhida vigora por 180 dias. O aumento da produção em uma área tem custo em outra. O programa termina automaticamente e a paz encerra as prioridades de guerra."
 side_ww1_ger_rus.5.a:0 "Revisar a nova alocação."
 side_ww1_ger_rus.6.t:0 "Os Contratos Russos Entram em Execução"
 side_ww1_ger_rus.6.d:0 "O programa escolhido agora vigora por 180 dias. Ele não cria armas ou ferrovias instantaneamente: produção e construção continuam dependendo de nossas fábricas e recursos."
 side_ww1_ger_rus.6.a:0 "Acompanhar as entregas."
 side_ww1_ger_rus.7.t:0 "Reconversão Industrial Alemã"
 side_ww1_ger_rus.7.d:0 "A economia de guerra foi desmobilizada. Um apoio limitado à reconstrução auxilia reparos e obras civis por 180 dias. A paz apresenta uma nova tarefa econômica, em vez de uma recompensa militar permanente."
 side_ww1_ger_rus.7.a:0 "Reconstruir a produção civil."
 side_ww1_ger_rus.8.t:0 "A Rússia Retoma as Obras Civis"
 side_ww1_ger_rus.8.d:0 "As instituições industriais de guerra foram desmobilizadas. Reparos e obras ferroviárias recebem apoio temporário. As obrigações de fornecimento externo não desapareceram com o cessar-fogo."
 side_ww1_ger_rus.8.a:0 "Reconstruir e revisar nossas obrigações."
 side_ww1_ger_rus.9.t:0 "A Auditoria de Abastecimento Foi Aprovada"
 side_ww1_ger_rus.9.d:0 "A frente tem fuzis e artilharia suficientes, existem reservas e a pressão subjacente diminuiu. A marca industrial herdada da escassez pode agora ser removida. Outras crises políticas ou de guerra precisam de sua própria resolução."
 side_ww1_ger_rus.9.a:0 "Manter as reservas."
 side_ww1_ger_rus.10.t:0 "A Auditoria de Abastecimento Encontra Lacunas"
 side_ww1_ger_rus.10.d:0 "O programa terminou, mas o equipamento da frente, as reservas ou as condições internas ainda são insuficientes. A marca da escassez permanece. É preciso produzir ou receber mais antes de outra auditoria."
 side_ww1_ger_rus.10.a:0 "Corrigir o déficit material."
 side_ww1_ger_rus.11.t:0 "A Reconversão Foi Concluída"
 side_ww1_ger_rus.11.d:0 "A nova instituição industrial substitui a organização anterior. A produção aumenta, mas o encargo civil e político permanece; nossos recursos não se multiplicam sem limites."
 side_ww1_ger_rus.11.a:0 "Administrar o encargo contínuo."
 side_ww1_ger_rus.20.t:0 "A Rússia Solicita uma Parcela de Armamentos"
 side_ww1_ger_rus.20.d:0 "O governo russo solicitante pede 6000 fuzis em reserva e 120 peças de artilharia. Concordar agenda uma verificação em 30 dias; as armas precisam sair de nosso estoque real, preservando uma reserva equivalente. Se a aliança ou a rota receptora falhar, não haverá transferência."
 side_ww1_ger_rus.20.a:0 "Autorizar a parcela proposta."
 side_ww1_ger_rus.20.b:0 "Nossas reservas não permitem esse compromisso."
 side_ww1_ger_rus.21.t:0 "Relatório do Contrato de Fornecimento Aliado"
 side_ww1_ger_rus.21.d:0 "As condições da parcela proposta foram verificadas. Uma entrega aprovada transfere equipamento aliado real e cria uma obrigação de crédito. Uma verificação negativa conserva as armas com o fornecedor."
 side_ww1_ger_rus.21.a:0 "A parcela chegou; registrar a obrigação."
 side_ww1_ger_rus.21.b:0 "O contrato não pôde ser entregue."
 side_ww1_ger_rus.22.t:0 "Uma Parcela do Fornecimento Foi Quitada"
 side_ww1_ger_rus.22.d:0 "O programa civil de quitação liquidou uma parcela. Se outras parcelas permanecerem, o encargo do crédito continua. A quitação final encerra essa obrigação."
 side_ww1_ger_rus.22.a:0 "Revisar os compromissos restantes."
 side_ww1_ger_rus.23.t:0 "Nosso Aliado Recusa a Solicitação de Armamentos"
 side_ww1_ger_rus.23.d:0 "Nosso parceiro recusou a transferência proposta. Sua própria frente e suas reservas limitam o fornecimento possível. A administração continua tendo seu custo; nenhuma arma ou dívida foi criada."
 side_ww1_ger_rus.23.a:0 "Precisamos encontrar outra fonte."
 side_ww1_ger_rus.30.t:0 "A Alemanha Solicita uma Alocação Danubiana"
 side_ww1_ger_rus.30.d:0 "Os responsáveis alemães pela distribuição solicitam um compromisso aliado. Aceitar desvia uma fábrica civil e parte de nosso esforço industrial durante 90 dias. Nossa própria crise alimentar pode tornar a proposta inviável."
 side_ww1_ger_rus.30.a:0 "Comprometer a alocação limitada."
 side_ww1_ger_rus.30.b:0 "As necessidades domésticas têm prioridade."
 side_ww1_ger_rus.31.t:0 "O Acordo Danubiano Foi Verificado"
 side_ww1_ger_rus.31.d:0 "O compromisso aliado chegou à data de verificação. A continuidade da aliança e da fronteira permite um acordo limitado de distribuição; uma nova crise austríaca ou o rompimento da relação impede sua execução. A escassez alemã não é resolvida automaticamente."
 side_ww1_ger_rus.31.a:0 "O acordo de distribuição está em vigor."
 side_ww1_ger_rus.31.b:0 "A alocação proposta não pôde prosseguir."
 side_ww1_ger_rus.32.t:0 "Viena Não Pode Atender à Solicitação"
 side_ww1_ger_rus.32.d:0 "A Áustria-Hungria recusou a alocação. A solidariedade entre aliados não elimina a escassez dentro do país parceiro. Precisamos atender às necessidades de distribuição por outro programa."
 side_ww1_ger_rus.32.a:0 "Revisar nossas prioridades de distribuição."
 GER_rathenau_war_raw_materials_board:0 "Administração das Matérias-Primas de Guerra"
 GER_rathenau_war_raw_materials_board_desc:0 "Abre projetos temporários de alocação industrial. Cada um utiliza fábricas civis; as prioridades substituem umas às outras."
 GER_british_starvation_blockade_strain:0 "Avaliar o Bloqueio Britânico"
 GER_british_starvation_blockade_strain_desc:0 "Avaliar a vulnerabilidade marítima durante a guerra contra a Grã-Bretanha. Registra uma análise administrativa; não cria uma crise alimentar por decreto."
 GER_steckrubenwinter_crisis_management:0 "Preparar a Distribuição de Guerra"
 GER_steckrubenwinter_crisis_management_desc:0 "Abre projetos temporários de alocação industrial. Cada um utiliza fábricas civis; as prioridades substituem umas às outras."
 GER_danubian_grain_imports:0 "Negociar o Fornecimento Danubiano"
 GER_danubian_grain_imports_desc:0 "Abre negociações com a Áustria-Hungria. Seu governo pode recusar; o auxílio é limitado e nunca elimina uma crise ativa."
 GER_hindenburg_program:0 "O Programa Hindenburg"
 GER_hindenburg_program_desc:0 "Abre uma reconversão industrial de 120 dias, com perda inicial de produção e encargo civil contínuo."
 GER_chemical_warfare_initiative:0 "Procedimentos de Guerra Química"
 GER_chemical_warfare_initiative_desc:0 "Desenvolver treinamento de proteção e obter experiência limitada. Não aplica uma penalidade militar geral a nós ou ao inimigo."
 GER_synthetic_buna_rubber_development:0 "Borracha Sintética Experimental"
 GER_synthetic_buna_rubber_development_desc:0 "Investigar substitutos de época para a borracha importada. Trata-se de um programa experimental de pesquisa industrial; concluir o foco não disponibiliza a tecnologia posterior da Buna."
 SOV_special_council_for_defense:0 "O Conselho Especial de Defesa"
 SOV_special_council_for_defense_desc:0 "Abre projetos temporários de alocação industrial. Cada um utiliza fábricas civis; as prioridades substituem umas às outras."
 SOV_end_the_shell_shortage:0 "Verificar o Fornecimento Sustentado de Armamentos"
 SOV_end_the_shell_shortage_desc:0 "Abre uma auditoria de abastecimento de 90 dias. Concluir um foco, por si só, não encerra a escassez material."
 SOV_the_shell_shortage_crisis:0 "Revisar a Escassez na Frente"
 SOV_the_shell_shortage_crisis_desc:0 "Abre uma auditoria de abastecimento de 90 dias. Concluir um foco, por si só, não encerra a escassez material."
 SOV_scovill_and_vickers_foreign_shells:0 "Negociar Contratos de Armamento Aliado"
 SOV_scovill_and_vickers_foreign_shells_desc:0 "Abre solicitações de armamento aliado. O fornecimento exige consentimento, estoque aliado real e porto receptor disponível; as parcelas entregues criam obrigações no pós-guerra."
 SOV_murmansk_convoys_arrival:0 "Organizar as Rotas Receptoras dos Aliados"
 SOV_murmansk_convoys_arrival_desc:0 "Abre solicitações de armamento aliado. O fornecimento exige consentimento, estoque aliado real e porto receptor disponível; as parcelas entregues criam obrigações no pós-guerra."
 SOV_fedorov_avtomat_early_rifle:0 "Testes do Fuzil Automático Fedorov"
 SOV_fedorov_avtomat_early_rifle_desc:0 "Um programa experimental concede um bônus de 30% a uma pesquisa de armas de infantaria e 5 de experiência do exército. Os testes não entregam milhares de armas de produção."
 SOV_vezdekhod_and_tsar_tank_experiments:0 "Avaliar o Vezdekhod e o Tanque do Tsar"
 SOV_vezdekhod_and_tsar_tank_experiments_desc:0 "Avaliar limitações de mobilidade e engenharia. Concede um único bônus de 30% a uma pesquisa de blindados e 5 de experiência do exército, sem tanques gratuitos ou recompensas experimentais de pesquisa acumuladas."
 SOV_murmansk_ice_free_port_lifeline:0 "Desenvolver a Rota de Murmansk"
 SOV_murmansk_ice_free_port_lifeline_desc:0 "Agendar a expansão do porto e obras de infraestrutura em Murmansk, construindo sua ligação ferroviária se ambos os extremos estiverem controlados. A construção exige a capacidade civil normal; o porto não é construído em Arkhangelsk."
 SOV_arsenal_of_the_russian_empire:0 "Um Arsenal para o Estado Russo"
 SOV_arsenal_of_the_russian_empire_desc:0 "Substituir a instituição industrial anterior por uma organização aprimorada dos arsenais. Agendar duas expansões em locais industriais próprios; produção e construção continuam consumindo capacidade real."
 GER_peacetime_industrial_giants_desc:0 "Esta instituição substitui outras etapas da mesma organização. Seus efeitos atuais aparecem abaixo; concluir um foco posterior não restaura uma etapa anterior."
