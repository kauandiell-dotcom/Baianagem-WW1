l_english:
 ww1_escalation.1.t:0 "Belgium and the British Decision"
 ww1_escalation.1.d:0 "Germany and Belgium are at war. Intervention requires a government decision, mobilisation and transport. Prepared neutrality remains a commitment; it can be reconsidered through national policy."
 ww1_escalation.1.a:0 "Authorise intervention against Germany"
 ww1_escalation.1.b:0 "Maintain our present policy and stay out"
 ww1_escalation.2.t:0 "Russian Intervention and German Responsibility"
 ww1_escalation.2.d:0 "The Russian government has chosen war with Austria-Hungary. Germany decides whether to enter that conflict or pursue mediation. The existing war continues until its participants accept a settlement."
 ww1_escalation.2.a:0 "Enter the war against the Russian government"
 ww1_escalation.2.b:0 "Seek mediation without declaring war"
 ww1_diplomacy.5.d:0 "Serbia appeals for assistance against Austria-Hungary. Honouring that request means actual intervention if they are at war. A guarantee cannot retroactively enter an existing war. Germany receives its own decision."
 ww1_diplomacy.5.a:0 "General Mobilization! Defend Serbia!"
 ww1_diplomacy.5.b:0 "Russia cannot risk a continental war."
 ww1_diplomacy.2.b:0 "Accept concessions to preserve the government."
 ww1_germany_events.22.d:0 "Germany requests passage through Belgium during its war with France. Refusal permits a German attack; Britain decides its own response. Acceptance grants access and the operational plan respects that authorisation."
