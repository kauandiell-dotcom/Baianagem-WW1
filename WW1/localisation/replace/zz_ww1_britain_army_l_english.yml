l_english:
 ENG_ww1_the_haldane_establishment_desc:0 "Haldane's reforms create a General Staff, an Expeditionary Force and a Territorial Force. It grants 15 political power, 3 army experience and the Haldane Reforms institution (training time -10%)."
 ENG_ww1_territorial_force_camps_desc:0 "Every summer Territorial Force volunteers camp for two weeks, between job and family. It grants 2 army experience and 1% stability."
 ENG_ww1_the_special_reserve_desc:0 "The Special Reserve trains former soldiers and new recruits to fill the regular battalions on mobilisation day. It grants 15,000 manpower; debt rises by 1."
 ENG_ww1_officer_training_corps_desc:0 "Public schools and universities train young officers who will lead platoons in 1914. It grants 4 army experience."
 ENG_ww1_regular_army_mobilisation_desc:0 "Mobilisation tables say which train, which day and which port each regular battalion uses. It grants 10 political power and 3 army experience."
 ENG_ww1_army_service_corps_offices_desc:0 "The Army Service Corps organises depots, lorries and field bread. It grants a one-use 25% research bonus on logistics."
 ENG_ww1_the_expeditionary_establishment_desc:0 "The Expeditionary Force receives six infantry divisions and one cavalry division, ready to cross the Channel. It grants 5 army experience and 10 political power; debt rises by 1."
 ENG_ww1_kitchener_new_armies_desc:0 "Kitchener asks for a million volunteers, and they come. But the men leave the factories and mines. It grants 25,000 manpower and the New Armies institution (army morale +5%, industrial capacity -3%); labour support falls by 2."
 ENG_ww1_the_pals_battalion_system_desc:0 "Friends, neighbours and workmates enlist together and serve together. It grants 10,000 manpower and the Pals Battalions institution (army organisation +5%); a single battle can wipe out a whole town."
 ENG_ww1_the_rifle_training_depots_desc:0 "The Hythe School of Musketry trains rapid, accurate fire of fifteen rounds a minute. It grants 2 army experience and a one-use 25% research bonus on infantry weapons."
 ENG_ww1_field_medical_organisation_desc:0 "Aid posts, casualty clearing stations and ambulance trains save wounded men who would once have died. It grants 1% stability and a one-use 25% research bonus on field hospitals."
 ENG_ww1_the_artillery_observation_school_desc:0 "The Larkhill school teaches how to observe the target, measure the error and correct artillery fire. It grants 2 army experience and a one-use 25% research bonus on reconnaissance."
 ENG_ww1_machine_gun_corps_formation_desc:0 "The Machine Gun Corps gathers the weapons into companies of their own, with officers trained for every burst. It grants 5 army experience; debt rises by 1."
 ENG_ww1_trench_mortar_sections_desc:0 "The Stokes mortar, cheap and simple, gives infantry an artillery of its own inside the trench. It grants 2 army experience and a one-use 25% research bonus on artillery."
 ENG_ww1_gas_protection_training_desc:0 "After Ypres, flannel masks give way to the box respirator, and gas discipline becomes a daily drill. It grants 3 army experience and 1% war support; debt rises by 1."
 ENG_ww1_the_infantry_training_directorate_desc:0 "The Infantry Training Directorate standardises the manual from section to battalion. It grants 10 political power and the Training Directorate institution (training time -10%, army experience gain +5%)."
 ENG_ww1_combined_arms_staff_courses_desc:0 "Staff courses bring infantry, artillery, engineers and aviation into the same plan. It grants 6 army experience and the Combined Arms institution (planning speed +10%)."
 ENG_ww1_the_demobilisation_register_desc:0 "Millions of men want to go home. The register decides the order: length of service, guaranteed job, or whole units. It triggers the demobilisation event."
 ENG_ww1_a_smaller_professional_force_desc:0 "The Army returns to being small and professional, with the Empire as its main mission. Debt falls by 3; it grants 15 political power and 1% stability. Excludes the territorial renewal."
 ENG_ww1_territorial_defence_renewal_desc:0 "The Territorial Army is reborn in 1920 with volunteer veterans. Debt rises by 1; it grants 5 army experience, 10 political power and 1% stability. Excludes the smaller professional force."
 ENG_ww1_the_channel_mobilisation_timetable_desc:0 "After Agadir, General Henry Wilson and the Staff fix train and ship timetables for the Channel. It grants 10 political power and 3 army experience."
 ENG_ww1_embarkation_depot_preparation_desc:0 "Southampton, Newhaven and Folkestone receive depots, quays and railway sidings. It grants a one-use 25% research bonus on rail transport."
 ENG_ww1_the_bef_deployment_plan_desc:0 "In August 1914 the British Expeditionary Force crosses the Channel. France welcomes the British with enthusiasm. It grants 5 army experience; France gains war support."
 ENG_ww1_the_flanders_supply_organisation_desc:0 "Boulogne, Calais and Dunkirk become supply ports, with railways and canals to the line. Debt rises by 1; it grants the Flanders Supply institution (supply consumption -5%)."
 ENG_ww1_holding_the_continental_line_desc:0 "Mons, Le Cateau and First Ypres cost the regular army almost entire, but the line holds. It grants 6 army experience; war support falls by 1%."
 ENG_ww1_artillery_ammunition_concentration_desc:0 "Before the offensive, shell crates are stacked behind the batteries for days. Debt rises by 1 and it grants 3 army experience."
 ENG_ww1_a_limited_offensive_doctrine_desc:0 "Rawlinson advocates biting off a limited piece of the line and holding it against counter-attacks. It grants 4 army experience and 10 political power."
 ENG_ww1_the_dardanelles_staff_study_desc:0 "Churchill wants to force the Dardanelles and open the road to Constantinople. Fisher and Kitchener doubt. It triggers the debate over the Straits: naval attempt, joint landing or shelving the plan."
 ENG_ww1_mediterranean_landing_preparation_desc:0 "Lemnos and Mudros become landing bases, with lighters, quays and hospitals. It grants 3 army experience and 2 naval experience."
 ENG_ww1_mesopotamian_supply_review_desc:0 "An army on the Tigris needs rivers, boats, railways and drinking water that no one planned. It grants a one-use 25% research bonus on maintenance; the siege of Kut will hurt less."
 ENG_ww1_the_western_offensive_staff_study_desc:0 "Loos and Festubert show what is missing: shells, reserves and command. The staff notes every error. It grants 4 army experience and 10 political power."
 ENG_ww1_the_creeping_barrage_school_desc:0 "The creeping barrage advances a few metres a minute ahead of the infantry. It grants the Creeping Barrage institution (artillery attack +5%) and a one-use 25% research bonus on artillery."
 ENG_ww1_tank_committee_experiments_desc:0 "The Landships Committee funds prototypes of an armoured tracked vehicle. Debt rises by 1 and it grants a one-use 25% research bonus on armour."
 ENG_ww1_assault_coordination_exercises_desc:0 "Infantry, artillery and tanks rehearse the attack on ground marked with tapes and pegs. It grants 4 army experience, plus 2 if the tank programme exists."
 ENG_ww1_palestine_railway_liaison_desc:0 "Allenby needs a railway and a pipeline across Sinai to reach Gaza. It grants 3 army experience, 10 political power and a one-use 25% research bonus on rail transport."
 ENG_ww1_the_spring_defence_plan_desc:0 "The staff expects the great German offensive of 1918 and prepares defence in depth: a weak forward zone, a strong battle zone, reserves behind. It grants 10 political power and 3 army experience."
 ENG_ww1_the_allied_counteroffensive_plan_desc:0 "Foch coordinates the Allied armies for a general offensive. Haig, Rawlinson and the Canadians plan Amiens. It triggers the offensive event."
 ENG_ww1_operational_reserve_restoration_desc:0 "Lloyd George withheld reserves in England, and the Fifth Army nearly vanishes in March. Rebuilding the reserve means calling older and younger men. It grants 15,000 manpower and 3 army experience; labour support falls by 2."
 ENG_ww1_the_armistice_stand_down_plan_desc:0 "The armistice of 11 November suspends operations. The plan organises the occupation of the Rhineland and the return of the troops. It grants 15 political power and 1% stability."
 ENG_ww1_lessons_for_the_general_staff_desc:0 "The General Staff writes the official history and the 1919 manuals from what the war taught. It grants 10 army experience, 15 political power and the Lessons of the War institution (army experience gain +10%)."
 ww1_britain_mil.2.t:0 "The Dardanelles Decision"
 ww1_britain_mil.2.d:0 "Churchill argues that the fleet should force the Straits and reach Constantinople. Fisher and Kitchener doubt the adventure, and the War Council needs a quick decision before Turkey reinforces the forts."
 ww1_britain_mil.2.a:0 "Try with the fleet alone. (naval experience +3, debt +1)"
 ww1_britain_mil.2.b:0 "Make a joint landing. (army experience +4, naval experience +2, stability -1%)"
 ww1_britain_mil.2.c:0 "Shelve the plan. (+10 political power)"
 ww1_britain_mil.3.t:0 "The Siege of Kut"
 ww1_britain_mil.3.d:0 "The Sixth Indian Division, surrounded at Kut-al-Amara by the Turks, is out of food. Relief attacks fail in the mud and the Tigris floods. Surrender is a matter of weeks."
 ww1_britain_mil.3.a:0 "Mount one more relief attempt. (-10 political power, army experience +4; war support -1% with the supply review, otherwise -2%)"
 ww1_britain_mil.3.b:0 "Negotiate terms with the Turkish officers. (debt +1, war support -1%)"
 ww1_britain_mil.4.t:0 "The First Day of the Somme"
 ww1_britain_mil.4.d:0 "On 1 July 1916 the volunteer battalions climb out of their trenches in line. Within hours there are nearly sixty thousand casualties, and whole towns lose their young men. Haig demands the battle go on."
 ww1_britain_mil.4.a:0 "Accept the losses and press the offensive. (army experience +6, war support -3%)"
 ww1_britain_mil.4.b:0 "Spread the losses across the regiments. (stability +1%, war support -1%, army experience +2)"
 ww1_britain_mil.5.t:0 "Demobilisation"
 ww1_britain_mil.5.d:0 "Millions of men await the trip home. The cabinet decides whether length of service, guaranteed jobs or the keeping of whole units counts. Those left longer in France think it unfair."
 ww1_britain_mil.5.a:0 "Release by length of service and civilian need. (stability +2%, debt +1, labour support +3)"
 ww1_britain_mil.5.b:0 "Keep the units together and release slowly. (stability -1%, labour support -3, debt -1)"
 ww1_britain_mil.6.t:0 "The German Spring Offensive"
 ww1_britain_mil.6.d:0 "On 21 March 1918 the Germans strike in Picardy under fog and a gas bombardment. The Fifth Army gives way, and the Allied line risks splitting between British and French."
 ww1_britain_mil.6.a:0 "Trade ground for time. (-10 political power, army experience +6; war support -0.5% with the defence plan, otherwise -2%)"
 ww1_britain_mil.6.b:0 "Hold the forward zone at any cost. (army experience +3, war support -3%, debt +1)"
 ww1_britain_mil.7.t:0 "Amiens, the Black Day"
 ww1_britain_mil.7.d:0 "On 8 August 1918 tanks, Canadians and Australians break the German line under fog. Ludendorff calls it the black day of the German army. Haig and Foch must decide whether to deepen the advance."
 ww1_britain_mil.7.a:0 "Press along the whole front. (army experience +8, war support +3%, debt +1)"
 ww1_britain_mil.7.b:0 "Pause to bring up the guns. (army experience +4, +10 political power)"
 ww1_britain_mil.8.t:0 "The Calais Mutinies"
 ww1_britain_mil.8.d:0 "Soldiers weary of waiting at Folkestone and Calais refuse to re-embark for France and elect committees. The generals fear a revolution, and Churchill, at the War Office, prepares a response."
 ww1_britain_mil.8.a:0 "Speed up the releases at once. (stability +1%, debt +1)"
 ww1_britain_mil.8.b:0 "Send loyal units to restore order. (stability -2%, +10 political power, labour support -4)"
 ww1_britain_mil.10.t:0 "The British Arrive"
 ww1_britain_mil.10.d:0 "The first battalions of the British Expeditionary Force land at Boulogne and Le Havre. The crowd cheers the khaki soldiers, and Paris recovers the hope that it will not stand alone."
 ww1_britain_mil.10.a:0 "Welcome the Expeditionary Force. (war support +2%, stability +1%)"
 ww1_britain_mil.11.t:0 "The Allied Fleet at the Straits"
 ww1_britain_mil.11.d:0 "Allied ships bombard the Dardanelles forts. The government in Constantinople has few guns and little ammunition, but the country rallies: the threat to the capital unites even its opponents."
 ww1_britain_mil.11.a:0 "Defend the Straits at any cost. (war support +3%, stability +2%)"
 ww1_britain_mil.12.t:0 "The Black Day of the German Army"
 ww1_britain_mil.12.d:0 "Whole divisions surrender with few shots. Ludendorff tells the Kaiser that the war can no longer be won by force. The staff must decide how to tell the country."
 ww1_britain_mil.12.a:0 "Order the troops to hold on. (war support -2%, stability -1%)"
 ww1_britain_mil.12.b:0 "Approach the Chancellor to seek an armistice. (war support -3%, stability -2%)"
 ww1_britain_mil.13.t:0 "British Liaison Officers"
 ww1_britain_mil.13.d:0 "London offers to send staff officers to Allied headquarters to coordinate plans, supplies and transport. Local commanders are divided between usefulness and pride."
 ww1_britain_mil.13.a:0 "Accept the officers. (army experience +2; British army experience +2)"
 ww1_britain_mil.13.b:0 "Decline. (no effects)"
 ENG_ww1_haldane_reforms:0 "Haldane Reforms"
 ENG_ww1_haldane_reforms_desc:0 "A small but organised army, with trained reserves and a general staff."
 ENG_ww1_kitchener_armies:0 "New Armies"
 ENG_ww1_kitchener_armies_desc:0 "Thousands of volunteers join the army, and the factories feel their absence."
 ENG_ww1_pals_battalions:0 "Pals Battalions"
 ENG_ww1_pals_battalions_desc:0 "Men of the same street fight together. Cohesion is higher, but one battle can wipe out a town."
 ENG_ww1_flanders_supply:0 "Flanders Supply"
 ENG_ww1_flanders_supply_desc:0 "Ports, canals and railways carry supplies forward with less waste."
 ENG_ww1_training_directorate:0 "Training Directorate"
 ENG_ww1_training_directorate_desc:0 "One manual and one doctrine, from section to battalion."
 ENG_ww1_combined_arms_staff:0 "Combined Arms"
 ENG_ww1_combined_arms_staff_desc:0 "Staffs learn to plan infantry, artillery and aviation as a single system."
 ENG_ww1_creeping_barrage:0 "Creeping Barrage"
 ENG_ww1_creeping_barrage_desc:0 "Artillery advances ahead of the infantry, by the clock."
 ENG_ww1_general_staff_lessons:0 "Lessons of the War"
 ENG_ww1_general_staff_lessons_desc:0 "The staff turns four years of mistakes into manuals."
 ENG_ww1_staff_college_course:0 "Staff College Course"
 ENG_ww1_staff_college_course_desc:0 "Spend 25 political power. At war, it grants 5 army experience and debt rises by 1. Available once a year after the combined arms courses."
 ENG_ww1_send_liaison_officers:0 "Send Liaison Officers"
 ENG_ww1_send_liaison_officers_desc:0 "Spend 20 political power. At war, offers staff officers to each ally in the faction, who decides whether to accept. Whoever accepts and Britain gain 2 army experience. Requires the BEF deployment plan."
