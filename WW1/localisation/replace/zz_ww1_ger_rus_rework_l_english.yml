l_english:
 ww1_germany_events.100.t:0 "A War Council at the OHL"
 ww1_germany_events.100.d:0 "The General Staff demands authority over strategic priorities and the demands placed on industry. Concentrating command may shorten planning delays, but civilian ministers warn that the army cannot govern wages, food and public confidence by decree. The Kaiser remains head of state; the question is who controls the conduct of the war."
 ww1_germany_events.100.a:0 "Entrust wartime coordination to the OHL."
 ww1_germany_events.100.b:0 "Require the command to answer to the cabinet."
 ww1_germany_events.101.t:0 "The Reichstag Debates a Peace Resolution"
 ww1_germany_events.101.d:0 "Deputies have proposed a public commitment to a negotiated settlement. Supporting the resolution may recover trust among those exhausted by the war, while exposing divisions over annexations and military objectives. A parliamentary declaration cannot silence the guns: foreign governments must still agree to negotiate."
 ww1_germany_events.101.a:0 "Adopt the resolution."
 ww1_germany_events.101.b:0 "Reject limits on our war aims."
 ww1_germany_events.102.t:0 "German Instructors for the Ottoman Army"
 ww1_germany_events.102.d:0 "Berlin proposes a limited military mission: staff exercises, officer instruction and the exchange of operational methods. Accepting it requires administrative effort and political trust. The instructors bring experience, not an army or a shipment of rifles, and the mission does not oblige us to enter a war."
 ww1_germany_events.102.a:0 "Authorize the training mission."
 ww1_germany_events.102.b:0 "Retain independent control of military instruction."
 ww1_germany_events.103.t:0 "Constantinople Answers the Training Proposal"
 ww1_germany_events.103.d:0 "The Ottoman cabinet has answered our invitation. Where the mission is accepted, the German staff must now supply instructors and coordinate a six-month exchange. Refusal closes this proposal without changing either country's alliances."
 ww1_germany_events.103.a:0 "Dispatch the instructors."
 ww1_germany_events.103.b:0 "Respect the cabinet's decision."
 ww1_germany_events.104.t:0 "An Alliance Offer from Berlin"
 ww1_germany_events.104.d:0 "Germany offers membership in its coalition. This is a commitment to a common diplomatic position, with obligations and risks reaching far beyond a training mission. Ratification joins the faction, but the decision to participate in an ongoing war remains a separate military and political act."
 ww1_germany_events.104.a:0 "Ratify the alliance."
 ww1_germany_events.104.b:0 "Preserve armed neutrality."
 ww1_germany_events.105.t:0 "The Ottoman Alliance Is Ratified"
 ww1_germany_events.105.d:0 "The Ottoman government has ratified the agreement and entered our coalition. Liaison officers must coordinate naval and military planning, while both governments assess their obligations. The signature has not deployed troops, created equipment or automatically opened a new front."
 ww1_germany_events.105.a:0 "Begin coalition coordination."
 ww1_germany_events.106.t:0 "Constantinople Preserves Its Neutrality"
 ww1_germany_events.106.d:0 "The Ottoman cabinet has declined membership in the coalition. Trade and military contacts may continue where circumstances permit, but an alliance cannot be claimed on the strength of an unanswered invitation. We must plan without assuming Ottoman participation."
 ww1_germany_events.106.a:0 "Revise our diplomatic assumptions."
 ww1_germany_events.16.t:0 "A Coded Proposal from Germany"
 ww1_germany_events.16.d:0 "A German telegram invites Mexico to explore cooperation should relations with the United States deteriorate. The offer is ambitious, but its promised gains would require resources and a war our government may be unable to sustain. Discussing the proposal does not constitute an alliance or authorize hostilities. Interception would carry consequences beyond this room."
 ww1_germany_events.16.a:0 "Explore the proposal confidentially."
 ww1_germany_events.16.b:0 "Decline an undertaking beyond our means."
 ww1_germany_events.107.t:0 "Mexico Replies to the Telegram"
 ww1_germany_events.107.d:0 "Our embassy has transmitted the Mexican reply. A willingness to discuss does not guarantee an alliance, financial support or military participation. A refusal leaves us without the diversion envisioned by the proposal. In either case, the possibility of intercepted correspondence remains a serious diplomatic risk."
 ww1_germany_events.107.a:0 "Keep expectations proportionate to the reply."
 ww1_germany_events.107.b:0 "Close the initiative."
 ww1_germany_events.108.t:0 "The Intercepted German Telegram"
 ww1_germany_events.108.d:0 "Decoded correspondence reveals a German attempt to explore cooperation with Mexico against American interests. Publication would strengthen the case of those demanding a firmer response to Berlin. Keeping the material private would preserve diplomatic room, at the cost of defending that choice if the evidence becomes public. Neither course is a declaration of war."
 ww1_germany_events.108.a:0 "Publish the evidence."
 ww1_germany_events.108.b:0 "Keep it within diplomatic channels."
 ww1_germany_events.54.t:0 "Preparing for Possible Foreign Intervention"
 ww1_germany_events.54.d:0 "Foreign governments distrust our revolutionary settlement. Their opposition is a diplomatic danger, but it does not prove that their armies are already marching. The cabinet will monitor commitments and prepare defensive policy while continuing to judge each government's actions. We will not manufacture an intervention by declaring war ourselves."
 ww1_germany_events.54.a:0 "Maintain a diplomatic and defensive watch."
 ww1_germany_events.70.t:0 "The Meuse Offensive Proposal"
 ww1_germany_events.70.d:0 "The staff proposes a concentrated operation against the French fortified front in Champagne and the Meuse sector. Success requires an actual advance, with support stores, command attention and industrial deliveries committed beforehand. French losses will be determined by combat. Once preparations begin, the operation will have a limited period in which to meet its objective."
 ww1_germany_events.70.a:0 "Review the preparation requirements."
 ww1_germany_events.109.t:0 "The Meuse Operation Meets Its Objective"
 ww1_germany_events.109.d:0 "Our forces have taken control of the designated Champagne sector before the operation's deadline. The planned concentration can now be dispersed, and the staff will study what worked. This advance has been won by troops on the map; the reports record it without converting an operational success into unlimited national strength."
 ww1_germany_events.109.a:0 "Consolidate and examine the lessons."
 ww1_germany_events.110.t:0 "The Meuse Offensive Is Exhausted"
 ww1_germany_events.110.d:0 "The deadline has passed without control of the designated Champagne sector. Concentrating still more men and materiel would prolong the strain without restoring the original plan. The command has ended the special effort; formations now need time to reorganize. The front remains determined by the positions actually held."
 ww1_germany_events.110.a:0 "End the special effort and regroup."
 ww1_germany_events.75.t:0 "A Limited Concentration for the Western Offensive"
 ww1_germany_events.75.d:0 "The staff has coordinated a temporary concentration of assault methods and deliveries for the western front. The effort can be sustained for sixty days and increases the demand on supply. It cannot guarantee a breakthrough, generate recruits or inflict enemy losses through a declaration."
 ww1_germany_events.75.a:0 "Use the limited window carefully."
 ww1_russia.100.t:0 "The South-Western Front Plans an Offensive"
 ww1_russia.100.d:0 "Brusilov's staff proposes simultaneous preparations along the Galician front instead of a single conspicuous concentration. The plan must still be supplied and executed. Support stores and command effort will be committed during thirty-five days of preparation; afterwards we will have sixty days to secure Stanisławów and Lwów."
 ww1_russia.100.a:0 "Prepare the operation through the front decisions."
 ww1_russia.101.t:0 "The Galician Objective Is Secured"
 ww1_russia.101.d:0 "Our forces control both Stanisławów and Lwów within the operation's deadline. Concentrated deliveries can now return to their normal schedule. Officers will examine the methods that made the advance possible; maintaining the gains still requires troops, supply and coordination on the front."
 ww1_russia.101.a:0 "Consolidate the gains and circulate the lessons."
 ww1_russia.102.t:0 "The Galician Offensive Loses Momentum"
 ww1_russia.102.d:0 "The operation has ended without securing both objectives. The special concentration has been dissolved, and exhausted formations require a period of recovery. This setback does not decree the collapse of Russia, but it has spent material and damaged confidence in the plan."
 ww1_russia.102.a:0 "Rest the formations and reassess the front."
 ww1_russia.103.t:0 "A Russian Medical Mission Arrives"
 ww1_russia.103.d:0 "Russian medical personnel and organizers have arrived to cooperate with our military hospitals. The mission can help preserve experienced men returning to service during the next four months. Its value lies in care and coordination, not an imaginary shipment of recruits or an automatic victory."
 ww1_russia.103.a:0 "Coordinate the hospitals with the mission."
 ww1_russia.40.t:0 "Requesting an Eastern Armistice"
 ww1_russia.40.d:0 "The government authorizes a request for talks with Germany. An armistice still requires a reply and agreement on terms. Until that agreement is reached, the army must hold its positions: this request does not end the war, surrender territories or settle our domestic crisis."
 ww1_russia.40.a:0 "Send the request and await the reply."
 GER_eastern_armistice_request_tt:0 "§YRequests negotiations with the Russian state we are fighting.§! Peace, territorial changes and domestic recovery require a separate agreement."
 SOV_eastern_armistice_request_tt:0 "§YSends an armistice request to Germany.§! The war continues until both sides agree to terms."
 GER_ohl_command_contract_tt:0 "The OHL replaces the previous staff doctrine. Its planning advantage is accompanied by civilian economic and political costs. The Kaiser remains head of state."
 GER_ohl_oversight_tt:0 "Maintains civilian oversight instead of adding the OHL supremacy spirits."
 GER_reichstag_resolution_tt:0 "Records a commitment to negotiated peace. §YThis resolution does not itself conclude an armistice.§!"
 GER_ottoman_training_only_tt:0 "A six-month programme improves Ottoman §Yland doctrine mastery gain by 10%§!. Both governments must organize the exchange; §Yno faction entry, war declaration or free equipment is included§!."
 GER_ottoman_alliance_terms_tt:0 "Ottoman membership in Germany's faction. §YMilitary participation in existing wars is a separate decision.§!"
 GER_zimmermann_no_automatic_war_tt:0 "Records the diplomatic response. §YNo alliance, territorial transfer or declaration of war is automatic.§!"
 GER_intervention_watch_tt:0 "Records a defensive posture. Foreign intervention must result from an actual foreign decision; this event does not declare war on the Entente."
 GER_michael_temporary_tt:0 "§Y60 days§! of concentrated offensive methods, with increased supply requirements. No permanent offensive spirit is granted."
 GER_meuse_preparation_tt:0 "Preparation: §Y35 days§!, §Y30 political power§!, §Y40 command power§! and §Y50 support equipment§!. Requires a reserve of §Y40 artillery§!. Factory output is reduced by §R5%§! during preparation. Afterwards, control the Champagne sector within §Y60 days§!; the enemy-specific breakthrough advantage expires with the operation."
 SOV_southwestern_preparation_tt:0 "Preparation: §Y35 days§!, §Y30 political power§!, §Y40 command power§! and §Y50 support equipment§!. Requires a reserve of §Y40 artillery§!. Factory output is reduced by §R5%§! during preparation. Afterwards, control Stanisławów and Lwów within §Y60 days§!; the enemy-specific breakthrough advantage expires with the operation."
 GER_wartime_operations:0 "German Operational Planning"
 GER_wartime_operations_desc:0 "Prepare concentrated operations with objectives, deadlines and material costs."
 SOV_southwestern_front:0 "The South-Western Front"
 SOV_southwestern_front_desc:0 "Coordinate a limited Galician offensive against Austria-Hungary."
 GER_prepare_meuse_operation:0 "Prepare the Meuse Operation"
 GER_prepare_meuse_operation_desc:0 "Commit command attention, support stores and thirty-five days of deliveries before the sixty-day operation begins."
 GER_meuse_preparation_mission:0 "Concentrate Deliveries for the Meuse"
 GER_meuse_preparation_mission_desc:0 "The preparation period must run its course. Peace or capitulation cancels the concentration and removes its industrial penalty."
 GER_meuse_objective:0 "Secure the Champagne Sector"
 GER_meuse_objective_desc:0 "Control Champagne before the deadline. Success ends the concentration and yields operational lessons; failure requires thirty days of recovery. Peace or capitulation cancels the operation."
 SOV_prepare_southwestern_offensive:0 "Prepare the South-Western Offensive"
 SOV_prepare_southwestern_offensive_desc:0 "Commit command attention, support stores and thirty-five days of deliveries before the sixty-day Galician operation begins."
 SOV_southwestern_preparation_mission:0 "Concentrate the Galician Deliveries"
 SOV_southwestern_preparation_mission_desc:0 "Staff exercises, support stores and deliveries are being assembled. Peace or capitulation cancels the special concentration."
 SOV_southwestern_objective:0 "Secure Stanisławów and Lwów"
 SOV_southwestern_objective_desc:0 "Control both objectives within sixty days. Success provides operational lessons; failure ends the concentration and requires thirty days of recovery."
 SOV_aviation_school_program:0 "Military Flying School Programme"
 SOV_aviation_school_program_desc:0 "A modest institutional foundation for training pilots. Later improvements replace this stage."
 SOV_aviation_combat_school:0 "Combat Lessons in Pilot Training"
 SOV_aviation_combat_school_desc:0 "Operational lessons improve instruction, while experimental methods carry an accident risk. Replaces the original school programme."
 SOV_ace_training_system:0 "Experienced Pilot Instruction"
 SOV_ace_training_system_desc:0 "Experienced pilots organize a sustained training system. Replaces earlier aviation school stages."
 SOV_aerial_recon_network:0 "Aerial Reconnaissance Network"
 SOV_aerial_recon_network_desc:0 "Aircraft observations are organized into a usable reconnaissance service."
 SOV_air_naval_coordination:0 "Air and Naval Observation Liaison"
 SOV_air_naval_coordination_desc:0 "A single liaison service replaces the earlier reconnaissance network and improves the circulation of reports."
 SOV_integrated_air_service:0 "Integrated Imperial Air Service"
 SOV_integrated_air_service_desc:0 "The reconnaissance institutions have been consolidated into an integrated service. Earlier stages do not remain as additional bonuses."
 SOV_southwestern_preparation:0 "South-Western Offensive Preparations"
 SOV_southwestern_preparation_desc:0 "Deliveries and support stores are concentrated for thirty-five days, imposing industrial and supply costs."
 SOV_southwestern_offensive:0 "The Galician Operational Window"
 SOV_southwestern_offensive_desc:0 "A sixty-day coordination advantage against Austro-Hungarian formations, accompanied by higher supply demand. Removed when the operation ends."
 SOV_southwestern_exhaustion:0 "Reorganizing the South-Western Front"
 SOV_southwestern_exhaustion_desc:0 "A thirty-day recovery period after the operation failed to secure its objectives."
 SOV_serbian_medical_mission:0 "Russian Medical Cooperation"
 SOV_serbian_medical_mission_desc:0 "A four-month medical mission helps preserve experienced soldiers returning to service."
 GER_meuse_preparation:0 "Meuse Offensive Preparations"
 GER_meuse_preparation_desc:0 "Deliveries and support stores are concentrated for thirty-five days, with industrial and supply costs."
 GER_meuse_offensive:0 "The Meuse Operational Window"
 GER_meuse_offensive_desc:0 "A limited coordination advantage against French formations. Increased supply demand lasts until the operation ends."
 GER_meuse_exhaustion:0 "Reorganizing the Meuse Formations"
 GER_meuse_exhaustion_desc:0 "A thirty-day recovery period after the operation failed to secure its objective."
 GER_silent_dictatorship_ohl:0 "Convene the OHL War Council"
 GER_treaty_of_brest_litovsk:0 "Negotiate an Eastern Armistice"
 GER_battle_of_verdun_attrition:0 "Plan the Meuse Offensive"
 SOV_brusilov_breakthrough_1916:0 "Plan the South-Western Offensive"
 SOV_red_cross_missions_to_serbia:0 "A Medical Mission to Serbia"
 SOV_peace_of_brest_litovsk:0 "Request an Eastern Armistice"
 SOV_nesterov_aerial_ramming_tactics:0 "Learn from Nesterov's Experiments"
 GER_silent_dictatorship_ohl_desc:0 "Debate how far wartime command should reach into civilian government. The council chooses between military supremacy and cabinet oversight; it neither replaces the Kaiser with a general nor supplies a military success."
 GER_reichstag_peace_resolution_desc:0 "Present a parliamentary commitment to negotiations. Adoption and rejection have different political consequences, while a ceasefire remains dependent on a separate agreement with the enemy."
 GER_ottoman_military_mission_sanders_desc:0 "Offer an officer-training mission to the Ottoman cabinet. Acceptance starts a six-month programme of doctrine learning, without free equipment or automatic entry into our faction."
 GER_secret_ottoman_alliance_august_1914_desc:0 "Invite the Ottoman government to a formal alliance. Its cabinet may ratify or refuse; faction membership and military entry into the war are distinct commitments."
 GER_treaty_of_brest_litovsk_desc:0 "Approach the Russian state we are actually fighting and propose armistice negotiations. No treaty, territorial transfer or end to wartime shortages is assumed before agreement."
 GER_battle_of_verdun_attrition_desc:0 "Prepare the staff plan for a concentrated offensive in the Meuse and Champagne sector. The focus opens operational decisions; supplies, preparation and an actual advance must produce the result."
 GER_entente_anti_bolshevik_intervention_desc:0 "Assess the risk of foreign intervention against the revolutionary government and establish a defensive watch. Hostilities must follow actual foreign decisions."
 SOV_brusilov_breakthrough_1916_desc:0 "Study dispersed preparation and coordinated assaults against the Austro-Hungarian front. The focus unlocks a limited operation with a preparation period and real Galician objectives. It does not award victory in advance."
 SOV_red_cross_missions_to_serbia_desc:0 "Finance a medical and hospital liaison mission to Serbia. The mission costs political effort and assists the recipient for four months instead of awarding domestic manpower or stability."
 SOV_peace_of_brest_litovsk_desc:0 "Request talks with Germany while the eastern war is ongoing. The opposing government must respond before an armistice or territorial settlement can take effect."
 SOV_kacha_military_flying_school_desc:0 "Build a modest pilot-training institution. Later combat instruction replaces this stage, so school improvements do not accumulate indefinitely."
 SOV_nesterov_aerial_ramming_tactics_desc:0 "Investigate early combat experiments and feed their lessons into pilot instruction. Experimental methods bring risk; they do not make every aircraft universally more lethal."
 SOV_kazakov_ace_fighter_groups_desc:0 "Place experienced combat pilots at the centre of a sustained training system, replacing the earlier school stages."
 SOV_lebed_reconnaissance_corps_desc:0 "Organize aerial observation reports and support research into reconnaissance aircraft. Later coordination institutions replace the original network."
 SOV_integrated_air_naval_reconnaissance_desc:0 "Link aerial observers and fleet reporting through one liaison service, replacing the earlier reconnaissance network."
 SOV_mastery_of_the_imperial_skies_desc:0 "Consolidate the air-service institutions into an integrated organization. This replaces the preceding reconnaissance stages rather than adding another broad combat bonus."
 SOV_strategic_air_bombardment_doctrine_desc:0 "Study the limited capabilities of early heavy aircraft. The programme supports heavy-aircraft research and six months of air-doctrine learning."
 SOV_seaplane_carriers_in_the_black_sea_desc:0 "Develop naval-aircraft methods and maritime observation. Support the appropriate aviation research instead of treating early seaplane tenders as modern fleet carriers."
 SOV_trans_siberian_double_tracking_desc:0 "Improve the Moscow–Perm section of the broad-gauge trunk to railway level two. The works depend on control of both endpoints and allied passage."
 SOV_poland_strategic_railway_grid_desc:0 "Connect Warsaw, Łódź and Lublin with level-two strategic railway links wherever the endpoints remain under our control."
 SOV_amur_railway_link_desc:0 "Improve the Khabarovsk–Vladivostok railway link to level two while both endpoints remain under our control."
 SOV_arkhangelsk_broad_gauge_conversion_desc:0 "Connect Petrograd to Arkhangelsk by a level-two railway and improve the actual port and supply facilities at Arkhangelsk. Works require control of the relevant endpoints."
 SOV_military_railway_battalions_desc:0 "Deploy railway engineers on the Moscow–Smolensk–Minsk corridor, constructing real level-two connections under allied control."
 SOV_broad_gauge_streamlining_desc:0 "Upgrade the Petrograd–Moscow connection to level three and circulate military transport lessons through the staff."

 GER_sealed_train_proposal_tt:0 "Requests Russian deliberation on returning political exiles. The recipient decides the consequences; no stability or war support is removed by this focus."
 SOV_moonsund_mine_barrage_desc:0 "Study Baltic mine defence and train the naval staff. Mine-laying research requires Man the Guns; without that feature the programme supports naval-artillery research. No fictitious mine equipment is created."

 ww1_germany_events.17.t:0 "The Reichstag Electoral Balance"
 ww1_germany_events.17.d:0 "The election has reshaped the balance between conservative interests and a growing parliamentary opposition. The cabinet must decide whether to defend an uncompromising political bloc or seek a broader agreement over defence legislation. The result affects domestic cooperation; it does not make the army stronger by itself."
 ww1_germany_events.17.a:0 "Hold the conservative bloc together."
 ww1_germany_events.17.b:0 "Seek broader support for defence legislation."
 ww1_germany_events.18.t:0 "An Austro-German Staff Conference"
 ww1_germany_events.18.d:0 "German and Austro-Hungarian officers meet to compare mobilisation plans, liaison procedures and the limits of their respective rail networks. The conference builds professional familiarity and diplomatic trust. Armies and equipment still have to be prepared by each government."
 ww1_germany_events.18.a:0 "Exchange the staff plans."
