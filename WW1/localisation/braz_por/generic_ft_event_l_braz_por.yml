l_braz_por: 
  generic_ft_general_event.1.t:0 "Pedido de Conselheiros de [ROOT.GetName]"
  generic_ft_general_event.1.desc:0 "[ROOT.GetName] deseja contratar um conselheiro militar estrangeiro para modernizar o comando. Foram identificados três candidatos de renome. Qual tradição de pensamento militar devemos escolher?"
  generic_ft_general_event.1.a:0 "A Escola Francesa."
  generic_ft_general_event.1.b:0 "A Escola Russa."
  generic_ft_general_event.1.c:0 "A Escola Alemã."

  generic_ft_general_event.2.t:0 "Batalha Simulada de [ROOT.GetName]"
  generic_ft_general_event.2.desc:0 "[ROOT.GetName] demonstra grande aptidão tática no uso do terreno para obter vantagens defensivas e ofensivas. Realizar um exercício militar conjunto aprimorará ainda mais as tropas. Onde devemos realizar a manobra?"
  generic_ft_general_event.2.a:0 "Nas areias do deserto."
  generic_ft_general_event.2.b:0 "Nas florestas tropicais."
  generic_ft_general_event.2.c:0 "Nos pântanos."
  generic_ft_general_event.2.d:0 "Nos bosques temperados."
  generic_ft_general_event.2.e:0 "Nas colinas."
  generic_ft_general_event.2.f:0 "Nas montanhas."
  generic_ft_general_event.2.g:0 "Nas tundras."

  generic_ft_general_event.3.t:0 "Expansão do Estado-Maior de [ROOT.GetName]"
  generic_ft_general_event.3.desc:0 "[ROOT.GetName] é um marechal de campo que retornou de estudos com os principais estrategistas da Europa e solicitou a expansão de seu corpo de oficiais auxiliares para melhor coordenar grandes operações."
  generic_ft_general_event.3.a:0 "Contratar um Estado-Maior de elite."
  generic_ft_general_event.3.b:0 "Contratar um grande contingente de oficiais!"

  generic_ft_general_event.4.t:0 "Especialização em Escolta de [ROOT.GetName]"
  generic_ft_general_event.4.desc:0 "[ROOT.GetName] tem demonstrado grande capacidade em coordenar contratorpedeiros e cruzadores para a proteção da esquadra principal. A principal virtude de comando demonstrada é..."
  generic_ft_general_event.4.a:0 "Vigilância aguçada."
  generic_ft_general_event.4.b:0 "Instinto de proteção inabalável."
  generic_ft_general_event.4.c:0 "Cálculo tático preciso."

  generic_ft_general_event.5.t:0 "Doutrina Submarina de [ROOT.GetName]"
  generic_ft_general_event.5.desc:0 "Com a ascensão das armas subaquáticas, foram propostas novas aplicações táticas para os submarinos no cenário moderno. Qual deve ser a prioridade da doutrina?"
  generic_ft_general_event.5.a:0 "Bloquear comboios mercantes inimigos."
  generic_ft_general_event.5.b:0 "Emboscar navios de guerra inimigos."

  generic_ft_general_event.6.t:0 "Batalha Decisiva Naval de [ROOT.GetName]"
  generic_ft_general_event.6.desc:0 "Nossos almirantes debatem sobre o navio supremo capaz de garantir o domínio absoluto dos mares na guerra moderna. Em que devemos focar?"
  generic_ft_general_event.6.a:0 "O navio-aeródromo é o futuro!"
  generic_ft_general_event.6.b:0 "O encouraçado dreadnought reina supremo!"

  generic_ft_general_event.7.t:0 "$unique_model_fascism_focus$"
  generic_ft_general_event.7.desc:0 "[ROOT.GetFascistLeader] traçou um rumo singular para o movimento autoritário nacional. O elemento definidor desse regime reside em..."
  generic_ft_general_event.7.a:0 "Fervor ideológico inabalável."
  generic_ft_general_event.7.b:0 "Pragmatismo estatal absoluto."
  generic_ft_general_event.7.c:0 "Mandato divino e tradição sagrada."

  generic_ft_general_event.8.t:0 "Eleições de [GetYear]"
  generic_ft_general_event.8.desc:0 "As eleições gerais de [GetYear] foram realizadas em [ROOT.GetName]. As forças democráticas e constitucionais asseguraram a estabilidade do parlamento. O partido vitorioso na formação do gabinete é..."
  generic_ft_general_event.8.a:0 "Os Socialistas!"
  generic_ft_general_event.8.b:0 "Os Liberais!"
  generic_ft_general_event.8.c:0 "Os Conservadores!"

  generic_ft_general_event.9.t:0 "Eleições Antecipadas de [GetYear]"
  generic_ft_general_event.9.desc:0 "Eleições antecipadas foram convocadas em [ROOT.GetName]. Após acirrada campanha, a maioria governamental foi conquistada por..."
  generic_ft_general_event.9.a:0 "Os Socialistas!"
  generic_ft_general_event.9.b:0 "Os Liberais!"
  generic_ft_general_event.9.c:0 "Os Conservadores!"

  generic_ft_general_event.10.t:0 "Política Moderada em [ROOT.GetName]"
  generic_ft_general_event.10.desc:0 "O governo de [ROOT.GetName] é pautado pela moderação e cautela institucional diante das turbulências internacionais. [ROOT.GetNeutralLeader] guia o Estado com ponderação."
  generic_ft_general_event.10.a:0 "A moderação é o melhor caminho."
  generic_ft_general_event.10.b:0 "O pragmatismo de centro garante a paz."
  generic_ft_general_event.10.c:0 "Faremos reformas rumo à democracia."
  generic_ft.12.t:0 "Pedido de Assistência Militar"
  generic_ft.12.d:0 "[FROM.GetName] solicitou formalmente apoio militar, garantias e armas para reforçar suas defesas."
  generic_ft.12.a:0 "Nós iremos apoiá-los."
  generic_ft.12.b:0 "Recusar o pedido."
  generic_ft.13.t:0 "Ajuda Militar Aceita"
  generic_ft.13.d:0 "[FROM.GetName] aceitou fornecer equipamento e cooperação técnica às nossas forças armadas."
  generic_ft.13.a:0 "Excelente notícia!"
  generic_ft.14.t:0 "Ajuda Militar Recusada"
  generic_ft.14.d:0 "[FROM.GetName] recusou nosso pedido de assistência militar."
  generic_ft.14.a:0 "Lembraremos disso."
  generic_ft.15.t:0 "Pedido de Apoio Industrial"
  generic_ft.15.d:0 "[FROM.GetName] solicitou investimentos e maquinaria para expandir sua capacidade bélica."
  generic_ft.16.t:0 "Cooperação Industrial Aprovada"
  generic_ft.16.d:0 "Fábricas estrangeiras começaram a apoiar nosso esforço produtivo."
  generic_ft.17.t:0 "Intervenção de Grande Potência Solicitada"
  generic_ft.17.d:0 "[FROM.GetName] solicitou nossa proteção geopolítica direta contra ameaças externas."
  generic_1.t:0 "Missão Militar Concluída"
  generic.1.t:0 "Missão Militar Concluída"
  Host:0 "Ferramenta de Host"
  HostTool:0 "Ferramenta de Host"
