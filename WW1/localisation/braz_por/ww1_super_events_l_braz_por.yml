l_braz_por:
 ww1_super_event_outbreak_title:0 "§Y--- A GRANDE GUERRA (1914 - 1918) ---§!"
 ww1_super_event_outbreak_quote:0 "\"As lâmpadas estão se apagando por toda a Europa; não as veremos acesas novamente em nossa vida.\"\n§7— Sir Edward Grey, 3 de Agosto de 1914§!"
 ww1_super_event_outbreak_button:0 "§RQue Deus tenha piedade de nossas almas.§!"

 ww1_news.1914_sarajevo_assassination.t:0 "Os Tiros de Sarajevo: Arquiduque Assassinado!"
 ww1_news.1914_sarajevo_assassination.d:0 "Numa ensolarada manhã em Sarajevo, Bósnia, dois disparos de pistola estilhaçaram irrevogavelmente a paz do mundo civilizado. O Arquiduque Francisco Ferdinando, herdeiro do trono austro-húngaro, e sua esposa Sofia, Duquesa de Hohenberg, foram brutalmente alvejados durante uma carreata oficial ao longo do Cais Appel.\n\nO assassino, um jovem radical sérvio-bósnio de dezenove anos chamado Gavrilo Princip, filiado à organização conspiratória 'Mão Negra', foi capturado imediatamente pelos gendarmes imperiais. Em Viena, o idoso Imperador Francisco José está em luto profundo, enquanto os círculos militares da Ballhausplatz exigem punição implacável contra Belgrado. Na Sérvia, o pânico e o fervor nacionalista se misturam perante a tempestade que se aproxima.\n\nA faísca foi ateada no barril de pólvora dos Bálcãs. O que se seguirá decidirá o destino de todos os impérios europeus."
 ww1_news.1914_sarajevo_assassination.a:0 "A retribuição será rápida e implacável!"
 ww1_news.1914_sarajevo_assassination.b:0 "Defenderemos nossa pátria até o último suspiro!"
 ww1_news.1914_sarajevo_assassination.c:0 "Uma tragédia irreparável atinge a Europa..."

 ww1_news.1914_great_war_outbreak.t:0 "COMEÇA A GRANDE GUERRA!"
 ww1_news.1914_great_war_outbreak.d:0 "A engrenagem diplomática do Velho Mundo desmoronou irremediavelmente no abismo. Após o ultimato de Viena a Belgrado, a mobilização geral do Império Russo e a invasão da neutralidade belga pela Alemanha, o continente europeu foi engolfado pela conflagração total.\n\nDas pedras de Londres às avenidas de Paris, da Unter den Linden de Berlim à Praça do Palácio em Petrogrado, milhões de jovens marcham entoando hinos sob a aclamação de multidões convencidas de que retornarão vitoriosos antes da queda das primeiras folhas do outono.\n\nPorém, nas fronteiras, canhões de cerco pesados e metralhadoras Maxim ceifam regimentos inteiros em segundos, transformando campos bucólicos em labirintos de lama, arame farpado e sangue. O Concerto da Europa morreu. A Grande Guerra começou."
 ww1_news.1914_great_war_outbreak.central_powers:0 "Gott mit uns! Vitória antes do outono!"
 ww1_news.1914_great_war_outbreak.entente:0 "Pela liberdade e pela civilização! Jamais nos renderemos!"
 ww1_news.1914_great_war_outbreak.neutrals:0 "O mundo civilizado mergulha na escuridão..."
