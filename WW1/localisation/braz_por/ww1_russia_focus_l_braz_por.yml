l_braz_por:

 SOV_the_empire_of_nicholas_ii:0 "O Império de Nicolau II"
 SOV_the_empire_of_nicholas_ii_desc:0 "Governando um sexto da massa terrestre do globo, o Autocrata Russo reina por direito divino sobre 160 milhões de almas. Contudo, por trás do esplendor imperial de Tsarskoye Selo, encontra-se um império em convulsa transformação."
 SOV_the_stolypin_conundrum:0 "O Enigma de Stolypin"
 SOV_the_stolypin_conundrum_desc:0 "O Primeiro-Ministro Pyotr Stolypin insiste que a Rússia necessita de vinte anos de paz interna e externa para se tornar inexpugnável. Suas reformas agrárias e firme repressão lhe renderam inimigos ferrenhos entre a nobreza e os revolucionários."
 SOV_kiev_opera_gala_1911:0 "Gala na Ópera de Kiev"
 SOV_kiev_opera_gala_1911_desc:0 "Em setembro de 1911, o Czar e seus ministros assistem a 'O Conto do Czar Saltan' de Rimsky-Korsakov em Kiev. No segundo intervalo, o informante policial e revolucionário Dmitry Bogrov aproxima-se de Stolypin com uma pistola Browning carregada."
 SOV_stolypin_martyrdom:0 "O Martírio de Stolypin"
 SOV_stolypin_martyrdom_desc:0 "Stolypin sucumbe aos ferimentos dias após o atentado. Com sua morte, o Império Russo perde seu estadista modernizador mais resoluto, paralisando o ímpeto reformista no pior momento possível."
 SOV_kokovtsov_premiership:0 "A Gestão Prudente de Kokovtsov"
 SOV_kokovtsov_premiership_desc:0 "Vladimir Kokovtsov assume o cargo de primeiro-ministro. Dedicado a equilibrar o orçamento e conter aventuras militares, seu conservadorismo cauteloso preserva a estabilidade financeira enquanto as tensões internas fermentam."
 SOV_reactionary_resurgence:0 "Ressurgimento Reacionário"
 SOV_reactionary_resurgence_desc:0 "Facções de direita no Conselho de Estado e nos círculos da corte afirmam seu domínio. Iniciativas reformistas são engavetadas em favor da preservação dos privilégios autocráticos tradicionais e da autoridade da Igreja."
 SOV_goremykin_stagnation:0 "A Complacência de Goremykin"
 SOV_goremykin_stagnation_desc:0 "O idoso Ivan Goremykin, cortesão arquiconservador que admite abertamente sua relutância em governar, é nomeado Presidente do Conselho de Ministros, aprofundando a paralisia do executivo."
 SOV_rasputin_court_influence:0 "A Sombra de Rasputin sobre Tsarskoye Selo"
 SOV_rasputin_court_influence_desc:0 "O starets siberiano Grigori Rasputin consolida sua influência mística sobre a Czarina Alexandra, ditando nomeações ministeriais e alimentando rumores venenosos que desmoralizam a família imperial em todos os estratos sociais."
 SOV_stolypin_survives_the_bullet:0 "Stolypin Desafia a Morte"
 SOV_stolypin_survives_the_bullet_desc:0 "A bala do assassino atinge a condecoração de Stolypin e desvia. Sobrevivendo à trama de Kiev, o Primeiro-Ministro converte a comoção pública em autoridade absoluta, avançando com seu grande plano para a Rússia."
 SOV_stolypins_twenty_years:0 "Vinte Anos de Paz"
 SOV_stolypins_twenty_years_desc:0 "'Dai ao Estado vinte anos de paz interna e externa, e não reconhecereis a Rússia de hoje.' Stolypin redobra os esforços para transformar a Rússia em um império de proprietários rurais prósperos."
 SOV_curb_gentry_privileges:0 "Conter Privilégios da Nobreza Rural"
 SOV_curb_gentry_privileges_desc:0 "Stolypin rompe a obstrução reacionária no Conselho de Estado, subordinando os interesses latifundiários da aristocracia à modernização nacional e à uniformidade jurídica nas províncias."
 SOV_zemstvo_reform_expansion:0 "Expansão Administrativa dos Zemstvos"
 SOV_zemstvo_reform_expansion_desc:0 "O autogoverno local é estendido às províncias ocidentais e populações não pertencentes à nobreza, construindo infraestrutura cívica e escolas primárias custeadas diretamente pelo tesouro central."
 SOV_the_iron_prime_minister:0 "O Primeiro-Ministro de Ferro"
 SOV_the_iron_prime_minister_desc:0 "Combinando amplas reformas socioeconômicas com lei e ordem inflexíveis, Stolypin forja uma autocracia constitucional estável capaz de resistir a qualquer tempestade."
 SOV_the_third_state_duma:0 "A Terceira Duma de Estado"
 SOV_the_third_state_duma_desc:0 "Eleita sob a restritiva lei eleitoral de 1907, a Terceira Duma é a primeira a completar seu mandato integral de cinco anos, estabelecendo rotinas legislativas práticas entre o parlamento e os ministros imperiais."
 SOV_guchkov_and_the_octobrists:0 "Guchkov e os Octobristas"
 SOV_guchkov_and_the_octobrists_desc:0 "A União de 17 de Outubro de Alexander Guchkov busca uma terceira via: monarquia constitucional, créditos de defesa e eficiência administrativa sem rupturas revolucionárias."
 SOV_milyukov_and_the_kadets:0 "Milyukov e os Kadets"
 SOV_milyukov_and_the_kadets_desc:0 "Os Democratas Constitucionais de Pavel Milyukov defendem o parlamentarismo nos moldes britânicos, liberdades civis, sufrágio universal e firme defesa dos interesses externos russos."
 SOV_the_fourth_state_duma_1912:0 "Eleições para a Quarta Duma"
 SOV_the_fourth_state_duma_1912_desc:0 "As eleições de 1912 compõem a Quarta Duma de Estado, presidida por Mikhail Rodzianko. Embora fragmentada, torna-se rapidamente o centro do debate nacional à medida que a corrida armamentista europeia se intensifica."
 SOV_curb_socialist_deputies:0 "Reprimir Agitação Socialista"
 SOV_curb_socialist_deputies_desc:0 "Após o massacre dos campos de ouro de Lena e ondas crescentes de greves, a Ochrana intensifica a vigilância sobre os deputados bolcheviques e mencheviques da Duma para impedir coordenações revolucionárias clandestinas."
 SOV_pass_public_health_acts:0 "Legislação de Seguro Operário"
 SOV_pass_public_health_acts_desc:0 "A Duma aprova a histórica legislação de seguro contra acidentes e de saúde para os operários industriais, estabelecendo fundos de auxílio geridos conjuntamente por trabalhadores e patrões."
 SOV_progressive_bloc_1915:0 "Formação do Bloco Progressista"
 SOV_progressive_bloc_1915_desc:0 "Em agosto de 1915, em meio ao desastre militar na Polônia, dois terços da Duma e do Conselho de Estado unem-se no Bloco Progressista, exigindo um 'governo que desfrute da confiança da nação'."
 SOV_ministry_of_national_confidence:0 "Ministério da Confiança Nacional"
 SOV_ministry_of_national_confidence_desc:0 "A Duma requer ao Czar a substituição de cortesãos impopulares por figuras públicas competentes da sociedade civil e indústria para supervisionar a mobilização de guerra."
 SOV_rodzianko_ultimatum:0 "Milyukov: 'Estupidez ou Traição?'"
 SOV_rodzianko_ultimatum_desc:0 "Em um discurso inflamado na Duma em novembro de 1916, Pavel Milyukov ataca a corrupção na corte e as intrigas derrotistas, bradando após cada denúncia: 'Isto é estupidez, ou é traição?'"
 SOV_murder_of_rasputin:0 "O Assassinato de Rasputin"
 SOV_murder_of_rasputin_desc:0 "O Príncipe Felix Yusupov e o Grão-Duque Dmitri Pavlovich atraem Rasputin ao Palácio Moika e o executam em uma tentativa desesperada de salvar a dinastia Romanov da ignomínia."
 SOV_february_bread_riots_1917:0 "Motins do Pão em Petrogrado"
 SOV_february_bread_riots_1917_desc:0 "Temperaturas abaixo de zero, linhas férreas rompidas e filas do pão deflagram greves massivas na capital no Dia Internacional da Mulher. Mais de 200.000 operários tomam as ruas de Petrogrado."
 SOV_mutiny_of_petrograd_garrison:0 "Motim da Guarnição da Capital"
 SOV_mutiny_of_petrograd_garrison_desc:0 "Ordenados a atirar nos manifestantes, os regimentos de reserva Pavlovsky, Volynsky e Preobrazhensky amotinam-se, fuzilam seus oficiais e distribuem fuzis às multidões revolucionárias."
 SOV_abdication_at_pskov:0 "A Abdicação em Pskov"
 SOV_abdication_at_pskov_desc:0 "Retido em seu trem imperial em Pskov e abandonado por seus generais, Nicolau II abdica do trono por si e por seu filho Alexei. Três séculos de domínio da dinastia Romanov chegam ao fim."
 SOV_provisional_government_formed:0 "O Governo Provisório"
 SOV_provisional_government_formed_desc:0 "O Príncipe Georgy Lvov preside um gabinete provisório de liberais comprometidos com as liberdades civis e a continuidade da guerra até a vitória ao lado dos Aliados ocidentais."
 SOV_petrograd_soviet_order_no_1:0 "Ordem Nº 1 do Soviete de Petrogrado"
 SOV_petrograd_soviet_order_no_1_desc:0 "O Soviete de Petrogrado decreta que as unidades militares obedeçam unicamente ao Soviete, abole as saudações e privilégios de oficiais e cria comitês de soldados, minando a coesão do exército."
 SOV_prince_lvov_coalition:0 "A Coalizão do Príncipe Lvov"
 SOV_prince_lvov_coalition_desc:0 "Tentando aplacar o abismo entre liberais burgueses e operários socialistas, socialistas moderados como Alexander Kerensky e Irakli Tsereteli ingressam no gabinete."
 SOV_executive_committee_ispolkom:0 "O Executivo dos Sovietes de Toda a Rússia"
 SOV_executive_committee_ispolkom_desc:0 "O Comitê Executivo (Ispolkom) exerce verdadeiro poder de veto sobre fábricas, telégrafos e guarnições, afirmando autoridade de fato sobre os órgãos do Estado."
 SOV_the_kerensky_ministry:0 "O Ministério de Kerensky"
 SOV_the_kerensky_ministry_desc:0 "Alexander Kerensky ascende a Ministro-Presidente. Com oratória teatral e apelos inflamados ao patriotismo revolucionário, tenta congregar a nação em ruínas para uma última ofensiva."
 SOV_the_july_days_crisis:0 "A Insurreição dos Dias de Julho"
 SOV_the_july_days_crisis_desc:0 "Motins armados espontâneos de marinheiros e Guardas Vermelhos em Petrogrado ameaçam derrubar o governo. Kerensky divulga documentos de financiamento alemão aos bolcheviques, forçando Lenin à clandestinidade."
 SOV_the_kornilov_affair:0 "O Caso Kornilov"
 SOV_the_kornilov_affair_desc:0 "O General Lavr Kornilov ordena aos corpos de cavalaria marchar sobre Petrogrado para esmagar o Soviete e restaurar a ordem. Apavorado, Kerensky recorre aos Guardas Vermelhos bolcheviques e arma os operários."
 SOV_all_power_to_the_soviets:0 "Todo Poder aos Sovietes!"
 SOV_all_power_to_the_soviets_desc:0 "Fortalecidos pelo papel no desmantelamento de Kornilov, as maiorias bolcheviques conquistam os Sovietes de Petrogrado e Moscou. Leon Trotsky organiza o Comitê Militar Revolucionário."
 SOV_storming_of_winter_palace:0 "O Assalto ao Palácio de Inverno"
 SOV_storming_of_winter_palace_desc:0 "O cruzador Aurora dispara seu tiro de festim. Guardas Vermelhos e marinheiros de Kronstadt invadem o Palácio de Inverno e prendem os ministros do Governo Provisório. Lenin proclama o poder soviético."
 SOV_decree_on_peace:0 "Decreto sobre a Paz"
 SOV_decree_on_peace_desc:0 "O Governo Soviético propõe um armistício imediato e uma paz sem anexações ou indenizações, conclamando os soldados de toda a Europa a deporem suas armas."
 SOV_decree_on_land:0 "Decreto sobre a Terra"
 SOV_decree_on_land_desc:0 "Latifúndios, domínios da coroa e terras monásticas são confiscados sem indenização e postos à disposição dos comitês agrários camponeses locais."
 SOV_founding_of_the_cheka:0 "Criação da Cheka"
 SOV_founding_of_the_cheka_desc:0 "Felix Dzerzhinsky funda a Comissão Extraordinária de Toda a Rússia para combater a contra-revolução, a sabotagem e a especulação com impiedoso terror revolucionário."
 SOV_creation_of_the_red_army:0 "Fundação do Exército Vermelho"
 SOV_creation_of_the_red_army_desc:0 "O Comissário de Guerra Leon Trotsky constrói o Exército Vermelho de Operários e Camponeses, alistando especialistas militares czaristas vigiados por comissários políticos."
 SOV_war_communism_decrees:0 "Comunismo de Guerra e Requisição"
 SOV_war_communism_decrees_desc:0 "A estatização total da indústria pesada, a militarização do trabalho e esquadrões de requisição forçada de grãos (Prodrazvyorstka) são instituídos para alimentar o bastião soviético."
 SOV_crush_the_white_armies:0 "Esmagar a Contra-Revolução"
 SOV_crush_the_white_armies_desc:0 "Trens blindados e divisões proletárias do Exército Vermelho derrotam Kolchak na Sibéria, Denikin no Don e Yudenich às portas de Petrogrado, garantindo o triunfo da Rússia Soviética."
 SOV_kornilov_iron_dictatorship:0 "A Ditadura de Ferro de Kornilov"
 SOV_kornilov_iron_dictatorship_desc:0 "A Divisão Selvagem de Kornilov rompe as barricadas do Soviete. Kerensky é preso, e o General assume o poder supremo sobre o Estado Russo."
 SOV_martial_law_in_petrograd:0 "Lei Marcial em Petrogrado"
 SOV_martial_law_in_petrograd_desc:0 "Greves são proibidas sob pena de morte. Agitadores revolucionários são submetidos a tribunais marciais e fuzilados imediatamente."
 SOV_purge_the_soviets:0 "Expurgar os Conselhos Soviéticos"
 SOV_purge_the_soviets_desc:0 "O Instituto Smolny e sedes soviéticas por toda a Rússia são invadidos por oficiais de choque. As lideranças bolcheviques, mencheviques e SR-de-esquerda são exiladas ou enforcadas."
 SOV_restore_capital_punishment:0 "Restauração da Disciplina no Front"
 SOV_restore_capital_punishment_desc:0 "A Ordem Nº 1 é revogada. Os oficiais recuperam autoridade punitiva plena, e desertores no front enfrentam execução imediata por pelotões de fuzilamento."
 SOV_national_salvation_directory:0 "Diretório de Salvação Nacional"
 SOV_national_salvation_directory_desc:0 "Kornilov, Alekseyev e Kaledin fundam um triunvirato militar dedicado à mobilização total e à defesa inflexível da Pátria."
 SOV_total_frontline_discipline:0 "Mobilizar os Regimentos de Choque"
 SOV_total_frontline_discipline_desc:0 "Oficiais, cadetes e batalhões voluntários formam a vanguarda de um exército nacional revigorado, decidido a empurrar as Potências Centrais de volta à fronteira."
 SOV_one_and_indivisible_russia:0 "Rússia, Una e Indivisível!"
 SOV_one_and_indivisible_russia_desc:0 "Movimentos separatistas nas periferias são sufocados enquanto Kornilov proclama o Estado Russo uno e indivisível sob hegemonia militar."
 SOV_convene_constituent_assembly:0 "Convocar a Assembleia Constituinte"
 SOV_convene_constituent_assembly_desc:0 "As eleições para a Assembleia Constituinte de Toda a Rússia realizam-se com ampla participação. Milhões de camponeses e cidadãos votam livremente pelo futuro da Rússia."
 SOV_chernov_and_sr_plurality:0 "Victor Chernov e a Vitória SR"
 SOV_chernov_and_sr_plurality_desc:0 "Os Socialistas-Revolucionários obtêm maioria esmagadora. Victor Chernov é eleito Presidente da Assembleia, defendendo a socialização agrária das terras."
 SOV_defend_the_tauride_palace:0 "Defender o Palácio Tauride"
 SOV_defend_the_tauride_palace_desc:0 "Guardas socialistas leais e soldados veteranos protegem a Assembleia Constituinte contra ordens de dispersão bolcheviques, assegurando a supremacia constitucional."
 SOV_federal_democratic_republic:0 "República Democrática Federativa Russa"
 SOV_federal_democratic_republic_desc:0 "A Assembleia proclama a Rússia como uma república democrática federal, estabelecendo direitos civis fundamentais e governança parlamentar."
 SOV_legal_land_distribution:0 "Socialização Agrária Ordenada"
 SOV_legal_land_distribution_desc:0 "A lei agrária fundamental socializa os latifúndios sob a gestão de zemstvos locais democráticos sem a violência da guerra civil ou pilhagens arbitrárias."
 SOV_autonomy_to_minority_nations:0 "Autonomia às Nacionalidades Fronteiriças"
 SOV_autonomy_to_minority_nations_desc:0 "Finlândia, Ucrânia, Cáucaso e Sibéria recebem ampla autonomia legislativa no seio de uma confederação democrática fraternal e voluntária."
 SOV_democratic_war_effort:0 "Defesa Revolucionária da República"
 SOV_democratic_war_effort_desc:0 "Inspirados pela defesa de sua liberdade recém-conquistada, soldados-cidadãos mobilizam-se para defender a República livre contra o imperialismo estrangeiro."
 SOV_social_democracy_victorious:0 "Triunfo da Democracia Russa"
 SOV_social_democracy_victorious_desc:0 "Derrotando golpes reacionários e inimigos externos, a República Democrática Russa assume seu lugar de destaque entre as democracias do mundo."
 SOV_the_tsar_refuses_abdication:0 "O Czar Recusa a Abdicação"
 SOV_the_tsar_refuses_abdication_desc:0 "Na estação de Pskov, Nicolau II lança a minuta da abdicação às chamas. 'Sou responsável pela Rússia perante Deus Todo-Poderoso, e nenhum mortal arrancará a coroa de minha fronte.'"
 SOV_summon_frontline_cavalry:0 "Convocar Regimentos da Guarda do Front"
 SOV_summon_frontline_cavalry_desc:0 "O General Ivanov é despachado com regimentos calejados do Front Norte para ocupar Petrogrado e fuzilar todos os oficiais amotinados da guarnição."
 SOV_unleash_the_black_hundreds:0 "Mobilizar a União do Povo Russo"
 SOV_unleash_the_black_hundreds_desc:0 "Milícias monarquistas das Centúrias Negras tomam as ruas com estandartes imperiais, dispersando turbas revolucionárias e ocupando as centrais telegráficas."
 SOV_dissolve_the_rebellious_duma:0 "Dissolver a Duma Rebelde"
 SOV_dissolve_the_rebellious_duma_desc:0 "A Duma de Estado é dissolvida por ukase imperial. Os conspiradores do Bloco Progressista são presos e confinados na Fortaleza de Pedro e Paulo."
 SOV_reinforce_fundamental_laws:0 "Reafirmar as Leis Fundamentais de 1906"
 SOV_reinforce_fundamental_laws_desc:0 "O Artigo 4º é solenemente reafirmado: 'Ao Imperador de todas as Rússias pertence o supremo poder autocrático. A submissão à sua autoridade é ordenada pelo próprio Deus.'"
 SOV_absolutist_restoration:0 "Sagrada Monarquia Ortodoxa"
 SOV_absolutist_restoration_desc:0 "O Santo Sínodo e a coroa imperial permanecem indivisíveis, mobilizando o campesinato devoto por todo o império para uma cruzada sagrada contra invasores estrangeiros."
 SOV_purification_of_the_empire:0 "Purificação do Reino"
 SOV_purification_of_the_empire_desc:0 "Panfletos subversivos, aparelhos partidários socialistas e jornais separatistas são erradicados em definitivo pelo Corpo Especial de Gendarmes."
 SOV_divine_right_unbroken:0 "O Direito Divino Inquebrantável"
 SOV_divine_right_unbroken_desc:0 "O trono dos Romanov emerge inabalável do cadinho de 1917, com seu mandato divino revalidado perante a história e seus exércitos marchando para a vitória."
 SOV_modernizing_the_colossus:0 "Modernizando o Colosso"
 SOV_modernizing_the_colossus_desc:0 "Entre 1906 e 1913, a economia russa cresceu a mais de 6% ao ano, o ritmo mais veloz da Europa. Para manter nosso lugar entre as grandes potências, este salto industrial deve ser orientado à grandeza nacional."
 SOV_peasant_land_bank:0 "Expansão do Banco Agrário Camponês"
 SOV_peasant_land_bank_desc:0 "Expandir empréstimos hipotecários estatais subsidiados pelo Banco Agrário Camponês, permitindo que camponeses comprem terras nobres e consolidem propriedades familiares."
 SOV_dissolution_of_the_obshchina:0 "Desmantelar o Mir Comunal"
 SOV_dissolution_of_the_obshchina_desc:0 "Permitir que camponeses individuais retirem-se da redistribuição periódica da comuna aldeã (Mir), convertendo faixas comunais em propriedade privada perpétua."
 SOV_consolidate_khutor_farms:0 "Consolidar Khutors e Otrubs"
 SOV_consolidate_khutor_farms_desc:0 "Agrimensores auxiliam camponeses empreendedores a unificar faixas dispersas em propriedades cercadas (Khutors e Otrubs), multiplicando a produtividade agrária."
 SOV_siberian_resettlement_program:0 "Migração Colonizadora da Sibéria"
 SOV_siberian_resettlement_program_desc:0 "Fornecer transporte ferroviário gratuito nos vagões de Stolypin e conceder lotes de 40 dessiatinas na Sibéria Ocidental e Altai para aliviar a superpopulação agrária."
 SOV_zemstvo_agronomists:0 "Estações Agronômicas dos Zemstvos"
 SOV_zemstvo_agronomists_desc:0 "Despachar agrônomos e químicos de solo para instruir aldeões sobre rotação trienal de culturas, fertilizantes e seleção de sementes modernas."
 SOV_modern_agricultural_machinery:0 "Importar Ceifadeiras e Tratores Modernos"
 SOV_modern_agricultural_machinery_desc:0 "Subsidiar a aquisição de ceifadeiras mecânicas McCormick e arados de ferro, substituindo arados arcaicos de madeira em toda a bacia de terra negra."
 SOV_altai_grain_harvests:0 "Boom de Manteiga e Trigo Siberiano"
 SOV_altai_grain_harvests_desc:0 "Cooperativas de laticínios e silos de grãos siberianos produzem excedentes de manteiga e trigo de renome internacional, transformando a Sibéria em motor econômico."
 SOV_ukrainian_sugar_refineries:0 "Refinarias de Açúcar de Beterraba da Ucrânia"
 SOV_ukrainian_sugar_refineries_desc:0 "Os barões do açúcar de Kiev e Podólia operam dezenas de refinarias a vapor, suprindo o mercado nacional de doces e etanol."
 SOV_grain_export_monopoly:0 "Terminais Graneleiros do Mar Negro"
 SOV_grain_export_monopoly_desc:0 "Modernizar os gigantescos silos graneleiros de Odessa, Nikolayev e Novorossiysk. A Rússia alimenta a Europa, suprindo mais de 40% do mercado mundial de trigo."
 SOV_state_grain_elevators:0 "Rede Estatal de Silos de Grãos"
 SOV_state_grain_elevators_desc:0 "Construir silos maciços de concreto armado ao longo do Volga e Dnieper para impedir perdas e proteger o mercado contra quebras de safra."
 SOV_rural_electrification_initiatives:0 "Experimentos de Eletrificação Rural"
 SOV_rural_electrification_initiatives_desc:0 "Moinhos hidroelétricos e dínamos locais levam energia elétrica a vilas e zemstvos rurais, diminuindo o abismo entre o campo e a metrópole."
 SOV_cooperative_credit_societies:0 "Cooperativas de Crédito Camponesas"
 SOV_cooperative_credit_societies_desc:0 "Mais de 30.000 cooperativas de crédito concedem empréstimos a juros módicos a pequenos proprietários, libertando produtores de agiotas."
 SOV_flourishing_rural_middle_class:0 "O Próspero Campesinato Proprietário"
 SOV_flourishing_rural_middle_class_desc:0 "O ideal de Stolypin concretizado: uma sólida classe proprietária de camponeses independentes, leais à estabilidade social e imunes às promessas revolucionárias."
 SOV_putilov_works_expansion:0 "Expansão do Complexo Industrial Putilov"
 SOV_putilov_works_expansion_desc:0 "A Usina Putilov de São Petersburgo emprega 30.000 operários. Investimentos maciços em suas fundições de metalurgia e oficinas de artilharia naval a tornam a fortaleza industrial da Rússia."
 SOV_donbass_coal_and_iron_basin:0 "A Bacia Carbonífera do Donets (Donbass)"
 SOV_donbass_coal_and_iron_basin_desc:0 "Financiadas em grande parte por capital francês e belga, as profundas minas de carvão de Yuzovka fornecem o coque de antracito necessário para os altos-fornos do Império."
 SOV_obukhov_ordnance_works:0 "Usina Estatal de Canhões de Aço Obukhov"
 SOV_obukhov_ordnance_works_desc:0 "A fábrica estatal em Obukhovo especializa-se em canhões navais de 12 polegadas, forjamento de blindagens e fabricação de torpedos."
 SOV_krivoy_rog_iron_mines:0 "Minas de Ferro a Céu Aberto de Krivoy Rog"
 SOV_krivoy_rog_iron_mines_desc:0 "Os ricos minérios de hematita de Krivoy Rog alimentam altos-fornos em Ekaterinoslav e Mariupol, consolidando um polo metalúrgico meridional incomparável."
 SOV_baku_black_gold_monopoly:0 "O Ouro Negro de Baku"
 SOV_baku_black_gold_monopoly_desc:0 "A península de Absheron, no Azerbaijão, produz mais da metade do querosene refinado e lubrificantes do mundo. Bombas elétricas substituem métodos manuais."
 SOV_makeyevka_metallurgical_works:0 "Complexo Metalúrgico de Makeyevka"
 SOV_makeyevka_metallurgical_works_desc:0 "Construir altos-fornos ultramodernos em Makeyevka capazes de fabricar trilhos ferroviários pesados, vigas estruturais e chapas de caldeira em tempo recorde."
 SOV_urals_heavy_smelters:0 "Revitalizar as Fundições dos Urais"
 SOV_urals_heavy_smelters_desc:0 "Modernizar as usinas Demidov e Stroganov em Nizhny Tagil e Perm, substituindo fornos de carvão vegetal por conversores modernos Siemens-Martin."
 SOV_nobel_and_rothschild_refineries:0 "Engenharia de Petróleo dos Irmãos Nobel"
 SOV_nobel_and_rothschild_refineries_desc:0 "A Branobel constrói os primeiros petroleiros do mundo e o oleoduto Baku-Batumi, assegurando a supremacia exportadora nos mercados globais."
 SOV_motovilikha_artillery_plant:0 "Fundições de Canhões de Motovilikha (Perm)"
 SOV_motovilikha_artillery_plant_desc:0 "Abrigada atrás dos Montes Urais, a usina de Motovilikha produz canhões e obuses de campanha a salvo de bombardeios ou incursões do front."
 SOV_saint_petersburg_heavy_engineering:0 "Pólo de Maquinário Pesado de Petrogrado"
 SOV_saint_petersburg_heavy_engineering_desc:0 "O Estaleiro Báltico, as Usinas Franco-Russas e as fábricas Lessner na capital formam a maior concentração de engenharia mecânica de precisão da Europa Oriental."
 SOV_moscow_textile_and_rubber_mills:0 "Conglomerados Têxteis e Químicos de Moscou"
 SOV_moscow_textile_and_rubber_mills_desc:0 "A tecelagem Trekhgornaya e as usinas Treugolnik fornecem botas, lonas e borracha para máscaras de gás de todo o exército imperial."
 SOV_domestic_machine_tool_production:0 "Independência de Máquinas-Ferramenta"
 SOV_domestic_machine_tool_production_desc:0 "Encerrar a dependência de tornos de precisão alemães e prensas francesas, estabelecendo institutos estatais de matrizes em Nizhny Novgorod."
 SOV_electrification_of_heavy_industry:0 "Plano Hidrelétrico do Rio Volkhov"
 SOV_electrification_of_heavy_industry_desc:0 "Aproveitar as correntes do Rio Volkhov junto ao Lago Ladoga para gerar 60.000 cavalos-vapor de corrente elétrica de alta tensão para alimentar as indústrias de Petrogrado."
 SOV_trans_siberian_double_tracking:0 "Duplicação dos Trilhos da Transiberiana"
 SOV_trans_siberian_double_tracking_desc:0 "Instalar uma segunda linha paralela de Omsk a Vladivostok, eliminando gargalos e permitindo o trânsito de 40 trens militares diários pela Eurásia."
 SOV_circum_baikal_engineering:0 "Túneis Montanhosos de Circum-Baikal"
 SOV_circum_baikal_engineering_desc:0 "Reforçar os 39 túneis perfurados nos penhascos de granito do Lago Baikal com revestimentos de concreto armado contra deslizamentos de rochas."
 SOV_poland_strategic_railway_grid:0 "Malha Ferroviária Estratégica da Polônia"
 SOV_poland_strategic_railway_grid_desc:0 "Linhas alimentadoras de bitola larga conectando Varsóvia, Ivangorod, Brest-Litovsk e Bialystok possibilitam a manobra célere de exércitos inteiros."
 SOV_amur_railway_link:0 "Completar a Ferrovia do Rio Amur"
 SOV_amur_railway_link_desc:0 "Concluir a ferrovia ao longo do Rio Amur até Vladivostok, contornando a Ferrovia Oriental Chinesa e assegurando trânsito militar direto ao Pacífico."
 SOV_murmansk_ice_free_port_lifeline:0 "A Ferrovia Ártica de Murmansk"
 SOV_murmansk_ice_free_port_lifeline_desc:0 "Construir 1.000 quilômetros de trilhos sobre a tundra e pântanos congelados até o Golfo de Kola, fundando o porto de águas profundas de Romanov-on-Murman."
 SOV_arkhangelsk_broad_gauge_conversion:0 "Converter Arkhangelsk à Bitola Larga"
 SOV_arkhangelsk_broad_gauge_conversion_desc:0 "Converter a linha de bitola estreita Vologda-Arkhangelsk à bitola russa larga, permitindo que dezenas de milhares de toneladas de munições fluam diretamente ao front."
 SOV_caucasus_mountain_lines:0 "Ferrovia Transcaucasiana Tiflis-Kars"
 SOV_caucasus_mountain_lines_desc:0 "Estender as ferrovias de montanha de Tiflis à fortaleza de Kars, assegurando o reabastecimento contínuo de artilharia pesada contra a Anatólia otomana."
 SOV_white_sea_icebreaker_fleet:0 "Frota de Quebra-Gelos do Mar Branco"
 SOV_white_sea_icebreaker_fleet_desc:0 "Comissionar quebra-gelos pesados como o Yermak e Svyatogor para manter os canais do Mar Branco navegáveis durante invernos árticos rigorosos."
 SOV_military_railway_battalions:0 "Batalhões Sapadores Ferroviários"
 SOV_military_railway_battalions_desc:0 "Organizar batalhões de sapadores equipados com dresinas blindadas e tratores a vapor para erguer pontes e reparar trilhos destruídos em poucas horas."
 SOV_broad_gauge_streamlining:0 "Frota Ferroviária Estratégica Unificada"
 SOV_broad_gauge_streamlining_desc:0 "Padronizar todas as 50.000 locomotivas e vagões imperiais, equipando-os com freios de ar comprimido Westinghouse e roteamento militar centralizado."
 SOV_strategic_reserve_depots:0 "Centro Logístico Central em Smolensk"
 SOV_strategic_reserve_depots_desc:0 "Construir depósitos monumentais de grãos e munições em Smolensk, Kursk e Gomel, estrategicamente posicionados atrás da frente de batalha."
 SOV_special_council_for_defense:0 "Conselho Especial de Defesa (Osoboye Soveshchaniye)"
 SOV_special_council_for_defense_desc:0 "Constituir um conselho supremo de coordenação reunindo o Ministério da Guerra, líderes da Duma e industriais para orientar pedidos de guerra e prioridades."
 SOV_war_industry_committees_zemgor:0 "Mobilizar os Comitês da Indústria de Guerra e Zemgor"
 SOV_war_industry_committees_zemgor_desc:0 "Recrutar a União de Zemstvos e Cidades (Zemgor) do Príncipe Lvov e os Comitês de Guchkov para mobilizar oficinas provinciais para a usinagem de granadas."
 SOV_convert_civilian_foundries:0 "Converter Oficinas Civis para Fabricação de Granadas"
 SOV_convert_civilian_foundries_desc:0 "Oficinas ferroviárias, fábricas de implementos agrícolas e fundições privadas são adaptadas com tornos, produzindo milhões de estojos de granadas de 3 polegadas."
 SOV_female_ammunition_workers:0 "Mobilizar Mulheres nas Fábricas de Munição"
 SOV_female_ammunition_workers_desc:0 "Recrutar mais de 400.000 mulheres camponesas e urbanas em fábricas de cartuchos e ogivas, mantendo a produção fabril máxima."
 SOV_centralized_grain_procurement:0 "Preços Fixos de Requisição de Grãos"
 SOV_centralized_grain_procurement_desc:0 "Estabelecer preços-teto fixos para o centeio e trigo, empregando comitês de zemstvos para garantir o abastecimento do exército e das cidades industriais."
 SOV_emergency_coal_allotment:0 "Alocação Prioritária de Carvão e Madeira"
 SOV_emergency_coal_allotment_desc:0 "Racionar o consumo de carvão exclusivamente para locomotivas e altos-fornos, mantendo o tráfego ferroviário ativo nos rigores do inverno."
 SOV_end_the_shell_shortage:0 "Superar a Crise de Munições (1916)"
 SOV_end_the_shell_shortage_desc:0 "Em meados de 1916, a produção nacional russa de projéteis multiplica-se por quarenta, ultrapassando 4,5 milhões de granadas mensais. A crise de 1915 é superada."
 SOV_arsenal_of_the_russian_empire:0 "O Arsenal do Estado Russo"
 SOV_arsenal_of_the_russian_empire_desc:0 "Arsenais estatais em Petrogrado, Tula e Perm operam turnos ininterruptos de 24 horas, jorrando fluxos infinitos de canhões de campanha, metralhadoras e munições."
 SOV_integrated_war_production:0 "Integração Industrial da Guerra Total"
 SOV_integrated_war_production_desc:0 "Minas, ferrovias, aciarias e fábricas de armas funcionam como uma engrenagem única coordenada, provendo a musculatura logística para a vitória total."
 SOV_rebuilding_the_empires_shields:0 "Reconstruindo os Escudos do Império"
 SOV_rebuilding_the_empires_shields_desc:0 "Traumatizados pelas perdas catastróficas em Tsushima e Port Arthur em 1905, o Almirantado e a Duma de Estado patrocinam um colossal programa plurianual de rearmamento naval e aéreo."
 SOV_baltic_fleet_resurgence:0 "O Renascimento da Frota do Báltico"
 SOV_baltic_fleet_resurgence_desc:0 "Sob o comando do Almirante Nikolai von Essen, a Frota do Báltico é reorganizada com exercícios intensivos de artilharia, manobras noturnas de torpedeiros e comunicações modernas."
 SOV_gangut_class_dreadnoughts:0 "Encouraçados da Classe Gangut"
 SOV_gangut_class_dreadnoughts_desc:0 "Acelerar a prontidão dos quatro encouraçados da Classe Gangut nos estaleiros de Petrogrado. Armados com doze canhões de 12 polegadas em torres triplas, rivalizam com a classe Kaiser alemã."
 SOV_gulf_of_finland_minefields:0 "Barreiras de Minas do Golfo da Finlândia"
 SOV_gulf_of_finland_minefields_desc:0 "Navios lança-minas russos lançam mais de 40.000 minas na Posição Central entre Porkkala e Reval, transformando o Golfo da Finlândia em uma fortaleza intransponível."
 SOV_kronstadt_and_reval_fortresses:0 "Fortaleza Costeira Pedro, o Grande"
 SOV_kronstadt_and_reval_fortresses_desc:0 "Torres blindadas de 12 e 14 polegadas na Ilha de Kotlin (Kronstadt) e costa estoniana cruzam seus arcos de fogo para blindar a capital contra qualquer bombardeio naval."
 SOV_novik_class_fast_destroyers:0 "Contratorpedeiros Velozes Classe Novik"
 SOV_novik_class_fast_destroyers_desc:0 "Atingindo 37 nós, o Novik era o navio de guerra mais veloz do mundo ao ser lançado. Pesadamente armado com tubos triplos de torpedos e canhões de 4 polegadas, aterroriza comboios inimigos."
 SOV_bars_class_submarines:0 "Submarinos Oceânicos Classe Bars"
 SOV_bars_class_submarines_desc:0 "Construir 24 submarinos diesel-elétricos da Classe Bars equipados com colares de lançamento de torpedos Dzhevetsky para interceptar minério de ferro sueco."
 SOV_krab_minelaying_submarine:0 "Krab: O Primeiro Submarino Lança-Minas do Mundo"
 SOV_krab_minelaying_submarine_desc:0 "Mikhail Naletov projeta o Krab, capaz de transportar 60 minas navais internamente para minar portos inimigos de forma furtiva."
 SOV_british_baltic_submarine_flotilla:0 "Flotilha de Submarinos Britânicos no Báltico"
 SOV_british_baltic_submarine_flotilla_desc:0 "Submarinos britânicos da classe E forçam o estreito de Sund e entram no Báltico, afundando cruzadores alemães e paralisando o transporte de minério de ferro."
 SOV_borodino_battlecruisers_laid_down:0 "Cruzadores de Batalha Classe Borodino"
 SOV_borodino_battlecruisers_laid_down_desc:0 "Bater as quilhas de quatro colossais cruzadores de batalha de 32.000 toneladas armados com doze canhões de 14 polegadas para dominar o litoral báltico."
 SOV_baltic_mine_offensive:0 "Operações Ofensivas de Minagem"
 SOV_baltic_mine_offensive_desc:0 "Cruzadores velozes e contratorpedeiros infiltram-se em águas alemãs sob a névoa, semeando minas defronte a Danzig e Pillau, afundando cruzadores imperiais alemães."
 SOV_moonsund_archipelago_defenses:0 "Fortaleza do Arquipélago de Moonsund"
 SOV_moonsund_archipelago_defenses_desc:0 "Fortificar as ilhas de Saaremaa e Hiiumaa com baterias pesadas de 12 polegadas em Zerel, selando o Golfo de Riga contra assaltos anfíbios alemães."
 SOV_baltic_sea_denial:0 "Domínio do Mar Báltico"
 SOV_baltic_sea_denial_desc:0 "A Marinha Imperial Alemã é contida, incapaz de romper as barreiras de minas e couraçados do Golfo da Finlândia. O flanco norte russo permanece inviolável."
 SOV_black_sea_fleet_supremacy:0 "Comando da Frota do Mar Negro"
 SOV_black_sea_fleet_supremacy_desc:0 "Sediada no porto natural de Sebastopol, a Frota do Mar Negro deve preparar-se para conter a Marinha Otomana e neutralizar o cruzador de batalha alemão SMS Goeben."
 SOV_imperatritsa_mariya_battleships:0 "Encouraçados Imperatritsa Mariya"
 SOV_imperatritsa_mariya_battleships_desc:0 "Comissionar os encouraçados Imperatritsa Mariya, Catarina a Grande e Alexandre III em Nikolayev. Suas salvas de 12 polegadas superam amplamente o Goeben."
 SOV_bosphorus_raid_doctrine:0 "Táticas de Bombardeio do Bósforo"
 SOV_bosphorus_raid_doctrine_desc:0 "O Almirante Eberhardt inicia incursões de bombardeio na entrada do Bósforo, demolindo baterias costeiras otomanas e redes de faróis."
 SOV_sevastopol_naval_bastion:0 "O Bastião Naval de Sebastopol"
 SOV_sevastopol_naval_bastion_desc:0 "Fortificar pesadamente os acessos a Sebastopol com diques secos, barreiras de minas e docas de torpedeiros, forjando um santuário operacional invulnerável."
 SOV_cut_anatolia_coal_lines:0 "Interditar o Carvão de Zonguldak"
 SOV_cut_anatolia_coal_lines_desc:0 "Submarinos e contratorpedeiros afundam carvoeiros turcos da bacia de Zonguldak rumo a Constantinopla, privando a capital otomana de combustível e eletricidade."
 SOV_caucasian_amphibious_raids:0 "Desembarques Anfíbios Pônticos"
 SOV_caucasian_amphibious_raids_desc:0 "A Frota do Mar Negro coordena desembarques na retaguarda das linhas turcas em Atina e Rize, flanqueando as posições otomanas no litoral."
 SOV_trabzon_amphibious_landing:0 "A Tomada de Trebizonda (1916)"
 SOV_trabzon_amphibious_landing_desc:0 "Um assalto anfíbio conjunto conquista o porto histórico de Trebizonda (Trabzon), concedendo à Rússia uma base avançada na Anatólia."
 SOV_prepare_for_tsargrad_landing:0 "O Corpo de Desembarque de Tsargrado"
 SOV_prepare_for_tsargrad_landing_desc:0 "O Almirante Kolchak forma um corpo de fuzileiros navais de duas divisões com barcaças de desembarque para assaltar as fortalezas do Bósforo."
 SOV_black_sea_command_secured:0 "Soberania do Mar Euxino"
 SOV_black_sea_command_secured_desc:0 "O Mar Negro é transformado em um lago russo. Com o poder otomano destruído, as portas marítimas do Mediterrâneo abrem-se ao Império Russo."
 SOV_imperial_russian_air_service:0 "Comitê da Frota Aérea Imperial"
 SOV_imperial_russian_air_service_desc:0 "O Grão-Duque Alexander Mikhailovich lidera a criação do Serviço Aéreo Imperial Russo, fundando escolas de aviação em Gatchina e Sebastopol."
 SOV_kacha_military_flying_school:0 "Academia Militar de Aviação de Kacha"
 SOV_kacha_military_flying_school_desc:0 "Expandir a academia de aviação de Kacha na Crimeia. Beneficiando-se do clima meridional ameno, centenas de pilotos formam-se com maestria acrobática de combate."
 SOV_sikorsky_ilya_muromets:0 "O Gigante Ilya Muromets de Sikorsky"
 SOV_sikorsky_ilya_muromets_desc:0 "Igor Sikorsky projeta o primeiro bombardeiro estratégico quadrimotor do mundo na RBVZ, capaz de transportar 800 kg de bombas e oito metralhadoras defensivas."
 SOV_lebed_reconnaissance_corps:0 "Aeronaves de Reconhecimento Lebed"
 SOV_lebed_reconnaissance_corps_desc:0 "As fábricas Lebedev e Duks produzem centenas de biplanos bipostos com câmeras aéreas e telégrafos sem fio para direcionamento de artilharia."
 SOV_heavy_bombing_squadron_evok:0 "Esquadrão de Bombardeiros Pesados EVOK"
 SOV_heavy_bombing_squadron_evok_desc:0 "Organizar a primeira ala de bombardeiros pesados do mundo (EVOK) em Jablonna, executando ataques estratégicos contra entroncamentos ferroviários e pontes inimigas."
 SOV_nesterov_aerial_ramming_tactics:0 "O Loop de Nesterov e Táticas de Combate"
 SOV_nesterov_aerial_ramming_tactics_desc:0 "O Capitão Pyotr Nesterov executa o primeiro loop acrobático do mundo e o primeiro abalroamento aéreo (taran), inspirando gerações de aviadores de combate."
 SOV_anatra_anasal_fighter_fleet:0 "Frota de Caças Anatra Anasal"
 SOV_anatra_anasal_fighter_fleet_desc:0 "A fábrica Anatra em Odessa constrói caças rápidos com motores Salmson para escoltar os bombardeiros Ilya Muromets em incursões de penetração profunda."
 SOV_kazakov_ace_fighter_groups:0 "Grupo de Ases de Alexander Kazakov"
 SOV_kazakov_ace_fighter_groups_desc:0 "O maior ás da aviação russa, Alexander Kazakov (32 vitórias), lidera o 1º Grupo de Caça, conquistando a superioridade aérea sobre o front da Galícia."
 SOV_strategic_air_bombardment_doctrine:0 "Doutrina Estratégica de Longo Alcance"
 SOV_strategic_air_bombardment_doctrine_desc:0 "Desenvolver doutrina para bombardeios noturnos concentrados de centros industriais na Prússia Oriental e refinarias austríacas em Drohobych."
 SOV_seaplane_carriers_in_the_black_sea:0 "Navios Porta-Hidroaviões do Mar Negro"
 SOV_seaplane_carriers_in_the_black_sea_desc:0 "Converter os navios Almaz e Nicolau I em porta-hidroaviões, lançando botes voadores Grigorovich M-9 para bombardear fortes do Bósforo."
 SOV_integrated_air_naval_reconnaissance:0 "Direção Combinada Aeronaval de Tiro"
 SOV_integrated_air_naval_reconnaissance_desc:0 "Equipar aeronaves de observação naval com telégrafos para orientar salvas dos couraçados além da linha do horizonte contra baterias inimigas."
 SOV_mastery_of_the_imperial_skies:0 "Vanguarda dos Céus Mundiais"
 SOV_mastery_of_the_imperial_skies_desc:0 "Com centenas de bombardeiros estratégicos e esquadrões de elite de caça, a Rússia consolida-se como pioneira absoluta da guerra aérea do século XX."
 SOV_the_great_military_program:0 "O Grande Programa Militar de 1912"
 SOV_the_great_military_program_desc:0 "Aprovado pela Duma e pelo Imperador em 1912, o Grande Programa visa expandir o exército russo para 1,75 milhão de homens em tempo de paz e adicionar 3.000 canhões até 1917, alarmando o Estado-Maior alemão."
 SOV_sukhomlinov_reforms:0 "A Reorganização de Corpos de Sukhomlinov"
 SOV_sukhomlinov_reforms_desc:0 "O Ministro da Guerra Vladimir Sukhomlinov reestrutura o exército de campanha em corpos de exército padronizados, amplia frações de metralhadoras e acelera ciclos de recrutamento."
 SOV_grand_duke_nicholas_stavka:0 "O Grão-Duque Nicolau e a Stavka"
 SOV_grand_duke_nicholas_stavka_desc:0 "Com quase dois metros de altura, o imponente Grão-Duque Nicolau Nikolaevich desfruta de imenso prestígio entre oficiais e soldados como Comandante Supremo das Forças Imperiais."
 SOV_modernize_mosin_nagant_1891:0 "Modernizar o Mosin-Nagant M1891"
 SOV_modernize_mosin_nagant_1891_desc:0 "Adotar o projétil pontiagudo modelo 1908 e aprimorar miras graduadas no lendário fuzil de três linhas de ferrolho, elevando a velocidade inicial e alcance de tiro."
 SOV_cossack_hosts_mobilization:0 "Mobilizar as Hostes Cossacas"
 SOV_cossack_hosts_mobilization_desc:0 "Convocar as hostes guerreiras do Don, Kuban, Terek e Orenburg. Criados na sela e armados com sabres shashka e lanças, formam a principal cavalaria de choque e reconhecimento da Europa."
 SOV_reorganize_military_districts:0 "Distritos Militares de Varsóvia e Vilna"
 SOV_reorganize_military_districts_desc:0 "Posicionar quartéis-generais de corpos de exército permanentes nos distritos de fronteira para responder a manobras hostis nas fronteiras da Prússia e Galícia."
 SOV_savage_division_cavalry:0 "Cavalaria Nativa Caucasiana ('Divisão Selvagem')"
 SOV_savage_division_cavalry_desc:0 "Organizar a lendária divisão de cavalaria voluntária de circassianos, chechenos e ingushes sob o comando do Grão-Duque Mikhail, famosa por temíveis cargas de sabre."
 SOV_standing_corps_readiness:0 "Prontidão de Mobilização dos Corpos"
 SOV_standing_corps_readiness_desc:0 "Adestrar reservistas em manobras anuais de verão, reduzindo o cronograma de mobilização imperial de 30 para apenas 18 dias."
 SOV_telegraph_and_wireless_corps:0 "Corpo de Sinaleiros e Telégrafo sem Fio"
 SOV_telegraph_and_wireless_corps_desc:0 "Equipar quartéis-generais com unidades de telegrafia sem fio e impor disciplina de cifras para impedir interceptações inimigas."
 SOV_praporshchik_accelerated_officers:0 "Escolas Aceleradas de Alferes (Praporshchik)"
 SOV_praporshchik_accelerated_officers_desc:0 "Criar cursos intensivos de 4 meses para formar jovens instruídos e filhos de camponeses letrados, gerando 200.000 oficiais subalternos para repor baixas."
 SOV_imperial_guard_regiments:0 "O Corpo da Guarda Imperial"
 SOV_imperial_guard_regiments_desc:0 "Composto pelos regimentos Preobrazhensky, Semyonovsky e Izmaylovsky, a Guarda Imperial de elite serve como reserva operacional decisiva do Czar."
 SOV_general_staff_academy_doctrine:0 "Reformas da Academia do Estado-Maior Nicolau"
 SOV_general_staff_academy_doctrine_desc:0 "Modernizar o currículo da Academia Militar sob Mikhail Alekseyev, enfatizando operações escalonadas de múltiplos corpos e redes defensivas de fogo."
 SOV_general_headquarters_baranovichi:0 "Quartel-General Supremo da Stavka (Baranovichi)"
 SOV_general_headquarters_baranovichi_desc:0 "O General Mikhail Alekseyev integra inteligência, roteamento ferroviário e suprimentos em um aparelho de alto comando ágil e coeso."
 SOV_the_shell_shortage_crisis:0 "A Grande Fome de Munição (1915)"
 SOV_the_shell_shortage_crisis_desc:0 "O consumo de projéteis excede os estoques pré-guerra em quatro meses. Em 1915, baterias russas são limitadas a três tiros por canhão ao dia sob esmagadores bombardeios alemães."
 SOV_the_great_retreat_to_the_dvina:0 "A Grande Retirada até o Dvina"
 SOV_the_great_retreat_to_the_dvina_desc:0 "Para salvar o exército do cerco após o rompimento de Gorlice-Tarnów, o Grão-Duque ordena uma magistral retirada estratégica da Polônia e Lituânia, arrasando a terra na retaguarda."
 SOV_tula_and_izhevsk_arms_surge:0 "Salto na Fabricação de Fuzis em Tula e Izhevsk"
 SOV_tula_and_izhevsk_arms_surge_desc:0 "As usinas de armas de Tula e Izhevsk operam turnos ininterruptos de 24 horas, acelerando a produção de fuzis Mosin e metralhadoras Maxim para mais de 100.000 armas ao mês."
 SOV_scovill_and_vickers_foreign_shells:0 "Contratos com os Aliados: Vickers e Remington"
 SOV_scovill_and_vickers_foreign_shells_desc:0 "Contratar fábricas americanas e britânicas (Remington, Winchester, Vickers) para fabricar milhões de fuzis e granadas de alto-explosivo pagos em ouro imperial."
 SOV_schneider_and_putilov_heavy_howitzers:0 "Obuses Pesados de Cerco Schneider-Putilov"
 SOV_schneider_and_putilov_heavy_howitzers_desc:0 "Fabricar sob licença os obuses pesados de 152mm Modelo 1910 e 203mm, concedendo o poder de fogo necessário para esmagar fortalezas austríacas como Przemysl."
 SOV_sokolov_wheeled_maxim_mounts:0 "Suporte com Rodas Sokolov para Maxim M1910"
 SOV_sokolov_wheeled_maxim_mounts_desc:0 "Equipar metralhadoras Maxim com o suporte com rodas e escudo de Sokolov, permitindo arrastar os canos pela lama e neve do front."
 SOV_m1902_76mm_putilov_divisional_gun:0 "O Famoso Canhão de 3 Polegadas Putilov (M1902)"
 SOV_m1902_76mm_putilov_divisional_gun_desc:0 "Conhecido carinhosamente como 'Trekhdyuymovka', o canhão de tiro rápido Putilov de 76,2mm com alta velocidade de boca é uma das mais letais peças de campanha do conflito."
 SOV_railway_heavy_guns:0 "Canhões Navais em Vagões Ferroviários"
 SOV_railway_heavy_guns_desc:0 "Montar canhões navais sobressalentes de 10 e 12 polegadas sobre plataformas ferroviárias de múltiplos eixos, bombardeando entroncamentos alemães a 40 km de distância."
 SOV_massed_artillery_preparation:0 "Táticas de Bombardeio Concentrado Relâmpago"
 SOV_massed_artillery_preparation_desc:0 "Abandonar bombardeios preliminares de vários dias que sacrificam a surpresa. Adotar barragens concentradas de alta intensidade guiadas por observação aérea."
 SOV_gas_warfare_and_zelinsky_masks:0 "Máscaras de Carvão Ativado de Zelinsky"
 SOV_gas_warfare_and_zelinsky_masks_desc:0 "O químico Nikolai Zelinsky cria a primeira máscara de gás com filtro universal de carvão ativado do mundo. Produzida em massa, neutraliza ataques alemães de cloro e fosgênio."
 SOV_brusilov_breakthrough_1916:0 "A Ofensiva Brusilov (Junho de 1916)"
 SOV_brusilov_breakthrough_1916_desc:0 "O General Alexei Brusilov desfere a maior obra-prima tática da guerra no Front Sudoeste: atacando simultaneamente em uma frente de 500 km e estilhaçando o 4º e 7º Exércitos austríacos."
 SOV_deep_echelon_surprise_assault:0 "Trincheiras de Aproximação e Infiltração"
 SOV_deep_echelon_surprise_assault_desc:0 "Cavar valas subterrâneas a menos de 75 metros do arame farpado inimigo sob o manto da noite, permitindo romper a primeira linha antes que as metralhadoras sejam guarnecidas."
 SOV_shock_battalions_of_death:0 "Batalhões de Choque da Morte (Udarniki)"
 SOV_shock_battalions_of_death_desc:0 "Formar batalhões voluntários de choque com insígnias de caveira e ossos cruzados, adestrados em carabinas, adagas e cachos de granadas para liderar assaltos perigosos."
 SOV_fedorov_avtomat_early_rifle:0 "O Fuzil Automático de Vladimir Fedorov (Avtomat)"
 SOV_fedorov_avtomat_early_rifle_desc:0 "O Capitão Vladimir Fedorov desenvolve o primeiro fuzil de assalto de fogo seletivo do mundo, com carregador de 25 tiros no calibre 6,5mm Arisaka para tropas de choque."
 SOV_garford_putilov_armored_cars:0 "Carros Blindados Pesados Garford-Putilov"
 SOV_garford_putilov_armored_cars_desc:0 "Construídos sobre chassis Garford de 5 toneladas e armados com um canhão de 76mm na torre traseira e três metralhadoras, estes gigantes de 11 toneladas esmagam contra-ataques."
 SOV_bochkareva_womens_battalion:0 "1º Batalhão da Morte Feminino da Rússia"
 SOV_bochkareva_womens_battalion_desc:0 "Maria Bochkareva organiza o célebre batalhão de combate exclusivamente feminino com a bênção do governo e de Kornilov para envergonhar tropas desmoralizadas e reavivar o combate."
 SOV_steel_breastplates_shock:0 "Couraças de Aço para Granadeiros"
 SOV_steel_breastplates_shock_desc:0 "Equipar companhias de assalto com couraças de aço balístico curvas capazes de deter estilhaços de granadas e projéteis de pistola em combates nas trincheiras."
 SOV_vezdekhod_and_tsar_tank_experiments:0 "Experimentos do Vezdekhod e Tsar Tank"
 SOV_vezdekhod_and_tsar_tank_experiments_desc:0 "Alexander Porokhovshchikov projeta o lagartado 'Vezdekhod' enquanto Lebedenko testa o colossal triciclo Tsar Tank de 40 toneladas com rodas de 9 metros para transpor trincheiras."
 SOV_inelastic_trench_fortifications:0 "Linhas Fortificadas de Bunkers de Concreto"
 SOV_inelastic_trench_fortifications_desc:0 "Construir abrigos profundos de concreto, cinturões de arame farpado de seis camadas e casamatas interligadas nos rios Dvina e Dniester, forjando uma muralha inexpugnável."
 SOV_the_unbreakable_steamroller:0 "O Renascido Rolo Compressor Russo"
 SOV_the_unbreakable_steamroller_desc:0 "Possuindo reservas humanas inesgotáveis, munição abundante, táticas modernas de choque e carros blindados, o Exército Imperial Russo está pronto para avançar inexorável sobre Berlim e Viena."
 SOV_third_rome_foreign_policy:0 "Política Externa da Terceira Roma"
 SOV_third_rome_foreign_policy_desc:0 "Desde a queda de Constantinopla em 1453, Moscou ergue-se como a Terceira Roma. Nosso sagrado dever é proteger os cristãos ortodoxos e preservar o equilíbrio de poder europeu."
 SOV_pan_slavic_protectorate:0 "O Mandato Pan-Eslavo"
 SOV_pan_slavic_protectorate_desc:0 "O Ministro Sergei Sazonov e o embaixador Nicholas Hartwig em Belgrado estreitam laços fraternais com os reinos eslavos balcânicos para libertá-los do jugo otomano."
 SOV_the_balkan_league_architect:0 "Mediar a Liga Balcânica (1912)"
 SOV_the_balkan_league_architect_desc:0 "Sob patrocínio diplomático russo, Sérvia, Bulgária, Grécia e Montenegro firmam convenções militares com o objetivo de expulsar os otomanos da Europa."
 SOV_sacred_guarantee_to_serbia:0 "Garantia Sagrada à Sérvia"
 SOV_sacred_guarantee_to_serbia_desc:0 "O Czar assegura ao Príncipe Alexandre: 'A Rússia jamais permanecerá indiferente à sorte da Sérvia.' Um ataque austríaco a Belgrado equivalerá à guerra geral."
 SOV_first_balkan_war_mediation:0 "Mediar a Primeira Guerra Balcânica"
 SOV_first_balkan_war_mediation_desc:0 "Enquanto os exércitos balcânicos varrem a Macedônia e Trácia, a diplomacia russa contém os búlgaros de assaltar Constantinopla e assegura Kosovo para a Sérvia."
 SOV_aid_to_serbian_army:0 "Comboios Fluviais de Munição à Sérvia"
 SOV_aid_to_serbian_army_desc:0 "Enviar milhões de cartuchos Mosin e granadas pelo Danúbio até o porto sérvio de Prahovo, permitindo ao exército do Rei Pedro rechaçar as invasões austríacas."
 SOV_prevent_second_balkan_war:0 "Arbitrar a Partilha do Vardar"
 SOV_prevent_second_balkan_war_desc:0 "Atuar como árbitro solene entre Belgrado e Sófia sobre a Macedônia, evitando guerra fratricida entre irmãos eslavos e retendo a Bulgária na órbita russa."
 SOV_bring_romania_into_the_war:0 "Prometer a Transilvânia à Romênia"
 SOV_bring_romania_into_the_war_desc:0 "O Czar visita o Rei Carol e o Premiê Bratianu em Constança, prometendo a Transilvânia e o Banato caso a Romênia abra uma segunda frente contra a Áustria."
 SOV_the_july_crisis_mobilization:0 "A Ordem de Mobilização Geral (Julho de 1914)"
 SOV_the_july_crisis_mobilization_desc:0 "Após a declaração de guerra austríaca à Sérvia e a despeito dos telegramas entre os primos monarcas, Nicolau II assina o fatal ukase de mobilização geral de todo o exército."
 SOV_pan_slavic_triumph:0 "O Triunfo do Pan-Eslavismo"
 SOV_pan_slavic_triumph_desc:0 "Sob o patronato russo, os povos eslavos do Sudeste Europeu erguem-se unidos, sua libertação consumada e sua segurança garantida para as futuras gerações."
 SOV_liberate_south_slavs:0 "Grande Confederação Eslava"
 SOV_liberate_south_slavs_desc:0 "Patrocinar a criação de um reino dos Eslavos do Sul reunindo sérvios, croatas e eslovenos sob a dinastia Karadjordjevic, eternamente aliado a Petrogrado."
 SOV_reaffirm_franco_russian_alliance:0 "Reafirmar a Aliança Franco-Russa"
 SOV_reaffirm_franco_russian_alliance_desc:0 "O Presidente francês Raymond Poincaré viaja a Kronstadt a bordo do couraçado France. As duas potências reafirmam o compromisso inabalável de avançar sobre Berlim simultaneamente."
 SOV_anglo_russian_entente_in_persia:0 "Consolidar a Entente Anglo-Russa"
 SOV_anglo_russian_entente_in_persia_desc:0 "Solucionar disputas históricas sobre Pérsia, Afeganistão e Tibete com Londres, convertendo rivais do Grande Jogo em irmãos de armas contra o expansionismo alemão."
 SOV_french_strategic_loans:0 "Empréstimos Estratégicos Franceses"
 SOV_french_strategic_loans_desc:0 "Bancos parisienses emitem bilhões de francos-ouro em títulos ferroviários russos, vinculados à construção expressa de ramais estratégicos rumo à fronteira alemã."
 SOV_persian_corridor_security:0 "Garantir o Corredor Transcaspiano da Pérsia"
 SOV_persian_corridor_security_desc:0 "Despachar a Brigada Cossaca Persa para guarnecer Tabriz, Teerã e o litoral do Cáspio, garantindo uma artéria meridional inexpugnável com o Império Britânico."
 SOV_gold_transfers_for_credit:0 "Reservas em Ouro Imperial ao Banco da Inglaterra"
 SOV_gold_transfers_for_credit_desc:0 "Enviar lingotes de ouro em cruzadores da Marinha Real de Arkhangelsk a Londres para garantir linhas de crédito ilimitadas para compras de armas na América."
 SOV_plan_19_galicia_variant:0 "Plano 19: Variante 'A' (Foco Austríaco)"
 SOV_plan_19_galicia_variant_desc:0 "Concentrar quatro exércitos inteiros no Front Sudoeste para esmagar as forças austro-húngaras na Galícia enquanto adota postura defensiva contra a Alemanha."
 SOV_plan_19_east_prussia_variant:0 "Plano 19: Variante 'G' (Ofensiva na Prússia)"
 SOV_plan_19_east_prussia_variant_desc:0 "Lançar o 1º Exército de Rennenkampf e o 2º de Samsonov sobre a Prússia Oriental no 15º dia para atrair corpos alemães da França e salvar Paris."
 SOV_sarikamish_counter_encirclement:0 "O Milagre de Sarikamish (Inverno de 1914)"
 SOV_sarikamish_counter_encirclement_desc:0 "O General Nikolai Yudenich manobra contra o 3º Exército de Enver Paxá nos desfiladeiros gelados do Cáucaso, aniquilando 70.000 soldados turcos na neve."
 SOV_storming_of_erzurum:0 "O Assalto à Fortaleza de Erzurum"
 SOV_storming_of_erzurum_desc:0 "Em fevereiro de 1916, atiradores siberianos escalam penhascos congelados em nevascas para assaltar os 11 fortes de Erzurum, conquistando a Anatólia oriental."
 SOV_expeditionary_corps_to_france:0 "Corpo Expedicionário Russo na França"
 SOV_expeditionary_corps_to_france_desc:0 "Despachar duas brigadas especiais por Dalian e Marselha para lutar nas trincheiras de Champagne, selando com sangue a lealdade russa à França."
 SOV_claim_tsargrad_and_the_straits:0 "O Acordo de Constantinopla (Março de 1915)"
 SOV_claim_tsargrad_and_the_straits_desc:0 "A Grã-Bretanha e a França concedem formalmente o pleito histórico russo: na vitória, Constantinopla, o Bósforo e os Dardanelos serão anexados diretamente pelo Império Russo."
 SOV_liberate_galician_ruthenians:0 "Anexação da Galícia Oriental (Rutênia)"
 SOV_liberate_galician_ruthenians_desc:0 "Após a queda de Lviv e Przemysl, as históricas terras rutenas da antiga Rus de Kiev são reunificadas para sempre com a Pátria Russa."
 SOV_restore_congress_poland_under_crown:0 "O Manifesto do Grão-Duque aos Poloneses"
 SOV_restore_congress_poland_under_crown_desc:0 "O Grão-Duque Nicolau promete unificar todas as terras polonesas sob domínio alemão, austríaco e russo em um reino autônomo sob o cetro dos Romanov."
 SOV_cross_over_the_carpathians:0 "A Descida sobre a Planície Húngara"
 SOV_cross_over_the_carpathians_desc:0 "Corpos de montanha russos forçam os desfiladeiros de Dukla e Lupków, irrompendo na planície húngara e tirando a Monarquia dos Habsburgo da guerra."
 SOV_storm_the_bosphorus_and_dardanelles:0 "O Assalto a Tsargrado"
 SOV_storm_the_bosphorus_and_dardanelles_desc:0 "Fuzileiros navais e couraçados russos forçam o Bósforo. Bandeiras imperiais tremulam sobre a Sublime Porta, realizando cinco séculos de anseio geopolítico e religioso."
 SOV_hagia_sophia_cross_restored:0 "A Cruz Dourada sobre Santa Sofia"
 SOV_hagia_sophia_cross_restored_desc:0 "Os sinos de Santa Sofia repicam em comunhão ortodoxa. O Czar de todas as Rússias é aclamado Imperador de Bizâncio na cidade eterna de Constantino."
 SOV_willy_nicky_secret_correspondence:0 "A Correspondência Secreta Willy-Nicky"
 SOV_willy_nicky_secret_correspondence_desc:0 "O Kaiser Guilherme II e o Czar Nicolau II trocam telegramas pessoais em inglês, apelando aos seus laços dinásticos para evitar o suicídio dos impérios."
 SOV_bjorko_treaty_reborn:0 "O Tratado de Björkö Renascido"
 SOV_bjorko_treaty_reborn_desc:0 "Revivendo a aliança secreta firmada a bordo do iate imperial em 1905, Alemanha e Rússia assinam um pacto de defesa mútua, estarrecendo Paris e Londres."
 SOV_peace_of_brest_litovsk:0 "O Ditame de Brest-Litovsk (1918)"
 SOV_peace_of_brest_litovsk_desc:0 "Enfrentando exaustão militar absoluta e revolução interna, a Rússia firma a draconiana paz com os Poderes Centrais, cedendo as fronteiras ocidentais."
 SOV_continental_league_against_britain:0 "O Bloco Continental Contra a Grã-Bretanha"
 SOV_continental_league_against_britain_desc:0 "Guilherme e Nicolau unem as duas maiores potências terrestres do mundo para quebrar a hegemonia marítima do Império Britânico na Ásia e Oriente Médio."
 SOV_partition_persia_and_india:0 "A Grande Marcha até o Rio Indo"
 SOV_partition_persia_and_india_desc:0 "Com blindados alemães e cossacos russos, uma ofensiva terrestre avança pelo Afeganistão rumo ao Passo de Khyber para abalar o domínio britânico na Índia."
 SOV_treaty_of_berlin_rapprochement:0 "A União Aduaneira Berlim-Petrogrado"
 SOV_treaty_of_berlin_rapprochement_desc:0 "Combinar maquinários alemães e patentes químicas com grãos, manganês e petróleo russos, forjando uma fortaleza econômica eurasiana auto-suficiente."
 SOV_eurasian_imperial_hegemony:0 "Hegemonia Imperial Eurasiana"
 SOV_eurasian_imperial_hegemony_desc:0 "Do Reno a Vladivostok, os dois Impérios reinam supremos, ditando a paz ao mundo ocidental e perpetuando a ordem monárquica para sempre."
 SOV_brest_demobilization_and_losses:0 "A Paz Vergonhosa"
 SOV_brest_demobilization_and_losses_desc:0 "Entregando 34% da população, 54% das indústrias e 89% dos campos de carvão à ocupação alemã, a Rússia adquire uma trégua a um custo pavoroso."
 SOV_reconstruction_from_the_ashes:0 "Reconstrução no Coração Russo"
 SOV_reconstruction_from_the_ashes_desc:0 "Concentrar todas as energias na recuperação de Moscou, do Volga e dos Urais. Estradas são reconstruídas, fornos reacendidos e a população alimentada."
 SOV_prepare_for_inevitable_reckoning:0 "Preparar para o Ajuste de Contas"
 SOV_prepare_for_inevitable_reckoning_desc:0 "Brest-Litovsk não passa de um pedaço temporário de papel. Seja sob a bandeira Vermelha ou a águia imperial, a Rússia ressurgirá para retomar o que lhe pertence."
 SOV_moscow_state_conference:0 "A Conferência de Estado de Moscou (Agosto de 1917)"
 SOV_moscow_state_conference_desc:0 "Kerensky reúne mais de 2.000 delegados no Teatro Bolshoi para forjar a união nacional, mas a conferência apenas expõe a fratura inconciliável entre os generais de Kornilov e os socialistas."
 SOV_czech_legion_transsiberian_revolt:0 "A Insurreição da Legião Tchecoslovaca"
 SOV_czech_legion_transsiberian_revolt_desc:0 "50.000 veteranos tchecoslovacos amotinam-se em Chelyabinsk, capturando todas as estações da Ferrovia Transiberiana dos Urais a Vladivostok."
 SOV_tambov_peasant_rebellion:0 "A Revolta Camponesa Verde de Tambov"
 SOV_tambov_peasant_rebellion_desc:0 "Alexander Antonov lidera 50.000 camponeses em armas contra as requisições de grãos, empunhando a bandeira verde da emancipação camponesa."
 SOV_armed_forces_of_south_russia:0 "Forças Armadas do Sul da Rússia (VSYUR)"
 SOV_armed_forces_of_south_russia_desc:0 "O General Anton Denikin unifica o Exército Voluntário e os Cossacos do Don e Kuban nas Forças Armadas do Sul da Rússia, iniciando o avanço sobre Moscou."
 SOV_omsk_siberian_government:0 "O Diretório de Omsk e o Governante Supremo"
 SOV_omsk_siberian_government_desc:0 "O Almirante Alexander Kolchak instala a sede de seu governo em Omsk, aclamado 'Governante Supremo do Estado Russo' de posse das reservas de ouro imperiais."
 SOV_ruble_gold_standard_preservation:0 "Preservar o Rublo-Ouro de Witte"
 SOV_ruble_gold_standard_preservation_desc:0 "A reforma monetária de Sergei Witte lastreou o rublo em ouro. Manter a conversibilidade atrai capitais e investimentos estrangeiros."
 SOV_baku_batumi_pipeline_expansion:0 "Duplicar o Oleoduto Baku-Batumi"
 SOV_baku_batumi_pipeline_expansion_desc:0 "Construir um segundo duto de alta pressão pelo desfiladeiro de Surami até Batumi, escoando milhares de barris diários aos petroleiros do Mar Negro."
 SOV_ural_platinum_reserves:0 "Monopólio de Platina e Manganês dos Urais"
 SOV_ural_platinum_reserves_desc:0 "A Rússia produz 90% da platina mundial em Nizhny Tagil e vasto manganês em Chiatura, minerais indispensáveis ao endurecimento de blindagens."
 SOV_sevkabel_factory_complex:0 "Manufatura de Cabos de Cobre Sevkabel"
 SOV_sevkabel_factory_complex_desc:0 "A usina Sevkabel de São Petersburgo produz milhões de metros de fios telegráficos isolados e cabos elétricos para a frota imperial."
 SOV_siberian_fur_trade_treasury:0 "Monopólio Estatal de Zibelinas Siberianas"
 SOV_siberian_fur_trade_treasury_desc:0 "Peles de zibelina e arminho siberiano leiloadas na feira de Nizhny Novgorod canalizam milhões em moedas fortes ao tesouro imperial."
 SOV_moonsund_mine_barrage:0 "A Armadilha de Minas do Estreito de Irben"
 SOV_moonsund_mine_barrage_desc:0 "Semear as águas rasas do Estreito de Irben com minas de contato, avariando couraçados alemães que tentem forçar o Golfo de Riga."
 SOV_rioni_river_torpedo_station:0 "Estação de Torpedeiros Fluviais do Rio Rioni"
 SOV_rioni_river_torpedo_station_desc:0 "Posicionar lanchas torpedeiras rápidas Thornycroft em Poti e Batumi para emboscar comboios costeiros otomanos em Sinop e Trabzon."
 SOV_synchronized_aerial_machine_guns:0 "Mecanismo Sincronizador de Tiro nas Hélices"
 SOV_synchronized_aerial_machine_guns_desc:0 "Engenheiros russos adaptam mecanismos sincronizadores mecânicos, permitindo disparar através das pás da hélice sem atingir a madeira."
 SOV_osowiec_and_novogeorgievsk_forts:0 "Cadeias Fortificadas de Osowiec e Novogeorgievsk"
 SOV_osowiec_and_novogeorgievsk_forts_desc:0 "Bastiões de concreto armado e cúpulas de artilharia ao longo dos pântanos dos rios Narew e Bobr retêm exércitos alemães por meses."
 SOV_attack_of_the_dead_men_1915:0 "O Ataque dos Homens Mortos (Agosto de 1915)"
 SOV_attack_of_the_dead_men_1915_desc:0 "Submetidos a gases de cloro e bromo em Osowiec, os soldados da 13ª Companhia atacam de bandagens ensanguentadas tossindo pedaços dos próprios pulmões, pondo 7.000 alemães apavorados em fuga."
 SOV_russian_chemical_flamethrowers:0 "Lança-Chamas Portáteis Tovarnitski"
 SOV_russian_chemical_flamethrowers_desc:0 "Equipar companhias de assalto com lança-chamas portáteis de gás comprimido projetados pelo engenheiro Tovarnitski, varrendo ninhos de metralhadoras com fogo líquido."
 SOV_optical_rangefinders_and_periscopes:0 "Periscópios de Trincheira e Telêmetros Ópticos"
 SOV_optical_rangefinders_and_periscopes_desc:0 "Fabricar periscópios de trincheira e telêmetros nas oficinas de Obukhov, permitindo aos observadores direcionar tiro indireto sem expor a cabeça às miras inimigas."
 SOV_motono_sazonov_treaty_1916:0 "O Tratado Russo-Japonês de 1916"
 SOV_motono_sazonov_treaty_1916_desc:0 "Antigos rivais unem-se em aliança defensiva: Sazonov e o Visconde Motono selam um pacto, pacificando o flanco asiático e enviando obuses pesados japoneses à Rússia."
 SOV_murmansk_convoys_arrival:0 "Chegada dos Comboios Árticos dos Aliados"
 SOV_murmansk_convoys_arrival_desc:0 "Comboios mercantes britânicos e americanos carregados de granadas Armstrong e borracha atracam em segurança nas águas profundas de Romanov-on-Murman."
 SOV_red_cross_missions_to_serbia:0 "Trem Sanitário da Cruz Vermelha à Sérvia"
 SOV_red_cross_missions_to_serbia_desc:0 "Enviar médicos, enfermeiras e trens-hospital russos a Kragujevac para erradicar surtos de tifo e tratar soldados sérvios feridos em afeto fraternal."