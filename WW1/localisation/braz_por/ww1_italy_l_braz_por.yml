l_braz_por:
 ITA_ww1_ace_squadrons:0 "As esquadrilhas de elite"
 ITA_ww1_ace_squadrons_desc:0 "A 91ª Esquadrilha de Ases de Francesco Baracca alcança renome lendário. Exibindo o Cavalo Rampante na fuselagem, Baracca e os principais ases italianos dominam as batalhas aéreas nos Alpes."
 ITA_ww1_acute_agrarian_crisis:0 "Crise Agrária Aguda"
 ITA_ww1_acute_agrarian_crisis_desc:0 "Carestia no campo e êxodo populacional desestruturam a economia rural."
 ITA_ww1_adriatic_convoys:0 "Comboios no Adriático"
 ITA_ww1_adriatic_convoys_desc:0 "Protege comboios de transporte para as guarnições na Albânia e no Mar Egeu. Transporta mais de duzentos mil soldados italianos e sérvios pelo mar sem a perda de um único navio de transporte de tropas."
 ITA_ww1_adriatic_dispute:0 "Disputa no Adriático"
 ITA_ww1_adriatic_naval_patrols:0 "Patrulhas navais no Adriático"
 ITA_ww1_adriatic_naval_patrols_desc:0 "Demonstração de força naval entre Brindisi e Veneza."
 ITA_ww1_adriatic_naval_stations:0 "Estuturas Navais do Adriático"
 ITA_ww1_adriatic_naval_stations_desc:0 "Bases avançadas de contratorpedeiros em Veneza e Brindisi dominando a costa oriental."
 ITA_ww1_adriatic_patrol_network:0 "Rede de Patrulha do Adriático"
 ITA_ww1_adriatic_patrol_network_desc:0 "Vigilância costeira contínua prevenindo bombardeios surpresa das esquadras de Pola."
 ITA_ww1_adriatic_watch:0 "A vigilância do Adriático"
 ITA_ww1_adriatic_watch_desc:0 "Estabelece patrulhas permanentes e barreiras de minas ao longo do litoral oriental. Protege as cidades costeiras indefesas contra bombardeios navais austro-húngaros lançados a partir de Pola e Cattaro."
 ITA_ww1_aero_engine_contracts:0 "Contratos de motores aeronáuticos"
 ITA_ww1_aero_engine_contracts_desc:0 "Contratos estatais com FIAT e Isotta Fraschini produzem motores aeronáuticos de alta potência."
 ITA_ww1_aeronautical_corps:0 "O Corpo Aeronáutico Militar"
 ITA_ww1_aeronautical_corps_desc:0 "Funda o corpo aeronáutico de guerra autônomo em substituição às escolas. Estrutura esquadrilhas autônomas de caça, observação de artilharia e bombardeio pesado respondendo ao Alto Comando."
 ITA_ww1_air_autonomy_debate:0 "O debate sobre a autonomia aérea"
 ITA_ww1_air_autonomy_debate_desc:0 "Estabelece as bases do Ministério da Aeronáutica, em transição do corpo aéreo de guerra. Cria dotações orçamentárias próprias, centros de teste aeronáutico e uma carreira militar independente para a aviação."
 ITA_ww1_albanian_convoy_routes:0 "Linhas de Comboio da Albânia"
 ITA_ww1_albanian_convoy_routes_desc:0 "Coordenação impecável de comboios garantindo suprimentos às forças de além-mar."
 ITA_ww1_albanian_influence_rivalry:0 "Rivalidade sobre a Albânia"
 ITA_ww1_albanian_protectorate:0 "O protetorado da Albânia"
 ITA_ww1_albanian_protectorate_desc:0 "O General Ferrero proclama em Gjirokastër a independência da Albânia sob protetorado da Itália."
 ITA_ww1_albanian_question:0 "A questão albanesa"
 ITA_ww1_albanian_question_desc:0 "Garantia de que nenhuma potência estrangeira controle o Canal de Otranto e Vlora."
 ITA_ww1_alpine_hydroelectric_dam:0 "Construir barragem hidrelétrica alpina"
 ITA_ww1_alpine_hydroelectric_dam_desc:0 "Geração de energia elétrica para a indústria lombarda."
 ITA_ww1_alpini_expansion:0 "Ampliar os Alpini"
 ITA_ww1_alpini_expansion_desc:0 "Expande os históricos regimentos de Alpini. Recrutamento de camponeses dos vales alpinos em batalhões de esquiadores treinados para o combate nas geleiras e rochas."
 ITA_ww1_andrea_doria_class:0 "A classe Andrea Doria"
 ITA_ww1_andrea_doria_class_desc:0 "Constrói os superencouraçados Andrea Doria e Caio Duilio. Aprimora a blindagem de convés e as baterias secundárias contra os projéteis pesados da marinha austro-húngara."
 ITA_ww1_ansaldo_expansion:0 "Ampliar a Ansaldo"
 ITA_ww1_ansaldo_expansion_desc:0 "Expansão vertical massiva do conglomerado siderúrgico, naval e bélico dos irmãos Perrone."
 ITA_ww1_anti_submarine_patrols:0 "Patrulhas antissubmarino"
 ITA_ww1_anti_submarine_patrols_desc:0 "Emprega cargas de profundidade, hidroaviões e hidrofones de reboque. Combina patrulha aérea marítima e caça-submarinos velozes para neutralizar os submarinos inimigos no Adriático."
 ITA_ww1_apulian_aqueduct:0 "O aqueduto da Apúlia"
 ITA_ww1_apulian_aqueduct_desc:0 "Construção do monumental Acquedotto Pugliese trazendo água potável às planícies secas da Apúlia."
 ITA_ww1_apulian_aqueduct_expansion:0 "Ampliar o aqueduto da Apúlia"
 ITA_ww1_apulian_aqueduct_expansion_desc:0 "Canalização de água potável para cidades meridionais."
 ITA_ww1_arditi_assault_schools:0 "Escolas de assalto dos Arditi"
 ITA_ww1_arditi_assault_schools_desc:0 "Formação intensiva em combate corpo a corpo e infiltração."
 ITA_ww1_arditi_shock_raids:0 "Incursões de Choque dos Arditi"
 ITA_ww1_arditi_shock_raids_desc:0 "Enviar pelotões dos Arditi armados com punhais e granadas para assaltar postos avançados além do Piave."
 ITA_ww1_arditi_shock_troops:0 "Unidades de Choque dos Arditi"
 ITA_ww1_arditi_shock_troops_desc:0 "Combatentes destemidos treinados no combate corpo a corpo, lança-chamas e assalto rápido."
 ITA_ww1_armed_mediator:0 "Mediar a paz"
 ITA_ww1_armed_mediator_desc:0 "Utilização da neutralidade armada italiana para mediar a paz entre os blocos beligerantes."
 ITA_ww1_armed_neutrality_doctrine:0 "Independência armada"
 ITA_ww1_armed_neutrality_doctrine_desc:0 "Formulação da doutrina do 'Sacro Egoismo', priorizando estritamente o interesse nacional."
 ITA_ww1_army_budget_cuts:0 "Cortes no orçamento do exército"
 ITA_ww1_army_budget_cuts_desc:0 "Substitui a manutenção do exército pelo Realismo Fiscal em Tempo de Paz. Diminui o tempo de serviço militar obrigatório e preserva material em depósito para sanear o orçamento nacional."
 ITA_ww1_army_demobilisation:0 "Desmobilização do exército"
 ITA_ww1_army_demobilisation_desc:0 "Remove as doutrinas de combate de trincheira da guerra, devolve soldados à vida civil. Reintegra os soldados às lavouras e oficinas fabris de forma escalonada para evitar o desemprego em massa."
 ITA_ww1_army_staff_reorganisation:0 "Reorganizar o Estado-Maior"
 ITA_ww1_army_staff_reorganisation_desc:0 "Reorganiza o Estado-Maior sob o General Pollio. Moderniza as seções operacionais, o corpo de oficiais e o planejamento de transporte ferroviário militar."
 ITA_ww1_artillery_modernisation:0 "Modernização da artilharia"
 ITA_ww1_artillery_modernisation_desc:0 "Constrói 1 fábrica militar em Terni (Toscana). Substitui peças obsoletas por modernos canhões de campanha com freio de recuo hidráulico para apoiar a infantaria."
 ITA_ww1_assault_units:0 "Unidades de assalto"
 ITA_ww1_assault_units_desc:0 "Constrói 1 fábrica militar na Lombardia. Armados com punhais, granadas Thevenot e pistolas-metralhadoras Villar Perosa, os Arditi rompem as defesas inimigas com audácia."
 ITA_ww1_aviators_battalion:0 "O Batalhão de Aviadores"
 ITA_ww1_aviators_battalion_desc:0 "Cria o Battaglione Aviatori junto à Engenharia Militar. Instalado no campo de Centocelle em Roma, o primeiro núcleo de aviação militar treina pilotos e avalia monoplanos de observação."
 ITA_ww1_badoglio_standing_army:0 "Exército Profissional do Pós-Guerra"
 ITA_ww1_badoglio_standing_army_desc:0 "Um exército permanente enxuto preservando a rica doutrina tática da Grande Guerra."
 ITA_ww1_bainsizza:0 "O planalto de Bainsizza"
 ITA_ww1_bainsizza_desc:0 "Travessia heroica do Isonzo e conquista do vasto planalto austríaco de Bainsizza."
 ITA_ww1_balkan_league_crisis:0 "A crise da Liga Balcânica"
 ITA_ww1_balkan_league_crisis_desc:0 "Monitoramento do colapso da autoridade otomana na Macedônia e Trácia."
 ITA_ww1_bank_rescue_consortium:0 "Consórcio de salvamento bancário"
 ITA_ww1_bank_rescue_consortium_desc:0 "Um consórcio orquestrado pelo Estado estabiliza o setor bancário e protege contas industriais."
 ITA_ww1_baracca_ace_tradition:0 "A Tradição do Cavalo Rampante"
 ITA_ww1_baracca_ace_tradition_desc:0 "Espírito heroico dos pilotos de caça forjado por Francesco Baracca na Esquadrilha de Ases."
 ITA_ww1_battaglione_aviatori:0 "Battaglione Aviatori"
 ITA_ww1_battaglione_aviatori_desc:0 "Batalhão pioneiro de aviação testando os primeiros aparelhos de combate em Centocelle."
 ITA_ww1_battleship_fleet_in_being:0 "Frota em potencial"
 ITA_ww1_battleship_fleet_in_being_desc:0 "Preserva a frota principal de encouraçados intacta em Taranto. O Almirante Thaon di Revel evita expor os encouraçados a minas e submarinos, imobilizando o inimigo pela ameaça latente de poder de fogo."
 ITA_ww1_biennio_rosso:0 "O Biênio Vermelho"
 ITA_ww1_biennio_rosso_desc:0 "Dois anos turbulentos de greves de massas, ocupações camponesas de terras e protestos pelo pão varrem a Itália."
 ITA_ww1_biennio_rosso_strikes:0 "Agitação do Biênio Vermelho"
 ITA_ww1_biennio_rosso_strikes_desc:0 "Ocupações fabris e greves rurais desestabilizam o tecido social do país."
 ITA_ww1_boselli_national_unity:0 "O gabinete de união nacional de Boselli"
 ITA_ww1_boselli_national_unity_desc:0 "Paolo Boselli forma um ministério amplo de união nacional abrangendo intervencionistas de todos os matizes."
 ITA_ww1_bread_rationing:0 "Racionamento do pão"
 ITA_ww1_bread_rationing_desc:0 "Instituição de cartões de racionamento de pão e cereais para gerir estoques escassos de trigo."
 ITA_ww1_brindisi_venice_bases:0 "Brindisi e Veneza"
 ITA_ww1_brindisi_venice_bases_desc:0 "Constrói 1 estaleiro no Vêneto (Arsenal de Veneza). Posiciona flotilhas velozes e bases de submarinos em Brindisi para vigiar o estreito de Otranto e em Veneza para cobrir as lagoas."
 ITA_ww1_british_coal:0 "Garantir o carvão britânico"
 ITA_ww1_british_coal_desc:0 "Garantia de navios carvoeiros e linhas de crédito de Londres para manter os altos-fornos acesos."
 ITA_ww1_british_friendship:0 "Amizade britânica"
 ITA_ww1_british_friendship_desc:0 "Reafirmação da amizade histórica no Mediterrâneo entre Roma e o Almirantado em Londres."
 ITA_ww1_budget_balancing:0 "Equilibrar o orçamento"
 ITA_ww1_budget_balancing_desc:0 "A consolidação fiscal de De Stefani reduz o déficit público e restaura a confiança na lira."
 ITA_ww1_cadorna_chief_of_staff:0 "Cadorna assume o Estado-Maior"
 ITA_ww1_cadorna_chief_of_staff_desc:0 "O General Luigi Cadorna assume o comando; impõe férrea disciplina ofensiva. Luigi Cadorna centraliza as operações militares e estrutura planos de ataque frontais voltados à conquista de Liubliana e Viena."
 ITA_ww1_cadorna_discipline:0 "Disciplina Férrea de Cadorna"
 ITA_ww1_cadorna_discipline_desc:0 "Exigências ofensivas inflexíveis e rigor penal draconiano em todos os escalões."
 ITA_ww1_cadornian_offensive_cult:0 "O Culto da Ofensiva"
 ITA_ww1_cadornian_offensive_cult_desc:0 "Crença no assalto frontal obstinado da infantaria para romper as posições inimigas."
 ITA_ww1_capital_fleet_modernisation:0 "Modernização dos Navios Capitais"
 ITA_ww1_capital_fleet_modernisation_desc:0 "Atualizações contínuas de blindagem, canhões antiaéreos e propulsão na esquadra."
 ITA_ww1_capital_ship_modernisation:0 "Modernização dos couraçados"
 ITA_ww1_capital_ship_modernisation_desc:0 "Moderniza a esquadra de batalha para o pós-guerra, substituindo doutrinas de conflito. Moderniza os navios das classes Cavour e Doria para manter capacidade de combate no padrão das potências do pós-guerra."
 ITA_ww1_caporetto:0 "Caporetto"
 ITA_ww1_caporetto_desc:0 "Resistência ao rompimento catastrófico das divisões de assalto alemãs em Caporetto."
 ITA_ww1_caporetto_inquiry:0 "O inquérito de Caporetto"
 ITA_ww1_caporetto_inquiry_desc:0 "Um inquérito parlamentar investiga as falhas de comando e o colapso logístico na 12ª Batalha do Isonzo."
 ITA_ww1_caproni_bombers:0 "Os bombardeiros Caproni"
 ITA_ww1_caproni_bombers_desc:0 "Adota os bombardeiros pesados trimotores de Giovanni Caproni (Ca.1 e Ca.3); bônus de bombardeiros (25%). Pioneirismo na aviação estratégica multimotor, capaz de lançar meia tonelada de bombas nas bases de retaguarda austríacas."
 ITA_ww1_carabinieri_reinforcement:0 "Reforçar os Carabineiros"
 ITA_ww1_carabinieri_reinforcement_desc:0 "Expande a Arma dei Carabinieri para policiar a ordem pública. Fortalece as legiões móveis da gendarmaria real para resguardar a ordem pública durante as greves e confrontos políticos do pós-guerra."
 ITA_ww1_catholic_social_action:0 "Ação social católica"
 ITA_ww1_catholic_social_action_desc:0 "Cooperativas agrárias católicas e caixas rurais apoiam pequenos proprietários no campo."
 ITA_ww1_cavour_class:0 "Os couraçados classe Cavour"
 ITA_ww1_cavour_class_desc:0 "Inicia a construção dos encouraçados Conte di Cavour, Giulio Cesare e Leonardo da Vinci. Armados com treze canhões de 305mm em torres duplas e triplas centrais, formam a espinha dorsal da frota de batalha."
 ITA_ww1_central_adriatic_fleet:0 "A frota adriática combinada"
 ITA_ww1_central_adriatic_fleet_desc:0 "União das esquadras italiana e austro-húngara para disputar o Mediterrâneo contra os Aliados."
 ITA_ww1_central_concessions_accord:0 "Aceitar as concessões de Viena"
 ITA_ww1_central_concessions_accord_desc:0 "Aceitação do compromisso formal de Viena cedendo o Trentino após a paz geral."
 ITA_ww1_central_joint_command:0 "Comando conjunto com Viena"
 ITA_ww1_central_joint_command_desc:0 "Coordenação de estado-maior e inteligência militar com os comandos alemão e austríaco."
 ITA_ww1_central_powers_betrayal:0 "Traição da Tríplice Aliança"
 ITA_ww1_central_powers_entry:0 "Entrar na guerra ao lado de Berlim e Viena"
 ITA_ww1_central_powers_entry_desc:0 "Honrando a aliança e entrando na guerra ao lado dos Impérios Centrais contra a França."
 ITA_ww1_christmas_of_blood:0 "O Natal de Sangue"
 ITA_ww1_christmas_of_blood_desc:0 "A marinha italiana bombardeia o palácio de D'Annunzio em Fiume, impondo o Tratado de Rapallo."
 ITA_ww1_combatants_opera:0 "Obra Nacional dos Combatentes"
 ITA_ww1_combatants_opera_desc:0 "A Opera Nazionale Combattenti apoia os veteranos com reintegração profissional, crédito e lotes rurais."
 ITA_ww1_commission_caproni_heavy_bombers:0 "Encomendar bombardeiros pesados Caproni"
 ITA_ww1_commission_caproni_heavy_bombers_desc:0 "Acelerar a entrega de trimotores de bombardeio."
 ITA_ww1_complimentary_officer_academies:0 "Corpo de Oficiais de Complemento"
 ITA_ww1_complimentary_officer_academies_desc:0 "Jovens universitários patriotas assumindo o comando de pelotões de infantaria sob fogo."
 ITA_ww1_constitutional_reform:0 "Reforma constitucional"
 ITA_ww1_constitutional_reform_desc:0 "Reforço das prerrogativas parlamentares e modernização administrativa sob o Estatuto Albertino."
 ITA_ww1_contain_socialist_agitation:0 "Conter a agitação socialista"
 ITA_ww1_contain_socialist_agitation_desc:0 "Medidas policiais focadas em líderes grevistas radicais."
 ITA_ww1_continued_neutrality:0 "Manter a neutralidade"
 ITA_ww1_continued_neutrality_desc:0 "Compromisso definitivo de preservar a neutralidade italiana ao longo de toda a Grande Guerra."
 ITA_ww1_continuous_offensive_pressure:0 "Pressão Contínua nas Margens"
 ITA_ww1_continuous_offensive_pressure_desc:0 "Incursões constantes através do rio desgastando as reservas austro-húngaras."
 ITA_ww1_corfu_incident:0 "O incidente de Corfu"
 ITA_ww1_corfu_incident_desc:0 "Bombardeio e ocupação de Corfu após o assassinato do General Tellini na fronteira grega."
 ITA_ww1_corpo_aeronautico_militare:0 "Corpo Aeronautico Militare"
 ITA_ww1_corpo_aeronautico_militare_desc:0 "Corpo aéreo autônomo coordenando caças, reconhecimento e bombardeio de saturação."
 ITA_ww1_cyrenaica_pacification:0 "Pacificar a Cirenaica"
 ITA_ww1_cyrenaica_pacification_desc:0 "Acordos administrativos com chefes tribais e líderes da ordem Senussi na Cirenaica."
 ITA_ww1_dalmatian_claims:0 "As reivindicações dálmatas"
 ITA_ww1_dalmatian_claims_desc:0 "Manutenção das pretensões italianas sobre Zadar, Šibenik e ilhas dálmatas."
 ITA_ww1_declare_neutrality:0 "Declarar neutralidade"
 ITA_ww1_declare_neutrality_desc:0 "Declaração de que as cláusulas defensivas da aliança não se aplicam à guerra ofensiva austríaca."
 ITA_ww1_declare_war_on_austria:0 "Guerra à Áustria-Hungria"
 ITA_ww1_declare_war_on_austria_desc:0 "Entrega da declaração formal de guerra contra o Império Austro-Húngaro em 23 de maio de 1915."
 ITA_ww1_declare_war_on_germany:0 "Guerra à Alemanha"
 ITA_ww1_declare_war_on_germany_desc:0 "Extensão do estado de guerra ao Império Alemão, consolidando aliança plena com as Potências Ocidentais."
 ITA_ww1_defence_in_depth_piave:0 "Defesa em Profundidade no Piave"
 ITA_ww1_defence_in_depth_piave_desc:0 "Redutos defensivos em camadas e cortinas de artilharia afogando as ofensivas inimigas."
 ITA_ww1_denounce_triple_alliance:0 "Denunciar a Tríplice Aliança"
 ITA_ww1_denounce_triple_alliance_desc:0 "Denúncia formal do tratado de aliança de 1882 com a Alemanha e a Áustria-Hungria."
 ITA_ww1_diaz_humane_leadership:0 "Liderança Humanitária de Diaz"
 ITA_ww1_diaz_humane_leadership_desc:0 "Comandante atencioso priorizando o bem-estar da tropa, boa alimentação e economia de vidas."
 ITA_ww1_diaz_takes_command:0 "Diaz assume o comando"
 ITA_ww1_diaz_takes_command_desc:0 "Armando Diaz substitui Cadorna; remove o culto ofensivo, eleva o moral em +15 e concede o espírito Liderança Humanitária. Armando Diaz abole execuções sumárias, melhora a alimentação dos soldados, institui licenças regulares e prioriza poupar vidas."
 ITA_ww1_diplomatic_initiatives_category:0 "Iniciativas Diplomáticas"
 ITA_ww1_diplomatic_initiatives_category_desc:0 "Condução das relações exteriores e acordos de compensação."
 ITA_ww1_diplomatic_pressure_tripoli:0 "Pressionar pela cessão de Trípoli"
 ITA_ww1_diplomatic_pressure_tripoli_desc:0 "Envio de nota formal à Sublime Porta propondo acordo sobre a Líbia."
 ITA_ww1_discount_bank_crisis:0 "A crise do Banco de Desconto"
 ITA_ww1_discount_bank_crisis_desc:0 "A insolvência da Banca Italiana di Sconto ameaça a liquidez da Ansaldo e da indústria pesada."
 ITA_ww1_dismounted_cavalry:0 "Cavalaria desmontada"
 ITA_ww1_dismounted_cavalry_desc:0 "Desmonta regimentos clássicos de cavalaria para reforçar a infantaria de trincheira. Regimentos de tradição como Genova Cavalleria lutam a pé no Carso com carabinas e baionetas como infantaria pesada."
 ITA_ww1_dismounted_cavalry_regiments:0 "Regimentos de Cavalaria Desmontada"
 ITA_ww1_dismounted_cavalry_regiments_desc:0 "Cavalarianos de elite reforçando as trincheiras com pontaria precisa de carabina."
 ITA_ww1_divided_public_opinion:0 "Opinião Pública Dividida"
 ITA_ww1_divided_public_opinion_desc:0 "O país está dividido entre neutralistas moderados e comícios intervencionistas."
 ITA_ww1_dodecanese_occupation:0 "Ocupar o Dodecaneso"
 ITA_ww1_dodecanese_occupation_desc:0 "Operações navais ocupam Rodes e as ilhas do Dodecaneso no Mar Egeu como penhor estratégico."
 ITA_ww1_douhet_air_doctrine:0 "Doutrina Aérea Estratégica de Douhet"
 ITA_ww1_douhet_air_doctrine_desc:0 "Bombardeiros estratégicos independentes atingindo os centros industriais do adversário."
 ITA_ww1_dreadnought_fleet_in_being:0 "Frota de Batalha em Potência"
 ITA_ww1_dreadnought_fleet_in_being_desc:0 "Os encouraçados intactos em Taranto impondo cautela a todas as frotas do Mediterrâneo."
 ITA_ww1_economic_mobilisation_category:0 "Mobilização Econômica"
 ITA_ww1_economic_mobilisation_category_desc:0 "Desenvolvimento do Mezzogiorno e produção bélica."
 ITA_ww1_elastic_defence:0 "Defesa elástica"
 ITA_ww1_elastic_defence_desc:0 "Evolui a liderança para a Defesa em Profundidade no Piave. Substitui linhas rígidas por zonas de postos avançados e bolsas de fogo de artilharia pré-reguladas nas encostas do Montello."
 ITA_ww1_emergency_grain_rationing:0 "Racionamento Emergencial de Grãos"
 ITA_ww1_emergency_grain_rationing_desc:0 "Distribuir farinha subsidiada e tabelar o preço do pão para mitigar a agitação social em Turim e Milão."
 ITA_ww1_emergency_police_decrees:0 "Decretos policiais de emergência"
 ITA_ww1_emergency_police_decrees_desc:0 "Poderes extraordinários para garantir a ordem interna em tempo de guerra."
 ITA_ww1_emigrant_remittances:0 "Remessas dos emigrantes"
 ITA_ww1_emigrant_remittances_desc:0 "Aproveitamento de milhões de liras enviadas por emigrantes das Américas para suas famílias."
 ITA_ww1_entente_overtures:0 "Aproximação com a Entente"
 ITA_ww1_entente_overtures_desc:0 "Canais secretos em Londres sondam quais territórios a Entente está disposta a conceder."
 ITA_ww1_expand_ansaldo_artillery_works:0 "Ampliar oficinas bélicas da Ansaldo"
 ITA_ww1_expand_ansaldo_artillery_works_desc:0 "Investimento em linhas de montagem de canhões em Gênova."
 ITA_ww1_expand_taranto_naval_arsenal:0 "Ampliar o arsenal naval de Taranto"
 ITA_ww1_expand_taranto_naval_arsenal_desc:0 "Diques secos adicionais para reparos de couraçados."
 ITA_ww1_facta_coalition:0 "A coalizão Facta"
 ITA_ww1_facta_coalition_desc:0 "Luigi Facta preside uma coalizão liberal vacilante que luta para conter a violência dos esquadrões."
 ITA_ww1_factory_occupations:0 "A ocupação das fábricas"
 ITA_ww1_factory_occupations_desc:0 "Mais de 400 mil metalúrgicos ocupam fábricas no Norte com bandeiras vermelhas e conselhos operários."
 ITA_ww1_fasci_di_combattimento:0 "As ligas de combate"
 ITA_ww1_fasci_di_combattimento_desc:0 "Mussolini reúne veteranos, sindicalistas e Arditi na Piazza San Sepolcro em Milão para fundar os Fasci."
 ITA_ww1_fast_cruisers:0 "Cruzadores de reconhecimento"
 ITA_ww1_fast_cruisers_desc:0 "Constrói cruzadores ligeiros velozes Nino Bixio e Marsala; bônus de cruzadores (25%). Navios rápidos capazes de atingir 27 nós para localizar esquadras inimigas nas águas estreitas do Adriático."
 ITA_ww1_fiat_lorry_expansion:0 "Ampliar linhas de montagem da FIAT"
 ITA_ww1_fiat_lorry_expansion_desc:0 "Produção em série de caminhões militares em Turim."
 ITA_ww1_fighter_squadrons:0 "Esquadrilhas de caça"
 ITA_ww1_fighter_squadrons_desc:0 "Cria esquadrões de caça dedicados equipados com metralhadoras sincronizadas. Pilotos treinados no combate aéreo voam caças Nieuport e SPAD para limpar os céus da frente das aeronaves austríacas."
 ITA_ww1_first_aerial_bombing:0 "O primeiro bombardeio aéreo"
 ITA_ww1_first_aerial_bombing_desc:0 "O Tenente Giulio Gavotti realiza o primeiro bombardeio aéreo da história militar em Ain Zara."
 ITA_ww1_fiume_regency:0 "A Empresa de Fiume"
 ITA_ww1_fiume_regency_desc:0 "Gabriele D'Annunzio lidera legionários amotinados para ocupar Fiume em desafio aos Aliados."
 ITA_ww1_flotilla_warfare:0 "Guerra de flotilhas"
 ITA_ww1_flotilla_warfare_desc:0 "Concentra recursos em flotilhas ligeiras, submarinos e ataques furtivos de torpedos. Substitui grandes batalhas navais por uma guerra agressiva de emboscadas nos canais e arquipélagos dálmatas."
 ITA_ww1_flying_boats:0 "Hidroaviões"
 ITA_ww1_flying_boats_desc:0 "Constrói os hidroaviões de caça Macchi M.5 e M.7 para defender o Adriático. Hidroaviões manobráveis operando de lagoas costeiras combatem aeronaves austríacas e vigiam o tráfego naval."
 ITA_ww1_fortify_carso_plateau:0 "Fortificar o planalto do Carso"
 ITA_ww1_fortify_carso_plateau_desc:0 "Escarpações rochosas e cavernas defensivas em Friul."
 ITA_ww1_franco_italian_agreement:0 "Entendimento franco-italiano"
 ITA_ww1_franco_italian_agreement_desc:0 "Garantias mútuas em Paris reconhecem esferas de influência na Tripolitânia e em Marrocos."
 ITA_ww1_free_trade_opening:0 "Abrir os mercados"
 ITA_ww1_free_trade_opening_desc:0 "A redução das tarifas agrícolas estimula a exportação de cítricos e azeite do Mezzogiorno."
 ITA_ww1_french_alpine_front:0 "A frente alpina contra a França"
 ITA_ww1_french_alpine_front_desc:0 "Coordenação de colunas de ataque para romper as fortificações francesas nos Alpes Marítimos."
 ITA_ww1_frontier_fortifications:0 "Fortificações de fronteira"
 ITA_ww1_frontier_fortifications_desc:0 "Constrói 2 fortes terrestres no Vêneto (Asiago) e 1 no Piemonte. Equipa fortalezas blindadas (Forte Verena e Campomolon) com cúpulas giratórias de aço para fechar os desfiladeiros alpinos."
 ITA_ww1_frontier_fortress_belt:0 "Fortalezas Blindadas Alpinas"
 ITA_ww1_frontier_fortress_belt_desc:0 "Cúpulas de aço e casamatas de concreto fechando os passos alpinos contra invasores."
 ITA_ww1_gas_defence:0 "Defesa contra gases"
 ITA_ww1_gas_defence_desc:0 "Distribui máscaras de caixa e respiradores polivalentes a todas as divisões do front. Após o mortal ataque de gás austríaco no Monte San Michele, o exército equipa a infantaria com máscaras protetoras eficazes."
 ITA_ww1_gas_respirators:0 "Proteção contra Gases de Trincheira"
 ITA_ww1_gas_respirators_desc:0 "Máscaras eficientes e equipes de descontaminação resguardando as divisões do front."
 ITA_ww1_general_staff_corps:0 "Planejamento do Estado-Maior"
 ITA_ww1_general_staff_corps_desc:0 "Seções de planejamento operacional estruturadas coordenando mobilização e logística."
 ITA_ww1_genoa_shipyards:0 "Os estaleiros de Gênova"
 ITA_ww1_genoa_shipyards_desc:0 "Modernização de estaleiros navais e oficinas de motores marítimos no Golfo de Gênova."
 ITA_ww1_gentiloni_compact:0 "Pacto Gentiloni"
 ITA_ww1_gentiloni_compact_desc:0 "Acordo eleitoral com os católicos fortalece a estabilidade contra correntes radicais."
 ITA_ww1_gentiloni_pact:0 "O Pacto Gentiloni"
 ITA_ww1_gentiloni_pact_desc:0 "O acordo entre a União Eleitoral Católica e candidatos liberais assegura votos religiosos contra o avanço socialista."
 ITA_ww1_gentiloni_reconciliation:0 "Reconciliação Católica"
 ITA_ww1_giolitti_ministry:0 "O ministério Giolitti"
 ITA_ww1_giolitti_ministry_desc:0 "O domínio parlamentar de Giovanni Giolitti governa por coalizões fluidas e reformas pragmáticas."
 ITA_ww1_giolitti_parecchio:0 "O \"parecchio\" de Giolitti"
 ITA_ww1_giolitti_parecchio_desc:0 "Giolitti insiste que a Itália pode obter 'parecchio' (muita coisa) negociando com a Áustria sem derramamento de sangue."
 ITA_ww1_gorizia:0 "A tomada de Gorízia"
 ITA_ww1_gorizia_desc:0 "Tomada da cidade de Gorízia e assalto às alturas fortificadas de Monte Sabotino e Podgora."
 ITA_ww1_grain_requisition:0 "Requisição de grãos"
 ITA_ww1_grain_requisition_desc:0 "Cotas agrícolas obrigatórias e requisições estatais abastecem diretamente os depósitos do exército."
 ITA_ww1_grant_universal_suffrage_amnesty:0 "Conceder anistia eleitoral"
 ITA_ww1_grant_universal_suffrage_amnesty_desc:0 "Alivia a tensão civil perdoando infrações eleitorais menores."
 ITA_ww1_guerra_bianca_alpine_sapping:0 "Sapa e Minagem na Guerra Branca"
 ITA_ww1_guerra_bianca_alpine_sapping_desc:0 "Perfurar galerias nas geleiras das Dolomitas e explodir posições austríacas com dinamite."
 ITA_ww1_heavy_guns:0 "Canhões pesados"
 ITA_ww1_heavy_guns_desc:0 "Constrói 1 fábrica militar em Gênova (Ansaldo). Reconhecendo que fortalezas de montanha e casamatas exigem calibres pesados, o exército encomenda baterias pesadas de cerco."
 ITA_ww1_honour_alliance:0 "Honrar a aliança"
 ITA_ww1_honour_alliance_desc:0 "Mobilização imediata ao lado da Alemanha e Áustria-Hungria contra os países da Entente."
 ITA_ww1_human_torpedoes:0 "Os torpedos tripulados"
 ITA_ww1_human_torpedoes_desc:0 "Os mergulhadores Paolucci e Rossetti afundam o navio-almirante austríaco Viribus Unitis em Pola. Com o torpedo tripulado Mignatta, mergulhadores de combate penetram na base de Pola e afundam o grande encouraçado inimigo."
 ITA_ww1_hydroelectric_power:0 "Hidrelétricas alpinas"
 ITA_ww1_hydroelectric_power_desc:0 "Aproveitamento dos cursos d'água alpinos para geração de eletricidade ('carvão branco')."
 ITA_ww1_ilva_steel_consortium:0 "O consórcio do aço"
 ITA_ww1_ilva_steel_consortium_desc:0 "Consolidação dos altos-fornos siderúrgicos em Bagnoli, Piombino e Portoferraio com apoio estatal."
 ITA_ww1_independent_air_force_charter:0 "Bases da Regia Aeronautica"
 ITA_ww1_independent_air_force_charter_desc:0 "Estatuto legal criando a terceira força armada independente para o domínio dos céus."
 ITA_ww1_industrial_demobilisation:0 "Desmobilização industrial"
 ITA_ww1_industrial_demobilisation_desc:0 "Reconversão de fábricas bélicas para bens civis desencadeia dolorosa reestruturação industrial."
 ITA_ww1_industrial_mobilisation_committee:0 "Comitê de Mobilização Industrial"
 ITA_ww1_industrial_mobilisation_committee_desc:0 "O General Dallolio cria comitês regionais subordinando fábricas civis às encomendas de guerra."
 ITA_ww1_industrial_triangle:0 "O Triângulo Industrial"
 ITA_ww1_industrial_triangle_desc:0 "Consolidação do núcleo fabril ligando Turim, Milão e Gênova."
 ITA_ww1_inflation_management:0 "Conter a inflação"
 ITA_ww1_inflation_management_desc:0 "A estabilização monetária do banco central refreia a inflação desenfreada após o fim do conflito."
 ITA_ww1_inland_oases_campaign:0 "A campanha dos oásis"
 ITA_ww1_inland_oases_campaign_desc:0 "Ocupação de encruzilhadas de caravanas, poços fortificados e oásis do interior líbio."
 ITA_ww1_insidious_flotilla_doctrine:0 "Guerra Insidiosa de Flotilhas"
 ITA_ww1_insidious_flotilla_doctrine_desc:0 "Ataques noturnos agressivos e emboscadas de torpedeiros nos canais das ilhas."
 ITA_ww1_insurance_institute:0 "Instituto Nacional de Seguros"
 ITA_ww1_insurance_institute_desc:0 "Criação do Istituto Nazionale delle Assicurazioni para instituir o monopólio estatal e financiar a previdência."
 ITA_ww1_integrated_mezzogiorno:0 "Mezzogiorno Integrado"
 ITA_ww1_integrated_mezzogiorno_desc:0 "Investimentos e obras públicas reduzem o fosso histórico entre Norte e Sul."
 ITA_ww1_internal_politics_category:0 "Política Interna e Sociedade"
 ITA_ww1_internal_politics_category_desc:0 "Gestão de reformas sociais e tensões civis."
 ITA_ww1_interventionist_press:0 "A imprensa intervencionista"
 ITA_ww1_interventionist_press_desc:0 "Grandes jornais como o Corriere della Sera mobilizam círculos burgueses e intelectuais pela intervenção."
 ITA_ww1_irredentist_fervor:0 "Fervor Irredentista"
 ITA_ww1_irredentist_fervor_desc:0 "Exigências intransigentes por todas as terras históricas dominam o debate nacional."
 ITA_ww1_isonzo_offensives:0 "As ofensivas do Isonzo"
 ITA_ww1_isonzo_offensives_desc:0 "Lançamento de ofensivas em massa contra as posições austro-húngaras no rio Isonzo."
 ITA_ww1_isotta_engines:0 "Motores Isotta Fraschini"
 ITA_ww1_isotta_engines_desc:0 "Produz em larga escala motores de aviação Isotta Fraschini e FIAT A.12 de 250 hp; bônus de aviação (25%). Fornece às fábricas nacionais propulsores refrigerados a água confiáveis e de grande rendimento em altitude."
 ITA_ww1_labour_friction:0 "Atrito Trabalhista"
 ITA_ww1_labour_friction_desc:0 "Tensões salariais e greves esporádicas afetam o ritmo fabril."
 ITA_ww1_land_for_soldiers:0 "Terra para os soldados-camponeses"
 ITA_ww1_land_for_soldiers_desc:0 "Promessas públicas de reforma agrária e redistribuição de terras tranquilizam a infantaria camponesa."
 ITA_ww1_land_reclamation:0 "Recuperação de terras"
 ITA_ww1_land_reclamation_desc:0 "Drenagem e obras hidráulicas de 'bonifica' nos pântanos costeiros do Lácio e da Toscana."
 ITA_ww1_latin_sisterhood:0 "Fraternidade Latina"
 ITA_ww1_legalitarian_strike:0 "A greve legalitária"
 ITA_ww1_legalitarian_strike_desc:0 "A Aliança do Trabalho antifascista convoca greve geral nacional em defesa das liberdades constitucionais."
 ITA_ww1_liberal_restoration:0 "Restauração liberal"
 ITA_ww1_liberal_restoration_desc:0 "Esforço concentrado dos liberais constitucionais para preservar a ordem e reprimir a violência extremista."
 ITA_ww1_libya_colonisation:0 "Colonizar a Quarta Margem"
 ITA_ww1_libya_colonisation_desc:0 "Direcionamento da colonização agrária para as faixas litorâneas líbias da Quarta Margem."
 ITA_ww1_libya_lessons:0 "Lições da Guerra da Líbia"
 ITA_ww1_libya_lessons_desc:0 "Incorpora as lições táticas da África do Norte. Analisa a logística, a marcha no deserto e o uso pioneiro de telegrafia sem fio e aviação nas operações líbias."
 ITA_ww1_libyan_question:0 "A Questão Líbia"
 ITA_ww1_libyan_question_desc:0 "Exame das reivindicações italianas sobre a Tripolitânia e a Cirenaica sob acordos internacionais."
 ITA_ww1_libyan_reconquest:0 "A reconquista da Líbia"
 ITA_ww1_libyan_reconquest_desc:0 "Reafirmação do domínio militar sobre o interior desértico consolidando a Quarta Margem."
 ITA_ww1_london_conference:0 "A Conferência de Londres"
 ITA_ww1_london_conference_desc:0 "Embaixadores reúnem-se em Londres para delimitar a Albânia e neutralizar a entrada do Adriático."
 ITA_ww1_machine_guns:0 "Companhias de metralhadoras"
 ITA_ww1_machine_guns_desc:0 "Constrói 1 fábrica militar na Lombardia (Brescia). Cria companhias autônomas de metralhadoras em cada regimento de infantaria para cobrir arames farpados com fogo contínuo."
 ITA_ww1_march_on_rome:0 "A Marcha sobre Roma"
 ITA_ww1_march_on_rome_desc:0 "Quatro quadrunviros coordenam colunas armadas sobre a capital, assumindo o poder."
 ITA_ww1_mas_boats:0 "Os barcos MAS"
 ITA_ww1_mas_boats_desc:0 "Constrói as lanchas torpedeiras a motor MAS; bônus de doutrina naval (25%). Embarcações velozes de madeira armadas com torpedos penetram furtivamente nas bases austríacas, imortalizadas pelo lema 'Memento Audere Semper'."
 ITA_ww1_mas_motor_torpedo_boats:0 "Flotilhas de Lanchas Rápidas MAS"
 ITA_ww1_mas_motor_torpedo_boats_desc:0 "Lanchas torpedeiras velozes de madeira penetrando portos e afundando encouraçados."
 ITA_ww1_mas_stealth_patrols:0 "Patrulhas de lanchas MAS"
 ITA_ww1_mas_stealth_patrols_desc:0 "Incursões rápidas com torpedos ao longo da costa adriática."
 ITA_ww1_mediterranean_balance:0 "O equilíbrio no Mediterrâneo"
 ITA_ww1_mediterranean_balance_desc:0 "Equilíbrio entre obrigações continentais e amizade marítima com Londres e Paris."
 ITA_ww1_mediterranean_naval_cooperation:0 "Cooperação Naval Mediterrânea"
 ITA_ww1_merchant_marine_subsidies:0 "Subsídios à marinha mercante"
 ITA_ww1_merchant_marine_subsidies_desc:0 "Subsídios estatais de navegação modernizam as linhas a vapor da marinha mercante italiana."
 ITA_ww1_methodical_firepower_doctrine:0 "Doutrina Metódica de Fogo"
 ITA_ww1_methodical_firepower_doctrine_desc:0 "Bombardeio metódico de artilharia e avanço calculado de infantaria poupando baixas."
 ITA_ww1_mezzogiorno_grain_subsidies:0 "Subsídios ao trigo do Mezzogiorno"
 ITA_ww1_mezzogiorno_grain_subsidies_desc:0 "Crédito agrário para pequenos produtores do Sul."
 ITA_ww1_mezzogiorno_programme:0 "Programa para o Mezzogiorno"
 ITA_ww1_mezzogiorno_programme_desc:0 "Investimentos estatais especiais, isenções fiscais e estradas rurais pelo Sul da Itália."
 ITA_ww1_mignatta_special_raiders:0 "Incursores Navais Especiais Mignatta"
 ITA_ww1_mignatta_special_raiders_desc:0 "Mergulhadores de assalto penetrando redes portuárias para fixar minas magnéticas."
 ITA_ww1_milan_banking:0 "Os bancos de Milão"
 ITA_ww1_milan_banking_desc:0 "A Banca Commerciale Italiana e o Credito Italiano mobilizam capital privado para a indústria nacional."
 ITA_ww1_military_flight_schools:0 "Academias de Aviação Militar"
 ITA_ww1_military_flight_schools_desc:0 "Treinamento rigoroso formando milhares de pilotos de combate qualificados para o front."
 ITA_ww1_military_readiness_category:0 "Prontidão Militar e Naval"
 ITA_ww1_military_readiness_category_desc:0 "Preparação do Regio Esercito e da Regia Marina."
 ITA_ww1_motor_transport:0 "Corpo de transporte motorizado"
 ITA_ww1_motor_transport_desc:0 "Constrói 1 fábrica militar no Piemonte (caminhões FIAT). Colunas automobilísticas abastecem os exércitos alpinos e deslocam divisões inteiras entre o Trentino e o Piave em dois dias."
 ITA_ww1_motorized_shock_cadres:0 "Esquadrões Blindados Motorizados"
 ITA_ww1_motorized_shock_cadres_desc:0 "Automóveis blindados velozes rompendo linhas inimigas e perseguindo colunas em retirada."
 ITA_ww1_mountain_artillery:0 "Artilharia de montanha"
 ITA_ww1_mountain_artillery_desc:0 "Constrói 1 fábrica militar no Piemonte (Turim). Canhões desmontáveis conduzidos por muares sobem desfiladeiros íngremes para prestar apoio de fogo imediato aos Alpini."
 ITA_ww1_mountain_howitzers:0 "Obuseiros de Montanha Alpinos"
 ITA_ww1_mountain_howitzers_desc:0 "Canhões desmontáveis transportados por mulas fornecendo apoio direto nas escarpas rochosas."
 ITA_ww1_munitions_undersecretariat:0 "A Subsecretaria de Munições"
 ITA_ww1_munitions_undersecretariat_desc:0 "Subsecretaria governamental exclusiva centraliza o fornecimento de projéteis e explosivos."
 ITA_ww1_mutilated_victory:0 "A Vitória Mutilada"
 ITA_ww1_mutilated_victory_desc:0 "O desapontamento em Versalhes substitui o entusiasmo bélico pelo mito amargo da Vittoria Mutilata."
 ITA_ww1_mutilated_victory_syndrome:0 "Sentimento de Vitória Mutilada"
 ITA_ww1_mutilated_victory_syndrome_desc:0 "Rancor pelo não cumprimento integral do Pacto de Londres em Versalhes."
 ITA_ww1_national_party:0 "O Partido Nacional"
 ITA_ww1_national_party_desc:0 "Transformação dos bandos dispersos no disciplinado Partido Nacional Fascista sob o comando central de Mussolini."
 ITA_ww1_nationalist_association:0 "A Associação Nacionalista"
 ITA_ww1_nationalist_association_desc:0 "Corradini e Federzoni organizam a Associação Nacionalista Italiana, pregando expansão imperial e irredentismo."
 ITA_ww1_nationalist_order:0 "A ordem nacionalista"
 ITA_ww1_nationalist_order_desc:0 "Proprietários de terra, industriais e classes médias abraçam a disciplina nacionalista para restaurar a autoridade."
 ITA_ww1_naval_convention_vienna:0 "Convenção naval com Viena"
 ITA_ww1_naval_convention_vienna_desc:0 "Acordo sobre códigos de sinais e cooperação operacional entre a Regia Marina e a esquadra austríaca."
 ITA_ww1_naval_estimates:0 "O orçamento naval"
 ITA_ww1_naval_estimates_desc:0 "Aprova o orçamento naval de 1911. O Almirante Bettolo e o ministério da marinha obtêm dotações plurianuais para competir com o rearmamento naval austríaco."
 ITA_ww1_negotiate_factory_arbitration:0 "Negociar arbitragem fabril"
 ITA_ww1_negotiate_factory_arbitration_desc:0 "Mediação entre sindicatos e industriais para evitar paralisações."
 ITA_ww1_neutral_peace_conference:0 "Sediar uma conferência de paz neutra"
 ITA_ww1_neutral_peace_conference_desc:0 "Convite a representantes das potências em guerra a Roma para negociações preliminares de paz."
 ITA_ww1_neutralist_coalition:0 "A coalizão neutralista"
 ITA_ww1_neutralist_coalition_desc:0 "Uma maioria parlamentar composta por liberais giolittianos, socialistas e católicos organiza-se pela paz."
 ITA_ww1_neutralist_predominance:0 "Predomínio Neutralista"
 ITA_ww1_neutralist_predominance_desc:0 "A maioria do parlamento e da população favorece a paz e a neutralidade."
 ITA_ww1_nice_and_tunisia_claims:0 "Reivindicações sobre Nice e a Tunísia"
 ITA_ww1_nice_and_tunisia_claims_desc:0 "Reivindicação de territórios históricos sobre Nice, Córsega e a Tunísia."
 ITA_ww1_nitti_cabinet:0 "O gabinete Nitti"
 ITA_ww1_nitti_cabinet_desc:0 "Francesco Saverio Nitti assume o governo buscando austeridade fiscal, desmobilização e reconciliação social."
 ITA_ww1_north_east_mobilisation:0 "Plano de mobilização do Nordeste"
 ITA_ww1_north_east_mobilisation_desc:0 "Conclui a malha ferroviária de mobilização para concentrar os exércitos na planície vêneta. Coordena dezenas de composições diárias pelo vale do Pó para concentrar quatro exércitos de campanha na fronteira em vinte dias."
 ITA_ww1_offensive_doctrine:0 "A doutrina ofensiva"
 ITA_ww1_offensive_doctrine_desc:0 "Substitui a Disciplina de Cadorna pelo Culto da Ofensiva. A doutrina oficial sustenta que a força moral e a baioneta do infante prevalecerão sobre as metralhadoras inimigas."
 ITA_ww1_offensive_pressure:0 "Pressão ofensiva contínua"
 ITA_ww1_offensive_pressure_desc:0 "Substitui a postura defensiva pela Pressão Contínua nas Margens. Ataques localizados nos bancos de areia do rio mantêm o comando imperial sob tensão constante, forçando o esgotamento precoce de reservas."
 ITA_ww1_opera_nazionale_combattenti:0 "Opera Nazionale Combattenti"
 ITA_ww1_opera_nazionale_combattenti_desc:0 "Instituição estatal de assistência e integração social de veteranos."
 ITA_ww1_oppressed_nationalities_liaison:0 "Apoio às nacionalidades oprimidas"
 ITA_ww1_oppressed_nationalities_liaison_desc:0 "Contatos com comitês tchecos e eslavos do sul."
 ITA_ww1_oppressed_peoples_congress:0 "Congresso dos povos oprimidos"
 ITA_ww1_oppressed_peoples_congress_desc:0 "Reunião em Roma com líderes tchecos, iugoslavos, poloneses e romenos para minar o Império Habsburgo."
 ITA_ww1_orlando_government:0 "O governo Orlando"
 ITA_ww1_orlando_government_desc:0 "Vittorio Emanuele Orlando assume a chefia do governo com mandato de ferro: resistência no Piave e vitória total."
 ITA_ww1_orlando_victory_cabinet:0 "Gabinete de Resistência de Orlando"
 ITA_ww1_orlando_victory_cabinet_desc:0 "Governo de determinação nacional para a vitória definitiva na Grande Guerra."
 ITA_ww1_otranto_barrage:0 "A barragem de Otranto"
 ITA_ww1_otranto_barrage_desc:0 "Instala redes antissubmarino, hidrofones e traineiras armadas no Estreito de Otranto. Bloqueia a saída de submarinos alemães e austríacos para o Mediterrâneo central, protegendo os comboios aliados."
 ITA_ww1_otranto_barrage_net:0 "A Rede de Bloqueio de Otranto"
 ITA_ww1_otranto_barrage_net_desc:0 "Redes profundas com hidrofones prendendo os submarinos inimigos no mar Adriático."
 ITA_ww1_paris_delegation:0 "A delegação em Paris"
 ITA_ww1_paris_delegation_desc:0 "Orlando e Sonnino apresentam as reivindicações territoriais italianas na Conferência de Paz de Paris."
 ITA_ww1_parliament_against_street:0 "O Parlamento contra a rua"
 ITA_ww1_parliament_against_street_desc:0 "A maioria parlamentar neutralista resiste à intimidação das ruas nacionalistas em Roma e Milão."
 ITA_ww1_pci_workers_councils:0 "Conselhos Operários de Fábrica"
 ITA_ww1_pci_workers_councils_desc:0 "Operários assumem a gestão direta da produção nas indústrias ocupadas."
 ITA_ww1_peacetime_military_economy:0 "Realismo Fiscal em Tempo de Paz"
 ITA_ww1_peacetime_military_economy_desc:0 "Redução prudente das dotações militares facilitando a recuperação econômica do país."
 ITA_ww1_piave_line:0 "A linha do Piave"
 ITA_ww1_piave_line_desc:0 "Reagrupamento dos exércitos no rio Piave e no Monte Grappa com determinação inabalável."
 ITA_ww1_pilot_schools:0 "Escolas de pilotagem"
 ITA_ww1_pilot_schools_desc:0 "Substitui o batalhão experimental por academias formais de voo. Padroniza o treinamento de navegação e manobras para formar centenas de pilotos aviadores militares."
 ITA_ww1_popolo_ditalia:0 "Um jornal para a guerra"
 ITA_ww1_popolo_ditalia_desc:0 "Benito Mussolini lança Il Popolo d'Italia com subsídios industriais e franceses, convocando à guerra revolucionária."
 ITA_ww1_popular_party:0 "O Partido Popular Italiano"
 ITA_ww1_popular_party_desc:0 "Don Luigi Sturzo funda o Partito Popolare Italiano, organizando a democracia cristã como força independente."
 ITA_ww1_postwar_army_reform:0 "Reforma do exército no pós-guerra"
 ITA_ww1_postwar_army_reform_desc:0 "O General Badoglio reorganiza o exército permanente de paz em trinta divisões modernas. Moderniza o parque de artilharia, absorve a experiência tática dos Arditi e unifica os comandos de corpo de exército na fronteira."
 ITA_ww1_postwar_fleet_review:0 "Revisão da frota do pós-guerra"
 ITA_ww1_postwar_fleet_review_desc:0 "Revista naval vitoriosa em Veneza celebrada com o Rei. Encouraçados, cruzadores e as célebres flotilhas MAS desfilam na lagoa de Veneza celebrando o domínio inconteste do Adriático."
 ITA_ww1_price_controls:0 "Controle de preços"
 ITA_ww1_price_controls_desc:0 "Tabelamento de preços para gêneros de primeira necessidade protege famílias urbanas da carestia."
 ITA_ww1_propaganda_service:0 "O Serviço de Propaganda"
 ITA_ww1_propaganda_service_desc:0 "O Servizio P envia ilustradores, escritores e oradores para sustentar o ânimo nas trincheiras alpinas."
 ITA_ww1_propaganda_service_spirit:0 "Servizio P de Moral Militar"
 ITA_ww1_propaganda_service_spirit_desc:0 "Propaganda ativa e jornais ilustrados sustentam o espírito das tropas."
 ITA_ww1_propaganda_trench_newspapers:0 "Publicar jornais de trincheira"
 ITA_ww1_propaganda_trench_newspapers_desc:0 "Ilustrações patrióticas para manter o ânimo dos soldados."
 ITA_ww1_proportional_representation:0 "Representação proporcional"
 ITA_ww1_proportional_representation_desc:0 "A reforma eleitoral introduz a representação proporcional, dissolvendo velhas redes liberais de clientelismo."
 ITA_ww1_public_order_measures:0 "Restaurar a ordem pública"
 ITA_ww1_public_order_measures_desc:0 "O desdobramento de guarnições militares e patrulhas dos Carabineiros restaura a ordem civil."
 ITA_ww1_public_works_programme:0 "Programa de obras públicas"
 ITA_ww1_public_works_programme_desc:0 "Obras estatais em rodovias, portos e eletrificação absorvem trabalhadores desmobilizados."
 ITA_ww1_quarto_rally:0 "O discurso de Quarto"
 ITA_ww1_quarto_rally_desc:0 "Gabriele D'Annunzio profere inflamado discurso patriótico em Quarto, desencadeando multidões nacionalistas nas ruas."
 ITA_ww1_radiant_fever:0 "Febre Intervencionista"
 ITA_ww1_radiant_fever_desc:0 "As multidões patrióticas dominam as praças exigindo a guerra de libertação."
 ITA_ww1_radiant_may:0 "O Maio Radiante"
 ITA_ww1_radiant_may_desc:0 "Os dias febris do Maggio Radioso forçam o Rei e o Parlamento a repudiar a neutralidade e abraçar o conflito."
 ITA_ww1_radiant_may_fervor:0 "Entusiasmo do Maio Radiante"
 ITA_ww1_radiant_may_fervor_desc:0 "Mobilização popular entusiástica pela causa da libertação nacional."
 ITA_ww1_railway_mobilisation_plan:0 "Malha Ferroviária de Mobilização"
 ITA_ww1_railway_mobilisation_plan_desc:0 "Escalas ferroviárias eficientes concentrando as divisões na fronteira com agilidade."
 ITA_ww1_ration_civilian_coal:0 "Racionar carvão civil"
 ITA_ww1_ration_civilian_coal_desc:0 "Priorizar carvão para altos-fornos e ferrovias militares."
 ITA_ww1_reassure_berlin_and_vienna:0 "Reafirmar lealdade aos aliados centrais"
 ITA_ww1_reassure_berlin_and_vienna_desc:0 "Consultas diplomáticas para preservar a Tríplice Aliança."
 ITA_ww1_red_week:0 "A Semana Vermelha"
 ITA_ww1_red_week_aftermath:0 "Rescaldo da Semana Vermelha"
 ITA_ww1_red_week_aftermath_desc:0 "Tensões sociais e desconfiança policial permanecem elevadas após os motins."
 ITA_ww1_red_week_desc:0 "Protestos violentos e greves gerais paralisam a Romagna e as Marcas após repressão policial em Ancona."
 ITA_ww1_refugee_relief:0 "Auxílio aos refugiados"
 ITA_ww1_refugee_relief_desc:0 "Alimentação, abrigo e assistência médica a mais de 400 mil cidadãos deslocados por Caporetto."
 ITA_ww1_regia_marina_cadres:0 "Quadros de Oficiais da Regia Marina"
 ITA_ww1_regia_marina_cadres_desc:0 "Oficiais graduados pela Academia Naval de Livorno dominando a artilharia moderna."
 ITA_ww1_renew_triple_alliance:0 "Renovar a Tríplice Aliança"
 ITA_ww1_renew_triple_alliance_desc:0 "Renovação do tratado da Tríplice Aliança em 1912 com cláusulas sobre segurança mediterrânea."
 ITA_ww1_repress_squadrist_violence:0 "Reprimir a violência dos esquadrões"
 ITA_ww1_repress_squadrist_violence_desc:0 "Desarmar milícias e bandos armados ilegais."
 ITA_ww1_reserve_officer_schools:0 "Escolas de oficiais da reserva"
 ITA_ww1_reserve_officer_schools_desc:0 "Constrói 1 fábrica militar na Emília-Romanha (Módena). Cursos rápidos em Módena e Parma preparam oficiais subalternos para liderar pelotões na linha de frente."
 ITA_ww1_revolutionary_ferment:0 "Fermento Revolucionário"
 ITA_ww1_revolutionary_ferment_desc:0 "Greves massivas e agitação maximalista paralisam cidades industriais."
 ITA_ww1_riviera_offensive:0 "A ofensiva da Riviera"
 ITA_ww1_riviera_offensive_desc:0 "Avanço de pontas de lança de cavalaria e infantaria pelo litoral mediterrâneo rumo a Nice."
 ITA_ww1_sacro_egoismo:0 "Doutrina do Sacro Egoismo"
 ITA_ww1_sacro_egoismo_desc:0 "Defesa incondicional do interesse geopolítico italiano acima de pactos externos."
 ITA_ww1_sacro_egoismo_suspicion:0 "Suspeita por 'Sacro Egoismo'"
 ITA_ww1_saint_jean_de_maurienne:0 "Saint-Jean-de-Maurienne"
 ITA_ww1_saint_jean_de_maurienne_desc:0 "Acordo territorial sobre futuras zonas de influência italiana na Anatólia (Esmirna)."
 ITA_ww1_salandra_cabinet:0 "O gabinete Salandra"
 ITA_ww1_salandra_cabinet_desc:0 "Antonio Salandra assume a liderança de um gabinete conservador, encerrando o trasformismo giolittiano."
 ITA_ww1_salandra_emergency_cabinet:0 "Gabinete de Crise de Salandra"
 ITA_ww1_salandra_emergency_cabinet_desc:0 "Liderança conservadora focada na prontidão e na intervenção armada."
 ITA_ww1_salonika_contingent:0 "O contingente de Salônica"
 ITA_ww1_salonika_contingent_desc:0 "Envio da 35ª Divisão de Infantaria para integrar operações aliadas no fronte macedônio."
 ITA_ww1_sarajevo_crisis:0 "A crise de julho"
 ITA_ww1_sarajevo_crisis_desc:0 "O ultimato austríaco à Sérvia deflagra a crise europeia, permitindo à Itália contestar a falta de consulta prévia."
 ITA_ww1_secret_contacts_with_paris:0 "Contatos secretos com Paris"
 ITA_ww1_secret_contacts_with_paris_desc:0 "Sondagens discretas com o Ministério dos Negócios Estrangeiros francês."
 ITA_ww1_shattered_discipline:0 "Disciplina Abalada"
 ITA_ww1_shattered_discipline_desc:0 "O choque das derrotas e a exaustão militar abalam as fileiras do exército."
 ITA_ww1_shortcut_dip:0 "Asa: Diplomacia e Alinhamento"
 ITA_ww1_shortcut_eco:0 "Asa: Economia e Mezzogiorno"
 ITA_ww1_shortcut_mil:0 "Asa: Forças Armadas"
 ITA_ww1_shortcut_pol:0 "Asa: Política e Sociedade"
 ITA_ww1_shortcut_war:0 "Asa: Campanhas e Pós-Guerra"
 ITA_ww1_sicilian_sulphur:0 "O enxofre siciliano"
 ITA_ww1_sicilian_sulphur_desc:0 "Reorganização do consórcio de enxofre da Sicília para abastecer indústrias químicas e de pólvora."
 ITA_ww1_social_truce:0 "Trégua Social"
 ITA_ww1_social_truce_desc:0 "Acordos entre capital e trabalho asseguram paz social e produtividade."
 ITA_ww1_socialist_congress:0 "O Congresso de Reggio Emilia"
 ITA_ww1_socialist_congress_desc:0 "O Congresso de Reggio Emilia assiste à vitória dos maximalistas, que expulsam reformistas e entregam o Avanti! a Benito Mussolini."
 ITA_ww1_socialist_turn:0 "A guinada socialista"
 ITA_ww1_socialist_turn_desc:0 "O movimento operário italiano adota postura revolucionária intransigente, rompendo com acordos burgueses."
 ITA_ww1_solstice_battle:0 "A Batalha do Solstício"
 ITA_ww1_solstice_battle_desc:0 "Rechaço da última grande ofensiva austro-húngara no Montello e no baixo Piave."
 ITA_ww1_southern_development_charter:0 "Carta de desenvolvimento do Sul"
 ITA_ww1_southern_development_charter_desc:0 "Carta legislativa abrangente garante crédito permanente e infraestrutura para o Mezzogiorno."
 ITA_ww1_southern_disparity:0 "Disparidade Meridional"
 ITA_ww1_southern_disparity_desc:0 "A falta de infraestrutura e a emigração pesam sobre as regiões do Sul."
 ITA_ww1_southern_inquiry:0 "Inquérito sobre o Sul"
 ITA_ww1_southern_inquiry_desc:0 "Um inquérito parlamentar formal sobre o atraso agrário e a emigração no Mezzogiorno."
 ITA_ww1_squadrist_mobilisation:0 "Mobilizar os esquadrões"
 ITA_ww1_squadrist_mobilisation_desc:0 "Esquadrões de camisas-negras atacam sistematicamente gráficas socialistas, ligas camponesas e sedes sindicais."
 ITA_ww1_squadrist_violence:0 "Violência dos Esquadrões"
 ITA_ww1_squadrist_violence_desc:0 "Expedições punitivas de camisas-negras aterrorizam organizações de esquerda."
 ITA_ww1_stoic_endurance:0 "Resistência Estoica"
 ITA_ww1_stoic_endurance_desc:0 "Os soldados suportam privações extremas nas montanhas e trincheiras."
 ITA_ww1_strategic_bombing:0 "Bombardeio estratégico"
 ITA_ww1_strategic_bombing_desc:0 "Implementa as teorias do Coronel Giulio Douhet de bombardeio estratégico independente. Grandes esquadras de Caproni atacam as ferrovias de abastecimento e o arsenal de Pola nas profundezas da retaguarda inimiga."
 ITA_ww1_strengthened_carabinieri:0 "Arma dei Carabinieri Reforçada"
 ITA_ww1_strengthened_carabinieri_desc:0 "Gendarmaria real de prestígio garantindo a paz interna e a legalidade constitucional."
 ITA_ww1_subdued_claims:0 "Reivindicações Contidas"
 ITA_ww1_subdued_claims_desc:0 "A diplomacia busca acomodação pacífica e preservação do comércio marítimo."
 ITA_ww1_submarine_programme:0 "O programa de submarinos"
 ITA_ww1_submarine_programme_desc:0 "Adota os submarinos de duplo casco do engenheiro Cesare Laurenti; bônus de submarinos (25%). Construção de submarinos costeiros com elevada estabilidade submersa para patrulhar as rotas mediterrâneas."
 ITA_ww1_subsidise_catholic_schools:0 "Subsidiar escolas católicas"
 ITA_ww1_subsidise_catholic_schools_desc:0 "Fortalece a cooperação com eleitores católicos moderados."
 ITA_ww1_suffrage_law:0 "Sufrágio masculino universal"
 ITA_ww1_suffrage_law_desc:0 "A ampliação do voto a todos os homens alfabetizados maiores de 21 anos e a todos os homens de 30 anos transforma a democracia italiana."
 ITA_ww1_supreme_war_council:0 "O Conselho Supremo de Guerra"
 ITA_ww1_supreme_war_council_desc:0 "Criação do Conselho Supremo de Guerra Aliado em Rapallo para coordenação estratégica coalizada."
 ITA_ww1_sva_reconnaissance:0 "Aviões de reconhecimento SVA"
 ITA_ww1_sva_reconnaissance_desc:0 "Adota o biplano veloz Ansaldo SVA.5 de longo alcance; bônus de equipamento aéreo (25%). Com velocidade superior a 220 km/h e seis horas de autonomia, fotografa as ferrovias austríacas nos Alpes."
 ITA_ww1_taranto_base:0 "A base de Taranto"
 ITA_ww1_taranto_base_desc:0 "Expande a base naval de Taranto. Dragagem de canais, construção de docas secas e baterias costeiras fortificadas no Mar Piccolo e Mar Grande."
 ITA_ww1_taranto_naval_arsenal:0 "Arsenal Naval de Taranto"
 ITA_ww1_taranto_naval_arsenal_desc:0 "Grandes docas secas e instalações de reparo mantendo a esquadra de batalha em prontidão."
 ITA_ww1_tariff_protection:0 "Tarifas protecionistas"
 ITA_ww1_tariff_protection_desc:0 "Proteção aduaneira para a metalurgia e a mecânica pesada do Norte."
 ITA_ww1_third_giolitti:0 "O último ministério Giolitti"
 ITA_ww1_third_giolitti_desc:0 "O experiente estadista retorna à presidência do conselho, preferindo conciliação e mediação ao uso da força."
 ITA_ww1_torpedo_boats:0 "Flotilhas de torpedeiros"
 ITA_ww1_torpedo_boats_desc:0 "Constrói contratorpedeiros torpedeiros velozes das classes 3PN e Indomito; bônus de contratorpedeiros (25%). Embarcações velozes aptas a semear campos de minas e desferir ataques noturnos de torpedos contra navios austríacos."
 ITA_ww1_trade_union_recognition:0 "Reconhecer a Confederação do Trabalho"
 ITA_ww1_trade_union_recognition_desc:0 "A arbitragem pragmática reconhece a Confederazione Generale del Lavoro como interlocutora legítima."
 ITA_ww1_train_alpini_mountain_battalions:0 "Treinar batalhões alpinos"
 ITA_ww1_train_alpini_mountain_battalions_desc:0 "Instrução avançada em geleiras e paredões rochosos."
 ITA_ww1_trasformismo_politics:0 "Prática do Trasformismo"
 ITA_ww1_trasformismo_politics_desc:0 "O sistema político é governado por negociações contínuas entre bancadas."
 ITA_ww1_treaty_of_london:0 "O Tratado de Londres"
 ITA_ww1_treaty_of_london_desc:0 "Assinatura do Pacto secreto de Londres garantindo Trentino, Tirol Meridional, Trieste, Ístria e Dalmácia."
 ITA_ww1_treaty_of_london_solidarity:0 "Solidariedade do Tratado de Londres"
 ITA_ww1_treaty_of_ouchy:0 "O Tratado de Ouchy"
 ITA_ww1_treaty_of_ouchy_desc:0 "Assinatura do Tratado de Ouchy confirmando a soberania da Itália sobre a Líbia."
 ITA_ww1_treaty_of_rapallo:0 "O Tratado de Rapallo"
 ITA_ww1_treaty_of_rapallo_desc:0 "Assinatura do tratado de fronteira de compromisso com o Reino dos Sérvios, Croatas e Eslovenos."
 ITA_ww1_treaty_of_saint_germain:0 "O Tratado de Saint-Germain"
 ITA_ww1_treaty_of_saint_germain_desc:0 "Ratificação do tratado que formaliza a dissolução da Áustria-Hungria e a cessão de Trento e Trieste."
 ITA_ww1_trench_mortars:0 "Morteiros de trincheira"
 ITA_ww1_trench_mortars_desc:0 "Constrói 1 fábrica militar no Piemonte. Morteiros de tiro curvo lançam cargas pesadas de alto explosivo diretamente sobre as linhas inimigas nas rochas do Carso."
 ITA_ww1_trentino_defence:0 "Defender o Trentino"
 ITA_ww1_trentino_defence_desc:0 "Contenção da Strafexpedition austríaca no planalto de Asiago e Pasubio."
 ITA_ww1_trento_trieste_integration:0 "Integrar Trento e Trieste"
 ITA_ww1_trento_trieste_integration_desc:0 "Integração administrativa, jurídica e linguística plena das províncias redimidas ao Reino da Itália."
 ITA_ww1_triple_alliance:0 "A Tríplice Aliança"
 ITA_ww1_triple_alliance_desc:0 "Exame dos compromissos da Itália na Tríplice Aliança com Berlim e Viena."
 ITA_ww1_tripoli_landing:0 "O desembarque em Trípoli"
 ITA_ww1_tripoli_landing_desc:0 "Desdobramento de destacamentos navais e fuzileiros para assegurar instalações portuárias líbias."
 ITA_ww1_tunisian_landing:0 "O desembarque na Tunísia"
 ITA_ww1_tunisian_landing_desc:0 "Operações anfíbias no litoral tunisiano em apoio à expressiva população italiana local."
 ITA_ww1_turin_motor_industry:0 "Turim e a indústria automobilística"
 ITA_ww1_turin_motor_industry_desc:0 "Expansão das instalações automobilísticas da FIAT, Lancia e SCAT no Piemonte."
 ITA_ww1_ultimatum_to_the_porte:0 "Ultimato à Sublime Porta"
 ITA_ww1_ultimatum_to_the_porte_desc:0 "Entrega de termos diplomáticos à Sublime Porta exigindo a transferência do controle administrativo da Líbia."
 ITA_ww1_universal_suffrage:0 "Sufrágio Universal Masculino"
 ITA_ww1_universal_suffrage_desc:0 "O direito de voto ampliado incorpora milhões de camponeses e operários à vida cívica."
 ITA_ww1_unknown_soldier:0 "O Soldado Desconhecido"
 ITA_ww1_unknown_soldier_desc:0 "Entombamento solene do Soldado Desconhecido no Altar da Pátria em Roma une a nação em reverência."
 ITA_ww1_unredeemed_lands_call:0 "O Chamado das Terras Irredentas"
 ITA_ww1_unredeemed_lands_call_desc:0 "A causa de Trento e Trieste ganha força nos debates políticos."
 ITA_ww1_vatican_peace_note:0 "A nota de paz do Vaticano"
 ITA_ww1_vatican_peace_note_desc:0 "Resposta diplomática aos apelos do Papa Bento XV pelo fim do 'massacre inútil'."
 ITA_ww1_vatican_reconciliation_talks:0 "Diálogo conciliatório com a Santa Sé"
 ITA_ww1_vatican_reconciliation_talks_desc:0 "Aproximação institucional entre o Estado italiano e a Igreja."
 ITA_ww1_veteran_resettlement_parcels:0 "Lotes rurais para veteranos"
 ITA_ww1_veteran_resettlement_parcels_desc:0 "Concessão de terras agrícolas a ex-combatentes."
 ITA_ww1_veterans_land_settlement:0 "Assentamento de veteranos"
 ITA_ww1_veterans_land_settlement_desc:0 "Distribuição de terras agricultáveis saneadas a veteranos camponeses na Apúlia e Sardenha."
 ITA_ww1_victorious_ardor:0 "Ardor Vitorioso"
 ITA_ww1_victorious_ardor_desc:0 "O entusiasmo de vitórias recentes eleva a moral e a confiança na liderança."
 ITA_ww1_vienna_compensation_talks:0 "Negociar compensações com Viena"
 ITA_ww1_vienna_compensation_talks_desc:0 "Negociações diplomáticas sob o Artigo VII exigem a cessão do Trentino em troca da neutralidade."
 ITA_ww1_vienna_flight:0 "O voo sobre Viena"
 ITA_ww1_vienna_flight_desc:0 "A 87ª Esquadrilha de D'Annunzio lança 400 mil panfletos tricolores sobre a capital austríaca. Percorrendo mais de mil quilômetros sobre os Alpes, aviadores italianos demonstram a vulnerabilidade de Viena e desferem golpe psicológico."
 ITA_ww1_villa_giusti_armistice:0 "O armistício de Villa Giusti"
 ITA_ww1_villa_giusti_armistice_desc:0 "Assinatura do armistício com a Áustria-Hungria derrotada na Villa Giusti em 3 de novembro de 1918."
 ITA_ww1_vittorio_veneto:0 "Vittorio Veneto"
 ITA_ww1_vittorio_veneto_desc:0 "A ofensiva geral decisiva que rompe as linhas austríacas e liberta Trento e Trieste."
 ITA_ww1_war_censorship:0 "Lei de censura de guerra"
 ITA_ww1_war_censorship_desc:0 "Censura emergencial de tempos de guerra reprime propaganda derrotista e controla despachos do fronte."
 ITA_ww1_war_hydropower:0 "Energia hidrelétrica para a guerra"
 ITA_ww1_war_hydropower_desc:0 "Eletrificação emergencial de linhas ferroviárias piemontesas e lombardas substitui o carvão importado."
 ITA_ww1_war_loans:0 "Empréstimos nacionais de guerra"
 ITA_ww1_war_loans_desc:0 "Lançamento sucessivo de empréstimos nacionais de guerra mobiliza a poupança popular."
 ITA_ww1_war_of_position:0 "A guerra de posição"
 ITA_ww1_war_of_position_desc:0 "Substitui a Disciplina de Cadorna pela Doutrina Metódica de Fogo. Rejeitando cargas frontais desprotegidas, prioriza a destruição metódica dos obstáculos por artilharia pesada antes do avanço."
 ITA_ww1_war_profiteers_inquiry:0 "O inquérito dos \"tubarões\""
 ITA_ww1_war_profiteers_inquiry_desc:0 "Tributação sobre lucros extraordinários de guerra recupera receitas e abranda a fúria popular."
 ITA_ww1_washington_conference:0 "A Conferência de Washington"
 ITA_ww1_washington_conference_desc:0 "Participação na conferência naval garantindo paridade formal de tonelagem com a França."
 ITA_ww1_wilsonian_conflict:0 "Wilson e o Adriático"
 ITA_ww1_wilsonian_conflict_desc:0 "Conflito com os Quatorze Pontos do Presidente Wilson quanto às reivindicações italianas no Adriático."
 ITA_ww1_women_war_economy:0 "As mulheres na economia de guerra"
 ITA_ww1_women_war_economy_desc:0 "Centenas de milhares de mulheres assumem postos em fábricas de munição, tecelagens e lavouras."
 ITA_ww1_workers_councils:0 "Os conselhos operários"
 ITA_ww1_workers_councils_desc:0 "Gramsci e L'Ordine Nuovo organizam conselhos de fábrica que quebram o cerco esquadrista."
 ww1_italy.1.a:0 "Aprovar a reforma abrangente."
 ww1_italy.1.b:0 "Limitar as concessões à alfabetização."
 ww1_italy.1.d:0 "A ampliação do sufrágio masculino altera o equilíbrio das forças políticas."
 ww1_italy.1.t:0 "A Reforma Eleitoral de 1912"
