 # --- Estados Unidos da América (William Howard Taft) ---
 USA_GATHERING_STORM_DESC:0 "No verão de 1911, os Estados Unidos despontam como o maior colosso produtivo do hemisfério ocidental, superando impérios europeus em extração mineral, capacidade industrial e riqueza agropecuária. Sob o Presidente William Howard Taft, a Era Progressista transforma a sociedade através de rígida legislação antitruste e inovações fabris pioneiras lideradas por Henry Ford. Apoiada na Doutrina Monroe e na diplomacia financeira, a opinião pública americana preserva apego firme ao isolacionismo histórico, desconfiando do militarismo europeu. Todavia, a crescente esquadra moderna americana parece fadada a influenciar os rumos do planeta."
 WW1_USA_GATHERING_STORM_DESC:0 "No verão de 1911, os Estados Unidos despontam como o maior colosso produtivo do hemisfério ocidental, superando impérios europeus em extração mineral, capacidade industrial e riqueza agropecuária. Sob o Presidente William Howard Taft, a Era Progressista transforma a sociedade através de rígida legislação antitruste e inovações fabris pioneiras lideradas por Henry Ford. Apoiada na Doutrina Monroe e na diplomacia financeira, a opinião pública americana preserva apego firme ao isolacionismo histórico, desconfiando do militarismo europeu. Todavia, a crescente esquadra moderna americana parece fadada a influenciar os rumos do planeta."

 # --- Outras Nações (Visão Geral Global) ---
 OTHER_GATHERING_STORM_DESC:0 "Em junho de 1911, a civilização humana atinge o ápice reluzente da Belle Époque. Nas capitais da Europa e nas metrópoles das Américas, o avanço da eletricidade, aviação, radiotelegrafia e manufatura pesada celebra uma era de triunfo humano. Contudo, sob este esplendor, a ordem internacional encontra-se instável. Na África e Ásia, populações subjugadas resistem à dominação colonial, enquanto a revolução abala o México e prenúncios de revolta agitam a China Qing. Presas a pactos militares rígidos e à corrida naval dos dreadnoughts, as grandes potências marcham rumo à maior catástrofe de sua história."
