 # ========================================================
 # Bookmark: La Belle Époque (1911) - Hearts of Iron IV
 # Date: 1 de Junho de 1911
 # ========================================================
 GATHERING_STORM_NAME:0 "La Belle Époque (1911)"
 WW1_GATHERING_STORM_NAME:0 "La Belle Époque (1911)"
 GATHERING_STORM_DESC:0 "Junho de 1911. Os grandes impérios da Europa encontram-se no zênite da Belle Époque em uma era de paz armada e intensa rivalidade industrial e naval. Enquanto a Crise de Agadir se desenrola no Marrocos e os Bálcãs aproximam-se do ponto de ebulição, o continente caminha inexoravelmente em direção à catástrofe da Grande Guerra."
 WW1_GATHERING_STORM_DESC:0 "Junho de 1911. Os grandes impérios da Europa encontram-se no zênite da Belle Époque em uma era de paz armada e intensa rivalidade industrial e naval. Enquanto a Crise de Agadir se desenrola no Marrocos e os Bálcãs aproximam-se do ponto de ebulição, o continente caminha inexoravelmente em direção à catástrofe da Grande Guerra."

 # --- Império Alemão (Guilherme II) ---
 GER_GATHERING_STORM_DESC:0 "Em junho de 1911, o Império Alemão encontra-se no ápice de seu poder continental sob o Kaiser Guilherme II. Dotado do exército mais disciplinado e temível do mundo, guiado pelo Großer Generalstab sob Helmuth von Moltke, o Jovem, e equipado pelo formidável parque industrial Krupp, o Império sente-se, contudo, cercado pela hostil aliança franco-russa. O Grande Almirante Alfred von Tirpitz persegue incansavelmente a expansão da Frota de Alto-Mar para contestar a supremacia naval britânica, enquanto os estrategistas imperiais depositam sua fé no Plano Schlieffen para desferir um golpe fulminante em caso de conflito. Com a canhoneira SMS Panther rumando para o Marrocos para deflagrar a Crise de Agadir, Berlim deve decidir se sua política de intimidação assegurará seu 'lugar ao sol' ou precipitará uma guerra continental devastadora."
 WW1_GER_GATHERING_STORM_DESC:0 "Em junho de 1911, o Império Alemão encontra-se no ápice de seu poder continental sob o Kaiser Guilherme II. Dotado do exército mais disciplinado e temível do mundo, guiado pelo Großer Generalstab sob Helmuth von Moltke, o Jovem, e equipado pelo formidável parque industrial Krupp, o Império sente-se, contudo, cercado pela hostil aliança franco-russa. O Grande Almirante Alfred von Tirpitz persegue incansavelmente a expansão da Frota de Alto-Mar para contestar a supremacia naval britânica, enquanto os estrategistas imperiais depositam sua fé no Plano Schlieffen para desferir um golpe fulminante em caso de conflito. Com a canhoneira SMS Panther rumando para o Marrocos para deflagrar a Crise de Agadir, Berlim deve decidir se sua política de intimidação assegurará seu 'lugar ao sol' ou precipitará uma guerra continental devastadora."

 # --- Império Austro-Húngaro (Francisco José I) ---
 AUS_GATHERING_STORM_DESC:0 "Reinando há mais de seis décadas, o venerável Imperador Francisco José I preside sobre o mosaico frágil da Monarquia Dual Austro-Húngara. Por trás do fausto imperial e da era de ouro vienense, forças nacionalistas centrífugas ameaçam a coesão dos Habsburgos, agravadas pela feroz hostilidade dos eslavos do sul após a anexação da Bósnia-Herzegovina em 1908. As relações com o Reino da Sérvia e a Rússia Imperial permanecem perigosamente tensas. O Chefe do Estado-Maior, General Franz Conrad von Hötzendorf, defende com veemência um ataque preventivo para esmagar a agitação sérvia antes que a monarquia se desintegre. Ancorada à aliança com a Alemanha, a Áustria-Hungria enfrenta escolhas decisivas entre reforma federal, confronto militar ou colapso interno."
 WW1_AUS_GATHERING_STORM_DESC:0 "Reinando há mais de seis décadas, o venerável Imperador Francisco José I preside sobre o mosaico frágil da Monarquia Dual Austro-Húngara. Por trás do fausto imperial e da era de ouro vienense, forças nacionalistas centrífugas ameaçam a coesão dos Habsburgos, agravadas pela feroz hostilidade dos eslavos do sul após a anexação da Bósnia-Herzegovina em 1908. As relações com o Reino da Sérvia e a Rússia Imperial permanecem perigosamente tensas. O Chefe do Estado-Maior, General Franz Conrad von Hötzendorf, defende com veemência um ataque preventivo para esmagar a agitação sérvia antes que a monarquia se desintegre. Ancorada à aliança com a Alemanha, a Áustria-Hungria enfrenta escolhas decisivas entre reforma federal, confronto militar ou colapso interno."

 # --- Império Otomano (Mehmed V) ---
 TUR_GATHERING_STORM_DESC:0 "Liderado formalmente pelo Sultão Mehmed V, o Império Otomano atravessa profundas transformações políticas sob o comitê revolucionário dos Jovens Turcos (İttihat ve Terakki). O novo governo trabalha intensamente para modernizar instituições decadentes, reformar impostos e reestruturar suas forças armadas com auxílio da missão militar alemã de Colmar von der Goltz. Todavia, ameaças externas multiplicam-se rapidamente: o Reino da Itália planeja expedições coloniais contra a Tripolitânia otomana, insurreições eclodem na Albânia e os estados balcânicos vislumbram os territórios da Rumélia com apetite predatório. Cercada de perigos existenciais, a Sublime Porta precisa modernizar-se com urgência ou sofrer a partilha total de seus domínios."
 WW1_TUR_GATHERING_STORM_DESC:0 "Liderado formalmente pelo Sultão Mehmed V, o Império Otomano atravessa profundas transformações políticas sob o comitê revolucionário dos Jovens Turcos (İttihat ve Terakki). O novo governo trabalha intensamente para modernizar instituições decadentes, reformar impostos e reestruturar suas forças armadas com auxílio da missão militar alemã de Colmar von der Goltz. Todavia, ameaças externas multiplicam-se rapidamente: o Reino da Itália planeja expedições coloniais contra a Tripolitânia otomana, insurreições eclodem na Albânia e os estados balcânicos vislumbram os territórios da Rumélia com apetite predatório. Cercada de perigos existenciais, a Sublime Porta precisa modernizar-se com urgência ou sofrer a partilha total de seus domínios."

 # --- Império Britânico (Jorge V / H. H. Asquith) ---
 ENG_GATHERING_STORM_DESC:0 "Em junho de 1911, o Rei Jorge V celebra sua solene coroação em Londres como monarca de um império que abrange um quarto do planeta, protegido pela Royal Navy sob a égide da Pax Britannica. Contudo, sob o esplendor imperial, a Grã-Bretanha enfrenta intensas turbulências domésticas: o gabinete liberal de H. H. Asquith trava duras batalhas constitucionais sobre os poderes da Câmara dos Lordes e a incendiária questão do Home Rule irlandês. Nos mares, o Almirantado é forçado a canalizar vultosos orçamentos para navios couraçados a fim de preservar o Two-Power Standard contra a expansão naval germânica. Vinculada à França pela Entente Cordiale e à Rússia por acordos diplomáticos, Londres é atraída para as rivalidades continentais."
 WW1_ENG_GATHERING_STORM_DESC:0 "Em junho de 1911, o Rei Jorge V celebra sua solene coroação em Londres como monarca de um império que abrange um quarto do planeta, protegido pela Royal Navy sob a égide da Pax Britannica. Contudo, sob o esplendor imperial, a Grã-Bretanha enfrenta intensas turbulências domésticas: o gabinete liberal de H. H. Asquith trava duras batalhas constitucionais sobre os poderes da Câmara dos Lordes e a incendiária questão do Home Rule irlandês. Nos mares, o Almirantado é forçado a canalizar vultosos orçamentos para navios couraçados a fim de preservar o Two-Power Standard contra a expansão naval germânica. Vinculada à França pela Entente Cordiale e à Rússia por acordos diplomáticos, Londres é atraída para as rivalidades continentais."

 # --- Terceira República Francesa (Armand Fallières / Joseph Caillaux) ---
 FRA_GATHERING_STORM_DESC:0 "Quarenta anos após a catástrofe da Guerra Franco-Prussiana, a Terceira República Francesa permanece devotada à memória sagrada de 1870 e à redenção das províncias perdidas da Alsácia-Lorena. Presidida por Armand Fallières e sob o ministério de Joseph Caillaux, a França irradia prestígio cultural e lidera um vasto império colonial. O Exército Francês, depositando fé inabalável no espírito ofensivo do 'Élan Vital' e na cadência devastadora do Canon de 75mm modelo 1897, prepara-se para um confronto total. Com tropas francesas mobilizadas no Marrocos e a canhoneira SMS Panther rumando para Agadir, Paris confia em sua aliança com o Império Russo e na Entente Cordiale com os britânicos para rechaçar provocações alemãs."
 WW1_FRA_GATHERING_STORM_DESC:0 "Quarenta anos após a catástrofe da Guerra Franco-Prussiana, a Terceira República Francesa permanece devotada à memória sagrada de 1870 e à redenção das províncias perdidas da Alsácia-Lorena. Presidida por Armand Fallières e sob o ministério de Joseph Caillaux, a França irradia prestígio cultural e lidera um vasto império colonial. O Exército Francês, depositando fé inabalável no espírito ofensivo do 'Élan Vital' e na cadência devastadora do Canon de 75mm modelo 1897, prepara-se para um confronto total. Com tropas francesas mobilizadas no Marrocos e a canhoneira SMS Panther rumando para Agadir, Paris confia em sua aliança com o Império Russo e na Entente Cordiale com os britânicos para rechaçar provocações alemãs."

 # --- Império Russo (Czar Nicolau II) ---
 SOV_GATHERING_STORM_DESC:0 "Sob o cetro autocrático do Czar Nicolau II, o Império Russo experimenta expressiva recuperação após os traumas da Revolução de 1905 e da derrota na Manchúria. Impulsionada pelas reformas agrárias de Pyotr Stolypin e pelo rápido crescimento fabril financiado por capitais franceses, a força econômica e demográfica russa expande-se vigorosamente. Ambiciosos programas de reaparelhamento modernizam o Exército e a Marinha Imperiais, gerando apreensão em Berlim e Viena. Proclamando-se protetora dos povos eslavos e ortodoxos nos Bálcãs, São Petersburgo está convicta de que qualquer nova expansão dos Habsburgos encontrará resposta firme e intransigente do gigante russo."
 WW1_SOV_GATHERING_STORM_DESC:0 "Sob o cetro autocrático do Czar Nicolau II, o Império Russo experimenta expressiva recuperação após os traumas da Revolução de 1905 e da derrota na Manchúria. Impulsionada pelas reformas agrárias de Pyotr Stolypin e pelo rápido crescimento fabril financiado por capitais franceses, a força econômica e demográfica russa expande-se vigorosamente. Ambiciosos programas de reaparelhamento modernizam o Exército e a Marinha Imperiais, gerando apreensão em Berlim e Viena. Proclamando-se protetora dos povos eslavos e ortodoxos nos Bálcãs, São Petersburgo está convicta de que qualquer nova expansão dos Habsburgos encontrará resposta firme e intransigente do gigante russo."

 # --- Reino da Itália (Vítor Emanuel III / Giovanni Giolitti) ---
 ITA_GATHERING_STORM_DESC:0 "O Reino da Itália encontra-se em encruzilhada decisiva sob o Rei Vítor Emanuel III e o Primeiro-Ministro Giovanni Giolitti. Enquanto o triângulo fabril de Milão, Turim e Gênova experimenta expansão acelerada, o sul agrário enfrenta pobreza severa e emigração massiva. Embora vinculada à Tríplice Aliança com a Alemanha e a Áustria-Hungria, Roma preserva paixões irredentistas sobre Trento e Trieste sob jugo austríaco. Buscando afirmar prestígio internacional e saciar o clamor colonialista, o governo italiano prepara a conquista da Tripolitânia e Cirenaica otomanas, elevando as tensões no Mediterrâneo."
