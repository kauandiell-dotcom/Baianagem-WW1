l_braz_por:
 SOV_backward_agrarian_system:0 "Sistema Agrário Retrógrado"
 SOV_backward_agrarian_system_desc:0 "Séculos de cultivo comunal em faixas, arados de madeira medievais e redistribuição periódica da terra pelo Mir mantiveram o campesinato russo empobrecido e faminto por terras."
 SOV_stolypin_reforms_spirit:0 "Reformas Agrárias de Stolypin"
 SOV_stolypin_reforms_spirit_desc:0 "As leis do Primeiro-Ministro Pyotr Stolypin permitem que camponeses deixem a comuna, consolidem propriedades privadas individuais (khutors) e obtenham crédito subsidiado do Banco Agrário Camponês."
 SOV_stolypin_unbroken_reforms:0 "Triunfo das Reformas de Stolypin"
 SOV_stolypin_unbroken_reforms_desc:0 "Com vinte anos de paz ininterrupta e enérgica liderança executiva, o campo russo transforma-se em um bastião de agricultores proprietários prósperos e leais à Coroa."
 SOV_prosperous_kulaks:0 "Camponeses Proprietários Prósperos"
 SOV_prosperous_kulaks_desc:0 "O surgimento de uma próspera classe média rural multiplicou os rendimentos das colheitas, introduziu colheitadeiras modernas e impulsionou o consumo doméstico."
 SOV_private_peasant_ownership:0 "Propriedade Rural Privada"
 SOV_private_peasant_ownership_desc:0 "Garantias constitucionais de propriedade privada sobre o solo agrícola estimularam investimentos em drenagem, fertilizantes e rotação de culturas na bacia de terra negra."
 SOV_siberian_butter_and_grain:0 "Boom Agrícola Siberiano"
 SOV_siberian_butter_and_grain_desc:0 "Milhões de famílias pioneiras reassentadas ao longo da Ferrovia Transiberiana produzem excedentes de manteiga, trigo e rebanhos de renome mundial."
 SOV_peasant_unrest:0 "Descontentamento Camponês Fértil"
 SOV_peasant_unrest_desc:0 "Frustração quanto à redistribuição de terras e ressentimento contra os latifúndios aristocráticos geram hostilidade latente e revoltas esporádicas pelas províncias."
 SOV_agrarian_collapse:0 "Colapso Agrário Total"
 SOV_agrarian_collapse_desc:0 "Revoltas camponesas generalizadas, invasões de terras e confisco de animais de tração paralisaram o abastecimento comercial de comida, precipitando a fome nos centros urbanos."
 SOV_witte_industrialization_legacy:0 "O Legado de Sergei Witte"
 SOV_witte_industrialization_legacy_desc:0 "As ambiciosas políticas industriais do Conde Witte atraíram maciço capital estrangeiro, expandindo a metalurgia pesada e a malha ferroviária russa em ritmo acelerado."
 SOV_witte_gold_standard:0 "O Padrão-Ouro Imperial"
 SOV_witte_gold_standard_desc:0 "O rublo lastreado em ouro assegura o crédito soberano internacional da Rússia, estabiliza as finanças estatais e atrai fluxos contínuos de empréstimos franceses e britânicos."
 SOV_war_industry_mobilization:0 "Conselho Especial de Defesa do Estado"
 SOV_war_industry_mobilization_desc:0 "Coordenação centralizada de contratos fabris, alocações de combustível e requisição de metais assegura o fornecimento contínuo de material bélico às tropas de frente."
 SOV_zemgor_mobilization:0 "Mobilização Cívica do Zemgor"
 SOV_zemgor_mobilization_desc:0 "O comitê conjunto de Zemstvos e Municípios mobiliza oficinas privadas, organiza hospitais de campanha e fabrica milhões de uniformes e projéteis para as tropas."
 SOV_war_communism_regime:0 "Regime de Comunismo de Guerra"
 SOV_war_communism_regime_desc:0 "Requisição compulsória de grãos (Prodrazvyorstka), estatização fabril e militarização do trabalho concentram todos os recursos estatais para a sobrevivência da revolução."
 SOV_war_communism_economy:0 "Economia Proletária Militarizada"
 SOV_war_communism_economy_desc:0 "Racionamento rígido, abolição do comércio privado e distribuição estatal de víveres sustentam o Exército Vermelho em detrimento do consumo civil."
 SOV_denikin_free_market:0 "Restauração da Livre Iniciativa Branca"
 SOV_denikin_free_market_desc:0 "O Conselho Especial das Forças Armadas do Sul da Rússia assegura a propriedade privada, devolve ativos industriais aos seus legítimos donos e restabelece parcerias comerciais internacionais."
 SOV_reconstruction_drive:0 "Grande Esforço de Reconstrução"
 SOV_reconstruction_drive_desc:0 "O foco nacional volta-se para a reconstrução de pontes dinamitadas, restauração de ferrovias e reativação de linhas fabris nas províncias devastadas pela guerra."
 SOV_great_military_program_spirit:0 "O Grande Programa Militar de 1914"
 SOV_great_military_program_spirit_desc:0 "Um colossal plano plurianual de rearmamento destinado a elevar o exército permanente a mais de dois milhões de homens, modernizar a artilharia e expandir ferrovias estratégicas."
 SOV_sukhomlinov_administration:0 "Ministério da Guerra de Sukhomlinov"
 SOV_sukhomlinov_administration_desc:0 "A diplomacia cortesã do General Vladimir Sukhomlinov encobre profunda desorganização administrativa, rivalidades orçamentárias e perigosa escassez de munição de artilharia."
 SOV_stavka_operational_clarity:0 "Centralização Operacional da Stavka"
 SOV_stavka_operational_clarity_desc:0 "A reorganização do Quartel-General Imperial (Stavka) em Mogilev restabelece linhas de comando claras entre as frentes Noroeste e Sudoeste."
 SOV_shell_shortage_crisis:0 "A Grande Crise de Munições (Snaryadny Golod)"
 SOV_shell_shortage_crisis_desc:0 "Baterias de artilharia da linha de frente estão limitadas a meros três tiros diários por peça, expondo a infantaria a violentos bombardeios inimigos sem resposta."
 SOV_brusilov_doctrine_victory:0 "Doutrina de Infiltração de Brusilov"
 SOV_brusilov_doctrine_victory_desc:0 "Abandonando bombardeios prolongados e previsíveis em favor de salvas súbitas e avanços múltiplos simultâneos, a infantaria russa rompe linhas entrincheiradas com facilidade."
 SOV_shock_battalions_spirit:0 "Batalhões da Morte e Tropas de Choque"
 SOV_shock_battalions_spirit_desc:0 "Voluntários veteranos com divisas rubro-negras lideram assaltos a trincheiras inimigas, demonstrando heroísmo destemido para reanimar a coragem ofensiva nas frentes."
 SOV_unbreakable_steamroller:0 "O Rolo Compressor Russo Inabalável"
 SOV_unbreakable_steamroller_desc:0 "Com milhões de soldados treinados, fartura de munições e total confiança do alto-comando, o Império Russo esmaga qualquer oposição no Teatro Oriental."
 SOV_reborn_red_army:0 "Exército Vermelho de Operários e Camponeses"
 SOV_reborn_red_army_desc:0 "Forjado na forja revolucionária sob Leon Trotsky, o Exército Vermelho combina comissários políticos, especialistas czaristas (voenspets) e disciplina de ferro para esmagar seus inimigos."
 SOV_white_martial_law:0 "Lei Marcial do Movimento Branco"
 SOV_white_martial_law_desc:0 "Governadores-militares governam por decreto absoluto, suspendendo tribunais civis e erradicando impiedosamente comitês socialistas e greves na retaguarda."
 SOV_draconian_discipline:0 "Restauração da Pena Capital Militar"
 SOV_draconian_discipline_desc:0 "Tribunais marciais sumários e pelotões de fuzilamento para desertores e agitadores restabelecem a ordem férrea nas trincheiras."
 SOV_vsyur_high_command:0 "Forças Armadas do Sul da Rússia (VSYUR)"
 SOV_vsyur_high_command_desc:0 "O General Anton Denikin unifica o Exército Voluntário, os Cossacos do Don e de Kuban em uma força anticomunista disciplinada em marcha rumo a Moscou."
 SOV_supreme_ruler_regime:0 "Regime do Governante Supremo"
 SOV_supreme_ruler_regime_desc:0 "O Almirante Alexander Kolchak assume autoridade suprema em Omsk, liderando o Estado Russo em uma cruzada pela restauração da 'Rússia Una, Grande e Indivisível'."
 SOV_czech_legion_control_of_transsiberian:0 "Guarnição da Legião Tcheca na Transiberiana"
 SOV_czech_legion_control_of_transsiberian_desc:0 "Legionários veteranos tchecoslovacos guarnecem entroncamentos ferroviários, trens blindados e depósitos de abastecimento cruciais do Volga a Vladivostok."
 SOV_tsarist_autocracy_and_duma:0 "Autocracia Czarista e a Duma Instável"
 SOV_tsarist_autocracy_and_duma_desc:0 "As prerrogativas divinas do Autocrata coexistem em tensão frágil com a Duma de Estado eleita, alimentando constantes atritos entre cortesãos e deputados."
 SOV_rasputin_court_intrigues:0 "A Sombra de Rasputin sobre a Corte"
 SOV_rasputin_court_intrigues_desc:0 "A íntima influência do starets siberiano sobre a Czarina alimenta rumores destrutivos de 'dança ministerial' e traição cortesã, desmoralizando mortalmente a dinastia Romanov."
 SOV_dual_power_dvoevlastie:0 "Dualidade de Poder (Dvoevlastie)"
 SOV_dual_power_dvoevlastie_desc:0 "Paralisia institucional provocada pela disputa entre o Governo Provisório burguês no Palácio de Inverno e o soviete de operários e soldados em Petrogrado."
 SOV_petrograd_order_no_1:0 "Ordem Nº 1 do Soviete de Petrogrado"
 SOV_petrograd_order_no_1_desc:0 "Comitês de soldados eleitos assumem o controle dos armamentos e abolem a continência e patentes, destruindo a disciplina e a cadeia de comando do exército."
 SOV_dictatorship_of_the_proletariat:0 "Ditadura do Proletariado"
 SOV_dictatorship_of_the_proletariat_desc:0 "Todo poder aos Sovietes! A classe trabalhadora e soldados revolucionários exercem controle absoluto para esmagar a contrarrevolução e forjar o socialismo."
 SOV_salvation_directory_rule:0 "Diretório de Salvação Nacional"
 SOV_salvation_directory_rule_desc:0 "Um gabinete executivo emergencial instaurado para evitar o descalabro militar e conter o radicalismo interno até a eleição nacional."
 SOV_constituent_assembly_defense:0 "Soberania da Assembleia Constituinte"
 SOV_constituent_assembly_defense_desc:0 "O parlamento democraticamente eleito encarna a soberania popular e a vontade legítima de todos os cidadãos russos, independente de classe."
 SOV_russian_federal_republic:0 "República Democrática Federal Russa"
 SOV_russian_federal_republic_desc:0 "Uma república constitucional moderna que concede ampla autonomia às minorias nacionais, assegura liberdades civis e protege os direitos trabalhistas."
 SOV_absolute_autocracy_triumphant:0 "Autocracia Absoluta Restaurada"
 SOV_absolute_autocracy_triumphant_desc:0 "O Czar governa com autoridade divina inquestionável. Todas as dissidências parlamentares e radicais foram esmagadas com punho de ferro."
 SOV_enlightened_constitutional_autocracy:0 "Autocracia Constitucional Iluminada"
 SOV_enlightened_constitutional_autocracy_desc:0 "Uma síntese harmoniosa de forte liderança imperial, corpo ministerial tecnocrático e cooperação legislativa construtiva com a Duma de Estado."
 SOV_brest_humiliation:0 "A Humilhação de Brest-Litovsk"
 SOV_brest_humiliation_desc:0 "A perda traumática das províncias ocidentais, celeiros agrícolas e bacias industriais deixa a nação enfraquecida, isolada e ressentida."
 SOV_tsargrad_liberated:0 "Libertação de Tsargrado e dos Estreitos"
 SOV_tsargrad_liberated_desc:0 "O milenar sonho bizantino é coroado: a cruz russa reluz sobre Santa Sofia e a esquadra imperial domina incontestavelmente o Bósforo e os Dardanelos."
 SOV_slavic_brotherhood:0 "Irmandade Eslava e Hegemonia Balcânica"
 SOV_slavic_brotherhood_desc:0 "A Rússia cumpre sua missão histórica de protetora dos povos eslavos e ortodoxos, selando uma aliança indissolúvel sobre os Bálcãs."
 SOV_arctic_lifeline:0 "Linha de Suprimentos do Oceano Ártico"
 SOV_arctic_lifeline_desc:0 "Comboios protegidos por quebra-gelos e a nova ferrovia de Murmansk garantem a entrega ininterrupta de munições aliadas ao coração do Império."
 SOV_arsenal_of_the_russian_state:0 "Arsenal do Estado Russo"
 SOV_arsenal_of_the_russian_state_desc:0 "Oficinas estatais e indústrias privadas operam em turnos ininterruptos, entregando centenas de milhares de projéteis e fuzis às frentes de batalha."
 SOV_triumph_of_pan_slavism:0 "Triunfo do Pan-Eslavismo"
 SOV_triumph_of_pan_slavism_desc:0 "A libertação e confederação das nações eslavas sob a liderança russa redesenha permanentemente o mapa geopolítico da Europa Central e Balcânica."
 SOV_modern_broad_gauge_network:0 "Rede Ferroviária de Bitola Larga Modernizada"
 SOV_modern_broad_gauge_network_desc:0 "Linhas duplas, locomotivas de grande porte e entroncamentos modernizados permitem o deslocamento estratégico de corpos de exército com velocidade ímpar."
SOV_goremykin_reactionary_cabinet:0 "Gabinete Reacionário de Goremykin"
 SOV_goremykin_reactionary_cabinet_desc:0 "O idoso Primeiro-Ministro Goremykin lidera uma administração paralisada que resiste a cooperar com a Duma."
 SOV_progressive_coalition_cabinet:0 "Gabinete de Coalizão Progressista"
 SOV_progressive_coalition_cabinet_desc:0 "Uma ampla coalizão de figuras públicas, industriais e delegados da Duma trabalhando para mobilizar a nação."
 SOV_petrograd_soviet_order_no_1:0 "Ordem nº 1 do Soviete de Petrogrado"
 SOV_petrograd_soviet_order_no_1_desc:0 "Comitês de soldados e o poder dual paralisam a autoridade dos oficiais e minam a disciplina."
 SOV_land_socialization_decree:0 "Decreto de Socialização da Terra"
 SOV_land_socialization_decree_desc:0 "A transferência de latifúndios para sovietes agrários realiza o sonho secular de terra e liberdade."
 SOV_all_russian_cheka:0 "Comissão Extraordinária de Toda a Rússia (Cheka)"
 SOV_all_russian_cheka_desc:0 "A espada e o escudo revolucionários contra a contra-revolução, sabotagem e espionagem."
 SOV_declaration_rights_peoples:0 "Declaração dos Direitos dos Povos da Rússia"
 SOV_declaration_rights_peoples_desc:0 "Garante autodeterminação, autonomia e igualdade cultural para todas as nações do império."
 SOV_black_hundreds_paramilitaries:0 "Legiões Armadas da Centúria Negra"
 SOV_black_hundreds_paramilitaries_desc:0 "Legiões monarquistas ferozmente leais patrulham as ruas para esmagar agitadores revolucionários."
 SOV_divine_autocracy:0 "Autocracia Sagrada Restaurada"
 SOV_divine_autocracy_desc:0 "Nicolau II governa como o soberano divinamente ungido sobre a Santa Mãe Rússia."
 SOV_imperial_secret_police:0 "Okhrana Imperial Purificada"
 SOV_imperial_secret_police_desc:0 "Vigilância implacável e contra-insurgência protegem o trono imperial de conspirações."
 SOV_undivided_autocratic_will:0 "Vontade Autocrática Indivisa"
 SOV_undivided_autocratic_will_desc:0 "A dissolução da Duma elimina os entraves parlamentares aos decretos imperiais diretos."
 SOV_sacred_romanov_autocracy:0 "Sagrada Dinastia Romanov"
 SOV_sacred_romanov_autocracy_desc:0 "Trezentos anos de soberania dos Romanov permanecem inabaláveis e vitoriosos."
 SOV_grain_procurement_system:0 "Requisição Centralizada de Grãos"
 SOV_grain_procurement_system_desc:0 "O monopólio estatal sobre excedentes agrícolas garante o abastecimento de depósitos militares e operários fabris."
 SOV_defender_of_orthodox_christendom:0 "Defensor da Cristandade Ortodoxa"
 SOV_defender_of_orthodox_christendom_desc:0 "O Império Russo ergue-se como o legítimo escudo protetor de todos os povos ortodoxos."
 SOV_shield_of_the_slavs:0 "Escudo dos Eslavos do Sul"
 SOV_shield_of_the_slavs_desc:0 "A Rússia jamais permitirá que a Áustria-Hungria aniquile a independência sérvia."
 SOV_pan_slavic_patronage:0 "Patronato Pan-Eslavo"
 SOV_pan_slavic_patronage_desc:0 "Garantias diplomáticas e militares unem os povos eslavos sob a liderança fraterna da Rússia."
 GER_wartime_rationing_spirit:0 "Racionamento em Tempo de Guerra (Kriegsbrot)"
 GER_wartime_rationing_spirit_desc:0 "Racionamento estatal estrito de farinha e gêneros alimentícios protege as reservas civis sob o bloqueio naval."
 GER_kaiserliche_weltmacht:0 "Kaiserliche Weltmacht"
 GER_kaiserliche_weltmacht_desc:0 "O lugar da Alemanha ao sol fica permanentemente consolidado pela vitória militar decisiva."
 GER_democratic_franchise_reform:0 "Sufrágio Universal Igualitário"
 GER_democratic_franchise_reform_desc:0 "A abolição do arcaico sistema de voto das três classes na Prússia estabelece a verdadeira democracia representativa."
 GER_democratic_legitimacy:0 "Legitimidade Parlamentar Democrática"
 GER_democratic_legitimacy_desc:0 "O Reichstag e o Kaiser governam em harmonia constitucional representativa."
 SOV_polivanov_staff_reforms:0 "Reformas Ministeriais de Polivanov"
 SOV_polivanov_staff_reforms_desc:0 "Após a demissão de Sukhomlinov, o General Alexei Polivanov coopera ativamente com a Duma e a indústria de defesa, desatando gargalos burocráticos e restaurando a eficiência do estado-maior."
 SOV_sukhomlinov_administration_tier2:0 "Reorganização Inicial do Exército"
 SOV_sukhomlinov_administration_tier2_desc:0 "As primeiras diretrizes de corpos de exército de Sukhomlinov começaram a padronizar as divisões e simplificar o recrutamento, aliviando parcialmente o caos de comando, embora a artilharia e o planejamento estratégico ainda sofram lentidão."
 SOV_sukhomlinov_administration_tier3:0 "Modernização dos Distritos Militares"
 SOV_sukhomlinov_administration_tier3_desc:0 "A reestruturação da Rússia Europeia em distritos militares unificados com logística integrada restaurou o moral tático das tropas e reduziu pela metade os atrasos de mobilização."
 SOV_modern_imperial_general_staff:0 "Estado-Maior Geral Imperial Modernizado"
 SOV_modern_imperial_general_staff_desc:0 "Através de reformas metódicas de pré-guerra, modernização doutrinária e coordenação de comando, o Exército Imperial Russo eliminou a paralisia burocrática e estabeleceu um alto comando ágil e contemporâneo."
 SOV_shell_shortage_stage_2:0 "Fome de Projéteis: Mobilização Industrial"
 SOV_shell_shortage_stage_2_desc:0 "Graças ao Conselho Especial de Defesa e aos Comitês de Indústria de Guerra (VPK), a produção bélica interna dispara, reduzindo gradualmente a escassez de munição nas baterias."
 SOV_shell_shortage_stage_3:0 "Fome de Projéteis: Linha de Suprimento Ártica"
 SOV_shell_shortage_stage_3_desc:0 "O fluxo de munições aliadas por Arkhangelsk e pela ferrovia de Murmansk ameniza o déficit crítico, restando apenas pequenas limitações na artilharia pesada."
 SOV_vpk_mobilization_spirit:0 "Comitês de Indústria de Guerra (VPK)"
 SOV_vpk_mobilization_spirit_desc:0 "Empresas privadas e oficinas municipais são convertidas sob contratos emergenciais do Estado para suprir a frente com projéteis e munições."
 SOV_strategic_depth_and_rasputitsa:0 "Profundidade Estratégica e a Rasputitsa"
 SOV_strategic_depth_and_rasputitsa_desc:0 "A colossal profundidade territorial do Império Russo e a lama sazonal da rasputitsa transformam qualquer invasão inimiga em um pesadelo logístico extenuante. Exércitos invasores são inexoravelmente desgastados por distâncias infinitas, pelo inverno rigoroso e por atoleiros intransponíveis."
 SOV_order_restored_spirit:0 "Triunfo da Ordem Imperial"
 SOV_order_restored_spirit_desc:0 "Por meio da vigilância administrativa rigorosa, logística alimentar decisiva e inabalável lealdade na linha de frente, a conspiração revolucionária foi sufocada. O trono está seguro e a ordem reina em todo o império."
 SOV_aviation_school_program:0 "Escolas de Oficiais da Aviação Imperial"
 SOV_aviation_school_program_desc:0 "Programas padronizados de instrução aeronáutica em Gatchina e Sebastopol preparam pilotos em táticas aéreas, manutenção de motores e navegação em combate."
 SOV_aviation_combat_school:0 "Academia de Voo de Combate Avançado"
 SOV_aviation_combat_school_desc:0 "Manobras intensivas de combate aéreo, táticas de formação e treinamento com tiro real para os aviadores militares russos."
 SOV_ace_training_system:0 "Doutrina de Ases Imperiais"
 SOV_ace_training_system_desc:0 "Estimulando a iniciativa individual dos pilotos e a pontaria aérea agressiva inspirada em ases lendários como Alexander Kazakov."
 SOV_aerial_recon_network:0 "Rede de Reconhecimento Aéreo de Corpos"
 SOV_aerial_recon_network_desc:0 "Fotografia aérea sistemática e esquadrões de observação de artilharia subordinados diretamente aos quartéis-generais de corpo de exército fornecem inteligência em tempo real."
 SOV_air_naval_coordination:0 "Coordenação Aeronaval do Mar Negro"
 SOV_air_naval_coordination_desc:0 "Navios porta-hidroaviões e patrulhas marítimas coordenando bombardeios navais de longo alcance contra baterias costeiras otomanas e fortificações do Bósforo."
 SOV_integrated_air_service:0 "Frota Aérea Militar Imperial (EVF)"
 SOV_integrated_air_service_desc:0 "Uma força aérea autônoma e totalmente integrada, munida de bombardeiros pesados Ilya Muromets, batedores e esquadrões de caça operando sob comando centralizado."
 SOV_southwestern_preparation:0 "Preparação para a Ofensiva do Sudoeste"
 SOV_southwestern_preparation_desc:0 "Os preparativos meticulosamente organizados do General Brusilov, cavando trincheiras de aproximação próximas às linhas austro-húngaras e treinando formações de choque."
 SOV_southwestern_offensive:0 "A Ruptura de Brusilov"
 SOV_southwestern_offensive_desc:0 "Ataques de choque simultâneos ao longo de toda a Frente Sudoeste, despedaçando o Quarto e Sétimo Exércitos Austro-Húngaros em um golpe tático brilhante."
 SOV_southwestern_exhaustion:0 "Exaustão Pós-Ruptura"
 SOV_southwestern_exhaustion_desc:0 "Baixas severas e esgotamento logístico após operações intensivas na Galícia e Volínia exigem consolidação operacional."
 SOV_serbian_medical_mission:0 "Cruz Vermelha Imperial Russa na Sérvia"
 SOV_serbian_medical_mission_desc:0 "Destacamentos médicos, hospitais de campanha e missões contra epidemias auxiliando as forças aliadas sérvias na frente dos Bálcãs em fraternidade cristã."
 WHT_provisional_all_russian_government:0 "Governo Provisório de Toda a Rússia"
 WHT_provisional_all_russian_government_desc:0 "Autoridade legítima soberana que reivindica a representação e a integridade de todos os povos e terras do antigo Império Russo."
 WHT_trans_siberian_artery:0 "Artéria Transiberiana"
 WHT_trans_siberian_artery_desc:0 "Trens contínuos pela malha transiberiana trazem suprimentos dos portos do Extremo Oriente até a linha de frente nos Urais."
 WHT_supreme_ruler_authority:0 "Autoridade do Governante Supremo"
 WHT_supreme_ruler_authority_desc:0 "O mandato extraordinário do Almirante Kolchak centraliza poderes cívicos e de comando para a defesa incondicional da pátria."
 WHT_ice_march_heroism:0 "Espírito da Marcha do Gelo"
 WHT_ice_march_heroism_desc:0 "A determinação demonstrada nas marchas iniciais de inverno inspira os voluntários brancos com firme disposição de combate."
 WHT_volunteer_officer_spirit:0 "Abnegação dos Oficiais Voluntários"
 WHT_volunteer_officer_spirit_desc:0 "Batalhões inteiros de oficiais combatem nas trincheiras como soldados rasos, oferecendo excelente capacidade de choque."
 WHT_denikin_general_command:0 "Alto Comando Geral de Denikin"
 WHT_denikin_general_command_desc:0 "Planejamento meticuloso e doutrina militar metódica coordenando o avanço simultâneo de corpos de exército rumo ao coração da Rússia."
 WHT_cossack_allegiance:0 "Aliança com as Hostes Cossacas"
 WHT_cossack_allegiance_desc:0 "Cavaleiros cossacos exímios dominam as estepes e desferem golpes devastadores contra as linhas de retaguarda adversárias."
 WHT_shock_officer_regiments:0 "Regimentos Coloridos de Choque"
 WHT_shock_officer_regiments_desc:0 "As formações Kornilov, Markov e Drozdovsky encabeçam os ataques mais difíceis com admirável valentia."
 WHT_moscow_directive_spirit:0 "O Ímpeto da Diretriz de Moscou"
 WHT_moscow_directive_spirit_desc:0 "Todas as tropas e provisões estão focadas em uma única grande meta: a redenção da sagrada capital Moscou."
 WHT_wrangel_agrarian_order:0 "Ordem Agrária de Wrangel"
 WHT_wrangel_agrarian_order_desc:0 "Diretrizes rurais pragmáticas conquistam o apoio da população camponesa e asseguram mantimentos para o exército."
 WHT_reorganized_russian_army:0 "Exército Russo Reorganizado"
 WHT_reorganized_russian_army_desc:0 "Oficialidade profissionalizada, padronização de suprimentos e disciplina rigorosa sob a chefia do General Barão Wrangel."
 WHT_british_military_mission:0 "Cooperação Militar Britânica"
 WHT_british_military_mission_desc:0 "Remessas generosas de uniformes, fuzis Lee-Enfield e oficiais de ligação elevam a prontidão operacional de nossas forças."
 WHT_french_munitions_pipeline:0 "Abastecimento Bélico Francês"
 WHT_french_munitions_pipeline_desc:0 "Embarcações francesas fornecem munições de artilharia pesada e peças sobressalentes pelos portos do Mar Negro."
 WHT_stevens_railway_mission:0 "Missão Ferroviária Americana de Stevens"
 WHT_stevens_railway_mission_desc:0 "Engenheiros americanos recuperam locomotivas e aprimoram a velocidade das composições que cruzam a Sibéria."
 WHT_entente_diplomatic_recognition:0 "Reconhecimento Diplomático da Entente"
 WHT_entente_diplomatic_recognition_desc:0 "Tratativas com o Conselho Supremo de Guerra Aliado afiançam reconhecimento externo e linhas de crédito financeiro."
 WHT_arsenal_of_democracy_aid:0 "Entregas de Material Bélico Aliado"
 WHT_arsenal_of_democracy_aid_desc:0 "Carretas, armas de apoio e peças industriais desembarcam ininterruptamente em nossos ancoradouros."
 WHT_russia_one_and_indivisible_spirit:0 "Rússia, Una e Indivisível"
 WHT_russia_one_and_indivisible_spirit_desc:0 "Defesa irredutível da unidade territorial e da dignidade soberana do Estado Russo."
 WHT_republican_constitution:0 "Legitimidade Republicana Constitucional"
 WHT_republican_constitution_desc:0 "Compromisso formal com o sufrágio universal, garantias civis e um parlamento representativo soberano."
 WHT_supreme_military_dictate:0 "Ditadura Militar Inflexível"
 WHT_supreme_military_dictate_desc:0 "Comando autocrático de emergência para manter a ordem pública e suprimir sabotagens de guerra."
 WHT_restored_state_gendarmerie:0 "Segurança Estatal e Gendarmaria"
 WHT_restored_state_gendarmerie_desc:0 "Agentes vigilantes contêm infiltrações extremistas e mantêm a tranquilidade nas cidades libertadas."
 WHT_crowned_regency:0 "Regência Coroada"
 WHT_crowned_regency_desc:0 "Um conselho tradicional prepara os caminhos para a restauração da legítima monarquia russa."
 WHT_holy_orthodox_symphonia:0 "Sinfonia Espiritual Ortodoxa"
 WHT_holy_orthodox_symphonia_desc:0 "Concórdia harmoniosa entre a autoridade religiosa e a governança estatal reaviva os valores tradicionais da nação."
 SOV_duma_and_court_politics:0 "Duma Imperial e Política da Corte"
 SOV_duma_and_court_politics_desc:0 "Gerenciar as relações entre a Duma de Estado, o Conselho de Estado conservador e a Corte Imperial."
 SOV_convene_imperial_duma:0 "Convocar a Duma de Estado Imperial"
 SOV_convene_imperial_duma_desc:0 "Convocar a sessão da Duma de Estado para fortalecer a unidade nacional e debater dotações orçamentárias de guerra."
 SOV_prorogue_the_duma:0 "Dissolver Temporariamente a Duma"
 SOV_prorogue_the_duma_desc:0 "Emitir um ukase imperial suspendendo temporariamente a Duma para conter discursos subversivos e críticas liberais."
 SOV_conspiracy_rasputin:0 "Remover Intrigas da Corte"
 SOV_conspiracy_rasputin_desc:0 "Expurgar a influência de cortesãos irresponsáveis e confidentes sombrios da residência imperial."
 SOV_establish_vpk_committees:0 "Estabelecer Comitês Regionais do VPK"
 SOV_establish_vpk_committees_desc:0 "Organizar comitês regionais de indústrias bélicas para coordenar fábricas e subcontratar produção de obuses."
 SOV_mobilize_machine_shops:0 "Converter Oficinas Privadas em Munições"
 SOV_mobilize_machine_shops_desc:0 "Reequipar oficinas metalúrgicas provinciais para a confecção de estojos e espoletas de artilharia."
 SOV_zemgor_medical_union:0 "Apoiar a União Zemgor"
 SOV_zemgor_medical_union_desc:0 "Financiar o comitê conjunto de Zemstvos e Câmaras Municipais para fornecer trens hospitalares e suprimentos."
 SOV_british_shell_presses:0 "Adquirir Prensas de Obuses Britânicas"
 SOV_british_shell_presses_desc:0 "Importar modernas prensas hidráulicas e maquinário de usinagem britânicos via Arcângel."
 SOV_evacuate_industrial_machinery:0 "Evacuar Maquinário Industrial Ocidental"
 SOV_evacuate_industrial_machinery_desc:0 "Desmontar maquinário fabril e material rodante ferroviário de províncias ocidentais ameaçadas e realocá-los a leste."
 SOV_prepare_southwestern_offensive:0 "Preparar a Ofensiva da Frente Sudoeste"
 SOV_prepare_southwestern_offensive_desc:0 "Estocar munição de artilharia, concentrar corpos de choque e planejar rupturas de surpresa nas linhas da Galícia."
