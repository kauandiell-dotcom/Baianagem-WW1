l_braz_por:
 SOV_backward_agrarian_system:0 "Sistema Agrário Retrógrado"
 SOV_backward_agrarian_system_desc:0 "Séculos de cultivo comunal em faixas, arados de madeira medievais e redistribuição periódica da terra pelo Mir mantiveram o campesinato russo empobrecido e faminto por terras."
 SOV_stolypin_reforms_spirit:0 "Reformas Agrárias de Stolypin"
 SOV_stolypin_reforms_spirit_desc:0 "As leis do Primeiro-Ministro Pyotr Stolypin permitem que camponeses deixem a comuna, consolidem propriedades privadas individuais (khutors) e obtenham crédito subsidiado do Banco Agrário Camponês."
 SOV_stolypin_unbroken_reforms:0 "Triunfo das Reformas de Stolypin"
 SOV_stolypin_unbroken_reforms_desc:0 "Com vinte anos de paz ininterrupta e enérgica liderança executiva, o campo russo transforma-se em um bastião de agricultores proprietários prósperos e leais à Coroa."
 SOV_prosperous_kulaks:0 "Camponeses Proprietários Prósperos"
 SOV_prosperous_kulaks_desc:0 "O surgimento de uma próspera classe média rural multiplicou os rendimentos das colheitas, introduziu colheitadeiras modernas e impulsionou o consumo doméstico."
 SOV_private_peasant_ownership:0 "Propriedade Rural Privada"
 SOV_private_peasant_ownership_desc:0 "Garantias constitucionais de propriedade privada sobre o solo agrícola estimularam investimentos em drenagem, fertilizantes e rotação de culturas na bacia de terra negra."
 SOV_siberian_butter_and_grain:0 "Boom Agrícola Siberiano"
 SOV_siberian_butter_and_grain_desc:0 "Milhões de famílias pioneiras reassentadas ao longo da Ferrovia Transiberiana produzem excedentes de manteiga, trigo e rebanhos de renome mundial."
 SOV_peasant_unrest:0 "Descontentamento Camponês Fértil"
 SOV_peasant_unrest_desc:0 "Frustração quanto à redistribuição de terras e ressentimento contra os latifúndios aristocráticos geram hostilidade latente e revoltas esporádicas pelas províncias."
 SOV_agrarian_collapse:0 "Colapso Agrário Total"
 SOV_agrarian_collapse_desc:0 "Revoltas camponesas generalizadas, invasões de terras e confisco de animais de tração paralisaram o abastecimento comercial de comida, precipitando a fome nos centros urbanos."
 SOV_witte_industrialization_legacy:0 "O Legado de Sergei Witte"
 SOV_witte_industrialization_legacy_desc:0 "As ambiciosas políticas industriais do Conde Witte atraíram maciço capital estrangeiro, expandindo a metalurgia pesada e a malha ferroviária russa em ritmo acelerado."
 SOV_witte_gold_standard:0 "O Padrão-Ouro Imperial"
 SOV_witte_gold_standard_desc:0 "O rublo lastreado em ouro assegura o crédito soberano internacional da Rússia, estabiliza as finanças estatais e atrai fluxos contínuos de empréstimos franceses e britânicos."
 SOV_war_industry_mobilization:0 "Conselho Especial de Defesa do Estado"
 SOV_war_industry_mobilization_desc:0 "Coordenação centralizada de contratos fabris, alocações de combustível e requisição de metais assegura o fornecimento contínuo de material bélico às tropas de frente."
 SOV_zemgor_mobilization:0 "Mobilização Cívica do Zemgor"
 SOV_zemgor_mobilization_desc:0 "O comitê conjunto de Zemstvos e Municípios mobiliza oficinas privadas, organiza hospitais de campanha e fabrica milhões de uniformes e projéteis para as tropas."
 SOV_war_communism_regime:0 "Regime de Comunismo de Guerra"
 SOV_war_communism_regime_desc:0 "Requisição compulsória de grãos (Prodrazvyorstka), estatização fabril e militarização do trabalho concentram todos os recursos estatais para a sobrevivência da revolução."
 SOV_war_communism_economy:0 "Economia Proletária Militarizada"
 SOV_war_communism_economy_desc:0 "Racionamento rígido, abolição do comércio privado e distribuição estatal de víveres sustentam o Exército Vermelho em detrimento do consumo civil."
 SOV_denikin_free_market:0 "Restauração da Livre Iniciativa Branca"
 SOV_denikin_free_market_desc:0 "O Conselho Especial das Forças Armadas do Sul da Rússia assegura a propriedade privada, devolve ativos industriais aos seus legítimos donos e restabelece parcerias comerciais internacionais."
 SOV_reconstruction_drive:0 "Grande Esforço de Reconstrução"
 SOV_reconstruction_drive_desc:0 "O foco nacional volta-se para a reconstrução de pontes dinamitadas, restauração de ferrovias e reativação de linhas fabris nas províncias devastadas pela guerra."
 SOV_great_military_program_spirit:0 "O Grande Programa Militar de 1914"
 SOV_great_military_program_spirit_desc:0 "Um colossal plano plurianual de rearmamento destinado a elevar o exército permanente a mais de dois milhões de homens, modernizar a artilharia e expandir ferrovias estratégicas."
 SOV_sukhomlinov_administration:0 "Ministério da Guerra de Sukhomlinov"
 SOV_sukhomlinov_administration_desc:0 "A diplomacia cortesã do General Vladimir Sukhomlinov encobre profunda desorganização administrativa, rivalidades orçamentárias e perigosa escassez de munição de artilharia."
 SOV_stavka_operational_clarity:0 "Centralização Operacional da Stavka"
 SOV_stavka_operational_clarity_desc:0 "A reorganização do Quartel-General Imperial (Stavka) em Mogilev restabelece linhas de comando claras entre as frentes Noroeste e Sudoeste."
 SOV_shell_shortage_crisis:0 "A Grande Crise de Munições (Snaryadny Golod)"
 SOV_shell_shortage_crisis_desc:0 "Baterias de artilharia da linha de frente estão limitadas a meros três tiros diários por peça, expondo a infantaria a violentos bombardeios inimigos sem resposta."
 SOV_brusilov_doctrine_victory:0 "Doutrina de Infiltração de Brusilov"
 SOV_brusilov_doctrine_victory_desc:0 "Abandonando bombardeios prolongados e previsíveis em favor de salvas súbitas e avanços múltiplos simultâneos, a infantaria russa rompe linhas entrincheiradas com facilidade."
 SOV_shock_battalions_spirit:0 "Batalhões da Morte e Tropas de Choque"
 SOV_shock_battalions_spirit_desc:0 "Voluntários veteranos com divisas rubro-negras lideram assaltos a trincheiras inimigas, demonstrando heroísmo destemido para reanimar a coragem ofensiva nas frentes."
 SOV_unbreakable_steamroller:0 "O Rolo Compressor Russo Inabalável"
 SOV_unbreakable_steamroller_desc:0 "Com milhões de soldados treinados, fartura de munições e total confiança do alto-comando, o Império Russo esmaga qualquer oposição no Teatro Oriental."
 SOV_reborn_red_army:0 "Exército Vermelho de Operários e Camponeses"
 SOV_reborn_red_army_desc:0 "Forjado na forja revolucionária sob Leon Trotsky, o Exército Vermelho combina comissários políticos, especialistas czaristas (voenspets) e disciplina de ferro para esmagar seus inimigos."
 SOV_white_martial_law:0 "Lei Marcial do Movimento Branco"
 SOV_white_martial_law_desc:0 "Governadores-militares governam por decreto absoluto, suspendendo tribunais civis e erradicando impiedosamente comitês socialistas e greves na retaguarda."
 SOV_draconian_discipline:0 "Restauração da Pena Capital Militar"
 SOV_draconian_discipline_desc:0 "Tribunais marciais sumários e pelotões de fuzilamento para desertores e agitadores restabelecem a ordem férrea nas trincheiras."
 SOV_vsyur_high_command:0 "Forças Armadas do Sul da Rússia (VSYUR)"
 SOV_vsyur_high_command_desc:0 "O General Anton Denikin unifica o Exército Voluntário, os Cossacos do Don e de Kuban em uma força anticomunista disciplinada em marcha rumo a Moscou."
 SOV_supreme_ruler_regime:0 "Regime do Governante Supremo"
 SOV_supreme_ruler_regime_desc:0 "O Almirante Alexander Kolchak assume autoridade suprema em Omsk, liderando o Estado Russo em uma cruzada pela restauração da 'Rússia Una, Grande e Indivisível'."
 SOV_czech_legion_control_of_transsiberian:0 "Guarnição da Legião Tcheca na Transiberiana"
 SOV_czech_legion_control_of_transsiberian_desc:0 "Legionários veteranos tchecoslovacos guarnecem entroncamentos ferroviários, trens blindados e depósitos de abastecimento cruciais do Volga a Vladivostok."
 SOV_tsarist_autocracy_and_duma:0 "Autocracia Czarista e a Duma Instável"
 SOV_tsarist_autocracy_and_duma_desc:0 "As prerrogativas divinas do Autocrata coexistem em tensão frágil com a Duma de Estado eleita, alimentando constantes atritos entre cortesãos e deputados."
 SOV_rasputin_court_intrigues:0 "A Sombra de Rasputin sobre a Corte"
 SOV_rasputin_court_intrigues_desc:0 "A íntima influência do starets siberiano sobre a Czarina alimenta rumores destrutivos de 'dança ministerial' e traição cortesã, desmoralizando mortalmente a dinastia Romanov."
 SOV_dual_power_dvoevlastie:0 "Dualidade de Poder (Dvoevlastie)"
 SOV_dual_power_dvoevlastie_desc:0 "Paralisia institucional provocada pela disputa entre o Governo Provisório burguês no Palácio de Inverno e o soviete de operários e soldados em Petrogrado."
 SOV_petrograd_order_no_1:0 "Ordem Nº 1 do Soviete de Petrogrado"
 SOV_petrograd_order_no_1_desc:0 "Comitês de soldados eleitos assumem o controle dos armamentos e abolem a continência e patentes, destruindo a disciplina e a cadeia de comando do exército."
 SOV_dictatorship_of_the_proletariat:0 "Ditadura do Proletariado"
 SOV_dictatorship_of_the_proletariat_desc:0 "Todo poder aos Sovietes! A classe trabalhadora e soldados revolucionários exercem controle absoluto para esmagar a contrarrevolução e forjar o socialismo."
 SOV_salvation_directory_rule:0 "Diretório de Salvação Nacional"
 SOV_salvation_directory_rule_desc:0 "Um gabinete executivo emergencial instaurado para evitar o descalabro militar e conter o radicalismo interno até a eleição nacional."
 SOV_constituent_assembly_defense:0 "Soberania da Assembleia Constituinte"
 SOV_constituent_assembly_defense_desc:0 "O parlamento democraticamente eleito encarna a soberania popular e a vontade legítima de todos os cidadãos russos, independente de classe."
 SOV_russian_federal_republic:0 "República Democrática Federal Russa"
 SOV_russian_federal_republic_desc:0 "Uma república constitucional moderna que concede ampla autonomia às minorias nacionais, assegura liberdades civis e protege os direitos trabalhistas."
 SOV_absolute_autocracy_triumphant:0 "Autocracia Absoluta Restaurada"
 SOV_absolute_autocracy_triumphant_desc:0 "O Czar governa com autoridade divina inquestionável. Todas as dissidências parlamentares e radicais foram esmagadas com punho de ferro."
 SOV_enlightened_constitutional_autocracy:0 "Autocracia Constitucional Iluminada"
 SOV_enlightened_constitutional_autocracy_desc:0 "Uma síntese harmoniosa de forte liderança imperial, corpo ministerial tecnocrático e cooperação legislativa construtiva com a Duma de Estado."
 SOV_brest_humiliation:0 "A Humilhação de Brest-Litovsk"
 SOV_brest_humiliation_desc:0 "A perda traumática das províncias ocidentais, celeiros agrícolas e bacias industriais deixa a nação enfraquecida, isolada e ressentida."
 SOV_tsargrad_liberated:0 "Libertação de Tsargrado e dos Estreitos"
 SOV_tsargrad_liberated_desc:0 "O milenar sonho bizantino é coroado: a cruz russa reluz sobre Santa Sofia e a esquadra imperial domina incontestavelmente o Bósforo e os Dardanelos."
 SOV_slavic_brotherhood:0 "Irmandade Eslava e Hegemonia Balcânica"
 SOV_slavic_brotherhood_desc:0 "A Rússia cumpre sua missão histórica de protetora dos povos eslavos e ortodoxos, selando uma aliança indissolúvel sobre os Bálcãs."
 SOV_arctic_lifeline:0 "Linha de Suprimentos do Oceano Ártico"
 SOV_arctic_lifeline_desc:0 "Comboios protegidos por quebra-gelos e a nova ferrovia de Murmansk garantem a entrega ininterrupta de munições aliadas ao coração do Império."
 SOV_arsenal_of_the_russian_state:0 "Arsenal do Estado Russo"
 SOV_arsenal_of_the_russian_state_desc:0 "Oficinas estatais e indústrias privadas operam em turnos ininterruptos, entregando centenas de milhares de projéteis e fuzis às frentes de batalha."
 SOV_triumph_of_pan_slavism:0 "Triunfo do Pan-Eslavismo"
 SOV_triumph_of_pan_slavism_desc:0 "A libertação e confederação das nações eslavas sob a liderança russa redesenha permanentemente o mapa geopolítico da Europa Central e Balcânica."
 SOV_modern_broad_gauge_network:0 "Rede Ferroviária de Bitola Larga Modernizada"
 SOV_modern_broad_gauge_network_desc:0 "Linhas duplas, locomotivas de grande porte e entroncamentos modernizados permitem o deslocamento estratégico de corpos de exército com velocidade ímpar."
