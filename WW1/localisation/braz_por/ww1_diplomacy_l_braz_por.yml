l_braz_por:
 ww1_diplomacy.1.t:0 "A Alemanha Emite o Cheque em Branco"
 ww1_diplomacy.1.d:0 "O Governo Imperial Alemão assegurou à Monarquia Dual a fidelidade incondicional da Alemanha sob todas as circunstâncias. O Chanceler Bethmann-Hollweg e o General von Moltke pedem ação enérgica contra o terrorismo sérvio."
 ww1_diplomacy.1.a:0 "Entregar o Ultimato de Julho a Belgrado!"
 ww1_diplomacy.1.b:0 "Desarmar a crise pela via diplomática."

 ww1_diplomacy.2.t:0 "O Ultimato Austro-Húngaro"
 ww1_diplomacy.2.d:0 "O embaixador austro-húngaro em Belgrado entregou um ultimato com 10 exigências severas, cobrando que oficiais austríacos assumam o controle direto dos órgãos policiais e judiciais sérvios para esmagar a agitação anti-Habsburgo."
 ww1_diplomacy.2.a:0 "Rejeitar o ultimato! Apelar aos nossos irmãos russos!"
 ww1_diplomacy.2.b:0 "Capitular perante as exigências de Viena."

 ww1_diplomacy.3.t:0 "A Áustria-Hungria Mobiliza"
 ww1_diplomacy.3.d:0 "Nossos aliados em Viena mantiveram-se firmes, entregando o ultimato à Sérvia e mobilizando suas forças ao longo do Danúbio."
 ww1_diplomacy.3.a:0 "A lealdade dos Nibelungos nos une."

 ww1_diplomacy.4.t:0 "Viena Recua"
 ww1_diplomacy.4.d:0 "O Gabinete de Viena recusou o confronto militar e escolheu negociar. A crise nos Bálcãs refluiu."
 ww1_diplomacy.4.a:0 "Uma oportunidade perdida de ação decisiva."

 ww1_diplomacy.5.t:0 "A Sérvia Sob Ataque!"
 ww1_diplomacy.5.d:0 "A artilharia austro-húngara iniciou o bombardeio de Belgrado! O Príncipe Regente Alexandre e o governo sérvio apelam desesperadamente ao Czar Nicolau II para defender a independência eslava."
 ww1_diplomacy.5.a:0 "Mobilização Geral! A Rússia jamais abandonará a Sérvia!"
 ww1_diplomacy.5.b:0 "A Rússia não tem condições de travar uma guerra continental. Devemos recuar."

 ww1_diplomacy.10.t:0 "O Telegrama Zimmermann"
 ww1_diplomacy.10.d:0 "Um telegrama ultrassecreto do Chanceler alemão Arthur Zimmermann chegou por vias diplomáticas. A Alemanha propõe aliança militar com o México, prometendo ouro e a devolução do Texas, Novo México e Arizona."
 ww1_diplomacy.10.a:0 "O Presidente Carranza recusa a oferta como suicida."
 ww1_diplomacy.10.b:0 "Aceitar a aliança alemã! Reconquistar nossos territórios perdidos!"

 ww1_diplomacy.11.t:0 "O Telegrama Zimmermann Exposto!"
 ww1_diplomacy.11.d:0 "A inteligência naval britânica na Sala 40 interceptou e decifrou o telegrama em que a Alemanha oferecia ao México uma aliança militar contra os Estados Unidos!"
 ww1_diplomacy.11.a:0 "Uma afronta intolerável! Preparar para a guerra!"

 ww1_diplomacy.20.t:0 "Lenin Desembarca na Estação Finlândia"
 ww1_diplomacy.20.d:0 "Vladimir Lenin e sua comitiva bolchevique chegam a Petrogrado a bordo de um trem blindado facilitado pelo Estado-Maior alemão. Lenin proclama suas Teses de Abril: 'Todo o Poder aos Sovietes'!"
 ww1_diplomacy.20.a:0 "A centelha revolucionária foi acesa!"

 ww1_diplomacy.30.t:0 "A Rússia Soviética Pede a Paz"
 ww1_diplomacy.30.d:0 "Uma delegação soviética liderada por Leon Trotsky e Adolph Joffe chega a Brest-Litovsk, solicitando cessar-fogo imediato e termos de paz com os Impérios Centrais."
 ww1_diplomacy.30.a:0 "Ditar os termos de Brest-Litovsk!"
 ww1_diplomacy.30.b:0 "Rejeitar a trégua e marchar sobre Petrogrado."

 ww1_diplomacy.40.t:0 "A Cúpula Secreta de Björkö"
 ww1_diplomacy.40.d:0 "Uma mensagem pessoal do Kaiser alemão propõe reativar o Tratado de Björkö: uma aliança bilateral entre os Impérios Alemão e Russo para partilhar o continente e conter a hegemonia anglo-saxônica."
 ww1_diplomacy.40.a:0 "Ratificar Björkö! Nasce a Liga Continental!"
 ww1_diplomacy.40.b:0 "Recusar a proposta. A Entente se mantém inabalável."

 ww1_diplomacy.50.t:0 "Convite Russo de Entrada na Guerra"
 ww1_diplomacy.50.d:0 "O Governo Imperial Russo convida oficialmente a Romênia a entrar na guerra ao lado da Entente contra a Áustria-Hungria, reconhecendo as reivindicações romenas sobre a Transilvânia e Bucovina."
 ww1_diplomacy.50.a:0 "Mobilizar o Exército! Pela Grande Romênia!"
 ww1_diplomacy.50.b:0 "Manter a neutralidade armada por ora."

 ww1_diplomacy.60.t:0 "A Rússia Garante a Sérvia"
 ww1_diplomacy.60.d:0 "O Czar Nicolau II emite um manifesto imperial garantindo formalmente a integridade e independência da Sérvia contra qualquer agressão austro-húngara."
 ww1_diplomacy.60.a:0 "Viva o Czar da Rússia! Slava!"
ww1_diplomacy.70.t:0 "Acordo de Constantinopla e dos Estreitos"
 ww1_diplomacy.70.d:0 "O Governo Imperial Russo submeteu reivindicações formais à Entente Ocidental a respeito de Constantinopla e dos Estreitos Turcos. Em troca do compromisso total na derrota dos Impérios Centrais, a Rússia requer o reconhecimento de sua missão histórica de controlar o Bósforo e Dardanelos."
 ww1_diplomacy.70.a:0 "Reconhecer o Primado Russo sobre Tsargrad"
 ww1_diplomacy.70.b:0 "Os Estreitos devem permanecer internacionais"
 ww1_diplomacy.71.t:0 "Acordo de Constantinopla Ratificado"
 ww1_diplomacy.71.d:0 "A França e o Reino Unido assinaram formalmente o Tratado secreto de Constantinopla de 1915, concordando com a anexação russa de Tsargrad, Trácia Oriental e dos Estreitos após a vitória sobre o Império Otomano."
 ww1_diplomacy.71.a:0 "A Cruz erguer-se-á novamente sobre a Santa Sofia!"
 SOV_constantinople_agreement_confirmed_tt:0 "§YOs Aliados Ocidentais reconheceram formalmente as reivindicações russas a Constantinopla e aos Estreitos Turcos.§!"
 SOV_trabzon_amphibious_landing_tt:0 "§GCria a Brigada Plastun de Fuzileiros do Cáucaso em Batumi com instalações navais aprimoradas.§!"
 SOV_bochkareva_recruited_tt:0 "§GRecruta a General Maria Bochkareva e cria o 1º Batalhão da Morte das Mulheres Russas em Petrogrado.§!"
