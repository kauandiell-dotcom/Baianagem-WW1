l_braz_por:
 FRA_1914_fiscal_solvency:0 "Solvência Fiscal de 1914"
 FRA_1914_fiscal_solvency_desc:0 "Reformas fiscais aprovadas às vésperas da guerra garantem o crédito estatal e a estabilidade orçamentária."
 FRA_abattre_la_gueuse:0 "Down with 'La Gueuse'"
 FRA_abattre_la_gueuse_desc:0 "Denouncing the parliamentary republic as a corrupt, foreign-influenced system that sold France in 1870, royalists rally conservatives to bring down the regime."
 FRA_accord_colonial_franco_allemand:0 "Franco-German Colonial Settlement"
 FRA_accord_colonial_franco_allemand_desc:0 "Premier Joseph Caillaux concludes a pragmatic bilateral exchange: France cedes part of the French Congo (Neukamerun) in exchange for Germany's recognition of France in Morocco."
 FRA_accord_sur_le_minerai_et_le_charbon:0 "Briey-Ruhr Coal & Iron Compact"
 FRA_accord_sur_le_minerai_et_le_charbon_desc:0 "Forging an industrial syndicate linking the minette iron mines of Briey with the coking coal of the Ruhr, creating mutual economic interdependence."
 FRA_accords_navals_franco_britanniques:0 "Acordos Navais Anglo-Franceses de 1912"
 FRA_accords_navals_franco_britanniques_desc:0 "Winston Churchill e Boué de Lapeyrère acordam a divisão dos mares: a França concentra sua esquadra no Mediterrâneo, enquanto a Grã-Bretanha guarnece o Canal da Mancha e o Mar do Norte."
 FRA_activate_la_voie_sacree:0 "Ativar o Corredor Rodoviário de La Voie Sacrée"
 FRA_activate_la_voie_sacree_desc:0 "Mobilizar caminhões civis e tropas territoriais para manter o reabastecimento contínuo da fortaleza de Verdun."
 FRA_adopter_fermement_trois_ans:0 "Adopt the Full Three-Year Service"
 FRA_adopter_fermement_trois_ans_desc:0 "Despite socialist strikes and protests led by Jaurès, the law passes in August 1913, increasing the French standing peacetime army to 820,000 men on the eve of war."
 FRA_adopter_le_casque_adrian_m1915:0 "Adoção do Capacete Adrian M1915"
 FRA_adopter_le_casque_adrian_m1915_desc:0 "Projetado por Louis Adrian, o capacete de aço estampado com crista reduz as baixas por estilhaços na cabeça em mais de dois terços entre os poilus."
 FRA_adoption_du_plan_xvii:0 "Desdobramento do Plano XVII"
 FRA_adoption_du_plan_xvii_desc:0 "A concentração de cinco exércitos na fronteira oriental de Belfort a Mézières prepara uma ofensiva direta para recuperar a Alsácia e a Lorena."
 FRA_adrian_helmet_protection:0 "Capacete de Aço Adrian M1915"
 FRA_adrian_helmet_protection_desc:0 "A estampagem de milhões de capacetes de aço reduz drasticamente mortes por estilhaços e ferimentos na cabeça."
 FRA_adriatic_naval_blockade:0 "Barragem de Otranto e Patrulhas do Adriático"
 FRA_adriatic_naval_blockade_desc:0 "Patrulhas contínuas bloqueiam a frota austro-húngara e protegem os comboios aliados com destino a Salônica."
 FRA_aerial_photo_reconnaissance:0 "Reconhecimento Fotográfico Aéreo"
 FRA_aerial_photo_reconnaissance_desc:0 "Sortidas aéreas fotográficas diárias mapeiam as redes de trincheiras e baterias inimigas com precisão sem igual."
 FRA_affectes_speciaux_rappel_ouvriers:0 "Recolocação de Mecânicos e Operários do Front"
 FRA_affectes_speciaux_rappel_ouvriers_desc:0 "Reconhecendo que mestres-torneiros são mais valiosos usinando obuses do que na lama das trincheiras, meio milhão de soldados especializados retornam às fábricas."
 FRA_afrique_occidentale_francaise_aof:0 "Federação da África Ocidental Francesa (AOF)"
 FRA_afrique_occidentale_francaise_aof_desc:0 "A coordenação a partir de Saint-Louis e Dakar garante estabilidade administrativa e governança pacífica no Senegal, Guiné Francesa, Costa do Marfim e Daomé."
 FRA_air_ground_tsf_radio_coordination:0 "Regulagem Aérea de Artilharia por Rádio TSF"
 FRA_air_ground_tsf_radio_coordination_desc:0 "A telegrafia sem fio aérea transmite correções imediatas de alvos para as baterias de artilharia pesada."
 FRA_air_supremacy_spad:0 "Supremacia Aérea SPAD"
 FRA_air_supremacy_spad_desc:0 "Os esquadrões franceses de caça dominam os céus da Frente Ocidental."
 FRA_albert_thomas_munitions_boom:0 "Mobilização Industrial de Albert Thomas"
 FRA_albert_thomas_munitions_boom_desc:0 "Sob a liderança de Albert Thomas, fábricas privadas, arsenais e oficinas civis unem-se em uma produção recorde de munições."
 FRA_algerian_spahis_cavalry:0 "Reconhecimento dos Spahis Argelinos"
 FRA_algerian_spahis_cavalry_desc:0 "A experiente cavalaria ligeira norte-africana destaca-se no rastreamento de flancos, perseguição e reconhecimento de campo."
 FRA_alliance_avec_l_italie_et_l_espagne:0 "Treaty of the Latin Sisters"
 FRA_alliance_avec_l_italie_et_l_espagne_desc:0 "Formalizing military and naval conventions across the Western Mediterranean, securing our southern flank and coordinating North African development."
 FRA_alliance_democratique:0 "Aliança Democrática de Centro-Direita"
 FRA_alliance_democratique_desc:0 "Raymond Poincaré e os moderados oferecem ortodoxia financeira, patriotismo resoluto e competência administrativa, contrabalançando o radicalismo socialista com a respeitabilidade burguesa."
 FRA_alsace_lorraine_reclaimed:0 "Alsácia-Lorena Reconquistada"
 FRA_alsace_lorraine_reclaimed_desc:0 "As províncias perdidas retornam à República. O longo luto nacional chega ao fim e a honra francesa é resgatada."
 FRA_american_aef_arrival:0 "Chegada da AEF Americana"
 FRA_american_aef_arrival_desc:0 "Os soldados do General Pershing chegam aos milhões, revertendo o equilíbrio estratégico de efetivos em favor dos Aliados."
 FRA_apaiser_les_tensions_sociales:0 "Apaziguar Tensões Sociais"
 FRA_apaiser_les_tensions_sociales_desc:0 "Ao abrir canais de diálogo com os sindicatos e moderar a repressão policial, o governo evita greves gerais e garante estabilidade social nas bacias operárias."
 FRA_appel_au_tigre:0 "O Chamado ao Tigre (Clemenceau)"
 FRA_appel_au_tigre_desc:0 "Engolindo antipatias pessoais, o Presidente Poincaré convoca Georges Clemenceau, o 'Tigre' de 76 anos, para assumir a chefia do governo com determinação de aço."
 FRA_armee_moderne_motorisee:0 "Exército Motorizado de Armas Combinadas"
 FRA_armee_moderne_motorisee_desc:0 "Com mais de quarenta mil caminhões Renault e Peugeot transportando homens e munições, o exército francês atinge mobilidade incomparável na frente."
 FRA_armer_l_armee_americaine:0 "Equipando os Americanos com Armas Francesas"
 FRA_armer_l_armee_americaine_desc:0 "Como a indústria dos EUA demora a produzir armamento pesado, as usinas francesas fornecem 3.000 canhões de 75mm, fuzis Chauchat e tanques Renault FT para a AEF."
 FRA_arret_des_offensives_ludendorff:0 "Contenção das Ofensivas Ludendorff de 1918"
 FRA_arret_des_offensives_ludendorff_desc:0 "Absorvendo o choque das tropas de assalto alemãs no Marne, o contra-ataque de Villers-Cotterêts em julho de 1918 vira definitivamente a maré da guerra."
 FRA_arrivee_du_corps_expeditionnaire_americain:0 "'Lafayette, nous voilà!' (Chegada da AEF)"
 FRA_arrivee_du_corps_expeditionnaire_americain_desc:0 "O General Pershing desembarca na França. No túmulo do Marquês de Lafayette, proclama-se a dívida de honra paga com a chegada de dois milhões de combatentes americanos."
 FRA_arsenaux_de_toulon_et_brest:0 "Grandes Arsenais de Toulon e Brest"
 FRA_arsenaux_de_toulon_et_brest_desc:0 "A modernização dos diques secos em Toulon e Brest permite acomodar cascos de couraçados de 25.000 toneladas e reformas contínuas de turbinas a vapor."
 FRA_artillerie_speciale_cadres:0 "Artillerie Spéciale (Quadros Blindados)"
 FRA_artillerie_speciale_cadres_desc:0 "Criadas pelo General Estienne, unidades de veículos de assalto treinam penetração mecanizada e cruzamento de trincheiras."
 FRA_assassinat_de_jean_jaures:0 "Assassinato de Jean Jaurès"
 FRA_assassinat_de_jean_jaures_desc:0 "Em 31 de julho de 1914, no Café du Croissant em Paris, o fanático nacionalista Raoul Villain assassina Jean Jaurès. A morte do grande tribuno remove o último obstáculo à coesão patriótica."
 FRA_ateliers_de_puteaux_et_tulle:0 "Arsenais de Precisão de Puteaux e Tulle"
 FRA_ateliers_de_puteaux_et_tulle_desc:0 "A oficina de Puteaux (APX) é especializada nos cilindros hidropneumáticos de recuo do canhão de 75mm, enquanto Tulle fabrica peças de metralhadoras."
 FRA_autogestion_des_usines:0 "Factory Self-Management"
 FRA_autogestion_des_usines_desc:0 "The Schneider arms foundries and Renault works are taken over by factory shop stewards, producing armaments for the emancipation of mankind."
 FRA_aviation_navale_et_porte_hydravions:0 "Aviação Naval e Navios Porta-Hidroaviões"
 FRA_aviation_navale_et_porte_hydravions_desc:0 "Operar o navio porta-hidroaviões Foudre e estações de hidroplanos litorâneas pioneira o reconhecimento aéreo no mar, detecção de minas e ataques com torpedos."
 FRA_avions_d_attaque_au_sol_salmson:0 "Salmson 2A2 Ground Assault"
 FRA_avions_d_attaque_au_sol_salmson_desc:0 "Water-cooled radial engines and self-sealing fuel tanks allow Salmson biplanes to strafe retreating German columns from tree-top height."
 FRA_avions_de_chasse_de_nuit:0 "Night Fighter Defense of Paris"
 FRA_avions_de_chasse_de_nuit_desc:0 "Special night-fighting squadrons guided by ground searchlight rings intercept German Gotha and Giant bombers raiding Paris in the dark."
 FRA_avions_de_reconnaissance_farman_voisin:0 "Biplanos de Reconhecimento Farman e Voisin"
 FRA_avions_de_reconnaissance_farman_voisin_desc:0 "Os biplanos Maurice Farman e Voisin Type III avistam a manobra de Von Kluck em direção ao Marne, provando que a aviação altera radicalmente o destino da guerra terrestre."
 FRA_avions_torpilleurs_marins:0 "Hidroaviões de Patrulha e Lançamento de Torpedos"
 FRA_avions_torpilleurs_marins_desc:0 "Hidroaviões de flutuador duplo patrulham as rotas de navegação, avistando silhuetas submarinas do ar e lançando cargas de profundidade."
 FRA_aviso_et_patrouilleurs_q_ships:0 "Navios-Armadilha Q-Ships e Avisos Armados"
 FRA_aviso_et_patrouilleurs_q_ships_desc:0 "Navios mercantes camuflados ocultando canhões de 75mm atraem submarinos que emergem para o combate de superfície, afundando os incursores inimigos à queima-roupa."
 FRA_balanced_siege_and_field_artillery:0 "Artilharia Mista de Campanha e Cerco Pesado"
 FRA_balanced_siege_and_field_artillery_desc:0 "Combinar canhões rápidos de 75mm com obuseiros de 155mm e morteiros de 220mm oferece flexibilidade tática incomparável."
 FRA_ballons_captifs_saucisses:0 "Caquot Observation Balloons ('Les Saucisses')"
 FRA_ballons_captifs_saucisses_desc:0 "Albert Caquot's teardrop-shaped kite balloons remain stable in 90 km/h winds, providing observers with telephone links to artillery commanders."
 FRA_bank_of_france_gold_bullion:0 "Reservas de Ouro do Banco da França"
 FRA_bank_of_france_gold_bullion_desc:0 "Reservas substanciais em barras de ouro garantem crédito extraordinário e estabilidade cambial para importações vitais do exterior."
 FRA_base_navale_de_bizerte:0 "Bastião Naval Fortificado de Bizerte"
 FRA_base_navale_de_bizerte_desc:0 "A transformação do lago de Bizerte em porto protegido de contratorpedeiros e submarinos domina o Estreito da Sicília e protege a bacia ocidental do Mediterrâneo."
 FRA_base_navale_de_saigon:0 "Arsenal Fluvial e Dique Seco de Saïgon"
 FRA_base_navale_de_saigon_desc:0 "A manutenção de canhoneiras, avisos coloniais e bacias de reparo em Saïgon consolida a presença marítima francesa no Mar do Sul da China e protege o tráfego comercial."
 FRA_bassin_chimique_marseille:0 "Complexo Químico e Oleoquímico de Marselha"
 FRA_bassin_chimique_marseille_desc:0 "O processamento de óleos vegetais coloniais em glicerina fornece a matéria-prima essencial para nitroglicerina, cordite e sabão."
 FRA_bassin_parisien_metallurgie:0 "Paris Basin Manufacturing"
 FRA_bassin_parisien_metallurgie_desc:0 "The suburbs along the Seine from Boulogne-Billancourt to Saint-Denis form a dense manufacturing hive, providing precision tooling, motors, and advanced engineering."
 FRA_bassin_siderurgique_de_briey:0 "Bacia de Minério de Ferro de Briey"
 FRA_bassin_siderurgique_de_briey_desc:0 "As jazidas de minério fosforoso de Briey e Longwy fornecem 90% do minério francês. Altos-fornos modernos garantem a produção de ferro fundido de padrão mundial."
 FRA_bassin_textile_et_chimique_lille:0 "Polo Têxtil e Químico de Lille"
 FRA_bassin_textile_et_chimique_lille_desc:0 "Lille, Roubaix e Tourcoing formam o coração têxtil da França, tecendo lã, linho e uniformes tanto para os mercados de exportação quanto para o exército."
 FRA_bataille_des_frontieres:0 "Batalha das Fronteiras (Agosto de 1914)"
 FRA_bataille_des_frontieres_desc:0 "Mais de dois milhões de homens colidem nas Ardenas, Charleroi e Morhange no maior choque militar de abertura da história contra os exércitos alemães."
 FRA_bataillons_coloniaux_au_front:0 "Colonial Divisions on the Frontline"
 FRA_bataillons_coloniaux_au_front_desc:0 "General Mangin's 1st Colonial Corps forms the spearhead of decisive allied counter-offensives, proving their peerless devotion to the tricolor flag."
 FRA_bataillons_indochinois_et_malgaches:0 "Batalhões de Pioneiros Indochineses e Malgaxes"
 FRA_bataillons_indochinois_et_malgaches_desc:0 "Mais de cem mil recrutas vietnamitas e malgaxes operam fábricas de pólvora, colunas de transporte motorizado, hospitais de campanha e trabalhos de escavação."
 FRA_bef_channel_ports_coordination:0 "Coordenação do Flanco do Canal com a BEF"
 FRA_bef_channel_ports_coordination_desc:0 "A defesa coordenada de Dunquerque, Calais e Bolonha garante o fluxo livre de reforços britânicos ao norte da França."
 FRA_biplans_farman_reconnaissance:0 "Farman HF.20 Reconnaissance"
 FRA_biplans_farman_reconnaissance_desc:0 "The stable pusher-biplanes of the Farman brothers map enemy trench layouts and troop movements, providing headquarters with daily aerial photography."
 FRA_blaise_diagne_citizenship_reforms:0 "Reformas de Cidadania de Blaise Diagne"
 FRA_blaise_diagne_citizenship_reforms_desc:0 "Conceder plenos direitos civis a soldados coloniais condecorados reconhece o supremo serviço prestado à República."
 FRA_blocus_de_l_adriatique:0 "Bloqueio do Adriático e Barragem de Otranto"
 FRA_blocus_de_l_adriatique_desc:0 "Confinar a esquadra austro-húngara em Pola e Cattaro impede os couraçados inimigos de navegarem pelo Mediterrâneo ou cortarem comboios coloniais franceses."
 FRA_blocus_du_canal_d_otrante:0 "The Otranto Barrage Blockade"
 FRA_blocus_du_canal_d_otrante_desc:0 "Joining British and Italian flotillas across the Strait of Otranto, French destroyers and drifters bottle up the Austro-Hungarian fleet in Pola."
 FRA_bombardement_strategique_usines_rhenanes:0 "Strategic Raids on the Rhineland"
 FRA_bombardement_strategique_usines_rhenanes_desc:0 "French heavy bombers fly deep into Germany to strike the blast furnaces of Völklingen and the chemical works of Ludwigshafen, disrupting enemy production."
 FRA_bombardiers_breguet_14:0 "Bombardeiro e Reconhecimento Breguet 14"
 FRA_bombardiers_breguet_14_desc:0 "Louis Breguet constrói o primeiro avião produzido em massa com estrutura metálica de duralumínio. Robusto e veloz, bombardeia ferrovias e colunas táticas inimigas."
 FRA_bons_de_la_defense_nationale:0 "Títulos da Defesa Nacional"
 FRA_bons_de_la_defense_nationale_desc:0 "'Pela França que vem de longe, subscrevam!' Cartazes patrióticos e títulos do tesouro mobilizam as economias populares em bilhões de francos para a vitória."
 FRA_boue_de_lapeyrere_naval_law:0 "Programa Naval Boué de Lapeyrère"
 FRA_boue_de_lapeyrere_naval_law_desc:0 "Foco deliberado em encouraçados modernos e renovação da frota revitaliza a supremacia marítima francesa."
 FRA_british_coal_imports:0 "Linha de Carvão Britânica"
 FRA_british_coal_imports_desc:0 "Remessas garantidas de carvão britânico de alta qualidade substituem a produção perdida das bacias do Norte."
 FRA_british_naval_entente:0 "Anglo-French Naval Partition"
 FRA_british_naval_entente_desc:0 "The Royal Navy guards the North Sea and English Channel, allowing the Marine Nationale to secure absolute dominance across the Western Mediterranean and French African sea lanes."
 FRA_canon_de_75mm_modele_1897:0 "Supremacia do Canhão de 75mm Mle 1897"
 FRA_canon_de_75mm_modele_1897_desc:0 "Capaz de disparar quinze obuses por minuto sem sair do ponto de mira graças ao freio hidropneumático, o canhão de 75mm reina supremo nos campos."
 FRA_canons_sur_voie_ferree_alvf:0 "Artilharia Pesada sobre Trilhos (ALVF)"
 FRA_canons_sur_voie_ferree_alvf_desc:0 "Canhões de 320mm e 400mm instalados sobre vagões ferroviários especiais pulverizam casamatas de concreto armado e túneis inimigos a dezenas de quilômetros."
 FRA_caoutchouc_et_riz_d_indochine:0 "Látex e Colheitas de Arroz da Indochina"
 FRA_caoutchouc_et_riz_d_indochine_desc:0 "As plantações de seringueiras nas terras vermelhas do Camboja e Cochinchina abastecem as fábricas de pneus da Michelin, blindando a França contra a escassez de borracha."
 FRA_capitulation_de_la_bulgarie:0 "Armistício de Salônica (Capitulação Búlgara)"
 FRA_capitulation_de_la_bulgarie_desc:0 "A Bulgária assina o Armistício de Salônica em 29 de setembro de 1918, rompendo a ligação das Potências Centrais com Istambul e expondo o flanco sul da Áustria."
 FRA_caquot_observation_balloons:0 "Balões Aerodinâmicos Caquot"
 FRA_caquot_observation_balloons_desc:0 "Balões cativos projetados por Albert Caquot permanecem estáveis sob ventos fortes, orientando o fogo de artilharia."
 FRA_catastrophe_du_chemin_des_dames:0 "Catastrophe on the Chemin des Dames"
 FRA_catastrophe_du_chemin_des_dames_desc:0 "April 16, 1917: Assaulting the impregnable limestone ridge in sleet and freezing rain, 100,000 French soldiers fall in days against German machine-gun caverns."
 FRA_censure_et_bourrage_de_crane:0 "Censura à Imprensa e Moral de Guerra"
 FRA_censure_et_bourrage_de_crane_desc:0 "O bureau de imprensa militar ('Anastasie') elimina vazamentos sobre recuos e boatos derrotistas dos jornais, preservando a firmeza civil na retaguarda perante as realidades das trincheiras."
 FRA_cent_jours_combined_arms:0 "Ofensiva dos Cem Dias em Armas Combinadas"
 FRA_cent_jours_combined_arms_desc:0 "Ofensiva final delimitada: blindados sincronizados, barragens móveis e aviação rompendo a Linha Hindenburg."
 FRA_cent_jours_final_offensive:0 "A Ofensiva dos Cem Dias dos Aliados"
 FRA_cent_jours_final_offensive_desc:0 "Sincronize blindados, aviação e barragens rolantes sob comando unificado para despedaçar a Linha Hindenburg e forçar um armistício."
 FRA_chantiers_navals_saint_nazaire:0 "Estaleiros do Atlântico em Saint-Nazaire"
 FRA_chantiers_navals_saint_nazaire_desc:0 "Os estaleiros de Saint-Nazaire e Nantes constroem cargueiros mercantes, transportes de tropas e turbinas para enfrentar a guerra submarina alemã."
 FRA_char_leger_renault_ft:0 "O Revolucionário Tanque Renault FT-17"
 FRA_char_leger_renault_ft_desc:0 "Criado por Louis Renault e Estienne, o FT-17 define o layout clássico de todos os blindados do futuro: motor atrás, piloto à frente e torre giratória de 360 graus."
 FRA_charles_maurras_doctrine_politique:0 "The Maurrassian Integral State"
 FRA_charles_maurras_doctrine_politique_desc:0 "Integral nationalism: hereditary monarchy, corporate guilds, anti-parliamentarism, and the restoration of France's historic provinces."
 FRA_chars_schneider_ca1_et_saint_chamond:0 "Carros de Combate Schneider CA1 e Saint-Chamond"
 FRA_chars_schneider_ca1_et_saint_chamond_desc:0 "Os primeiros tanques franceses transpõem trincheiras e cortam arames farpados com canhões de 75mm, estreados em combate em Berry-au-Bac."
 FRA_chasseurs_de_nuit_et_projecteurs:0 "Interceptação Noturna e Holofotes de Defesa"
 FRA_chasseurs_de_nuit_et_projecteurs_desc:0 "Anéis de holofotes antiaéreos e caças de patrulha noturna ao redor de Paris e Nancy blindam as populações civis contra bombardeiros Gotha e zepelins alemães."
 FRA_chasseurs_de_sous_marins_sub_chaser:0 "American Wooden Sub-Chaser Contracts"
 FRA_chasseurs_de_sous_marins_sub_chaser_desc:0 "Purchasing 110-foot wooden sub-chasers from US shipyards supplements French escorts with agile, mass-produced anti-submarine screening craft."
 FRA_chasseurs_nieuport_11_bebe:0 "O Caça Biplano Nieuport 11 'Bébé'"
 FRA_chasseurs_nieuport_11_bebe_desc:0 "O leve biplano sesquiplano de Gustave Delage supera em agilidade e subida os Fokker Eindecker alemães, pondo fim ao 'Flagelo Fokker' sobre os céus de Verdun."
 FRA_chasseurs_spad_vii_et_xiii:0 "Caças Pesados de Perseguição SPAD VII e XIII"
 FRA_chasseurs_spad_vii_et_xiii_desc:0 "Projetado ao redor do motor Hispano-Suiza de 220 cv, o SPAD XIII de Louis Béchereau atinge mais de 210 km/h em mergulho, pilotado pelos maiores ases aliados."
 FRA_chasseurs_spad_vii_hispano:0 "SPAD VII & Hispano-Suiza V8"
 FRA_chasseurs_spad_vii_hispano_desc:0 "Powered by Marc Birkigt's cast-aluminum water-cooled V8 engine, the SPAD VII is rugged, heavy, and capable of devastating high-speed diving attacks."
 FRA_chasseurs_spad_xiii_suprematie:0 "SPAD XIII Aerial Supremacy"
 FRA_chasseurs_spad_xiii_suprematie_desc:0 "Carrying twin synchronized Vickers guns and a 220 hp engine, the SPAD XIII outclimbs and outdives every German opponent across the 1918 battlefields."
 FRA_chemical_explosives_industry:0 "Sindicato de Explosivos Químicos"
 FRA_chemical_explosives_industry_desc:0 "Instalações químicas avançadas ao longo do Ródano sintetizam cordite, nitrocelulose e trinitrotolueno em escala maciça."
 FRA_chemin_de_fer_dakar_niger:0 "Ferrovia Dakar-Níger"
 FRA_chemin_de_fer_dakar_niger_desc:0 "A extensão da linha férrea através do Sudão Francês até Bamako escoa safras e acelera o transporte de recrutas coloniais do interior para o litoral."
 FRA_chemin_de_fer_yunnan_vietnam:0 "The Yunnan-Vietnam Strategic Railway"
 FRA_chemin_de_fer_yunnan_vietnam_desc:0 "A monumental feat of French civil engineering, the narrow-gauge railway from Haiphong to Kunming penetrates deep into Southwest China, securing commercial primacy."
 FRA_chemins_de_fer_de_l_est:0 "Compagnie des Chemins de Fer de l'Est"
 FRA_chemins_de_fer_de_l_est_desc:0 "Double-tracked arterial lines direct from Paris through Châlons-sur-Marne straight to the fortress cities of Verdun, Toul, Nancy, and Épinal, tailored for rapid strategic deployment."
 FRA_chemins_de_fer_du_nord:0 "Compagnie des Chemins de Fer du Nord"
 FRA_chemins_de_fer_du_nord_desc:0 "Heavily engineered trackways link Paris to Amiens, Arras, Lille, and the Belgian border, guaranteeing heavy transport for northern coal and industrial freight."
 FRA_chemins_de_fer_nord_africains:0 "Interconexão Ferroviária do Norte da África"
 FRA_chemins_de_fer_nord_africains_desc:0 "A unificação da bitola e conclusão das linhas ligando Casablanca, Fez, Argel e Túnis permite a rápida redistribuição militar e de cargas por todo o Magrebe francês."
 FRA_chemins_de_fer_sahariens:0 "Linhas de Suprimento dos Fortes Saarianos"
 FRA_chemins_de_fer_sahariens_desc:0 "A expansão das trilhas e linhas férreas ligeiras de Biskra a Touggourt garante poços de água, fortes de meharistas e as fronteiras sul da Argélia."
 FRA_chimie_industrielle_du_rhone:0 "Rhône Chemical Conglomerates"
 FRA_chimie_industrielle_du_rhone_desc:0 "Chemical works at Saint-Fons and Lyon synthesize synthetic dyes, nitrocellulose, and picric acid, laying the technical foundation for modern high-explosive munition fillings."
 FRA_chimie_industrielle_saint_fons:0 "Polo Químico e de Explosivos de Saint-Fons"
 FRA_chimie_industrielle_saint_fons_desc:0 "As usinas químicas de Lyon e Saint-Fons sintetizam ácido nítrico, pólvora B de nitrocelulose e melinite, assegurando produção autônoma de cargas explosivas."
 FRA_citoyennete_et_recompenses_coloniales:0 "Reformas de Cidadania de Blaise Diagne"
 FRA_citoyennete_et_recompenses_coloniales_desc:0 "O deputado senegalês Blaise Diagne assegura plena cidadania francesa aos habitantes das Quatro Comunas do Senegal em contrapartida ao engajamento patriótico militar."
 FRA_citoyennete_francaise_elargie:0 "Universal Imperial Citizenship"
 FRA_citoyennete_francaise_elargie_desc:0 "Extending full civic equality to all subjects of the overseas departments, cementing loyalty to the tricolor through liberty, equality, and fraternity."
 FRA_clemenceau_iron_resolve:0 "Eu Faço a Guerra (Clemenceau)"
 FRA_clemenceau_iron_resolve_desc:0 "Georges Clemenceau personifica a determinação absoluta: sem trégua, sem pacifismo, apenas vitória total."
 FRA_colonel_duval_air_division:0 "Divisão Aérea de Massa (Cel. Duval)"
 FRA_colonel_duval_air_division_desc:0 "A concentração de centenas de caças e bombardeiros sob comando tático unificado esmaga concentrações inimigas."
 FRA_colonial_logistics_labor:0 "Corpo Colonial de Trabalho e Logística"
 FRA_colonial_logistics_labor_desc:0 "Contingentes de trabalhadores indochineses e norte-africanos mantêm portos, ferrovias e depósitos de munição operacionais."
 FRA_colonial_order_aof:0 "Ordem da África Ocidental Francesa"
 FRA_colonial_order_aof_desc:0 "A administração colonial em Dacar assegura estabilidade cívica e extração regular de recursos na AOF."
 FRA_comite_de_guerre_secret:0 "Comitê Secreto de Guerra"
 FRA_comite_de_guerre_secret_desc:0 "Reunindo-se a portas fechadas, lideranças parlamentares chave avaliam a logística, a produção de munições e as operações do estado-maior sem expor segredos à espionagem inimiga."
 FRA_comite_des_forges_coordination:0 "Pacto de Coordenação da Indústria Pesada"
 FRA_comite_des_forges_coordination_desc:0 "O Comité des Forges estabelece tetos de preço e cotas de aço garantidas com os ministérios, mantendo os altos-fornos em operação dia e noite."
 FRA_comites_de_soldats_rouges:0 "Red Soldier Councils"
 FRA_comites_de_soldats_rouges_desc:0 "Abolishing aristocratic officer privileges, units elect their commanders. Discipline is forged in political consciousness and egalitarian brotherhood."
 FRA_communaute_imperiale_unie:0 "La Plus Grande France"
 FRA_communaute_imperiale_unie_desc:0 "A united empire of 100 million Frenchmen standing together across five continents, forever safeguarding the civilization and power of France."
 FRA_commune_revolutionary_ardor:0 "Revolutionary Ardor of the Commune"
 FRA_commune_revolutionary_ardor_desc:0 "The resurrected French Commune mobilizes workers' militias and revolutionary enthusiasm, willing to fight to the last brick in defense of proletarian liberty."
 FRA_competent_civil_administration:0 "Administração Civil Meritocrática"
 FRA_competent_civil_administration_desc:0 "Concursos públicos rigorosos e prefeituras profissionais garantem a eficiência administrativa em toda a França metropolitana."
 FRA_compromis_colonial_allemand:0 "Compromisso Colonial do Congo-Camarões"
 FRA_compromis_colonial_allemand_desc:0 "A cessão de territórios no Congo Francês para os Camarões Alemães em troca do reconhecimento formal do protetorado sobre o Marrocos preserva a paz temporária."
 FRA_compromis_des_deux_ans_et_demi:0 "Two-and-a-Half Year Compromise"
 FRA_compromis_des_deux_ans_et_demi_desc:0 "A middle path between the army high command and socialist opposition: service is modestly extended, avoiding widespread domestic strikes while moderately boosting reserves."
 FRA_concentrate_heavy_artillery_meuse:0 "Concentrar Artilharia Pesada no Mosa"
 FRA_concentrate_heavy_artillery_meuse_desc:0 "Concentrar canhões de cerco e obuseiros ferroviários para pulverizar as áreas de concentração inimigas."
 FRA_concentration_des_cinq_armees:0 "Concentration of the Five Armies"
 FRA_concentration_des_cinq_armees_desc:0 "Deploying the 1st Army (Dubail), 2nd Army (Castelnau), 3rd Army (Ruffey), 4th Army (de Langle de Cary), and 5th Army (Lanrezac) along the eastern frontier."
 FRA_condominium_d_alsace_lorraine:0 "Condominium of Alsace-Lorraine"
 FRA_condominium_d_alsace_lorraine_desc:0 "Proposing that Alsace-Lorraine become a neutral autonomous federal territory with dual Franco-German cultural rights and free trade, eliminating the spark of war."
 FRA_conseil_supreme_de_guerre_versailles:0 "Conselho Supremo de Guerra em Versalhes"
 FRA_conseil_supreme_de_guerre_versailles_desc:0 "Sediado no Palácio de Trianon, o Conselho Supremo de Guerra coordena estratégias militares, alocação de navios cargueiros e reservas aliadas unificadas."
 FRA_controle_total_de_la_mediterranee:0 "Domínio Absoluto do Mediterrâneo"
 FRA_controle_total_de_la_mediterranee_desc:0 "Com rotas marítimas invioláveis, centenas de milhares de combatentes africanos, trigo e suprimentos coloniais chegam aos portos da França sem qualquer interrupção."
 FRA_conversion_des_ateliers_civils:0 "Conversão de Oficinas Civis"
 FRA_conversion_des_ateliers_civils_desc:0 "Fábricas de bicicletas montam ferrolhos de fuzis, relojoeiros produzem espoletas de tempo e destilarias de perfume fabricam éter para pólvoras sem fumaça."
 FRA_cooperation_air_artillerie_tsf:0 "Ligação Rádio TSF entre Aviação e Artilharia"
 FRA_cooperation_air_artillerie_tsf_desc:0 "Equipar aeronaves de observação com transmissores Morse de telegrafia sem fio orienta o tiro de artilharia sobre baterias alemãs camufladas em questão de segundos."
 FRA_coordination_des_etats_majors_haig_joffre:0 "Coordenação de Ligação Haig-Joffre"
 FRA_coordination_des_etats_majors_haig_joffre_desc:0 "Oficiais de ligação bilíngues em Montreuil e Chantilly coordenam linhas de limite de setor, zonas de artilharia e entroncamentos logísticos."
 FRA_coordination_sur_les_deux_fronts:0 "Coordenação de Guerra em Duas Frentes"
 FRA_coordination_sur_les_deux_fronts_desc:0 "Generais de ligação em Paris e Petrogrado sincronizam os cronogramas operacionais, forçando o comando alemão a desviar corpos de exército do Marne para Tannenberg."
 FRA_credit_lyonnais_et_haute_banque:0 "Crédit Lyonnais & Haute Banque"
 FRA_credit_lyonnais_et_haute_banque_desc:0 "With the Bank of France holding massive reserves of physical gold bullion, Paris acts as the chief lender to world powers, financing strategic foreign infrastructure and domestic credit."
 FRA_credit_national_de_reconstruction:0 "Banco do Crédito Nacional de Reconstrução"
 FRA_credit_national_de_reconstruction_desc:0 "A criação de uma instituição pública especializada canaliza indenizações e capital estatal diretamente para reconstruir usinas e lares no norte devastado."
 FRA_credits_financiers_anglo_americains:0 "Créditos Financeiros Anglo-Americanos"
 FRA_credits_financiers_anglo_americains_desc:0 "A coordenação com o Tesouro britânico e o banco J.P. Morgan em Nova York assegura divisas vitais para importar cobre, algodão e trigo sem colapso cambial."
 FRA_creer_l_aeronautique_militaire:0 "Criação da Aéronautique Militaire"
 FRA_creer_l_aeronautique_militaire_desc:0 "Por decreto de março de 1912, a aviação é oficialmente organizada como arma militar autônoma, pioneira no mundo com regimentos, aeródromos e depósitos dedicados."
 FRA_crise_des_munitions_1914:0 "A Crise das Munições de 1914"
 FRA_crise_des_munitions_1914_desc:0 "O cálculo pré-guerra de 13.000 obuses por dia desmorona quando os canhões consomem 50.000 diariamente. Depósitos vazios ameaçam a artilharia com a paralisia total."
 FRA_crise_des_mutineries_1917:0 "A Crise dos Motins dos Poilus de 1917"
 FRA_crise_des_mutineries_1917_desc:0 "Desiludidos com o massacre inútil no Chemin des Dames, regimentos inteiros recusam ordens de ataque suicida, entoando a 'Chanson de Craonne'."
 FRA_croiseurs_auxiliaires_et_q_ships:0 "Auxiliary Cruisers & Decoy Ships"
 FRA_croiseurs_auxiliaires_et_q_ships_desc:0 "Concealing heavy 138mm naval guns behind dummy cargo crates, French Q-ships lure surfaced U-boats into close-range ambushes."
 FRA_croiseurs_cuirasses_classe_waldeck_rousseau:0 "Cruzadores Blindados da Classe Waldeck-Rousseau"
 FRA_croiseurs_cuirasses_classe_waldeck_rousseau_desc:0 "Cruzadores blindados velozes com canhões de 194mm patrulham rotas oceânicas, caçam incursores corsários e realizam reconhecimento tático."
 FRA_cuirasses_classe_bretagne:0 "Super-Couraçados da Classe Bretagne"
 FRA_cuirasses_classe_bretagne_desc:0 "Armados com dez canhões pesados de 340mm na linha central, o Bretagne, Provence e Lorraine elevam o poder de fogo francês para rivalizar com qualquer navio de Berlim ou Viena."
 FRA_culte_de_l_offensive_a_outrance:0 "Doutrina da 'Offensive à Outrance'"
 FRA_culte_de_l_offensive_a_outrance_desc:0 "Influenciada pelo Coronel de Grandmaison, a Escola de Guerra prega que a moral ofensiva, o aço frio e cargas de baioneta decididas superarão todo fogo inimigo."
 FRA_dakar_atlantic_hub:0 "Polo Naval Atlântico de Dacar"
 FRA_dakar_atlantic_hub_desc:0 "Atracadouros de águas profundas e depósitos de carvão protegem linhas de navegação entre Europa, América do Sul e África."
 FRA_dakar_niger_logistics:0 "Corredor Logístico Dacar-Níger"
 FRA_dakar_niger_logistics_desc:0 "A extensão de linhas ferroviárias para o interior africano agiliza o envio de mercadorias tropicais e voluntários."
 FRA_defence_of_verdun:0 "The Furnace of Verdun & La Voie Sacrée"
 FRA_defence_of_verdun_desc:0 "Organize logistical lifelines and division rotations to hold the Meuse fortresses against relentless German assault."
 FRA_defense_bonds_liquidity:0 "Liquidez dos Bônus de Defesa Nacional"
 FRA_defense_bonds_liquidity_desc:0 "Empréstimos populares patrióticos mobilizam as economias familiares para financiar compras bélicas sem gerar hiperinflação."
 FRA_defense_de_dixmude_1914:0 "The Immortal Stand at Dixmude"
 FRA_defense_de_dixmude_1914_desc:0 "Holding Dixmude on the Yser against three German army corps for three desperate weeks, the Fusiliers Marins saved the allied flank and anchored the race to the sea."
 FRA_deploy_gallieni_mobile_reserves:0 "Lançar as Reservas Móveis de Gallieni"
 FRA_deploy_gallieni_mobile_reserves_desc:0 "Mobilizar a guarnição do Campo Entrincheirado de Paris para esmagar o flanco direito exposto de von Kluck."
 FRA_depots_reglements_du_genie:0 "Military Engineering Supply Depots"
 FRA_depots_reglements_du_genie_desc:0 "Pre-positioning bridge timbers, narrow-gauge Decauville track sections, and fuel oil along the eastern borders allows military engineers to maintain frontline logistics under any strain."
 FRA_developpement_des_chars_d_assaut:0 "Coronel Estienne e a 'Artillerie Spéciale'"
 FRA_developpement_des_chars_d_assaut_desc:0 "'A vitória pertencerá àquele que primeiro colocar um canhão sobre esteiras', preconiza o Coronel Estienne, fundando os blindados franceses."
 FRA_dirigeables_et_ballons_d_observation:0 "Balões Cativos de Observação Caquot"
 FRA_dirigeables_et_ballons_d_observation_desc:0 "O Capitão Albert Caquot projeta balões aerodinâmicos estáveis ('saucisses') que resistem a ventos fortes, ligando observadores de artilharia por telefone aos canhões de 75mm."
 FRA_discipline_sociale_et_patronat:0 "Industrial Compact & Discipline"
 FRA_discipline_sociale_et_patronat_desc:0 "Partnering with the Comité des Forges and heavy industrial leaders, the executive guarantees labor peace through paternalistic social programs and mandatory arbitration."
 FRA_dissolution_du_bloc_des_gauches:0 "Dismantle the Left Bloc"
 FRA_dissolution_du_bloc_des_gauches_desc:0 "Breaking the legislative stranglehold of anti-clerical radicals, conservative republicans forge a broad National Bloc committed to social order and fiscal responsibility."
 FRA_division_aerienne_du_colonel_duval:0 "A Divisão Aérea do Coronel Duval"
 FRA_division_aerienne_du_colonel_duval_desc:0 "Criar a primeira divisão aérea tática autônoma da história—mais de 600 caças e bombardeiros sob comando unificado—desfere golpes esmagadores onde quer que o inimigo ataque."
 FRA_doctrine_d_emploi_des_blindes_estienne:0 "Doutrina de Enxame de Blindados de Estienne"
 FRA_doctrine_d_emploi_des_blindes_estienne_desc:0 "Em vez de monstros isolados, a França emprega milhares de tanques FT-17 ágeis avançando em enxames cerrados com a infantaria para quebrar as linhas alemãs."
 FRA_doctrine_petain_feu_et_materiel:0 "Doutrina de Pétain: 'O Fogo Conquista'"
 FRA_doctrine_petain_feu_et_materiel_desc:0 "'O fogo mata!' A máxima revolucionária de Pétain substitui ataques suicidas por barragens concentradas de artilharia pesada e defesa elástica em profundidade."
 FRA_draconian_decimation_repression:0 "Decimação Draconiana e Execuções Sumárias"
 FRA_draconian_decimation_repression_desc:0 "Aplicar o código militar com mão de ferro para fuzilar amotinados pour encourager les autres. Alto risco de greve geral!"
 FRA_dragage_des_mines_de_mer:0 "Minesweeping Flotillas"
 FRA_dragage_des_mines_de_mer_desc:0 "Clearing the deadly minefields sown across the English Channel and the Gulf of Lion ensures allied troopships sail with minimal losses."
 FRA_dreadnoughts_classe_courbet:0 "Couraçados da Classe Courbet"
 FRA_dreadnoughts_classe_courbet_desc:0 "O comissionamento do Jean Bart, Courbet, Paris e France entrega doze canhões pesados de 305mm em seis torres, garantindo poder de choque couraçado de primeira linha."
 FRA_eastern_front_containment:0 "Pressão Russa no Leste"
 FRA_eastern_front_containment_desc:0 "Ofensivas russas na Prússia Oriental e Galícia prendem vastos corpos de exército alemães longe de Paris."
 FRA_echec_de_l_offensive_initiale:0 "The Brutal Shock of Modern War"
 FRA_echec_de_l_offensive_initiale_desc:0 "Losing 27,000 dead on August 22 alone, the bloodiest day in French history exposes the catastrophe of charging concealed machine guns across open fields."
 FRA_ecole_normale_et_instituteurs:0 "Os Hussardos Negros da República"
 FRA_ecole_normale_et_instituteurs_desc:0 "Os professores públicos laicos ('Hussards noirs') formam a espinha dorsal moral de cada comuna, ensinando o método científico, a história da França e o dever cívico."
 FRA_ecoles_d_aviation_pau_avord:0 "Aviation Academies: Pau & Avord"
 FRA_ecoles_d_aviation_pau_avord_desc:0 "Thousands of cadet pilots are trained through rigorous aerobatic regimens, stunt maneuvers, and aerial gunnery on the sunny plains of southwestern France."
 FRA_ecoles_de_pilotage_pau_et_etampes:0 "Escolas de Pilotagem de Pau e Étampes"
 FRA_ecoles_de_pilotage_pau_et_etampes_desc:0 "As escolas pioneiras fundadas por Blériot e Farman são militarizadas para treinar centenas de aviadores em acrobacias, navegação e reconhecimento de longa distância."
 FRA_election_presidentielle_1913:0 "Eleição Presidencial de 1913"
 FRA_election_presidentielle_1913_desc:0 "Reunida no Palácio de Versalhes, a Assembleia Nacional deve eleger o sucessor do presidente Armand Fallières. A disputa entre Raymond Poincaré e Jules Pams definirá a firmeza externa da França."
 FRA_electrification_du_midi:0 "Eletrificação das Ferrovias do Midi e Pireneus"
 FRA_electrification_du_midi_desc:0 "Turbinas hídricas nos Pireneus alimentam locomotivas elétricas na malha do Midi, poupando carvão precioso e acelerando o transporte entre Toulouse e a costa."
 FRA_employer_union_compact:0 "Acordo Social Tripartite"
 FRA_employer_union_compact_desc:0 "A arbitragem estatal entre patrões e operários evita greves paralisantes durante projetos vitais de infraestrutura."
 FRA_emprunts_nationaux_de_la_defense:0 "National Defense War Loans"
 FRA_emprunts_nationaux_de_la_defense_desc:0 "'Pour la France qui combat, pour la France qui sera victorieuse!' French families open their savings, pouring gold into national bonds to finance victory."
 FRA_emprunts_russes_chemin_de_fer:0 "Empréstimos Franceses para Ferrovias Russas"
 FRA_emprunts_russes_chemin_de_fer_desc:0 "Investidores franceses financiam centenas de milhões de francos em ferrovias de bitola dupla na Polônia e Rússia Ocidental, reduzindo o tempo de mobilização russa pela metade."
 FRA_entente_cordiale_brotherhood:0 "Irmandade da Entente Cordiale"
 FRA_entente_cordiale_brotherhood_desc:0 "Séculos de rivalidade anglo-francesa dão lugar a cooperação militar resoluta contra a hegemonia continental."
 FRA_entente_diplomacy:0 "Entente Coalition Coordination"
 FRA_entente_diplomacy_desc:0 "Coordinate military planning with Great Britain, the Russian Empire, Italy, and the arriving American Expeditionary Force."
 FRA_epuration_des_defaitistes:0 "Purge of Defeatists & Pacifists"
 FRA_epuration_des_defaitistes_desc:0 "Clemenceau orders the arrest of former Premier Joseph Caillaux, Minister Louis Malvy, and the editors of Bonnet Rouge. Defeatism is treated as high treason against the Republic."
 FRA_equip_doughboys_with_french_equipment:0 "Equipar os Doughboys Americanos com Armamento Francês"
 FRA_equip_doughboys_with_french_equipment_desc:0 "Fornecer às divisões dos EUA canhões franceses de 75mm, fuzis Chauchat e tanques FT."
 FRA_escadre_de_l_atlantique_brest:0 "Brest Atlantic Squadron"
 FRA_escadre_de_l_atlantique_brest_desc:0 "Guarding the approaches to the English Channel and the Bay of Biscay, the squadron at Brest patrols transatlantic commerce and escorts incoming troop transports."
 FRA_escadrille_des_cigognes_et_as_du_ciel:0 "Escadrille des Cigognes (Os Ases dos Céus)"
 FRA_escadrille_des_cigognes_et_as_du_ciel_desc:0 "Aviadores como Georges Guynemer, René Fonck e Charles Nungesser tornam-se heróis nacionais, inspirando toda a nação com bravura lendária e combates aéreos."
 FRA_escadrille_la_fayette:0 "L'Escadrille La Fayette"
 FRA_escadrille_la_fayette_desc:0 "American volunteer pilots flock to France under the emblem of a Sioux warrior head, flying hazardous combat missions long before US official entry."
 FRA_escadrilles_de_protection_du_gqg:0 "High Command Air Escort Groups"
 FRA_escadrilles_de_protection_du_gqg_desc:0 "Elite fighter flights circle overhead allied railway hubs and army command headquarters, shooting down German reconnaissance scouts."
 FRA_escorted_maritime_convoys:0 "Comboios Marítimos Escoltados Aliados"
 FRA_escorted_maritime_convoys_desc:0 "Reunir navios mercantes sob rigorosa escolta de contratorpedeiros reduz drasticamente as perdas na guerra submarina."
 FRA_escorteurs_rapides_classe_ailette:0 "Ailette Fast Convoy Escorts"
 FRA_escorteurs_rapides_classe_ailette_desc:0 "Purpose-built shallow-draft escort sloops protect merchant shipping convoys from Saint-Nazaire and Bordeaux against coastal mining and U-boat raids."
 FRA_essor_de_la_belle_epoque:0 "Prosperidade Econômica da Belle Époque"
 FRA_essor_de_la_belle_epoque_desc:0 "A bolsa de valores de Paris, o comércio próspero e o rápido crescimento urbano simbolizam a era de ouro da riqueza comercial e do prestígio cultural da França."
 FRA_essor_de_la_sfio:0 "Ascensão da SFIO Socialista"
 FRA_essor_de_la_sfio_desc:0 "Liderada pelo eloquente Jean Jaurès, a Seção Francesa da Internacional Operária luta pelos direitos dos trabalhadores, previdência e paz internacional, atraindo os operários para o socialismo constitucional."
 FRA_etablissements_schneider_le_creusot:0 "Oficinas de Artilharia Schneider-Creusot"
 FRA_etablissements_schneider_le_creusot_desc:0 "O império siderúrgico da família Schneider projeta obuses de tiro rápido, canhões de montanha e cúpulas blindadas que rivalizam com a Krupp e a Škoda."
 FRA_etoile_ferroviaire_de_paris:0 "The Paris Railway Radial Star"
 FRA_etoile_ferroviaire_de_paris_desc:0 "Six major terminal stations connect Paris to every province of the Republic. Modernizing track switches and marshaling yards ensures that military trains can traverse the hub in hours."
 FRA_execute_plan_xvii_mission:0 "Executar Rompimento Operacional do Plano XVII"
 FRA_execute_plan_xvii_mission_desc:0 "A grande ofensiva de Joffre para recuperar as províncias perdidas da Alsácia e Lorena. Devemos capturar Estrasburgo e Colmar em 25 dias!"
 FRA_exhausted_classes_crisis:0 "Demographic Exhaustion of 1917"
 FRA_exhausted_classes_crisis_desc:0 "Years of attritional warfare on the Western Front have bled France's youth dry. Calling up older classes and wounded veterans strains the very fabric of French society."
 FRA_expand_munitionnettes_workforce:0 "Expandir a Força Operária das Munitionnettes"
 FRA_expand_munitionnettes_workforce_desc:0 "Recrutar operárias para os arsenais estatais para maximizar a produção de munições."
 FRA_exploiter_la_guerre_sous_marine_a_outrance:0 "Repúdio à Guerra Submarina Irrestrita"
 FRA_exploiter_la_guerre_sous_marine_a_outrance_desc:0 "O torpedeamento alemão de navios mercantes neutros como o Sussex e Lusitania mobiliza a indignação mundial, voltando a simpatia americana para a Entente."
 FRA_federation_coloniale_associee:0 "Associated Colonial Federation"
 FRA_federation_coloniale_associee_desc:0 "Replacing colonial subjugation with an autonomous federal commonwealth, granting representation and internal home-rule to Indochina, Madagascar, and Africa."
 FRA_federation_des_bourses_du_travail:0 "Federation of Bourses du Travail"
 FRA_federation_des_bourses_du_travail_desc:0 "Decentralized communes coordinate production, distribution, and mutual aid across the cantons of France without bureaucratic parasitic centralization."
 FRA_ferdinand_foch_commandement_unique:0 "Foch: Comando Único Aliado e Bastão de Marechal"
 FRA_ferdinand_foch_commandement_unique_desc:0 "Na conferência de Doullens em março de 1918, o General Ferdinand Foch é nomeado Generalíssimo de todas as forças aliadas na frente ocidental, recebendo o bastão de Marechal da França."
 FRA_fermete_diplomatique_agadir:0 "Firmeza Diplomática em Agadir"
 FRA_fermete_diplomatique_agadir_desc:0 "Apoiado pelo discurso britânico de Lloyd George na Mansion House, o primeiro-ministro Joseph Caillaux rejeita as exigências de Berlim, demonstrando a coesão da Entente."
 FRA_firepower_doctrine:0 "Doutrina de Primazia do Poder de Fogo"
 FRA_firepower_doctrine_desc:0 "A artilharia conquista, a infantaria ocupa. Canhões pesados pulverizam defesas antes do avanço de qualquer homem."
 FRA_flotte_de_haute_mer_mediterranee:0 "1º Exército Naval de Alto-Mar no Mediterrâneo"
 FRA_flotte_de_haute_mer_mediterranee_desc:0 "Concentrar todos os couraçados modernos em Toulon e Mers-el-Kébir forma uma formidável esquadra de ataque, pronta para interceptar o Goeben alemão ou aniquilar a frota austríaca."
 FRA_flotte_de_la_mediterranee_toulon:0 "Toulon Mediterranean Battle Fleet"
 FRA_flotte_de_la_mediterranee_toulon_desc:0 "The Arsenal of Toulon concentrates our premier naval power, safeguarding the sea lanes between Marseille and Algiers against Austrian and Ottoman ambitions."
 FRA_flotte_de_la_victoire_1918:0 "A Triunfante Marine Nationale"
 FRA_flotte_de_la_victoire_1918_desc:0 "Entrando nos Dardanelos, Sebastopol e Pola, a frota francesa vitoriosa consolida-se como uma das maiores potências navais do planeta, condecorada pela honra marítima."
 FRA_flottilles_de_sous_marins_narval:0 "Flotilhas de Submarinos Brumaire e Pluviôse"
 FRA_flottilles_de_sous_marins_narval_desc:0 "O emprego de submarinos no Adriático estabelece campos minados defensivos e assedia os couraçados austro-húngaros na saída de seus ancoradouros."
 FRA_fonderies_de_lorraine:0 "Fundições de Aço da Lorena"
 FRA_fonderies_de_lorraine_desc:0 "A instalação de conversores Thomas-Gilchrist transforma minério fosforoso em aço estrutural de alta resistência para ferrovias e pontes."
 FRA_force_noire_integration:0 "Integração de La Force Noire"
 FRA_force_noire_integration_desc:0 "Idealizada pelo General Mangin, a infantaria colonial compensa a escassez demográfica metropolitana com bravura."
 FRA_foreign_legion_cadres:0 "Quadros de Elite da Legião Estrangeira"
 FRA_foreign_legion_cadres_desc:0 "Voluntários estrangeiros unidos pela irmandade legionária defendem as cores francesas até o último suspiro."
 FRA_fortify_paris_camp_retranche:0 "Fortificar o Campo Entrincheirado de Paris"
 FRA_fortify_paris_camp_retranche_desc:0 "Cavar trincheiras e estender arame farpado no cinturão externo de Paris para resistir a qualquer cerco."
 FRA_franco_russian_sacred_alliance:0 "Aliança Sagrada Franco-Russa"
 FRA_franco_russian_sacred_alliance_desc:0 "A pedra angular da segurança francesa: garantias mútuas de defesa que forçam a Alemanha a lutar em duas frentes."
 FRA_front_d_orient_a_salonique:0 "Exército Aliado do Oriente em Salônica"
 FRA_front_d_orient_a_salonique_desc:0 "O General Sarrail constrói a linha fortificada de Salônica, reunindo divisões francesas, sérvias, britânicas e gregas para fixar os exércitos búlgaro e alemão nos Balcãs."
 FRA_fully_motorised_logistics:0 "Colunas Motorizadas de Suprimento"
 FRA_fully_motorised_logistics_desc:0 "Substituir carroças de tração animal por caminhões Renault e Berliet acelera os deslocamentos táticos."
 FRA_fusil_mitrailleur_chauchat:0 "Fuzil-Metralhadora Leve Chauchat CSRG"
 FRA_fusil_mitrailleur_chauchat_desc:0 "Estampado em chapas de aço, o Chauchat equipa cada pelotão de infantaria com fogo automático móvel, apoiando assaltos a trincheiras."
 FRA_fusiliers_marins_amiral_ronarch:0 "Admiral Ronarc'h's Fusiliers Marins"
 FRA_fusiliers_marins_amiral_ronarch_desc:0 "When the front cracked in 1914, Admiral Pierre-Alexis Ronarc'h organized 6,000 Breton sailors into the Brigade des Fusiliers Marins to fight as infantry."
 FRA_garantie_de_la_neutralite_belge:0 "Garantidor do Tratado de Londres de 1839"
 FRA_garantie_de_la_neutralite_belge_desc:0 "A reafirmação solene do compromisso franco-britânico de defender a neutralidade perpétua da Bélgica protege os Países Baixos contra a agressão prussiana."
 FRA_general_joffre_chef_d_etat_major:0 "Centralização do Estado-Maior de Joffre"
 FRA_general_joffre_chef_d_etat_major_desc:0 "O General Joseph Joffre impõe calma inabalável, afastando oficiais incompetentes e promovendo comandantes capazes com rigor e disciplina profissional."
 FRA_gestion_du_collapsus_russe_1917:0 "Gerenciamento do Colapso Russo de 1917"
 FRA_gestion_du_collapsus_russe_1917_desc:0 "Com a desintegração da frente russa pela revolução e o tratado de Brest-Litovsk, a França prepara suas defesas para conter quarenta divisões alemãs transferidas do leste."
 FRA_gouvernement_de_defense_nationale:0 "Governo de Defesa Nacional"
 FRA_gouvernement_de_defense_nationale_desc:0 "O primeiro-ministro René Viviani reorganiza o ministério para incluir os líderes socialistas Jules Guesde e Marcel Sembat ao lado de Alexandre Millerand, consolidando a frente política republicana."
 FRA_gouvernement_militaire_de_paris_gallieni:0 "General Gallieni Defends Paris"
 FRA_gouvernement_militaire_de_paris_gallieni_desc:0 "'I have been given the mandate to defend Paris against the invader. This mandate I shall fulfill to the end.' Gallieni turns Paris into an active army bastion."
 FRA_grand_quartier_general:0 "Grand Quartier Général (GQG)"
 FRA_grand_quartier_general_desc:0 "O estabelecimento do quartel-general supremo em Chantilly unifica o comando operacional, inteligência e comunicações de todas as armadas francesas de campanha."
 FRA_grande_retraite_organisee:0 "The Great Organized Retreat"
 FRA_grande_retraite_organisee_desc:0 "Under scorching August heat, Joffre maintains iron composure, executing a Fighting Retreat for 200 kilometers without allowing his armies to be encircled or crushed."
 FRA_grenades_anti_sous_marines_guiraud:0 "Guiraud Depth Charges & Hydrophones"
 FRA_grenades_anti_sous_marines_guiraud_desc:0 "Invented by French naval engineers, hydrostatic depth charges and underwater listening hydrophones allow surface escorts to strike submerged U-boats."
 FRA_greve_generale_insurrectionnelle:0 "General Insurrectionary Strike"
 FRA_greve_generale_insurrectionnelle_desc:0 "Factories fall silent, railway wheels stop turning, and the red flag is raised over the Bourses du Travail. The working class claims sovereignty over production."
 FRA_guerre_des_mines_vauquois:0 "Underground Mine Warfare at Vauquois"
 FRA_guerre_des_mines_vauquois_desc:0 "Sappeur miners tunnel hundreds of meters beneath the chalk hills to detonate 60-ton ammonal charges under enemy strongpoints, ripping the terrain into lunar craters."
 FRA_hauts_fourneaux_de_lorraine:0 "Lorraine Blast Furnaces"
 FRA_hauts_fourneaux_de_lorraine_desc:0 "The minette iron ore deposits of Briey and Longwy feed dozens of towering blast furnaces, making French Lorraine one of Europe's primary metallurgical engines."
 FRA_heritage_aeronautique_victorieux:0 "A Vitoriosa Indústria Aeroespacial Francesa"
 FRA_heritage_aeronautique_victorieux_desc:0 "Tendo produzido mais de cinquenta mil aviões militares na guerra, os fabricantes aeroespaciais franceses lideram o mundo na era da aviação civil e glória nacional."
 FRA_hispano_suiza_aero_engines:0 "Motores Hispano-Suiza e Gnome-Rhône"
 FRA_hispano_suiza_aero_engines_desc:0 "Motores V8 em bloco de alumínio fornecem superior relação potência-peso para os aviões de combate franceses."
 FRA_horizon_blue_uniforms_idea:0 "Uniformes Bleu Horizon de Baixa Visibilidade"
 FRA_horizon_blue_uniforms_idea_desc:0 "Substituir as calças vermelhas por azul horizonte discreto camufla a infantaria francesa nas névoas da batalha."
 FRA_houille_blanche_des_alpes:0 "Hidroeletricidade Alpina (Houille Blanche)"
 FRA_houille_blanche_des_alpes_desc:0 "O aproveitamento dos torrentes alpinos em Grenoble e Savoie gera energia hidrelétrica abundante para fundições de alumínio, eletrometalurgia e carboneto de cálcio."
 FRA_ils_ne_passeront_pas:0 "'Ils Ne Passeront Pas!'"
 FRA_ils_ne_passeront_pas_desc:0 "Proclaimed by Nivelle and Pétain, the rallying cry echoes across Fort Vaux, Fleury, and Dead Man's Hill. France stood unbreakable; the German offensive was broken."
 FRA_imperial_blood_solidarity:0 "Solidariedade de Sangue do Império"
 FRA_imperial_blood_solidarity_desc:0 "O sacrifício compartilhado nos campos de batalha forja laços inquebrantáveis entre a metrópole e os povos ultramarinos."
 FRA_importations_de_charbon_anglais:0 "British Welsh Coal Convoys"
 FRA_importations_de_charbon_anglais_desc:0 "To replace the lost coalfields of the Nord, cargo fleets under naval escort deliver millions of tons of high-grade Welsh coal to Rouen and Le Havre."
 FRA_importations_de_charbon_britannique:0 "Comboios Marítimos de Carvão Britânico"
 FRA_importations_de_charbon_britannique_desc:0 "Para substituir o carvão das minas perdidas no norte, navios mercantes transportam milhões de toneladas de Cardiff e Newcastle diretamente para Rouen, Brest e Bordeaux."
 FRA_improve_trench_soup_and_wine:0 "Melhorar as Rações das Trincheiras (Pinard e Sopa)"
 FRA_improve_trench_soup_and_wine_desc:0 "Garantir transporte de comida quente e rações regulares de vinho diretamente nas trincheiras."
 FRA_industrie_automobile_renault_panhard:0 "Automotive Giants: Renault & Panhard"
 FRA_industrie_automobile_renault_panhard_desc:0 "Louis Renault and Panhard & Levassor pioneered the modern internal combustion automobile. French motor output leads Europe, creating an invaluable motorized industrial base."
 FRA_instruction_militaire_des_doughboys:0 "Instrução Francesa para as Divisões dos EUA"
 FRA_instruction_militaire_des_doughboys_desc:0 "Veteranos e oficiais franceses treinam as tropas americanas em combate com máscaras de gás, lançamento de granadas de mão e ataques de trincheira na floresta de Argonne."
 FRA_integration_des_conscrits_de_1913:0 "Incorporate the Class of 1913"
 FRA_integration_des_conscrits_de_1913_desc:0 "Barracks across France absorb the new recruits, subjecting them to intense bayonet drills, forced marches, and field maneuvers before August 1914."
 FRA_intervention_a_odessa_mar_noir:0 "Black Sea Naval Expedition to Odessa"
 FRA_intervention_a_odessa_mar_noir_desc:0 "French naval divisions sail to Odessa and Sevastopol to safeguard allied armaments and assist anti-Bolshevik White Russian forces."
 FRA_intervention_a_odessa_mer_noire:0 "Expedição Naval de Odessa e Mar Negro"
 FRA_intervention_a_odessa_mer_noire_desc:0 "Com a queda da autoridade imperial russa, esquadras francesas e tropas coloniais desembarcam em Odessa e Sebastopol para salvaguardar interesses aliados no Mar Negro."
 FRA_issue_national_defense_bonds:0 "Emitir Bônus da Defesa Nacional"
 FRA_issue_national_defense_bonds_desc:0 "Arrecadar capital patriótico interno sem alimentar a inflação monetária."
 FRA_je_fais_la_guerre:0 "'Je fais la guerre' (Eu Faço a Guerra)"
 FRA_je_fais_la_guerre_desc:0 "'Política interna? Eu faço a guerra. Política externa? Eu faço a guerra. A Rússia nos trai? Eu faço a guerra. Até o último quarto de hora!' Clemenceau galvaniza o espírito francês para a vitória."
 FRA_joffre_supreme_staff:0 "Grand Quartier Général (Estado-Maior de Joffre)"
 FRA_joffre_supreme_staff_desc:0 "O controle operacional centralizado do GQG coordena mobilizações ferroviárias e remanejamentos estratégicos."
 FRA_joint_franco_american_staff:0 "Estado-Maior Combinado Franco-Americano"
 FRA_joint_franco_american_staff_desc:0 "Instrutores franceses treinam divisões americanas recém-chegadas em observação de artilharia, defesa química e trincheiras."
 FRA_joint_liaison_missions:0 "Ligação Militar Aliada nos Bálcãs"
 FRA_joint_liaison_missions_desc:0 "Missões francesas de assessoria na Sérvia e Romênia coordenam suprimentos e contra-ofensivas no sudeste europeu."
 FRA_journee_de_huit_heures:0 "The Eight-Hour Work Day"
 FRA_journee_de_huit_heures_desc:0 "The historic demand of the international labor movement is codified into French law. Eight hours of work, eight hours of rest, eight hours of leisure."
 FRA_justice_militaire_mesuree:0 "Justiça Militar Medida e Indultos"
 FRA_justice_militaire_mesuree_desc:0 "Recusando fuzilamentos em massa, Pétain comuta centenas de sentenças de morte, executando apenas líderes comprovados e pacificando o exército com moderação."
 FRA_kaiser_offensive_halted:0 "Rechaço da Kaiserschlacht"
 FRA_kaiser_offensive_halted_desc:0 "Suportar os ataques de tropas de choque alemãs com profundidade e artilharia abre caminho para a vitória final."
 FRA_l_alliance_franco_russe:0 "A Sagrada Aliança Franco-Russa"
 FRA_l_alliance_franco_russe_desc:0 "Selada em 1892 entre a República e o Czar Alexandre III, a convenção militar franco-russa garante socorro mútuo contra agressão alemã, encurralando a Alemanha entre duas frentes."
 FRA_l_empire_colonial_francais:0 "O Império Colonial Francês"
 FRA_l_empire_colonial_francais_desc:0 "Cobrindo mais de dez milhões de quilômetros quadrados na África e Ásia, o império ultramarino oferece profundidade estratégica, matérias-primas e milhões de súditos leais ao tricolor."
 FRA_l_entente_cordiale:0 "A Entente Cordiale Anglo-Francesa"
 FRA_l_entente_cordiale_desc:0 "Firmada em 1904 por Théophile Delcassé e Eduardo VII, a Entente dissolve séculos de rivalidade, unindo as duas democracias liberais na contenção das ambições germânicas."
 FRA_l_indochine_francaise:0 "A Indochina Francesa e o Rio Vermelho"
 FRA_l_indochine_francaise_desc:0 "O Governador-Geral Albert Sarraut moderniza a administração em Tonkin, Annam e Cochinchina, construindo escolas, postos médicos e diques nos deltas arrozeiros."
 FRA_la_bataille_de_la_somme_soutien:0 "Batalha do Somme (6º Exército Francês)"
 FRA_la_bataille_de_la_somme_soutien_desc:0 "Ao sul do Somme, o 6º Exército do General Fayolle avança com barragens de artilharia rolante, aliviando de forma decisiva a pressão sobre Verdun."
 FRA_la_course_a_la_mer:0 "A Corrida para o Mar (Frente de Flandres)"
 FRA_la_course_a_la_mer_desc:0 "Ambos os exércitos manobram para o norte tentando flanquear-se, até que fuzileiros franceses e belgas selam o front junto ao Canal da Mancha."
 FRA_la_crise_des_munitions_1914:0 "Address the 1914 Shell Crisis"
 FRA_la_crise_des_munitions_1914_desc:0 "Consumption of 75mm artillery shells reached 80,000 per day during the Marne, while daily production was only 10,000. Emergency contracts are dispatched across France."
 FRA_la_crise_politique_de_1917:0 "A Crise Política de 1917"
 FRA_la_crise_politique_de_1917_desc:0 "Após três anos de hecatombe nas trincheiras, eclodem greves nas fábricas de armas, a Rússia aliada entra em colapso e disputas políticas derrubam gabinetes em rápida sucessão."
 FRA_la_demande_d_armistice_allemande:0 "The German Armistice Request"
 FRA_la_demande_d_armistice_allemande_desc:0 "With their armies in full retreat, their allies crumbling, and the fleet mutinying at Kiel, the German High Command sends Matthias Erzberger to sue for peace."
 FRA_la_doctrine_nivelle_rupture:0 "Nivelle's Grand Rupture Doctrine"
 FRA_la_doctrine_nivelle_rupture_desc:0 "Flushed with success recapturing Fort Douaumont, General Robert Nivelle promises parliament to rupture the German front lines within 48 hours with a rolling barrage."
 FRA_la_force_noire_de_mangin:0 "A 'Force Noire' do General Mangin"
 FRA_la_force_noire_de_mangin_desc:0 "A tese profética do Coronel Charles Mangin defende o recrutamento do vasto contingente da África Ocidental para compensar a superioridade demográfica alemã na Europa."
 FRA_la_force_noire_du_general_mangin:0 "General Mangin's 'La Force Noire'"
 FRA_la_force_noire_du_general_mangin_desc:0 "Colonel Charles Mangin's 1910 thesis proved prophetic: African troops possessed the physical stamina and martial bravery needed to compensate for France's low birth rate."
 FRA_la_fournaise_de_verdun:0 "A Fornalha de Verdun: 'Eles Não Passarão!'"
 FRA_la_fournaise_de_verdun_desc:0 "'Eles não passarão!' Enfrentando a ofensiva de atrito de Falkenhayn, o exército francês resiste inabalável nas colinas de Douaumont e Vaux."
 FRA_la_france_commune_invincible:0 "The Invincible Commune"
 FRA_la_france_commune_invincible_desc:0 "The revolution has taken root. A new world has been born in the land of 1789, ready to defend its liberty against all imperialist coalitions."
 FRA_la_loi_des_trois_ans_1913:0 "The Three-Year Law Debate (1913)"
 FRA_la_loi_des_trois_ans_1913_desc:0 "Facing the German Army Law of 1912, France must act. With only 39 million citizens against 65 million Germans, extending conscription to 3 years is a life-or-death decision."
 FRA_la_paix_de_versailles_imposition:0 "O Tratado de Versalhes na Galeria dos Espelhos"
 FRA_la_paix_de_versailles_imposition_desc:0 "Em 28 de junho de 1919, no mesmo salão onde o Império Alemão fora proclamado em 1871, Georges Clemenceau preside a assinatura da Paz de Versalhes, consagrando o triunfo da França."
 FRA_la_republique_autoritaire:0 "The Resolute Republic"
 FRA_la_republique_autoritaire_desc:0 "France has constructed an unshakeable executive republic, fusing democratic legitimacy with authoritarian command to meet any trial of history."
 FRA_la_victoire_de_la_republique:0 "A Vitória da República"
 FRA_la_victoire_de_la_republique_desc:0 "A república democrática resistiu à maior tempestade da história humana sem sucumbir à tirania, provando ao mundo que cidadãos livres podem triunfar sobre a autocracia."
 FRA_la_voie_sacree_convoy:0 "Linha Logística La Voie Sacrée"
 FRA_la_voie_sacree_convoy_desc:0 "A estrada de Bar-le-Duc a Verdun mantida aberta 24h por milhares de caminhões e tropas territoriais que espalham cascalho."
 FRA_laicite_republicaine:0 "Secularismo Republicano (Laicidade)"
 FRA_laicite_republicaine_desc:0 "A lei de 1905 que separa Igreja e Estado consolidou a escola pública laica. Os filhos da França são educados como cidadãos livres da República, imunes à reação clerical."
 FRA_le_bloc_latin_mediterraneen:0 "The Latin Mediterranean Entente"
 FRA_le_bloc_latin_mediterraneen_desc:0 "Turning away from eastern entanglements, France unites the Romanic world—France, Italy, Spain, and Portugal—into a powerful Mediterranean customs and defense union."
 FRA_le_creusot_schneider:0 "Schneider et Cie at Le Creusot"
 FRA_le_creusot_schneider_desc:0 "Founded by Eugène Schneider, the gargantuan steelworks and foundry at Le Creusot design the world's most sophisticated heavy artillery, armor plates, and naval guns."
 FRA_le_pain_et_la_paix_juste:0 "Bread & Just Peace"
 FRA_le_pain_et_la_paix_juste_desc:0 "France stands as a beacon of progressive democracy, demonstrating to the workers of Europe that a peaceful socialist republic is possible without tyranny."
 FRA_le_parti_radical:0 "O Partido Radical-Socialista"
 FRA_le_parti_radical_desc:0 "Nem reacionário nem coletivista, o Partido Radical de Joseph Caillaux defende os pequenos proprietários, a escola laica e as liberdades cívicas como o verdadeiro centro de gravidade da política francesa."
 FRA_le_royaume_de_france_ressuscite:0 "The Kingdom Resurrected"
 FRA_le_royaume_de_france_ressuscite_desc:0 "With the tricolor crowned with gold lilies, the oldest kingdom of Christendom stands re-established, determined to reclaim its natural frontiers along the Rhine."
 FRA_le_sang_de_l_empire:0 "O Sangue do Império (Fraternidade de Armas)"
 FRA_le_sang_de_l_empire_desc:0 "Mais de seiscentos mil soldados coloniais combateram nos campos da Europa. Seus sacrifícios forjam um laço inquebrantável de respeito mútuo dentro da república."
 FRA_le_scandale_calmette_caillaux:0 "O Caso Calmette-Caillaux"
 FRA_le_scandale_calmette_caillaux_desc:0 "Em março de 1914, Henriette Caillaux atirou em Gaston Calmette, editor do Le Figaro, após ameaças de publicação de cartas íntimas. O sensacional julgamento paralisa a nação às vésperas da crise europeia."
 FRA_le_wagon_de_rethondes_a_compiegne:0 "O Armistício de Compiègne (Rethondes)"
 FRA_le_wagon_de_rethondes_a_compiegne_desc:0 "Em 11 de novembro de 1918, no vagão ferroviário de Foch na floresta de Compiègne, a delegação alemã assina o armistício na décima primeira hora, selando a vitória."
 FRA_lecons_sanglantes_des_frontieres:0 "Lições Sangrentas das Fronteiras"
 FRA_lecons_sanglantes_des_frontieres_desc:0 "A perda de vinte e sete mil soldados em um único dia em Rossignol destrói os dogmas obsoletos: metralhadoras e estilhaços massacram o heroísmo cego."
 FRA_legendary_flying_aces:0 "Os Ases da Caça (Les Cigognes)"
 FRA_legendary_flying_aces_desc:0 "Heróis como Guynemer, Fonck e Nungesser inspiram a nação e desmoralizam os aviadores adversários."
 FRA_les_as_de_la_chasse_guynemer:0 "Les As: Guynemer & Les Cigognes"
 FRA_les_as_de_la_chasse_guynemer_desc:0 "Georges Guynemer and the legendary 'Escadrille des Cigognes' become immortal national symbols. Their duels in the clouds inspire a war-weary population."
 FRA_les_camelots_du_roi:0 "Les Camelots du Roi"
 FRA_les_camelots_du_roi_desc:0 "The militant youth league of Action Française sells Charles Maurras's paper on the boulevards, breaks up radical meetings, and rallies patriotic students around the fleur-de-lis."
 FRA_les_munitionnettes:0 "Les Munitionnettes (Mulheres na Indústria Bélica)"
 FRA_les_munitionnettes_desc:0 "Centenas de milhares de mulheres francesas assumem tornos e fábricas de pólvora, usinando espoletas, montando projéteis e mantendo a república armada."
 FRA_les_munitionnettes_ouvrieres:0 "The Heroic Munitionnettes"
 FRA_les_munitionnettes_ouvrieres_desc:0 "Over 400,000 French women take their places at lathes, chemical presses, and assembly lines. Their tireless patriotism keeps the guns roaring day and night."
 FRA_les_mutineries_des_poilus:0 "The Poilus Mutinies of 1917"
 FRA_les_mutineries_des_poilus_desc:0 "Singing the Chanson de Craonne, sixty-eight divisions mutiny. The soldiers refuse to participate in suicidal butcheries, though promising to defend their trenches."
 FRA_lessons_of_the_frontiers:0 "Lições das Batalhas das Fronteiras"
 FRA_lessons_of_the_frontiers_desc:0 "A sangrenta derrota de agosto de 1914 destruiu a fé cega no ataque descoberto, ensinando a primazia do abrigo e do poder de fogo."
 FRA_light_machinegun_fireteams:0 "Equipes Táticas de Metralhadora Leve Chauchat"
 FRA_light_machinegun_fireteams_desc:0 "Distribuir fuzis-metralhadoras ao nível de esquadra confere à infantaria capacidade própria de fogo em movimento."
 FRA_loi_des_retraites_ouvrieres:0 "Lei de Previdência Operária"
 FRA_loi_des_retraites_ouvrieres_desc:0 "A implementação de aposentadorias públicas para trabalhadores industriais e rurais pacifica as agitações sindicais e consolida a lealdade dos camponeses à república."
 FRA_loi_des_trois_ans_1913:0 "A Lei Militar dos Três Anos de 1913"
 FRA_loi_des_trois_ans_1913_desc:0 "Diante da expansão do exército do Kaiser, o parlamento aprova a Lei dos Três Anos, estendendo o serviço militar obrigatório para manter 750.000 combatentes ativos sob as armas."
 FRA_lyautey_moroccan_order:0 "Ordem do Protetorado Marroquino de Lyautey"
 FRA_lyautey_moroccan_order_desc:0 "O respeito aos costumes locais aliado ao desenvolvimento econômico garante estabilidade e tranquilidade no Marrocos."
 FRA_madagascar_strategic_minerals:0 "Minerais Estratégicos de Madagascar"
 FRA_madagascar_strategic_minerals_desc:0 "Grafite, mica e metais preciosos extraídos da ilha fortalecem a instrumentação militar francesa de alta precisão."
 FRA_maintien_du_parlementarisme_guerre:0 "Supervisão Parlamentar na Guerra"
 FRA_maintien_du_parlementarisme_guerre_desc:0 "Diferente da ditadura militar de Ludendorff na Alemanha, a França preserva a supremacia republicana legislativa. Deputados inspecionam hospitais de campanha e trincheiras regularmente."
 FRA_maitrise_definitive_de_la_mediterranee:0 "Mastery of the Mediterranean"
 FRA_maitrise_definitive_de_la_mediterranee_desc:0 "From Gibraltar to Port Said, the tricolor rules the waves. The central powers remain blockaded, while French colonial lines flow without hindrance."
 FRA_manufacture_d_armes_saint_etienne:0 "Arsenal Nacional de Saint-Étienne (MAS)"
 FRA_manufacture_d_armes_saint_etienne_desc:0 "A Manufacture d'Armes de Saint-Étienne produz em massa os fuzis Lebel M1886 e Berthier, garantindo canos raiados de precisão e padronização absoluta."
 FRA_mass_swarm_tank_tactics:0 "Táticas de Enxame de Blindados Ligeiros"
 FRA_mass_swarm_tank_tactics_desc:0 "Empregar centenas de blindados ligeiros em estreito apoio mútuo sobrecarrega os cinturões defensivos inimigos."
 FRA_measured_justice_and_pardons:0 "Justiça Militar Moderada e Indultos"
 FRA_measured_justice_and_pardons_desc:0 "Limitar execuções aos cabeças e perdoar os praças para cicatrizar o moral da tropa."
 FRA_mediterranean_battlefleet:0 "1ère Armée Navale (Toulon)"
 FRA_mediterranean_battlefleet_desc:0 "A França concentra seus navios de linha no Mediterrâneo para neutralizar ameaças austro-húngaras e otomanas."
 FRA_mediterranean_dominance:0 "Domínio Naval do Mediterrâneo"
 FRA_mediterranean_dominance_desc:0 "O controle total das rotas do Mediterrâneo garante a movimentação segura de tropas do Norte da África e Levante."
 FRA_mines_de_charbon_du_nord:0 "Minas de Carvão de Nord-Pas-de-Calais"
 FRA_mines_de_charbon_du_nord_desc:0 "De Lens a Valenciennes, centenas de milhares de mineiros extraem antracito para alimentar as locomotivas, usinas e lareiras de toda a França."
 FRA_mines_de_fer_de_l_ouenza:0 "Minas de Ferro de Ouenza"
 FRA_mines_de_fer_de_l_ouenza_desc:0 "A exploração a céu aberto das gigantescas jazidas de hematita de Ouenza no leste da Argélia envia minério de alta pureza por ferrovia ao porto de Bône para a metrópole."
 FRA_ministere_de_l_armement_albert_thomas:0 "Ministério do Armamento de Albert Thomas"
 FRA_ministere_de_l_armement_albert_thomas_desc:0 "O deputado socialista Albert Thomas organiza comitês de produção, padroniza encomendas com industriais privados e eleva a fabricação de obuses de 10.000 para 200.000 diários."
 FRA_ministere_de_la_marine:0 "Reorganização do Ministério da Marinha"
 FRA_ministere_de_la_marine_desc:0 "O Almirante Auguste Boué de Lapeyrère extingue a inércia burocrática na Rue Royale, estabelecendo uma doutrina agressiva de esquadra centrada em couraçados e no controle do Mediterrâneo."
 FRA_miracle_of_the_marne:0 "Espírito do Milagre do Marne"
 FRA_miracle_of_the_marne_desc:0 "A desesperada contra-ofensiva que salvou Paris forjou um laço inabalável de resiliência em todas as patentes."
 FRA_mise_en_valeur_de_l_algerie:0 "Desenvolvimento da Argélia Francesa"
 FRA_mise_en_valeur_de_l_algerie_desc:0 "Considerados departamentos integrantes da França, Argel e Oran recebem maquinário agrícola, vinhedos e portos ampliados para abastecer a metrópole com trigo, vinho e rebanhos."
 FRA_mission_militaire_en_roumanie_berthelot:0 "Missão Militar Berthelot na Romênia"
 FRA_mission_militaire_en_roumanie_berthelot_desc:0 "O General Henri Berthelot e oficiais franceses reconstroem o exército romeno na Moldávia, introduzindo táticas modernas que garantem a vitória heróica em Mărășești."
 FRA_mission_viviani_joffre_aux_usa:0 "Missão Viviani-Joffre em Washington"
 FRA_mission_viviani_joffre_aux_usa_desc:0 "O Marechal Joffre é ovacionado em Washington na primavera de 1917, convencendo Woodrow Wilson a acelerar o despacho de divisões americanas para a França."
 FRA_missions_medicales_coloniales_calmette:0 "Institutos Pasteur e Medicina Tropical"
 FRA_missions_medicales_coloniales_calmette_desc:0 "Os institutos Pasteur em Saïgon, Túnis e Dakar combatem a malária, a doença do sono e a desinteria, protegendo populações nativas e soldados."
 FRA_mitrailleuses_vickers_d_aviation:0 "Metralhadoras Sincronizadas Vickers de Aviação"
 FRA_mitrailleuses_vickers_d_aviation_desc:0 "A adoção do sincronizador mecânico Alkan-Hamy permite disparar metralhadoras Vickers alimentadas por fita através da hélice sem perda de cadência."
 FRA_mobilisation_des_esprits:0 "Mobilização das Consciências"
 FRA_mobilisation_des_esprits_desc:0 "Intelectuais, professores, cientistas e a Academia Francesa mobilizam-se na defesa cultural da civilização contra o militarismo germânico, incutindo determinação cívica em todas as escolas."
 FRA_modernisation_du_creusot:0 "Expansão da Fundição Pesada de Le Creusot"
 FRA_modernisation_du_creusot_desc:0 "A instalação de martelos a vapor hidráulicos de 100 toneladas na Schneider et Cie permite forjar canhões de grande calibre e couraças navais pesadas."
 FRA_modernisation_du_port_du_havre:0 "Expansão dos Portos de Le Havre e Rouen"
 FRA_modernisation_du_port_du_havre_desc:0 "Guindastes a vapor e conexões ferroviárias diretas no estuário do Sena permitem desembarcar centenas de milhares de toneladas de suprimentos transatlânticos semanalmente."
 FRA_monarchie_traditionnelle_et_corporative:0 "Corporate Kingdom & Guilds"
 FRA_monarchie_traditionnelle_et_corporative_desc:0 "Replacing cutthroat party competition with professional corporations and provincial assemblies, labor and capital are united under the paternal protection of the Crown."
 FRA_monoplans_morane_saulnier:0 "Morane-Saulnier Monoplanes"
 FRA_monoplans_morane_saulnier_desc:0 "The parasol-wing monoplanes of Morane-Saulnier offer superb downward visibility and speed, serving as our primary scout and observation machines."
 FRA_morocco_treaty_of_fez:0 "Soberania do Tratado de Fez"
 FRA_morocco_treaty_of_fez_desc:0 "O estatuto de protetorado francês sobre o Marrocos é formalmente referendado por tratado internacional."
 FRA_mortiers_de_tranchee_crapouillots:0 "Morteiros de Trincheira 'Crapouillots'"
 FRA_mortiers_de_tranchee_crapouillots_desc:0 "Apelidados de 'crapouillots', esses morteiros de tiro curvo lançam torpedos aéreos dentro dos parapeitos inimigos, pulverizando ninhos de metralhadoras."
 FRA_moteurs_hispano_suiza_et_gnome:0 "Motores Aeronáuticos Hispano-Suiza e Gnome"
 FRA_moteurs_hispano_suiza_et_gnome_desc:0 "O motor V8 de alumínio fundido Hispano-Suiza de Marc Birkigt e os motores rotativos Gnome entregam potência formidável, impulsionando os caças franceses ao topo mundial."
 FRA_munitionnettes_workforce:0 "As Munitionnettes"
 FRA_munitionnettes_workforce_desc:0 "Centenas de milhares de francesas corajosas assumem tornos e linhas de montagem de explosivos nas fábricas de guerra."
 FRA_mutinies_crisis_management:0 "Crisis of the French Army (1917 Mutinies)"
 FRA_mutinies_crisis_management_desc:0 "Resolve widespread disobedience and despair among the poilus following the catastrophic Chemin des Dames offensive."
 FRA_national_credit_solvency:0 "Solvência do Crédit National"
 FRA_national_credit_solvency_desc:0 "Uma entidade estatal dedicada de crédito coordena fundos de reconstrução e reconversão industrial pós-guerra."
 FRA_nationalisation_des_mines_et_chemins_de_fer:0 "Nationalize Strategic Mines & Rails"
 FRA_nationalisation_des_mines_et_chemins_de_fer_desc:0 "The private railway cartels and northern coal combines are converted into democratic public utilities, directed toward collective welfare rather than private dividends."
 FRA_negocier_avec_l_italie_traite_de_londres:0 "Tratado Secreto de Londres com a Itália (1915)"
 FRA_negocier_avec_l_italie_traite_de_londres_desc:0 "A diplomacia franco-britânica afasta Roma da Tríplice Aliança, garantindo o Trentino, Trieste e a Ístria em troca da declaração de guerra contra a Áustria-Hungria."
 FRA_night_interception_patrols:0 "Patrulhas de Interceptação Noturna"
 FRA_night_interception_patrols_desc:0 "Holofotes coordenados, detectores acústicos e patrulhas noturnas interceptam incursões de bombardeiros inimigos."
 FRA_nineteenth_corps_african_army:0 "19º Corpo de Exército (Armée d’Afrique)"
 FRA_nineteenth_corps_african_army_desc:0 "Veteranos endurecidos das campanhas na Argélia e Tunísia formam a vanguarda de choque da força expedicionária francesa."
 FRA_nivelle_offensive_mission:0 "Operação de Ruptura em Chemin des Dames"
 FRA_nivelle_offensive_mission_desc:0 "Concentre artilharia massiva e forças de assalto para romper as posições alemãs ao longo do Aisne em até 45 dias."
 FRA_nivelle_offensive_surge:0 "Tentativa de Ruptura de Chemin des Dames"
 FRA_nivelle_offensive_surge_desc:0 "Bônus de assalto temporário: massiva preparação de artilharia pelo Aisne. Expira rapidamente com severa exaustão se prolongado."
 FRA_offensive_des_cent_jours:0 "A Grande Ofensiva dos Cem Dias de Foch"
 FRA_offensive_des_cent_jours_desc:0 "'Todos à batalha!' Foch desfere ataques sincronizados por toda a frente com tanques, aviões e artilharia pesada, despedaçando a Linha Hindenburg."
 FRA_offensive_du_vardar_franchet_d_esperey:0 "Ruptura de Franchet d'Espèrey no Vardar"
 FRA_offensive_du_vardar_franchet_d_esperey_desc:0 "Em setembro de 1918, Franchet d'Espèrey rompe as defesas búlgaras em Dobro Pole, forçando a Bulgária a capitular e abrindo a rota de invasão da Áustria e Hungria."
 FRA_offensive_nivelle_chemin_des_dames:0 "A Ofensiva Nivelle no Chemin des Dames"
 FRA_offensive_nivelle_chemin_des_dames_desc:0 "O General Robert Nivelle promete a ruptura em 48 horas. O sangrento assalto às cristas fortificadas em abril de 1917 precipita um choque moral profundo."
 FRA_offensive_school:0 "Escola da Ofensiva à Outrance"
 FRA_offensive_school_desc:0 "A crença na manobra agressiva e no espírito da baioneta orienta a doutrina inicial de combate do exército francês."
 FRA_offensives_de_champagne_et_artois:0 "The Attritional Bloodbaths of 1915"
 FRA_offensives_de_champagne_et_artois_desc:0 "Testing the creeping barrage doctrine in Champagne, Artois, and Neuve-Chapelle, the French Army proves that raw courage without heavy shell saturation achieves only martyrdom."
 FRA_operation_de_la_marne:0 "O Milagre do Marne e os Táxis de Gallieni"
 FRA_operation_de_la_marne_desc:0 "O General Gallieni requisita os táxis de Paris para lançar reservas sobre o Ourcq. Joffre golpeia o flanco exposto de Von Kluck, salvando Paris."
 FRA_optiques_aeriennes_de_precision:0 "Fotografia Aérea e Mapeamento de Trincheiras"
 FRA_optiques_aeriennes_de_precision_desc:0 "Instalar câmeras de precisão nas fuselagens mapeia as linhas de trincheiras alemãs, casamatas e baterias de artilharia com atualização fotográfica diária."
 FRA_or_des_francais_pour_la_patrie:0 "O Ouro dos Franceses pela Pátria"
 FRA_or_des_francais_pour_la_patrie_desc:0 "Cidadãos trocam suas moedas de ouro de Napoleão por notas de banco nos caixas públicos, abastecendo os cofres do Banco da França para respaldar empréstimos no exterior."
 FRA_ordre_moral_et_republicain:0 "Moral & Republican Order"
 FRA_ordre_moral_et_republicain_desc:0 "Reconciling conservative Catholics with the republican regime, the state ends secular hostilities and honors church heritage as an essential pillar of national cohesion."
 FRA_organisation_de_la_voie_sacree:0 "La Voie Sacrée (A Via Sagrada)"
 FRA_organisation_de_la_voie_sacree_desc:0 "Três mil caminhões operam dia e noite na artéria Bar-le-Duc-Verdun, transportando cinquenta mil toneladas de projéteis e noventa mil soldados semanalmente."
 FRA_pacification_du_maroc_lyautey:0 "Resident-General Hubert Lyautey"
 FRA_pacification_du_maroc_lyautey_desc:0 "General Lyautey pacifies rebellious tribes with diplomacy, schools, and roads rather than brutal destruction: 'Show strength so as not to have to use it.'"
 FRA_pacifisme_de_jean_jaures:0 "A Cruzada de Paz de Jean Jaurès"
 FRA_pacifisme_de_jean_jaures_desc:0 "Com oratória apaixonada e através das páginas do L'Humanité, Jaurès alerta para o massacre iminente da juventude europeia, conclamando a solidariedade entre operários franceses e alemães para evitar a catástrofe."
 FRA_pacifisme_et_arbitrage_international:0 "Internationalist Arbitration"
 FRA_pacifisme_et_arbitrage_international_desc:0 "Jaurès's grand vision: resolving border disputes and imperial rivalry through open international tribunals and socialist conferences rather than secret military alliances."
 FRA_pacte_de_non_agression_continental:0 "Continental Non-Aggression Pact"
 FRA_pacte_de_non_agression_continental_desc:0 "France and Germany sign a mutual pledge of non-aggression, dismantling the explosive alliance tripwires that threatened to drag Europe into self-destruction."
 FRA_pams_conciliatory_presidency:0 "Presidência Conciliatória de Pams"
 FRA_pams_conciliatory_presidency_desc:0 "Jules Pams adota uma política moderada e pacifista com o objetivo de desarmar crises europeias por arbitragem multilateral."
 FRA_parc_d_artillerie_lourde_rimailho:0 "Expansão de Artilharia Pesada (Schneider 155mm)"
 FRA_parc_d_artillerie_lourde_rimailho_desc:0 "Corrigindo as deficiências pré-guerra, encomendas maciças de obuses Schneider de 155mm e morteiros de 220mm conferem poder esmagador de contra-bateria."
 FRA_parliamentary_equilibrium:0 "Equilíbrio Parlamentar"
 FRA_parliamentary_equilibrium_desc:0 "Coalisões cuidadosas entre radicais e moderados mantêm a governança republicana estável por meio do consenso parlamentar."
 FRA_parliamentary_mutiny_turmoil:0 "Parliamentary Turmoil of 1917"
 FRA_parliamentary_mutiny_turmoil_desc:0 "Following the collapse of the Nivelle Offensive, strikes in Paris and mutinies in the trenches threaten to topple the civilian government."
 FRA_pasteur_colonial_hygiene:0 "Rede Médica Ultramarina Pasteur"
 FRA_pasteur_colonial_hygiene_desc:0 "Campanhas de vacinação e controle de doenças tropicais preservam guarnições militares e populações locais."
 FRA_patrouilles_anti_sous_marines:0 "Anti-Submarine Patrols & Escorts"
 FRA_patrouilles_anti_sous_marines_desc:0 "Arming trawlers, torpedo boats, and fast yachts with depth charges and searchlights counters the growing menace of unrestricted German submarine warfare."
 FRA_perte_des_mines_du_nord_repli:0 "Evacuação Emergencial de Maquinário Pesado"
 FRA_perte_des_mines_du_nord_repli_desc:0 "Com a invasão alemã sobre a bacia de Briey e o departamento de Nord, tornos mecânicos, plantas e operários são evacuados para o Vale do Loire e Maciço Central."
 FRA_petain_commandant_en_chef:0 "Pétain Nomeado Comandante-em-Chefe"
 FRA_petain_commandant_en_chef_desc:0 "Substituindo o imprudente Nivelle, Philippe Pétain visita pessoalmente dezenas de divisões, prometendo o fim dos massacres e restaurando a confiança dos soldados."
 FRA_petain_elastic_defense:0 "Defesa Elástica em Profundidade de Pétain"
 FRA_petain_elastic_defense_desc:0 "Manter as primeiras linhas com poucos homens e esmagar penetrações com artilharia massiva e contra-ataques imediatos."
 FRA_petain_welfare_and_leave_reform:0 "Reformas de Licença e Bem-Estar de Pétain"
 FRA_petain_welfare_and_leave_reform_desc:0 "Conceder licenças regulares, rações quentes e cessar assaltos frontais suicidas para restaurar a confiança do exército."
 FRA_phosphates_de_tunisie:0 "Minas de Fosfato de Gafsa na Tunísia"
 FRA_phosphates_de_tunisie_desc:0 "As jazidas de fosfato de Gafsa fornecem matéria-prima indispensável para fertilizantes agrícolas, síntese de ácido nítrico e manufatura de munições na França."
 FRA_pilot_training_corps:0 "Escolas de Voo da Aeronáutica"
 FRA_pilot_training_corps_desc:0 "Currículos padronizados de voo em Pau e Étampes formam aviadores de alto calibre em acrobacias e tiro aéreo."
 FRA_plan_xvii_concentration:0 "Concentração do Plano XVII"
 FRA_plan_xvii_concentration_desc:0 "Horários ferroviários milimetricamente planejados concentram cinco exércitos franceses ao longo da fronteira."
 FRA_plans_de_debarquement_du_bef:0 "Planos Secretos de Desembarque do BEF"
 FRA_plans_de_debarquement_du_bef_desc:0 "O General Henry Wilson e o estado-maior francês mapeiam os desembarques em Le Havre, Boulogne e Rouen, alinhando a Força Expedicionária Britânica no flanco esquerdo francês."
 FRA_poincare_national_firmness:0 "Firmeza Nacional de Poincaré"
 FRA_poincare_national_firmness_desc:0 "A liderança patriótica firme fortalece a unidade nacional e sinaliza compromisso inabalável com os aliados de tratado da França."
 FRA_poincare_presidency:0 "Presidência Poincaré"
 FRA_poincare_presidency_desc:0 "Raymond Poincaré traz firmeza inabalável, orgulho nacional e determinação diplomática ao Palácio do Eliseu."
 FRA_port_strategique_de_dakar:0 "Porto Estratégico de Águas Profundas de Dakar"
 FRA_port_strategique_de_dakar_desc:0 "A dragagem dos canais, depósitos de carvão e fortificação do Cabo Verde tornam Dakar a principal base naval francesa para as rotas do Atlântico Sul."
 FRA_porte_hydravions_foudre:0 "Seaplane Tender 'La Foudre'"
 FRA_porte_hydravions_foudre_desc:0 "The world's first operational seaplane carrier, La Foudre launches Farman and Caudron floatplanes to scout enemy coastlines and spot naval gunfire."
 FRA_ports_charbonniers_rouen:0 "Diques de Carvão e Transbordo Fluvial de Rouen"
 FRA_ports_charbonniers_rouen_desc:0 "A dragagem do Sena permite que cargueiros britânicos naveguem até Rouen, descarregando carvão em barcaças destinadas às usinas de energia de Paris."
 FRA_ports_de_madagascar:0 "Porto de Águas Profundas de Tamatave"
 FRA_ports_de_madagascar_desc:0 "A ampliação dos cais e quebra-mares em Tamatave e Diego Suarez garante bases de abastecimento de carvão no Oceano Índico para cruzadores coloniais."
 FRA_ports_de_saigon_et_haiphong:0 "Modernize Saigon & Haiphong Ports"
 FRA_ports_de_saigon_et_haiphong_desc:0 "Dredging channels and expanding dry docks in Cochin-China enables heavy merchant freighters and Far East cruisers to service the Pacific trade network."
 FRA_pourparlers_d_etat_major_joffre_jilinsky:0 "Convenção de Estados-Maiores Joffre-Jilinsky"
 FRA_pourparlers_d_etat_major_joffre_jilinsky_desc:0 "O General Joffre e o General Yakov Zhilinsky acordam que a Rússia lançará ofensiva imediata na Prússia Oriental no 15º dia de mobilização, dividindo as forças alemãs."
 FRA_prep_eastern_railway_priority:0 "Prioridade Ferroviária na Linha do Leste"
 FRA_prep_eastern_railway_priority_desc:0 "Conceder prioridade máxima à Compagnie de l'Est para transportar 50 comboios de munição de artilharia por dia até o front da Lorena."
 FRA_prep_first_army_belfort:0 "Mobilizar 1º Exército em Belfort"
 FRA_prep_first_army_belfort_desc:0 "Concentrar corpos de infantaria e artilharia de montanha no desfiladeiro de Belfort para abrir caminho até Mulhouse."
 FRA_prep_second_army_morhange:0 "Desdobrar 2º Exército em Nancy e Morhange"
 FRA_prep_second_army_morhange_desc:0 "O exército do General Castelnau deve romper as fortificações de fronteira alemãs e libertar Sarrebourg."
 FRA_preserver_la_republique:0 "Preservar a Terceira República"
 FRA_preserver_la_republique_desc:0 "Nascida das cinzas de Sedan em 1870, a Terceira República ergue-se como o baluarte da liberdade, da democracia secular e da igualdade cívica. Apesar das turbulências parlamentares, o regime republicano permanece nosso santuário sagrado."
 FRA_presidence_pams:0 "Presidência Conciliadora de Jules Pams"
 FRA_presidence_pams_desc:0 "Apoiado por Clemenceau e pelos radicais de esquerda, Jules Pams prioriza reformas sociais internas, redução de tensões diplomáticas e harmonia constitucional contra o militarismo revanchista."
 FRA_presidence_poincare:0 "Presidência Patriótica de Poincaré"
 FRA_presidence_poincare_desc:0 "Filho da Lorena que testemunhou a vitória alemã em 1870, Raymond Poincaré traz digna firmeza ao Palácio do Eliseu, determinado a não permitir que a França se curve a ultimatos externos."
 FRA_presidential_executive_authority:0 "Strong Presidential Republic"
 FRA_presidential_executive_authority_desc:0 "Under constitutional overhaul, the President exercises extensive executive powers free from parliamentary instability, steering national policy with decisive authority."
 FRA_presse_populaire_et_illustres:0 "Imprensa Popular e Ilustrados"
 FRA_presse_populaire_et_illustres_desc:0 "O Le Petit Journal, Le Matin e L'Écho de Paris consolidam uma cultura cívica compartilhada, conectando os debates de Paris às vilas provincianas por centavos."
 FRA_proclamer_la_commune_francaise:0 "Proclaim the French Commune"
 FRA_proclamer_la_commune_francaise_desc:0 "1871 is avenged! The parliamentary republic is dissolved in favor of the Commune des Travailleurs de France, governed by elected workers' and soldiers' councils."
 FRA_proclamer_union_sacree:0 "Proclamar a União Sagrada"
 FRA_proclamer_union_sacree_desc:0 "'Nada quebrará a União Sagrada de todos os franceses diante do inimigo', proclama o Presidente Poincaré. Católicos, socialistas, radicais e monarquistas cerram fileiras lado a lado nas trincheiras."
 FRA_projet_cuirasses_classe_lyon:0 "Lyon-Class Quadruple Turret Project"
 FRA_projet_cuirasses_classe_lyon_desc:0 "Conceived with sixteen 340mm guns in four revolutionary quadruple turrets, the Lyon project points the way toward future naval mastery."
 FRA_protection_de_jean_jaures:0 "Shield Jean Jaurès"
 FRA_protection_de_jean_jaures_desc:0 "By assigning security and unmasking nationalist conspiracies, France prevents the tragic assassination of Jean Jaurès in July 1914, preserving the conscience of the nation."
 FRA_protectorat_de_tunisie:0 "Tunisian Protectorate Administration"
 FRA_protectorat_de_tunisie_desc:0 "Established under the Treaty of Bardo, the protectorate in Tunis expands railway networks and exports rich agricultural harvests and minerals to Marseille."
 FRA_protectorat_marocain_lyautey:0 "O Protetorado Marroquino de Lyautey"
 FRA_protectorat_marocain_lyautey_desc:0 "O General Hubert Lyautey governa o Marrocos com respeito às instituições locais, pacificando tribos dissidentes por meio de estradas, hospitais e desenvolvimento comercial."
 FRA_puissance_industrielle_de_1918:0 "Titã Industrial de 1918"
 FRA_puissance_industrielle_de_1918_desc:0 "Em 1918, a França transformou-se no arsenal da Entente, abastecendo seus próprios exércitos e equipando as divisões americanas com artilharia, aviões e tanques."
 FRA_q_ships_and_coastal_avisos:0 "Avisos Costeiros e Navios-Isca Q-Ships"
 FRA_q_ships_and_coastal_avisos_desc:0 "Armar embarcações civis com canhões ocultos de tiro rápido cria armadilhas mortais para submarinos inimigos na superfície."
 FRA_question_du_maroc_1911:0 "A Crise Marroquina (Agadir 1911)"
 FRA_question_du_maroc_1911_desc:0 "A chegada da canhoneira alemã SMS Panther a Agadir deflagra grave crise europeia. A França deve defender seus direitos no Norte da África sem precipitar uma guerra prematura."
 FRA_race_to_the_sea_entrenchment:0 "Frente Contínua de Trincheiras"
 FRA_race_to_the_sea_entrenchment_desc:0 "Ligar trincheiras contínuas da Suíça até o Mar do Norte impede manobras de flanqueamento adicionais."
 FRA_radicalisation_de_la_cgt:0 "Radicalization of the CGT"
 FRA_radicalisation_de_la_cgt_desc:0 "The Confédération Générale du Travail adopts the Charter of Amiens as revolutionary creed. Frustrated by wartime suffering, revolutionary syndicalists demand worker control."
 FRA_railway_super_heavy_artillery:0 "Artilharia Super-Pesada Ferroviária (ALVF)"
 FRA_railway_super_heavy_artillery_desc:0 "Monstruosos canhões navais de 320mm e 400mm sobre vagões ferroviários destroem fortificações subterrâneas de concreto."
 FRA_rationnement_du_pain_et_charbon:0 "Strict Rationing & Supply Management"
 FRA_rationnement_du_pain_et_charbon_desc:0 "Introducing national ration cards for bread, sugar, and heating fuel ensures fair distribution to civilian families while prioritizing front supply trains."
 FRA_rationnement_et_ravitaillement:0 "Racionamento de Pão, Açúcar e Carvão"
 FRA_rationnement_et_ravitaillement_desc:0 "Cartões de racionamento e tabelamento de preços evitam a especulação, garantem distribuição justa nas cidades e mantêm o fornecimento de carvão aos fogões do exército."
 FRA_ravitaillement_naval_du_front_salonique:0 "Naval Lifeline to Salonika"
 FRA_ravitaillement_naval_du_front_salonique_desc:0 "Maintaining uninterrupted transport and hospital ship runs across the Aegean keeps General Sarrail's multinational Army of the Orient supplied."
 FRA_reconciliation_avec_les_catholiques:0 "Reconciliação com os Católicos"
 FRA_reconciliation_avec_les_catholiques_desc:0 "Padres e seminaristas atuando como maqueiros e oficiais nas trincheiras dissolvem velhos ressentimentos anticlericais, unindo fiéis e laicos sob o tricolor."
 FRA_reconstitution_des_territoires_liberes:0 "Reconstrução das Regiões Libertadas"
 FRA_reconstitution_des_territoires_liberes_desc:0 "O planejamento para drenagem das minas inundadas de Lens, desminagem dos campos e reconstrução das eclusas prepara a França para o renascimento pós-guerra."
 FRA_reconversion_industrielle_totale:0 "Total Civilian Industrial Reconversion"
 FRA_reconversion_industrielle_totale_desc:0 "Bicycle shops produce machine gun mountings, perfume distilleries brew chemical weapons, and jewelry artisans turn artillery shell fuses across Lyon and Bordeaux."
 FRA_recrutement_des_legions_etrangeres:0 "Legião Estrangeira Francesa (Sidi Bel Abbès)"
 FRA_recrutement_des_legions_etrangeres_desc:0 "De seu berço em Sidi Bel Abbès, os regimentos calejados da Legião Estrangeira acolhem milhares de voluntários estrangeiros que acorrem para defender Paris."
 FRA_recrutement_des_spahis_algeriens:0 "Regimentos de Cavalaria dos Spahis Argelinos"
 FRA_recrutement_des_spahis_algeriens_desc:0 "Montados em velozes cavalos berberes, os ginetes dos spahis argelinos realizam missões de reconhecimento móvel e perseguição nas planícies de Champagne."
 FRA_reforme_des_permissions_et_soupe:0 "Reformas de Licenças, Sopas Quentes e Vinho"
 FRA_reforme_des_permissions_et_soupe_desc:0 "Pétain garante licenças regulares de sete dias para rever as famílias, limpa os alojamentos e assegura sopa quente e rações de vinho nas trincheiras."
 FRA_reforme_des_statuts_indigenes:0 "Reform the Indigénat Code"
 FRA_reforme_des_statuts_indigenes_desc:0 "Deputy Blaise Diagne negotiates French citizenship rights for Senegalese volunteers: 'They shed their blood on the battlefields of France; they are sons of the Republic.'"
 FRA_reforme_fiscale_impot_revenu:0 "Reforma do Imposto de Renda de 1914"
 FRA_reforme_fiscale_impot_revenu_desc:0 "Após árduas batalhas parlamentares, a lei de imposto de renda progressivo de Joseph Caillaux é aprovada, conferindo à República uma base tributária moderna para financiar os gastos de Estado."
 FRA_reforme_millerand_executif_fort:0 "Millerand's Executive Reform"
 FRA_reforme_millerand_executif_fort_desc:0 "Alexandre Millerand articulates the necessity of a strong President capable of dissolving parliament, appointing ministers freely, and securing national defense without parliamentary paralysis."
 FRA_regiments_de_chasseurs_alpins:0 "Chasseurs Alpins ('Les Diables Bleus')"
 FRA_regiments_de_chasseurs_alpins_desc:0 "The elite mountain regiments wearing wide berets and dark blue tunics master the rocky heights of the Vosges and the Alpine passes with peerless grit."
 FRA_regiments_de_tirailleurs_marocains:0 "Tirailleurs e Goumiers Marroquinos"
 FRA_regiments_de_tirailleurs_marocains_desc:0 "Organizados em batalhões de choque velozes, os tirailleurs marroquinos demonstram ferocidade e perícia tática na Argonne e nos Vosgos."
 FRA_reglage_d_artillerie_par_tsh:0 "Wireless Artillery Spotting (TSH)"
 FRA_reglage_d_artillerie_par_tsh_desc:0 "Equipping observation aircraft with Télégraphie Sans Fil (TSH) allows airborne observers to correct artillery fire in real time onto hidden German batteries."
 FRA_relations_financieres_avec_les_usa:0 "Relações Comerciais e Financeiras com os EUA"
 FRA_relations_financieres_avec_les_usa_desc:0 "Compras volumosas de cobre e grãos nos Estados Unidos forjam profunda interdependência econômica, pavimentando a entrada definitiva de Washington no conflito."
 FRA_renault_ft_revolution:0 "Conceito de Tanque Renault FT"
 FRA_renault_ft_revolution_desc:0 "A torre giratória revolucionária em 360 graus e o motor traseiro definem a guerra mecanizada moderna."
 FRA_renouveau_nationaliste:0 "Nationalist Revival"
 FRA_renouveau_nationaliste_desc:0 "Echoing the patriotic leagues of Paul Déroulède and Maurice Barrès, conservative republicans call for moral rearmament, respect for the army, and devotion to the nation."
 FRA_reorganisation_post_guerre:0 "Renovação Institucional do Pós-Guerra"
 FRA_reorganisation_post_guerre_desc:0 "A modernização das comissões parlamentares e dos poderes das prefeituras prepara o Estado para liderar a reconstrução e a desmobilização."
 FRA_repli_du_gouvernement_a_bordeaux:0 "Retirada do Governo para Bordeaux"
 FRA_repli_du_gouvernement_a_bordeaux_desc:0 "Com a cavalaria alemã aproximando-se de Paris em setembro de 1914, o governo e o Banco da França transferem-se temporariamente para Bordeaux, assegurando a continuidade do Estado enquanto Gallieni defende a capital."
 FRA_reponse_a_la_menace_sous_marine:0 "Contramedidas Anti-Submarinas"
 FRA_reponse_a_la_menace_sous_marine_desc:0 "Ataques de U-Boots no Mediterrâneo afundam cargueiros e transportes de tropas. A marinha instala hidrofones, calhas de cargas de profundidade e patrulhas aéreas litorâneas."
 FRA_reponse_au_coup_d_agadir:0 "Response to the Agadir Crisis"
 FRA_reponse_au_coup_d_agadir_desc:0 "July 1911: The German gunboat SMS Panther anchors at the Atlantic port of Agadir to challenge French hegemony. Paris refuses to be intimidated by gunboat diplomacy."
 FRA_repression_mesuree_des_meneurs:0 "Measured Discipline & Pardons"
 FRA_repression_mesuree_des_meneurs_desc:0 "Refusing mass executions, Pétain commutes hundreds of death sentences to hard labor, executing only 49 undeniable mutiny leaders while healing the army's spirit."
 FRA_repressions_du_defaitisme:0 "Repressão ao Derrotismo"
 FRA_repressions_du_defaitisme_desc:0 "Redes pacifistas clandestinas, publicações financiadas pela Alemanha como o Le Bonnet Rouge e agentes corruptos são desmascarados e julgados para manter a coragem da retaguarda."
 FRA_republican_vigilance:0 "Vigilância Republicana"
 FRA_republican_vigilance_desc:0 "As instituições da Terceira República permanecem guardadas contra intrigas monarquistas, clericais e autoritárias pela dedicação cívica."
 FRA_republique_sociale_et_democratique:0 "The Social & Democratic Republic"
 FRA_republique_sociale_et_democratique_desc:0 "Transforming the bourgeois state, the new government enacts landmark welfare protections, workers' sickness insurance, and pensions for laboring veterans."
 FRA_requisition_parisian_taxis:0 "Requisitar os Táxis Parisienses do Marne"
 FRA_requisition_parisian_taxis_desc:0 "Ordenar à polícia que requisite 600 táxis Renault AG-1 em Paris para enviar reforços de infantaria com urgência ao Ourcq."
 FRA_reseau_de_forts_sere_de_rivieres:0 "Cadeia de Fortalezas Séré de Rivières"
 FRA_reseau_de_forts_sere_de_rivieres_desc:0 "As fortalezas de Verdun, Toul, Épinal e Belfort canalizam as invasões alemãs para zonas de aniquilação preparadas ao longo do Mosa e Mosela."
 FRA_reseau_ferroviaire_du_nord_et_est:0 "Troncos Ferroviários do Norte e Leste"
 FRA_reseau_ferroviaire_du_nord_et_est_desc:0 "A duplicação das linhas estratégicas conectando Paris a Reims, Nancy e Verdun assegura o tráfego pesado de cargas e os cronogramas de mobilização militar."
 FRA_ressources_de_l_aef_brazzaville:0 "AEF & Equatorial Concessions"
 FRA_ressources_de_l_aef_brazzaville_desc:0 "French Equatorial Africa opens up the vast timber and rubber resources of the Congo Basin, sustaining war material production across the Atlantic trade lanes."
 FRA_ressources_de_l_aof_dakar:0 "AOF & Port of Dakar"
 FRA_ressources_de_l_aof_dakar_desc:0 "French West Africa funnels rubber, peanuts, and hardwoods through the fortified Atlantic deep-water port of Dakar, safe from Central Powers interdiction."
 FRA_ressources_de_madagascar:0 "Grafite e Minerais Estratégicos de Madagascar"
 FRA_ressources_de_madagascar_desc:0 "Madagascar fornece grafite cristalino para cadinhos metalúrgicos, mica para isolamento elétrico e carne em conserva para a alimentação dos soldados no front."
 FRA_restauration_du_duc_d_orleans:0 "Coronation of Philippe VIII"
 FRA_restauration_du_duc_d_orleans_desc:0 "The Duke of Orléans returns from exile to Reims Cathedral, consecrated as King of France and Navarre, restoring the unbroken chain of forty kings who built France."
 FRA_retour_de_l_alsace_lorraine:0 "O Retorno da Alsácia-Lorena"
 FRA_retour_de_l_alsace_lorraine_desc:0 "Após 47 anos de luto, tropas francesas entram em Estrasburgo e Metz sob lágrimas de alegria. O véu negro é retirado da estátua de Estrasburgo na Place de la Concorde."
 FRA_revanche_accomplished:0 "Revanche Accomplished"
 FRA_revanche_accomplished_desc:0 "The stain of 1870 is finally washed away. Alsace and Lorraine have returned to the bosom of the Republic, restoring French pride and continental pre-eminence."
 FRA_riz_et_mines_d_indochine:0 "Indochinese Rice & Rubber Riches"
 FRA_riz_et_mines_d_indochine_desc:0 "The Union of Indochina ships hundreds of thousands of tons of grain from the Mekong Delta, alongside high-grade rubber and Tonkin anthracite coal."
 FRA_rotate_frontline_divisions_noria:0 "Executar o Sistema Noria de Rotação"
 FRA_rotate_frontline_divisions_noria_desc:0 "Retirar divisões exaustas da linha regularmente para recuperar o moral e recompor a força de combate."
 FRA_rotation_de_la_noria_petain:0 "O Sistema da 'Noria' de Pétain"
 FRA_rotation_de_la_noria_petain_desc:0 "Em vez de deixar divisões serem aniquiladas no front, setenta divisões francesas revezam-se em turnos de alta intensidade antes de serem poupadas."
 FRA_rouen_coal_dispatch:0 "Terminal Carvoeiro de Rouen"
 FRA_rouen_coal_dispatch_desc:0 "Docas dragadas e guindastes especializados descarregam carvão galês e escocês rapidamente em barcaças rumo a Paris."
 FRA_royalist_catholic_order:0 "Traditional Monarchy & Catholic Order"
 FRA_royalist_catholic_order_desc:0 "Action Française has restored the throne of Saint Louis. Corporation councils, traditional provincial liberties, and firm hierarchy replace parliamentary decadence."
 FRA_rupture_de_la_ligne_hindenburg:0 "Break the Hindenburg Line"
 FRA_rupture_de_la_ligne_hindenburg_desc:0 "Storming the deepest trench fortresses of the Siegfriedstellung, French, British, and American divisions smash through the German defenses, forcing Germany to capitulate."
 FRA_russian_steamroller_pledge:0 "Russian Steamroller M+15 Commitment"
 FRA_russian_steamroller_pledge_desc:0 "Under the Joffre-Zhilinsky staff protocols, the Imperial Russian Army pledges an immediate general invasion of East Prussia by the 15th day of mobilization, forcing Germany to divide its forces."
 FRA_secular_civic_order:0 "Ordem Cívica Secular"
 FRA_secular_civic_order_desc:0 "A separação entre Igreja e Estado consolidou a sociedade civil e a educação pública como base da democracia francesa moderna."
 FRA_senat_et_chambre_des_deputes:0 "Senado e Câmara dos Deputados"
 FRA_senat_et_chambre_des_deputes_desc:0 "Equilibrar a sabedoria conservadora do Senado com as vívidas paixões democráticas do Palais Bourbon assegura o equilíbrio legislativo e protege a República contra autocratas ou aventureiros militares."
 FRA_shell_crisis_1914:0 "A Crise de Munições de 1914"
 FRA_shell_crisis_1914_desc:0 "O consumo sem precedentes de artilharia esvaziou os arsenais metropolitanos, forçando o racionamento emergencial de projéteis de 75mm."
 FRA_siderurgie_electrique_ugine:0 "Aços Especiais e Ligas de Ugine"
 FRA_siderurgie_electrique_ugine_desc:0 "Fornos elétricos a arco de Paul Girod fundem ligas de cromo, níquel e tungstênio essenciais para obuses perfurantes e motores de aviação."
 FRA_skilled_workforce_recall:0 "Affectés Spéciaux (Retorno dos Especialistas)"
 FRA_skilled_workforce_recall_desc:0 "Mecânicos experientes, metalúrgicos e químicos são retirados das trincheiras para operar indústrias bélicas de alta precisão."
 FRA_socialist_labor_peace:0 "Pacto Trabalhista Socialista"
 FRA_socialist_labor_peace_desc:0 "O diálogo construtivo com socialistas reformistas e sindicatos operários mantém a paz social em setores industriais cruciais."
 FRA_socialist_welfare_state:0 "The Social and Democratic Republic"
 FRA_socialist_welfare_state_desc:0 "Guided by Jean Jaurès and the SFIO, France has enacted the 8-hour workday, progressive income taxation, and industrial arbitration, creating a model of social justice."
 FRA_solidarite_avec_la_belgique:0 "Solidariedade com a Bélgica Heroica"
 FRA_solidarite_avec_la_belgique_desc:0 "Quando os exércitos alemães violam a neutralidade belga em 4 de agosto de 1914, a França envia divisões ao norte para apoiar a resistência do Rei Alberto I em Liège."
 FRA_solidarite_nationale_veufs_orphelins:0 "Pupilos da Nação (Viúvas e Órfãos)"
 FRA_solidarite_nationale_veufs_orphelins_desc:0 "A República adota os órfãos de guerra como 'Pupilles de la Nation', garantindo financiamento público integral para sua educação, saúde e subsistência."
 FRA_somme_artillery_coordination:0 "Barragem Rolante e Fogo Coordenado"
 FRA_somme_artillery_coordination_desc:0 "Cronometrar cortinas de artilharia para avançar exatamente 100 metros à frente da infantaria neutraliza ninhos de metralhadoras."
 FRA_sous_marins_classe_pluviose:0 "Pluviôse & Brumaire Submarines"
 FRA_sous_marins_classe_pluviose_desc:0 "French steam and diesel submersibles prove their endurance in the Adriatic and Aegean Seas, penetrating defended enemy anchorages."
 FRA_soutien_du_cabinet_britannique:0 "British Mansion House Solidarity"
 FRA_soutien_du_cabinet_britannique_desc:0 "David Lloyd George declares that Britain will not allow peace to be bought at the price of humiliation, standing shoulder-to-shoulder with France against German sabre-rattling."
 FRA_soutien_financier_au_tsar:0 "Envio de Armas e Projéteis à Rússia"
 FRA_soutien_financier_au_tsar_desc:0 "Apesar da escassez interna, comboios de armas pesadas, metralhadoras e munições são despachados para o exército do Czar através de Arkhangelsk e Vladivostok."
 FRA_soutien_inconditionnel_a_la_serbie:0 "Resgate e Reequipamento do Exército Sérvio"
 FRA_soutien_inconditionnel_a_la_serbie_desc:0 "Após a retirada pelos picos albaneses, navios franceses evacuam 140.000 soldados sérvios para Corfu, rearmando-os com fuzis e canhões franceses para retomar a luta."
 FRA_spad_fighter_supremacy:0 "Superioridade dos Caças SPAD"
 FRA_spad_fighter_supremacy_desc:0 "Os robustos caças SPAD VII e XIII com motores Hispano-Suiza V8 dominam os combates aéreos em grandes altitudes."
 FRA_stabilisation_du_front_de_tranchees:0 "Engenharia de Sistemas de Trincheiras"
 FRA_stabilisation_du_front_de_tranchees_desc:0 "Da Suíça ao Mar do Norte, os sapadores escavam três linhas paralelas com abrigos profundos, parapeitos e densas redes de arame farpado."
 FRA_stabilisation_du_front_occidental:0 "Western Front Trench Stalemate"
 FRA_stabilisation_du_front_occidental_desc:0 "The war of movement has ended. In deep mud and chalk dugouts, two million French poilus dig in behind barbed wire, awaiting the artillery storms."
 FRA_stabilite_ministerielle_garantie:0 "Guaranteed Cabinet Stability"
 FRA_stabilite_ministerielle_garantie_desc:0 "New constitutional rules restrict votes of no-confidence to a two-thirds threshold, preventing opportunistic cabinet collapses and ensuring multi-year governmental programs."
 FRA_standardisation_des_calibres:0 "Padronização dos Calibres de Guerra"
 FRA_standardisation_des_calibres_desc:0 "Aposentar canhões obsoletos do século XIX concentra o maquinário industrial exclusivamente no obus de 75mm, no morteiro de 155mm e na munição de fuzil 8mm."
 FRA_standardised_war_tooling:0 "Padronização do Maquinário Bélico"
 FRA_standardised_war_tooling_desc:0 "Padronização técnica rigorosa em todas as fábricas de armas agiliza as linhas de montagem e a logística de munição."
 FRA_statut_des_fonctionnaires:0 "Estatuto do Funcionalismo Público"
 FRA_statut_des_fonctionnaires_desc:0 "A profissionalização dos prefeitos e da burocracia ministerial garante uma administração transparente, rigor fiscal e rápida capacidade de mobilização."
 FRA_statut_naval_boue_de_lapeyrere:0 "Lapeyrère's Naval Organic Statute"
 FRA_statut_naval_boue_de_lapeyrere_desc:0 "Admiral Boué de Lapeyrère's ambitious 1912 program ended the confusion of the Jeune École, committing France to a modern battle fleet of 28 modern dreadnoughts."
 FRA_statut_naval_de_1912:0 "Estatuto Naval de 1912"
 FRA_statut_naval_de_1912_desc:0 "A aprovação do estatuto naval plurianual de Boué de Lapeyrère financia a construção de vinte e oito couraçados de primeira linha para manter superioridade sobre frotas austro-italianas."
 FRA_suffrage_et_citoyennete:0 "Sufrágio Universal e Cidadania Cívica"
 FRA_suffrage_et_citoyennete_desc:0 "A consolidação do sufrágio universal masculino direto e a valorização das prefeituras fortalecem a lealdade republicana nas comunas rurais."
 FRA_superdreadnoughts_classe_bretagne:0 "Bretagne-Class Super-Dreadnoughts"
 FRA_superdreadnoughts_classe_bretagne_desc:0 "Upgrading to ten 340mm guns mounted along the centerline, the Bretagne, Provence, and Lorraine represent the pinnacle of French wartime naval architecture."
 FRA_suprematie_aerienne_absolue:0 "Supremacia Aérea Absoluta sobre o Front"
 FRA_suprematie_aerienne_absolue_desc:0 "Em 1918, as esquadrilhas francesas dominam completamente os céus do front ocidental, cegando a artilharia alemã e metralhando colunas em retirada na Linha Hindenburg."
 FRA_supreme_allied_command:0 "Comando Supremo Aliado (Foch)"
 FRA_supreme_allied_command_desc:0 "O Marechal Ferdinand Foch dirige todos os exércitos britânicos, americanos e franceses sob estratégia operacional unificada."
 FRA_supreme_combined_arms:0 "Allied Supreme Command & Combined Arms"
 FRA_supreme_combined_arms_desc:0 "Under Supreme Commander Ferdinand Foch, coordinated waves of Renault FT tanks, tactical aviation, and massed artillery sweep forward in decisive breakthrough operations."
 FRA_supreme_industrial_mobilisation:0 "Mobilização Industrial Suprema"
 FRA_supreme_industrial_mobilisation_desc:0 "Coordenação econômica total entre gigantes automobilísticos, siderúrgicas pesadas e conglomerados químicos."
 FRA_surveillance_du_detroit_de_gibraltar:0 "Gibraltar Strait Surveillance"
 FRA_surveillance_du_detroit_de_gibraltar_desc:0 "Coordinating with the British garrison at the Rock, French maritime patrol aircraft and patrol craft seal the western entrance to the Mediterranean."
 FRA_synchronisation_de_mitrailleuse_garros:0 "Defletores de Hélice de Roland Garros"
 FRA_synchronisation_de_mitrailleuse_garros_desc:0 "Roland Garros e Raymond Saulnier instalam cunhas defletoras de aço nas pás das hélices, permitindo que uma metralhadora frontal dispare através da rotação da hélice."
 FRA_synchronized_vickers_guns:0 "Defletores e Engrenagens Sincronizadoras"
 FRA_synchronized_vickers_guns_desc:0 "Metralhadoras disparando através do arco da hélice transformam os caças franceses em armas letais de combate."
 FRA_tactique_des_convois_maritimes:0 "Sistema Obrigatório de Comboios Escoltados"
 FRA_tactique_des_convois_maritimes_desc:0 "Reunir navios mercantes em comboios protegidos por contratorpedeiros, traineiras armadas e hidroaviões reduz as perdas navais em mais de oitenta por cento."
 FRA_tamatave_port_infrastructure:0 "Instalações Portuárias de Tamatave"
 FRA_tamatave_port_infrastructure_desc:0 "Píeres modernizados e guindastes de carga protegem rotas marítimas vitais no Oceano Índico."
 FRA_technological_manpower_substitution:0 "Technological Manpower Substitution"
 FRA_technological_manpower_substitution_desc:0 "As advocated by General Pétain, machines and firepower must replace human flesh. Renault FT light tanks and massed artillery batteries preserve French soldiers' lives."
 FRA_the_tiger_dictatorship:0 "Le Tigre War Ministry"
 FRA_the_tiger_dictatorship_desc:0 "Clemenceau exercises supreme political willpower over the nation. Parliament is held in line and all industrial and civilian energy is subordinated to the war effort."
 FRA_they_shall_not_pass:0 "'Ils Ne Passeront Pas!'"
 FRA_they_shall_not_pass_desc:0 "The sacred vow of the poilus at Verdun. No German division shall breach the ring of forts, no matter the sacrifice demanded."
 FRA_third_republic_politics:0 "Politics of the Third Republic"
 FRA_third_republic_politics_desc:0 "Manage the delicate balance of parliamentary power between Radicals, Socialists, and Conservatives, and respond to civil emergencies."
 FRA_three_year_conscription:0 "Lei do Serviço Militar de Três Anos"
 FRA_three_year_conscription_desc:0 "Estender o serviço obrigatório para três anos compensa o déficit demográfico da França, fornecendo divisões prontas na fronteira."
 FRA_three_year_law_and_colonial_ranks:0 "Conscrição Ampliada e Fileiras Coloniais"
 FRA_three_year_law_and_colonial_ranks_desc:0 "Combinar o serviço de três anos metropolitano com o recrutamento do norte e oeste africanos garante reservas estratégicas robustas."
 FRA_tir_a_travers_l_helice_garros:0 "Roland Garros Armored Deflector Blades"
 FRA_tir_a_travers_l_helice_garros_desc:0 "Aviator Roland Garros fitted armored steel wedges to his propeller blades, enabling his Hotchkiss machine gun to fire directly through the propeller arc."
 FRA_tirailleurs_algeriens_et_goumiers:0 "Algerian Tirailleurs & Moroccan Goumiers"
 FRA_tirailleurs_algeriens_et_goumiers_desc:0 "Hardened North African infantry and mounted Spahis display unparalleled bravery and discipline, holding key defense sectors at Douaumont and the Chemin des Dames."
 FRA_tirailleurs_marocains_shock:0 "Quadros de Choque dos Atiradores Marroquinos"
 FRA_tirailleurs_marocains_shock_desc:0 "Famosos pela feroz capacidade de assalto nas trincheiras, regimentos marroquinos lideram contra-ofensivas na linha de frente."
 FRA_tirailleurs_senegalais:0 "Batalhões de Assalto dos Tirailleurs Sénégalais"
 FRA_tirailleurs_senegalais_desc:0 "Armados com fuzis Lebel e distintas quépis vermelhas, os disciplinados tirailleurs senegaleses combatem com lendária bravura em Ypres, no Somme e no Chemin des Dames."
 FRA_tirailleurs_senegalais_valor:0 "Tenacidade dos Atiradores Senegaleses"
 FRA_tirailleurs_senegalais_valor_desc:0 "A coragem inabalável sob pesado bombardeio inimigo confere aos atiradores oeste-africanos status lendário."
 FRA_torpilleurs_de_haute_mer_arabe:0 "Arabe-Class Fleet Torpedo Destroyers"
 FRA_torpilleurs_de_haute_mer_arabe_desc:0 "Built in Japanese and French shipyards, these fast destroyers provide agile screening and torpedo salvos for French heavy divisions."
 FRA_torpilleurs_et_contre_torpilleurs:0 "Produção em Massa de Contratorpedeiros"
 FRA_torpilleurs_et_contre_torpilleurs_desc:0 "A produção em série dos contratorpedeiros das classes Bouclier e Bisson oferece escoltas velozes para caçar submarinos e proteger os esquadrões de couraçados."
 FRA_traite_de_fez_1912:0 "Tratado de Fez (Protetorado Marroquino)"
 FRA_traite_de_fez_1912_desc:0 "O Sultão Abdelhafid assina o Tratado de Fez, estabelecendo formalmente o Protetorado Francês no Marrocos sob Lyautey e reconhecendo a esfera espanhola no norte."
 FRA_transition_vers_l_economie_de_guerre:0 "Transition to Total War Economy"
 FRA_transition_vers_l_economie_de_guerre_desc:0 "With the northeastern industrial departments falling into German hands in August 1914, France must reorganize the entire remaining nation into a single military workshop."
 FRA_travailleurs_coloniaux_de_marseille:0 "Colonial Labor Battalions at Marseille"
 FRA_travailleurs_coloniaux_de_marseille_desc:0 "Over 100,000 Indochinese, Malagasy, and North African contract laborers unload convoy ships, pave roads, and staff ammunition factories across southern France."
 FRA_treaty_of_london_1839_guarantor:0 "Garantidor do Tratado de Londres de 1839"
 FRA_treaty_of_london_1839_guarantor_desc:0 "A França posiciona-se incondicionalmente em favor da neutralidade e soberania belga contra a agressão imperial."
 FRA_trench_soup_and_wine_rations:0 "Rações Melhoradas dos Poilus (Pinard e Sopa Quente)"
 FRA_trench_soup_and_wine_rations_desc:0 "Fornecer refeições quentes e rações regulares de vinho pinard diretamente nas trincheiras eleva o ânimo da tropa."
 FRA_uniformes_horizon_bleu:0 "Adoção dos Uniformes 'Azul-Horizonte'"
 FRA_uniformes_horizon_bleu_desc:0 "Abandonar os calções vermelhos brilhantes que tornavam os soldados alvos fáceis e vestir o azul-horizonte confere camuflagem essencial nas trincheiras."
 FRA_uniformes_pantalon_rouge_tradition:0 "Traditional Red Trousers ('Le Pantalon Rouge')"
 FRA_uniformes_pantalon_rouge_tradition_desc:0 "Minister of War Eugène Étienne proclaimed: 'Abolish the red trousers? Never! The red trousers are France!' The brilliant garance trousers remain sacred tradition."
 FRA_union_sacree_spirit:0 "A União Sagrada"
 FRA_union_sacree_spirit_desc:0 "Todas as rivalidades políticas dissolvem-se em solidariedade solene para defender a França contra a invasão estrangeira."
 FRA_us_financial_pipeline:0 "J.P. Morgan Credit Pipeline"
 FRA_us_financial_pipeline_desc:0 "American investment banking houses open multi-billion dollar credit lines for French munitions purchases, raw materials, and agricultural food shipments."
 FRA_usines_automobiles_renault_panhard:0 "Fábricas Automobilísticas Renault, Panhard e Peugeot"
 FRA_usines_automobiles_renault_panhard_desc:0 "A França lidera a produção automobilística europeia. A expansão das fábricas de Louis Renault em Boulogne-Billancourt estabelece linhas de montagem de caminhões e ambulâncias."
 FRA_usines_de_poudre_saint_fons:0 "Fábricas Nacionais de Pólvora e Explosivos"
 FRA_usines_de_poudre_saint_fons_desc:0 "A expansão das fábricas estatais de pólvora em Bergerac, Ripault e Saint-Médard assegura centenas de toneladas diárias de propelente sem fumaça para a artilharia."
 FRA_usines_du_nord_et_pas_de_calais:0 "Nord & Pas-de-Calais Coal Basins"
 FRA_usines_du_nord_et_pas_de_calais_desc:0 "Deep coal pits at Lens, Douai, and Valenciennes extract tens of millions of tons of black diamonds annually, powering French locomotives and metallurgical furnaces."
 FRA_verdun_resilience:0 "Defesa da Fortaleza de Verdun (Surto Ativo)"
 FRA_verdun_resilience_desc:0 "Surto temporário de combate delimitado: resiliência heroica em Fort Douaumont e Vaux. Dura estritamente durante a crise."
 FRA_verdun_resilience_mission:0 "Resistência na Fortaleza de Verdun"
 FRA_verdun_resilience_mission_desc:0 "Mantenha Fort Douaumont, Fort Vaux e a linha do Mosa contra os ataques implacáveis do inimigo. Cada dia resistido preserva a França."
 FRA_versailles_supreme_guarantor:0 "Garantidor da Ordem Europeia"
 FRA_versailles_supreme_guarantor_desc:0 "Vitoriosa e resoluta, a França ergue-se como o principal garantidor da paz e dos tratados democráticos na Europa continental."
 FRA_victoire_electorale_socialiste:0 "Socialist Electoral Triumph"
 FRA_victoire_electorale_socialiste_desc:0 "Riding widespread popular revulsion against military adventurism, the SFIO and independent socialists secure an unprecedented majority in the Chamber of Deputies."
 FRA_victorious_aero_industry:0 "Indústria Aeronáutica Vitoriosa"
 FRA_victorious_aero_industry_desc:0 "A França produz mais aeronaves e motores de combate do que qualquer outra nação durante a Grande Guerra."
 FRA_visite_de_poincare_a_saint_petersbourg:0 "Visita de Estado de Poincaré a São Petersburgo"
 FRA_visite_de_poincare_a_saint_petersbourg_desc:0 "Em julho de 1914, a bordo do couraçado France, Poincaré navega a São Petersburgo, reafirmando aliança inabalável com Nicolau II enquanto a Crise de Julho se avizinha."
 FRA_voie_du_rapprochement_franco_allemand:0 "Franco-German Rapprochement (Caillaux Vision)"
 FRA_voie_du_rapprochement_franco_allemand_desc:0 "Advocated by Joseph Caillaux, this vision seeks to overcome the blood-feud of 1870 through economic partnership between French capital and German industrial dynamism."
 FRA_wagons_de_mobilisation_rapide:0 "Standardized Rolling Stock ('Hommes 40, Chevaux 8')"
 FRA_wagons_de_mobilisation_rapide_desc:0 "Every French boxcar is standardized with military markings: 40 men or 8 horses. Thousands of locomotives stand fueled in reserve, ready for instant mobilization day."
 FRA_war_cabinet_discipline:0 "Disciplina do Gabinete de Guerra"
 FRA_war_cabinet_discipline_desc:0 "A autoridade executiva enxuta garante decisões ágeis em tempos de guerra e coordenação decisiva de recursos."
 FRA_war_economy_and_munitions:0 "Wartime Economic Mobilization"
 FRA_war_economy_and_munitions_desc:0 "Convert domestic industry, expand heavy shell manufacturing, issue national defense loans, and manage civilian rationing."
 FRA_wards_of_the_nation_care:0 "Pupilos da Nação"
 FRA_wards_of_the_nation_care_desc:0 "A República adota os órfãos de guerra e ampara as famílias viúvas, cimentando a gratidão social e a força moral."
 FRA_wearing_union_sacree:0 "Strain on the Sacred Union"
 FRA_wearing_union_sacree_desc:0 "The endless slaughter at Verdun and the Somme has rekindled parliamentary friction, socialist pacifism, and trade union strike threats."
 FRA_western_front_operations:0 "Operações da Frente Ocidental"
 FRA_western_front_operations_desc:0 "Decisões estratégicas e ordens emergenciais de comando na Frente Ocidental."
 FRA_ww1_division_rotation:0 "Sistema Noria de Rotação de Divisões"
 FRA_ww1_division_rotation_desc:0 "Rotacionar unidades de primeira linha regularmente evita o colapso do moral e mantém alta coesão das tropas."
 FRA_ww1_field_fortification:0 "Fortificações Profundas de Campanha"
 FRA_ww1_field_fortification_desc:0 "Casamatas de concreto armado, abrigos subterrâneos profundos e arames farpados resistem ao bombardeio mais feroz."
 FRA_ww1_rationing:0 "Abastecimento Justo em Tempo de Guerra"
 FRA_ww1_rationing_desc:0 "Cupons de racionamento e cartões municipais garantem sustento alimentar adequado a operários urbanos e soldados."
 FRA_ww1_salonika_transport:0 "Armée d’Orient (Linha de Suprimento de Salônica)"
 FRA_ww1_salonika_transport_desc:0 "Comboios especializados de transporte mantêm a frente aliada multinacional no norte da Grécia e Bálcãs."
 FRA_zouaves_et_spahis_d_afrique:0 "19º Corpo de Exército (Zouaves, Spahis e Chasseurs)"
 FRA_zouaves_et_spahis_d_afrique_desc:0 "O lendário 19º Corpo de Exército da Argélia e Marrocos envia divisões coloniais de elite à França, encabeçadas por ginetes berberes e infantes veteranos."
 ww1_france.1.a:0 "Manter postura firme e consultar nossos aliados britânicos"
 ww1_france.1.b:0 "Negociar um compromisso colonial bilateral diretamente"
 ww1_france.1.d:0 "Em 1º de julho de 1911, a canhoneira alemã SMS Panther ancorou no porto marroquino de Agadir sob o pretexto de defender interesses comerciais. Berlim busca desafiar a hegemonia francesa no Marrocos."
 ww1_france.1.t:0 "A Crise de Agadir: O Panther em Agadir"
 ww1_france.10.a:0 "A França expande sua missão civilizatória"
 ww1_france.10.d:0 "O Sultão Abdelhafid assina o Tratado de Fez estabelecendo o Protetorado Francês no Marrocos sob a liderança do General Hubert Lyautey."
 ww1_france.10.t:0 "Tratado de Fez: O Protetorado Francês"
 ww1_france.101.a:0 "Pela França! Até a vitória final!"
 ww1_france.101.d:0 "Novembro de 1917: Aos 76 anos, Georges Clemenceau forma um governo de vontade férrea. 'Política interna? Eu faço a guerra. Política externa? Eu faço a guerra. O tempo todo, eu faço a guerra!'"
 ww1_france.101.t:0 "Clemenceau 'Le Tigre' Assume o Poder"
 ww1_france.111.a:0 "O Novo Mundo chega para salvar a Velha Europa!"
 ww1_france.111.d:0 "No túmulo de La Fayette, o Coronel Stanton proclama ao mundo: 'La Fayette, nós estamos aqui!' Os soldados americanos desembarcam em Saint-Nazaire e Brest com vigor inesgotável."
 ww1_france.111.t:0 "Chegada de Pershing e das Tropas Americanas"
 ww1_france.131.a:0 "Vitória! O pesadelo chegou ao fim!"
 ww1_france.131.d:0 "Na décima primeira hora do décimo primeiro dia do décimo primeiro mês, os canhões silenciam. No vagão de trem do Marechal Foch em Rethondes, a Alemanha assina os termos de rendição."
 ww1_france.131.t:0 "O Armistício de Compiègne: 11 de Novembro de 1918"
 ww1_france.132.a:0 "Viva a Alsácia! Viva a Lorena! Viva a França!"
 ww1_france.132.d:0 "Quarenta e oito anos de ocupação terminaram. Os poilus entram em Estrasburgo, Colmar e Metz sob arcos de flores. A França está completa novamente!"
 ww1_france.132.t:0 "Reintegração da Alsácia e da Lorena"
 ww1_france.2.a:0 "A Entente Cordiale permanece inabalável"
 ww1_france.2.d:0 "O Chanceler David Lloyd George profere um discurso resoluto em Mansion House: a Grã-Bretanha não permitirá que seus aliados sejam ignorados quando a paz europeia estiver em jogo."
 ww1_france.2.t:0 "Apoio Britânico: O Discurso de Mansion House"
 ww1_france.20.a:0 "A França está pronta para se defender"
 ww1_france.20.b:0 "Um compromisso de dois anos e meio preserva a paz social"
 ww1_france.20.d:0 "A Assembleia Nacional vota para estender o serviço militar obrigatório de dois para três anos, combatendo a crescente superioridade demográfica alemã."
 ww1_france.20.t:0 "Aprovação da Lei dos Três Anos de 1913"
 ww1_france.201.a:0 "Aceitar o ouro francês e construir ferrovias estratégicas duplas"
 ww1_france.201.b:0 "Recusar a tutela financeira estrangeira sobre nossa soberania"
 ww1_france.201.d:0 "Paris propõe um gigantesco pacote de financiamento para modernizar a rede ferroviária russa, acelerando a mobilização em direção à Prússia Oriental e à Galícia."
 ww1_france.201.t:0 "Proposta Francesa de Empréstimos Ferroviários Estratégicos"
 ww1_france.202.a:0 "O Rolo Compressor Russo ganha velocidade!"
 ww1_france.202.d:0 "O Czar Nicolau II ratifica o acordo. Os engenheiros russos iniciam o assentamento de trilhos duplos até Grodno e Varsóvia."
 ww1_france.202.t:0 "Rússia Aceita o Acordo Ferroviário Estratégico"
 ww1_france.203.a:0 "Um revés frustrante para a coordenação aliada"
 ww1_france.203.d:0 "A Stavka insiste em autonomia total sobre seus investimentos ferroviários, recusando imposições de Paris."
 ww1_france.203.t:0 "Rússia Rejeita as Condições Ferroviárias"
 ww1_france.204.a:0 "Comprometer o Rolo Compressor Russo até o Dia 15!"
 ww1_france.204.b:0 "A Stavka prioriza a frente austro-húngara"
 ww1_france.204.d:0 "O General Joffre solicita uma garantia categórica da Rússia: uma ofensiva geral na Prússia Oriental até o 15º dia de mobilização para dividir as forças alemãs."
 ww1_france.204.t:0 "Protocolos Joffre-Zhilinsky: Compromisso no Dia M+15"
 ww1_france.205.a:0 "Nossa aliança foi forjada em aço!"
 ww1_france.205.d:0 "O Grão-Duque Nicolau assina o protocolo. Em agosto de 1914, os exércitos russos marcharão sobre a Prússia Oriental, aliviando a pressão sobre Paris."
 ww1_france.205.t:0 "Rússia Promete Ofensiva no Dia 15"
 ww1_france.206.a:0 "A França deverá contar principalmente com suas próprias forças"
 ww1_france.206.d:0 "A Stavka recusa comprometer datas fixas, alertando que as vastas distâncias do império exigem cautela."
 ww1_france.206.t:0 "Rússia Recusa Cronograma Fixo de Mobilização"
 ww1_france.207.a:0 "Viva a Aliança Franco-Russa!"
 ww1_france.207.d:0 "O governo imperial russo despachou as matérias-primas prometidas, grãos e munições estratégicas através de comboios pelo Ártico e Mediterrâneo, consolidando nossa cooperação aliada."
 ww1_france.207.t:0 "Chegada de Carregamentos Estratégicos Russos"
 ww1_france.210.a:0 "Ratificar a partilha naval Mediterrâneo-Canal"
 ww1_france.210.b:0 "Manter o Esplêndido Isolamento e evitar compromissos"
 ww1_france.210.d:0 "Paris propõe a divisão da responsabilidade naval: a Royal Navy patrulha o Canal da Mancha e o Mar do Norte, enquanto a Marinha Francesa assume o Mar Mediterrâneo."
 ww1_france.210.t:0 "Convenção Naval Franco-Britânica de 1912"
 ww1_france.211.a:0 "A Entente Cordiale domina os mares!"
 ww1_france.211.d:0 "O Primeiro Lorde do Almirantado Winston Churchill confirma o acordo. A Grã-Bretanha protege o Canal; a França reina no Mediterrâneo."
 ww1_france.211.t:0 "Grã-Bretanha Ratifica a Convenção Naval"
 ww1_france.212.a:0 "Teremos de manter navios pesados no Canal nós mesmos"
 ww1_france.212.d:0 "O Gabinete britânico recusa compromissos formais, preservando a liberdade de ação da frota."
 ww1_france.212.t:0 "Grã-Bretanha Recusa a Partilha Naval"
 ww1_france.213.a:0 "Ratificar o cronograma da Força Expedicionária Britânica"
 ww1_france.213.b:0 "Manter o exército regular no território metropolitano"
 ww1_france.213.d:0 "O General Henry Wilson apresenta planos secretos para desembarcar seis divisões britânicas em Le Havre e posicioná-las no flanco esquerdo francês em Mons."
 ww1_france.213.t:0 "Cronogramas de Desembarque da BEF do General Wilson"
 ww1_france.214.a:0 "Os regimentos em caqui lutarão ao lado dos nossos poilus!"
 ww1_france.214.d:0 "Londres aprova os planos de desembarque. A BEF marchará ombro a ombro com nosso 5º Exército."
 ww1_france.214.t:0 "Gabinete Britânico Aprova o Desdobramento da BEF"
 ww1_france.215.a:0 "Teremos de cobrir nosso flanco esquerdo sozinhos"
 ww1_france.215.d:0 "O Gabinete britânico recusa prometer tropas em solo continental antes da eclosão da guerra."
 ww1_france.215.t:0 "Londres Retém Compromissos Terrestres"
 ww1_france.216.a:0 "O comando unificado assegura a vitória"
 ww1_france.216.d:0 "Os líderes aliados estabelecem o Conselho Supremo de Guerra em Versalhes, coordenando as frentes ocidental, italiana e balcânica sob comando único."
 ww1_france.216.t:0 "Conselho Supremo de Guerra em Versalhes"
 ww1_france.220.a:0 "Assinar o Tratado de Londres! Reconquistar as terras irredentas!"
 ww1_france.220.b:0 "Sacro Egoismo: Neutralidade Estrita"
 ww1_france.220.c:0 "Exigir a Córsega, Nice e a Tunísia da França!"
 ww1_france.220.d:0 "Os aliados oferecem à Itália o Trentino, o Tirol Meridional, Trieste, a Ístria e ilhas dálmatas em troca da entrada na guerra contra os Impérios Centrais."
 ww1_france.220.t:0 "Proposta do Tratado Secreto de Londres"
 ww1_france.221.a:0 "Avanti Savoia! O cerco aperta-se contra Viena!"
 ww1_france.221.d:0 "Roma rompe com a Tríplice Aliança e declara guerra à Áustria-Hungria! Uma nova frente de combate se abre nos Alpes e no rio Isonzo."
 ww1_france.221.t:0 "Itália Entra na Entente!"
 ww1_france.222.a:0 "Decepcionante, mas ao menos nossa fronteira alpina está segura"
 ww1_france.222.d:0 "A corrente neutralista de Giolitti prevalece em Roma. A Itália lucrará vendendo provisões a ambos os lados."
 ww1_france.222.t:0 "Itália Escolhe Neutralidade Estrita"
 ww1_france.223.a:0 "Insolência inadmissível! Reforçar as guarnições dos Alpes!"
 ww1_france.223.d:0 "Nacionalistas italianos exigem Nice, Saboia, Córsega e Tunísia como patrimônio italiano inalienável!"
 ww1_france.223.t:0 "Itália Reivindica Territórios Franceses!"
 ww1_france.230.a:0 "Aceitar as armas francesas e preparar a libertação da pátria!"
 ww1_france.230.d:0 "Navios franceses resgatam 140.000 soldados sérvios exaustos até Corfu. A França oferece fuzis Lebel, canhões 75mm e assistência médica para rearmar o exército."
 ww1_france.230.t:0 "Reorganização do Exército Sérvio em Corfu"
 ww1_france.231.a:0 "A brava Sérvia segue na luta!"
 ww1_france.231.d:0 "Restaurado pelos suprimentos franceses, o exército sérvio embarca rumo a Tessalônica com sede de revanche."
 ww1_france.231.t:0 "O Exército Sérvio Ressuscita em Corfu"
 ww1_france.232.a:0 "Dar as boas-vindas ao General Berthelot e às armas modernas!"
 ww1_france.232.d:0 "Paris envia o General Henri Berthelot com oficiais e carregamentos de armas para reorganizar o Exército Romeno entrincheirado na Moldávia."
 ww1_france.232.t:0 "Missão Militar do General Berthelot na Romênia"
 ww1_france.233.a:0 "A Romênia permanece firme no Leste!"
 ww1_france.233.d:0 "Sob a direção de Berthelot, divisões romenas entrincheiram-se no rio Siret e barram os alemães em Mărășești."
 ww1_france.233.t:0 "General Berthelot Reorganiza a Romênia"
 ww1_france.234.a:0 "Acolher as forças aliadas em Tessalônica (Venizelos)"
 ww1_france.234.b:0 "Protestar contra essa violação da neutralidade! (Monarquistas)"
 ww1_france.234.d:0 "Tropas aliadas desembarcam no porto de Tessalônica para socorrer a Sérvia e estabelecer a Frente dos Bálcãs."
 ww1_france.234.t:0 "Desembarque Aliado em Tessalônica"
 ww1_france.235.a:0 "Nossa cabeça de ponte balcânica está garantida!"
 ww1_france.235.d:0 "O Primeiro-Ministro Venizelos acolhe os aliados, consolidando a Frente de Salônica."
 ww1_france.235.t:0 "Grécia Autoriza a Base de Tessalônica"
 ww1_france.236.a:0 "Uma complicação diplomática delicada"
 ww1_france.236.d:0 "O Rei Constantino protesta contra a presença aliada, dividindo o país entre a Atenas monarquista e a Salônica venizelista."
 ww1_france.236.t:0 "O Cisma Nacional Grego"
 ww1_france.237.a:0 "Assinar o Armistício de Salônica e deixar a guerra!"
 ww1_france.237.d:0 "As tropas de Franchet d'Espèrey rompem as defesas búlgaras em Dobro Pole. Em colapso, a Bulgária pede armistício imediato."
 ww1_france.237.t:0 "Ruptura de Franchet d'Espèrey: Armistício de Salônica"
 ww1_france.238.a:0 "As peças do dominó começam a tombar!"
 ww1_france.238.d:0 "A Bulgária é o primeiro Império Central a capitular! As portas dos fundos para Viena e Constantinopla estão escancaradas!"
 ww1_france.238.t:0 "A Bulgária Capitula em Salônica!"
 ww1_france.250.a:0 "Autorizar os títulos de guerra de Wall Street para a França"
 ww1_france.250.b:0 "Preservar a estrita neutralidade e vetar empréstimos"
 ww1_france.250.d:0 "A França solicita autorização para que o banco J.P. Morgan & Co. lance centenas de milhões de dólares em bônus de guerra nos mercados americanos."
 ww1_france.250.t:0 "Autorização dos Créditos de Guerra de J.P. Morgan"
 ww1_france.251.a:0 "O poder financeiro americano abastece nossa indústria!"
 ww1_france.251.d:0 "Bilhões de dólares em capital americano compram comida, cobre, aço e algodão, atando os interesses financeiros dos EUA à vitória francesa."
 ww1_france.251.t:0 "Créditos de Wall Street Abertos para a França"
 ww1_france.252.a:0 "Teremos de apertar ainda mais os cintos"
 ww1_france.252.d:0 "O Presidente Wilson proíbe empréstimos aos países em conflito, obrigando a França a pagar tudo com ouro."
 ww1_france.252.t:0 "Washington Impõe Embargo Financeiro"
 ww1_france.253.a:0 "Padronizar o exército americano com a artilharia e tanques franceses"
 ww1_france.253.d:0 "Com a indústria bélica americana ainda se organizando, a França oferece equipar as divisões americanas com canhões 75mm, metralhadoras Chauchat e blindados Renault FT."
 ww1_france.253.t:0 "Equipando as Tropas Americanas de Pershing"
 ww1_france.254.a:0 "Juntos desferiremos o golpe decisivo!"
 ww1_france.254.d:0 "Os homens de Pershing marcham para as trincheiras munidos de fuzis, canhões e tanques franceses, formando um ariete invencível."
 ww1_france.254.t:0 "Tropas Americanas Armadas com Equipamentos Franceses"
 ww1_france.260.a:0 "Aceitar o ramo de oliveira! Formar o sindicato Briey-Ruhr!"
 ww1_france.260.b:0 "Rejeitar a fraqueza francesa! A Alemanha confia apenas na espada!"
 ww1_france.260.d:0 "O estadista Joseph Caillaux propõe uma reconciliação histórica: encerrar a rivalidade de 1870, forjar um consórcio do carvão e aço de Briey e do Ruhr e assegurar a paz no continente."
 ww1_france.260.t:0 "Iniciativa de Conciliação Franco-Alemã de Caillaux"
 ww1_france.261.a:0 "Uma nova era de paz no continente!"
 ww1_france.261.d:0 "Berlim acolhe a proposta de Caillaux! A cooperação industrial entre a França e a Alemanha dissipa o fantasma da guerra europeia."
 ww1_france.261.t:0 "Alemanha Aceita a Reconciliação Histórica!"
 ww1_france.262.a:0 "A França esqueceu-se de nossa aliança sagrada?"
 ww1_france.262.d:0 "São Petersburgo expressa indignação, encarando a aproximação franco-alemã como traição à Aliança Franco-Russa."
 ww1_france.262.t:0 "Rússia Denuncia a Conciliação Franco-Alemã"
 ww1_france.263.a:0 "Um colosso continental acaba de nascer..."
 ww1_france.263.d:0 "Londres enxerga o bloco econômico franco-alemão com enorme suspeita, temendo o isolamento britânico."
 ww1_france.263.t:0 "Grã-Bretanha Alarma-se com o Acordo Franco-Alemão"
 ww1_france.264.a:0 "O militarismo cega a liderança de Berlim"
 ww1_france.264.d:0 "O Kaiser e o Estado-Maior alemão rejeitam os planos de Caillaux, reafirmando que o destino da Alemanha será forjado a ferro e sangue."
 ww1_france.264.t:0 "Berlim Rejeita a Oferta de Reconciliação"
 ww1_france.265.a:0 "Concordar com o Condomínio neutro autônomo"
 ww1_france.265.b:0 "Jamais! A Terra do Império Alsácia-Lorena é alemã!"
 ww1_france.265.d:0 "Paris propõe que a Alsácia-Lorena se torne um território autônomo neutro sob proteção conjunta franco-alemã, extirpando a causa das guerras."
 ww1_france.265.t:0 "Proposta de Condomínio da Alsácia-Lorena"
 ww1_france.266.a:0 "A paz reina sobre as margens do Reno!"
 ww1_france.266.d:0 "Na Catedral de Estrasburgo, é selado o pacto histórico. As províncias perdidas tornam-se uma ponte de fraternidade em vez de um campo de morte."
 ww1_france.266.t:0 "Acordo de Condomínio Assinado em Estrasburgo!"
 ww1_france.267.a:0 "A ferida de 1870 segue aberta"
 ww1_france.267.d:0 "Berlim declara que a soberania sobre o Reichsland é inegociável."
 ww1_france.267.t:0 "Alemanha Recusa Qualquer Partilha da Alsácia-Lorena"
 ww1_france.268.a:0 "Assinar o Pacto Continental de Não-Agressão"
 ww1_france.268.b:0 "Recusar qualquer pedaço de papel com o rival histórico"
 ww1_france.268.d:0 "A França propõe um pacto solene de não-agressão mútua com a Alemanha, desarmando o mecanismo de alianças bélicas."
 ww1_france.268.t:0 "Proposta de Pacto Continental de Não-Agressão"
 ww1_france.269.a:0 "A Europa foi salva da autodestruição!"
 ww1_france.269.d:0 "A paz está assegurada! França e Alemanha juram nunca pegar em armas uma contra a outra, inaugurando uma era de cooperação inédita."
 ww1_france.269.t:0 "Pacto Continental de Não-Agressão Ratificado!"
 ww1_france.270.a:0 "Integrar a Entente Latina com nossa irmã latina!"
 ww1_france.270.b:0 "Recusar adesão; a Itália traçará seu próprio destino"
 ww1_france.270.d:0 "A França convida a Itália a compor um grande bloco latino no Mediterrâneo Ocidental, alinhando marinha, comércio e políticas coloniais."
 ww1_france.270.t:0 "A Entente Latina Mediterrânea"
 ww1_france.271.a:0 "Aderir à Entente Latina com a França!"
 ww1_france.271.b:0 "Preservar a tradicional neutralidade e isolamento da Espanha"
 ww1_france.271.d:0 "A França convida o Reino da Espanha a juntar-se à Entente Latina Mediterrânea, garantindo segurança mútua e cooperação aduaneira."
 ww1_france.271.t:0 "A Entente Latina Mediterrânea (Espanha)"
 ww1_france.3.a:0 "Concordar com a troca territorial pelo reconhecimento no Marrocos"
 ww1_france.3.b:0 "Rejeitar qualquer chantagem alemã!"
 ww1_france.3.d:0 "Berlim exige vastos territórios no Congo Francês e em Oubangui-Chari em troca de reconhecer as reivindicações francesas no Marrocos."
 ww1_france.3.t:0 "Demandas Territoriais Alemãs sobre a África Equatorial"
 ww1_france.30.a:0 "Um presidente de firmeza resoluta"
 ww1_france.30.b:0 "Jules Pams buscará a conciliação interna"
 ww1_france.30.d:0 "O estadista conservador Raymond Poincaré é eleito Presidente da Terceira República, prometendo firmeza inabalável perante as ameaças alemãs."
 ww1_france.30.t:0 "Eleição de Raymond Poincaré como Presidente"
 ww1_france.4.a:0 "Um compromisso amargo, mas a paz está preservada"
 ww1_france.4.b:0 "Nenhuma concessão de solo sagrado!"
 ww1_france.4.d:0 "Após meses de tensas negociações, a França cede um corredor no Congo ao Camarões Alemão em troca dos direitos indisputados de protetorado sobre o Marrocos."
 ww1_france.4.t:0 "O Acordo Franco-Alemão de 1911"
 ww1_france.40.a:0 "Nossa última voz pela paz foi silenciada..."
 ww1_france.40.d:0 "31 de julho de 1914: O fanático nacionalista Raoul Villain assassina o líder socialista da paz Jean Jaurès no Café du Croissant. A França perde sua maior voz pacifista às vésperas da catástrofe."
 ww1_france.40.t:0 "O Assassinato de Jean Jaurès"
 ww1_france.41.a:0 "L'Union Sacrée! Pour la Patrie!"
 ww1_france.41.d:0 "Os sinos das igrejas dobram em cada vila da França. Mais de três milhões de reservistas pegam seus fuzis e marcham para as estações ferroviárias com flores nos canos das armas."
 ww1_france.41.t:0 "Ordem de Mobilização Geral: 1º de Agosto de 1914"
 ww1_france.5.a:0 "A França não se deixará intimidar!"
 ww1_france.5.d:0 "Com o fracasso das negociações, a imprensa alemã clama por guerra e demonstrações navais na costa africana."
 ww1_france.5.t:0 "Ameaças Alemãs após o Colapso das Conversações"
 ww1_france.50.a:0 "Ordenar a retirada combativa para salvar os exércitos!"
 ww1_france.50.d:0 "Agosto de 1914: Investindo de calças vermelhas contra metralhadoras alemãs entrincheiradas, os exércitos franceses sofrem perdas catastróficas. A doutrina da ofensiva cega desmorona sob chumbo e estilhaços."
 ww1_france.50.t:0 "Batalha das Fronteiras: Carnificina na Alsácia-Lorena"
 ww1_france.51.a:0 "As províncias perdidas foram redimidas!"
 ww1_france.51.d:0 "Contra todas as probabilidades, os exércitos franceses rompem as linhas alemãs e marcham vitoriosos em Estrasburgo e Metz! A bandeira tricolor volta a tremular no Reno!"
 ww1_france.51.t:0 "Triunfo do Plano XVII: Alsácia e Lorena Libertadas!"
 ww1_france.52.a:0 "Consolidar linhas defensivas ao longo do Mosa"
 ww1_france.52.d:0 "Fortes contra-ataques alemães contêm o avanço francês com severas baixas. Ambos os lados começam a cavar trincheiras para uma guerra de atrito."
 ww1_france.52.t:0 "Plano XVII Repelido: Início do Impasse de Trincheiras"
 ww1_france.61.a:0 "Paris está salva! O invasor foi repelido!"
 ww1_france.61.d:0 "O General Gallieni requisita 600 táxis parisienses para transportar 6.000 homens da reserva até o rio Ourcq. Joffre golpeia o flanco exposto de von Kluck, barrando a marcha alemã sobre a capital."
 ww1_france.61.t:0 "O Milagre do Marne: Os Táxis Salvam Paris"
 ww1_france.71.a:0 "Ils ne passeront pas! Verdun resistirá!"
 ww1_france.71.d:0 "21 de fevereiro de 1916: 1.400 canhões alemães desferem o inferno sobre os fortes do Mosa para sangrar a França até a morte. Verdun se torna o altar sagrado da resistência francesa."
 ww1_france.71.t:0 "A Fornalha de Verdun: Falkenhayn Ataca"
 ww1_france.81.a:0 "A ofensiva tornou-se um massacre insustentável..."
 ww1_france.81.d:0 "Abril de 1917: A ruptura prometida pelo General Nivelle é pulverizada nas encostas calcárias de Craonne. Mais de 100.000 baixas em poucos dias quebram o moral do exército."
 ww1_france.81.t:0 "Catástrofe no Chemin des Dames"
 ww1_france.91.a:0 "A alma do exército está clamando por socorro..."
 ww1_france.91.d:0 "Entoando a Canção de Craonne, 68 divisões recusam-se a participar de ofensivas suicidas, embora jurem defender suas trincheiras contra qualquer ataque inimigo."
 ww1_france.91.t:0 "Os Motins dos Poilus de 1917"
 ww1_france.92.a:0 "A fé foi restabelecida nas fileiras"
 ww1_france.92.d:0 "Nomeado Comandante-em-Chefe, Philippe Pétain melhora as rações de sopa quente, concede licenças aos soldados e suspende os massacres inúteis: 'Estou esperando pelos tanques e pelos americanos.'"
 ww1_france.92.t:0 "O General Pétain Restaura a Ordem e a Esperança"
