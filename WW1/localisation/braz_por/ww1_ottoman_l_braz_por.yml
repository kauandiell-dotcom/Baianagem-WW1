 # --- Expanded WW1 Narrative & Systemic Keys ---
 ww1_ottoman.2.t:0 "O Ultimato dos Oficiais Salvadores"
 ww1_ottoman.2.d:0 "Oficiais dissidentes do exército, organizados na liga Halâskâr Zâbitân, emitiram um ultimato severo à Sublime Porta exigindo a renúncia imediata do gabinete unionista e garantias de eleições livres."
 ww1_ottoman.2.a:0 "Ceder aos oficiais e convidar a oposição liberal para o gabinete."
 ww1_ottoman.2.b:0 "A vanguarda unionista não cederá a conspiradores faccionais!"
 ww1_ottoman.3.t:0 "O Ataque ao Sublime Porte (Bab-ı Ali Baskını)"
 ww1_ottoman.3.d:0 "Enver Bey e oficiais armados do CUP invadiram a sala do conselho de ministros na Sublime Porta, forçando o Grão-Vizir Kâmil Pasha a assinar sua renúncia sob a mira de pistolas. O Comitê de União e Progresso assume o controle total do destino nacional."
 ww1_ottoman.3.a:0 "Consolidar o triunvirato de Enver, Talat e Cemal!"
 ww1_ottoman.3.b:0 "Buscar harmonia constitucional com o Sultão e o parlamento."
 ww1_ottoman.4.t:0 "O Primeiro Congresso Árabe de Paris"
 ww1_ottoman.4.d:0 "Delegados árabes reuniram-se em Paris formulando reivindicações de descentralização administrativa, reconhecimento oficial da língua árabe em tribunais e escolas, e serviço militar regionalizado dentro das províncias árabes."
 ww1_ottoman.4.a:0 "Aceitar a descentralização cultural e administrativa dos vilaietes."
 ww1_ottoman.4.b:0 "A unidade imperial não tolera concessões centrífugas!"
 ww1_ottoman.5.t:0 "A Missão Militar Alemã de Liman von Sanders"
 ww1_ottoman.5.d:0 "O Tenente-General Otto Liman von Sanders chegou a Constantinopla chefiando uma missão militar de elite para reformar os corpos de exército otomanos, provocando furiosos protestos diplomáticos por parte de São Petersburgo."
 ww1_ottoman.5.a:0 "Empoderar von Sanders e os instrutores prussianos na reorganização."
 ww1_ottoman.5.b:0 "Restringir a missão a funções estritamente pedagógicas e consultivas."
 ww1_ottoman.6.t:0 "A Missão Naval Britânica do Almirante Limpus"
 ww1_ottoman.6.d:0 "O Contra-Almirante Arthur Limpus supervisiona as reformas da frota otomana e o treinamento tático nos estaleiros do Chifre de Ouro, sugerindo novas modernizações navais."
 ww1_ottoman.6.a:0 "Aprofundar os contratos com os estaleiros britânicos."
 ww1_ottoman.6.b:0 "Priorizar a autonomia soberana da marinha otomana."
 ww1_ottoman.7.t:0 "A Administração da Dívida Pública (Düyun-ı Umumiye)"
 ww1_ottoman.7.d:0 "Os representantes dos credores estrangeiros na Düyun-ı Umumiye controlam os monopólios fiscais mais lucrativos do império. A Porta encara o dilema entre submissão financeira e soberania fiscal."
 ww1_ottoman.7.a:0 "Reivindicar unilateralmente as receitas dos monopólios estatais!"
 ww1_ottoman.7.b:0 "Renegociar taxas de cupons e juros de forma amigável."
 ww1_ottoman.8.t:0 "A Abolição Unilateral das Capitulações"
 ww1_ottoman.8.d:0 "A Sublime Porta promulgou um irade imperial proclamando a extinção definitiva de todas as imunidades fiscais, privilégios consulares e capitulações que acorrentavam o império há séculos."
 ww1_ottoman.8.a:0 "As correntes de séculos foram quebradas! Viva a soberania imperial!"
 ww1_ottoman.9.t:0 "A Passagem das Montanhas Taurus"
 ww1_ottoman.9.d:0 "Engenheiros otomanos e alemães completaram a perfuração dos túneis nos Montes Taurus e Amanus, unindo os trilhos de ferro de Constantinopla diretamente à Síria e à Mesopotâmia."
 ww1_ottoman.9.a:0 "A artéria de ferro do Império está aberta!"
 ww1_ottoman.11.t:0 "O Fechamento dos Estreitos dos Dardanelos"
 ww1_ottoman.11.d:0 "Para salvaguardar a capital imperial contra armadas hostis, a Sublime Porta cogita fechar os Estreitos a todo tráfego estrangeiro, bloqueando a artéria vital russa no Mar Negro."
 ww1_ottoman.11.a:0 "Semear minas e fechar os Dardanelos hermeticamente!"
 ww1_ottoman.11.b:0 "Manter o trânsito comercial aberto sob inspeção alfandegária."
 ww1_ottoman.12.b:0 "Reter reservas estratégicas e preservar neutralidade armada."
 ww1_ottoman.13.t:0 "A Incursão de Souchon no Mar Negro"
 ww1_ottoman.13.d:0 "O Almirante Souchon conduziu o Yavuz, o Midilli e torpedeiros otomanos para o Mar Negro, bombardeando os portos russos de Sebastopol, Odessa e Novorossiysk."
 ww1_ottoman.13.a:0 "A sorte está lançada: Entramos na Grande Guerra!"
 ww1_ottoman.13.b:0 "Repudiar a incursão como um ato alemão não autorizado!"
 ww1_ottoman.14.t:0 "A Proclamação da Guerra Santa (Cihad-ı Ekber)"
 ww1_ottoman.14.d:0 "O Sultão Mehmed V, investido como Califa de todos os Muçulmanos, proclamou solenemente o Cihad-ı Ekber convocando todos os crentes a se levantarem contra a tirania imperialista da Entente."
 ww1_ottoman.14.a:0 "Erguer o Estandarte Sagrado do Profeta!"
 ww1_ottoman.14.b:0 "Enfatizar a solidariedade cívica de todas as comunidades do império."
 ww1_ottoman.16.t:0 "18 de Março: O Triunfo Naval de Çanakkale"
 ww1_ottoman.16.d:0 "Os encouraçados aliados que tentavam forçar os Dardanelos colidiram com as minas clandestinas do Nusret e enfrentaram o fogo fulminante dos fortes de Çanakkale. Três couraçados afundaram e três foram desativados."
 ww1_ottoman.16.a:0 "Çanakkale Geçilmez! Os Dardanelos são intransponíveis!"
 ww1_ottoman.17.t:0 "O Triunfo Épico de Galípoli"
 ww1_ottoman.17.d:0 "As forças expedicionárias aliadas em Anzac, Suvla e Cabo Helles foram rechaçadas pela resistência heróica das divisões otomanas lideradas por Mustafa Kemal e Esad Pasha. O invasor evacuou derrotado."
 ww1_ottoman.17.a:0 "A vitória pertence aos inabaláveis soldados do Império!"
 ww1_ottoman.18.t:0 "A Grande Praga de Gafanhotos no Levante"
 ww1_ottoman.18.d:0 "Enxames devastadores de gafanhotos devoraram as colheitas da Síria, Líbano e Palestina em 1915, deflagrando uma severa crise de subsistência que ameaça as linhas de abastecimento do Quarto Exército."
 ww1_ottoman.18.a:0 "Distribuir as reservas de trigo imperial e socorrer as populações."
 ww1_ottoman.18.b:0 "Racionar impiedosamente: A prioridade absoluta é a frente militar!"
 ww1_ottoman.19.t:0 "A Erupção da Revolta Árabe no Hejaz"
 ww1_ottoman.19.d:0 "Sharif Hussein de Meca, seduzido pelo ouro e promessas do Alto Comissariado britânico no Cairo, disparou um tiro de rifle de sua janela proclamando a insurreição contra a soberania otomana."
 ww1_ottoman.19.a:0 "Guarnecer Medina e convocar as tribos beduínas leais!"
 ww1_ottoman.19.b:0 "Oferecer termos generosos de autonomia aos notáveis árabes."
 ww1_ottoman.21.t:0 "A Defesa da Linha de Gaza-Beersheba"
 ww1_ottoman.21.d:0 "Divisões otomanas reforçadas por artilharia pesada austro-húngara entrincheiraram-se na linha de Gaza-Beersheba, bloqueando os avanços da Força Expedicionária Egípcia britânica."
 ww1_ottoman.21.a:0 "Defender as portas de Jerusalém a qualquer custo!"
 ww1_ottoman.22.t:0 "O Exército do Islã de Nuri Pasha Liberta Baku"
 ww1_ottoman.22.d:0 "O Exército do Islã comandado por Nuri Pasha expulsou destacamentos britânicos e bolcheviques de Baku, garantindo as ricas reservas petrolíferas do Cáspio e unindo-se aos azeris."
 ww1_ottoman.22.a:0 "O petróleo do Cáspio está garantido para o Império!"
 ww1_ottoman.23.t:0 "Ascensão do Sultão Mehmed VI Vahideddin"
 ww1_ottoman.23.d:0 "Após o falecimento de Mehmed V Reshad em julho de 1918, seu irmão Mehmed VI Vahideddin sobe ao trono imperial jurando defender o Estado Otomano em meio às tempestades da guerra."
 ww1_ottoman.23.a:0 "Que Deus conceda sabedoria e força ao Padishah!"
 ww1_ottoman.24.t:0 "Fundação do Osmanlı İtibar-ı Millî Bankası"
 ww1_ottoman.24.d:0 "A Sublime Porta fundou o Banco de Crédito Nacional para mobilizar as poupanças domésticas, substituir credores estrangeiros e emitir moeda soberana lastreada na produção nacional."
 ww1_ottoman.24.a:0 "Um pilar monumental para nossa independência econômica!"
 ww1_ottoman.25.b:0 "Conceder licenças de exploração com royalties garantidos à Coroa."
 ww1_ottoman.26.t:0 "O Tratado de Da'an e a Lealdade do Iêmen"
 ww1_ottoman.26.d:0 "Por meio do Tratado de Da'an, a Sublime Porta reconheceu a autonomia religiosa interna do Imam Yahya no Iêmen em troca de fidelidade incondicional ao Califado, garantindo a paz no sul."
 ww1_ottoman.26.a:0 "O bastião meridional do Mar Vermelho está pacificado."
 ww1_ottoman.27.t:0 "A Ratificação do Pacto Federal Turco-Árabe"
 ww1_ottoman.27.d:0 "Notáveis e representantes de Damasco, Bagdá, Beirute e Jerusalém assinaram a carta histórica transformando o império em uma federação turco-árabe com representação igualitária."
 ww1_ottoman.27.a:0 "Irmãos de fé e de história, unidos para sempre!"
 ww1_ottoman.28.t:0 "O Triunfo do Estado Eterno (Devlet-i Aliyye)"
 ww1_ottoman.28.d:0 "Tendo superado seis anos de cerco mundial, guerras de trincheira e pressões externas, o Império Otomano ressurge vitorioso e renovado como uma grande potência moderna respeitada no mundo."
 ww1_ottoman.28.a:0 "O Império Otomano permanecerá eterno!"
 ww1_ottoman.29.t:0 "O Pacto Nacional (Misak-ı Millî)"
 ww1_ottoman.29.d:0 "O parlamento otomano aprovou solenemente o Misak-ı Millî, declarando que todos os territórios habitados por maioria otomana constituem uma pátria una, soberana e indivisível."
 ww1_ottoman.29.a:0 "Nem um palmo da pátria será entregue a agressores!"
 TUR_milli_iktisat_economy:0 "Economia Nacional (Milli İktisat)"
 TUR_milli_iktisat_economy_desc:0 "Promoção da indústria doméstica, cooperativas nacionais e eliminação de intermediários comerciais estrangeiros."
 TUR_tax_farming_abolished:0 "Fim do Sistema de Arrecadação İltizam"
 TUR_tax_farming_abolished_desc:0 "Arrecadação fiscal direta por funcionários da fazenda pública em substituição a coletores privados gananciosos."
 TUR_monetary_gold_lira:0 "Padrão Lira de Ouro Soberano"
 TUR_monetary_gold_lira_desc:0 "Uma moeda nacional estável lastreada em ouro protege as finanças imperiais contra ataques especulativos externos."
 TUR_munitions_directorate_idea:0 "Diretoria Imperial de Munições"
 TUR_munitions_directorate_idea_desc:0 "Coordenação centralizada de fundições de artilharia, cartucheiras e fábricas de pólvora para abastecer as frentes de combate."
 TUR_heavy_ordnance_idea:0 "Artilharia Pesada de Assédio Krupp"
 TUR_heavy_ordnance_idea_desc:0 "Obuses modernos e peças de cerco fornecem superioridade avassaladora de contrabateria nas frentes de trincheira."
 TUR_prusso_ottoman_tactics:0 "Doutrinas Táticas Prusso-Otomanas"
 TUR_prusso_ottoman_tactics_desc:0 "Planejamento rigoroso do Estado-Maior, descentralização de comandos e manobra operacional disciplinada."
 TUR_red_crescent_logistics:0 "Logística do Crescente Vermelho"
 TUR_red_crescent_logistics_desc:0 "Hospitais de campanha, batalhões de maqueiros e profilaxia médica salvam vidas preciosas nas frentes montanhosas e desérticas."
 TUR_breadbasket_idea:0 "Reservas do Celeiro Imperial"
