 ww1_ottoman.1.t:0 "A Requisição dos Dreadnoughts Otomanos"
 ww1_ottoman.1.d:0 "O Almirantado de Londres apreendeu unilateralmente os encouraçados Sultan Osman-I Evvel e Reshadieh, financiados por doações populares do povo otomano! A fúria toma conta das ruas de Istambul."
 ww1_ottoman.1.a:0 "Um insulto imperdoável ao nosso povo!"
 ww1_ottoman.1.b:0 "Exigir indenização financeira imediata."
 ww1_ottoman.10.t:0 "Chegada do SMS Goeben e Breslau"
 ww1_ottoman.10.d:0 "Driblando a frota britânica no Mediterrâneo, o Almirante Souchon conduziu o SMS Goeben e o Breslau através dos Dardanelos. Berlim oferece a transferência dos navios à Marinha Imperial."
 ww1_ottoman.10.a:0 "Icem o estandarte otomano no Yavuz e Midilli!"
 ww1_ottoman.10.b:0 "Internar os navios para manter a neutralidade."
 ww1_ottoman.12.t:0 "O Tratado Secreto de Agosto de 1914"
 ww1_ottoman.12.d:0 "O Grão-Vizir Said Halim Paxá e o embaixador alemão von Wangenheim assinaram o acordo de defesa mútua. A Alemanha garante subsídios e integridade territorial contra a Rússia."
 ww1_ottoman.12.a:0 "O destino da Sublime Porta está selado com Berlim."
 ww1_ottoman.15.t:0 "O Ataque Naval de Souchon no Mar Negro"
 ww1_ottoman.15.d:0 "Sob a bandeira otomana, o Almirante Souchon bombardeou as instalações militares russas em Sebastopol, Odessa e Novorossiysk. A Rússia declarou guerra ao Império Otomano!"
 ww1_ottoman.15.a:0 "Às armas pela defesa da Pátria!"
 ww1_ottoman.15.b:0 "Uma manobra imprudente e provocativa!"
 ww1_ottoman.20.t:0 "Proclamação da Guerra Santa (Cihad-ı Ekber)"
 ww1_ottoman.20.d:0 "O Sultão-Califa desfraldou o Estandarte Sagrado do Profeta e emitiu as fátuas imperiais convocando 300 milhões de muçulmanos sob domínio colonial aliado a se rebelarem."
 ww1_ottoman.20.a:0 "Que a vitória coroe o estandarte do Islã!"
 ww1_ottoman.25.t:0 "A Vitória Imorredoura de Canakkale (Galípoli)"
 ww1_ottoman.25.d:0 "Após meses de bombardeios ferozes e assaltos sangrentos, a esquadra e corpos expedicionários da Entente fracassaram em romper nossas baterias. Mustafa Kemal é aclamado como o Salvador dos Estreitos!"
 ww1_ottoman.25.a:0 "Canakkale é intransponível! (Canakkale Gecilmez!)"
 ww1_ottoman.30.t:0 "A Rendição de Kut al-Amara"
 ww1_ottoman.30.d:0 "Cercado e sem mantimentos nas margens do Tigre, o General Townshend capitulou com 13.000 soldados anglo-indianos diante de Halil Kut Paxá. É a maior humilhação britânica no Oriente."
 ww1_ottoman.30.a:0 "O Tigre pertence ao Império Otomano!"
 ww1_ottoman.35.t:0 "O Tratado de Brest-Litovsk e a Restituição do Cáucaso"
 ww1_ottoman.35.d:0 "Com o colapso do Império Russo, o governo soviético assinou o Tratado de Brest-Litovsk, reconhecendo a soberania otomana sobre Kars, Ardahan e Batum."
 ww1_ottoman.35.a:0 "Nossas províncias orientais históricas foram resgatadas!"
