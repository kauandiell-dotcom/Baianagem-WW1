l_braz_por:
 TUR_ww1_shortcut_politics:0 "Política Imperial"
 TUR_ww1_shortcut_economy:0 "Soberania Econômica"
 TUR_ww1_shortcut_military:0 "Forças Armadas"
 TUR_ww1_shortcut_diplomacy:0 "Diplomacia das Potências"
 TUR_ww1_shortcut_war_theaters:0 "Teatros de Guerra & 1918"
 TUR_imperial_cohesion_category:0 "Coesão Imperial e Administração"
 TUR_imperial_cohesion_category_desc:0 "Gestão da estabilidade regional, lealdade das minorias e reformas administrativas nos vilaietes otomanos."
 TUR_debt_and_capitulations_category:0 "Dívida Pública e Soberania Econômica"
 TUR_debt_and_capitulations_category_desc:0 "Liquidação do controle financeiro estrangeiro da Düyun-ı Umumiye, abolição das capitulações e construção da autossuficiência industrial."
 TUR_war_theaters_category:0 "Teatros Operacionais de Guerra"
 TUR_war_theaters_category_desc:0 "Direcionamento de caravanas de suprimento, fortalezas e prontidão operacional nas frentes do Cáucaso, Galípoli, Mesopotâmia, Sinai e Tripolitânia."
 TUR_subsidize_anatolian_grain:0 "Subsidiar Grãos da Anatólia"
 TUR_subsidize_anatolian_grain_desc:0 "Adquirir as safras de trigo da Anatólia a preços garantidos pelo Tesouro e priorizar vagões ferroviários para abastecer as padarias urbanas e as frentes de combate."
 TUR_concede_arab_autonomy_reform:0 "Conceder Reforma de Autonomia Árabe"
 TUR_concede_arab_autonomy_reform_desc:0 "Promulgar a carta de reformas negociada com os delegados árabes, oficializando o idioma árabe nos tribunais locais e destinando impostos a obras nos vilaietes."
 TUR_deploy_gendarmerie_sweep:0 "Desdobrar Varredura da Gendarmaria Imperial"
 TUR_deploy_gendarmerie_sweep_desc:0 "Despachar regimentos montados da Jandarma ao longo das linhas telegráficas e passos de montanha para desarmar salteadores e reprimir células separatistas."
 TUR_emergency_imperial_rally:0 "Mobilização de Emergência da Coesão Imperial"
 TUR_emergency_imperial_rally_desc:0 "Mobilizar proclamações cívicas, clérigos e notáveis provinciais para restaurar a coesão imperial em tempos de crise aguda."
 TUR_pacify_levant_notables:0 "Apaziguar Notáveis Provinciais do Levante"
 TUR_pacify_levant_notables_desc:0 "Conceder privilégios municipais e créditos a líderes das províncias sírias e iraquianas para garantir a estabilidade interna."
 TUR_deploy_hejaz_armored_garrison:0 "Destacar Guarnição Blindada em [From.GetName]"
 TUR_deploy_hejaz_armored_garrison_desc:0 "Enviar batalhões regulares da Nizamiye e destacamentos ferroviários blindados para guarnecer cidadelas, viadutos e poços de água em [From.GetName]."
 TUR_teskilat_counter_insurgency_sweep:0 "Varredura da Teşkilât-ı Mahsusa em [From.GetName]"
 TUR_teskilat_counter_insurgency_sweep_desc:0 "Infiltrar agentes da Organização Especial nos entrepostos de caravanas em [From.GetName] para interceptar carregamentos de ouro britânico e desmantelar redes insurgentes."
 TUR_subsidize_bedouin_sheikhs:0 "Subsidiar Xeques Beduínos em [From.GetName]"
 TUR_subsidize_bedouin_sheikhs_desc:0 "Distribuir liras de ouro, carabinas Mauser e rações de trigo aos chefes tribais beduínos em [From.GetName] para assegurar sua fidelidade militar ao Sultão-Califa."
 TUR_pacify_arab_insurgency_campaign:0 "Campanha de Pacificação da Insurgência Árabe"
 TUR_pacify_arab_insurgency_campaign_desc:0 "Com Damasco e o Hejaz firmemente guarnecidos pelas forças imperiais, executar uma campanha coordenada para extinguir a Revolta Árabe e restaurar a ordem."
 TUR_confiscate_tobacco_regie:0 "Confiscar Armazéns da Régie Francesa do Tabaco"
 TUR_confiscate_tobacco_regie_desc:0 "Apreender os armazéns e fábricas da Régie Co-Intéressée des Tabacs, revertendo os lucros do monopólio do tabaco diretamente para o Tesouro Imperial."
 TUR_issue_gold_lira_war_bonds:0 "Emitir Bônus de Guerra da Lira de Ouro"
 TUR_issue_gold_lira_war_bonds_desc:0 "Lançar títulos internos de defesa subscritos pelo Banco de Crédito Nacional para financiar a produção bélica sem recorrer a banqueiros estrangeiros."
 TUR_impose_protective_port_tariffs:0 "Impor Tarifas Protetivas nos Portos Imperiais"
 TUR_impose_protective_port_tariffs_desc:0 "Aplicar tarifas alfandegárias elevadas em Constantinopla, Esmirna, Beirute e Bassorá para proteger as manufaturas nacionais da concorrência europeia."
 TUR_liquidate_opda_debt_tranche:0 "Liquidar Tranche da Dívida Pública da OPDA"
 TUR_liquidate_opda_debt_tranche_desc:0 "Resgatar uma parcela substancial dos títulos controlados pela Düyun-ı Umumiye, retomando o controle estatal sobre as receitas hipotecadas do sal, seda e selos."
 TUR_curb_foreign_consular_courts:0 "Restringir Tribunais Consulares Estrangeiros"
 TUR_curb_foreign_consular_courts_desc:0 "Revogar a imunidade judicial dos consulados estrangeiros e submeter todas as firmas comerciais em solo otomano à jurisdição e tributação do Império."
 TUR_supply_winter_gear_caucasus:0 "Fornecer Equipamento de Inverno ao Cáucaso"
 TUR_supply_winter_gear_caucasus_desc:0 "Enviar capotes pesados de lã, botas forradas, fogareiros de campanha e rações calóricas para Erzurum antes que as nevascas caucasianas atinjam nossas tropas."
 TUR_organize_sinai_water_caravans:0 "Organizar Caravanas de Água pelo Sinai"
 TUR_organize_sinai_water_caravans_desc:0 "Reunir milhares de dromedários e cisternas galvanizadas ao longo da rota Berseba–Bir el-Hassana para sustentar as colunas do 4º Exército na travessia do Sinai."
 TUR_fortify_tigris_redoubts_kut:0 "Fortificar os Redutos do Tigre em Kut al-Amara"
 TUR_fortify_tigris_redoubts_kut_desc:0 "Construir redes de trincheiras interligadas, diques de inundação e casamatas de artilharia na curva do Rio Tigre para barrar o avanço britânico rumo a Bagdá."
 TUR_hejaz_armored_train_escorts:0 "Escoltas de Trens Blindados na Ferrovia do Hejaz"
 TUR_hejaz_armored_train_escorts_desc:0 "Equipar locomotivas da Ferrovia do Hejaz com chapas de aço, metralhadoras Maxim e holofotes para patrulhar os trilhos do deserto e reparar trechos sabotados."
 TUR_proclaim_global_jihad_appeal:0 "Proclamar o Apelo Global da Guerra Santa"
 TUR_proclaim_global_jihad_appeal_desc:0 "Difundir as fátuas sagradas do Califa em árabe, persa, urdu e tártaro para despertar a resistência anticolonial na Índia Britânica, no Egito e no Turquestão Russo."
 TUR_dispatch_officers_to_tripolitania:0 "Despachar Oficiais Voluntários para a Tripolitânia"
 TUR_dispatch_officers_to_tripolitania_desc:0 "Enviar jovens e audazes oficiais de estado-maior, incluindo Enver Bey e Mustafa Kemal, para organizar a resistência líbia e senussita contra a invasão italiana."
 TUR_second_constitutional_era:0 "Segunda Era Constitucional (İkinci Meşrutiyet)"
 TUR_second_constitutional_era_desc:0 "Desde que a Revolução dos Jovens Turcos de 1908 restaurou a Constituição de 1876, a Câmara dos Deputados em Constantinopla vive intensos embates entre oficiais unionistas centralizadores e parlamentares liberais descentralizadores."
 TUR_cup_vanguard_centralization:0 "Centralização de Vanguarda do CUP"
 TUR_cup_vanguard_centralization_desc:0 "Sob a liderança do Comitê de União e Progresso, governos provinciais, comandos da gendarmaria e redes telegráficas subordinam-se a quadros partidários disciplinados na defesa da sobrevivência nacional."
 TUR_teskilat_i_mahsusa_network:0 "Rede Clandestina da Teşkilât-ı Mahsusa"
 TUR_teskilat_i_mahsusa_network_desc:0 "Subordinada diretamente ao Ministério da Guerra, a Organização Especial mobiliza agentes secretos, oficiais fedai e emissários tribais para operações de contraespionagem e guerrilha nas fronteiras imperiais."
 TUR_hurriyet_ve_itilaf_governance:0 "Governo Liberal do Liberdade e Acordo (Hürriyet ve İtilaf)"
 TUR_hurriyet_ve_itilaf_governance_desc:0 "A coalizão Hürriyet ve İtilaf promove o pluralismo constitucional, o livre comércio e a autonomia provincial, conciliando os diversos millets do império por meio da representação parlamentar."
 TUR_arab_ottoman_federal_compact:0 "Pacto Federal Imperial Turco-Árabe"
 TUR_arab_ottoman_federal_compact_desc:0 "Um pacto constitucional histórico garante ao idioma árabe status cooficial, conselhos legislativos regionais e cadeiras no gabinete, unindo os vilaietes árabes ao trono otomano em solidariedade."
 TUR_palace_autocracy_restored:0 "Autocracia Palaciana Imperial Restaurada"
 TUR_palace_autocracy_restored_desc:0 "O Sultão-Califa governa por meio de Grão-Vizires leais e do Divã Imperial em Dolmabahçe, colocando a continuidade dinástica e a autoridade religiosa acima das disputas partidárias."
 TUR_caliphate_global_banner:0 "Estandarte Global do Califado Sagrado"
 TUR_caliphate_global_banner_desc:0 "Com o desfraldar do Estandarte Sagrado do Profeta (Sancak-ı Şerif), o chamado ao Cihad-ı Ekber conclama os fiéis de todo o mundo islâmico a defender a sede do Califado contra a partilha colonial."
 TUR_sick_man_debt:0 "Grilhões da Dívida Pública Otomana (Düyun-ı Umumiye)"
 TUR_sick_man_debt_desc:0 "Instituída após o Decreto de Muharrem de 1881, a Administração da Dívida Pública Otomana (OPDA), controlada por credores europeus, confisca diretamente as receitas de tabaco, sal, seda e alfândegas do Império."
 TUR_debt_renegotiated:0 "Cronograma da Dívida Pública Renegociado"
 TUR_debt_renegotiated_desc:0 "Mediante resgates sistemáticos de títulos e auditorias rigorosas do Tesouro, a Sublime Porta reduziu a tutela da OPDA, recuperando parcela vital da arrecadação provincial para a modernização nacional."
 TUR_capitulations_abrogated:0 "Capitulações Extraterritoriais Revogadas"
 TUR_capitulations_abrogated_desc:0 "A abolição unilateral dos antigos tratados de capitulação pôs fim às isenções fiscais estrangeiras, aos correios europeus autônomos e à imunidade dos tribunais consulares em solo otomano."
 TUR_financial_sovereignty:0 "Soberania Financeira Otomana Plena"
 TUR_financial_sovereignty_desc:0 "Apoiada pelo Banco de Crédito Nacional e pelo controle soberano das tarifas alfandegárias, a Sublime Porta conduz sua própria política monetária e expansão industrial livre de sindicatos estrangeiros."
 TUR_debt_default_crisis:0 "Crise de Moratória e Retaliação Financeira"
 TUR_debt_default_crisis_desc:0 "A suspensão abrupta dos pagamentos aos credores externos provocou congelamento de crédito e represálias comerciais por parte dos bancos europeus, pressionando a liquidez interna."
 TUR_baghdad_railway_artery:0 "Artéria Ferroviária de Bagdá"
 TUR_baghdad_railway_artery_desc:0 "Cruzando o planalto da Anatólia e perfurando as cordilheiras do Taurus e Amanus, a Ferrovia de Bagdá constitui a espinha dorsal logística que liga Constantinopla à Síria e à Mesopotâmia."
 TUR_hejaz_pilgrim_railway:0 "Ferrovia Sagrada dos Peregrinos do Hejaz"
 TUR_hejaz_pilgrim_railway_desc:0 "Financiada por doações voluntárias de muçulmanos de todo o mundo sem um único centavo de dívida externa, a Ferrovia do Hejaz transporta peregrinos e reforços militares de Damasco a Medina."
 TUR_anatolian_grain_monopoly:0 "Monopólio Estatal de Grãos da Anatólia"
 TUR_anatolian_grain_monopoly_desc:0 "A compra estatal centralizada das safras de trigo e cevada do planalto anatólio elimina a especulação de guerra e assegura rações regulares de pão para os corpos de exército e centros urbanos."
 TUR_army_modernization_struggle:0 "Dificuldades de Modernização do Exército Imperial"
 TUR_army_modernization_struggle_desc:0 "Décadas de negligência hamidiana, disputas políticas no oficialato, calibres heterogêneos de fuzis e a lenta transição das antigas reservas Redif pesam sobre a prontidão operacional otomana."
 TUR_mehmetcik_tenacity:0 "Tenacidade Estoica do Mehmetçik"
 TUR_mehmetcik_tenacity_desc:0 "Carinhosamente chamado de 'Pequeno Mehmed', o soldado camponês da Anatólia suporta nevascas congelantes, marchas no deserto e rações escassas com devoção inabalável à pátria e à fé."
 TUR_straits_fortress_cannons:0 "Baterias Pesadas das Fortalezas dos Estreitos"
 TUR_straits_fortress_cannons_desc:0 "Eriçados de canhões costeiros pesados Krupp, obuseiros ocultos e cinturões de minas submarinas em Kilitbahir e Seddülbahir, os Estreitos Turcos erguem-se como o escudo blindado de Constantinopla."
 TUR_german_military_mission:0 "Missão Militar de Reforma Alemã"
 TUR_german_military_mission_desc:0 "Seguindo os passos de Colmar von der Goltz e do General Otto Liman von Sanders, instrutores do Estado-Maior prussiano modernizam o controle de tiro de artilharia e a logística dos corpos otomanos."
 TUR_kemalist_tactical_doctrine:0 "Doutrina Tática Nacional Kemalista"
 TUR_kemalist_tactical_doctrine_desc:0 "Forjada em combate por comandantes nativos liderados por Mustafa Kemal Bey, esta doutrina enfatiza o reconhecimento agressivo, trincheiras em contraencosta e contra-ataques fulminantes à baioneta."
 TUR_dreadnought_national_fervor:0 "Fervor Nacional da Campanha dos Encouraçados"
 TUR_dreadnought_national_fervor_desc:0 "A indignação popular com o confisco britânico dos encouraçados Sultan Osman-ı Evvel e Reşadiye, pagos com doações do povo, uniu milhões de cidadãos otomanos em fervor patriótico."
 TUR_yavuz_and_midilli_supremacy:0 "Supremacia Naval do Yavuz e Midilli"
 TUR_yavuz_and_midilli_supremacy_desc:0 "Com o cruzador de batalha Yavuz Sultan Selim (ex-Goeben) e o cruzador rápido Midilli (ex-Breslau) sob o pavilhão crescente, a Marinha Otomana detém velocidade e poder de fogo ímpares no Mar Negro."
 TUR_canakkale_impenetrable_bastion:0 "Bastião Inexpugnável de Çanakkale"
 TUR_canakkale_impenetrable_bastion_desc:0 "Consagrado pelo sangue dos defensores de Galípoli, o complexo fortificado dos Dardanelos provou ao mundo inteiro que 'Çanakkale Geçilmez' — Çanakkale é intransponível!"
 TUR_ottoman_aviation_detachment:0 "Esquadrilhas de Aviação Militar Otomana (Tayyare Bölükleri)"
 TUR_ottoman_aviation_detachment_desc:0 "Treinados na Escola de Aviação de Yeşilköy, os pioneiros aviadores otomanos realizam patrulhas aéreas sobre os Dardanelos, o Sinai e o Cáucaso, orientando o fogo de artilharia e rastreando frotas."
 TUR_arab_unrest_smoldering:0 "Agitação Latente nos Vilaietes Árabes"
 TUR_arab_unrest_smoldering_desc:0 "Atritos crescentes sobre decretos centralizadores, recrutamento militar e sociedades secretas como Al-Fatat e Al-Ahd alimentam a inquietação política na Síria, na Mesopotâmia e no Hejaz."
 TUR_arab_revolt_insurgency:0 "Insurgência da Grande Revolta Árabe"
 TUR_arab_revolt_insurgency_desc:0 "Abastecidos com soberanos de ouro britânicos, fuzis Lee-Enfield e apoio naval no Mar Vermelho, guerrilheiros xarifianos emboscam trens da Ferrovia do Hejaz e guarnições isoladas no deserto."
 TUR_imperial_vilayets_pacified:0 "Vilaietes Árabes Imperiais Pacificados"
 TUR_imperial_vilayets_pacified_desc:0 "Graças a guarnições ferroviárias estratégicas, subsídios tribais e operações decisivas de contrainsurgência, a autoridade imperial e a segurança das rotas foram restauradas no Levante e no Hejaz."
 TUR_senussi_desert_brotherhood:0 "Irmandade de Resistência do Deserto Senussi"
 TUR_senussi_desert_brotherhood_desc:0 "Liderados por oficiais voluntários otomanos e pela confraria sufi Senussi, guerreiros líbios travam uma implacável guerra de guerrilha a partir dos oásis da Cirenaica e de Fezzan."
 TUR_caucasus_alpine_preparations:0 "Preparações Alpinas de Inverno no Cáucaso"
 TUR_caucasus_alpine_preparations_desc:0 "Capotes térmicos de inverno, comboios de mulas de montanha e depósitos abrigados em Erzurum e Sivas protegem o 3º Exército contra as letais tempestades de neve das cordilheiras orientais."
 TUR_fakhri_pasha_desert_stand:0 "Resistência Heroica de Fahreddin Paxá em Medina"
 TUR_fakhri_pasha_desert_stand_desc:0 "Desafiando o cerco, o calor escaldante e a fome, o 'Tigre do Deserto' Ömer Fahreddin Paxá e sua guarnição defendem a Cidade do Profeta com disciplina férrea, inspirando todo o exército imperial."
 TUR_kut_al_amara_triumph:0 "O Triunfo do Cerco de Kut al-Amara"
 TUR_kut_al_amara_triumph_desc:0 "A rendição incondicional do General Townshend e de 13.000 soldados anglo-indianos em Kut al-Amara ressoa como uma vitória monumental das armas otomanas nas margens do Rio Tigre."
 TUR_gaza_beersheba_defensive_wall:0 "Muralha Defensiva de Gaza–Berseba"
 TUR_gaza_beersheba_defensive_wall_desc:0 "Apoiada em redutos fortificados, trincheiras profundas e baterias de artilharia entrosadas no sul da Palestina, a linha Gaza–Berseba bloqueia o corredor costeiro rumo a Jerusalém."
 TUR_milli_iktisat_economy:0 "Economia Nacional (Millî İktisat)"
 TUR_milli_iktisat_economy_desc:0 "Promoção da indústria doméstica, cooperativas nacionais de crédito e eliminação de intermediários comerciais estrangeiros."
 TUR_tax_farming_abolished:0 "Fim do Sistema de Arrecadação İltizam"
 TUR_tax_farming_abolished_desc:0 "Arrecadação fiscal direta por funcionários da fazenda pública em substituição aos leilões privados de impostos rurais."
 TUR_monetary_gold_lira:0 "Padrão Lira de Ouro Soberano"
 TUR_monetary_gold_lira_desc:0 "Uma moeda nacional estável lastreada em ouro protege as finanças imperiais contra ataques especulativos externos e inflação."
 TUR_munitions_directorate_idea:0 "Diretoria Imperial de Munições (İmalât-ı Harbiye)"
 TUR_munitions_directorate_idea_desc:0 "Coordenação centralizada das fundições de Tophane, cartucheiras de Zeytinburnu e fábricas de pólvora para abastecer as frentes de combate."
 TUR_heavy_ordnance_idea:0 "Artilharia Pesada de Assédio Krupp e Škoda"
 TUR_heavy_ordnance_idea_desc:0 "Obuses modernos de grosso calibre e peças de cerco fornecem superioridade avassaladora de contrabateria nas frentes de trincheira."
 TUR_prusso_ottoman_tactics:0 "Doutrinas Táticas Prusso-Otomanas"
 TUR_prusso_ottoman_tactics_desc:0 "Planejamento rigoroso do Estado-Maior combinado com manobras operacionais disciplinadas maximiza o poder de combate das divisões otomanas."
 TUR_red_crescent_logistics:0 "Logística Médica do Crescente Vermelho (Hilâl-i Ahmer)"
 TUR_red_crescent_logistics_desc:0 "Hospitais de campanha, trens sanitários e profilaxia médica do Crescente Vermelho salvam milhares de soldados nas frentes montanhosas e desérticas."
 TUR_breadbasket_idea:0 "Reservas Agrícolas do Celeiro Imperial"
 TUR_breadbasket_idea_desc:0 "Silos estratégicos e a produção irrigada da Anatólia e Mesopotâmia protegem as cidades e o exército contra a fome e o bloqueio marítimo."
 TUR_reformed_ottoman_corps:0 "Corpos de Exército Otomanos Reformados"
 TUR_reformed_ottoman_corps_desc:0 "Divisões reorganizadas no padrão triangular moderno com artilharia divisionária integrada, companhias de metralhadoras e telegrafia de campanha."
 TUR_mesopotamian_oil_production:0 "Extração Petrolífera de Mosul e Kirkuk"
 TUR_mesopotamian_oil_production_desc:0 "O petróleo abundante extraído das bacias de Kirkuk e Mosul abastece a Frota Imperial e as ferrovias militares com combustível doméstico contínuo."
 TUR_tt_curb_unrest:0 "§YPatrulhas da gendarmaria e reformas do Ministério do Interior reduzem a agitação separatista nas províncias.§!"
 TUR_tt_provincial_autonomy:0 "§YConselhos provinciais recebem autonomia orçamentária local, elevando a estabilidade e reduzindo a resistência regional.§!"
 TUR_tt_millet_equality:0 "§YGarantias constitucionais igualitárias para todos os millets religiosos fortalecem a harmonia cívica e a coesão imperial.§!"
 TUR_tt_arab_talks:0 "§YNegociações construtivas com os delegados árabes reduzem a agitação na Síria, no Líbano e na Mesopotâmia.§!"
 TUR_tt_tribal_support:0 "§YConfederações beduínas leais comprometem cavaleiros irregulares para guarnecer os flancos do deserto e poços de caravanas.§!"
 TUR_tt_sharif_loyalty:0 "§YA confirmação das prerrogativas tradicionais hachemitas em Meca reduz o risco de rebelião no Hejaz.§!"
 TUR_tt_protective_tariffs:0 "§YTarifas alfandegárias mais altas nos portos imperiais reduzem a influência econômica externa e estimulam as oficinas nacionais.§!"
 TUR_tt_famine_protection:0 "§YSilos de grãos protegidos e brigadas antigafanhotos protegem o Levante e a Anatólia contra a fome em tempos de guerra.§!"
 TUR_tt_purge_incompetent:0 "§YA reforma compulsória de generais obsoletos abre espaço no comando para jovens e enérgicos oficiais formados na Harbiye.§!"
 TUR_tt_straits_mines:0 "§YCinturões densos de minas submarinas e refletores costeiros tornam os Dardanelos letais para esquadras inimigas.§!"
 TUR_tt_sanusi_pact:0 "§YRemessas de armas e oficiais otomanos fortalecem as operações de guerrilha senussita na Cirenaica e na Tripolitânia.§!"
 TUR_tt_close_straits:0 "§YO Bósforo e os Dardanelos são fechados a navios de guerra estrangeiros, blindando Constantinopla contra ataques navais.§!"
 TUR_tt_demand_dreadnoughts:0 "§YPressão diplomática formal é exercida sobre Londres acerca dos encouraçados confiscados Sultan Osman e Reşadiye.§!"
 TUR_tt_caucasus_winter_supplies:0 "§YDepósitos de inverno em Erzurum e Sivas desbloqueiam decisões de equipamento alpino para o 3º Exército no Cáucaso.§!"
 TUR_tt_baku_oil:0 "§YAs forças otomanas asseguram o acesso aos riquíssimos campos petrolíferos da bacia do Cáspio em Baku.§!"
 TUR_tt_encircle_kut:0 "§YO 6º Exército aperta o anel de cerco em torno das forças britânicas na curva do Rio Tigre em Kut al-Amara.§!"
 TUR_tt_suez_raid:0 "§YColunas avançadas do 4º Exército instalam cisternas no Sinai para ameaçar a navegação britânica no Canal de Suez.§!"
 TUR_tt_protect_railway:0 "§YFortins de pedra e patrulhas de trens blindados protegem a Ferrovia do Hejaz entre Damasco e Medina.§!"
 TUR_tt_sharif_revolt_containment:0 "§YGuarnições imperiais e auxiliares tribais leais contêm as incursões insurgentes no Hejaz e no sul da Síria.§!"
 TUR_tt_jihad_appeal_effect:0 "§YA fátua sagrada do Cihad-ı Ekber inspira voluntários em todo o mundo islâmico a cerrar fileiras sob o Califado.§!"
 TUR_tt_brest_litovsk_kars_ardahan:0 "§YAs províncias históricas orientais de Kars, Ardahan e Batum são reintegradas à soberania do Império Otomano.§!"
 TUR_tt_appease_fatat:0 "§YAcordos discretos com reformistas da sociedade Al-Fatat desanuviam as tensões nacionalistas em Damasco e Beirute.§!"
 TUR_tt_vilayet_garrison_secured:0 "§YGuarnece permanentemente o vilaiete árabe com batalhões da Nizamiye, reduzindo a Agitação Árabe em 10 e blindando a província contra sabotagens na Grande Revolta Árabe.§!"
 TUR_tt_teskilat_vilayet_sweep:0 "§YDesmantela células insurgentes clandestinas no vilaiete selecionado, reduzindo a Agitação Árabe em 8 e elevando a Coesão Imperial em 3.§!"
 TUR_tt_opda_tranche_liquidated:0 "§YLiquida 15 pontos da Dívida Pública da OPDA e reduz a Influência Estrangeira em 10. Abaixo de 45 de Dívida Pública, evolui o espírito nacional da Düyun-ı Umumiye.§!"
 ww1_ottoman.1.t:0 "A Requisição dos Dreadnoughts Otomanos"
 ww1_ottoman.1.d:0 "Às vésperas da entrega em agosto de 1914, o Primeiro Lorde do Almirantado Winston Churchill confiscou unilateralmente os encouraçados Sultan Osman-ı Evvel e Reşadiye — navios já pagos com doações de camponeses, estudantes e comerciantes otomanos! A fúria toma conta de Constantinopla."
 ww1_ottoman.1.a:0 "Um roubo imperdoável contra o nosso povo!"
 ww1_ottoman.1.b:0 "Apresentar protesto diplomático formal e exigir indenização."
 ww1_ottoman.2.t:0 "O Ultimato dos Oficiais Salvadores (Halâskâr Zâbitân)"
 ww1_ottoman.2.d:0 "Oficiais dissidentes do exército, organizados na facção Halâskâr Zâbitân, emitiram um manifesto severo ao Conselho Militar exigindo a renúncia do gabinete unionista de Said Paxá e o fim da interferência partidária nas Forças Armadas."
 ww1_ottoman.2.a:0 "Nomear um gabinete suprapartidário para preservar a paz interna."
 ww1_ottoman.2.b:0 "O Comitê de União e Progresso não se curvará a amotinados!"
 ww1_ottoman.3.t:0 "O Ataque à Sublime Porta (Bab-ı Âli Baskını)"
 ww1_ottoman.3.d:0 "Montado em um cavalo branco à frente de oficiais unionistas armados em 23 de janeiro de 1913, Enver Bey invadiu o salão ministerial da Sublime Porta quando o gabinete cogitava ceder Edirne, forçando o Grão-Vizir Kâmil Paxá a renunciar sob a mira de pistolas."
 ww1_ottoman.3.a:0 "Empoderar a vanguarda unionista para salvar Edirne e o Império!"
 ww1_ottoman.3.b:0 "Manter uma coalizão constitucional equilibrada sob o Sultão."
 ww1_ottoman.4.t:0 "O Primeiro Congresso Árabe de Paris (1913)"
 ww1_ottoman.4.d:0 "Delegados reformistas da Síria, do Líbano e do Iraque reuniram-se em Paris para reivindicar descentralização administrativa, oficialização do idioma árabe nos tribunais e escolas locais, e serviço militar regional em tempo de paz."
 ww1_ottoman.4.a:0 "Assinar um acordo concedendo reformas linguísticas e provinciais."
 ww1_ottoman.4.b:0 "Rejeitar pressões separatistas: A unidade imperial é indivisível!"
 ww1_ottoman.5.t:0 "A Missão Militar Alemã de Liman von Sanders"
 ww1_ottoman.5.d:0 "O Tenente-General prussiano Otto Liman von Sanders desembarcou em Constantinopla com quarenta e dois oficiais de estado-maior alemães para reformular a instrução, a logística e a mobilização do exército otomano, provocando protestos furiosos da Rússia czarista."
 ww1_ottoman.5.a:0 "Conceder a von Sanders plenos poderes de inspeção sobre os corpos!"
 ww1_ottoman.5.b:0 "Restringir os oficiais alemães a funções estritamente consultivas."
 ww1_ottoman.6.t:0 "A Missão Naval Britânica do Almirante Limpus"
 ww1_ottoman.6.d:0 "O Contra-Almirante Arthur Limpus e sua missão naval britânica supervisionam exercícios de artilharia em Heybeliada e reformas nos estaleiros do Chifre de Ouro, propondo aprofundar os contratos navais com Londres."
 ww1_ottoman.6.a:0 "Expandir a cooperação técnica com a missão naval britânica."
 ww1_ottoman.6.b:0 "Confiar a modernização da esquadra aos nossos próprios oficiais navais."
 ww1_ottoman.7.t:0 "Auditoria da Administração da Dívida Pública (Düyun-ı Umumiye)"
 ww1_ottoman.7.d:0 "Empregando mais de cinco mil coletores pelo império, a Düyun-ı Umumiye, gerida por consórcios europeus, drena um terço das receitas estatais para credores externos. O Ministério das Finanças propõe retomar o controle sobre nossos monopólios hipotecados."
 ww1_ottoman.7.a:0 "Retomar as receitas dos monopólios estatais para o Tesouro Imperial!"
 ww1_ottoman.7.b:0 "Negociar reduções graduais de juros com os credores europeus."
 ww1_ottoman.8.t:0 "A Abolição Unilateral das Capitulações"
 ww1_ottoman.8.d:0 "Por meio de um irade imperial histórico, a Sublime Porta proclamou a abolição definitiva das Capitulações (İmtiyâzât-ı Ecnebiye), encerrando séculos de isenções fiscais estrangeiras, tetos tarifários humilhantes e tribunais consulares em solo otomano."
 ww1_ottoman.8.a:0 "As correntes de séculos foram quebradas! Viva a soberania econômica!"
 ww1_ottoman.8.b:0 "Aplicar rigorosamente o novo código alfandegário em todos os portos."
 ww1_ottoman.9.t:0 "A Ferrovia de Bagdá e os Túneis dos Montes Taurus"
 ww1_ottoman.9.d:0 "Após anos de escavações na rocha viva em Bagché e Belemedik, engenheiros otomanos e alemães concluíram a perfuração das cordilheiras do Taurus e Amanus, interligando a malha ferroviária da Anatólia diretamente a Aleppo e à frente mesopotâmica."
 ww1_ottoman.9.a:0 "A artéria de aço que une Constantinopla ao Oriente está concluída!"
 ww1_ottoman.9.b:0 "Priorizar o tráfego de trens militares rumo à Síria e ao Iraque."
 ww1_ottoman.10.t:0 "A Chegada do SMS Goeben e Breslau aos Dardanelos"
 ww1_ottoman.10.d:0 "Tendo despistado a Frota Britânica do Mediterrâneo em uma perseguição audaciosa, o Contra-Almirante Wilhelm Souchon conduziu o cruzador de batalha SMS Goeben e o cruzador leve SMS Breslau aos Dardanelos, oferecendo incorporá-los à Marinha Otomana."
 ww1_ottoman.10.a:0 "Içar o pavilhão otomano sobre o Yavuz Sultan Selim e o Midilli!"
 ww1_ottoman.10.b:0 "Desarmar e internar ambos os navios para preservar estrita neutralidade."
 ww1_ottoman.11.t:0 "O Fechamento dos Estreitos dos Dardanelos"
 ww1_ottoman.11.d:0 "Diante do bloqueio imposto por navios de guerra britânicos na entrada dos Dardanelos, o comando das fortalezas costeiras ordenou o fechamento imediato dos Estreitos, apagando os faróis e selando os canais com cinturões de minas submarinas."
 ww1_ottoman.11.a:0 "Selar os campos minados e fechar os Estreitos a navios estrangeiros!"
 ww1_ottoman.11.b:0 "Permitir trânsito comercial restrito sob escolta das baterias costeiras."
 ww1_ottoman.12.t:0 "O Tratado Secreto Teuto-Otomano de Agosto de 1914"
 ww1_ottoman.12.d:0 "Reunidos em absoluto sigilo no palacete do Grão-Vizir Said Halim Paxá em Yeniköy em 2 de agosto de 1914, líderes otomanos e o Embaixador Barão von Wangenheim assinaram um tratado de defesa mútua garantindo apoio militar alemão e a integridade territorial do Império."
 ww1_ottoman.12.a:0 "Ratificar a aliança secreta com Berlim contra a agressão russa!"
 ww1_ottoman.12.b:0 "Manter reserva estratégica e adiar a entrada ativa no conflito."
 ww1_ottoman.13.t:0 "A Incursão do Almirante Souchon no Mar Negro"
 ww1_ottoman.13.d:0 "Na alvorada de 29 de outubro de 1914, munido de ordem escrita secreta de Enver Paxá, o Almirante Souchon conduziu o Yavuz, o Midilli, o Hamidiye e contratorpedeiros otomanos ao Mar Negro, bombardeando as bases russas de Odessa, Sebastopol e Novorossiysk."
 ww1_ottoman.13.a:0 "A sorte está lançada: Desembainhar a espada em defesa do Império!"
 ww1_ottoman.13.b:0 "Repudiar a incursão naval e propor inquérito imediato a Petrogrado."
 ww1_ottoman.14.t:0 "A Proclamação da Guerra Santa (Cihad-ı Ekber)"
 ww1_ottoman.14.d:0 "Em 14 de novembro de 1914, perante uma multidão imensa no pátio da Mesquita de Mehmed, o Conquistador, foram lidas cinco fátuas sagradas assinadas pelo Sheikh-ul-Islam Ürgüplü Hayri Efendi, conclamando os muçulmanos do mundo ao Cihad-ı Ekber contra a Entente."
 ww1_ottoman.14.a:0 "Desfraldar o Estandarte Sagrado do Profeta em todas as frentes!"
 ww1_ottoman.14.b:0 "Fundamentar o esforço de guerra no patriotismo cívico e constitucional."
 ww1_ottoman.15.t:0 "A Batalha de Sarıkamış e a Lição do Terceiro Exército"
 ww1_ottoman.15.d:0 "Marchando através das gélidas montanhas de Allahüekber sob temperaturas de trinta graus negativos para cercar o Exército Russo do Cáucaso em Sarıkamış, o 3º Exército Otomano enfrentou duras baixas pelo frio, evidenciando a urgência de logística alpina e planejamento metódico."
 ww1_ottoman.15.a:0 "Reorganizar o 3º Exército e reformular a logística de inverno nas montanhas!"
 ww1_ottoman.15.b:0 "Prosseguir a ofensiva de inverno pelas cristas do Cáucaso a qualquer custo!"
 ww1_ottoman.16.t:0 "O Triunfo Épico de Galípoli (Çanakkale Zaferi)"
 ww1_ottoman.16.d:0 "Da vitória naval de 18 de março de 1915 — quando o minador Nusret e os artilheiros de Cevat Paxá afundaram três encouraçados aliados — à resistência lendária de Mustafa Kemal em Conkbayırı e Anafartalar, o 5º Exército Otomano expulsou os invasores da Entente de Galípoli!"
 ww1_ottoman.16.a:0 "Çanakkale Geçilmez! Os Dardanelos são para sempre intransponíveis!"
 ww1_ottoman.16.b:0 "Honrar os mártires imortais do 57º Regimento de Infantaria!"
 ww1_ottoman.17.t:0 "A Capitulação Britânica em Kut al-Amara"
 ww1_ottoman.17.d:0 "Após 147 dias de cerco implacável nas margens do Rio Tigre e o rechaço sangrento de três colunas britânicas de socorro, o Major-General Charles Townshend rendeu incondicionalmente sua guarnição de 13.309 soldados anglo-indianos a Halil Kut Paxá em 29 de abril de 1916."
 ww1_ottoman.17.a:0 "A maior humilhação britânica no Oriente! A Mesopotâmia pertence ao Império!"
 ww1_ottoman.17.b:0 "Desfilar os estandartes capturados e marchar para o sul rumo a Bassorá!"
 ww1_ottoman.18.t:0 "A Praga de Gafanhotos e a Crise de Abastecimento no Levante"
 ww1_ottoman.18.d:0 "Imensas nuvens de gafanhotos escureceram os céus de Adana a Jerusalém, devorando pomares, olivais e trigais, enquanto o bloqueio naval aliado sufoca a chegada de cereais pelos portos de Beirute e Jaffa."
 ww1_ottoman.18.a:0 "Desviar trens de trigo da Anatólia para socorrer as cidades do Levante."
 ww1_ottoman.18.b:0 "Impor racionamento estrito de guerra: As divisões do front têm prioridade!"
 ww1_ottoman.19.t:0 "A Erupção da Revolta Árabe no Hejaz"
 ww1_ottoman.19.d:0 "Em junho de 1916, após correspondência secreta com o Alto Comissário britânico Sir Henry McMahon no Cairo, o Xarife Hussein bin Ali disparou um tiro de fuzil da janela do palácio em Meca, deflagrando um levante armado contra as guarnições otomanas no Hejaz."
 ww1_ottoman.19.a:0 "Fortificar Medina e despachar destacamentos blindados pela Ferrovia do Hejaz!"
 ww1_ottoman.19.b:0 "Distribuir subsídios em ouro e cartas de autonomia às tribos fiéis."
 ww1_ottoman.20.t:0 "Fahreddin Paxá e a Defesa Sagrada de Medina"
 ww1_ottoman.20.d:0 "Subindo ao púlpito da Mesquita do Profeta em Medina envolto no pavilhão otomano, o comandante Ömer Fahreddin Paxá jurou perante seus soldados jamais arriar a bandeira das muralhas sagradas, convertendo Medina em uma fortaleza inexpugnável no deserto."
 ww1_ottoman.20.a:0 "O Tigre do Deserto jamais entregará a Cidade Sagrada do Profeta!"
 ww1_ottoman.20.b:0 "Evacuar as Relíquias Sagradas sob escolta armada para o Palácio de Topkapı."
 ww1_ottoman.21.t:0 "A Batalha de Gaza–Berseba e a Linha da Palestina"
 ww1_ottoman.21.d:0 "Na primavera de 1917, os regimentos otomanos comandados por Kress von Kressenstein e Şevket Bey rechaçaram dois grandes assaltos britânicos diante das trincheiras e sebes de cactos de Gaza, infligindo mais de dez mil baixas à Força Expedicionária Egípcia."
 ww1_ottoman.21.a:0 "O portão meridional de Jerusalém permanece inabalável!"
 ww1_ottoman.21.b:0 "Reforçar o flanco de Berseba com reservas móveis de cavalaria."
 ww1_ottoman.22.t:0 "O Exército do Islã de Nuri Paxá e a Libertação de Baku"
 ww1_ottoman.22.d:0 "Em 15 de setembro de 1918, o Exército do Islã do Cáucaso (Kafkas İslam Ordusu), comandado por Nuri Paxá e Mürsel Bey, entrou triunfalmente em Baku após derrotar os destacamentos britânicos da 'Dunsterforce' e forças bolcheviques nas margens do Mar Cáspio."
 ww1_ottoman.22.a:0 "O pavilhão crescente tremula sobre Baku e as águas do Mar Cáspio!"
 ww1_ottoman.22.b:0 "Garantir o oleoduto Baku–Batum para abastecer a Frota Imperial."
 ww1_ottoman.23.t:0 "Morte do Sultão Mehmed V e Ascensão de Mehmed VI Vahideddin"
 ww1_ottoman.23.d:0 "Em 3 de julho de 1918, faleceu no Palácio de Yıldız, aos setenta e três anos, o Sultão constitucional Mehmed V Reşâd. Seu irmão mais novo, Mehmed VI Vahideddin, cingiu a Espada de Osman no santuário de Eyüp Sultan como o trigésimo sexto Padixá da dinastia."
 ww1_ottoman.23.a:0 "Vida longa ao Sultão Mehmed VI! Que ele guie o Império à vitória!"
 ww1_ottoman.23.b:0 "Reafirmar as prerrogativas constitucionais da Câmara dos Deputados."
 ww1_ottoman.24.t:0 "A Fundação do Banco de Crédito Nacional (Osmanlı İtibar-ı Millî)"
 ww1_ottoman.24.d:0 "Fundado em Constantinopla no início de 1917 com capital doméstico de quatro milhões de liras de ouro sob a direção do Ministro das Finanças Cavid Bey, o Osmanlı İtibar-ı Millî Bankası rompe o monopólio financeiro do banco anglo-francês."
 ww1_ottoman.24.a:0 "Um pilar monumental da independência financeira otomana!"
 ww1_ottoman.24.b:0 "Canalizar o crédito bancário para as ferrovias e minas da Anatólia."
 ww1_ottoman.25.t:0 "O Petróleo da Mesopotâmia e a Turkish Petroleum Company"
 ww1_ottoman.25.d:0 "Levantamentos geológicos nos vilaietes de Mosul e Bagdá confirmaram gigantescas reservas subterrâneas de petróleo em Baba Gurgur, próximo a Kirkuk. Consórcios europeus disputam concessões, enquanto nacionalistas defendem o monopólio estatal."
 ww1_ottoman.25.a:0 "Colocar os campos petrolíferos de Mosul e Kirkuk sob soberania estatal!"
 ww1_ottoman.25.b:0 "Conceder licenças reguladas de extração em troca de royalties em ouro."
 ww1_ottoman.26.t:0 "O Tratado de Da'an e a Pacificação do Iêmen"
 ww1_ottoman.26.d:0 "Negociado pelo Marechal Ahmed İzzet Paxá com o Imã Yahya Muhammad Hamid ed-Din em Da'an em outubro de 1911, este acordo histórico reconhece a jurisprudência religiosa zaidita nas terras altas do Iêmen em troca de aliança militar inabalável com o Império Otomano."
 ww1_ottoman.26.a:0 "O Iêmen permanece leal! Nosso flanco no Mar Vermelho está seguro!"
 ww1_ottoman.26.b:0 "Reforçar a coluna do Coronel Ali Said Paxá na fronteira de Áden."
 ww1_ottoman.27.t:0 "A Ratificação do Pacto Federal Turco-Árabe"
 ww1_ottoman.27.d:0 "Delegados de Constantinopla, Damasco, Bagdá, Beirute e Jerusalém ratificaram uma carta constitucional histórica que reorganiza o Império em uma federação turco-árabe igualitária sob a Casa de Osman, extinguindo definitivamente as conspirações separatistas."
 ww1_ottoman.27.a:0 "Turcos e árabes unidos para sempre sob o pavilhão do Crescente!"
 ww1_ottoman.27.b:0 "Inaugurar o Senado Imperial bilíngue em Constantinopla."
 ww1_ottoman.28.t:0 "O Triunfo e Renascimento do Sublime Estado Otomano"
 ww1_ottoman.28.d:0 "Os tratados secretos de partilha colonial — Sykes-Picot e o Acordo de Constantinopla — jazem em cinzas. Tendo rechaçado armadas invasoras, abolido as Capitulações e modernizado sua indústria e forças armadas, o Devlet-i Aliyye-i Osmaniyye ingressa em um novo século de grandeza soberana."
 ww1_ottoman.28.a:0 "Vida longa ao Estado Eterno! (Devlet-i Ebed-Müddet!)"
 ww1_ottoman.28.b:0 "Proclamar um grande jubileu de vitória em todos os vilaietes imperiais!"
 ww1_ottoman.29.t:0 "A Declaração Solene do Pacto Nacional (Misak-ı Millî)"
 ww1_ottoman.29.d:0 "Reunida em sessão extraordinária, a Câmara dos Deputados aprovou por unanimidade os seis artigos do Misak-ı Millî (Pacto Nacional), proclamando a indivisibilidade territorial absoluta e a independência política e financeira incondicional da nação."
 ww1_ottoman.29.a:0 "A soberania é indivisível! Nem uma pedra da pátria será cedida!"
 ww1_ottoman.29.b:0 "Mobilizar cada cidadão para defender as fronteiras do Pacto Nacional!"
 ww1_ottoman.30.t:0 "O Tratado de Brest-Litovsk e a Restituição do Cáucaso"
 ww1_ottoman.30.d:0 "Em 3 de março de 1918, o Grão-Vizir Talat Paxá e Rauf Orbay assinaram o Tratado de Paz de Brest-Litovsk com a Rússia Soviética, garantindo a evacuação completa das tropas russas da Anatólia Oriental e a devolução das três províncias de Kars, Ardahan e Batum, perdidas desde 1878."
 ww1_ottoman.30.a:0 "A ferida de 1878 está cicatrizada! Kars, Ardahan e Batum estão livres!"
 ww1_ottoman.30.b:0 "Avançar pela Transcaucásia para assegurar o caminho até Baku!"
 ww1_ottoman.31.t:0 "A Erupção Territorial da Grande Revolta Árabe"
 ww1_ottoman.31.d:0 "Estimulados por oficiais de ligação britânicos e canhoneiras no Mar Vermelho, bandos insurgentes atacaram pontes ferroviárias e postos telegráficos do Hejaz ao sul da Síria. Nos vilaietes previamente guarnecidos por nossas forças, os rebeldes são repelidos; onde faltaram guarnições, a sabotagem atinge a infraestrutura."
 ww1_ottoman.31.a:0 "Mobilizar o 4º Exército e a Força Expedicionária do Hejaz contra a insurgência!"
 ww1_ottoman.31.b:0 "Priorizar a defesa intransigente do corredor ferroviário Damasco–Medina!"
 ww1_ottoman.32.t:0 "A Resistência Tripolitana: Enver Bey e Mustafa Kemal na Líbia"
 ww1_ottoman.32.d:0 "Cruzando o Egito disfarçados de mercadores e jornalistas, o Major Enver Bey, o Major Mustafa Kemal, Fethi Bey e Nuri Bey alcançaram Derna, Tobruk e Benghazi. Reunindo dezenas de milhares de guerreiros senussitas, eles encurralaram as divisões invasoras italianas na faixa costeira sob o alcance de seus navios."
 ww1_ottoman.32.a:0 "Armar a Irmandade Senussi e travar guerra implacável a partir dos oásis!"
 ww1_ottoman.32.b:0 "Convocar nossos melhores oficiais para fortificar a fronteira da Trácia nos Bálcãs."
 ww1_ottoman.33.t:0 "A Pacificação Definitiva dos Vilaietes Árabes"
 ww1_ottoman.33.d:0 "Com a triunfante reentrada das divisões otomanas em Meca e Medina, a insurreição no deserto entrou em colapso. Os xeques tribais depuseram as armas e renovaram seus juramentos sagrados de lealdade ao Califado. A autoridade imperial foi restaurada do Mar Vermelho ao Levante."
 ww1_ottoman.33.a:0 "As cidades sagradas estão seguras; vida longa ao Sultão e ao Califado!"
 ww1_ottoman.35.t:0 "O Tratado de Brest-Litovsk e a Restituição do Cáucaso"
 ww1_ottoman.35.d:0 "Com o colapso do Império Russo, o governo soviético assinou o Tratado de Brest-Litovsk, reconhecendo a soberania otomana sobre Kars, Ardahan e Batum."
 ww1_ottoman.35.a:0 "Nossas províncias orientais históricas foram resgatadas!"
 ww1_ottoman.35.b:0 "Consolidar a administração otomana nos sanjacos libertados."
 TUR_second_constitutional_era_politics:0 "A Política da Segunda Era Constitucional"
 TUR_second_constitutional_era_politics_desc:0 "A restauração da constituição de 1876 abriu um período de intensa disputa política em Constantinopla, onde o parlamento imperial debate o futuro do Estado."
 TUR_cup_vanguard:0 "Vanguarda do Comitê de União e Progresso"
 TUR_cup_vanguard_desc:0 "O Comitê de União e Progresso (İttihat ve Terakki) consolidou sua rede de oficiais e intelectuais, determinado a impor coesão e reformas modernizadoras sobre o império."
 TUR_talat_interior_ministry:0 "Ministério do Interior de Talat Paxá"
 TUR_talat_interior_ministry_desc:0 "Mehmed Talat Paxá assume o controle do aparato administrativo civil, estabelecendo controle rígido sobre o telégrafo, os correios e os governos provinciais."
 TUR_enver_military_drive:0 "O Ímpeto Militar de Enver Paxá"
 TUR_enver_military_drive_desc:0 "O carismático herói da revolução de 1908, Ismail Enver Paxá, ascende nas fileiras do Exército, exigindo prontidão combativa inegociável e expurgo de generais hesitantes."
 TUR_cemal_public_order:0 "Segurança Pública de Cemal Paxá"
 TUR_cemal_public_order_desc:0 "Como prefeito militar de Constantinopla, Ahmed Cemal Paxá restabelece a ordem com mão de ferro, reprimindo conspirações políticas e assegurando o funcionamento da capital."
 TUR_bab_i_ali_consolidation:0 "Consolidação do Golpe de Bab-ı Âli"
 TUR_bab_i_ali_consolidation_desc:0 "A invasão armada da Sublime Porta estabeleceu o domínio inquestionável do triunvirato militar do CUP, silenciando ministros moderados em nome da salvação nacional."
 TUR_teskilat_i_mahsusa:0 "A Teşkilât-ı Mahsusa"
 TUR_teskilat_i_mahsusa_desc:0 "O serviço de inteligência e operações especiais clandestinas do Ministério da Guerra é mobilizado para guerra assimétrica, contrainsurgência e operações além das fronteiras."
 TUR_centralist_provincial_governors:0 "Governadores Provinciais Centralistas"
 TUR_centralist_provincial_governors_desc:0 "A Sublime Porta substitui aristocratas locais por valis disciplinados fiéis ao governo central, unificando a arrecadação de impostos e a mobilização de conscritos."
 TUR_paramilitary_youth_unions:0 "Uniões Paramilitares da Juventude"
 TUR_paramilitary_youth_unions_desc:0 "Organizações cívicas e desportivas educam a mocidade nos rigores da disciplina marcial, tiro ao alvo e escotismo para forjar a próxima geração de soldados imperiais."
 TUR_national_bourgeoisie_creation:0 "Criação da Burguesia Nacional"
 TUR_national_bourgeoisie_creation_desc:0 "Incentivos fiscais, cooperativas de crédito e monopólios alfandegários são concedidos a comerciantes locais para reduzir a dependência das firmas financeiras europeias."
 TUR_secular_law_codes:0 "Códigos de Leis Civis Modernizados"
 TUR_secular_law_codes_desc:0 "A reforma dos tribunais seculariza procedimentos comerciais e civis, reduzindo a jurisdição de cortes consulares estrangeiras e unificando o direito imperial."
 TUR_turkification_of_trade:0 "Nacionalização do Comércio Urbano"
 TUR_turkification_of_trade_desc:0 "Companhias de navegação, armazéns portuários e serviços urbanos são incentivados a utilizar a língua oficial e contratar cidadãos imperiais em seus quadros gerenciais."
 TUR_milli_iktisat_policies:0 "Economia Nacional: Millî İktisat"
 TUR_milli_iktisat_policies_desc:0 "Sob a doutrina da Economia Nacional, o Estado estimula indústrias manufatureiras próprias, autossuficiência de fardamento e proteção tarifária às fábricas da Anatólia."
 TUR_state_controlled_newspapers:0 "Órgãos de Imprensa do Comitê"
 TUR_state_controlled_newspapers_desc:0 "Jornais como o Tanin moldam o fervor patriótico em Constantinopla, esclarecendo as reformas do governo e unindo a opinião pública diante de ameaças imperialistas."
 TUR_sublime_porte_war_council:0 "Conselho Supremo de Guerra"
 TUR_sublime_porte_war_council_desc:0 "Os ministérios militares, navais e de suprimentos integram seu planejamento em reuniões diárias, assegurando pronta resposta a qualquer incidente nas fronteiras."
 TUR_hurriyet_ve_itilaf_victory:0 "Triunfo do Partido Liberdade e Acordo"
 TUR_hurriyet_ve_itilaf_victory_desc:0 "A Entente Liberal conquista as massas cansadas do autoritarismo do CUP, prometendo restabelecer a harmonia interétnica, eleições livres e moderação cívica."
 TUR_prince_sabahaddin_doctrine:0 "Doutrina do Príncipe Sabahaddin"
 TUR_prince_sabahaddin_doctrine_desc:0 "A filosofia sociológica de descentralização e iniciativa privada do Príncipe imperial Sabahaddin inspira uma nova geração de administradores liberais."
 TUR_provincial_self_governance:0 "Autogoverno e Descentralização Provincial"
 TUR_provincial_self_governance_desc:0 "Conselhos provinciais eleitos recebem poderes orçamentários para gerir escolas, hospitais e estradas locais, acalmando o ressentimento de lideranças regionais."
 TUR_empower_minority_bourgeoisie:0 "Proteção às Burguesias Ortodoxa e Armênia"
 TUR_empower_minority_bourgeoisie_desc:0 "Garantias patrimoniais e comerciais são reafirmadas para as comunidades grega, armênia e judaica, restaurando a liquidez dos bancos privados e o comércio exterior."
 TUR_anglo_french_constitutionalism:0 "Constitucionalismo Anglo-Francês"
 TUR_anglo_french_constitutionalism_desc:0 "A facção liberal busca inspirar as instituições imperiais na monarquia parlamentar britânica e na administração republicana francesa, atraindo capitais e garantias diplomáticas."
 TUR_pluralistic_parliament:0 "Parlamento Pluralista e Representativo"
 TUR_pluralistic_parliament_desc:0 "A câmara baixa da Assembleia Geral reflete verdadeiramente a tapeçaria de povos do império, com debates abertos entre deputados turcos, árabes, gregos e eslavos."
 TUR_judicial_and_press_liberties:0 "Garantias Jurídicas e Liberdade de Imprensa"
 TUR_judicial_and_press_liberties_desc:0 "Cortes civis independentes protegem cidadãos contra prisões arbitrárias, enquanto jornais de todas as línguas circulam livremente pelo território imperial."
 TUR_millet_equality_charter:0 "Carta de Igualdade Constitucional dos Millets"
 TUR_millet_equality_charter_desc:0 "Os líderes patriarcais e rabínicos confirmam seu compromisso com a cidadania compartilhada, garantindo autonomia confessional sob uma mesma lei constitucional."
 TUR_civic_ottomanism_restored:0 "Renascimento do Otomanismo Cívico"
 TUR_civic_ottomanism_restored_desc:0 "A ideia de que todos os súditos são irmãos perante o Estado, independentemente de credo ou idioma, rejuvenesce o patriotismo nas praças públicas de Salônica a Beirute."
 TUR_decentralized_tax_farming_abolition:0 "Extinção Definitiva do Dízimo Agrícola"
 TUR_decentralized_tax_farming_abolition_desc:0 "O opressivo sistema de arrematação de impostos por cobradores privados é substituído por avaliações tributárias justas e diretas do tesouro provincial."
 TUR_liberal_parliamentary_hegemony:0 "Hegemonia Parlamentar Liberal"
 TUR_liberal_parliamentary_hegemony_desc:0 "A coalizão descentralizadora assegura maioria sólida no Meclis-i Mebusan, promovendo estabilidade política duradoura sem a necessidade de golpes militares."
 TUR_imperial_prerogative_of_mehmed_v:0 "Prerrogativas Soberanas de Mehmed V"
 TUR_imperial_prerogative_of_mehmed_v_desc:0 "O Sultão Mehmed V Reşâd reafirma a autoridade histórica da dinastia osmanli, posicionando a coroa como árbitro supremo acima das disputas partidárias."
 TUR_loyal_viziers_cabinet:0 "Gabinete de Grão-Vizires Palacianos"
 TUR_loyal_viziers_cabinet_desc:0 "Estadistas experientes e diplomatas aristocráticos são nomeados para o Conselho de Ministros, restaurando a prudência tradicional nas decisões de Estado."
 TUR_traditional_ulema_alliance:0 "Aliança com o Conselho de Ulemás"
 TUR_traditional_ulema_alliance_desc:0 "O Sheikh-ul-Islam e os sábios religiosos do Império emprestam sua solene bênção à política palaciana, reforçando a legitimidade moral do governo imperial."
 TUR_dissolve_fractious_assembly:0 "Dissolução da Assembleia Rebelde"
 TUR_dissolve_fractious_assembly_desc:0 "Frente à paralisia e brigas entre facções partidárias, o Sultão exerce seu direito constitucional de fechar o parlamento até a convocação de eleições ordenadas."
 TUR_imperial_bodyguard_regiments:0 "Regimentos da Guarda de Dolmabahçe"
 TUR_imperial_bodyguard_regiments_desc:0 "Tropas veteranas leais à pessoa do Sultão guarnecem os palácios do Bósforo e pontos vitais da capital contra motins e intentonas revolucionárias."
 TUR_reinforce_the_porte:0 "Fortalecimento da Sublime Porta"
 TUR_reinforce_the_porte_desc:0 "Os gabinetes ministeriais de Bab-ı Âli recebem amplos poderes de emergência para conduzir a administração do império com agilidade e autoridade inquestionável."
 TUR_sultans_decree_prerogatives:0 "Decretos Soberanos do Sultão (Ferman)"
 TUR_sultans_decree_prerogatives_desc:0 "O poder de promulgar decretos-lei imperiais assegura que reformas militares e fiscais urgentes sejam aplicadas sem atrasos burocráticos."
 TUR_court_appointed_valis:0 "Governadores Nomeados pela Corte"
 TUR_court_appointed_valis_desc:0 "Dignitários de comprovada lealdade à dinastia assumem os governos de Damasco, Bagdá, Esmirna e Trípoli, mantendo a ordem com justiça e prestígio pessoal."
 TUR_divan_council_restored:0 "Restauração do Divã Imperial"
 TUR_divan_council_restored_desc:0 "O histórico conselho de ministros e conselheiros do Sultão volta a se reunir nas salas solenes de Topkapı para traçar as grandes estratégias do império."
 TUR_absolute_caliphal_authority:0 "Autoridade Suprema do Califa"
 TUR_absolute_caliphal_authority_desc:0 "O prestígio espiritual milenar do trono otomano atinge seu zênite, conclamando milhões de fiéis a defender a soberania do Estado contra predadores estrangeiros."
 TUR_arab_congress_dialogue:0 "Diálogo com o Congresso Árabe"
 TUR_arab_congress_dialogue_desc:0 "A Sublime Porta recebe com honras os delegados do Congresso Árabe de 1913, abrindo negociações sinceras sobre descentralização e reformas no Levante."
 TUR_beirut_and_damascus_charters:0 "Cartas Provinciais de Beirute e Damasco"
 TUR_beirut_and_damascus_charters_desc:0 "Estatutos municipais reconhecem a proeminência das famílias notáveis do Líbano e da Síria na administração dos tribunais e do comércio regional."
 TUR_dual_monarchy_protocol:0 "Protocolo Imperial Turco-Árabe"
 TUR_dual_monarchy_protocol_desc:0 "Proposta audaciosa eleva as províncias árabes ao status de parceiras de igual peso na coroa, similar à monarquia dual dos Habsburgo, blindando o império."
 TUR_guaranteed_arab_cabinet_seats:0 "Assentos Árabes no Gabinete Imperial"
 TUR_guaranteed_arab_cabinet_seats_desc:0 "Pastas ministeriais estratégicas, incluindo Justiça, Comércio e Instrução Pública, são permanentemente reservadas a estadistas de língua árabe."
 TUR_loyal_tribal_federation:0 "Federação das Tribos Beduínas Leais"
 TUR_loyal_tribal_federation_desc:0 "Subvenções regulares de ouro, fuzis Mauser e títulos honoríficos asseguram a lealdade dos clãs do deserto do Shammar, Anezeh e Sinai."
 TUR_caliphate_and_arab_solidarity:0 "Solidariedade Árabe sob o Califado"
 TUR_caliphate_and_arab_solidarity_desc:0 "A herança islâmica comum une soldados turcos e chefes árabes contra investidas colonialistas ocidentais na Mesopotâmia e na costa do Mar Vermelho."
 TUR_bilingual_imperial_administration:0 "Administração Bilíngue Otomano-Árabe"
 TUR_bilingual_imperial_administration_desc:0 "O árabe e o turco otomano são reconhecidos como línguas oficiais paritárias em todos os tribunais, cartórios e escolas públicas do Levante e Iraque."
 TUR_sharifian_protectorate_accord:0 "Acordo com o Xarifado de Meca"
 TUR_sharifian_protectorate_accord_desc:0 "A Sublime Porta reafirma os direitos consuetudinários do Xarife Hussein sobre o Hejaz em troca de compromisso irrestrito de fidelidade militar."
 TUR_mesopotamian_notables_council:0 "Conselho de Notáveis Mesopotâmicos"
 TUR_mesopotamian_notables_council_desc:0 "Líderes tribais e mercadores de Bagdá e Basra ganham assento deliberativo para aprovar investimentos em canais fluviais e defesa territorial."
 TUR_syrian_economic_integration:0 "Integração Econômica do Levante"
 TUR_syrian_economic_integration_desc:0 "Investimentos alfandegários e linhas telegráficas modernas soldam a economia do bilad al-sham ao mercado imperial de Constantinopla."
 TUR_pan_islamic_imperial_brotherhood:0 "Fraternidade Pan-Islâmica Imperial"
 TUR_pan_islamic_imperial_brotherhood_desc:0 "O império mobiliza o ideal de união entre todos os povos crentes, transformando a diversidade étnica em muralha inabalável de solidariedade defensiva."
 TUR_shrine_of_eyup_pilgrimage:0 "Peregrinação Solene a Eyüp Sultan"
 TUR_shrine_of_eyup_pilgrimage_desc:0 "A cerimônia de cingir a Espada de Osman na sagrada mesquita de Eyüp renova a bênção divina e a coragem combativa de todos os soldados do império."
 TUR_mobilize_sufi_brotherhoods:0 "Mobilização das Confrarias Sufis"
 TUR_mobilize_sufi_brotherhoods_desc:0 "Ordens dervixes Mevlevi e Bektashi convocam voluntários disciplinados para os hospitais militares de campanha e batalhões de socorro."
 TUR_holy_cities_custodianship:0 "Guardiões das Cidades Santas"
 TUR_holy_cities_custodianship_desc:0 "O dever sagrado de proteger Meca e Medina contra incursões estrangeiras é proclamado como o compromisso mais inegociável da dinastia otomana."
 TUR_proclamation_of_jihad_readiness:0 "Prontidão para o Chamado do Cihad-ı Ekber"
 TUR_proclamation_of_jihad_readiness_desc:0 "O Sheikh-ul-Islam prepara a fatwa que convocará muçulmanos de todas as terras sob domínio colonial britânico, francês e russo a rebelar-se."
 TUR_imperial_cohesion_ascendant:0 "A Coesão Imperial Inabalável"
 TUR_imperial_cohesion_ascendant_desc:0 "A harmonia política e a determinação cívica de Constantinopla às províncias mais distantes provam que o Império Otomano está pronto para triunfar."
 TUR_legacy_of_osman_eternal:0 "O Eterno Legado de Osman"
 TUR_legacy_of_osman_eternal_desc:0 "Seis séculos de história militar, arquitetura sublime e sabedoria jurídica culminam em um Estado revigorado, confiante em seu destino soberano."
 TUR_economic_sovereignty_drive:0 "Campanha pela Soberania Econômica"
 TUR_economic_sovereignty_drive_desc:0 "A Sublime Porta inicia um esforço coordenado para livrar as finanças imperiais da tutela sufocante de banqueiros e credores estrangeiros."
 TUR_audit_opda_administration:0 "Auditoria da Administração da Dívida (OPDA)"
 TUR_audit_opda_administration_desc:0 "Inspetores imperiais entram nos escritórios da Administração da Dívida Pública Otomana, examinando receitas e contestando deduções abusivas."
 TUR_renegotiate_creditor_coupons:0 "Renegociação dos Títulos com Credores"
 TUR_renegotiate_creditor_coupons_desc:0 "Diplomatas em Paris e Londres renegociam prazos e taxas de juros dos títulos consolidados de 1903, aliviando o fluxo de caixa do Tesouro."
 TUR_unilateral_abrogation_of_capitulations:0 "Revogação Unilateral das Capitulações"
 TUR_unilateral_abrogation_of_capitulations_desc:0 "Um decreto histórico extingue todos os privilégios extraterritoriais, isenções fiscais e imunidades judiciais desfrutadas por súditos europeus no Império."
 TUR_protective_tariff_code:0 "Novo Código de Tarifas Alfandegárias"
 TUR_protective_tariff_code_desc:0 "Pela primeira vez em um século, a Sublime Porta impõe tarifas alfandegárias de até 30% sobre produtos importados para proteger oficinas artesanais e fábricas nacionais."
 TUR_national_bank_osmanli_itibar:0 "Fundação do Banco Osmanlı İtibar-ı Millî"
 TUR_national_bank_osmanli_itibar_desc:0 "A criação do Banco Nacional de Crédito Imperial substitui o domínio do consórcio anglo-francês, fornecendo crédito estatal a empreendedores do império."
 TUR_confiscate_foreign_monopolies:0 "Reestatização dos Monopólios Estrangeiros"
 TUR_confiscate_foreign_monopolies_desc:0 "Docas portuárias, empresas de bondes elétricos e usinas de gás geridas por concessões estrangeiras são transferidas à administração pública imperial."
 TUR_monetary_autonomy_and_gold_lira:0 "Emissão Autônoma da Lira de Ouro"
 TUR_monetary_autonomy_and_gold_lira_desc:0 "A emissão de moeda passa para o controle exclusivo do Tesouro Imperial, lastreada em reservas de ouro e prata guardadas na capital."
 TUR_tobacco_regie_liquidation:0 "Liquidação da Régie Francesa do Tabaco"
 TUR_tobacco_regie_liquidation_desc:0 "O odiado monopólio da Régie Co-Intéressée é extinto, permitindo que os camponeses e fumicultores da Anatólia e Trácia vendam sua safra livremente."
 TUR_salt_monopoly_nationalization:0 "Nacionalização do Monopólio do Sal"
 TUR_salt_monopoly_nationalization_desc:0 "As salinas do Lago Tuz e da costa do Mar Egeu passam para o controle estatal, canalizando lucros vitais diretamente para os cofres do Exército."
 TUR_complete_fiscal_liberation:0 "Emancipação Fiscal Plena"
 TUR_complete_fiscal_liberation_desc:0 "Com a dívida reestruturada e as capitulações revogadas, a Sublime Porta alcança plena independência orçamentária perante o mundo."
 TUR_taurus_and_amanus_tunnels:0 "Túneis dos Montes Taurus e Amanus"
 TUR_taurus_and_amanus_tunnels_desc:0 "Engenheiros alemães e turcos abrem passagens ferroviárias cruciais pelas cordilheiras de Taurus e Amanus, eliminando o gargalo de baldeação a cavalo."
 TUR_konya_aleppo_trunk_line:0 "Linha Tronco Konya–Aleppo"
 TUR_konya_aleppo_trunk_line_desc:0 "A ferrovia conecta o planalto central anatólio à metrópole mercantil síria, permitindo a viagem contínua de trens militares e composições de carga."
 TUR_aleppo_to_mosul_extension:0 "Extensão de Aleppo a Mosul"
 TUR_aleppo_to_mosul_extension_desc:0 "Os trilhos avançam pela estepe da Alta Mesopotâmia em direção a Nusaybin e Mosul, acelerando o reforço das fronteiras orientais."
 TUR_mosul_baghdad_railhead:0 "Ponta de Trilhos Mosul–Bagdá"
 TUR_mosul_baghdad_railhead_desc:0 "A conexão ferroviária com a antiga capital abássida estabelece uma rota logística imbatível que assegura a integridade territorial do vale mesopotâmico."
 TUR_basra_terminus_settlement:0 "Terminal Ferroviário de Basra"
 TUR_basra_terminus_settlement_desc:0 "Docas modernas e armazéns conectam a ferrovia às águas do Golfo Pérsico, estabelecendo uma saída comercial protegida para o comércio oriental."
 TUR_hejaz_railway_expansion:0 "Expansão da Ferrovia de Hejaz"
 TUR_hejaz_railway_expansion_desc:0 "A lendária linha construída com donativos muçulmanos recebe novas oficinas de reparo de locomotivas e ramais de abastecimento de água no deserto."
 TUR_syrian_feeder_lines:0 "Ramais Ferroviários Sírios"
 TUR_syrian_feeder_lines_desc:0 "Ramais ligam Rayak, Homs, Trípoli e Beirute, criando uma teia logística que abastece portos e tropas com máxima flexibilidade."
 TUR_medina_to_mecca_link:0 "Ligação Férrea Medina–Meca"
 TUR_medina_to_mecca_link_desc:0 "O projeto histórico de estender os trilhos até a Cidade Sagrada de Meca aproxima fiéis de todo o mundo e assegura proteção imediata à Caaba."
 TUR_jerusalem_jaffa_railway_upgrade:0 "Modernização da Linha Jaffa–Jerusalém"
 TUR_jerusalem_jaffa_railway_upgrade_desc:0 "A conversão da bitola e a compra de locomotivas de montanha aumentam a capacidade de transporte militar e peregrino nas colinas da Judeia."
 TUR_anatolian_railway_loop:0 "Anel Ferroviário da Anatólia Central"
 TUR_anatolian_railway_loop_desc:0 "A interconexão de linhas entre Ankara, Eskişehir, Afyon e Konya cria um loop contínuo que impede congestionamentos na movimentação de tropas."
 TUR_railway_telegraph_integration:0 "Telégrafo Ferroviário Integrado"
 TUR_railway_telegraph_integration_desc:0 "Linhas telegráficas dedicadas acompanham cada quilômetro de trilhos, permitindo à Sublime Porta acompanhar horários de trens e despachos em tempo real."
 TUR_zonguldak_coal_basin_drives:0 "Bacia Carbonífera de Zonguldak"
 TUR_zonguldak_coal_basin_drives_desc:0 "Investimentos estatais em poços de ventilação e guinchos a vapor dobram a extração de carvão mineral de alta qualidade para alimentar navios e ferrovias."
 TUR_ergani_copper_mines:0 "Minas de Cobre de Ergani"
 TUR_ergani_copper_mines_desc:0 "A extração de minério de cobre nas montanhas de Diyarbakır garante suprimento doméstico essencial para a fabricação de estojos de munição e fios elétricos."
 TUR_tophane_ordnance_foundry:0 "Fundição Imperial de Tophane"
 TUR_tophane_ordnance_foundry_desc:0 "A histórica fundição de canhões no Bósforo é reformada com maquinário alemão, passando a refinar ligas de bronze e aço para peças de artilharia."
 TUR_bakirkoy_textile_mills:0 "Moinhos Têxteis de Bakırköy"
 TUR_bakirkoy_textile_mills_desc:0 "Teares a vapor produzem lã resistente e lonas impermeáveis para fardamento militar, casacos de inverno e barracas de campanha."
 TUR_zeytinburnu_munitions_complex:0 "Complexo Fabril de Zeytinburnu"
 TUR_zeytinburnu_munitions_complex_desc:0 "Prensas mecânicas operam dia e noite na costa do Mar de Mármara, produzindo milhões de cartuchos Mauser e cápsulas de artilharia leve."
 TUR_ankara_state_foundries:0 "Fundições Estatais de Ankara"
 TUR_ankara_state_foundries_desc:0 "Oficinas metalúrgicas instaladas no coração da Anatólia produzem ferramentas de sapa, ferraduras e granadas de mão protegidas de bombardeios costeiros."
 TUR_izmir_commercial_quays:0 "Ampliação dos Cais de Esmirna"
 TUR_izmir_commercial_quays_desc:0 "Novos guindastes a vapor e armazéns alfandegários no golfo de Esmirna facilitam o embarque rápido de tabaco, figos e trigo para o exterior."
 TUR_constantinople_electric_grid:0 "Eletrificação de Constantinopla"
 TUR_constantinople_electric_grid_desc:0 "A usina termelétrica de Silahtarağa fornece energia abundante para bondes urbanos, arsenais do Chifre de Ouro e comunicações telegráficas."
 TUR_amasya_metal_smelters:0 "Siderúrgicas de Amasya e Sivas"
 TUR_amasya_metal_smelters_desc:0 "Forjas regionais processam minérios das montanhas pônticas, suprindo ferreiros e batalhões de engenharia com trilhos e vigas de ferro."
 TUR_imperial_munitions_directorate:0 "Diretoria Geral de Armamento"
 TUR_imperial_munitions_directorate_desc:0 "A centralização técnica sob o Ministério da Guerra elimina desperdício de pólvora e padroniza a produção fabril de projéteis e explosivos."
 TUR_full_industrial_mobilization:0 "Mobilização Fabril de Guerra"
 TUR_full_industrial_mobilization_desc:0 "Todas as fundições privadas, oficinas ferroviárias e ateliês mecânicos são requisitados para a produção ininterrupta de material bélico."
 TUR_anatolian_grain_reserves:0 "Reservas de Grãos da Anatólia"
 TUR_anatolian_grain_reserves_desc:0 "Compras antecipadas de trigo e cevada enchem armazéns estatais em Konya e Ankara, protegendo as cidades imperiais contra inflação e fome."
 TUR_willcocks_mesopotamia_irrigation:0 "Projetos de Irrigação Willcocks"
 TUR_willcocks_mesopotamia_irrigation_desc:0 "A barragem de Hindiyya no Eufrates e novos canais restituem a lendária fertilidade dos campos mesopotâmicos para alimentar o exército."
 TUR_cilicia_cotton_modernization:0 "Algodão Mecanizado da Cilícia"
 TUR_cilicia_cotton_modernization_desc:0 "A planície de Çukurova recebe descaroçadeiras modernas e canais de drenagem, multiplicando a colheita do valioso algodão imperial."
 TUR_anti_locust_campaigns:0 "Brigadas contra Pragas de Gafanhotos"
 TUR_anti_locust_campaigns_desc:0 "Equipes de voluntários e soldados utilizam barreiras de zinco e lança-chamas para destruir nuvens de gafanhotos antes que devorem as colheitas do Levante."
 TUR_state_silos_and_famine_relief:0 "Silos de Ajuda Alimentar"
 TUR_state_silos_and_famine_relief_desc:0 "Redes de celeiros comunais em Beirute, Jerusalém e Aleppo distribuem farinha a preços subsidiados, impedindo tumultos populares."
 TUR_ziraat_bankasi_credit_expansion:0 "Crédito Agrícola do Ziraat Bankası"
 TUR_ziraat_bankasi_credit_expansion_desc:0 "O Banco Agrícola Imperial concede empréstimos de baixo juro a pequenos proprietários para a aquisição de sementes selecionadas e arados de ferro."
 TUR_mechanized_anatolian_farming:0 "Mecanização Agrícola da Anatólia"
 TUR_mechanized_anatolian_farming_desc:0 "Tratores a vapor e debulhadoras importadas operam nas grandes estepes férteis, compensando a falta de braços masculinos convocados às fileiras."
 TUR_black_sea_timber_concessions:0 "Madeireiras do Mar Negro"
 TUR_black_sea_timber_concessions_desc:0 "Serrarias florestais nas encostas do Ponto fornecem vigas de carvalho e pinho para escorar trincheiras e fabricar dormentes ferroviários."
 TUR_agrarian_surplus_storage:0 "Armazéns de Soberania Alimentar"
 TUR_agrarian_surplus_storage_desc:0 "Galpões secos e ventilados junto aos ramais ferroviários estocam excedentes de colheita protegidos da umidade e de ataques aéreos."
 TUR_breadbasket_of_the_empire:0 "O Celeiro Auto-Suficiente do Império"
 TUR_breadbasket_of_the_empire_desc:0 "A integração do planalto anatólio e dos vales férteis do Levante assegura que o Império Otomano não possa ser derrotado pela fome."
 TUR_integrated_imperial_economy:0 "Economia Imperial Integrada"
 TUR_integrated_imperial_economy_desc:0 "Carvão do Ponto, algodão da Cilícia, ferro de Ankara e trigo da Síria circulam sem entraves por um mercado nacional unificado e dinâmico."
 TUR_anatolian_highway_system:0 "Rodovias e Carroçáveis da Anatólia"
 TUR_anatolian_highway_system_desc:0 "Estradas macadamizadas de rodagem conectam vilarejos rurais aos terminais ferroviários, facilitando o transporte de víveres e conscritos."
 TUR_petroleum_concessions_mosul:0 "Pesquisa Petrolífera de Mosul"
 TUR_petroleum_concessions_mosul_desc:0 "Geólogos imperiais identificam os riquíssimos lençóis de óleo em Kirkuk e Qayyara, assegurando a reserva energética mais valiosa do futuro."
 TUR_sublime_porte_heavy_industry_board:0 "Conselho de Indústria Pesada"
 TUR_sublime_porte_heavy_industry_board_desc:0 "Engenheiros militares e industriais planejam a expansão de laminadores e fundições de aço capazes de produzir trilhos e chapas blindadas."
 TUR_autarkic_imperial_foundation:0 "Alicerce Autárquico do Império"
 TUR_autarkic_imperial_foundation_desc:0 "A nação conquista independência completa de insumos vitais, tornando o solo pátrio imune a chantagens de bloqueio marítimo ocidental."
 TUR_modern_ottoman_economic_miracle:0 "O Milagre Econômico da Sublime Porta"
 TUR_modern_ottoman_economic_miracle_desc:0 "A transição de um império endividado para um polo produtivo autônomo e respeitado demonstra o vigor inquebrantável do povo otomano."
 TUR_reorganizing_the_imperial_army:0 "Reorganização do Exército Imperial Otomano"
 TUR_reorganizing_the_imperial_army_desc:0 "As amargas lições das Guerras Balcânicas forçam uma reestruturação profunda do exército imperial, eliminando divisões de papel e restaurando o espírito combativo."
 TUR_harbiye_academy_modernization:0 "Modernização da Academia Militar Harbiye"
 TUR_harbiye_academy_modernization_desc:0 "A prestigiosa escola de oficiais de Pangaltı adota currículos rigorosos de balística, táticas combinadas e logística moderna inspirados nos melhores estados-maiores europeus."
 TUR_purge_inefficient_cadres:0 "Expurgo dos Oficiais Arcaicos"
 TUR_purge_inefficient_cadres_desc:0 "Centenas de generais idosos e coronéis acomodados são reformados compulsoriamente pelo Ministério da Guerra, abrindo caminho para oficiais jovens, cultos e audazes."
 TUR_standardize_mauser_rifles:0 "Padronização com Fuzis Mauser"
 TUR_standardize_mauser_rifles_desc:0 "A infantaria de linha é rearmada com fuzis e carabinas Mauser nos calibres 7.65mm e 7.92mm, unificando os calibres regimentais e facilitando o suprimento de munição."
 TUR_krupp_quick_fire_artillery:0 "Artilharia de Tiro Rápido Krupp"
 TUR_krupp_quick_fire_artillery_desc:0 "Baterias de campo recebem os modernos canhões Krupp de 75mm e 105mm com freio de recuo hidráulico, garantindo volume de fogo devastador contra colunas inimigas."
 TUR_anatolian_infantry_doctrine:0 "Doutrina da Infantaria da Anatólia"
 TUR_anatolian_infantry_doctrine_desc:0 "A infantaria otomana apoia-se na lendária resistência física e estoicismo dos camponeses anatólios, treinados para marchar sob intempéries e cavar defesas impenetráveis."
 TUR_desert_camel_corps_regiments:0 "Regimentos do Corpo de Dromedários de Hejan"
 TUR_desert_camel_corps_regiments_desc:0 "Tropas móveis montadas em camelos de alta velocidade patrulham os mares de areia do Sinai e da Península Arábica, golpeando postos avançados inimigos com surpresa."
 TUR_caucasus_alpine_detachments:0 "Destacamentos de Montanha do Cáucaso"
 TUR_caucasus_alpine_detachments_desc:0 "Batalhões especializados recebem esquis, roupas térmicas e adestramento para combate em desfiladeiros gelados e nevascas nas cordilheiras de Erzurum e Sarıkamış."
 TUR_machine_gun_companies:0 "Companhias Divisionárias de Metralhadoras"
 TUR_machine_gun_companies_desc:0 "Companhias de metralhadoras pesadas Maxim e Schwarzlose são anexadas a cada regimento de infantaria, estabelecendo zonas de tiro cruzado letais em trincheiras."
 TUR_field_medicine_red_crescent:0 "Medicina Militar do Crescente Vermelho"
 TUR_field_medicine_red_crescent_desc:0 "O Hilal-i Ahmer organiza hospitais de campanha móveis, trens de evacuação e ambulâncias sanitárias, reduzindo drasticamente as baixas causadas por tifo e cólera."
 TUR_gendarmerie_modernization_corps:0 "Modernização da Gendarmaria Imperial"
 TUR_gendarmerie_modernization_corps_desc:0 "O corpo de gendarmaria (Jandarma) é treinado por veteranos para manter as linhas de suprimento seguras, vigiar estradas de ferro e desarmar bandos guerrilheiros."
 TUR_heavy_siege_howitzers:0 "Obuseiros Pesados de Cerco"
 TUR_heavy_siege_howitzers_desc:0 "A aquisição de morteiros pesados Skoda de 305mm e canhões de cerco Krupp de 150mm e 210mm garante poder de esmagamento contra fortificações inimigas."
 TUR_comprehensive_conscription_law:0 "Lei Abrangente de Mobilização Militar de 1914"
 TUR_comprehensive_conscription_law_desc:0 "A nova legislação de recrutamento reorganiza os distritos militares em Nizamiye (linha), Redif (reserva) e Mustahfiz (guarda territorial), maximizando a força do império."
 TUR_foreign_mission_choice:0 "Escolha da Missão Militar Estrangeira"
 TUR_foreign_mission_choice_desc:0 "O Conselho de Guerra delibera se deve convidar assessores prussianos para reformar a doutrina do exército ou priorizar a liderança autônoma de oficiais nativos."
 TUR_german_military_mission_sanders:0 "Missão Militar Alemã de Liman von Sanders"
 TUR_german_military_mission_sanders_desc:0 "O General Otto Liman von Sanders e um estado-maior de oficiais prussianos assumem funções de instrução e inspeção técnica nas principais divisões otomanas."
 TUR_native_general_staff_kemal:0 "Estado-Maior Autônomo e Líderes Nativos"
 TUR_native_general_staff_kemal_desc:0 "Oficiais graduados como Mustafa Kemal Bey e Fevzi Paxá assumem as rédeas do planejamento, adaptando as táticas à geografia árida e montanhosa do império."
 TUR_prusso_ottoman_doctrine:0 "Doutrina Tática Prusso-Otomana"
 TUR_prusso_ottoman_doctrine_desc:0 "A fusão da tenacidade otomana com a disciplina operacional e os planos minuciosos de estado-maior prussiano forja uma força militar temível e resoluta."
 TUR_independent_tactical_flexibility:0 "Flexibilidade Tática Independente"
 TUR_independent_tactical_flexibility_desc:0 "Oficiais de regimento ganham liberdade de iniciativa para reagir instantaneamente a imprevistos de campo, superando a rigidez dos manuais clássicos europeus."
 TUR_krupp_heavy_ordnance_contracts:0 "Contratos de Material Pesado com a Krupp"
 TUR_krupp_heavy_ordnance_contracts_desc:0 "Trens carregados de peças de artilharia pesada, granadas perfurantes e tubos sobressalentes chegam de Essen para equipar os fortes de Çanakkale e Edirne."
 TUR_anatolian_guerrilla_tradition:0 "Tradição de Guerra Irregular da Anatólia"
 TUR_anatolian_guerrilla_tradition_desc:0 "A experiência dos combatentes irregulares (Çete) em terrenos acidentados é incorporada ao treinamento da infantaria para emboscadas e patrulhas de choque noturnas."
 TUR_joint_staff_operational_drills:0 "Manobras Operacionais Combinadas"
 TUR_joint_staff_operational_drills_desc:0 "Exercícios de campo em grande escala na Trácia e em Esmirna testam a coordenação entre infantaria, cavalaria, baterias de artilharia e serviços médicos."
 TUR_officer_corps_intellectual_vigor:0 "Vigor Intelectual do Corpo de Oficiais"
 TUR_officer_corps_intellectual_vigor_desc:0 "Manuais táticos contemporâneos traduzidos para o turco e círculos de estudos de estado-maior elevam a cultura técnica e a competência de liderança dos oficiais."
 TUR_divisional_artillery_batteries:0 "Baterias Divisionárias de Apoio Integrado"
 TUR_divisional_artillery_batteries_desc:0 "Cada divisão de infantaria tem seu grupo de artilharia garantido organicamente, acabando com a dependência de autorizações demoradas de escalões superiores."
 TUR_corps_level_reserves_doctrine:0 "Doutrina de Reservas Móveis de Corpo"
 TUR_corps_level_reserves_doctrine_desc:0 "Regimentos mantidos em reserva concentrada são mantidos prontos atrás dos setores mais ameaçados para desfechar contra-ataques imediatos antes de o inimigo fincar pé."
 TUR_rebuild_the_imperial_fleet:0 "Reconstrução da Frota Imperial Otomana"
 TUR_rebuild_the_imperial_fleet_desc:0 "A Marinha Imperial (Osmanlı Donanması) inicia plano emergencial de reaparelhamento para defender as costas dos Três Mares e manter aberta a rota de abastecimento marítimo."
 TUR_the_dreadnought_contracts_uk:0 "Os Contratos Britânicos de Encouraçados"
 TUR_the_dreadnought_contracts_uk_desc:0 "Os estaleiros britânicos de Vickers e Armstrong constroem os temíveis encouraçados Sultan Osman-ı Evvel e Reşadiye para garantir supremacia naval no Egeu."
 TUR_golden_horn_shipyards_expansion:0 "Expansão dos Estaleiros do Chifre de Ouro"
 TUR_golden_horn_shipyards_expansion_desc:0 "Os históricos arsenais navais de Tersane-i Âmire em Kasımpaşa recebem novos diques secos e maquinário moderno para reparo de caldeiras e couraças de navios."
 TUR_public_donation_drive_sultan_osman:0 "Campanha Nacional de Doações para a Frota"
 TUR_public_donation_drive_sultan_osman_desc:0 "Milhões de cidadãos imperiais, de senhoras patriotas a pequenos feirantes, doam jóias e moedas de prata para financiar a entrega dos encouraçados imperiais."
 TUR_torpedo_boat_flotillas:0 "Flotilhas de Torpedeiras Rápidas"
 TUR_torpedo_boat_flotillas_desc:0 "Esquadrilhas de torpedeiras ligeiras e destróieres patrulham enseadas e estreitos, prontas para lançar ataques fulminantes de torpedos sob a cobertura da névoa."
 TUR_welcome_goeben_and_breslau:0 "Acolhimento do Yavuz e Midilli"
 TUR_welcome_goeben_and_breslau_desc:0 "O cruzador de batalha SMS Goeben e o cruzador leve SMS Breslau cruzam o Dardanelos fugindo dos britânicos e são incorporados à frota imperial sob bandeira otomana."
 TUR_black_sea_submarine_patrols:0 "Patrulhas Submarinas no Mar Negro"
 TUR_black_sea_submarine_patrols_desc:0 "Submarinos baseados no Bósforo executam missões de emboscada silenciosa contra a frota russa de Sebastopol e protegem comboios de carvão vindos de Zonguldak."
 TUR_coastal_minelayer_force:0 "Força de Minadores Costeiros e o Nusret"
 TUR_coastal_minelayer_force_desc:0 "O minador Nusret e navios auxiliares semeiam linhas de minas de contato secretas nas correntes traiçoeiras da Baía de Erenköy, preparando armadilhas fatais."
 TUR_naval_gunnery_schools:0 "Escolas de Artilharia Naval da Marinha"
 TUR_naval_gunnery_schools_desc:0 "Oficiais navais e marinheiros treinam cálculo de tiro balístico e telemetria ótica em Heybeliada, elevando a precisão dos canhões principais da frota."
 TUR_cruiser_escort_squadrons:0 "Esquadrões de Escolta de Cruzadores"
 TUR_cruiser_escort_squadrons_desc:0 "Cruzadores protegidos como o Hamidiye e o Mecidiye patrulham o Mediterrâneo Oriental e o Mar Vermelho, interceptando contrabandos e escoltando transportes."
 TUR_sovereign_black_sea_fleet:0 "Soberania da Esquadra do Mar Negro"
 TUR_sovereign_black_sea_fleet_desc:0 "A marinha imperial garante controle inconteste das águas do norte, bombardeando portos russos e assegurando as rotas de carvão vitais para a capital."
 TUR_yesilkoy_aviation_school:0 "Escola de Aviação de Yeşilköy"
 TUR_yesilkoy_aviation_school_desc:0 "O centro aeronáutico de San Stefano treina os primeiros pilotos de caça e reconhecimento do império, introduzindo a guerra aérea no céu da Anatólia."
 TUR_strengthen_canakkale_batteries:0 "Fortificação das Baterias de Çanakkale"
 TUR_strengthen_canakkale_batteries_desc:0 "Fortes costeiros em Kilitbahir e Çimenlik recebem peças pesadas de artilharia Krupp e plataformas de concreto armado, tornando o estreito intransponível."
 TUR_procure_bleriot_and_rumpler_monoplanes:0 "Monoplanos de Reconhecimento Blériot e Rumpler"
 TUR_procure_bleriot_and_rumpler_monoplanes_desc:0 "Aeronaves monoplano e biplanos alemães Rumpler e Albatros realizam voos de reconhecimento sobre navios de guerra e trincheiras invasoras no Dardanelos."
 TUR_underwater_minefields_straits:0 "Cinturão de Campos Minados nos Estreitos"
 TUR_underwater_minefields_straits_desc:0 "Dez linhas consecutivas de minas marinhas de contato cruzam as correntes estreitas de Çanakkale, prontas para despedaçar qualquer navio de linha inimigo."
 TUR_aerial_reconnaissance_detachments:0 "Destacamentos de Reconhecimento Aéreo"
 TUR_aerial_reconnaissance_detachments_desc:0 "Fotógrafos aéreos militares mapeiam as linhas de trincheiras inimigas, informando antecipadamente o Estado-Maior sobre concentrações de desembarque."
 TUR_searchlight_batteries_dardanelles:0 "Refletores Costeiros do Dardanelos"
 TUR_searchlight_batteries_dardanelles_desc:0 "Poderosos projetores elétricos varrem as águas noturnas do estreito, impedindo que caça-minas britânicos operem às escuras e iluminando alvos para os canhões."
 TUR_joint_command_supreme_staff:0 "Comando Supremo Unificado (Erkân-ı Harbiye)"
 TUR_joint_command_supreme_staff_desc:0 "A integração centralizada das operações terrestres, navais e aéreas sob o Ministério da Guerra garante respostas rápidas e coesas em todas as frentes de batalha."
 TUR_modern_field_communications:0 "Comunicações Telefônicas e Rádio de Campanha"
 TUR_modern_field_communications_desc:0 "Linhas telegráficas subterrâneas blindadas e estações de radiotelegrafia Telefunken conectam os corpos de exército de quartéis-generais até a linha de frente."
 TUR_logistics_motor_truck_corps:0 "Corpo de Caminhões Motorizados de Suprimento"
 TUR_logistics_motor_truck_corps_desc:0 "Caminhões pesados Daimler e Benz complementam as caravanas de mulas e camelos, agilizando o transporte de obuses e rações nas rotas sem ferrovia."
 TUR_imperial_arsenals_peak_output:0 "Capacidade Máxima dos Arsenais Imperiais"
 TUR_imperial_arsenals_peak_output_desc:0 "As oficinas militares de Zeytinburnu e Tophane operam em regime ininterrupto, fabricando milhões de cartuchos, pólvora sem fumaça e consertando fuzis avariados."
 TUR_harbiye_tactical_doctrine_zenith:0 "O Zênite da Doutrina Harbiye"
 TUR_harbiye_tactical_doctrine_zenith_desc:0 "Os oficiais formados na Harbiye provam sua liderança brilhante contra exércitos imperiais ocidentais, dominando a arte da defesa em profundidade e contra-ataques."
 TUR_invincible_mehmetcik_spirit:0 "O Invencível Espírito do Mehmetçik"
 TUR_invincible_mehmetcik_spirit_desc:0 "O soldado raso otomano—o Mehmetçik—torna-se uma lenda viva de bravura inquebrantável, resistindo a bombardeios colossais e defendendo a pátria até a última gota de sangue."
 TUR_sublime_porte_foreign_policy:0 "Política Externa da Sublime Porta"
 TUR_sublime_porte_foreign_policy_desc:0 "Cercado por rivalidades imperialistas predatórias, o Ministério dos Negócios Estrangeiros em Bab-ı Âli deve manobrar para resguardar a soberania do império."
 TUR_western_thrace_border_vigilance:0 "Vigilância na Fronteira da Trácia Ocidental"
 TUR_western_thrace_border_vigilance_desc:0 "Postos de observação e patrulhas móveis ao longo do Rio Maritsa vigiam qualquer incursão hostil nas planícies que dão acesso direto à capital imperial."
 TUR_edirne_fortress_complex:0 "Complexo Fortificado de Edirne (Adrianópolis)"
 TUR_edirne_fortress_complex_desc:0 "O reduto heróico de Edirne é rearmado com novas casamatas de concreto e baterias pesadas, tornando-se o escudo inexpugnável da Trácia oriental."
 TUR_bulgarian_friendship_treaty:0 "Tratado de Amizade e Retificação com a Bulgária"
 TUR_bulgarian_friendship_treaty_desc:0 "A retificação territorial pacífica ao longo do Rio Maritsa garante a cooperação militar e o trânsito ferroviário seguro através de Sofia até a Europa Central."
 TUR_romanian_grain_accord:0 "Acordo de Cereais com a Romênia"
 TUR_romanian_grain_accord_desc:0 "Tratado comercial com Bucareste assegura o envio constante de barcaças de trigo do Danúbio para abastecer os moinhos e padarias de Constantinopla."
 TUR_reaffirm_libyan_sovereignty:0 "Reafirmação da Soberania sobre a Líbia"
 TUR_reaffirm_libyan_sovereignty_desc:0 "Oficiais voluntários como Enver e Mustafa Kemal apoiaram a resistência local; a Sublime Porta declara que não abandonará os irmãos líbios."
 TUR_sanusi_brotherhood_pact:0 "Pacto com a Ordem Senussi"
 TUR_sanusi_brotherhood_pact_desc:0 "Sayyid Ahmad ash-Sharif e os guerreiros senussitas recebem ouro, fuzis e canhões de montanha para liderar a resistência no deserto da Cirenaica e Fezzan."
 TUR_tripoli_coastal_fortifications:0 "Fortificações Costeiras de Trípoli"
 TUR_tripoli_coastal_fortifications_desc:0 "Baterias ocultas e ninhos de metralhadoras em oásis costeiros bloqueiam investidas inimigas contra as rotas de caravanas do interior saariano."
 TUR_aegean_island_garrisons:0 "Guarnições das Ilhas do Egeu e Dodecaneso"
 TUR_aegean_island_garrisons_desc:0 "Tropas territoriais e baterias leves guarnecem as ilhas costeiras anatolienses, protegendo as entradas marítimas de Esmirna, Bodrum e Antália."
 TUR_german_rapprochement:0 "Aproximação Estratégica com a Alemanha"
 TUR_german_rapprochement_desc:0 "O Embaixador Wangenheim e o Kaiser Guilherme II veem o Império Otomano como aliado indispensável, oferecendo investimentos e cooperação militar irrestrita."
 TUR_secret_alliance_august_1914:0 "Aliança Secreta de 2 de Agosto de 1914"
 TUR_secret_alliance_august_1914_desc:0 "O tratado secreto assinado no Palácio de Yeniköy sela a aliança defensiva mútua contra o expansionismo russo, vinculando os destinos de Berlim e Constantinopla."
 TUR_german_gold_loans:0 "Empréstimos de Ouro do Reichsbank"
 TUR_german_gold_loans_desc:0 "Milhões de marcos em barras de ouro puro são despachados em segredo para o Banco Imperial Otomano, estabilizando as finanças de guerra e as compras de armamentos."
 TUR_souchon_black_sea_raid:0 "O Ataque Naval do Almirante Souchon no Mar Negro"
 TUR_souchon_black_sea_raid_desc:0 "Sob o comando do Almirante Wilhelm Souchon, a esquadra imperial bombardeia Sebastopol, Odessa e Novorossiysk, arrastando o império definitivamente para o conflito."
 TUR_join_central_powers_faction:0 "Ingresso Oficial nas Potências Centrais"
 TUR_join_central_powers_faction_desc:0 "A Sublime Porta assume solenemente seu lugar na Tríplice Aliança ao lado da Alemanha e Áustria-Hungria na luta contra a Entente."
 TUR_berlin_constantinople_axis:0 "O Eixo Berlim-Constantinopla"
 TUR_berlin_constantinople_axis_desc:0 "A ferrovia transcontinental e o telégrafo militar criam uma artéria ininterrupta do Báltico ao Bósforo, permitindo transferência contínua de tecnologia e armas."
 TUR_austro_hungarian_danubian_link:0 "Ligação Danubiana com a Áustria-Hungria"
 TUR_austro_hungarian_danubian_link_desc:0 "Barcaças fluviais navegando o Danúbio conectam Viena e Budapeste aos portos do Mar Negro, transportando obuseiros pesados e munições para o front turco."
 TUR_bulgarian_transit_corridor:0 "Corredor de Trânsito Ferroviário Búlgaro"
 TUR_bulgarian_transit_corridor_desc:0 "Após a entrada da Bulgária na guerra, a linha férrea Expresso do Oriente opera livremente dia e noite através de Belgrado e Sófia até a capital imperial."
 TUR_central_powers_war_council:0 "Conselho de Guerra Conjunto das Potências Centrais"
 TUR_central_powers_war_council_desc:0 "Representantes do Estado-Maior otomano deliberam lado a lado com os marechais alemães e austro-húngaros sobre as grandes ofensivas na Rússia e Oriente Médio."
 TUR_shared_munitions_standardization:0 "Padronização de Munições com os Aliados"
 TUR_shared_munitions_standardization_desc:0 "A calibração das armas portáteis e projéteis de artilharia para os padrões 7.92mm e 105mm alemães permite que fábricas da Europa Central municiem o exército turco."
 TUR_strict_armed_neutrality:0 "Estrita Neutralidade Armada"
 TUR_strict_armed_neutrality_desc:0 "A Sublime Porta recusa alianças entorpecedoras e declara sua determinação de permanecer neutra, mobilizando suas forças apenas para resguardar seu solo pátrio."
 TUR_close_straits_to_all_belligerents:0 "Fechamento dos Estreitos a Todos os Beligerantes"
 TUR_close_straits_to_all_belligerents_desc:0 "O Bósforo e o Dardanelos são fechados para navios de guerra de qualquer nação, estrangulando o trânsito militar russo sem violar a lei internacional de neutralidade."
 TUR_demand_belligerent_transit_tolls:0 "Cobrança de Tarifas de Trânsito Soberanas"
 TUR_demand_belligerent_transit_tolls_desc:0 "Todo vapor mercante que cruza os estreitos deve pagar taxas soberanas em ouro ao Tesouro Otomano, gerando receitas vultosas sem disparar um tiro."
 TUR_internal_development_focus:0 "Foco no Desenvolvimento Interno da Anatólia"
 TUR_internal_development_focus_desc:0 "Com a nação a salvo do banho de sangue europeu, todo o esforço nacional é canalizado para irrigação, escolas rurais e novas minas de ferro."
 TUR_profit_from_wartime_trade:0 "Lucro com o Comércio Neutro de Guerra"
 TUR_profit_from_wartime_trade_desc:0 "O império vende algodão, trigo, couro e cromo a preços inflacionados para ambos os lados do conflito, acumulando imensas reservas de divisas."
 TUR_swiss_of_the_orient_neutrality:0 "A Suíça do Oriente"
 TUR_swiss_of_the_orient_neutrality_desc:0 "Com defesas montanhosas intransponíveis e postura pacífica inabalável, o Império Otomano firma-se como o refúgio seguro e respeitado do Oriente Médio."
 TUR_diplomatic_mediation_summit:0 "Conferência de Mediação de Paz em Constantinopla"
 TUR_diplomatic_mediation_summit_desc:0 "O Sultão oferece a capital imperial como sede neutra para negociações de paz entre as potências exaustas, consolidando enorme prestígio internacional."
 TUR_neutral_sovereignty_guaranteed:0 "Soberania Neutra Inviolável"
 TUR_neutral_sovereignty_guaranteed_desc:0 "Todas as grandes potências assinam garantias solenes respeitando as fronteiras otomanas, assegurando a continuidade pacífica do império."
 TUR_entente_diplomatic_demands:0 "Demandas Diplomáticas à Entente"
 TUR_entente_diplomatic_demands_desc:0 "A Sublime Porta condiciona qualquer cooperação com Grã-Bretanha e França à restituição imediata dos navios apreendidos e anulação de concessões coloniais."
 TUR_demand_dreadnought_deliveries:0 "Exigência de Entrega dos Encouraçados"
 TUR_demand_dreadnought_deliveries_desc:0 "O governo exige que Churchill libere o Sultan Osman-ı Evvel ou compense integralmente o povo otomano com juros e indenizações diplomáticas."
 TUR_territorial_integrity_guarantees:0 "Garantias de Integridade Territorial Imperial"
 TUR_territorial_integrity_guarantees_desc:0 "A Entente deve assinar compromisso público e irrevogável de que nenhuma província na Trácia, Anatólia, Síria ou Mesopotâmia será desmembrada."
 TUR_anglo_ottoman_gulf_treaty:0 "Tratado Anglo-Otomano sobre o Golfo Pérsico"
 TUR_anglo_ottoman_gulf_treaty_desc:0 "Demarcação clara de zonas de influência no Kuwait, Catar e Golfo Pérsico neutraliza fricções coloniais de longa data com a Marinha Real."
 TUR_neutralize_russian_threat:0 "Neutralização da Ameaça do Império Russo"
 TUR_neutralize_russian_threat_desc:0 "Garantias formais de Londres e Paris forçam o Czar a renunciar às suas pretensões seculares de ocupar Constantinopla e os Estreitos turcos."
 TUR_french_syrian_economic_pact:0 "Pacto Econômico Franco-Sírio"
 TUR_french_syrian_economic_pact_desc:0 "Investimentos franceses na ferrovia de Beirute-Damasco e na indústria da seda são acolhidos em termos mutuamente vantajosos sem cessão de soberania."
 TUR_entente_cooperation_treaty:0 "Tratado de Cooperação com a Entente"
 TUR_entente_cooperation_treaty_desc:0 "Acomodação honrosa com a Entente assegura financiamentos em libras esterlinas e francos, poupando a nação da guerra e atraindo comércio naval."
 TUR_secured_ottoman_borders:0 "Fronteiras Imperiais Seguras e Reconhecidas"
 TUR_secured_ottoman_borders_desc:0 "A integridade territorial otomana é reconhecida por todo o concerto internacional, garantindo a paz perpétua de Adrianópolis a Bassorá."
 TUR_the_sovereign_straits_regime:0 "O Regime Soberano dos Estreitos"
 TUR_the_sovereign_straits_regime_desc:0 "O controle total e absoluto do Bósforo e Dardanelos permanece nas mãos inabaláveis de Constantinopla, sem intervenção de comissões internacionais."
 TUR_dardanelles_maritime_hegemony:0 "Hegemonia Marítima de Çanakkale"
 TUR_dardanelles_maritime_hegemony_desc:0 "Com baterias costeiras de alcance quilométrico e campos de minas sob controle, a passagem entre o Mediterrâneo e o Mar Negro obedece apenas à Sublime Porta."
 TUR_levantine_coastal_security:0 "Segurança Costeira do Levante"
 TUR_levantine_coastal_security_desc:0 "Canhões móveis e fortificações em Jaffa, Beirute e Trípoli impedem desembarques navais hostis e protegem a navegação de cabotagem."
 TUR_sublime_porte_global_standing:0 "Prestígio Global da Sublime Porta"
 TUR_sublime_porte_global_standing_desc:0 "O império é mais uma vez reconhecido como uma das grandes potências do planeta, cortejado por governos do Oriente ao Ocidente."
 TUR_destiny_of_the_near_east:0 "O Destino do Próximo Oriente"
 TUR_destiny_of_the_near_east_desc:0 "Os povos do Oriente Médio olham para Constantinopla não como uma força colonial, mas como a guardiã natural de sua independência e dignidade civilizacional."
 TUR_pax_osmanica_reasserted:0 "A Reafirmação da Pax Osmanica"
 TUR_pax_osmanica_reasserted_desc:0 "A era de ouro da coexistência e prosperidade renasce sobre os vales do Tigre, do Eufrates, do Nilo e do Danúbio sob a bandeira otomana."
 TUR_the_war_for_imperial_survival:0 "A Guerra pela Sobrevivência Imperial"
 TUR_the_war_for_imperial_survival_desc:0 "O império enfrenta o teste supremo de sua história milenar. Em cinco frentes simultâneas, cada soldado defende a própria existência do Estado Otomano."
 TUR_caucasus_logistics_preparation:0 "Preparo Logístico da Frente do Cáucaso"
 TUR_caucasus_logistics_preparation_desc:0 "Depósitos de farinha, trens de mulas e oficinas de capotes de lã são organizados em Erzurum e Sivas para sustentar as tropas nas montanhas congeladas."
 TUR_third_army_mountain_offensive:0 "Ofensiva de Montanha do 3º Exército"
 TUR_third_army_mountain_offensive_desc:0 "Superando os erros de Sarıkamış com táticas adaptadas à neve, o 3º Exército manobra em pinça pelas cordilheiras para desalojar as divisões russas."
 TUR_trabzon_supply_lifeline:0 "A Linha de Suprimento de Trabzon"
 TUR_trabzon_supply_lifeline_desc:0 "Vapores e saveiros costeiros transportam munição e rações de Constantinopla até o porto de Trabzon sob escolta de torpedeiras, abastecendo o front oriental."
 TUR_retake_kars_ardahan_batum:0 "Recuperação de Kars, Ardahan e Batumi"
 TUR_retake_kars_ardahan_batum_desc:0 "As três províncias históricas perdidas na amarga guerra de 1877-1878 são libertadas pelas divisões otomanas sob aclamação das populações locais."
 TUR_army_of_islam_caucasus:0 "O Exército do Islã do Cáucaso"
 TUR_army_of_islam_caucasus_desc:0 "Sob o comando enérgico de Nuri Paxá, o Exército do Islã reúne voluntários azeris e caucasianos para expulsar forças bolcheviques e britânicas."
 TUR_baku_petroleum_drive:0 "Ofensiva pelos Campos de Petróleo de Baku"
 TUR_baku_petroleum_drive_desc:0 "A captura estratégica dos ricos poços de petróleo de Baku garante combustível infinito para os trens, navios e motores das forças imperiais."
 TUR_caspian_flotilla_organization:0 "Organização da Flotilha do Mar Cáspio"
 TUR_caspian_flotilla_organization_desc:0 "Canhoneiras fluviais e vapores mercantes armados operam a partir de Baku e Enzeli, assegurando o domínio naval otomano nas águas do Mar Cáspio."
 TUR_caucasian_tribal_auxiliaries:0 "Auxiliares Tribais Montanheses do Cáucaso"
 TUR_caucasian_tribal_auxiliaries_desc:0 "Cavaleiros daguestaneses, chechenos e circassianos juntam-se à vanguarda imperial, aterrorizando retaguardas inimigas com audácia inigualável."
 TUR_transcaucasian_security_sphere:0 "Esfera de Segurança Transcaucasiana"
 TUR_transcaucasian_security_sphere_desc:0 "Tratados de amizade e cooperação com as repúblicas da Geórgia e Azerbaijão estabelecem uma barreira defensiva perpétua contra ambições russas."
 TUR_cevat_pasha_artillery_defence:0 "A Defesa de Artilharia de Cevat Paxá em 18 de Março"
 TUR_cevat_pasha_artillery_defence_desc:0 "Em 18 de março de 1915, Cevat Paxá coordena o fogo mortífero das baterias costeiras de Çanakkale, afundando encouraçados britânicos e franceses."
 TUR_chunuk_bair_counterattack:0 "O Contra-Ataque Heróico de Conkbayırı (Chunuk Bair)"
 TUR_chunuk_bair_counterattack_desc:0 "À frente do lendário 57º Regimento, o Tenente-Coronel Mustafa Kemal ordena: 'Não vos ordeno a atacar, ordeno-vos a morrer!' - salvando a península."
 TUR_fifth_army_mobile_reserves:0 "Reservas Móveis do 5º Exército de Galípoli"
 TUR_fifth_army_mobile_reserves_desc:0 "Sob a direção de Liman von Sanders, as divisões de reserva marcham em ritmo alucinante para selar cada cabeça de praia antes que os aliados avancem."
 TUR_drive_invaders_into_the_sea:0 "Lançar os Invasores ao Mar"
 TUR_drive_invaders_into_the_sea_desc:0 "Cargas incessantes de baioneta e bombardeios de trincheira forçam as forças da Commonwealth e francesas a evacuarem derrotadas de Galípoli."
 TUR_anafartalar_heroism_legacy:0 "O Legado Heróico do Comandante de Anafartalar"
 TUR_anafartalar_heroism_legacy_desc:0 "A liderança invencível de Mustafa Kemal nas colinas de Anafartalar consagra seu nome como o salvador de Constantinopla no coração de todo o povo."
 TUR_fortress_canakkale_permanent:0 "Çanakkale Inexpugnável: Baluarte Perpétuo"
 TUR_fortress_canakkale_permanent_desc:0 "O estreito torna-se um complexo defensivo mundialmente lendário: 'Çanakkale Geçilmez' (Çanakkale Não Se Ultrapassa), garantindo a capital para sempre."
 TUR_tigris_river_flotilla:0 "Flotilha Fluvial Armada do Rio Tigre"
 TUR_tigris_river_flotilla_desc:0 "Vapores armados com canhões de tiro rápido patrulham os meandros do Tigre e Eufrates, impedindo canhoneiras britânicas de apoiarem o avanço de infantaria."
 TUR_defense_of_kut_al_amara:0 "O Cerco Histórico de Kut-al-Amara"
 TUR_defense_of_kut_al_amara_desc:0 "O 6º Exército cerca completamente a 6ª Divisão Poona do General Townshend nas curvas lamacentas de Kut, repelindo três ofensivas britânicas de socorro."
 TUR_encirclement_of_townshend_army:0 "O Círculo de Ferro sobre o Exército de Townshend"
 TUR_encirclement_of_townshend_army_desc:0 "Trincheiras profundas e baterias de artilharia estrangulam as rações e munições dos britânicos sitiados, forçando a guarnição à inanição."
 TUR_halil_kut_triumph:0 "O Triunfo Imortal de Halil Paxá (Kut)"
 TUR_halil_kut_triumph_desc:0 "O General britânico Townshend e 13.000 soldados rendem-se incondicionalmente a Halil Paxá, marcando a maior capitulação da história militar britânica."
 TUR_secure_basra_access:0 "Ofensiva para Recuperação de Bassorá"
 TUR_secure_basra_access_desc:0 "As divisões vitoriosas do Iraque avançam para o sul ao longo das palmeiras do Eufrates para desalojar as guarnições coloniais do porto de Bassorá."
 TUR_shatt_al_arab_defensive_perimeter:0 "Perímetro Defensivo do Shatt al-Arab"
 TUR_shatt_al_arab_defensive_perimeter_desc:0 "Trincheiras nos pântanos e posições de artilharia protegem a confluência dos rios, assegurando que o Iraque permaneça inexpugnável sob a bandeira otomana."
 TUR_cross_the_sinai_desert:0 "A Travessia Heróica do Deserto do Sinai"
 TUR_cross_the_sinai_desert_desc:0 "Tropas sob Cemal Paxá marcham à noite pelas dunas tórridas do Sinai carregando pontões de ferro e artilharia para atacar de surpresa o Canal de Suez."
 TUR_suez_canal_raids:0 "Ataques de Pontão ao Canal de Suez"
 TUR_suez_canal_raids_desc:0 "Batalhões de pioneiros lançam botes no canal, cortando a navegação britânica e forçando o Império Britânico a reter centenas de milhares de tropas no Egito."
 TUR_gaza_beersheba_defensive_line:0 "A Linha Fortificada de Gaza-Berseba"
 TUR_gaza_beersheba_defensive_line_desc:0 "Sob o comando do Coronel Kress von Kressenstein, o exército repele duas violentas ofensivas britânicas nas colinas fortificadas de Gaza com perdas devastadoras."
 TUR_defense_of_jerusalem:0 "A Defesa Inabalável de Jerusalém"
 TUR_defense_of_jerusalem_desc:0 "As colinas da Judeia e os vales históricos são transformados em redutos inexpugnáveis, defendendo a Cidade Sagrada contra o avanço das forças imperiais aliadas."
 TUR_damascus_bastion:0 "O Bastião Central de Damasco"
 TUR_damascus_bastion_desc:0 "Damasco é reforçada como o quartel-general logístico supremo do Grupo de Exércitos Yıldırım, recebendo divisões frescas e munições de Constantinopla."
 TUR_levantine_supply_depots:0 "Rede de Depósitos de Suprimento do Levante"
 TUR_levantine_supply_depots_desc:0 "Armazéns em Homs, Aleppo e Rayak estocam fardos de trigo e caixas de cartuchos, garantindo que as frentes meridionais nunca fiquem desprovidas."
 TUR_protect_hejaz_railway_garrisons:0 "Proteção das Guarnições da Ferrovia do Hejaz"
 TUR_protect_hejaz_railway_garrisons_desc:0 "Fortins de pedra e patrulhas constantes ao longo de milhares de quilômetros de trilhos protegem os trens de peregrinos e comboios de munições no deserto."
 TUR_fakhri_pasha_medina_defense:0 "A Lendária Defesa de Medina por Fahreddin Paxá"
 TUR_fakhri_pasha_medina_defense_desc:0 "O 'Tigre do Deserto', Ömer Fahreddin Paxá, jura defender o Túmulo do Profeta até o fim, resistindo a anos de cerco absoluto alimentando seus homens até com gafanhotos."
 TUR_crush_or_reconcile_sharifians:0 "Pacificação e Reconciliação dos Clãs do Hejaz"
 TUR_crush_or_reconcile_sharifians_desc:0 "Combinando diplomacia generosa com demonstrações decisivas de força, a Sublime Porta neutraliza a revolta tribal fomentada por agentes britânicos."
 TUR_holy_relics_safeguard:0 "Salvaguarda das Sagradas Relíquias (Emanet-i Mukaddese)"
 TUR_holy_relics_safeguard_desc:0 "Sob escolta blindada de Fahreddin Paxá, os tesouros sagrados e manuscritos do Profeta são transportados em segurança de Medina ao Palácio de Topkapı."
 TUR_red_sea_desert_patrols:0 "Patrulhas Costeiras do Mar Vermelho"
 TUR_red_sea_desert_patrols_desc:0 "Guarnições costeiras em Yanbu e Jidda vigiam desembarques hostis e impedem que navios de patrulha britânicos cortem o contato com o interior."
 TUR_war_bread_and_rationing:0 "Pão de Guerra e Racionamento Nacional (Vesika)"
 TUR_war_bread_and_rationing_desc:0 "A introdução do sistema de cadernetas de racionamento e pão integral subsidiado assegura que nenhuma família de Constantinopla passe fome."
 TUR_requisition_imperial_resources:0 "Requisição Patriótica de Recursos de Guerra"
 TUR_requisition_imperial_resources_desc:0 "Carroças, cavalos, tecidos de lã e metais são mobilizados com indenização pelo Ministério da Guerra para equipar as divisões que partem para o combate."
 TUR_teskilat_asymmetric_warfare:0 "Guerra Assimétrica da Teşkilât-ı Mahsusa"
 TUR_teskilat_asymmetric_warfare_desc:0 "Agentes secretos e guerrilheiros infiltrados no Egito, Pérsia e Cáucaso sabotam oleodutos, explodem pontes ferroviárias e desviam exércitos coloniais."
 TUR_counter_the_blockade:0 "Rompimento do Bloqueio Naval Inimigo"
 TUR_counter_the_blockade_desc:0 "Rotas de cabotagem costeira protegidas por baterias terrestres e chalupas camufladas mantêm o fluxo de alimentos e minérios entre a Anatólia e a capital."
 TUR_total_war_labour_mobilization:0 "Batalhões de Trabalho (Amele Taburları)"
 TUR_total_war_labour_mobilization_desc:0 "Centenas de milhares de trabalhadores são organizados em batalhões civis de construção para abrir estradas, cavar trincheiras e estender linhas férreas."
 TUR_emergency_war_levies:0 "Levas de Emergência Nacional"
 TUR_emergency_war_levies_desc:0 "Reservistas veteranos e novas classes de conscritos são integrados aos quadros divisionários, recompondo instantaneamente regimentos desgastados em batalha."
 TUR_the_eastern_storm_survived:0 "A Tempestade Oriental Superada"
 TUR_the_eastern_storm_survived_desc:0 "Com a queda do Império Russo e o recuo dos exércitos invasores, o Império Otomano emerge como potência vitoriosa em suas fronteiras orientais."
 TUR_brest_litovsk_claims:0 "Reivindicações Territoriais de Brest-Litovsk"
 TUR_brest_litovsk_claims_desc:0 "A delegação otomana em Brest-Litovsk garante a restituição irrevogável de todos os territórios anatolienses e estabelece sua tutela sobre o Cáucaso meridional."
 TUR_middle_eastern_hegemon:0 "Hegemonia Incontestada do Oriente Médio"
 TUR_middle_eastern_hegemon_desc:0 "Do Golfo Pérsico ao Canal de Suez e do Danúbio ao Mar Cáspio, a Sublime Porta estabelece-se como o poder central inquestionável do Oriente."
 TUR_1918_total_victory_protocol:0 "Protocolo da Vitória Total de 1918"
 TUR_1918_total_victory_protocol_desc:0 "O plano de partilha do Império Otomano é rasgado nos campos de batalha. O Estado imperial celebra sua sobrevivência triunfante e projeta o futuro."
 TUR_reborn_empire_destiny:0 "Destino: O Império Otomano Renascido"
 TUR_reborn_empire_destiny_desc:0 "Sob uma monarquia constitucional revigorada e um parlamento representativo, o império moderniza sua indústria e lidera o mundo islâmico ao progresso."
 TUR_republican_renaissance_destiny:0 "Destino: Renascença Republicana Kemalitsa"
 TUR_republican_renaissance_destiny_desc:0 "Guiada pelos oficiais patriotas liderados por Mustafa Kemal, a nação abraça o secularismo radical, soberania popular e modernização científica irrestrita."
 TUR_eternal_sublime_destiny:0 "Destino: O Eterno Estado Sublime e Califado"
 TUR_eternal_sublime_destiny_desc:0 "O trono dos Osmanli e o Califado erguem-se como o farol espiritual e político de quinhentos milhões de fiéis, assegurando séculos de glória futura."
 TUR_macedonian_and_thracian_veterans:0 "Veteranos da Macedônia e Trácia"
 TUR_macedonian_and_thracian_veterans_desc:0 "Oficiais e veteranos que lutaram em guerrilhas balcânicas são integrados às divisões regulares de infantaria, compartilhando valiosas lições de combate."
 TUR_constantinople_press_syndicate:0 "Sindicato de Imprensa de Constantinopla"
 TUR_constantinople_press_syndicate_desc:0 "A regulamentação profissional dos jornalistas e tipógrafos assegura que a capital permaneça vigilante e livre de pânico gerado por rumores hostis."
 TUR_al_fatat_secret_dialogue:0 "Negociações Secretas com Al-Fatat"
 TUR_al_fatat_secret_dialogue_desc:0 "Emissários de Constantinopla encontram em segredo os líderes da sociedade jovem árabe em Damasco, oferecendo autonomia substancial para neutralizar a revolta."
 TUR_arab_notables_chamber:0 "Câmara Consultiva Árabe do Levante"
 TUR_arab_notables_chamber_desc:0 "As grandes famílias de Jerusalém, Beirute e Nablus coordenam o abastecimento civil e a ordem interna em cooperação direta com os comandantes imperiais."
 TUR_pontic_coal_shipping:0 "Frota Carbonífera do Mar Negro"
 TUR_pontic_coal_shipping_desc:0 "Pequenos vapores e chalupas costeiras transportam o carvão de Zonguldak diretamente às forjas de Constantinopla sob escolta de torpedeiras."
 TUR_cilicia_irrigation_canals:0 "Canais de Irrigação de Çukurova"
 TUR_cilicia_irrigation_canals_desc:0 "Sistemas de comportas no Rio Seyhan transformam a planície cilícia no maior polo produtor de fardamento e rações de todo o Mediterrâneo."
 TUR_aleppo_commercial_hub:0 "Entreposto Comercial de Aleppo"
 TUR_aleppo_commercial_hub_desc:0 "O histórico bazar de Aleppo floresce como o principal centro logístico de distribuição mercantil e militar entre a Síria e o Iraque."
 TUR_syrian_grain_storage:0 "Armazéns Centrais de Cereais da Síria"
 TUR_syrian_grain_storage_desc:0 "Depósitos fortificados em Hama e Hauran acumulam trigo dourado para sustentar as guarnições das frentes meridionais e ocidentais."
 TUR_izmir_naval_seaplane_base:0 "Base de Hidroaviões Navais de Esmirna"
 TUR_izmir_naval_seaplane_base_desc:0 "Instalações costeiras no Golfo de Esmirna operam hidroaviões de patrulha para monitorar a frota aliada no Mar Egeu e proteger portos mercantes vitais."
 TUR_marmara_anti_submarine_nets:0 "Redes Anti-Submarinas do Mar de Mármara"
 TUR_marmara_anti_submarine_nets_desc:0 "Obstáculos de cabos de aço e campos de minas ancoradas nas entradas do estreito impedem a infiltração de submarinos britânicos e franceses no mar interior."
 TUR_cavalry_reconnaissance_squadrons:0 "Esquadrões de Reconhecimento da Cavalaria Ligeira"
 TUR_cavalry_reconnaissance_squadrons_desc:0 "Cavaleiros ligeiros anatólios e circassianos executam missões de rastreamento, fustigando linhas de comunicação inimigas e garantindo inteligência tática rápida."
 TUR_harbiye_cadet_battalions:0 "Batalhões de Cadetes da Harbiye em Campanha"
 TUR_harbiye_cadet_battalions_desc:0 "Os brilhantes jovens cadetes voluntariam-se para o front como oficiais subalternos, infundindo cada companhia de trincheira com liderança corajosa e culta."
 TUR_rome_mediterranean_dialogue:0 "Diálogo Mediterrâneo com Roma"
 TUR_rome_mediterranean_dialogue_desc:0 "Negociações secretas com diplomatas italianos buscam desanuviar rivalidades no Mar Egeu e acordar esferas de comércio na Líbia."
 TUR_paris_credit_negotiations:0 "Negociações Financeiras em Paris"
 TUR_paris_credit_negotiations_desc:0 "Banqueiros franceses e representantes da Sublime Porta discutem a renegociação amigável de empréstimos ferroviários e industriais."
 TUR_persian_border_security:0 "Segurança da Fronteira com a Pérsia Qajar"
 TUR_persian_border_security_desc:0 "Acordo com o governo de Teerã e guarnições nos montes Zagros impedem a infiltração de tropas czaristas pelas montanhas orientais."
 TUR_cyrenaica_desert_posts:0 "Postos Avançados no Deserto da Cirenaica"
 TUR_cyrenaica_desert_posts_desc:0 "Guarnições camufladas em oásis profundos sustentam as rotas de abastecimento de armas para os resistentes líbios."
 TUR_erzurum_fortress_line:0 "Linha Fortificada de Fortes de Erzurum"
 TUR_erzurum_fortress_line_desc:0 "Os fortes de Aziziye e Mecidiye no planalto de Erzurum barram as estradas de montanha com canhões pesados, impedindo qualquer penetração czarista."
 TUR_trench_warfare_drills_canakkale:0 "Táticas de Trincheira e Combate em Çanakkale"
 TUR_trench_warfare_drills_canakkale_desc:0 "Escavação de trincheiras a apenas dez metros do inimigo e ataques de granadas manuais forjam o Mehmetçik como o mais temível combatente de trincheiras."
 TUR_ctesiphon_defensive_stand:0 "A Batalha Histórica de Ctesifonte (Selman-ı Pak)"
 TUR_ctesiphon_defensive_stand_desc:0 "Ao sopé do lendário Arco de Ctesifonte, o Coronel Nureddin Bey desfecha um contragolpe fulminante, detendo Townshend às portas de Bagdá."
 TUR_hejaz_armored_train_patrols:0 "Trens Blindados de Patrulha do Hejaz"
 TUR_hejaz_armored_train_patrols_desc:0 "Vagões ferroviários reforçados com chapas de aço e armados com metralhadoras e canhões leves percorrem o deserto, dispersando guerrilhas nas vias."
 TUR_ww1_sharif_delay_tt:0 "Subornos temporários acalmam os anciãos tribais, mas o fracasso em resolver as queixas nacionalistas provocará uma rebelião incontrolável."
