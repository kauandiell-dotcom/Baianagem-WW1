l_braz_por:
 # =========================================================================
 # LOCALIZAÇÃO DA ÁRVORE DE FOCO DO IMPÉRIO ALEMÃO (PORTUGUÊS DO BRASIL)
 # =========================================================================

 # Fase I (1911-1914) - Belle Époque & Corrida Armamentista
 GER_agadir_crisis_gambit: "O Salto da Pantera em Agadir"
 GER_agadir_crisis_gambit_desc: "Em resposta à expansão colonial francesa no Marrocos, enviamos a canhoneira SMS Panther ao porto de Agadir para assegurar o nosso lugar ao sol e exigir compensações territoriais."
 GER_tirpitz_fourth_naval_bill: "Quarta Lei Naval de Tirpitz"
 GER_tirpitz_fourth_naval_bill_desc: "O Grande Almirante von Tirpitz apresenta a nova emenda naval. A Frota de Alto-Mar deve rivalizar com a Royal Navy em encouraçados modernos para garantir o comércio além-mar."
 GER_berlin_baghdad_railway: "Ferrovia Berlim-Bagdá"
 GER_berlin_baghdad_railway_desc: "A construção da colossal malha ferroviária através da Anatólia e Mesopotâmia consolida a aliança com a Sublime Porta e assegura acesso terrestre ao petróleo do Oriente Médio."
 GER_army_bill_1912: "Lei Militar Prussiana de 1912"
 GER_army_bill_1912_desc: "Diante da ameaça da aliança franco-russa, o Reichstag autoriza a formação de dois novos corpos de exército, incorporando 80.000 soldados veteranos às fileiras imperiais."
 GER_centenary_of_leipzig_1913: "Centenário da Batalha de Leipzig"
 GER_centenary_of_leipzig_1913_desc: "A celebração de cem anos da Batalha das Nações em Leipzig inflama a alma do povo germânico, unindo a nação e forjando a união patriótica da Burgfrieden."
 GER_expand_heavy_howitzers: "Expandir Obuses Pesados Krupp"
 GER_expand_heavy_howitzers_desc: "A Krupp de Essen deve acelerar a fundição dos colossais morteiros de 420mm — a Berta Gorda — desenhados para esmigalhar fortalezas de concreto armado na Europa."
 GER_the_blank_cheque: "O Cheque em Branco a Viena"
 GER_the_blank_cheque_desc: "Após o atentado de Sarajevo, o Kaiser Wilhelm II garante ao Imperador Franz Joseph apoio militar incondicional e ilimitado contra qualquer agressão sérvia ou russa."

 # Fase II (1914-1917) - Escolha Operacional & Guerra Total
 GER_execute_schlieffen_plan: "Executar o Plano Schlieffen"
 GER_execute_schlieffen_plan_desc: "A ala direita do exército imperial avançará em manobra envolvente através da Bélgica e Luxemburgo para cercar Paris e forçar a rendição francesa em quarenta dias."
 GER_smash_liege_forts: "Esmagar os Fortes de Liège"
 GER_smash_liege_forts_desc: "Empregando a artilharia pesada de 420mm, o General Erich Ludendorff comanda o assalto frontal às fortalezas belgas, escancarando a rota para o interior da França."
 GER_the_miracle_of_tannenberg: "O Triunfo de Tannenberg"
 GER_the_miracle_of_tannenberg_desc: "Sob a liderança de von Hindenburg e Ludendorff, o Oitavo Exército cerca e destrói o Segundo Exército Russo nos lagos da Prússia Oriental, salvando o solo da Pátria."
 GER_aufmarsch_ost_focus: "Aufmarsch II Ost (Ofensiva no Leste)"
 GER_aufmarsch_ost_focus_desc: "Respeitando a neutralidade belga para manter a Grã-Bretanha fora da guerra, entrincheiramos a fronteira do Reno e concentramos nossas forças para esmagar a Rússia czarista."
 GER_haber_bosch_nitrogen_miracle: "O Milagre Químico de Haber-Bosch"
 GER_haber_bosch_nitrogen_miracle_desc: "Fritz Haber aperfeiçoou a síntese industrial da amônia atmosférica. Essa façanha científica nos provê nitratos infinitos para pólvora, anulando o bloqueio naval inimigo."
 GER_chemical_warfare_initiative: "Iniciativa de Guerra Química"
 GER_chemical_warfare_initiative_desc: "Liberar cilindros de cloro e gás mostarda sobre as linhas de trincheira inimigas em Ypres. Na guerra industrial moderna, a química dita a vitória."
 GER_hindenburg_program: "O Programa Hindenburg"
 GER_hindenburg_program_desc: "O Comando Supremo assume o controle de toda a economia e mão de obra nacional. Fábricas, ferrovias e minas são convertidas na engrenagem suprema da Guerra Total."
 GER_stosstruppen_tactics: "Táticas de Infiltração Stosstruppen"
 GER_stosstruppen_tactics_desc: "Abandonando ondas maciças de infantaria, formamos pelotões autônomos de choque armados com metralhadoras leves e lança-chamas para degolar postos de comando inimigos."

 # Fase III - Ditadura Militar da OHL
 GER_silent_dictatorship_ohl: "A Ditadura Silenciosa da OHL"
 GER_silent_dictatorship_ohl_desc: "Com o Kaiser reduzido a figura decorativa, Hindenburg e Ludendorff assumem a condução suprema de toda a política, economia e exército do Império Alemão."
 GER_unrestricted_submarine_warfare: "Guerra Submarina Irrestrita"
 GER_unrestricted_submarine_warfare_desc: "Nossos submarinos recebem ordens para torpedear qualquer embarcação mercante navegando rumo às Ilhas Britânicas, estrangulando o império britânico pela fome."
 GER_sealed_train_to_petrograd: "O Vagão Selado para Petrogrado"
 GER_sealed_train_to_petrograd_desc: "Autorizamos a passagem de Vladimir Lenin através do território alemão em um vagão blindado para incitar a revolução bolchevique e retirar a Rússia da guerra."
 GER_treaty_of_brest_litovsk: "O Tratado de Brest-Litovsk"
 GER_treaty_of_brest_litovsk_desc: "Impomos os termos de paz à Rússia Soviética. O império czarista renuncia à Polônia, Báltico, Bielorrússia e Ucrânia, suprindo a Alemanha com cereais e minerais vitais."
 GER_the_kaiserschlacht_1918: "A Grande Ofensiva Kaiserschlacht"
 GER_the_kaiserschlacht_1918_desc: "Dezenas de divisões veteranas transferidas do front oriental se unem aos grupos de assalto para a ofensiva final na França antes da chegada em massa dos americanos."

 # Fase III - Volkskaiserreich (Monarquia Parlamentar)
 GER_bethmann_civilian_supremacy: "Supremacia Civil da Chancelaria"
 GER_bethmann_civilian_supremacy_desc: "O Chanceler von Bethmann-Hollweg reafirma o controle do poder civil sobre os generais, impedindo aventuras militares desastrosas e garantindo o Estado de Direito."
 GER_prussian_franchise_reform: "Reforma do Voto Prussiano"
 GER_prussian_franchise_reform_desc: "Abolimos o sistema de classes eleitorais na Prússia. O voto secreto, direto e igualitário traz a classe trabalhadora social-democrata para o coração do governo."
 GER_reichstag_peace_resolution: "Resolução de Paz do Reichstag"
 GER_reichstag_peace_resolution_desc: "O parlamento alemão aprova a declaração formal de busca por uma paz de entendimento mútuo entre as nações, sem anexações territoriais forçadas."
 GER_constitutional_monarchy_proclamation: "Proclamação da Monarquia Constitucional"
 GER_constitutional_monarchy_proclamation_desc: "O Império Alemão se transforma em uma monarquia parlamentar moderna aos moldes britânicos, salvando a coroa e unindo a sociedade para o pós-guerra."

 # Fase III - Deutsche Vaterlandspartei (Radical)
 GER_found_vaterlandspartei: "Fundação do Partido da Pátria Alemã"
 GER_found_vaterlandspartei_desc: "Tirpitz e Wolfgang Kapp estabelecem a Vaterlandspartei para lutar pela guerra total irrestrita, sufocamento da oposição pacifista e anexações maciças na Europa."
 GER_total_war_mobilization: "Mobilização de Trabalho Total"
 GER_total_war_mobilization_desc: "Convocação compulsória de homens e mulheres entre 15 e 60 anos para a indústria bélica. Todo o esforço da sociedade pertence à vitória do Reich."
 GER_annexation_of_belgium_and_briey: "Anexação da Bélgica e Briey"
 GER_annexation_of_belgium_and_briey_desc: "Declaramos a anexação permanente do território belga e da bacia mineradora francesa de Briey-Longwy, cravando a hegemonia alemã no continente."
 GER_morphed_mitteleuropa_iron_rule: "Mitteleuropa sob Tacão de Ferro"
 GER_morphed_mitteleuropa_iron_rule_desc: "Consolidamos todas as nações da Europa Central e Oriental sob a liderança férrea de Berlim, erguendo um bloco hegemônico inexpugnável."

 # Rotas Especiais & Easter Eggs
 GER_willy_nicky_telegrams_bjorko: "Telegramas Willy-Nicky: Björkö 2.0"
 GER_willy_nicky_telegrams_bjorko_desc: "O Kaiser Wilhelm contata diretamente o Czar Nicolau II para ressuscitar a aliança secreta de Björkö, unindo Alemanha e Rússia contra as potências ocidentais."
 GER_hajj_wilhelm_pan_islamic_crusade: "Hajj Wilhelm: Cruzada Pan-Islâmica"
 GER_hajj_wilhelm_pan_islamic_crusade_desc: "Adotando a estratégia do Barão von Oppenheim, proclamamos a Guerra Santa Islâmica nas colônias britânicas e russas, atraindo voluntários dervixes para o nosso exército."
 GER_spartakusbund_proletarian_revolt: "A Revolta Proletária Espartaquista"
 GER_spartakusbund_proletarian_revolt_desc: "Diante do flagelo da guerra imperialista, Rosa Luxemburg e Karl Liebknecht lideram os operários e marinheiros em armas para proclamar a República Socialista da Alemanha."
 GER_emergency_danubian_annexation: "Anexação Danubiana de Emergência"
 GER_emergency_danubian_annexation_desc: "Com o colapso militar de Viena na Galícia, tropas alemãs assumem a Áustria e realizam a unificação dos povos germânicos no coração da Europa."

