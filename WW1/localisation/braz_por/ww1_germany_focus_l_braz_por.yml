 GER_pan_islamic_jihad_spirit: "Apoio à Jihad Pan-Islâmica"
 GER_constitutional_monarchy_spirit: "Constitucionalismo Parlamentar"

 # Títulos e Descrições de Eventos
 ww1_germany_events.1.t: "A Crise de Agadir"
 ww1_germany_events.1.d: "A chegada da SMS Panther à costa marroquina provocou uma tempestade diplomática internacional entre Alemanha, França e Grã-Bretanha."
 ww1_germany_events.1.a: "Exigir compensação territorial no Congo"
 ww1_germany_events.1.b: "Manter postura firme pela soberania marroquina"
 ww1_germany_events.2.t: "O Envio do Cheque em Branco"
 ww1_germany_events.2.d: "Berlim declarou formalmente apoio incondicional a Viena na confrontação com a Sérvia."
 ww1_germany_events.2.a: "Marchamos lado a lado com Viena"
 ww1_germany_events.3.t: "Ordem de Invasão da Bélgica"
 ww1_germany_events.3.d: "Os exércitos alemães cruzam a fronteira belga em direção a Paris, forçando a entrada da Grã-Bretanha na guerra."
 ww1_germany_events.3.a: "A necessidade não conhece leis!"
 ww1_germany_events.4.t: "Início da Aufmarsch II Ost"
 ww1_germany_events.4.d: "A Alemanha mantém guarnições defensivas na fronteira francesa enquanto concentra forças massivas para destruir a Rússia czarista."
 ww1_germany_events.4.a: "O Leste é o nosso destino"
 ww1_germany_events.5.t: "A Queda de Liège"
 ww1_germany_events.5.d: "Os obuses pesados de cerco Krupp demoliram os anéis de fortificação de Liège."
 ww1_germany_events.5.a: "Os portões do ocidente estão abertos"
 ww1_germany_events.6.t: "A Glória de Tannenberg"
 ww1_germany_events.6.d: "O Segundo Exército Russo foi aniquilado na Prússia Oriental, imortalizando Hindenburg e Ludendorff como heróis nacionais."
 ww1_germany_events.6.a: "Uma vitória lendária"
 ww1_germany_events.7.t: "O Ataque com Gás Venenoso"
 ww1_germany_events.7.d: "Nuvens mortíferas de cloro e mostarda varrem as trincheiras inimigas, inaugurando a era química da guerra."
 ww1_germany_events.7.a: "Que o inimigo trema perante o aço e a ciência"
 ww1_germany_events.8.t: "Início da Guerra Submarina Irrestrita"
 ww1_germany_events.8.d: "Os submarinos U-Boot receberam ordens de atacar sem aviso qualquer navio mercante abastecendo as ilhas britânicas."
 ww1_germany_events.8.a: "Cortar a artéria vital da Grã-Bretanha"
 ww1_germany_events.9.t: "A Partida de Lenin para Petrogrado"
 ww1_germany_events.9.d: "O vagão selado transportando Vladimir Lenin cruzou a fronteira em direção a Petrogrado para insuflar a revolta revolucionária."
 ww1_germany_events.9.a: "Plantando as sementes da revolução bolchevique"
 ww1_germany_events.10.t: "Assinatura do Tratado de Brest-Litovsk"
 ww1_germany_events.10.d: "A Rússia Soviética aceitou os termos alemães e abriu mão de imensas províncias no leste europeu."
 ww1_germany_events.10.a: "O front oriental foi vencido"
 ww1_germany_events.11.t: "O Reichstag Aprova a Resolução de Paz"
 ww1_germany_events.11.d: "A maioria parlamentar votou a favor de uma paz negociada sem anexações ou reparações forçadas."
 ww1_germany_events.11.a: "Um passo rumo à reconciliação europeia"
 ww1_germany_events.12.t: "A Proclamação Espartaquista"
 ww1_germany_events.12.d: "Operários armados e marinheiros sublevados proclamaram a República Socialista Livre da Alemanha!"
 ww1_germany_events.12.a: "Todo poder aos conselhos operários!"
 ww1_germany_events.13.t: "O Renascimento do Tratado de Björkö"
 ww1_germany_events.13.d: "Em um feito diplomático estarrecedor, o Kaiser e o Czar firmam aliança eterna contra as potências liberais ocidentais."
 ww1_germany_events.13.a: "A autocracia prevalecerá sobre o mundo"
 ww1_germany_events.14.t: "A Guerra Santa do Kaiser"
 ww1_germany_events.14.d: "O Estandarte Verde do Islã é erguido ao lado da Águia Hohenzollern em uma revolta pan-islâmica contra os britânicos."
 ww1_germany_events.14.a: "Allahu Akbar e Gott mit uns!"
 ww1_germany_events.15.t: "A União da Grande Alemanha (Großdeutschland)"
 ww1_germany_events.15.d: "Tropas alemãs entraram em Viena para resgatar as províncias austríacas, unindo todos os povos germânicos sob uma só coroa."
 ww1_germany_events.15.a: "O sonho da Grande Alemanha se realizou!"
