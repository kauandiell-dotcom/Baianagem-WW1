l_braz_por:
 # =========================================================================
 # LOCALIZAÇÃO DA ÁRVORE DE FOCO DO IMPÉRIO ALEMÃO (PORTUGUÊS DO BRASIL)
 # =========================================================================

 # Fase I (1911-1914) - Belle Époque & Corrida Armamentista
 GER_agadir_crisis_gambit: "O Salto da Pantera em Agadir"
 GER_agadir_crisis_gambit_desc: "Em resposta à expansão colonial francesa no Marrocos, enviamos a canhoneira SMS Panther ao porto de Agadir para assegurar o nosso lugar ao sol e exigir compensações territoriais."
 GER_tirpitz_fourth_naval_bill: "Quarta Lei Naval de Tirpitz"
 GER_tirpitz_fourth_naval_bill_desc: "O Grande Almirante von Tirpitz apresenta a nova emenda naval. A Frota de Alto-Mar deve rivalizar com a Royal Navy em encouraçados modernos para garantir o comércio além-mar."
 GER_berlin_baghdad_railway: "Ferrovia Berlim-Bagdá"
 GER_berlin_baghdad_railway_desc: "A construção da colossal malha ferroviária através da Anatólia e Mesopotâmia consolida a aliança com a Sublime Porta e assegura acesso terrestre ao petróleo do Oriente Médio."
 GER_army_bill_1912: "Lei Militar Prussiana de 1912"
 GER_army_bill_1912_desc: "Diante da ameaça da aliança franco-russa, o Reichstag autoriza a formação de dois novos corpos de exército, incorporando 80.000 soldados veteranos às fileiras imperiais."
 GER_centenary_of_leipzig_1913: "Centenário da Batalha de Leipzig"
 GER_centenary_of_leipzig_1913_desc: "A celebração de cem anos da Batalha das Nações em Leipzig inflama a alma do povo germânico, unindo a nação e forjando a união patriótica da Burgfrieden."
 GER_expand_heavy_howitzers: "Expandir Obuses Pesados Krupp"
 GER_expand_heavy_howitzers_desc: "A Krupp de Essen deve acelerar a fundição dos colossais morteiros de 420mm — a Berta Gorda — desenhados para esmigalhar fortalezas de concreto armado na Europa."
 GER_the_blank_cheque: "O Cheque em Branco a Viena"
 GER_the_blank_cheque_desc: "Após o atentado de Sarajevo, o Kaiser Wilhelm II garante ao Imperador Franz Joseph apoio militar incondicional e ilimitado contra qualquer agressão sérvia ou russa."

 # Fase II (1914-1917) - Escolha Operacional & Guerra Total
 GER_execute_schlieffen_plan: "[Histórico] Executar o Plano Schlieffen"
 GER_execute_schlieffen_plan_desc: "A ala direita do exército imperial avançará em manobra envolvente através da Bélgica e Luxemburgo para cercar Paris e forçar a rendição francesa em quarenta dias."
 GER_smash_liege_forts: "Esmagar os Fortes de Liège"
 GER_smash_liege_forts_desc: "Empregando a artilharia pesada de 420mm, o General Erich Ludendorff comanda o assalto frontal às fortalezas belgas, escancarando a rota para o interior da França."
 GER_the_miracle_of_tannenberg: "O Triunfo de Tannenberg"
 GER_the_miracle_of_tannenberg_desc: "Sob a liderança de von Hindenburg e Ludendorff, o Oitavo Exército cerca e destrói o Segundo Exército Russo nos lagos da Prússia Oriental, salvando o solo da Pátria."
 GER_aufmarsch_ost_focus: "[Alternativo] Aufmarsch II Ost (Ofensiva no Leste)"
 GER_aufmarsch_ost_focus_desc: "Respeitando a neutralidade belga para manter a Grã-Bretanha fora da guerra, entrincheiramos a fronteira do Reno e concentramos nossas forças para esmagar a Rússia czarista."
 GER_haber_bosch_nitrogen_miracle: "O Milagre Químico de Haber-Bosch"
 GER_haber_bosch_nitrogen_miracle_desc: "Fritz Haber aperfeiçoou a síntese industrial da amônia atmosférica. Essa façanha científica nos provê nitratos infinitos para pólvora, anulando o bloqueio naval inimigo."
 GER_chemical_warfare_initiative: "Iniciativa de Guerra Química"
 GER_chemical_warfare_initiative_desc: "Liberar cilindros de cloro e gás mostarda sobre as linhas de trincheira inimigas em Ypres. Na guerra industrial moderna, a química dita a vitória."
 GER_hindenburg_program: "O Programa Hindenburg"
 GER_hindenburg_program_desc: "O Comando Supremo assume o controle de toda a economia e mão de obra nacional. Fábricas, ferrovias e minas são convertidas na engrenagem suprema da Guerra Total."
 GER_stosstruppen_tactics: "Táticas de Infiltração Stosstruppen"
 GER_stosstruppen_tactics_desc: "Abandonando ondas maciças de infantaria, formamos pelotões autônomos de choque armados com metralhadoras leves e lança-chamas para degolar postos de comando inimigos."

 # Fase III - Ditadura Militar da OHL
 GER_silent_dictatorship_ohl: "[Histórico] A Ditadura Silenciosa da OHL"
 GER_silent_dictatorship_ohl_desc: "Com o Kaiser reduzido a figura decorativa, Hindenburg e Ludendorff assumem a condução suprema de toda a política, economia e exército do Império Alemão."
 GER_unrestricted_submarine_warfare: "Guerra Submarina Irrestrita"
 GER_unrestricted_submarine_warfare_desc: "Nossos submarinos recebem ordens para torpedear qualquer embarcação mercante navegando rumo às Ilhas Britânicas, estrangulando o império britânico pela fome."
 GER_sealed_train_to_petrograd: "O Vagão Selado para Petrogrado"
 GER_sealed_train_to_petrograd_desc: "Autorizamos a passagem de Vladimir Lenin através do território alemão em um vagão blindado para incitar a revolução bolchevique e retirar a Rússia da guerra."
 GER_treaty_of_brest_litovsk: "O Tratado de Brest-Litovsk"
 GER_treaty_of_brest_litovsk_desc: "Impomos os termos de paz à Rússia Soviética. O império czarista renuncia à Polônia, Báltico, Bielorrússia e Ucrânia, suprindo a Alemanha com cereais e minerais vitais."
 GER_the_kaiserschlacht_1918: "A Grande Ofensiva Kaiserschlacht"
 GER_the_kaiserschlacht_1918_desc: "Dezenas de divisões veteranas transferidas do front oriental se unem aos grupos de assalto para a ofensiva final na França antes da chegada em massa dos americanos."

 # Fase III - Volkskaiserreich (Monarquia Parlamentar)
 GER_bethmann_civilian_supremacy: "[Alternativo - Democrático] Supremacia Civil da Chancelaria"
 GER_bethmann_civilian_supremacy_desc: "O Chanceler von Bethmann-Hollweg reafirma o controle do poder civil sobre os generais, impedindo aventuras militares desastrosas e garantindo o Estado de Direito."
 GER_prussian_franchise_reform: "Reforma do Voto Prussiano"
 GER_prussian_franchise_reform_desc: "Abolimos o sistema de classes eleitorais na Prússia. O voto secreto, direto e igualitário traz a classe trabalhadora social-democrata para o coração do governo."
 GER_reichstag_peace_resolution: "Resolução de Paz do Reichstag"
 GER_reichstag_peace_resolution_desc: "O parlamento alemão aprova a declaração formal de busca por uma paz de entendimento mútuo entre as nações, sem anexações territoriais forçadas."
 GER_constitutional_monarchy_proclamation: "Proclamação da Monarquia Constitucional"
 GER_constitutional_monarchy_proclamation_desc: "O Império Alemão se transforma em uma monarquia parlamentar moderna aos moldes britânicos, salvando a coroa e unindo a sociedade para o pós-guerra."

 # Fase III - Deutsche Vaterlandspartei (Radical)
 GER_found_vaterlandspartei: "[Alternativo - Nacionalista] Fundação do Partido da Pátria Alemã"
 GER_found_vaterlandspartei_desc: "Tirpitz e Wolfgang Kapp estabelecem a Vaterlandspartei para lutar pela guerra total irrestrita, sufocamento da oposição pacifista e anexações maciças na Europa."
 GER_total_war_mobilization: "Mobilização de Trabalho Total"
 GER_total_war_mobilization_desc: "Convocação compulsória de homens e mulheres entre 15 e 60 anos para a indústria bélica. Todo o esforço da sociedade pertence à vitória do Reich."
 GER_annexation_of_belgium_and_briey: "Anexação da Bélgica e Briey"
 GER_annexation_of_belgium_and_briey_desc: "Declaramos a anexação permanente do território belga e da bacia mineradora francesa de Briey-Longwy, cravando a hegemonia alemã no continente."
 GER_morphed_mitteleuropa_iron_rule: "Mitteleuropa sob Tacão de Ferro"
 GER_morphed_mitteleuropa_iron_rule_desc: "Consolidamos todas as nações da Europa Central e Oriental sob a liderança férrea de Berlim, erguendo um bloco hegemônico inexpugnável."

 # Rotas Especiais & Easter Eggs
 GER_willy_nicky_telegrams_bjorko: "[Alternativo - Diplomacia] Telegramas Willy-Nicky: Björkö 2.0"
 GER_willy_nicky_telegrams_bjorko_desc: "O Kaiser Wilhelm contata diretamente o Czar Nicolau II para ressuscitar a aliança secreta de Björkö, unindo Alemanha e Rússia contra as potências ocidentais."
 GER_hajj_wilhelm_pan_islamic_crusade: "Hajj Wilhelm: Cruzada Pan-Islâmica"
 GER_hajj_wilhelm_pan_islamic_crusade_desc: "Adotando a estratégia do Barão von Oppenheim, proclamamos a Guerra Santa Islâmica nas colônias britânicas e russas, atraindo voluntários dervixes para o nosso exército."
 GER_spartakusbund_proletarian_revolt: "[Alternativo - Socialista] A Revolta Proletária Espartaquista"
 GER_spartakusbund_proletarian_revolt_desc: "Diante do flagelo da guerra imperialista, Rosa Luxemburg e Karl Liebknecht lideram os operários e marinheiros em armas para proclamar a República Socialista da Alemanha."
 GER_emergency_danubian_annexation: "Anexação Danubiana de Emergência"
 GER_emergency_danubian_annexation_desc: "Com o colapso militar de Viena na Galícia, tropas alemãs assumem a Áustria e realizam a unificação dos povos germânicos no coração da Europa."

 # Modificadores Nacionais
 GER_silent_dictatorship_ohl: "Ditadura Militar da OHL"
 GER_ohl_supreme_command: "Comando Supremo da OHL"
 GER_schlieffen_momentum: "Ímpeto do Plano Schlieffen"
 GER_civilian_general_staff: "Estado-Maior Subordinado ao Poder Civil"
 GER_unrestricted_submarine_warfare_spirit: "Campanha Submarina Irrestrita"
 GER_vaterlandspartei_rule: "Governo da Vaterlandspartei"
 GER_total_war_labor_conscription: "Conscrição Laboral de Guerra Total"
 GER_belgian_briey_exploitation: "Exploração Industrial da Bélgica e Briey"
 GER_pan_islamic_jihad_spirit: "Apoio à Jihad Pan-Islâmica"
 GER_constitutional_monarchy_spirit: "Constitucionalismo Parlamentar"

 # Títulos e Descrições de Eventos
 ww1_germany_events.1.t: "A Crise de Agadir"
 ww1_germany_events.1.d: "A chegada da SMS Panther à costa marroquina provocou uma tempestade diplomática internacional entre Alemanha, França e Grã-Bretanha."
 ww1_germany_events.1.a: "Exigir compensação territorial no Congo"
 ww1_germany_events.1.b: "Manter postura firme pela soberania marroquina"
 ww1_germany_events.2.t: "O Envio do Cheque em Branco"
 ww1_germany_events.2.d: "Berlim declarou formalmente apoio incondicional a Viena na confrontação com a Sérvia."
 ww1_germany_events.2.a: "Marchamos lado a lado com Viena"
 ww1_germany_events.3.t: "Ordem de Invasão da Bélgica"
 ww1_germany_events.3.d: "Os exércitos alemães cruzam a fronteira belga em direção a Paris, forçando a entrada da Grã-Bretanha na guerra."
 ww1_germany_events.3.a: "A necessidade não conhece leis!"
 ww1_germany_events.4.t: "Início da Aufmarsch II Ost"
 ww1_germany_events.4.d: "A Alemanha mantém guarnições defensivas na fronteira francesa enquanto concentra forças massivas para destruir a Rússia czarista."
 ww1_germany_events.4.a: "O Leste é o nosso destino"
 ww1_germany_events.5.t: "A Queda de Liège"
 ww1_germany_events.5.d: "Os obuses pesados de cerco Krupp demoliram os anéis de fortificação de Liège."
 ww1_germany_events.5.a: "Os portões do ocidente estão abertos"
 ww1_germany_events.6.t: "A Glória de Tannenberg"
 ww1_germany_events.6.d: "O Segundo Exército Russo foi aniquilado na Prússia Oriental, imortalizando Hindenburg e Ludendorff como heróis nacionais."
 ww1_germany_events.6.a: "Uma vitória lendária"
 ww1_germany_events.7.t: "O Ataque com Gás Venenoso"
 ww1_germany_events.7.d: "Nuvens mortíferas de cloro e mostarda varrem as trincheiras inimigas, inaugurando a era química da guerra."
 ww1_germany_events.7.a: "Que o inimigo trema perante o aço e a ciência"
 ww1_germany_events.8.t: "Início da Guerra Submarina Irrestrita"
 ww1_germany_events.8.d: "Os submarinos U-Boot receberam ordens de atacar sem aviso qualquer navio mercante abastecendo as ilhas britânicas."
 ww1_germany_events.8.a: "Cortar a artéria vital da Grã-Bretanha"
 ww1_germany_events.9.t: "A Partida de Lenin para Petrogrado"
 ww1_germany_events.9.d: "O vagão selado transportando Vladimir Lenin cruzou a fronteira em direção a Petrogrado para insuflar a revolta revolucionária."
 ww1_germany_events.9.a: "Plantando as sementes da revolução bolchevique"
 ww1_germany_events.10.t: "Assinatura do Tratado de Brest-Litovsk"
 ww1_germany_events.10.d: "A Rússia Soviética aceitou os termos alemães e abriu mão de imensas províncias no leste europeu."
 ww1_germany_events.10.a: "O front oriental foi vencido"
 ww1_germany_events.11.t: "O Reichstag Aprova a Resolução de Paz"
 ww1_germany_events.11.d: "A maioria parlamentar votou a favor de uma paz negociada sem anexações ou reparações forçadas."
 ww1_germany_events.11.a: "Um passo rumo à reconciliação europeia"
 ww1_germany_events.12.t: "A Proclamação Espartaquista"
 ww1_germany_events.12.d: "Operários armados e marinheiros sublevados proclamaram a República Socialista Livre da Alemanha!"
 ww1_germany_events.12.a: "Todo poder aos conselhos operários!"
 ww1_germany_events.13.t: "O Renascimento do Tratado de Björkö"
 ww1_germany_events.13.d: "Em um feito diplomático estarrecedor, o Kaiser e o Czar firmam aliança eterna contra as potências liberais ocidentais."
 ww1_germany_events.13.a: "A autocracia prevalecerá sobre o mundo"
 ww1_germany_events.14.t: "A Guerra Santa do Kaiser"
 ww1_germany_events.14.d: "O Estandarte Verde do Islã é erguido ao lado da Águia Hohenzollern em uma revolta pan-islâmica contra os britânicos."
 ww1_germany_events.14.a: "Allahu Akbar e Gott mit uns!"
 ww1_germany_events.15.t: "A União da Grande Alemanha (Großdeutschland)"
 ww1_germany_events.15.d: "Tropas alemãs entraram em Viena para resgatar as províncias austríacas, unindo todos os povos germânicos sob uma só coroa."
 ww1_germany_events.15.a: "O sonho da Grande Alemanha se realizou!"

 # Dicas de Ferramenta Personalizadas (Custom Tooltips)
 ww1_ger_agadir_concessions_tt:0 "A §YAlemanha§! assegura compensações territoriais no Neukamerun com a França em troca de reconhecer o Marrocos francês."

 # Modificadores de Opinião
 ger_berlin_baghdad_railway_op:0 "Projeto Ferroviário Berlim-Bagdá"
 ger_blank_cheque_op:0 "O Cheque em Branco a Viena"

 # Tags Cosméticas
 GER_socialist:0 "República Socialista Alemã"
 GER_socialist_DEF:0 "A República Socialista Alemã"
 GER_socialist_ADJ:0 "Alemã"
# --- CATEGORIAS DE DECISÃO ---
 GER_schlieffen_operations: "Operações Táticas do Plano Schlieffen"
 GER_schlieffen_operations_desc: "Coordenação precisa da ala direita, horários ferroviários e artilharia de sítio para alcançar uma vitória rápida contra a França."
 GER_kriegsrohstoffabteilung: "Kriegsrohstoffabteilung (Gabinete de Matérias-Primas KRA)"
 GER_kriegsrohstoffabteilung_desc: "Controle estatal da indústria, reciclagem de sucata e química sintética sob Walther Rathenau para derrotar o bloqueio naval britânico."
 GER_food_and_rationing: "Suprimento Alimentar & Racionamento"
 GER_food_and_rationing_desc: "Distribuição de rações, cotas de entrega de grãos e gestão da crise extrema do Inverno dos Nabos para evitar o colapso interno."
 GER_eastern_occupation_ober_ost: "Administração Militar de Ober Ost"
 GER_eastern_occupation_ober_ost_desc: "Exploração econômica das províncias russas conquistadas, extração de madeira báltica e escoamento de grãos para o Reich."
 GER_u_boat_campaign: "Campanha Imperial de U-Boats"
 GER_u_boat_campaign_desc: "Ataques de corsários submersíveis contra as frotas mercantes da Entente no Mar do Norte, no Canal da Mancha e no Atlântico."
 GER_weltpolitik_diplomacy: "Diplomacia Imperial da Weltpolitik"
 GER_weltpolitik_diplomacy_desc: "Articulação de alianças, investimentos coloniais e influência diplomática pela Europa, Império Otomano e Américas."

 # --- DECISÕES ---
 ger_schlieffen_reinforce_right_wing: "Reforçar a Ala Direita de von Kluck"
 ger_schlieffen_reinforce_right_wing_desc: "Transferir divisões de reserva e munição pesada para que a manobra de pinça através da Bélgica não perca ímpeto."
 ger_schlieffen_railway_timetables: "Horários Ferroviários Militares de Emergência"
 ger_schlieffen_railway_timetables_desc: "Priorizar a malha ferroviária da Renânia para abastecer continuamente os exércitos da vanguarda ocidental."
 ger_schlieffen_liege_siege_howitzers: "Empregar Obuseiros Krupp 420mm em Liège"
 ger_schlieffen_liege_siege_howitzers_desc: "Transportados por trilhos especiais, os obuseiros Berta Gorda pulverizam as fortalezas de concreto belgas."
 ger_schlieffen_violate_luxembourg: "Ocupar o Grão-Ducado de Luxemburgo"
 ger_schlieffen_violate_luxembourg_desc: "Assumir o controle dos entroncamentos ferroviários da Cidade de Luxemburgo para sustentar a ofensiva."
 ger_kra_requisition_scrap_metals: "Requisição Nacional de Sucatas Metálicas"
 ger_kra_requisition_scrap_metals_desc: "Confiscar sinos de igrejas, telhados de cobre e utensílios de latão para suprir as fábricas de munição."
 ger_kra_buna_rubber_rnd: "P&D de Borracha Sintética (Buna)"
 ger_kra_buna_rubber_rnd_desc: "Investir na síntese química em Leverkusen para produzir elastômeros artificiais e superar o bloqueio da borracha."
 ger_kra_substitute_textiles: "Produzir Tecidos Substitutos de Papel e Urtiga"
 ger_kra_substitute_textiles_desc: "Tecer fibras de celulose e polpa de madeira para uniformes e sacarias militares, contornando a falta de lã."
 ger_kra_priority_coal_allocations: "Priorizar Carvão para as Fundições de Munição"
 ger_kra_priority_coal_allocations_desc: "Desviar o carvão coque do Ruhr para a indústria bélica, aceitando racionamento no aquecimento doméstico."
 ger_rationing_introduce_k_brot: "Instituir o Pão de Guerra (K-Brot)"
 ger_rationing_introduce_k_brot_desc: "Diluir a farinha de trigo com fécula de batata para estender a durabilidade dos estoques nacionais de cereais."
 ger_rationing_pomeranian_grain_requisition: "Impor Cotas de Grãos na Pomerânia"
 ger_rationing_pomeranian_grain_requisition_desc: "Enviar inspetores e forças de segurança para requisitar grãos retidos nas propriedades agrícolas rurais."
 ger_rationing_emergency_soup_kitchens: "Subsidiar Cozinhas Comunitárias de Emergência"
 ger_rationing_emergency_soup_kitchens_desc: "Distribuir sopas quentes às famílias operárias de Berlim e Essen para conter revoltas e greves de fome."
 ger_rationing_import_danubian_grain: "Importar Grãos Danubianos da Áustria-Hungria"
 ger_rationing_import_danubian_grain_desc: "Garantir embarques prioritários de grãos pelas barcaças do Danúbio a partir das planícies húngaras."
 ger_ober_ost_bialowieza_timber: "Explorar a Madeira da Floresta de Białowieża"
 ger_ober_ost_bialowieza_timber_desc: "Instalar serrarias militares para fornecer dormentes de ferrovia e escoras de trincheira das florestas orientais."
 ger_ober_ost_polish_regency_council: "Proclamar o Reino de Regência da Polônia"
 ger_ober_ost_polish_regency_council_desc: "Instituir um conselho de regência autônomo em Varsóvia para atrair voluntários nacionalistas poloneses."
 ger_ober_ost_ukrainian_grain_trains: "Assegurar Comboios de Grãos da Ucrânia"
 ger_ober_ost_ukrainian_grain_trains_desc: "Organizar comboios de carga partindo de Kiev e Odessa para pôr fim definitivo à fome urbana alemã."
 ger_ober_ost_railway_gauge_conversion: "Converter Trilhos Orientais para a Bitola Padrão"
 ger_ober_ost_railway_gauge_conversion_desc: "Adaptar as linhas russas para a bitola européia para que trens de suprimento de Berlim cheguem até o fronte."
 ger_u_boat_patrol_western_approaches: "Desdobrar U-Boats nos Acessos Ocidentais"
 ger_u_boat_patrol_western_approaches_desc: "Emboscar navios de carga aliados que se aproximam de Liverpool e do Canal da Mancha."
 ger_u_boat_mine_celtic_sea: "Semear Minas Navais no Mar Céltico"
 ger_u_boat_mine_celtic_sea_desc: "Usar submarinos lança-minas para canalizar o tráfego mercante britânico para áreas de abate."
 ger_u_boat_prize_rules_compliance: "Cumprir Estritamente as Regras de Presa"
 ger_u_boat_prize_rules_compliance_desc: "Submarinos emergem e alertam tripulações civis antes do abate, evitando a revolta de nações neutras como os EUA."
 ger_weltpolitik_hejaz_railway_subsidy: "Subsidiar a Ferrovia Otomana do Hejaz"
 ger_weltpolitik_hejaz_railway_subsidy_desc: "Aportar recursos do Deutsche Bank e engenheiros prussianos para estender os trilhos até Medina e Damasco."
 ger_weltpolitik_bulgarian_mission: "Enviar Missão Militar a Sófia"
 ger_weltpolitik_bulgarian_mission_desc: "Fornecer canhões Krupp de montanha e rádios ao Czar Ferdinando para selar a aliança búlgara."
 ger_weltpolitik_bribe_italian_press: "Subsidiar Jornais Neutralistas Italianos"
 ger_weltpolitik_bribe_italian_press_desc: "Financiar a imprensa conservadora de Roma e Milão para contrabalançar a propaganda intervencionista da Entente."
 ger_weltpolitik_zimmermann_telegram: "Transmitir o Telegrama Zimmermann"
 ger_weltpolitik_zimmermann_telegram_desc: "Enviar a proposta confidencial ao México, prometendo a devolução do Texas, Novo México e Arizona."

 # --- ESPÍRITOS NACIONAIS EVOLUTIVOS ---
 GER_peacetime_industrial_giants: "Hegemonia Industrial Pré-Guerra"
 GER_peacetime_industrial_giants_desc: "Os cartéis siderúrgicos, químicos e elétricos alemães lideram os mercados mundiais com eficiência imbatível."
 GER_rathenau_kra_coordination: "Coordenação de Recursos do KRA"
 GER_rathenau_kra_coordination_desc: "O Gabinete de Matérias-Primas planeja os insumos de guerra, mantendo o parque bélico operando sob bloqueio."
 GER_hindenburg_total_mobilization: "Programa Hindenburg de Mobilização Total"
 GER_hindenburg_total_mobilization_desc: "Toda a sociedade e o parque fabril são subordinados ao esforço bélico pela Lei do Serviço Auxiliar."
 GER_war_exhaustion_or_triumph: "Transformação Econômica do Pós-Guerra"
 GER_war_exhaustion_or_triumph_desc: "A grandiosa capacidade bélica é reconvertida em infraestrutura civil e liderança manufatureira definitiva."
 GER_free_seas_trade: "Comércio Global Desimpedido"
 GER_free_seas_trade_desc: "Acesso marítimo irrestrito permite a importação de matérias-primas e gêneros alimentícios do mundo todo."
 GER_naval_blockade_strain: "Bloqueio Naval à Distância"
 GER_naval_blockade_strain_desc: "O cordão de isolamento da Royal Navy no Mar do Norte asfixia a entrada de borracha, salitre e alimentos."
 GER_turnip_winter_crisis: "O Inverno dos Nabos (Steckrübenwinter)"
 GER_turnip_winter_crisis_desc: "Com a quebra das safras de batata e trigo, o nabo forrageiro tornou-se o alimento básico de uma nação faminta."
 GER_ukraine_grain_relief: "Alívio Agrícola dos Grãos Ucranianos"
 GER_ukraine_grain_relief_desc: "O abastecimento maciço de trigo da Ucrânia quebrou a crise de fome e restaurou o moral da população."
 GER_moltke_generalstab_doctrine: "Guerra de Manobra de Moltke"
 GER_moltke_generalstab_doctrine_desc: "O Grande Estado-Maior prioriza envelopamentos rápidos e iniciativa operacional para vitórias decisivas."
 GER_falkenhayn_attrition_doctrine: "Doutrina de Atrito de Falkenhayn"
 GER_falkenhayn_attrition_doctrine_desc: "Batalhas de material metodicamente calculadas e defesa profunda para sangrar o adversário até a exaustão."
 GER_ludendorff_stormtrooper_assault: "Táticas de Infiltração de Ludendorff"
 GER_ludendorff_stormtrooper_assault_desc: "Unidades especializadas de Stosstruppen infiltram as linhas inimigas após bombardeios relâmpago de artilharia."
 GER_veteran_kaiserheer: "Veteranos do Kaiserheer"
 GER_veteran_kaiserheer_desc: "Anos de combate na guerra industrializada forjaram os soldados alemães em tropas veteranas altamente disciplinadas."
 GER_parliamentary_friction: "Atrito Parlamentar no Reichstag"
 GER_parliamentary_friction_desc: "Parlamentares democratas e socialistas exigem reformas políticas e transparência nos gastos militares."
 GER_reichstag_strike_unrest: "Greves Operárias e Revoltas da Fome"
 GER_reichstag_strike_unrest_desc: "A escassez alimentar e o desgaste da guerra detonaram grandes paralisações no Ruhr e em Berlim."
 GER_schlieffen_plan_failed: "Fracasso do Plano Schlieffen"
 GER_schlieffen_plan_failed_desc: "O Milagre do Marne deteve o avanço até Paris. A guerra de manobras transformou-se em atrito de trincheiras."
 GER_fokker_scourge_air_dominance: "O Flagelo Fokker"
 GER_fokker_scourge_air_dominance_desc: "O mecanismo sincronizador permite aos pilotos disparar através da hélice, garantindo superioridade aérea."
 GER_zeppelin_strategic_terror: "Terror Estratégico dos Zeppelins"
 GER_zeppelin_strategic_terror_desc: "Dirigíveis bombardeiam capitais e centros fabris inimigos, obrigando os Aliados a desviar caças para a defesa civil."
 GER_skagerrak_naval_victory: "Triunfo da Frota de Alto-Mar"
 GER_skagerrak_naval_victory_desc: "A Hochseeflotte infligiu perdas devastadoras à Marinha Britânica na Jutlândia, disputando o controle dos mares."
 GER_skagerrak_naval_stalemate: "Impasse Naval no Mar do Norte"
 GER_skagerrak_naval_stalemate_desc: "A esquadra alemã permanece segura em Wilhelmshaven, mas a Grã-Bretanha mantém seu bloqueio distante."
# --- FOCOS PRÉ-GUERRA (1911-1914) ---
 GER_kaiser_wilhelm_personal_rule: "O Governo Pessoal do Kaiser"
 GER_kaiser_wilhelm_personal_rule_desc: "Guilherme II há muito reivindica a prerrogativa imperial sobre os ministérios civis e a condução da política externa."
 GER_reichstag_1912_elections: "As Eleições do Reichstag de 1912"
 GER_reichstag_1912_elections_desc: "O Partido Social-Democrata obteve uma vitória histórica nas urnas imperiais, desafiando a ordem conservadora tradicional."
 GER_appease_the_junkers: "Tranquilizar os Junkers Prussianos"
 GER_appease_the_junkers_desc: "A aristocracia agrária da Prússia Oriental deve receber garantias do apoio da Coroa contra as reivindicações operárias."
 GER_reichstag_social_concessions: "Conciliação com o Centro e Socialistas"
 GER_reichstag_social_concessions_desc: "O chanceler Bethmann-Hollweg busca uma maioria parlamentar moderada para aprovar os orçamentos de defesa do Reich."
 GER_prussian_franchise_debate: "Debater a Lei Eleitoral Prussiana"
 GER_prussian_franchise_debate_desc: "O arcaico sistema eleitoral de três classes na Prússia tornou-se uma fonte intolerável de insatisfação popular."
 GER_heartland_of_the_ruhr: "O Coração Industrial do Ruhr"
 GER_heartland_of_the_ruhr_desc: "As bacias carboníferas e os altos-fornos de Westfália constituem o pulmão manufatureiro do Império Alemão."
 GER_krupp_heavy_ordnance_contracts: "Contratos de Artilharia Pesada com a Krupp"
 GER_krupp_heavy_ordnance_contracts_desc: "O império armamentista Krupp em Essen recebe a encomenda de novos e gigantescos obuseiros de sítio para o exército."
 GER_silesian_coal_and_foundries: "A Bacia Industrial da Alta Silésia"
 GER_silesian_coal_and_foundries_desc: "Imensas jazidas de carvão mineral, zinco e ferro na Silésia asseguram a matéria-prima básica para as fundições imperiais."
 GER_saarland_steel_works: "A Metalurgia Pesada do Sarre"
 GER_saarland_steel_works_desc: "A modernização dos complexos siderúrgicos do Sarre garante o fornecimento de aço temperado para canhões e blindagens."
 GER_chemical_cartels_basf: "Os Cartéis Químicos da BASF e Bayer"
 GER_chemical_cartels_basf_desc: "A indústria química alemã lidera o mundo, inovando na síntese de corantes, medicamentos e fertilizantes à base de nitrogênio."
 GER_electrical_giants_siemens_aeg: "Hegemonia Elétrica: Siemens e AEG"
 GER_electrical_giants_siemens_aeg_desc: "A eletrificação da malha ferroviária e das redes de telégrafo dá à Alemanha uma eficiência estratégica sem precedentes."
 GER_reichsbahn_strategic_network: "Rede Ferroviária Estratégica Imperial"
 GER_reichsbahn_strategic_network_desc: "A duplicação das principais ferrovias garante que os exércitos imperiais possam se deslocar do oeste para o leste em poucos dias."
 GER_rhine_railway_bridges: "Duplicar as Pontes Ferroviárias do Reno"
 GER_rhine_railway_bridges_desc: "As pontes monumentais sobre o Rio Reno em Colônia e Remagen são a chave dos planos de mobilização rápida no front ocidental."
 GER_east_prussian_supply_depots: "Fortificar Depósitos da Prússia Oriental"
 GER_east_prussian_supply_depots_desc: "Armazenar víveres e munições em Insterburg e Königsberg para que nossas fronteiras orientais resistam ao avanço russo."
 GER_dreadnought_battle_squadrons: "Esquadras de Encouraçados Dreadnought"
 GER_dreadnought_battle_squadrons_desc: "Construção de encouraçados modernos das classes Kaiser e König para desafiar a Marinha Real Britânica no Mar do Norte."
 GER_hipper_battlecruisers: "Cruzadores de Batalha de Hipper"
 GER_hipper_battlecruisers_desc: "Desenvolvimento de cruzadores de batalha velozes e pesadamente blindados sob o comando do almirante Franz von Hipper."
 GER_kiel_canal_widening: "Alargamento do Canal de Kiel"
 GER_kiel_canal_widening_desc: "A dragagem e expansão das eclusas do Canal Kaiser-Wilhelm permitem a passagem rápida de dreadnoughts entre o Báltico e o Mar do Norte."
 GER_heligoland_island_fortress: "A Ilha-Fortaleza de Heligoland"
 GER_heligoland_island_fortress_desc: "Transformar os rochedos de Heligoland em uma fortaleza inexpugnável para guardar as fozes dos rios Elba e Weser."
 GER_imperial_airship_corps: "Corpo Imperial de Dirigíveis"
 GER_imperial_airship_corps_desc: "Os dirigíveis rígidos do Conde Ferdinand von Zeppelin conferem longo alcance de patrulha naval e poder de impacto psicológico."
 GER_aviator_training_schools: "Campos de Aviação de Döberitz"
 GER_aviator_training_schools_desc: "Estabelecimento de instrução padronizada de pilotos para reconhecimento aéreo e regulação de tiro de artilharia."
 GER_rumpler_reconnaissance_craft: "Biplanos de Observação Rumpler"
 GER_rumpler_reconnaissance_craft_desc: "Aquisição de aeronaves confiáveis de grande altitude para mapear as fortificações e concentrações de tropas inimigas."
 GER_army_bill_1913_expansion: "A Grande Lei do Exército de 1913"
 GER_army_bill_1913_expansion_desc: "A maior expansão militar da história alemã em tempos de paz, criando dois novos corpos de exército diante da ameaça russa."
 GER_kriegsakademie_staff_cadres: "Quadros de Oficiais do Estado-Maior"
 GER_kriegsakademie_staff_cadres_desc: "A Kriegsakademie forma oficiais de elite instruídos em cálculos operacionais rigorosos e doutrina de iniciativa tática descentralizada."
 GER_machine_gun_detachments_mg08: "Padronizar a Maschinengewehr 08"
 GER_machine_gun_detachments_mg08_desc: "Equipar todos os regimentos de infantaria com companhias de metralhadoras pesadas para multiplicar a capacidade defensiva."
 GER_austro_hungarian_staff_coordination: "Coordenação com a Áustria-Hungria"
 GER_austro_hungarian_staff_coordination_desc: "Alinhamento das escalas de mobilização entre o general von Moltke e o marechal austro-húngaro Conrad von Hötzendorf."
 GER_ottoman_military_mission_sanders: "Missão Militar a Constantinopla"
 GER_ottoman_military_mission_sanders_desc: "O general Otto Liman von Sanders assume a reorganização do Exército Otomano para guarnecer os Estreitos Turcos ao lado de Berlim."
 GER_preserve_italian_loyalty: "Preservar a Tríplice Aliança"
 GER_preserve_italian_loyalty_desc: "Pressão diplomática e créditos financeiros para manter o Reino da Itália leal à aliança contra a Entente."

 # --- EVENTOS 17-20 ---
 ww1_germany_events.17.t: "Resultados das Eleições do Reichstag de 1912"
 ww1_germany_events.17.d: "A eleição imperial encerrou-se com uma vitória avassaladora dos sociais-democratas, que agora formam a maior bancada parlamentar."
 ww1_germany_events.17.a: "Um motivo de grave apreensão para a Coroa"
 ww1_germany_events.17.b: "Governaremos pelo apelo ao dever patriótico"
 ww1_germany_events.18.t: "Acordos com o Estado-Maior Austro-Húngaro"
 ww1_germany_events.18.d: "O marechal Conrad von Hötzendorf assinou os protocolos de coordenação ferroviária e desdobramento militar contra a Rússia."
 ww1_germany_events.18.a: "A Tríplice Aliança permanece inquebrável"
 ww1_germany_events.19.t: "Liman von Sanders Chega ao Chifre de Ouro"
 ww1_germany_events.19.d: "Instrutores prussianos assumiram postos de comando no Império Otomano, modernizando a artilharia e as divisões turcas."
 ww1_germany_events.19.a: "Assegurando os portões do Oriente"
 ww1_germany_events.20.t: "Reafirmação da Tríplice Aliança"
 ww1_germany_events.20.d: "O governo italiano reconheceu formalmente seus compromissos sob o tratado da Tríplice Aliança, prometendo cooperação."
 ww1_germany_events.20.a: "A Itália continua como nossa parceira"

 # --- Focos Operacionais do Lote 3 ---
 GER_sarajevo_reaction:0 "Reação a Sarajevo"
 GER_sarajevo_reaction_desc:0 "O assassinato do Arquiduque Franz Ferdinand em Sarajevo ameaça incendiar o barril de pólvora dos Bálcãs. O Império Alemão deve sinalizar solidariedade inabalável a Viena."
 GER_proclaim_state_of_war_danger:0 "Estado de Perigo Iminente de Guerra"
 GER_proclaim_state_of_war_danger_desc:0 "Proclamar o 'Zustand drohender Kriegsgefahr' coloca as forças armadas, ferrovias e postos de fronteira do Reich em alerta imediato de guerra, iniciando os protocolos de mobilização."
 GER_ultimatum_to_belgium:0 "Ultimato à Bélgica"
 GER_ultimatum_to_belgium_desc:0 "Para contornar as formidáveis fortalezas francesas ao longo do Mosa e do Mosela, o Exército Alemão exige passagem desimpedida pelo território belga."
 GER_battle_of_the_frontiers:0 "A Batalha das Fronteiras"
 GER_battle_of_the_frontiers_desc:0 "Em choque com os exércitos franceses executando o Plano XVII na Alsácia-Lorena e nas Ardenas, os corpos alemães desferem um poder devastador de artilharia e metralhadoras."
 GER_crossing_the_marne:0 "A Travessia do Marne"
 GER_crossing_the_marne_desc:0 "O Primeiro Exército de von Kluck e o Segundo Exército de von Bülow avançam para o sul através do Rio Marne, colocando Paris ao alcance visual dos batedores alemães."
 GER_race_to_the_sea:0 "A Corrida para o Mar"
 GER_race_to_the_sea_desc:0 "Com os flancos abertos sendo contornados e os exércitos colidindo em Flandres e Artois, ambos os lados cavam trincheiras desesperadamente, criando uma linha contínua da Suíça ao Mar do Norte."
 GER_battle_of_masurian_lakes:0 "Batalha dos Lagos Masurianos"
 GER_battle_of_masurian_lakes_desc:0 "Após a aniquilação do Segundo Exército russo em Tannenberg, Hindenburg e Ludendorff voltam-se contra o Primeiro Exército de Rennenkampf nos traiçoeiros lagos da Prússia Oriental."
 GER_relief_of_przemysl:0 "O Socorro a Przemyśl"
 GER_relief_of_przemysl_desc:0 "Nossos aliados austro-húngaros estão cercados na grande fortaleza galiciana de Przemyśl. Destacamentos do exército alemão devem intervir para estabilizar a frente dos Habsburgos."
 GER_gorlice_tarnow_breakthrough:0 "A Ruptura de Gorlice-Tarnów"
 GER_gorlice_tarnow_breakthrough_desc:0 "O General August von Mackensen desfere um bombardeio tempestuoso sem precedentes com obuses pesados Krupp, destruindo o Terceiro Exército Russo e rompendo a frente do Czar."
 GER_the_great_retreat_of_1915:0 "A Grande Retirada de 1915"
 GER_the_great_retreat_of_1915_desc:0 "Os exércitos russos abandonam a Polônia, a Lituânia e a Curlândia em caos. Em seu rastro, o Exército Imperial Alemão estabelece a autoridade de ocupação militar de Ober Ost."
 GER_battle_of_verdun_attrition:0 "Operação Gericht: Batalha de Verdun"
 GER_battle_of_verdun_attrition_desc:0 "O Chefe do Estado-Maior Erich von Falkenhayn decide 'sangrar o exército francês de branco' tendo como alvo o histórico anel de fortalezas de Verdun."
 GER_somme_defensive_elasticity:0 "Defesa Elástica no Somme"
 GER_somme_defensive_elasticity_desc:0 "Contra bombardeios implacáveis e ondas de infantaria franco-britânicas no Somme, os comandantes alemães inauguram sistemas de defesa em profundidade e contra-ataques flexíveis."
 GER_hindenburg_line_construction:0 "A Linha Hindenburg (Siegfriedstellung)"
 GER_hindenburg_line_construction_desc:0 "Uma obra-prima da engenharia militar, este bastião defensivo encurtado e profundamente fortificado permite ao Exército Alemão economizar efetivos e absorver os assaltos aliados."

 # --- Decisões e Missões ---
 ger_mission_reach_paris:0 "Operação: Alcançar Paris Antes do Esgotamento da Ofensiva"
 ger_mission_reach_paris_desc:0 "O Plano Schlieffen depende de velocidade incessante e ruptura. Devemos capturar Paris dentro de 25 dias, ou o ímpeto operacional se dissipará em um impasse entrincheirado."

 # --- Espíritos Nacionais ---
 GER_schlieffen_hangover:0 "Esgotamento da Ofensiva Schlieffen"
 GER_schlieffen_hangover_desc:0 "O avanço vertiginoso através da Bélgica e do norte da França levou nossas divisões ao limite físico da exaustão e ultrapassou os terminais de suprimento ferroviário."
 GER_western_triumph:0 "Triunfo no Ocidente"
 GER_western_triumph_desc:0 "A captura relâmpago de Paris quebrou a espinha dorsal dos exércitos aliados na Frente Ocidental, entregando um triunfo operacional espetacular."
 GER_trench_stalemate_western_front:0 "Impasse de Trincheiras na Frente Ocidental"
 GER_trench_stalemate_western_front_desc:0 "A frente se consolidou em um labirinto impenetrável de arame farpado, redutos de metralhadoras e redes de abrigos subterrâneos profundos."

 # --- Eventos ---
 ww1_germany_events.21.t:0 "Resposta Alemã a Sarajevo"
 ww1_germany_events.21.d:0 "O Kaiser e o Chanceler Imperial asseguraram a lealdade incondicional da Alemanha à Monarquia Dual Austro-Húngara nesta hora de provação."
 ww1_germany_events.21.a:0 "Permanecemos ombro a ombro com Viena."

 ww1_germany_events.22.t:0 "Ultimato Alemão à Bélgica"
 ww1_germany_events.22.d:0 "O governo imperial alemão exige passagem militar desimpedida através do território belga, alegando que forças francesas pretendem violar a neutralidade do país."
 ww1_germany_events.22.a:0 "A Bélgica é uma nação, não uma estrada! (Rejeitar Ultimato)"
 ww1_germany_events.22.b:0 "Cedemos sob coação. (Aceitar Trânsito Alemão)"

 ww1_germany_events.23.t:0 "O Milagre do Marne"
 ww1_germany_events.23.d:0 "Exércitos franceses e britânicos contra-atacaram ao longo do Rio Marne. Divisões alemãs exaustas, com pouca munição e sem comunicação com o OHL, são forçadas a recuar para o Aisne."
 ww1_germany_events.23.a:0 "Recuar para o Aisne e entrincheirar!"

 ww1_germany_events.24.t:0 "A Ruptura de Gorlice-Tarnów"
 ww1_germany_events.24.d:0 "O Décimo Primeiro Exército do Marechal de Campo von Mackensen estilhaçou as defesas russas na Galícia com artilharia avassaladora, forçando as forças do Czar a uma retirada desordenada."
 ww1_germany_events.24.a:0 "Mackensen destruiu o colosso russo!"

 ww1_germany_events.25.t:0 "Operação Gericht: O Forno de Verdun"
 ww1_germany_events.25.d:0 "O General von Falkenhayn lançou um ataque implacável contra o anel de fortalezas de Verdun. As colinas do Mosa tornaram-se um matadouro industrial."
 ww1_germany_events.25.a:0 "Sangrar o exército francês de branco."

 ww1_germany_events.26.t:0 "A Queda de Paris!"
 ww1_germany_events.26.d:0 "Em um feito militar assombroso, colunas de cavalaria e infantaria alemãs romperam as fortificações externas e entraram na capital francesa! O estandarte imperial Preto-Branco-Vermelho tremula no alto da Torre Eiffel."
 ww1_germany_events.26.a:0 "Gott mit uns! O Ocidente foi conquistado!"

 # --- Lote 4A: Economia de Guerra e KRA ---
 GER_rathenau_war_raw_materials_board:0 "Kriegsrohstoffabteilung (KRA)"
 GER_rathenau_war_raw_materials_board_desc:0 "Sob o comando do visionário industrial Walther Rathenau, o Gabinete de Matérias-Primas inventaria, raciona e coordena a distribuição de todos os insumos industriais críticos do Reich."
 GER_confiscate_strategic_metals:0 "Confisco de Metais Estratégicos"
 GER_confiscate_strategic_metals_desc:0 "Para superar o bloqueio dos Aliados sobre o cobre, estanho e zinco, as autoridades confiscam sinos de igrejas, utensílios de cobre e tubulações para as fábricas de munição."
 GER_synthetic_buna_rubber_development:0 "Borracha Sintética Buna"
 GER_synthetic_buna_rubber_development_desc:0 "Com o acesso às colônias cortado pela Marinha Real, químicos da Bayer desenvolvem borracha sintética para manter os veículos militares em operação."
 GER_ersatz_materials_industry:0 "Produção de Materiais Ersatz"
 GER_ersatz_materials_industry_desc:0 "Pioneiros da substituição industrial utilizam fibras de urtiga em vez de lã, celulose de madeira em vez de algodão e destilados de carvão como lubrificantes."
 GER_coal_and_steel_rationing_board:0 "Racionamento de Carvão e Aço"
 GER_coal_and_steel_rationing_board_desc:0 "O racionamento rigoroso prioriza as fundições pesadas da Krupp e a manufatura de projéteis de artilharia sobre qualquer consumo civil."
 GER_imperial_war_credits_kriegsanleihen:0 "Empréstimos de Guerra Imperiais (Kriegsanleihen)"
 GER_imperial_war_credits_kriegsanleihen_desc:0 "Campanhas maciças de subscrição pública em escolas, bancos e praças financiam os exércitos imperiais com a poupança patriótica dos civis."

 # --- Lote 4A: Crise Alimentar e Bloqueio ---
 GER_british_starvation_blockade_strain:0 "O Bloqueio de Inanição Britânico"
 GER_british_starvation_blockade_strain_desc:0 "O bloqueio naval da Marinha Real Britânica no Mar do Norte sufoca o comércio mercantil, privando os Impérios Centrais de cereais, fertilizantes e gorduras vitais."
 GER_kriegsbrot_and_flour_rationing:0 "O Pão de Guerra (Kriegsbrot)"
 GER_kriegsbrot_and_flour_rationing_desc:0 "A farinha é esticada pela adição obrigatória de fécula de batata, farelo de centeio e palha moída, produzindo o denso e escuro pão de guerra 'K-Brot'."
 GER_imperial_grain_office:0 "Gabinete Imperial de Grãos"
 GER_imperial_grain_office_desc:0 "Um monopólio estatal centralizado controla toda a colheita, moagem e distribuição de farinha em toda a Prússia e nos estados federados."
 GER_swine_massacre_consequences:0 "O Massacre dos Porcos (Schweinemord)"
 GER_swine_massacre_consequences_desc:0 "O abate forçado de nove milhões de porcos em 1915 preserva grãos para consumo humano, mas arruína os estoques de adubo orgânico e gordura animal."
 GER_steckrubenwinter_crisis_management:0 "O Inverno dos Nabos (Steckrübenwinter)"
 GER_steckrubenwinter_crisis_management_desc:0 "Com a colheita de batatas apodrecida pelas chuvas, a população civil sobrevive à base de nabos suecos, transformados em ensopado, pão e café de nabo."
 GER_danubian_grain_imports:0 "Comboios de Grãos do Danúbio"
 GER_danubian_grain_imports_desc:0 "Barcaças fluviais pelo Rio Danúbio transportam colheitas búlgaras, austro-húngaras e romenas diretamente aos famintos centros industriais do Ruhr."

 # --- Lote 4A: Guerra Naval e Hochseeflotte ---
 GER_skagerrak_battle_of_jutland_clash:0 "O Confronto de Skagerrak (Jutlândia)"
 GER_skagerrak_battle_of_jutland_clash_desc:0 "Os vice-almirantes Scheer e Hipper mobilizam a Hochseeflotte para emboscar a frota de cruzadores de batalha de Beatty na maior batalha de encouraçados da história."
 GER_break_the_distant_blockade_attempt:0 "Romper o Bloqueio Distante"
 GER_break_the_distant_blockade_attempt_desc:0 "Esquadrões de superfície realizam surtidas coordenadas no Atlântico Norte para desafiar a supremacia da Grand Fleet britânica."
 GER_commerce_raiding_cruisers:0 "Cruzadores Corsários Mercantes"
 GER_commerce_raiding_cruisers_desc:0 "Navios corsários disfarçados como o SMS Möwe, Wolf e Seeadler travam uma guerra assimétrica arrasadora nos oceanos Índico e Atlântico Sul."
 GER_unrestricted_u_boat_debate:0 "O Memorando de Holtzendorff"
 GER_unrestricted_u_boat_debate_desc:0 "O Almirante von Holtzendorff apresenta o cálculo matemático: afundar 600.000 toneladas de navios mercantes por mês forçará a Grã-Bretanha a capitular em seis meses."
 GER_sussex_pledge_cruiser_rules_choice:0 "Respeitar as Regras de Presa (Sussex)"
 GER_sussex_pledge_cruiser_rules_choice_desc:0 "Restringir os submarinos às regras de visita e busca aplaca Washington e assegura que os Estados Unidos permaneçam neutros no conflito europeu."
 GER_torpedo_transatlantic_convoys:0 "Guerra Submarina Irrestrita"
 GER_torpedo_transatlantic_convoys_desc:0 "Decretar guerra submarina irrestrita autoriza os U-Boats a afundar qualquer embarcação nas zonas de guerra sem aviso prévio, arriscando a entrada americana na guerra."
 GER_operation_albion_baltic_islands:0 "Operação Albion"
 GER_operation_albion_baltic_islands_desc:0 "Uma operação anfíbia exemplar desembarca corpos alemães nas ilhas bálticas de Ösel e Moon, expulsando a frota russa do Golfo de Riga."
 GER_submarine_cruiser_u_kreuzer_fleet:0 "Esquadrões de Submarinos Cruzadores"
 GER_submarine_cruiser_u_kreuzer_fleet_desc:0 "Gigantescos U-Kreuzer armados com canhões pesados de 150mm e tanques de combustível massivos capazes de atacar navios na costa de Nova York."

 # --- Lote 4A: Aviação Imperial ---
 GER_the_fokker_scourge_dominance:0 "O Flagelo Fokker"
 GER_the_fokker_scourge_dominance_desc:0 "O mecanismo sincronizador de Anthony Fokker permite que as metralhadoras disparem através do hélice sem atingi-lo, conferindo aos monoplanos alemães supremacia aérea absoluta."
 GER_albatros_diii_fighters:0 "Caças Albatros D.III"
 GER_albatros_diii_fighters_desc:0 "Fuselagens monocoque de madeira aerodinâmicas e metralhadoras Spandau sincronizadas tornam o Albatros D.III o terror das tripulações aliadas no 'Abril Sangrento'."
 GER_dicta_boelcke_air_tactics:0 "Doutrina Aérea Dicta Boelcke"
 GER_dicta_boelcke_air_tactics_desc:0 "O Capitão Oswald Boelcke redige as regras fundamentais do combate aéreo: manter a altitude, atacar com o sol nas costas e disparar à queima-roupa."
 GER_richthofens_flying_circus_aces:0 "O Circo Voador (Jagdgeschwader 1)"
 GER_richthofens_flying_circus_aces_desc:0 "Sob Manfred von Richthofen, o Barão Vermelho, esquadrões de caças com cores vivas deslocam-se pela linha de frente caçando formações da Entente."
 GER_gotha_bombers_turkenkreuz:0 "Operação Türkenkreuz (Bombardeiros Gotha)"
 GER_gotha_bombers_turkenkreuz_desc:0 "Bombardeiros pesados bimotores Gotha realizam ataques diurnos sobre Londres, aterrorizando a população e forçando a defesa aérea britânica a desviar caças da frente."
 GER_giant_zeppelin_staaken_fleet:0 "Aviões Gigantes Zeppelin-Staaken"
 GER_giant_zeppelin_staaken_fleet_desc:0 "Bombardeiros quadrimotores gigantescos lançam bombas de 1.000 quilos sobre nós ferroviários e quartéis em Paris e no sudeste da Inglaterra."
 GER_all_metal_junkers_aircraft:0 "Aeronaves Blindadas Junkers de Duralumínio"
 GER_all_metal_junkers_aircraft_desc:0 "Hugo Junkers é o pioneiro da aviação toda de metal, criando aviões praticamente imunes a tiros de metralhadora durante ataques às trincheiras inimigas."

 # --- Lote 4A: Mobilização de Guerra Total ---
 GER_auxiliary_service_law_hilfsdienst:0 "Lei do Serviço Auxiliar (Hilfsdienstgesetz)"
 GER_auxiliary_service_law_hilfsdienst_desc:0 "O Marechal von Hindenburg impõe serviço de guerra obrigatório para todos os cidadãos homens de 16 a 60 anos não engajados nas trincheiras, militarizando as indústrias."
 GER_women_in_munitions_industry:0 "Mulheres nas Fábricas de Armamento"
 GER_women_in_munitions_industry_desc:0 "Centenas de milhares de mulheres assumem as linhas de produção da Krupp e arsenais de Spandau, mantendo a fabricação de munições em ritmo recorde."
 GER_light_machine_guns_mg08_15:0 "Metralhadoras Leves MG 08/15"
 GER_light_machine_guns_mg08_15_desc:0 "Equipar a metralhadora com bipé e coronha fornece às tropas de choque poder de fogo automático móvel diretamente nas trincheiras de assalto."
 GER_flammenwerfer_shock_detachments:0 "Destacamentos de Lança-Chamas"
 GER_flammenwerfer_shock_detachments_desc:0 "Pioneiros especializados com lança-chamas portáteis limpam casamatas fortificadas e abrigos subterrâneos durante ofensivas relâmpago."
 GER_heavy_siege_howitzers_paris_gun:0 "O Canhão de Paris (Paris-Geschütz)"
 GER_heavy_siege_howitzers_paris_gun_desc:0 "Engenheiros da Krupp constroem um canhão colossal de 28 metros de cano que lança projéteis na estratosfera, bombardeando Paris a mais de 120 km de distância."
 GER_first_german_tank_a7v:0 "Sturmpanzerwagen A7V"
 GER_first_german_tank_a7v_desc:0 "O primeiro blindado de combate do Império Alemão conta com seis metralhadoras Maxim e um canhão de 57mm para romper as defesas de arame inimigas."
 GER_salvaged_beutepanzer_corps:0 "Regimentos de Tanques Capturados (Beutepanzer)"
 GER_salvaged_beutepanzer_corps_desc:0 "Recuperar e rearmar blindados britânicos Mark IV capturados permite ao exército colocar em campo mais veículos blindados do que a própria indústria nacional poderia produzir."

 # --- Lote 4A: Diplomacia Bilateral ---
 GER_balkan_railway_through_corridor:0 "Corredor Ferroviário dos Bálcãs"
 GER_balkan_railway_through_corridor_desc:0 "Garantir o tráfego ferroviário através de Morava e Sófia estabelece uma rota terrestre direta e protegida de Berlim e Viena até Constantinopla."
 GER_sweden_iron_ore_guarantees:0 "Tratado Comercial de Minério com a Suécia"
 GER_sweden_iron_ore_guarantees_desc:0 "A Alemanha assegura a neutralidade da Suécia em troca de remessas garantidas de minério de ferro de alta qualidade das minas de Kiruna e Gällivare."
 GER_bulgarian_triple_alliance_pact:0 "Aliança com a Bulgária"
 GER_bulgarian_triple_alliance_pact_desc:0 "A promessa de anexação da Macedônia e de Dobruja convence o Czar Fernando a unir o valoroso exército búlgaro às potências centrais."
 GER_danish_strait_mining_pact:0 "Acordo de Minagem dos Estreitos Dinamarqueses"
 GER_danish_strait_mining_pact_desc:0 "Minar o Grande Belt e o Öresund sob concordância tácita com Copenhague impede que couraçados britânicos ingressem no Mar Báltico."
 GER_romanian_oil_and_grain_pact:0 "Acordo de Grãos e Petróleo com a Romênia"
 GER_romanian_oil_and_grain_pact_desc:0 "Pressões financeiras e diplomáticas asseguram cotas mensais de combustível fóssil dos poços de Ploiești para abastecer o esforço bélico do Reich."
 GER_swiss_neutral_financial_corridor:0 "Canal Financeiro Neutro Suíço"
 GER_swiss_neutral_financial_corridor_desc:0 "Berna neutra serve como centro insubstituível para transações financeiras em moedas fortes e troca de prisioneiros feridos da Cruz Vermelha."
 GER_greek_royalist_support_treaty:0 "Apoio ao Rei Constantino da Grécia"
 GER_greek_royalist_support_treaty_desc:0 "Apoiar a facção monarquista grega contra os intervencionistas de Venizelos impede que a Grécia ceda bases navais e entre na guerra pela Entente."
 GER_ambassador_bernstorff_us_lobby:0 "Lobby de Paz de Bernstorff em Washington"
 GER_ambassador_bernstorff_us_lobby_desc:0 "O Embaixador von Bernstorff articula grupos cívicos teuto-americanos e campanhas de imprensa nos EUA para manter Woodrow Wilson estritamente neutro."

 # --- Lote 4A: Colônias e Weltpolitik ---
 GER_mittelafrika_colonial_vision:0 "A Visão de Deutsch-Mittelafrika"
 GER_mittelafrika_colonial_vision_desc:0 "Os estrategistas do Império planejam a consolidação de um império colonial africano contínuo, unindo os mares do Atlântico e do Índico."
 GER_lettow_vorbeck_east_africa_stand:0 "A Campanha de Lettow-Vorbeck na África"
 GER_lettow_vorbeck_east_africa_stand_desc:0 "O General von Lettow-Vorbeck e seus destemidos soldados Askaris travam uma lendária guerra de guerrilha na África Oriental, prendendo centenas de milhares de soldados inimigos."
 GER_siege_of_tsingtao_resistance:0 "A Resistência de Tsingtao"
 GER_siege_of_tsingtao_resistance_desc:0 "A guarnição de infantaria naval em Tsingtao resiste heroicamente ao cerco conjunto japonês e britânico até o esgotamento de todas as munições."
 GER_support_irish_easter_rising:0 "Apoio à Revolta de Páscoa na Irlanda"
 GER_support_irish_easter_rising_desc:0 "O envio de milhares de fuzis Mauser a bordo do mercante SMS Libau encoraja os Voluntários Irlandeses de Roger Casement a sublevar Dublin contra o Império Britânico."
 GER_boer_maritz_rebellion_backing:0 "Apoio à Rebelião Boer de Maritz"
 GER_boer_maritz_rebellion_backing_desc:0 "Fornecer ouro e canhões a partir do Sudoeste Africano Alemão incentiva os rebeldes bôeres do General Manie Maritz a lutarem pela independência na África do Sul."
 GER_zimmermann_telegram_proposal:0 "O Telegrama Zimmermann"
 GER_zimmermann_telegram_proposal_desc:0 "O Secretário de Relações Exteriores Arthur Zimmermann envia uma proposta secreta ao México oferecendo aliança e os territórios perdidos do Texas, Arizona e Novo México."

 # --- Lote 4A Espíritos e Eventos ---
 GER_ersatz_materials_production:0 "Produção de Materiais Ersatz"
 GER_ersatz_materials_production_desc:0 "Substitutos industriais químicos suprem a escassez de vestuário, combustíveis e graxas industriais no Reich."
 GER_kriegsbrot_rationing:0 "Racionamento do Pão de Guerra"
 GER_kriegsbrot_rationing_desc:0 "A população consome pão misturado com fécula de batata, preservando cereais ao custo da crescente frustração civil."
 GER_high_seas_fleet_active:0 "Hochseeflotte em Surtida"
 GER_high_seas_fleet_active_desc:0 "A esquadra de batalha do Kaiser desafia ativamente o domínio das rotas no Mar do Norte."
 GER_fokker_scourge_air_dominance:0 "O Flagelo Fokker"
 GER_fokker_scourge_air_dominance_desc:0 "O mecanismo sincronizador alemão garante domínio temporário sobre os céus da Frente Ocidental."
 GER_dicta_boelcke_doctrine:0 "Táticas Dicta Boelcke"
 GER_dicta_boelcke_doctrine_desc:0 "O voo disciplinado em formação e a vantagem de altitude orientam os combates entre esquadrões de caça."

 ww1_germany_events.27.t:0 "O Massacre dos Porcos de 1915"
 ww1_germany_events.27.d:0 "O governo alemão ordenou o abate emergencial de milhões de suínos para poupar cereais. Grãos foram preservados, mas a escassez de carnes e gorduras torna-se crítica."
 ww1_germany_events.27.a:0 "Uma necessidade amarga para o Reich."

 ww1_germany_events.28.t:0 "Skagerrak - O Choque de Couraçados"
 ww1_germany_events.28.d:0 "Nas águas nebulosas da costa dinamarquesa, a Hochseeflotte trocou salvas com a Grand Fleet britânica. Vários cruzadores de batalha ingleses explodiram sob a artilharia alemã."
 ww1_germany_events.28.a:0 "A frota alemã provou seu valor!"

 ww1_germany_events.29.t:0 "O Memorando de Holtzendorff"
 ww1_germany_events.29.d:0 "O Almirante von Holtzendorff apresenta ao governo o ultimato naval: declarar guerra submarina irrestrita imediatamente ou abrir mão da iniciativa nos mares."
 ww1_germany_events.29.a:0 "Um cálculo de consequências colossais."

 ww1_germany_events.30.t:0 "Bombardeiros Gotha Sobre Londres"
 ww1_germany_events.30.d:0 "Bombardeiros bimotores Gotha apareceram à luz do dia sobre os céus de Londres, lançando explosivos perto da estação de Liverpool Street. O alarme ressoa por toda a Grã-Bretanha."
 ww1_germany_events.30.a:0 "Levem a guerra às portas do inimigo."

 ww1_germany_events.31.t:0 "O Canhão de Paris Dispara"
 ww1_germany_events.31.d:0 "Posicionado em segredo nas florestas de Crepy, o colossal canhão da Krupp projeta projéteis na estratosfera, atingindo bairros de Paris a mais de 120 quilômetros de distância."
 ww1_germany_events.31.a:0 "Paris estremece sob o aço da Krupp."

 ww1_germany_events.32.t:0 "Tratado de Minério com a Suécia"
 ww1_germany_events.32.d:0 "O governo sueco em Estocolmo ratificou o compromisso de manter o fluxo contínuo de minério de ferro de alta pureza da Lapônia para as fundições alemãs."
 ww1_germany_events.32.a:0 "O ferro de nossas armas está assegurado."

 ww1_germany_events.33.t:0 "A Bulgária Junta-se às Potências Centrais"
 ww1_germany_events.33.d:0 "O Reino da Bulgária assinou o tratado de aliança formal com a Alemanha e a Áustria-Hungria, preparando suas divisões para esmagar a Sérvia e abrir o corredor bálcã."
 ww1_germany_events.33.a:0 "A estrada para Constantinopla está aberta!"
 ww1_germany_events.33.b:0 "Eles optaram pela neutralidade por ora."

 ww1_germany_events.34.t:0 "Concessões Petrolíferas e Agrícolas da Romênia"
 ww1_germany_events.34.d:0 "Sob fortes pressões diplomáticas de Berlim, o Reino da Romênia concordou em conceder cotas vitais de petróleo bruto e trigo às potências centrais."
 ww1_germany_events.34.a:0 "Combustível para a nossa máquina de guerra."
 ww1_germany_events.34.b:0 "Eles desafiam a nossa vontade por sua conta e risco!"

 ww1_germany_events.35.t:0 "A Resistência Heroica de Lettow-Vorbeck"
 ww1_germany_events.35.d:0 "Na África Oriental Alemã, o General von Lettow-Vorbeck continua liderando seus leais soldados Askaris pelas selvas e pântanos, prendendo centenas de milhares de soldados inimigos."
 ww1_germany_events.35.a:0 "Um herói invicto nos trópicos."

 ww1_germany_events.36.t:0 "A Revolta da Páscoa em Dublin"
 ww1_germany_events.36.d:0 "Rebeldes republicanos irlandeses tomaram o Correio Geral em Dublin e proclamaram a República da Irlanda, enfrentando os britânicos com fuzis alemães Mauser."
 ww1_germany_events.36.a:0 "Um golpe audacioso nas costas da Grã-Bretanha."

 ww1_germany_events.37.t:0 "O Telegrama Zimmermann"
 ww1_germany_events.37.d:0 "A mensagem diplomática cifrada do Ministro Arthur Zimmermann ao governo do México foi interceptada e publicada. A opinião pública dos Estados Unidos entrou em fúria patriótica."
 ww1_germany_events.37.a:0 "Uma aposta arriscada que veio à tona."

 # --- Lote 4B: Campanhas Táticas na Frente Ocidental ---
 GER_second_battle_of_ypres_gas:0 "Segunda Batalha de Ypres (Ofensiva de Gás)"
 GER_second_battle_of_ypres_gas_desc:0 "A abertura de 5.700 cilindros de gás cloro cria uma névoa amarelo-esverdeada sufocante que avança sobre as trincheiras aliadas em Ypres."
 GER_champagne_defensive_victories:0 "Defesa em Champagne"
 GER_champagne_defensive_victories_desc:0 "Corpos do exército alemão repelem as ofensivas francesas do General Joffre em Champagne a partir de posições fortificadas em contra-encosta."
 GER_operation_alberich_scorched_earth:0 "Operação Alberich (Retirada Estratégica)"
 GER_operation_alberich_scorched_earth_desc:0 "Uma retirada sistemática e implacável para a Linha Hindenburg destrói ferrovias e pontes, deixando um deserto intransponível para os Aliados."
 GER_arras_and_vimy_ridge_stand:0 "A Resistência de Arras"
 GER_arras_and_vimy_ridge_stand_desc:0 "Frente a cargas em massa de blindados britânicos em Arras, as reservas alemãs absorvem o choque inicial e reestabelecem a frente defensiva."
 GER_battle_of_cambrai_counterstroke:0 "O Contra-Ataque de Tropas de Choque em Cambrai"
 GER_battle_of_cambrai_counterstroke_desc:0 "Na primeira grande batalha de tanques da história, tropas de infiltração alemãs contornam os redutos britânicos, recuperando o terreno perdido."

 # --- Lote 4B: Campanhas nos Alpes, Bálcãs e Oriente Médio ---
 GER_common_army_heeresfront_coordination:0 "Coordenação de Frente Austro-Alemã"
 GER_common_army_heeresfront_coordination_desc:0 "A unificação das operações sob o Estado-Maior alemão estabiliza os exércitos multinacionais dos Habsburgos contra os russos."
 GER_austro_hungarian_naval_danube_flotilla:0 "Flotilha Fluvial do Danúbio"
 GER_austro_hungarian_naval_danube_flotilla_desc:0 "Reforçar os monitores fluviais no Danúbio garante apoio de artilharia pesada naval para as travessias terrestres das potências centrais."
 GER_fourteenth_army_alpine_corps:0 "O Décimo Quarto Exército e o Alpenkorps"
 GER_fourteenth_army_alpine_corps_desc:0 "Tropas de montanha do Alpenkorps bávaro são posicionadas nos Alpes Julianos para desencadear uma ofensiva esmagadora contra a Itália."
 GER_battle_of_caporetto_breakthrough:0 "A Ruptura de Caporetto (Flitsch-Tolmein)"
 GER_battle_of_caporetto_breakthrough_desc:0 "Táticas de infiltração e bombardeios de gás estilhaçam o Segundo Exército Italiano, provocando uma fuga desordenada de 100 km até o Rio Piave."
 GER_invasion_of_romania_falkenhayn:0 "A Campanha da Romênia"
 GER_invasion_of_romania_falkenhayn_desc:0 "O Marechal von Mackensen pelo sul e Falkenhayn pela Transilvânia realizam um duplo cerco exemplar sobre a Valáquia."
 GER_fall_of_bucharest_oil_fields:0 "Captura de Bucareste e Poços de Ploiești"
 GER_fall_of_bucharest_oil_fields_desc:0 "A tomada de Bucareste e dos poços petrolíferos de Ploiești salva a Alemanha de um colapso iminente de combustíveis e cereais."
 GER_asienkorps_palestine_expedition:0 "Expedição do Asienkorps"
 GER_asienkorps_palestine_expedition_desc:0 "Destacamentos alemães de infantaria, aviação e oficiais de estado-maior são enviados à Palestina para auxiliar na defesa de Jerusalém."
 GER_siege_of_kut_al_amara_aid:0 "Socorro ao Cerco de Kut-al-Amara"
 GER_siege_of_kut_al_amara_aid_desc:0 "O Marechal Colmar von der Goltz orienta as forças otomanas no cerco e rendição incondicional da divisão britânica do General Townshend."

 # --- Lote 4B: Acordos no Leste e Mitteleuropa ---
 GER_create_regency_kingdom_of_poland:0 "Estabelecer o Reino da Polônia (Regência)"
 GER_create_regency_kingdom_of_poland_desc:0 "Os Imperadores Centrais proclamam o renascimento da Polônia sob um Conselho de Regência alinhado à esfera diplomática de Berlim."
 GER_liberate_the_ukrainian_hetmanate:0 "O Hetmanato da Ucrânia"
 GER_liberate_the_ukrainian_hetmanate_desc:0 "O apoio ao Hetman Pavlo Skoropadsky estabelece um estado ucraniano estável que garante remessas maciças de trigo à Alemanha."
 GER_establish_united_baltic_duchy:0 "O Ducado Unido do Báltico"
 GER_establish_united_baltic_duchy_desc:0 "A nobreza alemã báltica une a Livônia, Estônia e Curlândia em um ducado constitucional ligado à coroa do Império Alemão."
 GER_kingdom_of_finland_vassal:0 "O Reino da Finlândia"
 GER_kingdom_of_finland_vassal_desc:0 "O Príncipe Frederico Carlos de Hesse é eleito Rei da Finlândia, consagrando a independência finlandesa sob proteção militar alemã."
 GER_kingdom_of_lithuania_urach:0 "O Reino da Lituânia"
 GER_kingdom_of_lithuania_urach_desc:0 "O Conselho da Lituânia restaura a monarquia nacional sob o Duque Guilherme de Urach, coroado como Rei Mindaugas II."
 GER_caucasian_intervention_georgia:0 "Expedição Alemã ao Cáucaso"
 GER_caucasian_intervention_georgia_desc:0 "O General von Kressenstein avança sobre a Geórgia, assegurando as ferrovias transcaucasianas e os oleodutos de Baku."
 GER_mitteleuropa_customs_union:0 "União Aduaneira Mitteleuropa"
 GER_mitteleuropa_customs_union_desc:0 "O projeto de Friedrich Naumann torna-se realidade: uma zona econômica autossuficiente centro-europeia sob liderança da indústria alemã."
 GER_baltic_german_colonization_order:0 "Assentamentos Alemães no Báltico"
 GER_baltic_german_colonization_order_desc:0 "Incentivar a fixação de colonos e veteranos germânicos estabelece uma barreira cultural e militar permanente no Báltico oriental."
 GER_don_and_kuban_cossack_treaties:0 "Tratados com os Cossacos do Don e Kuban"
 GER_don_and_kuban_cossack_treaties_desc:0 "O reconhecimento da República do Don do Ataman Krasnov protege a retaguarda oriental e reabre o comércio na bacia do Volga."

 # --- Lote 4B: Ditadura Militar do OHL ---
 GER_oust_bethmann_hollweg:0 "Demitir Bethmann-Hollweg"
 GER_oust_bethmann_hollweg_desc:0 "Hindenburg e Ludendorff ameaçam renúncia imediata caso o Kaiser Wilhelm II não afaste o hesitante Chanceler Bethmann-Hollweg."
 GER_chancellor_michaelis_puppet:0 "Nomear o Chanceler Michaelis"
 GER_chancellor_michaelis_puppet_desc:0 "A indicação do burocrata Georg Michaelis confirma o controle político total do Terceiro Comando Supremo Militar (OHL)."
 GER_krupp_ordnance_dictate:0 "O Ditame de Armamentos Krupp"
 GER_krupp_ordnance_dictate_desc:0 "Disputas trabalhistas e alocações de produção são militarizadas sob a autoridade central do sindicato de armamentos Krupp."
 GER_operation_georgette_flanders:0 "Operação Georgette (Batalha de Lys)"
 GER_operation_georgette_flanders_desc:0 "O Sexto Exército Alemão ataca em Flandres para tomar os entroncamentos de Hazebrouck e empurrar as tropas britânicas para o mar."
 GER_operation_gneisenau_matz:0 "Operação Gneisenau"
 GER_operation_gneisenau_matz_desc:0 "Ataques pelo Vale do Matz unem os salientes entre Montdidier e Noyon, desgastando as reservas estratégicas da França."
 GER_operation_blucher_yorck:0 "Operação Blücher-Yorck"
 GER_operation_blucher_yorck_desc:0 "Um bombardeio surpresa nas colinas de Chemin des Dames abre uma brecha que permite avançar 50 km em três dias até o Rio Marne."
 GER_the_black_day_of_the_german_army:0 "O Dia Negro do Exército Alemão"
 GER_the_black_day_of_the_german_army_desc:0 "Em 8 de agosto de 1918, centenas de tanques britânicos rompem as linhas em Amiens, demonstrando que a vitória militar é inalcançável."
 GER_seek_armistice_fourteen_points:0 "Buscar Armistício nos 14 Pontos de Wilson"
 GER_seek_armistice_fourteen_points_desc:0 "Diante do esgotamento geral, o governo civil solicita ao Presidente Woodrow Wilson um armistício honroso baseado nos Quatorze Pontos."
 GER_kiel_sailors_mutiny:0 "O Motim dos Marinheiros em Kiel"
 GER_kiel_sailors_mutiny_desc:0 "Recusando a ordem suicida de lançar a esquadra ao mar em uma última surtida, marinheiros em Kiel apagam as caldeiras e erguem bandeiras vermelhas."

 # --- Lote 4B: Rota Volkskaiserreich ---
 GER_prince_max_von_baden_cabinet:0 "Gabinete do Príncipe Max von Baden"
 GER_prince_max_von_baden_cabinet_desc:0 "A formação de um ministério plural com os social-democratas institui pela primeira vez o parlamentarismo representativo civil no Império."
 GER_repeal_anti_socialist_heritage:0 "Legalização Total dos Sindicatos"
 GER_repeal_anti_socialist_heritage_desc:0 "A eliminação dos resquícios das leis antissocialistas de Bismarck reconhece os sindicatos como pilares da reconstrução nacional."
 GER_three_class_franchise_abolition_law:0 "Abolição da Lei Eleitoral de Três Classes"
 GER_three_class_franchise_abolition_law_desc:0 "Instituir o voto universal e igualitário na Prússia põe fim ao monopólio eleitoral dos latifundiários Junkers."
 GER_direct_negotiations_with_woodrow_wilson:0 "Negociações Diretas com Washington"
 GER_direct_negotiations_with_woodrow_wilson_desc:0 "Contornando os falcões imperialistas da Entente, negociadores civis dialogam com a Casa Branca por uma paz sem anexações."
 GER_federal_constitutional_monarchy:0 "Monarquia Constitucional Federativa"
 GER_federal_constitutional_monarchy_desc:0 "A reforma constitucional subordina o Chanceler e as decisões de guerra e paz à aprovação soberana da maioria do Reichstag."
 GER_post_war_welfare_and_reconstruction:0 "Reconstrução Econômica e Bem-Estar Social"
 GER_post_war_welfare_and_reconstruction_desc:0 "Seguro-desemprego, saúde pública e pensões de guerra convertem a indústria militar em um motor de prosperidade civil."

 # --- Lote 4B: Rota Vaterlandspartei ---
 GER_kapp_and_tirpitz_rally:0 "Comício Pan-Germânico de Tirpitz e Kapp"
 GER_kapp_and_tirpitz_rally_desc:0 "O Almirante Tirpitz e Wolfgang Kapp mobilizam milhões de ultranacionalistas exigindo a anexação total de territórios inimigos."
 GER_dissolve_the_reichstag:0 "Dissolução do Reichstag"
 GER_dissolve_the_reichstag_desc:0 "Um decreto imperial apoiado pelos canhões militares fecha o parlamento por tempo indeterminado, instituindo uma junta civil-militar."
 GER_annex_the_flemish_coast:0 "Anexar a Costa Flamenga"
 GER_annex_the_flemish_coast_desc:0 "A posse permanente dos portos de Antuérpia e Zeebrugge garante bases navais avançadas de submarinos voltadas contra a Inglaterra."
 GER_colonize_the_eastern_frontier_strip:0 "Faixa de Fronteira Polonesa"
 GER_colonize_the_eastern_frontier_strip_desc:0 "Criar uma barreira de veteranos colonizadores ao longo da fronteira polonesa assegura um baluarte defensivo impenetrável no Leste."
 GER_totalitarian_labor_camps:0 "Mobilização Total de Trabalho"
 GER_totalitarian_labor_camps_desc:0 "A militarização compulsória de civis e prisioneiros extrai a capacidade fabril máxima para abastecer os exércitos imperiais."
 GER_unconditional_victory_or_ruin:0 "Vitória ou Ruína Total"
 GER_unconditional_victory_or_ruin_desc:0 "Recusando qualquer concessão diplomática, a junta alemã combate até o triunfo absoluto ou a destruição gloriosa da nação."

 # --- Lote 4B: Rota Spartakusaufstand ---
 GER_berlin_january_mass_strikes:0 "As Grandes Greves de Janeiro"
 GER_berlin_january_mass_strikes_desc:0 "Centenas de milhares de operários das fábricas de armamentos em Berlim cruzam os braços exigindo paz imediata, pão e liberdade."
 GER_soldiers_and_workers_councils:0 "Conselhos de Soldados e Operários (Räte)"
 GER_soldiers_and_workers_councils_desc:0 "Conselhos populares assumem o controle de quartéis, estações ferroviárias e prefeituras em todas as grandes cidades do Reich."
 GER_proclaim_freie_sozialistische_republik:0 "Proclamação da República Socialista Livre"
 GER_proclaim_freie_sozialistische_republik_desc:0 "Da sacada do Palácio de Berlim, Karl Liebknecht proclama a República Socialista da Alemanha, extinguindo a dinastia imperial."
 GER_dissolve_the_junker_officer_caste:0 "Dissolver a Casta Militar Junker"
 GER_dissolve_the_junker_officer_caste_desc:0 "Destituir os generais aristocráticos prussianos substitui o antigo exército por milícias da Guarda Vermelha proletária."
 GER_alliance_with_soviet_russia:0 "Aliança Fraterna Soviético-Alemã"
 GER_alliance_with_soviet_russia_desc:0 "A união diplomática com a Rússia Soviética funde o parque industrial alemão com os recursos ilimitados do leste."
 GER_socialist_land_and_factory_collectivization:0 "Socialização das Indústrias e Latifúndios"
 GER_socialist_land_and_factory_collectivization_desc:0 "A expropriação dos complexos Krupp e dos latifúndios Junkers transfere o controle dos meios de produção aos conselhos de fábrica."
 GER_world_proletarian_revolution:0 "A Revolução Proletária Mundial"
 GER_world_proletarian_revolution_desc:0 "O Exército Vermelho Alemão marcha para o Ocidente para libertar a classe trabalhadora francesa e britânica do imperialismo."

 # --- Lote 4B: Rotas Alternativas ---
 GER_willy_nicky_personal_summit:0 "O Encontro Imperial Willy-Nicky"
 GER_willy_nicky_personal_summit_desc:0 "Kaiser Wilhelm II e o Czar Nicolau II reúnem-se a bordo dos iates imperiais no Báltico, reativando o Pacto Secreto de Björkö."
 GER_partition_of_british_sphere_asia:0 "Partilha da Esfera Britânica na Ásia"
 GER_partition_of_british_sphere_asia_desc:0 "Protocolos teuto-russos dividem a Pérsia, o Afeganistão e a fronteira norte da Índia em zonas de influência mútua."
 GER_continental_bloc_against_london:0 "O Bloco Continental Contra Londres"
 GER_continental_bloc_against_london_desc:0 "A integração da Rússia e da Alemanha fecha a Eurásia ao poder naval britânico, quebrando a hegemonia marítima de Londres."
 GER_max_von_oppenheim_memorandum:0 "O Memorando de Jihad de Oppenheim"
 GER_max_von_oppenheim_memorandum_desc:0 "O Barão von Oppenheim articula revoltas muçulmanas no Egito, Índia e Sudão para abalar as possessões coloniais da Grã-Bretanha."
 GER_bedouin_and_persian_rebellions:0 "Insurreições Beduínas e Persas"
 GER_bedouin_and_persian_rebellions_desc:0 "Agentes alemães municiam tribos beduínas e nacionalistas persas, sabotando oleodutos da Anglo-Persian Oil Company."
 GER_holy_war_on_the_suez_canal:0 "Ataque ao Canal de Suez"
 GER_holy_war_on_the_suez_canal_desc:0 "Forças conjuntas teuto-otomanas atravessam o Sinai para cortar a artéria vital que liga o Império Britânico à Índia."
 GER_danubian_crisis_annexation_protocol:0 "Protocolo de Emergência Danubiana"
 GER_danubian_crisis_annexation_protocol_desc:0 "Com a desintegração interna do Império Austro-Húngaro, Berlim prepara planos de emergência para proteger a população austríaca."
 GER_incorporate_bohemia_and_austria:0 "Unificação da Grande Alemanha (Großdeutschland)"
 GER_incorporate_bohemia_and_austria_desc:0 "Concretizando o sonho de 1848, a Áustria e os territórios alemães da Boêmia são diretamente anexados ao Império Alemão."

 # --- Lote 4B Espíritos ---
 GER_alpine_corps_offensive:0 "Especialistas de Montanha Alpenkorps"
 GER_alpine_corps_offensive_desc:0 "Treinamento especializado e artilharia de montanha dominam os terrenos alpinos mais íngremes."
 GER_caporetto_momentum:0 "Ímpeto da Ruptura de Caporetto"
 GER_caporetto_momentum_desc:0 "O inimigo está em fuga desordenada pelas estradas alpinas, deixando para trás canhões e suprimentos."
 GER_romanian_oil_concessions:0 "Concessões Petrolíferas de Ploiești"
 GER_romanian_oil_concessions_desc:0 "O petróleo romeno mantém os motores e navios da máquina bélica alemã plenamente abastecidos."
 GER_mitteleuropa_hegemony:0 "Hegemonia de Mitteleuropa"
 GER_mitteleuropa_hegemony_desc:0 "Uma zona econômica unificada e ferrovias integradas tornam a aliança centro-europeia autossuficiente."
 GER_proletarian_red_army:0 "Exército Vermelho Proletário"
 GER_proletarian_red_army_desc:0 "A chama revolucionária e os conselhos de soldados concedem combatividade ímpar às divisões de trabalhadores."
 GER_vaterlandspartei_iron_fist:0 "Guerra Total da Vaterlandspartei"
 GER_vaterlandspartei_iron_fist_desc:0 "A militarização severa das indústrias extrai cada gota de produtividade para o front."
 GER_asienkorps_desert_mastery:0 "Adaptação Desértica do Asienkorps"
 GER_asienkorps_desert_mastery_desc:0 "Equipamentos tropicais e treinamento especializado preparam as tropas para o calor abrasador do deserto."

 # --- Lote 4B Eventos ---
 ww1_germany_events.38.t:0 "Segunda Ypres - A Nuvem Verde"
 ww1_germany_events.38.d:0 "O uso de cloro gasoso em Ypres causou pânico nas linhas inimigas. A era da guerra química e industrializada foi inaugurada."
 ww1_germany_events.38.a:0 "Uma nova e terrível arma de guerra."

 ww1_germany_events.39.t:0 "O Milagre de Caporetto"
 ww1_germany_events.39.d:0 "Tropas de montanha alemãs e austríacas despedaçaram a frente italiana no Isonzo. Mais de 300.000 soldados italianos renderam-se e o exército inimigo foge em debandada."
 ww1_germany_events.39.a:0 "A Itália está de joelhos!"

 ww1_germany_events.40.t:0 "A Queda de Bucareste"
 ww1_germany_events.40.d:0 "O Marechal von Mackensen desfilou pelas avenidas de Bucareste. Os ricos poços petrolíferos e celeiros da Romênia estão sob controle do Império Alemão."
 ww1_germany_events.40.a:0 "Assegurem os poços de petróleo!"

 ww1_germany_events.41.t:0 "Proclamação do Reino da Polônia"
 ww1_germany_events.41.d:0 "Os Imperadores da Alemanha e Áustria-Hungria proclamaram o Manifesto dos Dois Imperadores, restabelecendo a monarquia polonesa independente sob proteção germânica."
 ww1_germany_events.41.a:0 "A Polônia retorna à família europeia."

 ww1_germany_events.42.t:0 "A Ucrânia do Hetman Skoropadsky"
 ww1_germany_events.42.d:0 "Com a garantia militar alemã, o General Pavlo Skoropadsky assumiu o poder como Hetman, garantindo ordem e remessas vitais de trigo para os Impérios Centrais."
 ww1_germany_events.42.a:0 "O celeiro do Leste está aberto."

 ww1_germany_events.43.t:0 "Operação Michael - A Grande Ofensiva"
 ww1_germany_events.43.d:0 "Mais de 6.000 bocas de fogo abriram uma tempestade de aço no Somme. Tropas de choque alemãs romperam a linha britânica e avançam em campo aberto!"
 ww1_germany_events.43.a:0 "Chegou o grande dia!"

 ww1_germany_events.44.t:0 "O Dia Negro em Amiens"
 ww1_germany_events.44.d:0 "Centenas de tanques britânicos rasgaram nossas linhas em Amiens sob a névoa matinal. O General Ludendorff relata que a força moral do exército se esgotou."
 ww1_germany_events.44.a:0 "Devemos buscar termos de paz antes do colapso."

 ww1_germany_events.45.t:0 "Bandeiras Vermelhas em Kiel"
 ww1_germany_events.45.d:0 "Marinheiros da frota em Kiel recusaram ordens de combate e hastearam bandeiras vermelhas nos encouraçados. Conselhos operários tomam o poder no norte da Alemanha."
 ww1_germany_events.45.a:0 "A ordem civil está desmoronando!"

 GER_das_grosse_hauptquartier:0 "Großes Hauptquartier (Quartel-General Imperial)"
 GER_das_grosse_hauptquartier_desc:0 "A consolidação do Grande Quartel-General Imperial garante a coordenação estratégica direta entre o Kaiser, o Estado-Maior e o Ministério da Guerra."
 GER_kaiserliche_werften_expansion:0 "Expansão dos Estaleiros Imperiais"
 GER_kaiserliche_werften_expansion_desc:0 "A modernização dos estaleiros de Wilhelmshaven, Kiel e Danzig acelera as manutenções de encouraçados e a fabricação de cascos de submarinos."

# --- ESPÍRITOS NACIONAIS E IDEIAS ---
 GER_spartakusbund_revolutionary_ardor:0 "Ardor Revolucionário Espartaquista"
 GER_spartakusbund_revolutionary_ardor_desc:0 "O proletariado alemão rompeu as correntes do imperialismo. Soldados e operários unem-se para defender a revolução contra as forças reacionárias e levar a causa socialista a toda a Europa."
 GER_vaterlandspartei_total_mobilization:0 "Mobilização Total da Vaterlandspartei"
 GER_vaterlandspartei_total_mobilization_desc:0 "O Partido da Pátria Pan-Germânico subordinou cada aspecto da vida nacional à guerra total. Greves são punidas como traição e nenhum sacrifício é poupado pela vitória final."
 GER_haber_bosch_nitrogen_miracle_idea:0 "Fixação de Nitrogênio Haber-Bosch"
 GER_haber_bosch_nitrogen_miracle_idea_desc:0 "Ao extrair nitrogênio diretamente da atmosfera, a química alemã quebrou o bloqueio naval britânico de salitre, garantindo munição e fertilizantes ilimitados."
 GER_unrestricted_submarines_active:0 "Guerra Submarina Irrestrita"
 GER_unrestricted_submarines_active_desc:0 "Os submarinos alemães têm ordens para torpedear navios mercantes em direção à Grã-Bretanha sem aviso prévio. Isso asfixia a economia britânica, mas arrisca a entrada dos EUA na guerra."
 german_infiltration_assault_idea:0 "Táticas de Infiltração Sturmtruppen"
 german_infiltration_assault_idea_desc:0 "Evitando pontos fortificados sob a cobertura de bombardeios móveis de artilharia, destacamentos de choque infiltram-se profundamente nas trincheiras inimigas, restaurando a mobilidade tática."
 GER_kaiserschlacht_idea:0 "A Ofensiva da Kaiserschlacht"
 GER_kaiserschlacht_idea_desc:0 "A aposta desesperada da Alemanha pela vitória na Frente Ocidental. Tropas de choque e artilharia em massa tentam romper as linhas aliadas antes da chegada maciça dos reforços americanos."
 GER_turnip_winter_crisis_1:0 "Inverno do Nabo (Escassez Leve)"
 GER_turnip_winter_crisis_1_desc:0 "O bloqueio naval britânico e geadas precoces devastaram a colheita de batatas. Nabos são distribuídos como alimento substituto nas grandes cidades, gerando descontentamento crescente."
 GER_turnip_winter_crisis_2:0 "Inverno do Nabo (Fome Severa)"
 GER_turnip_winter_crisis_2_desc:0 "Desnutrição, cozinhas comunitárias e o frio cortante do inverno assolam a população civil. A produtividade industrial cai vertiginosamente diante da fome dos trabalhadores."
 GER_turnip_winter_crisis_3:0 "Inverno do Nabo (Inanição na Frente Doméstica)"
 GER_turnip_winter_crisis_3_desc:0 "Greves massivas e motins por pão paralisam as cidades. A estrutura social do Império é levada ao limite por uma escassez catastrófica de alimentos."
 GER_hindenburg_program_victory:0 "Triunfo do Programa Hindenburg"
 GER_hindenburg_program_victory_desc:0 "A reorganização monumental da indústria sob o comando da OHL triplicou a produção de munições e mobilizou milhões de civis para o esforço da guerra total."
 GER_schlieffen_momentum:0 "Ímpeto Operacional Schlieffen"
 GER_schlieffen_momentum_desc:0 "A ala direita do exército alemão avança velozmente pela Bélgica e norte da França, buscando envolver Paris antes que os exércitos aliados possam reagir."
 GER_schlieffen_hangover:0 "Ressaca do Plano Schlieffen"
 GER_schlieffen_hangover_desc:0 "O fracasso em tomar Paris destruiu as premissas estratégicas do Estado-Maior. As tropas estão exaustas, o suprimento esticado e a guerra de trincheiras se instala."
 GER_western_triumph:0 "Triunfo no Ocidente"
 GER_western_triumph_desc:0 "Contra todas as probabilidades, os exércitos alemães romperam as linhas aliadas e capturaram Paris, forçando a República Francesa a negociar o armistício."
 GER_trench_stalemate_western_front:0 "Estagnação de Trincheiras no Ocidente"
 GER_trench_stalemate_western_front_desc:0 "Linhas contínuas de arame farpado, ninhos de metralhadoras e abrigos profundos selam a Frente Ocidental em um atrito sangrento e paralisante."
 GER_caporetto_momentum:0 "Ruptura em Caporetto"
 GER_caporetto_momentum_desc:0 "Batalhões alpinos alemães e divisões austro-húngaras desbarataram o Segundo Exército italiano, avançando até o Rio Piave."

 # --- TAGS COSMÉTICAS ---
 GER_ober_ost:0 "Administração Militar Ober Ost"
 GER_ober_ost_DEF:0 "a Administração Militar Ober Ost"
 GER_socialist:0 "República Socialista Livre da Alemanha"
 GER_socialist_DEF:0 "a República Socialista Livre da Alemanha"
 GER_socialist_ADJ:0 "Socialista Alemão"

 # --- TOOLTIPS ---
 ger_reach_paris_success_tt:0 "§GSucesso§!: Paris capturada no prazo! A França será forçada a negociar a rendição."
 ger_reach_paris_fail_tt:0 "§RFalha§!: O avanço estagna. Moltke é desacreditado e a guerra se transforma em atrito sangrento de trincheiras."
 ger_belgium_neutrality_violated_tt:0 "§RViolação da Neutralidade Belga§!: A Grã-Bretanha entrará na guerra para defender o Tratado de Londres."
 ger_belgium_transit_accepted_tt:0 "§ABélgica concede trânsito militar§!: As tropas alemãs atravessam o território belga sem a intervenção britânica imediata."
 ger_unrestricted_sub_us_risk_tt:0 "§RAlto Risco Diplomático§!: Cada navio afundado aproxima os Estados Unidos da declaração de guerra."
 ger_spartakus_revolution_tt:0 "§YA Revolução Proletária§!: Rosa Luxemburg e Karl Liebknecht assumem o poder. A Alemanha torna-se uma República Socialista."
 ger_volkskaiserreich_transition_tt:0 "§YTransformação Constitucional§!: O Reichstag assume supremacia parlamentar. A Alemanha torna-se uma Monarquia Constitucional Democrática."
 ger_vaterlandspartei_takeover_tt:0 "§RDitadura Nacionalista§!: Wolfgang Kapp e Alfred von Tirpitz estabelecem um regime autoritário voltado a anexações totais."
 ger_ohl_dictatorship_tt:0 "§YSupremacia Militar§!: O Marechal Paul von Hindenburg e Erich Ludendorff assumem controle total dos destinos da Alemanha."
# --- NOVOS FOCOS ALEMÃES ---
 GER_smash_general_strikes:0 "Esmagar a Greve Geral no Ruhr"
 GER_smash_general_strikes_desc:0 "Sindicatos e operários socialistas declararam uma greve geral nacional contra o nosso governo patriótico. Mobilizar os Freikorps e a polícia armada para proteger as fábricas e minas pela força."
 GER_siegfrieden_manifesto:0 "O Manifesto de Siegfrieden"
 GER_siegfrieden_manifesto_desc:0 "Rejeitamos categoricamente qualquer paz de compromisso ou rendição covarde. A Alemanha lutará até a vitória total, ditando termos e anexações por toda a Europa."
 GER_consolidate_red_republic:0 "Consolidar a República Socialista"
 GER_consolidate_red_republic_desc:0 "Os operários armados e marinheiros revolucionários derrotaram a casta militar reacionária. Os Conselhos de Trabalhadores e Soldados assumem agora a soberania total sobre as terras alemãs."
 GER_baltic_crusade_landeswehr:0 "A Cruzada Báltica da Landeswehr"
 GER_baltic_crusade_landeswehr_desc:0 "A nobreza germano-báltica e brigadas de voluntários Freikorps marcham para o nordeste para esmagar os partidários bolcheviques e garantir as históricas províncias da Livônia, Curlândia e Estônia para o Reich."
 GER_entente_anti_bolshevik_intervention:0 "Esmagar a Contra-Revolução da Entente"
 GER_entente_anti_bolshevik_intervention_desc:0 "As potências imperialistas de Londres e Paris recusam-se a coexistir com uma Alemanha Vermelha. Enquanto seus exércitos de intervenção se mobilizam na fronteira, os guardas vermelhos proletários preparam-se para o combate decisivo."
 GER_caucasus_baku_expedition:0 "Operação Faustschlag: A Marcha para Baku"
 GER_caucasus_baku_expedition_desc:0 "Para abastecer nossa máquina bélica e garantir o sustento industrial do continente, a expedição alemã ao Cáucaso deve capturar os poços de petróleo vitais de Baku antes que britânicos ou turcos possam fazê-lo."

 # --- PERSONAGENS ALEMÃES ---
 GER_wilhelm_ii:0 "Guilherme II"
 GER_friedrich_ebert:0 "Friedrich Ebert"
 GER_karl_liebknecht:0 "Karl Liebknecht"
 GER_wolfgang_kapp:0 "Wolfgang Kapp"
 GER_paul_von_hindenburg:0 "Paul von Hindenburg"
 GER_erich_ludendorff:0 "Erich Ludendorff"
 GER_theobald_von_bethmann_hollweg:0 "Theobald von Bethmann-Hollweg"
 GER_rosa_luxemburg:0 "Rosa Luxemburgo"
 GER_alfred_von_tirpitz:0 "Alfred von Tirpitz"

 # --- NOVAS IDEIAS ---
 GER_civil_war_fervor:0 "Fervor Revolucionário de Guerra Civil"
 GER_civil_war_fervor_desc:0 "Ambos os lados lutam pela própria alma da nação. Os combates são frenéticos e decisivos, sem espaço para estagnações prolongadas."
 GER_red_guards_militia:0 "Destacamentos Armados da Guarda Vermelha"
 GER_red_guards_militia_desc:0 "Operários de estaleiros, marinheiros amotinados de Kiel e o proletariado industrial empunham fuzis e estandartes vermelhos em defesa da revolução."
 GER_freikorps_paramilitary:0 "Divisões de Ferro dos Freikorps"
 GER_freikorps_paramilitary_desc:0 "Veteranos das trincheiras, oficiais aristocratas e voluntários nacionalistas organizados em brigadas de choque para erradicar a agitação socialista."
 GER_continental_league_idea:0 "O Eixo Continental Germano-Russo"
 GER_continental_league_idea_desc:0 "Ao unir a colossal massa terrestre russa à indústria pesada alemã, o cerco naval anglo-saxão é despedaçado para sempre."
 GER_baku_oil_concession:0 "Concessão Petrolífera de Baku"
 GER_baku_oil_concession_desc:0 "Um fluxo constante de petróleo bruto corre do Mar Cáspio diretamente para as refinarias alemãs, encerrando nossa escassez crônica de combustível."

 # --- ADJETIVOS COSMÉTICOS ---
 GER_ober_ost_ADJ:0 "de Ober Ost"

 # --- NOVOS EVENTOS 50 - 66 ---
 ww1_germany_events.50.t:0 "Motim em Kiel e Greves nas Fábricas"
 ww1_germany_events.50.d:0 "As chamas da agitação socialista espalharam-se pelo país! Em Kiel, Wilhelmshaven e por toda a bacia industrial do Ruhr, os marinheiros hastearam bandeiras vermelhas em seus couraçados e uniram-se aos operários industriais em greves armadas. As autoridades imperiais perdem o controle da ordem pública."
 ww1_germany_events.50.a:0 "A classe trabalhadora não aceitará mais o silêncio!"

 ww1_germany_events.51.t:0 "Eclosão da Guerra Civil Alemã!"
 ww1_germany_events.51.d:0 "O ápice da revolução espartaquista chegou. Em Berlim, Karl Liebknecht e Rosa Luxemburgo proclamaram a República Socialista Livre nos degraus do palácio, enquanto os guardas vermelhos tomam quartéis e terminais ferroviários. O Alto Comando Imperial e oficiais monarquistas fugiram para o leste para organizar os Freikorps. A guerra civil começou!"
 ww1_germany_events.51.a:0 "Às barricadas! Vitória ou morte!"

 ww1_germany_events.52.t:0 "Vitória dos Guardas Vermelhos: A República Socialista"
 ww1_germany_events.52.d:0 "As forças reacionárias desmoronaram diante do avanço fulminante dos operários armados e marinheiros revolucionários. O trono imperial foi permanentemente abolido. Rosa Luxemburgo e Karl Liebknecht discursam para um mar de bandeiras vermelhas em Berlim, inaugurando a República Socialista dos Conselhos."
 ww1_germany_events.52.a:0 "Viva a República Socialista Livre da Alemanha!"

 ww1_germany_events.53.t:0 "O Eixo Comunista Petrogrado-Berlim"
 ww1_germany_events.53.d:0 "Com a bandeira vermelha tremulando em Berlim e em Petrogrado, a solidariedade proletária europeia torna-se uma realidade invencível. Enviados da Rússia Soviética chegaram a Berlim para formalizar a Internacional Vermelha, fundindo as matérias-primas e população russas com o poder industrial alemão."
 ww1_germany_events.53.a:0 "Proletários de todos os países, uni-vos!"

 ww1_germany_events.54.t:0 "Intervenção da Entente Contra a Alemanha Vermelha"
 ww1_germany_events.54.d:0 "As potências capitalistas da Grã-Bretanha e França encaram a aliança germano-soviética como uma ameaça mortal à ordem global. Declarando que o bolchevismo na Europa Central precisa ser extirpado a ferro e fogo, a Entente ordenou a invasão imediata de nossas fronteiras!"
 ww1_germany_events.54.a:0 "Defenderemos a Revolução com nosso sangue!"

 ww1_germany_events.55.t:0 "Crise Constitucional: A Franquia Prussiana"
 ww1_germany_events.55.d:0 "O Chanceler Bethmann-Hollweg apresentou uma histórica proposta de lei no Landtag para abolir o arcaico sistema eleitoral de três classes da Prússia em prol do voto igual. Os latifundiários Junkers e generais aristocratas reagiram com fúria, ameaçando paralisar o estado."
 ww1_germany_events.55.a:0 "A vontade do povo deve superar privilégios feudais."

 ww1_germany_events.56.t:0 "As Reformas de Outubro: Uma Monarquia Parlamentar"
 ww1_germany_events.56.d:0 "Diante das exigências populares por democracia e um governo moderno, o Kaiser Guilherme II promulgou as Reformas de Outubro. O Chanceler e o exército passam a ser estritamente subordinados ao Reichstag eleito, com líderes da maioria civil assumindo os ministérios."
 ww1_germany_events.56.a:0 "O povo alemão governa seu próprio destino."

 ww1_germany_events.57.t:0 "Missão de Paz em Washington"
 ww1_germany_events.57.d:0 "Contornando a intransigência e vingança de Londres e Paris, nossa missão diplomática chegou a Washington D.C. para aceitar os Quatorze Pontos do Presidente Woodrow Wilson como a base formal para um armistício honroso e duradouro."
 ww1_germany_events.57.a:0 "Que a paz e a razão prevaleçam sobre a carnificina."

 ww1_germany_events.58.t:0 "O Golpe de Estado de Kapp-Tirpitz!"
 ww1_germany_events.58.d:0 "Nas primeiras horas da madrugada, brigadas armadas dos Freikorps e regimentos de fuzileiros navais ocuparam os ministérios de Berlim sob a liderança de Wolfgang Kapp e do Grão-Almirante Alfred von Tirpitz. Declarando os civis depostos por traição à pátria, a Vaterlandspartei assume controle autoritário total!"
 ww1_germany_events.58.a:0 "A ordem foi restaurada! Glória à Pátria!"

 ww1_germany_events.59.t:0 "A Greve Geral no Ruhr é Esmagada"
 ww1_germany_events.59.d:0 "Em represália contra o golpe de estado nacionalista, as centrais sindicais decretaram greve geral nas minas e usinas do Ruhr. O governo militar agiu com máxima violência: esquadrões de choque e metralhadoras ocuparam as siderúrgicas, fuzilando agitadores e forçando a retomada da produção."
 ww1_germany_events.59.a:0 "A produção de guerra não será interrompida por rebeldes."

 ww1_germany_events.60.t:0 "A Cruzada Báltica da Landeswehr"
 ww1_germany_events.60.d:0 "Os voluntários Freikorps e a nobreza germano-báltica iniciaram uma ofensiva militar massiva ao longo de todo o litoral báltico. Avançando por Riga, Reval e Mitau, nossas tropas consolidam a anexação territorial direta do Báltico ao Império Alemão."
 ww1_germany_events.60.a:0 "O legado dos Cavaleiros Teutônicos renasce no Leste!"

 ww1_germany_events.61.t:0 "O Ultimato de Anexação de Siegfrieden"
 ww1_germany_events.61.d:0 "O governo imperial apresentou suas exigências finais: a anexação definitiva da costa de Flandres, as fortalezas de Liège, Luxemburgo e as ricas bacias mineradoras de Longwy-Briey. Rejeitamos qualquer paz que não conceda à Alemanha o domínio estratégico total do Oeste."
 ww1_germany_events.61.a:0 "Tomamos o que o sangue alemão conquistou!"

 ww1_germany_events.62.t:0 "A Cúpula Secreta em Björkö"
 ww1_germany_events.62.d:0 "A bordo do iate imperial Hohenzollern, nas águas isoladas de Björkö, o Kaiser Guilherme II e o Tsar Nicolau II concluíram um acordo histórico. Os dois monarcas assinaram um pacto secreto de não-agressão e cooperação mútua, desmantelando a aliança entre Rússia e França!"
 ww1_germany_events.62.a:0 "Um bloco continental para romper o cerco britânico."

 ww1_germany_events.63.t:0 "A Liga Continental Enfrenta o Império Britânico"
 ww1_germany_events.63.d:0 "O acordo secreto de Björkö gerou seus frutos históricos. Berlim e Petrogrado anunciaram oficialmente a formação da Liga Continental, declarando guerra ao Império Britânico e iniciando operações conjuntas para expulsar a Grã-Bretanha da Pérsia, do Oriente Médio e da Índia!"
 ww1_germany_events.63.a:0 "O domínio naval britânico chegou ao fim!"

 ww1_germany_events.64.t:0 "O Colapso da Monarquia Austro-Húngara"
 ww1_germany_events.64.d:0 "Séculos de domínio dos Habsburgos desintegraram-se em dias. Revoltas étnicas, fome generalizada e o esfacelamento do exército imperial deixaram Viena impotente. O caos consome toda a bacia danubiana, deixando nossa fronteira sul aberta."
 ww1_germany_events.64.a:0 "Devemos intervir imediatamente para proteger as terras alemãs!"

 ww1_germany_events.65.t:0 "O Confronto Alpino: Guerra com a Itália!"
 ww1_germany_events.65.d:0 "Enquanto divisões alemãs avançam para ocupar Viena, Graz e Innsbruck a fim de integrar a Áustria alemã ao Reich, tropas italianas cruzaram a fronteira em massa para capturar o Tirol Meridional e Trieste. Nossas tropas de montanha enfrentam os italianos nos Alpes!"
 ww1_germany_events.65.a:0 "Expulsar os italianos de volta para além do Rio Pó!"

 ww1_germany_events.66.t:0 "Operação Faustschlag: A Marcha para Baku"
 ww1_germany_events.66.d:0 "Nosso corpo expedicionário avançou com sucesso pelos desfiladeiros do Cáucaso, dispersando defensores e capturando as lendárias torres de petróleo de Baku no Mar Cáspio. Comboios ferroviários de combustível já começam a rodar em direção à Alemanha."
 ww1_germany_events.66.a:0 "O sangue negro da guerra moderna é nosso!"
# --- FOCOS HISTÓRICOS DE 1916-1918 ---
 GER_operation_gericht_verdun:0 "Operação Gericht: O Inferno de Verdun"
 GER_operation_gericht_verdun_desc:0 "O Chefe do Estado-Maior Erich von Falkenhayn apresenta seu memorando decisivo: a França deve sangrar até morrer em Verdun. Ao tomar as colinas que dominam as históricas fortalezas do Mosa, o exército francês será obrigado a contra-atacar dentro de um anel concentrado da artilharia pesada alemã."
 GER_hold_the_somme_line:0 "Resistir na Linha do Somme a Todo Custo"
 GER_hold_the_somme_line_desc:0 "O Quarto Exército Britânico desencadeou uma tempestade de metal sobre as colinas da Picardia. Nossa infantaria deve abrigar-se em abrigos subterrâneos profundos (Stollen) e emergir através da poeira com metralhadoras prontas para rechaçar as ondas aliadas."
 GER_falkenhayn_dismissal_third_ohl:0 "A Queda de Falkenhayn e a 3ª OHL"
 GER_falkenhayn_dismissal_third_ohl_desc:0 "O atrito desastroso em Verdun e a entrada da Romênia na guerra obrigam o Kaiser a demitir Falkenhayn. O Marechal Paul von Hindenburg e o General Erich Ludendorff assumem o comando supremo, inaugurando a Terceira OHL e subordinando toda a vida civil e econômica à guerra total."
 GER_elastic_defense_in_depth:0 "Doutrina de Defesa Elástica em Profundidade"
 GER_elastic_defense_in_depth_desc:0 "O Coronel Fritz von Lossberg reescreve a guerra defensiva: as linhas rígidas de trincheira da frente são abandonadas. Linhas avançadas finas absorvem o primeiro impacto, enquanto zonas de batalha e divisões especializadas de contra-ataque (Eingreif-Divisionen) aniquilam as brechas."
 GER_gas_warfare_yellow_cross_lost:0 "Guerra Química: Cruz Amarela (Lost)"
 GER_gas_warfare_yellow_cross_lost_desc:0 "Nossos conglomerados químicos em Leverkusen entregam a arma suprema de terror: o gás mostarda (Gelbkreuz). Um agente vesicante oleoso e persistente que impregna o solo e os uniformes, cegando e incapacitando corpos de exército inteiros."
 GER_bruchmueller_feuerwalze_doctrine:0 "A Artilharia de Bruchmüller (Feuerwalze)"
 GER_bruchmueller_feuerwalze_doctrine_desc:0 "O Coronel Georg Bruchmüller desenvolve o bombardeio surpresa sem tiro de aferição. Cálculos matemáticos baseados nas condições atmosféricas eliminam o pré-registro, liberando um furacão rolante de gás e altos explosivos diretamente à frente dos Stosstruppen."
 GER_paris_gun_super_battery:0 "O Canhão de Paris: Krupp Ferngeschütz"
 GER_paris_gun_super_battery_desc:0 "Oculto nas florestas de Crépy, o colossal canhão de longo alcance de 210mm da Krupp dispara projéteis a 40 quilômetros na estratosfera, bombardeando Paris a mais de 120 quilômetros de distância e destruindo o moral civil francês."
 GER_gotha_raids_on_london:0 "Raides de Bombardeiros Gotha: Operação Türkenkreuz"
 GER_gotha_raids_on_london_desc:0 "Substituindo os vulneráveis dirigíveis, bombardeiros pesados bimotores Gotha G.IV atacam Londres e o sul da Inglaterra em plena luz do dia. O pânico atinge o público britânico, forçando o Gabinete de Guerra a retirar esquadrões de caça da França para defender a capital."
 GER_fokker_d_vii_air_supremacy:0 "Supremacia Aérea com o Fokker D.VII"
 GER_fokker_d_vii_air_supremacy_desc:0 "Anthony Fokker e Reinhold Platz revelam a obra-prima da aviação alemã: o Fokker D.VII. Com asas espessas sem estais e motor BMW de grande altitude, os esquadrões de caça alemães impõem domínio incontestável sobre os céus da Frente Ocidental."
 GER_treaty_of_bucharest_1918:0 "O Tratado de Bucareste (1918)"
 GER_treaty_of_bucharest_1918_desc:0 "Completamente isolada após a queda do Império Russo, a Romênia capitula. Pela Paz de Bucareste, a Alemanha garante a concessão exclusiva por 90 anos dos campos petrolíferos de Ploiești e o controle econômico sobre os carregamentos de grãos do Danúbio."
 GER_operation_michael_st_quentin:0 "Operação Michael: A Ofensiva de São Quintino"
 GER_operation_michael_st_quentin_desc:0 "21 de março de 1918. Na névoa da alvorada ao longo do Somme, 6.000 canhões alemães abrem fogo. A barragem móvel de Bruchmüller varre as trincheiras britânicas, seguida de perto por Stosstruppen armados com submetralhadoras e lança-chamas, abrindo uma brecha de 60 km no Quinto Exército Britânico."
 GER_spanish_flu_epidemic_crisis:0 "A Epidemia da Gripe Espanhola de 1918"
 GER_spanish_flu_epidemic_crisis_desc:0 "Uma peste respiratória letal e virulenta espalha-se pelas trincheiras desnutridas e pelas cidades da retaguarda. Centenas de milhares de soldados calejados caem com febres mortais, paralisando o ímpeto operacional justamente quando o destino da guerra estava em jogo."
 GER_collapse_of_central_allies:0 "O Efeito Dominó: O Colapso dos Aliados Centrais"
 GER_collapse_of_central_allies_desc:0 "A Bulgária desmorona em Dobro Pole; o Império Otomano assina o Armistício de Mudros; a Áustria-Hungria desintegra-se em repúblicas nacionais. A Alemanha vê-se completamente solitária, sitiada em todas as fronteiras com suas reservas esgotadas."
 GER_fleet_sortie_order_mutiny:0 "A Ordem de Saída Suicida da Frota de Alto-Mar"
 GER_fleet_sortie_order_mutiny_desc:0 "A ordem secreta do Almirantado de enviar a Frota de Alto-Mar para uma batalha suicida no Canal da Mancha para salvar a honra naval gera um motim imediato. Marinheiros apagam as caldeiras dos couraçados e prendem seus comandantes. Bandeiras vermelhas são hasteadas em Kiel."
 GER_kaiser_abdication_amerongen:0 "A Abdicação do Kaiser e a Fuga a Amerongen"
 GER_kaiser_abdication_amerongen_desc:0 "Com greves gerais paralisando Berlim e a revolução batendo à porta, o Chanceler Príncipe Max von Baden anuncia a abdicação de Guilherme II. Abandonado pelo alto comando em Spa, o Kaiser embarca no trem imperial e cruza a fronteira holandesa para o exílio em Amerongen."
 GER_armistice_at_compiegne:0 "O Armistício na Floresta de Compiègne"
 GER_armistice_at_compiegne_desc:0 "Em um vagão de trem isolado na floresta de Compiègne, a delegação alemã liderada pelo político civil Matthias Erzberger assina o cessar-fogo com o Marechal Ferdinand Foch. Às 11 horas do 11º dia do 11º mês de 1918, os canhões calam-se. A Grande Guerra chega ao fim."
 GER_the_stab_in_the_back_myth:0 "A Lenda da 'Punhalada pelas Costas' (Dolchstoß)"
 GER_the_stab_in_the_back_myth_desc:0 "As tropas que retornam do fronte desfilam sob o Portão de Brandemburgo aclamadas por Ebert como 'invictas no campo de batalha'. O General Ludendorff e círculos monarquistas forjam a narrativa de que o exército heróico nunca foi derrotado em combate, mas traído pelos políticos da retaguarda."
 GER_siegfrieden_peace_with_france:0 "A Paz de Potsdam: Siegfrieden no Ocidente"
 GER_siegfrieden_peace_with_france_desc:0 "Com a queda de Paris e o rompimento total das linhas francesas nas Ofensivas de Primavera de 1918, a República Francesa assina a Paz de Potsdam. A Alemanha anexa a bacia mineral de Briey e Longwy, estabelece um protetorado definitivo sobre a Bélgica e atinge a hegemonia continental indisputada."
 GER_mittelafrika_colonial_empire:0 "A Realização de Mittelafrika"
 GER_mittelafrika_colonial_empire_desc:0 "Pelos tratados de paz vitoriosos, nosso sonho colonial torna-se realidade. O Congo Belga e territórios da África Equatorial Francesa são anexados, criando um império colonial alemão contíguo que se estende do Atlântico até o Oceano Índico."

 # --- IDEIAS DE 1916-1918 ---
 GER_verdun_meatgrinder:0 "Operação Gericht: O Atrito de Verdun"
 GER_verdun_meatgrinder_desc:0 "Uma estratégia implacável para esgotar o inimigo através do fogo maciço de artilharia pesada, causando perdas descomunais a um custo severo para nossas próprias tropas de assalto."
 GER_somme_defensive_grit:0 "Defesa de Ferro do Somme"
 GER_somme_defensive_grit_desc:0 "Tropas abrigadas em profundos bunkers subterrâneos suportam bombardeios devastadores e defendem as linhas de trincheira contra forças numericamente superiores."
 GER_defense_in_depth_doctrine:0 "Defesa Elástica em Profundidade"
 GER_defense_in_depth_doctrine_desc:0 "Uma doutrina tática flexível onde as trincheiras avançadas funcionam como anteparos de absorção, enquanto reservas de contra-ataque liquidam penetrações com manobras velozes."
 GER_bruchmueller_artillery:0 "Artilharia Furacão de Bruchmüller"
 GER_bruchmueller_artillery_desc:0 "Bombardeios surpresa sem tiro de registro, combinando gás e altos explosivos para paralisar as redes de comunicação e as guarnições inimigas."
 GER_paris_gun_terror:0 "Bombardeio Estratosférico de Longo Alcance"
 GER_paris_gun_terror_desc:0 "Super-canhões Krupp que disparam na estratosfera semeiam o pânico e o desespero nos centros de comando da capital inimiga."
 GER_mustard_gas_arsenal:0 "Arsenal Vesicante de Cruz Amarela"
 GER_mustard_gas_arsenal_desc:0 "Gás mostarda persistente que contamina o terreno e as trincheiras, infligindo terríveis queimaduras e paralisia tática nas defesas inimigas."
 GER_spanish_flu_pandemic:0 "Surto da Gripe Espanhola"
 GER_spanish_flu_pandemic_desc:0 "Uma pandemia mortal de influenza atinge a população desnutrida e as divisões do fronte, drenando as reservas humanas e paralisando a produção fabril."
 GER_stab_in_the_back_myth:0 "O Mito do Dolchstoß"
 GER_stab_in_the_back_myth_desc:0 "A crença de que nossas forças armadas permaneceram invictas nos campos de batalha, alimentando o revanchismo militarista e divisões políticas internas."
 GER_siegfrieden_hegemony:0 "Hegemonia Continental de Siegfrieden"
 GER_siegfrieden_hegemony_desc:0 "A vitória total nos campos de batalha da Europa concede ao Império Alemão o domínio político, industrial e estratégico incontestado sobre o continente europeu."

 # --- EVENTOS DE 1916-1918 ---
 ww1_germany_events.70.t:0 "Operação Gericht: A Batalha de Verdun"
 ww1_germany_events.70.d:0 "O General von Falkenhayn apresentou seu grande memorando ao Kaiser. Em vez de uma ofensiva para romper as linhas, ele propõe sangrar a França até o esgotamento ao redor do complexo de fortalezas de Verdun. Se os franceses defenderem as colinas de Douaumont e Vaux, seus exércitos serão triturados por um anel de 1.200 canhões pesados alemães."
 ww1_germany_events.70.a:0 "Sangrá-los até o fim nas colinas do Mosa!"

 ww1_germany_events.71.t:0 "A Queda de Falkenhayn e a 3ª OHL"
 ww1_germany_events.71.d:0 "O massacre em Verdun resultou em baixas monumentais sem vitória estratégica decisiva. Com a Romênia declarando guerra, o Kaiser Guilherme demitiu Falkenhayn. O Marechal von Hindenburg e o General Ludendorff assumem o comando, subordinando toda a economia civil às necessidades da guerra total."
 ww1_germany_events.71.a:0 "A dupla de Tannenberg assume o leme do destino alemão."

 ww1_germany_events.72.t:0 "Projéteis da Estratosfera: O Canhão de Paris"
 ww1_germany_events.72.d:0 "Da floresta de Crépy, o canhão de 210mm Paris-Geschütz da Krupp disparou seu projétil na estratosfera, subindo 40 quilômetros de altitude antes de despencar no centro de Paris. O governo francês está em choque: fogo de artilharia cai sobre a capital disparado de trás de linhas a mais de 120 km de distância!"
 ww1_germany_events.72.a:0 "O terror atinge o coração da França!"

 ww1_germany_events.73.t:0 "Gothas Sobre Londres: Operação Türkenkreuz"
 ww1_germany_events.73.d:0 "Esquadrões de bombardeiros pesados bimotores Gotha G.IV surgiram sobre Londres em plena luz do dia, despejando bombas explosivas nas estações ferroviárias e docas. O público britânico entrou em pânico, e o Gabinete Britânico foi obrigado a retirar esquadrões de caça da França para defender o solo britânico."
 ww1_germany_events.73.a:0 "A Grã-Bretanha não é mais uma ilha inalcançável."

 ww1_germany_events.74.t:0 "A Paz de Bucareste"
 ww1_germany_events.74.d:0 "Isolada de qualquer auxílio e derrotada, a Romênia assinou o Tratado de Bucareste. A Alemanha garantiu a concessão exclusiva por 90 anos dos campos petrolíferos de Ploiești, além de transferências de grãos e direitos de navegação no Danúbio, garantindo o combustível vital para nossa guerra."
 ww1_germany_events.74.a:0 "O petróleo romeno abastece nossas divisões."

 ww1_germany_events.75.t:0 "Operação Michael: A Ofensiva de Primavera de 1918"
 ww1_germany_events.75.d:0 "Às 4:40 da manhã, milhares de canhões alemães abrem fogo ao longo do Somme. A barragem móvel de Bruchmüller varre as trincheiras britânicas, seguida de perto pelos Stosstruppen armados com submetralhadoras e lança-chamas. O Quinto Exército Britânico é despedaçado, e nossas tropas avançam 60 km em dois dias!"
 ww1_germany_events.75.a:0 "A Kaiserschlacht começou! Em marcha para o Canal!"

 ww1_germany_events.76.t:0 "A Gripe Espanhola Atinge o Fronte"
 ww1_germany_events.76.d:0 "Uma cepa assustadora e mortal de influenza alastra-se pela Frente Ocidental. Soldados de assalto desnutridos, enfraquecidos por anos de pão de nabo e lama, colapsam aos milhares. Com regimentos inteiros acamados com febre, nosso ímpeto operacional estagna dramaticamente."
 ww1_germany_events.76.a:0 "Um inimigo implacável dentro de nossas próprias trincheiras."

 ww1_germany_events.77.t:0 "O Efeito Dominó: O Colapso dos Aliados Centrais"
 ww1_germany_events.77.d:0 "O desastre atingiu todos os frontes externos. A Bulgária capitulou em Salônica; o Império Otomano assinou o Armistício de Mudros; e a Áustria-Hungria desfez-se em repúblicas independentes. A Alemanha encontra-se totalmente solitária contra a Entente."
 ww1_germany_events.77.a:0 "O anel de ferro fecha-se ao redor da Pátria."

 ww1_germany_events.78.t:0 "Motim na Frota de Alto-Mar"
 ww1_germany_events.78.d:0 "A ordem secreta do Almirantado para uma saída naval suicida no Canal da Mancha causou um levante armado. Marinheiros a bordo do SMS Thüringen e Helgoland apagaram as caldeiras e prenderam os oficiais. Estandartes vermelhos foram hasteados nos navios de guerra em Kiel, e a revolta alastra-se para terra."
 ww1_germany_events.78.a:0 "Os marinheiros recusaram-se a morrer em vão."

 ww1_germany_events.79.t:0 "A Abdicação do Kaiser e a Fuga para a Holanda"
 ww1_germany_events.79.d:0 "Com greves gerais paralisando Berlim e conselhos operários tomando o poder, o Chanceler Príncipe Max von Baden anuncia a abdicação do Kaiser Guilherme II. Traído pelo alto comando militar em Spa, o Kaiser embarca no trem imperial e cruza a fronteira holandesa rumo ao exílio em Amerongen."
 ww1_germany_events.79.a:0 "O Império Alemão sucumbiu."

 ww1_germany_events.80.t:0 "O Armistício na Floresta de Compiègne"
 ww1_germany_events.80.d:0 "Em um vagão de trem na floresta de Compiègne, a delegação alemã liderada pelo político civil Matthias Erzberger assina o cessar-fogo com o Comandante Supremo Aliado Ferdinand Foch. Às 11 horas do 11º dia do 11º mês de 1918, os canhões calam-se. A Grande Guerra terminou."
 ww1_germany_events.80.a:0 "Os quatro anos de massacre chegaram ao fim."

 ww1_germany_events.81.t:0 "O Tratado de Potsdam: Siegfrieden no Ocidente"
 ww1_germany_events.81.d:0 "Após o avanço fulminante das Ofensivas de Primavera de 1918 e a ocupação de Paris, a República Francesa assinou a Paz de Potsdam. A Alemanha anexa a bacia mineral de Briey, assume o controle das defesas belgas e dita a paz na Europa Ocidental. A Alemanha Imperial é senhora do continente!"
 ww1_germany_events.81.a:0 "Uma paz triunfante comprada com sangue alemão!"

 ww1_germany_events.82.t:0 "A Conquista de Mittelafrika"
 ww1_germany_events.82.d:0 "Pelos tratados de paz, nosso sonho colonial foi concretizado. O Congo Belga e territórios coloniais franceses foram anexados, criando um vasto domínio colonial contíguo que vai da costa de Camarões no Atlântico até a África Oriental Alemã no Oceano Índico. O General von Lettow-Vorbeck desfila em Berlim como herói triunfante."
 ww1_germany_events.82.a:0 "Viva a Mittelafrika alemã!"

 # 4 Novos Focos Históricos do Kaiser & Mecânicas
 GER_septemberprogramm_war_aims:0 "[Histórico] Metas de Guerra do Septemberprogramm"
 GER_septemberprogramm_war_aims_desc:0 "Elaborado pelo Chanceler von Bethmann-Hollweg e pelo Estado-Maior, o Septemberprogramm traça os objetivos supremos do Reich: estabelecer a hegemonia econômica na Mitteleuropa, anexações estratégicas no Leste e neutralizar a capacidade da França e da Bélgica de ameaçarem o solo germânico."
 GER_total_war_patriotism_kriegsanleihen:0 "[Histórico] Títulos de Guerra Imperiais (Kriegsanleihen)"
 GER_total_war_patriotism_kriegsanleihen_desc:0 "Para financiar os custos monumentais da guerra moderna, o Reichsbank lança campanhas públicas de emissão de títulos de guerra (Kriegsanleihen). Milhões de cidadãos investem suas poupanças para abastecer a máquina bélica do Reich."
 GER_hohenzollern_imperial_hegemony:0 "[Histórico] Hegemonia Imperial dos Hohenzollern"
 GER_hohenzollern_imperial_hegemony_desc:0 "Consolidando a autoridade suprema da coroa imperial, a dinastia Hohenzollern lidera o destino do continente. Sob a liderança do Kaiser e a bravura do exército, a Alemanha assegura uma duradoura Pax Germanica."
 GER_secret_ottoman_alliance_august_1914:0 "[Histórico] Aliança Secreta Germano-Otomana"
 GER_secret_ottoman_alliance_august_1914_desc:0 "Em 2 de agosto de 1914, o Embaixador Wangenheim e o Grão-Vizir Said Halim Paxá selam uma aliança militar secreta em Constantinopla. O Império Otomano assume o compromisso de combater ao lado das Potências Centrais contra a Rússia."
 ger_septemberprogramm_tt:0 "Formaliza as metas de guerra imperiais para assegurar a hegemonia política e econômica na Mitteleuropa."
 GER_kriegsanleihen_war_loans:0 "Títulos de Guerra Kriegsanleihen"
 GER_kriegsanleihen_war_loans_desc:0 "Títulos da dívida de guerra subscritos por milhões de cidadãos patriotas financiam a compra de munições, artilharia pesada e navios."
 GER_volkskaiserreich_constitution:0 "Constituição da Volkskaiserreich"
 GER_volkskaiserreich_constitution_desc:0 "As reformas parlamentares constitucionais subordinam o comando militar ao Reichstag eleito, unindo as classes sociais sob uma monarquia democrática moderna."
 creeping_barrage_idea:0 "Táticas de Barragem Rolante"
 creeping_barrage_idea_desc:0 "Uma cortina de projéteis de artilharia sincronizada avança à frente das vagas de infantaria, esmagando os ninhos de metralhadora inimigos."

 # REWORKED POLITICS & EXPANSION WING (BRAZ_POR)
 GER_kaiser_wilhelm_personal_rule: "Governo Pessoal do Kaiser Wilhelm II"
 GER_kaiser_wilhelm_personal_rule_desc: "O Imperador Wilhelm II exerce autoridade suprema sobre o Império Alemão, equilibrando ministros civis contra o gabinete militar e as facções da corte em Berlim."
 GER_reichstag_1912_elections: "Eleições do Reichstag de 1912"
 GER_reichstag_1912_elections_desc: "As históricas eleições de 1912 consagram a ascensão do Partido Social-Democrata (SPD), que alcança 110 assentos e se torna o maior bloco parlamentar, abrindo uma crise constitucional sem precedentes."
 GER_volkerschlacht_centenary_1913: "Centenário da Batalha de Leipzig"
 GER_volkerschlacht_centenary_1913_desc: "A inauguração solene do Völkerschlachtdenkmal comemora a libertação de 1813, reacendendo o orgulho nacional e a coesão imperial por todas as terras alemãs."
 GER_reichstag_social_concessions: "Concessões Sociais do Reichstag"
 GER_reichstag_social_concessions_desc: "A aprovação de reformas trabalhistas progressistas e a expansão do seguro-saúde acalmam a oposição operária e contêm revoltas nas cidades industriais."
 GER_appease_the_junkers: "Apaziguar os Junkers Prussianos"
 GER_appease_the_junkers_desc: "A proteção às tarifas agrícolas de grãos e aos privilégios aristocráticos assegura a lealdade incondicional da nobreza da Prússia Oriental e do corpo de oficiais conservadores."
 GER_prussian_franchise_debate: "Debate do Voto Tripartido Prussiano"
 GER_prussian_franchise_debate_desc: "O obsoleto sistema eleitoral de três classes na Prússia divide o império entre reacionários apegados a privilégios e reformistas exigindo sufrágio universal e igualitário."
 GER_burgfrieden_declaration_1914: "Declaração de Burgfrieden"
 GER_burgfrieden_declaration_1914_desc: "Com a eclosão da guerra europeia, o Kaiser declara: 'Não reconheço mais partidos, apenas reconheço alemães!' Todas as disputas políticas são suspensas pela Pátria."
 GER_spartakusbund_proletarian_revolt: "Revolta Proletária do Spartakusbund"
 GER_spartakusbund_proletarian_revolt_desc: "Karl Liebknecht e Rosa Luxemburg rompem decisivamente com o reformismo burguês, unindo operários e soldados sob a bandeira vermelha da revolução proletária."
 GER_kiel_sailors_revolt: "Motim dos Marinheiros de Kiel"
 GER_kiel_sailors_revolt_desc: "Recusando ordens de batalha suicidas, os foguistas e marinheiros da Frota de Alto-Mar amotinam-se em Kiel, hasteando a bandeira vermelha nos encouraçados e criando conselhos de marinheiros."
 GER_proclaim_freie_sozialistische_republik: "Proclamar a República Socialista Livre"
 GER_proclaim_freie_sozialistische_republik_desc: "Da sacada do Palácio de Berlim, Karl Liebknecht proclama a República Socialista Livre da Alemanha, decretando todo o poder aos conselhos de operários e soldados."
 GER_berlin_january_mass_strikes: "Greve Geral de Massas em Berlim"
 GER_berlin_january_mass_strikes_desc: "Centenas de milhares de operários armamentistas e delegados sindicais revolucionários paralisam as fábricas de Berlim, exigindo paz, pão e democracia dos conselhos."
 GER_soldiers_and_workers_councils: "Conselhos de Soldados e Operários"
 GER_soldiers_and_workers_councils_desc: "A consolidação do poder dos conselhos (Räterepublik) na Baviera, Saxônia e Ruhr substitui o antigo aparato burocrático pela democracia operária direta."
 GER_volksmarinedivision_guard: "Divisão Naval Popular"
 GER_volksmarinedivision_guard_desc: "Marinheiros revolucionários armados formam a Volksmarinedivision em Berlim, ocupando as cavalariças imperiais e defendendo o governo revolucionário dos conselhos."
 GER_dissolve_the_junker_officer_caste: "Dissolver a Casta de Oficiais Junkers"
 GER_dissolve_the_junker_officer_caste_desc: "A expurgação dos generais prussianos aristocráticos assegura que o comando militar permaneça subordinado aos comissários eleitos pelos próprios soldados."
 GER_socialist_land_and_factory_collectivization: "Coletivização Socialista"
 GER_socialist_land_and_factory_collectivization_desc: "A desapropriação dos latifúndios aristocráticos da Prússia Oriental e a nacionalização dos monopólios do carvão e aço do Ruhr transferem o poder econômico à classe trabalhadora."
 GER_rote_ruhrarmee_formation: "Formação do Exército Vermelho do Ruhr"
 GER_rote_ruhrarmee_formation_desc: "Mais de cinquenta mil mineiros e operários fabris armados formam o Rote Ruhrarmee, criando uma vanguarda impenetrável contra a contrarrevolução."
 GER_red_high_seas_fleet: "A Frota Vermelha de Alto-Mar"
 GER_red_high_seas_fleet_desc: "Os encouraçados e cruzadores da marinha imperial são reorganizados sob comitês de marinheiros, prontos para defender a revolução no Báltico e no Mar do Norte."
 GER_alliance_with_soviet_russia: "Tratado de Berlim Vermelha"
 GER_alliance_with_soviet_russia_desc: "A assinatura de um pacto histórico de auxílio mútuo com a Rússia Soviética forja um eixo revolucionário unindo o parque industrial alemão aos imensos recursos russos."
 GER_council_economic_planning: "Planejamento Econômico dos Conselhos"
 GER_council_economic_planning_desc: "A coordenação da produção através dos sindicatos e conselhos elimina a anarquia de mercado capitalista e orienta a indústria pesada para o bem-estar e a defesa social."
 GER_soviet_military_advisors: "Intercâmbio Militar Soviético"
 GER_soviet_military_advisors_desc: "O intercâmbio de oficiais táticos e comissários com o Exército Vermelho combina a ciência militar industrial alemã à doutrina revolucionária soviética."
 GER_red_baltic_intervention: "Intervenção Vermelha no Báltico"
 GER_red_baltic_intervention_desc: "O envio de divisões revolucionárias pelo Báltico liberta os trabalhadores letões e estonianos dos barões aristocráticos e instala comunas soviéticas fraternas."
 GER_liberate_the_polish_proletariat: "Libertação do Proletariado Polonês"
 GER_liberate_the_polish_proletariat_desc: "Derrubar as elites nacionalistas reacionárias na Polônia permite a proclamação da República Soviética Polonesa como parceira igualitária na federação socialista."
 GER_danubian_soviet_federation: "Federação Socialista Danubiana"
 GER_danubian_soviet_federation_desc: "Apoiar a Guarda Vermelha austríaca e a República Soviética Húngara de Béla Kun une os trabalhadores da Europa Central em uma federação unificada de conselhos."
 GER_liberate_the_balkans_workers: "Libertação Proletária dos Bálcãs"
 GER_liberate_the_balkans_workers_desc: "Exportar armamentos e comissários para a Romênia e Bulgária derruba as dinastias locais e instaura o poder operário na península balcânica."
 GER_export_revolution_to_france: "Exportar a Revolução para a França"
 GER_export_revolution_to_france_desc: "Uma ofensiva revolucionária pelo Reno quebra a Terceira República burguesa, ressuscitando a lendária Comuna de Paris em toda a França."
 GER_world_proletarian_revolution: "Revolução Proletária Mundial"
 GER_world_proletarian_revolution_desc: "De Berlim a Petrogrado, de Paris a Viena, os trabalhadores do mundo romperam seus grilhões. Nasce a união socialista global!"
 GER_prussian_franchise_reform: "Reforma Eleitoral Prussiana"
 GER_prussian_franchise_reform_desc: "A abolição do discriminatório voto de três classes na Prússia institui o sufrágio universal e igualitário, rompendo o monopólio da nobreza agrária."
 GER_prince_max_von_baden_cabinet: "Gabinete do Príncipe Max de Baden"
 GER_prince_max_von_baden_cabinet_desc: "A nomeação do Príncipe Max de Baden traz a maioria partidária parlamentar para o governo executivo, subordinando os militares ao poder civil."
 GER_proclaim_deutsche_republik: "Proclamar a República Alemã"
 GER_proclaim_deutsche_republik_desc: "Philipp Scheidemann proclama a República Democrática Alemã do balcão do Reichstag, iniciando uma transição pacífica para a democracia representativa."
 GER_repeal_anti_socialist_heritage: "Revogação das Leis Repressivas"
 GER_repeal_anti_socialist_heritage_desc: "O desmantelamento das leis bismarckianas garante plena liberdade de reunião, direitos sindicais e igualdade jurídica a todos os cidadãos."
 GER_antinationalist_civil_defense: "Defesa Civil Reichsbanner"
 GER_antinationalist_civil_defense_desc: "A formação da milícia Reichsbanner Schwarz-Rot-Gold cria uma guarda cívica dedicada a defender a república contra tentativas de golpe extremistas."
 GER_stinnes_legien_social_compromise: "Pacto Social Stinnes-Legien"
 GER_stinnes_legien_social_compromise_desc: "O acordo histórico entre o líder sindical Carl Legien e o industrial Hugo Stinnes estabelece a jornada de 8 horas, negociação coletiva e comissões de fábrica."
 GER_rathenau_industrial_reorganization: "Reorganização Industrial de Rathenau"
 GER_rathenau_industrial_reorganization_desc: "O plano administrativo de Walther Rathenau aperfeiçoa as cadeias de suprimentos, incentiva a química sintética e otimiza a produção de matérias-primas."
 GER_weimar_national_assembly: "Assembleia Nacional de Weimar"
 GER_weimar_national_assembly_desc: "Reunida na cidade de Weimar, a assembleia constituinte eleita democraticamente promulga uma das cartas fundamentais mais progressistas do mundo."
 GER_zentrum_concordat_with_rome: "Parceria Social do Zentrum"
 GER_zentrum_concordat_with_rome_desc: "O fortalecimento dos laços com o Partido de Centro Católico garante a conciliação na Renânia, Baviera e Silésia, superando antigas divisões religiosas."
 GER_post_war_welfare_and_reconstruction: "Estado de Bem-Estar e Reconstrução"
 GER_post_war_welfare_and_reconstruction_desc: "Seguro-desemprego universal, pensões para veteranos e planos habitacionais restauram a dignidade pública e reconstroem as cidades atingidas pela guerra."
 GER_federal_constitutional_balance: "Equilíbrio Constitucional Federal"
 GER_federal_constitutional_balance_desc: "Harmonizar os direitos dos estados do sul com a administração prussiana preserva a rica autonomia local em uma federação democrática coesa."
 GER_direct_negotiations_with_woodrow_wilson: "Negociar sob os 14 Pontos de Wilson"
 GER_direct_negotiations_with_woodrow_wilson_desc: "Aproximar-se diretamente do presidente Woodrow Wilson estabelece a paz com base na autodeterminação dos povos e no direito internacional."
 GER_alsace_lorraine_plebiscite: "Plebiscito na Alsácia-Lorena"
 GER_alsace_lorraine_plebiscite_desc: "A realização de um plebiscito supervisionado internacionalmente na Alsácia-Lorena resolve séculos de tensões fronteiriças com a França por meio da vontade popular."
 GER_democratic_mitteleuropa_union: "União Democrática da Mitteleuropa"
 GER_democratic_mitteleuropa_union_desc: "Convidar Áustria, Suíça, Dinamarca e Países Baixos para uma união aduaneira democrática reduz barreiras comerciais e fomenta prosperidade compartilhada."
 GER_subjugate_luxembourg_customs: "Integrar Alfândegas de Luxemburgo"
 GER_subjugate_luxembourg_customs_desc: "Garantir a adesão definitiva de Luxemburgo ao Zollverein com salvaguardas democráticas consolida o livre comércio no coração industrial europeu."
 GER_nordic_democratic_trade_compact: "Pacto Comercial Nórdico"
 GER_nordic_democratic_trade_compact_desc: "Assinar acordos comerciais abrangentes com a Suécia e Noruega assegura suprimentos contínuos de minério de ferro sem recorrer à coerção militar."
 GER_guarantee_independent_poland_buffer: "Garantir a Polônia Independente"
 GER_guarantee_independent_poland_buffer_desc: "O reconhecimento e garantia diplomática a uma república polonesa democrática cria um escudo de proteção estável contra o autoritarismo no leste."
 GER_baltic_democratic_confederation: "Confederação Democrática Báltica"
 GER_baltic_democratic_confederation_desc: "O apoio à autodeterminação na Lituânia, Letônia e Estônia integra o litoral báltico ao nosso sistema de segurança coletiva e comércio pacífico."
 GER_pan_european_arbitration_league: "Liga Pan-Europeia de Arbitragem"
 GER_pan_european_arbitration_league_desc: "Fundar uma liga permanente de nações democráticas sediada em Frankfurt assegura a paz duradoura no continente através do direito e da arbitragem."
 GER_silent_dictatorship_ohl: "Ditadura Silenciosa da Terceira OHL"
 GER_silent_dictatorship_ohl_desc: "O Marechal Paul von Hindenburg e o General Erich Ludendorff assumem controle supremo dos negócios do Estado, subordinando a administração pública às necessidades da guerra."
 GER_oust_bethmann_hollweg: "Demitir Bethmann-Hollweg"
 GER_oust_bethmann_hollweg_desc: "Forçar a renúncia do chanceler civil Bethmann-Hollweg elimina a última barreira ministerial às diretrizes de guerra total traçadas pelo Alto Comando."
 GER_hindenburg_program_mobilization: "Mobilização do Programa Hindenburg"
 GER_hindenburg_program_mobilization_desc: "O radical Programa Hindenburg impõe a duplicação imediata da produção de artilharia e metralhadoras, convertendo fábricas comerciais em oficinas de guerra."
 GER_patriotic_auxiliary_service_law: "Lei de Serviço Auxiliar Patriótico"
 GER_patriotic_auxiliary_service_law_desc: "A promulgação da lei conscreve compulsoriamente toda a população masculina civil de 16 a 60 anos para o trabalho em complexos industriais armamentistas."
 GER_krupp_ordnance_dictate: "Decreto de Super-Artilharia Krupp"
 GER_krupp_ordnance_dictate_desc: "Contratos estatais irrestritos com a Friedrich Krupp AG aceleram a fabricação de obuses monstruosos e canhões ferroviários de alcance continental."
 GER_total_war_patriotism_kriegsanleihen: "Bônus de Guerra e Patriotismo Total"
 GER_total_war_patriotism_kriegsanleihen_desc: "A emissão maciça de bônus imperiais (Kriegsanleihen) e a censura militar estrita sustentam a resistência nacional diante do bloqueio naval."
 GER_sturmtruppen_doctrine_offensive: "Táticas de Infiltração das Sturmtruppen"
 GER_sturmtruppen_doctrine_offensive_desc: "Batalhões especializados de assalto armados com lança-chamas, submetralhadoras e barragens de artilharia móvel rompem as linhas de trincheiras inimigas."
 GER_subjugate_the_reichstag_politicians: "Subjugar os Parlamentares do Reichstag"
 GER_subjugate_the_reichstag_politicians_desc: "Reprimir as moções de paz parlamentares e silenciar líderes civis garante o domínio absoluto das forças armadas sobre o destino do império."
 GER_septemberprogramm_war_aims: "Metas de Guerra do Septemberprogramm"
 GER_septemberprogramm_war_aims_desc: "Instituir o Septemberprogramm de 1914 como política irrevogável formaliza a dominação econômica e territorial definitiva da Alemanha sobre o continente europeu."
 GER_unrestricted_submarine_mobilization: "Guerra Submarina Irrestrita"
 GER_unrestricted_submarine_mobilization_desc: "Autorizar os submarinos a torpedear qualquer embarcação em águas britânicas visa sufocar o Reino Unido antes que o apoio americano se consolide."
 GER_annexation_of_belgium_and_briey: "Subjugar Bélgica e a Bacia de Briey"
 GER_annexation_of_belgium_and_briey_desc: "A anexação do rico vale de minério de ferro de Briey-Longwy da França e a redução da Bélgica a protetorado militar consolidam nossa hegemonia no oeste."
 GER_subjugate_romanian_ploesti_oil: "Subjugar o Petróleo de Ploiești"
 GER_subjugate_romanian_ploesti_oil_desc: "A apropriação dos campos petrolíferos de Ploiești na Romênia garante combustível farto e inesgotável para os motores da máquina de guerra alemã."
 GER_brest_litovsk_carve_up: "Desmantelamento do Império Russo"
 GER_brest_litovsk_carve_up_desc: "A imposição dos termos de Brest-Litovsk despoja a Rússia de seus territórios ocidentais, erguendo um cordão de estados satélites sob tutela imperial alemã."
 GER_establish_generalgouvernement_warschau: "Generalgouvernement Warschau"
 GER_establish_generalgouvernement_warschau_desc: "A instalação de um governo militar em Varsóvia e a formação da Polnische Wehrmacht garantem a segurança da fronteira leste sob controle imperial."
 GER_finnish_intervention_von_der_goltz: "Intervenção Monárquica na Finlândia"
 GER_finnish_intervention_von_der_goltz_desc: "O envio da Divisão do Mar Báltico do General von der Goltz esmaga os levantes na Finlândia e instala um príncipe alemão no trono finlandês."
 GER_carve_ukrainian_breadbasket: "Celeiro Agrícola Ucraniano"
 GER_carve_ukrainian_breadbasket_desc: "Apoiar o Hetman Pavlo Skoropadsky em Kiev garante o envio contínuo de milhões de toneladas de grãos e carvão de Donets para abastecer nosso front doméstico."
 GER_operation_faustschlag_crusade: "Ofensiva da Operação Faustschlag"
 GER_operation_faustschlag_crusade_desc: "A rápida ofensiva ferroviária de 1918 avança profundamente sobre a Rússia, marchando sobre Petrogrado e impondo rendição incondicional."
 GER_subjugate_the_danubian_ally: "Subordinar o Aliado Danubiano"
 GER_subjugate_the_danubian_ally_desc: "Subordinar o Alto Comando Austro-Húngaro (AOK) diretamente à direção operacional da OHL põe fim à hesitação militar nas frentes conjuntas."
 GER_hegemon_of_continental_europe: "Hegemonia Continental Europeia"
 GER_hegemon_of_continental_europe_desc: "O Alto Comando Alemão reina triunfante sobre a Europa. Reinos clientes e repúblicas satélites curvam-se diante da vontade de ferro de Berlim."
 GER_found_vaterlandspartei: "Fundar a Deutsche Vaterlandspartei"
 GER_found_vaterlandspartei_desc: "O Grande Almirante von Tirpitz e Wolfgang Kapp fundam a Deutsche Vaterlandspartei, mobilizando mais de um milhão de nacionalistas que exigem vitória total e anexações."
 GER_kapp_and_tirpitz_rally: "Mobilização de Massas de Kapp e Tirpitz"
 GER_kapp_and_tirpitz_rally_desc: "Comícios massivos de veteranos e magnatas industriais rejeitam qualquer compromisso de paz, exigindo a expansão territorial irrestrita do império."
 GER_militarize_the_entire_society: "Militarização Total da Sociedade"
 GER_militarize_the_entire_society_desc: "A integração de escolas, juventudes e associações civis em treinamentos paramilitares transforma o império em uma nação espartana em armas."
 GER_dissolve_the_reichstag: "Dissolver o Reichstag por Decreto"
 GER_dissolve_the_reichstag_desc: "Suspender as sessões parlamentares por tempo indeterminado e declarar lei marcial unifica todos os poderes nas mãos do executivo nacionalista."
 GER_smash_general_strikes: "Esmagar Greves e Agitadores"
 GER_smash_general_strikes_desc: "O destacamento do exército e de milícias patrióticas para sufocar piquetes e prender sabotadores protege a produção bélica contra traições internas."
 GER_alldeutscher_verband_hegemony: "Hegemonia da Liga Pan-Germânica"
 GER_alldeutscher_verband_hegemony_desc: "Heinrich Class e a Liga Pan-Germânica orientam a política externa imperial rumo à expansão intransigente e à supremacia germânica."
 GER_siegfrieden_manifesto: "Manifesto da Paz Vitoriosa (Siegfrieden)"
 GER_siegfrieden_manifesto_desc: "Proclamar o Siegfrieden demonstra ao mundo que a Alemanha não aceitará nada menos do que anexações maciças e a vitória militar absoluta."
 GER_autarkic_industrial_trusts: "Trustes Industriais Autárquicos"
 GER_autarkic_industrial_trusts_desc: "A cartelização forçada dos conglomerados siderúrgicos, químicos e mineradores sob controle estatal garante autossuficiência econômica completa."
 GER_crush_marxism_and_defeatism: "Esmagar o Marxismo e o Derrotismo"
 GER_crush_marxism_and_defeatism_desc: "O encarceramento de agitadores pacifistas e a execução de desertores eliminam qualquer hesitação moral nas cidades e na frente de batalha."
 GER_annex_the_flemish_coast: "Anexação da Costa Flamenga"
 GER_annex_the_flemish_coast_desc: "A incorporação direta de Zeebrugge, Ostend e Antuérpia transforma o litoral de Flandres em bases navais impenetráveis voltadas para o Canal da Mancha."
 GER_colonize_the_eastern_frontier_strip: "Colonizar a Faixa de Fronteira Polonesa"
 GER_colonize_the_eastern_frontier_strip_desc: "Anexar o Polnischer Grenzstreifen e destinar as terras férteis a colonos camponeses alemães cria uma barreira demográfica de segurança permanente no leste."
 GER_baltic_crusade_landeswehr: "Cruzada da Baltische Landeswehr"
 GER_baltic_crusade_landeswehr_desc: "Autorizar a Landeswehr e os Freikorps a dominar as províncias bálticas instaura o Ducado Báltico Unido sob o comando da nobreza alemã."
 GER_crush_netherlands_neutrality: "Ultimato de Neutralidade à Holanda"
 GER_crush_netherlands_neutrality_desc: "Exigir a submissão aduaneira e o controle do delta do Reno aos Países Baixos assegura nosso flanco ocidental ou desencadeia a invasão imediata."
 GER_pan_german_settlement_east: "Povoamento Pan-Germânico do Leste"
 GER_pan_german_settlement_east_desc: "O assentamento em larga escala de famílias alemãs nas províncias conquistadas do leste consolida a hegemonia cultural germânica para as futuras gerações."
 GER_subjugate_scandinavia: "Subjugar a Escandinávia"
 GER_subjugate_scandinavia_desc: "Coagir a Dinamarca e a Noruega garante o controle militar absoluto sobre o estreito de Skagerrak e os portos de apoio aos submarinos no Atlântico."
 GER_annex_french_iron_and_channel_ports: "Anexar Portos Franceses do Canal"
 GER_annex_french_iron_and_channel_ports_desc: "Exigir Belfort, Longwy e o porto estratégico de Dunquerque da França derrotada impede para sempre qualquer revanchismo militar francês."
 GER_conquer_transcaucasia_oil: "Conquistar o Petróleo da Transcaucásia"
 GER_conquer_transcaucasia_oil_desc: "O envio de corpos expedicionários à Geórgia e ao Azerbaijão assegura o controle direto sobre os campos petrolíferos de Baku, garantindo autarquia energética total."
 GER_mittelafrika_total_empire: "Concretizar o Império da Mittelafrika"
 GER_mittelafrika_total_empire_desc: "A incorporação do Congo Belga e das colônias francesas e britânicas conecta a África Oriental à África Ocidental Alemã em um império contínuo colossal."
 GER_unconditional_victory_or_ruin: "Vitória ou Ruína Total"
 GER_unconditional_victory_or_ruin_desc: "Vitória total ou ruína! A nação alemã sobrepujou todos os seus inimigos na terra e nos mares, fundando uma ordem imperial gloriosa e eterna."
 ww1_germany_events.301.t: "Eleições do Reichstag de 1912"
 ww1_germany_events.301.d: "As eleições gerais para o Reichstag resultaram em um abalo político profundo. O Partido Social-Democrata (SPD) ascendeu vertiginosamente, conquistando 110 deputados e tornando-se a maior bancada parlamentar. O Kaiser Wilhelm II e o gabinete enfrentam uma maioria decidida a exigir reformas democráticas."
 ww1_germany_events.301.a: "Buscar um entendimento com a maioria parlamentar."
 ww1_germany_events.301.b: "Unir as bancadas conservadoras para bloquear as reformas."
 ww1_germany_events.302.t: "Crise do Sufrágio Prussiano"
 ww1_germany_events.302.d: "O sistema de voto de três classes na Prússia, que confere peso esmagador aos maiores contribuintes, enfrenta protestos furiosos em todo o império. Partidos liberais e sindicatos operários exigem sufrágio igualitário imediato, enquanto a aristocracia Junker ameaça resistência armada."
 ww1_germany_events.302.a: "Prometer reformas gradativas após a crise atual."
 ww1_germany_events.302.b: "A ordem prussiana é sagrada e imutável!"
 ww1_germany_events.310.t: "O Spartakusbund em Revolta"
 ww1_germany_events.310.d: "Karl Liebknecht, Rosa Luxemburg e os militantes antimilitaristas do Spartakusbund convocaram uma greve geral revolucionária. As autoridades imperiais perdem rapidamente o controle sobre os subúrbios operários de Berlim, Leipzig e Bremen."
 ww1_germany_events.310.a: "Abaixo a guerra imperialista! Todo o poder aos conselhos!"
 ww1_germany_events.311.t: "Motim na Frota de Alto-Mar"
 ww1_germany_events.311.d: "Marinheiros e foguistas nas bases navais de Kiel e Wilhelmshaven apagaram as caldeiras e hastearam bandeiras vermelhas nos mastros dos navios. Oficiais que tentaram impor ordem foram detidos pelos comitês eleitos de marinheiros."
 ww1_germany_events.311.a: "A frota vermelha pertence à revolução!"
 ww1_germany_events.312.t: "Proclamação da República Socialista Livre"
 ww1_germany_events.312.d: "Falando da sacada imperial do Stadtschloss em Berlim, Karl Liebknecht proclamou a República Socialista Livre da Alemanha. Conselhos de operários e soldados assumiram a administração pública em todas as grandes cidades."
 ww1_germany_events.312.a: "Viva a República dos Conselhos Alemã!"
 ww1_germany_events.313.t: "O Tratado de Berlim Vermelha"
 ww1_germany_events.313.d: "Delegados da Rússia Soviética chegaram a Berlim para ratificar um tratado abrangente de assistência mútua militar e comercial. A indústria alemã alia-se aos imensos recursos da república soviética russa."
 ww1_germany_events.313.a: "Ratificar a aliança fraterna socialista!"
 ww1_germany_events.314.t: "A Federação Socialista Danubiana"
 ww1_germany_events.314.d: "Inspirados por nossa revolução, a Guarda Vermelha austríaca e a República dos Conselhos Húngara de Béla Kun estabeleceram o poder operário em Viena e Budapeste, solicitando a integração à Federação Socialista Danubiana."
 ww1_germany_events.314.a: "Acolher nossos camaradas danubianos na federação!"
 ww1_germany_events.320.t: "Proclamação da República Alemã"
 ww1_germany_events.320.d: "De uma janela do edifício do Reichstag em Berlim, Philipp Scheidemann proclamou a República Democrática Alemã sob aplausos e aclamação popular. O imperador Wilhelm II abdicou de suas funções, e um governo provisório chefiado por Friedrich Ebert assumiu a administração."
 ww1_germany_events.320.a: "Viva a República Alemã!"
 ww1_germany_events.321.t: "Negociações sob os Catorze Pontos de Wilson"
 ww1_germany_events.321.d: "Nossa delegação diplomática contatou formalmente o presidente Woodrow Wilson, declarando a prontidão da Alemanha em negociar um armistício nos termos exatos dos Catorze Pontos, com base no direito de autodeterminação dos povos."
 ww1_germany_events.321.a: "Aceitar os Catorze Pontos como base definitiva para a paz."
 ww1_germany_events.321.b: "Exigir garantias coloniais antes de firmar o acordo."
 ww1_germany_events.322.t: "O Plebiscito na Alsácia-Lorena"
 ww1_germany_events.322.d: "Em consonância com os preceitos democráticos, um referendo supervisionado internacionalmente foi conduzido na Alsácia-Lorena. A população manifestou sua vontade soberana, neutralizando disputas históricas com a França."
 ww1_germany_events.322.a: "Respeitar a vontade soberana das populações fronteiriças."
 ww1_germany_events.330.t: "A Terceira OHL Assume o Comando"
 ww1_germany_events.330.d: "O Marechal Paul von Hindenburg e o General Erich Ludendorff assumiram controle incontestável do Alto Comando da Guerra (Oberste Heeresleitung). O Kaiser delegou todas as prerrogativas de comando, subordinando o gabinete à vitória."
 ww1_germany_events.330.a: "A vitória exige disciplina de ferro!"
 ww1_germany_events.331.t: "Declaração de Guerra Submarina Irrestrita"
 ww1_germany_events.331.d: "O Alto Comando determinou o retorno da guerra submarina irrestrita em todos os mares ao redor das Ilhas Britânicas. Toda navegação mercante será alvejada sem aviso prévio em uma tentativa decisiva de forçar o Reino Unido à capitulação."
 ww1_germany_events.331.a: "Que os submarinos imponham o bloqueio total!"
 ww1_germany_events.331.b: "Considerar as advertências diplomáticas e manter as regras navais."
 ww1_germany_events.332.t: "O Desmembramento do Império Russo"
 ww1_germany_events.332.d: "Após as vitórias em nossa frente oriental e os tratados de Brest-Litovsk, a Rússia cedeu extensas províncias na Polônia, Ucrânia, Belarus e nos Bálticos. Uma malha de estados satélites alemães é estabelecida para proteger nosso império."
 ww1_germany_events.332.a: "O Leste nos pertence!"
 ww1_germany_events.340.t: "Fundação da Deutsche Vaterlandspartei"
 ww1_germany_events.340.d: "O Grande Almirante Alfred von Tirpitz e Wolfgang Kapp fundaram a Deutsche Vaterlandspartei em Königsberg. Mais de um milhão de cidadãos filiaram-se em poucas semanas, exigindo a paz vitoriosa e anexações imperiais inegociáveis."
 ww1_germany_events.340.a: "Pelo Kaiser, pelo Povo e pela Glória Imperial!"
 ww1_germany_events.341.t: "A Dissolução do Reichstag"
 ww1_germany_events.341.d: "Diante da oposição de deputados liberais e socialistas, o governo dissolveu o Reichstag por decreto imperial. O império entra em estado de sítio absoluto, silenciando vozes divisionistas enquanto a guerra durar."
 ww1_germany_events.341.a: "A defesa nacional sobrepuja o debate parlamentar!"
 ww1_germany_events.342.t: "Ultimato aos Países Baixos"
 ww1_germany_events.342.d: "Nosso governo enviou um ultimato categórico ao governo holandês, exigindo a inclusão imediata da Holanda na rede aduaneira imperial alemã e acesso às instalações portuárias do delta do Reno."
 ww1_germany_events.342.a: "Eles devem acatar nossa vontade ou enfrentar nossa força!"
