 special_forces_over_cap_penalty:0 "Violação do Teto de Forças Especiais"
 special_forces_over_cap_penalty_desc:0 "Nosso aparato militar excedeu a cota autorizada de tropas especiais. A distribuição de equipamentos especializados, logística e hierarquia de comando estão severamente comprometidas, paralisando a eficácia em combate das unidades de elite até que as divisões sejam readequadas."
