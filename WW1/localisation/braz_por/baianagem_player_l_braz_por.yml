 ww1_agadir.1.t:0 "A Crise de Agadir"
 ww1_agadir.1.d:0 "Em resposta às movimentações militares francesas no Marrocos, a canhoneira imperial SMS Panther aportou no porto de Agadir para salvaguardar interesses comerciais alemães e exigir compensações territoriais na África central."
 ww1_agadir.1.a:0 "Aportar o Panther e afirmar nosso prestígio!"
 ww1_agadir.1.b:0 "Manter moderação e cautela diplomática."
 ww1_agadir.2.t:0 "Panthersprung: O Panther em Agadir"
 ww1_agadir.2.d:0 "O Império Alemão despachou uma canhoneira para o porto marroquino de Agadir em um desafio aberto à hegemonia francesa sobre o Marrocos!"
 ww1_agadir.2.a:0 "Jamais cederemos à diplomacia de canhoneiras!"
 ww1_agadir.3.t:0 "A Crise de Agadir e o Discurso da Mansion House"
 ww1_agadir.3.d:0 "O Chanceler do Tesouro britânico Lloyd George adverte formalmente que a honra nacional é inegociável e que o Império Britânico permanece inabalavelmente ao lado da França perante agressões germânicas."
 ww1_agadir.3.a:0 "A Entente permanece inabalável!"
