﻿l_braz_por:
 ENG_ww1_professional_service:0 "Exército profissional, estabelecimento limitado"
 ENG_ww1_professional_service_desc:0 "A força permanente tem experiência, mas a instrução rigorosa e os compromissos imperiais limitam sua expansão rápida."
 ENG_ww1_naval_estimates:0 "As estimativas do Almirantado"
 ENG_ww1_naval_estimates_desc:0 "A alocação naval desloca pessoal e produção do exército continental."
 ENG_ww1_continental_estimates:0 "As estimativas continentais"
 ENG_ww1_continental_estimates_desc:0 "A preparação do exército recebe prioridade industrial à custa da construção naval."
 ENG_ww1_balanced_estimates:0 "Uma alocação equilibrada de defesa"
 ENG_ww1_balanced_estimates_desc:0 "O governo mantém a continuidade industrial em vez de se concentrar em uma única força."
 ENG_ww1_territorial_establishment:0 "Estabelecimento de treinamento territorial"
 ENG_ww1_territorial_establishment_desc:0 "Os campos preparam unidades pela fila normal de recrutamento. Não criam divisões nem equipamento."
 ENG_ww1_new_army_establishment:0 "Campos de treinamento dos novos exércitos"
 ENG_ww1_new_army_establishment_desc:0 "Um recrutamento voluntário mais amplo exige instrutores e tempo. Os recrutas ainda precisam de homens e equipamento."
 ENG_ww1_munitions_ministry:0 "Ministério de Munições"
 ENG_ww1_munitions_ministry_desc:0 "A coordenação industrial melhora as entregas de armamentos enquanto ocupa a administração civil."
 ENG_ww1_labour_compact:0 "O acordo trabalhista das munições"
 ENG_ww1_labour_compact_desc:0 "Acordos salariais e de oficinas preservam a cooperação com um custo econômico civil."
 ENG_ww1_emergency_controls:0 "Controles industriais de emergência"
 ENG_ww1_emergency_controls_desc:0 "A coordenação compulsória aumenta a produção enquanto enfraquece a cooperação política."
 ENG_ww1_war_cabinet:0 "O gabinete de guerra"
 ENG_ww1_war_cabinet_desc:0 "Um gabinete compacto coordena o planejamento militar e as demandas econômicas. Seu mandato termina com a guerra."
 ENG_ww1_convoy_service:0 "O serviço de coordenação de comboios"
 ENG_ww1_convoy_service_desc:0 "A organização das rotas auxilia missões reais de escolta. Os mercantes e as escoltas ainda precisam navegar."
 ENG_ww1_army_service_corps:0 "Organização do Army Service Corps"
 ENG_ww1_army_service_corps_desc:0 "Os escritórios de transporte reduzem o desperdício enquanto ocupam uma alocação administrativa civil."
 ENG_ww1_air_observation_service:0 "Serviço de observação aérea"
 ENG_ww1_air_observation_service_desc:0 "Os observadores transmitem relatórios de reconhecimento; o serviço não concede capacidades modernas de bombardeio."
 ENG_ww1_royal_air_force_service:0 "Uma Royal Air Force integrada"
 ENG_ww1_royal_air_force_service_desc:0 "Um serviço aéreo integrado substitui a administração anterior de observação."
 ENG_ww1_irish_conciliation:0 "Conciliação constitucional irlandesa"
 ENG_ww1_irish_conciliation_desc:0 "A acomodação política acompanha custos reais de autogoverno regional."
 ENG_ww1_irish_repression:0 "Policiamento irlandês de emergência"
 ENG_ww1_irish_repression_desc:0 "Um esforço temporário de policiamento desloca recursos civis e enfraquece a confiança."
 ENG_ww1_unsanctioned_conscription:0 "Conscrição sem mandato parlamentar"
 ENG_ww1_unsanctioned_conscription_desc:0 "O recrutamento foi ampliado antes de sua autorização legislativa. Regularizar a lei ou retornar ao serviço voluntário encerra esta oposição."
 ENG_ww1_debt_pressure_1:0 "Serviço da dívida pública: administrável"
 ENG_ww1_debt_pressure_1_desc:0 "Os compromissos industriais e militares financiados exigem gastos civis contínuos."
 ENG_ww1_debt_pressure_2:0 "Serviço da dívida pública: elevado"
 ENG_ww1_debt_pressure_2_desc:0 "O serviço da dívida limita os recursos disponíveis para novos programas."
 ENG_ww1_debt_pressure_3:0 "Serviço da dívida pública: severo"
 ENG_ww1_debt_pressure_3_desc:0 "O financiamento contínuo impõe uma carga fiscal grave. A amortização exige recursos e tempo."
 ENG_ww1_veterans_settlement:0 "Veteranos e emprego civil"
 ENG_ww1_veterans_settlement_desc:0 "A reintegração e o emprego exigem uma alocação social contínua."
 ENG_ww1_housing_programme:0 "O programa de habitação e saúde pública"
 ENG_ww1_housing_programme_desc:0 "A recuperação social após a guerra consome uma alocação de construção civil."
 ENG_ww1_naval_economy:0 "Economia naval após a guerra"
 ENG_ww1_naval_economy_desc:0 "A redução da construção naval em paz libera recursos civis; o programa não impõe um tratado internacional fictício de tonelagem."
 ENG_ww1_cabinet_consultation:0 "Consulta do gabinete imperial"
 ENG_ww1_cabinet_consultation_desc:0 "A consulta formal coordena governos existentes em vez de anexar suas populações."
 ww1_britain_irish_devolution:0 "Governo regional irlandês"
 ww1_britain_irish_exemption:0 "Serviço militar irlandês voluntário"
 ENG_ww1_david_lloyd_george:0 "David Lloyd George"
 ENG_ww1_andrew_bonar_law:0 "Andrew Bonar Law"
 ENG_ww1_ramsay_macdonald:0 "Ramsay MacDonald"

 # --- Ideias e Modificadores do Rework Britanico ---
 ENG_bef_on_the_continent:0 "A BEF no Continente"
 ENG_bef_on_the_continent_desc:0 "A Força Expedicionária Britânica desdobrada em território francês e belga, mantendo firme a linha defensiva dos Aliados."
 ENG_fisher_education_act:0 "Lei de Educação Fisher de 1918"
 ENG_fisher_education_act_desc:0 "A ampliação da escolaridade técnica e básica qualifica as novas gerações da classe trabalhadora britânica."
 ENG_ministry_of_health:0 "Ministério da Saúde"
 ENG_ministry_of_health_desc:0 "A unificação dos serviços sanitários nacionais melhora o bem-estar social e o crescimento demográfico metropolitano."
 ENG_orderly_demobilisation:0 "Desmobilização Ordenada"
 ENG_orderly_demobilisation_desc:0 "Critérios escalonados de liberação militar evitam o desemprego em massa e restauram o equilíbrio civil."
 ENG_sterling_stabilization:0 "Estabilização da Libra Esterlina"
 ENG_sterling_stabilization_desc:0 "Disciplina orçamentária e liquidação de dívidas externas reafirmam o prestígio global da moeda britânica."
 ENG_whitley_councils:0 "Conselhos Whitley de Relações Industriais"
 ENG_whitley_councils_desc:0 "Fóruns permanentes de negociação paritária entre sindicatos e patronato garantem a harmonia fabril."
 ENG_ww1_aerial_spotting_coordination:0 "Observação Aérea e Balística"
 ENG_ww1_aerial_spotting_coordination_desc:0 "Aeronaves do RFC corrigem disparos de artilharia pesada em tempo real com precisão letal."
 ENG_ww1_allenby_desert_mobility:0 "Mobilidade no Deserto de Allenby"
 ENG_ww1_allenby_desert_mobility_desc:0 "Ferrovias avançadas e logística no Sinai garantem manobras fulminantes na Palestina e Síria."
 ENG_ww1_allied_shipping_pool:0 "Pool de Transporte Marítimo Aliado"
 ENG_ww1_allied_shipping_pool_desc:0 "Alocação internacional conjunta de navios cargueiros assegura trigo e carvão onde forem vitais."
 ENG_ww1_allied_staff_talks:0 "Coordenação com o Estado-Maior Aliado"
 ENG_ww1_allied_staff_talks_desc:0 "Planejamento operacional compartilhado com o comando supremo francês para manobras coordenadas."
 ENG_ww1_american_credit_negotiations:0 "Linhas de Crédito em Wall Street"
 ENG_ww1_american_credit_negotiations_desc:0 "Créditos comerciais negociados com o mercado americano financiam encomendas bélicas cruciais."
 ENG_ww1_amphibious_pioneers:0 "Pioneirismo em Assalto Anfíbio"
 ENG_ww1_amphibious_pioneers_desc:0 "Embarcações blindadas de desembarque e infantaria naval especializada em operações costeiras."
 ENG_ww1_armed_neutrality:0 "Neutralidade Armada e Vigilância"
 ENG_ww1_armed_neutrality_desc:0 "Prontidão das defesas costeiras e mobilização silenciosa da esquadra garantem dissuasão absoluta."
 ENG_ww1_asc_logistics:0 "Logística do Army Service Corps"
 ENG_ww1_asc_logistics_desc:0 "Transporte motorizado e ferrovias de campanha asseguram que suprimentos e munições cheguem ao front."
 ENG_ww1_asdic_sonar:0 "Detecção Ativa ASDIC (Sonar)"
 ENG_ww1_asdic_sonar_desc:0 "Pesquisa acústica ativa por quartzo piezoelétrico permite rastrear submarinos submersos."
 ENG_ww1_asw_depth_charges:0 "Cargas de Profundidade Anti-Submarinas"
 ENG_ww1_asw_depth_charges_desc:0 "Canistros hidrostáticos lançados por contratorpedeiros esmagam submarinos hostis em imersão."
 ENG_ww1_backs_to_the_wall:0 "De Costas para a Parede (Ordem de Haig)"
 ENG_ww1_backs_to_the_wall_desc:0 "A determinação inabalável das forças imperiais em resistir a qualquer custo até o último homem."
 ENG_ww1_balkan_liaison:0 "Operações e Apoio nos Bálcãs"
 ENG_ww1_balkan_liaison_desc:0 "Apoio logístico à Frente de Salonica e coordenação com nações balcânicas aliadas."
 ENG_ww1_central_flying_school:0 "Escola Central de Aviação de Upavon"
 ENG_ww1_central_flying_school_desc:0 "Instrução rigorosa em manobras acrobáticas e navegação forma pilotos de caça de primeira linha."
 ENG_ww1_channel_security:0 "Segurança do Canal da Mancha"
 ENG_ww1_channel_security_desc:0 "Campos minados e a Patrulha de Dover impedem incursões inimigas contra a travessia de tropas."
 ENG_ww1_channel_transports:0 "Frota de Transporte do Canal"
 ENG_ww1_channel_transports_desc:0 "Vapores mercantes e navios de passageiros requisitados realizam travessias ininterruptas sob escolta."
 ENG_ww1_continental_commitment:0 "Compromisso de Defesa Continental"
 ENG_ww1_continental_commitment_desc:0 "O solene compromisso britânico com a liberdade e segurança territorial da Europa Ocidental."
 ENG_ww1_distant_blockade:0 "O Bloqueio Distante"
 ENG_ww1_distant_blockade_desc:0 "A Grand Fleet fecha as saídas do Mar do Norte, sufocando as importações das Potências Centrais."
 ENG_ww1_european_security_settlement:0 "Nova Ordem de Segurança Europeia"
 ENG_ww1_european_security_settlement_desc:0 "A ratificação da Liga das Nações estabelece a cooperação coletiva e a diplomacia pacífica."
 ENG_ww1_field_wireless:0 "Rádio de Campanha Marconi"
 ENG_ww1_field_wireless_desc:0 "Comunicações instantâneas por telégrafo sem fio unem regimentos avançados aos quartéis-generais."
 ENG_ww1_fighter_tactics_rfc:0 "Doutrina de Caça Aérea do RFC"
 ENG_ww1_fighter_tactics_rfc_desc:0 "Formações cerradas e agressividade tática nos céus da França com os lendários Sopwith Camel."
 ENG_ww1_french_naval_understanding:0 "Acordo Naval Anglo-Francês"
 ENG_ww1_french_naval_understanding_desc:0 "A Marinha Francesa guarda o Mediterrâneo enquanto a Royal Navy concentra seu poder no Mar do Norte."
 ENG_ww1_gas_protection_doctrine:0 "Defesa Química e Respiradores Box"
 ENG_ww1_gas_protection_doctrine_desc:0 "Máscaras contra gases de carvão ativado neutralizam as ameaças de armas químicas no front."
 ENG_ww1_holding_the_line:0 "Defesa de Trincheiras Profundas"
 ENG_ww1_holding_the_line_desc:0 "Entrincheiramento cerrado e redes de metralhadoras blindadas resistem a qualquer bombardeio."
 ENG_ww1_hundred_days_offensive:0 "Ofensiva dos Cem Dias (1918)"
 ENG_ww1_hundred_days_offensive_desc:0 "Armas combinadas de tanques, artilharia e aviação quebram a Linha Hindenburg de forma definitiva."
 ENG_ww1_imperial_airways:0 "Rede Aérea Imperial Airways"
 ENG_ww1_imperial_airways_desc:0 "Rotas aéreas de passageiros e mala postal unem a metrópole aos quatro cantos do Império Britânico."
 ENG_ww1_landships_technical:0 "Engenharia de Blindados (Landships)"
 ENG_ww1_landships_technical_desc:0 "O design pioneiro de tanques romboides com lagartas envolventes para cruzar trincheiras e crateras."
 ENG_ww1_machine_gun_corps:0 "Metralhadoras Vickers do MGC"
 ENG_ww1_machine_gun_corps_desc:0 "O Machine Gun Corps concentra metralhadoras médias Vickers em posições de fogo devastador."
 ENG_ww1_machine_tool_standards:0 "Padrões de Máquinas e Ferramentas"
 ENG_ww1_machine_tool_standards_desc:0 "Tornos de precisão e gabaritos universais aceleram a manufatura intercambiável de armas."
 ENG_ww1_mediterranean_convoy_network:0 "Rede de Comboios do Mediterrâneo"
 ENG_ww1_mediterranean_convoy_network_desc:0 "Escoltas coordenadas a partir de Gibraltar, Malta e Alexandria protegem a rota de Suez."
 ENG_ww1_mesopotamian_logistics:0 "Logística Fluvial da Mesopotâmia"
 ENG_ww1_mesopotamian_logistics_desc:0 "Vapores no Tigre e ferrovias de campanha asseguram a marcha vitoriosa de Maude sobre Bagdá."
 ENG_ww1_naval_disarmament:0 "Ajuste do Desarmamento Naval"
 ENG_ww1_naval_disarmament_desc:0 "Equilíbrio de tonelagem que poupa recursos fiscais sem abrir mão da supremacia marítima."
 ENG_ww1_naval_gunnery:0 "Sistemas de Direção de Tiro Naval"
 ENG_ww1_naval_gunnery_desc:0 "Controle centralizado de tiro das torres de comando confere precisão extrema aos disparos."
 ENG_ww1_neutral_shipping_accords:0 "Acordos Comerciais com Neutros"
 ENG_ww1_neutral_shipping_accords_desc:0 "Garantias marítimas e inspeção de contrabando negociadas pacificamente com nações vizinhas."
 ENG_ww1_npl_standards:0 "Padrões do National Physical Laboratory"
 ENG_ww1_npl_standards_desc:0 "Rigor científico em metrologia e ensaio de materiais eleva a qualidade de toda a indústria."
 ENG_ww1_operational_reserve:0 "Reservas Operacionais Recompostas"
 ENG_ww1_operational_reserve_desc:0 "Divisões veteranas descansadas prontas para explorar brechas táticas ou fechar contra-ataques."
 ENG_ww1_ordnance_metallurgy:0 "Metalurgia de Canhões e Blindagens"
 ENG_ww1_ordnance_metallurgy_desc:0 "Ligas de aço especiais de Sheffield com excepcional resistência balística e térmica."
 ENG_ww1_otc_officers:0 "Oficiais do Officer Training Corps"
 ENG_ww1_otc_officers_desc:0 "Universidades imperiais formam comandantes de pelotão cultos, resolutos e dedicados."
 ENG_ww1_patent_exchanges:0 "Intercâmbio de Patentes Aliadas"
 ENG_ww1_patent_exchanges_desc:0 "Compartilhamento de inovações químicas e de manufatura com os aliados para modernização civil."
 ENG_ww1_porton_down_protection:0 "Defesa Química de Porton Down"
 ENG_ww1_porton_down_protection_desc:0 "Pesquisas de neutralização de substâncias tóxicas garantem imunidade a novos gases bélicos."
 ENG_ww1_postwar_fleet_standards:0 "Modernização da Frota Pós-Guerra"
 ENG_ww1_postwar_fleet_standards_desc:0 "Aplicação rigorosa das lições da Jutlândia em blindagem horizontal e proteção contra clarão."
 ENG_ww1_postwar_raf_establishment:0 "A RAF Permanente de Trenchard"
 ENG_ww1_postwar_raf_establishment_desc:0 "A doutrina de policiamento aéreo imperial mantém a RAF como força de vanguarda no tempo de paz."
 ENG_ww1_postwar_research_council:0 "Conselho de Pesquisa Científica (DSIR)"
 ENG_ww1_postwar_research_council_desc:0 "Financiamento estatal continuado para universidades e laboratórios de física aplicada."
 ENG_ww1_production_standards:0 "Controle de Qualidade de Produção"
 ENG_ww1_production_standards_desc:0 "Tolerâncias industriais uniformes reduzem descartes fabris e elevam a velocidade das oficinas."
 ENG_ww1_professional_force:0 "Exército Profissional e Cadastrado"
 ENG_ww1_professional_force_desc:0 "Um quadro regular pequeno, voluntário e altamente mecanizado para missões imperiais."
 ENG_ww1_ramc_medical:0 "Medicina de Campanha do RAMC"
 ENG_ww1_ramc_medical_desc:0 "Evacuação rápida e postos avançados de cirurgia salvam a vida de centenas de milhares de combatentes."
 ENG_ww1_reconstruction_credit:0 "Crédito para Reconstrução"
 ENG_ww1_reconstruction_credit_desc:0 "Linhas de crédito comercial estabilizam os preços e apoiam a reestruturação da indústria."
 ENG_ww1_rnas_naval_aviation:0 "Aviação Naval do RNAS"
 ENG_ww1_rnas_naval_aviation_desc:0 "Hidroaviões de patrulha e primeiros navios aeródromos dedicados à caça submarina e ataque naval."
 ENG_ww1_russian_procurement_liaison:0 "Suprimento ao Império Russo"
 ENG_ww1_russian_procurement_liaison_desc:0 "Comboios de fuzis e pólvora por Arkhangelsk e Murmansk sustentam o front oriental."
 ENG_ww1_signals_direction_finding:0 "Radiogoniometria Costeira (HF/DF)"
 ENG_ww1_signals_direction_finding_desc:0 "Triangulação de transmissões de rádio inimigas localiza U-boats no mar em instantes."
 ENG_ww1_signals_intelligence:0 "Inteligência Criptográfica de Sinais"
 ENG_ww1_signals_intelligence_desc:0 "Interceptação de mensagens de rádio decifra as intenções diplomáticas e navais inimigas."
 ENG_ww1_smuts_report:0 "O Relatório Smuts sobre o Poder Aéreo"
 ENG_ww1_smuts_report_desc:0 "Recomendação histórica para fundir a aviação naval e militar em uma força autônoma soberana."
 ENG_ww1_sound_ranging_math:0 "Sondagem Sonora e Flash Spotting"
 ENG_ww1_sound_ranging_math_desc:0 "Cálculos de precisão com microfones subterrâneos localizam baterias inimigas pelo estrondo."
 ENG_ww1_submarine_service:0 "Flotilhas de Submarinos da Marinha Real"
 ENG_ww1_submarine_service_desc:0 "Submarinos das classes E e J penetram o Heligoland Bight e atacam rotas inimigas no Báltico."
 ENG_ww1_supreme_war_council:0 "Conselho Supremo de Guerra de Versalhes"
 ENG_ww1_supreme_war_council_desc:0 "Comando unificado dos exércitos aliados sob o General Foch para ofensivas sincronizadas."
 ENG_ww1_tank_assault_doctrine:0 "Doutrina de Assalto com Tanques (Cambrai)"
 ENG_ww1_tank_assault_doctrine_desc:0 "Avanço maciço de blindados sem bombardeio prévio para romper trincheiras e arames."
 ENG_ww1_technical_education:0 "Educação Técnica de Engenharia"
 ENG_ww1_technical_education_desc:0 "Institutos politécnicos formam engenheiros civis, químicos e mecânicos para reconstruir o país."
 ENG_ww1_territorial_renewal:0 "Renovação do Exército Territorial"
 ENG_ww1_territorial_renewal_desc:0 "A Força Territorial reorganizada como uma reserva armada robusta e econômica para a metrópole."
 ENG_ww1_trench_mortar_doctrine:0 "Morteiros de Trincheira Stokes de 3 Pol."
 ENG_ww1_trench_mortar_doctrine_desc:0 "Apoio de fogo curvo imediato da infantaria para pulverizar ninhos de metralhadoras em abrigos."
 ENG_ww1_university_research:0 "Pesquisa Universitária Cavendish"
 ENG_ww1_university_research_desc:0 "Grandes centros acadêmicos desenvolvem inovações pioneiras em eletrônica e física aplicada."

 # --- Focos Nacionais do Reino Unido (WW1) ---
 ENG_ww1_parliament_act:0 "A Lei do Parlamento de 1911"
 ENG_ww1_parliament_act_desc:0 "A quebra definitiva do veto absoluto da Câmara dos Lordes consolida a primazia legislativa da Câmara dos Comuns, assegurando estabilidade institucional para aprovar os orçamentos do Estado."
 ENG_ww1_national_insurance:0 "Seguro Nacional de Saúde e Desemprego"
 ENG_ww1_national_insurance_desc:0 "A pioneira legislação de seguridade social de Lloyd George oferece auxílio-doença e proteção contra o desemprego para milhões de trabalhadores industriais britânicos."
 ENG_ww1_the_liberal_cabinet:0 "O Gabinete Liberal de H. H. Asquith"
 ENG_ww1_the_liberal_cabinet_desc:0 "O Primeiro-Ministro Asquith conduz um governo de grandes talentos intelectuais, com Winston Churchill no Almirantado, Edward Grey no Foreign Office e Lloyd George no Tesouro."
 ENG_ww1_the_lords_and_the_commons:0 "Equilíbrio entre Lordes e Comuns"
 ENG_ww1_the_lords_and_the_commons_desc:0 "A harmonização dos procedimentos parlamentares moderniza o rito legislativo em Westminster, permitindo tramitação veloz de leis vitais de arrecadação e defesa."
 ENG_ww1_irish_parliamentary_support:0 "A Aliança com o Partido Parlamentar Irlandês"
 ENG_ww1_irish_parliamentary_support_desc:0 "O pacto de Asquith com John Redmond garante os votos nacionalistas irlandeses em Westminster em troca do compromisso solene de aprovar o Home Rule."
 ENG_ww1_home_rule_bill:0 "O Projeto de Autogoverno Irlandês (Home Rule)"
 ENG_ww1_home_rule_bill_desc:0 "A introdução da lei concedendo parlamento próprio em Dublin reacende tensões inflamadas entre nacionalistas católicos e legalistas protestantes do Ulster."
 ENG_ww1_ulster_conference:0 "A Conferência do Ulster & Pacto de Solemn League"
 ENG_ww1_ulster_conference_desc:0 "Edward Carson mobiliza a Ulster Volunteer Force contra a submissão a Dublin. Westminster busca conciliação para evitar uma guerra civil nas ilhas britânicas."
 ENG_ww1_electoral_registration:0 "Reforma do Registro Eleitoral"
 ENG_ww1_electoral_registration_desc:0 "Modernização dos cadastros eleitorais urbanos e rurais, preparando as listas de votação e ampliando a transparência democrática."
 ENG_ww1_the_defence_of_the_realm:0 "Lei de Defesa do Reino (DORA)"
 ENG_ww1_the_defence_of_the_realm_desc:0 "Promulgada no início da guerra, a DORA concede ao Executivo amplos poderes para censurar correspondências de espionagem, controlar ferrovias e requisitar portos."
 ENG_ww1_wartime_parliamentary_scrutiny:0 "Supervisão Parlamentar de Guerra"
 ENG_ww1_wartime_parliamentary_scrutiny_desc:0 "Comissões multipartidárias fiscalizam gastos do Almirantado e do War Office, impedindo corrupção e desabastecimento nas frentes de batalha."
 ENG_ww1_the_coalition_cabinet:0 "O Gabinete de Coalizão de 1915"
 ENG_ww1_the_coalition_cabinet_desc:0 "A escassez crítica de obuses no front derruba o governo liberal puro. Asquith convoca conservadores e trabalhistas para formar uma frente nacional unida."
 ENG_ww1_the_military_service_act:0 "A Lei do Serviço Militar de 1916 (Conscrição)"
 ENG_ww1_the_military_service_act_desc:0 "Diante das perdas avassaladoras nas trincheiras, a Grã-Bretanha abandona o voluntariado e introduz o recrutamento obrigatório para homens solteiros e casados."
 ENG_ww1_reserved_civilian_occupations:0 "Ocupações Civis Reservadas"
 ENG_ww1_reserved_civilian_occupations_desc:0 "Mineiros de carvão, maquinistas de trem, metalúrgicos e operários de estaleiros são isentos da convocação para manter a máquina industrial britânica a todo vapor."
 ENG_ww1_the_war_cabinet:0 "O Gabinete de Guerra de Lloyd George"
 ENG_ww1_the_war_cabinet_desc:0 "David Lloyd George assume como Primeiro-Ministro com um conselho executivo de cinco líderes dedicados dia e noite à condução implacável da vitória militar."
 ENG_ww1_the_franchise_debate:0 "O Debate da Extensão do Sufrágio"
 ENG_ww1_the_franchise_debate_desc:0 "O sacrifício heróico dos soldados nas trincheiras e das mulheres nas fábricas de armas torna indefensável a exclusão de milhões da cidadania plena."
 ENG_ww1_representation_of_the_people:0 "Lei de Representação do Povo de 1918"
 ENG_ww1_representation_of_the_people_desc:0 "Todos os homens maiores de 21 anos e mulheres maiores de 30 recebem o voto, multiplicando o eleitorado britânico de 8 para mais de 21 milhões de pessoas."
 ENG_ww1_the_coalition_election:0 "A Eleição do Cupom de 1918"
 ENG_ww1_the_coalition_election_desc:0 "Imediatamente após o Armistício, o governo de coalizão de Lloyd George obtém esmagadora vitória eleitoral com a promessa de reconstrução e justiça."
 ENG_ww1_liberal_reconstruction:0 "Programa de Reconstrução Social Liberal"
 ENG_ww1_liberal_reconstruction_desc:0 "Investimentos massivos em saúde comunitária, habitação pública e seguridade desfazem as cicatrizes da guerra nos bairros fabris."
 ENG_ww1_the_labour_alternative:0 "A Ascensão Trabalhista de Ramsay MacDonald"
 ENG_ww1_the_labour_alternative_desc:0 "O Partido Trabalhista se consolida como grande força de oposição, defendendo a Carta de Direitos dos Trabalhadores, controle estatal de serviços e diplomacia pacífica."
 ENG_ww1_the_conservative_settlement:0 "A Ordem Conservadora de Bonar Law"
 ENG_ww1_the_conservative_settlement_desc:0 "Andrew Bonar Law e os conservadores assumem a liderança nacional, priorizando a disciplina fiscal, preferências comerciais imperiais e coesão da Coroa."
 ENG_ww1_the_imperial_conference:0 "A Conferência Imperial de 1911"
 ENG_ww1_the_imperial_conference_desc:0 "Os Primeiros-Ministros do Canadá, Austrália, Nova Zelândia e África do Sul reúnem-se em Londres para coordenar planos de defesa marítima e telégrafo imperial."
 ENG_ww1_canadian_defence_consultation:0 "O Corpo Canadense e Sir Robert Borden"
 ENG_ww1_canadian_defence_consultation_desc:0 "O Canadá mobiliza centenas de milhares de voluntários. O Corpo Canadense, comandado por Sir Arthur Currie, torna-se uma das forças de choque mais temidas da Europa."
 ENG_ww1_australian_defence_consultation:0 "O Lendário Corpo Australiano (AIF)"
 ENG_ww1_australian_defence_consultation_desc:0 "Os bravos soldados do ANZAC e do general Sir John Monash cobrem-se de glória em Galípoli e na Frente Ocidental, liderando o avanço de armas combinadas em Hamel e Amiens."
 ENG_ww1_new_zealand_naval_consultation:0 "A Divisão Neozelandesa e o HMS New Zealand"
 ENG_ww1_new_zealand_naval_consultation_desc:0 "A Nova Zelândia financia o cruzador de batalha HMS New Zealand para a Grand Fleet e envia sua excelente divisão de infantaria veterana às frentes da Europa."
 ENG_ww1_south_african_cooperation:0 "Cooperação Sul-Africana de Botha e Smuts"
 ENG_ww1_south_african_cooperation_desc:0 "Os generais Louis Botha e Jan Smuts conquistam o Sudoeste Africano Alemão e enviam brigadas experientes para o Front Ocidental e a África Oriental."
 ENG_ww1_indian_army_liaison:0 "Mobilização do Exército Indiano"
 ENG_ww1_indian_army_liaison_desc:0 "Mais de 1,3 milhão de valorosos soldados indianos lutam na França, na Mesopotâmia, no Sinai e em Galípoli, sustentando o Império com heroísmo e disciplina."
 ENG_ww1_colonial_medical_services:0 "Serviços Médicos Imperiais e Hospitais de Campanha"
 ENG_ww1_colonial_medical_services_desc:0 "Ambulâncias motorizadas, hospitais de retaguarda e enfermarias coloniais reduzem drasticamente as mortes por febre e infecções nos fronts tropicais e europeus."
 ENG_ww1_dominion_procurement_offices:0 "Comissões de Compras dos Domínios"
 ENG_ww1_dominion_procurement_offices_desc:0 "Fábricas de munição canadenses, trigo australiano e lã neozelandesa são integrados em um circuito logístico soberano e contínuo para o esforço de guerra."
 ENG_ww1_the_mediterranean_stations:0 "As Estações Navais de Gibraltar e Malta"
 ENG_ww1_the_mediterranean_stations_desc:0 "Os baluartes estratégicos de Gibraltar e Malta protegem as rotas de passagem para o Canal de Suez e o comércio com a Índia e o Pacífico."
 ENG_ww1_singapore_maritime_coordination:0 "Coordenação Marítima de Singapura"
 ENG_ww1_singapore_maritime_coordination_desc:0 "O controle dos estreitos de Malaca e depósitos de carvão em Singapura garantem que cruzadores corsários inimigos não perturbem as rotas do Extremo Oriente."
 ENG_ww1_imperial_troop_transport:0 "Comboios Imperiais de Transporte de Tropas"
 ENG_ww1_imperial_troop_transport_desc:0 "Transatlânticos oceânicos de passageiros como o Olympic e o Mauretania são convertidos em transportes rápidos blindados protegidos pela Marinha Real."
 ENG_ww1_the_imperial_war_conference:0 "A Conferência de Guerra Imperial de 1917"
 ENG_ww1_the_imperial_war_conference_desc:0 "Pela primeira vez na história, os chefes de governo dos Domínios deliberam de igual para igual sobre as decisões estratégicas do Império Britânico."
 ENG_ww1_dominion_war_cabinet_delegates:0 "Delegados dos Domínios no Gabinete de Guerra"
 ENG_ww1_dominion_war_cabinet_delegates_desc:0 "Sir Robert Borden e Jan Smuts assumem responsabilidades operacionais diretas no planejamento de frentes militares e diplomáticas."
 ENG_ww1_indian_constitutional_consultation:0 "Declaração Montagu e Reformas na Índia"
 ENG_ww1_indian_constitutional_consultation_desc:0 "Em reconhecimento à lealdade e bravura incomparável dos soldados indianos, a Grã-Bretanha anuncia a meta de desenvolvimento gradual de autogoverno na Índia."
 ENG_ww1_colonial_labour_contracts:0 "Corpos Auxiliares de Trabalho do Império"
 ENG_ww1_colonial_labour_contracts_desc:0 "Trabalhadores voluntários egípcios, chineses e sul-africanos descarregam navios nos portos franceses e pavimentam ferrovias vitais no front."
 ENG_ww1_a_commonwealth_consultation_charter:0 "A Carta da Comunidade Britânica (Commonwealth)"
 ENG_ww1_a_commonwealth_consultation_charter_desc:0 "O Império evolui conscientemente para uma associação livre de nações soberanas unidas por valores compartilhados e lealdade à mesma Coroa."
 ENG_ww1_the_irish_settlement_conference:0 "A Conferência Constitucional Irlandesa"
 ENG_ww1_the_irish_settlement_conference_desc:0 "Negociações intensas buscam conciliar o nacionalismo irlandês e os protestantes do Ulster antes que a guerrilha consuma a ilha."
 ENG_ww1_dominion_status_for_ireland:0 "O Tratado Anglo-Irlandês & Status de Domínio"
 ENG_ww1_dominion_status_for_ireland_desc:0 "A criação do Estado Livre Irlandês com status de Domínio paritário ao Canadá pacifica as relações históricas, mantendo bases navais vitais para a Royal Navy."
 ENG_ww1_egyptian_political_negotiations:0 "O Protetorado e Acordo do Egito"
 ENG_ww1_egyptian_political_negotiations_desc:0 "O Egito torna-se protetorado britânico formalizado, garantindo a proteção perpétua do Canal de Suez contra incursões otomanas e germânicas."
 ENG_ww1_imperial_defence_after_the_war:0 "Doutrina Pós-Guerra de Defesa Imperial"
 ENG_ww1_imperial_defence_after_the_war_desc:0 "A Royal Navy e os exércitos dos Domínios integram seus estados-maiores permanentes, assegurando que o Império Britânico permaneça inexpugnável em qualquer continente."
 ENG_ww1_the_treasury_estimates:0 "Estimativas Orçamentárias do Tesouro"
 ENG_ww1_the_treasury_estimates_desc:0 "O Chanceler do Tesouro revisa as dotações fiscais e aloca fundos de emergência para modernização industrial e preparo das defesas nacionais do Reino Unido."
 ENG_ww1_industrial_district_surveys:0 "Levantamento dos Distritos Industriais"
 ENG_ww1_industrial_district_surveys_desc:0 "Uma rigorosa inspeção técnica nas bacias manufatureiras britânicas mapeia a capacidade produtiva de forjas, tornos mecânicos e oficinas para conversão militar."
 ENG_ww1_midlands_machine_shops:0 "Oficinas Mecânicas de Midlands"
 ENG_ww1_midlands_machine_shops_desc:0 "As indústrias metalúrgicas de Birmingham e Coventry são equipadas com ferramentas de alta precisão para a usinagem de cartuchos, fuzis e peças de artilharia."
 ENG_ww1_clyde_shipyard_contracts:0 "Contratos dos Estaleiros do Rio Clyde"
 ENG_ww1_clyde_shipyard_contracts_desc:0 "As margens do Clyde, na Escócia, recebem volumosos pedidos de construção naval para contratorpedeiros, cruzadores e navios de escolta da Royal Navy."
 ENG_ww1_tyne_steel_and_ordnance:0 "Aço e Armamento do Rio Tyne"
 ENG_ww1_tyne_steel_and_ordnance_desc:0 "Os complexos industriais de Newcastle e do Rio Tyne concentram sua enorme capacidade siderúrgica na fundição de canhões navais e blindagens de alta resistência."
 ENG_ww1_lancashire_engineering:0 "Engenharia Têxtil e Pesada de Lancashire"
 ENG_ww1_lancashire_engineering_desc:0 "A tradicional base manufatureira de Manchester e Lancashire expande a produção de tecidos para uniformes, motores pesados e peças de reposição mecânica."
 ENG_ww1_the_city_credit_market:0 "O Mercado de Crédito da City de Londres"
 ENG_ww1_the_city_credit_market_desc:0 "O centro financeiro mundial na City mobiliza linhas globais de crédito comercial e títulos de guerra para financiar suprimentos vitais para a Entente."
 ENG_ww1_railway_freight_coordination:0 "Coordenação Ferroviária de Carga"
 ENG_ww1_railway_freight_coordination_desc:0 "O Comitê Executivo Ferroviário assume o controle operacional unificado das linhas férreas britânicas, priorizando o fluxo ininterrupto de carvão e munições para os portos."
 ENG_ww1_domestic_coal_allocation:0 "Alocação Doméstica de Carvão"
 ENG_ww1_domestic_coal_allocation_desc:0 "O carvão de alta qualidade do País de Gales e de Yorkshire é reservado estrategicamente para abastecer as caldeiras da Grand Fleet e as fundições de aço bélico."
 ENG_ww1_national_munitions_contracts:0 "Contratos das Fábricas Nacionais de Munição"
 ENG_ww1_national_munitions_contracts_desc:0 "A criação das National Shell Factories e da monumental usina química de Gretna impulsiona a produção estatal de projéteis de artilharia e explosivos cordite."
 ENG_ww1_the_ministry_of_munitions:0 "O Ministério das Munições de David Lloyd George"
 ENG_ww1_the_ministry_of_munitions_desc:0 "Criado para superar a dramática Crise dos Projéteis de 1915, o ministério revoluciona a produção bélica, integrando ciência, indústria pesada e trabalho em escala total."
 ENG_ww1_shell_inspection_boards:0 "Conselhos de Inspeção de Projéteis"
 ENG_ww1_shell_inspection_boards_desc:0 "Normas rigorosas de controle químico e metalúrgico eliminam falhas de detonação em projéteis de alto explosivo e espoletas temporizadas britânicas."
 ENG_ww1_wartime_labour_dilution:0 "Diluição do Trabalho e as 'Munitionettes'"
 ENG_ww1_wartime_labour_dilution_desc:0 "Quase um milhão de mulheres entram nas fábricas de projéteis e componentes aeronáuticos, garantindo produção recorde enquanto os homens marcham para o front."
 ENG_ww1_the_shop_stewards_agreement:0 "Acordo com os Delegados Sindicais (Shop Stewards)"
 ENG_ww1_the_shop_stewards_agreement_desc:0 "Negociações salariais transparentes e garantias de direitos pós-guerra desarmam greves operárias no Clyde e asseguram paz nas linhas de montagem bélica."
 ENG_ww1_emergency_factory_controls:0 "Controles de Emergência sobre Fábricas Controladas"
 ENG_ww1_emergency_factory_controls_desc:0 "Mais de cinco mil estabelecimentos industriais são designados 'Estabelecimentos Controlados', dedicados integralmente à vitória militar sob a égide da DORA."
 ENG_ww1_the_ministry_of_food:0 "O Ministério da Alimentação e Racionamento"
 ENG_ww1_the_ministry_of_food_desc:0 "O controle científico de estoques de trigo, açúcar e carne, somado ao racionamento equitativo, derrota as tentativas alemãs de estrangular o sustento britânico."
 ENG_ww1_austerity_and_public_credit:0 "Austeridade e Crédito Público"
 ENG_ww1_austerity_and_public_credit_desc:0 "Campanhas patrióticas de empréstimos de guerra engajam cidadãos de todas as classes, canalizando a poupança nacional para as despesas soberanas de defesa."
 ENG_ww1_debt_service_commission:0 "Comissão de Serviço da Dívida Externa"
 ENG_ww1_debt_service_commission_desc:0 "Especialistas do Tesouro e banqueiros de Londres organizam o cronograma de liquidação de compromissos cambiais contraídos nos Estados Unidos."
 ENG_ww1_convert_the_war_plants:0 "Conversão das Fábricas Bélicas"
 ENG_ww1_convert_the_war_plants_desc:0 "Fábricas de artilharia e cartuchos são convertidas rapidamente para a produção de tratores, locomotivas civis, automóveis e bens de consumo popular."
 ENG_ww1_housing_and_civilian_employment:0 "Habitação e Emprego: 'Lares Dignos de Heróis'"
 ENG_ww1_housing_and_civilian_employment_desc:0 "O programa habitacional de Addison ('Homes Fit for Heroes') ergue conjuntos residenciais modernos com saneamento, gerando centenas de milhares de empregos."
 ENG_ww1_the_peace_administration_office:0 "Gabinete de Administração da Paz"
 ENG_ww1_the_peace_administration_office_desc:0 "Uma secretaria ministerial especial assume a gestão integrada da transição de emergência bélica para as garantias institucionais do tempo de paz."
 ENG_ww1_military_demobilisation_planning:0 "Planejamento da Desmobilização Militar"
 ENG_ww1_military_demobilisation_planning_desc:0 "Critérios escalonados por ocupação e tempo de serviço garantem o retorno ordeiro de milhões de soldados às suas cidades sem gerar colapso econômico."
 ENG_ww1_shipping_repatriation_coordination:0 "Coordenação da Frota de Repatriação"
 ENG_ww1_shipping_repatriation_coordination_desc:0 "Navios mercantes e transatlânticos da Grã-Bretanha transportam divisões imperiais de volta ao Canadá, Austrália, Nova Zelândia e Índia com celeridade."
 ENG_ww1_veterans_welfare_register:0 "Registro de Bem-Estar dos Veteranos"
 ENG_ww1_veterans_welfare_register_desc:0 "Criação de um cadastro nacional unificado para apoiar ex-combatentes com recolocação profissional, assistência psicológica e amparo familiar."
 ENG_ww1_disability_pension_administration:0 "Administração de Pensões de Invalidez de Guerra"
 ENG_ww1_disability_pension_administration_desc:0 "O Ministério das Pensões garante auxílio financeiro vitalício e cuidados hospitalares para centenas de milhares de soldados amputados e gaseados."
 ENG_ww1_civilian_training_for_returning_soldiers:0 "Capacitação Civil para Veteranos"
 ENG_ww1_civilian_training_for_returning_soldiers_desc:0 "Escolas técnicas e centros de aprendizagem industrial capacitam ex-soldados nas novas tecnologias mecânicas, elétricas e de engenharia automotiva."
 ENG_ww1_public_housing_contracts:0 "Contratos de Habitação Pública Popular"
 ENG_ww1_public_housing_contracts_desc:0 "Recursos públicos são repassados aos conselhos municipais para erradicar favelas urbanas e construir moradias arejadas e dignas para as famílias operárias."
 ENG_ww1_industrial_conversion_planning:0 "Planejamento de Reconversão Industrial"
 ENG_ww1_industrial_conversion_planning_desc:0 "Engenheiros civis e líderes fabris estabelecem diretrizes para rápida reconversão de plantas de explosivos em indústrias químicas de fertilizantes e plásticos."
 ENG_ww1_the_employment_exchanges:0 "Bolsas Nacionais de Emprego"
 ENG_ww1_the_employment_exchanges_desc:0 "A rede pública de agências de trabalho cruza ofertas industriais e agrícolas com a mão de obra disponível, reduzindo drasticamente o desemprego pós-guerra."
 ENG_ww1_restore_civilian_railway_traffic:0 "Restauração do Tráfego Ferroviário Civil"
 ENG_ww1_restore_civilian_railway_traffic_desc:0 "As locomotivas e vagões requisitados na guerra são revisados e devolvidos ao tráfego comercial, restaurando o transporte eficiente de bens de consumo."
 ENG_ww1_public_debt_repayment:0 "Amortização Responsável da Dívida Pública"
 ENG_ww1_public_debt_repayment_desc:0 "Uma gestão orçamentária rigorosa e a amortização contínua de títulos nos mercados internacionais restauram a solidez inabalável da Libra Esterlina."
 ENG_ww1_treasury_expenditure_review:0 "Revisão de Despesas do Tesouro (Geddes Axe)"
 ENG_ww1_treasury_expenditure_review_desc:0 "O comitê liderado por Sir Eric Geddes elimina redundâncias administrativas e gastos militares supérfluos, equilibrando o orçamento nacional."
 ENG_ww1_merchant_marine_renewal:0 "Renovação da Marinha Mercante"
 ENG_ww1_merchant_marine_renewal_desc:0 "Estaleiros do Tyne e do Clyde entregam modernos navios de carga movidos a óleo combustível, recompondo e ampliando a frota mercante imperial."
 ENG_ww1_the_public_health_settlement:0 "Acordo Nacional de Saúde Pública"
 ENG_ww1_the_public_health_settlement_desc:0 "A fundação do Ministério da Saúde unifica o combate a epidemias, saneamento urbano, assistência materno-infantil e vigilância sanitária nacional."
 ENG_ww1_the_education_reconstruction_programme:0 "Programa de Reconstrução da Educação (Fisher Act)"
 ENG_ww1_the_education_reconstruction_programme_desc:0 "A Lei Fisher de 1918 eleva a idade escolar obrigatória para 14 anos e amplia colégios técnicos, forjando uma geração de trabalhadores altamente qualificados."
 ENG_ww1_local_government_finance:0 "Financiamento do Governo Local"
 ENG_ww1_local_government_finance_desc:0 "Repasses fiscais para os governos de condados e cidades financiam estradas pavimentadas, iluminação pública elétrica e serviços de água potável."
 ENG_ww1_the_industrial_relations_conference:0 "Conferência Nacional de Relações Industriais"
 ENG_ww1_the_industrial_relations_conference_desc:0 "Os Conselhos Whitley estabelecem fóruns permanentes de negociação paritária entre industriais e sindicatos, garantindo estabilidade produtiva duradoura."
 ENG_ww1_the_postwar_parliamentary_mandate:0 "O Mandato Parlamentar do Pós-Guerra"
 ENG_ww1_the_postwar_parliamentary_mandate_desc:0 "A ratificação soberana de leis fundamentais pelos Comuns restabelece as liberdades civis plenas e a supremacia do direito parlamentar britânico."
 ENG_ww1_the_nineteen_twenty_two_cabinet:0 "O Gabinete Conservador de 1922"
 ENG_ww1_the_nineteen_twenty_two_cabinet_desc:0 "A reunião histórica do Carlton Club dissolve a coalizão de Lloyd George; Bonar Law e Stanley Baldwin assumem o governo com foco na estabilidade e tranquilidade."
 ENG_ww1_the_nineteen_twenty_three_settlement:0 "A Consolidação Imperial de 1923"
 ENG_ww1_the_nineteen_twenty_three_settlement_desc:0 "O Reino Unido consolida sua recuperação interna e o alinhamento com a Comunidade de Nações, assegurando uma era de estabilidade democrática e prosperidade."
 ENG_ww1_edward_grey_and_the_entente:0 "Sir Edward Grey e a Entente Cordiale"
 ENG_ww1_edward_grey_and_the_entente_desc:0 "O Secretário de Relações Exteriores Sir Edward Grey conduz uma diplomacia firme para conter o expansionismo imperial alemão, estreitando laços com a França e a Rússia."
 ENG_ww1_the_french_naval_understanding:0 "O Acordo Naval Anglo-Francês de 1912"
 ENG_ww1_the_french_naval_understanding_desc:0 "Um acordo naval histórico transfere a frota de guerra francesa para o Mediterrâneo, enquanto a Royal Navy assume a defesa total do Canal da Mancha e do Atlântico Norte."
 ENG_ww1_french_staff_conversations:0 "Conversações entre os Estados-Maiores Anglo-Franceses"
 ENG_ww1_french_staff_conversations_desc:0 "O General Wilson e o Estado-Maior francês planejam secretamente o desembarque, rotas ferroviárias e setores de combate para a Força Expedicionária Britânica."
 ENG_ww1_continental_commitment:0 "O Compromisso Continental"
 ENG_ww1_continental_commitment_desc:0 "A Grã-Bretanha declara inequivocamente que a segurança da Europa Ocidental e a integridade da França são vitais para a sobrevivência do Império Britânico."
 ENG_ww1_armed_neutrality:0 "Neutralidade Armada e Alerta Estratégico"
 ENG_ww1_armed_neutrality_desc:0 "Enquanto as chancelarias buscam a paz, as defesas costeiras britânicas são guarnecidas e a Grand Fleet concentra seus esquadrões em alto mar."
 ENG_ww1_belgian_treaty_obligations:0 "O Tratado de Londres e a Neutralidade Belga"
 ENG_ww1_belgian_treaty_obligations_desc:0 "Invocando o solene Tratado de Londres de 1839, o Reino Unido entra na guerra contra o Império Alemão pela violação da neutralidade da Bélgica."
 ENG_ww1_reconsider_the_continental_policy:0 "Flexibilidade na Política Continental"
 ENG_ww1_reconsider_the_continental_policy_desc:0 "O Foreign Office avalia opções diplomáticas pragmáticas, assegurando que o Reino Unido mantenha sua liberdade de manobra e vantagens comerciais globais."
 ENG_ww1_channel_expeditionary_coordination:0 "Coordenação Expedicionária do Canal da Mancha"
 ENG_ww1_channel_expeditionary_coordination_desc:0 "A Marinha Real e o Almirantado estabelecem a 'Dover Patrol', garantindo que nenhum navio inimigo ameace a passagem de centenas de milhares de soldados ingleses para a França."
 ENG_ww1_russian_procurement_liaison:0 "Missão de Suprimento ao Império Russo"
 ENG_ww1_russian_procurement_liaison_desc:0 "Técnicos e financiadores britânicos coordenam o envio de fuzis, obuses e matérias-primas essenciais para o Exército Imperial Russo pelos portos árticos."
 ENG_ww1_neutral_shipping_assurances:0 "Garantias de Navegação para Países Neutros"
 ENG_ww1_neutral_shipping_assurances_desc:0 "Acordos diplomáticos com Holanda, Noruega e Dinamarca regulam o tráfego comercial no Mar do Norte, fechando o contrabando para a Alemanha sem provocar incidentes."
 ENG_ww1_american_credit_negotiations:0 "Negociações de Crédito com os Estados Unidos"
 ENG_ww1_american_credit_negotiations_desc:0 "A nomeação do banco J.P. Morgan como agente de compras britânico abre o monumental mercado financeiro e industrial dos Estados Unidos para a Entente."
 ENG_ww1_italian_coalition_talks:0 "As Negociações do Pacto de Londres com a Itália"
 ENG_ww1_italian_coalition_talks_desc:0 "Conversações diplomáticas secretas em Londres garantem a entrada da Itália na guerra ao lado da Entente em maio de 1915, abrindo um front alpino contra a Áustria-Hungria."
 ENG_ww1_the_portuguese_connection:0 "A Histórica Aliança Luso-Britânica"
 ENG_ww1_the_portuguese_connection_desc:0 "A invocação do Tratado de Windsor de 1386 traz Portugal para o conflito, garantindo o Corpo Expedicionário Português (CEP) em Flandres e segurança colonial na África."
 ENG_ww1_balkan_allied_coordination:0 "Coordenação Aliada nos Bálcãs"
 ENG_ww1_balkan_allied_coordination_desc:0 "A expedição de Salonica e o apoio logístico à Sérvia, Romênia e Grécia sustentam o fronte meridional, ameaçando o flanco das Potências Centrais."
 ENG_ww1_coalition_shipping_priorities:0 "Prioridades Marítimas da Coalizão"
 ENG_ww1_coalition_shipping_priorities_desc:0 "O Conselho Aliado de Transporte Marítimo reúne navios mercantes britânicos, franceses e italianos sob alocação conjunta, garantindo trigo e carvão onde forem vitais."
 ENG_ww1_the_supreme_war_council:0 "O Conselho Supremo de Guerra de Versalhes"
 ENG_ww1_the_supreme_war_council_desc:0 "A criação de um comando estratégico unificado em Versalhes sob o Generalíssimo Ferdinand Foch harmoniza as ofensivas britânicas, francesas e americanas em 1918."
 ENG_ww1_armistice_consultations:0 "Consultas para o Armistício"
 ENG_ww1_armistice_consultations_desc:0 "Os líderes aliados formulam as cláusulas incontornáveis de cessar-fogo: entrega da frota alemã, evacuação da Bélgica e ocupação da Renânia."
 ENG_ww1_reconstruction_credit_negotiations:0 "Negociações de Crédito para a Reconstrução"
 ENG_ww1_reconstruction_credit_negotiations_desc:0 "Negociações financeiras entre Londres, Paris e Washington estabelecem moratórias responsáveis e investimentos cooperativos para reerguer a Europa devastada."
 ENG_ww1_the_naval_disarmament_conference:0 "A Conferência de Desarmamento Naval"
 ENG_ww1_the_naval_disarmament_conference_desc:0 "Diplomatas britânicos lideram o debate para fixar proporções globais de encouraçados (o Tratado de Washington), aliviando despesas sem perder a supremacia do mar."
 ENG_ww1_a_european_security_settlement:0 "O Acordo de Segurança Europeia e a Liga das Nações"
 ENG_ww1_a_european_security_settlement_desc:0 "A adesão britânica à Liga das Nações e a consagração do direito internacional inauguram uma nova ordem diplomática fundada na autodeterminação e na mediação pacífica."
 ENG_ww1_the_haldane_establishment:0 "As Reformas do Exército de Lord Haldane"
 ENG_ww1_the_haldane_establishment_desc:0 "A reorganização estrutural conduzida pelo Secretário de Guerra Richard Haldane cria o Estado-Maior Imperial, a Força Territorial e a moderna Força Expedicionária."
 ENG_ww1_territorial_force_camps:0 "Acampamentos de Instrução da Força Territorial"
 ENG_ww1_territorial_force_camps_desc:0 "Os batalhões de reservistas voluntários da Força Territorial realizam manobras anuais de verão, treinando tiro de fuzil e marcha sob disciplina militar estrita."
 ENG_ww1_the_special_reserve:0 "A Reserva Especial de Substituição"
 ENG_ww1_the_special_reserve_desc:0 "Batalhões de Reserva Especial são organizados em cada regimento britânico para receber e treinar recrutas, garantindo fluxo ininterrupto de reposições para o front."
 ENG_ww1_officer_training_corps:0 "Corpo de Treinamento de Oficiais Universitários (OTC)"
 ENG_ww1_officer_training_corps_desc:0 "Unidades de cadetes em Oxford, Cambridge e escolas públicas britânicas formam milhares de subalternos cultos e decididos, prontos para comandar pelotões de infantaria."
 ENG_ww1_regular_army_mobilisation:0 "Mobilização das Divisões Regulares"
 ENG_ww1_regular_army_mobilisation_desc:0 "Planos ferroviários detalhados concentram as seis divisões regulares da Grã-Bretanha e a Divisão de Cavalaria nos portos de embarque de Southampton e Dover."
 ENG_ww1_army_service_corps_offices:0 "Diretoria de Intendência do Army Service Corps"
 ENG_ww1_army_service_corps_offices_desc:0 "A introdução de caminhões motorizados e depósitos avançados de munição pelo Army Service Corps assegura que as tropas nunca fiquem sem rações e cartuchos."
 ENG_ww1_the_expeditionary_establishment:0 "A Força Expedicionária Britânica (BEF)"
 ENG_ww1_the_expeditionary_establishment_desc:0 "Os 'Old Contemptibles' cruzam o Canal da Mancha. Considerado o exército profissional mais bem treinado do planeta, cada soldado é capaz de disparar 15 tiros precisos por minuto."
 ENG_ww1_kitchener_new_armies:0 "O Apelo de Kitchener: 'Your Country Needs You'"
 ENG_ww1_kitchener_new_armies_desc:0 "O Secretário de Guerra Lord Kitchener prevê uma luta de longos anos e convoca a juventude imperial. Milhões de voluntários acorrem aos postos de recrutamento."
 ENG_ww1_the_pals_battalion_system:0 "Batalhões de Camaradas (Pals Battalions)"
 ENG_ww1_the_pals_battalion_system_desc:0 "Homens de uma mesma cidade, clube de futebol, ferrovia ou universidade se alistam juntos, forjando uma coesão fraterna lendária nos campos de batalha da França."
 ENG_ww1_the_rifle_training_depots:0 "Depósitos de Instrução de Tiro com Lee-Enfield"
 ENG_ww1_the_rifle_training_depots_desc:0 "Instrução intensiva de tiro rápido com o lendário fuzil Short Magazine Lee-Enfield (SMLE Mk III) confere às tropas britânicas uma potência de fogo fulminante."
 ENG_ww1_field_medical_organisation:0 "Organização Médica e Hospitalar do RAMC"
 ENG_ww1_field_medical_organisation_desc:0 "Ambulâncias motorizadas, hospitais de campanha de evacuação rápida e antissépticos modernos salvam as vidas de centenas de milhares de feridos em combate."
 ENG_ww1_the_artillery_observation_school:0 "Escola de Observação e Balística de Artilharia"
 ENG_ww1_the_artillery_observation_school_desc:0 "Cursos avançados em Larkhill desenvolvem técnicas de tiro indireto, calibração meteorológica e cooperação entre balões de observação e canhões QF de 18 libras."
 ENG_ww1_machine_gun_corps_formation:0 "Criação do Machine Gun Corps (MGC)"
 ENG_ww1_machine_gun_corps_formation_desc:0 "Reunindo metralhadoras Vickers .303 resfriadas a água sob um corpo especializado em Belton Park, a infantaria britânica adquire uma cortina defensiva intransponível."
 ENG_ww1_trench_mortar_sections:0 "Seções de Morteiros de Trincheira Stokes"
 ENG_ww1_trench_mortar_sections_desc:0 "A invenção do morteiro portátil Stokes de 3 polegadas por Sir Wilfred Stokes fornece apoio de fogo de curto alcance devastador diretamente nas trincheiras inimigas."
 ENG_ww1_gas_protection_training:0 "Instrução Antigás e Máscaras Box Respirator"
 ENG_ww1_gas_protection_training_desc:0 "A distribuição em larga escala da máscara Small Box Respirator e treinamentos em câmaras de gás neutralizam o terror das armas químicas nas trincheiras."
 ENG_ww1_the_infantry_training_directorate:0 "Diretoria de Treinamento Tático de Infantaria"
 ENG_ww1_the_infantry_training_directorate_desc:0 "A reorganização da seção de infantaria em equipes combinadas de fuzileiros, granadeiros, atiradores Lewis e morteiros revoluciona o combate de assalto."
 ENG_ww1_combined_arms_staff_courses:0 "Cursos de Armas Combinadas do Estado-Maior"
 ENG_ww1_combined_arms_staff_courses_desc:0 "Oficiais do Estado-Maior são instruídos a integrar tanques, aviação tática de ataque ao solo, artilharia rastejante e infantaria em ofensivas sincronizadas."
 ENG_ww1_the_demobilisation_register:0 "Cadastro de Desmobilização Militar"
 ENG_ww1_the_demobilisation_register_desc:0 "Classificação metódica dos combatentes por tempo de serviço e prioridade econômica para assegurar a desmobilização ordenada sem convulsão social."
 ENG_ww1_a_smaller_professional_force:0 "Reestruturação do Exército Profissional Pós-Guerra"
 ENG_ww1_a_smaller_professional_force_desc:0 "Retorno ao modelo de forças expedicionárias profissionais altamente treinadas e mecanizadas, adequadas à doutrina de contenção imperial global."
 ENG_ww1_territorial_defence_renewal:0 "Renovação da Defesa Territorial Metropolitana"
 ENG_ww1_territorial_defence_renewal_desc:0 "A Força Territorial é revigorada com equipamento moderno excedente de guerra, servindo como esteio inquebrantável da defesa das Ilhas Britânicas."
 ENG_ww1_the_channel_mobilisation_timetable:0 "Cronograma de Mobilização do Canal da Mancha"
 ENG_ww1_the_channel_mobilisation_timetable_desc:0 "Embarcações requisitadas e comboios de tropas sob escolta naval realizam a travessia diária do Canal sem a perda de um único soldado britânico por ação inimiga."
 ENG_ww1_embarkation_depot_preparation:0 "Preparação dos Portos de Embarque"
 ENG_ww1_embarkation_depot_preparation_desc:0 "Grandes depósitos de suprimentos, carvoeiros e instalações de guindastes pesados em Southampton e Portsmouth garantem carregamento dia e noite."
 ENG_ww1_the_bef_deployment_plan:0 "Desdobramento da BEF em Flandres"
 ENG_ww1_the_bef_deployment_plan_desc:0 "Sob o comando de Sir John French, o corpo expedicionário toma posições no flanco esquerdo francês em Mons, bloqueando o avanço do Plano Schlieffen alemão."
 ENG_ww1_the_flanders_supply_organisation:0 "Organização Logística de Flandres"
 ENG_ww1_the_flanders_supply_organisation_desc:0 "Ferrovias de bitola estreita e depósitos subterrâneos garantem que o Exército Britânico nas trincheiras de Ypres e do Somme receba munições sem cessar."
 ENG_ww1_holding_the_continental_line:0 "Sustentando a Linha Continental de Trincheiras"
 ENG_ww1_holding_the_continental_line_desc:0 "Em Ypres, Festubert e Givenchy, as tropas britânicas resistem a ataques furiosos de artilharia pesada inimiga com heroísmo inabalável."
 ENG_ww1_artillery_ammunition_concentration:0 "Concentração Maciça de Munição de Artilharia"
 ENG_ww1_artillery_ammunition_concentration_desc:0 "Milhões de granadas de 18 libras e obuses pesados de 6 e 8 polegadas são acumulados para pulverizar as redes de arame farpado e casamatas inimigas."
 ENG_ww1_a_limited_offensive_doctrine:0 "Doutrina de Ofensivas Limitadas (Bite and Hold)"
 ENG_ww1_a_limited_offensive_doctrine_desc:0 "Táticas de 'morder e segurar': atacar objetivos estritamente dentro do alcance da artilharia e aniquilar contra-ataques inimigos com fogo defensivo mortal."
 ENG_ww1_the_dardanelles_staff_study:0 "Estudo Estratégico dos Dardanelos e Galípoli"
 ENG_ww1_the_dardanelles_staff_study_desc:0 "O Almirantado e o Gabinete analisam o plano audacioso de forçar os estreitos turcos para reabrir as rotas navais com a Rússia e nocautear o Império Otomano."
 ENG_ww1_mediterranean_landing_preparation:0 "Preparação para Desembarque Anfíbio no Mediterrâneo"
 ENG_ww1_mediterranean_landing_preparation_desc:0 "Barges de desembarque 'Beetles' blindadas e batalhões de fuzileiros navais da Royal Naval Division preparam assaltos de praia pioneiros."
 ENG_ww1_mesopotamian_supply_review:0 "Revisão Logística da Mesopotâmia e Queda de Bagdá"
 ENG_ww1_mesopotamian_supply_review_desc:0 "Após a tragédia de Kut, o General Stanley Maude reorganiza ferrovias, vapores no Rio Tigre e hospitais, liderando a ofensiva triunfal que liberta Bagdá em 1917."
 ENG_ww1_the_western_offensive_staff_study:0 "Estudo das Grandes Ofensivas da Frente Ocidental"
 ENG_ww1_the_western_offensive_staff_study_desc:0 "Análise exaustiva das batalhas do Somme e Passchendaele, identificando a necessidade crucial de barragens móveis e infiltração profunda."
 ENG_ww1_the_creeping_barrage_school:0 "A Escola da Barragem Rastejante de Artilharia"
 ENG_ww1_the_creeping_barrage_school_desc:0 "Uma muralha viva de fogo de artilharia avança a exatos 50 metros à frente da infantaria com precisão cronometrada, mantendo os defensores inimigos enterrados em seus abrigos."
 ENG_ww1_tank_committee_experiments:0 "Experimentos do Comitê de Landships e os Blindados"
 ENG_ww1_tank_committee_experiments_desc:0 "Sob a liderança visionária de Winston Churchill e engenheiros britânicos, nasce o tanque de guerra: o 'Little Willie' e o couraçado de esteiras Mark I."
 ENG_ww1_assault_coordination_exercises:0 "Exercícios de Assalto Combinado com Tanques (Cambrai)"
 ENG_ww1_assault_coordination_exercises_desc:0 "Em Cambrai e Amiens, centenas de blindados esmagam o arame farpado e cruzam as trincheiras sem bombardeio prévio, conquistando ruptura tática histórica."
 ENG_ww1_palestine_railway_liaison:0 "Ferrovia Militar da Palestina e a Tomada de Jerusalém"
 ENG_ww1_palestine_railway_liaison_desc:0 "O General Edmund Allenby constrói uma ferrovia e adutora de água através do deserto do Sinai, rompendo a linha de Gaza-Beersheba e entrando vitorioso em Jerusalém a pé."
 ENG_ww1_the_spring_defence_plan:0 "O Plano Defensivo da Primavera: 'De Costas para a Parede'"
 ENG_ww1_the_spring_defence_plan_desc:0 "A ordem histórica do Marechal Haig ('Backs to the Wall') conclama cada soldado a resistir até a morte contra a Kaiserschlacht alemã de 1918."
 ENG_ww1_the_allied_counteroffensive_plan:0 "A Ofensiva dos Cem Dias (Amiens até a Vitória)"
 ENG_ww1_the_allied_counteroffensive_plan_desc:0 "Em 8 de agosto de 1918, o 'dia negro do exército alemão', corpos britânicos, canadenses e australianos desferem o golpe definitivo que destrói a Linha Hindenburg."
 ENG_ww1_operational_reserve_restoration:0 "Restauração das Reservas Operacionais"
 ENG_ww1_operational_reserve_restoration_desc:0 "Reagrupamento rápido de divisões veteranas e fluxo ininterrupto de reposições garantem que o Exército Britânico mantenha pressão ofensiva constante."
 ENG_ww1_the_armistice_stand_down_plan:0 "O Plano de Cessar-Fogo do Armistício"
 ENG_ww1_the_armistice_stand_down_plan_desc:0 "Às 11 horas do dia 11 de novembro de 1918, as armas silenciam na Frente Ocidental. As tropas britânicas avançam para vigiar a Renânia em perfeita ordem."
 ENG_ww1_lessons_for_the_general_staff:0 "Lições Doutrinárias para o Estado-Maior Imperial"
 ENG_ww1_lessons_for_the_general_staff_desc:0 "A síntese da guerra mecânica, cooperação aero-terrestre e artilharia científica transforma a doutrina britânica na mais avançada do mundo moderno."
 ENG_ww1_admiralty_fleet_survey:0 "Inspeção da Frota do Almirantado"
 ENG_ww1_admiralty_fleet_survey_desc:0 "O Primeiro Lorde do Almirantado e o Primeiro Lorde do Mar Jackie Fisher avaliam a prontidão global da esquadra, reafirmando o 'Two-Power Standard'."
 ENG_ww1_the_naval_estimates:0 "O Orçamento Naval de Winston Churchill"
 ENG_ww1_the_naval_estimates_desc:0 "O orçamento naval de 1912 financia a rápida conversão das caldeiras da marinha para óleo combustível e a encomenda de novas divisões de encouraçados."
 ENG_ww1_dreadnought_construction_planning:0 "Super-Dreadnoughts da Classe Queen Elizabeth"
 ENG_ww1_dreadnought_construction_planning_desc:0 "Encouraçados velozes equipados com devastadores canhões de 15 polegadas e blindagem espessa asseguram supremacia de fogo absoluto em duelos de linha."
 ENG_ww1_battlecruiser_squadron_planning:0 "Esquadrões de Cruzadores de Batalha de Beatty"
 ENG_ww1_battlecruiser_squadron_planning_desc:0 "Navios velozes da classe Lion e Tiger sob o Almirante David Beatty garantem o reconhecimento armado e caça aos cruzadores alemães em alta velocidade."
 ENG_ww1_destroyer_flotilla_planning:0 "Flotilhas de Contratorpedeiros de Alto-Mar"
 ENG_ww1_destroyer_flotilla_planning_desc:0 "Construção maciça de contratorpedeiros das classes V e W, equipados com tubos de torpedos triplos e canhões rápidos para escolta da Grand Fleet."
 ENG_ww1_submarine_service_development:0 "Desenvolvimento da Força de Submarinos da Marinha Real"
 ENG_ww1_submarine_service_development_desc:0 "Submarinos oceânicos das classes E e J patrulham as costas alemãs e o Mar Báltico, torpedeando navios de guerra e comboios de minério de ferro inimigos."
 ENG_ww1_naval_gunnery_calibration:0 "Sistemas de Direção de Tiro e Calibração Balística"
 ENG_ww1_naval_gunnery_calibration_desc:0 "A introdução das torres de controle de tiro de Sir Percy Scott e mesas mecânicas Dreyer confere precisão cirúrgica aos disparos em longa distância."
 ENG_ww1_the_north_sea_watch:0 "A Patrulha do Norte no Mar do Marte"
 ENG_ww1_the_north_sea_watch_desc:0 "O 10º Esquadrão de Cruzadores vigia as passagens entre a Escócia, Ilhas Faroé e Noruega em mares bravios, interceptando qualquer carga destinada à Alemanha."
 ENG_ww1_grand_fleet_maintenance:0 "A Grand Fleet em Scapa Flow"
 ENG_ww1_grand_fleet_maintenance_desc:0 "Sob o comando do Almirante Sir John Jellicoe, a maior concentração de couraçados da história aguarda em prontidão permanente nas ilhas Órcades."
 ENG_ww1_merchant_shipping_register:0 "Registro Geral da Marinha Mercante"
 ENG_ww1_merchant_shipping_register_desc:0 "Milhares de vapores comerciais britânicos são catalogados e colocados sob a autoridade do Almirantado para assegurar as linhas de vida imperiais."
 ENG_ww1_maritime_blockade_coordination:0 "O Bloqueio Distante da Alemanha"
 ENG_ww1_maritime_blockade_coordination_desc:0 "O bloqueio naval britânico sufoca as importações de salitre, borracha e cereais das Potências Centrais, desgastando sua capacidade econômica de sustentar a guerra."
 ENG_ww1_hydrophone_trials:0 "Ensaios com Hidrofones e Escuta Submarina"
 ENG_ww1_hydrophone_trials_desc:0 "Cientistas da Marinha desenvolvem hidrofones subaquáticos direcionais capazes de escutar os motores e hélices dos U-boats alemães em imersão."
 ENG_ww1_depth_charge_trials:0 "Cargas de Profundidade Tipo D e Lançadores"
 ENG_ww1_depth_charge_trials_desc:0 "A arma definitiva anti-submarina: cilindros de alto explosivo acionados por pressão hidrostática que esmagam o casco de submarinos alemães submersos."
 ENG_ww1_convoy_system_organisation:0 "Implementação do Sistema Obrigatório de Comboios"
 ENG_ww1_convoy_system_organisation_desc:0 "A decisão histórica de Lloyd George em 1917 de navegar mercantes em grupos protegidos por destróieres e aeronaves reduz as perdas de navios a quase zero."
 ENG_ww1_escort_refit_contracts:0 "Contratos de Conversão de Escoltas e Caça-Submarinos"
 ENG_ww1_escort_refit_contracts_desc:0 "Traineiras de pesca, iates e navios de passageiros são convertidos com canhões de 12 libras e cargas de profundidade para a patrulha das águas metropolitanas."
 ENG_ww1_naval_signals_and_direction_finding:0 "Estações de Radiogoniometria (HF/DF Naval)"
 ENG_ww1_naval_signals_and_direction_finding_desc:0 "Uma cadeia de antenas goniométricas na costa britânica triangula transmissões de rádio alemãs instantaneamente, alertando patrulhas para emboscadas."
 ENG_ww1_mediterranean_convoy_liaison:0 "Rede de Comboios do Mediterrâneo"
 ENG_ww1_mediterranean_convoy_liaison_desc:0 "Bases estratégicas em Gibraltar, Malta e Alexandria organizam a proteção contínua de cargueiros de trigo da Austrália e do Canal de Suez."
 ENG_ww1_the_postwar_fleet_review:0 "A Revista da Frota em Spithead"
 ENG_ww1_the_postwar_fleet_review_desc:0 "O Rei George V passa em revista a frota triunfante em Spithead. Dezenas de milhas de navios de aço celebram a soberania britânica dos sete mares."
 ENG_ww1_naval_budget_retrenchment:0 "Ajuste Orçamentário da Marinha (Tratado de Washington)"
 ENG_ww1_naval_budget_retrenchment_desc:0 "O desarmamento naval negociado evita uma corrida armamentista ruinosa contra os Estados Unidos, mantendo a paridade e economizando milhões de libras."
 ENG_ww1_naval_technical_lessons:0 "Lições Técnicas da Guerra no Mar (Jutlândia)"
 ENG_ww1_naval_technical_lessons_desc:0 "A análise das perdas de cruzadores de batalha na Batalha da Jutlândia conduz à reformulação do manuseio de cordite, blindagem horizontal e controle de danos."
 ENG_ww1_the_air_battalion_experiments:0 "Experimentos do Batalhão Aéreo dos Engenheiros Reais"
 ENG_ww1_the_air_battalion_experiments_desc:0 "Balões de observação amarrados e monoplanos primitivos na planície de Salisbury testam a aplicação militar da aviação para o exército."
 ENG_ww1_royal_flying_corps_organisation:0 "Criação do Royal Flying Corps (RFC)"
 ENG_ww1_royal_flying_corps_organisation_desc:0 "Fundado em 1912 pelo Rei George V com o lema 'Per Ardua ad Astra', o RFC prepara esquadrilhas de observadores para operar junto com a BEF na França."
 ENG_ww1_military_pilot_instruction:0 "A Escola Central de Voo em Upavon"
 ENG_ww1_military_pilot_instruction_desc:0 "Instrutores veteranos padronizam o treinamento acrobático, recuperação de estol e navegação aérea em Upavon, formando aviadores de elite."
 ENG_ww1_aerial_reconnaissance_reports:0 "Reconhecimento Aéreo e Mapeamento de Trincheiras"
 ENG_ww1_aerial_reconnaissance_reports_desc:0 "Câmeras aéreas acopladas à fuselagem fotografam as posições inimigas diariamente, fornecendo ao Estado-Maior mapas detalhados das defesas alemãs."
 ENG_ww1_royal_naval_air_service_organisation:0 "Criação do Royal Naval Air Service (RNAS)"
 ENG_ww1_royal_naval_air_service_organisation_desc:0 "Sob o estímulo direto de Winston Churchill, a aviação naval ganha autonomia para caçar submarinos, defender bases e operar bombardeiros pesados."
 ENG_ww1_wireless_and_aircraft_observation:0 "Transmissão Sem Fio para Calibração de Artilharia"
 ENG_ww1_wireless_and_aircraft_observation_desc:0 "Aparelhos de rádio transmissores a bordo dos aviões corrigem os disparos das baterias britânicas em tempo real, devastando alvos ocultos."
 ENG_ww1_bristol_scout_trials:0 "Ensaios com o Caça Bristol Scout"
 ENG_ww1_bristol_scout_trials_desc:0 "O ágil biplano Bristol Scout abre caminho para aeronaves monoposto de alta velocidade dedicadas à superioridade aérea e interceptação."
 ENG_ww1_naval_seaplane_stations:0 "Estações de Hidroaviões e Navios-Aeródromo Pioneiros"
 ENG_ww1_naval_seaplane_stations_desc:0 "A Marinha Real pioneira converte o HMS Argus e o HMS Furious em navios com conveses corridos de voo, inventando o porta-aviões moderno."
 ENG_ww1_aircraft_production_contracts:0 "Contratos Nacionais de Produção Aeronáutica"
 ENG_ww1_aircraft_production_contracts_desc:0 "Fábricas da Sopwith, De Havilland, Vickers e Handley Page recebem vultosos contratos estatais, tornando a indústria britânica a mais produtiva do mundo."
 ENG_ww1_fighter_squadron_instruction:0 "Doutrina de Caça dos Ases do RFC (Sopwith Camel)"
 ENG_ww1_fighter_squadron_instruction_desc:0 "Ases como Mick Mannock e Billy Bishop, voando nos lendários Sopwith Camel e SE5a, dominam o espaço aéreo sobre os campos da França."
 ENG_ww1_artillery_spotting_liaison:0 "Oficiais de Ligação Aérea com a Artilharia"
 ENG_ww1_artillery_spotting_liaison_desc:0 "Protocolos estreitos de ligação entre observadores aéreos do RE8 e comandos de corpos de artilharia garantem barragens devastadoras."
 ENG_ww1_night_flying_experiments:0 "Táticas de Voo Noturno e Holofotes"
 ENG_ww1_night_flying_experiments_desc:0 "Iluminação de pistas e instrumentos fosforescentes no painel permitem interceptações aéreas na escuridão contra invasores alemães."
 ENG_ww1_bomber_range_experiments:0 "Bombardeiros Pesados Handley Page O/400"
 ENG_ww1_bomber_range_experiments_desc:0 "O colossal bimotor Handley Page O/400 é capaz de carregar quase uma tonelada de bombas, permitindo ataques estratégicos profundos na Renânia."
 ENG_ww1_aircraft_engine_reliability:0 "Motores Aeronáuticos Rolls-Royce Eagle e Falcon"
 ENG_ww1_aircraft_engine_reliability_desc:0 "Os motores V12 Rolls-Royce Eagle estabelecem um padrão incomparável de potência, resistência mecânica e altitude de operação."
 ENG_ww1_home_air_defence_coordination:0 "Comando de Defesa Antiaérea de Londres (LADA)"
 ENG_ww1_home_air_defence_coordination_desc:0 "A integração de baterias antiaéreas, holofotes potentes e caças noturnos derrota as incursões de zepelins e bombardeiros Gotha contra Londres."
 ENG_ww1_the_independent_air_service_debate:0 "O Relatório Smuts e a Força Aérea Independente"
 ENG_ww1_the_independent_air_service_debate_desc:0 "O General Jan Smuts apresenta seu memorando histórico recomendando a fusão do RFC e do RNAS em um ministério do ar autônomo com doutrina própria."
 ENG_ww1_royal_air_force_unification:0 "A Criação da Royal Air Force (RAF)"
 ENG_ww1_royal_air_force_unification_desc:0 "Em 1 de abril de 1918, nasce a primeira força aérea independente do planeta sob Sir Hugh Trenchard, consolidando o poder aéreo como arma decisiva."
 ENG_ww1_postwar_aircraft_demobilisation:0 "Desmobilização Aérea do Pós-Guerra"
 ENG_ww1_postwar_aircraft_demobilisation_desc:0 "Venda ordeira de excedentes de biplanos e transição de milhares de mecânicos e aviadores para as empresas aeronáuticas civis nascentes."
 ENG_ww1_civil_aviation_research:0 "Pesquisa de Aviação Comercial e Imperial Airways"
 ENG_ww1_civil_aviation_research_desc:0 "Adaptação de bombardeiros pesados para voos de passageiros e mala postal, conectando Londres ao Cairo, Bagdá, Nova Délhi e Sydney."
 ENG_ww1_a_sustainable_air_establishment:0 "A Fundação da Força Aérea Permanente de Trenchard"
 ENG_ww1_a_sustainable_air_establishment_desc:0 "A criação do RAF College em Cranwell e a doutrina de controle aéreo imperial garantem a sobrevivência e primazia da RAF no tempo de paz."
 ENG_ww1_the_national_physical_laboratory:0 "O Laboratório Físico Nacional (NPL) de Teddington"
 ENG_ww1_the_national_physical_laboratory_desc:0 "O NPL estabelece padrões científicos soberanos em metrologia, aerodinâmica e termodinâmica, fornecendo precisão inigualável à engenharia britânica."
 ENG_ww1_university_military_contracts:0 "Contratos Universitários de Pesquisa Militar"
 ENG_ww1_university_military_contracts_desc:0 "Os laboratórios Cavendish de Cambridge, Oxford e o Imperial College canalizam as maiores mentes acadêmicas para desvendar soluções bélicas de vanguarda."
 ENG_ww1_ordnance_metallurgy_research:0 "Metalurgia Avançada de Blindagens de Sheffield"
 ENG_ww1_ordnance_metallurgy_research_desc:0 "Ligas especiais de aço-níquel-cromo desenvolvidas em Sheffield resistem ao impacto de projéteis perfurantes e aumentam a vida útil das almas de canhões."
 ENG_ww1_machine_tool_standards:0 "Padronização de Tornos e Ferramentas Mecânicas"
 ENG_ww1_machine_tool_standards_desc:0 "Gabaritos e matrizes universais permitem que pequenas oficinas familiares fabriquem peças de fuzis e obuses com tolerâncias micrométricas perfeitamente intercambiáveis."
 ENG_ww1_railway_engineering_standards:0 "Padronização da Engenharia Ferroviária"
 ENG_ww1_railway_engineering_standards_desc:0 "Projetos de locomotivas pesadas e vagões-plataforma com freios automáticos Westinghouse aceleram o transporte de carretas de artilharia pesada e carvão."
 ENG_ww1_naval_architecture_research:0 "Pesquisa de Arquitetura Naval e Hidrodinâmica em Haslar"
 ENG_ww1_naval_architecture_research_desc:0 "Tanques de teste de modelos hidrodinâmicos em Haslar refinam o desenho de proas e cascos com bulbo, elevando a velocidade dos encouraçados com menor consumo de óleo."
 ENG_ww1_explosive_safety_research:0 "Pesquisa de Segurança Química de Explosivos (Amatol)"
 ENG_ww1_explosive_safety_research_desc:0 "O desenvolvimento do Amatol (mistura de TNT e nitrato de amônio) supera a escassez de explosivos, garantindo detonações seguras sem risco de acidentes em paióis."
 ENG_ww1_field_wireless_research:0 "Equipamentos de Rádio de Campanha da Marconi"
 ENG_ww1_field_wireless_research_desc:0 "Transmissores de faísca portáteis montados em caminhões e mochilas conectam quartéis-generais de divisão diretamente aos fronts avançados de combate."
 ENG_ww1_signals_intelligence_organisation:0 "Organização do Serviço de Inteligência de Sinais"
 ENG_ww1_signals_intelligence_organisation_desc:0 "Redes de escuta eletromagnética monitoram o tráfego de rádio das marinhas e exércitos centrais, alimentando os analistas britânicos com dados vitais."
 ENG_ww1_the_room_forty_office:0 "O Lendário Room 40 e o Telegrama Zimmermann"
 ENG_ww1_the_room_forty_office_desc:0 "A seção criptográfica ultra-secreta do Almirantado sob o Almirante Hall decifra códigos navais alemães e intercepta o Telegrama Zimmermann, alterando o curso da história."
 ENG_ww1_aerial_photography_research:0 "Pesquisa em Aerofotogrametria Estereoscópica"
 ENG_ww1_aerial_photography_research_desc:0 "Câmeras estereoscópicas revelam a profundidade de trincheiras, casamatas subterrâneas e ninhos de metralhadoras camuflados com precisão matemática."
 ENG_ww1_artillery_survey_mathematics:0 "Sondagem Sonora e Matemática de Artilharia (Bragg)"
 ENG_ww1_artillery_survey_mathematics_desc:0 "O jovem físico Lawrence Bragg desenvolve sistemas de microfones subterrâneos que calculam a localização exata de baterias alemãs pelo estrondo dos canhões."
 ENG_ww1_chemical_protection_research:0 "Centro de Defesa Química de Porton Down"
 ENG_ww1_chemical_protection_research_desc:0 "Cientistas em Porton Down desenvolvem filtros de carvão ativado e tecidos impermeabilizantes capazes de neutralizar gás cloro, fosgênio e gás mostarda."
 ENG_ww1_the_landships_technical_committee:0 "Comitê Técnico de Navios Terrestres (Landships)"
 ENG_ww1_the_landships_technical_committee_desc:0 "O comitê secreto fundado por Churchill e Eustace Tennyson d'Eyncourt projeta lagartas envolventes e blindagens balísticas para cruzar trincheiras de 3 metros."
 ENG_ww1_aircraft_engine_research:0 "Pesquisa de Compressores e Motores Aeronáuticos"
 ENG_ww1_aircraft_engine_research_desc:0 "Engenheiros da Royal Aircraft Factory desenvolvem compressores mecânicos e carburadores calibrados para combate em altitudes superiores a 5.000 metros."
 ENG_ww1_hydrophone_analysis_laboratory:0 "Laboratório de Análise Acústica e o Sonar ASDIC"
 ENG_ww1_hydrophone_analysis_laboratory_desc:0 "O comitê BIR (Board of Invention and Research) sob Ernest Rutherford desenvolve cristais de quartzo piezelétricos, criando o sonar ativo (ASDIC) pioneiro."
 ENG_ww1_production_quality_standards:0 "Normas Nacionais de Qualidade de Produção"
 ENG_ww1_production_quality_standards_desc:0 "A Associação Britânica de Padrões de Engenharia (BSI) estabelece tolerâncias industriais rigorosas para parafusos, porcas, aços e rolamentos em todo o Império."
 ENG_ww1_the_postwar_research_council:0 "Conselho de Pesquisa Científica e Industrial (DSIR)"
 ENG_ww1_the_postwar_research_council_desc:0 "A criação do DSIR consolida o financiamento permanente da pesquisa científica aplicada, mantendo o Reino Unido na liderança tecnológica mundial."
 ENG_ww1_industrial_patent_exchanges:0 "Intercâmbio de Patentes Industriais Anglo-Aliadas"
 ENG_ww1_industrial_patent_exchanges_desc:0 "Compartilhamento mútuo de patentes de química industrial, processos de refino de petróleo e eletromecânica acelera a modernização de manufaturas civis."
 ENG_ww1_technical_education_for_reconstruction:0 "Educação Técnica Superior para a Reconstrução"
 ENG_ww1_technical_education_for_reconstruction_desc:0 "Faculdades politécnicas e institutos de mecânica aplicada formam centenas de milhares de engenheiros, químicos e arquitetos civis para o futuro britânico."
