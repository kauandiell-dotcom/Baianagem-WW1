l_braz_por:
 ENG_ww1_professional_service:0 "Exército profissional, estabelecimento limitado"
 ENG_ww1_professional_service_desc:0 "A força permanente tem experiência, mas a instrução rigorosa e os compromissos imperiais limitam sua expansão rápida."
 ENG_ww1_naval_estimates:0 "As estimativas do Almirantado"
 ENG_ww1_naval_estimates_desc:0 "A alocação naval desloca pessoal e produção do exército continental."
 ENG_ww1_continental_estimates:0 "As estimativas continentais"
 ENG_ww1_continental_estimates_desc:0 "A preparação do exército recebe prioridade industrial à custa da construção naval."
 ENG_ww1_balanced_estimates:0 "Uma alocação equilibrada de defesa"
 ENG_ww1_balanced_estimates_desc:0 "O governo mantém a continuidade industrial em vez de se concentrar em uma única força."
 ENG_ww1_territorial_establishment:0 "Estabelecimento de treinamento territorial"
 ENG_ww1_territorial_establishment_desc:0 "Os campos preparam unidades pela fila normal de recrutamento. Não criam divisões nem equipamento."
 ENG_ww1_new_army_establishment:0 "Campos de treinamento dos novos exércitos"
 ENG_ww1_new_army_establishment_desc:0 "Um recrutamento voluntário mais amplo exige instrutores e tempo. Os recrutas ainda precisam de homens e equipamento."
 ENG_ww1_munitions_ministry:0 "Ministério de Munições"
 ENG_ww1_munitions_ministry_desc:0 "A coordenação industrial melhora as entregas de armamentos enquanto ocupa a administração civil."
 ENG_ww1_labour_compact:0 "O acordo trabalhista das munições"
 ENG_ww1_labour_compact_desc:0 "Acordos salariais e de oficinas preservam a cooperação com um custo econômico civil."
 ENG_ww1_emergency_controls:0 "Controles industriais de emergência"
 ENG_ww1_emergency_controls_desc:0 "A coordenação compulsória aumenta a produção enquanto enfraquece a cooperação política."
 ENG_ww1_war_cabinet:0 "O gabinete de guerra"
 ENG_ww1_war_cabinet_desc:0 "Um gabinete compacto coordena o planejamento militar e as demandas econômicas. Seu mandato termina com a guerra."
 ENG_ww1_convoy_service:0 "O serviço de coordenação de comboios"
 ENG_ww1_convoy_service_desc:0 "A organização das rotas auxilia missões reais de escolta. Os mercantes e as escoltas ainda precisam navegar."
 ENG_ww1_army_service_corps:0 "Organização do Army Service Corps"
 ENG_ww1_army_service_corps_desc:0 "Os escritórios de transporte reduzem o desperdício enquanto ocupam uma alocação administrativa civil."
 ENG_ww1_air_observation_service:0 "Serviço de observação aérea"
 ENG_ww1_air_observation_service_desc:0 "Os observadores transmitem relatórios de reconhecimento; o serviço não concede capacidades modernas de bombardeio."
 ENG_ww1_royal_air_force_service:0 "Uma Royal Air Force integrada"
 ENG_ww1_royal_air_force_service_desc:0 "Um serviço aéreo integrado substitui a administração anterior de observação."
 ENG_ww1_irish_conciliation:0 "Conciliação constitucional irlandesa"
 ENG_ww1_irish_conciliation_desc:0 "A acomodação política acompanha custos reais de autogoverno regional."
 ENG_ww1_irish_repression:0 "Policiamento irlandês de emergência"
 ENG_ww1_irish_repression_desc:0 "Um esforço temporário de policiamento desloca recursos civis e enfraquece a confiança."
 ENG_ww1_unsanctioned_conscription:0 "Conscrição sem mandato parlamentar"
 ENG_ww1_unsanctioned_conscription_desc:0 "O recrutamento foi ampliado antes de sua autorização legislativa. Regularizar a lei ou retornar ao serviço voluntário encerra esta oposição."
 ENG_ww1_debt_pressure_1:0 "Serviço da dívida pública: administrável"
 ENG_ww1_debt_pressure_1_desc:0 "Os compromissos industriais e militares financiados exigem gastos civis contínuos."
 ENG_ww1_debt_pressure_2:0 "Serviço da dívida pública: elevado"
 ENG_ww1_debt_pressure_2_desc:0 "O serviço da dívida limita os recursos disponíveis para novos programas."
 ENG_ww1_debt_pressure_3:0 "Serviço da dívida pública: severo"
 ENG_ww1_debt_pressure_3_desc:0 "O financiamento contínuo impõe uma carga fiscal grave. A amortização exige recursos e tempo."
 ENG_ww1_veterans_settlement:0 "Veteranos e emprego civil"
 ENG_ww1_veterans_settlement_desc:0 "A reintegração e o emprego exigem uma alocação social contínua."
 ENG_ww1_housing_programme:0 "O programa de habitação e saúde pública"
 ENG_ww1_housing_programme_desc:0 "A recuperação social após a guerra consome uma alocação de construção civil."
 ENG_ww1_naval_economy:0 "Economia naval após a guerra"
 ENG_ww1_naval_economy_desc:0 "A redução da construção naval em paz libera recursos civis; o programa não impõe um tratado internacional fictício de tonelagem."
 ENG_ww1_cabinet_consultation:0 "Consulta do gabinete imperial"
 ENG_ww1_cabinet_consultation_desc:0 "A consulta formal coordena governos existentes em vez de anexar suas populações."
 ww1_britain_irish_devolution:0 "Governo regional irlandês"
 ww1_britain_irish_exemption:0 "Serviço militar irlandês voluntário"
