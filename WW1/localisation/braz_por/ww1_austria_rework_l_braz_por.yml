l_braz_por:
 AUH_ww1_constitutional_audit:0 "[Histórico] Auditoria Constitucional"
 AUH_ww1_constitutional_audit_desc:0 "O Compromisso de 1867 está se desfazendo em todas as costuras. Se a Monarquia dos Habsburgo quiser sobreviver à tempestade que engole a Europa, a Coroa deve auditar minuciosamente a constituição imperial e traçar um caminho entre a inércia dualista, a reforma federal, a autonomia trialista ou a lei marcial."
 AUH_ww1_dualism:0 "[Histórico - Dualismo] Dualismo de Ferro"
 AUH_ww1_dualism_desc:0 "Preservar o Compromisso de 1867 e reforçar a aliança entre os alemães austríacos e a aristocracia mágiar. O poder permanecerá dividido estritamente entre Viena e Budapeste, sem concessões a agitações de minorias."
 AUH_ww1_tisza_alliance:0 "[Dualismo] O Pacto com Tisza"
 AUH_ww1_tisza_alliance_desc:0 "O Primeiro-Ministro István Tisza comanda o Parlamento húngaro com mão de ferro. Ao assegurar sua lealdade incondicional e garantir a hegemonia agrária húngara, a Coroa assegura que os campos de grãos da Grande Planície permaneçam abertos ao esforço de guerra imperial."
 AUH_ww1_magyar_cavalry_corps:0 "[Dualismo] Formações de Hussardos Mágiares"
 AUH_ww1_magyar_cavalry_corps_desc:0 "O Honvéd Real Húngaro ostenta gloriosas tradições equestres. Ao expandir os regimentos de cavalaria leve e montar patrulhas agressivas de reconhecimento de fronteira, fortificamos as passagens dos Cárpatos contra ameaças a leste."
 AUH_ww1_trialism:0 "[Alternativo - Trialismo] Trialismo Habsburgo"
 AUH_ww1_trialism_desc:0 "Encerrar o monopólio dual de poder elevando as terras dos eslavos do sul a um terceiro reino igualitário dentro da Monarquia. A visão preferida do Arquiduque Franz Ferdinand estabelece uma coroa croata-eslava unificada sob o domínio dos Habsburgo."
 AUH_ww1_zagreb_coronation:0 "[Trialismo] A Coroação de Zagreb"
 AUH_ww1_zagreb_coronation_desc:0 "Convocar o Sabor Croata em Zagreb e solenizar a união da Croácia, Eslavônia, Dalmácia e Bósnia-Herzegovina como o Reino da Ilíria, vinculando a lealdade dos eslavos do sul eternamente ao trono imperial."
 AUH_ww1_pacify_south_slavs:0 "[Trialismo] Pacificar os Eslavos do Sul"
 AUH_ww1_pacify_south_slavs_desc:0 "Neutralizar o irredentismo sérvio e os agitadores da Narodna Odbrana concedendo paridade administrativa completa, direitos linguísticos e autogoverno regional aos nossos súditos do sul."
 AUH_ww1_federalism:0 "[Alternativo - Federalismo] Mega-Federação Danubiana"
 AUH_ww1_federalism_desc:0 "Desmantelar o rígido compromisso dualista em favor de uma federação esclarecida de nacionalidades iguais. Seguindo a doutrina de Aurel Popovici, cada grande grupo etnolinguístico governará sua pátria sob um manto imperial federal."
 AUH_ww1_popovici_manifesto:0 "[Federalismo] O Manifesto Popovici"
 AUH_ww1_popovici_manifesto_desc:0 "Promulgar os princípios dos Estados Unidos da Grande Áustria. O desenho de quinze estados autônomos com fronteiras cantonais redesenhadas garante os direitos civis e a preservação cultural de alemães, mágiares, tchecos, poloneses, rutenos e romenos."
 AUH_ww1_proclaim_danubian_federation:0 "[Federalismo] Proclamar a Mega-Federação Danubiana"
 AUH_ww1_proclaim_danubian_federation_desc:0 "Assinar a histórica carta imperial emancipando Hungria, Boêmia, Croácia e Galícia como estados constituintes autônomos sob a Casa de Habsburgo-Lorena. Unidos por uma defesa comum e representação externa única, o Império renasce."
 AUH_ww1_military_dictatorship:0 "[Alternativo - Junta] Ditadura Militar do AOK"
 AUH_ww1_military_dictatorship_desc:0 "Suspender as formalidades constitucionais, dissolver dietas parlamentares obstinadas e subordinar os ministérios civis diretamente ao Armeeoberkommando. Nesta hora suprema, a disciplina militar de ferro e a baioneta governarão o reino."
 AUH_ww1_conrad_supreme_command:0 "[Junta Militar] Comando Supremo de Conrad"
 AUH_ww1_conrad_supreme_command_desc:0 "Investir o Marechal de Campo Conde Franz Conrad von Hötzendorf com autoridade ditatorial de tempo de guerra sobre todos os ativos estratégicos, depósitos de mobilização e comunicações civis. A audácia ofensiva se sobreporá a todas as tímidas reservas civis."
 AUH_ww1_war_surveillance_office:0 "[Junta Militar] O Gabinete de Vigilância de Guerra"
 AUH_ww1_war_surveillance_office_desc:0 "Estabelecer o Kriegsüberwachungsamt para supervisionar a indústria civil, impor rígida censura à imprensa, interceptar correspondências sediciosas e eliminar impiedosamente o derrotismo em todas as terras da coroa."
 AUH_ww1_skoda_contracts:0 "Expandir Contratos da Škoda"
 AUH_ww1_skoda_contracts_desc:0 "Direcionar vastos subsídios estatais às fundições de armamento da Škoda em Pilsen. A metalurgia pesada e o desenvolvimento de artilharia de cerco especializada estabelecerão os armeiros austro-húngaros como líderes mundiais."
 AUH_ww1_steyr_small_arms:0 "Produção de Armas Steyr"
 AUH_ww1_steyr_small_arms_desc:0 "Contratar a Österreichische Waffenfabriks-Gesellschaft em Steyr para acelerar a fabricação em massa dos fuzis Mannlicher M.95 de ferrolho direto e pistolas Roth-Steyr para a infantaria imperial."
 AUH_ww1_trieste_yards:0 "Estaleiros Navais de Trieste"
 AUH_ww1_trieste_yards_desc:0 "Ampliar as rampas de lançamento e docas secas do Stabilimento Tecnico Triestino e de Monfalcone. A K.u.K. Kriegsmarine deve construir encouraçados modernos capazes de disputar o domínio sobre o Mar Adriático."
 AUH_ww1_isonzo_plan:0 "O Plano Defensivo do Isonzo"
 AUH_ww1_isonzo_plan_desc:0 "Mapear os penhascos calcários, planaltos cársticos e gargantas traiçoeiras do vale do rio Isonzo. Fortificações em profundidade e baterias de artilharia alpina bloquearão qualquer invasão pelos portões de Gorizia."
 AUH_idea_dualism_iron:0 "Dualismo de Ferro"
 AUH_idea_dualism_iron_desc:0 "O dualismo austro-húngaro preserva a parceria histórica entre as classes dominantes alemã e húngara, exigindo obediência resoluta dos súditos imperiais ao custo do ressentimento eslavo."
 AUH_idea_habsburg_trialism:0 "Trialismo Habsburgo"
 AUH_idea_habsburg_trialism_desc:0 "Ao reconhecer uma coroa dos eslavos do sul ao lado da Áustria e da Hungria, a Monarquia garante a lealdade de suas províncias do sul e protege permanentemente seus flancos contra o irredentismo balcânico."
 AUH_idea_danubian_federation_spirit:0 "Espírito Federal Danubiano"
 AUH_idea_danubian_federation_spirit_desc:0 "Uma irmandade de nacionalidades unidas sob uma esclarecida constituição dos Habsburgo. A ampla autonomia regional fomenta cooperação cívica sem precedentes, vigor econômico e harmonia social."
 AUH_idea_aok_military_dictatorship:0 "Ditadura Militar do AOK"
 AUH_idea_aok_military_dictatorship_desc:0 "O Armeeoberkommando detém controle absoluto sobre os recursos estatais e a vida civil. Cada trem, fábrica e colheita é implacavelmente requisitado para a frente, provocando desespero civil sob a fachada de uma implacável determinação marcial."
 AUH_danubian_federal_member:0 "Membro Federal Danubiano"
 AUH_danubian_federal_member_desc:0 "Como estado constituinte autônomo da Mega-Federação Danubiana, este território gere seus assuntos culturais e jurídicos internos enquanto concentra a produção militar, alistamento e receitas fiscais sob a coroa imperial comum."
 AUH_skoda_305_howitzer:0 "Obuseiros Pesados de Cerco Škoda 30,5 cm"
 AUH_skoda_305_howitzer_desc:0 "O Motormörser Škoda 30,5 cm M.11 dispara munições de alto impacto catastróficas contra fortes inimigos e linhas de frente entrincheiradas, pulverizando toda resistência."
 AUH_steyr_mannlicher:0 "Conglomerado de Armamentos Steyr-Mannlicher"
 AUH_steyr_mannlicher_desc:0 "A manufatura de armas de precisão austríaca equipa a infantaria imperial com fuzis confiáveis Mannlicher de ferrolho direto e armas leves de ponta."
 AUH_ganz_danubius:0 "Estaleiros Ganz-Danubius"
 AUH_ganz_danubius_desc:0 "O principal complexo marítimo e de engenharia pesada da Hungria constrói cruzadores, contratorpedeiros e submarinos para proteger as linhas vitais do Adriático e projetar poder naval duplo."
 AUH_conrad_offensive_doctrine:0 "O Culto à Ofensiva de Conrad"
 AUH_conrad_offensive_doctrine_desc:0 "O Chefe do Estado-Maior Franz Conrad von Hötzendorf prioriza o ímpeto ofensivo incessante e ousadas manobras de cerco, aceitando pesadas baixas táticas na busca do triunfo estratégico definitivo."
 AUH_borojevic_alpine_defense:0 "Defesa Alpina de Boroević"
 AUH_borojevic_alpine_defense_desc:0 "O Marechal de Campo Svetozar Boroević von Bojna destaca-se pela defesa estática inabalável, utilizando o terreno montanhoso cárstico e parapeitos de pedra para transformar as ofensivas inimigas em catástrofes sangrentas."
 AUH_crown_dashboard:0 "Painel da Coroa Imperial"
 AUH_crown_dashboard_desc:0 "§H========================================§!\n§H    PAINEL DA COROA AUSTRO-HÚNGARA    §!\n§H========================================§!\n§WA Monarquia poliglota dos Habsburgos apoia-se em três vetores vitais de sobrevivência:§!\n\n  §O• Estoque de Grãos de Viena:§! §Y[?AUH_vienna_grain|0]%§!\n  §G• Coesão Dualista Imperial:§! §Y[?AUH_cohesion|0]%§!\n  §R• Cansaço de Guerra Imperial:§! §Y[?AUH_war_weariness|0]%§!\n\n§H----------------------------------------§!\n§LSalvaguardas de Colapso:§!\n  §W* Se os Grãos caírem abaixo de 25%, o Cansaço de Guerra sobe semanalmente.§!\n  §W* Se o Cansaço de Guerra passar de 70% e uma capital for perdida, crises de secessão eclodem!§!\n§H========================================§!"
 AUH_dec_requisition_banat_grain:0 "Requisitar Colheitas de Grãos de Banat"
 AUH_dec_requisition_banat_grain_desc:0 "Despachar comissários imperiais de requisição para as férteis zonas agrícolas de Banat e Voivodina para alimentar os operários famintos e as filas de pão de Viena, arriscando atritos com proprietários de terras húngaros."
 AUH_dec_bread_rationing_cards:0 "Instituir Racionamento Imperial de Pão"
 AUH_dec_bread_rationing_cards_desc:0 "Distribuir cupons de racionamento estritos por toda a Cisleitânia para gerenciar estoques de farinha em queda. O consumo de pão é controlado, preservando reservas estratégicas ao custo do descontentamento popular."
 AUH_dec_appease_budapest_diet:0 "Apaziguar a Dieta de Budapeste"
 AUH_dec_appease_budapest_diet_desc:0 "Oferecer concessões fiscais e reafirmar garantias políticas ao Parlamento húngaro, acalmando o clamor aristocrático e preservando a coesão imperial entre Viena e Budapeste."
 AUH_dec_galician_food_corps:0 "Organizar Corpos Agrícolas Galicianos"
 AUH_dec_galician_food_corps_desc:0 "Mobilizar trabalhadores civis e brigadas logísticas auxiliares na Galícia para colher e transportar suprimentos agrícolas de volta à capital imperial."
 AUH_dec_skoda_siege_howitzers:0 "Encomendar Obuseiros de Cerco Škoda 30,5 cm"
 AUH_dec_skoda_siege_howitzers_desc:0 "Autorizar produção prioritária urgente dos obuseiros superpesados motorizados de cerco da Škoda, fornecendo às divisões de frente um poder de fogo demolidor de fortificações."
 AUH_dec_galician_oil_extraction:0 "Intensificar Extração de Petróleo de Boryslav"
 AUH_dec_galician_oil_extraction_desc:0 "Perfurar poços mais profundos e construir refinarias modernas na bacia galiciana de Boryslav, fornecendo derivados vitais de petróleo para a máquina militar imperial."
 AUH_dec_steep_alpine_redoubts:0 "Construir Redutos Fortificados nos Alpes"
 AUH_dec_steep_alpine_redoubts_desc:0 "Escavar canhoneiras cavernosas, cinturões de arame farpado e casamatas de concreto diretamente nos picos graníticos das Dolomitas e no setor do rio Isonzo."
 AUH_dec_prince_wied_albania:0 "Apoiar o Príncipe Guilherme de Wied na Albânia"
 AUH_dec_prince_wied_albania_desc:0 "Estender patrocínio diplomático e financeiro à soberania do Príncipe Guilherme de Wied sobre o recém-estabelecido Principado da Albânia, contendo as ambições italianas e sérvias."
 AUH_dec_danubian_customs_union:0 "Propor a União Aduaneira Danubiana"
 AUH_dec_danubian_customs_union_desc:0 "Estabelecer uma união aduaneira abrangente para a Mitteleuropa em toda a bacia danubiana, eliminando tarifas internas e consolidando o comércio regional sob a liderança austríaca."
 ww1_austria_collapse.1.t:0 "A Revolta Boêmia: Secessão Tcheca"
 ww1_austria_collapse.1.d:0 "Esmagado pelo desastre militar implacável, escassez de alimentos e severo cansaço de guerra, o Comitê Nacional Tcheco em Praga declarou independência total. Regimentos tchecos se amotinaram, erguendo a bandeira alvirrubra sobre o Castelo de Hradčany e repudiando a lealdade à Coroa dos Habsburgo."
 ww1_austria_collapse.1.a:0 "Traidores! Mobilizem guarnições leais para esmagar a rebelião!"
 ww1_austria_collapse.2.t:0 "A Dieta Húngara Dissolve a União"
 ww1_austria_collapse.2.d:0 "Furioso com a centralização de guerra, baixas devastadoras e a percebida traição imperial ao Compromisso de 1867, o Parlamento Húngaro em Budapeste proclamou a dissolução da União Austro-Húngara. Unidades húngaras são retiradas das frentes para defender a pátria."
 ww1_austria_collapse.2.a:0 "A Coroa de Santo Estêvão não pode romper seu juramento sagrado!"
 ww1_austria_collapse.3.t:0 "A Rebelião dos Eslavos do Sul em Zagreb"
 ww1_austria_collapse.3.d:0 "O Sabor Croata e representantes dos eslovenos, croatas e sérvios em Zagreb renunciaram a todos os laços com a Monarquia Dual. Soldados desiludidos que retornam do front estabeleceram um Conselho Nacional, exigindo soberania plena para os eslavos do sul."
 ww1_austria_collapse.3.a:0 "O Império jamais renunciará à costa do Adriático!"
 ww1_austria_collapse.10.t:0 "Autoridade Imperial Restaurada"
 ww1_austria_collapse.10.d:0 "Forças imperiais e reais leais recapturaram as capitais provinciais rebeldes, quebrando de forma decisiva a espinha dorsal da insurreição. Os líderes separatistas foram presos ou exilados, e as províncias rebeldes retornam diretamente sob a coroa dos Habsburgo."
 ww1_austria_collapse.10.a:0 "Gott erhalte Franz den Kaiser! A Monarquia resiste!"
 ww1_austria_diplomacy.1.t:0 "O Caso de Espionagem do Coronel Redl"
 ww1_austria_diplomacy.1.d:0 "Uma violação catastrófica de segurança abalou o Evidenzbureau em suas estruturas. O Coronel Alfred Redl, ex-chefe de contraespionagem e Chefe do Estado-Maior do VIII Corpo em Praga, foi desmascarado como espião russo de alto escalão. Afogado em dívidas e chantageado por sua vida privada, Redl vendeu os planos completos de mobilização austríacos — Plano B para os Bálcãs e Plano R para a Rússia — diretamente ao Estado-Maior do Tsar. Confrontado em seu quarto de hotel em Viena, Redl tirou a própria vida com um revólver deixado pelos investigadores."
 ww1_austria_diplomacy.1.a:0 "Reformular os calendários de mobilização e revisar os Planos B e R imediatamente!"
 ww1_austria_diplomacy.1.b:0 "Encobrir o escândalo para proteger a honra do corpo de oficiais."
 ww1_austria_diplomacy.10.t:0 "O Caso Sixtus: Negociações Secretas de Paz"
 ww1_austria_diplomacy.10.d:0 "O jovem Imperador Karl I, desesperado com o massacre devastador da Primeira Guerra Mundial e o colapso iminente da dinastia dos Habsburgo, iniciou aberturas diplomáticas clandestinas com a Entente. Utilizando seu cunhado, o Príncipe Sixto de Bourbon-Parma servindo como oficial no exército belga, Karl enviou uma carta secreta ao presidente francês Poincaré, oferecendo apoiar as justas reivindicações francesas sobre a Alsácia-Lorena e restaurar a soberania belga em troca de uma paz separada honrosa."
 ww1_austria_diplomacy.10.a:0 "Prosseguir com as sondagens secretas de paz através do Príncipe Sixto."
 ww1_austria_diplomacy.10.b:0 "Reafirmar lealdade inabalável à aliança com a Alemanha."
 ww1_austria_diplomacy.11.t:0 "Sondagens Austríacas de Paz Recebidas em Paris"
 ww1_austria_diplomacy.11.d:0 "O Príncipe Sixto de Bourbon-Parma entregou uma carta pessoal secreta do Imperador Karl da Áustria-Hungria no Palácio do Eliseu. Viena insinua reconhecer a soberania francesa sobre a Alsácia-Lorena e restaurar a Bélgica se uma paz separada puder ser acordada."
 ww1_austria_diplomacy.11.a:0 "Analisar os termos de Viena com prudente interesse."
 ww1_austria_diplomacy.11.b:0 "Rejeitar conversas separadas sem o consenso total da Entente."
 ww1_austria_diplomacy.12.t:0 "Viena Reafirma o Pacto com a Alemanha"
 ww1_austria_diplomacy.12.d:0 "O Imperador Karl I garantiu ao Comando Supremo Alemão o compromisso inabalável da Áustria-Hungria com as Potências Centrais, renunciando a quaisquer negociações separadas com Paris ou Londres."
 ww1_austria_diplomacy.12.a:0 "Juntos até a vitória final!"
 ww1_austria_diplomacy.20.t:0 "A Solução Austro-Polonesa"
 ww1_austria_diplomacy.20.d:0 "Após a expulsão das forças imperiais russas da Polônia do Congresso, o futuro status político das terras polonesas deve ser decidido. Diplomatas austríacos defendem a Solução Austro-Polonesa: unir a Polônia russa com a Galícia austríaca sob um reino constitucional chefiado pelo Arquiduque Karl Stephan de Habsburgo, vinculando uma Polônia ressuscitada permanentemente a Viena."
 ww1_austria_diplomacy.20.a:0 "Coroar o Arquiduque Karl Stephan como Rei da Polônia!"
 ww1_austria_diplomacy.20.b:0 "Ceder a administração às autoridades alemãs em Varsóvia."
 ww1_austria_diplomacy.30.t:0 "O Brotfrieden: A Paz do Pão com a Ucrânia"
 ww1_austria_diplomacy.30.d:0 "Condições de fome assolam Viena e os centros industriais austríacos, com operários desmaiando em filas de pão e revoltas explodindo a cada semana. Em Brest-Litovsk, delegados austro-húngaros negociaram um tratado de paz em separado com a República Popular da Ucrânia. Em troca de reconhecimento diplomático e garantias territoriais na região de Kholm, a Ucrânia concorda em entregar um milhão de toneladas de grãos, açúcar e gado para socorrer a combalida Monarquia Dual."
 ww1_austria_diplomacy.30.a:0 "Ratificar o tratado! O pão salvará a Monarquia!"
 ww1_austria_diplomacy.30.b:0 "Recusar concessões sobre o território disputado de Kholm."
 HUN_AUS_danubian_state:0 "Reino da Hungria"
 HUN_AUS_danubian_state_DEF:0 "O Reino da Hungria"
 CZE_AUS_danubian_state:0 "Reino da Boêmia"
 CZE_AUS_danubian_state_DEF:0 "O Reino da Boêmia"
 CRO_AUS_danubian_state:0 "Reino da Croácia-Eslavônia"
 CRO_AUS_danubian_state_DEF:0 "O Reino da Croácia-Eslavônia"
 POL_AUS_danubian_state:0 "Reino da Polônia"
 POL_AUS_danubian_state_DEF:0 "O Reino da Polônia"
 AUH_war_weariness:0 "Cansaço de Guerra Imperial"
 AUH_cohesion:0 "Coesão Imperial"
 AUH_vienna_grain:0 "Estoque de Grãos de Viena"
 ww1_austria_diplomacy.1.a_tt:0 "Os planos de mobilização serão reformulados, eliminando a vantagem russa de inteligência prévia."
 ww1_austria_diplomacy.1.b_tt:0 "Encobrir a espionagem de Redl deixa os planos de desdobramento austríacos comprometidos contra a Rússia."
 ww1_austria_diplomacy.10.a_tt:0 "Enviados secretos abordarão Paris para sondar condições para uma paz separada."
 ww1_austria_diplomacy.10.b_tt:0 "A Áustria afirma lealdade de ferro às Potências Centrais, tranquilizando a Alemanha."
 ww1_austria_diplomacy.20.a_tt:0 "O Arquiduque Karl Stephan assume a coroa polonesa, estabelecendo um estado cliente leal aos Habsburgo."
 ww1_austria_diplomacy.20.b_tt:0 "A Alemanha administrará Varsóvia, melhorando relações bilaterais às custas da influência austríaca."
 ww1_austria_diplomacy.30.a_tt:0 "Carregamentos agrícolas da Ucrânia chegam a Viena, aumentando as reservas de grãos em §G+40§! e reduzindo o cansaço de guerra."
 ww1_austria_diplomacy.30.b_tt:0 "Recusar o tratado aprofunda a fome nas cidades austríacas, aumentando o cansaço de guerra em §R+15§!."
 AUH_dec_prince_wied_albania_tt:0 "Estende apoio diplomático à Albânia, aumentando o prestígio dos Habsburgo no sul dos Bálcãs."
 AUH_dec_danubian_customs_union_tt:0 "Estimula o comércio em toda a bacia do Danúbio, aumentando reservas de grãos e coesão."
 AUH_ww1_alliance_renewed:0 "Aliança Reafirmada"
