l_braz_por:
 GER_schlieffen_maneuver:0 "[Histórico] Manobra Schlieffen Integrada"
 GER_schlieffen_maneuver_desc:0 "Não pode haver hesitação. Enquanto os exércitos francês e russo se mobilizam, nossa poderosa ala direita deve avançar velozmente por Luxemburgo e Bélgica em um movimento envolvente fulminante. Contornaremos o formidável cordão de fortalezas do Mosa e golpearemos o interior da França antes que reforços britânicos e russos possam alterar o equilíbrio de forças."
 GER_schlieffen_momentum:0 "Ímpeto Ofensivo Schlieffen"
 GER_schlieffen_momentum_desc:0 "O avanço alemão varre os Países Baixos com um ritmo implacável. Depósitos avançados de suprimentos, pioneiros de assalto especializados e um planejamento agressivo do Estado-Maior mantêm a pressão ofensiva máxima sobre o inimigo desorientado."
 GER_western_trench_stalemate:0 "Impasse das Trincheiras Ocidentais"
 GER_western_trench_stalemate_desc:0 "A guerra de manobras móveis congelou em um sangrento impasse subterrâneo. Milhares de quilômetros de arame farpado, casamatas de concreto e ninhos interligados de metralhadoras estendem-se da Suíça até o Mar do Norte."
 GER_krupp_siege_guns:0 "Obuses de Cerco Pesados Krupp"
 GER_krupp_siege_guns_desc:0 "As fundições industriais da Friedrich Krupp AG produzem a artilharia pesada mais destrutiva do mundo, incluindo os colossais morteiros de 420mm \"Berta Gorda\", capazes de pulverizar fortalezas modernas de concreto armado em poucas horas."
 GER_thyssen_steel_syndicate:0 "Sindicato do Aço Pesado Thyssen"
 GER_thyssen_steel_syndicate_desc:0 "O cartel de aço industrial de August Thyssen coordena os altos-fornos e laminadores do Vale do Ruhr, fornecendo um fluxo ininterrupto de aço de alta qualidade para projéteis pesados, blindagens e fortificações de trincheira."
 GER_haber_bosch_synthesis:0 "Síntese de Nitrogênio Haber-Bosch"
 GER_haber_bosch_synthesis_desc:0 "Fritz Haber e Carl Bosch na BASF alcançaram a fixação sintética do nitrogênio atmosférico. Privadas do salitre chileno pelo bloqueio britânico, as fábricas de munições alemãs agora sintetizam nitratos diretamente do ar, garantindo produção ilimitada de explosivos."
 GER_buna_rubber:0 "Borracha Sintética Buna"
 GER_buna_rubber_desc:0 "Através da síntese pioneira de polímeros químicos na Bayer, nossos químicos desenvolveram a borracha sintética Buna, superando o bloqueio da Entente sobre a borracha natural e garantindo suprimento contínuo para pneus, máscaras de gás e linhas de combustível de aeronaves."
 GER_hindenburg_program:0 "O Programa Hindenburg"
 GER_hindenburg_program_desc:0 "Decretado pelo Marechal de Campo von Hindenburg e pelo General Ludendorff, este programa radical de economia de guerra submete toda a economia civil, direcionando impiedosamente capacidade industrial, matérias-primas e mão de obra para triplicar a produção de artilharia e munições."
 GER_fokker_scourge_spirit:0 "O Flagelo Aéreo Fokker"
 GER_fokker_scourge_spirit_desc:0 "Equipados com o mecanismo sincronizador de Anthony Fokker que permite metralhadoras dispararem através da hélice, os monoplanos alemães dominam os céus da Frente Ocidental, abatendo aeronaves de observação aliadas com devastadora impunidade."
 GER_operation_gericht:0 "Operação Gericht (Verdun)"
 GER_operation_gericht_desc:0 "A calculada ofensiva do General von Falkenhayn para sangrar o Exército Francês até a exaustão no complexo fortificado de Verdun. Ao ameaçar uma fortaleza de honra nacional sagrada, a França será forçada a lançar todas as suas divisões em um moedor de carne da superior artilharia alemã."
 GER_gorlice_tarnow_breakthrough:0 "Ruptura de Gorlice-Tarnów"
 GER_gorlice_tarnow_breakthrough_desc:0 "Sob o comando do General August von Mackensen, o Décimo Primeiro Exército concentra poder de fogo de artilharia sem precedentes na fronteira austro-russa. Uma violenta ruptura das linhas russas desencadeará a Grande Retirada das forças do Czar por toda a Polônia."
 GER_chlorine_gas_release:0 "Lançar Gás Cloro em Ypres"
 GER_chlorine_gas_release_desc:0 "Pioneirismo de Fritz Haber, milhares de cilindros pressurizados de gás cloro letal são abertos ao longo da linha de frente. Levada pelo vento favorável, a nuvem amarelo-esverdeada sufocante dissolverá as defesas inimigas e estilhaçará o moral dos Aliados."
 GER_phosgene_gas_shells:0 "Sintetizar Projéteis de Artilharia de Fosgênio"
 GER_phosgene_gas_shells_desc:0 "Seis vezes mais letal que o cloro e praticamente invisível, o gás fosgênio disparado diretamente por projéteis de artilharia penetra respiradores comuns, causando trauma pulmonar retardado e devastador atrás das linhas inimigas."
 GER_mustard_gas_deployment:0 "Lançamento em Massa de Cruz Amarela (Gás Mostarda)"
 GER_mustard_gas_deployment_desc:0 "O sulfeto de dicloroetila, conhecido como Cruz Amarela ou Lost, é um agente vesicante persistente que contamina lama, folhagem e trincheiras por semanas, queimando através de uniformes e cegando qualquer soldado que ouse atravessar o setor."
 GER_operation_alberich:0 "Operação Alberich (Retirada Estratégica)"
 GER_operation_alberich_desc:0 "Uma retirada estratégica magistral e metódica do Exército Ocidental para a Linha Hindenburg (Siegfried Stellung), reduzindo a frente de contato. O saliente evacuado é submetido à terra arrasada total, prendendo os exércitos aliados em um ermo logístico devastado."
 GER_kriegsanleihen:0 "Emitir Títulos de Guerra (Kriegsanleihen)"
 GER_kriegsanleihen_desc:0 "Emissão de empréstimos públicos de guerra para mobilizar as economias do povo alemão. Cada marco emprestado ao Tesouro Imperial financia indústria pesada e munições, embora empenhe nosso futuro financeiro na certeza da vitória militar total."
 GER_ploiesti_oil:0 "Garantir os Campos Petrolíferos de Ploiești"
 GER_ploiesti_oil_desc:0 "Após a derrota da Romênia, engenheiros e batalhões de resgate alemães assumem o controle direto das refinarias e poços de petróleo ao redor de Ploiești, garantindo combustível vital para alimentar nossos submarinos, zepelins e transportes motorizados."
 GER_uboat_cruiser_rules:0 "Postura de Submarinos: Direito de Presa (Regras de Cruzador)"
 GER_uboat_cruiser_rules_desc:0 "Submarinos emergem para inspecionar navios mercantes e permitir que tripulações alcancem os botes salva-vidas antes de afundar cargas contrabandeadas, minimizando tensões diplomáticas com os Estados Unidos ao custo da vulnerabilidade dos submarinos."
 GER_uboat_declared_war_zone:0 "Postura de Submarinos: Zona de Guerra Declarada"
 GER_uboat_declared_war_zone_desc:0 "As águas ao redor das Ilhas Britânicas são declaradas zona de guerra. Qualquer navio mercante da Entente encontrado no perímetro poderá ser torpedeado sem aviso, acelerando a tonelagem afundada enquanto eleva a vigilância diplomática americana."
 GER_uboat_unrestricted_warfare:0 "Postura de Submarinos: Guerra Submarina Irrestrita"
 GER_uboat_unrestricted_warfare_desc:0 "Qualquer navegação, beligerante ou neutra, rumo aos portos da Grã-Bretanha será afundada à vista sem aviso prévio. O Almirante von Holtzendorff promete forçar a Grã-Bretanha à fome em seis meses, mesmo sob o grave risco de arrastar os Estados Unidos para o conflito."
 GER_fokker_scourge:0 "Desencadear o Flagelo Fokker"
 GER_fokker_scourge_desc:0 "Distribuir o Fokker E.I armado com mecanismos sincronizadores aos esquadrões de caça da Jagdstaffel na Frente Ocidental, concedendo aos aviadores alemães supremacia aérea inquestionável sobre os céus de Flandres e Champagne."
 GER_zeppelin_raids_london:0 "Ataques Estratégicos de Zepelim a Londres"
 GER_zeppelin_raids_london_desc:0 "Enviar dirigíveis navais gigantescos através do Mar do Norte em ataques noturnos de bombardeio contra a capital britânica. O choque psicológico e a devastação forçarão a Grã-Bretanha a reter esquadrões de caça e baterias antiaéreas no território metropolitano."
 GER_deutsch_ostafrika_guerrilla:0 "Campanha da África Oriental de Paul von Lettow-Vorbeck"
 GER_deutsch_ostafrika_guerrilla_desc:0 "Na África Oriental Alemã, o Coronel Paul von Lettow-Vorbeck e sua leal Schutztruppe Askari travam uma campanha assimétrica de guerrilha pela selva e savana, prendendo centenas de milhares de soldados britânicos, sul-africanos e indianos."
 GER_support_easter_rising:0 "Apoiar a Revolta da Páscoa na Irlanda (1916)"
 GER_support_easter_rising_desc:0 "Contrabandear fuzis russos capturados, metralhadoras e munição a bordo do navio mercante disfarçado SMS Libau para Roger Casement e os Voluntários Irlandeses em Dublin, desferindo um golpe audacioso no coração do Império Britânico."
 GER_ghadar_conspiracy:0 "Financiar a Conspiração Ghadar na Índia"
 GER_ghadar_conspiracy_desc:0 "Fornecer subsídios financeiros e remessas clandestinas de armas através de canais diplomáticos nos Estados Unidos e Sudeste Asiático ao revolucionário Partido Ghadar, fomentando motins entre tropas indianas do Raj Britânico."
 GER_spartakist_uprising:0 "Esmagar a Revolta Espartaquista (1919)"
 GER_spartakist_uprising_desc:0 "Comunistas radicais e delegados sindicais revolucionários liderados por Karl Liebknecht e Rosa Luxemburg ocuparam redações de jornais e prédios públicos em Berlim. Enviar unidades leais de Freikorps sob o comando de Gustav Noske para restaurar a ordem."
 GER_baltic_freikorps_defense:0 "Defesa dos Freikorps Bálticos (Baltikumer)"
 GER_baltic_freikorps_defense_desc:0 "Sob o comando do Major-General Rüdiger von der Goltz, divisões voluntárias de veteranos — a Divisão de Ferro e a Landwehr Báltica — mobilizam-se na Curlândia e Livônia para defender a fronteira báltica e a Prússia Oriental contra o avanço do Exército Vermelho."
 GER_suppress_ruhr_red_army:0 "Suprimir o Exército Vermelho do Ruhr"
 GER_suppress_ruhr_red_army_desc:0 "Insurgências comunistas armadas na bacia do Ruhr ameaçam o coração industrial do país. Coordenar batalhões de Freikorps para desarmar o Exército Vermelho do Ruhr e restabelecer a estabilidade."
 GER_chemical_warfare_program:0 "Programa Imperial de Guerra Química"
 GER_chemical_warfare_program_desc:0 "Coordenar a síntese industrial e o lançamento em campo de batalha de armas químicas desenvolvidas pelo Instituto Kaiser Wilhelm de Físico-Química."
 GER_naval_warfare_category:0 "Batalha do Atlântico e Guerra Submarina"
 GER_naval_warfare_category_desc:0 "Gerenciar posturas operacionais de submarinos, interdição comercial e atritos diplomáticos com a navegação neutra no Atlântico."
 GER_high_command_operations:0 "Operações de Frente da OHL"
 GER_high_command_operations_desc:0 "Executar ofensivas militares decisivas do Alto Comando e rupturas operacionais coordenadas pelo Grande Estado-Maior."
 GER_air_warfare_category:0 "Serviço Aéreo Imperial (Luftstreitkräfte)"
 GER_air_warfare_category_desc:0 "Distribuir caças avançados, recrutar ases lendários da aviação e executar ataques estratégicos com dirigíveis."
 GER_war_economy_category:0 "Economia de Guerra e Logística Estratégica"
 GER_war_economy_category_desc:0 "Mobilizar títulos públicos de guerra, matérias-primas estratégicas e recuos de emergência para sustentar o esforço de guerra do Kaiserreich."
 GER_weimar_and_freikorps_category:0 "República de Weimar e Defesa dos Freikorps"
 GER_weimar_and_freikorps_category_desc:0 "Dirigir operações de segurança emergencial, voluntários dos Freikorps e contenção pós-guerra contra revoltas radicais."
 GER_caporetto_mountain_shock:0 "Ofensiva nas Montanhas de Caporetto"
 GER_caporetto_mountain_shock_desc:0 "Lançar corpos de montanha e tropas de choque sob Erwin Rommel e Otto von Below para desbaratar o Segundo Exército Italiano no Isonzo."
 GER_kaiserschlacht_spring_offensive:0 "Kaiserschlacht (Ofensiva da Primavera de 1918)"
 GER_kaiserschlacht_spring_offensive_desc:0 "A aposta derradeira: transferir milhões de veteranos do Leste para lançar um bombardeio tempestuoso e infiltrações de tropas de choque no Somme."
 GER_manfred_von_richthofen:0 "Manfred von Richthofen"
 GER_manfred_von_richthofen_desc:0 "O \"Barão Vermelho\", o ás mais letal da Grande Guerra e comandante da Jagdgeschwader 1 (O Circo Voador)."
 GER_oswald_boelcke:0 "Oswald Boelcke"
 GER_oswald_boelcke_desc:0 "Um dos pais das táticas modernas de combate aéreo, autor da doutrina Dicta Boelcke e mentor dos maiores pilotos de caça da Alemanha."
 GER_ernst_udet:0 "Ernst Udet"
 GER_ernst_udet_desc:0 "Audacioso segundo maior ás alemão da guerra, renomado por acrobacias de precisão e pontaria aérea implacável."
 BAT:0 "Ducado Báltico Unido"
 BAT_DEF:0 "O Ducado Báltico Unido"
 BAT_ADJ:0 "Báltico"
 ww1_germany_endsieg.1.t:0 "O Colapso da Muralha Ocidental e a Nação no Precipício"
 ww1_germany_endsieg.1.d:0 "Os exércitos aliados forçaram a travessia do Reno e penetraram fundo no coração industrial da Alemanha. Em Berlim, o pânico toma conta do Reichstag, e o Alto Comando encontra-se diante de uma encruzilhada agonizante. Devemos aceitar um armistício imediato sob os duros termos da Entente, preservando a pátria sob uma república, ou recusar qualquer submissão e travar a luta até as últimas consequências — um Endsieg incondicional!"
 ww1_germany_endsieg.1.a:0 "Aceitar o Armistício e o Tratado de Versalhes"
 ww1_germany_endsieg.1.b:0 "Nenhum palmo de solo alemão! Lutar até o fim amargo (Endsieg)!"
 ww1_germany.10.t:0 "Estabilização da Frente Ocidental: Começa a Guerra de Trincheiras"
 ww1_germany.10.d:0 "A guerra rápida de movimento estagnou. Apesar de triunfos operacionais impressionantes e da bravura de nossas tropas, Paris permanece fora de alcance. Ambos os lados agora cavam furiosamente no calcário e na lama, estendendo centenas de quilômetros de arame farpado da fronteira suíça até o Canal da Mancha. A era das manobras gloriosas acabou; começou a era do atrito industrializado."
 ww1_germany.10.a:0 "Entrincheirar cada metro da linha de frente."
 ww1_germany_naval.1.t:0 "O Telegrama Zimmermann"
 ww1_germany_naval.1.d:0 "O Secretário de Relações Exteriores Arthur Zimmermann redigiu uma audaciosa proposta cifrada para o governo do México: em troca de uma aliança militar e de um ataque aos Estados Unidos caso estes entrem na guerra europeia, a Alemanha oferece apoio financeiro e a recuperação dos territórios perdidos no Texas, Novo México e Arizona."
 ww1_germany_naval.1.a:0 "Enviar o telegrama para a Cidade do México."
 ww1_germany_naval.1.b:0 "Não arriscar a fúria americana; cancelar o despacho."
 ww1_germany_naval.2.t:0 "Uma Proposta Secreta de Berlim"
 ww1_germany_naval.2.d:0 "O governo imperial alemão propõe uma aliança militar com o México em caso de guerra com os Estados Unidos, prometendo fundos e a restauração dos territórios perdidos no Texas, Novo México e Arizona."
 ww1_germany_naval.2.a:0 "A proposta é inviável e perigosa; recusar."
 ww1_germany_naval.3.t:0 "O Telegrama Zimmermann Revelado!"
 ww1_germany_naval.3.d:0 "A inteligência naval britânica (Sala 40) interceptou e decifrou nosso telegrama diplomático, entregando o texto ao Presidente americano Woodrow Wilson. Os jornais dos Estados Unidos inflamam a opinião pública em fúria, empurrando o país à beira da guerra."
 ww1_germany_naval.3.a:0 "Uma catástrofe diplomática."
 GER_endsieg_total_militarization:0 "[Emergência] Mobilização Militar Total"
 GER_endsieg_total_militarization_desc:0 "Todas as restrições constitucionais são descartadas. Cada fábrica, escola e oficina é colocada sob administração marcial para canalizar cada recurso à linha de frente."
 GER_endsieg_scraping_the_barrel:0 "[Emergência] Raspar o Fundo do Barril"
 GER_endsieg_scraping_the_barrel_desc:0 "Convocar todas as almas aptas restantes pelo Império. Sem exceções, sem adiamentos — a Pátria necessita de cada braço nas trincheiras."
 GER_endsieg_war_economy_requisitions:0 "[Emergência] Requisições da Economia de Guerra"
 GER_endsieg_war_economy_requisitions_desc:0 "Confiscar metais privados, maquinários e veículos civis não essenciais. A produção industrial foca-se exclusivamente em armamento pesado e munição."
 GER_endsieg_underground_factories:0 "[Emergência] Fábricas Bélicas Subterrâneas"
 GER_endsieg_underground_factories_desc:0 "Transferir linhas de montagem para o fundo de minas de carvão, túneis ferroviários e cavernas calcárias para permanecer imune aos bombardeios da Entente."
 GER_endsieg_wonder_weapons_program:0 "[Emergência] Programa de Armas Miraculosas"
 GER_endsieg_wonder_weapons_program_desc:0 "Injetar recursos em inovações de engenharia radical: colossais canhões de Paris, blindados rompedores de trincheiras e compostos químicos persistentes para virar a maré."
 GER_endsieg_volkssturm_call:0 "[Emergência] Convocação da Volkssturm"
 GER_endsieg_volkssturm_call_desc:0 "Decretar a criação da Volkssturm. Todo homem entre dezesseis e sessenta anos de idade deve se apresentar imediatamente para defender suas cidades e lares."
 GER_endsieg_berlin_levee_en_masse:0 "[Emergência] Levée en Masse de Berlim"
 GER_endsieg_berlin_levee_en_masse_desc:0 "Mobilizar os cidadãos de Berlim para fortificar a Capital Imperial. Barricadas erguem-se em cada avenida enquanto milhares pegam em armas em desafio obstinado."
 GER_endsieg_landsturm_battalions:0 "[Emergência] Batalhões da Landsturm no Reno"
 GER_endsieg_landsturm_battalions_desc:0 "Formar divisões territoriais de infantaria da Landsturm para guarnecer as segunda e terceira linhas de defesa nos rios e florestas."
 GER_endsieg_youth_and_veteran_auxiliaries:0 "[Emergência] Auxiliares de Jovens e Veteranos"
 GER_endsieg_youth_and_veteran_auxiliaries_desc:0 "Brigadas de jovens recrutas e veteranos de cabelos brancos da guerra de 1870 posicionam-se ombro a ombro, mantendo linhas de suprimento e postos de defesa."
 GER_endsieg_iron_determination:0 "[Emergência] Determinação Nacional de Ferro"
 GER_endsieg_iron_determination_desc:0 "Inflamar uma determinação nacional inabalável. A derrota não é uma opção; a nação suportará qualquer provação através de uma força de vontade férrea."
 GER_endsieg_rhine_line_proclamation:0 "[Emergência] Proclamação da Linha do Reno"
 GER_endsieg_rhine_line_proclamation_desc:0 "O Reno é declarado a barreira sagrada da Alemanha. Nenhuma divisão inimiga cruzará as águas sem pagar um preço aterrador em sangue."
 GER_endsieg_fortify_the_ruhr:0 "[Emergência] Fortificar a Cidadela do Ruhr"
 GER_endsieg_fortify_the_ruhr_desc:0 "Transformar as fundições, minas e altos-fornos de Essen e Dortmund em um complexo fortificado interligado, repleto de metralhadoras e artilharia pesada."
 GER_endsieg_blow_the_bridges:0 "[Emergência] Demolição das Pontes do Reno"
 GER_endsieg_blow_the_bridges_desc:0 "Dinamitar todas as pontes sobre o Reno da Suíça até a fronteira holandesa, encurralando as pontas de lança inimigas na outra margem sob fogo cruzado."
 GER_endsieg_siegfriedstellung_redoubt:0 "[Emergência] O Reduto da Siegfriedstellung"
 GER_endsieg_siegfriedstellung_redoubt_desc:0 "Recuar ordenadamente para as defesas profundas de concreto da Linha Hindenburg, ancorando a artilharia divisional em casamatas camufladas."
 GER_endsieg_unconquerable_rhineland:0 "[Emergência] Renânia Inconquistável"
 GER_endsieg_unconquerable_rhineland_desc:0 "Lançar células de guerrilha e destacamentos de contra-ataque para converter qualquer cidade renana ocupada em uma zona permanente de resistência urbana."
 GER_endsieg_no_surrender:0 "[Emergência] Nenhuma Rendição Sob Qualquer Diktat"
 GER_endsieg_no_surrender_desc:0 "Rejeitar categoricamente qualquer termo de subjugação. O Exército Imperial lutará até o último soldado, o último cartucho e o último suspiro."
 GER_endsieg_anti_bolshevik_crusade:0 "[Emergência] Cruzada Antibolchevique no Leste"
 GER_endsieg_anti_bolshevik_crusade_desc:0 "Conter a maré vermelha que avança pela Polônia e Lituânia. Os veteranos alemães protegem a civilização europeia contra o caos revolucionário oriental."
 GER_endsieg_stand_against_entente:0 "[Emergência] Resistência Inabalável contra a Entente"
 GER_endsieg_stand_against_entente_desc:0 "Sangrar os exércitos francês e britânico até a exaustão até que suas retaguardas colapsem sob greves antiguerra e motins militares."
 GER_endsieg_freikorps_vanguard:0 "[Emergência] Vanguarda de Choque dos Freikorps"
 GER_endsieg_freikorps_vanguard_desc:0 "Desencadear destacamentos voluntários de veteranos de choque nas frentes rompidas, desferindo contra-ofensivas ferozes contra salientes expostos."
 GER_endsieg_gotterdammerung:0 "[Emergência] Götterdämmerung (O Crepúsculo dos Deuses)"
 GER_endsieg_gotterdammerung_desc:0 "O ápice derradeiro da Grande Guerra. Contra o mundo inteiro, o Império Alemão toma sua posição imortal em sangue e fogo."
 GER_totale_mobilmachung_spirit:0 "Mobilização Total Extrema"
 GER_totale_mobilmachung_spirit_desc:0 "Cada instituição e recurso da nação é dedicado à sobrevivência em guerra total."
 GER_letzte_reserven:0 "As Últimas Reservas"
 GER_letzte_reserven_desc:0 "O fundo absoluto das reservas de recursos humanos é raspado para recompor as linhas divisionais."
 GER_drastic_requisitions:0 "Requisições Drásticas de Guerra"
 GER_drastic_requisitions_desc:0 "Controle estatal total sobre comércio privado, equipamentos e manufatura."
 GER_underground_industry:0 "Instalações Industriais Subterrâneas"
 GER_underground_industry_desc:0 "Fábricas vitais operando em segurança subterrânea, imunes a ataques aéreos."
 GER_volkssturm_call_spirit:0 "Convocação da Volkssturm"
 GER_volkssturm_call_spirit_desc:0 "Massas de cidadãos armados com fuzis em prontidão para defender seus bairros."
 GER_landsturm_defense:0 "Guarda Territorial da Landsturm"
 GER_landsturm_defense_desc:0 "Defensores territoriais guarnecendo pontes e barreiras florestais contra as pontas de lança inimigas."
 GER_patriotic_frenzy:0 "Fervor Patriótico"
 GER_patriotic_frenzy_desc:0 "Uma onda arrebatadora de devoção patriótica varre qualquer dúvida e derrotismo."
 GER_unyielding_spirit:0 "Espírito Nacional Inabalável"
 GER_unyielding_spirit_desc:0 "A Pátria permanece desafiadora contra todas as adversidades."
 GER_festung_rhein:0 "Fortaleza do Reno"
 GER_festung_rhein_desc:0 "A linha do Reno convertida em um bastião inexpugnável de fogo defensivo."
 GER_scorched_crossings:0 "Travessias Fluviais Destruídas"
 GER_scorched_crossings_desc:0 "Pontes implodidas e estradas minadas, negando ao inimigo qualquer avanço fácil."
 GER_westwall_bastion:0 "Bastião da Muralha Ocidental"
 GER_westwall_bastion_desc:0 "Fortificações profundas de concreto em trincheira repelindo bombardeios massivos de artilharia."
 GER_rejection_of_diktat:0 "Rejeição do Diktat"
 GER_rejection_of_diktat_desc:0 "Recusa inflexível de ceder aos ultimatos territoriais dos Aliados."
 GER_anti_bolshevik_spirit:0 "Bastião Antibolchevique"
 GER_anti_bolshevik_spirit_desc:0 "Resistência firme contra o Exército Vermelho nas fronteiras orientais."
 GER_entente_defiance:0 "Desafio à Entente"
 GER_entente_defiance_desc:0 "Sangrando as Potências Ocidentais até que a exaustão quebre sua determinação."
 GER_freikorps_vanguard_spirit:0 "Vanguarda dos Freikorps"
 GER_freikorps_vanguard_spirit_desc:0 "Voluntários de elite lutando com disciplina fanática em manobras defensivas."
 GER_gotterdammerung_climax:0 "Clímax de Götterdämmerung"
 GER_gotterdammerung_climax_desc:0 "A apocalíptica defesa do solo alemão no crepúsculo dos impérios."
 GER_versailles_reparations:0 "Fardo do Tratado de Versalhes"
 GER_versailles_reparations_desc:0 "Indenizações econômicas esmagadoras, desmilitarização e perda territorial sob o Tratado de Versalhes."
 GER_endsieg_fanaticism:0 "Fanatismo de Endsieg"
 GER_endsieg_fanaticism_desc:0 "Devoção total em manter cada trincheira até que o último cartucho seja disparado."
 GER_pax_germanica:0 "[Imperial] Pax Germanica"
 GER_pax_germanica_desc:0 "Com a vitória total alcançada em todas as frentes, o Império Alemão estabelece uma ordem continental duradoura. Berlim se ergue como o pilar inabalável da paz europeia e da preeminência dos Hohenzollern."
 GER_vaterlandspartei_dictatorship:0 "[Totalitário] Ditadura da Vaterlandspartei"
 GER_vaterlandspartei_dictatorship_desc:0 "Sob o domínio de ferro de Tirpitz e Kapp, todos os acordos parlamentares são descartados. A Alemanha é reorganizada como uma guarnição militar totalitária, dedicada à expansão implacável e à guerra total."
 GER_weimar_peace_resolution:0 "[Democrático] Resolução de Paz de Weimar"
 GER_weimar_peace_resolution_desc:0 "Os partidos majoritários do Reichstag promulgam a histórica resolução de paz. Rejeitando anexações e conquistas imperialistas, a Alemanha abraça a democracia parlamentar e a reconciliação com as democracias da Europa."
 GER_spartakusbund_revolution:0 "[Comunista] Revolução Vermelha da Spartakusbund"
 GER_spartakusbund_revolution_desc:0 "Operários e soldados tomaram as fábricas, quartéis e ruas! Todo o poder aos conselhos de operários e soldados! A bandeira vermelha tremula vitoriosa sobre o Portão de Brandemburgo!"
 GER_imperial_pax_spirit:0 "Pax Germanica"
 GER_imperial_pax_spirit_desc:0 "A monarquia Hohenzollern governa uma Mitteleuropa reorganizada e estável, equilibrando a autoridade monárquica com o federalismo imperial."
 GER_vaterlandspartei_hegemony:0 "Regime Totalitário da Vaterlandspartei"
 GER_vaterlandspartei_hegemony_desc:0 "O chauvinismo militarista e a arregimentação estatal dominam a vida pública, mobilizando todos os recursos para a hegemonia continental."
 GER_weimar_peace_coalition:0 "Coalizão Democrática de Weimar"
 GER_weimar_peace_coalition_desc:0 "Uma ampla coalizão parlamentar de social-democratas, Partido do Centro e progressistas conduz a República Alemã rumo à estabilidade social, recuperação econômica e cooperação internacional."
 GER_spartakist_councils:0 "Conselhos de Operários e Soldados"
 GER_spartakist_councils_desc:0 "Conselhos soviéticos democráticos coordenam a produção industrial, a defesa militar e a redistribuição socialista em toda a República Vermelha."
 ww1_germany_political.1.t:0 "Proclamação da Pax Germanica"
 ww1_germany_political.1.d:0 "Com a vitória na Grande Guerra e a consolidação de nossos protetorados a leste e a oeste, o Kaiser Guilherme II discursou ao Reichstag. O Império Alemão é o árbitro indiscutível da Europa continental."
 ww1_germany_political.1.a:0 "Vida longa ao Kaiser! Vida longa ao Império!"
 ww1_germany_political.2.t:0 "Vaterlandspartei Assume o Poder Total"
 ww1_germany_political.2.d:0 "Denunciando os políticos civis como traidores e frouxos, a Deutsche Vaterlandspartei, apoiada pela Liga Pan-Germânica e pelo comando militar, dissolveu o Reichstag e instaurou uma ditadura nacional totalitária."
 ww1_germany_political.2.a:0 "Vitória a qualquer custo!"
 ww1_germany_political.3.t:0 "Resolução de Paz de Weimar Aprovada"
 ww1_germany_political.3.d:0 "A maioria democrática no Reichstag triunfou. O Gabinete Imperial cedeu o comando a um governo parlamentar empenhado em encerrar o conflito, decretar reformas democráticas e negociar uma paz digna."
 ww1_germany_political.3.a:0 "Por paz, liberdade e pão!"
 ww1_germany_political.4.t:0 "República Vermelha da Spartakusbund Proclamada"
 ww1_germany_political.4.d:0 "Karl Liebknecht e Rosa Luxemburg proclamaram a República Socialista Livre da Alemanha na sacada do Palácio de Berlim. A águia imperial caiu; a classe trabalhadora alemã marcha com o proletariado internacional!"
 ww1_germany_political.4.a:0 "Todo poder aos Conselhos!"
