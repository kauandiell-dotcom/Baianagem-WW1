l_braz_por:
 AUH_ww1_admiralty_review:0 "Revisar o Almirantado"
 AUH_ww1_admiralty_review_desc:0 "O Adriático estreito pede uma marinha compatível com os recursos e as bases existentes."
 AUH_ww1_adriatic_civil_compact:0 "Um compromisso civil no Adriático"
 AUH_ww1_adriatic_civil_compact_desc:0 "A administração costeira precisa de garantias locais mesmo quando a diplomacia fracassa."
 AUH_ww1_adriatic_consultation:0 "Consultas sobre o Adriático"
 AUH_ww1_adriatic_consultation_desc:0 "O canal de consulta permite renovar confiança somente enquanto a relação não se tornou uma guerra. Efeito imediato: +15 poder político, +1 confiança provincial."
 AUH_ww1_adriatic_rail:0 "O corredor para o Adriático"
 AUH_ww1_adriatic_rail_desc:0 "Ligar Viena ao litoral favorece o porto e a frente italiana, desde que a linha permaneça aberta. Efeito imediato: +2 confiança provincial."
 AUH_ww1_adriatic_supply:0 "Sustentar as bases do Adriático"
 AUH_ww1_adriatic_supply_desc:0 "As bases precisam de ligações terrestres e de costa mantida sob controle. Efeito imediato: +2 reservas alimentares, +2 experiência naval."
 AUH_ww1_aerial_observation:0 "Observação aérea"
 AUH_ww1_aerial_observation_desc:0 "O reconhecimento é uma missão própria da aviação inicial, sem supremacia aérea gratuita."
 AUH_ww1_aeronautical_testing:0 "Ensaios aeronáuticos"
 AUH_ww1_aeronautical_testing_desc:0 "Os ensaios melhoram a pesquisa de módulos disponíveis sem bônus de antecipação tecnológica."
 AUH_ww1_agreement:0 "Entendimento com Viena"
 AUH_ww1_agricultural_tools:0 "Ferramentas para o campo"
 AUH_ww1_agricultural_tools_desc:0 "Métodos agrícolas e equipamentos simples ajudam a conservar trabalhadores no campo."
 AUH_ww1_air_artillery_liaison:0 "Ligação entre aviadores e baterias"
 AUH_ww1_air_artillery_liaison_desc:0 "O treinamento conjunto oferece experiência aérea para organizar a força existente."
 AUH_ww1_air_service_manual:0 "Manual do serviço aéreo"
 AUH_ww1_air_service_manual_desc:0 "O serviço aprende por tempo limitado dentro das doutrinas atuais, preservando a escala inicial da aviação."
 AUH_ww1_air_training:0 "Formação do serviço aéreo"
 AUH_ww1_airfield_services:0 "Serviços de aeródromo"
 AUH_ww1_airfield_services_desc:0 "A infraestrutura aérea precisa ser construída antes de apoiar forças maiores. Efeito imediato: +2 experiência aérea, −10 poder político."
 AUH_ww1_albanian_contacts:0 "Contatos na Albânia"
 AUH_ww1_albanian_contacts_desc:0 "A ajuda civil será proposta ao governo albanês; nenhum protetorado será imposto gratuitamente."
 AUH_ww1_alliance_independence:0 "Preservar a autonomia na aliança"
 AUH_ww1_alliance_independence_desc:0 "A monarquia escolhe entre maior dependência política e uma coordenação de custos mais limitada."
 AUH_ww1_alliance_renewed:0 "Aliança renovada com Viena"
 AUH_ww1_alpine_routes:0 "Rotas de abastecimento alpinas"
 AUH_ww1_alpine_routes_desc:0 "As obras alpinas beneficiam uma região concreta, sem proteção uniforme sobre toda a monarquia. Efeito imediato: +2 experiência terrestre, −10 poder político."
 AUH_ww1_ammunition_inspection:0 "Inspeção de munições"
 AUH_ww1_ammunition_inspection_desc:0 "A qualidade da munição deve ser estudada e produzida, em vez de garantir vitórias pelo foco."
 AUH_ww1_armistice_delegates:0 "Delegados para um armistício"
 AUH_ww1_armistice_delegates_desc:0 "Uma proposta precisa de consentimento de todos os países que ainda combatem a monarquia. Efeito imediato: +30 poder político, −1% apoio à guerra."
 AUH_ww1_armistice_proposal:0 "Enviar uma proposta de armistício"
 AUH_ww1_armistice_proposal_desc:0 "A proposta sem anexações será entregue a todos os inimigos atuais. Cada governo pode aceitar ou rejeitar. A guerra continua durante as conversações; autorizações expiram em 120 dias."
 AUH_ww1_arsenal_standards:0 "Normas comuns dos arsenais"
 AUH_ww1_arsenal_standards_desc:0 "Inspeções substituem a vantagem inicial genérica da Škoda por uma melhora modesta de produção e retenção. Efeito imediato: +2 consentimento, −15 poder político."
 AUH_ww1_arsenal_subsidy:0 "Subsidiar os arsenais"
 AUH_ww1_arsenal_subsidy_desc:0 "Duas fábricas civis por 90 dias financiam encomendas antecipadas: +4% de eficiência de produção por 120 dias, +2% de bens de consumo exigidos e um nível a mais de dívida. Requer limite de dívida livre."
 AUH_ww1_arsenals_initial:0 "Arsenais especializados, padrões distintos"
 AUH_ww1_arsenals_initial_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_arsenals_standardised:0 "Padrões comuns dos arsenais"
 AUH_ww1_arsenals_standardised_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_artillery_reserves:0 "Reservas de munição por frente"
 AUH_ww1_artillery_reserves_desc:0 "As reservas operacionais serão reunidas a partir do estoque real e utilizadas em uma preparação limitada. Efeito imediato: −15 poder político, +2 experiência terrestre."
 AUH_ww1_aviatik_contracts:0 "Contratos com a Aviatik"
 AUH_ww1_aviatik_contracts_desc:0 "A contratação prepara a pesquisa de caças, sem adicionar aviões aos estoques."
 AUH_ww1_balanced_accounts:0 "Equilibrar as contas da paz"
 AUH_ww1_balanced_accounts_desc:0 "Amortizar obrigações reduz a pressão fiscal; nenhum foco apaga dívida acumulada de forma automática. Efeito imediato: −1 nível de dívida, −20 poder político."
 AUH_ww1_balkan_plan:0 "Reavaliar o plano balcânico"
 AUH_ww1_balkan_plan_desc:0 "A operação exige guerra real contra a Sérvia, munição e conquista territorial para ser considerada um sucesso. Efeito imediato: +2 experiência terrestre, +10 poder de comando."
 AUH_ww1_balkan_restraint:0 "Limitar compromissos nos Bálcãs"
 AUH_ww1_balkan_restraint_desc:0 "A acomodação reduz a pressão política interna, mas torna novas justificações de guerra mais lentas. Efeito imediato: +0,5% estabilidade."
 AUH_ww1_ballhausplatz:0 "Revisar a política do Ballhausplatz"
 AUH_ww1_ballhausplatz_desc:0 "A monarquia precisa decidir entre acomodação regional e pressão diplomática, sem bônus genérico para justificar guerras."
 AUH_ww1_banat_council:0 "Um conselho para o Banato"
 AUH_ww1_banat_council_desc:0 "Negociar serviços regionais reduz conflitos administrativos sem eliminar divergências nacionais. Efeito imediato: +2 confiança provincial, +2 reservas alimentares."
 AUH_ww1_battery_survey:0 "Levantamento das baterias"
 AUH_ww1_battery_survey_desc:0 "Inventariar calibres oferece experiência para ajustar os modelos das divisões."
 AUH_ww1_belgrade_channel:0 "Abrir um canal com Belgrado"
 AUH_ww1_belgrade_channel_desc:0 "Uma normalização comercial depende da aceitação sérvia e só vale em paz."
 AUH_ww1_berlin_mission:0 "Uma missão em Berlim"
 AUH_ww1_berlin_mission_desc:0 "A Alemanha poderá aceitar ou rejeitar uma comissão militar conjunta; Viena não decide por ela."
 AUH_ww1_bohemian_landtag:0 "O Landtag da Boêmia"
 AUH_ww1_bohemian_landtag_desc:0 "Representação local deve chegar à administração e ao orçamento, além de uma declaração imperial. Efeito imediato: +2 confiança provincial, +1 consentimento, um auxílio único de 10% à pesquisa (industry)."
 AUH_ww1_bond_issue:0 "Emitir uma série de títulos de guerra"
 AUH_ww1_bond_issue_desc:0 "Uma emissão financia a indústria por 180 dias: produção +2,5%, com dívida aumentada em um nível. O consumo civil do serviço da dívida persistirá até a amortização. Limite de seis séries."
 AUH_ww1_bosnian_civil_security:0 "Segurança civil na Bósnia"
 AUH_ww1_bosnian_civil_security_desc:0 "A segurança pode ser negociada ou imposta; a repressão amplia tensões internas e não impede eventos por decreto."
 AUH_ww1_bosnian_guarantees:0 "Garantias para a Bósnia"
 AUH_ww1_bosnian_guarantees_desc:0 "A terceira Coroa não pode transformar a população bósnia numa simples extensão de Zagreb. Efeito imediato: +3 confiança provincial, −1 consentimento."
 AUH_ww1_bosnian_rail:0 "O acesso ferroviário à Bósnia"
 AUH_ww1_bosnian_rail_desc:0 "A logística balcânica exige corredores reais em território aliado. Efeito imediato: +2 confiança provincial."
 AUH_ww1_bucharest_channel:0 "Uma missão em Bucareste"
 AUH_ww1_bucharest_channel_desc:0 "A Romênia decide se aceita o pacto agrícola; o território transilvano não será entregue ou ampliado pelo foco."
 AUH_ww1_budapest_compact:0 "O acordo de Budapeste"
 AUH_ww1_budapest_compact_desc:0 "O apoio magiar vem acompanhado de concessões às elites húngaras; outras províncias percebem o preço. Efeito imediato: +0,5% estabilidade, +20 poder político."
 AUH_ww1_budget_federal:0 "Finanças federais pactuadas"
 AUH_ww1_budget_federal_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_budget_negotiated:0 "Orçamento comum negociado"
 AUH_ww1_budget_negotiated_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_budget_settled:0 "As quotas do dualismo"
 AUH_ww1_budget_settled_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_budget_trialist:0 "As quotas das três Coroas"
 AUH_ww1_budget_trialist_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_budget_unsettled:0 "Orçamento comum contestado"
 AUH_ww1_budget_unsettled_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_bukovina_compact:0 "O acordo da Bucovina"
 AUH_ww1_bukovina_compact_desc:0 "Uma província diversa exige representação compartilhada, sem lealdade automática de qualquer grupo. Efeito imediato: +2 confiança provincial, +1 consentimento."
 AUH_ww1_carpathian_survey:0 "Levantamento dos Cárpatos"
 AUH_ww1_carpathian_survey_desc:0 "A defesa depende de regiões mantidas e de projetos concluídos antes da ofensiva inimiga. Efeito imediato: +2 experiência terrestre."
 AUH_ww1_central_power_liaison:0 "Ligação permanente com os aliados"
 AUH_ww1_central_power_liaison_desc:0 "A ligação militar financiará cursos temporários enquanto a relação diplomática permitir. Efeito imediato: +1 consentimento, +1% apoio à guerra, +2 experiência terrestre."
 AUH_ww1_civil_cabinet:0 "Coordenação civil de guerra"
 AUH_ww1_civil_cabinet_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_civil_war_cabinet:0 "Financiar o gabinete civil de guerra"
 AUH_ww1_civil_war_cabinet_desc:0 "Um gabinete de 180 dias custa influência e consumo civil, oferecendo apenas uma melhora limitada de coordenação produtiva."
 AUH_ww1_civilian_conversion:0 "Reconversão industrial preparada"
 AUH_ww1_civilian_conversion_desc:0 "Um projeto civil pode diversificar a indústria, mas ocupa capacidade durante um ano inteiro. Efeito imediato: +0,5% estabilidade, −15 poder político."
 AUH_ww1_civilian_service:0 "Serviços civis de paz"
 AUH_ww1_civilian_service_desc:0 "A administração sai da emergência e mantém um orçamento limitado para serviços comuns. Efeito imediato: +0,5% estabilidade."
 AUH_ww1_coastal_course:0 "Curso de observação costeira"
 AUH_ww1_coastal_course_desc:0 "Um curso de 90 dias ocupa uma fábrica civil, consome 0 rifles e 20 equipamentos de apoio e concede 4 de experiência. Nenhuma divisão ou aeronave é criada."
 AUH_ww1_coastal_observation:0 "Postos de observação costeira"
 AUH_ww1_coastal_observation_desc:0 "Preparar observação exige pessoal e apoio; não substitui missões reais de patrulha. Efeito imediato: +3 experiência naval."
 AUH_ww1_combined_staff:0 "Coordenação entre frentes"
 AUH_ww1_combined_staff_desc:0 "A coordenação gera experiência para ajustes de doutrina e organização, sem estatísticas de combate empilhadas."
 AUH_ww1_common_army_review:0 "Revisar o exército comum"
 AUH_ww1_common_army_review_desc:0 "A organização do exército depende de orçamento, comunicação e reservas, não de inferioridade étnica."
 AUH_ww1_common_bank:0 "O banco austro-húngaro"
 AUH_ww1_common_bank_desc:0 "Crédito de emergência pode financiar a guerra, com obrigações que persistem depois dela. Efeito imediato: +30 poder político."
 AUH_ww1_common_customs:0 "Uma alfândega, três Coroas"
 AUH_ww1_common_customs_desc:0 "O mercado comum preserva as receitas, mas financiar três administrações não é gratuito. Efeito imediato: +0,5% estabilidade, +20 poder político."
 AUH_ww1_common_food_board:0 "Uma comissão comum de alimentos"
 AUH_ww1_common_food_board_desc:0 "A comissão pode negociar compras ou requisitar estoques. Cada opção afeta consentimento e coesão."
 AUH_ww1_common_statistics:0 "Estatísticas econômicas comuns"
 AUH_ww1_common_statistics_desc:0 "Dados comparáveis permitem estudar métodos de produção dentro dos limites da tecnologia disponível."
 AUH_ww1_common_war_assessment:0 "Avaliação conjunta da guerra"
 AUH_ww1_common_war_assessment_desc:0 "O planejamento conjunto oferece experiência e continua subordinado às frentes reais."
 AUH_ww1_conclude_armistice:0 "Concluir o armistício por acordo"
 AUH_ww1_conclude_armistice_desc:0 "Exige autorização vigente de todos os inimigos atuais. A monarquia deixa sua facção e conclui paz branca com os beligerantes; não concede anexações e não garante a paz de seus aliados."
 AUH_ww1_conference_mandate:0 "Um mandato para a conferência"
 AUH_ww1_conference_mandate_desc:0 "O governo poderá concluir a negociação apenas quando todos os inimigos deram seu consentimento. Efeito imediato: +30 poder político."
 AUH_ww1_constantinople_mission:0 "Enviar uma missão a Constantinopla"
 AUH_ww1_constantinople_mission_desc:0 "Uma missão de 45 dias melhora a opinião turca sobre nós, e a Turquia também passa a ver a monarquia com mais simpatia. Não cria aliança."
 AUH_ww1_constitutional_audit:0 "Revisar o compromisso de 1867"
 AUH_ww1_constitutional_audit_desc:0 "Não basta anunciar uma reforma. Escolheremos quem cede poderes e quem assume seu custo."
 AUH_ww1_constitutional_convention:0 "A convenção constitucional"
 AUH_ww1_constitutional_convention_desc:0 "Delegados terão de negociar a repartição de poderes antes da promulgação da constituição. Efeito imediato: +3 consentimento, +2 confiança provincial, −20 poder político."
 AUH_ww1_constitutional_session:0 "Negociar a convenção"
 AUH_ww1_constitutional_session_desc:0 "Uma sessão financia a convenção e aumenta consentimento e confiança em 4 pontos, consumindo capacidade civil por 90 dias."
 AUH_ww1_consular_network:0 "A rede consular"
 AUH_ww1_consular_network_desc:0 "Contatos consulares abrem canais de proposta com resposta do outro país. Efeito imediato: +25 poder político, +1 consentimento."
 AUH_ww1_coronation_city_visit:0 "Visita imperial a Budapeste"
 AUH_ww1_coronation_city_visit_desc:0 "Uma visita de 30 dias à cidade da coroação de Santo Estêvão dá +4 de consentimento e custa −1 de confiança nas demais províncias."
 AUH_ww1_council:0 "Conselho das províncias"
 AUH_ww1_council_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_council_of_peoples:0 "Um conselho dos povos"
 AUH_ww1_council_of_peoples_desc:0 "A representação provincial limita a liberdade do executivo e torna a negociação uma obrigação permanente. Efeito imediato: +3 confiança provincial, −15 poder político."
 AUH_ww1_counter_battery:0 "Estudo de contrabateria"
 AUH_ww1_counter_battery_desc:0 "A experiência de tiro poderá financiar adaptações da organização militar."
 AUH_ww1_credit_expansion:0 "Crédito industrial temporário"
 AUH_ww1_credit_expansion_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_croatian_diet:0 "Convocar o Sabor"
 AUH_ww1_croatian_diet_desc:0 "O parlamento croata recebe um projeto de autonomia civil; o exército comum continua sujeito a negociação. Efeito imediato: +3 confiança provincial, −1 consentimento."
 AUH_ww1_crown:0 "A Coroa e as províncias"
 AUH_ww1_crown_arbitration:0 "Arbitragem da Coroa"
 AUH_ww1_crown_arbitration_desc:0 "Uma disputa entre as administrações oferece a escolha entre impor a decisão ou aceitar mediação."
 AUH_ww1_crown_council:0 "Reunir o Conselho da Coroa"
 AUH_ww1_crown_council_desc:0 "Viena e Budapeste precisam definir o que a monarquia comum pode realmente financiar."
 AUH_ww1_crown_desc:0 "Consentimento das administrações: §Y[?auh_ww1_consent|0]/100§!\nConfiança das províncias: §Y[?auh_ww1_cohesion|0]/100§!\nReservas alimentares: §Y[?auh_ww1_provisions|0]/100§!\nObrigações de dívida: §Y[?auh_ww1_debt|0]/6§!\nProjetos civis ativos: §Y[?auh_ww1_projects_active|0]/2§!\n\nA escassez alimentar prejudica a produção. As crises militares existentes continuam respondendo à situação da guerra; não há colapso automático por data."
 AUH_ww1_crownland_hearings:0 "Ouvir as terras da Coroa"
 AUH_ww1_crownland_hearings_desc:0 "Representantes provinciais ganham acesso a consultas, sem promessas de lealdade automática. Efeito imediato: +3 confiança provincial, −1 consentimento."
 AUH_ww1_dalmatian_ports:0 "Instalações da costa dálmata"
 AUH_ww1_dalmatian_ports_desc:0 "Instalações terrestres apoiam o litoral sem criar um império naval global. Efeito imediato: +2 confiança provincial, +2 experiência naval."
 AUH_ww1_dalmatian_services:0 "Serviços civis na Dalmácia"
 AUH_ww1_dalmatian_services_desc:0 "A costa adriática também precisa de administração civil, além de bases navais. Efeito imediato: +2 confiança provincial, +1 consentimento."
 AUH_ww1_danube_services:0 "Serviços comerciais no Danúbio"
 AUH_ww1_danube_services_desc:0 "A navegação fluvial precisa de instalações, acesso e investimento, em vez de comércio abstrato gratuito. Efeito imediato: +3 reservas alimentares, +1 consentimento."
 AUH_ww1_danubian_reconciliation:0 "Financiar a reconciliação das administrações"
 AUH_ww1_danubian_reconciliation_desc:0 "Uma fábrica civil por 90 dias recupera 4 de consentimento e 3 de confiança durante a paz."
 AUH_ww1_danubian_services:0 "Reconciliação das administrações"
 AUH_ww1_danubian_services_desc:0 "A reconciliação continua exigindo concessões, sem declarar resolvidos todos os conflitos nacionais. Efeito imediato: +3 consentimento, +3 confiança provincial."
 AUH_ww1_debt_1:0 "Obrigações de guerra limitadas"
 AUH_ww1_debt_1_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_debt_2:0 "Orçamento endividado"
 AUH_ww1_debt_2_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_debt_3:0 "Serviço pesado da dívida"
 AUH_ww1_debt_3_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_defensive_manual:0 "O manual defensivo de Borojević"
 AUH_ww1_defensive_manual_desc:0 "Uma escola defensiva traz uma melhora modesta de preparação e limita a velocidade de planejamento ofensivo. Efeito imediato: +3 experiência terrestre."
 AUH_ww1_defensive_staff:0 "Estado-maior defensivo"
 AUH_ww1_defensive_staff_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_delegation_session:0 "Negociar com as delegações"
 AUH_ww1_delegation_session_desc:0 "Uma sessão de 60 dias custa influência e aumenta o consentimento em 6 pontos. Só é útil enquanto o apoio está abaixo de 85."
 AUH_ww1_delegations:0 "As delegações de 1911"
 AUH_ww1_delegations_desc:0 "Negociações regulares com as duas delegações podem obter consentimento, mas consomem influência política. Efeito imediato: +3 consentimento, +20 poder político."
 AUH_ww1_demobilisation:0 "Desmobilização negociada"
 AUH_ww1_demobilisation_desc:0 "A paz exige escolher o ritmo de retorno à vida civil e pagar o custo da reintegração."
 AUH_ww1_diplomacy:0 "Canais diplomáticos"
 AUH_ww1_diplomacy_desc:0 "Consentimento das administrações: §Y[?auh_ww1_consent|0]/100§!\nConfiança das províncias: §Y[?auh_ww1_cohesion|0]/100§!\nReservas alimentares: §Y[?auh_ww1_provisions|0]/100§!\nObrigações de dívida: §Y[?auh_ww1_debt|0]/6§!\nProjetos civis ativos: §Y[?auh_ww1_projects_active|0]/2§!\n\nA escassez alimentar prejudica a produção. As crises militares existentes continuam respondendo à situação da guerra; não há colapso automático por data."
 AUH_ww1_diplomatic_accounts:0 "As obrigações internacionais"
 AUH_ww1_diplomatic_accounts_desc:0 "As duas administrações devem conhecer o custo dos compromissos externos."
 AUH_ww1_diplomatic_restraint:0 "Acomodação regional"
 AUH_ww1_diplomatic_restraint_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_doctrine_lessons:0 "Aprender com as operações"
 AUH_ww1_doctrine_lessons_desc:0 "Experiência e aprendizado temporário alimentam as doutrinas da versão 1.19; não substituem o combate."
 AUH_ww1_dual_war_cabinet:0 "Dois governos, um gabinete de guerra"
 AUH_ww1_dual_war_cabinet_desc:0 "A coordenação em guerra será temporária e só poderá ser ativada com as duas administrações de acordo. Efeito imediato: +2% apoio à guerra, +15 poder político."
 AUH_ww1_dualism:0 "Renovar o dualismo"
 AUH_ww1_dualism_desc:0 "Preservar os dois centros de poder exige um orçamento negociado e mantém privilégios contestados."
 AUH_ww1_dynastic_protocol:0 "Protocolo dinástico revisado"
 AUH_ww1_dynastic_protocol_desc:0 "A sucessão segue a situação da casa imperial. Reformas civis não garantem impedir o atentado de Sarajevo."
 AUH_ww1_eastern_contingency:0 "A contingência oriental"
 AUH_ww1_eastern_contingency_desc:0 "O planejamento defensivo permanece relevante se a Rússia rejeitar o entendimento. Efeito imediato: +3 experiência terrestre, −15 poder político."
 AUH_ww1_eastern_refugees:0 "Assistência a refugiados orientais"
 AUH_ww1_eastern_refugees_desc:0 "A assistência consome capacidade civil e ajuda a sustentar a confiança, sem bônus de recrutamento de refugiados. Efeito imediato: +3 confiança provincial, −2 reservas alimentares."
 AUH_ww1_economic_coordination:0 "Coordenar as duas economias"
 AUH_ww1_economic_coordination_desc:0 "Um gabinete econômico permite coordenar prioridades sem criar fábricas instantâneas. Efeito imediato: +3 consentimento, +25 poder político."
 AUH_ww1_economic_inventory:0 "Inventário econômico da monarquia"
 AUH_ww1_economic_inventory_desc:0 "A indústria boêmia e o campo húngaro são complementares, mas não obedecem à mesma administração."
 AUH_ww1_economy:0 "A economia comum"
 AUH_ww1_economy_desc:0 "Consentimento das administrações: §Y[?auh_ww1_consent|0]/100§!\nConfiança das províncias: §Y[?auh_ww1_cohesion|0]/100§!\nReservas alimentares: §Y[?auh_ww1_provisions|0]/100§!\nObrigações de dívida: §Y[?auh_ww1_debt|0]/6§!\nProjetos civis ativos: §Y[?auh_ww1_projects_active|0]/2§!\n\nA escassez alimentar prejudica a produção. As crises militares existentes continuam respondendo à situação da guerra; não há colapso automático por data."
 AUH_ww1_electrical_workshops:0 "Oficinas de eletricidade e comunicações"
 AUH_ww1_electrical_workshops_desc:0 "A pesquisa elétrica permanece vinculada às tecnologias de sua época."
 AUH_ww1_emergency_shifts:0 "Jornadas de emergência"
 AUH_ww1_emergency_shifts_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_escort_design:0 "Projetos de escolta"
 AUH_ww1_escort_design_desc:0 "Projetos de navios leves competem com a pesquisa dos grandes cascos."
 AUH_ww1_factory_canteens:0 "Refeitórios nas fábricas"
 AUH_ww1_factory_canteens_desc:0 "Alimentar trabalhadores concorre com outras despesas, mas ajuda a sustentar um esforço prolongado. Efeito imediato: +4 reservas alimentares, +2 confiança provincial."
 AUH_ww1_factory_inspection:0 "Inspeção das condições nas fábricas"
 AUH_ww1_factory_inspection_desc:0 "Jornadas maiores podem elevar a produção por algum tempo, mas cobram um preço dos trabalhadores."
 AUH_ww1_fair_rationing:0 "Rações com distribuição equitativa"
 AUH_ww1_fair_rationing_desc:0 "A distribuição mais regular protege a reserva, mas continua retirando recursos da economia de guerra. Efeito imediato: +4 reservas alimentares, +0,5% estabilidade."
 AUH_ww1_federal_common_army:0 "Um exército federal comum"
 AUH_ww1_federal_common_army_desc:0 "A constituição mantém a defesa comum, com formação financiada e recrutamento supervisionado. Efeito imediato: +4 experiência terrestre, +2 confiança provincial."
 AUH_ww1_federal_constitution:0 "Promulgar a constituição federal"
 AUH_ww1_federal_constitution_desc:0 "A ratificação exige apoio das administrações e das províncias; o nome do Estado acompanha a mudança constitucional."
 AUH_ww1_federal_course:0 "Curso do exército federal"
 AUH_ww1_federal_course_desc:0 "Um curso de 90 dias ocupa uma fábrica civil, consome 300 rifles e 30 equipamentos de apoio e concede 6 de experiência. Nenhuma divisão ou aeronave é criada."
 AUH_ww1_federal_tax_compact:0 "O pacto fiscal federal"
 AUH_ww1_federal_tax_compact_desc:0 "A federação precisa decidir quanto cada província retém e quanto entrega aos serviços comuns."
 AUH_ww1_federal_war_cabinet:0 "Gabinete federal de emergência"
 AUH_ww1_federal_war_cabinet_desc:0 "A emergência poderá coordenar a produção, mas não apaga os direitos das províncias. Efeito imediato: +2% apoio à guerra, +15 poder político."
 AUH_ww1_federalism:0 "Preparar uma monarquia federal"
 AUH_ww1_federalism_desc:0 "Um pacto federal é uma alternativa plausível, mas enfrenta oposição aristocrática e magiar."
 AUH_ww1_field_telephones:0 "Telefones de campanha"
 AUH_ww1_field_telephones_desc:0 "A transmissão de ordens deve ser pesquisada e distribuída às tropas."
 AUH_ww1_fire_control:0 "Procedimentos de controle de fogo"
 AUH_ww1_fire_control_desc:0 "Comunicações melhores devem chegar ao campo pela pesquisa e pelo equipamento de apoio."
 AUH_ww1_fiscal_reserve:0 "Reservas para o pós-guerra"
 AUH_ww1_fiscal_reserve_desc:0 "Preparar a amortização da dívida permite evitar que a paz apenas prolongue a emergência fiscal. Efeito imediato: −1 nível de dívida, −20 poder político."
 AUH_ww1_fleet_cautious:0 "Esquadra de preservação"
 AUH_ww1_fleet_cautious_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_fleet_course:0 "Exercícios da esquadra"
 AUH_ww1_fleet_course_desc:0 "Um curso de 90 dias ocupa uma fábrica civil, consome 0 rifles e 40 equipamentos de apoio e concede 6 de experiência. Nenhuma divisão ou aeronave é criada."
 AUH_ww1_fleet_gunnery:0 "Exercícios de tiro da esquadra"
 AUH_ww1_fleet_gunnery_desc:0 "Exercícios custam capacidade civil e equipamento de apoio; sua experiência poderá financiar doutrina. Efeito imediato: +3 experiência naval."
 AUH_ww1_fleet_in_being:0 "Preservar a esquadra de batalha"
 AUH_ww1_fleet_in_being_desc:0 "Uma postura cautelosa favorece retirada e preservação, mas reduz a velocidade operacional. Efeito imediato: +1 confiança provincial, +2 experiência naval."
 AUH_ww1_fleet_signalling:0 "Sinalização da esquadra"
 AUH_ww1_fleet_signalling_desc:0 "O treinamento de sinalização oferece experiência para organizar a frota."
 AUH_ww1_food_pressure_1:0 "Reservas alimentares sob pressão"
 AUH_ww1_food_pressure_1_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_food_pressure_2:0 "Abastecimento urbano crítico"
 AUH_ww1_food_pressure_2_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_food_pressure_3:0 "Ruptura do abastecimento urbano"
 AUH_ww1_food_pressure_3_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_foreign_programme:0 "Uma política externa com limites"
 AUH_ww1_foreign_programme_desc:0 "Alianças e acordos serão propostas recíprocas, com condições de guerra e de soberania. Efeito imediato: +20 poder político."
 AUH_ww1_fortress_inspection:0 "Cinturão de fortalezas inspecionado"
 AUH_ww1_fortress_inspection_desc:0 "Guarnições e depósitos das fortalezas foram conferidos: +6% de velocidade de entrincheiramento, +2% de consumo de suprimentos."
 AUH_ww1_front_crisis:0 "Crise na frente"
 AUH_ww1_front_crisis_desc:0 "Reservas gastas e planos desfeitos: −5% de organização do exército e −5% de planejamento."
 AUH_ww1_galician_autonomy:0 "Autonomia civil na Galícia"
 AUH_ww1_galician_autonomy_desc:0 "Poloneses e rutenos precisam de garantias que sobrevivam à mobilização. Efeito imediato: +2 confiança provincial, +2 reservas alimentares."
 AUH_ww1_galician_oil:0 "O petróleo da Galícia"
 AUH_ww1_galician_oil_desc:0 "A produção local reduz uma vulnerabilidade limitada; não torna a monarquia autossuficiente. Efeito imediato: +20 poder político, +1 confiança provincial."
 AUH_ww1_galician_plan:0 "O plano de recuperação da Galícia"
 AUH_ww1_galician_plan_desc:0 "Recuperar território depende do mapa atual; não haverá vitória automática contra a Rússia. Efeito imediato: +2 experiência terrestre, +10 poder de comando."
 AUH_ww1_galician_rail:0 "A ferrovia da Galícia"
 AUH_ww1_galician_rail_desc:0 "Um corredor melhor permite deslocar reservas para o leste, sem aumentar velocidade de todas as divisões. Efeito imediato: +2 confiança provincial."
 AUH_ww1_german_exchange:0 "Financiar a comissão militar alemã"
 AUH_ww1_german_exchange_desc:0 "Uma fábrica civil por 90 dias gera 8 de experiência terrestre se a Alemanha aceitou a comissão e permanece em paz conosco."
 AUH_ww1_german_staff_exchange:0 "Intercâmbio de estado-maior"
 AUH_ww1_german_staff_exchange_desc:0 "O intercâmbio só pode ocorrer se a Alemanha concordou e continuamos aliados ou em paz entre nós. Efeito imediato: +3 experiência terrestre."
 AUH_ww1_german_supply_protocol:0 "Protocolo de abastecimento aliado"
 AUH_ww1_german_supply_protocol_desc:0 "A coordenação de abastecimento orienta pesquisa; não transfere equipamento alemão sem sua autorização."
 AUH_ww1_governors_conference:0 "Reunir os governadores provinciais"
 AUH_ww1_governors_conference_desc:0 "Uma conferência de 60 dias dá +4 de confiança provincial e −1 de consentimento, pois Budapeste vê a reunião com desconfiança."
 AUH_ww1_grain_purchase:0 "Comprar e distribuir cereal húngaro"
 AUH_ww1_grain_purchase_desc:0 "Duas fábricas civis por 60 dias compram e transportam cereal: +10 reservas alimentares e −2 consentimento. A região agrícola deve permanecer sob controle."
 AUH_ww1_granaries:0 "Armazéns de cereal"
 AUH_ww1_granaries_desc:0 "Os armazéns dão margem para enfrentar interrupções, sem abastecimento infinito. Efeito imediato: +6 reservas alimentares, −20 poder político."
 AUH_ww1_harvest_leave:0 "Contingentes liberados para a colheita"
 AUH_ww1_harvest_leave_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_harvest_leave_grant:0 "Conceder licenças para a colheita"
 AUH_ww1_harvest_leave_grant_desc:0 "Parte dos contingentes recebe licença: as reservas crescem 8 pontos após 90 dias, com mobilização mais lenta durante a temporada."
 AUH_ww1_honved_contract:0 "Cumprir o contrato do Honvéd"
 AUH_ww1_honved_contract_desc:0 "Um curso de 90 dias ocupa uma fábrica civil, consome 300 rifles e 30 equipamentos de apoio e concede 6 de experiência. Nenhuma divisão ou aeronave é criada."
 AUH_ww1_honved_course:0 "Curso do Honvéd"
 AUH_ww1_honved_course_desc:0 "Um curso de 90 dias ocupa uma fábrica civil, consome 300 rifles e 20 equipamentos de apoio e concede 5 de experiência. Nenhuma divisão ou aeronave é criada."
 AUH_ww1_honved_safeguards:0 "As garantias do Honvéd"
 AUH_ww1_honved_safeguards_desc:0 "O contingente húngaro será financiado por contratos de formação e equipamento, e não por soldados criados do nada. Efeito imediato: +3 consentimento, −1 confiança provincial, +2 experiência terrestre."
 AUH_ww1_honved_training:0 "Treinamento do Honvéd"
 AUH_ww1_honved_training_desc:0 "O treinamento húngaro depende do consentimento da administração de Budapeste. Efeito imediato: +3 experiência terrestre, +2 consentimento."
 AUH_ww1_hungarian_harvest:0 "A colheita húngara"
 AUH_ww1_hungarian_harvest_desc:0 "Reservas urbanas dependem de comprar e transportar cereal, não apenas de possuir terras agrícolas. Efeito imediato: +6 reservas alimentares, −1 consentimento."
 AUH_ww1_industrial_training:0 "Financiar a formação de trabalhadores"
 AUH_ww1_industrial_training_desc:0 "Uma fábrica civil por 90 dias aumenta a confiança em 3 pontos e concede um auxílio único de 15% à pesquisa industrial, sem antecipação tecnológica."
 AUH_ww1_infantry_field_manual:0 "Um manual comum de infantaria"
 AUH_ww1_infantry_field_manual_desc:0 "Um manual compartilhado oferece experiência para reorganizar as unidades existentes."
 AUH_ww1_inspect_fortress_belt:0 "Inspecionar o cinturão de fortalezas"
 AUH_ww1_inspect_fortress_belt_desc:0 "Em guerra, uma fábrica civil por 45 dias confere guarnições e depósitos: +6% de velocidade de entrincheiramento e +2% de consumo de suprimentos por 120 dias."
 AUH_ww1_inst_investment_board:0 "Junta de investimentos"
 AUH_ww1_inst_investment_board_desc:0 "Crédito e contratos coordenados entre Viena e Budapeste: +2% de capacidade industrial, com +1% de bens de consumo exigidos."
 AUH_ww1_inst_pilot_school:0 "Escola de pilotos"
 AUH_ww1_inst_pilot_school_desc:0 "Um curso regular de pilotagem acelera a formação: +5% de experiência aérea."
 AUH_ww1_inst_sapper_school:0 "Escola de sapadores"
 AUH_ww1_inst_sapper_school_desc:0 "Engenheiros militares preparam melhores posições defensivas: +5% de entrincheiramento máximo, com um pequeno custo civil."
 AUH_ww1_inst_staff_college:0 "Escola de Estado-Maior"
 AUH_ww1_inst_staff_college_desc:0 "Oficiais formados em Viena aprendem mais com a campanha e planejam um pouco mais depressa: +5% de experiência terrestre e +3% de planejamento."
 AUH_ww1_investment_board:0 "Uma junta de investimentos"
 AUH_ww1_investment_board_desc:0 "A junta autoriza projetos limitados; o jogador deverá reservar capacidade civil para executá-los. Efeito imediato: cria a instituição «Junta de investimentos», −20 poder político."
 AUH_ww1_investment_review:0 "Avaliação de investimentos"
 AUH_ww1_isonzo_plan:0 "Planejar a defesa do Isonzo"
 AUH_ww1_isonzo_plan_desc:0 "O setor só recebe preparação se houver guerra com a Itália e se o litoral estiver sob nosso controle. Efeito imediato: +2 experiência terrestre, +10 poder de comando."
 AUH_ww1_italian_consultations:0 "Realizar a consulta adriática"
 AUH_ww1_italian_consultations_desc:0 "Consultas de 60 dias dão 3 de confiança se o pacto com Roma permanece válido; não impedem que a Itália mude de política."
 AUH_ww1_italian_contingency:0 "Preparar uma ruptura com a Itália"
 AUH_ww1_italian_contingency_desc:0 "A preparação só será ativada diante de guerra real, consumindo equipamento de apoio. Efeito imediato: +3 experiência terrestre, +1% apoio à guerra, −1 confiança provincial."
 AUH_ww1_italian_minorities:0 "Direitos das comunidades italianas"
 AUH_ww1_italian_minorities_desc:0 "Direitos civis limitados custam capacidade administrativa e não anulam as reivindicações italianas. Efeito imediato: +2 confiança provincial."
 AUH_ww1_joint_budget:0 "Ratificar o orçamento comum"
 AUH_ww1_joint_budget_desc:0 "Uma repartição negociada reduz o bloqueio orçamentário, sem eliminar a administração duplicada. Efeito imediato: +2 consentimento, −20 poder político."
 AUH_ww1_junior_officers:0 "Oficiais subalternos de carreira"
 AUH_ww1_junior_officers_desc:0 "Um corpo profissional melhora a comunicação e substitui o estágio anterior da reforma. Efeito imediato: +3 experiência terrestre, +1 confiança provincial."
 AUH_ww1_karl_foreign_review:0 "Carlos revisa os objetivos da guerra"
 AUH_ww1_karl_foreign_review_desc:0 "O novo soberano pode limitar objetivos e abrir negociações, pagando um custo de prestígio político."
 AUH_ww1_karl_name:0 "Carlos I"
 AUH_ww1_labour_arbitration:0 "Arbitragem trabalhista"
 AUH_ww1_labour_arbitration_desc:0 "Negociar com trabalhadores reduz o risco administrativo, à custa de uma parcela da produção máxima. Efeito imediato: +3 confiança provincial, +1% estabilidade."
 AUH_ww1_labour_compact:0 "Acordo de arbitragem trabalhista"
 AUH_ww1_labour_compact_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_labour_mediation:0 "Financiar mediação trabalhista"
 AUH_ww1_labour_mediation_desc:0 "A mediação de 90 dias recupera 6 pontos de confiança, custando capacidade civil e influência."
 AUH_ww1_landwehr_course:0 "Curso da Landwehr"
 AUH_ww1_landwehr_course_desc:0 "Um curso de 90 dias ocupa uma fábrica civil, consome 300 rifles e 20 equipamentos de apoio e concede 5 de experiência. Nenhuma divisão ou aeronave é criada."
 AUH_ww1_landwehr_training:0 "Treinamento da Landwehr"
 AUH_ww1_landwehr_training_desc:0 "Formar forças territoriais exige equipamento retirado dos estoques e capacidade civil. Efeito imediato: +3 experiência terrestre, +1 consentimento."
 AUH_ww1_language_rights:0 "Direitos linguísticos civis"
 AUH_ww1_language_rights_desc:0 "Reconhecer idiomas provinciais reforça a confiança local, mas enfrenta quem teme perder influência. Efeito imediato: +1% estabilidade."
 AUH_ww1_languages_reformed:0 "Comunicações militares reformadas"
 AUH_ww1_languages_reformed_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_languages_staff:0 "Um corpo de oficiais comum"
 AUH_ww1_languages_staff_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_languages_trained:0 "Instrutores regimentais"
 AUH_ww1_languages_trained_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_languages_untrained:0 "Comunicações regimentais insuficientes"
 AUH_ww1_languages_untrained_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_logistics_organised:0 "Despacho ferroviário comum"
 AUH_ww1_logistics_organised_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_lohner_workshops:0 "As oficinas Lohner"
 AUH_ww1_lohner_workshops_desc:0 "A pesquisa aeronáutica recebe auxílio limitado; aeronaves modernas continuam sujeitas às datas tecnológicas."
 AUH_ww1_luftfahrtruppen:0 "Organizar as Luftfahrtruppen"
 AUH_ww1_luftfahrtruppen_desc:0 "Uma aviação nascente precisa de formação, equipamento e missões adequadas ao período."
 AUH_ww1_machine_gun_sections:0 "Seções de metralhadoras"
 AUH_ww1_machine_gun_sections_desc:0 "As metralhadoras serão estudadas como equipamento da infantaria, sem bônus geral de ataque."
 AUH_ww1_mannlicher_standards:0 "Padronizar os Mannlicher"
 AUH_ww1_mannlicher_standards_desc:0 "A inspeção de rifles melhora a pesquisa e evita fornecer armamento sem produção."
 AUH_ww1_medical_services:0 "Serviços médicos de campanha"
 AUH_ww1_medical_services_desc:0 "A medicina de campanha reduz vulnerabilidades por meio de companhias pesquisadas e equipadas."
 AUH_ww1_merchant_course:0 "Curso da marinha mercante"
 AUH_ww1_merchant_course_desc:0 "Um curso de 90 dias ocupa uma fábrica civil, consome 0 rifles e 20 equipamentos de apoio e concede 4 de experiência. Nenhuma divisão ou aeronave é criada."
 AUH_ww1_merchant_training:0 "Formação da marinha mercante"
 AUH_ww1_merchant_training_desc:0 "A formação gera experiência naval a um custo civil; os comboios continuam sendo construídos pelo jogador. Efeito imediato: +3 experiência naval, +1 reservas alimentares."
 AUH_ww1_military:0 "Preparação das frentes"
 AUH_ww1_military_desc:0 "Consentimento das administrações: §Y[?auh_ww1_consent|0]/100§!\nConfiança das províncias: §Y[?auh_ww1_cohesion|0]/100§!\nReservas alimentares: §Y[?auh_ww1_provisions|0]/100§!\nObrigações de dívida: §Y[?auh_ww1_debt|0]/6§!\nProjetos civis ativos: §Y[?auh_ww1_projects_active|0]/2§!\n\nA escassez alimentar prejudica a produção. As crises militares existentes continuam respondendo à situação da guerra; não há colapso automático por data."
 AUH_ww1_military_programme:0 "Um programa militar sustentável"
 AUH_ww1_military_programme_desc:0 "A monarquia precisa escolher a prioridade entre equipamento, reservas e coordenação."
 AUH_ww1_mission_carpathians:0 "Manter o setor dos Cárpatos: objetivo"
 AUH_ww1_mission_carpathians_desc:0 "Preparar esta missão custa 40 de influência, 30 de comando, 30 peças de artilharia e 50 equipamentos de apoio. O prazo é de 90 dias. Mantenha o estado 73. A preparação só melhora planejamento ou entrincheiramento em 8%; não concede força de combate. Fracasso reduz apoio à guerra em 2 pontos percentuais e atrasa o planejamento por 45 dias."
 AUH_ww1_mission_galicia:0 "Recuperar a Galícia oriental: objetivo"
