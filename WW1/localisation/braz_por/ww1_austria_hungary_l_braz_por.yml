 ww1_auh.45.t:0 "Uma proposta de Viena"
 ww1_auh.46.a:0 "Autorizar a conferência por 120 dias."
 ww1_auh.46.b:0 "Prosseguir a guerra."
 ww1_auh.46.d:0 "Viena oferece paz sem anexações e pede autorização para uma conferência. A guerra continua enquanto qualquer beligerante recusar. A autorização, se concedida, vence em 120 dias."
 ww1_auh.46.t:0 "Uma proposta de armistício da monarquia"
 ww1_auh.48.a:0 "Financiar a implementação do acordo."
 ww1_auh.48.d:0 "O governo destinatário aceitou nosso canal de negociação. Os compromissos dependem de sua validade diplomática e não garantem o comportamento futuro de outro país."
 ww1_auh.48.t:0 "A proposta foi aceita"
 ww1_auh.49.a:0 "Reavaliar nossa posição."
 ww1_auh.49.d:0 "O governo destinatário não aceitou nossa proposta. A despesa diplomática já foi realizada, e nenhuma garantia ou vantagem de tratado entrou em vigor."
 ww1_auh.49.t:0 "A proposta foi recusada"
 ww1_auh.5.a:0 "Aceitar o custo da negociação."
 ww1_auh.5.d:0 "Uma nova unidade sul-eslava enfrenta oposição em Budapeste e desconfiança local. O projeto precisa de garantias e compensações antes da ratificação."
 ww1_auh.5.t:0 "A proposta de uma terceira Coroa"
 ww1_auh.50.a:0 "Preservar a continuidade dos serviços."
 ww1_auh.50.d:0 "Francisco José morreu. Carlos assume a chefia da monarquia, com a constituição e as dificuldades deixadas pela campanha. Sua ascensão não remove dívida, fome ou crises militares."
 ww1_auh.50.t:0 "A sucessão de Carlos"
 ww1_auh.6.a:0 "Ratificar a carta."
 ww1_auh.6.b:0 "Continuar as negociações."
 ww1_auh.6.d:0 "A terceira Coroa só se torna uma instituição quando as administrações e as províncias aceitam sua carta. Exigimos 45 de consentimento e 50 de confiança."
 ww1_auh.6.t:0 "A votação da carta trialista"
 ww1_auh.7.a:0 "Preparar a convenção."
 ww1_auh.7.d:0 "Reconhecer as províncias como partes do pacto federal altera o equilíbrio entre os governos. A oposição terá de ser vencida por negociação, não por uma proclamação."
 ww1_auh.7.t:0 "Um projeto federal"
 ww1_auh.8.a:0 "Garantir receitas provinciais."
 ww1_auh.8.b:0 "Priorizar os ministérios comuns."
 ww1_auh.8.d:0 "As províncias pedem recursos para serviços próprios; os ministérios comuns pedem receitas estáveis. Nenhuma solução atende plenamente aos dois."
 ww1_auh.8.t:0 "A repartição fiscal federal"
 ww1_auh.9.a:0 "Promulgar a constituição."
 ww1_auh.9.b:0 "Adiar a ratificação."
 ww1_auh.9.d:0 "A constituição exige consentimento de 50 e confiança de 60. A monarquia permanece sob a dinastia, com competências provinciais reconhecidas e custos comuns pactuados."
 ww1_auh.9.t:0 "Ratificar a constituição federal"
