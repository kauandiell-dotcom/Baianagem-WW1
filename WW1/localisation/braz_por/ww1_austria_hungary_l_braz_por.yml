 AUH_ww1_project_vitkovice_desc:0 "Duas fábricas civis por 180 dias desenvolvem quatro unidades de aço na Morávia."
 AUH_ww1_project_workers_housing:0 "Obras de habitação industrial"
 AUH_ww1_project_workers_housing_desc:0 "Dois estabelecimentos civis ficam ocupados por 120 dias. Conclui um nível de infraestrutura; o projeto é cancelado se perdermos a região."
 AUH_ww1_projects:0 "Obras e serviços da monarquia"
 AUH_ww1_projects_desc:0 "Consentimento das administrações: §Y[?auh_ww1_consent|0]/100§!\nConfiança das províncias: §Y[?auh_ww1_cohesion|0]/100§!\nReservas alimentares: §Y[?auh_ww1_provisions|0]/100§!\nObrigações de dívida: §Y[?auh_ww1_debt|0]/6§!\nProjetos civis ativos: §Y[?auh_ww1_projects_active|0]/2§!\n\nA escassez alimentar prejudica a produção. As crises militares existentes continuam respondendo à situação da guerra; não há colapso automático por data."
 AUH_ww1_provincial_council:0 "Conselho civil provincial"
 AUH_ww1_provincial_council_desc:0 "Autonomia administrativa com menor extração de recursos e mais capacidade para serviços locais."
 AUH_ww1_provincial_hearings:0 "Realizar audiências provinciais"
 AUH_ww1_provincial_hearings_desc:0 "Uma audiência de 60 dias aumenta a confiança em 5 pontos ao custo de influência política."
 AUH_ww1_provincial_ombudsman:0 "Uma ouvidoria das províncias"
 AUH_ww1_provincial_ombudsman_desc:0 "Um canal permanente de reclamações reduz a distância entre as administrações e os súditos. Efeito imediato: +3 confiança provincial, +1% estabilidade."
 AUH_ww1_provincial_petitions:0 "Direito de petição provincial"
 AUH_ww1_provincial_petitions_desc:0 "Reconhecer petições compensa parcialmente a exclusão das nacionalidades, ao custo de influência do governo."
 AUH_ww1_przemysl_supply:0 "Abastecer Przemyśl"
 AUH_ww1_przemysl_supply_desc:0 "A fortaleza depende de um corredor de abastecimento preservado; o foco não impede sua queda. Efeito imediato: −15 poder político, +2 experiência terrestre."
 AUH_ww1_public_accounts:0 "Publicar as contas comuns"
 AUH_ww1_public_accounts_desc:0 "Contas transparentes ajudam a negociar novas quotas e limitam a liberdade do executivo."
 AUH_ww1_quota_revision:0 "Revisão das quotas econômicas"
 AUH_ww1_quota_revision_desc:0 "A estabilidade do orçamento custa uma parcela permanente de consumo civil. Efeito imediato: +3 consentimento, −25 poder político."
 AUH_ww1_railway_dispatch:0 "Despacho ferroviário unificado"
 AUH_ww1_railway_dispatch_desc:0 "Horários comuns substituem a improvisação; a redução de consumo de suprimentos permanece limitada. Efeito imediato: +2 reservas alimentares, −15 poder político."
 AUH_ww1_ratify_federation:0 "Apresentar novamente a constituição federal"
 AUH_ww1_ratify_federation_desc:0 "A ratificação exige consentimento de 50 e confiança de 60. A votação poderá ser recusada."
 AUH_ww1_ratify_trialism:0 "Apresentar novamente a carta trialista"
 AUH_ww1_ratify_trialism_desc:0 "Uma nova votação permite ratificar a carta quando o consentimento chegou a 45 e a confiança a 50."
 AUH_ww1_ration_distribution:0 "Reforçar a distribuição de rações"
 AUH_ww1_ration_distribution_desc:0 "Uma fábrica civil por 60 dias melhora a distribuição: +5 reservas. A distribuição equitativa precisa ter sido adotada."
 AUH_ww1_rationing:0 "Distribuição alimentar comum"
 AUH_ww1_rationing_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_reconnaissance_cavalry:0 "Cavalaria de reconhecimento"
 AUH_ww1_reconnaissance_cavalry_desc:0 "A cavalaria conserva uma função de reconhecimento, sem se tornar uma força de ruptura anacrônica."
 AUH_ww1_reconstruction_board:0 "Uma junta de reconstrução"
 AUH_ww1_reconstruction_board_desc:0 "A junta libera projetos territoriais que podem recuperar serviços e ajustar o orçamento da paz. Efeito imediato: +40 poder político, +2 consentimento."
 AUH_ww1_reconstruction_credit:0 "Crédito de reconstrução temporário"
 AUH_ww1_reconstruction_credit_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_refugee_assistance:0 "Financiar assistência aos refugiados"
 AUH_ww1_refugee_assistance_desc:0 "Duas fábricas civis por 90 dias fornecem assistência e recuperam 5 de confiança. Não há recrutamento gratuito de refugiados."
 AUH_ww1_regimental_languages:0 "Instrutores nos idiomas regimentais"
 AUH_ww1_regimental_languages_desc:0 "O treinamento linguístico reduz parte da penalidade inicial de comunicação, com custos institucionais. Efeito imediato: +3 experiência terrestre."
 AUH_ww1_regional_defence:0 "Defesa por setores regionais"
 AUH_ww1_regional_defence_desc:0 "Setores terão preparação temporária e objetivos de controle territorial, com fracasso possível. Efeito imediato: +2 confiança provincial, +2 experiência terrestre."
 AUH_ww1_regional_reconstruction:0 "Reconstrução regional"
 AUH_ww1_regional_reconstruction_desc:0 "A recuperação das regiões exige território mantido e obras civis concluídas. Efeito imediato: +3 confiança provincial, +3 reservas alimentares."
 AUH_ww1_rehabilitation_centres:0 "Centros de reabilitação"
 AUH_ww1_rehabilitation_centres_desc:0 "Reintegrar sobreviventes e feridos é uma obrigação civil, sem bônus militar permanente. Efeito imediato: +3 confiança provincial, +0,5% estabilidade."
 AUH_ww1_renew_albanian_assistance:0 "Reabrir: assistência civil"
 AUH_ww1_renew_albanian_assistance_desc:0 "Após uma recusa, a delegação pode apresentar a proposta novamente. O destinatário mantém o direito de recusar; o envio custa mais 35 de influência."
 AUH_ww1_renew_german_commission:0 "Reabrir: comissão militar conjunta"
 AUH_ww1_renew_german_commission_desc:0 "Após uma recusa, a delegação pode apresentar a proposta novamente. O destinatário mantém o direito de recusar; o envio custa mais 35 de influência."
 AUH_ww1_renew_italian_consultation:0 "Reabrir: consultas adriáticas"
 AUH_ww1_renew_italian_consultation_desc:0 "Após uma recusa, a delegação pode apresentar a proposta novamente. O destinatário mantém o direito de recusar; o envio custa mais 35 de influência."
 AUH_ww1_renew_montenegrin_pact:0 "Reabrir: pacto de não agressão"
 AUH_ww1_renew_montenegrin_pact_desc:0 "Após uma recusa, a delegação pode apresentar a proposta novamente. O destinatário mantém o direito de recusar; o envio custa mais 35 de influência."
 AUH_ww1_renew_romanian_grain:0 "Reabrir: contrato de cereal"
 AUH_ww1_renew_romanian_grain_desc:0 "Após uma recusa, a delegação pode apresentar a proposta novamente. O destinatário mantém o direito de recusar; o envio custa mais 35 de influência."
 AUH_ww1_renew_russian_consultation:0 "Reabrir: consultas diplomáticas"
 AUH_ww1_renew_russian_consultation_desc:0 "Após uma recusa, a delegação pode apresentar a proposta novamente. O destinatário mantém o direito de recusar; o envio custa mais 35 de influência."
 AUH_ww1_renew_serbian_trade:0 "Reabrir: normalização comercial"
 AUH_ww1_renew_serbian_trade_desc:0 "Após uma recusa, a delegação pode apresentar a proposta novamente. O destinatário mantém o direito de recusar; o envio custa mais 35 de influência."
 AUH_ww1_renew_sixtus_channel:0 "Reabrir: mediação pelo canal de Sixtus"
 AUH_ww1_renew_sixtus_channel_desc:0 "Após uma recusa, a delegação pode apresentar a proposta novamente. O destinatário mantém o direito de recusar; o envio custa mais 35 de influência."
 AUH_ww1_renounce_annexations:0 "Renunciar às anexações de guerra"
 AUH_ww1_renounce_annexations_desc:0 "A renúncia ajuda a legitimar a negociação interna, mas reduz o apoio à continuação da guerra."
 AUH_ww1_repay_debt:0 "Amortizar obrigações comuns"
 AUH_ww1_repay_debt_desc:0 "Três fábricas civis por 180 dias e 70 de influência amortizam um nível de dívida. O serviço da dívida diminui conforme os limites mostrados no espírito."
 AUH_ww1_replacement_depots:0 "Depósitos de substituição"
 AUH_ww1_replacement_depots_desc:0 "A reforma final remove a penalidade inicial de comunicação sem transformar o exército em uma força excepcional. Efeito imediato: +2 experiência terrestre, +1 confiança provincial."
 AUH_ww1_replanned_deployment:0 "Mobilização replanejada"
 AUH_ww1_replanned_deployment_desc:0 "Os planos de concentração foram refeitos depois do caso Redl: −6% de planejamento, +4% de velocidade de entrincheiramento."
 AUH_ww1_research_program:0 "Programa de pesquisa da monarquia"
 AUH_ww1_reserve_template:0 "Organização da infantaria de reserva"
 AUH_ww1_reserve_template_desc:0 "A nova organização oferece uma divisão de reserva menor, que o jogador ainda deve recrutar e equipar."
 AUH_ww1_reserve_training:0 "Formar quadros da reserva"
 AUH_ww1_reserve_training_desc:0 "Um curso de 90 dias ocupa uma fábrica civil, consome 400 rifles e 20 equipamentos de apoio e concede 6 de experiência. Nenhuma divisão ou aeronave é criada."
 AUH_ww1_rest_rotation:0 "Organizar descanso e rotação"
 AUH_ww1_rest_rotation_desc:0 "Duas fábricas civis por 60 dias organizam transporte e descanso: +5 confiança, com treinamento mais lento no período."
 AUH_ww1_romanian_grain:0 "Contratos de cereal romeno"
 AUH_ww1_romanian_grain_desc:0 "Compras exigem acordo vigente, paz e capacidade civil para transporte. Efeito imediato: +4 reservas alimentares."
 AUH_ww1_romanian_purchase:0 "Executar o contrato de cereal romeno"
 AUH_ww1_romanian_purchase_desc:0 "Duas fábricas civis por 60 dias acrescentam 8 reservas alimentares. O contrato acaba se houver guerra com a Romênia ou se ela desaparecer."
 AUH_ww1_rome_channel:0 "Conversações com Roma"
 AUH_ww1_rome_channel_desc:0 "Roma poderá aceitar um pacto de consulta ou recusar. O pacto não garante neutralidade eterna."
 AUH_ww1_rotation:0 "Rotação das unidades"
 AUH_ww1_rotation_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_rural_exemptions:0 "Dispensas agrícolas sazonais"
 AUH_ww1_rural_exemptions_desc:0 "Liberar parte dos contingentes para a colheita tem um custo de mobilização temporário. Efeito imediato: +3 reservas alimentares, −1% apoio à guerra."
 AUH_ww1_russian_channel:0 "Um canal diplomático russo"
 AUH_ww1_russian_channel_desc:0 "Um pacto de consulta oferece espaço de negociação pré-guerra, com possibilidade de recusa."
 AUH_ww1_ruthenian_schools:0 "Escolas rutenas"
 AUH_ww1_ruthenian_schools_desc:0 "Financiar serviços em idioma local fortalece a confiança, com custos administrativos reais. Efeito imediato: +3 confiança provincial, −1 consentimento."
 AUH_ww1_sapper_school:0 "A escola de sapadores"
 AUH_ww1_sapper_school_desc:0 "Sapadores precisam de pesquisa e equipamento para apoiar divisões reais. Efeito imediato: cria a instituição «Escola de sapadores»."
 AUH_ww1_sarajevo_services:0 "Serviços públicos em Sarajevo"
 AUH_ww1_sarajevo_services_desc:0 "Investimento civil torna a administração mais presente sem prometer eliminar o nacionalismo. Efeito imediato: +3 confiança provincial, −15 poder político."
 AUH_ww1_seaplane_trials:0 "Ensaios com hidroaviões"
 AUH_ww1_seaplane_trials_desc:0 "A aviação marítima recebe pesquisa adequada ao período, sem porta-aviões modernos."
 AUH_ww1_sector_training:0 "Instrução dos comandos por setor"
 AUH_ww1_seitz_name:0 "Karl Seitz"
 AUH_ww1_serbian_trade:0 "Executar a normalização comercial sérvia"
 AUH_ww1_serbian_trade_desc:0 "Uma fábrica civil por 60 dias organiza compras civis e acrescenta 4 reservas alimentares. A normalização acaba se houver guerra com a Sérvia."
 AUH_ww1_service_allied_liaison:0 "Financiar a ligação com a frente aliada"
 AUH_ww1_service_allied_liaison_desc:0 "O serviço exige 40 de influência, 1 fábrica civil e 90 dias. Seu efeito só chega ao fim do trabalho."
 AUH_ww1_service_artillery_supply:0 "Preparar depósitos de artilharia"
 AUH_ww1_service_artillery_supply_desc:0 "O serviço exige 35 de influência, 1 fábrica civil e 60 dias. Seu efeito só chega ao fim do trabalho. Consome 20 peças de artilharia e 30 equipamentos de apoio na contratação."
 AUH_ww1_service_defensive_sectors:0 "Treinar comandos de defesa por setor"
 AUH_ww1_service_defensive_sectors_desc:0 "O serviço exige 40 de influência, 1 fábrica civil e 90 dias. Seu efeito só chega ao fim do trabalho."
 AUH_ww1_service_eastern_contingency:0 "Ensaiar a contingência oriental"
 AUH_ww1_service_eastern_contingency_desc:0 "O serviço exige 35 de influência, 1 fábrica civil e 60 dias. Seu efeito só chega ao fim do trabalho."
 AUH_ww1_service_economic_coordination:0 "Coordenar as estatísticas comuns"
 AUH_ww1_service_economic_coordination_desc:0 "O serviço exige 35 de influência, 1 fábrica civil e 60 dias. Seu efeito só chega ao fim do trabalho."
 AUH_ww1_service_foreign_programme:0 "Negociar o mandato diplomático comum"
 AUH_ww1_service_foreign_programme_desc:0 "O serviço exige 40 de influência, 0 fábrica civil e 60 dias. Seu efeito só chega ao fim do trabalho."
 AUH_ww1_service_investments:0 "Avaliar os projetos de investimento"
 AUH_ww1_service_investments_desc:0 "O serviço exige 40 de influência, 1 fábrica civil e 90 dias. Seu efeito só chega ao fim do trabalho."
 AUH_ww1_service_italian_contingency:0 "Ensaiar a contingência italiana"
 AUH_ww1_service_italian_contingency_desc:0 "O serviço exige 35 de influência, 1 fábrica civil e 60 dias. Seu efeito só chega ao fim do trabalho."
 AUH_ww1_service_naval_programme:0 "Financiar os quadros do Almirantado"
 AUH_ww1_service_naval_programme_desc:0 "O serviço exige 35 de influência, 1 fábrica civil e 90 dias. Seu efeito só chega ao fim do trabalho."
 AUH_ww1_service_peace_accounts:0 "Auditar o orçamento da paz"
 AUH_ww1_service_peace_accounts_desc:0 "O serviço exige 40 de influência, 1 fábrica civil e 90 dias. Seu efeito só chega ao fim do trabalho."
 AUH_ww1_service_postwar_diplomacy:0 "Organizar a delegação comercial de paz"
 AUH_ww1_service_postwar_diplomacy_desc:0 "O serviço exige 40 de influência, 1 fábrica civil e 90 dias. Seu efeito só chega ao fim do trabalho."
 AUH_ww1_service_reconstruction:0 "Financiar a administração da reconstrução"
 AUH_ww1_service_reconstruction_desc:0 "O serviço exige 40 de influência, 1 fábrica civil e 90 dias. Seu efeito só chega ao fim do trabalho."
 AUH_ww1_shortcut_admiralty_review:0 "Ir para: Marinha"
 AUH_ww1_shortcut_ballhausplatz:0 "Ir para: Diplomacia e alianças"
 AUH_ww1_shortcut_common_army_review:0 "Ir para: Exército e serviço aéreo"
 AUH_ww1_shortcut_crown_council:0 "Ir para: Constituição e terras da Coroa"
 AUH_ww1_shortcut_economic_inventory:0 "Ir para: Economia e infraestrutura"
 AUH_ww1_shortcut_postwar_inventory:0 "Ir para: Pacificação do pós-guerra"
 AUH_ww1_siege_logistics:0 "Logística da artilharia pesada"
 AUH_ww1_siege_logistics_desc:0 "O ganho tecnológico reduz problemas de transporte sem conceder ataque pesado permanente."
 AUH_ww1_siege_school:0 "A escola de artilharia de cerco"
 AUH_ww1_siege_school_desc:0 "A competência dos arsenais sustenta pesquisa; a conquista de fortalezas ainda depende do combate."
 AUH_ww1_silesian_municipalities:0 "As municipalidades da Silésia"
 AUH_ww1_silesian_municipalities_desc:0 "Serviços municipais e receitas locais são negociados sem mudar fronteiras por decreto. Efeito imediato: +2 confiança provincial, +1 consentimento."
 AUH_ww1_sixtus_channel:0 "Abrir o canal de Sixtus"
 AUH_ww1_sixtus_channel_desc:0 "A França pode aceitar ou rejeitar a mediação. Um canal aberto não é uma paz automática."
 AUH_ww1_skoda_contracts:0 "Contratos com a Škoda"
 AUH_ww1_skoda_contracts_desc:0 "A especialização industrial sustenta pesquisa em artilharia, sem aumentar todos os ataques do exército."
 AUH_ww1_slavic_officer_school:0 "Formação de oficiais sul-eslavos"
 AUH_ww1_slavic_officer_school_desc:0 "Abrir o corpo de oficiais melhora o acesso à formação, sem atribuir superioridade de combate por nacionalidade."
 AUH_ww1_slovak_petitions:0 "As petições eslovacas"
 AUH_ww1_slovak_petitions_desc:0 "A negociação provincial enfrenta a concentração de poder na administração húngara. Efeito imediato: +2 confiança provincial, −2 consentimento."
 AUH_ww1_sofia_contacts:0 "Contatos com Sófia"
 AUH_ww1_sound_out_sofia:0 "Sondar Sófia"
 AUH_ww1_sound_out_sofia_desc:0 "Uma missão de 45 dias melhora a opinião búlgara sobre nós, e a Bulgária também passa a ver a monarquia com mais simpatia. Não cria aliança."
 AUH_ww1_staff_college:0 "O colégio de estado-maior"
 AUH_ww1_staff_college_desc:0 "Formação de oficiais produz experiência utilizável na organização das forças. Efeito imediato: cria a instituição «Escola de Estado-Maior»."
 AUH_ww1_staff_priority_review:0 "Reavaliar a prioridade do estado-maior"
 AUH_ww1_staff_priority_review_desc:0 "Reabre a escolha entre preparo defensivo e ofensivo. Os espíritos substituem uns aos outros."
 AUH_ww1_steyr_small_arms:0 "Armas leves de Steyr"
 AUH_ww1_steyr_small_arms_desc:0 "A padronização de armamento melhora a pesquisa sem entregar milhares de rifles gratuitos."
 AUH_ww1_strike_settlement:0 "Acordos para evitar paralisações"
 AUH_ww1_strike_settlement_desc:0 "A mediação oferecerá alívio econômico limitado e condicionado ao apoio das administrações. Efeito imediato: +3 confiança provincial, −15 poder político."
 AUH_ww1_strike_wave:0 "Onda de greves"
 AUH_ww1_strike_wave_desc:0 "Paralisações nas fábricas: −4% de capacidade industrial."
 AUH_ww1_submarine_school:0 "A escola de submarinos"
 AUH_ww1_submarine_school_desc:0 "A formação submarina não cria embarcações ou alcance oceânico impossível."
 AUH_ww1_subsidised_arsenals:0 "Subsídio aos arsenais"
 AUH_ww1_subsidised_arsenals_desc:0 "Encomendas antecipadas aos arsenais: +4% de ganho de eficiência da produção, com +2% de bens de consumo exigidos."
 AUH_ww1_technical_apprentices:0 "Aprendizes técnicos"
 AUH_ww1_technical_apprentices_desc:0 "A formação técnica melhora o estudo da manutenção de equipamento já disponível."
 AUH_ww1_third_crown_charter:0 "A carta da terceira Coroa"
 AUH_ww1_third_crown_charter_desc:0 "O acordo só será ratificado com consentimento suficiente; a recusa mantém a monarquia em negociação."
 AUH_ww1_torpedo_workshop:0 "Oficinas de torpedos"
 AUH_ww1_torpedo_workshop_desc:0 "O torpedo será pesquisado, fabricado e usado pela frota existente."
 AUH_ww1_transport_columns:0 "Colunas de transporte"
 AUH_ww1_transport_columns_desc:0 "Transportes de campanha precisam caber no orçamento de suprimentos."
 AUH_ww1_transylvanian_dialogue:0 "Diálogo com as municipalidades"
 AUH_ww1_transylvanian_dialogue_desc:0 "O diálogo local reforça a administração sem declarar que uma população abandonou sua identidade."
 AUH_ww1_transylvanian_guarantees:0 "Garantias na Transilvânia"
 AUH_ww1_transylvanian_guarantees_desc:0 "Romênios, magiares e saxões disputam influência; o acordo não cria núcleos ou territórios adicionais. Efeito imediato: +2 confiança provincial, −1 consentimento."
 AUH_ww1_trench_rotation:0 "Rotação de unidades nas trincheiras"
 AUH_ww1_trench_rotation_desc:0 "Retirar contingentes para descanso reduz a pressão interna, mas exige tempo e despesas. Efeito imediato: +2 confiança provincial, +1% apoio à guerra."
 AUH_ww1_trentino_council:0 "O conselho do Trentino"
 AUH_ww1_trentino_council_desc:0 "Direitos locais não resolvem o irredentismo, mas tornam a permanência na monarquia menos onerosa. Efeito imediato: +2 confiança provincial, +1 consentimento, −10 poder político."
 AUH_ww1_trialism:0 "Negociar uma terceira Coroa"
 AUH_ww1_trialism_desc:0 "Um reino sul-eslavo altera a relação com Budapeste e exige garantias para sérvios, croatas e bósnios."
 AUH_ww1_trialist_compensation:0 "Compensar a administração húngara"
 AUH_ww1_trialist_compensation_desc:0 "Recuperar apoio em Budapeste exige concessões reais antes de ratificar o novo pacto."
 AUH_ww1_trialist_war_cabinet:0 "O gabinete das três Coroas"
 AUH_ww1_trialist_war_cabinet_desc:0 "A nova Coroa participa da administração da guerra e do custo do recrutamento. Efeito imediato: +2% apoio à guerra, +15 poder político."
 AUH_ww1_trieste_yards:0 "Os estaleiros de Trieste"
 AUH_ww1_trieste_yards_desc:0 "Um estaleiro adicional exige quatro fábricas civis durante um ano; nenhum navio é gratuito. Efeito imediato: −15 poder político, +2 experiência naval."
 AUH_ww1_tyrolean_services:0 "Serviços para o Tirol"
 AUH_ww1_tyrolean_services_desc:0 "A fronteira alpina precisa de administração e transporte, além de símbolos imperiais. Efeito imediato: +2 confiança provincial."
 AUH_ww1_urban_reconstruction:0 "Recuperação das cidades"
 AUH_ww1_urban_reconstruction_desc:0 "As cidades precisam de investimento depois da mobilização prolongada. Efeito imediato: +3 reservas alimentares, +2 consentimento."
 AUH_ww1_veteran_assistance:0 "Organizar assistência aos veteranos"
 AUH_ww1_veteran_assistance_desc:0 "Uma fábrica civil por 90 dias recupera 4 de confiança em paz."
 AUH_ww1_veterans:0 "Pensões dos veteranos"
 AUH_ww1_veterans_desc:0 "Esta instituição aplica os custos e benefícios mostrados abaixo. Reformas da mesma instituição substituem o estágio anterior; despesas de serviços distintos continuam somando."
 AUH_ww1_veterans_pensions:0 "Pensões dos veteranos"
 AUH_ww1_veterans_pensions_desc:0 "As pensões sustentam a confiança, mas permanecem uma despesa do orçamento civil. Efeito imediato: +3 confiança provincial."
 AUH_ww1_veterans_registry:0 "Registro dos veteranos"
 AUH_ww1_veterans_registry_desc:0 "A assistência aos veteranos terá gastos civis regulares, sem devolver todas as baixas ao recrutamento. Efeito imediato: +2 confiança provincial, −10 poder político."
 AUH_ww1_vienna_budapest_rail:0 "A ligação Viena–Budapeste"
 AUH_ww1_vienna_budapest_rail_desc:0 "O eixo ferroviário entre as capitais precisa de obras concluídas para transportar mais carga. Efeito imediato: +2 consentimento, −15 poder político."
 AUH_ww1_vitkovice_steel:0 "Aço de Vítkovice"
 AUH_ww1_vitkovice_steel_desc:0 "Carvão, metalurgia e transporte determinam quanto aço pode chegar aos arsenais. Efeito imediato: um auxílio único de 10% à pesquisa (industry), −1 confiança provincial."
 AUH_ww1_war_staff_review:0 "Revisão do estado-maior em guerra"
 AUH_ww1_war_staff_review_desc:0 "Revisões periódicas permitem mudar a prioridade institucional, pagando novamente pelo preparo. Efeito imediato: +3 experiência terrestre, −20 poder político."
 AUH_ww1_wartime_credit:0 "Limites para o crédito de guerra"
 AUH_ww1_wartime_credit_desc:0 "Uma emissão de dívida exige escolher entre capacidade imediata e pressão fiscal futura."
 AUH_ww1_weiss_csepel:0 "As oficinas de Csepel"
 AUH_ww1_weiss_csepel_desc:0 "A indústria húngara pode sustentar o esforço comum se receber tempo e capital. Efeito imediato: +2 consentimento, +20 poder político."
 AUH_ww1_winter_equipment:0 "Equipamento para o inverno"
 AUH_ww1_winter_equipment_desc:0 "A reserva de inverno exige equipamento de apoio e prepara operações durante um período limitado. Efeito imediato: +1% apoio à guerra, +2 experiência terrestre."
 AUH_ww1_winter_manoeuvres:0 "Realizar manobras de inverno"
 AUH_ww1_winter_manoeuvres_desc:0 "Em paz, uma fábrica civil por 90 dias e 40 equipamentos de apoio financiam manobras: +5 de experiência terrestre e −5% no tempo de treinamento por 120 dias."
 AUH_ww1_winter_stores:0 "Preparar os estoques de inverno"
 AUH_ww1_winter_stores_desc:0 "Sessenta equipamentos de apoio e uma fábrica civil por 60 dias financiam instrução logística: +6 experiência terrestre."
 AUH_ww1_winter_training:0 "Manobras de inverno"
 AUH_ww1_winter_training_desc:0 "Unidades treinadas em campo: −5% no tempo de treinamento do exército, com +1% de bens de consumo exigidos."
 AUH_ww1_women_in_industry:0 "Mulheres na indústria de guerra"
 AUH_ww1_women_in_industry_desc:0 "A contratação precisa de treinamento e proteção laboral; a mão de obra não surge sem custo. Efeito imediato: +15 poder político, −1 confiança provincial."
 AUH_ww1_workers_housing:0 "Moradia dos trabalhadores"
 AUH_ww1_workers_housing_desc:0 "Habitação e serviços em zonas industriais exigem capacidade civil em vez de bônus permanentes ilimitados. Efeito imediato: +3 confiança provincial, −15 poder político."
 AUS_ww1_federal:0 "Monarquia Federal Danubiana"
 AUS_ww1_federal_ADJ:0 "Danubiano"
 AUS_ww1_federal_DEF:0 "Monarquia Federal Danubiana"
 AUS_ww1_republic:0 "República Federal Danubiana"
 AUS_ww1_republic_ADJ:0 "Danubiano"
 AUS_ww1_republic_DEF:0 "República Federal Danubiana"
 AUS_ww1_trialist:0 "Monarquia das Três Coroas"
 AUS_ww1_trialist_ADJ:0 "Danubiano"
 AUS_ww1_trialist_DEF:0 "Monarquia das Três Coroas"
 ww1_auh.1.a:0 "Ouvir as duas delegações."
 ww1_auh.1.b:0 "Convocar representantes provinciais."
 ww1_auh.1.d:0 "A monarquia entra em 1911 com recursos importantes e administrações que disputam suas prioridades. Devemos obter apoio sem prometer que todas as diferenças desaparecerão."
 ww1_auh.1.t:0 "Duas capitais, uma Coroa"
 ww1_auh.10.a:0 "Reunir informações das duas administrações."
 ww1_auh.10.b:0 "Priorizar os serviços de abastecimento."
 ww1_auh.10.d:0 "Indústria e agricultura precisam ser coordenadas sem fingir que o orçamento comum domina todas as decisões de Viena e Budapeste."
 ww1_auh.10.t:0 "Uma economia complementar e dividida"
 ww1_auh.100.a:0 "Aprovar o projeto com concessões a Budapeste."
 ww1_auh.100.b:0 "Pedir à Coroa que imponha o projeto."
 ww1_auh.100.c:0 "Adiar a votação para a sessão seguinte."
 ww1_auh.100.d:0 "Budapeste condiciona o aumento do contingente anual a concessões sobre a língua de comando e o Honvéd. O estado-maior quer o projeto; a delegação húngara quer cobrá-lo."
 ww1_auh.100.t:0 "O projeto do exército e a obstrução húngara"
 ww1_auh.101.a:0 "Mobilizar parcialmente a Bósnia e a Galícia."
 ww1_auh.101.b:0 "Buscar a mediação das grandes potências."
 ww1_auh.101.c:0 "Consultar Berlim sobre o apoio aliado."
 ww1_auh.101.d:0 "Sérvia, Bulgária, Grécia e Montenegro se unem contra o Império Otomano. A monarquia precisa decidir quanto custa demonstrar força na fronteira sul."
 ww1_auh.101.t:0 "A Liga Balcânica mobiliza"
 ww1_auh.102.a:0 "Enviar uma demonstração naval ao Adriático."
 ww1_auh.102.b:0 "Aceitar o compromisso da conferência de Londres."
 ww1_auh.102.c:0 "Enviar um ultimato a Montenegro."
 ww1_auh.102.d:0 "Montenegro cerca Escútari apesar da decisão das potências de criar uma Albânia independente. A monarquia pode demonstrar força no Adriático ou aceitar uma solução de conferência."
 ww1_auh.102.t:0 "A crise de Escútari"
 ww1_auh.103.a:0 "Refazer os planos de mobilização."
 ww1_auh.103.b:0 "Abafar o escândalo e manter os planos."
 ww1_auh.103.d:0 "O coronel Alfred Redl, chefe de contraespionagem, vendia os planos de concentração do exército. Tudo o que o estado-maior sabe sobre a mobilização está comprometido."
 ww1_auh.103.t:0 "O caso Redl"
 ww1_auh.104.a:0 "Estudar as propostas do Belvedere."
 ww1_auh.104.b:0 "Manter o herdeiro à distância."
 ww1_auh.104.d:0 "O arquiduque herdeiro reúne conselheiros que defendem reformas federais e uma monarquia menos dependente de Budapeste. Suas ideias dividem a corte."
 ww1_auh.104.t:0 "O círculo do Belvedere"
 ww1_auh.105.a:0 "Reforçar os Bálcãs com tropas da Galícia."
 ww1_auh.105.b:0 "Trocar o comando e manter a defensiva."
 ww1_auh.105.d:0 "O exército dos Bálcãs recua diante do contra-ataque sérvio e o comando pede reforços. Qualquer reforço virá de outra frente."
 ww1_auh.105.t:0 "Kolubara: a campanha sérvia fracassa"
 ww1_auh.106.a:0 "Ordenar a ofensiva de inverno."
 ww1_auh.106.b:0 "Manter a linha e preparar a rendição da fortaleza."
 ww1_auh.106.d:0 "Przemyśl está cercada e Conrad propõe romper o cerco por uma ofensiva de inverno. Os soldados têm pouca roupa, pouco pão e uma estrada de montanha."
 ww1_auh.106.t:0 "O inverno nos Cárpatos e Przemyśl"
 ww1_auh.107.a:0 "Aceitar a direção alemã da operação."
 ww1_auh.107.b:0 "Exigir participação austro-húngara no comando."
 ww1_auh.107.d:0 "A ofensiva austro-alemã rompe a frente russa. O comando alemão oferece dirigir a operação; aceitar traz vitória rápida, mas também dependência."
 ww1_auh.107.t:0 "Gorlice e Tarnów"
 ww1_auh.108.a:0 "Pedir reforços alemães."
 ww1_auh.108.b:0 "Transferir divisões da frente italiana."
 ww1_auh.108.c:0 "Recuar para a linha dos Cárpatos."
 ww1_auh.108.d:0 "Os russos rompem a frente da Galícia e da Bucovina. As reservas foram enviadas ao Trentino e qualquer solução custará algo em outro lugar."
 ww1_auh.108.t:0 "A ofensiva Brusilov"
 ww1_auh.109.a:0 "Abrir cozinhas municipais."
 ww1_auh.109.b:0 "Requisitar cereal húngaro."
 ww1_auh.109.c:0 "Pedir paciência à população."
 ww1_auh.109.d:0 "As filas diante das padarias crescem a cada semana. A cidade espera que o governo escolha entre cozinhas municipais, requisição ou paciência."
 ww1_auh.109.t:0 "Filas de pão em Viena"
 ww1_auh.11.a:0 "Comprar e compensar os produtores."
 ww1_auh.11.b:0 "Requisitar os estoques."
 ww1_auh.11.d:0 "A comissão alimentar pode negociar compras ou requisitar cereal. A requisição atende à urgência, mas amplia o conflito com a administração húngara."
 ww1_auh.11.t:0 "Quem paga pelo pão?"
 ww1_auh.110.a:0 "Negociar com os conselhos operários."
 ww1_auh.110.b:0 "Reprimir as paralisações."
 ww1_auh.110.d:0 "Centenas de milhares de operários param nas fábricas de Viena, Wiener Neustadt e Budapeste. Pedem pão, paz e representação. O governo pode negociar ou reprimir."
 ww1_auh.110.t:0 "A greve de janeiro"
 ww1_auh.111.a:0 "Abrir conversações sobre autonomia."
 ww1_auh.111.b:0 "Ignorar a declaração."
 ww1_auh.111.d:0 "Deputados tchecos, eslovacos e eslovenos exigem autodeterminação dentro de um Estado democrático. A declaração enfraquece a lealdade do Reichsrat e desafia Budapeste."
 ww1_auh.111.t:0 "A declaração da Epifania"
 ww1_auh.112.a:0 "Investigar as queixas e fazer concessões."
 ww1_auh.112.b:0 "Suprimir o motim e punir os cabeças."
 ww1_auh.112.d:0 "Marinheiros de várias nacionalidades hasteiam a bandeira vermelha nos navios de Cattaro. O motim pede pão, paz e melhor tratamento."
 ww1_auh.112.t:0 "O motim de Cattaro"
 ww1_auh.113.a:0 "Lançar a ofensiva."
 ww1_auh.113.b:0 "Manter a linha e inspecionar as fortificações."
 ww1_auh.113.d:0 "O estado-maior quer uma ofensiva final no Piave antes da colheita italiana e da chegada de mais aliados. Os depósitos estão vazios."
 ww1_auh.113.t:0 "A ofensiva do Piave"
 ww1_auh.114.a:0 "Emitir o manifesto."
 ww1_auh.114.b:0 "Recusar o manifesto."
 ww1_auh.114.d:0 "Carlos pode proclamar uma federação de povos no Império. A medida é tardia, mas ainda muda a relação com as províncias."
 ww1_auh.114.t:0 "O manifesto dos povos"
 ww1_auh.115.a:0 "Armazenar o excedente."
 ww1_auh.115.b:0 "Vender o excedente e levantar crédito."
 ww1_auh.115.c:0 "Reservar grãos para o exército."
 ww1_auh.115.d:0 "Os relatórios dos distritos agrícolas chegam a Viena. O governo precisa decidir se guarda o excedente, vende ou mantém reservas para o exército."
 ww1_auh.115.t:0 "O relatório da colheita"
 ww1_auh.116.a:0 "Fazer concessões orçamentárias."
 ww1_auh.116.b:0 "Aprovar os créditos por decreto de emergência."
 ww1_auh.116.d:0 "As delegações de Viena e Budapeste se reúnem para votar os créditos comuns. A monarquia pode comprar a boa vontade ou governar por decreto."
 ww1_auh.116.t:0 "A sessão das delegações"
 ww1_auh.117.a:0 "Renovar com uma convenção naval."
 ww1_auh.117.b:0 "Renovar sem compromissos adicionais."
 ww1_auh.117.d:0 "Berlim e Roma propõem renovar antecipadamente a Tríplice Aliança. Uma convenção naval amplia a cooperação; um texto simples evita compromissos novos."
 ww1_auh.117.t:0 "A renovação da Tríplice Aliança"
 ww1_auh.118.a:0 "Ampliar os poderes orçamentários da Dieta."
 ww1_auh.118.b:0 "Reforçar a gendarmaria."
 ww1_auh.118.d:0 "O governador informa que a Dieta bósnia é apoiada pela população, mas desconfiada pelos funcionários e pela polícia. A anexação não resolveu as queixas locais."
 ww1_auh.118.t:0 "O relatório do governador da Bósnia"
 ww1_auh.12.a:0 "Negociar as condições de trabalho."
 ww1_auh.12.b:0 "Adotar jornadas de emergência por 90 dias."
 ww1_auh.12.d:0 "Uma emergência pode prolongar jornadas por 90 dias. A alternativa é financiar a negociação e preservar a confiança, com menos produção imediata."
 ww1_auh.12.t:0 "A produção e seus trabalhadores"
 ww1_auh.13.a:0 "Emitir uma série limitada."
 ww1_auh.13.b:0 "Conservar o limite de crédito."
 ww1_auh.13.d:0 "Títulos podem financiar uma expansão industrial temporária de 2,5% por 180 dias, mas o serviço da dívida permanecerá na economia até a amortização."
 ww1_auh.13.t:0 "Uma emissão de crédito"
 ww1_auh.14.a:0 "Auditar a formação dos oficiais."
 ww1_auh.14.b:0 "Consultar os comandos territoriais."
 ww1_auh.14.d:0 "A unidade do exército depende de formação e abastecimento. Problemas de comunicação podem ser reformados; diversidade nacional não significa incapacidade militar."
 ww1_auh.14.t:0 "O exército de várias administrações"
 ww1_auh.15.a:0 "Priorizar a pesquisa dos arsenais."
 ww1_auh.15.b:0 "Priorizar a organização das reservas."
 ww1_auh.15.d:0 "As escolas e os arsenais competem por recursos. Uma prioridade oferece auxílio de pesquisa limitado; outra dá experiência para reorganizar as reservas."
 ww1_auh.15.t:0 "A prioridade do programa militar"
 ww1_auh.16.a:0 "Adotar a escola defensiva."
 ww1_auh.16.b:0 "Adotar a escola ofensiva."
 ww1_auh.16.d:0 "O estado-maior deve escolher uma prioridade. Preparar ofensivas acelera o planejamento e aumenta o consumo de suprimentos. A escola defensiva favorece o entrincheiramento e planeja ofensivas mais lentamente."
 ww1_auh.16.t:0 "A ofensiva e a reserva"
 ww1_auh.17.a:0 "Investir na acomodação."
 ww1_auh.17.b:0 "Sustentar uma postura de pressão."
 ww1_auh.17.d:0 "A posição balcânica da monarquia não garante uma guerra curta. A pressão externa pode ampliar o apoio à guerra, mas custa confiança das províncias."
 ww1_auh.17.t:0 "A política externa e seus limites"
 ww1_auh.18.a:0 "Preparar a administração da sucessão."
 ww1_auh.18.d:0 "A dinastia precisa preparar a continuidade dos serviços comuns. O protocolo não muda a cadeia internacional do atentado de Sarajevo; a sucessão de Carlos ocorrerá após a morte de Francisco José."
 ww1_auh.18.t:0 "A casa imperial e a continuidade"
 ww1_auh.19.a:0 "Preservar o controle de Viena."
 ww1_auh.19.b:0 "Financiar mais cursos conjuntos."
 ww1_auh.19.d:0 "A ligação alemã pode ajudar o estado-maior, mas maior coordenação cobra influência de Viena. A decisão não entrega territórios ou exércitos ao aliado."
 ww1_auh.19.t:0 "Coordenação sem submissão?"
 ww1_auh.2.a:0 "Priorizar o consentimento dos governos."
 ww1_auh.2.b:0 "Priorizar a confiança das províncias."
 ww1_auh.2.d:0 "Revisar o acordo de 1867 oferece caminhos diferentes. Um compromisso orçamentário agrada aos governos; uma consulta provincial dá voz a quem ficou de fora."
 ww1_auh.2.t:0 "Reabrir o compromisso"
 ww1_auh.20.a:0 "Negociar garantias civis."
 ww1_auh.20.b:0 "Impor medidas excepcionais."
 ww1_auh.20.d:0 "A presença imperial pode se apoiar em negociação civil ou em medidas repressivas. Nenhuma alternativa garante impedir atentados internacionais."
 ww1_auh.20.t:0 "Segurança civil na Bósnia"
 ww1_auh.21.a:0 "Preparar uma solução negociada."
 ww1_auh.21.b:0 "Manter os objetivos existentes."
 ww1_auh.21.d:0 "O novo imperador encontra um Estado que precisa sustentar várias frentes e negociar sua continuidade. Limitar objetivos custa apoio à guerra, mas ajuda a confiança interna."
 ww1_auh.21.t:0 "Carlos e os objetivos da guerra"
 ww1_auh.22.a:0 "Estudar os cascos de batalha."
 ww1_auh.22.b:0 "Priorizar navios leves e escolta."
 ww1_auh.22.d:0 "Financiar os grandes cascos e preservar a frota são objetivos diferentes. O programa escolhe uma prioridade de pesquisa limitada, sem criar navios."
 ww1_auh.22.t:0 "Uma marinha para o Adriático"
 ww1_auh.23.a:0 "Priorizar a confiança dos sobreviventes."
 ww1_auh.23.b:0 "Priorizar o acordo entre administrações."
 ww1_auh.23.d:0 "A paz interrompe a emergência militar, mas não apaga a dívida e a necessidade de reintegrar veteranos. Reconstruir serviços exige escolhas orçamentárias."
 ww1_auh.23.t:0 "A paz e suas contas"
 ww1_auh.24.a:0 "Financiar a reintegração civil."
 ww1_auh.24.b:0 "Adotar uma transição mais lenta."
 ww1_auh.24.d:0 "A reintegração tem um custo político e civil. A desmobilização real das divisões permanece nas mãos do jogador; não devolveremos mortos ao recrutamento."
 ww1_auh.24.t:0 "Desmobilizar sem abandonar"
 ww1_auh.25.a:0 "Manter a constituição vigente."
 ww1_auh.25.b:0 "Ampliar o pacto federal."
 ww1_auh.25.d:0 "O Estado pode continuar sob a dinastia ou negociar uma constituição federal. A reforma precisa de consentimento de 50 e confiança de 60, mesmo depois da paz."
 ww1_auh.25.t:0 "O pacto depois da guerra"
 ww1_auh.26.a:0 "Preservar a Coroa e ampliar consultas."
 ww1_auh.26.b:0 "Convocar uma assembleia republicana federal."
 ww1_auh.26.d:0 "Uma assembleia republicana pode substituir a dinastia pela representação parlamentar. Essa alternativa exige paz, confiança provincial de 60 e uma concessão grande às administrações. Uma consulta preserva a monarquia."
 ww1_auh.26.t:0 "Representação vinculante ou consultiva"
 ww1_auh.27.a:0 "Renovar o pacto dos serviços comuns."
 ww1_auh.27.d:0 "O resultado não é uma recompensa de vitória garantida. Manter o Estado exigiu controlar seus territórios e negociar alimentos, orçamento e representação. A continuidade ainda dependerá dessas escolhas."
 ww1_auh.27.t:0 "O futuro do Estado danubiano"
 ww1_auh.28.a:0 "Financiar concessões de emergência."
 ww1_auh.28.b:0 "Manter as atribuições existentes."
 ww1_auh.28.d:0 "A confiança das províncias caiu abaixo de 25. O governo pode financiar uma concessão de emergência ou preservar o orçamento e aceitar a continuação da tensão. O evento não divide o país por data."
 ww1_auh.28.t:0 "O pacto interno está em risco"
 ww1_auh.29.a:0 "Comprar uma reserva de emergência."
 ww1_auh.29.b:0 "Administrar a escassez com os recursos atuais."
 ww1_auh.29.d:0 "As reservas caíram abaixo de 30. As cidades pressionam a produção industrial, e a falta de distribuição prejudica a confiança. Retirar cereal exige manter a região agrícola sob controle."
 ww1_auh.29.t:0 "O pão tornou-se uma urgência"
 ww1_auh.3.a:0 "Firmar o compromisso com Budapeste."
 ww1_auh.3.b:0 "Manter o pacto com consultas provinciais."
 ww1_auh.3.d:0 "Manter o pacto entre Viena e Budapeste evita uma ruptura institucional imediata, mas torna indispensável negociar os serviços comuns."
 ww1_auh.3.t:0 "Renovar o dualismo"
 ww1_auh.30.a:0 "Enviar uma proposta formal."
 ww1_auh.30.b:0 "Conservar os recursos diplomáticos."
 ww1_auh.30.d:0 "A proposta de comissão militar conjunta só existe se o governo destinatário aceitar. Precisamos financiar a delegação e aguardar sua resposta."
 ww1_auh.30.t:0 "Uma proposta, dois governos"
 ww1_auh.31.a:0 "Aceitar a proposta nas condições atuais."
 ww1_auh.31.b:0 "Recusar a proposta."
 ww1_auh.31.d:0 "Viena propõe comissão militar conjunta. Podemos aceitar o canal ou recusar. A aceitação não obriga a entrar em guerras e não muda fronteiras."
 ww1_auh.31.t:0 "Uma proposta de Viena"
 ww1_auh.32.a:0 "Enviar uma proposta formal."
 ww1_auh.32.b:0 "Conservar os recursos diplomáticos."
 ww1_auh.32.d:0 "A proposta de normalização comercial só existe se o governo destinatário aceitar. Precisamos financiar a delegação e aguardar sua resposta."
 ww1_auh.32.t:0 "Uma proposta, dois governos"
 ww1_auh.33.a:0 "Aceitar a proposta nas condições atuais."
 ww1_auh.33.b:0 "Recusar a proposta."
 ww1_auh.33.d:0 "Viena propõe normalização comercial. Podemos aceitar o canal ou recusar. A aceitação não obriga a entrar em guerras e não muda fronteiras."
 ww1_auh.33.t:0 "Uma proposta de Viena"
 ww1_auh.34.a:0 "Enviar uma proposta formal."
 ww1_auh.34.b:0 "Conservar os recursos diplomáticos."
 ww1_auh.34.d:0 "A proposta de assistência civil só existe se o governo destinatário aceitar. Precisamos financiar a delegação e aguardar sua resposta."
 ww1_auh.34.t:0 "Uma proposta, dois governos"
 ww1_auh.35.a:0 "Aceitar a proposta nas condições atuais."
 ww1_auh.35.b:0 "Recusar a proposta."
