l_braz_por:
 SOV_hungry_cities_1:0 "Cidades Famintas"
 SOV_hungry_cities_1_desc:0 "O pão é escasso e caro nas cidades industriais. As filas crescem a cada semana."
 SOV_hungry_cities_2:0 "Fome nas Cidades"
 SOV_hungry_cities_2_desc:0 "A capital e as cidades industriais passam fome. Cada boato de falta de pão lança multidões nas ruas."
 SOV_restless_workers_1:0 "Operários Inquietos"
 SOV_restless_workers_1_desc:0 "Greves e comitês de fábrica se multiplicam. A produção sofre com as paralisações."
 SOV_restless_workers_2:0 "Febre de Greve Geral"
 SOV_restless_workers_2_desc:0 "Bairros inteiros param de trabalhar a um sinal. As autoridades perderam o controle das fábricas."
 SOV_wavering_army_1:0 "Exército Vacilante"
 SOV_wavering_army_1_desc:0 "As deserções crescem e os homens resmungam contra os oficiais e contra a própria guerra."
 SOV_wavering_army_2:0 "Exército à Beira do Motim"
 SOV_wavering_army_2_desc:0 "Regimentos recusam ordens, elegem comitês e abandonam as trincheiras. A frente se desfaz."
 SOV_supreme_command_burden:0 "O Tsar em Mogilev"
 SOV_supreme_command_burden_desc:0 "O Tsar comanda o exército pessoalmente enquanto a capital fica nas mãos da Imperatriz e de seu favorito."
 SOV_refugee_flood:0 "Refugiados nas Estradas"
 SOV_refugee_flood_desc:0 "Milhões de refugiados da Polônia e da Galícia sobrecarregam as ferrovias e o abastecimento do interior."
 SOV_society_mobilised:0 "Sociedade Mobilizada"
 SOV_society_mobilised_desc:0 "Zemstvos, uniões municipais e industriais organizam o abastecimento do exército ao lado do Estado."
 SOV_lena_shadow:0 "A Sombra do Lena"
 SOV_lena_shadow_desc:0 "O massacre nos campos de ouro voltou uma geração de operários contra o regime."
 SOV_separatist_fever:0 "Febre Separatista"
 SOV_separatist_fever_desc:0 "Finlandeses, poloneses, ucranianos, bálticos e caucasianos olham para a independência enquanto o centro se enfraquece."
 SOV_civil_war_exhaustion:0 "Devastada pela Guerra Civil"
 SOV_civil_war_exhaustion_desc:0 "Vermelhos, brancos, verdes e exércitos estrangeiros destruíram ferrovias, minas e colheitas."
 SOV_nep_recovery:0 "Nova Política Econômica"
 SOV_nep_recovery_desc:0 "As requisições cedem lugar a um imposto em espécie e ao pequeno comércio privado. As aldeias respiram."
 SOV_ussr_union:0 "União de Repúblicas Soviéticas"
 SOV_ussr_union_desc:0 "Um tratado federal une as repúblicas soviéticas em um único Estado."
 ww1_russia.200.t:0 "Massacre nas Minas de Ouro do Lena"
 ww1_russia.200.d:0 "Tropas abriram fogo contra mineiros em greve nos campos de ouro do rio Lena, na Sibéria. Centenas estão mortos ou feridos, e a notícia corre por todas as cidades industriais do Império."
 ww1_russia.200.a:0 "As autoridades agiram dentro da lei."
 ww1_russia.200.b:0 "Abrir uma comissão de inquérito."
 ww1_russia.201.t:0 "As Greves de Julho"
 ww1_russia.201.d:0 "Enquanto o presidente francês Poincaré visita a capital, uma onda de greves toma a Fábrica Putilov e os bairros operários. Barricadas sobem em Petersburgo enquanto o Império se aproxima de uma guerra europeia."
 ww1_russia.201.a:0 "Quebrar as greves com a polícia e os cossacos."
 ww1_russia.201.b:0 "Esperar que a guerra una a nação."
 ww1_russia.202.t:0 "O Tsar Assume o Comando Supremo"
 ww1_russia.202.d:0 "Contra o conselho de quase todos os ministros, Nicolau II demite o Grão-Duque Nicolau e assume pessoalmente o comando do exército em Mogilev, deixando o governo da capital à Imperatriz e a Rasputin."
 ww1_russia.202.a:0 "O Tsar comanda pessoalmente."
 ww1_russia.202.b:0 "Persuadi-lo a permanecer na capital."
 ww1_russia.203.t:0 "A Grande Retirada"
 ww1_russia.203.d:0 "A ofensiva de Gorlice-Tarnów expulsou o exército da Galícia e da Polônia. Milhões de refugiados entopem as estradas para o leste, e a falta de projéteis deixa a frente sem canhões."
 ww1_russia.203.a:0 "Terra arrasada e evacuação em massa."
 ww1_russia.203.b:0 "Manter a linha a qualquer custo."
 ww1_russia.203.c:0 "Convocar Zemgor e Comitês de Indústria."
 ww1_russia.204.t:0 "A Duma É Suspensa"
 ww1_russia.204.d:0 "O Bloco Progressista exige um governo que goze da confiança pública. O Tsar responde suspendendo a Duma e mandando os deputados para casa, fechando a última saída legal para a crítica à corte."
 ww1_russia.204.a:0 "Suspender a Duma."
 ww1_russia.204.b:0 "Aceitar um Ministério de Confiança Pública."
 ww1_russia.205.t:0 "O Assassinato de Rasputin"
 ww1_russia.205.d:0 "De madrugada, o príncipe Yusupov e o Grão-Duque Dmitri atraem o starets ao Palácio Yusupov. O favorito da Imperatriz está morto, mas a corte perdeu seu último domínio sobre o Tsar e a nobreza mostrou que agirá sem ele."
 ww1_russia.205.a:0 "A corte finalmente se livrou dele."
 ww1_russia.205.b:0 "Exilar os conspiradores para a frente."
 ww1_russia.206.t:0 "O Exército Vacila"
 ww1_russia.206.d:0 "Relatos da frente falam de deserção, confraternização e soldados que não saúdam mais os oficiais. O estado-maior alerta que os homens estão cansados de uma guerra que não compreendem."
 ww1_russia.206.a:0 "Fuzilar desertores e endurecer a disciplina."
 ww1_russia.206.b:0 "Prometer terra após a vitória."
 ww1_russia.206.c:0 "Revezar divisões para a retaguarda para descanso."
 ww1_russia.207.t:0 "Os Frutos da Reforma Agrária"
 ww1_russia.207.d:0 "Anos de reforma agrária dão frutos: o Banco Camponês de Terras assentou um milhão de famílias em propriedades consolidadas e na Sibéria. Mas as aldeias comunais estão amargas com o fim dos velhos costumes."
 ww1_russia.207.a:0 "Prosseguir com a reforma."
 ww1_russia.207.b:0 "Reduzir o ritmo para acalmar as aldeias."
 ww1_russia.208.t:0 "O Grande Programa Militar"
 ww1_russia.208.d:0 "O Ministério da Guerra apresenta uma vasta expansão do exército e da artilharia a ser concluída até 1917. O Ministério das Finanças adverte que o orçamento não suporta."
 ww1_russia.208.a:0 "Aprovar o programa completo."
 ww1_russia.208.b:0 "Aprovar um programa reduzido."
 ww1_russia.209.t:0 "Filas de Pão em Petrogrado"
 ww1_russia.209.d:0 "A neve e as ferrovias quebradas cortaram as entregas de grãos à capital. Mulheres fazem fila no escuro por pão enquanto o preço da farinha dobra."
 ww1_russia.209.a:0 "Tabelar o preço do pão e racionar a farinha."
 ww1_russia.209.b:0 "Enviar a polícia para dispersar as filas."
 ww1_russia.209.c:0 "Pedir aos Zemstvos que organizem socorro."
 ww1_russia.210.t:0 "A Insurreição de Petrogrado"
 ww1_russia.210.d:0 "Os motins do pão viraram greve geral. Soldados da guarnição da capital receberam ordem de atirar nas multidões, e alguns regimentos se recusam. O Tsar está em Mogilev, e Petrogrado escapa de suas mãos."
 ww1_russia.210.a:0 "Deixar os acontecimentos seguirem seu curso."
 ww1_russia.210.b:0 "Ordenar que a guarnição restabeleça a ordem."
 ww1_russia.213.t:0 "Lênin Retorna a Petrogrado"
 ww1_russia.213.d:0 "Lênin atravessou a Alemanha em um trem lacrado e chega à Estação da Finlândia. Denuncia a guerra e o Governo Provisório e exige todo o poder aos Sovietes."
 ww1_russia.213.a:0 "Descartá-lo como agente alemão."
 ww1_russia.213.b:0 "Prender os líderes bolcheviques."
 ww1_russia.213.c:0 "Oferecer ao Soviete assentos no Gabinete."
 ww1_russia.211.t:0 "O Tsar Abdica"
 ww1_russia.211.d:0 "Diante do motim na capital e do conselho de seus generais, Nicolau II assina a abdicação em um vagão de trem em Pskov. Três séculos de domínio Romanov terminam; a Duma forma um Governo Provisório ao lado do Soviete de Petrogrado."
 ww1_russia.211.a:0 "Um Governo Provisório assume."
 ww1_russia.211.b:0 "O Tsar apela às tropas leais."
 ww1_russia.212.t:0 "Duplo Poder"
 ww1_russia.212.d:0 "Duas autoridades dividem a capital: o Governo Provisório, que tem os ministérios, e o Soviete de Petrogrado, que tem os soldados. A Ordem n. 1 colocou a guarnição sob comitês eleitos."
 ww1_russia.212.a:0 "Governar por meio do Governo Provisório."
 ww1_russia.212.b:0 "Trabalhar com o executivo do Soviete."
 ww1_russia.214.t:0 "As Jornadas de Julho"
 ww1_russia.214.d:0 "Após o fracasso da ofensiva de verão, soldados, marinheiros e operários marcham sobre o Palácio de Táurida exigindo paz e pão. O governo precisa decidir como responder."
 ww1_russia.214.a:0 "Esmagar as manifestações."
 ww1_russia.214.b:0 "Prometer reformas e dialogar."
 ww1_russia.215.t:0 "A Crise Kornilov"
 ww1_russia.215.d:0 "O general Kornilov, comandante em chefe, marcha com tropas para Petrogrado para restaurar a ordem. O governo convoca operários e marinheiros da capital para defender a revolução, armando os bolcheviques no processo. Já não comanda a lealdade de nenhum dos lados."
 ww1_russia.215.a:0 "Prender Kornilov e armar os operários."
 ww1_russia.215.b:0 "Unir-se a Kornilov contra os Sovietes."
 ww1_russia.215.c:0 "Convocar a Constituinte e manter o centro."
 ww1_russia.216.t:0 "A Revolução de Outubro"
 ww1_russia.216.d:0 "Na noite de 25 de outubro, Guardas Vermelhos e marinheiros tomam as pontes, o telégrafo e o Palácio de Inverno. O Governo Provisório é preso, e o Segundo Congresso dos Sovietes entrega o poder a um Conselho de Comissários do Povo sob Lênin."
 ww1_russia.216.a:0 "Todo o poder aos Sovietes!"
 ww1_russia.217.t:0 "Kornilov Toma Petrogrado"
 ww1_russia.217.d:0 "Os cossacos de Kornilov e os batalhões de choque entram em Petrogrado. Os Sovietes são dissolvidos, a pena de morte volta à frente e o Governo Provisório é varrido por um diretório militar."
 ww1_russia.217.a:0 "Uma ditadura militar restabelece a ordem."
 ww1_russia.218.t:0 "Eleições para a Assembleia Constituinte"
 ww1_russia.218.d:0 "A Rússia vota na primeira eleição livre de sua história. Os Socialistas Revolucionários obtêm a pluralidade; os bolcheviques dominam a capital e as guarnições. A Assembleia deve se reunir em Petrogrado."
 ww1_russia.218.a:0 "Convocar a Assembleia como planejado."
 ww1_russia.218.b:0 "Adiá-la até o fim da guerra."
 ww1_russia.219.t:0 "A Assembleia Constituinte se Reúne"
 ww1_russia.219.d:0 "A Assembleia Constituinte se reúne no Palácio de Táurida, guardada por marinheiros armados que não são seus amigos. Seu destino depende de quem comanda a guarnição."
 ww1_russia.219.a:0 "A Assembleia proclama a República Russa."
 ww1_russia.219.b:0 "A Guarda Vermelha dispersa a Assembleia."
 ww1_russia.220.t:0 "Vermelhos e Brancos"
 ww1_russia.220.d:0 "Generais, atamãs cossacos e Socialistas Revolucionários levantam exércitos contra a nova ordem no sul, no Volga e na Sibéria. A Rússia se divide entre vermelhos e brancos, e os Aliados e as Potências Centrais aguardam sua oportunidade."
 ww1_russia.220.a:0 "Às armas!"
 ww1_russia.221.t:0 "A Legião Tcheca se Revolta"
 ww1_russia.221.d:0 "Quarenta mil soldados tchecoslovacos espalhados ao longo da Transiberiana recusam-se a desarmar. Em poucos dias controlam a linha do Volga a Vladivostok e as cidades caem uma após outra."
 ww1_russia.221.a:0 "Tentar desarmar a Legião pela força."
 ww1_russia.221.b:0 "Negociar a passagem para Vladivostok."
 ww1_russia.222.t:0 "Kolchak, Governante Supremo"
 ww1_russia.222.d:0 "O almirante Kolchak toma o poder em Omsk e é proclamado Governante Supremo da Rússia pelos brancos. Com suprimentos aliados às costas, seus exércitos avançam para o oeste pelos Urais."
 ww1_russia.222.a:0 "Enviar as melhores divisões para o leste."
 ww1_russia.222.b:0 "Confiar nos guerrilheiros na retaguarda siberiana."
 ww1_russia.223.t:0 "Wrangel na Crimeia"
 ww1_russia.223.d:0 "O barão Wrangel reorganiza os restos dos exércitos brancos atrás do istmo de Perekop e das fortificações da Crimeia. Se os vermelhos tomarem a península, a guerra civil está ganha."
 ww1_russia.223.a:0 "Assaltar Perekop pelo Sivash congelado."
 ww1_russia.223.b:0 "Oferecer anistia aos oficiais brancos."
 ww1_russia.224.t:0 "A Rebelião de Kronstadt"
 ww1_russia.224.d:0 "Os marinheiros que já foram o orgulho da revolução levantam a bandeira da revolta contra os bolcheviques: sovietes sem comunistas, livre comércio e fim das requisições."
 ww1_russia.224.a:0 "Esmagar os rebeldes pelo gelo."
 ww1_russia.224.b:0 "Abrir negociações com os marinheiros."
 ww1_russia.225.t:0 "A Nova Política Econômica"
 ww1_russia.225.d:0 "Lênin diz ao Congresso do Partido que o campesinato deve poder comerciar. As requisições de grãos são substituídas por um imposto em espécie e pequenas empresas podem ser privadas."
 ww1_russia.225.a:0 "Adotar a Nova Política Econômica."
 ww1_russia.225.b:0 "Manter o Comunismo de Guerra por mais tempo."
 ww1_russia.226.t:0 "O Tratado da União"
 ww1_russia.226.d:0 "Delegados das repúblicas soviéticas russa, transcaucasiana, ucraniana e bielorrussa assinam um tratado de união. Nasce um Estado único, com um só exército, uma só política externa e um só Partido."
 ww1_russia.226.a:0 "Assinar o Tratado da União."
 ww1_russia.227.t:0 "O Destino dos Romanov"
 ww1_russia.227.d:0 "O ex-Tsar e sua família estão presos na Casa Ipatiev, em Ecaterimburgo, enquanto exércitos brancos e a Legião Tcheca se aproximam da cidade. O Soviete dos Urais pergunta o que fazer com os prisioneiros."
 ww1_russia.227.a:0 "O Soviete dos Urais executa a sentença."
 ww1_russia.227.b:0 "Transferi-los a Moscou para julgamento."
 ww1_russia.228.t:0 "O Concílio Panrusso da Igreja"
 ww1_russia.228.d:0 "Pela primeira vez desde Pedro, o Grande, a Igreja Ortodoxa se reúne em concílio e restaura o Patriarcado. A questão de seu lugar na nova Rússia paira no ar."
 ww1_russia.228.a:0 "Apoiar a Igreja como pilar da ordem."
 ww1_russia.228.b:0 "Separar Igreja e Estado."
 ww1_russia.230.t:0 "A Finlândia Exige Independência"
 ww1_russia.230.d:0 "Com o Tsar fora de cena, a Dieta finlandesa declara que os laços da união caíram com o Grão-Duque. Helsinque pede reconhecimento e os campos vermelho e branco finlandeses já se armam."
 ww1_russia.230.a:0 "Reconhecer a independência da Finlândia."
 ww1_russia.230.b:0 "Conceder autonomia como protetorado."
 ww1_russia.230.c:0 "Recusar discutir o assunto."
 ww1_russia.231.t:0 "A Rada Ucraniana"
 ww1_russia.231.d:0 "A Rada Central em Kiev proclama uma República Popular Ucraniana. O trigo do sul, o carvão do Donbas e um quinto da população do império dependem da resposta."
 ww1_russia.231.a:0 "Reconhecer a República Ucraniana."
 ww1_russia.231.b:0 "Oferecer autonomia dentro de uma federação."
 ww1_russia.231.c:0 "Enviar tropas a Kiev."
 ww1_russia.232.t:0 "As Terras Bálticas"
 ww1_russia.232.d:0 "Exércitos alemães estão no Dvina e os conselhos da Estônia, Letônia e Lituânia exigem autodeterminação. Seja qual for a resposta de Petrogrado, Berlim terá seus próprios planos para o Báltico."
 ww1_russia.232.a:0 "Reconhecer os Estados bálticos."
 ww1_russia.232.b:0 "Manter as províncias bálticas."
 ww1_russia.233.t:0 "A Federação Transcaucasiana"
 ww1_russia.233.d:0 "Georgianos, armênios e azeris formam um comissariado transcaucasiano e depois uma federação própria, presos entre os exércitos turcos e a retirada russa."
 ww1_russia.233.a:0 "Reconhecer as repúblicas caucasianas."
 ww1_russia.233.b:0 "Manter o Cáucaso pela força."
 ww1_russia.234.t:0 "A Polônia Ressurge"
 ww1_russia.234.d:0 "O Conselho de Regência em Varsóvia, as declarações aliadas e o colapso dos impérios partilhadores não deixam dúvida: a Polônia será novamente um Estado. A única questão são suas fronteiras."
 ww1_russia.234.a:0 "Reconhecer o Estado polonês."
 ww1_russia.234.b:0 "Manter as províncias do Vístula."
 SOV_imperial_crisis:0 "Gestão da Crise Imperial"
 SOV_imperial_crisis_desc:0 "O Tsar e seus ministros ainda podem conduzir o Império em meio à agitação crescente. Cada medida tem seu preço."
 SOV_civil_war_front:0 "A Frente da Guerra Civil"
 SOV_civil_war_front_desc:0 "Vermelhos e brancos lutam por cada entroncamento ferroviário e celeiro. Mobilização e terror decidem a guerra."
 SOV_dec_convene_duma:0 "Convocar a Duma"
 SOV_dec_convene_duma_desc:0 "Chamar os deputados de volta e ouvir suas queixas. A tensão com a Duma diminui."
 SOV_dec_prorogue_duma:0 "Suspender a Duma"
 SOV_dec_prorogue_duma_desc:0 "Mandar os deputados para casa. A corte ganha espaço para agir, mas a Duma se lembra."
 SOV_dec_fix_bread_prices:0 "Tabelar o Preço do Pão"
 SOV_dec_fix_bread_prices_desc:0 "Fixar preços máximos e racionar a farinha nas grandes cidades. Os padeiros resmungam, mas as filas diminuem."
 SOV_dec_grain_requisition:0 "Requisitar Grãos"
 SOV_dec_grain_requisition_desc:0 "Enviar agentes e soldados às províncias de grãos. As cidades comem, as aldeias fervem."
 SOV_dec_visit_the_front:0 "Visitar a Frente"
 SOV_dec_visit_the_front_desc:0 "O Tsar inspeciona o exército e distribui medalhas. Os homens aplaudem, por enquanto."
 SOV_dec_okhrana_crackdown:0 "Repressão da Okhrana"
 SOV_dec_okhrana_crackdown_desc:0 "Prender agitadores e fechar clubes operários. A calma retorna, à custa da reputação do regime."
 SOV_dec_conciliation_boards:0 "Comissões de Conciliação nas Fábricas"
 SOV_dec_conciliation_boards_desc:0 "Fazer patrões e operários eleitos sentarem juntos para resolver disputas antes que virem greves."
 SOV_dec_field_courts:0 "Cortes Marciais de Campanha"
 SOV_dec_field_courts_desc:0 "Justiça sumária para desertores e agitadores fardados. A ordem é restaurada pelo medo."
 SOV_dec_patriotic_campaign:0 "Campanha Patriótica"
 SOV_dec_patriotic_campaign_desc:0 "Sinos de igreja, cartazes e empréstimos de guerra lembram ao povo por que lutam."
 SOV_dec_mobilise_the_rear:0 "Mobilizar a Retaguarda"
 SOV_dec_mobilise_the_rear_desc:0 "Recrutamentos, batalhões de trabalho e requisições alimentam as frentes da guerra civil."
 SOV_dec_political_commissars:0 "Comissários Políticos"
 SOV_dec_political_commissars_desc:0 "Designar um comissário para cada ex-oficial imperial a fim de garantir sua lealdade."
 SOV_dec_amnesty_officers:0 "Anistia aos Oficiais"
 SOV_dec_amnesty_officers_desc:0 "Perdoar oficiais que mudem de lado. Experiência vale mais que rancores."
 ww1_russia.20.c:0 "Manter o centro e convocar a Constituinte."
 GER_social_peace_frayed:0 "Burgfrieden Esgarçado"
 GER_social_peace_frayed_desc:0 "A trégua entre governo, partidos e sindicatos já não se sustenta. O Reichstag volta a brigar."
 GER_revolutionary_mood:0 "Clima Revolucionário"
 GER_revolutionary_mood_desc:0 "Conselhos operários, marinheiros amotinados e multidões famintas levaram a revolução à beira do Reich."
 GER_zabern_distrust:0 "Desconfiança de Zabern"
 GER_zabern_distrust_desc:0 "Ficou claro que o exército está acima da lei, e os partidos civis não vão esquecer."
 GER_weimar_fragile:0 "República Frágil"
 GER_weimar_fragile_desc:0 "A República nasceu na derrota e tem inimigos à esquerda e à direita."
 GER_hyperinflation:0 "Hiperinflação"
 GER_hyperinflation_desc:0 "Os preços dobram por dia e os salários são pagos duas vezes ao dia. As economias da classe média evaporaram."
 GER_ruhr_passive_resistance:0 "Resistência Passiva no Ruhr"
 GER_ruhr_passive_resistance_desc:0 "Mineiros, ferroviários e funcionários se recusam a trabalhar para os ocupantes. O Estado paga para que fiquem em casa."
 GER_freikorps_menace:0 "Ameaça dos Freikorps"
 GER_freikorps_menace_desc:0 "Veteranos armados estão prontos para defender a República ou derrubá-la, conforme quem pague."
 ww1_germany_events.200.t:0 "A Eleição do Reichstag de 1912"
 ww1_germany_events.200.d:0 "Os social-democratas obtêm mais votos que qualquer outro partido e se tornam o maior grupo do Reichstag. O Imperador e os junkers veem vermelho; o Centro e os Progressistas veem uma maioria para reformas."
 ww1_germany_events.200.a:0 "Aceitar o resultado e cortejar o Centro."
 ww1_germany_events.200.b:0 "Apoiar-se no Bundesrat e no Imperador."
 ww1_germany_events.201.t:0 "O Caso Zabern"
 ww1_germany_events.201.d:0 "Um jovem tenente na Alsácia insulta os moradores, e a guarnição responde aos protestos com prisões. O Reichstag vota pela censura ao Chanceler, mas o Imperador fica ao lado do exército."
 ww1_germany_events.201.a:0 "Apoiar o exército."
 ww1_germany_events.201.b:0 "Censurar os oficiais."
 ww1_germany_events.202.t:0 "Sem Partidos, Só Alemães"
 ww1_germany_events.202.d:0 "No Reichstag, os social-democratas votam os créditos de guerra. O Imperador declara que não conhece mais partidos, apenas alemães. O Burgfrieden é proclamado e a nação vai à guerra em uma onda de entusiasmo."
 ww1_germany_events.202.a:0 "Sem partidos, só alemães!"
 ww1_germany_events.202.b:0 "Manter os social-democratas à distância."
 ww1_germany_events.203.t:0 "Moltke É Demitido"
 ww1_germany_events.203.d:0 "Depois do Marne, o Chefe do Estado-Maior é um homem alquebrado. O Imperador precisa escolher quem conduzirá a guerra no oeste."
 ww1_germany_events.203.a:0 "Falkenhayn assume o Estado-Maior."
 ww1_germany_events.203.b:0 "Manter Moltke no comando."
 ww1_germany_events.204.t:0 "O Lusitania"
 ww1_germany_events.204.d:0 "Um submarino alemão afundou o transatlântico Lusitania com mais de cem americanos a bordo. Washington protesta nos termos mais duros e o Almirantado pede que a campanha continue."
 ww1_germany_events.204.a:0 "Defender a campanha submarina."
 ww1_germany_events.204.b:0 "Restringir os U-boote às regras de cruzador."
 ww1_germany_events.205.t:0 "A Terceira Comissão Suprema"
 ww1_germany_events.205.d:0 "Com Verdun sangrada e a Romênia entrando na guerra, Falkenhayn cai. Hindenburg e Ludendorff assumem o Comando Supremo do Exército e começam a dirigir a economia, a imprensa e o Chanceler."
 ww1_germany_events.205.a:0 "Hindenburg e Ludendorff assumem."
 ww1_germany_events.205.b:0 "Manter o controle civil da guerra."
 ww1_germany_events.206.t:0 "A Greve de Primeiro de Maio de 1916"
 ww1_germany_events.206.d:0 "Karl Liebknecht é preso em uma manifestação de Primeiro de Maio na Potsdamer Platz, e dezenas de milhares de operários berlinenses cruzam os braços em protesto. O próprio Partido Social-Democrata começa a se dividir."
 ww1_germany_events.206.a:0 "Prender os líderes e processá-los."
 ww1_germany_events.206.b:0 "Aguardar e negociar com os sindicatos."
 ww1_germany_events.207.t:0 "O Inverno dos Nabos"
 ww1_germany_events.207.d:0 "A colheita de batatas fracassou e o bloqueio britânico interrompeu as importações. As cidades comem nabos, o mercado negro prospera e o povo culpa o governo por cada prato vazio."
 ww1_germany_events.207.a:0 "Ampliar controles do Gabinete de Alimentos."
 ww1_germany_events.207.b:0 "Servir primeiro o exército."
 ww1_germany_events.207.c:0 "Controle de preços e cozinhas populares."
 ww1_germany_events.208.t:0 "O Telegrama Zimmermann"
 ww1_germany_events.208.d:0 "O Ministério das Relações Exteriores propõe ao México uma aliança contra os Estados Unidos, caso Washington entre na guerra. O telegrama trafega por uma rota que os britânicos leem."
 ww1_germany_events.208.a:0 "Enviar o telegrama."
 ww1_germany_events.208.b:0 "Arquivar o plano."
 ww1_germany_events.209.t:0 "A Resolução de Paz"
 ww1_germany_events.209.d:0 "A maioria do Reichstag, de social-democratas, Centro e Progressistas, pede uma paz sem anexações. O Comando Supremo responde forçando a saída do Chanceler."
 ww1_germany_events.209.a:0 "O Reichstag se declara por uma paz sem anexações."
 ww1_germany_events.209.b:0 "O Comando Supremo ignora a resolução."
 ww1_germany_events.210.t:0 "Um Novo Chanceler"
 ww1_germany_events.210.d:0 "Michaelis durou cem dias. O Centro propõe o idoso conde bávaro Hertling, enquanto os partidos do Reichstag pedem voz na escolha."
 ww1_germany_events.210.a:0 "Nomear o conde Hertling."
 ww1_germany_events.210.b:0 "Nomear ministros parlamentares."
 ww1_germany_events.211.t:0 "Operação Michael"
 ww1_germany_events.211.d:0 "Com o Leste fechado, as divisões do Ostheer se deslocam para o oeste. Ludendorff planeja quebrar os Aliados antes que os americanos cheguem em força."
 ww1_germany_events.211.a:0 "Apostar tudo em um grande golpe."
 ww1_germany_events.211.b:0 "Ofensivas limitadas em uma frente mais estreita."
 ww1_germany_events.212.t:0 "As Greves de Janeiro"
 ww1_germany_events.212.d:0 "Meio milhão de operários cruza os braços em Berlim, Hamburgo e Kiel, exigindo paz sem anexações, comida e o voto. Conselhos operários elegem delegados nas fábricas."
 ww1_germany_events.212.a:0 "Esmagar as greves."
 ww1_germany_events.212.b:0 "Negociar com os líderes social-democratas."
 ww1_germany_events.213.t:0 "As Reformas de Outubro"
 ww1_germany_events.213.d:0 "Com a frente ruindo, Ludendorff exige um armistício e aconselha o governo parlamentar. O príncipe Max de Baden se torna Chanceler com social-democratas no Gabinete, e o Imperador permanece no cargo apenas de nome."
 ww1_germany_events.213.a:0 "Governo parlamentar sob o príncipe Max."
 ww1_germany_events.213.b:0 "Recusar a reforma e lutar até o fim."
 ww1_germany_events.214.t:0 "Motim em Kiel"
 ww1_germany_events.214.d:0 "A Frota de Alto-Mar recebe ordem de sair para uma última batalha. Os foguistas apagam as caldeiras, as tripulações recusam ordens e bandeiras vermelhas sobem nos couraçados. Ao amanhecer, Kiel está nas mãos de marinheiros e conselhos operários."
 ww1_germany_events.214.a:0 "Negociar com os conselhos de marinheiros."
 ww1_germany_events.214.b:0 "Esmagar o motim pela força."
 ww1_germany_events.215.t:0 "A Revolução de Novembro"
 ww1_germany_events.215.d:0 "Em 9 de novembro o príncipe Max entrega a chancelaria a Friedrich Ebert. De uma janela do Reichstag, Scheidemann proclama a República Alemã; do outro lado da cidade, Liebknecht proclama uma República Socialista da sacada do Palácio."
 ww1_germany_events.215.a:0 "Ebert e os social-democratas assumem."
 ww1_germany_events.215.b:0 "Os espartaquistas tomam as ruas."
 ww1_germany_events.216.t:0 "O Kaiser Parte"
 ww1_germany_events.216.d:0 "Guilherme II, que esperava conduzir seu exército de volta para casa, ouve de Hindenburg que as tropas não estão mais com ele. Cruza a fronteira holandesa e a monarquia Hohenzollern chega ao fim."
 ww1_germany_events.216.a:0 "O Imperador parte para o exílio nos Países Baixos."
 ww1_germany_events.217.t:0 "O Pacto Ebert-Groener"
 ww1_germany_events.217.d:0 "O general Groener telefona a Ebert pela linha secreta: o exército servirá ao novo governo se ele mantiver a ordem contra os conselhos. Ebert aceita."
 ww1_germany_events.217.a:0 "Aliar-se ao exército contra os conselhos."
 ww1_germany_events.217.b:0 "Confiar nos conselhos de operários e soldados."
 ww1_germany_events.218.t:0 "A Insurreição Espartaquista"
 ww1_germany_events.218.d:0 "Operários berlinenses ocupam o bairro dos jornais e erguem barricadas. Liebknecht e Luxemburgo convocam uma segunda revolução contra Ebert."
 ww1_germany_events.218.a:0 "Deixar que os Freikorps esmaguem a insurreição."
 ww1_germany_events.218.b:0 "Negociar com os insurgentes."
 ww1_germany_events.219.t:0 "A Assembleia Nacional de Weimar"
 ww1_germany_events.219.d:0 "Longe das barricadas de Berlim, a Assembleia Nacional se reúne na cidade de Goethe e redige uma constituição democrática com um Presidente forte e sufrágio universal para homens e mulheres."
 ww1_germany_events.219.a:0 "Adotar a Constituição de Weimar."
 ww1_germany_events.220.t:0 "O Putsch de Kapp"
 ww1_germany_events.220.d:0 "Brigadas Freikorps marcham sobre Berlim e instalam Wolfgang Kapp como Chanceler. O governo foge, e os sindicatos convocam uma greve geral."
 ww1_germany_events.220.a:0 "A greve geral derrota o putsch."
 ww1_germany_events.220.b:0 "Transigir com os golpistas."
 ww1_germany_events.221.t:0 "O Assassinato de Rathenau"
 ww1_germany_events.221.d:0 "O ministro das Relações Exteriores Walther Rathenau, que negociou Rapallo, é morto a tiros por extremistas nacionalistas. Centenas de milhares marcham em defesa da República."
 ww1_germany_events.221.a:0 "Aprovar a Lei de Proteção da República."
 ww1_germany_events.222.t:0 "A Ocupação do Ruhr"
 ww1_germany_events.222.d:0 "Tropas francesas e belgas ocupam o Ruhr por reparações não pagas. Berlim precisa escolher entre a rendição e uma greve custosa de toda a região."
 ww1_germany_events.222.a:0 "Resistência passiva."
 ww1_germany_events.222.b:0 "Retomar o pagamento das reparações."
 ww1_germany_events.223.t:0 "O Marco Desaba"
 ww1_germany_events.223.d:0 "Um pão custa milhões, os salários são pagos duas vezes ao dia e as economias são aniquiladas. A República não pode imprimir mais dinheiro do que já imprimiu."
 ww1_germany_events.223.a:0 "É preciso encontrar uma nova moeda."
 ww1_germany_events.224.t:0 "A Crise de Natal"
 ww1_germany_events.224.d:0 "A Divisão Naval do Povo ocupa a Chancelaria e mantém um governo refém por salários atrasados. Ebert chama tropas regulares, e os Independentes deixam o governo."
 ww1_germany_events.224.a:0 "Usar tropas regulares."
 ww1_germany_events.224.b:0 "Pagar os marinheiros e fechar acordo."
 ww1_germany_events.225.t:0 "Scapa Flow"
 ww1_germany_events.225.d:0 "Internado em Scapa Flow e informado de que o armistício será prorrogado, o almirante von Reuter ordena que seus navios sejam afundados em vez de divididos entre os Aliados."
 ww1_germany_events.225.a:0 "A frota é afundada."
 ww1_germany_events.230.t:0 "Revolução na Rússia"
 ww1_germany_events.230.d:0 "O Tsar partiu e a Rússia está em convulsão. O Estado-Maior vê uma chance de tirar o inimigo oriental da guerra, e o Ministério das Relações Exteriores tem contatos entre os revolucionários exilados."
 ww1_germany_events.230.a:0 "Facilitar o retorno de Lênin em trem lacrado."
 ww1_germany_events.230.b:0 "Ficar fora da política russa e reforçar a frente."
 ww1_germany_events.231.t:0 "A Oferta Soviética de Armistício"
 ww1_germany_events.231.d:0 "O novo governo bolchevique propõe um armistício imediato em todas as frentes. Hoffmann e Kuhlmann receberão a delegação russa em Brest-Litovsk."
 ww1_germany_events.231.a:0 "Abrir conversações de armistício."
 ww1_germany_events.231.b:0 "Pressionar o avanço na Ucrânia e no Báltico."
 GER_home_front:0 "A Frente Interna"
 GER_home_front_desc:0 "O esforço de guerra do Reich depende do humor das cidades, da lealdade dos social-democratas e da ração de pão."
 GER_dec_war_loans:0 "Campanha de Empréstimos de Guerra"
 GER_dec_war_loans_desc:0 "Cartazes e comícios de bancos pedem a cada cidadão que empreste suas economias ao Reich."
 GER_dec_turnip_relief:0 "Medidas do Escritório de Alimentação"
 GER_dec_turnip_relief_desc:0 "Cartões de racionamento, cozinhas comunitárias e tetos de preços. Ninguém fica satisfeito, mas menos gente passa fome."
 GER_dec_censor_press:0 "Endurecer a Censura"
 GER_dec_censor_press_desc:0 "Confiscar jornais e proibir reuniões de greve. O descontentamento esfria, a confiança no governo não."
 GER_dec_court_the_spd:0 "Cortejar os Social-Democratas"
 GER_dec_court_the_spd_desc:0 "Convidar Ebert e Scheidemann à Chancelaria e prometer reformas após a guerra."
 GER_dec_kaiser_visits_front:0 "O Imperador Visita a Frente"
 GER_dec_kaiser_visits_front_desc:0 "Guilherme aparece de uniforme cinza entre seus soldados. O moral sobe por um tempo."
 GER_dec_eastern_requisition:0 "Requisição no Leste"
 GER_dec_eastern_requisition_desc:0 "Trens de grãos do Ober Ost e da Ucrânia alimentam a frente interna, ao preço do ressentimento local."
 GER_dec_support_republic:0 "Mobilizar pela República"
 GER_dec_support_republic_desc:0 "Comícios de massa e a bandeira preto-vermelho-dourada. A República precisa de defensores entre o povo."
 GER_dec_curb_freikorps:0 "Dissolver os Freikorps"
 GER_dec_curb_freikorps_desc:0 "Incorporar os corpos de voluntários ao pequeno exército regular permitido pelos termos de paz."
 GER_dec_stabilise_mark:0 "Introduzir o Rentenmark"
 GER_dec_stabilise_mark_desc:0 "Uma nova moeda lastreada em terra e indústria detém a queda. Os sacrifícios serão duros."
 side_ww1_ger_rus.50.t:0 "Um Convite para a Internacional Vermelha"
 side_ww1_ger_rus.50.d:0 "A Alemanha revolucionária propõe que as duas repúblicas socialistas se unam em um único bloco contra as potências capitalistas. Os camaradas de Berlim esperam uma resposta."
 side_ww1_ger_rus.50.a:0 "Ingressar na Internacional Vermelha."
 side_ww1_ger_rus.50.b:0 "Recusar por ora."
 side_ww1_ger_rus.51.t:0 "Um Convite para a Liga Continental"
 side_ww1_ger_rus.51.d:0 "Berlim propõe uma liga continental das grandes monarquias contra as potências marítimas. Uma assinatura russa selaria o acordo que Björkö um dia prometeu."
 side_ww1_ger_rus.51.a:0 "Ingressar na Liga Continental."
 side_ww1_ger_rus.51.b:0 "Recusar por ora."
 side_ww1_ger_rus.52.t:0 "A Rússia Ingressa em Nosso Bloco"
 side_ww1_ger_rus.52.d:0 "O governo russo aceitou nosso convite e toma seu lugar ao nosso lado. As potências da Entente foram avisadas de que devem esperar um novo equilíbrio na Europa."
 side_ww1_ger_rus.52.a:0 "Um grande sucesso diplomático."
 side_ww1_ger_rus.55.t:0 "A Rússia Recusa Nosso Bloco"
 side_ww1_ger_rus.55.d:0 "São Petersburgo recusou educadamente ingressar em nosso bloco. A porta não está fechada, mas o momento passou."
 side_ww1_ger_rus.55.a:0 "Tentaremos novamente."
 side_ww1_ger_rus.56.t:0 "A Bulgária Ingressa nas Potências Centrais"
 side_ww1_ger_rus.56.d:0 "Sófia aceitou a proposta alemã e assina a aliança. Os exércitos búlgaros marcharão conosco nos Bálcãs."
 side_ww1_ger_rus.56.a:0 "Bem-vindo, aliado."
 side_ww1_ger_rus.57.t:0 "A Bulgária Recusa"
 side_ww1_ger_rus.57.d:0 "Sófia recusou atrelar seu destino ao nosso. A ferrovia balcânica continua aberta, mas os soldados búlgaros ainda não vestirão nossas cores."
 side_ww1_ger_rus.57.a:0 "Uma pena."
 side_ww1_ger_rus.60.t:0 "A Alemanha Propõe a União"
 side_ww1_ger_rus.60.d:0 "Com a monarquia dos Habsburgo extinta, Berlim oferece à república austríaca a união com a Alemanha. Viena é pobre, faminta e dividida quanto à resposta."
 side_ww1_ger_rus.60.a:0 "Aceitar a união com a Alemanha."
 side_ww1_ger_rus.60.b:0 "Recusar a oferta."
 side_ww1_ger_rus.61.t:0 "A Áustria Ingressa no Reich"
 side_ww1_ger_rus.61.d:0 "A república austríaca aceitou a união. Funcionários alemães chegam a Viena para iniciar o longo trabalho de integração."
 side_ww1_ger_rus.61.a:0 "Um povo, um Estado."
 side_ww1_ger_rus.62.t:0 "A Áustria Recusa a União"
 side_ww1_ger_rus.62.d:0 "Viena recusou nossa oferta de união. A Entente deixou claras suas opiniões, e os partidos austríacos optaram pela cautela."
 side_ww1_ger_rus.62.a:0 "Talvez em outro dia."
SOV_dec_mobilize_vpk_shells:0 "Mobilizar Comitês de Indústria de Guerra (VPK)"
 SOV_dec_mobilize_vpk_shells_desc:0 "Convocar as oficinas metalúrgicas e indústrias privadas de Moscou e dos Urais para converter linhas civis na produção massiva de granadas e munições."
