l_braz_por:
 ENG_agadir_home_fleet_alert:0 "Colocar a Home Fleet em Prontidão de Guerra"
 ENG_agadir_home_fleet_alert_desc:0 "Concentrar os esquadrões de batalha britânicos em Portland e Scapa Flow, deixando evidente que a Marinha Real defenderá as costas francesas e o Canal contra qualquer incursão alemã."
 ENG_agadir_mansion_house_speech:0 "Discurso de Mansion House de Lloyd George"
 ENG_agadir_mansion_house_speech_desc:0 "O Chanceler David Lloyd George pronuncia um discurso enérgico alertando Berlim de que a Grã-Bretanha não permitirá que seus interesses globais vitais sejam desconsiderados por ameaças unilaterais alemãs."
 ENG_agadir_urge_moderation:0 "Recomendar Moderação e Acordo na Entente"
 ENG_agadir_urge_moderation_desc:0 "Aconselhar Paris a buscar uma solução colonial equilibrada, evitando uma conflagração desnecessária por bacias fluviais secundárias na África Ocidental."
 FRA_abattre_la_gueuse:0 "[Alternativo - Monarquista] Abattre la Gueuse"
 FRA_abattre_la_gueuse_desc:0 ""Abaixo a rameira!" A Action Française e os Camelots du Roi organizam comícios multitudinários para sepultar a república corrupta e pavimentar o retorno da dinastia legítima."
 FRA_action_francaise_monarchy:0 "Monarquia Nacionalista Integral"
 FRA_action_francaise_monarchy_desc:0 "O ideário de Charles Maurras funde autoridade dinástica, tradição católica e retidão castrense na construção de um regime imune à fraqueza parlamentar."
 FRA_agadir_caillaux_secret_channel:0 "Canal Diplomático Secreto de Caillaux"
 FRA_agadir_caillaux_secret_channel_desc:0 "O Primeiro-Ministro Joseph Caillaux abre negociações confidenciais diretas com Berlim para alcançar um acordo territorial pragmático, contornando a ingerência dos setores belicistas."
 FRA_agadir_concede_congo_accord:0 "Ratificar o Acordo de Troca Marrocos-Congo"
 FRA_agadir_concede_congo_accord_desc:0 "Celebrar o acordo bilateral que cede partes da África Equatorial Francesa ao Camarões alemão em troca do reconhecimento formal de Berlim ao nosso protetorado no Marrocos."
 FRA_agadir_concede_naval_station:0 "Conceder Estação Naval Carvoeira à Alemanha"
 FRA_agadir_concede_naval_station_desc:0 "Capitular perante as exigências do Kaiser e conceder à Alemanha direitos soberanos de abastecimento naval em Agadir, preservando a frágil paz europeia ao alto custo do prestígio nacional."
 FRA_agadir_delcasse_firm_resolve:0 "Política de Firmeza Inabalável de Delcassé"
 FRA_agadir_delcasse_firm_resolve_desc:0 "O Ministro da Marinha Théophile Delcassé defende resistência intransigente contra a chantagem alemã, mobilizando a opinião pública e coordenando ações de defesa com Londres."
 FRA_agadir_financial_sanctions:0 "Retirar Capital Francês de Berlim"
 FRA_agadir_financial_sanctions_desc:0 "Instruir as instituições financeiras francesas a liquidar empréstimos de curto prazo e resgatar créditos do mercado alemão, provocando uma crise imediata de liquidez na bolsa de valores de Berlim."
 FRA_charbon_et_acier:0 "Carvão e Aço (Combustível e Metalurgia)"
 FRA_charbon_et_acier_famine:0 "Déficit Crítico de Carvão e Aço"
 FRA_charbon_et_acier_famine_desc:0 "Com as jazidas carboníferas do norte sob controle inimigo e os transportes marítimos estrangulados, a carência de combustível asfixia as oficinas bélicas."
 FRA_charbon_et_acier_surplus:0 "Superávit de Carvão e Aço"
 FRA_charbon_et_acier_surplus_desc:0 "A extração interna eficiente e as rotas marítimas aliadas abastecem as siderúrgicas e fábricas de projéteis com ritmo de produção implacável."
 FRA_charles_maurras:0 "Charles Maurras"
 FRA_clemenceau_je_fais_la_guerre:0 "[Histórico] Je Fais la Guerre"
 FRA_clemenceau_je_fais_la_guerre_desc:0 "Empossar Georges Clemenceau na chefia do governo com poderes extraordinários para extirpar o derrotismo, revigorar a oficialidade e buscar incansavelmente a vitória cabal."
 FRA_comite_de_salut_public_1917:0 "[Alternativo - Socialista] Comitê Revolucionário de Salvação Pública"
 FRA_comite_de_salut_public_1917_desc:0 "Retomar as tradições jacobinas de 1793. Investir um Comitê de Salvação Pública para requisitar bens particulares, afastar oficiais reacionários e armar os trabalhadores na defesa da revolução."
 FRA_commune_de_paris_spirit:0 "Espírito da Comuna de Paris"
 FRA_commune_de_paris_spirit_desc:0 "O fervor revolucionário proletário converte o choque entre impérios numa cruzada emancipatória de libertação das classes trabalhadoras."
 FRA_dec_british_channel_coal:0 "Comboios de Carvão Britânico pelo Canal"
 FRA_dec_british_channel_coal_desc:0 "Organizar comboios de mercantes escoltados através do Canal da Mancha para fornecer carvão galês de primeira linha diretamente às usinas siderúrgicas francesas."
 FRA_dec_call_up_class_1917:0 "Convocar a Classe de 1917 (Les Bleuets)"
 FRA_dec_call_up_class_1917_desc:0 "Antecipar a incorporação da classe de jovens conscritos de dezoito anos para reconstituir as divisões desgastadas no fronte, assumindo o doloroso custo humano."
 FRA_dec_colonial_recruitment_tirailleurs:0 "Recrutamento Colonial: Tirailleurs Senegaleses"
 FRA_dec_colonial_recruitment_tirailleurs_desc:0 "Intensificar a conscrição e o alistamento voluntário na África Ocidental Francesa, no Magrebe e na Indochina para incorporar valorosas divisões coloniais no fronte europeu."
 FRA_dec_evacuate_briey_machinery:0 "Evacuar Maquinário Industrial de Briey e Longwy"
 FRA_dec_evacuate_briey_machinery_desc:0 "Remover tornos pesados, forjas mecânicas e trens de laminação da conflagrada bacia mineral do nordeste, transportando-os com rapidez para Lyon."
 FRA_dec_fort_douaumont_reinforcement:0 "Reforçar o Forte Douaumont e Redutos do Mosa"
 FRA_dec_fort_douaumont_reinforcement_desc:0 "Remontar cúpulas de aço temperado, peças de casamata e galerias de concreto subterrâneas em Douaumont, consolidando um bastião inexpugnável diante de Verdun."
 FRA_dec_inter_allied_supreme_war_council:0 "Instituir Conselho Supremo de Guerra Interaliado"
 FRA_dec_inter_allied_supreme_war_council_desc:0 "Constituir em Versalhes um colegiado permanente com líderes da Entente para alinhar planos de campanha e concertar grandes ofensivas no fronte europeu."
 FRA_dec_lyon_chemical_complex:0 "Expandir Complexo Químico e de Pólvoras de Lyon"
 FRA_dec_lyon_chemical_complex_desc:0 "Aportar recursos nas instalações fabris de síntese do vale do Ródano para ampliar expressivamente a fabricação de altos explosivos, nitrocelulose e propelentes."
 FRA_dec_schneider_creusot_heavy_guns:0 "Mobilizar Usinas de Artilharia da Schneider-Creusot"
 FRA_dec_schneider_creusot_heavy_guns_desc:0 "Determinar que as fundições industriais de Le Creusot concentrem os fornos na manufatura de obuseiros pesados e peças sobre trilhos para sobrepujar as fortificações alemãs."
 FRA_dec_union_sacree_cross_party_pact:0 "Pacto Interpartidário da União Sagrada"
 FRA_dec_union_sacree_cross_party_pact_desc:0 "Reunir as lideranças de todas as bancadas no Palais Bourbon para renovar os votos de concórdia nacional e banir as intrigas partidárias até o triunfo final."
 FRA_dec_us_morgan_bank_credit_line:0 "Negociar Linha de Crédito com J.P. Morgan & Co."
 FRA_dec_us_morgan_bank_credit_line_desc:0 "Contratar expressivos empréstimos junto à casa bancária Morgan em Nova York para cobrir fornecimentos cruciais de aço, cobre, nitratos e alimentos norte-americanos."
 FRA_dec_voix_sacree_truck_convoys:0 "Comboios de Caminhões de Emergência da Voie Sacrée"
 FRA_dec_voix_sacree_truck_convoys_desc:0 "Operar um fluxo rodoviário contínuo de milhares de caminhões Berliet pela rota de Bar-le-Duc, conduzindo reposições e projéteis dia e noite para sustentar Verdun."
 FRA_defence_of_verdun:0 "Defesa de Verdun e Linha de Fortalezas"
 FRA_defence_of_verdun_desc:0 "Articulação de reforços táticos, saturação de artilharia e corredores logísticos que sustentam os fortes do Mosa."
 FRA_directoire_militaire_gqg:0 "[Alternativo - Junta Militar] Diretório Militar do GQG"
 FRA_directoire_militaire_gqg_desc:0 "Insatisfeito com as hesitações civis e os entraves da bancada política, o Grand Quartier Général suspende os ritos constitucionais e institui um diretório militar supremo."
 FRA_entente_diplomacy:0 "Diplomacia da Entente e Esforço de Guerra Aliado"
 FRA_entente_diplomacy_desc:0 "Convênios estratégicos, alinhamento de estado-maior e financiamento externo voltados à coesão da coalizão."
 FRA_etat_de_siege_permanent:0 "[Alternativo - Junta Militar] Estado de Sítio Permanente"
 FRA_etat_de_siege_permanent_desc:0 "Estender o estado de sítio por tempo indefinido a todos os departamentos, transferindo portos, malhas ferroviárias, censura e administração a oficiais generais."
 FRA_fernand_loriot:0 "Fernand Loriot"
 FRA_georges_clemenceau:0 "Georges Clemenceau"
 FRA_gqg_military_directory:0 "Diretório Supremo do GQG"
 FRA_gqg_military_directory_desc:0 "Uma junta austera sob a égide do estado-maior condiciona a máquina produtiva e a vida civil aos imperativos irrenunciáveis das operações de campanha."
 FRA_jean_longuet:0 "Jean Longuet"
 FRA_jusqu_au_bout_endsieg:0 "Jusqu'au Bout! (Guerra Total até o Fim)"
 FRA_jusqu_au_bout_endsieg_desc:0 ""Política interna? Eu faço a guerra. Política externa? Eu faço a guerra. O tempo todo, eu faço a guerra!" O Primeiro-Ministro Georges Clemenceau canaliza a energia de toda a França na direção da vitória absoluta."
 FRA_king_jean_iii:0 "Jean III"
 FRA_morocco_treaty_of_fez:0 "Tratado de Fez e Protetorado Marroquino"
 FRA_morocco_treaty_of_fez_desc:0 "A resolução pacífica da Crise de Agadir confirma nosso protetorado soberano sobre o Marrocos, assegurando o domínio francês no noroeste da África."
 FRA_munitionnettes_strike:0 "Greve das Munitionnettes"
 FRA_munitionnettes_strike_desc:0 "As operárias da indústria de armamentos de Paris cruzaram os braços em protesto contra a inflação desmedida, remunerações aviltantes e jornadas estafantes de catorze horas."
 FRA_mutinies_crisis_management:0 "Gestão da Crise dos Motins de 1917"
 FRA_mutinies_crisis_management_desc:0 "Resoluções imediatas de cunho civil e castrense para suplantar o descontentamento fabril, coibir revoltas e resgatar a moral militar."
 FRA_petain_welfare_and_leave_reform:0 "Reformas Assistenciais e de Licenças de Pétain"
 FRA_petain_welfare_and_leave_reform_desc:0 "Cumprir as medidas assistenciais prometidas por Pétain: concessão obrigatória de folgas periódicas, cantonamentos higienizados, comida quente e a suspensão de investidas prematuras até dispor de franca supremacia material."
 FRA_petain_welfare_reforms_unlocked_tt:0 "§GDesbloqueia a decisão de Reformas Assistenciais e de Licenças de Pétain para encerrar a crise dos motins.§!"
 FRA_poilu_morale:0 "Moral dos Poilus"
 FRA_poilu_morale_demoralized:0 "Poilus Desmoralizados"
 FRA_poilu_morale_demoralized_desc:0 "Ofensivas frontais frustradas e as condições desumanas das trincheiras quebraram a disposição de luta da tropa, gerando insubordinação e revolta."
 FRA_poilu_morale_high:0 "Moral Elevado dos Poilus"
 FRA_poilu_morale_high_desc:0 "O combatente francês nas trincheiras enlameadas persevera com bravura indomável, impulsionado por devoção patriótica e certeza na vitória."
 FRA_poilus_reconcilies:0 "Poilus Reconciliados (Reformas de Pétain)"
 FRA_poilus_reconcilies_desc:0 "O General Philippe Pétain recuperou a lealdade das tropas através de medidas atenciosas: concessão de licenças, alimentação quente, repouso adequado e suspensão de ataques frontais temerários."
 FRA_poincare_national_firmness:0 "Política de Firmeza de Poincaré"
 FRA_poincare_national_firmness_desc:0 "Raymond Poincaré imprime determinação intransigente à diplomacia francesa, consolidando a Entente Cordiale e dissuadindo a agressão alemã."
 FRA_republique_des_soviets_de_paris:0 "[Alternativo - Socialista] A República Soviética de Paris"
 FRA_republique_des_soviets_de_paris_desc:0 "Proclamar a Segunda Comuna de Paris! Dissolver o parlamento burguês e transferir as prerrogativas executivas aos conselhos de operários e sovietes de soldados."
 FRA_republique_union_sacree:0 "[Histórico] A República da União Sagrada"
 FRA_republique_union_sacree_desc:0 "Reafirmar a trégua sagrada da Terceira República, congregando todos os franceses sem distinção partidária ou religiosa na salvaguarda da terra natal."
 FRA_reserves_humaines:0 "Reservas Humanas (Mão de Obra Militar)"
 FRA_restauration_orleaniste_jean_iii:0 "[Alternativo - Monarquista] Restauração Orleanista: Rei Jean III"
 FRA_restauration_orleaniste_jean_iii_desc:0 "Entronizar o Duque de Guise como Rei Jean III da França, resgatando a linhagem histórica dos Orléans para erguer uma monarquia de nacionalismo integral e raízes católicas."
 FRA_schneider_creusot_artillery_bonus:0 "Modernização da Artilharia Schneider-Creusot"
 FRA_third_republic_politics:0 "Política da Terceira República"
 FRA_third_republic_politics_desc:0 "Administração de acordos multipartidários, estabilidade de gabinete e articulação entre poder civil e comando militar."
 FRA_trench_mutiny_crisis_2:0 "Motins do Exército Francês de 1917"
 FRA_trench_mutiny_crisis_2_desc:0 "Após a carnificina inglória no Chemin des Dames, ondas de motins explodiram em regimentos inteiros. As tropas rejeitam investidas suicidas, embora permaneçam decididas a defender as linhas francesas."
 FRA_union_sacree_cohesion:0 "Coesão da União Sagrada"
 FRA_union_sacree_fractured:0 "União Sagrada Fraturada"
 FRA_union_sacree_fractured_desc:0 "Atritos partidários, dissidências ideológicas e o cansaço da guerra corroeram o consenso político na Câmara, arriscando paralisar a administração."
 FRA_union_sacree_spirit:0 "Espírito da União Sagrada"
 FRA_union_sacree_spirit_desc:0 "A firmeza da união patriótica que ampara o povo francês contra o invasor, sobrepondo o dever nacional a velhas divisões sectárias."
 FRA_union_sacree_strong:0 "União Sagrada Inabalável"
 FRA_union_sacree_strong_desc:0 "Dos operários socialistas aos nobres monarquistas, todo o espectro político francês adere à trégua sagrada na defesa patriótica irrestrita da República."
 FRA_verdun_mission_timeout_tt:0 "§YA linha fortificada do Mosa resistiu! Verdun permanece inexpugnável! "Ils ne passeront pas!"§!"
 FRA_war_economy_and_munitions:0 "Economia de Guerra e Produção de Munições"
 FRA_war_economy_and_munitions_desc:0 "Coordenação da transferência de parques fabris, fabricação bélica, indústria química e fornecimento de carvão para a condução da guerra total."
 FRA_western_front_operations:0 "Missões Operacionais da Frente Ocidental"
 FRA_western_front_operations_desc:0 "Comandos táticos decisivos, planos de ruptura e posturas defensivas ao longo das trincheiras do fronte ocidental."
 GER_agadir_back_down_gracefully:0 "Retirar o Panther e Desescalar a Crise"
 GER_agadir_back_down_gracefully_desc:0 "Diante do pânico financeiro na Bolsa de Berlim e da mobilização da Marinha Real, um recuo prudente evita uma guerra mundial precipitada antes da conclusão da nossa Frota de Alto-Mar."
 GER_agadir_demand_congo_compensation:0 "Exigir Compensação Territorial de Neukamerun"
 GER_agadir_demand_congo_compensation_desc:0 "Se a França reivindica o Marrocos como esfera exclusiva de influência, a Alemanha deve receber cessões territoriais substanciais na África Equatorial Francesa para expandir Camarões."
 GER_agadir_demand_naval_base:0 "Exigir Base Naval no Atlântico em Agadir"
 GER_agadir_demand_naval_base_desc:0 "Afirmar o direito da Kaiserliche Marine de estabelecer uma base carvoeira fortificada na costa atlântica do Marrocos, assegurando um ponto de apoio estratégico permanente para a Alemanha."
 GER_agadir_send_sms_berlin:0 "Enviar SMS Berlin como Reforço"
 GER_agadir_send_sms_berlin_desc:0 "Reforçar o SMS Panther com o cruzador ligeiro SMS Berlin, demonstrando a determinação inabalável do Império Alemão em respaldar suas exigências diplomáticas com o poder naval."
 ww1_agadir.1.a:0 "A Alemanha exige o seu lugar ao sol!"
 ww1_agadir.1.b:0 "Desautorizar a expedição e preservar a paz"
 ww1_agadir.1.d:0 "Em 1º de julho de 1911, a canhoneira alemã SMS Panther lançou âncora no porto marroquino de Agadir sob a justificativa de proteger comerciantes germânicos. Na verdade, Berlim procura fraturar a Entente Anglo-Francesa e exigir ganhos coloniais substanciais na África. A apreensão toma conta das capitais europeias."
 ww1_agadir.1.t:0 "O Panthersprung: SMS Panther em Agadir"
 ww1_agadir.10.a:0 "A paz foi salvaguardada por meio do compromisso diplomático."
 ww1_agadir.10.d:0 "A diplomacia e o equilíbrio prevaleceram sobre as armas. A França e a Alemanha firmaram o Acordo Franco-Alemão e o Tratado de Fez. A Alemanha reconhece o protetorado francês sobre o Marrocos, enquanto a França transfere 275.000 quilômetros quadrados na África Equatorial ao Camarões alemão (Neukamerun). A crise é superada."
 ww1_agadir.10.t:0 "O Acordo Marrocos-Congo e o Tratado de Fez"
 ww1_agadir.11.a:0 "Uma resolução pacífica e ordenada."
 ww1_agadir.11.d:0 "O tratado diplomático sobre a situação marroquina e a retificação de fronteiras no Congo foi formalmente ratificado pelas nações signatárias."
 ww1_agadir.11.t:0 "Acordo do Marrocos Ratificado"
 ww1_agadir.2.a:0 "A República jamais se curvará a chantagens!"
 ww1_agadir.2.d:0 "A notícia da chegada do Panther em águas marroquinas provocou intensa comoção patriótica em Paris. A imprensa e a Câmara denunciam esse ato descarado de diplomacia de canhoneira como uma violação frontal da Ata de Algeciras."
 ww1_agadir.2.t:0 "Indignação Francesa com a Incursão em Agadir"
 ww1_agadir.20.a:0 "Uma reviravolta sem precedentes no equilíbrio do poder naval."
 ww1_agadir.20.d:0 "Numa rendição diplomática surpreendente, o governo francês cedeu direitos navais soberanos no porto de Agadir ao Império Alemão. A Kaiserliche Marine estabelece uma base fortificada no Atlântico que flanqueia as rotas mercantes britânicas. Setores nacionalistas em Berlim celebram, enquanto Paris afunda em consternação."
 ww1_agadir.20.t:0 "Triunfo Pangermânico: Estação Naval em Agadir"
 ww1_agadir.3.a:0 "A Grã-Bretanha permanece ao lado da França."
 ww1_agadir.3.d:0 "O Gabinete britânico enxerga a presença de um vaso de guerra alemão no litoral atlântico do Marrocos como uma ameaça palpável às rotas vitais do Estreito de Gibraltar. Whitehall manifesta sólida comunhão diplomática com a França."
 ww1_agadir.3.t:0 "Alarme Britânico com as Ambições Navais Alemãs"
 ww1_agadir.30.a:0 "Uma derrota diplomática desmoralizante para Berlim."
 ww1_agadir.30.d:0 "Diante da firme mobilização da frota britânica e de uma grave turbulência nos mercados de capitais em Berlim, o governo alemão determinou a partida do Panther de Agadir sem conquistar nenhuma compensação colonial. A França celebra uma vitória expressiva de dissuasão."
 ww1_agadir.30.t:0 "O Recuo Alemão: Panther Despachado de Volta"
 ww1_agadir.4.a:0 "Rejeitar taxativamente! Nem um centímetro de solo!"
 ww1_agadir.4.b:0 "Ceder para evitar uma guerra imediata"
 ww1_agadir.4.d:0 "O governo alemão apresenta um memorando exigindo a concessão soberana do porto de Agadir para instalar uma estação carvoeira, sob o pretexto de proteger a navegação comercial alemã no Atlântico."
 ww1_agadir.4.t:0 "Exigência Alemã: Base Naval no Atlântico"
 ww1_agadir.40.a:0 "Aux armes, citoyens!"
 ww1_agadir.40.d:0 "A escalada bélica descontrolada, demonstrações de força no mar e ultimatos inflexíveis destruíram a via diplomática europeia. O que começou como uma contenda colonial no Marrocos detonou um confronto colossal entre a Entente e as Potências Centrais. A Grande Guerra irrompeu três anos antes do previsto!"
 ww1_agadir.40.t:0 "A Conflagração Prematura: Guerra Mundial em 1911"
 ww1_agadir.5.a:0 "Abrir negociações diplomáticas sobre as fronteiras coloniais"
 ww1_agadir.5.b:0 "Recusar peremptoriamente a extorsão alemã!"
 ww1_agadir.5.d:0 "Berlim faz saber que as objeções alemãs ao protetorado francês no Marrocos serão retiradas se Paris transferir territórios fluviais expressivos no Congo Francês para expandir o Camarões alemão."
 ww1_agadir.5.t:0 "Berlim Propõe Compensação Territorial em Neukamerun"
 ww1_agadir_crisis:0 "Crise de Agadir de 1911"
 ww1_agadir_crisis_desc:0 "A chegada da canhoneira SMS Panther ao porto marroquino de Agadir desencadeou uma grave confrontação internacional. As potências europeias devem navegar por ultimatos, mobilizações navais e compensações coloniais para impedir uma guerra mundial prematura."
 ww1_agadir_crisis_tension:0 "Tensão da Crise de Agadir"
 ww1_agadir_tension_decrease_tt:0 "§GReduz a Tensão da Crise de Agadir§!"
 ww1_agadir_tension_increase_tt:0 "§RAumenta a Tensão da Crise de Agadir§!"
 ww1_france.210.a:0 "O General Nivelle deve ser exonerado incontinenti!"
 ww1_france.210.d:0 "O sacrifício brutal exigido na ofensiva do General Nivelle ao longo do Chemin des Dames esgotou as forças da infantaria. Motins eclodiram em dezenas de divisões. Cansados da mortandade fútil, os poilus negam-se a marchar contra posições guarnecidas por metralhadoras inimigas intactas."
 ww1_france.210.t:0 "Os Motins do Exército Francês de 1917"
 ww1_france.211.a:0 "Executar as reformas humanitárias e de licenças de Pétain"
 ww1_france.211.b:0 "Recorrer a tribunais militares sumários e pelotões de fuzilamento"
 ww1_france.211.d:0 "Philippe Pétain, o defensor de Verdun, assume o comando supremo dos exércitos franceses. Ele estanca as ofensivas sanguinárias, assegurando aos soldados que esperará a chegada de blindados e contingentes americanos enquanto aperfeiçoa as condições de vida, descanso e licenças da tropa."
 ww1_france.211.t:0 "General Pétain Nomeado Comandante-em-Chefe"
 ww1_france.215.a:0 "Conceder reajustes salariais e benefícios de amparo às operárias"
 ww1_france.215.b:0 "Reprimir as manifestações com contingentes policiais"
 ww1_france.215.d:0 "A escalada dos preços e o rigor da jornada fabril levaram a mão de obra feminina dos arsenais de Paris ao esgotamento. Milhares de mulheres paralisaram a produção bélica exigindo reajustes de subsistência, jornadas humanas e o encerramento do conflito."
 ww1_france.215.t:0 "Greve das Munitionnettes na Capital"
 ww1_france.220.a:0 "Jusqu'au bout! Vitória ou ruína!"
 ww1_france.220.d:0 "Tomando a liderança do governo aos 76 anos de idade, Georges Clemenceau eletriza a Câmara dos Deputados com fervor patriótico inabalável: "Basta de ilusões pacifistas! Nada de propaganda derrotista! Nem traição nem meia traição: guerra! Nada senão a guerra!" O país cerra fileiras com ânimo renovado."
 ww1_france.220.t:0 "Discurso de Clemenceau: "Je Fais la Guerre!""
