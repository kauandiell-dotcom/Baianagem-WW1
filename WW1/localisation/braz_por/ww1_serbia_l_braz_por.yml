l_braz_por:
 SER_agrarian_kingdom_finances:0 "Finanças do Reino Agrário"
 SER_agrarian_kingdom_finances_desc:0 "O Reino da Sérvia apoia-se em uma base predominantemente agrária de pequenos proprietários camponeses. Auditar o crédito rural, estabilizar as reservas de grãos e gerir a receita estatal são passos vitais para erguer as fundações fiscais do reino."
 SER_alexander_i:0 "Príncipe Regente Alexandre"
 SER_allied_balkan_coordination:0 "Coordenação Aliada nos Bálcãs"
 SER_allied_balkan_coordination_desc:0 "Alinhar os planos de ataque diretamente com o General francês Louis Franchet d'Espèrey prepara o Exército Aliado do Oriente para a ofensiva monumental que despedaçará a frente balcânica."
 SER_anticorruption_procurement:0 "Auditoria de Contratos Bélicos"
 SER_anticorruption_procurement_desc:0 "Uma auditoria financeira implacável sobre todos os contratos de intendência assegura que cada dinar investido em fuzis, obuses e mantimentos chegue aos combatentes sem desvios ilícitos."
 SER_appeal_to_tsar_nicholas:0 "Apelo ao Czar Nicolau II"
 SER_appeal_to_tsar_nicholas_desc:0 "O Primeiro-Ministro Pašić envia um telegrama urgente a São Petersburgo, implorando ao Czar que detenha a agressão austro-húngara e se erga como fiador da liberdade sérvia."
 SER_armistice_on_the_danube:0 "Armistício no Danúbio"
 SER_armistice_on_the_danube_desc:0 "Com a rendição da Bulgária e o colapso interno do Império Austro-Húngaro, os emissários imperiais assinam os termos de armistício incondicional nas margens do Danúbio."
 SER_artillery_park_reorganization:0 "Reorganização do Parque de Artilharia"
 SER_artillery_park_reorganization_desc:0 "O Vojvoda Petar Bojović comanda a modernização dos regimentos de artilharia divisionária, unificando a manutenção, padronizando calibres e coordenando as baterias diretamente com a infantaria."
 SER_austrian_border_accommodation:0 "Acomodação de Fronteira com a Áustria"
 SER_austrian_border_accommodation_desc:0 "Explorar uma desescalada bilateral com Viena resolve litígios fronteiriços, patrulhas fluviais e barreiras alfandegárias por vias diplomáticas em vez de provocações."
 SER_balkan_diplomatic_initiatives:0 "Iniciativas Diplomáticas nos Bálcãs"
 SER_balkan_diplomatic_initiatives_desc:0 "Nações menores precisam de diplomacia perspicaz. A Sérvia inicia uma diplomacia proativa pelos Bálcãs para garantir fronteiras seguras, evitar cerco hostil e construir parcerias regionais."
 SER_balkan_equilibrium_accord:0 "Acordo de Equilíbrio Balcânico"
 SER_balkan_equilibrium_accord_desc:0 "Um pacto multilateral entre os Estados balcânicos ergue um duradouro equilíbrio regional, repelindo a interferência e as ambições territoriais das Grandes Potências imperiais."
 SER_banque_franco_serbe_credits:0 "Créditos da Banque Franco-Serbe"
 SER_banque_franco_serbe_credits_desc:0 "Consórcios financeiros franceses via Banque Franco-Serbe aportam capital para ferrovias, estabilização da moeda e desenvolvimento industrial com prazos favoráveis."
 SER_battle_of_cer_heroism:0 "Heroísmo na Batalha de Cer"
 SER_battle_of_cer_heroism_desc:0 "O General Stepa Stepanović lidera o Segundo Exército em um brilhante contra-ataque no Monte Cer, conquistando a primeira grande vitória dos Aliados em toda a Guerra Mundial e repelindo o invasor."
 SER_belgrade_nis_rail_artery:0 "Artéria Ferroviária Belgrado-Niš"
 SER_belgrade_nis_rail_artery_desc:0 "A linha férrea de via única ligando Belgrado a Niš constitui o sistema circulatório vital do reino sérvio. Modernizar os trilhos, ampliar desvios e aperfeiçoar a sinalização acelerará o comércio interno e os planos de mobilização."
 SER_black_hand_and_national_defense:0 "A Mão Negra e a Defesa Nacional"
 SER_black_hand_and_national_defense_desc:0 "A política interna em Belgrado é assombrada pela sombra de conspiradores fardados. Monitorar sociedades secretas, colher inteligência além-fronteira e vigiar as passagens fluviais é vital para a estabilidade do Estado."
 SER_bor_copper_and_rudnik_mines:0 "Minas de Cobre de Bor e Rudnik"
 SER_bor_copper_and_rudnik_mines_desc:0 "As ricas jazidas de cobre em Bor e as veias de chumbo e prata do Monte Rudnik oferecem recursos estratégicos essenciais. Expandir a extração e o refino doméstico reduz a dependência de dispendiosas importações externas."
 SER_breakthrough_at_dobro_pole:0 "A Ruptura de Dobro Pole"
 SER_breakthrough_at_dobro_pole_desc:0 "Em setembro de 1918, a infantaria sérvia escala os penhascos de Dobro Pole e Veternik sob fogo inimigo, estraçalha as trincheiras búlgaras e abre uma brecha fulminante na frente balcânica."
 SER_bulgarian_non_aggression_pact:0 "Pacto de Não-Agressão com a Bulgária"
 SER_bulgarian_non_aggression_pact_desc:0 "Assinar um tratado de não-agressão e consulta recíproca com a Bulgária blinda o flanco oriental sérvio, frustrando as tentativas de Viena de cercar Belgrado diplomaticamente."
 SER_cer_counterstroke_glory:0 "Glória do Contra-Ataque de Cer"
 SER_cer_counterstroke_glory_desc:0 "O espírito vitorioso do triunfo no Monte Cer inflama cada batalhão sérvio, inspirando bravura estoica, disciplina defensiva e repulsa a qualquer avanço inimigo."
 SER_cetinje_military_convention:0 "Convenção Militar de Cetinje"
 SER_cetinje_military_convention_desc:0 "Firmar um acordo de coordenação militar conjunta com Cetinje une a defesa dos dois reinos irmãos, respeitando integralmente a dignidade e soberania do povo montenegrino."
 SER_civil_military_rivalry:0 "Rivalidade Civil-Militar"
 SER_civil_military_rivalry_desc:0 "A amarga fricção entre o gabinete civil de Nikola Pašić e os oficiais conspiratórios da Mão Negra atrapalha a coesão governamental e gera constante atrito político."
 SER_civilian_supremacy_charter:0 "Carta da Supremacia Civil"
 SER_civilian_supremacy_charter_desc:0 "O Primeiro-Ministro Pašić e o Parlamento proclamam a soberania constitucional irrestrita sobre as forças armadas, subordinando generais e oficiais às leis votadas pelos representantes civis."
 SER_civilian_supremacy_established:0 "Supremacia Civil Estabelecida"
 SER_civilian_supremacy_established_desc:0 "A democracia constitucional reina soberana em Belgrado. O Parlamento exerce autoridade incontestada sobre despesas militares e o rumo do Estado, garantindo estabilidade e legalidade."
 SER_clandestine_national_action:0 "Ação Nacional Clandestina"
 SER_clandestine_national_action_desc:0 "Autorizar operações secretas além das fronteiras permite que correios de inteligência e guerrilheiros komitadji protejam compatriotas sob o jugo de impérios estrangeiros."
 SER_constitutional_liberties_bill:0 "Lei de Garantias Constitucionais"
 SER_constitutional_liberties_bill_desc:0 "Proteger a liberdade de imprensa, a autonomia dos tribunais e o direito de reunião pacífica consagra a Sérvia como o farol da liberdade e cidadania entre os povos sul-eslavos."
 SER_corfu_declaration_accord:0 "A Declaração de Corfu"
 SER_corfu_declaration_accord_desc:0 "Em 20 de julho de 1917, Nikola Pašić e Ante Trumbić do Comitê Iugoslavo assinam a histórica Declaração de Corfu, proclamando a união fraterna dos sérvios, croatas e eslovenos sob a dinastia Karađorđević."
 SER_creusot_schneider_contracts:0 "Contratos Schneider-Creusot de Artilharia"
 SER_creusot_schneider_contracts_desc:0 "Adquirir modernos canhões de tiro rápido 75mm da firma francesa Schneider-Creusot dota as baterias sérvias de poder de fogo de classe mundial, equilibrando forças contra os grandes exércitos imperiais."
 SER_crown_prince_regency_prep:0 "Ascendência do Príncipe Herdeiro Alexandre"
 SER_crown_prince_regency_prep_desc:0 "Com a saúde do idoso Rei Pedro fragilizada, o Príncipe Alexandre assume crescentes responsabilidades executivas, cultivando laços diretos com a oficialidade militar e líderes parlamentares."
 SER_curb_secret_societies:0 "Conter Sociedades Secretas"
 SER_curb_secret_societies_desc:0 "Aprovar penalidades rigorosas contra células políticas clandestinas no exército quebra a influência oculta da Mão Negra, garantindo que as Forças Armadas sirvam unicamente à Constituição."
 SER_danubian_flotilla_watch:0 "Vigília Fluvial do Danúbio e Sava"
 SER_danubian_flotilla_watch_desc:0 "Belgrado repousa sob a mira direta dos canhões austro-húngaros na confluência do Danúbio e Sava. Instalar baterias costeiras móveis e postos de observação protege a capital de surpresas fluviais."
 SER_defend_belgrade_perimeter:0 "Defender o Perímetro de Belgrado"
 SER_defend_belgrade_perimeter_desc:0 "Os ministérios evacuam para Niš enquanto destacamentos de retaguarda e baterias de artilharia defendem as margens fluviais, barrando a travessia de canhoneiras inimigas pelo Sava e Danúbio."
 SER_diplomatic_appeal_corfu:0 "Apelo Diplomático e Financeiro de Corfu"
 SER_diplomatic_appeal_corfu_desc:0 "Lançar uma campanha de imprensa e diplomacia em Paris e Londres em defesa da Sérvia ocupada."
 SER_diversified_national_industry:0 "Indústria Nacional Diversificada"
 SER_diversified_national_industry_desc:0 "Com investimentos públicos consistentes, modernização agrária e expansão fabril em Kragujevac, a Sérvia supera seu arcaico isolamento, erguendo uma economia nacional resiliente e diversificada."
 SER_dobro_pole_breakthrough:0 "Carga da Ruptura de Dobro Pole"
 SER_dobro_pole_breakthrough_desc:0 "Movidos pela ânsia sagrada de libertar seus lares ocupados, as colunas sérvias atacam com velocidade e fúria indomáveis, rompendo qualquer barreira fortificada."
 SER_domestic_ammunition_lines:0 "Linhas Autônomas de Munição"
 SER_domestic_ammunition_lines_desc:0 "Uma nação cercada por adversários potenciais não pode depender de cartuchos que não produz. Instalar prensas modernas para munição 7x57mm Mauser garante autonomia militar plena nos momentos de crise."
 SER_drina_defensive_survey:0 "Reconhecimento Defensivo do Drina"
 SER_drina_defensive_survey_desc:0 "As curvas sinuosas e escarpas íngremes do Rio Drina formam um bastião natural contra invasões vindas da Bósnia. Mapear travessias e fortificar gargantas prepara o terreno para defesas inexpugnáveis."
 SER_drina_railway_ammunition_priority:0 "Prioridade Ferroviária de Munição para a Frente"
 SER_drina_railway_ammunition_priority_desc:0 "Requisitar composições ferroviárias civis para despachar munição de artilharia urgente às baterias da frente."
 SER_drina_valley_ambush_lines:0 "Linhas de Emboscada no Vale do Drina"
 SER_drina_valley_ambush_lines_desc:0 "Sabendo que os exércitos de Potiorek atravessarão o Rio Drina, os corpos de montanha sérvios preparam zonas de fogo cruzado mortíferas nas colinas arborizadas e gargantas estreitas."
 SER_entente_diplomatic_shield:0 "Escudo Diplomático da Entente"
 SER_entente_diplomatic_shield_desc:0 "Com garantias diplomáticas formais de Petrogrado e Paris, a Sérvia ancora sua sobrevivência sob o abrigo da Tríplice Entente, dissuadindo agressões unilaterais."
 SER_entrenchment_and_counterstroke:0 "Entrincheiramento e Contra-Golpe"
 SER_entrenchment_and_counterstroke_desc:0 "O Vojvoda Živojin Mišić prega a doutrina da defesa ativa: absorver os golpes inimigos em posições fortificadas, poupar reservas operacionais e desfechar contra-ataques devastadores no momento exato de exaustão do invasor."
 SER_evacuation_of_military_cadres:0 "Evacuação dos Quadros Militares"
 SER_evacuation_of_military_cadres_desc:0 "Esquadras aliadas resgatam os remanescentes famintos e congelados do exército sérvio no litoral do Adriático, transportando os sobreviventes para a segurança da ilha grega de Corfu."
 SER_expand_livestock_and_grain_trade:0 "Expandir o Comércio de Gado e Cereais"
 SER_expand_livestock_and_grain_trade_desc:0 "Superando os bloqueios tarifários da recente Guerra dos Suínos com Viena, a Sérvia precisa diversificar seus canais comerciais, ampliando as exportações de gado e cereais através de Salônica, Romênia e mercados ocidentais."
 SER_face_austrian_ultimatum:0 "Enfrentar o Ultimato Austríaco"
 SER_face_austrian_ultimatum_desc:0 "Em 23 de julho de 1914, o Barão Giesl entrega o humilhante ultimato de 48 horas de Viena. A Sérvia redige uma resposta magistral e conciliadora, aceitando quase tudo sem ceder sua soberania."
 SER_field_medical_directorate:0 "Diretoria Médica de Campanha"
 SER_field_medical_directorate_desc:0 "Nas guerras balcânicas, doenças e infecções ceifam mais vidas que o fogo inimigo. Organizar postos médicos de triagem, enfermarias estéreis e quarentenas rigorosas preserva a juventude da nação."
 SER_foreign_medical_missions:0 "Missões Médicas Estrangeiras"
 SER_foreign_medical_missions_desc:0 "Acolher unidades hospitalares voluntárias, médicos e enfermeiras da Grã-Bretanha, França, Rússia e Suíça traz medicina avançada e solidariedade internacional às frentes de combate sérvias."
 SER_french_chauchats_and_75mm:0 "Fuzis-Metralhadoras e Canhões Franceses"
 SER_french_chauchats_and_75mm_desc:0 "Equipar a infantaria sérvia com capacetes Adrian, fuzis-metralhadoras Chauchat e novas baterias francesas de 75mm transforma a força reconstituída em uma máquina ofensiva letal."
 SER_french_logistical_coordination:0 "Coordenação com a Intendência Francesa"
 SER_french_logistical_coordination_desc:0 "Alinhar manifestos de carga com o exército francês do Oriente para receber fuzis, uniformes e calçados novos."
 SER_french_serbian_trade_accord:0 "Acordo Comercial Franco-Sérvio"
 SER_french_serbian_trade_accord_desc:0 "Respaldada por créditos e tratados comerciais com a França, a Sérvia obtém armamentos modernos e investimentos fundamentais para seu desenvolvimento."
 SER_general_mobilization_order:0 "Ordem de Mobilização Geral"
 SER_general_mobilization_order_desc:0 "Com a ruptura diplomática iminente, o decreto real é promulgado: todos os três Pozivs são mobilizados. Os camponeses largam os arados e marcham para os quartéis por todo o reino."
 SER_government_in_exile_corfu:0 "Governo no Exílio em Corfu"
 SER_government_in_exile_corfu_desc:0 "A Skupština sérvia reúne-se no teatro municipal de Corfu. Embora a pátria esteja ocupada, o Estado sérvio permanece vivo, soberano e internacionalmente reconhecido."
 SER_greater_serbia_ideal:0 "Ideal da Grande Sérvia"
 SER_greater_serbia_ideal_desc:0 "Priorizar a união e libertação das terras etnicamente sérvias inflama a combatividade e concentra todas as energias do reino na defesa de sua gente."
 SER_greater_serbian_strategy:0 "Estratégia da Grande Sérvia"
 SER_greater_serbian_strategy_desc:0 "Concentrando esforços na consolidação nacional estrita, Belgrado prioriza libertar e reunir os territórios com populações historicamente sérvias sob a coroa real."
 SER_greek_commercial_transit:0 "Trânsito Comercial por Salônica"
 SER_greek_commercial_transit_desc:0 "Negociar a passagem livre de tarifas pelo estratégico porto de Salônica garante à Sérvia, privada de mar, um corredor comercial indispensável para o resto do planeta."
 SER_independent_radicals_dialogue:0 "Diálogo com os Radicais Independentes"
 SER_independent_radicals_dialogue_desc:0 "Dialogar com a oposição liberal dos Radicais Independentes, liderada por Ljubomir Stojanović, forja um amplo consenso democrático na Skupština, garantindo estabilidade política em tempos perigosos."
 SER_infiltrate_bosnian_intelligence_network:0 "Infiltrar Redes de Inteligência no Drina"
 SER_infiltrate_bosnian_intelligence_network_desc:0 "Expandir postos secretos de observação além-fronteira para detectar precocemente movimentações de tropas imperiais."
 SER_internal_inquiry_on_conspirators:0 "Inquérito Interno sobre Conspiradores"
 SER_internal_inquiry_on_conspirators_desc:0 "O governo Pašić abre um inquérito oficial imediato para apurar se oficiais dissidentes ou agentes de fronteira ajudaram os conspiradores de Sarajevo sem autorização estatal."
 SER_investigate_officer_conspiracies:0 "Investigar Conspirações de Oficiais"
 SER_investigate_officer_conspiracies_desc:0 "Relatórios policiais confidenciais indicam que facções secretas de oficiais fundadas após o Golpe de Maio de 1903 continuam operando à margem da lei, conspirando nos assuntos de Estado."
 SER_kolubara_maneuver_mastery:0 "Maestria de Manobra de Kolubara"
 SER_kolubara_maneuver_mastery_desc:0 "Inspirados no golpe magistral do General Mišić, as divisões sérvias desfecham ataques fulminantes contra flancos desguarnecidos, escorraçando os invasores."
 SER_kragujevac_arsenal_expansion:0 "Expansão do Arsenal de Kragujevac"
 SER_kragujevac_arsenal_expansion_desc:0 "Novas fundições, prensas de cartuchos e linhas mecanizadas em Kragujevac ampliam a capacidade nacional de produzir armas e munições em larga escala."
 SER_kragujevac_military_workshops:0 "Oficinas Militares de Kragujevac"
 SER_kragujevac_military_workshops_desc:0 "O Vojno-Tehnički Zavod de Kragujevac é o único coração industrial pulsante da produção bélica sérvia. Expandir suas fundições e oficinas é condição indispensável para a preservação da soberania nacional."
 SER_liberation_of_the_homeland:0 "Libertação da Pátria Amada"
 SER_liberation_of_the_homeland_desc:0 "Marchando centenas de quilômetros em semanas, as divisões sérvias avançam mais rápido que os trens aliados, libertando Niš, Valjevo e entrando em Belgrado sob prantos de júbilo popular."
 SER_macedonian_autonomy_proposal:0 "Proposta de Autonomia para a Macedônia"
 SER_macedonian_autonomy_proposal_desc:0 "Propor autonomia administrativa e cultural para a Macedônia otomana atende aos anseios locais e impede conflitos territoriais fratricidas entre Belgrado e Sófia."
 SER_military_intelligence_network:0 "Rede de Inteligência Militar"
 SER_military_intelligence_network_desc:0 "Expandir o departamento de inteligência do Estado-Maior fornece dados cruciais sobre concentrações de tropas austro-húngaras, guarnições imperiais e manobras diplomáticas na região."
 SER_military_officer_ascendancy:0 "Ascendência da Oficialidade Militar"
 SER_military_officer_ascendancy_desc:0 "O corpo de oficiais patriotas detém influência primordial sobre as decisões do Estado, priorizando prontidão militar máxima e determinação férrea na defesa dos interesses nacionais."
 SER_military_telegraph_corps:0 "Corpo de Telégrafos Militares"
 SER_military_telegraph_corps_desc:0 "Comunicações rápidas de campanha através de cristas montanhosas são decisivas para a vitória. Expandir linhas telefônicas de campanha e telégrafos móveis conecta as divisões diretamente ao Alto Comando."
 SER_misic_kolubara_counteroffensive:0 "Contra-Ofensiva de Kolubara de Mišić"
 SER_misic_kolubara_counteroffensive_desc:0 "Quando tudo parecia perdido na lama do inverno, o General Živojin Mišić ordenou um recuo tático magistral, revigorou a tropa e contra-atacou no Rio Kolubara, libertando Belgrado triunfalmente."
 SER_mobilization_timetables:0 "Tabelas de Mobilização Rápida"
 SER_mobilization_timetables_desc:0 "Cronogramas ferroviários rigorosos e pontos pré-definidos de concentração permitem que as divisões sérvias alcancem as fronteiras ameaçadas dias antes do previsto pelo inimigo, transformando a geografia em escudo impenetrável."
 SER_modernize_trepca_prospects:0 "Modernizar Prospecções Geológicas"
 SER_modernize_trepca_prospects_desc:0 "Pesquisas geológicas aprofundadas pelas serras sérvias mapearão jazidas minerais inexploradas, atraindo engenheiros e maquinários modernos para fortalecer o setor industrial nacional."
 SER_monarchic_arbiter:0 "Arbitragem Monárquica"
 SER_monarchic_arbiter_desc:0 "Quando divergências inflamadas irrompem entre ministros civis e oficiais do exército, a Coroa intervém como mediadora suprema e respeitada, restaurando o equilíbrio institucional."
 SER_monitor_ultranationalist_cells:0 "Monitorar Células Ultranacionalistas"
 SER_monitor_ultranationalist_cells_desc:0 "Desdobrar agentes da polícia para monitorar círculos radicais em Belgrado, contendo a volatilidade política interna."
 SER_montenegrin_dynastic_ties:0 "Laços Dinásticos com Montenegro"
 SER_montenegrin_dynastic_ties_desc:0 "Os laços sagrados de sangue entre as dinastias Karađorđević e Petrović-Njegoš unem a Sérvia e Montenegro. O próprio Rei Pedro casou-se com a Princesa Zorka, filha do Rei Nikola I."
 SER_montenegrin_dynastic_union:0 "União Dinástica de Montenegro"
 SER_montenegrin_dynastic_union_desc:0 "Unidos por laços de sangue, resiliência serrana e séculos de combate comum contra impérios invasores, Montenegro e Sérvia compartilham o mesmo destino e fraternidade."
 SER_montenegrin_mountain_levies:0 "Convocação dos Voluntários Montenegrinos de Lovćen"
 SER_montenegrin_mountain_levies_desc:0 "Convocar os bravos guerreiros de montanha de Lovćen e Durmitor para engrossar as fileiras sérvias no combate."
 SER_montenegrin_mountain_levies_tt:0 "Milhares de valorosos combatentes das serras empunham seus fuzis na defesa do reino."
 SER_montenegrin_rearguard_stand:0 "A Retaguarda Heroica de Mojkovac"
 SER_montenegrin_rearguard_stand_desc:0 "Na épica Batalha de Mojkovac no Natal Ortodoxo de 1916, os montenegrinos do Serdar Janko Vukotić barram as divisões austro-húngaras, garantindo que o exército sérvio escape do cerco."
 SER_morava_valley_logistics:0 "Logística do Vale do Morava"
 SER_morava_valley_logistics_desc:0 "O grande corredor do Rio Morava é a espinha dorsal geográfica natural da defesa e economia sérvia. Estabelecer depósitos e terminais de intendência ao longo de seu vale garante trânsito ininterrupto tanto na paz quanto na guerra."
 SER_mountain_warfare_detachments:0 "Destacamentos de Guerra de Montanha"
 SER_mountain_warfare_detachments_desc:0 "Combater nas cristas acidentadas de Cer, Kolubara e nas serras balcânicas exige tropas leves especializadas em escaramuças de altitude, caravanas de mulas e emboscadas noturnas."
 SER_narodna_odbrana_patronage:0 "Patrocínio da Narodna Odbrana"
 SER_narodna_odbrana_patronage_desc:0 "A organização patriótica civil Narodna Odbrana mobiliza voluntários, financia atividades de defesa cívica e organiza postos de sentinela ao longo de todas as fronteiras sérvias."
 SER_national_bank_monetary_stability:0 "Estabilidade Monetária do Banco Nacional"
 SER_national_bank_monetary_stability_desc:0 "Fortalecer o Dinar sérvio com lastro em ouro e rigor monetário protege a solvência estatal, atraindo empréstimos internacionais em termos favoráveis sem sacrificar a independência política do país."
 SER_national_unity_covenant:0 "Pacto de União Sagrada Nacional"
 SER_national_unity_covenant_desc:0 "Todas as facções parlamentares, partidos e generais silenciam disputas partidárias, jurando um pacto inquebrantável de solidariedade e união sagrada na defesa da pátria sérvia."
 SER_nikola_pasic:0 "Nikola Pašić"
 SER_officer_corps_ascendancy:0 "Ascendência do Corpo de Oficiais"
 SER_officer_corps_ascendancy_desc:0 "Diante das ameaças existenciais que cercam a pátria, o governo acolhe a visão combativa dos oficiais de Apis, concedendo à liderança militar papel determinante na condução do destino nacional."
 SER_officer_corps_meritocracy:0 "Meritocracia no Corpo de Oficiais"
 SER_officer_corps_meritocracy_desc:0 "O Exército Real Sérvio não pode tolerar comodismo aristocrático. Promoções devem derivar exclusivamente da competência tática, liderança no terreno e cuidado leal com a tropa sob comando."
 SER_patriotic_press_censorship:0 "Moderação da Imprensa Patriótica"
 SER_patriotic_press_censorship_desc:0 "Conter excessos inflamados da imprensa sensacionalista evita que manchetes irresponsáveis criem atritos diplomáticos perigosos em momentos de delicada negociação internacional."
 SER_peacetime_infantry_cadre:0 "Quadros de Infantaria em Tempo de Paz"
 SER_peacetime_infantry_cadre_desc:0 "Investir firmemente na formação de sargentos, pontaria de fuzil e coesão de pelotão garante que os quadros regulares sérvios se expandam com fluidez para regimentos formidáveis na hora do combate."
 SER_podgorica_assembly_unification:0 "Grande Assembleia de Podgorica"
 SER_podgorica_assembly_unification_desc:0 "Em novembro de 1918, a Grande Assembleia Nacional em Podgorica vota democraticamente pela união permanente e fraterna de Montenegro ao Reino da Sérvia, unindo os povos sob a mesma bandeira."
 SER_proclamation_of_yugoslavia:0 "Proclamação do Reino da Iugoslávia"
 SER_proclamation_of_yugoslavia_desc:0 "Em 1 de dezembro de 1918, o Príncipe Regente Alexandre proclama o Reino dos Sérvios, Croatas e Eslovenos. Das cinzas do conflito imperial nasce o lar fraterno e unido da grande nação sul-eslava."
 SER_professional_civil_service:0 "Burocracia Pública Profissional"
 SER_professional_civil_service_desc:0 "Instituir concursos públicos e critérios técnicos de promoção transforma a máquina pública em uma burocracia eficiente e competente, pronta para administrar a nação em crises."
 SER_purge_army_clandestine_officers:0 "Expurgar Oficiais Clandestinos do Exército"
 SER_purge_army_clandestine_officers_desc:0 "Afastar conspiradores da Mão Negra de postos de comando de brigada, assegurando a supremacia civil."
 SER_purge_army_clandestine_officers_tt:0 "O controle civil irrestrito sobre as Forças Armadas é definitivamente assegurado."
 SER_radical_party_cabinet:0 "Gabinete do Partido Radical do Povo"
 SER_radical_party_cabinet_desc:0 "Liderado pelo experiente estadista Nikola Pašić, o Partido Radical do Povo domina a vida parlamentar sérvia, detendo a confiança das massas camponesas e guiando a diplomacia nacional."
 SER_radomir_putnik_doctrine:0 "Doutrina de Radomir Putnik"
 SER_radomir_putnik_doctrine_desc:0 "O Chefe do Estado-Maior, Vojvoda Radomir Putnik, dedicou décadas a transformar as milícias camponesas sérvias em um exército europeu disciplinado e adaptável, mestre em manobras de contra-ataque defensivo."
 SER_rapid_fire_field_guns:0 "Canhões de Tiro Rápido de Campanha"
 SER_rapid_fire_field_guns_desc:0 "Dominar barragens concentradas de estilhaços e alto-explosivo disparadas por canhões de tiro rápido confere à infantaria sérvia o poder de fogo necessário para repelir assaltos inimigos em vales fluviais."
 SER_rebuild_army_in_salonika:0 "Reconstruir o Exército em Salônica"
 SER_rebuild_army_in_salonika_desc:0 "Recuperados e reequipados pelos aliados franceses, 150.000 veteranos sérvios reorganizam-se em corpos de combate e tomam posições na Frente Macedônia em Salônica, ansiosos pela libertação."
 SER_rebuilt_salonika_corps:0 "Corpos Reconstituídos de Salônica"
 SER_rebuilt_salonika_corps_desc:0 "Equipado com artilharia moderna aliada e forjado pelo sofrimento do exílio, o reconstruído exército sérvio ergue-se com moral renovada para a libertação da pátria."
 SER_recruit_south_slav_pow_volunteers:0 "Recrutar Voluntários Sul-Eslavos Prisioneiros"
 SER_recruit_south_slav_pow_volunteers_desc:0 "Alistar prisioneiros de guerra croatas, eslovenos e tchecos dispostos a lutar pela libertação dos povos eslavos."
 SER_regency_of_alexander:0 "Proclamação da Regência do Príncipe Alexandre"
 SER_regency_of_alexander_desc:0 "Em 24 de junho de 1914, o venerando Rei Pedro I transfere oficialmente suas funções de chefe de Estado ao Príncipe Herdeiro Alexandre, trazendo firme liderança jovem ao leme da nação."
 SER_reign_of_peter_i:0 "Reinado de Pedro I Karađorđević"
 SER_reign_of_peter_i_desc:0 "O Rei Pedro I personifica o ideal do monarca constitucional e liberal. Respeitado por ter traduzido a obra 'Sobre a Liberdade' de John Stuart Mill, governa estritamente sob as leis parlamentares e o império da Constituição."
 SER_requisition_emergency_grain:0 "Requisição Emergencial de Grãos"
 SER_requisition_emergency_grain_desc:0 "Arrecadar reservas de grãos das cooperativas rurais para abastecer as rações de pão nos centros urbanos."
 SER_restored_sovereign_serbia:0 "Restauração da Sérvia Soberana"
 SER_restored_sovereign_serbia_desc:0 "Rejeitando arranjos federais complexos, a Sérvia consolida suas fronteiras históricas e terras libertadas em um reino soberano, vitorioso, centralizado e inquebrantável."
 SER_romanian_danube_understanding:0 "Entendimento do Danúbio com a Romênia"
 SER_romanian_danube_understanding_desc:0 "Cultivar relações cordiais com o Rei Carol I e Bucareste assegura a navegação pacífica no Danúbio e consolida a tranquilidade na fronteira ao longo dos Cárpatos."
 SER_saint_petersburg_arms_loans:0 "Créditos Bélicos de São Petersburgo"
 SER_saint_petersburg_arms_loans_desc:0 "Negociar créditos militares russos canaliza milhares de fuzis Mosin-Nagant, baterias de artilharia e farta munição diretamente para os arsenais do exército sérvio."
 SER_salonika_and_corfu_exile:0 "Governança no Exílio em Salônica e Corfu"
 SER_salonika_and_corfu_exile_desc:0 "Operando como governo no exílio, a Sérvia coordena esforços com frotas aliadas, arregimenta voluntários sul-eslavos e gere a diplomacia internacional até a libertação final do solo pátrio."
 SER_salonika_trial_of_apis:0 "O Julgamento de Salônica de Apis"
 SER_salonika_trial_of_apis_desc:0 "Em 1917, o governo desbarata uma suposta conspiração de regicídio contra o Príncipe Alexandre. O Coronel Apis e os cabeças da Mão Negra são julgados e fuzilados, liquidando o golpismo para sempre."
 SER_sarajevo_aftermath_crisis:0 "Crise Pós-Sarajevo"
 SER_sarajevo_aftermath_crisis_desc:0 "Os disparos de 28 de junho de 1914 em Sarajevo abalaram a Europa. Acusada por Viena de orquestrar o atentado, a Sérvia enfrenta uma tempestade imperial sem precedentes."
 SER_serbo_austrian_economic_pact:0 "Pacto Econômico Sérvio-Austríaco"
 SER_serbo_austrian_economic_pact_desc:0 "Um acordo comercial equilibrado com Viena assegura cotas de exportação garantidas para o gado e cereais sérvios pelas ferrovias da Europa Central."
 SER_serbo_austrian_trade_treaty:0 "Tratado Comercial Sérvio-Austríaco"
 SER_serbo_austrian_trade_treaty_desc:0 "Um acordo comercial abrangente com a Monarquia Dual abre os vastos mercados austro-húngaros para o gado e grãos sérvios, enterrando antigas disputas aduaneiras."
 SER_serbo_bulgarian_dialogue:0 "Diálogo Sérvio-Búlgaro"
 SER_serbo_bulgarian_dialogue_desc:0 "Abrir canais diplomáticos bilaterais com Sófia dissipa desconfianças mútuas, pavimentando um caminho de convivência fraterna e coexistência pacífica entre os dois reinos eslavos."
 SER_south_slav_cultural_links:0 "Laços Culturais Sul-Eslavos"
 SER_south_slav_cultural_links_desc:0 "Apoiar sociedades intelectuais e culturais como Matica Srpska e Prosvjeta cultiva laços fraternos entre sérvios, croatas e eslovenos por todas as terras balcânicas."
 SER_strengthen_border_watch:0 "Reforçar a Vigília de Fronteira no Sava e Drina"
 SER_strengthen_border_watch_desc:0 "Posicionar destacamentos territoriais vigilantes em vaus fluviais e desfiladeiros de montanha."
 SER_strengthen_narodna_skupstina:0 "Fortalecer a Narodna Skupština"
 SER_strengthen_narodna_skupstina_desc:0 "Reafirmar a soberania da Assembleia Nacional sobre o orçamento de Estado, despesas militares e garantias cívicas consolida uma governança democrática transparente em Belgrado."
 SER_sublime_porte_normalization:0 "Normalização com a Sublime Porta"
 SER_sublime_porte_normalization_desc:0 "Normalizar contatos com Constantinopla estabelece salvaguardas consulares para as comunidades cristãs nos vilaietes fronteiriços, dissipando tensões sem recurso às armas."
 SER_suppress_anti_habsburg_agitation:0 "Reprimir Agitação Anti-Habsburgo"
 SER_suppress_anti_habsburg_agitation_desc:0 "Demonstrando boa-fé a Viena, as autoridades reprimem panfletos radicais e agitadores anti-Habsburgo, eliminando justificativas para represálias imperiais."
 SER_supreme_command_preparedness:0 "Prontidão do Comando Supremo"
 SER_supreme_command_preparedness_desc:0 "Com planos traçados, rotas de suprimento asseguradas e reservas operacionais prontas, a Vrhovna Komanda está preparada para conduzir a defesa sagrada do reino contra qualquer agressor."
 SER_the_albanian_golgotha:0 "O Gólgota Albanês"
 SER_the_albanian_golgotha_desc:0 "Cercado por três exércitos imperiais, o exército sérvio recusa a rendição. O idoso monarca e suas divisões iniciam a heroica e trágica travessia invernal pelas cordilheiras albanesas."
 SER_the_shadow_of_apis:0 "A Sombra de Apis"
 SER_the_shadow_of_apis_desc:0 "O Coronel Dragutin Dimitrijević, de codinome 'Apis', chefia o serviço secreto do exército e comanda uma vasta rede clandestina através da sociedade secreta 'Unificação ou Morte' — a temida Mão Negra."
 SER_three_ban_conscription_system:0 "Sistema de Conscrição em Três Convocações"
 SER_three_ban_conscription_system_desc:0 "Codificar a estrutura de mobilização em três escalões — I Poziv (ativos de 21 a 31 anos), II Poziv (reservistas de 31 a 38 anos) e III Poziv (guardas territoriais de 38 a 45 anos) — assegura que todo homem sérvio responda ao chamado da pátria."
 SER_total_defensive_war:0 "Guerra Defensiva Total"
 SER_total_defensive_war_desc:0 "A sorte está lançada. Enfrentando o poder de um império dez vezes maior, a Sérvia mobiliza cada gota de força, solo e alma em uma guerra sagrada pela própria sobrevivência nacional."
 SER_traditional_russian_patronage:0 "Tradicional Patronato Russo"
 SER_traditional_russian_patronage_desc:0 "A Rússia Imperial historicamente ergueu-se como protetora dos povos eslavos e ortodoxos. Reafirmar laços fraternos com o Czar Nicolau II ancora o escudo diplomático de Belgrado."
 SER_typhus_epidemic_containment:0 "Contenção da Epidemia de Tifo"
 SER_typhus_epidemic_containment_desc:0 "Um devastador surto de tifo atinge a Sérvia em 1915, vitimando centenas de milhares de civis e soldados. Medidas drásticas de quarentena e socorro médico internacional lutam contra a extinção."
 SER_typhus_epidemic_crisis:0 "Crise Epidêmica de Tifo"
 SER_typhus_epidemic_crisis_desc:0 "O tifo epidêmico assola as trincheiras e cidades, sobrecarregando hospitais improvisados e ceifando a juventude combatente da nação."
 SER_typhus_quarantine_and_triage:0 "Quarentena e Triagem Médica contra o Tifo"
 SER_typhus_quarantine_and_triage_desc:0 "Implantar desinfecção rigorosa, postos sanitários de campanha e triagem médica para exterminar o surto de tifo."
 SER_underdeveloped_agrarian_economy:0 "Economia Agrária Subdesenvolvida"
 SER_underdeveloped_agrarian_economy_desc:0 "Dependente da agricultura camponesa de subsistência e carente de metalurgia pesada, a Sérvia luta para financiar reformas fabris após anos de isolamento econômico."
 SER_veteran_serbian_soldier:0 "O Soldado Sérvio (Srpski Vojnik)"
 SER_veteran_serbian_soldier_desc:0 "Forjado pela vida dura nas serras, devoção patriótica e estoicismo inabalável, o soldado camponês sérvio possui resistência sobre-humana e bravura admirada por aliados e adversários."
 SER_wartime_emergency_measures:0 "Medidas de Emergência de Guerra"
 SER_wartime_emergency_measures_desc:0 "Em tempos de guerra total, o Estado precisa tomar medidas drásticas para abastecer as frentes de combate, garantir o pão aos centros urbanos e conter surtos epidêmicos letais."
 SER_yugoslav_brotherhood_charter:0 "Carta da Fraternidade Iugoslava"
 SER_yugoslav_brotherhood_charter_desc:0 "Garantir direitos constitucionais iguais, respeito às liberdades regionais e fraternidade a croatas, eslovenos e sérvios alicerça a união duradoura da família sul-eslava."
 SER_yugoslav_federal_ideal:0 "Ideal Federal Iugoslavo"
 SER_yugoslav_federal_ideal_desc:0 "Abraçando a visão de um lar comum sul-eslavo, a Sérvia estende a mão a líderes croatas e eslovenos para erguer uma federação democrática e igualitária de povos irmãos."
 SER_zadruga_cooperative_network:0 "Rede Cooperativa Zadruga"
 SER_zadruga_cooperative_network_desc:0 "Séculos de cooperativas familiares comunitárias — as Zadrugas — ancoram a sociedade rural sérvia. Oferecer respaldo estatal, crédito agrícola justo e ferramentas modernas estabilizará a subsistência camponesa e consolidará a coesão social."
 decision_cost_command_power_15:0 "Custa 15 de Poder de Comando"
 ww1_serbia.1.a:0 "Vida longa à monarquia constitucional de Pedro I!"
 ww1_serbia.1.b:0 "Assegurar que a Assembleia Nacional controle as contas públicas."
 ww1_serbia.1.d:0 "O venerando Rei Pedro I Karađorđević governa estritamente sob as regras da democracia parlamentar. O Partido Radical de Nikola Pašić conduz o Estado com prudência, mas as relações entre os ministros civis e o exército exigem vigilância constante."
 ww1_serbia.1.t:0 "O Gabinete Pašić e a Estabilidade Constitucional"
 ww1_serbia.10.a:0 "Um triunfo lendário! Belgrado está livre!!"
 ww1_serbia.10.d:0 "Após semanas de penoso recuo na lama gelada, o General Živojin Mišić desfechou um colossal contra-ataque no Rio Kolubara, destroçando os exércitos austríacos e expulsando-os do solo sagrado sérvio."
 ww1_serbia.10.t:0 "O Triunfo de Kolubara"
 ww1_serbia.11.a:0 "Recuamos hoje para que a Sérvia renasça amanhã!"
 ww1_serbia.11.d:0 "Cercado por três exércitos imperiais, o exército sérvio recusa a rendição. O idoso monarca e suas divisões iniciam a heroica e trágica travessia invernal pelas cordilheiras albanesas."
 ww1_serbia.11.t:0 "O Gólgota Albanês: A Grande Retirada"
 ww1_serbia.12.a:0 "A Sérvia vive! Retornaremos triunfantes!"
 ww1_serbia.12.d:0 "Resgatados pela frota aliada, o governo, os parlamentares e as tropas sérvias reagrupam-se na ilha grega de Corfu. Embora sem terra natal, a soberania sérvia permanece inquebrantável."
 ww1_serbia.12.t:0 "O Reino Ressuscitado: O Exílio em Corfu"
 ww1_serbia.13.a:0 "A autoridade constitucional civil é definitivamente restaurada."
 ww1_serbia.13.d:0 "Em 1917, o governo militar julga o Coronel Apis e os cabeças da Mão Negra por conspiração. Com a execução dos líderes, o golpismo militar é extinto definitivamente."
 ww1_serbia.13.t:0 "O Julgamento de Salônica e o Fim da Mão Negra"
 ww1_serbia.14.a:0 "Um alvorecer glorioso para todos os povos sul-eslavos!"
 ww1_serbia.14.d:0 "O Primeiro-Ministro Nikola Pašić e Ante Trumbić firmam a Declaração de Corfu, selando que sérvios, croatas e eslovenos se fundirão em um único reino sob a coroa Karađorđević."
 ww1_serbia.14.t:0 "A Declaração de Corfu e a Unidade Sul-Eslava"
 ww1_serbia.15.a:0 "Avançar até a vitória! A pátria nos espera!"
 ww1_serbia.15.d:0 "As divisões sérvias escalam os penhascos de Dobro Pole sob tempestade de aço, rompem as defesas búlgaras e causam o colapso irreversível dos Impérios Centrais nos Bálcãs."
 ww1_serbia.15.t:0 "A Ruptura de Dobro Pole"
 ww1_serbia.16.a:0 "Živeo Kralj! Viva a Iugoslávia unida e livre!"
 ww1_serbia.16.d:0 "Em 1 de dezembro de 1918, o Príncipe Regente Alexandre proclama solenemente a unificação do Reino dos Sérvios, Croatas e Eslovenos em Belgrado. Inicia-se uma nova era."
 ww1_serbia.16.t:0 "Proclamação do Reino dos Sérvios, Croatas e Eslovenos"
 ww1_serbia.2.a:0 "Devemos vigiar de perto estes oficiais impetuosos."
 ww1_serbia.2.b:0 "Sua devoção patriótica protegerá o solo da pátria."
 ww1_serbia.2.d:0 "Fundada por oficiais nacionalistas chefiados pelo Coronel Dragutin Dimitrijević 'Apis', a organização clandestina 'Unificação ou Morte' (a Mão Negra) estende seus tentáculos subterrâneos por guarnições e círculos patrióticos."
 ww1_serbia.2.t:0 "A Sombra de Apis: A Sociedade Secreta Unificação ou Morte"
 ww1_serbia.3.a:0 "Uma base financeira sólida para a defesa nacional."
 ww1_serbia.3.d:0 "Financistas e diplomatas franceses concluíram acordos de crédito com Belgrado, garantindo fundos para ferrovias, refinanciamento da dívida e compras de artilharia pesada da Creusot."
 ww1_serbia.3.t:0 "Os Empréstimos da Banque Franco-Serbe"
 ww1_serbia.4.a:0 "A fraternidade eslava deve triunfar sobre intrigas imperiais."
 ww1_serbia.4.b:0 "Avançar com cautela e resguardar os interesses sérvios."
 ww1_serbia.4.d:0 "Emissários de Belgrado e Sófia iniciaram conversas diplomáticas para garantir a segurança das fronteiras e prevenir atritos fratricidas entre irmãos eslavos."
 ww1_serbia.4.t:0 "Conversações Bilaterais com Sófia"
 ww1_serbia.5.a:0 "Duas coroas, uma só alma heroica! Živela Srbija i Crna Gora!"
 ww1_serbia.5.d:0 "O Rei Nikola I de Montenegro e o Rei Pedro I reafirmam a solidariedade dinástica e fraternal de seus povos. Os dois reinos irmãos juram auxílio militar perpétuo."
 ww1_serbia.5.t:0 "O Acordo Dinástico com o Rei Nikola de Montenegro"
 ww1_serbia.6.a:0 "Vida longa ao Príncipe Regente Alexandre!"
 ww1_serbia.6.d:0 "Em 24 de junho de 1914, o idoso Rei Pedro I transfere oficialmente o exercício das prerrogativas régias a seu filho, o Príncipe Herdeiro Alexandre, devido à sua saúde fragilizada."
 ww1_serbia.6.t:0 "A Regência do Príncipe Herdeiro Alexandre"
 ww1_serbia.7.a:0 "Uma terrível tragédia. Devemos nos preparar para a fúria imperial."
 ww1_serbia.7.d:0 "O Arquiduque Francisco Fernando e sua esposa foram assassinados em Sarajevo por Gavrilo Princip. Viena lança a culpa inteira sobre Belgrado e clama por vingança."
 ww1_serbia.7.t:0 "O Atentado de Sarajevo: Nuvens Negras no Horizonte"
 ww1_serbia.8.a:0 "Aceitar todos os pontos razoáveis, mas defender nossa soberania!"
 ww1_serbia.8.b:0 "Desafio total! Jamais nos curvaremos à arrogância de Viena!"
 ww1_serbia.8.d:0 "Em 23 de julho, o Barão Giesl entrega o ultimato de dez pontos de Viena, exigindo resposta em 48 horas. Várias cláusulas ferem a soberania judicial do reino sérvio."
 ww1_serbia.8.t:0 "O Ultimato Austro-Húngaro"
 ww1_serbia.9.a:0 "Pelo Rei, pela Pátria e pela Liberdade!"
 ww1_serbia.9.d:0 "Com a ruptura diplomática consumada, o Vojvoda Putnik ordena a mobilização de todos os três Pozivs. Mais de 400.000 homens tomam seus postos na defesa da pátria."
 ww1_serbia.9.t:0 "Putnik Proclama a Mobilização Geral"
