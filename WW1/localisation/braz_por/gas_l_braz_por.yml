l_braz_por:
 sp_gas: "Armas Químicas"
 sp_gas_tech: "Armas Químicas"
 sp_gas_desc: "O desenvolvimento e refinamento de agentes químicos projetados para incapacitar forças inimigas, bem como os meios para seu lançamento e dispersão. Este campo inclui pesquisas em novos compostos tóxicos, desenvolvimento de projéteis de artilharia química, dispositivos de dispersão e munições especializadas, além de estudos sobre sua eficácia, persistência, métodos de emprego e proteção contra agentes de guerra química."
 sp_gas_choice_reward: "Seleção do Foco de Pesquisa"
 sp_gas_choice_reward_desc: "Devemos escolher a direção de nosso programa de guerra química e o desenvolvimento de métodos de dispersão no campo de batalha. Podemos selecionar uma das seguintes quatro opções:\nCloro — um gás barato e rapidamente estocado.\nFosgênio — um gás moderadamente difícil de produzir com aplicações práticas no campo de batalha.\nGás Mostarda — um agente contaminador de terreno capaz de retardar o movimento inimigo.\nSarim — o gás mais caro, porém o mais letal."
 sp_gas_choice_reward_chlorine: "Cloro"
 sp_gas_choice_reward_phosgene: "Fosgênio"
 sp_gas_choice_reward_mustard_gas: "Gás Mostarda"
 sp_gas_choice_reward_sarin: "Sarim"
 chlorine: "Cloro"
 phosgene: "Fosgênio"
 mustard_gas: "Gás Mostarda"
 sarin: "Sarim"
 ABILITY_CHLORINE_ATTACK: "Ataque Químico"
 ABILITY_CHLORINE_ATTACK_DESC: "Suas unidades recebem bônus ofensivos e defensivos através do emprego de cloro no campo de batalha."
 ABILITY_PHOSGENE_ATTACK: "Ataque Químico"
 ABILITY_PHOSGENE_ATTACK_DESC: "Suas unidades recebem bônus ofensivos e defensivos através do emprego de fosgênio no campo de batalha, enquanto as unidades inimigas sofrem redução de velocidade de movimento."
 ABILITY_MUSTARD_GAS_ATTACK: "Ataque Químico"
 ABILITY_MUSTARD_GAS_ATTACK_DESC: "Suas unidades recebem bônus ofensivos e defensivos através do emprego de gás mostarda no campo de batalha, enquanto as unidades inimigas sofrem redução de velocidade de movimento."
 ABILITY_SARIN_ATTACK: "Ataque Químico"
 ABILITY_SARIN_ATTACK_DESC: "Suas unidades recebem bônus ofensivos e defensivos através do emprego de sarim no campo de batalha, enquanto as unidades inimigas sofrem redução de velocidade de movimento."
 gas.0.t: "O Gás Retorna ao Campo de Batalha"
 gas.0.a: "O mundo está voltando no tempo."
 gas.1.d: "Relatos perturbadores chegam das frentes de batalha da guerra moderna: [gas_attacker.GetNameDef] utilizou com sucesso armas químicas contra seus inimigos.\n\nNo momento, é difícil avaliar o impacto do cloro empregado diretamente pelas tropas atacantes, bem como o resultado do confronto em si. No entanto, uma certeza permanece: o mundo volta a ser assombrado pelos fantasmas do passado.\n\nApenas o tempo mostrará o quão disseminado e devastador será o uso de armas químicas na era moderna."
