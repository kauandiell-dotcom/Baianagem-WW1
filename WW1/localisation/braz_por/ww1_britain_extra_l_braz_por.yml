l_braz_por:
 ww1_britain_x.1.t:0 "O Panther em Agadir"
 ww1_britain_x.1.d:0 "Uma canhoneira alemã lança âncora em Agadir e Paris pergunta o que Londres pretende fazer. O Foreign Office quer uma resposta firme, os radicais não querem nenhuma, e Lloyd George já tem um discurso pronto para a Mansion House."
 ww1_britain_x.1.a:0 "Discursar na Mansion House"
 ww1_britain_x.1.b:0 "Apoiar a França em silêncio"
 ww1_britain_x.1.c:0 "Aconselhar moderação"
 ww1_britain_x.2.t:0 "A questão do Mediterrâneo"
 ww1_britain_x.2.d:0 "A nova lei naval alemã deixa o Almirantado com poucos encouraçados para o Mar do Norte e para Malta ao mesmo tempo. Churchill quer a esquadra do Mediterrâneo em casa; o Foreign Office teme o que a Itália e a Áustria concluirão."
 ww1_britain_x.2.a:0 "Concentrar a frota em águas territoriais"
 ww1_britain_x.2.b:0 "Manter uma esquadra no Mediterrâneo"
 ww1_britain_x.2.c:0 "Confiar na frota francesa"
 ww1_britain_x.3.t:0 "Voto para as mulheres"
 ww1_britain_x.3.d:0 "Vidraças são quebradas no West End e presas em greve de fome são soltas e presas de novo. O Home Office tem uma lei para isso, a Conferência do Presidente é um sonho, e o público está cansado dos dois lados."
 ww1_britain_x.3.a:0 "Aplicar a lei do Gato e Rato"
 ww1_britain_x.3.b:0 "Abrir negociações sobre um sufrágio limitado"
 ww1_britain_x.3.c:0 "Deixar com os tribunais"
 ww1_britain_x.4.t:0 "O incidente de Curragh"
 ww1_britain_x.4.d:0 "Oficiais de cavalaria em Curragh dizem preferir renunciar a marchar contra o Ulster. O Ministério da Guerra hesita, o Gabinete se contradiz e os bancos irlandeses perguntam quem governa o exército."
 ww1_britain_x.4.a:0 "Tranquilizar os oficiais"
 ww1_britain_x.4.b:0 "Submeter os cabeças a corte marcial"
 ww1_britain_x.4.c:0 "O Primeiro-Ministro assume a Guerra."
 ww1_britain_x.5.t:0 "O Lusitania"
 ww1_britain_x.5.d:0 "Um submarino alemão afunda o transatlântico perto de Old Head of Kinsale. Mais de mil mortos, entre eles americanos, e multidões quebram vitrines alemãs em Liverpool e Londres."
 ww1_britain_x.5.a:0 "Publicar as listas de vítimas"
 ww1_britain_x.5.b:0 "Enviar uma nota comedida a Washington"
 ww1_britain_x.5.c:0 "Reabrir a questão dos comboios"
 ww1_britain_x.6.t:0 "A Terceira Batalha de Ypres"
 ww1_britain_x.6.d:0 "As chuvas chegam cedo e a crista é um pântano. Haig acredita que mais um empurrão quebra o exército alemão; Lloyd George teme as listas de baixas e a frente italiana pede canhões."
 ww1_britain_x.6.a:0 "Prosseguir com a ofensiva"
 ww1_britain_x.6.b:0 "Parar depois da crista"
 ww1_britain_x.6.c:0 "Enviar canhões à Itália"
 ww1_britain_x.7.t:0 "Cambrai"
 ww1_britain_x.7.d:0 "Centenas de tanques atravessam a Linha Hindenburg sem bombardeio preliminar e, pela primeira vez, os sinos de Londres repicam. O contra-ataque alemão dez dias depois retoma quase tudo."
 ww1_britain_x.7.a:0 "Repicar os sinos e apoiar os tanques"
 ww1_britain_x.7.b:0 "Estudar as lições"
 ww1_britain_x.7.c:0 "Moderar a imprensa"
 ww1_britain_x.8.t:0 "A gripe"
 ww1_britain_x.8.d:0 "A segunda onda da gripe esvazia fábricas, escolas e quartéis. Os médicos querem os cinemas fechados; o Conselho de Governo Local quer os trens funcionando."
 ww1_britain_x.8.a:0 "Financiar hospitais e inspetores"
 ww1_britain_x.8.b:0 "Deixar com os conselhos locais"
 ww1_britain_x.8.c:0 "Censurar os números"
 ww1_britain_x.9.t:0 "Jallianwala Bagh"
 ww1_britain_x.9.d:0 "As tropas do general Dyer dispararam contra uma multidão desarmada em Amritsar. Os telegramas do vice-rei são cautelosos, o Punjab está sob lei marcial e Montagu exige saber o que foi feito em nome da Coroa."
 ww1_britain_x.9.a:0 "Nomear o Comitê Hunter"
 ww1_britain_x.9.b:0 "Apoiar o general Dyer"
 ww1_britain_x.9.c:0 "Censurá-lo e aposentá-lo discretamente"
 ww1_britain_x.10.t:0 "A crise de Chanak"
 ww1_britain_x.10.d:0 "O exército de Kemal chega à zona neutra dos Estreitos e poucos batalhões britânicos ficam entre ele e o mar. Os Domínios são convidados a enviar tropas e o Canadá não responde."
 ww1_britain_x.10.a:0 "Manter-se firme nos Estreitos"
 ww1_britain_x.10.b:0 "Negociar em Mudanya"
 ww1_britain_x.10.c:0 "Apelar aos Domínios"
 ENG_ww1_x_indian_corps:0 "O Corpo Indiano"
 ENG_ww1_x_indian_corps_desc:0 "Regimentos indianos experientes reforçam a linha, mas consomem transporte e suprimentos."
 ENG_ww1_x_district_contracts:0 "Contratos distritais"
 ENG_ww1_x_district_contracts_desc:0 "Contratos com as oficinas inspecionadas das Midlands e do Clyde aceleram a produção ao custo de bens civis."
 ENG_ww1_x_officer_courses:0 "Ampliar os cursos de formação de oficiais"
 ENG_ww1_x_officer_courses_desc:0 "Financie cursos extras em escolas e universidades. Mão de obra equivalente a uma fábrica civil fica ocupada por 60 dias; subalternos treinados chegam por oito meses."
 ENG_ww1_x_city_credit_line:0 "Linha de crédito da City"
 ENG_ww1_x_city_credit_line_desc:0 "A City desconta títulos industriais por uma temporada; a dívida permanece."
 ENG_ww1_x_seaplane_patrols:0 "Escala de patrulhas de hidroaviões"
 ENG_ww1_x_seaplane_patrols_desc:0 "Hidroaviões de Calshot, Felixstowe e Yarmouth vigiam as aproximações."
 ENG_ww1_x_call_indian_corps:0 "Convocar o Corpo Indiano"
 ENG_ww1_x_call_indian_corps_desc:0 "A ligação com o Exército Indiano permite convocar seus regimentos. Eles reforçam a linha por 120 dias, mas transporte e suprimentos sofrem e o consentimento indiano esfria."
 ENG_ww1_x_place_district_contracts:0 "Firmar contratos distritais"
 ENG_ww1_x_place_district_contracts_desc:0 "Use o levantamento dos distritos industriais para firmar pedidos. Uma fábrica civil fica ocupada por 60 dias; depois a produção melhora por meio ano e a dívida aumenta."
 ENG_ww1_x_rehearse_mobilisation:0 "Ensaiar as tabelas de mobilização"
 ENG_ww1_x_rehearse_mobilisation_desc:0 "Um ensaio em papel de trens, portos e depósitos da Força Expedicionária. Ensina ao Estado-Maior onde as tabelas falham."
 ENG_ww1_x_summer_camp_season:0 "Realizar os acampamentos de verão"
 ENG_ww1_x_summer_camp_season_desc:0 "Os batalhões Territoriais armam suas tendas por quinze dias. Voluntários e patrões resmungam, mas os regimentos aprendem a marchar juntos."
 ENG_ww1_x_aerial_sorties:0 "Realizar missões de reconhecimento aéreo"
 ENG_ww1_x_aerial_sorties_desc:0 "Ordene missões fotográficas sistemáticas sobre as linhas inimigas. Estado-Maior e esquadrilhas aprendem a interpretar as imagens juntos."
 ENG_ww1_x_night_patrols:0 "Realizar patrulhas noturnas"
 ENG_ww1_x_night_patrols_desc:0 "Pilotos decolam no escuro para encontrar os bombardeiros sobre Londres. A cidade dorme um pouco melhor."
 ENG_ww1_x_shipping_audit:0 "Auditar o registro mercante"
 ENG_ww1_x_shipping_audit_desc:0 "Lloyd's e o Board of Trade verificam quais cascos podem levar carga, tropas ou hospitais. A tonelagem ociosa é encontrada e vendida."
 ENG_ww1_x_seaplane_rota:0 "Fixar a escala de patrulhas de hidroaviões"
 ENG_ww1_x_seaplane_rota_desc:0 "Monte uma escala para as estações da costa leste. Por cinco meses as aproximações são vigiadas de perto."
 ENG_ww1_x_gas_drill:0 "Treinar disciplina contra gás"
 ENG_ww1_x_gas_drill_desc:0 "Todo batalhão passa pelas câmaras de gás e pelo treino de máscaras. Custa tempo e equipamento, mas salva vidas."
 ENG_ww1_x_cargo_priorities:0 "Definir as prioridades de carga aliadas"
 ENG_ww1_x_cargo_priorities_desc:0 "O conselho aliado ordena tropas, munições, trigo e carvão. A tonelagem é compartilhada e o Tesouro paga menos fretes."
 ENG_ww1_x_city_bills:0 "Descontar títulos industriais na City"
 ENG_ww1_x_city_bills_desc:0 "A City de Londres desconta títulos industriais por cinco meses. As fábricas ganham capital de giro; a dívida continua por pagar."
 ENG_ww1_x_reconstruction_commission:0 "Nomear uma comissão de reconstrução"
 ENG_ww1_x_reconstruction_commission_desc:0 "Uma comissão assume habitação, emprego e queixas da desmobilização. Ocupa uma fábrica civil por 90 dias e custa dinheiro."
 ENG_ww1_x_service_the_debt:0 "Pagar o serviço da dívida de guerra"
 ENG_ww1_x_service_the_debt_desc:0 "A comissão resgata uma parcela da dívida de guerra com a receita. A dívida cai, mas o aperto fiscal é sentido nos salários."
 ENG_ww1_x_demob_schedule:0 "Publicar o cronograma de desmobilização"
 ENG_ww1_x_demob_schedule_desc:0 "Os homens são liberados por idade, ofício e tempo de serviço. Os trabalhadores voltam às fábricas de forma ordenada em vez de em enxurrada."
 ENG_ww1_x_industrial_council:0 "Convocar o Conselho Industrial"
 ENG_ww1_x_industrial_council_desc:0 "Patrões e líderes sindicais se reúnem sob o Ministério do Trabalho. Uma temporada de conversas reduz a temperatura nas fábricas e nas docas."
 ENG_ww1_x_imperial_defence_committee:0 "Reunir o Comitê de Defesa Imperial"
 ENG_ww1_x_imperial_defence_committee_desc:0 "Os representantes dos Domínios se sentam com o Almirantado e o Ministério da Guerra para planejar a próxima década de defesa imperial."
