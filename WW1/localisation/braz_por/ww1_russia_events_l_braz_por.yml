l_braz_por:
 ww1_russia.1.t:0 "Atentado contra Stolypin na Ópera de Kiev"
 ww1_russia.1.d:0 "Durante uma récita de gala na Ópera de Kiev na presença do Czar, o revolucionário Dmitry Bogrov disparou dois tiros contra o Primeiro-Ministro Pyotr Stolypin. O estadista tombou em sua cadeira, fazendo o sinal da cruz em direção ao camarote imperial."
 ww1_russia.1.a:0 "Stolypin sucumbe aos ferimentos dias depois..."
 ww1_russia.1.b:0 "Milagrosamente, a bala desvia em sua condecoração!"
 SOV_stolypin_dies_tt:0 "Pyotr Stolypin morre. O ímpeto reformista é paralisado."
 SOV_stolypin_survives_tt:0 "Stolypin sobrevive e consolida sua autoridade."

 ww1_russia.5.t:0 "Mobilização Geral do Exército Imperial"
 ww1_russia.5.d:0 "O Imperador de todas as Rússias assinou o decreto de mobilização geral. Sinos repicam em todas as aldeias da Polônia ao Pacífico enquanto milhões de camponeses se apresentam às guarnições."
 ww1_russia.5.a:0 "Por Deus, pelo Czar e pela Pátria!"
 SOV_general_mobilization_tt:0 "Mais de cinco milhões de soldados iniciam a mobilização."

 ww1_russia.10.t:0 "Eclodem os Motins do Pão em Petrogrado"
 ww1_russia.10.d:0 "Nevascas impiedosas, desabastecimento de trigo e filas intermináveis levaram centenas de milhares de operários às ruas de Petrogrado clamando por 'Pão e Paz!'."
 ww1_russia.10.a:0 "A ordem deve ser restabelecida na capital!"

 ww1_russia.11.t:0 "A Abdicação de Nicolau II"
 ww1_russia.11.d:0 "Retido em seu trem imperial em Pskov, Nicolau II reúne-se com emissários da Duma. Convencido por seus generais de que somente sua renúncia pode preservar o exército e evitar a guerra civil, o Czar assina o manifesto."
 ww1_russia.11.a:0 "Aceitar a abdicação por si e por seu filho Alexei."
 ww1_russia.11.b:0 "Recusar! A autocracia só responde perante Deus!"
 SOV_abdication_accepted_tt:0 "A dinastia Romanov chega ao fim. O Governo Provisório assume."
 SOV_tsar_resists_tt:0 "O Czar convoca tropas leais do front para marchar sobre a capital."

 ww1_russia.12.t:0 "Apelo Sérvio Urgente ao Czar"
 ww1_russia.12.d:0 "Sob a sombra do ultimato austríaco a Belgrado, o Príncipe Regente Alexandre despachou um apelo angustiado ao Imperador Nicolau II. A Sérvia aceita a arbitragem das potências, mas implora que o Czar não abandone uma nação irmã eslava à destruição por Viena."
 ww1_russia.12.a:0 "A Rússia jamais abandonará seus irmãos eslavos!"
 ww1_russia.12.b:0 "Aconselhar cautela máxima; não podemos arriscar uma guerra mundial hoje."

 ww1_russia.15.t:0 "Kerensky Assume a Liderança do Governo"
 ww1_russia.15.d:0 "Com a renúncia do Príncipe Lvov, Alexander Kerensky assume a presidência do gabinete, buscando reconciliar a democracia revolucionária com o dever no front."
 ww1_russia.15.a:0 "Avançar para a defesa revolucionária da República!"

 ww1_russia.20.t:0 "O Caso Kornilov"
 ww1_russia.20.d:0 "O Comandante Supremo General Lavr Kornilov despacha o 3º Corpo de Cavalaria rumo a Petrogrado para dispersar o Soviete. Em pânico, Kerensky rotula Kornilov de traidor e distribui fuzis aos Guardas Vermelhos bolcheviques."
 ww1_russia.20.a:0 "Ferroviários sabotam os trens de Kornilov!"
 ww1_russia.20.b:0 "Cavalaria de Kornilov cerca Petrogrado!"
 SOV_kornilov_fails_tt:0 "Os bolcheviques tornam-se senhores da capital."
 SOV_kornilov_succeeds_tt:0 "O General Kornilov instaura a ditadura militar."

 ww1_russia.30.t:0 "Negociações Secretas Willy-Nicky"
 ww1_russia.30.d:0 "Emissários de confiança entre Guilherme II e Nicolau II debatem uma paz em separado honrosa e defesa mútua contra a supremacia marítima ocidental."
 ww1_russia.30.a:0 "Ouvir a proposta de Berlim."

 ww1_russia.40.t:0 "A Paz de Brest-Litovsk"
 ww1_russia.40.d:0 "Delegações da Rússia e dos Poderes Centrais concluem o draconiano tratado de Brest-Litovsk. A Rússia retira-se da Grande Guerra, reconhecendo a independência da Ucrânia, Finlândia e Báltico."
 ww1_russia.40.a:0 "Assinar o tratado. Necessitamos de uma trégua."
ww1_russia.50.t:0 "A Grande Crise de Projéteis: Snaryadny Golod"
 ww1_russia.50.d:0 "Os combates violentos dos primeiros meses de guerra consumiram completamente os estoques pré-guerra de munição. Baterias de artilharia estão racionadas a dois ou três disparos diários. A infantaria russa nas trincheiras suporta massacrantes bombardeios alemães e austro-húngaros sem poder revidar."
 ww1_russia.50.a:0 "Nossas baterias estão em silêncio..."
 SOV_shell_shortage_crisis_tt:0 "O ataque da artilharia e a eficácia de combate russa são drasticamente reduzidos até que a indústria e as importações sejam mobilizadas."
 ww1_russia.51.t:0 "A Queda de Sukhomlinov & O Ministério Polivanov"
 ww1_russia.51.d:0 "A fúria pública pela falta de munições e os desastres do Grande Recuo forçaram Nicolau II a demitir o desonrado Ministro da Guerra, Vladimir Sukhomlinov. O General Alexei Polivanov assume a pasta, buscando de imediato a Duma e criando o Conselho Especial de Defesa do Estado."
 ww1_russia.51.a:0 "Reformar o Ministério e cooperar com os Zemstvos!"
 SOV_polivanov_appointed_tt:0 "O General Polivanov substitui Sukhomlinov. A paralisia de comando e as penalidades de planejamento são amplamente aliviadas."

 # Pre-Revolutionary Crisis Dashboard & Decisions
 SOV_revolutionary_crisis_category:0 "Painel da Crise Pré-Revolucionária"
 SOV_revolutionary_crisis_category_desc:0 "§HEstado da Crise Interna:§!\n§YTensão Revolucionária:§! [?SOV_revolutionary_tension|0%]\n§YAgitação Operária:§! [?SOV_worker_unrest|0%]\n§YFome Urbana:§! [?SOV_urban_hunger|0%]\n§YLealdade do Exército:§! [?SOV_army_loyalty|0%]\n\n§R[████████░░] [?SOV_revolutionary_tension|0%]§!"
 SOV_crisis_tension_bar_tt:0 "§R[████████░░] [?SOV_revolutionary_tension|0%]§!"
 SOV_crisis_emergency_grain_requisitions:0 "Requisições Emergenciais de Grãos"
 SOV_crisis_emergency_grain_requisitions_desc:0 "Forçar requisições de grãos no campo para alimentar os operários famintos em Petrogrado e Moscou."
 SOV_crisis_bread_price_subsidies:0 "Subsídios ao Preço do Pão"
 SOV_crisis_bread_price_subsidies_desc:0 "Subsidiar padarias e transporte de cereais usando o tesouro estatal para baratear o pão nos centros urbanos."
 SOV_crisis_okhrana_sweeps:0 "Operações da Okhrana Contra Agitadores"
 SOV_crisis_okhrana_sweeps_desc:0 "Ordenar à polícia secreta Okhrana a prisão de agitadores bolcheviques e invasão de gráficas clandestinas."
 SOV_crisis_imperial_frontline_tour:0 "Visita Imperial à Frente de Batalha"
 SOV_crisis_imperial_frontline_tour_desc:0 "O Tsar visita as trincheiras do front e inspeciona batalhões para revitalizar a lealdade monárquica entre as tropas."

 # Pre-Revolutionary Crisis Events
 ww1_russia.300.t:0 "Lenin Chega pelo Trem Selado"
 ww1_russia.300.d:0 "Facilitado pelo Estado-Maior Alemão em uma ousada operação de guerra política, Vladimir Ilyich Lenin e sua comitiva bolchevique cruzaram a Europa em um vagão selado, desembarcando na Estação Finlândia em Petrogrado sob aclamação de marinheiros e operários."
 ww1_russia.300.a:0 "Todo poder aos Sovietes!"
 SOV_lenin_returned_tt:0 "Vladimir Lenin retornou a Petrogrado. A subversão revolucionária ganha enorme impulso."

 ww1_russia.301.t:0 "Lenin Retorna a Petrogrado"
 ww1_russia.301.d:0 "Contornando os postos de fronteira por rotas clandestinas, Vladimir Lenin chega a Petrogrado para liderar diretamente a agitação revolucionária bolchevique."
 ww1_russia.301.a:0 "Paz, Terra e Pão!"

 ww1_russia.305.t:0 "O Triunfo da Ordem"
 ww1_russia.305.d:0 "Através de rigorosa administração estatal, socorro social oportuno e lealdade inabalável das forças armadas, as autoridades imperiais resistiram à tempestade da revolta revolucionária. A ordem reina sobre o Império."
 ww1_russia.305.a:0 "Deus Salve o Tsar!"
 SOV_order_restored_tt:0 "A agitação revolucionária foi desmantelada. A estabilidade imperial está restaurada."

 ww1_russia.310.t:0 "A Tomada do Palácio de Inverno"
 ww1_russia.310.d:0 "A crise atinge o ponto de ruptura! Operários armados e soldados radicalizados cercam e tomam o Palácio de Inverno. Os ministros são presos enquanto a velha ordem desmorona diante do triunfo revolucionário!"
 ww1_russia.310.a:0 "A Revolução triunfou!"
 SOV_revolution_triggered_tt:0 "O limiar revolucionário foi ultrapassado. A revolução explode!"

 # Civil War Eruption Events
 ww1_russia_civil_war.1.t:0 "Eclode a Guerra Civil Russa"
 ww1_russia_civil_war.1.d:0 "A tomada do Palácio de Inverno despedaçou o Império Russo em facções ideológicas em armas. Em Petrogrado e Moscou, Vladimir Lenin e o Conselho dos Comissários do Povo proclamam o poder soviético e mobilizam o Exército Vermelho. Pela Sibéria, Urais e Sul, generais brancos e atamans cossacos erguem regimentos lealistas para esmagar os bolcheviques. Ao mesmo tempo, movimentos nacionais na Ucrânia, Finlândia, Polônia e Cáucaso declaram independência, mergulhando o antigo império em uma luta sangrenta em múltiplas frentes."
 ww1_russia_civil_war.1.a:0 "Todo o poder aos Sovietes! Avante, Guardas Vermelhos!"
 ww1_russia_civil_war.1.b:0 "Por uma Rússia Una e Indivisível! Os Brancos se levantam!"
 SOV_fleet_split_tt:0 "§YDivisão Naval:§! A Frota do Báltico jura lealdade aos sovietes; a Frota do Mar Negro apoia o Exército Branco."
 SOV_stockpile_split_tt:0 "§YPartilha de Arsenais:§! Depósitos imperiais são divididos entre as facções em conflito."
 SOV_play_reds_tt:0 "Jogar como a §RRússia Soviética§! (SOV)."
 SOV_play_whites_tt:0 "Mudar perspectiva para comandar a §RRússia Branca§! (WHT)."

 # Soviet Civil War Management Decisions
 SOV_civil_war_management:0 "Administração da Guerra Civil Soviética"
 SOV_civil_war_management_desc:0 "Medidas emergenciais de tempo de guerra para salvaguardar o poder soviético, alimentar os operários urbanos e suprir o Exército Vermelho."
 SOV_seize_kazan_gold_reserves:0 "Confiscar as Reservas de Ouro de Cazã"
 SOV_seize_kazan_gold_reserves_desc:0 "Assegurar os lingotes de ouro do Banco Imperial depositados nos cofres de Cazã para financiar a produção industrial e compras estatais de emergência."
 SOV_prodrazvyorstka_grain_expeditions:0 "Expedições de Prodrazvyorstka"
 SOV_prodrazvyorstka_grain_expeditions_desc:0 "Enviar destacamentos armados de operários ao campo para confiscar cotas de grãos e garantir o abastecimento de rações nas frentes de combate."
 SOV_mobilize_petrograd_workers:0 "Mobilizar os Operários de Petrogrado"
 SOV_mobilize_petrograd_workers_desc:0 "Convocar trabalhadores das fábricas Putilov e dos estaleiros bálticos em batalhões armados para reforçar setores ameaçados."
 SOV_trotsky_armored_train_inspection:0 "Inspeção do Trem Blindado de Trotsky"
 SOV_trotsky_armored_train_inspection_desc:0 "O Comissário da Guerra Leon Trotsky percorre as frentes a bordo de seu trem blindado para restaurar a disciplina, insuflar o fervor revolucionário e conter recuos."

 # Brest-Litovsk & Soviet Diplomacy Events
 ww1_russia_diplomacy.1.t:0 "Sondas Soviéticas de Paz em Brest-Litovsk"
 ww1_russia_diplomacy.1.d:0 "O recém-formado Conselho dos Comissários do Povo proclamou o Decreto sobre a Paz, apelando para a cessação imediata das hostilidades. Emissários liderados por Adolf Joffe chegaram ao quartel-general alemão em Brest-Litovsk em busca de um armistício. O Marechal von Hindenburg e o General Ludendorff apresentam nossa escolha: ditar severos termos territoriais despojando a Rússia de suas províncias ocidentais, ou retomar o avanço rumo ao leste."
 ww1_russia_diplomacy.1.a:0 "Ditar nossos termos! Cedam as terras fronteiriças ou enfrentem a destruição!"
 ww1_russia_diplomacy.1.b:0 "Recusar negociações! O exército alemão marchará até Petrogrado!"
 GER_dictate_brest_litovsk_tt:0 "Apresentar um ultimato exigindo a independência e cessão da Polônia, Lituânia e Ucrânia."
 GER_refuse_peace_talks_tt:0 "As hostilidades prosseguem sem trégua por toda a Frente Oriental."

 ww1_russia_diplomacy.2.t:0 "O Ultimato Alemão: O Tratado de Brest-Litovsk"
 ww1_russia_diplomacy.2.d:0 "Em Brest-Litovsk, a delegação alemã liderada pelo General Max Hoffmann impôs um ultimato de ferro. A Rússia deve renunciar à soberania sobre a Polônia, Lituânia, Curlândia e reconhecer a independência ucraniana e finlandesa. A liderança bolchevique divide-se profundamente: Lenin exige aceitar a 'paz vergonhosa' para salvar o poder soviético, Bukharin clama por guerra revolucionária e Trotsky proclama 'nem guerra, nem paz'."
 ww1_russia_diplomacy.2.a:0 "Assinar o Tratado. A República Soviética necessita de fôlego!"
 ww1_russia_diplomacy.2.b:0 "Nem guerra, nem paz! Trotsky abandona as negociações!"
 SOV_brest_litovsk_signed_tt:0 "Concluir paz branca imediata com as Potências Centrais. A Alemanha assegura entregas de grãos e matérias-primas."
 SOV_trotsky_walkout_tt:0 "Trotsky denuncia as anexações imperialistas e se retira, deixando a frente aberta ao avanço alemão."

 ww1_russia_diplomacy.3.t:0 "Operação Faustschlag: A Ofensiva de Primavera Alemã"
 ww1_russia_diplomacy.3.d:0 "Diante da recusa soviética em assinar o tratado, o Alto Comando Alemão desencadeou a Operação Faustschlag — o 'Golpe de Punho'. Com o antigo exército russo desintegrado e os Guardas Vermelhos oferecendo apenas fraca resistência, cinquenta divisões alemãs avançam sobre as linhas férreas em velocidade vertiginosa, capturando Dvinsk, Minsk e Kiev."
 ww1_russia_diplomacy.3.a:0 "Avante sobre os trilhos! Nada deterá o avanço alemão!"

 ww1_russia_diplomacy.4.t:0 "A Frente Desmorona: Faustschlag Arrasa o Leste"
 ww1_russia_diplomacy.4.d:0 "O avanço alemão é imparável. Colunas germânicas varrem a Ucrânia, Bielorrússia e Estônia em trens blindados. Com as vanguardas do Kaiser a poucos dias de Petrogrado, a facção de Lenin força uma votação emergencial: aceitar termos ainda mais humilhantes agora, ou sucumbir ante a invasão militar."
 ww1_russia_diplomacy.4.a:0 "Assinar a paz imediatamente! Não temos exército para resistir!"
 ww1_russia_diplomacy.4.b:0 "Lutar até o último proletário! Nenhuma rendição ao Kaiser!"
 SOV_faustschlag_capitulation_tt:0 "Capitular às exigências alemãs sob fogo. Sai da guerra contra as Potências Centrais."

 ww1_russia_diplomacy.20.t:0 "O Colapso de Brest-Litovsk"
 ww1_russia_diplomacy.20.d:0 "Com a rendição e o armistício do Império Alemão no Ocidente, o draconiano Tratado de Brest-Litovsk é formalmente anulado! As autoridades soviéticas em Moscou declararam o tratado nulo, enquanto guarnições alemãs se retiram da Ucrânia, Bielorrússia e Báltico. Um vasto vácuo de poder se abre pelo Leste Europeu, convidando o avanço do Exército Vermelho."
 ww1_russia_diplomacy.20.a:0 "O tratado imperialista foi rasgado em pedaços! Rumo ao Vístula!"
 ww1_russia_diplomacy.20.b:0 "Nosso domínio oriental desaba em ruínas..."
 ww1_russia_diplomacy.20.c:0 "A hegemonia alemã no Leste Europeu evaporou-se."
 SOV_target_vistula_reclamation_tt:0 "O Tratado de Brest-Litovsk foi dissolvido! Inicia-se a reconquista soviética para o oeste."

 # Soviet & White Diplomacy Decisions
 SOV_soviet_diplomacy:0 "Diplomacia Externa Soviética"
 SOV_soviet_diplomacy_desc:0 "Manobras diplomáticas, decretos de paz e política externa revolucionária do Conselho dos Comissários do Povo."
 SOV_decree_on_peace:0 "Proclamar o Decreto sobre a Paz"
 SOV_decree_on_peace_desc:0 "Emitir um apelo a todas as nações beligerantes por uma paz democrática imediata sem anexações ou indenizações, abrindo negociações diretas com Berlim."

 WHT_entente_aid_category:0 "Assistência Externa da Entente"
 WHT_entente_aid_category_desc:0 "Missões militares aliadas, carregamentos de munições e apoio logístico às Forças Armadas Brancas na luta por uma Rússia Una e Indivisível."
 WHT_general_knox_british_mission:0 "Missão Militar Britânica do General Knox"
 WHT_general_knox_british_mission_desc:0 "O General Alfred Knox coordena o envio de centenas de milhares de fuzis Lee-Enfield, metralhadoras, uniformes e instrutores militares para equipar os exércitos lealistas na Sibéria."
 WHT_french_odessa_naval_aid:0 "Comboios Navais Franceses em Odessa"
 WHT_french_odessa_naval_aid_desc:0 "Esquadras francesas no Mar Negro descarregam munições, suprimentos médicos e suporte logístico no porto de Odessa para reforçar os Brancos no Sul."
 WHT_vladivostok_allied_lend_lease:0 "Remessas Aliadas via Vladivostok"
 WHT_vladivostok_allied_lend_lease_desc:0 "Navios americanos e japoneses descarregam maquinário industrial pesado, peças ferroviárias e armas leves através do Pacífico em Vladivostok."

 # German Brest-Litovsk Ideas
 GER_brest_litovsk_deliveries:0 "Entregas de Grãos e Recursos de Brest-Litovsk"
 GER_brest_litovsk_deliveries_desc:0 "Remessas maciças de trigo ucraniano, manganês e matérias-primas fluem para o oeste conforme as cláusulas do tratado, aliviando o bloqueio naval britânico."
 GER_operation_faustschlag:0 "Operação Faustschlag"
 GER_operation_faustschlag_desc:0 "A ofensiva ferroviária implacável sobre a Frente Oriental em colapso, varrendo a resistência bolchevique desorganizada."
