l_braz_por:
 ww1_russia.1.t:0 "Atentado contra Stolypin na Ópera de Kiev"
 ww1_russia.1.d:0 "Durante uma récita de gala na Ópera de Kiev na presença do Czar, o revolucionário Dmitry Bogrov disparou dois tiros contra o Primeiro-Ministro Pyotr Stolypin. O estadista tombou em sua cadeira, fazendo o sinal da cruz em direção ao camarote imperial."
 ww1_russia.1.a:0 "Stolypin sucumbe aos ferimentos dias depois..."
 ww1_russia.1.b:0 "Milagrosamente, a bala desvia em sua condecoração!"
 SOV_stolypin_dies_tt:0 "Pyotr Stolypin morre. O ímpeto reformista é paralisado."
 SOV_stolypin_survives_tt:0 "Stolypin sobrevive e consolida sua autoridade."

 ww1_russia.5.t:0 "Mobilização Geral do Exército Imperial"
 ww1_russia.5.d:0 "O Imperador de todas as Rússias assinou o decreto de mobilização geral. Sinos repicam em todas as aldeias da Polônia ao Pacífico enquanto milhões de camponeses se apresentam às guarnições."
 ww1_russia.5.a:0 "Por Deus, pelo Czar e pela Pátria!"
 SOV_general_mobilization_tt:0 "Mais de cinco milhões de soldados iniciam a mobilização."

 ww1_russia.10.t:0 "Eclodem os Motins do Pão em Petrogrado"
 ww1_russia.10.d:0 "Nevascas impiedosas, desabastecimento de trigo e filas intermináveis levaram centenas de milhares de operários às ruas de Petrogrado clamando por 'Pão e Paz!'."
 ww1_russia.10.a:0 "A ordem deve ser restabelecida na capital!"

 ww1_russia.11.t:0 "A Abdicação de Nicolau II"
 ww1_russia.11.d:0 "Retido em seu trem imperial em Pskov, Nicolau II reúne-se com emissários da Duma. Convencido por seus generais de que somente sua renúncia pode preservar o exército e evitar a guerra civil, o Czar assina o manifesto."
 ww1_russia.11.a:0 "Aceitar a abdicação por si e por seu filho Alexei."
 ww1_russia.11.b:0 "Recusar! A autocracia só responde perante Deus!"
 SOV_abdication_accepted_tt:0 "A dinastia Romanov chega ao fim. O Governo Provisório assume."
 SOV_tsar_resists_tt:0 "O Czar convoca tropas leais do front para marchar sobre a capital."

 ww1_russia.15.t:0 "Kerensky Assume a Liderança do Governo"
 ww1_russia.15.d:0 "Com a renúncia do Príncipe Lvov, Alexander Kerensky assume a presidência do gabinete, buscando reconciliar a democracia revolucionária com o dever no front."
 ww1_russia.15.a:0 "Avançar para a defesa revolucionária da República!"

 ww1_russia.20.t:0 "O Caso Kornilov"
 ww1_russia.20.d:0 "O Comandante Supremo General Lavr Kornilov despacha o 3º Corpo de Cavalaria rumo a Petrogrado para dispersar o Soviete. Em pânico, Kerensky rotula Kornilov de traidor e distribui fuzis aos Guardas Vermelhos bolcheviques."
 ww1_russia.20.a:0 "Ferroviários sabotam os trens de Kornilov!"
 ww1_russia.20.b:0 "Cavalaria de Kornilov cerca Petrogrado!"
 SOV_kornilov_fails_tt:0 "Os bolcheviques tornam-se senhores da capital."
 SOV_kornilov_succeeds_tt:0 "O General Kornilov instaura a ditadura militar."

 ww1_russia.30.t:0 "Negociações Secretas Willy-Nicky"
 ww1_russia.30.d:0 "Emissários de confiança entre Guilherme II e Nicolau II debatem uma paz em separado honrosa e defesa mútua contra a supremacia marítima ocidental."
 ww1_russia.30.a:0 "Ouvir a proposta de Berlim."

 ww1_russia.40.t:0 "A Paz de Brest-Litovsk"
 ww1_russia.40.d:0 "Delegações da Rússia e dos Poderes Centrais concluem o draconiano tratado de Brest-Litovsk. A Rússia retira-se da Grande Guerra, reconhecendo a independência da Ucrânia, Finlândia e Báltico."
 ww1_russia.40.a:0 "Assinar o tratado. Necessitamos de uma trégua."
