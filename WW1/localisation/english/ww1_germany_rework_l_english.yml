l_english:
 GER_schlieffen_maneuver:0 "[Historical] Fused Schlieffen Maneuver"
 GER_schlieffen_maneuver_desc:0 "There can be no hesitation. As the French and Russian armies mobilize, our mighty right wing must surge forward through Luxembourg and Belgium in a swift, devastating wheeling envelopment. We shall bypass the formidable fortress belt of the Meuse and strike deep into the French interior before British and Russian reinforcements can alter the balance of power."
 GER_schlieffen_momentum:0 "Schlieffen Offensive Momentum"
 GER_schlieffen_momentum_desc:0 "The German advance sweeps across the low countries with relentless tempo. Forward supply depots, specialized assault pioneers, and aggressive staff work maintain maximum offensive pressure on the reeling enemy."
 GER_western_trench_stalemate:0 "Western Trench Stalemate"
 GER_western_trench_stalemate_desc:0 "The war of mobile maneuvers has frozen into a bloody subterranean deadlock. Thousands of kilometers of barbed wire, concrete pillboxes, and interlocking machine-gun redoubts stretch from Switzerland to the North Sea."
 GER_krupp_siege_guns:0 "Krupp Heavy Siege Howitzers"
 GER_krupp_siege_guns_desc:0 "The industrial foundries of Friedrich Krupp AG produce the most destructive heavy artillery in the world, including the colossal 420mm \"Big Bertha\" mortars capable of pulverizing modern reinforced concrete fortresses in hours."
 GER_thyssen_steel_syndicate:0 "Thyssen Heavy Steel Syndicate"
 GER_thyssen_steel_syndicate_desc:0 "August Thyssen's industrial steel cartel coordinates the blast furnaces and rolling mills of the Ruhr Valley, delivering an uninterrupted stream of high-grade steel for heavy shells, armor plating, and trench fortifications."
 GER_haber_bosch_synthesis:0 "Haber-Bosch Nitrogen Synthesis"
 GER_haber_bosch_synthesis_desc:0 "Fritz Haber and Carl Bosch at BASF have achieved the synthetic fixation of atmospheric nitrogen. Deprived of Chilean saltpetre by the British blockade, German munitions factories now synthesize nitrates directly from thin air, guaranteeing limitless explosives production."
 GER_buna_rubber:0 "Buna Synthetic Rubber"
 GER_buna_rubber_desc:0 "Through groundbreaking chemical polymer synthesis at Bayer, our chemists have developed Buna synthetic rubber, overcoming the Entente's blockade on natural rubber and ensuring vehicle tires, gas masks, and aircraft fuel lines remain fully supplied."
 GER_hindenburg_program:0 "The Hindenburg Program"
 GER_hindenburg_program_desc:0 "Enacted by Field Marshal von Hindenburg and General Ludendorff, this radical war economy program subjugates the entire civilian economy, ruthlessly directing all industrial capacity, raw materials, and labor toward tripling artillery and munitions output."
 GER_fokker_scourge_spirit:0 "The Fokker Air Scourge"
 GER_fokker_scourge_spirit_desc:0 "Equipped with Anthony Fokker's synchronization gear allowing machine guns to fire through the propeller arc, German monoplanes rule the skies over the Western Front, shooting down Allied observation craft with devastating impunity."
 GER_operation_gericht:0 "Operation Gericht (Verdun)"
 GER_operation_gericht_desc:0 "General von Falkenhayn's calculated offensive to bleed the French Army white at the historic fortress complex of Verdun. By menacing a position of sacred national honor, France will be forced to throw every division into a meat grinder of superior German artillery."
 GER_gorlice_tarnow_breakthrough:0 "Gorlice-Tarnów Breakthrough"
 GER_gorlice_tarnow_breakthrough_desc:0 "Under General August von Mackensen, the Eleventh Army concentrates unprecedented artillery fire on the Austro-Russian border. A violent rupture of the Russian lines will trigger the Great Retreat of the Czar's forces across Poland."
 GER_chlorine_gas_release:0 "Deploy Chlorine Gas at Ypres"
 GER_chlorine_gas_release_desc:0 "Pioneered by Fritz Haber, thousands of pressurized cylinders of lethal chlorine gas are opened along the front line. Carried by the prevailing wind, the suffocating greenish-yellow cloud will dissolve enemy trenches and shatter Allied morale."
 GER_phosgene_gas_shells:0 "Synthesize Phosgene Artillery Shells"
 GER_phosgene_gas_shells_desc:0 "Six times more lethal than chlorine and largely invisible, phosgene gas delivered directly by artillery shells penetrates standard respirators, causing insidious delayed pulmonary trauma behind enemy lines."
 GER_mustard_gas_deployment:0 "Mass Deployment of Yellow Cross (Mustard Gas)"
 GER_mustard_gas_deployment_desc:0 "Dichlorethyl sulphide, known as Yellow Cross or Lost, is a persistent blistering agent that contaminates mud, foliage, and trenches for weeks, burning through uniforms and blinding soldiers who dare traverse the sector."
 GER_operation_alberich:0 "Operation Alberich (Strategic Retreat)"
 GER_operation_alberich_desc:0 "A masterful, methodical strategic withdrawal of the Western Army to the shortened, fortified Siegfried Stellung (Hindenburg Line). The evacuated salient is subjected to total scorched earth, trapping Allied armies in a barren logistical wasteland."
 GER_kriegsanleihen:0 "Issue War Bonds (Kriegsanleihen)"
 GER_kriegsanleihen_desc:0 "Floating domestic war loans to mobilize the savings of the German public. Every mark loaned to the Imperial Treasury finances heavy industry and munitions, though it mortgages our financial future against complete military victory."
 GER_ploiesti_oil:0 "Secure the Ploiești Oil Fields"
 GER_ploiesti_oil_desc:0 "Following the defeat of Romania, German engineers and salvage battalions take direct control of the oil refineries and drilling rigs around Ploiești, securing vital petroleum to fuel our U-boats, zeppelins, and truck transports."
 GER_uboat_cruiser_rules:0 "U-Boat Posture: Prize Law (Cruiser Rules)"
 GER_uboat_cruiser_rules_desc:0 "Submarines surface to inspect merchantmen and permit crews to take to lifeboats before sinking contraband vessels, minimizing friction with neutral powers like the United States at the expense of U-boat vulnerability."
 GER_uboat_declared_war_zone:0 "U-Boat Posture: Declared War Zone"
 GER_uboat_declared_war_zone_desc:0 "The waters surrounding the British Isles are declared a war zone. Any Entente merchant vessel found within the perimeter is liable to be torpedoed without warning, accelerating tonnage sunk while elevating American diplomatic vigilance."
 GER_uboat_unrestricted_warfare:0 "U-Boat Posture: Unrestricted Submarine Warfare"
 GER_uboat_unrestricted_warfare_desc:0 "All shipping, belligerent or neutral, sailing toward the ports of Great Britain will be sunk on sight without warning. Admiral von Holtzendorff promises to starve Britain into submission within six months, even at the grave peril of bringing the United States into the war."
 GER_fokker_scourge:0 "Unleash the Fokker Scourge"
 GER_fokker_scourge_desc:0 "Deploy the Fokker E.I armed with synchronization gears to Jagdstaffel squadrons across the Western Front, granting German aviators unquestioned aerial supremacy over the skies of Flanders and Champagne."
 GER_zeppelin_raids_london:0 "Zeppelin Strategic Raids on London"
 GER_zeppelin_raids_london_desc:0 "Dispatch massive naval airships across the North Sea in nocturnal bombing raids against the British capital. The psychological shock and physical devastation will force Britain to retain fighter squadrons and anti-aircraft batteries on home soil."
 GER_deutsch_ostafrika_guerrilla:0 "Paul von Lettow-Vorbeck's East African Campaign"
 GER_deutsch_ostafrika_guerrilla_desc:0 "In German East Africa, Colonel Paul von Lettow-Vorbeck and his fiercely loyal Askari Schutztruppe wage an asymmetrical guerrilla campaign across bush and jungle, tying down hundreds of thousands of British, South African, and Indian troops."
 GER_support_easter_rising:0 "Support the Irish Easter Rising (1916)"
 GER_support_easter_rising_desc:0 "Smuggle captured Russian rifles, machine guns, and ammunition aboard the disguised merchant vessel SMS Libau to Roger Casement and the Irish Volunteers in Dublin, striking at the heart of the British Empire."
 GER_ghadar_conspiracy:0 "Fund the Ghadar Conspiracy in India"
 GER_ghadar_conspiracy_desc:0 "Provide financial subsidies and clandestine arms shipments through diplomatic channels in the United States and Southeast Asia to the revolutionary Ghadar Party, fomenting mutiny among Indian troops of the British Raj."
 GER_spartakist_uprising:0 "Crush the Spartakist Uprising (1919)"
 GER_spartakist_uprising_desc:0 "Radical communists and revolutionary shop stewards led by Karl Liebknecht and Rosa Luxemburg have occupied newspaper offices and government buildings in Berlin. Deploy loyal Freikorps units under Gustav Noske to restore order."
 GER_baltic_freikorps_defense:0 "Baltic Freikorps Defense (Baltikumer)"
 GER_baltic_freikorps_defense_desc:0 "Under Major General Rüdiger von der Goltz, volunteer veteran divisions—the Iron Division and the Baltic Landwehr—mobilize across Courland and Livonia to defend the Baltic frontier and East Prussia from the advancing Red Army."
 GER_suppress_ruhr_red_army:0 "Suppress the Red Ruhr Army"
 GER_suppress_ruhr_red_army_desc:0 "Armed communist insurgencies in the Ruhr basin threaten the industrial heartland. Coordinate Freikorps battalions to disarm the Red Ruhr Army and restore stability."
 GER_chemical_warfare_program:0 "Imperial Chemical Warfare Program"
 GER_chemical_warfare_program_desc:0 "Coordinate industrial synthesis and battlefield deployment of chemical weapons developed by the Kaiser Wilhelm Institute for Physical Chemistry."
 GER_naval_warfare_category:0 "Battle of the Atlantic & Submarine Warfare"
 GER_naval_warfare_category_desc:0 "Manage submarine operational postures, trade interdiction, and diplomatic friction with neutral shipping in the Atlantic."
 GER_high_command_operations:0 "OHL Frontline Operations"
 GER_high_command_operations_desc:0 "Execute decisive high-command military offensives and operational breakthroughs coordinated by the General Staff."
 GER_air_warfare_category:0 "Imperial Air Service (Luftstreitkräfte)"
 GER_air_warfare_category_desc:0 "Deploy advanced fighter aircraft, recruit legendary aviation aces, and execute strategic airship raids."
 GER_war_economy_category:0 "War Economy & Strategic Logistics"
 GER_war_economy_category_desc:0 "Mobilize financial war bonds, strategic raw materials, and emergency withdrawals to sustain the Kaiserreich's war effort."
 GER_weimar_and_freikorps_category:0 "Weimar Republic & Freikorps Defense"
 GER_weimar_and_freikorps_category_desc:0 "Direct emergency security operations, Freikorps volunteers, and post-war containment against radical revolts."
 GER_caporetto_mountain_shock:0 "Caporetto Mountain Offensive"
 GER_caporetto_mountain_shock_desc:0 "Deploy stormtrooper mountain corps under Erwin Rommel and Otto von Below to rout the Italian Second Army along the Isonzo."
 GER_kaiserschlacht_spring_offensive:0 "Kaiserschlacht (Spring 1918 Offensive)"
 GER_kaiserschlacht_spring_offensive_desc:0 "The ultimate gamble: transfer millions of veteran troops from the East to launch a hurricane bombardment and stormtrooper breakthrough on the Somme."
 GER_manfred_von_richthofen:0 "Manfred von Richthofen"
 GER_manfred_von_richthofen_desc:0 "The \"Red Baron\", the deadliest fighter ace of the Great War and commander of Jagdgeschwader 1 (The Flying Circus)."
 GER_oswald_boelcke:0 "Oswald Boelcke"
 GER_oswald_boelcke_desc:0 "A father of modern air combat tactics, author of the Dicta Boelcke doctrine, and mentor to Germany's greatest fighter pilots."
 GER_ernst_udet:0 "Ernst Udet"
 GER_ernst_udet_desc:0 "A daring second-highest scoring German ace, renowned for precision aerobatics and aggressive aerial marksmanship."
 BAT:0 "United Baltic Duchy"
 BAT_DEF:0 "The United Baltic Duchy"
 BAT_ADJ:0 "Baltic"
 ww1_germany_endsieg.1.t:0 "The Collapse of the Western Wall & The Nation at the Precipice"
 ww1_germany_endsieg.1.d:0 "The Allied armies have forced the crossing of the Rhine and penetrated deep into our industrial heartland. In Berlin, the Reichstag is gripped by panic, and the High Command stands at an agonizing crossroads. We must decide whether to sign an immediate armistice under the harsh terms of the Entente, preserving the nation as a republic, or refuse all compromise and wage a fight to the bitter end—an unconditional Endsieg!"
 ww1_germany_endsieg.1.a:0 "Accept the Armistice and the Treaty of Versailles"
 ww1_germany_endsieg.1.b:0 "Not an inch of German soil! Fight to the Bitter End (Endsieg)!"
 ww1_germany.10.t:0 "Stabilization of the Western Front: The Trench War Begins"
 ww1_germany.10.d:0 "The rapid war of movement has ground to a halt. Despite breathtaking operational triumphs and the valor of our troops, Paris remains uncaptured. Both sides now dig furiously into the chalk and mud, stringing hundreds of miles of barbed wire from the Swiss border to the English Channel. The era of glorious maneuver is dead; the era of industrialized attrition has begun."
 ww1_germany.10.a:0 "Entrench every meter of the line."
 ww1_germany_naval.1.t:0 "The Zimmermann Telegram"
 ww1_germany_naval.1.d:0 "Foreign Secretary Arthur Zimmermann has drafted an audacious coded proposal for the government of Mexico: in exchange for military alliance and attacking the United States should America enter the European conflict, Germany offers financial support and the recovery of Mexico's lost territories in Texas, New Mexico, and Arizona."
 ww1_germany_naval.1.a:0 "Dispatch the telegram to Mexico City."
 ww1_germany_naval.1.b:0 "Do not risk American outrage; cancel the dispatch."
 ww1_germany_naval.2.t:0 "A Secret Proposal from Berlin"
 ww1_germany_naval.2.d:0 "The German Imperial government proposes an alliance with Mexico in the event of war with the United States, promising funding and the restoration of lost territories in Texas, New Mexico, and Arizona."
 ww1_germany_naval.2.a:0 "The proposal is unfeasible and perilous; decline."
 ww1_germany_naval.3.t:0 "The Zimmermann Telegram Exposed!"
 ww1_germany_naval.3.d:0 "British naval intelligence (Room 40) has intercepted and decrypted our diplomatic telegram, handing the plaintext to American President Woodrow Wilson. American newspapers are inflamed with fury, bringing the United States to the brink of entering the war."
 ww1_germany_naval.3.a:0 "A diplomatic catastrophe."
 GER_endsieg_total_militarization:0 "[Emergency] Total Militarization"
 GER_endsieg_total_militarization_desc:0 "All constitutional restrictions are discarded. Every factory, school, and workshop is placed under martial administration to funnel every resource to the front."
 GER_endsieg_scraping_the_barrel:0 "[Emergency] Scraping the Barrel"
 GER_endsieg_scraping_the_barrel_desc:0 "Conscript every remaining able-bodied soul across the Empire. No exemptions, no deferments—the Fatherland requires all hands on the ramparts."
 GER_endsieg_war_economy_requisitions:0 "[Emergency] War Economy Requisitions"
 GER_endsieg_war_economy_requisitions_desc:0 "Confiscate private metals, machinery, and non-essential civilian vehicles. Industrial production is focused exclusively on heavy armaments and ammunition."
 GER_endsieg_underground_factories:0 "[Emergency] Underground War Plants"
 GER_endsieg_underground_factories_desc:0 "Move tooling and assembly lines deep into mineshafts, railway tunnels, and limestone caverns to remain completely impervious to Entente bombardment."
 GER_endsieg_wonder_weapons_program:0 "[Emergency] Wonder Weapons Drive"
 GER_endsieg_wonder_weapons_program_desc:0 "Pour resources into radical engineering breakthroughs: colossal Paris guns, armored trench-breakers, and persistent chemical compounds to reverse the tide."
 GER_endsieg_volkssturm_call:0 "[Emergency] Volkssturm Mobilization"
 GER_endsieg_volkssturm_call_desc:0 "Decree the creation of the Volkssturm. Every male from sixteen to sixty years of age must report immediately to defend their cities and hearths."
 GER_endsieg_berlin_levee_en_masse:0 "[Emergency] Berlin Levée en Masse"
 GER_endsieg_berlin_levee_en_masse_desc:0 "Rally the citizens of Berlin to fortify the Imperial Capital. Barricades rise on every boulevard as thousands take up arms in unified defiance."
 GER_endsieg_landsturm_battalions:0 "[Emergency] Landsturm Rhine Battalions"
 GER_endsieg_landsturm_battalions_desc:0 "Form territorial Landsturm infantry formations to man the second and third defensive lines along the river crossings and forest paths."
 GER_endsieg_youth_and_veteran_auxiliaries:0 "[Emergency] Youth and Veteran Auxiliaries"
 GER_endsieg_youth_and_veteran_auxiliaries_desc:0 "Brigades of young recruits and grey-haired veterans of 1870 stand shoulder-to-shoulder, maintaining supply lines and manning defensive perimeter posts."
 GER_endsieg_iron_determination:0 "[Emergency] Iron National Determination"
 GER_endsieg_iron_determination_desc:0 "Ignite an incandescent flame of national resolve. Defeat is not an option; the nation shall endure through unbending willpower."
 GER_endsieg_rhine_line_proclamation:0 "[Emergency] Proclamation of the Rhine Line"
 GER_endsieg_rhine_line_proclamation_desc:0 "The Rhine is declared the sacred barrier of Germany. Not a single enemy division shall cross without paying a staggering price in blood."
 GER_endsieg_fortify_the_ruhr:0 "[Emergency] Fortify the Ruhr Citadel"
 GER_endsieg_fortify_the_ruhr_desc:0 "Turn the foundries, mines, and blast furnaces of Essen and Dortmund into an interconnected fortress complex bristling with machine guns and heavy artillery."
 GER_endsieg_blow_the_bridges:0 "[Emergency] Demolish the Rhine Bridges"
 GER_endsieg_blow_the_bridges_desc:0 "Dynamite every bridge across the Rhine from Switzerland to the Dutch border, trapping enemy spearheads on the far bank in crossfire."
 GER_endsieg_siegfriedstellung_redoubt:0 "[Emergency] Siegfriedstellung Redoubt"
 GER_endsieg_siegfriedstellung_redoubt_desc:0 "Fall back upon the deep concrete defenses of the Hindenburg Line, anchoring division artillery in concealed pillboxes."
 GER_endsieg_unconquerable_rhineland:0 "[Emergency] Unconquerable Rhineland"
 GER_endsieg_unconquerable_rhineland_desc:0 "Deploy guerrilla stay-behind cells and counter-attack detachments to turn any occupied town in the Rhineland into a continuous zone of urban resistance."
 GER_endsieg_no_surrender:0 "[Emergency] No Surrender Under Any Diktat"
 GER_endsieg_no_surrender_desc:0 "Categorically reject all terms of subjugation. The Imperial Army will fight to the last man, the last cartridge, and the last breath."
 GER_endsieg_anti_bolshevik_crusade:0 "[Emergency] Anti-Bolshevik Crusade in the East"
 GER_endsieg_anti_bolshevik_crusade_desc:0 "Stem the Red tide advancing across Poland and Lithuania. German veterans shield European civilization from the chaos of eastern revolution."
 GER_endsieg_stand_against_entente:0 "[Emergency] Stand Against the Entente"
 GER_endsieg_stand_against_entente_desc:0 "Bleed the French and British armies dry until their homefronts crumble under anti-war strikes and mutinies."
 GER_endsieg_freikorps_vanguard:0 "[Emergency] Freikorps Shock Vanguard"
 GER_endsieg_freikorps_vanguard_desc:0 "Unleash elite veteran shock volunteer detachments across fractured fronts, executing fierce counter-offensives against exposed enemy salients."
 GER_endsieg_gotterdammerung:0 "[Emergency] Götterdämmerung (Twilight of the Gods)"
 GER_endsieg_gotterdammerung_desc:0 "The ultimate climax of the Great War. Against the entire world, the German Empire makes its immortal stand in blood and fire."
 GER_totale_mobilmachung_spirit:0 "Totale Mobilmachung"
 GER_totale_mobilmachung_spirit_desc:0 "Every institution and resource in the nation is dedicated to total wartime survival."
 GER_letzte_reserven:0 "Die Letzten Reserven"
 GER_letzte_reserven_desc:0 "The very bottom of the manpower barrel is scraped to replenish division lines."
 GER_drastic_requisitions:0 "Drastic Wartime Requisitions"
 GER_drastic_requisitions_desc:0 "Total state control over private commerce, equipment, and manufacturing."
 GER_underground_industry:0 "Underground Dispersed Plants"
 GER_underground_industry_desc:0 "Vital factories operating safely subterranean, impervious to air raids."
 GER_volkssturm_call_spirit:0 "Volkssturm Levy"
 GER_volkssturm_call_spirit_desc:0 "Masses of citizens armed with rifles standing to defend their neighborhoods."
 GER_landsturm_defense:0 "Landsturm Territorial Guard"
 GER_landsturm_defense_desc:0 "Territorial defenders holding bridges and forest barriers against enemy spearheads."
 GER_patriotic_frenzy:0 "Patriotic Frenzy"
 GER_patriotic_frenzy_desc:0 "A tidal wave of patriotic devotion sweeps away doubt and defeatism."
 GER_unyielding_spirit:0 "Unyielding National Spirit"
 GER_unyielding_spirit_desc:0 "The Fatherland stands defiant against all odds."
 GER_festung_rhein:0 "Festung Rhein"
 GER_festung_rhein_desc:0 "The Rhine line converted into an impregnable bastion of defensive fire."
 GER_scorched_crossings:0 "Scorched River Crossings"
 GER_scorched_crossings_desc:0 "Bridges blasted and roads mined, denying the enemy easy momentum."
 GER_westwall_bastion:0 "Westwall Bastion"
 GER_westwall_bastion_desc:0 "Deep concrete trench fortifications repelling massive artillery bombardment."
 GER_rejection_of_diktat:0 "Rejection of the Diktat"
 GER_rejection_of_diktat_desc:0 "Uncompromising refusal to yield to Allied territorial ultimatums."
 GER_anti_bolshevik_spirit:0 "Anti-Bolshevik Bastion"
 GER_anti_bolshevik_spirit_desc:0 "Steadfast resistance against the Red Army on the eastern frontiers."
 GER_entente_defiance:0 "Defiance of the Entente"
 GER_entente_defiance_desc:0 "Bleeding the Western Powers until war exhaustion breaks their resolve."
 GER_freikorps_vanguard_spirit:0 "Freikorps Vanguard"
 GER_freikorps_vanguard_spirit_desc:0 "Elite volunteers fighting with fanatical discipline in defensive maneuvers."
 GER_gotterdammerung_climax:0 "Götterdämmerung Climax"
 GER_gotterdammerung_climax_desc:0 "The apocalyptic defense of German soil in the twilight of the empires."
 GER_versailles_reparations:0 "Treaty of Versailles Burden"
 GER_versailles_reparations_desc:0 "Crushing economic indemnities, demilitarization, and territorial loss under the Versailles treaty."
 GER_endsieg_fanaticism:0 "Endsieg Fanaticism"
 GER_endsieg_fanaticism_desc:0 "Total devotion to holding every trench until the final cartridge is spent."
 GER_pax_germanica:0 "[Imperial] Pax Germanica"
 GER_pax_germanica_desc:0 "With total victory achieved on all fronts, the German Empire establishes an enduring continental order. Berlin stands as the unshakeable pillar of European peace and Hohenzollern preeminence."
 GER_vaterlandspartei_dictatorship:0 "[Totalitarian] Vaterlandspartei Dictatorship"
 GER_vaterlandspartei_dictatorship_desc:0 "Under the iron rule of Tirpitz and Kapp, all parliamentary compromises are swept aside. Germany is reorganized as a totalitarian military garrison, dedicated to ruthless expansion and total war."
 GER_weimar_peace_resolution:0 "[Democratic] The Weimar Peace Resolution"
 GER_weimar_peace_resolution_desc:0 "The majority parties of the Reichstag enact the historic peace resolution. Rejecting annexations and imperialist conquests, Germany embraces parliamentary democracy and reconciliation with the democracies of Europe."
 GER_spartakusbund_revolution:0 "[Communist] The Spartakusbund Red Revolution"
 GER_spartakusbund_revolution_desc:0 "Workers and soldiers have seized the factories, the barracks, and the streets! All power to the workers' and soldiers' councils! The red banner flies triumphant over the Brandenburg Gate!"
 GER_imperial_pax_spirit:0 "Pax Germanica"
 GER_imperial_pax_spirit_desc:0 "The Hohenzollern monarchy presides over a reorganized, stable Mitteleuropa, balancing monarchical authority with imperial federalism."
 GER_vaterlandspartei_hegemony:0 "Vaterlandspartei Totalitarian Rule"
 GER_vaterlandspartei_hegemony_desc:0 "Militaristic chauvinism and state regimentation dominate public life, mobilizing all resources for continental hegemony."
 GER_weimar_peace_coalition:0 "Weimar Democratic Coalition"
 GER_weimar_peace_coalition_desc:0 "A broad parliamentary coalition of Social Democrats, the Centre Party, and Progressives steers the German Republic toward social peace, economic recovery, and international cooperation."
 GER_spartakist_councils:0 "Workers' and Soldiers' Councils"
 GER_spartakist_councils_desc:0 "Democratic soviet councils oversee industrial production, military defense, and socialist redistribution across the Red Republic."
 ww1_germany_political.1.t:0 "Proclamation of the Pax Germanica"
 ww1_germany_political.1.d:0 "With the conclusion of the Great War and the consolidation of our eastern and western protectorates, Kaiser Wilhelm II has addressed the Reichstag. The German Empire stands as the undisputed arbiter of continental Europe."
 ww1_germany_political.1.a:0 "Long live the Kaiser! Long live the Empire!"
 ww1_germany_political.2.t:0 "Vaterlandspartei Seizes Total Control"
 ww1_germany_political.2.d:0 "Denouncing civilian politicians as weak and treacherous, the Deutsche Vaterlandspartei supported by the Pan-German League and the military high command has dissolved the Reichstag and established a totalitarian national dictatorship."
 ww1_germany_political.2.a:0 "Victory at any cost!"
 ww1_germany_political.3.t:0 "The Weimar Peace Resolution Enacted"
 ww1_germany_political.3.d:0 "The democratic majority in the Reichstag has prevailed. The Imperial Cabinet has yielded power to a parliamentary government dedicated to ending the slaughter, establishing democratic reforms, and seeking a just peace."
 ww1_germany_political.3.a:0 "For peace, freedom, and bread!"
 ww1_germany_political.4.t:0 "The Spartakusbund Red Republic Consolidates"
 ww1_germany_political.4.d:0 "Karl Liebknecht and Rosa Luxemburg have proclaimed the Free Socialist Republic of Germany from the balcony of the Berlin Palace. The imperial eagle has fallen; the workers of Germany unite with the global proletariat!"
 ww1_germany_political.4.a:0 "All power to the Councils!"
