l_english:
 SOV_hungry_cities_1:0 "Hungry Cities"
 SOV_hungry_cities_1_desc:0 "Bread is scarce and dear in the industrial cities. Queues lengthen each week."
 SOV_hungry_cities_2:0 "Famine in the Cities"
 SOV_hungry_cities_2_desc:0 "The capital and the industrial towns are starving. Every rumour of a bread shortage sends crowds into the streets."
 SOV_restless_workers_1:0 "Restless Workers"
 SOV_restless_workers_1_desc:0 "Strikes and factory committees multiply. Production suffers from stoppages."
 SOV_restless_workers_2:0 "General Strike Fever"
 SOV_restless_workers_2_desc:0 "Whole districts stop work at a word. The authorities no longer control the factory floor."
 SOV_wavering_army_1:0 "Wavering Army"
 SOV_wavering_army_1_desc:0 "Desertion grows and the men grumble at officers and at the war itself."
 SOV_wavering_army_2:0 "Army on the Verge of Mutiny"
 SOV_wavering_army_2_desc:0 "Regiments refuse orders, elect committees and leave the trenches. The front is dissolving."
 SOV_supreme_command_burden:0 "The Tsar at Mogilev"
 SOV_supreme_command_burden_desc:0 "The Tsar commands the army in person while the capital is left to the Empress and her favourite."
 SOV_refugee_flood:0 "Refugees on the Roads"
 SOV_refugee_flood_desc:0 "Millions of refugees from Poland and Galicia strain the railways and the food supply of the interior."
 SOV_society_mobilised:0 "Society Mobilised"
 SOV_society_mobilised_desc:0 "Zemstvos, town unions and industrialists organise supplies for the army alongside the state."
 SOV_lena_shadow:0 "Shadow of the Lena"
 SOV_lena_shadow_desc:0 "The massacre in the goldfields has turned a generation of workers against the regime."
 SOV_separatist_fever:0 "Separatist Fever"
 SOV_separatist_fever_desc:0 "Finns, Poles, Ukrainians, Balts and Caucasians look to independence as the centre weakens."
 SOV_civil_war_exhaustion:0 "Ravaged by Civil War"
 SOV_civil_war_exhaustion_desc:0 "Reds, Whites, Greens and foreign armies have wrecked railways, mines and harvests."
 SOV_nep_recovery:0 "New Economic Policy"
 SOV_nep_recovery_desc:0 "Requisitions give way to a tax in kind and small private trade. The villages breathe again."
 SOV_ussr_union:0 "Union of Soviet Republics"
 SOV_ussr_union_desc:0 "A federal treaty binds the Soviet republics into a single state."
 ww1_russia.200.t:0 "Massacre at the Lena Goldfields"
 ww1_russia.200.d:0 "Troops have fired on striking miners in the Siberian goldfields of the Lena River. Hundreds lie dead or wounded, and the news is spreading through every factory town of the Empire."
 ww1_russia.200.a:0 "The authorities acted within the law."
 ww1_russia.200.b:0 "Open a commission of inquiry."
 ww1_russia.201.t:0 "The July Strikes"
 ww1_russia.201.d:0 "As French President Poincaré visits the capital, a wave of strikes grips the Putilov Works and the workers districts. Barricades go up in Petersburg while the Empire edges toward a European war."
 ww1_russia.201.a:0 "Break the strikes with police and Cossacks."
 ww1_russia.201.b:0 "Wait for the war to unite the nation."
 ww1_russia.202.t:0 "The Tsar Takes Supreme Command"
 ww1_russia.202.d:0 "Against the advice of nearly all his ministers, Nicholas II dismisses Grand Duke Nicholas and takes personal command of the army at Mogilev, leaving the government of the capital to the Empress and Rasputin."
 ww1_russia.202.a:0 "The Tsar commands in person."
 ww1_russia.202.b:0 "Persuade him to remain in the capital."
 ww1_russia.203.t:0 "The Great Retreat"
 ww1_russia.203.d:0 "The Gorlice-Tarnów offensive has driven the army out of Galicia and Poland. Millions of refugees clog the roads east, and the shell shortage leaves the front without guns."
 ww1_russia.203.a:0 "Scorched earth and mass evacuation."
 ww1_russia.203.b:0 "Hold the line at any cost."
 ww1_russia.203.c:0 "Convene Zemgor and the War Industry Committees."
 ww1_russia.204.t:0 "The Duma Is Prorogued"
 ww1_russia.204.d:0 "The Progressive Bloc demands a government that enjoys public confidence. The Tsar answers by proroguing the Duma and sending the deputies home, closing the last legal outlet for criticism of the court."
 ww1_russia.204.a:0 "Prorogue the Duma."
 ww1_russia.204.b:0 "Accept a Ministry of Public Confidence."
 ww1_russia.205.t:0 "The Murder of Rasputin"
 ww1_russia.205.d:0 "In the early hours, Prince Yusupov and Grand Duke Dmitri lure the starets to the Yusupov Palace. The favourite of the Empress is dead, but the court has lost its last hold on the Tsar and the nobility has shown it will act without him."
 ww1_russia.205.a:0 "The court is finally rid of him."
 ww1_russia.205.b:0 "Exile the conspirators to the front."
 ww1_russia.206.t:0 "The Army Wavers"
 ww1_russia.206.d:0 "Reports from the front speak of desertion, fraternisation and soldiers who no longer salute their officers. The staff warns that the men are tired of a war they do not understand."
 ww1_russia.206.a:0 "Shoot deserters and tighten discipline."
 ww1_russia.206.b:0 "Promise land after victory."
 ww1_russia.206.c:0 "Rotate divisions to the rear for rest."
 ww1_russia.207.t:0 "The Fruits of the Land Reform"
 ww1_russia.207.d:0 "Years of land reform are bearing fruit: the Peasants Land Bank has settled a million households on consolidated farms and in Siberia. But the communal villages are bitter at the loss of the old ways."
 ww1_russia.207.a:0 "Press on with the reform."
 ww1_russia.207.b:0 "Slow the pace to calm the villages."
 ww1_russia.208.t:0 "The Great Military Programme"
 ww1_russia.208.d:0 "The War Ministry presents a vast expansion of the army and its artillery to be completed by 1917. The Finance Ministry warns that the budget cannot bear it."
 ww1_russia.208.a:0 "Approve the full programme."
 ww1_russia.208.b:0 "Approve a reduced programme."
 ww1_russia.209.t:0 "Bread Lines in Petrograd"
 ww1_russia.209.d:0 "Snow and broken railways have cut grain deliveries to the capital. Women queue in the dark for bread while the price of flour doubles."
 ww1_russia.209.a:0 "Fix bread prices and ration flour."
 ww1_russia.209.b:0 "Send the police to disperse the queues."
 ww1_russia.209.c:0 "Ask the Zemstvos to organise relief."
 ww1_russia.210.t:0 "The Petrograd Uprising"
 ww1_russia.210.d:0 "Bread riots have turned into a general strike. Soldiers of the capital garrison have been ordered to fire on the crowds, and some regiments are refusing. The Tsar is at Mogilev, and Petrograd is slipping out of his hands."
 ww1_russia.210.a:0 "Let events run their course."
 ww1_russia.210.b:0 "Order the garrison to restore order."
 ww1_russia.213.t:0 "Lenin Returns to Petrograd"
 ww1_russia.213.d:0 "Lenin has crossed Germany in a sealed train and arrives at the Finland Station. He denounces the war and the Provisional Government and demands all power to the Soviets."
 ww1_russia.213.a:0 "Dismiss him as a German agent."
 ww1_russia.213.b:0 "Arrest the Bolshevik leaders."
 ww1_russia.213.c:0 "Offer the Soviet seats in the Cabinet."
 ww1_russia.211.t:0 "The Tsar Abdicates"
 ww1_russia.211.d:0 "Faced with mutiny in the capital and the advice of his generals, Nicholas II signs the instrument of abdication in a railway carriage at Pskov. Three centuries of Romanov rule are over; the Duma forms a Provisional Government alongside the Petrograd Soviet."
 ww1_russia.211.a:0 "A Provisional Government takes over."
 ww1_russia.211.b:0 "The Tsar appeals to loyal troops."
 ww1_russia.212.t:0 "Dual Power"
 ww1_russia.212.d:0 "Two authorities now share the capital: the Provisional Government, which has the ministries, and the Petrograd Soviet, which has the soldiers. Order No. 1 has placed the garrison under elected committees."
 ww1_russia.212.a:0 "Rule through the Provisional Government."
 ww1_russia.212.b:0 "Work with the Soviet executive."
 ww1_russia.214.t:0 "The July Days"
 ww1_russia.214.d:0 "After the failed summer offensive, soldiers, sailors and workers march on the Tauride Palace demanding peace and bread. The government must decide how to answer."
 ww1_russia.214.a:0 "Crush the demonstrations."
 ww1_russia.214.b:0 "Promise reforms and talk."
 ww1_russia.215.t:0 "The Kornilov Crisis"
 ww1_russia.215.d:0 "General Kornilov, commander in chief, is marching troops toward Petrograd to restore order. The government calls on the capital workers and sailors to defend the revolution, arming the Bolsheviks in the process. It can no longer command the loyalty of either side."
 ww1_russia.215.a:0 "Arrest Kornilov and arm the workers."
 ww1_russia.215.b:0 "Join Kornilov against the Soviets."
 ww1_russia.215.c:0 "Call a Constituent Assembly and hold the centre."
 ww1_russia.216.t:0 "The October Revolution"
 ww1_russia.216.d:0 "On the night of 25 October, Red Guards and sailors seize the bridges, the telegraph and the Winter Palace. The Provisional Government is arrested, and the Second Congress of Soviets hands power to a Council of People Commissars under Lenin."
 ww1_russia.216.a:0 "All power to the Soviets!"
 ww1_russia.217.t:0 "Kornilov Takes Petrograd"
 ww1_russia.217.d:0 "Kornilov Cossacks and shock battalions enter Petrograd. The Soviets are dissolved, the death penalty is restored at the front and the Provisional Government is swept aside by a military directory."
 ww1_russia.217.a:0 "A military dictatorship restores order."
 ww1_russia.218.t:0 "Elections to the Constituent Assembly"
 ww1_russia.218.d:0 "Russia votes in the first free election in its history. The Socialist Revolutionaries win a plurality; the Bolsheviks hold the capital and the garrisons. The Assembly is to meet in Petrograd."
 ww1_russia.218.a:0 "Convene the Assembly as planned."
 ww1_russia.218.b:0 "Postpone it until the war is over."
 ww1_russia.219.t:0 "The Constituent Assembly Meets"
 ww1_russia.219.d:0 "The Constituent Assembly meets in the Tauride Palace, guarded by armed sailors who are not its friends. Its fate depends on who commands the garrison."
 ww1_russia.219.a:0 "The Assembly proclaims the Russian Republic."
 ww1_russia.219.b:0 "The Red Guards disperse the Assembly."
 ww1_russia.220.t:0 "Reds and Whites"
 ww1_russia.220.d:0 "Generals, Cossack atamans and Socialist Revolutionaries raise armies against the new order in the south, on the Volga and in Siberia. Russia is divided between Reds and Whites, and the Allies and the Central Powers watch for their chance."
 ww1_russia.220.a:0 "To arms!"
 ww1_russia.221.t:0 "The Czech Legion Revolts"
 ww1_russia.221.d:0 "Forty thousand Czechoslovak soldiers strung along the Trans-Siberian Railway refuse to disarm. In days they hold the line from the Volga to Vladivostok and the towns fall one after another."
 ww1_russia.221.a:0 "Try to disarm the Legion by force."
 ww1_russia.221.b:0 "Negotiate passage to Vladivostok."
 ww1_russia.222.t:0 "Kolchak, Supreme Ruler"
 ww1_russia.222.d:0 "Admiral Kolchak seizes power at Omsk and is proclaimed Supreme Ruler of Russia by the Whites. With Allied supplies behind him, his armies start westward over the Urals."
 ww1_russia.222.a:0 "Send the best divisions east."
 ww1_russia.222.b:0 "Rely on partisans in the Siberian rear."
 ww1_russia.223.t:0 "Wrangel in the Crimea"
 ww1_russia.223.d:0 "Baron Wrangel reorganises the remnants of the White armies behind the Perekop isthmus and the Crimean fortifications. If the Reds can take the peninsula the civil war is won."
 ww1_russia.223.a:0 "Storm Perekop across the frozen Sivash."
 ww1_russia.223.b:0 "Offer an amnesty to White officers."
 ww1_russia.224.t:0 "The Kronstadt Rebellion"
 ww1_russia.224.d:0 "The sailors who were once the pride of the revolution raise the flag of revolt against the Bolsheviks: soviets without communists, free trade and an end to requisitions."
 ww1_russia.224.a:0 "Crush the rebels across the ice."
 ww1_russia.224.b:0 "Open negotiations with the sailors."
 ww1_russia.225.t:0 "The New Economic Policy"
 ww1_russia.225.d:0 "Lenin tells the Party Congress that the peasantry must be allowed to trade. Grain requisitions are replaced by a tax in kind and small enterprises may be privately run."
 ww1_russia.225.a:0 "Adopt the New Economic Policy."
 ww1_russia.225.b:0 "Keep War Communism a little longer."
 ww1_russia.226.t:0 "The Union Treaty"
 ww1_russia.226.d:0 "Delegates of the Russian, Transcaucasian, Ukrainian and Belarusian Soviet republics sign a treaty of union. A single state with a single army, a single foreign policy and a single Party is born."
 ww1_russia.226.a:0 "Sign the Treaty of Union."
 ww1_russia.227.t:0 "The Fate of the Romanovs"
 ww1_russia.227.d:0 "The former Tsar and his family are held in the Ipatiev House in Yekaterinburg while White armies and the Czech Legion approach the town. The Ural Soviet asks what to do with its prisoners."
 ww1_russia.227.a:0 "The Ural Soviet carries out the sentence."
 ww1_russia.227.b:0 "Move them to Moscow for a public trial."
 ww1_russia.228.t:0 "The All-Russian Church Council"
 ww1_russia.228.d:0 "For the first time since Peter the Great the Orthodox Church meets in council and restores the Patriarchate. The question of its place in the new Russia hangs in the air."
 ww1_russia.228.a:0 "Support the Church as a pillar of order."
 ww1_russia.228.b:0 "Separate Church and State."
 ww1_russia.230.t:0 "Finland Demands Independence"
 ww1_russia.230.d:0 "With the Tsar gone, the Finnish Diet declares that the ties of union have fallen with the Grand Duke. Helsinki asks for recognition and the Finnish Red and White camps are already arming."
 ww1_russia.230.a:0 "Recognise Finnish independence."
 ww1_russia.230.b:0 "Grant autonomy as a protectorate."
 ww1_russia.230.c:0 "Refuse to discuss it."
 ww1_russia.231.t:0 "The Ukrainian Rada"
 ww1_russia.231.d:0 "The Central Rada in Kiev proclaims a Ukrainian People Republic. The grain of the south, the Donbas coal and a fifth of the empire population hang on the answer."
 ww1_russia.231.a:0 "Recognise the Ukrainian Republic."
 ww1_russia.231.b:0 "Offer autonomy inside a federation."
 ww1_russia.231.c:0 "Send troops to Kiev."
 ww1_russia.232.t:0 "The Baltic Lands"
 ww1_russia.232.d:0 "German armies stand on the Dvina and the councils of Estonia, Latvia and Lithuania demand self-determination. Whatever Petrograd answers, Berlin will have its own plans for the Baltic."
 ww1_russia.232.a:0 "Recognise the Baltic states."
 ww1_russia.232.b:0 "Hold the Baltic provinces."
 ww1_russia.233.t:0 "The Transcaucasian Federation"
 ww1_russia.233.d:0 "Georgians, Armenians and Azeris form a Transcaucasian commissariat and then a federation of their own, caught between Turkish armies and Russian retreat."
 ww1_russia.233.a:0 "Recognise the Caucasian republics."
 ww1_russia.233.b:0 "Keep the Caucasus by force."
 ww1_russia.234.t:0 "Poland Rises Again"
 ww1_russia.234.d:0 "The Regency Council in Warsaw, the Allied declarations and the collapse of the partitioning empires leave no doubt: Poland will be a state again. The only question is its borders."
 ww1_russia.234.a:0 "Recognise the Polish state."
 ww1_russia.234.b:0 "Keep the Vistula provinces."
 SOV_imperial_crisis:0 "Imperial Crisis Management"
 SOV_imperial_crisis_desc:0 "The Tsar and his ministers can still steer the Empire through its growing unrest. Every measure has its price."
 SOV_civil_war_front:0 "The Civil War Front"
 SOV_civil_war_front_desc:0 "Reds and Whites fight for every railway junction and granary. Mobilisation and terror decide the war."
 SOV_dec_convene_duma:0 "Convene the Duma"
 SOV_dec_convene_duma_desc:0 "Call the deputies back and listen to their grievances. Tension with the Duma falls."
 SOV_dec_prorogue_duma:0 "Prorogue the Duma"
 SOV_dec_prorogue_duma_desc:0 "Send the deputies home. The court gains room to act, but the Duma remembers."
 SOV_dec_fix_bread_prices:0 "Fix Bread Prices"
 SOV_dec_fix_bread_prices_desc:0 "Set maximum prices and ration flour in the big cities. The bakers grumble, but the queues shorten."
 SOV_dec_grain_requisition:0 "Requisition Grain"
 SOV_dec_grain_requisition_desc:0 "Send purchasing agents and soldiers to the grain provinces. The cities eat, the villages seethe."
 SOV_dec_visit_the_front:0 "Visit the Front"
 SOV_dec_visit_the_front_desc:0 "The Tsar inspects the army and hands out medals. The men cheer, for now."
 SOV_dec_okhrana_crackdown:0 "Okhrana Crackdown"
 SOV_dec_okhrana_crackdown_desc:0 "Arrest agitators and close workers clubs. Calm returns, at a cost to the regime reputation."
 SOV_dec_conciliation_boards:0 "Factory Conciliation Boards"
 SOV_dec_conciliation_boards_desc:0 "Let employers and elected workers sit together to settle disputes before they become strikes."
 SOV_dec_field_courts:0 "Field Courts-Martial"
 SOV_dec_field_courts_desc:0 "Summary justice for deserters and agitators in uniform. Order is restored by fear."
 SOV_dec_patriotic_campaign:0 "Patriotic Campaign"
 SOV_dec_patriotic_campaign_desc:0 "Church bells, posters and war loans remind the people why they fight."
 SOV_dec_mobilise_the_rear:0 "Mobilise the Rear"
 SOV_dec_mobilise_the_rear_desc:0 "Drafts, labour battalions and requisitions feed the fronts of the civil war."
 SOV_dec_political_commissars:0 "Political Commissars"
 SOV_dec_political_commissars_desc:0 "Attach a commissar to every former imperial officer to guarantee their loyalty."
 SOV_dec_amnesty_officers:0 "Amnesty for Officers"
 SOV_dec_amnesty_officers_desc:0 "Pardon officers who switch sides. Experience is worth more than grudges."
 ww1_russia.20.c:0 "Hold the centre: convene the Constituent Assembly."
 GER_social_peace_frayed:0 "Burgfrieden Frayed"
 GER_social_peace_frayed_desc:0 "The truce between government, parties and unions no longer holds. The Reichstag quarrels again."
 GER_revolutionary_mood:0 "Revolutionary Mood"
 GER_revolutionary_mood_desc:0 "Workers councils, mutinous sailors and hungry crowds have brought revolution to the edge of the Reich."
 GER_zabern_distrust:0 "Zabern Distrust"
 GER_zabern_distrust_desc:0 "The army has been shown to stand above the law, and the civilian parties will not forget it."
 GER_weimar_fragile:0 "Fragile Republic"
 GER_weimar_fragile_desc:0 "The Republic was born in defeat and has enemies on the Left and on the Right."
 GER_hyperinflation:0 "Hyperinflation"
 GER_hyperinflation_desc:0 "Prices double by the day and wages are paid twice daily. The savings of the middle class are gone."
 GER_ruhr_passive_resistance:0 "Passive Resistance in the Ruhr"
 GER_ruhr_passive_resistance_desc:0 "Miners, railwaymen and officials refuse to work for the occupiers. The state pays them to sit at home."
 GER_freikorps_menace:0 "Freikorps Menace"
 GER_freikorps_menace_desc:0 "Armed veterans stand ready to defend the Republic or to overthrow it, depending on who pays."
 ww1_germany_events.200.t:0 "The Reichstag Election of 1912"
 ww1_germany_events.200.d:0 "The Social Democrats win more votes than any other party and become the largest group in the Reichstag. The Emperor and the Junkers see red; the Centre and the Progressives see a majority for reform."
 ww1_germany_events.200.a:0 "Accept the result and court the Centre."
 ww1_germany_events.200.b:0 "Lean on the Bundesrat and the Emperor."
 ww1_germany_events.201.t:0 "The Zabern Affair"
 ww1_germany_events.201.d:0 "A young lieutenant in Alsace insults the locals, and the garrison answers protests with arrests. The Reichstag votes to censure the Chancellor, but the Emperor sides with the army."
 ww1_germany_events.201.a:0 "Back the army."
 ww1_germany_events.201.b:0 "Censure the officers."
 ww1_germany_events.202.t:0 "No Parties, Only Germans"
 ww1_germany_events.202.d:0 "In the Reichstag, the Social Democrats vote the war credits. The Emperor declares that he no longer knows parties, only Germans. The Burgfrieden is proclaimed and the nation goes to war in a wave of enthusiasm."
 ww1_germany_events.202.a:0 "No parties, only Germans!"
 ww1_germany_events.202.b:0 "Keep the Social Democrats at arm length."
 ww1_germany_events.203.t:0 "Moltke Is Dismissed"
 ww1_germany_events.203.d:0 "After the Marne, the Chief of the General Staff is a broken man. The Emperor must choose who will direct the war in the west."
 ww1_germany_events.203.a:0 "Falkenhayn takes over the General Staff."
 ww1_germany_events.203.b:0 "Keep Moltke in command."
 ww1_germany_events.204.t:0 "The Lusitania"
 ww1_germany_events.204.d:0 "A German submarine has sunk the liner Lusitania with over a hundred Americans aboard. Washington protests in the strongest terms and the Navy Office asks that the campaign continue."
 ww1_germany_events.204.a:0 "Defend the submarine campaign."
 ww1_germany_events.204.b:0 "Restrict the U-boats to cruiser rules."
 ww1_germany_events.205.t:0 "The Third Supreme Command"
 ww1_germany_events.205.d:0 "With Verdun bled white and Romania entering the war, Falkenhayn falls. Hindenburg and Ludendorff take over the Supreme Army Command and begin to run the economy, the press and the Chancellor."
 ww1_germany_events.205.a:0 "Hindenburg and Ludendorff take over."
 ww1_germany_events.205.b:0 "Keep civilian control of the war."
 ww1_germany_events.206.t:0 "The May Day Strike of 1916"
 ww1_germany_events.206.d:0 "Karl Liebknecht is arrested at a May Day demonstration in Potsdamer Platz, and tens of thousands of Berlin workers down tools in protest. The Social Democratic party itself begins to split."
 ww1_germany_events.206.a:0 "Arrest the leaders and prosecute them."
 ww1_germany_events.206.b:0 "Let the protest pass and talk to the unions."
 ww1_germany_events.207.t:0 "The Turnip Winter"
 ww1_germany_events.207.d:0 "The potato harvest has failed and the British blockade has stopped imports. The cities eat turnips, the black market thrives and the people blame the government for every empty plate."
 ww1_germany_events.207.a:0 "Expand the War Food Office controls."
 ww1_germany_events.207.b:0 "Serve the army first."
 ww1_germany_events.207.c:0 "Price controls and public soup kitchens."
 ww1_germany_events.208.t:0 "The Zimmermann Telegram"
 ww1_germany_events.208.d:0 "The Foreign Office proposes to Mexico an alliance against the United States, should Washington enter the war. The cable travels over a route the British read."
 ww1_germany_events.208.a:0 "Send the telegram."
 ww1_germany_events.208.b:0 "Shelve the plan."
 ww1_germany_events.209.t:0 "The Peace Resolution"
 ww1_germany_events.209.d:0 "The Reichstag majority of Social Democrats, Centre and Progressives calls for a peace without annexations. The Supreme Command answers by forcing out the Chancellor."
 ww1_germany_events.209.a:0 "The Reichstag declares for peace."
 ww1_germany_events.209.b:0 "The Supreme Command ignores the resolution."
 ww1_germany_events.210.t:0 "A New Chancellor"
 ww1_germany_events.210.d:0 "Michaelis has lasted a hundred days. The Centre proposes the aged Bavarian Count Hertling, while the Reichstag parties ask for a say in the choice."
 ww1_germany_events.210.a:0 "Appoint Count Hertling."
 ww1_germany_events.210.b:0 "Appoint parliamentary ministers."
 ww1_germany_events.211.t:0 "Operation Michael"
 ww1_germany_events.211.d:0 "With the East closed, the divisions of the Ostheer move west. Ludendorff plans to break the Allies before the Americans arrive in strength."
 ww1_germany_events.211.a:0 "Stake everything on one great blow."
 ww1_germany_events.211.b:0 "Limited offensives on a narrower front."
 ww1_germany_events.212.t:0 "The January Strikes"
 ww1_germany_events.212.d:0 "Half a million workers down tools in Berlin, Hamburg and Kiel, demanding peace without annexations, food and the vote. Workers councils elect delegates in the factories."
 ww1_germany_events.212.a:0 "Crush the strikes."
 ww1_germany_events.212.b:0 "Negotiate with the Social Democratic leaders."
 ww1_germany_events.213.t:0 "The October Reforms"
 ww1_germany_events.213.d:0 "With the front breaking, Ludendorff demands an armistice and advises parliamentary government. Prince Max of Baden becomes Chancellor with Social Democrats in the Cabinet, and the Emperor remains in name."
 ww1_germany_events.213.a:0 "Parliamentary government under Prince Max."
 ww1_germany_events.213.b:0 "Refuse reform and fight to the end."
 ww1_germany_events.214.t:0 "Mutiny at Kiel"
 ww1_germany_events.214.d:0 "The High Seas Fleet is ordered to sea for a last battle. The stokers draw their fires, the crews refuse orders and red flags rise on the battleships. By morning Kiel is in the hands of sailors and workers councils."
 ww1_germany_events.214.a:0 "Negotiate with the sailors councils."
 ww1_germany_events.214.b:0 "Crush the mutiny by force."
 ww1_germany_events.215.t:0 "The November Revolution"
 ww1_germany_events.215.d:0 "On 9 November Prince Max hands the chancellorship to Friedrich Ebert. From a Reichstag window Scheidemann proclaims the German Republic; across town Liebknecht proclaims a Socialist Republic from the balcony of the Palace."
 ww1_germany_events.215.a:0 "Ebert and the Social Democrats take charge."
 ww1_germany_events.215.b:0 "The Spartacists seize the streets."
 ww1_germany_events.216.t:0 "The Kaiser Goes"
 ww1_germany_events.216.d:0 "Wilhelm II, who had hoped to lead his army home, is told by Hindenburg that the troops are no longer behind him. He crosses the Dutch border and the Hohenzollern monarchy ends."
 ww1_germany_events.216.a:0 "The Emperor goes into exile in the Netherlands."
 ww1_germany_events.217.t:0 "The Ebert-Groener Pact"
 ww1_germany_events.217.d:0 "General Groener telephones Ebert on the secret line: the army will serve the new government if it keeps order against the councils. Ebert accepts."
 ww1_germany_events.217.a:0 "Ally with the army against the councils."
 ww1_germany_events.217.b:0 "Trust the workers and soldiers councils."
 ww1_germany_events.218.t:0 "The Spartacist Uprising"
 ww1_germany_events.218.d:0 "Berlin workers occupy the newspaper district and raise barricades. Liebknecht and Luxemburg call for a second revolution against Ebert."
 ww1_germany_events.218.a:0 "Let the Freikorps crush the uprising."
 ww1_germany_events.218.b:0 "Negotiate with the insurgents."
 ww1_germany_events.219.t:0 "The Weimar National Assembly"
 ww1_germany_events.219.d:0 "Away from Berlin's barricades the National Assembly meets in Goethe's town and drafts a democratic constitution with a strong President and universal suffrage for men and women."
 ww1_germany_events.219.a:0 "Adopt the Weimar Constitution."
 ww1_germany_events.220.t:0 "The Kapp Putsch"
 ww1_germany_events.220.d:0 "Freikorps brigades march into Berlin and install Wolfgang Kapp as Chancellor. The government flees, and the trade unions call a general strike."
 ww1_germany_events.220.a:0 "The general strike defeats the putsch."
 ww1_germany_events.220.b:0 "Compromise with the putschists."
 ww1_germany_events.221.t:0 "The Murder of Rathenau"
 ww1_germany_events.221.d:0 "Foreign Minister Walther Rathenau, who negotiated Rapallo, is shot by nationalist extremists. Hundreds of thousands march in defence of the Republic."
 ww1_germany_events.221.a:0 "Pass the Law for the Protection of the Republic."
 ww1_germany_events.222.t:0 "The Occupation of the Ruhr"
 ww1_germany_events.222.d:0 "French and Belgian troops occupy the Ruhr for unpaid reparations. Berlin must choose between surrender and a costly strike of the whole region."
 ww1_germany_events.222.a:0 "Passive resistance."
 ww1_germany_events.222.b:0 "Resume reparations payments."
 ww1_germany_events.223.t:0 "The Mark Collapses"
 ww1_germany_events.223.d:0 "A loaf of bread costs millions, wages are paid twice a day and savings are wiped out. The Republic can print no more money than it already has."
 ww1_germany_events.223.a:0 "A new currency must be found."
 ww1_germany_events.224.t:0 "The Christmas Crisis"
 ww1_germany_events.224.d:0 "The People Naval Division occupies the Chancellery and holds a government hostage over unpaid wages. Ebert calls in regular troops, and the Independents leave the government."
 ww1_germany_events.224.a:0 "Use regular troops."
 ww1_germany_events.224.b:0 "Pay the sailors and settle."
 ww1_germany_events.225.t:0 "Scapa Flow"
 ww1_germany_events.225.d:0 "Interned at Scapa Flow and told the armistice will be extended, Admiral von Reuter orders his ships scuttled rather than let them be divided among the Allies."
 ww1_germany_events.225.a:0 "The fleet is scuttled."
 ww1_germany_events.230.t:0 "Revolution in Russia"
 ww1_germany_events.230.d:0 "The Tsar is gone and Russia is in turmoil. The General Staff sees a chance to knock the Eastern enemy out of the war, and the Foreign Office has contacts among the exiled revolutionaries."
 ww1_germany_events.230.a:0 "Facilitate Lenin's return by sealed train."
 ww1_germany_events.230.b:0 "Avoid Russian politics and hold the front."
 ww1_germany_events.231.t:0 "The Soviet Offer of Armistice"
 ww1_germany_events.231.d:0 "The new Bolshevik government proposes an immediate armistice on all fronts. Hoffmann and Kuhlmann are to receive the Russian delegation at Brest-Litovsk."
 ww1_germany_events.231.a:0 "Open armistice talks."
 ww1_germany_events.231.b:0 "Press the advance in the Ukraine and the Baltic."
 GER_home_front:0 "The Home Front"
 GER_home_front_desc:0 "The Reich war effort depends on the mood of the cities, the loyalty of the Social Democrats and the bread ration."
 GER_dec_war_loans:0 "War Loans Campaign"
 GER_dec_war_loans_desc:0 "Posters and bank rallies ask every citizen to lend the Reich their savings."
 GER_dec_turnip_relief:0 "War Food Office Measures"
 GER_dec_turnip_relief_desc:0 "Ration cards, communal kitchens and price ceilings. Nobody is satisfied but fewer go hungry."
 GER_dec_censor_press:0 "Tighten the Censorship"
 GER_dec_censor_press_desc:0 "Confiscate newspapers and ban strike meetings. Discontent cools, trust in the government does not."
 GER_dec_court_the_spd:0 "Court the Social Democrats"
 GER_dec_court_the_spd_desc:0 "Invite Ebert and Scheidemann to the Chancellery and promise reform after the war."
 GER_dec_kaiser_visits_front:0 "The Emperor Visits the Front"
 GER_dec_kaiser_visits_front_desc:0 "Wilhelm appears in a field-grey uniform among his soldiers. Morale rises for a while."
 GER_dec_eastern_requisition:0 "Requisition from the East"
 GER_dec_eastern_requisition_desc:0 "Grain trains from Ober Ost and the Ukraine feed the home front, at the price of local resentment."
 GER_dec_support_republic:0 "Rally to the Republic"
 GER_dec_support_republic_desc:0 "Mass meetings and the black-red-gold flag. The Republic needs defenders among the people."
 GER_dec_curb_freikorps:0 "Disband the Freikorps"
 GER_dec_curb_freikorps_desc:0 "Fold the volunteer corps into the small regular army allowed by the peace terms."
 GER_dec_stabilise_mark:0 "Introduce the Rentenmark"
 GER_dec_stabilise_mark_desc:0 "A new currency backed by land and industry stops the fall. Sacrifices will be hard."
 side_ww1_ger_rus.50.t:0 "An Invitation to the Red Internationale"
 side_ww1_ger_rus.50.d:0 "Revolutionary Germany proposes that the two socialist republics join in a single bloc against the capitalist powers. Our comrades in Berlin want an answer."
 side_ww1_ger_rus.50.a:0 "Join the Red Internationale."
 side_ww1_ger_rus.50.b:0 "Decline for now."
 side_ww1_ger_rus.51.t:0 "An Invitation to the Continental League"
 side_ww1_ger_rus.51.d:0 "Berlin proposes a continental league of the great monarchies against the maritime powers. A Russian signature would seal the agreement that Björkö once promised."
 side_ww1_ger_rus.51.a:0 "Join the Continental League."
 side_ww1_ger_rus.51.b:0 "Decline for now."
 side_ww1_ger_rus.52.t:0 "Russia Joins Our Bloc"
 side_ww1_ger_rus.52.d:0 "The Russian government has accepted our invitation and takes its place beside us. The Entente powers have been told to expect a new balance in Europe."
 side_ww1_ger_rus.52.a:0 "A great diplomatic success."
 side_ww1_ger_rus.55.t:0 "Russia Declines Our Bloc"
 side_ww1_ger_rus.55.d:0 "St Petersburg has politely declined to join our bloc. The door is not closed, but the moment has passed."
 side_ww1_ger_rus.55.a:0 "We shall try again."
 side_ww1_ger_rus.56.t:0 "Bulgaria Joins the Central Powers"
 side_ww1_ger_rus.56.d:0 "Sofia has accepted the German proposal and signs the alliance. Bulgarian armies will march with ours in the Balkans."
 side_ww1_ger_rus.56.a:0 "Welcome, ally."
 side_ww1_ger_rus.57.t:0 "Bulgaria Declines"
 side_ww1_ger_rus.57.d:0 "Sofia has declined to tie its fate to ours. The Balkan railway remains open, but Bulgarian soldiers will not wear our colours yet."
 side_ww1_ger_rus.57.a:0 "A pity."
 side_ww1_ger_rus.60.t:0 "Germany Proposes Union"
 side_ww1_ger_rus.60.d:0 "With the Habsburg monarchy gone, Berlin offers the Austrian republic union with Germany. Vienna is poor, hungry and divided on the answer."
 side_ww1_ger_rus.60.a:0 "Accept the union with Germany."
 side_ww1_ger_rus.60.b:0 "Decline the offer."
 side_ww1_ger_rus.61.t:0 "Austria Joins the Reich"
 side_ww1_ger_rus.61.d:0 "The Austrian republic has accepted the union. German officials arrive in Vienna to begin the long work of integration."
 side_ww1_ger_rus.61.a:0 "One people, one state."
 side_ww1_ger_rus.62.t:0 "Austria Declines Union"
 side_ww1_ger_rus.62.d:0 "Vienna has turned down our offer of union. The Entente had made its views known, and the Austrian parties chose caution."
 side_ww1_ger_rus.62.a:0 "Perhaps another day."
