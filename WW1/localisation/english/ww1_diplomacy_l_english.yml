l_english:
 ww1_diplomacy.1.t:0 "Germany Issues the Blank Cheque"
 ww1_diplomacy.1.d:0 "The German Imperial Government has assured the Dual Monarchy of Germany's unconditional fidelity and backing under all circumstances. Chancellor Bethmann-Hollweg and General von Moltke urge decisive action against Serbian terrorism."
 ww1_diplomacy.1.a:0 "Deliver the July Ultimatum to Belgrade!"
 ww1_diplomacy.1.b:0 "De-escalate the crisis through diplomacy."

 ww1_diplomacy.2.t:0 "The Austro-Hungarian Ultimatum"
 ww1_diplomacy.2.d:0 "The Austro-Hungarian envoy in Belgrade has delivered an ultimatum with 10 draconian demands, demanding Austrian officials take direct control of Serbian judicial and police institutions to suppress anti-Habsburg agitation."
 ww1_diplomacy.2.a:0 "Reject the ultimatum! Appeal to our Russian brothers!"
 ww1_diplomacy.2.b:0 "Capitulate to the Habsburg demands."

 ww1_diplomacy.3.t:0 "Austria-Hungary Mobilizes"
 ww1_diplomacy.3.d:0 "Our allies in Vienna have stood firm, delivering the ultimatum to Serbia and mobilizing their field armies along the Danube."
 ww1_diplomacy.3.a:0 "The Nibelungen loyalty binds us."

 ww1_diplomacy.4.t:0 "Vienna Backs Down"
 ww1_diplomacy.4.d:0 "The Austro-Hungarian Cabinet has declined to press military demands, choosing diplomatic negotiation. The crisis in the Balkans has deflated."
 ww1_diplomacy.4.a:0 "A missed opportunity for decisive action."

 ww1_diplomacy.5.t:0 "Serbia Under Attack!"
 ww1_diplomacy.5.d:0 "Austro-Hungarian artillery has commenced bombardment of Belgrade! Prince Regent Alexander and the Serbian government desperately appeal to Tsar Nicholas II to protect Slavic independence."
 ww1_diplomacy.5.a:0 "General Mobilization! Russia will never abandon Serbia!"
 ww1_diplomacy.5.b:0 "Russia is unprepared for a continental war. We must stand down."

 ww1_diplomacy.10.t:0 "The Zimmermann Telegram"
 ww1_diplomacy.10.d:0 "A top-secret telegram from German Foreign Secretary Arthur Zimmermann has arrived via diplomatic channels. Germany proposes a defensive and offensive alliance with Mexico, pledging generous financial support and the recovery of Texas, New Mexico, and Arizona."
 ww1_diplomacy.10.a:0 "President Carranza rejects the proposal as suicidal."
 ww1_diplomacy.10.b:0 "Accept the German alliance! Reclaim our lost territories!"

 ww1_diplomacy.11.t:0 "The Zimmermann Telegram Exposed!"
 ww1_diplomacy.11.d:0 "British naval intelligence in Room 40 has intercepted and decrypted a telegram from German Foreign Secretary Arthur Zimmermann offering Mexico an alliance to wage war against the United States!"
 ww1_diplomacy.11.a:0 "An intolerable outrage! Prepare for war!"

 ww1_diplomacy.20.t:0 "Lenin Arrives at the Finland Station"
 ww1_diplomacy.20.d:0 "Vladimir Lenin and his Bolshevik cadre have arrived in Petrograd aboard a sealed train facilitated by the German General Staff. Lenin immediately issues his April Theses, proclaiming 'All Power to the Soviets'!"
 ww1_diplomacy.20.a:0 "The fires of revolution are lit!"

 ww1_diplomacy.30.t:0 "Soviet Russia Sues for Peace"
 ww1_diplomacy.30.d:0 "A Soviet delegation led by Leon Trotsky and Adolph Joffe has arrived at Brest-Litovsk, formally requesting an immediate ceasefire and peace negotiations with the Central Powers."
 ww1_diplomacy.30.a:0 "Dictate the Peace of Brest-Litovsk!"
 ww1_diplomacy.30.b:0 "Reject the truce and crush the Bolsheviks."

 ww1_diplomacy.40.t:0 "The Secret Summit of Björkö"
 ww1_diplomacy.40.d:0 "A secret personal message from the German Kaiser proposes resurrecting the Treaty of Björkö: a bilateral alliance between the German and Russian Empires to divide the Eurasian continent and counter Anglo-Saxon maritime hegemony."
 ww1_diplomacy.40.a:0 "Ratify the Björkö Treaty! The Continental League is born!"
 ww1_diplomacy.40.b:0 "Tear up the proposal. The Entente stands unbroken."

 ww1_diplomacy.50.t:0 "Russian Invitation to Enter the War"
 ww1_diplomacy.50.d:0 "The Russian Imperial Government formally invites the Kingdom of Romania to join the Entente Powers in the war against Austria-Hungary, offering solemn recognition of Romanian claims to Transylvania and Bukovina."
 ww1_diplomacy.50.a:0 "Mobilize the Army! For Greater Romania!"
 ww1_diplomacy.50.b:0 "Maintain armed neutrality for now."

 ww1_diplomacy.60.t:0 "Russia Guarantees Serbia"
 ww1_diplomacy.60.d:0 "Tsar Nicholas II has issued a formal imperial manifesto guaranteeing the territorial integrity and independence of the Kingdom of Serbia against all Austro-Hungarian aggression."
 ww1_diplomacy.60.a:0 "Long Live the Russian Tsar! Slava!"
ww1_diplomacy.70.t:0 "Constantinople and Straits Agreement"
 ww1_diplomacy.70.d:0 "The Imperial Russian Government has submitted formal claims to the Western Entente regarding Constantinople and the Turkish Straits. In exchange for continued total commitment to the defeat of the Central Powers, Russia requests recognition of its historic mission to control the Bosphorus and Dardanelles."
 ww1_diplomacy.70.a:0 "Recognize Russian Primacy over Tsargrad"
 ww1_diplomacy.70.b:0 "The Straits must remain international"
 ww1_diplomacy.71.t:0 "Constantinople Agreement Ratified"
 ww1_diplomacy.71.d:0 "France and the United Kingdom have formally signed the secret Constantinople Agreement of 1915, agreeing to Russian annexation of Tsargrad, Eastern Thrace, and the Straits upon victory over the Ottoman Empire."
 ww1_diplomacy.71.a:0 "The Cross shall rise over the Hagia Sophia!"
 SOV_constantinople_agreement_confirmed_tt:0 "§YThe Western Allies have officially recognized Russian claims to Constantinople and the Turkish Straits.§!"
 SOV_trabzon_amphibious_landing_tt:0 "§GSpawns the Caucasian Plastun Marine Brigade in Batumi with upgraded naval facilities.§!"
 SOV_bochkareva_recruited_tt:0 "§GRecruits General Maria Bochkareva and spawns the 1st Russian Women's Battalion of Death in Petrograd.§!"
