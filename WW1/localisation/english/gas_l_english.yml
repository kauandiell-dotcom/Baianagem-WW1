l_english:
 sp_gas: "Chemical Weapons"
 sp_gas_tech: "Chemical Weapons"
 sp_gas_desc: "The development and refinement of chemical agents designed to incapacitate enemy forces, as well as the means for their delivery and deployment. This field includes research into new toxic compounds, the development of chemical artillery shells, dispersal devices, and specialized munitions, as well as studies into their effectiveness, persistence, methods of use, and protection against chemical warfare agents."
 sp_gas_choice_reward: "Research Focus Selection"
 sp_gas_choice_reward_desc: "We must choose the direction of our chemical warfare program and the development of battlefield delivery methods. We can select one of the following four options:\nChlorine — a cheap and rapidly stockpiled gas.\nPhosgene — a moderately difficult gas to produce with practical battlefield applications.\nMustard Gas — a terrain-contaminating agent that can slow enemy movement.\nSarin — the most expensive, but also the most lethal, gas."
 sp_gas_choice_reward_chlorine: "Chlorine"
 sp_gas_choice_reward_phosgene: "Phosgene"
 sp_gas_choice_reward_mustard_gas: "Mustard Gas"
 sp_gas_choice_reward_sarin: "Sarin"
 chlorine: "Chlorine"
 phosgene: "Phosgene"
 mustard_gas: "Mustard Gas"
 sarin: "Sarin"
 ABILITY_CHLORINE_ATTACK: "Chemical Attack"
 ABILITY_CHLORINE_ATTACK_DESC: "Your units gain offensive and defensive bonuses through the use of chlorine on the battlefield."
 ABILITY_PHOSGENE_ATTACK: "Chemical Attack"
 ABILITY_PHOSGENE_ATTACK_DESC: "Your units gain offensive and defensive bonuses through the use of phosgene on the battlefield, while enemy units suffer reduced movement speed."
 ABILITY_MUSTARD_GAS_ATTACK: "Chemical Attack"
 ABILITY_MUSTARD_GAS_ATTACK_DESC: "Your units gain offensive and defensive bonuses through the use of mustard gas on the battlefield, while enemy units suffer reduced movement speed."
 ABILITY_SARIN_ATTACK: "Chemical Attack"
 ABILITY_SARIN_ATTACK_DESC: "Your units gain offensive and defensive bonuses through the use of sarin on the battlefield, while enemy units suffer reduced movement speed."
 gas.0.t: "Gas Returns to the Battlefield"
 gas.0.a: "The world is turning back the clock."
 gas.1.d: "Disturbing reports are coming from the battlefields of modern warfare: [gas_attacker.GetNameDef] has successfully deployed chemical weapons against its enemies.\n\nAt present, it is difficult to assess the results of the chlorine used directly by the attackers in battle, as well as the outcome of the engagement itself. However, one thing is certain: the world is once again haunted by the ghosts of the past.\n\nOnly time will show how widespread and effective the use of chemical weapons will become in the modern era."
