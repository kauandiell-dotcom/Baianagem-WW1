l_english:
 ENG_ww1_professional_service:0 "Professional Army, Limited Establishment"
 ENG_ww1_professional_service_desc:0 "The standing force is experienced, but rigorous instruction and imperial commitments limit rapid expansion."
 ENG_ww1_naval_estimates:0 "The Admiralty Estimates"
 ENG_ww1_naval_estimates_desc:0 "A naval allocation diverts staff and production from the continental army."
 ENG_ww1_continental_estimates:0 "The Continental Estimates"
 ENG_ww1_continental_estimates_desc:0 "Army preparation receives industrial priority at the expense of shipbuilding."
 ENG_ww1_balanced_estimates:0 "A Balanced Defence Allocation"
 ENG_ww1_balanced_estimates_desc:0 "The government maintains industrial continuity instead of concentrating on one service."
 ENG_ww1_territorial_establishment:0 "Territorial Training Establishment"
 ENG_ww1_territorial_establishment_desc:0 "Training camps prepare units through the normal recruitment queue. They do not create divisions or equipment."
 ENG_ww1_new_army_establishment:0 "New Army Training Camps"
 ENG_ww1_new_army_establishment_desc:0 "A wider voluntary intake needs instructors and time. Recruits still require manpower and equipment."
 ENG_ww1_munitions_ministry:0 "Ministry of Munitions"
 ENG_ww1_munitions_ministry_desc:0 "Industrial coordination improves armament deliveries while occupying civilian administration."
 ENG_ww1_labour_compact:0 "The Munitions Labour Compact"
 ENG_ww1_labour_compact_desc:0 "Wage and workshop agreements preserve cooperation at a civilian economic cost."
 ENG_ww1_emergency_controls:0 "Emergency Industrial Controls"
 ENG_ww1_emergency_controls_desc:0 "Compulsory coordination increases production while weakening political cooperation."
 ENG_ww1_war_cabinet:0 "The War Cabinet"
 ENG_ww1_war_cabinet_desc:0 "A compact cabinet coordinates wartime planning and economic demands. Its mandate ends with the war."
 ENG_ww1_convoy_service:0 "The Convoy Coordination Service"
 ENG_ww1_convoy_service_desc:0 "Organized routing helps actual escort missions. Merchant ships and escorts still need to sail."
 ENG_ww1_army_service_corps:0 "Army Service Corps Organization"
 ENG_ww1_army_service_corps_desc:0 "Transport offices reduce waste while tying up a civilian administration allocation."
 ENG_ww1_air_observation_service:0 "Aerial Observation Service"
 ENG_ww1_air_observation_service_desc:0 "Observers circulate reconnaissance reports; the service does not grant modern bombing capabilities."
 ENG_ww1_royal_air_force_service:0 "An Integrated Royal Air Force"
 ENG_ww1_royal_air_force_service_desc:0 "An integrated air service replaces earlier observation administration."
 ENG_ww1_irish_conciliation:0 "Irish Constitutional Conciliation"
 ENG_ww1_irish_conciliation_desc:0 "Political accommodation accompanies real regional self-government costs."
 ENG_ww1_irish_repression:0 "Emergency Irish Policing"
 ENG_ww1_irish_repression_desc:0 "A temporary policing effort diverts civilian resources and weakens trust."
 ENG_ww1_unsanctioned_conscription:0 "Conscription Without a Parliamentary Mandate"
 ENG_ww1_unsanctioned_conscription_desc:0 "Recruitment was expanded before the legislature authorised it. Regularising the law or returning to voluntary service ends this opposition."
 ENG_ww1_debt_pressure_1:0 "Public Debt Service: Manageable"
 ENG_ww1_debt_pressure_1_desc:0 "Borrowed industrial and wartime commitments require continuing civilian expenditure."
 ENG_ww1_debt_pressure_2:0 "Public Debt Service: Heavy"
 ENG_ww1_debt_pressure_2_desc:0 "Debt service limits the resources available for further programmes."
 ENG_ww1_debt_pressure_3:0 "Public Debt Service: Severe"
 ENG_ww1_debt_pressure_3_desc:0 "Sustained borrowing imposes a serious fiscal burden. Repayment needs resources and time."
 ENG_ww1_veterans_settlement:0 "Veterans and Civilian Employment"
 ENG_ww1_veterans_settlement_desc:0 "Reintegration and employment require a continuing welfare allocation."
 ENG_ww1_housing_programme:0 "The Housing and Public Health Programme"
 ENG_ww1_housing_programme_desc:0 "Postwar social recovery consumes a civilian construction allocation."
 ENG_ww1_naval_economy:0 "Naval Economy After the War"
 ENG_ww1_naval_economy_desc:0 "Reduced peacetime shipbuilding frees civilian resources; the programme does not impose a fictional international tonnage treaty."
 ENG_ww1_cabinet_consultation:0 "Imperial Cabinet Consultation"
 ENG_ww1_cabinet_consultation_desc:0 "Formal consultation coordinates existing governments instead of annexing their populations."
 ww1_britain_irish_devolution:0 "Irish Regional Government"
 ww1_britain_irish_exemption:0 "Voluntary Irish Military Service"
