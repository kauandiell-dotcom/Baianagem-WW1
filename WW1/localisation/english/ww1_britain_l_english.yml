l_english:
 ENG_call_indian_corps_tt:0 "Mobilises 40,000 Indian Corps troops with infantry equipment from the British Raj."
 ENG_city_of_london_credit:0 "City of London Global Credit"
 ENG_city_of_london_credit_desc:0 "The City of London stands as the preeminent financial hub of the globe, providing unparalleled commercial borrowing, cheap consumer goods, and sterling liquidity."
 ENG_city_of_london_credit_t2:0 "Lloyd George's Ministry of Munitions"
 ENG_city_of_london_credit_t2_desc:0 "The Ministry of Munitions takes direct wartime control over private industrial plants, converting factories into colossal armament complexes."
 ENG_city_of_london_credit_t3:0 "Total Industrial Mobilisation & Sterling Resilience"
 ENG_city_of_london_credit_t3_desc:0 "British war manufacturing operates at peak output, overcoming material shortages while securing post-war financial stability."
 ENG_irish_home_rule_compromise:0 "Irish Constitutional Compromise"
 ENG_irish_home_rule_compromise_desc:0 "Negotiated devolution safeguards regional sensibilities, cementing domestic peace and civilian recruitment stability."
 ENG_irish_home_rule_suspended:0 "Home Rule Suspended for War"
 ENG_irish_home_rule_suspended_desc:0 "Nationalist and Unionist leaders accept a temporary parliamentary armistice to present a united front against hostile powers."
 ENG_irish_home_rule_tension:0 "The Irish Home Rule Crisis"
 ENG_irish_home_rule_tension_desc:0 "Fierce parliamentary deadlock and armed sectarian militias in Ulster and Dublin threaten the constitutional stability of the United Kingdom."
 ENG_professional_bef:0 "The Professional Expeditionary Force (BEF)"
 ENG_professional_bef_desc:0 "An elite, highly disciplined standing army famed for its rapid-fire rifle marksmanship, yet strictly constrained by peacetime voluntary recruitment."
 ENG_professional_bef_t2:0 "Kitchener's New Armies"
 ENG_professional_bef_t2_desc:0 "Millions of patriotic volunteers answer Lord Kitchener's call, expanding Britain's small regular core into a formidable mass citizen army."
 ENG_professional_bef_t3:0 "The Continental Hammer & Combined Arms"
 ENG_professional_bef_t3_desc:0 "Imperial field armies master modern combined arms tactics, integrating creeping barrages, automatic fire, and heavy breakthrough tanks."
 ENG_the_imperial_web:0 "The Imperial Web"
 ENG_the_imperial_web_desc:0 "Coaling stations, undersea telegraph cables, and preferential trading links bind the Dominions and Crown Colonies into an indivisible global network."
 ENG_the_imperial_web_t2:0 "Dominion Expeditionary Mobilisation"
 ENG_the_imperial_web_t2_desc:0 "Divisions from Canada, Australia, New Zealand, South Africa, and India deploy across global fronts, bound by common imperial loyalty."
 ENG_the_imperial_web_t3:0 "The Imperial War Cabinet"
 ENG_the_imperial_web_t3_desc:0 "Dominion prime ministers sit in London alongside the British government, co-directing global strategy as an equal imperial partnership."
 ENG_two_power_standard:0 "The Two-Power Standard"
 ENG_two_power_standard_desc:0 "The strategic doctrine maintaining a battle fleet equal to or surpassing the combined strength of the next two naval powers guarantees command of the sea."
 ENG_two_power_standard_t2:0 "Grand Fleet Mobilisation"
 ENG_two_power_standard_t2_desc:0 "Concentration of the Grand Fleet at Scapa Flow and Cromarty enforces a vigilant northern blockade and instant surface fleet readiness."
 ENG_two_power_standard_t3:0 "Mistress of the Seas & ASDIC Dominance"
 ENG_two_power_standard_t3_desc:0 "Cutting-edge anti-submarine acoustics, hydrophones, depth charges, and comprehensive convoy escort networks protect imperial commerce."
 ENG_ww1_1911_1923:0 "The British Empire in the Great War"
 ENG_ww1_1911_1923_desc:0 "The British Empire spans every ocean and continent, preserving global order and European equilibrium through naval mastery and industrial preeminence."
 ENG_ww1_a_commonwealth_consultation_charter:0 "Commonwealth Partnership Charter"
 ENG_ww1_a_commonwealth_consultation_charter_desc:0 "The British Empire transforms into an egalitarian Commonwealth of free nations, bound by voluntary allegiance and constitutional liberty."
 ENG_ww1_a_european_security_settlement:0 "A European Security Settlement"
 ENG_ww1_a_european_security_settlement_desc:0 "British founding sponsorship of the League of Nations and the codification of collective security establish a diplomatic order anchored in international law."
 ENG_ww1_a_limited_offensive_doctrine:0 "A Limited Offensive Doctrine"
 ENG_ww1_a_limited_offensive_doctrine_desc:0 "'Bite and hold' tactics: capturing limited objectives under overwhelming artillery protection, then demolishing enemy counterattacks with pre-sighted fire."
 ENG_ww1_a_smaller_professional_force:0 "A Smaller Professional Postwar Force"
 ENG_ww1_a_smaller_professional_force_desc:0 "Return to an all-volunteer, highly motorized cadre army optimized for rapid imperial policing, garrisons, and expeditionary interventions."
 ENG_ww1_a_sustainable_air_establishment:0 "Trenchard's Permanent RAF Establishment"
 ENG_ww1_a_sustainable_air_establishment_desc:0 "Founding RAF College Cranwell and developing imperial air-control doctrine ensures the permanent survival and prestige of the Royal Air Force."
 ENG_ww1_admiralty_fleet_survey:0 "Admiralty Fleet Survey"
 ENG_ww1_admiralty_fleet_survey_desc:0 "First Lord of the Admiralty and First Sea Lord Jackie Fisher survey the global fleet, reasserting the Two-Power Standard to ensure unmatched naval dominance."
 ENG_ww1_admiralty_war_staff:0 "Admiralty War Staff"
 ENG_ww1_admiralty_war_staff_desc:0 "Staff officers plan the war at sea, not just the next manoeuvre."
 ENG_ww1_aerial_photography_research:0 "Stereoscopic Aerial Photography"
 ENG_ww1_aerial_photography_research_desc:0 "Stereoscopic cameras reveal trench depths, subterranean concrete dugouts, and camouflaged battery positions with mathematical precision."
 ENG_ww1_aerial_reconnaissance_reports:0 "Aerial Reconnaissance and Trench Mapping"
 ENG_ww1_aerial_reconnaissance_reports_desc:0 "Fuselage-mounted cameras photograph enemy sectors daily, supplying the General Staff with up-to-the-minute trench maps of the Western Front."
 ENG_ww1_air_observation_service:0 "Aerial Observation Service"
 ENG_ww1_air_observation_service_desc:0 "Observers circulate reconnaissance reports; the service does not grant modern bombing capabilities."
 ENG_ww1_aircraft_engine_reliability:0 "Rolls-Royce Aero Engine Reliability"
 ENG_ww1_aircraft_engine_reliability_desc:0 "Rolls-Royce Eagle and Falcon V12 liquid-cooled engines establish world-beating standards of horsepower, mechanical endurance, and high-altitude speed."
 ENG_ww1_aircraft_engine_research:0 "Aero Engine Supercharging Research"
 ENG_ww1_aircraft_engine_research_desc:0 "Royal Aircraft Factory engineers design mechanical superchargers and high-altitude carburetors to dominate the thin air above 18,000 feet."
 ENG_ww1_aircraft_production_contracts:0 "National Aircraft Production Contracts"
 ENG_ww1_aircraft_production_contracts_desc:0 "Sopwith, De Havilland, Vickers, and Handley Page receive sweeping government orders, propelling British aircraft production to world-leading scale."
 ENG_ww1_american_credit_negotiations:0 "American Credit Negotiations"
 ENG_ww1_american_credit_negotiations_desc:0 "Appointing J.P. Morgan as Britain's purchasing agent in New York opens vast commercial credit syndicates and munitions access across the United States."
 ENG_ww1_andrew_bonar_law:0 "Andrew Bonar Law"
 ENG_ww1_armed_neutrality:0 "Armed Neutrality and Vigilance"
 ENG_ww1_armed_neutrality_desc:0 "While diplomatic avenues are exhausted, British coastal artillery is manned and the Grand Fleet quietly sails to its war stations in northern waters."
 ENG_ww1_armed_neutrality_tt:0 "Britain maintains armed neutrality, safeguarding the Empire without continental entanglements."
 ENG_ww1_armistice_consultations:0 "Armistice Consultations"
 ENG_ww1_armistice_consultations_desc:0 "Allied heads of state draft uncompromising armistice terms: the surrender of the High Seas Fleet, total evacuation of occupied territories, and Allied control of the Rhine."
 ENG_ww1_army_service_corps:0 "Army Service Corps Organization"
 ENG_ww1_army_service_corps_desc:0 "Transport offices reduce waste while tying up a civilian administration allocation."
 ENG_ww1_army_service_corps_offices:0 "Army Service Corps Logistics"
 ENG_ww1_army_service_corps_offices_desc:0 "The rapid expansion of mechanical motor transport and forward railhead depots under the Army Service Corps guarantees uninterrupted battlefield supply lines."
 ENG_ww1_artillery_ammunition_concentration:0 "Artillery Ammunition Concentration"
 ENG_ww1_artillery_ammunition_concentration_desc:0 "Vast ammunition parks accumulate millions of high-explosive and shrapnel shells, feeding unprecedented artillery concentrations before major assaults."
 ENG_ww1_artillery_spotting_liaison:0 "Artillery Spotting Liaison"
 ENG_ww1_artillery_spotting_liaison_desc:0 "Close-knit communication codes between RE8 spotters and corps artillery headquarters maximize counter-battery lethality."
 ENG_ww1_artillery_survey_mathematics:0 "Sound Ranging and Artillery Mathematics"
 ENG_ww1_artillery_survey_mathematics_desc:0 "Nobel laureate Lawrence Bragg develops sound-ranging microphone arrays that pinpoint hidden German heavy batteries within seconds of firing."
 ENG_ww1_assault_coordination_exercises:0 "Tank Assault Coordination Exercises"
 ENG_ww1_assault_coordination_exercises_desc:0 "At Cambrai, hundreds of tanks breach the formidable Hindenburg wire without preliminary bombardment, demonstrating modern armored breakthrough."
 ENG_ww1_austerity_and_public_credit:0 "Austerity and Public Credit"
 ENG_ww1_austerity_and_public_credit_desc:0 "Mass-market National War Bonds mobilize domestic savings across all social strata, underpinning sovereign wartime credit with patriotic discipline."
 ENG_ww1_australian_defence_consultation:0 "Australian Imperial Force (AIF)"
 ENG_ww1_australian_defence_consultation_desc:0 "Volunteers of the Australian Imperial Force, led by Sir John Monash, master combined-arms warfare at Hamel and spearhead the Hundred Days Offensive."
 ENG_ww1_autonomy_consultation:0 "Imperial consultation"
 ENG_ww1_balanced_estimates:0 "A Balanced Defence Allocation"
 ENG_ww1_balanced_estimates_desc:0 "The government maintains industrial continuity instead of concentrating on one service."
 ENG_ww1_balkan_allied_coordination:0 "Balkan Allied Coordination"
 ENG_ww1_balkan_allied_coordination_desc:0 "The Salonika expedition and munitions deliveries to Serbia, Romania, and Greece pin Bulgarian forces and destabilize the Central Powers' southern flank."
 ENG_ww1_battlecruiser_squadron_planning:0 "Beatty's Battlecruiser Squadrons"
 ENG_ww1_battlecruiser_squadron_planning_desc:0 "Swift capital ships of the Lion and Tiger classes under Admiral David Beatty provide aggressive reconnaissance and hunt down enemy raiders at 28 knots."
 ENG_ww1_belgian_treaty_obligations:0 "Belgian Treaty Obligations"
 ENG_ww1_belgian_treaty_obligations_desc:0 "Upholding the solemn 1839 Treaty of London, Great Britain delivers an ultimatum demanding German withdrawal from neutral Belgium, entering the world conflict."
 ENG_ww1_bomber_range_experiments:0 "Handley Page Heavy Bomber Development"
 ENG_ww1_bomber_range_experiments_desc:0 "The massive twin-engine Handley Page O/400 carries heavy bomb loads, enabling the independent bombing of industrial targets along the Rhine."
 ENG_ww1_bristol_scout_trials:0 "Bristol Scout Speed Trials"
 ENG_ww1_bristol_scout_trials_desc:0 "The agile Bristol Scout establishes high-speed single-seat biplanes as the premier instrument for aggressive air combat and reconnaissance escort."
 ENG_ww1_cabinet_consultation:0 "Imperial Cabinet Consultation"
 ENG_ww1_cabinet_consultation_desc:0 "Formal consultation coordinates existing governments instead of annexing their populations."
 ENG_ww1_cabinet_policy:0 "Cabinet Policy and Parliamentary Estimates"
 ENG_ww1_cabinet_policy_desc:0 "Defence allocations reserve civilian administration and divert production between services. Debt burden: [?ww 1_britain_debt_burden|0]. Reversing a neutral policy requires new consultations; allies may refuse admission."
 ENG_ww1_canadian_defence_consultation:0 "Canadian Corps Mobilization"
 ENG_ww1_canadian_defence_consultation_desc:0 "Canada rallies hundreds of thousands of volunteers; under Sir Arthur Currie, the Canadian Corps emerges as the premier shock formation on the Western Front."
 ENG_ww1_channel_expeditionary_coordination:0 "Channel Expeditionary Coordination"
 ENG_ww1_channel_expeditionary_coordination_desc:0 "The Admiralty institutes the Dover Patrol and heavily minelands the Straits, securing the passage of millions of British soldiers and supplies into French ports."
 ENG_ww1_chemical_protection_research:0 "Porton Down Chemical Protection Research"
 ENG_ww1_chemical_protection_research_desc:0 "Scientists at Porton Down engineer activated-charcoal filters and neutralizing ointments to completely shield Allied soldiers from mustard and phosgene gas."
 ENG_ww1_city_credit_line_buff:0 "City of London Credit Facility"
 ENG_ww1_city_credit_line_buff_desc:0 "The Bank of England and private banking houses issue emergency discount lines to ease government finances."
 ENG_ww1_civil_aviation_research:0 "Civil Aviation and Imperial Airways"
 ENG_ww1_civil_aviation_research_desc:0 "Conversion of multi-engine bombers for long-range mail and passenger service, establishing pioneering air routes connecting London across the Empire."
 ENG_ww1_civilian_training_for_returning_soldiers:0 "Civilian Training for Returning Soldiers"
 ENG_ww1_civilian_training_for_returning_soldiers_desc:0 "Government training colleges qualify returning servicemen in modern mechanical engineering, electrical installations, and industrial trades."
 ENG_ww1_clyde_shipyard_contracts:0 "Clyde Shipyard Contracts"
 ENG_ww1_clyde_shipyard_contracts_desc:0 "The shipyards along Scotland's River Clyde receive heavy naval orders for destroyers, escort craft, and capital ships to sustain British sea supremacy."
 ENG_ww1_coal_allocation:0 "Coal Allocation"
 ENG_ww1_coal_allocation_desc:0 "Industry has priority over household use."
 ENG_ww1_coal_to_allies:0 "Ship Coal to the Allies"
 ENG_ww1_coal_to_allies_desc:0 "Spend 15 political power. At war, offer coal to each member of the British faction; each one that accepts gains 2% stability and British debt rises by 1 per acceptance. Requires the coal allocation."
 ENG_ww1_coalition_shipping_priorities:0 "Coalition Shipping Priorities"
 ENG_ww1_coalition_shipping_priorities_desc:0 "The Allied Maritime Transport Council pools merchant tonnage, coordinating grain, coal, and ore shipments to sustain Allied industrial resilience."
 ENG_ww1_colonial_labour_contracts:0 "Auxiliary Labor Corps"
 ENG_ww1_colonial_labour_contracts_desc:0 "Hundreds of thousands of workers keep French ports and supply railheads operating around the clock, relieving combat troops for frontline service."
 ENG_ww1_colonial_medical_services:0 "Imperial Medical Services"
 ENG_ww1_colonial_medical_services_desc:0 "Expanded field dressing stations, motor ambulances, and convalescent depots preserve the lives of wounded soldiers across European and tropical theaters."
 ENG_ww1_combined_arms_staff:0 "Combined Arms"
 ENG_ww1_combined_arms_staff_courses:0 "Combined Arms Staff Courses"
 ENG_ww1_combined_arms_staff_courses_desc:0 "Staff colleges train commanders to orchestrate tanks, low-flying air support, creeping barrages, and infantry assaults into a seamless, synchronized hammer blow."
 ENG_ww1_combined_arms_staff_desc:0 "Staffs learn to plan infantry, artillery and aviation as a single system."
 ENG_ww1_commonwealth_consultation:0 "Commonwealth Consultation"
 ENG_ww1_commonwealth_consultation_desc:0 "The empire becomes a community of nations with a voice of its own."
 ENG_ww1_continental_commitment:0 "Continental Commitment"
 ENG_ww1_continental_commitment_desc:0 "Britain formally affirms that Western European liberty and the defense of northern France are inseparable from the sovereign security of the British Empire."
 ENG_ww1_continental_commitment_tt:0 "Britain commits fully to the continental alliance with France and Russia."
 ENG_ww1_continental_estimates:0 "The Continental Estimates"
 ENG_ww1_continental_estimates_desc:0 "Army preparation receives industrial priority at the expense of shipbuilding."
 ENG_ww1_convert_the_war_plants:0 "Convert the War Plants"
 ENG_ww1_convert_the_war_plants_desc:0 "Explosive and shell plants transition to civilian production of locomotives, commercial motorcars, and consumer goods to kickstart the postwar economy."
 ENG_ww1_convoy_service:0 "The Convoy Coordination Service"
 ENG_ww1_convoy_service_desc:0 "Organized routing helps actual escort missions. Merchant ships and escorts still need to sail."
 ENG_ww1_convoy_system:0 "Convoy System"
 ENG_ww1_convoy_system_desc:0 "Merchant ships travel in groups under escort. Escorts are more effective, but the yards spend capacity on escort vessels."
 ENG_ww1_convoy_system_organisation:0 "The Convoy System Organisation"
 ENG_ww1_convoy_system_organisation_desc:0 "Lloyd George's historic 1917 mandate grouping merchant ships under naval destroyer escort dramatically breaks the unrestricted submarine campaign."
 ENG_ww1_creeping_barrage:0 "Creeping Barrage"
 ENG_ww1_creeping_barrage_desc:0 "Artillery advances ahead of the infantry, by the clock."
 ENG_ww1_david_lloyd_george:0 "David Lloyd George"
 ENG_ww1_debt_pressure_1:0 "Public Debt Service: Manageable"
 ENG_ww1_debt_pressure_1_desc:0 "Borrowed industrial and wartime commitments require continuing civilian expenditure."
 ENG_ww1_debt_pressure_2:0 "Public Debt Service: Heavy"
 ENG_ww1_debt_pressure_2_desc:0 "Debt service limits the resources available for further programmes."
 ENG_ww1_debt_pressure_3:0 "Public Debt Service: Severe"
 ENG_ww1_debt_pressure_3_desc:0 "Sustained borrowing imposes a serious fiscal burden. Repayment needs resources and time."
 ENG_ww1_debt_service_commission:0 "Debt Service Commission"
 ENG_ww1_debt_service_commission_desc:0 "Treasury and Bank of England specialists structure long-term debt repayment frameworks to safeguard the value of the Pound Sterling globally."
 ENG_ww1_defence_of_the_realm:0 "Defence of the Realm"
 ENG_ww1_defence_of_the_realm_desc:0 "Emergency powers over the press, trades and movement."
 ENG_ww1_depth_charge_trials:0 "Type D Depth Charge Trials"
 ENG_ww1_depth_charge_trials_desc:0 "The definitive anti-submarine weapon: hydrostatic pressure-detonated canisters that shatter submerged U-boat pressure hulls with catastrophic force."
 ENG_ww1_destroyer_flotilla_planning:0 "Fleet Destroyer Flotillas"
 ENG_ww1_destroyer_flotilla_planning_desc:0 "Mass construction of V and W class fleet destroyers armed with high-velocity 4-inch guns and torpedo tubes to screen capital ship battle lines."
 ENG_ww1_disability_pension_administration:0 "Disability Pension Administration"
 ENG_ww1_disability_pension_administration_desc:0 "The Ministry of Pensions secures lifelong financial sustenance and specialized clinical treatment for disabled veterans and war widows."
 ENG_ww1_district_contracts_buff:0 "District Production Contracts"
 ENG_ww1_district_contracts_buff_desc:0 "Allocated civilian contracts accelerate munitions output and state industrial construction."
 ENG_ww1_domestic_coal_allocation:0 "Domestic Coal Allocation"
 ENG_ww1_domestic_coal_allocation_desc:0 "High-calorific Welsh and Yorkshire steam coal is strategically rationed to feed Grand Fleet boilers, munitions furnaces, and export commitments."
 ENG_ww1_dominion_procurement:0 "Dominion Procurement"
 ENG_ww1_dominion_procurement_desc:0 "Procurement offices link London's industry to the Dominions' raw materials."
 ENG_ww1_dominion_procurement_offices:0 "Dominion War Supply Integration"
 ENG_ww1_dominion_procurement_offices_desc:0 "Canadian shell foundries, Australian durum wheat, and New Zealand wool are systematically funneled into the imperial logistical pipeline."
 ENG_ww1_dominion_status_for_ireland:0 "Anglo-Irish Treaty & Dominion Status"
 ENG_ww1_dominion_status_for_ireland_desc:0 "The establishment of the Irish Free State as a self-governing Dominion ends decades of bitter conflict while securing essential Treaty Ports for the Royal Navy."
 ENG_ww1_dominion_war_cabinet_delegates:0 "Dominion War Cabinet Delegates"
 ENG_ww1_dominion_war_cabinet_delegates_desc:0 "Eminent Dominion statesmen direct high military councils, coordinating resources across five continents toward imperial victory."
 ENG_ww1_dreadnought_construction_planning:0 "Queen Elizabeth Class Super-Dreadnoughts"
 ENG_ww1_dreadnought_construction_planning_desc:0 "Fast dreadnoughts armed with formidable 15-inch guns and thick armor plating guarantee overwhelming firepower in any North Sea battle-line duel."
 ENG_ww1_edward_grey_and_the_entente:0 "Sir Edward Grey and the Entente Cordiale"
 ENG_ww1_edward_grey_and_the_entente_desc:0 "Foreign Secretary Sir Edward Grey pursues a determined diplomatic strategy to balance German expansionism, reinforcing bilateral understandings with France and Russia."
 ENG_ww1_egyptian_political_negotiations:0 "Egyptian Protectorate Treaty"
 ENG_ww1_egyptian_political_negotiations_desc:0 "Formalization of the British Protectorate over Egypt guarantees the inviolability of the Suez Canal and stages the triumphant Levant campaigns."
 ENG_ww1_electoral_registration:0 "Electoral Registration Act"
 ENG_ww1_electoral_registration_desc:0 "Modernized voter rolls throughout the United Kingdom enhance civic participation and administrative responsiveness across regional constituencies."
 ENG_ww1_embarkation_depot_preparation:0 "Embarkation Depot Preparation"
 ENG_ww1_embarkation_depot_preparation_desc:0 "Vast staging depots, heavy crane networks, and supply camps at Southampton and Portsmouth ensure 24-hour round-the-clock embarkation cycles."
 ENG_ww1_emergency_controls:0 "Emergency Industrial Controls"
 ENG_ww1_emergency_controls_desc:0 "Compulsory coordination increases production while weakening political cooperation."
 ENG_ww1_emergency_factory_controls:0 "Emergency Factory Controls"
 ENG_ww1_emergency_factory_controls_desc:0 "Over five thousand manufacturing plants are gazetted as 'Controlled Establishments', operating under direct government scheduling to maximize war output."
 ENG_ww1_emergency_suppression:0 "Suppress the Agitation"
 ENG_ww1_emergency_suppression_desc:0 "Spend 15 political power. Irish tension falls by 5, Ulster tension falls by 3 and stability falls by 1%. Requires Irish tension above 50."
 ENG_ww1_empire_policy:0 "Imperial and Irish Policy"
 ENG_ww1_empire_policy_desc:0 "Dominion consultations and emergency measures in Ireland. Dominion consent: [?ww1_britain_dominion_consent|0]. Irish tension: [?ww1_britain_irish_tension|0]. Ulster tension: [?ww1_britain_ulster_tension|0]."
 ENG_ww1_engine_reliability:0 "Reliable Engines"
 ENG_ww1_engine_reliability_desc:0 "Standard parts and field workshops reduce engine failures."
 ENG_ww1_enlarged_franchise:0 "Enlarged Electorate"
 ENG_ww1_enlarged_franchise_desc:0 "Millions of new voters, men and women, demand more of Parliament."
 ENG_ww1_escort_refit_contracts:0 "Escort Refit Contracts"
 ENG_ww1_escort_refit_contracts_desc:0 "Civilian trawlers, coastal craft, and yachts are armed with 12-pounder guns and depth charge racks to saturate coastal approaches against raiders."
 ENG_ww1_explosive_safety_research:0 "Explosive Chemistry and Amatol Research"
 ENG_ww1_explosive_safety_research_desc:0 "Pioneering Amatol propellant blends solves acute TNT shortages while rigid stabilization chemical formulas eliminate horrific magazine flash accidents."
 ENG_ww1_field_medical_organisation:0 "Royal Army Medical Corps Organisation"
 ENG_ww1_field_medical_organisation_desc:0 "Motor ambulance convoys, forward casualty clearing stations, and blood transfusion protocols established by the RAMC dramatically reduce frontline mortality."
 ENG_ww1_field_wireless_research:0 "Marconi Field Wireless Transmitters"
 ENG_ww1_field_wireless_research_desc:0 "Portable pack and vehicle-mounted spark transmitters engineered with Marconi link corps headquarters directly to forward artillery coordination posts."
 ENG_ww1_fighter_squadron_instruction:0 "RFC Fighter Squadron Instruction"
 ENG_ww1_fighter_squadron_instruction_desc:0 "Combat doctrines developed by aces like Mick Mannock flying agile Sopwith Camels and SE5as secure hard-fought air supremacy over the Western Front."
 ENG_ww1_flanders_supply:0 "Flanders Supply"
 ENG_ww1_flanders_supply_desc:0 "Ports, canals and railways carry supplies forward with less waste."
 ENG_ww1_food_control:0 "Food Control"
 ENG_ww1_food_control_desc:0 "Prices and rationing under the Ministry of Food."
 ENG_ww1_french_staff_conversations:0 "French Staff Conversations"
 ENG_ww1_french_staff_conversations_desc:0 "General Henry Wilson and the French General Staff secretly coordinate troop embarkation ports, railway timetables, and assembly zones for the British Expeditionary Force."
 ENG_ww1_fund_home_air_defence:0 "Fund Home Air Defence"
 ENG_ww1_fund_home_air_defence_desc:0 "Spend 30 political power. At war, war support +1%, debt +1 and 2 air experience. Available once a year after the home air defence coordination."
 ENG_ww1_gas_protection_training:0 "Gas Protection and Box Respirator Training"
 ENG_ww1_gas_protection_training_desc:0 "Universal issuance of the Small Box Respirator and realistic gas-chamber drills inoculate British soldiers against the lethal menace of chemical warfare."
 ENG_ww1_general_staff_lessons:0 "Lessons of the War"
 ENG_ww1_general_staff_lessons_desc:0 "The staff turns four years of mistakes into manuals."
 ENG_ww1_grand_fleet_anchorage:0 "Grand Fleet Anchorages"
 ENG_ww1_grand_fleet_anchorage_desc:0 "Scapa Flow and Rosyth give the Grand Fleet shelter, coal and workshops."
 ENG_ww1_grand_fleet_maintenance:0 "The Grand Fleet at Scapa Flow"
 ENG_ww1_grand_fleet_maintenance_desc:0 "Under Admiral Sir John Jellicoe, the greatest concentration of dreadnoughts in world history remains permanently fueled and manned at Scapa Flow."
 ENG_ww1_haldane_reforms:0 "Haldane Reforms"
 ENG_ww1_haldane_reforms_desc:0 "A small but organised army, with trained reserves and a general staff."
 ENG_ww1_historical_ai_plan:0 "British Great War Administration"
 ENG_ww1_historical_ai_plan_desc:0 "Prewar preparation, continental cooperation, wartime institutions and postwar recovery."
 ENG_ww1_holding_the_continental_line:0 "Holding the Continental Line"
 ENG_ww1_holding_the_continental_line_desc:0 "At Ypres and Festubert, British battalions dig into the frozen mud, withstanding massive bombardments and preserving the Channel ports at all costs."
 ENG_ww1_home_air_defence:0 "Home Air Defence"
 ENG_ww1_home_air_defence_coordination:0 "London Air Defence Coordination"
 ENG_ww1_home_air_defence_coordination_desc:0 "Integration of anti-aircraft gun rings, searchlight batteries, and night fighters under General Ashmore neutralizes German Gotha raids on London."
 ENG_ww1_home_air_defence_desc:0 "Guns, searchlights and watchers protect London. The public sleeps a little easier."
 ENG_ww1_home_rule_bill:0 "Third Irish Home Rule Bill"
 ENG_ww1_home_rule_bill_desc:0 "The introduction of self-governance for Ireland triggers fervent celebrations across nationalist counties while provoking vehement resistance in Ulster."
 ENG_ww1_housing_and_civilian_employment:0 "Housing and Civilian Employment"
 ENG_ww1_housing_and_civilian_employment_desc:0 "The Addison Housing Act finances high-standard council housing with sanitation for demobilized veterans, generating widespread civilian employment."
 ENG_ww1_housing_programme:0 "The Housing and Public Health Programme"
 ENG_ww1_housing_programme_desc:0 "Postwar social recovery consumes a civilian construction allocation."
 ENG_ww1_hydrophone_analysis_laboratory:0 "ASDIC Acoustic Analysis Laboratory"
 ENG_ww1_hydrophone_analysis_laboratory_desc:0 "Ernest Rutherford and Allied researchers develop piezoelectric quartz transducers, birthing the world's first active acoustic submarine detection (ASDIC)."
 ENG_ww1_hydrophone_trials:0 "Hydrophone Detection Trials"
 ENG_ww1_hydrophone_trials_desc:0 "Admiralty researchers pioneer directional underwater hydrophones, enabling patrol craft to track submerged U-boat propeller vibrations."
 ENG_ww1_imperial_administration:0 "Imperial Communications Administration"
 ENG_ww1_imperial_administration_desc:0 "Established stations reduce some maritime losses, while consultations across the empire consume political attention. Dominion forces and materiel require separate agreements."
 ENG_ww1_imperial_defence_after_the_war:0 "Postwar Imperial Defense Architecture"
 ENG_ww1_imperial_defence_after_the_war_desc:0 "Integrated naval and air garrisons throughout the globe ensure that the British Empire emerges from the Great War as the preeminent global power."
 ENG_ww1_imperial_sealift:0 "Imperial Sealift"
 ENG_ww1_imperial_sealift_desc:0 "Merchant ships and escorts link the metropole, the Dominions and India."
 ENG_ww1_imperial_troop_transport:0 "Imperial Troop Convoy Escorts"
 ENG_ww1_imperial_troop_transport_desc:0 "Luxury ocean liners, including the Olympic and Mauretania, are armed as high-speed troopships, ferrying hundreds of thousands safely across oceans."
 ENG_ww1_indian_army_liaison:0 "Indian Army Global Mobilization"
 ENG_ww1_indian_army_liaison_desc:0 "Over 1.3 million Indian soldiers deploy across France, Mesopotamia, and Egypt, providing indispensable manpower and fighting valor to imperial fronts."
 ENG_ww1_indian_constitutional_consultation:0 "Montagu Declaration on India"
 ENG_ww1_indian_constitutional_consultation_desc:0 "The historic Montagu Declaration pledges gradual development of self-governing institutions, honoring India's monumental contribution to the war effort."
 ENG_ww1_industrial_conversion:0 "Industrial Conversion"
 ENG_ww1_industrial_conversion_desc:0 "War industry returns to civilian use."
 ENG_ww1_industrial_conversion_planning:0 "Industrial Conversion Planning"
 ENG_ww1_industrial_conversion_planning_desc:0 "Civilian planners and business federations facilitate the conversion of propellant plants into chemical fertilizer and synthetic dye manufacturers."
 ENG_ww1_industrial_district_surveys:0 "Industrial District Surveys"
 ENG_ww1_industrial_district_surveys_desc:0 "A thorough survey of British manufacturing heartlands maps machine-tool capacity, forging facilities, and workshop availability for defense contracts."
 ENG_ww1_industrial_patent_exchanges:0 "Anglo-Allied Industrial Patent Exchanges"
 ENG_ww1_industrial_patent_exchanges_desc:0 "Reciprocal patent pooling in industrial chemistry, optical glass, and petroleum cracking accelerates postwar manufacturing modernizations."
 ENG_ww1_irish_conciliation:0 "Irish Constitutional Conciliation"
 ENG_ww1_irish_conciliation_desc:0 "Political accommodation accompanies real regional self-government costs."
 ENG_ww1_irish_divisions:0 "Irish Constitutional Divisions"
 ENG_ww1_irish_divisions_desc:0 "The dispute weakens domestic cooperation. Its initial national penalty is limited; unresolved tensions can develop into an actual political crisis. Devolution or an Irish settlement can end this opening penalty."
 ENG_ww1_irish_parliamentary_support:0 "Irish Parliamentary Accord"
 ENG_ww1_irish_parliamentary_support_desc:0 "Asquith's legislative alliance with John Redmond's Irish Nationalist Party secures parliamentary majorities in return for the passage of Irish Home Rule."
 ENG_ww1_irish_repression:0 "Emergency Irish Policing"
 ENG_ww1_irish_repression_desc:0 "A temporary policing effort diverts civilian resources and weakens trust."
 ENG_ww1_italian_coalition_talks:0 "Italian Coalition Talks"
 ENG_ww1_italian_coalition_talks_desc:0 "Secret negotiations in London secure Italy's entry into the Entente coalition in May 1915, pinning Austro-Hungarian armies along the Alpine frontier."
 ENG_ww1_kitchener_armies:0 "New Armies"
 ENG_ww1_kitchener_armies_desc:0 "Thousands of volunteers join the army, and the factories feel their absence."
 ENG_ww1_kitchener_new_armies:0 "Kitchener's New Armies"
 ENG_ww1_kitchener_new_armies_desc:0 "Foreseeing a protracted war of attrition, Lord Kitchener issues his iconic national summons, rallying millions of enthusiastic volunteers into the 'New Armies'."
 ENG_ww1_labour_compact:0 "The Munitions Labour Compact"
 ENG_ww1_labour_compact_desc:0 "Wage and workshop agreements preserve cooperation at a civilian economic cost."
 ENG_ww1_labour_dilution:0 "Labour Dilution"
 ENG_ww1_labour_dilution_desc:0 "Women and unskilled hands fill skilled posts."
 ENG_ww1_lancashire_engineering:0 "Lancashire Engineering"
 ENG_ww1_lancashire_engineering_desc:0 "Lancashire's vast engineering workshops and textile mills mobilize to manufacture heavy engines, uniforms, canvas, and replacement parts for the imperial services."
 ENG_ww1_lend_escort_flotillas:0 "Share Escort Flotillas"
 ENG_ww1_lend_escort_flotillas_desc:0 "Spend 20 political power. At war, repeats the joint escort offer to each naval ally in the faction, who decides whether to accept. Requires the Mediterranean cooperation."
 ENG_ww1_lessons_for_the_general_staff:0 "Lessons for the Imperial General Staff"
 ENG_ww1_lessons_for_the_general_staff_desc:0 "The synthesis of armored warfare, creeping barrages, and air-ground coordination codifies British doctrine as the most sophisticated in the modern world."
 ENG_ww1_liberal_reconstruction:0 "Liberal Reconstruction Mandate"
 ENG_ww1_liberal_reconstruction_desc:0 "Public housing initiatives, clinics, and expanded pensions heal domestic wounds, rewarding the sacrifices of the working classes."
 ENG_ww1_local_government_finance:0 "Local Government Finance"
 ENG_ww1_local_government_finance_desc:0 "Fiscal block grants to county councils and municipal corporations finance paved highways, public electrical grids, and urban water works."
 ENG_ww1_london_market:0 "The London Financial Market"
 ENG_ww1_london_market_desc:0 "Commercial experience eases changes in trade policy, but maintaining financial offices has a civilian economic cost. Borrowed wartime programmes still increase the debt burden."
 ENG_ww1_machine_gun_corps_formation:0 "Machine Gun Corps Formation"
 ENG_ww1_machine_gun_corps_formation_desc:0 "Concentrating water-cooled Vickers .303 machine guns into a specialized branch at Belton Park endows British sectors with overwhelming sustained firepower."
 ENG_ww1_machine_tool_standards:0 "Machine Tool Standardization"
 ENG_ww1_machine_tool_standards_desc:0 "Standardized jigs, fixtures, and micrometric gauges enable thousands of subcontracted workshops to produce flawlessly interchangeable weapon components."
 ENG_ww1_maritime_blockade_coordination:0 "The Distant Maritime Blockade"
 ENG_ww1_maritime_blockade_coordination_desc:0 "The stranglehold of the Royal Navy blockade cuts off vital German imports of nitrates, rubber, and food, grinding down the Central Powers' home front."
 ENG_ww1_mediterranean_convoy_liaison:0 "Mediterranean Convoy Liaison"
 ENG_ww1_mediterranean_convoy_liaison_desc:0 "Naval coordination across Gibraltar, Malta, and Alexandria shields vital trade arteries transporting Indian and Australian troops through Suez."
 ENG_ww1_mediterranean_landing_preparation:0 "Mediterranean Landing Preparation"
 ENG_ww1_mediterranean_landing_preparation_desc:0 "Armoured 'Beetle' landing craft and Royal Naval Division marines train for pioneering amphibious beachhead landings in the Aegean."
 ENG_ww1_merchant_marine_renewal:0 "Merchant Marine Renewal"
 ENG_ww1_merchant_marine_renewal_desc:0 "British shipyards build modern oil-fired freighters to replace wartime shipping losses, reasserting British mastery of global maritime commerce."
 ENG_ww1_merchant_shipping_register:0 "Merchant Shipping Register"
 ENG_ww1_merchant_shipping_register_desc:0 "Thousands of British merchantmen are inventoried and placed under Admiralty scheduling to guarantee food and raw material imports across the globe."
 ENG_ww1_mesopotamian_supply_review:0 "Mesopotamian Supply Review and Capture of Baghdad"
 ENG_ww1_mesopotamian_supply_review_desc:0 "Following Kut, General Stanley Maude systematically upgrades Tigris paddle-steamers, rail links, and field medicine, conquering Baghdad in March 1917."
 ENG_ww1_midlands_machine_shops:0 "Midlands Machine Shops"
 ENG_ww1_midlands_machine_shops_desc:0 "The metalworking plants of Birmingham and Coventry are retooled with precision machinery to mass-produce rifle receivers, cartridges, and artillery components."
 ENG_ww1_military_demobilisation_planning:0 "Military Demobilisation Planning"
 ENG_ww1_military_demobilisation_planning_desc:0 "A methodical points system prioritized by civilian profession and service duration facilitates the orderly repatriation of millions of frontline soldiers."
 ENG_ww1_military_pilot_instruction:0 "Central Flying School Pilot Instruction"
 ENG_ww1_military_pilot_instruction_desc:0 "Veteran instructors at Upavon institutionalize rigorous stall recovery, formation flying, and aerial navigation to produce top-tier combat pilots."
 ENG_ww1_munitions_contracts:0 "Munitions Contracts"
 ENG_ww1_munitions_contracts_desc:0 "Many suppliers, uneven quality."
 ENG_ww1_munitions_ministry:0 "Ministry of Munitions"
 ENG_ww1_munitions_ministry_desc:0 "Industrial coordination improves armament deliveries while occupying civilian administration."
 ENG_ww1_national_insurance:0 "National Insurance Act"
 ENG_ww1_national_insurance_desc:0 "Lloyd George's landmark social insurance reforms provide sickness benefits and unemployment protections to millions of British industrial workers, cementing working-class loyalty."
 ENG_ww1_national_munitions_contracts:0 "National Munitions Contracts"
 ENG_ww1_national_munitions_contracts_desc:0 "The founding of National Shell Factories and massive propellant works at Gretna scales state-owned production of artillery shells and cordite."
 ENG_ww1_naval_architecture_research:0 "Naval Architecture Research at Haslar"
 ENG_ww1_naval_architecture_research_desc:0 "Experimental hydrodynamic towing tanks at Haslar refine hull flare and bulbous bows, maximizing capital ship knots while curbing oil expenditure."
 ENG_ww1_naval_budget_retrenchment:0 "Naval Budget Retrenchment"
 ENG_ww1_naval_budget_retrenchment_desc:0 "Negotiated capital ship limits prevent a ruinous naval arms race while retaining qualitative British superiority and curbing public expenditure."
 ENG_ww1_naval_economy:0 "Naval Economy After the War"
 ENG_ww1_naval_economy_desc:0 "Reduced peacetime shipbuilding frees civilian resources; the programme does not impose a fictional international tonnage treaty."
 ENG_ww1_naval_establishment:0 "The Naval Establishment"
 ENG_ww1_naval_establishment_desc:0 "The existing battlefleet carries our naval advantage. Supporting its yards and worldwide stations occupies civilian administration; it does not provide automatic convoy protection."
 ENG_ww1_naval_estimates:0 "The Admiralty Estimates"
 ENG_ww1_naval_estimates_desc:0 "A naval allocation diverts staff and production from the continental army."
 ENG_ww1_naval_gunnery_calibration:0 "Director Firing and Gunnery Calibration"
 ENG_ww1_naval_gunnery_calibration_desc:0 "Adoption of Sir Percy Scott's director firing towers and Dreyer mechanical fire-control tables endows British salvos with devastating long-range accuracy."
 ENG_ww1_naval_seaplane_stations:0 "Naval Seaplane Stations and Aircraft Carriers"
 ENG_ww1_naval_seaplane_stations_desc:0 "The Royal Navy converts HMS Argus and HMS Furious with continuous flight decks, pioneering the modern aircraft carrier and shipboard launch tactics."
 ENG_ww1_naval_signals_and_direction_finding:0 "Naval Direction Finding Stations"
 ENG_ww1_naval_signals_and_direction_finding_desc:0 "A coastal chain of wireless direction-finding stations instantly triangulates enemy radio transmissions, guiding patrol groups directly to U-boats."
 ENG_ww1_naval_technical_lessons:0 "Technical Lessons of Naval Warfare"
 ENG_ww1_naval_technical_lessons_desc:0 "Exhaustive tactical reviews of Jutland reform magazine flash-protection doors, deck armor thickness, and damage control procedures for future capital ships."
 ENG_ww1_neutral_shipping_assurances:0 "Neutral Shipping Assurances"
 ENG_ww1_neutral_shipping_assurances_desc:0 "Diplomatic accords with the Netherlands, Norway, and Denmark regulate North Sea trade, sealing contraband routes into Germany while honoring neutral sensibilities."
 ENG_ww1_new_army_establishment:0 "New Army Training Camps"
 ENG_ww1_new_army_establishment_desc:0 "A wider voluntary intake needs instructors and time. Recruits still require manpower and equipment."
 ENG_ww1_new_zealand_naval_consultation:0 "New Zealand Naval and Expeditionary Force"
 ENG_ww1_new_zealand_naval_consultation_desc:0 "New Zealand gifts the battlecruiser HMS New Zealand to the Royal Navy and deploys exceptional infantry regiments to the Dardanelles and France."
 ENG_ww1_night_flying_experiments:0 "Night Flying Experiments"
 ENG_ww1_night_flying_experiments_desc:0 "Runway flare paths and luminescent dashboard dials enable skilled night-fighter pilots to intercept nocturnal enemy intruders in total darkness."
 ENG_ww1_northern_patrol:0 "Northern Patrol"
 ENG_ww1_northern_patrol_desc:0 "Old cruisers and armed merchant ships watch the gateway to the Atlantic."
 ENG_ww1_officer_training_corps:0 "Officer Training Corps"
 ENG_ww1_officer_training_corps_desc:0 "Officer Training Corps contingents at British universities and public schools generate a disciplined reserve of junior officers ready for immediate commissioning."
 ENG_ww1_operational_reserve_restoration:0 "Operational Reserve Restoration"
 ENG_ww1_operational_reserve_restoration_desc:0 "Swift rotation of rested shock divisions and immediate equipment replenishment ensure relentless offensive momentum until the final victory."
 ENG_ww1_ordnance_metallurgy_research:0 "Sheffield Ordnance Metallurgy Research"
 ENG_ww1_ordnance_metallurgy_research_desc:0 "Specialized nickel-chromium alloy steels developed in Sheffield withstand high-velocity penetrations and multiply artillery barrel wear endurance."
 ENG_ww1_palestine_railway_liaison:0 "Palestine Railway and the Capture of Jerusalem"
 ENG_ww1_palestine_railway_liaison_desc:0 "General Edmund Allenby lays railway lines and water pipelines across Sinai, smashing the Ottoman line at Beersheba and humbly entering Jerusalem on foot."
 ENG_ww1_pals_battalions:0 "Pals Battalions"
 ENG_ww1_pals_battalions_desc:0 "Men of the same street fight together. Cohesion is higher, but one battle can wipe out a town."
 ENG_ww1_parliament_act:0 "The Parliament Act of 1911"
 ENG_ww1_parliament_act_desc:0 "The historic curtailment of the House of Lords' veto powers establishes the undisputed supremacy of the elected Commons, guaranteeing fiscal stability for essential state budgets."
 ENG_ww1_postwar_aircraft_demobilisation:0 "Postwar Aircraft Demobilisation"
 ENG_ww1_postwar_aircraft_demobilisation_desc:0 "Orderly liquidation of wartime surplus biplanes and transition of skilled aviators and mechanics into the commercial aircraft manufacturing sector."
 ENG_ww1_production_quality_standards:0 "Production Quality Standards"
 ENG_ww1_production_quality_standards_desc:0 "The British Engineering Standards Association enforces strict tolerances across all imperial armaments plants, dramatically reducing factory waste."
 ENG_ww1_professional_service:0 "Professional Army, Limited Establishment"
 ENG_ww1_professional_service_desc:0 "The standing force is experienced, but rigorous instruction and imperial commitments limit rapid expansion."
 ENG_ww1_public_debt_repayment:0 "Public Debt Repayment"
 ENG_ww1_public_debt_repayment_desc:0 "Disciplined fiscal management and orderly bond amortizations on international markets reaffirm the global primacy of the Pound Sterling."
 ENG_ww1_public_housing_contracts:0 "Public Housing Contracts"
 ENG_ww1_public_housing_contracts_desc:0 "Municipal subsidies eradicate urban tenements, constructing high-standard suburban homes with electric lighting and green parklands."
 ENG_ww1_railway_engineering_standards:0 "Railway Engineering Standards"
 ENG_ww1_railway_engineering_standards_desc:0 "Heavy locomotive blueprints and standardized rolling stock with automatic Westinghouse brakes accelerate the haulage of super-heavy siege railguns."
 ENG_ww1_railway_executive:0 "Railway Executive"
 ENG_ww1_railway_executive_desc:0 "The railway companies run under one direction."
 ENG_ww1_railway_freight_coordination:0 "Railway Freight Coordination"
 ENG_ww1_railway_freight_coordination_desc:0 "The Railway Executive Committee assumes centralized traffic control across British lines, guaranteeing expedited coal and ammunition movements to deepwater ports."
 ENG_ww1_ramsay_macdonald:0 "Ramsay MacDonald"
 ENG_ww1_reconsider_the_continental_policy:0 "Continental Policy Flexibility"
 ENG_ww1_reconsider_the_continental_policy_desc:0 "The Foreign Office reviews pragmatic diplomatic avenues, ensuring Britain maintains strategic maritime flexibility and international trade privileges."
 ENG_ww1_reconstruction_credit_negotiations:0 "Reconstruction Credit Negotiations"
 ENG_ww1_reconstruction_credit_negotiations_desc:0 "Financial conferences between London, Paris, and Washington establish orderly repayment frameworks and capital injections to rebuild European trade."
 ENG_ww1_reconvene_imperial_conference:0 "Reconvene the Imperial Conference"
 ENG_ww1_reconvene_imperial_conference_desc:0 "Spend 30 political power. Dominion consent +6 and debt +1. Available once a year after the first conference."
 ENG_ww1_regular_army_mobilisation:0 "Regular Army Mobilisation"
 ENG_ww1_regular_army_mobilisation_desc:0 "Meticulous mobilization timetables concentrate Britain's six regular infantry divisions and Cavalry Division at southern ports within days of the war proclamation."
 ENG_ww1_release_irish_prisoners:0 "Release Irish Prisoners"
 ENG_ww1_release_irish_prisoners_desc:0 "Spend 20 political power. Irish tension falls by 8 and Ulster tension rises by 4. Requires Irish tension above 40."
 ENG_ww1_renew_allied_admission_request:0 "Renew the Allied Admission Request"
 ENG_ww1_renew_allied_admission_request_desc:0 "Spend 20 political power to renew talks with a surviving allied faction leader. Requests expire after 30 days and cannot force membership or a peace settlement."
 ENG_ww1_renew_american_credit:0 "Renew the American Credit"
 ENG_ww1_renew_american_credit_desc:0 "Spend 20 political power. At war, repeat the credit request to the United States, which may grant or decline. Requires the first credit to have been granted."
 ENG_ww1_representation_of_the_people:0 "Representation of the People Act 1918"
 ENG_ww1_representation_of_the_people_desc:0 "Franchise is granted to all men over 21 and women over 30, expanding the electorate from 8 to 21 million citizens in a triumph of British democracy."
 ENG_ww1_request_dominion_contingent_AST:0 "Request Volunteers from Australia"
 ENG_ww1_request_dominion_contingent_AST_desc:0 "Spend 20 political power. At war, ask Australia to send 15,000 manpower. Requires the earlier consultation and consent above 29. The Dominion decides; nothing is created, manpower moves from one country to the other."
 ENG_ww1_request_dominion_contingent_CAN:0 "Request Volunteers from Canada"
 ENG_ww1_request_dominion_contingent_CAN_desc:0 "Spend 20 political power. At war, ask Canada to send 15,000 manpower. Requires the earlier consultation and consent above 29. The Dominion decides; nothing is created, manpower moves from one country to the other."
 ENG_ww1_request_dominion_contingent_NZL:0 "Request Volunteers from New Zealand"
 ENG_ww1_request_dominion_contingent_NZL_desc:0 "Spend 20 political power. At war, ask New Zealand to send 15,000 manpower. Requires the earlier consultation and consent above 29. The Dominion decides; nothing is created, manpower moves from one country to the other."
 ENG_ww1_request_dominion_contingent_SAF:0 "Request Volunteers from South Africa"
 ENG_ww1_request_dominion_contingent_SAF_desc:0 "Spend 20 political power. At war, ask South Africa to send 15,000 manpower. Requires the earlier consultation and consent above 29. The Dominion decides; nothing is created, manpower moves from one country to the other."
 ENG_ww1_reserved_civilian_occupations:0 "Reserved Civilian Occupations"
 ENG_ww1_reserved_civilian_occupations_desc:0 "Miners, railway engineers, and shipyard caulkers are exempted from trench conscription, shielding vital war production from devastating labor shortages."
 ENG_ww1_reserved_occupations:0 "Reserved Occupations"
 ENG_ww1_reserved_occupations_desc:0 "Miners, munition workers and railwaymen are kept out of enlistment."
 ENG_ww1_restore_civilian_railway_traffic:0 "Restore Civilian Railway Traffic"
 ENG_ww1_restore_civilian_railway_traffic_desc:0 "Requisitioned rolling stock is fully refurbished and returned to commercial lines, restoring reliable domestic freight and commuter traffic."
 ENG_ww1_review_continental_policy:0 "Reopen Continental Consultations"
 ENG_ww1_review_continental_policy_desc:0 "A neutral Britain can reconsider its commitments for 25 political power. Admission to an allied faction requires a valid leader and that country’s consent. The debate itself does not declare war."
 ENG_ww1_review_defence_estimates:0 "Review the Defence Estimates"
 ENG_ww1_review_defence_estimates_desc:0 "Spend 25 political power to convene a new allocation debate after the six-month mandate. The next allocation replaces the previous one; it does not upgrade existing ships or create equipment."
 ENG_ww1_room_forty:0 "Room 40"
 ENG_ww1_room_forty_desc:0 "Admiralty cryptanalysts read German naval codes."
 ENG_ww1_royal_air_force:0 "Royal Air Force"
 ENG_ww1_royal_air_force_desc:0 "The first independent air service in the world, with its own staff, schools and budget."
 ENG_ww1_royal_air_force_service:0 "An Integrated Royal Air Force"
 ENG_ww1_royal_air_force_service_desc:0 "An integrated air service replaces earlier observation administration."
 ENG_ww1_royal_air_force_unification:0 "The Royal Air Force Unification"
 ENG_ww1_royal_air_force_unification_desc:0 "On 1 April 1918, the world's first independent air service is born under Sir Hugh Trenchard, cementing air power as an equal and decisive military arm."
 ENG_ww1_royal_flying_corps:0 "Royal Flying Corps"
 ENG_ww1_royal_flying_corps_desc:0 "A new arm of wood and fabric, learning on every flight."
 ENG_ww1_royal_flying_corps_organisation:0 "Royal Flying Corps Organisation"
 ENG_ww1_royal_flying_corps_organisation_desc:0 "Founded in 1912 under the motto 'Per Ardua ad Astra', the RFC trains disciplined flying squadrons to provide tactical eyes for British field armies."
 ENG_ww1_royal_naval_air_service_organisation:0 "Royal Naval Air Service Organisation"
 ENG_ww1_royal_naval_air_service_organisation_desc:0 "Championed by Winston Churchill, the RNAS develops specialized naval aircraft to patrol coastlines, hunt U-boats, and attack Zeppelin sheds."
 ENG_ww1_russian_procurement_liaison:0 "Russian Procurement Liaison"
 ENG_ww1_russian_procurement_liaison_desc:0 "British military missions and merchant convoys deliver armaments, heavy artillery, and critical components to Imperial Russia via Murmansk and Arkhangelsk."
 ENG_ww1_seaplane_patrols_buff:0 "Seaplane Coastal Patrol Rota"
 ENG_ww1_seaplane_patrols_buff_desc:0 "Naval seaplane rotas scour coastal approaches and shipping lanes for hostile U-boats and minefields."
 ENG_ww1_send_liaison_officers:0 "Send Liaison Officers"
 ENG_ww1_send_liaison_officers_desc:0 "Spend 20 political power. At war, offers staff officers to each ally in the faction, who decides whether to accept. Whoever accepts and Britain gain 2 army experience. Requires the BEF deployment plan."
 ENG_ww1_services_policy:0 "Armed Services Policy"
 ENG_ww1_services_policy_desc:0 "Decisions tied to the Navy, the Air Force and the Army: blockade, escorts, air defence and staff work."
 ENG_ww1_shell_inspection:0 "Shell Inspection"
 ENG_ww1_shell_inspection_boards:0 "Shell Inspection Boards"
 ENG_ww1_shell_inspection_boards_desc:0 "Rigorous metallurgical and chemical inspection regimes eliminate defective duds among British high-explosive shells and timed artillery fuses."
 ENG_ww1_shell_inspection_desc:0 "Defective lots are rejected before shipment."
 ENG_ww1_shipping_repatriation_coordination:0 "Shipping Repatriation Coordination"
 ENG_ww1_shipping_repatriation_coordination_desc:0 "Liners and merchantmen under the Ministry of Shipping swiftly transport imperial contingents back to Canada, Australia, New Zealand, and India."
 ENG_ww1_shortcut_army:0 "The British Army & Expeditionary Force"
 ENG_ww1_shortcut_diplomacy:0 "Diplomacy & Imperial Relations"
 ENG_ww1_shortcut_economy:0 "Industry & City Finance"
 ENG_ww1_shortcut_navy:0 "The Royal Navy & Command of the Seas"
 ENG_ww1_shortcut_politics:0 "Imperial Politics & Parliament"
 ENG_ww1_signals_intelligence_organisation:0 "Signals Intelligence Organisation"
 ENG_ww1_signals_intelligence_organisation_desc:0 "Electromagnetic interception stations across Britain intercept telegraphic traffic, feeding cryptanalysts with raw intelligence on enemy troop movements."
 ENG_ww1_singapore_maritime_coordination:0 "Singapore Naval Coordination Hub"
 ENG_ww1_singapore_maritime_coordination_desc:0 "Coaling stations and patrol flotillas based at Singapore secure the Malacca Strait, denying raiders access to Pacific imperial shipping."
 ENG_ww1_south_african_cooperation:0 "South African Defense under Botha & Smuts"
 ENG_ww1_south_african_cooperation_desc:0 "Generals Louis Botha and Jan Smuts secure German South-West Africa and deploy crack brigades to Delville Wood and the East African theater."
 ENG_ww1_staff_college_course:0 "Staff College Course"
 ENG_ww1_staff_college_course_desc:0 "Spend 25 political power. At war, it grants 5 army experience and debt rises by 1. Available once a year after the combined arms courses."
 ENG_ww1_submarine_service_development:0 "Royal Navy Submarine Service"
 ENG_ww1_submarine_service_development_desc:0 "Ocean-going E-class submarines penetrate the Heligoland Bight and the Baltic Sea, sinking enemy cruisers and disrupting iron ore convoys."
 ENG_ww1_tank_committee_experiments:0 "Tank Committee Experiments"
 ENG_ww1_tank_committee_experiments_desc:0 "Sponsored by Winston Churchill's Landships Committee, British engineers construct the world's first combat tanks—'Little Willie' and the rhomboid Mark I."
 ENG_ww1_technical_education_for_reconstruction:0 "Technical Education for Reconstruction"
 ENG_ww1_technical_education_for_reconstruction_desc:0 "Polytechnic colleges and mechanical institutes qualify hundreds of thousands of certified engineers, chemists, and architects for Britain's future."
 ENG_ww1_territorial_defence_renewal:0 "Territorial Defence Renewal"
 ENG_ww1_territorial_defence_renewal_desc:0 "The Territorial Army is reconstituted with surplus war materiel, forming an inexpensive yet formidable backbone for home island defense."
 ENG_ww1_territorial_establishment:0 "Territorial Training Establishment"
 ENG_ww1_territorial_establishment_desc:0 "Training camps prepare units through the normal recruitment queue. They do not create divisions or equipment."
 ENG_ww1_territorial_force_camps:0 "Territorial Force Training Camps"
 ENG_ww1_territorial_force_camps_desc:0 "Part-time volunteers of the Territorial Force undergo rigorous annual field maneuvers, rifle marksmanship courses, and brigade-level staff exercises."
 ENG_ww1_the_air_battalion_experiments:0 "Air Battalion Royal Engineers Experiments"
 ENG_ww1_the_air_battalion_experiments_desc:0 "Pioneering tethered balloons and fragile monoplanes on Salisbury Plain test military applications of aerial reconnaissance for the Army."
 ENG_ww1_the_allied_counteroffensive_plan:0 "The Hundred Days Allied Counteroffensive"
 ENG_ww1_the_allied_counteroffensive_plan_desc:0 "On 8 August 1918—the 'black day of the German Army'—British, Canadian, and Australian shock corps launch the unyielding offensive that shatters the Hindenburg Line."
 ENG_ww1_the_armistice_stand_down_plan:0 "The Armistice Stand Down Plan"
 ENG_ww1_the_armistice_stand_down_plan_desc:0 "At the eleventh hour of the eleventh day of the eleventh month, the guns fall silent. British troops march forward to occupy the bridgeheads of the Rhine."
 ENG_ww1_the_artillery_observation_school:0 "The Artillery Observation School"
 ENG_ww1_the_artillery_observation_school_desc:0 "Advanced gunnery courses at Larkhill pioneer indirect predicted fire, meteorological correction data, and close cooperation between spotters and 18-pounder batteries."
 ENG_ww1_the_bef_deployment_plan:0 "The BEF Deployment Plan"
 ENG_ww1_the_bef_deployment_plan_desc:0 "Under Field Marshal Sir John French, the British divisions deploy on the Allied left at Mons, standing as an immovable barrier against the Schlieffen advance."
 ENG_ww1_the_channel_mobilisation_timetable:0 "The Channel Mobilisation Timetable"
 ENG_ww1_the_channel_mobilisation_timetable_desc:0 "Requisitioned cross-channel steamers and escorted transports execute clockwork sailings, moving men, horses, and guns to France with zero casualties."
 ENG_ww1_the_city_credit_market:0 "The City of London Credit Market"
 ENG_ww1_the_city_credit_market_desc:0 "The global financial hub in the City of London unlocks credit syndicates and issues war loan bonds to finance vital material acquisitions for the Entente."
 ENG_ww1_the_coalition_cabinet:0 "The 1915 Coalition Ministry"
 ENG_ww1_the_coalition_cabinet_desc:0 "The catastrophic Shell Crisis forces the dissolution of the partisan Liberal cabinet, ushering in an all-party national coalition to mobilize the realm."
 ENG_ww1_the_coalition_election:0 "The Coupon Election of 1918"
 ENG_ww1_the_coalition_election_desc:0 "Following the Armistice, the coalition between Lloyd George and Conservative leaders wins an overwhelming parliamentary majority on a platform of renewal."
 ENG_ww1_the_conservative_settlement:0 "The Conservative Settlement of Bonar Law"
 ENG_ww1_the_conservative_settlement_desc:0 "Andrew Bonar Law leads a Conservative ministry committed to balanced budgets, Imperial tariff preferences, and imperial solidarity."
 ENG_ww1_the_creeping_barrage_school:0 "The Creeping Barrage School"
 ENG_ww1_the_creeping_barrage_school_desc:0 "A curtain of exploding shells advances 50 yards ahead of the assaulting infantry like clockwork, keeping enemy machine gunners pinned in their deep dugouts."
 ENG_ww1_the_dardanelles_staff_study:0 "The Dardanelles Staff Study"
 ENG_ww1_the_dardanelles_staff_study_desc:0 "Churchill and the War Council study amphibious plans to force the Dardanelles Straits, open communications with Russia, and knock the Ottomans out of the war."
 ENG_ww1_the_defence_of_the_realm:0 "Defence of the Realm Act (DORA)"
 ENG_ww1_the_defence_of_the_realm_desc:0 "Passed upon the outbreak of war, DORA grants executive authority to censor sensitive dispatches, requisition civilian harbors, and take control of the rail network."
 ENG_ww1_the_demobilisation_register:0 "The Demobilisation Register"
 ENG_ww1_the_demobilisation_register_desc:0 "Methodical indexing of servicemen by civilian industrial necessity guarantees fair, riot-free demobilisation once arms are laid down."
 ENG_ww1_the_education_reconstruction_programme:0 "The Education Reconstruction Programme"
 ENG_ww1_the_education_reconstruction_programme_desc:0 "The Fisher Education Act raises the compulsory school age to 14 and expands continuation colleges, cultivating a highly literate technical generation."
 ENG_ww1_the_employment_exchanges:0 "The Employment Exchanges"
 ENG_ww1_the_employment_exchanges_desc:0 "The expanded network of state labour exchanges connects demobilized workers with industrial vacancies, stabilizing the post-war labor market."
 ENG_ww1_the_expeditionary_establishment:0 "The British Expeditionary Force Establishment"
 ENG_ww1_the_expeditionary_establishment_desc:0 "The 'Old Contemptibles' cross into France. Recognized as the finest marksmanship force in the world, each regular soldier delivers 15 aimed rounds a minute."
 ENG_ww1_the_flanders_supply_organisation:0 "The Flanders Supply Organisation"
 ENG_ww1_the_flanders_supply_organisation_desc:0 "Decauville narrow-gauge rail systems and subterranean ammunition depots guarantee unceasing logistical deliveries through the mud of Flanders."
 ENG_ww1_the_franchise_debate:0 "The Franchise Expansion Debate"
 ENG_ww1_the_franchise_debate_desc:0 "The heroism of millions in the trenches and the indispensability of female munition workers dismantle centuries of resistance to universal adult franchise."
 ENG_ww1_the_french_naval_understanding:0 "The French Naval Understanding"
 ENG_ww1_the_french_naval_understanding_desc:0 "A historic naval distribution assigns the French Marine Nationale to secure the Mediterranean while the Royal Navy guarantees the English Channel and the North Sea."
 ENG_ww1_the_haldane_establishment:0 "The Haldane Army Establishment"
 ENG_ww1_the_haldane_establishment_desc:0 "Secretary of State for War Richard Haldane reorganizes the British military, creating the Imperial General Staff, the Territorial Force, and an elite Expeditionary Force."
 ENG_ww1_the_imperial_conference:0 "The 1911 Imperial Conference"
 ENG_ww1_the_imperial_conference_desc:0 "Prime Ministers of the Dominions convene in London to coordinate imperial naval defenses, wireless networks, and shared strategic priorities."
 ENG_ww1_the_imperial_war_conference:0 "The Imperial War Conference of 1917"
 ENG_ww1_the_imperial_war_conference_desc:0 "Dominion Prime Ministers join the Imperial War Cabinet, gaining a direct voice in the strategic direction of the war and postwar treaties."
 ENG_ww1_the_independent_air_service_debate:0 "The Smuts Report on Independent Air Power"
 ENG_ww1_the_independent_air_service_debate_desc:0 "General Jan Smuts presents his visionary report recommending the complete amalgamation of army and naval aviation into an autonomous air ministry."
 ENG_ww1_the_industrial_relations_conference:0 "The Industrial Relations Conference"
 ENG_ww1_the_industrial_relations_conference_desc:0 "Whitley Councils institutionalize joint industrial bargaining councils between trade unions and employers, preventing class conflict."
 ENG_ww1_the_infantry_training_directorate:0 "The Infantry Training Directorate"
 ENG_ww1_the_infantry_training_directorate_desc:0 "Reorganizing the platoon into mutually supporting specialists—riflemen, bombers, Lewis gunners, and rifle grenadiers—transforms British assault tactics."
 ENG_ww1_the_irish_settlement_conference:0 "The Irish Constitutional Convention"
 ENG_ww1_the_irish_settlement_conference_desc:0 "All-party deliberations seek a lasting constitutional compromise to avert civil war and reconcile Irish aspirations with imperial security."
 ENG_ww1_the_labour_alternative:0 "The Rise of the Labour Party"
 ENG_ww1_the_labour_alternative_desc:0 "The Labour Party under Ramsay MacDonald rises as a premier parliamentary force, championing nationalization of utilities and collective security."
 ENG_ww1_the_landships_technical_committee:0 "The Landships Technical Committee"
 ENG_ww1_the_landships_technical_committee_desc:0 "Churchill's clandestine Landships Committee designs rhomboid wrap-around tracks and bulletproof hulls capable of crossing 9-foot trench spans."
 ENG_ww1_the_liberal_cabinet:0 "The Asquith Liberal Cabinet"
 ENG_ww1_the_liberal_cabinet_desc:0 "Prime Minister Asquith directs a cabinet of formidable intellects, coordinating Winston Churchill at the Admiralty, Edward Grey in foreign policy, and Lloyd George at the Exchequer."
 ENG_ww1_the_lords_and_the_commons:0 "The Lords and the Commons Balance"
 ENG_ww1_the_lords_and_the_commons_desc:0 "Streamlined legislative procedures at Westminster accelerate the passage of critical defense appropriations and imperial taxation bills."
 ENG_ww1_the_mediterranean_stations:0 "Gibraltar and Malta Bastions"
 ENG_ww1_the_mediterranean_stations_desc:0 "Fortified anchorages at Gibraltar and Malta safeguard the vital Mediterranean conduit linking Britain with Egypt, India, and the Far East."
 ENG_ww1_the_military_service_act:0 "Military Service Act 1916"
 ENG_ww1_the_military_service_act_desc:0 "Compelled by attrition on the Western Front, Parliament enacts universal conscription, guaranteeing an unbroken stream of divisions for Field Marshal Haig."
 ENG_ww1_the_ministry_of_food:0 "The Ministry of Food"
 ENG_ww1_the_ministry_of_food_desc:0 "Centralized food purchasing, scientific calorie management, and fair rationing successfully defeat the German attempt to starve the British Isles."
 ENG_ww1_the_ministry_of_munitions:0 "The Ministry of Munitions"
 ENG_ww1_the_ministry_of_munitions_desc:0 "Established to overcome the catastrophic 1915 Shell Crisis, the Ministry under David Lloyd George organizes industry, labor, and state resources for total war."
 ENG_ww1_the_national_physical_laboratory:0 "The National Physical Laboratory"
 ENG_ww1_the_national_physical_laboratory_desc:0 "The NPL at Teddington standardizes sovereign scientific norms in metrology, aerodynamics, and materials testing, giving British industry precision rigor."
 ENG_ww1_the_naval_disarmament_conference:0 "The Naval Disarmament Conference"
 ENG_ww1_the_naval_disarmament_conference_desc:0 "British delegates take the lead in formulating capital ship tonnage ratios at Washington, restraining a costly naval arms race while preserving imperial security."
 ENG_ww1_the_naval_estimates:0 "Churchill's Naval Estimates"
 ENG_ww1_the_naval_estimates_desc:0 "The ambitious 1912 naval appropriations finance the decisive transition to fuel oil propulsion and order cutting-edge dreadnought squadrons."
 ENG_ww1_the_nineteen_twenty_three_settlement:0 "The 1923 Imperial Settlement"
 ENG_ww1_the_nineteen_twenty_three_settlement_desc:0 "Britain cements its domestic recovery and economic equilibrium with the Commonwealth, inaugurating a decade of democratic resilience and peace."
 ENG_ww1_the_nineteen_twenty_two_cabinet:0 "The 1922 Conservative Cabinet"
 ENG_ww1_the_nineteen_twenty_two_cabinet_desc:0 "The Carlton Club meeting brings an end to the Lloyd George coalition, ushering in Bonar Law and Stanley Baldwin on a platform of tranquility and stability."
 ENG_ww1_the_north_sea_watch:0 "The Northern Patrol"
 ENG_ww1_the_north_sea_watch_desc:0 "The 10th Cruiser Squadron patrols the Arctic passages between Scotland and Iceland through stormy seas, turning away all merchantmen bearing enemy cargo."
 ENG_ww1_the_pals_battalion_system:0 "The Pals Battalion System"
 ENG_ww1_the_pals_battalion_system_desc:0 "Men from identical towns, factory workshops, sports clubs, and universities enlist side-by-side, forging unparalleled unit cohesion and esprit de corps."
 ENG_ww1_the_peace_administration_office:0 "The Peace Administration Office"
 ENG_ww1_the_peace_administration_office_desc:0 "A dedicated ministerial office coordinates the complex transition from total war mobilisation to peacetime civil administration."
 ENG_ww1_the_portuguese_connection:0 "The Portuguese Connection"
 ENG_ww1_the_portuguese_connection_desc:0 "Invoking the historic Treaty of Windsor brings Portugal into the Allied coalition, deploying the Corpo Expedicionário Português to Flanders and securing African ports."
 ENG_ww1_the_postwar_fleet_review:0 "The Postwar Spithead Fleet Review"
 ENG_ww1_the_postwar_fleet_review_desc:0 "King George V reviews the victorious Royal Navy at Spithead. Miles of steel warships celebrate unshakeable British mastery of the oceans."
 ENG_ww1_the_postwar_parliamentary_mandate:0 "The Postwar Parliamentary Mandate"
 ENG_ww1_the_postwar_parliamentary_mandate_desc:0 "The full restoration of civilian constitutional supremacy by Parliament dissolves wartime executive decrees and re-establishes British liberties."
 ENG_ww1_the_postwar_research_council:0 "Department of Scientific and Industrial Research"
 ENG_ww1_the_postwar_research_council_desc:0 "Founding the DSIR cements state-sponsored scientific and industrial innovation, ensuring British technological leadership into the postwar era."
 ENG_ww1_the_public_health_settlement:0 "The Public Health Settlement"
 ENG_ww1_the_public_health_settlement_desc:0 "The creation of the Ministry of Health consolidates epidemic control, urban sanitation, and maternity welfare into a unified national system."
 ENG_ww1_the_rifle_training_depots:0 "Lee-Enfield Rifle Training Depots"
 ENG_ww1_the_rifle_training_depots_desc:0 "Intensive rapid-fire training with the iconic Short Magazine Lee-Enfield (SMLE Mk III) turns civilian recruits into lethal marksmen capable of the legendary 'mad minute'."
 ENG_ww1_the_room_forty_office:0 "The Legendary Room 40 and Zimmermann Telegram"
 ENG_ww1_the_room_forty_office_desc:0 "The Admiralty's clandestine cryptanalysis bureau under Admiral 'Blinker' Hall deciphers German naval ciphers and intercepts the momentous Zimmermann Telegram."
 ENG_ww1_the_shop_stewards_agreement:0 "The Shop Stewards Agreement"
 ENG_ww1_the_shop_stewards_agreement_desc:0 "Constructive industrial arbitration and post-war restoration guarantees avert destabilizing strikes on the Clyde and secure uninterrupted factory shifts."
 ENG_ww1_the_special_reserve:0 "The Special Reserve Depots"
 ENG_ww1_the_special_reserve_desc:0 "Special Reserve battalions established at regimental depots maintain rapid mobilization structures to draft and train immediate reinforcements for regular units."
 ENG_ww1_the_spring_defence_plan:0 "The Spring Defence Plan"
 ENG_ww1_the_spring_defence_plan_desc:0 "Field Marshal Haig's historic 'Backs to the Wall' order rallies every British and Dominion soldier to hold ground at all costs, breaking Ludendorff's final offensive."
 ENG_ww1_the_supreme_war_council:0 "The Supreme War Council"
 ENG_ww1_the_supreme_war_council_desc:0 "Establishing the Supreme War Council and appointing Generalissimo Ferdinand Foch to overall Allied command synchronizes the decisive 1918 counteroffensives."
 ENG_ww1_the_treasury_estimates:0 "The Treasury Estimates"
 ENG_ww1_the_treasury_estimates_desc:0 "The Chancellor of the Exchequer reviews fiscal appropriations and allocates emergency funds for industrial modernization and imperial defense readiness."
 ENG_ww1_the_war_cabinet:0 "Lloyd George's Supreme War Cabinet"
 ENG_ww1_the_war_cabinet_desc:0 "David Lloyd George establishes a streamlined War Cabinet of five ministers, concentrating supreme decision-making authority to prosecute total war to victory."
 ENG_ww1_the_western_offensive_staff_study:0 "The Western Offensive Staff Study"
 ENG_ww1_the_western_offensive_staff_study_desc:0 "Thorough operational analysis of the Somme and Third Ypres, identifying the essential role of creeping barrages, counter-battery sound ranging, and smoke screens."
 ENG_ww1_tighten_the_blockade:0 "Tighten the Blockade"
 ENG_ww1_tighten_the_blockade_desc:0 "Spend 25 political power. At war with Germany, Germany suffers a new shortage (stability and war support fall), debt rises by 1 and it grants 1 naval experience. Can be used three times, eight months apart."
 ENG_ww1_training_directorate:0 "Training Directorate"
 ENG_ww1_training_directorate_desc:0 "One manual and one doctrine, from section to battalion."
 ENG_ww1_treasury_expenditure_review:0 "Treasury Expenditure Review"
 ENG_ww1_treasury_expenditure_review_desc:0 "The committee chaired by Sir Eric Geddes cuts wartime bureaucratic overhead and redundant defense expenditures to balance the state budget."
 ENG_ww1_trench_mortar_sections:0 "Stokes Trench Mortar Sections"
 ENG_ww1_trench_mortar_sections_desc:0 "The adoption of Sir Wilfred Stokes' 3-inch trench mortar equips frontline infantry battalions with instant, high-angle bombardment to demolish enemy redoubts."
 ENG_ww1_tyne_steel_and_ordnance:0 "Tyne Steel and Ordnance"
 ENG_ww1_tyne_steel_and_ordnance_desc:0 "Heavy steelworks and armaments foundries on the River Tyne and Newcastle ramp up the production of heavy naval ordnance and specialized armor plating."
 ENG_ww1_ulster_conference:0 "The Ulster Crisis Conference"
 ENG_ww1_ulster_conference_desc:0 "Sir Edward Carson mobilizes the armed Ulster Volunteer Force, prompting urgent round-table consultations at Buckingham Palace to prevent fratricidal conflict."
 ENG_ww1_university_military_contracts:0 "University Military Research Contracts"
 ENG_ww1_university_military_contracts_desc:0 "The Cavendish Laboratory at Cambridge, Oxford, and Imperial College harness world-leading physicists and chemists to solve urgent wartime engineering puzzles."
 ENG_ww1_unsanctioned_conscription:0 "Conscription Without a Parliamentary Mandate"
 ENG_ww1_unsanctioned_conscription_desc:0 "Recruitment was expanded before the legislature authorised it. Regularising the law or returning to voluntary service ends this opposition."
 ENG_ww1_veterans_settlement:0 "Veterans and Civilian Employment"
 ENG_ww1_veterans_settlement_desc:0 "Reintegration and employment require a continuing welfare allocation."
 ENG_ww1_veterans_welfare_register:0 "Veterans Welfare Register"
 ENG_ww1_veterans_welfare_register_desc:0 "Establishment of a national register guaranteeing veteran rehabilitation, job placement, and family support networks across Britain."
 ENG_ww1_war_cabinet:0 "The War Cabinet"
 ENG_ww1_war_cabinet_desc:0 "A compact cabinet coordinates wartime planning and economic demands. Its mandate ends with the war."
 ENG_ww1_war_savings_drive:0 "War Savings Campaign"
 ENG_ww1_war_savings_drive_desc:0 "Spend 20 political power. Debt falls by 2 and labour support falls by 1 from the sacrifice asked. Requires the austerity measures."
 ENG_ww1_wartime_labour_dilution:0 "Wartime Labour Dilution"
 ENG_ww1_wartime_labour_dilution_desc:0 "Hundreds of thousands of female workers ('munitionettes') enter arms factories and engineering plants, sustaining record industrial output while soldiers enlist."
 ENG_ww1_wartime_parliamentary_scrutiny:0 "Wartime Parliamentary Scrutiny"
 ENG_ww1_wartime_parliamentary_scrutiny_desc:0 "Cross-party select committees examine wartime expenditures, identifying logistical bottlenecks and holding military departments accountable."
 ENG_ww1_wireless_and_aircraft_observation:0 "Wireless Artillery Observation"
 ENG_ww1_wireless_and_aircraft_observation_desc:0 "Compact aircraft wireless transmitters send real-time Morse corrections directly to heavy battery gunners, obliterating hidden enemy redoubts."
 ENG_ww1_x_aerial_sorties:0 "Fly Reconnaissance Sorties"
 ENG_ww1_x_aerial_sorties_desc:0 "Order systematic photographic sorties over the enemy lines. Staff and squadrons learn to read the pictures together."
 ENG_ww1_x_call_indian_corps:0 "Call the Indian Corps"
 ENG_ww1_x_call_indian_corps_desc:0 "The liaison with the Indian Army allows a call for its regiments. They stiffen the line for 120 days, but shipping and supply suffer and India's consent cools."
 ENG_ww1_x_cargo_priorities:0 "Set the Allied Cargo Priorities"
 ENG_ww1_x_cargo_priorities_desc:0 "The allied council ranks troops, munitions, wheat and coal. Tonnage is shared and the Treasury pays fewer freight bills."
 ENG_ww1_x_city_bills:0 "Discount Industrial Bills in the City"
 ENG_ww1_x_city_bills_desc:0 "The City of London discounts industrial bills for five months. Factories get working capital; the debt remains to be paid."
 ENG_ww1_x_city_credit_line:0 "City Credit Line"
 ENG_ww1_x_city_credit_line_desc:0 "The City discounts industrial bills for a season; the debt remains."
 ENG_ww1_x_demob_schedule:0 "Issue the Demobilisation Schedule"
 ENG_ww1_x_demob_schedule_desc:0 "Men are released by age, trade and length of service. Workers return to factories in an orderly way instead of in a flood."
 ENG_ww1_x_district_contracts:0 "District Contracts"
 ENG_ww1_x_district_contracts_desc:0 "Contracts placed with the surveyed workshops of the Midlands and the Clyde speed up output at a cost to civilian goods."
 ENG_ww1_x_gas_drill:0 "Drill Gas Discipline"
 ENG_ww1_x_gas_drill_desc:0 "Every battalion rotates through the gas chambers and respirator drill. It costs time and equipment but saves lives."
 ENG_ww1_x_imperial_defence_committee:0 "Meet the Imperial Defence Committee"
 ENG_ww1_x_imperial_defence_committee_desc:0 "The Dominions' representatives sit with the Admiralty and the War Office to plan the next decade of imperial defence."
 ENG_ww1_x_indian_corps:0 "The Indian Corps"
 ENG_ww1_x_indian_corps_desc:0 "Seasoned Indian regiments stiffen the line but cost shipping and supply."
 ENG_ww1_x_industrial_council:0 "Convene the Industrial Council"
 ENG_ww1_x_industrial_council_desc:0 "Employers and union leaders meet under the Ministry of Labour. A season of talks lowers the temperature in the mills and the docks."
 ENG_ww1_x_night_patrols:0 "Fly Night Patrols"
 ENG_ww1_x_night_patrols_desc:0 "Pilots take off in the dark to meet the raiders over London. The city sleeps a little better."
 ENG_ww1_x_officer_courses:0 "Expand the Officer Training Courses"
 ENG_ww1_x_officer_courses_desc:0 "Fund extra courses at the public schools and universities. One civilian factory worth of labour is tied up for 60 days; trained subalterns follow for eight months."
 ENG_ww1_x_place_district_contracts:0 "Place District Contracts"
 ENG_ww1_x_place_district_contracts_desc:0 "Use the survey of the industrial districts to place orders. One civilian factory is tied up for 60 days; afterwards output improves for half a year and debt rises."
 ENG_ww1_x_reconstruction_commission:0 "Appoint a Reconstruction Commission"
 ENG_ww1_x_reconstruction_commission_desc:0 "A commission takes over housing, employment and demobilisation grievances. It ties up one civilian factory for 90 days and costs money."
 ENG_ww1_x_rehearse_mobilisation:0 "Rehearse the Mobilisation Tables"
 ENG_ww1_x_rehearse_mobilisation_desc:0 "A paper rehearsal of trains, ports and depots for the Expeditionary Force. It teaches the Staff where the tables fail."
 ENG_ww1_x_seaplane_patrols:0 "Seaplane Patrol Rota"
 ENG_ww1_x_seaplane_patrols_desc:0 "Seaplanes from Calshot, Felixstowe and Yarmouth watch the approaches."
 ENG_ww1_x_seaplane_rota:0 "Set the Seaplane Patrol Rota"
 ENG_ww1_x_seaplane_rota_desc:0 "Draw up a rota for the stations on the east coast. For five months the approaches are watched more closely."
 ENG_ww1_x_service_the_debt:0 "Service the War Debt"
 ENG_ww1_x_service_the_debt_desc:0 "The commission redeems a tranche of the war debt out of revenue. Debt falls, but the fiscal squeeze is felt in wages."
 ENG_ww1_x_shipping_audit:0 "Audit the Merchant Register"
 ENG_ww1_x_shipping_audit_desc:0 "Lloyd's and the Board of Trade check which hulls can carry cargo, troops or hospitals. Idle tonnage is found and sold."
 ENG_ww1_x_summer_camp_season:0 "Hold the Summer Camps"
 ENG_ww1_x_summer_camp_season_desc:0 "The Territorial battalions pitch their tents for a fortnight. Volunteers and employers grumble, but the regiments learn to march together."
 ww1_britain.1.a:0 "Prioritise the Admiralty dockyards."
 ww1_britain.1.b:0 "Prioritise continental armaments."
 ww1_britain.1.c:0 "Maintain balanced factory allocation."
 ww1_britain.1.d:0 "The Treasury cannot promise every service priority at once. Naval estimates direct industrial effort towards the yards; continental estimates favour armament deliveries. A balanced allocation preserves factory continuity. Each programme occupies one civilian factory and remains in force until a later review. No choice grants a completed ship, division or weapon."
 ww1_britain.1.t:0 "The Defence Estimates"
 ww1_britain.11.a:0 "The diplomatic cost has been real."
 ww1_britain.11.d:0 "The allied leadership declined our request. Our continental policy and Belgian guarantee remain, but we have received no faction membership, forces or peace agreement. A later approach requires a new political effort."
 ww1_britain.11.t:0 "Allied Admission Refused"
 ww1_britain.12.a:0 "Continue through ordinary diplomacy."
 ww1_britain.12.d:0 "No eligible French or Russian faction leader can receive the cabinet request. Our policy does not create an alliance out of absent countries or force an enemy to cooperate. Existing wars and sovereignty remain unchanged."
 ww1_britain.12.t:0 "No Allied Leadership Available"
 ww1_britain.3.a:0 "Open talks with Irish representatives."
 ww1_britain.3.b:0 "Use emergency powers."
 ww1_britain.3.c:0 "Wait for a calmer season."
 ww1_britain.3.d:0 "Arrests, conscription rumours and the stalled Home Rule settlement have pushed Irish tension past ordinary administration. Dublin Castle asks whether the cabinet will negotiate, suppress the agitation or wait. Conciliation costs political capital; repression lowers tension briefly and leaves lasting resentment; delay keeps the problem open."
 ww1_britain.3.t:0 "Unrest in Ireland"
 ww1_britain.5.a:0 "Record the cabinet commitment."
 ww1_britain.5.d:0 "The cabinet has reaffirmed cooperation with France and the Belgian guarantee. Expeditionary planning can proceed, but actual troops, equipment and transport must still be provided. This policy does not declare a war or award a battlefield result."
 ww1_britain.5.t:0 "A Continental Commitment"
 ww1_britain.6.a:0 "Preparedness must now support our own policy."
 ww1_britain.6.d:0 "Before Britain enters a war, this policy withdraws the Belgian guarantee and British membership in the continental faction. Where a French or Russian ally remains, faction leadership is transferred before the withdrawal. Britain retains its fleet and forces, but loses direct coalition cooperation and domestic stability falls by one point. The policy cannot erase an existing war."
 ww1_britain.6.t:0 "A Policy of Armed Neutrality"
 ww1_britain.7.a:0 "Restore commitment and seek allied admission."
 ww1_britain.7.b:0 "Maintain armed neutrality."
 ww1_britain.7.d:0 "The cabinet can maintain neutrality or restore the Belgian guarantee and seek admission to an allied faction. A renewed commitment does not guarantee an invitation: the surviving faction leader must answer. Even if admission is refused, the cabinet can pursue its own diplomatic policy."
 ww1_britain.7.t:0 "Reconsidering the Continental Policy"
 ww1_britain.8.a:0 "Accept British admission."
 ww1_britain.8.b:0 "Decline admission for now."
 ww1_britain.8.d:0 "The British cabinet seeks entry into our faction after reconsidering neutrality. Accepting opens normal coalition cooperation and calls to arms; it does not supply armies or create an automatic peace. The proposal is only valid while Britain remains outside another faction, is not our enemy and the thirty-day consultation window remains open."
 ww1_britain.8.t:0 "Britain Requests Allied Admission"
 ww1_britain.9.a:0 "Prepare the coalition liaison."
 ww1_britain.9.d:0 "The surviving allied leadership accepted our request. Membership has been established through its consent. Our forces must still be raised, equipped, supplied and deployed; any participation in an existing war follows the normal diplomatic process."
 ww1_britain.9.t:0 "Allied Admission Accepted"
 ww1_britain_dip.10.a:0 "Grant the credit."
 ww1_britain_dip.10.b:0 "Decline."
 ww1_britain_dip.10.d:0 "The British ambassador asks American banks to finance purchases of munitions, wheat and cotton. Wall Street is willing; the government is split between neutrality and commercial interest."
 ww1_britain_dip.10.t:0 "A British Request for Credit"
 ww1_britain_dip.11.a:0 "Hear London's terms."
 ww1_britain_dip.11.b:0 "Keep the Triple Alliance for now."
 ww1_britain_dip.11.d:0 "Sonnino and Salandra receive London's terms: the Trentino, South Tyrol, Trieste, Istria and part of Dalmatia in exchange for joining the Entente. Vienna makes a rival, smaller offer."
 ww1_britain_dip.11.t:0 "London's Offer"
 ww1_britain_dip.12.a:0 "Renew the alliance obligations."
 ww1_britain_dip.12.b:0 "Remain neutral."
 ww1_britain_dip.12.d:0 "London invokes the Treaty of Windsor of 1386 and asks for access to Portuguese ports and colonies. Lisbon fears Germany in its African colonies and seeks guarantees of protection."
 ww1_britain_dip.12.t:0 "The Oldest Alliance"
 ww1_britain_dip.13.a:0 "Accept the credit."
 ww1_britain_dip.13.b:0 "Decline."
 ww1_britain_dip.13.d:0 "London offers arms and credit to the Russian army, which pays in wheat, flax and timber. Delivery depends on ports on the Baltic and the Arctic."
 ww1_britain_dip.13.t:0 "British Munitions Credit"
 ww1_britain_dip.14.a:0 "Accept the division of areas."
 ww1_britain_dip.14.b:0 "Decline the commitment."
 ww1_britain_dip.14.d:0 "London proposes that the Royal Navy guard the Channel and the North Sea while the French fleet guards the Mediterranean. Paris agrees but wants to know how far the British commitment goes."
 ww1_britain_dip.14.t:0 "The Anglo-French Naval Understanding"
 ww1_britain_dip.15.a:0 "Accept the coordination."
 ww1_britain_dip.15.b:0 "Decline."
 ww1_britain_dip.15.d:0 "London offers to coordinate allied transport and supply for the local army through Greek ports and Romanian and Serbian railways."
 ww1_britain_dip.15.t:0 "Supplies for the Balkans"
 ww1_britain_dip.2.a:0 "Accept a unified Allied command."
 ww1_britain_dip.2.b:0 "Keep the British command independent."
 ww1_britain_dip.2.d:0 "After Caporetto, British, French and Italians create a council at Versailles. Generals debate whether one Allied command is better than six national staffs."
 ww1_britain_dip.2.t:0 "The Supreme War Council"
 ww1_britain_dip.3.a:0 "Press for moderate terms."
 ww1_britain_dip.3.b:0 "Press for hard terms."
 ww1_britain_dip.3.d:0 "Foch and the governments discuss what to demand of Germany. Lloyd George fears a prolonged blockade and social collapse; public opinion demands punishment."
 ww1_britain_dip.3.t:0 "The Terms of the Armistice"
 ww1_britain_dip.4.a:0 "Accept naval parity."
 ww1_britain_dip.4.b:0 "Refuse the limits."
 ww1_britain_dip.4.d:0 "The United States proposes a 5:5:3 ratio for capital ships. The Admiralty resists, but the Treasury cannot sustain a naval race."
 ww1_britain_dip.4.t:0 "The Washington Naval Conference"
 ww1_britain_eco.1.a:0 "Freeze rents by law."
 ww1_britain_eco.1.b:0 "Break the strike and jail the leaders."
 ww1_britain_eco.1.d:0 "Landlords raise rents near the war factories of Glasgow. Working women and soldiers' wives picket evictions, and shop stewards threaten to stop the Clyde."
 ww1_britain_eco.1.t:0 "The Clydeside Rent Strikes"
 ww1_britain_eco.10.a:0 "Accept the coal."
 ww1_britain_eco.10.b:0 "Decline the offer."
 ww1_britain_eco.10.d:0 "London offers shiploads of coal to keep allied factories, railways and fleets running. The price is credit and tonnage that the British merchant marine could also use."
 ww1_britain_eco.10.t:0 "British Coal for the Allies"
 ww1_britain_eco.3.a:0 "Impose compulsory rationing."
 ww1_britain_eco.3.b:0 "Appeal for voluntary restraint."
 ww1_britain_eco.3.d:0 "U-boats cut wheat and sugar imports, and the queues grow. The Ministry of Food can impose compulsory rationing or ask for voluntary restraint."
 ww1_britain_eco.3.t:0 "Food Rationing"
 ww1_britain_eco.5.a:0 "Accept every cut."
 ww1_britain_eco.5.b:0 "Accept half."
 ww1_britain_eco.5.c:0 "Refuse the cuts."
 ww1_britain_eco.5.d:0 "The Geddes Committee proposes deep cuts in military, education and housing spending. Economists call for balance; unions and veterans promise resistance."
 ww1_britain_eco.5.t:0 "The Geddes Axe"
 ww1_britain_eco.6.a:0 "Back the mine owners."
 ww1_britain_eco.6.b:0 "Subsidise wages for some months."
 ww1_britain_eco.6.d:0 "With state control of the mines ended, owners cut wages. The Triple Alliance of miners, railwaymen and transport workers threatens a general strike, and the government's allies hesitate."
 ww1_britain_eco.6.t:0 "Black Friday for the Miners"
 ww1_britain_irish_devolution:0 "Irish Regional Government"
 ww1_britain_irish_exemption:0 "Voluntary Irish Military Service"
 ww1_britain_mil.10.a:0 "Welcome the Expeditionary Force."
 ww1_britain_mil.10.d:0 "The first battalions of the British Expeditionary Force land at Boulogne and Le Havre. The crowd cheers the khaki soldiers, and Paris recovers the hope that it will not stand alone."
 ww1_britain_mil.10.t:0 "The British Arrive"
 ww1_britain_mil.11.a:0 "Defend the Straits at any cost."
 ww1_britain_mil.11.d:0 "Allied ships bombard the Dardanelles forts. The government in Constantinople has few guns and little ammunition, but the country rallies: the threat to the capital unites even its opponents."
 ww1_britain_mil.11.t:0 "The Allied Fleet at the Straits"
 ww1_britain_mil.12.a:0 "Order the troops to hold on."
 ww1_britain_mil.12.b:0 "Approach the Chancellor to seek an armistice."
 ww1_britain_mil.12.d:0 "Whole divisions surrender with few shots. Ludendorff tells the Kaiser that the war can no longer be won by force. The staff must decide how to tell the country."
 ww1_britain_mil.12.t:0 "The Black Day of the German Army"
 ww1_britain_mil.13.a:0 "Accept the officers."
 ww1_britain_mil.13.b:0 "Decline."
 ww1_britain_mil.13.d:0 "London offers to send staff officers to Allied headquarters to coordinate plans, supplies and transport. Local commanders are divided between usefulness and pride."
 ww1_britain_mil.13.t:0 "British Liaison Officers"
 ww1_britain_mil.2.a:0 "Try with the fleet alone."
 ww1_britain_mil.2.b:0 "Make a joint landing."
 ww1_britain_mil.2.c:0 "Shelve the plan."
 ww1_britain_mil.2.d:0 "Churchill argues that the fleet should force the Straits and reach Constantinople. Fisher and Kitchener doubt the adventure, and the War Council needs a quick decision before Turkey reinforces the forts."
 ww1_britain_mil.2.t:0 "The Dardanelles Decision"
 ww1_britain_mil.3.a:0 "Mount one more relief attempt."
 ww1_britain_mil.3.b:0 "Negotiate terms with the Turkish officers."
 ww1_britain_mil.3.d:0 "The Sixth Indian Division, surrounded at Kut-al-Amara by the Turks, is out of food. Relief attacks fail in the mud and the Tigris floods. Surrender is a matter of weeks."
 ww1_britain_mil.3.t:0 "The Siege of Kut"
 ww1_britain_mil.4.a:0 "Accept the losses and press the offensive."
 ww1_britain_mil.4.b:0 "Spread the losses across the regiments."
 ww1_britain_mil.4.d:0 "On 1 July 1916 the volunteer battalions climb out of their trenches in line. Within hours there are nearly sixty thousand casualties, and whole towns lose their young men. Haig demands the battle go on."
 ww1_britain_mil.4.t:0 "The First Day of the Somme"
 ww1_britain_mil.5.a:0 "Release by length of service and civilian need."
 ww1_britain_mil.5.b:0 "Keep the units together and release slowly."
 ww1_britain_mil.5.d:0 "Millions of men await the trip home. The cabinet decides whether length of service, guaranteed jobs or the keeping of whole units counts. Those left longer in France think it unfair."
 ww1_britain_mil.5.t:0 "Demobilisation"
 ww1_britain_mil.6.a:0 "Trade ground for time."
 ww1_britain_mil.6.b:0 "Hold the forward zone at any cost."
 ww1_britain_mil.6.d:0 "On 21 March 1918 the Germans strike in Picardy under fog and a gas bombardment. The Fifth Army gives way, and the Allied line risks splitting between British and French."
 ww1_britain_mil.6.t:0 "The German Spring Offensive"
 ww1_britain_mil.7.a:0 "Press along the whole front."
 ww1_britain_mil.7.b:0 "Pause to bring up the guns."
 ww1_britain_mil.7.d:0 "On 8 August 1918 tanks, Canadians and Australians break the German line under fog. Ludendorff calls it the black day of the German army. Haig and Foch must decide whether to deepen the advance."
 ww1_britain_mil.7.t:0 "Amiens, the Black Day"
 ww1_britain_mil.8.a:0 "Speed up the releases at once."
 ww1_britain_mil.8.b:0 "Send loyal units to restore order."
 ww1_britain_mil.8.d:0 "Soldiers weary of waiting at Folkestone and Calais refuse to re-embark for France and elect committees. The generals fear a revolution, and Churchill, at the War Office, prepares a response."
 ww1_britain_mil.8.t:0 "The Calais Mutinies"
 ww1_britain_nav.10.a:0 "Ration bread and potatoes."
 ww1_britain_nav.10.b:0 "Blame British piracy in the neutral press."
 ww1_britain_nav.10.d:0 "The Royal Navy closes the North Sea and the Channel. Grain, fertiliser, saltpetre and rubber stop arriving. In German cities bread and potatoes run short and food queues grow."
 ww1_britain_nav.10.t:0 "The Hunger Blockade"
 ww1_britain_nav.11.a:0 "Protest firmly in London."
 ww1_britain_nav.11.b:0 "Accept the blockade and keep trading."
 ww1_britain_nav.11.d:0 "The British search American ships at Kirkwall and seize cargoes bound for Holland and Scandinavia. Cotton and copper exporters complain, but New York banks profit from Allied orders."
 ww1_britain_nav.11.t:0 "The Orders in Council"
 ww1_britain_nav.12.a:0 "Accept the cooperation."
 ww1_britain_nav.12.b:0 "Decline."
 ww1_britain_nav.12.d:0 "London proposes to share convoy escort in the Mediterranean: Allied destroyers cover Malta, Brindisi and Salonika while the British cover Egypt. Enemy submarines sink ships every week."
 ww1_britain_nav.12.t:0 "Escorts in the Mediterranean"
 ww1_britain_nav.2.a:0 "Adopt the convoy system."
 ww1_britain_nav.2.b:0 "Keep the patrols."
 ww1_britain_nav.2.d:0 "In April 1917 submarines sink nearly one in four ships leaving the islands. The Admiralty fears convoys would be slow, easy targets, but Lloyd George already threatens to walk into the operations room himself."
 ww1_britain_nav.2.t:0 "The Convoy Debate"
 ww1_britain_nav.3.a:0 "Publish Jellicoe's sober report."
 ww1_britain_nav.3.b:0 "Stress the German flight to port."
 ww1_britain_nav.3.d:0 "The Grand Fleet and the High Seas Fleet collide off Denmark. The British lose more ships, yet the German fleet returns to port and never again seeks a decisive battle. The Admiralty communique reads like a defeat."
 ww1_britain_nav.3.t:0 "The Battle of Jutland"
 ww1_britain_nav.4.a:0 "Order the blackout and trust the guns."
 ww1_britain_nav.4.b:0 "Recall squadrons for home defence."
 ww1_britain_nav.4.d:0 "German airships drop bombs on Great Yarmouth and King's Lynn and later on London. Few die, but panic is wide. The newspapers ask where the Navy and the Army are."
 ww1_britain_nav.4.t:0 "Zeppelins over England"
 ww1_britain_nav.5.a:0 "Reorganise the defence of London."
 ww1_britain_nav.5.b:0 "Appoint General Smuts to investigate."
 ww1_britain_nav.5.d:0 "Gotha bombers strike London in broad daylight in June 1917, killing over a hundred people. Public fury is immense and the factories ask for protection. The cabinet demands answers."
 ww1_britain_nav.5.t:0 "The Gotha Raids"
 ww1_britain_nav.6.a:0 "Create an independent air service."
 ww1_britain_nav.6.b:0 "Keep Flying Corps and Naval Service separate."
 ww1_britain_nav.6.d:0 "Smuts concludes that air warfare will in future be an operation independent of sea and land. The Army and the Navy resist losing their aircraft, and the Air Council needs a decision."
 ww1_britain_nav.6.t:0 "The Smuts Report"
 ww1_britain_pol.1.a:0 "Press the Bill without exclusions."
 ww1_britain_pol.1.b:0 "Allow county opt-outs in the Bill."
 ww1_britain_pol.1.c:0 "Shelve the Bill until the Lords question cools."
 ww1_britain_pol.1.d:0 "In April 1912 Asquith introduces the Government of Ireland Bill. The Irish Party, whose votes sustain the Liberal majority, demands it without exclusions. The Ulster Unionists under Carson promise resistance, and the Lords can delay it for two years. How the Bill is framed decides how much trouble follows."
 ww1_britain_pol.1.t:0 "The Third Home Rule Bill"
 ww1_britain_pol.10.a:0 "Sign the Treaty: a Free State as a Dominion."
 ww1_britain_pol.10.b:0 "Refuse and continue the war."
 ww1_britain_pol.10.d:0 "After two years of fighting, Lloyd George, Churchill and Collins negotiate in London. The offer is an Irish Free State with Dominion status; six north-eastern counties remain in the United Kingdom."
 ww1_britain_pol.10.t:0 "The Anglo-Irish Treaty"
 ww1_britain_pol.11.a:0 "Martial law and courts-martial."
 ww1_britain_pol.11.b:0 "Clemency and a civil inquiry."
 ww1_britain_pol.11.d:0 "On Easter Monday, Irish Volunteers and the Citizen Army seize points in Dublin and proclaim a republic. The revolt is crushed within a week, but the government's response will decide how Ireland remembers it."
 ww1_britain_pol.11.t:0 "The Easter Rising"
 ww1_britain_pol.12.a:0 "Extend the Military Service Act to Ireland."
 ww1_britain_pol.12.b:0 "Pass enabling power and hold in reserve."
 ww1_britain_pol.12.c:0 "Withdraw the proposal."
 ww1_britain_pol.12.d:0 "The German offensive of March 1918 drains the reserves. The cabinet debates extending conscription to Ireland. Nationalists, the Church and the unions promise resistance, and a general strike is already called."
 ww1_britain_pol.12.t:0 "The Irish Conscription Crisis"
 ww1_britain_pol.2.a:0 "Accept temporary exclusion of Ulster."
 ww1_britain_pol.2.b:0 "Refuse any exclusion."
 ww1_britain_pol.2.d:0 "The King summons Liberals, Conservatives, nationalists and unionists to the Palace to avert civil war. The sticking point is geographic: which Ulster counties stand outside Home Rule and for how long."
 ww1_britain_pol.2.t:0 "The Buckingham Palace Conference"
 ww1_britain_pol.20.a:0 "Send volunteers."
 ww1_britain_pol.20.b:0 "Keep the men at home."
 ww1_britain_pol.20.d:0 "London asks for volunteers for the European front. The Dominion cabinet weighs loyalty to the empire against the needs of farm, factory and family."
 ww1_britain_pol.20.t:0 "A Request from London"
 ww1_britain_pol.3.a:0 "Form a coalition government."
 ww1_britain_pol.3.b:0 "Carry on with a Liberal-only cabinet."
 ww1_britain_pol.3.d:0 "The shell shortage on the Western Front and Admiral Fisher's resignation leave the Liberal cabinet exposed. Bonar Law's Conservatives ask for seats, and Labour's Henderson agrees to join."
 ww1_britain_pol.3.t:0 "The Shell Crisis and the Coalition"
 ww1_britain_pol.4.a:0 "Create the War Cabinet."
 ww1_britain_pol.4.b:0 "Reorganise the existing committees."
 ww1_britain_pol.4.d:0 "Lloyd George demands a small War Cabinet without Asquith chairing its business. The alternative is reorganising existing committees without breaking with the prime minister."
 ww1_britain_pol.4.t:0 "The December Crisis of 1916"
 ww1_britain_pol.5.a:0 "Issue the coupon to coalition candidates."
 ww1_britain_pol.5.b:0 "Fight as separate parties."
 ww1_britain_pol.5.c:0 "Delay the election for a reconstruction mandate."
 ww1_britain_pol.5.d:0 "With the armistice signed, Lloyd George wants a mandate for the peace. The 'coupon' is a letter of support for coalition candidates; those without it face the electorate alone."
 ww1_britain_pol.5.t:0 "The Coupon Election"
 ww1_britain_pol.6.a:0 "Press for contribution to Royal Navy."
 ww1_britain_pol.6.b:0 "Accept coordinated local navies."
 ww1_britain_pol.6.d:0 "The Dominion premiers discuss common defence with Asquith and Grey. The Admiralty wants a cash contribution; the Dominions prefer navies of their own under local control in peacetime."
 ww1_britain_pol.6.t:0 "The Imperial Conference of 1911"
 ww1_britain_pol.7.a:0 "Demand army discipline."
 ww1_britain_pol.7.b:0 "Accept assurances and do not coerce Ulster."
 ww1_britain_pol.7.d:0 "Army officers at the Curragh warn that they would rather be dismissed than march against Ulster. The Ulster Volunteers already hold rifles landed from Germany. The government must choose between discipline and appeasement."
 ww1_britain_pol.7.t:0 "The Ulster Volunteers and the Army"
 ww1_britain_pol.8.a:0 "Give the premiers full seats."
 ww1_britain_pol.8.b:0 "Consult them without seats."
 ww1_britain_pol.8.d:0 "In 1917 the Dominion premiers arrive in London. Lloyd George must decide whether they sit in the cabinet as equals or are merely heard."
 ww1_britain_pol.8.t:0 "The Imperial War Cabinet"
 ww1_britain_pol.9.a:0 "Negotiate self-government for the whole island."
 ww1_britain_pol.9.b:0 "Partition into northern and southern parliaments."
 ww1_britain_pol.9.c:0 "Impose martial law."
 ww1_britain_pol.9.d:0 "Nationalists, southern unionists and the government seek a settlement for the whole island. Carson demands partition; Redmond no longer speaks for all nationalists. After 1916 and 1918 Sinn Féin outweighs the Irish Party."
 ww1_britain_pol.9.t:0 "The Irish Convention"
 ww1_britain_x.1.a:0 "Speak at the Mansion House"
 ww1_britain_x.1.b:0 "Back France quietly"
 ww1_britain_x.1.c:0 "Counsel restraint"
 ww1_britain_x.1.d:0 "A German gunboat drops anchor at Agadir and Paris asks what London intends to do. The Foreign Office wants a firm answer, the Radicals want none, and Lloyd George has a speech ready for the Mansion House."
 ww1_britain_x.1.t:0 "The Panther at Agadir"
 ww1_britain_x.10.a:0 "Stand firm at the Straits"
 ww1_britain_x.10.b:0 "Negotiate at Mudanya"
 ww1_britain_x.10.c:0 "Appeal to the Dominions"
 ww1_britain_x.10.d:0 "Kemal's army reaches the neutral zone at the Straits and a few British battalions stand between it and the sea. The Dominions are asked to send troops and Canada does not answer."
 ww1_britain_x.10.t:0 "The Chanak Crisis"
 ww1_britain_x.2.a:0 "Concentrate the fleet in home waters"
 ww1_britain_x.2.b:0 "Keep a Mediterranean squadron"
 ww1_britain_x.2.c:0 "Rely on the French fleet"
 ww1_britain_x.2.d:0 "The new German fleet law leaves the Admiralty with too few battleships for both the North Sea and Malta. Churchill wants the Mediterranean squadron home; the Foreign Office fears what Italy and Austria will conclude."
 ww1_britain_x.2.t:0 "The Mediterranean Question"
 ww1_britain_x.3.a:0 "Apply the Cat and Mouse Act"
 ww1_britain_x.3.b:0 "Open talks on a limited franchise"
 ww1_britain_x.3.c:0 "Leave it to the courts"
 ww1_britain_x.3.d:0 "Windows are broken in the West End and prisoners on hunger strike are released and arrested again. The Home Office has a law for it, the Speaker's Conference is a dream, and the public is tired of both sides."
 ww1_britain_x.3.t:0 "Votes for Women"
 ww1_britain_x.4.a:0 "Reassure the officers"
 ww1_britain_x.4.b:0 "Court-martial the ringleaders"
 ww1_britain_x.4.c:0 "Let the Prime Minister take the War Office"
 ww1_britain_x.4.d:0 "Cavalry officers at the Curragh say they would rather resign than march against Ulster. The War Office hesitates, the Cabinet contradicts itself, and the Irish benches ask who governs the army."
 ww1_britain_x.4.t:0 "The Curragh Incident"
 ww1_britain_x.5.a:0 "Publish the casualty lists"
 ww1_britain_x.5.b:0 "Send a measured note to Washington"
 ww1_britain_x.5.c:0 "Reopen the convoy question"
 ww1_britain_x.5.d:0 "A German submarine sinks the liner off the Old Head of Kinsale. More than a thousand are dead, among them Americans, and crowds smash German shop windows in Liverpool and London."
 ww1_britain_x.5.t:0 "The Lusitania"
 ww1_britain_x.6.a:0 "Press the offensive"
 ww1_britain_x.6.b:0 "Halt after the ridge"
 ww1_britain_x.6.c:0 "Send guns to Italy"
 ww1_britain_x.6.d:0 "The rains come early and the ridge is a swamp. Haig believes one more push breaks the German army; Lloyd George fears the casualty lists and the Italian front is calling for guns."
 ww1_britain_x.6.t:0 "Third Ypres"
 ww1_britain_x.7.a:0 "Ring the bells and back the tanks"
 ww1_britain_x.7.b:0 "Study the lessons"
 ww1_britain_x.7.c:0 "Caution the press"
 ww1_britain_x.7.d:0 "Hundreds of tanks roll over the Hindenburg Line without a preliminary bombardment, and for the first time the church bells ring in London. The German counter-attack ten days later takes most of it back."
 ww1_britain_x.7.t:0 "Cambrai"
 ww1_britain_x.8.a:0 "Fund hospitals and inspectors"
 ww1_britain_x.8.b:0 "Leave it to local boards"
 ww1_britain_x.8.c:0 "Censor the figures"
 ww1_britain_x.8.d:0 "The second wave of the influenza empties factories, schools and barracks. Doctors want the cinemas closed; the Local Government Board wants the trains kept running."
 ww1_britain_x.8.t:0 "The Influenza"
 ww1_britain_x.9.a:0 "Appoint the Hunter Committee"
 ww1_britain_x.9.b:0 "Stand by General Dyer"
 ww1_britain_x.9.c:0 "Censure and retire him quietly"
 ww1_britain_x.9.d:0 "General Dyer's troops have fired into an unarmed crowd in Amritsar. The Viceroy's telegrams are cautious, the Punjab is under martial law, and Montagu demands to know what was done in the Crown's name."
 ww1_britain_x.9.t:0 "Jallianwala Bagh"
