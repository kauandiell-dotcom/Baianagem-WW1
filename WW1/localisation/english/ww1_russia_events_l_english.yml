l_english:
 ww1_russia.1.t:0 "Assassination Attempt on Stolypin in Kiev"
 ww1_russia.1.d:0 "During a gala performance at the Kiev Opera House in the presence of the Tsar, revolutionary Dmitry Bogrov fired two shots at Prime Minister Pyotr Stolypin. The Prime Minister collapsed onto his chair, making the sign of the cross toward the imperial box."
 ww1_russia.1.a:0 "Stolypin succumbs to his wounds days later..."
 ww1_russia.1.b:0 "Miraculously, the bullet glances off his medal!"
 SOV_stolypin_dies_tt:0 "Pyotr Stolypin dies. Reformist momentum is halted."
 SOV_stolypin_survives_tt:0 "Stolypin survives and solidifies his authority."

 ww1_russia.5.t:0 "General Mobilization of the Imperial Army"
 ww1_russia.5.d:0 "The Emperor of all the Russias has signed the decree ordering general mobilization. Bells toll across every village from Poland to the Pacific as millions of peasants report to their garrisons."
 ww1_russia.5.a:0 "For God, the Tsar, and the Fatherland!"
 SOV_general_mobilization_tt:0 "Over five million soldiers begin mobilizing."

 ww1_russia.10.t:0 "Bread Riots Erupt in Petrograd"
 ww1_russia.10.d:0 "Severe blizzards, bread shortages, and endless queues have brought hundreds of thousands of workers into the streets of Petrograd demanding 'Bread and Peace!'."
 ww1_russia.10.a:0 "Order must be restored in the capital!"

 ww1_russia.11.t:0 "The Abdication of Nicholas II"
 ww1_russia.11.d:0 "Stranded in his imperial train at Pskov, Nicholas II meets with Duma envoys Guchkov and Shulgin. Convinced by his generals that only his abdication can preserve the army and prevent civil war, the Tsar signs the manifesto."
 ww1_russia.11.a:0 "Accept abdication for himself and his son Alexei."
 ww1_russia.11.b:0 "Refuse! Autocracy is answerable only to God!"
 SOV_abdication_accepted_tt:0 "The Romanov dynasty ends. The Provisional Government takes power."
 SOV_tsar_resists_tt:0 "The Tsar calls on loyal frontline troops to march on Petrograd."

 ww1_russia.12.t:0 "Urgent Serbian Appeal to the Tsar"
 ww1_russia.12.d:0 "In the shadow of the Austrian ultimatum to Belgrade, Crown Prince Regent Alexander has dispatched an agonizing appeal to Emperor Nicholas II. Serbia submits to European arbitration, but begs the Tsar not to abandon a Slavic sister nation to destruction by Vienna."
 ww1_russia.12.a:0 "Russia will never abandon her Slavic brethren!"
 ww1_russia.12.b:0 "Urge utmost caution; we cannot risk a world war today."

 ww1_russia.15.t:0 "Kerensky Assumes Leadership of the Government"
 ww1_russia.15.d:0 "Following Prince Lvov's resignation, Alexander Kerensky assumes the premiership, striving to reconcile revolutionary democracy with frontline duty."
 ww1_russia.15.a:0 "Forward to defense of the Republic!"

 ww1_russia.20.t:0 "The Kornilov Affair"
 ww1_russia.20.d:0 "Supreme Commander General Lavr Kornilov dispatches General Krymov's 3rd Cavalry Corps toward Petrograd to disperse the Soviet and hang German spies. Kerensky panics, branding Kornilov a traitor and distributing arms to the Bolshevik Red Guards."
 ww1_russia.20.a:0 "Railway workers sabotage Kornilov's trains!"
 ww1_russia.20.b:0 "Kornilov's cavalry advances on Petrograd!"
 SOV_kornilov_fails_tt:0 "The Bolsheviks become masters of the capital."
 SOV_kornilov_succeeds_tt:0 "General Kornilov establishes a military dictatorship."

 ww1_russia.30.t:0 "Secret Willy-Nicky Negotiations"
 ww1_russia.30.d:0 "Personal emissaries between Wilhelm II and Nicholas II discuss an honorable separate peace and mutual defense against Western maritime dominance."
 ww1_russia.30.a:0 "Hear what Berlin has to offer."

 ww1_russia.40.t:0 "The Peace of Brest-Litovsk"
 ww1_russia.40.d:0 "Russian and Central Powers delegations conclude the draconian treaty of Brest-Litovsk. Russia withdraws from the Great War, recognizing the independence of Ukraine, Finland, and the Baltic."
 ww1_russia.40.a:0 "Sign the treaty. We need breathing space."
ww1_russia.50.t:0 "The Great Shell Crisis: Snaryadny Golod"
 ww1_russia.50.d:0 "The intense combat of the first months of war has utterly consumed pre-war artillery reserves. Frontline batteries are strictly rationed to two or three rounds per day. Russian infantry in the trenches face murderous German and Austro-Hungarian artillery barrages without the ability to fire back."
 ww1_russia.50.a:0 "Our batteries are falling silent..."
 SOV_shell_shortage_crisis_tt:0 "Russian artillery attack and unit combat effectiveness are severely reduced until industry and imports can be mobilized."
 ww1_russia.51.t:0 "Dismissal of Sukhomlinov & Polivanov's Ministry"
 ww1_russia.51.d:0 "Outrage over shell shortages and the catastrophes of the Great Retreat has forced Nicholas II to dismiss the disgraced Minister of War, Vladimir Sukhomlinov. General Alexei Polivanov takes office, immediately reaching out to the Duma and establishing the Special Council for State Defense."
 ww1_russia.51.a:0 "Reform the Ministry and coordinate with the Zemstvos!"
 SOV_polivanov_appointed_tt:0 "General Polivanov replaces Sukhomlinov. Command paralysis and planning penalties are substantially mitigated."

 # Pre-Revolutionary Crisis Dashboard & Decisions
 SOV_revolutionary_crisis_category:0 "Russian Empire Revolutionary Crisis"
 SOV_revolutionary_crisis_category_desc:0 "§H══════════════════════════════════════════════════§!\n§H   IMPERIAL STABILITY & POPULAR RADICALISM   §!\n§H══════════════════════════════════════════════════§!\n\n §R• Revolutionary Tension:§! §Y[?SOV_revolutionary_tension|0]%§!\n §O• Industrial Worker Unrest:§! §Y[?SOV_worker_unrest|0]%§!\n §O• Urban Famine & Shortages:§! §Y[?SOV_urban_hunger|0]%§!\n §G• Armed Forces Loyalty:§! §Y[?SOV_army_loyalty|0]%§!\n\n§H──────────────────────────────────────────────────§!\n §WWarn:§! If §RRevolutionary Tension§! exceeds §H85%§! during wartime,\nthe workers' councils and garrison mutineers will storm the Winter Palace!\n§H──────────────────────────────────────────────────§!"
 SOV_crisis_tension_bar_tt:0 "§YRecalculates the imperial revolutionary tension level based on famine and worker unrest.§!"
 SOV_crisis_grain_requisitions_tt:0 "§G• Urban Hunger:§! §H-10%§!\n§R• Worker Unrest:§! §H+5%§!\n§Y• Revolutionary Tension will ease with the arrival of food supplies.§!"
 SOV_crisis_bread_subsidies_tt:0 "§G• Urban Hunger:§! §H-15%§!\n§G• Revolutionary Tension:§! §H-5%§!"
 SOV_crisis_okhrana_sweeps_tt:0 "§G• Worker Unrest:§! §H-15%§!\n§G• Revolutionary Tension:§! §H-10%§!"
 SOV_crisis_frontline_tour_tt:0 "§G• Army Loyalty:§! §H+15%§!\n§G• Revolutionary Tension:§! §H-5%§!"
 SOV_crisis_emergency_grain_requisitions:0 "Emergency Grain Requisitions"
 SOV_crisis_emergency_grain_requisitions_desc:0 "Force grain requisitions from the countryside to feed the starving workers in Petrograd and Moscow."
 SOV_crisis_bread_price_subsidies:0 "Bread Price Subsidies"
 SOV_crisis_bread_price_subsidies_desc:0 "Subsidize bakeries and grain transports using state treasury funds to lower bread prices in urban centers."
 SOV_crisis_okhrana_sweeps:0 "Okhrana Raids on Agitators"
 SOV_crisis_okhrana_sweeps_desc:0 "Direct the Okhrana secret police to arrest Bolshevik agitators and raid clandestine printing presses."
 SOV_crisis_imperial_frontline_tour:0 "Imperial Frontline Tour"
 SOV_crisis_imperial_frontline_tour_desc:0 "The Tsar tours frontline trenches and inspects battalions to bolster monarchist loyalty among soldiers."
 SOV_crisis_petersburg_bread_rationing:0 "Bread Rationing in Petrograd"
 SOV_crisis_petersburg_bread_rationing_desc:0 "Impose strict flour quotas and ration cards to prevent speculative hoarding in metropolitan centers."
 SOV_crisis_bread_rationing_tt:0 "§G• Urban Hunger:§! §H-10%§!\n§G• National Stability:§! §H+3.0%§!"
 SOV_crisis_concessions_to_duma:0 "Concessions to the Progressive Bloc"
 SOV_crisis_concessions_to_duma_desc:0 "Pledge constitutional reforms and coordinate with moderate parliamentarians to defuse civil unrest."
 SOV_crisis_duma_concessions_tt:0 "§G• Worker Unrest:§! §H-12%§!\n§G• Political Power:§! §H+25§!"

 # Pre-Revolutionary Crisis Events
 ww1_russia.300.t:0 "Lenin Arrives via Sealed Train"
 ww1_russia.300.d:0 "Facilitated by the German General Staff in an audacious operation of political warfare, Vladimir Ilyich Lenin and his Bolshevik cohort have crossed Europe in a sealed train, arriving at Petrograd's Finland Station amidst crowds of cheering sailors and workers."
 ww1_russia.300.a:0 "All power to the Soviets!"
 SOV_lenin_returned_tt:0 "Vladimir Lenin has returned to Petrograd. Revolutionary subversion surges."

 ww1_russia.301.t:0 "Lenin Returns to Petrograd"
 ww1_russia.301.d:0 "Evading border police through clandestine transit channels, Vladimir Lenin has slipped into Petrograd to take direct command of Bolshevik revolutionary agitation."
 ww1_russia.301.a:0 "Peace, Land, and Bread!"

 ww1_russia.305.t:0 "Triumph of Order"
 ww1_russia.305.d:0 "Through rigorous state administration, decisive social mitigation, and steadfast military loyalty, the imperial authorities have weathered the tempest of revolutionary unrest. Order reigns supreme across the Empire."
 ww1_russia.305.a:0 "God Save the Tsar!"
 SOV_order_restored_tt:0 "Revolutionary unrest is broken. Imperial stability is restored."

 ww1_russia.310.t:0 "Storming of the Winter Palace"
 ww1_russia.310.d:0 "The crisis reaches its boiling point! Armed workers and radicalized soldiers march upon the Winter Palace. Government ministers are placed under arrest as the old order collapses amidst revolutionary triumph!"
 ww1_russia.310.a:0 "The Revolution has triumphed!"
 SOV_revolution_triggered_tt:0 "The revolutionary threshold has been breached. The revolution erupts!"

 # Civil War Eruption Events
 ww1_russia_civil_war.1.t:0 "The Russian Civil War Erupts"
 ww1_russia_civil_war.1.d:0 "The storming of the Winter Palace has shattered the Russian Empire into armed ideological camps. In Petrograd and Moscow, Vladimir Lenin and the Bolshevik Council of People's Commissars proclaim Soviet power and mobilize the Red Army. Across Siberia, the Urals, and the South, White generals and Cossack Atamans rally loyalist divisions to crush the Reds. Simultaneously, national movements in Ukraine, Finland, Poland, and the Caucasus declare independence, plunging the former empire into a multi-front struggle for survival."
 ww1_russia_civil_war.1.a:0 "All power to the Soviets! Forward, Red Guards!"
 ww1_russia_civil_war.1.b:0 "For a One and Indivisible Russia! White Movement rallies!"
 SOV_fleet_split_tt:0 "§YNaval Division:§! Baltic Fleet pledges allegiance to the Soviets; Black Sea Fleet rallies to the White Army."
 SOV_stockpile_split_tt:0 "§YStockpile Partition:§! Imperial armories and arsenals are split between the warring factions."
 SOV_play_reds_tt:0 "Play as §RSoviet Russia§! (SOV)."
 SOV_play_whites_tt:0 "Switch perspective to play as §WWhite Russia§! (WHT)."

 ww1_russia_civil_war.10.t:0 "Red Victory: The Bolshevik Triumph"
 ww1_russia_civil_war.10.d:0 "The White strongholds in Siberia and the Urals have fallen before the advance of the Workers' and Peasants' Red Army. General Kolchak and the White generals have been defeated, their remnants fleeing or surrendering. Across the vast expanse of Russia, Soviet power has triumphed, establishing the undisputed authority of the Bolshevik state."
 ww1_russia_civil_war.10.a:0 "Long live the Soviet Republic! Glory to the Red Army!"

 ww1_russia_civil_war.20.t:0 "White Victory: The Fall of the Soviets"
 ww1_russia_civil_war.20.d:0 "The Red bastions in Moscow and Petrograd have fallen to loyalist armies! Vladimir Lenin and the Council of People's Commissars have been overthrown or forced into exile. Across the nation, church bells toll as the White movement proclaims the restoration of order, civil law, and the Russian State."
 ww1_russia_civil_war.20.a:0 "Order is restored! Long live the Russian State!"

 ww1_russia_civil_war.30.t:0 "Re-integration of Ukraine"
 ww1_russia_civil_war.30.d:0 "Kiev has fallen and resistance has collapsed. Ukrainian territory is re-integrated under central administration, securing vital grain lands and industrial centers along the Dnieper."
 ww1_russia_civil_war.30.a:0 "Re-establish authority over Ukraine!"

 ww1_russia_civil_war.40.t:0 "The Treaty of Tartu"
 ww1_russia_civil_war.40.d:0 "With the Karelian front deadlocked and Finnish forces securing their sovereign territory, envoys meet in Tartu to conclude a peace treaty. The border is demarcated and Finnish independence is formally recognized, ending hostilities in the north."
 ww1_russia_civil_war.40.a:0 "Sign the Treaty of Tartu."

 # Soviet Civil War Management Decisions
 SOV_civil_war_management:0 "Soviet Civil War Administration"
 SOV_civil_war_management_desc:0 "Emergency wartime measures to safeguard Soviet power, feed urban industrial workers, and arm the Red Army on all fronts."
 SOV_seize_kazan_gold_reserves:0 "Seize the Imperial Gold Reserves in Kazan"
 SOV_seize_kazan_gold_reserves_desc:0 "Secure the Imperial State Bank's gold bullion stored in the vaults of Kazan to finance emergency industrial production and state purchases."
 SOV_prodrazvyorstka_grain_expeditions:0 "Prodrazvyorstka Grain Expeditions"
 SOV_prodrazvyorstka_grain_expeditions_desc:0 "Dispatch armed worker and Red Guard detachments into rural provinces to requisition grain quotas and ensure food supply to the frontlines."
 SOV_mobilize_petrograd_workers:0 "Mobilize Petrograd Industrial Workers"
 SOV_mobilize_petrograd_workers_desc:0 "Levy workers from the Putilov and Baltic shipyards into armed battalions to reinforce threatened fronts."
 SOV_trotsky_armored_train_inspection:0 "Trotsky's Armored Train Frontline Inspection"
 SOV_trotsky_armored_train_inspection_desc:0 "Commissar of War Leon Trotsky travels the frontlines aboard his armored train to restore discipline, inspire revolutionary zeal, and rally retreating divisions."

 # Brest-Litovsk & Soviet Diplomacy Events
 ww1_russia_diplomacy.1.t:0 "Soviet Peace Overtures at Brest-Litovsk"
 ww1_russia_diplomacy.1.d:0 "The newly formed Bolshevik Council of People's Commissars has proclaimed the Decree on Peace, appealing for an immediate cessation of hostilities. Envoys under Adolf Joffe have arrived at the German headquarters in Brest-Litovsk seeking an armistice. Field Marshal von Hindenburg and General Ludendorff present our stark choice: dictate severe territorial terms stripping Russia of its western provinces, or resume the offensive eastward."
 ww1_russia_diplomacy.1.a:0 "Dictate our terms! Cede the borderlands or face destruction!"
 ww1_russia_diplomacy.1.b:0 "Refuse negotiations! The German army will march to Petrograd!"
 GER_dictate_brest_litovsk_tt:0 "Present an ultimatum demanding the independence and cession of Poland, Lithuania, and Ukraine."
 GER_refuse_peace_talks_tt:0 "Hostilities continue unabated across the Eastern Front."

 ww1_russia_diplomacy.2.t:0 "The German Ultimatum: The Treaty of Brest-Litovsk"
 ww1_russia_diplomacy.2.d:0 "At Brest-Litovsk, the German delegation headed by General Max Hoffmann has laid down an iron ultimatum. Russia must surrender sovereignty over Poland, Lithuania, Courland, and recognize Ukrainian and Finnish independence. The Bolshevik leadership is bitterly fractured: Lenin urges accepting the 'shameful peace' to preserve Soviet power, Bukharin demands revolutionary war, and Trotsky champions 'neither war nor peace'."
 ww1_russia_diplomacy.2.a:0 "Sign the Treaty. The Soviet Republic needs breathing space!"
 ww1_russia_diplomacy.2.b:0 "Neither war nor peace! Trotsky walks out of negotiations!"
 SOV_brest_litovsk_signed_tt:0 "Conclude an immediate white peace with the Central Powers. Germany secures grain and raw material deliveries."
 SOV_trotsky_walkout_tt:0 "Trotsky denounces imperialist annexations and walks out, leaving the front wide open to German advance."

 ww1_russia_diplomacy.3.t:0 "Operation Faustschlag: The German Spring Offensive"
 ww1_russia_diplomacy.3.d:0 "Following the Soviet delegation's refusal to sign the treaty, Supreme Army Command has launched Operation Faustschlag—the 'Fist Punch'. With the old Russian army completely disintegrated and Red Guards offering token resistance, fifty German divisions advance eastward along railway lines at lightning speed, overrunning Dvinsk, Minsk, and Kiev."
 ww1_russia_diplomacy.3.a:0 "Forward across the rails! Nothing can halt our advance!"

 ww1_russia_diplomacy.4.t:0 "The Front Collapses: Faustschlag Overruns the East"
 ww1_russia_diplomacy.4.d:0 "The German advance is unstoppable. German columns are rolling across Ukraine, Belarus, and Estonia aboard armored trains. With German vanguards mere days from Petrograd, Lenin's faction demands an emergency vote: accept even more humiliating terms now, or perish under the German jackboot."
 ww1_russia_diplomacy.4.a:0 "Sign the peace at once! We have no army left to fight!"
 ww1_russia_diplomacy.4.b:0 "Fight to the last proletarian! No surrender to the Kaiser!"
 SOV_faustschlag_capitulation_tt:0 "Capitulate to the German demands under fire. Exits the war with the Central Powers."

 ww1_russia_diplomacy.20.t:0 "The Collapse of Brest-Litovsk"
 ww1_russia_diplomacy.20.d:0 "With the collapse and armistice of the German Empire in the West, the draconian Treaty of Brest-Litovsk is officially voided! Soviet authorities in Moscow have declared the treaty null and void, as German garrisons withdraw from Ukraine, Belarus, and the Baltic. A vast power vacuum opens across Eastern Europe, beckoning the Red Army westward."
 ww1_russia_diplomacy.20.a:0 "The imperialist treaty is torn to shreds! Westward ho!"
 ww1_russia_diplomacy.20.b:0 "Our eastern dominion crumbles into dust..."
 ww1_russia_diplomacy.20.c:0 "The German hegemony in the East has evaporated."
 SOV_target_vistula_reclamation_tt:0 "The Treaty of Brest-Litovsk is dissolved! Soviet westward reclamation begins."

 # Soviet & White Diplomacy Decisions
 SOV_soviet_diplomacy:0 "Soviet Foreign Diplomacy"
 SOV_soviet_diplomacy_desc:0 "Diplomatic maneuvers, peace decrees, and revolutionary foreign policy of the Council of People's Commissars."
 SOV_decree_on_peace:0 "Proclaim the Decree on Peace"
 SOV_decree_on_peace_desc:0 "Issue an appeal to all warring nations for an immediate democratic peace without annexations or indemnities, opening direct parleys with Berlin."

 WHT_entente_aid_category:0 "Entente Proxy Assistance"
 WHT_entente_aid_category_desc:0 "Allied diplomatic liaison, material shipments, and military missions supporting the White Armed Forces in their struggle to restore a One and Indivisible Russia."
 WHT_general_knox_british_mission:0 "British Military Mission under General Knox"
 WHT_general_knox_british_mission_desc:0 "General Alfred Knox oversees deliveries of hundreds of thousands of British Lee-Enfield rifles, machine guns, uniforms, and military advisers to equip loyalist armies in Siberia."
 WHT_french_odessa_naval_aid:0 "French Supply Convoys in Odessa"
 WHT_french_odessa_naval_aid_desc:0 "French naval squadrons in the Black Sea discharge munitions, medical stores, and logistics support at the port of Odessa to bolster White forces in the South."
 WHT_vladivostok_allied_lend_lease:0 "Allied Shipments via Vladivostok"
 WHT_vladivostok_allied_lend_lease_desc:0 "American and Japanese vessels discharge heavy industrial machinery, locomotive parts, and small arms across the Pacific into Vladivostok."

 # German Brest-Litovsk Ideas
 GER_brest_litovsk_deliveries:0 "Brest-Litovsk Grain & Resource Deliveries"
 GER_brest_litovsk_deliveries_desc:0 "Massive shipments of Ukrainian grain, manganese, and Russian raw materials flowing westward under the treaty provisions, alleviating the British naval blockade."
 GER_operation_faustschlag:0 "Operation Faustschlag"
 GER_operation_faustschlag_desc:0 "The unstoppable rail-borne offensive surging across the shattered Eastern Front, routing fragmented Bolshevik resistance."
