 ww1_ottoman.1.t:0 "The Requisition of the Ottoman Dreadnoughts"
 ww1_ottoman.1.d:0 "The Admiralty in London has unilaterally seized the battleships Sultan Osman-I Evvel and Reshadieh, paid for by popular subscriptions across our empire! Riots erupt across Constantinople demanding retribution."
 ww1_ottoman.1.a:0 "An unforgivable insult to our people!"
 ww1_ottoman.1.b:0 "Demand full financial indemnification."
 ww1_ottoman.10.t:0 "Arrival of SMS Goeben and Breslau"
 ww1_ottoman.10.d:0 "Having outmaneuvered the British Mediterranean fleet, Admiral Souchon has led SMS Goeben and Breslau past the Dardanelles fortresses. Germany offers to transfer both warships to the Ottoman Navy to replace our stolen dreadnoughts."
 ww1_ottoman.10.a:0 "Raise the Ottoman banner over Yavuz and Midilli!"
 ww1_ottoman.10.b:0 "Intern the ships to preserve our neutrality."
 ww1_ottoman.12.t:0 "The Secret Alliance of August 1914"
 ww1_ottoman.12.d:0 "Grand Vizier Said Halim Pasha and German Ambassador von Wangenheim have signed a mutual defense agreement. Germany pledges full financial subsidies and territorial guarantees against Russian aggression."
 ww1_ottoman.12.a:0 "The fate of the Sublime Porte is sealed with Berlin."
 ww1_ottoman.15.t:0 "The Black Sea Raid"
 ww1_ottoman.15.d:0 "Flying the Ottoman flag, Admiral Souchon has bombarded Russian military installations at Sevastopol, Odessa, and Novorossiysk. Russia has declared war upon the Ottoman Empire!"
 ww1_ottoman.15.a:0 "To arms for the defense of the Fatherland!"
 ww1_ottoman.15.b:0 "A reckless provocative blunder!"
 ww1_ottoman.20.t:0 "Proclamation of the Great Holy War (Cihad-ı Ekber)"
 ww1_ottoman.20.d:0 "The Sultan-Caliph has unfurled the Sacred Standard of the Prophet and issued five imperial fatwas calling upon 300 million Muslims under British, French, and Russian colonial rule to rise in revolt."
 ww1_ottoman.20.a:0 "May victory crown the banner of Islam!"
 ww1_ottoman.25.t:0 "The Victory of the Dardanelles (Canakkale)"
 ww1_ottoman.25.d:0 "After months of ferocious assaults, the Entente fleet and expeditionary corps have failed to breach our batteries. British and ANZAC forces are withdrawing in total defeat from Gallipoli! Mustafa Kemal is hailed as the Savior of the Straits."
 ww1_ottoman.25.a:0 "Canakkale is impassable! (Canakkale Gecilmez!)"
 ww1_ottoman.30.t:0 "The Capitulation of Kut al-Amara"
 ww1_ottoman.30.d:0 "Surrounded and starved on the Tigris, British Major-General Townshend has formally surrendered along with 13,000 British and Indian troops to Halil Kut Pasha. This is Britain's greatest humiliation in the East."
 ww1_ottoman.30.a:0 "The Tigris belongs to the Ottoman Empire!"
 ww1_ottoman.35.t:0 "The Treaty of Brest-Litovsk & Caucasian Restoration"
 ww1_ottoman.35.d:0 "Following the collapse of the Russian Empire, the Soviet government has signed the Treaty of Brest-Litovsk, recognizing Ottoman sovereignty over Kars, Ardahan, and Batum."
 ww1_ottoman.35.a:0 "Our historic eastern lands are redeemed!"
 TUR_second_constitutional_era_politics:0 "Second Constitutional Era Politics"
 TUR_second_constitutional_era_politics_desc:0 "The restoration of the 1876 constitution unleashed intense political debate in Constantinople, where the imperial assembly contests the future direction of the state."
 TUR_cup_vanguard:0 "Vanguard of the Committee of Union and Progress"
 TUR_cup_vanguard_desc:0 "The Committee of Union and Progress (İttihat ve Terakki) consolidates its cadre of officers and intellectuals, determined to enforce cohesion and modernizing reforms across the empire."
 TUR_talat_interior_ministry:0 "Talat Pasha's Ministry of the Interior"
 TUR_talat_interior_ministry_desc:0 "Mehmed Talat Pasha seizes command of the civil administration, placing the telegraph network, postal services, and provincial governorships under central party surveillance."
 TUR_enver_military_drive:0 "Enver Pasha's Military Drive"
 TUR_enver_military_drive_desc:0 "The charismatic hero of the 1908 revolution, Ismail Enver Pasha, accelerates his ascent through the army ranks, demanding unyielding combat readiness and modern officer discipline."
 TUR_cemal_public_order:0 "Cemal Pasha's Public Order Command"
 TUR_cemal_public_order_desc:0 "As military governor of Constantinople, Ahmed Cemal Pasha maintains public order with iron discipline, suppressing subversive conspiracies and securing the capital."
 TUR_bab_i_ali_consolidation:0 "Consolidation of the Bab-ı Âli Coup"
 TUR_bab_i_ali_consolidation_desc:0 "The armed storming of the Sublime Porte cements the unassailable primacy of the CUP military triumvirate, silencing moderate ministers in the name of imperial survival."
 TUR_teskilat_i_mahsusa:0 "The Teşkilât-ı Mahsusa Intelligence Service"
 TUR_teskilat_i_mahsusa_desc:0 "The War Ministry's covert special operations bureau is mobilized to direct asymmetric warfare, frontier sabotage, and counter-insurgency campaigns across vulnerable provinces."
 TUR_centralist_provincial_governors:0 "Centralist Provincial Governors"
 TUR_centralist_provincial_governors_desc:0 "The Sublime Porte replaces feudal notables with loyal party-aligned governors, standardizing taxation and accelerating army mobilization throughout the vilayets."
 TUR_paramilitary_youth_unions:0 "Paramilitary Youth Associations"
 TUR_paramilitary_youth_unions_desc:0 "Civic and gymnastic societies train young citizens in marksmanship, physical endurance, and marching drills, forging an athletic reserve pool for future imperial levies."
 TUR_national_bourgeoisie_creation:0 "Cultivation of a National Bourgeoisie"
 TUR_national_bourgeoisie_creation_desc:0 "Tax exemptions, credit cooperatives, and port licenses are extended to domestic merchants, reducing imperial economic reliance on foreign commercial brokers."
 TUR_secular_law_codes:0 "Modernized Civil Legal Codes"
 TUR_secular_law_codes_desc:0 "Judicial reforms standardize commercial and civil codes, curtailing the extraterritorial reach of European consular courts and unifying imperial jurisprudence."
 TUR_turkification_of_trade:0 "Nationalization of Urban Commerce"
 TUR_turkification_of_trade_desc:0 "Municipal utilities, harbor lighters, and mercantile firms are required to employ imperial citizens and conduct ledgers in the official language of the realm."
 TUR_milli_iktisat_policies:0 "National Economy Policies (Millî İktisat)"
 TUR_milli_iktisat_policies_desc:0 "Guided by the doctrine of Millî İktisat, the state fosters domestic textile factories, boots manufacturing, and tariff shields for Anatolian manufacturing centers."
 TUR_state_controlled_newspapers:0 "Committee Press Oversight"
 TUR_state_controlled_newspapers_desc:0 "Leading broadsheets such as Tanin rally public sentiment in Constantinople, explaining state reforms and uniting imperial subjects against foreign encroachment."
 TUR_sublime_porte_war_council:0 "Sublime Porte Supreme War Council"
 TUR_sublime_porte_war_council_desc:0 "Army, naval, and supply ministries coordinate defense policy through unified daily consultations, ensuring decisive command cohesion during international crises."
 TUR_hurriyet_ve_itilaf_victory:0 "Victory of Freedom and Accord Party"
 TUR_hurriyet_ve_itilaf_victory_desc:0 "The Freedom and Accord Party rallies citizens weary of CUP authoritarianism, promising inter-communal reconciliation, free assembly, and constitutional restraint."
 TUR_prince_sabahaddin_doctrine:0 "Prince Sabahaddin's Reform Doctrine"
 TUR_prince_sabahaddin_doctrine_desc:0 "Prince Sabahaddin's sociological philosophy of administrative decentralization and personal initiative inspires a reformist generation of Ottoman civil servants."
 TUR_provincial_self_governance:0 "Provincial Self-Governance and Autonomy"
 TUR_provincial_self_governance_desc:0 "Elected provincial assemblies receive budgetary powers to fund municipal roads, schools, and clinics, soothing regional grievances against capital centralization."
 TUR_empower_minority_bourgeoisie:0 "Protection for Minority Merchants"
 TUR_empower_minority_bourgeoisie_desc:0 "Property protections and commercial charters are reaffirmed for Christian and Jewish mercantile houses, restoring export liquidity and banking confidence in Smyrna and Istanbul."
 TUR_anglo_french_constitutionalism:0 "Anglo-French Constitutionalism"
 TUR_anglo_french_constitutionalism_desc:0 "The liberal faction seeks to model imperial institutions on British parliamentary monarchy and French civil governance, securing Western capital and diplomatic guarantees."
 TUR_pluralistic_parliament:0 "Pluralistic Imperial Parliament"
 TUR_pluralistic_parliament_desc:0 "The Chamber of Deputies reflects the rich diversity of imperial nationalities, hosting vibrant debates between Turkish, Arab, Armenian, Greek, and Slavic representatives."
 TUR_judicial_and_press_liberties:0 "Judicial and Press Liberties"
 TUR_judicial_and_press_liberties_desc:0 "Independent tribunals safeguard citizens against arbitrary detention, while newspapers in Turkish, Arabic, Greek, and Armenian circulate without political censorship."
 TUR_millet_equality_charter:0 "Charter of Millet Equality"
 TUR_millet_equality_charter_desc:0 "Patriarchal and rabbinical leaders endorse a renewed charter of equal imperial citizenship, preserving communal rights under a unified constitutional canopy."
 TUR_civic_ottomanism_restored:0 "Renaissance of Civic Ottomanism"
 TUR_civic_ottomanism_restored_desc:0 "The ideal of Ottomanism—uniting every subject under a shared civic identity regardless of creed—rekindles imperial devotion from Beirut to the Aegean ports."
 TUR_decentralized_tax_farming_abolition:0 "Abolition of Rural Tax-Farming"
 TUR_decentralized_tax_farming_abolition_desc:0 "The archaic practice of auctioning rural tax-farming rights is abolished, replacing extortionate middlemen with salaried civil assessors."
 TUR_liberal_parliamentary_hegemony:0 "Liberal Parliamentary Hegemony"
 TUR_liberal_parliamentary_hegemony_desc:0 "The constitutional coalition secures a durable parliamentary majority in the Meclis-i Mebusan, consolidating civic stability without resort to military decrees."
 TUR_imperial_prerogative_of_mehmed_v:0 "Mehmed V's Imperial Prerogatives"
 TUR_imperial_prerogative_of_mehmed_v_desc:0 "Sultan Mehmed V Reşâd reasserts the historic prestige of the House of Osman, placing the throne above factional disputes as supreme guardian of the realm."
 TUR_loyal_viziers_cabinet:0 "Palace Council of Loyal Viziers"
 TUR_loyal_viziers_cabinet_desc:0 "Seasoned imperial statesmen and veteran ambassadors are elevated to the Grand Vizierate, restoring traditional prudence to high diplomatic councils."
 TUR_traditional_ulema_alliance:0 "Alliance with the Imperial Ulema"
 TUR_traditional_ulema_alliance_desc:0 "The Sheikh-ul-Islam and judicial scholars of the realm grant their blessing to the sovereign government, anchoring imperial decrees in religious legitimacy."
 TUR_dissolve_fractious_assembly:0 "Dissolution of the Fractious Chamber"
 TUR_dissolve_fractious_assembly_desc:0 "Faced with paralyzing partisan deadlock, the Sultan exercises his imperial right to dissolve the assembly until orderly consultations can be restored."
 TUR_imperial_bodyguard_regiments:0 "Imperial Guards of Dolmabahçe"
 TUR_imperial_bodyguard_regiments_desc:0 "Elite palace battalions loyal to the monarch secure the palaces of the Bosphorus and key crossroads in Istanbul, shielding the sovereign from street putsches."
 TUR_reinforce_the_porte:0 "Reinforce the Sublime Porte"
 TUR_reinforce_the_porte_desc:0 "The civil departments of the Sublime Porte receive emergency authority to administer the imperial provinces with swift, undisputed executive firmness."
 TUR_sultans_decree_prerogatives:0 "Sovereign Imperial Decrees (Ferman)"
 TUR_sultans_decree_prerogatives_desc:0 "The power to issue binding imperial fermans allows urgent defense allocations and treasury orders to take immediate legal effect across all vilayets."
 TUR_court_appointed_valis:0 "Court-Appointed Provincial Governors"
 TUR_court_appointed_valis_desc:0 "Distinguished imperial courtiers are sent to govern Damascus, Baghdad, Smyrna, and Tripoli, commanding respect and maintaining communal stability."
 TUR_divan_council_restored:0 "Restoration of the Imperial Divan"
 TUR_divan_council_restored_desc:0 "The historic council of imperial viziers convenes within the historic chambers of Topkapı, deliberating grand strategy for the defense of the realm."
 TUR_absolute_caliphal_authority:0 "Supreme Caliphal Authority"
 TUR_absolute_caliphal_authority_desc:0 "The sacred spiritual authority of the Ottoman Caliphate reaches its peak, commanding the unswerving fidelity of millions across continents in defense of the realm."
 TUR_arab_congress_dialogue:0 "Dialogue with the Arab Congress"
 TUR_arab_congress_dialogue_desc:0 "The Sublime Porte opens constructive discussions with delegates of the 1913 Arab Congress, addressing regional governance and language rights in the Levant."
 TUR_beirut_and_damascus_charters:0 "Charters of Beirut and Damascus"
 TUR_beirut_and_damascus_charters_desc:0 "Municipal charters recognize the prominence of Syrian and Lebanese notable dynasties, granting regional courts and commerce enhanced local discretion."
 TUR_dual_monarchy_protocol:0 "Turco-Arab Imperial Commonwealth Accord"
 TUR_dual_monarchy_protocol_desc:0 "An ambitious constitutional compact elevates Arab provinces into equal co-rulers of the imperial crown, mirroring the Austro-Hungarian dual monarchy."
 TUR_guaranteed_arab_cabinet_seats:0 "Guaranteed Arab Ministerial Portfolios"
 TUR_guaranteed_arab_cabinet_seats_desc:0 "Strategic ministerial portfolios, including Justice, Commerce, and Education, are reserved for distinguished Arab statesmen in Constantinople."
 TUR_loyal_tribal_federation:0 "Federation of Loyal Bedouin Tribes"
 TUR_loyal_tribal_federation_desc:0 "Subsidies in gold coin, Mauser carbines, and prestigious titles secure the active loyalty of Bedouin chieftains throughout the Syrian and Sinai deserts."
 TUR_caliphate_and_arab_solidarity:0 "Caliphal Arab Solidarity Protocol"
 TUR_caliphate_and_arab_solidarity_desc:0 "Shared spiritual heritage cements fraternal bonds between Turkish infantry and Arab auxiliaries against Western intrusions into Mesopotamia and the Levant."
 TUR_bilingual_imperial_administration:0 "Bilingual Ottoman-Arabic Administration"
 TUR_bilingual_imperial_administration_desc:0 "Arabic and Ottoman Turkish are designated co-official languages in regional courts, administrative bureaus, and secondary academies across the Levant."
 TUR_sharifian_protectorate_accord:0 "Sharifian Custodianship Accord"
 TUR_sharifian_protectorate_accord_desc:0 "The Sublime Porte confirms Sharif Hussein's traditional prerogatives over the Hejaz holy precincts in return for solemn pledges of wartime military loyalty."
 TUR_mesopotamian_notables_council:0 "Council of Mesopotamian Notables"
 TUR_mesopotamian_notables_council_desc:0 "Tribal sheikhs and mercantile patriarchs of Baghdad and Basra form a consultative assembly to direct river transport and marshland defenses."
 TUR_syrian_economic_integration:0 "Syrian Economic Integration"
 TUR_syrian_economic_integration_desc:0 "Standardized customs tariffs and telegraph links bind the productive wealth of Bilad al-Sham into the greater imperial market of Istanbul."
 TUR_pan_islamic_imperial_brotherhood:0 "Pan-Islamic Imperial Brotherhood"
 TUR_pan_islamic_imperial_brotherhood_desc:0 "The realm rallies around shared spiritual fraternity, transforming ethnic variety into an impregnable defensive rampart against external partition."
 TUR_shrine_of_eyup_pilgrimage:0 "Imperial Pilgrimage to Eyüp Sultan Shrine"
 TUR_shrine_of_eyup_pilgrimage_desc:0 "The sacred investiture with the Sword of Osman at Eyüp Mosque invokes heavenly protection and warrior resolve across every army corps."
 TUR_mobilize_sufi_brotherhoods:0 "Mobilization of Sufi Tariqas"
 TUR_mobilize_sufi_brotherhoods_desc:0 "Mevlevi and Bektashi dervish brotherhoods summon disciplined volunteers to man field ambulances and rear-echelon medical regiments."
 TUR_holy_cities_custodianship:0 "Custodianship of the Two Holy Mosques"
 TUR_holy_cities_custodianship_desc:0 "The historic duty to defend Mecca and Medina against hostile encirclement is proclaimed as the sacred, non-negotiable pledge of the state."
 TUR_proclamation_of_jihad_readiness:0 "Readiness for the Sacred Jihad Proclamation"
 TUR_proclamation_of_jihad_readiness_desc:0 "The Sheikh-ul-Islam drafts the solemn fatwa summoning millions under British, French, and Russian colonial rule to rise in holy rebellion."
 TUR_imperial_cohesion_ascendant:0 "Imperial Cohesion Ascendant"
 TUR_imperial_cohesion_ascendant_desc:0 "Restored institutional harmony and unwavering popular morale ensure that the Ottoman realm stands ready to defy external catastrophe."
 TUR_legacy_of_osman_eternal:0 "The Eternal Legacy of Osman"
 TUR_legacy_of_osman_eternal_desc:0 "Six centuries of martial triumph, architectural majesty, and statecraft culminate in a rejuvenated empire, master of its own sovereign destiny."
 TUR_economic_sovereignty_drive:0 "Economic Sovereignty Drive"
 TUR_economic_sovereignty_drive_desc:0 "The Sublime Porte initiates a concerted campaign to liberate imperial finances from the stifling tutelage of European bondholders."
 TUR_audit_opda_administration:0 "Audit OPDA Administration"
 TUR_audit_opda_administration_desc:0 "Imperial inspectors enter the headquarters of the Ottoman Public Debt Administration (OPDA), auditing revenue ledgers and contesting exorbitant deductions."
 TUR_renegotiate_creditor_coupons:0 "Renegotiate Creditor Coupons"
 TUR_renegotiate_creditor_coupons_desc:0 "Ottoman envoys in Paris and London renegotiate bond redemption dates and coupon interest, easing immediate pressure on imperial cash reserves."
 TUR_unilateral_abrogation_of_capitulations:0 "Unilateral Abrogation of Capitulations"
 TUR_unilateral_abrogation_of_capitulations_desc:0 "A historic imperial decree extinguishes all extraterritorial privileges, tax immunities, and consular judicial shelters enjoyed by European nationals."
 TUR_protective_tariff_code:0 "Protective Customs Tariff Code"
 TUR_protective_tariff_code_desc:0 "For the first time in a century, the Porte enacts protective customs duties up to 30% on foreign manufactured goods, shielding domestic factories."
 TUR_national_bank_osmanli_itibar:0 "Founding of Osmanlı İtibar-ı Millî Bankası"
 TUR_national_bank_osmanli_itibar_desc:0 "The founding of the Imperial National Credit Bank breaks the monopoly of Anglo-French financiers, issuing state-backed capital to Ottoman enterprises."
 TUR_confiscate_foreign_monopolies:0 "Confiscate Foreign Monopolies"
 TUR_confiscate_foreign_monopolies_desc:0 "Harbor quays, tramlines, and gaslight utilities operated by foreign concessions are reclaimed under direct Ottoman municipal management."
 TUR_monetary_autonomy_and_gold_lira:0 "Monetary Autonomy and Gold Lira"
 TUR_monetary_autonomy_and_gold_lira_desc:0 "The printing of paper notes passes to direct treasury authority, backed by solid reserves of bullion deposited within the imperial vaults."
 TUR_tobacco_regie_liquidation:0 "Liquidation of the Tobacco Régie"
 TUR_tobacco_regie_liquidation_desc:0 "The hated concession of the French-dominated Tobacco Régie is liquidated, granting Anatolian leaf growers freedom to sell directly to imperial markets."
 TUR_salt_monopoly_nationalization:0 "Nationalization of the Salt Monopoly"
 TUR_salt_monopoly_nationalization_desc:0 "The vast salt pans of Lake Tuz and the Aegean shores are placed under state trusteeship, directing vital revenues straight to imperial defense funds."
 TUR_complete_fiscal_liberation:0 "Complete Fiscal Liberation"
 TUR_complete_fiscal_liberation_desc:0 "With public debt consolidated and capitulatory shackles broken, the Sublime Porte achieves genuine fiscal independence before the world."
 TUR_taurus_and_amanus_tunnels:0 "Taurus and Amanus Mountain Tunnels"
 TUR_taurus_and_amanus_tunnels_desc:0 "German and Ottoman engineers blast essential rail tunnels through the rugged Taurus and Amanus peaks, closing the last physical gaps in the southern trunk."
 TUR_konya_aleppo_trunk_line:0 "Konya–Aleppo Trunk Line"
 TUR_konya_aleppo_trunk_line_desc:0 "Direct broad-gauge rails link central Anatolia with the Syrian trade metropolis of Aleppo, permitting continuous transit for military supply trains."
 TUR_aleppo_to_mosul_extension:0 "Aleppo–Mosul Rail Extension"
 TUR_aleppo_to_mosul_extension_desc:0 "Railway gangs push steel tracks across Upper Mesopotamia toward Nusaybin and Mosul, dramatically accelerating reinforcement of the eastern frontier."
 TUR_mosul_baghdad_railhead:0 "Mosul–Baghdad Railhead"
 TUR_mosul_baghdad_railhead_desc:0 "The rail line reaches Baghdad, cementing an unassailable supply artery that secures the Tigris basin against foreign amphibious inroads."
 TUR_basra_terminus_settlement:0 "Basra Rail Terminus Port"
 TUR_basra_terminus_settlement_desc:0 "Modernized quays and marshalling yards link the railroad to the Persian Gulf, providing an outlet for Mesopotamian dates and grain shipments."
 TUR_hejaz_railway_expansion:0 "Hejaz Railway Strategic Expansion"
 TUR_hejaz_railway_expansion_desc:0 "The famed pilgrim railway receives expanded desert sidings, water-condensing locomotives, and reinforced stations from Damascus to Medina."
 TUR_syrian_feeder_lines:0 "Syrian Railway Feeder Lines"
 TUR_syrian_feeder_lines_desc:0 "Feeder branches connect Rayak, Homs, Tripoli, and Beirut, weaving an integrated transport network between Mediterranean docks and interior garrisons."
 TUR_medina_to_mecca_link:0 "Medina–Mecca Railway Link"
 TUR_medina_to_mecca_link_desc:0 "Surveyors lay trackbeds to extend the sacred line south to Mecca, fulfilling a historic ambition to link both holy sanctuaries by steam power."
 TUR_jerusalem_jaffa_railway_upgrade:0 "Jaffa–Jerusalem Railway Upgrade"
 TUR_jerusalem_jaffa_railway_upgrade_desc:0 "Gauge conversion and powerful mountain locomotives double transit capacity across the Judean hills, securing the approaches to the holy shrines."
 TUR_anatolian_railway_loop:0 "Central Anatolian Railway Loop"
 TUR_anatolian_railway_loop_desc:0 "Linking Ankara, Eskişehir, Afyon, and Konya into a continuous loop prevents logistical bottlenecks during peak army mobilization."
 TUR_railway_telegraph_integration:0 "Railway Telegraphic Integration"
 TUR_railway_telegraph_integration_desc:0 "Dedicated copper telegraph wires parallel every railway embankment, granting the general staff minute-by-minute control over rolling stock movements."
 TUR_zonguldak_coal_basin_drives:0 "Zonguldak Coal Mining Drive"
 TUR_zonguldak_coal_basin_drives_desc:0 "Heavy steam hoists and ventilation shafts double anthracite extraction along the Black Sea coast, fueling naval boilers and railway fireboxes."
 TUR_ergani_copper_mines:0 "Ergani Copper Mining Works"
 TUR_ergani_copper_mines_desc:0 "Rich copper lodes in the mountains near Diyarbakır provide the imperial arsenals with essential raw material for cartridge casings and telegraph wires."
 TUR_tophane_ordnance_foundry:0 "Tophane Imperial Ordnance Foundry"
 TUR_tophane_ordnance_foundry_desc:0 "The historic ordnance works along the Bosphorus receive modern tempering forges, manufacturing quick-fire field artillery barrels and siege mounts."
 TUR_bakirkoy_textile_mills:0 "Bakırköy State Textile Mills"
 TUR_bakirkoy_textile_mills_desc:0 "Steam looms turn domestic wool and cotton into durable uniform serge, greatcoats, and canvas field tents for the expanding armed forces."
 TUR_zeytinburnu_munitions_complex:0 "Zeytinburnu Munitions Complex"
 TUR_zeytinburnu_munitions_complex_desc:0 "Precision presses along the Marmara coast operate day and night, turning out millions of Mauser rifle rounds and artillery propellant primers."
 TUR_ankara_state_foundries:0 "Ankara State Metal Foundries"
 TUR_ankara_state_foundries_desc:0 "Inland metallurgical workshops in Ankara cast entrenching tools, horseshoes, and trench grenades far beyond the range of enemy naval bombardment."
 TUR_izmir_commercial_quays:0 "Expansion of Smyrna Docks"
 TUR_izmir_commercial_quays_desc:0 "Hydraulic cranes and deep-water berths in Smyrna harbor accelerate the export of raisins, figs, and Anatolian minerals to friendly ports."
 TUR_constantinople_electric_grid:0 "Constantinople Electrical Grid"
 TUR_constantinople_electric_grid_desc:0 "The landmark Silahtarağa power plant energizes the imperial capital, supplying steady electric current to military workshops and communication nodes."
 TUR_amasya_metal_smelters:0 "Amasya and Sivas Metal Works"
 TUR_amasya_metal_smelters_desc:0 "Inland foundries process ore from the Pontic mountains, fabricating structural iron beams and replacement rails for regional lines."
 TUR_imperial_munitions_directorate:0 "Imperial Munitions Directorate"
 TUR_imperial_munitions_directorate_desc:0 "A centralized ordnance council streamlines powder production and oversees rigorous quality inspections across all state armories."
 TUR_full_industrial_mobilization:0 "Full Wartime Industrial Mobilization"
 TUR_full_industrial_mobilization_desc:0 "Private smithies, locomotive repair sheds, and mechanical shops across the empire are mobilized under state contracts for urgent shell production."
 TUR_anatolian_grain_reserves:0 "Anatolian Strategic Grain Reserves"
 TUR_anatolian_grain_reserves_desc:0 "Preemptive purchases of wheat and barley fill state granaries across the central plateau, shielding metropolitan centers from wartime famine."
 TUR_willcocks_mesopotamia_irrigation:0 "Willcocks Mesopotamia Irrigation Works"
 TUR_willcocks_mesopotamia_irrigation_desc:0 "The Hindiyya barrage across the Euphrates and restored silt canals revive Mesopotamian agricultural fertility, feeding the armies of the east."
 TUR_cilicia_cotton_modernization:0 "Cilician Cotton Modernization"
 TUR_cilicia_cotton_modernization_desc:0 "The Çukurova plain receives modern hydraulic gins and drainage ditches, dramatically multiplying output of imperial long-staple cotton."
 TUR_anti_locust_campaigns:0 "Anti-Locust Campaign Brigadas"
 TUR_anti_locust_campaigns_desc:0 "Soldiers and agricultural leagues deploy zinc barriers and trench sprayers to eliminate locust swarms before they devastate Levant wheat fields."
 TUR_state_silos_and_famine_relief:0 "State Silos and Famine Relief"
 TUR_state_silos_and_famine_relief_desc:0 "Municipal grain reserves in Beirut, Aleppo, and Jerusalem distribute subsidized flour to families, maintaining social tranquility."
 TUR_ziraat_bankasi_credit_expansion:0 "Ziraat Bankası Agricultural Credit"
 TUR_ziraat_bankasi_credit_expansion_desc:0 "The Imperial Agricultural Bank expands low-interest loans to peasant farmers, financing high-yield seeds and iron draft equipment."
 TUR_mechanized_anatolian_farming:0 "Mechanized Anatolian Farming"
 TUR_mechanized_anatolian_farming_desc:0 "Steam tractors and mechanical threshers work the open Anatolian steppe, maintaining crop acreage despite the mobilization of farm hands."
 TUR_black_sea_timber_concessions:0 "Black Sea Timber Harvesting"
 TUR_black_sea_timber_concessions_desc:0 "Foresters in the lush Pontic mountains cut durable oak and pine timbers for trench duckboards, bunker pit-props, and railway sleepers."
 TUR_agrarian_surplus_storage:0 "Imperial Agrarian Surplus Depots"
 TUR_agrarian_surplus_storage_desc:0 "Well-ventilated storehouses alongside railway junctions safeguard millions of bushels of surplus grain against decay and hostile raids."
 TUR_breadbasket_of_the_empire:0 "Breadbasket of the Empire"
 TUR_breadbasket_of_the_empire_desc:0 "Coordinated cultivation across Anatolia and the Levant guarantees that the Ottoman Empire cannot be starved out by naval blockade."
 TUR_integrated_imperial_economy:0 "Integrated Imperial Economy"
 TUR_integrated_imperial_economy_desc:0 "Pontic coal, Cilician cotton, Anatolian iron, and Syrian flour circulate smoothly throughout a thriving, unified internal market."
 TUR_anatolian_highway_system:0 "Anatolian Road Network Expansion"
 TUR_anatolian_highway_system_desc:0 "Crushed-stone arterial roads connect isolated rural valleys to trunk railheads, expediting the collection of farm produce and recruits."
 TUR_petroleum_concessions_mosul:0 "Mosul Petroleum Survey & Concessions"
 TUR_petroleum_concessions_mosul_desc:0 "Imperial geologists map the prolific oil seepages around Kirkuk and Mosul, securing sovereign control over the empire's vast petroleum future."
 TUR_sublime_porte_heavy_industry_board:0 "Sublime Porte Heavy Industry Board"
 TUR_sublime_porte_heavy_industry_board_desc:0 "Industrialists and military engineers coordinate the expansion of steel mills capable of turning out heavy armor plate and artillery forgings."
 TUR_autarkic_imperial_foundation:0 "Autarkic Imperial Foundations"
 TUR_autarkic_imperial_foundation_desc:0 "The realm attains self-sufficiency in fundamental strategic materials, rendering imperial soil resilient against external embargoes."
 TUR_modern_ottoman_economic_miracle:0 "Modern Ottoman Economic Miracle"
 TUR_modern_ottoman_economic_miracle_desc:0 "The transformation from indebted debtor into an autonomous industrial power proves the inexhaustible vigor of the Ottoman realm."
 TUR_reorganizing_the_imperial_army:0 "Reorganizing the Imperial Ottoman Army"
 TUR_reorganizing_the_imperial_army_desc:0 "The bitter defeats of the Balkan Wars compel a root-and-branch restructuring of the imperial army, disbanding hollow divisions and restoring combat vigor."
 TUR_harbiye_academy_modernization:0 "Modernization of the Harbiye War Academy"
 TUR_harbiye_academy_modernization_desc:0 "The premier officer academy at Pangaltı institutes rigorous curricula in ballistics, combined-arms tactics, and modern staff work inspired by leading European militaries."
 TUR_purge_inefficient_cadres:0 "Retirement of Incompetent Senior Cadres"
 TUR_purge_inefficient_cadres_desc:0 "Hundreds of elderly, ceremonial pashas are pensioned off by the War Ministry, clearing command pathways for dynamic, literate, and combat-tested junior officers."
 TUR_standardize_mauser_rifles:0 "Standardization of Mauser Rifles"
 TUR_standardize_mauser_rifles_desc:0 "Frontline infantry corps are systematically re-equipped with modern Mauser rifles and carbines, standardizing ammunition supplies and improving squad marksmanship."
 TUR_krupp_quick_fire_artillery:0 "Krupp Quick-Firing Field Artillery"
 TUR_krupp_quick_fire_artillery_desc:0 "Field artillery regiments receive Krupp 75mm and 105mm quick-firing guns with hydraulic recoil mechanisms, delivering superior suppressive barrages."
 TUR_anatolian_infantry_doctrine:0 "Anatolian Infantry Doctrine"
 TUR_anatolian_infantry_doctrine_desc:0 "Imperial tactical doctrine capitalizes on the extraordinary endurance and stoic resolve of Anatolian recruits, trained for grueling forced marches and entrenched defense."
 TUR_desert_camel_corps_regiments:0 "Desert Camel Corps (Hejan) Regiments"
 TUR_desert_camel_corps_regiments_desc:0 "Swift camel-mounted cavalry battalions traverse the arid expanses of the Sinai and Syrian deserts, executing long-range scouting and lightning raids against hostile flanks."
 TUR_caucasus_alpine_detachments:0 "Caucasian Alpine Detachments"
 TUR_caucasus_alpine_detachments_desc:0 "Specialized mountain troops are equipped with winter kits, climbing gear, and snow drills to secure high-altitude passes across the freezing ranges of eastern Anatolia."
 TUR_machine_gun_companies:0 "Divisional Machine Gun Companies"
 TUR_machine_gun_companies_desc:0 "Dedicated machine-gun companies armed with Maxim and Schwarzlose heavy guns are attached to frontline infantry battalions, creating murderous interlocking fields of fire."
 TUR_field_medicine_red_crescent:0 "Red Crescent Field Medical Services"
 TUR_field_medicine_red_crescent_desc:0 "The Ottoman Red Crescent (Hilal-i Ahmer) establishes field dressing stations and hospital trains, combating epidemics and saving thousands of wounded soldiers."
 TUR_gendarmerie_modernization_corps:0 "Imperial Gendarmerie Modernization"
 TUR_gendarmerie_modernization_corps_desc:0 "The imperial gendarmerie is equipped with modern rifles and mounted patrols to secure vital railway corridors, suppress brigandage, and maintain rear-area safety."
 TUR_heavy_siege_howitzers:0 "Heavy Siege Howitzer Batteries"
 TUR_heavy_siege_howitzers_desc:0 "Acquisition of heavy Krupp and Skoda howitzers provides the imperial army with formidable siege firepower capable of pounding enemy fortresses into dust."
 TUR_comprehensive_conscription_law:0 "Comprehensive Military Conscription Act of 1914"
 TUR_comprehensive_conscription_law_desc:0 "Sweeping conscription legislation rationalizes the military classes into active Nizamiye, reserve Redif, and home-guard Mustahfiz units, mobilizing full national manpower."
 TUR_foreign_mission_choice:0 "Selection of the Foreign Military Mission"
 TUR_foreign_mission_choice_desc:0 "The War Council deliberates whether to entrust grand tactical reform to seasoned Prussian advisors or champion native Ottoman commanders steeped in regional warfare."
 TUR_german_military_mission_sanders:0 "German Military Mission under Liman von Sanders"
 TUR_german_military_mission_sanders_desc:0 "General Otto Liman von Sanders and a corps of Prussian staff officers take charge of training, doctrinal manuals, and field inspection across the imperial corps."
 TUR_native_general_staff_kemal:0 "Autonomous Staff under Native Officers"
 TUR_native_general_staff_kemal_desc:0 "Promising native commanders, such as Mustafa Kemal Bey and Fevzi Pasha, direct tactical planning, tailoring doctrines to Anatolia's harsh terrain and local conditions."
 TUR_prusso_ottoman_doctrine:0 "Prusso-Ottoman Tactical Doctrine"
 TUR_prusso_ottoman_doctrine_desc:0 "The combination of Prussian operational precision with the stoic courage of Ottoman ranks produces a formidable force capable of resisting superior enemy numbers."
 TUR_independent_tactical_flexibility:0 "Independent Tactical Flexibility"
 TUR_independent_tactical_flexibility_desc:0 "Regimental and battalion commanders are granted tactical initiative on the battlefield, outmaneuvering rigid foreign battle plans with swift local counter-blows."
 TUR_krupp_heavy_ordnance_contracts:0 "Krupp Heavy Ordnance Deliveries"
 TUR_krupp_heavy_ordnance_contracts_desc:0 "Direct rail transports from Essen deliver heavy fortress cannons, armor-piercing shells, and spare gun barrels to fortify Çanakkale and Edirne."
 TUR_anatolian_guerrilla_tradition:0 "Anatolian Irregular Warfare Heritage"
 TUR_anatolian_guerrilla_tradition_desc:0 "Hard-won irregular warfare techniques of Anatolian bands are incorporated into regular training, mastering nighttime raids and deadly mountain ambushes."
 TUR_joint_staff_operational_drills:0 "Combined Staff Operational Maneuvers"
 TUR_joint_staff_operational_drills_desc:0 "Large-scale war games across Thrace and western Anatolia test seamless synchronization between infantry battalions, cavalry recon, and field batteries."
 TUR_officer_corps_intellectual_vigor:0 "Intellectual Rigor of the Officer Corps"
 TUR_officer_corps_intellectual_vigor_desc:0 "Military journals, translated tactical works, and tactical discussion clubs elevate the professional sophistication and strategic vision of young staff officers."
 TUR_divisional_artillery_batteries:0 "Integrated Divisional Artillery Batteries"
 TUR_divisional_artillery_batteries_desc:0 "Every front-line division receives organic artillery support regiments, eliminating dangerous command delays during crucial infantry assaults."
 TUR_corps_level_reserves_doctrine:0 "Corps-Level Mobile Reserve Doctrine"
 TUR_corps_level_reserves_doctrine_desc:0 "Concentrated reserves held immediately behind active battle lines are trained to deliver sudden counter-attacks before enemy beachheads or breakthroughs can solidify."
 TUR_rebuild_the_imperial_fleet:0 "Rebuilding the Imperial Ottoman Fleet"
 TUR_rebuild_the_imperial_fleet_desc:0 "The Imperial Ottoman Navy launches an emergency reconstruction program to safeguard imperial sea lanes and defend thousands of miles of coastline."
 TUR_the_dreadnought_contracts_uk:0 "British Dreadnought Contracts"
 TUR_the_dreadnought_contracts_uk_desc:0 "Major contracts placed with British shipyards construct the formidable dreadnoughts Sultan Osman-ı Evvel and Reşadiye to overcome Greek naval superiority."
 TUR_golden_horn_shipyards_expansion:0 "Golden Horn Naval Docks Expansion"
 TUR_golden_horn_shipyards_expansion_desc:0 "The historic naval arsenals along the Golden Horn are upgraded with modernized drydocks and steam cranes for rapid hull overhauls and machinery refits."
 TUR_public_donation_drive_sultan_osman:0 "National Donation Drive for the Fleet"
 TUR_public_donation_drive_sultan_osman_desc:0 "Citizens from across the empire, from Anatolian peasants to merchants, donate coins and jewels to the Navy Society to fund the purchase of modern warships."
 TUR_torpedo_boat_flotillas:0 "Coastal Torpedo Boat Flotillas"
 TUR_torpedo_boat_flotillas_desc:0 "Nimble torpedo craft and coastal destroyers patrol tight narrows and archipelagoes, ready to unleash lethal torpedo spreads against hostile capital ships."
 TUR_welcome_goeben_and_breslau:0 "Reception of the Goeben and Breslau"
 TUR_welcome_goeben_and_breslau_desc:0 "The German battlecruiser Goeben and light cruiser Breslau evade British pursuit, entering the Straits to be transferred into the Ottoman Navy as Yavuz and Midilli."
 TUR_black_sea_submarine_patrols:0 "Black Sea Submarine Patrols"
 TUR_black_sea_submarine_patrols_desc:0 "Submersible craft based in Constantinople conduct stealth patrols against the Russian Black Sea Fleet, shielding essential Pontic coal shipping lines."
 TUR_coastal_minelayer_force:0 "Coastal Minelaying Flotilla and the Nusret"
 TUR_coastal_minelayer_force_desc:0 "The minelayer Nusret and auxiliary craft deposit stealthy underwater minefields along Erenköy Bay, setting a catastrophic trap for invading fleets."
 TUR_naval_gunnery_schools:0 "Naval Gunnery and Rangefinding Academies"
 TUR_naval_gunnery_schools_desc:0 "Naval cadets and gunners master optical rangefinding and rapid salvo calibration at Heybeliada Island, vastly improving main-battery accuracy."
 TUR_cruiser_escort_squadrons:0 "Cruiser Escort and Patrol Squadrons"
 TUR_cruiser_escort_squadrons_desc:0 "Protected cruisers Hamidiye and Mecidiye execute long-range raiding missions and escort troop transports across the eastern Mediterranean."
 TUR_sovereign_black_sea_fleet:0 "Sovereignty of the Black Sea Squadron"
 TUR_sovereign_black_sea_fleet_desc:0 "The imperial squadron establishes dominant presence across northern coastal waters, securing vital coal deliveries and shelling hostile ports."
 TUR_yesilkoy_aviation_school:0 "Yeşilköy Aviation School and Air Flotilla"
 TUR_yesilkoy_aviation_school_desc:0 "The imperial airfield at San Stefano trains pioneer pilots in reconnaissance and combat maneuvers, establishing Ottoman military aviation."
 TUR_strengthen_canakkale_batteries:0 "Strengthening the Çanakkale Strait Batteries"
 TUR_strengthen_canakkale_batteries_desc:0 "Coastal fortresses at Kilitbahir and Çimenlik are reinforced with heavy Krupp coastal cannons and thick masonry, turning the Dardanelles into a fortress."
 TUR_procure_bleriot_and_rumpler_monoplanes:0 "Procurement of Blériot and Rumpler Aircraft"
 TUR_procure_bleriot_and_rumpler_monoplanes_desc:0 "Acquisition of reliable reconnaissance monoplanes enables observers to pinpoint hostile warship anchorages and spot artillery fire over the straits."
 TUR_underwater_minefields_straits:0 "Submerged Straits Minefield Belts"
 TUR_underwater_minefields_straits_desc:0 "Ten dense belts of submerged moored mines are anchored across the narrowest waters of the Dardanelles, protected by rapid-fire shoreline batteries."
 TUR_aerial_reconnaissance_detachments:0 "Aerial Reconnaissance Detachments"
 TUR_aerial_reconnaissance_detachments_desc:0 "Aerial spotters photograph enemy landing beaches and trench networks, delivering invaluable advance warning directly to army commanders."
 TUR_searchlight_batteries_dardanelles:0 "Dardanelles Powerful Searchlight Batteries"
 TUR_searchlight_batteries_dardanelles_desc:0 "High-powered carbon-arc searchlights sweep the waters nightly, denying enemy minesweepers dark cover and illuminating targets for coastal artillery."
 TUR_joint_command_supreme_staff:0 "Unified Supreme General Staff (Erkân-ı Harbiye)"
 TUR_joint_command_supreme_staff_desc:0 "Land, naval, and logistics operations are centralized under the Supreme General Staff, coordinating simultaneous campaigns across three continents."
 TUR_modern_field_communications:0 "Field Telephony and Wireless Communications"
 TUR_modern_field_communications_desc:0 "Armored buried field telephone cables and Telefunken wireless sets connect army corps commanders directly with frontline observation posts."
 TUR_logistics_motor_truck_corps:0 "Motorized Supply Truck Detachments"
 TUR_logistics_motor_truck_corps_desc:0 "Fleets of imported Daimler motor lorries augment pack animals, rushing artillery shells and medical provisions along rugged road corridors."
 TUR_imperial_arsenals_peak_output:0 "Peak Production of the Imperial Arsenals"
 TUR_imperial_arsenals_peak_output_desc:0 "The historic armories of Tophane and Zeytinburnu operate around the clock, producing millions of small-arms cartridges and repairing damaged weapons."
 TUR_harbiye_tactical_doctrine_zenith:0 "Zenith of Harbiye Tactical Mastery"
 TUR_harbiye_tactical_doctrine_zenith_desc:0 "The graduates of Harbiye demonstrate operational excellence against world empires, mastering deep trench defence and devastating counter-strokes."
 TUR_invincible_mehmetcik_spirit:0 "The Indomitable Spirit of Mehmetçik"
 TUR_invincible_mehmetcik_spirit_desc:0 "The imperial soldier—the Mehmetçik—becomes an immortal legend of steadfast resolve, standing firm beneath cataclysmic bombardments in defense of homeland and faith."
 TUR_sublime_porte_foreign_policy:0 "Sublime Porte Foreign Policy"
 TUR_sublime_porte_foreign_policy_desc:0 "Surrounded by predatory great power rivalries, the Foreign Ministry at the Sublime Porte navigates between conflicting alliances to preserve imperial sovereignty."
 TUR_western_thrace_border_vigilance:0 "Western Thrace Frontier Vigilance"
 TUR_western_thrace_border_vigilance_desc:0 "Watchposts and mobile cavalry patrols along the Maritsa River guard against any surprise offensive threatening the western approaches to Istanbul."
 TUR_edirne_fortress_complex:0 "Edirne Fortress Complex"
 TUR_edirne_fortress_complex_desc:0 "The historic bastion of Edirne is strengthened with reinforced concrete casemates and heavy artillery, forming an unyielding bastion protecting eastern Thrace."
 TUR_bulgarian_friendship_treaty:0 "Bulgarian Friendship and Border Accord"
 TUR_bulgarian_friendship_treaty_desc:0 "A negotiated border rectification along the Maritsa River secures Bulgarian goodwill and guarantees unhindered rail transit through Sofia to Central Europe."
 TUR_romanian_grain_accord:0 "Romanian Grain Import Accord"
 TUR_romanian_grain_accord_desc:0 "A trade agreement with Bucharest guarantees steady shipments of Danubian grain via the Black Sea, keeping capital flour mills fully supplied."
 TUR_reaffirm_libyan_sovereignty:0 "Reaffirmation of Libyan Sovereignty"
 TUR_reaffirm_libyan_sovereignty_desc:0 "Drawing on the heroic resistance organized by young officers in Cyrenaica, the Sublime Porte refuses to abandon its legal sovereignty over North Africa."
 TUR_sanusi_brotherhood_pact:0 "Alliance with the Senussi Order"
 TUR_sanusi_brotherhood_pact_desc:0 "Sayyid Ahmad ash-Sharif and the Senussi order receive gold subsidies, Mauser rifles, and mountain guns to tie down colonial garrisons across the Libyan Sahara."
 TUR_tripoli_coastal_fortifications:0 "Tripolitanian Coastal Defense Network"
 TUR_tripoli_coastal_fortifications_desc:0 "Camouflaged shoreline redoubts and desert listening posts harass hostile maritime patrols and protect inner Sahara caravan routes."
 TUR_aegean_island_garrisons:0 "Aegean and Dodecanese Island Garrisons"
 TUR_aegean_island_garrisons_desc:0 "Territorial infantry and light artillery reinforce Anatolian coastal islands, securing vital sea approaches to Smyrna, Bodrum, and Antalya."
 TUR_german_rapprochement:0 "German Strategic Rapprochement"
 TUR_german_rapprochement_desc:0 "Ambassador von Wangenheim and Kaiser Wilhelm II view the Ottoman Empire as a vital continental partner, offering generous industrial and military ties."
 TUR_secret_alliance_august_1914:0 "Secret Ottoman-German Treaty of August 1914"
 TUR_secret_alliance_august_1914_desc:0 "The secret pact concluded at Yeniköy commits Berlin and the Porte to mutual defense against Russian aggression, uniting the destinies of both empires."
 TUR_german_gold_loans:0 "Reichsbank Gold Shipments"
 TUR_german_gold_loans_desc:0 "Millions in gold bullion are secretly conveyed from Berlin to the Imperial Ottoman Treasury, providing crucial liquidity for wartime state purchases."
 TUR_souchon_black_sea_raid:0 "Admiral Souchon's Black Sea Raid"
 TUR_souchon_black_sea_raid_desc:0 "Under Admiral Wilhelm Souchon, the Ottoman fleet raids Sevastopol, Odessa, and Novorossiysk, irrevocably plunging the empire into the World War."
 TUR_join_central_powers_faction:0 "Formally Join the Central Powers"
 TUR_join_central_powers_faction_desc:0 "The Sublime Porte officially enters the Central Powers alliance alongside Germany and Austria-Hungary to dismantle Entente imperial dominion."
 TUR_berlin_constantinople_axis:0 "The Berlin-Constantinople Axis"
 TUR_berlin_constantinople_axis_desc:0 "Direct rail links and encrypted telegraph lines create an unbroken continental axis from Berlin to Istanbul, facilitating continuous military aid."
 TUR_austro_hungarian_danubian_link:0 "Danubian Link with Austria-Hungary"
 TUR_austro_hungarian_danubian_link_desc:0 "Danubian river convoys connect Vienna and Budapest directly to the Black Sea, shipping heavy siege howitzers and skilled artillerymen to the Ottoman front."
 TUR_bulgarian_transit_corridor:0 "Bulgarian Rail Transit Corridor"
 TUR_bulgarian_transit_corridor_desc:0 "Bulgaria's alliance opens the direct Orient Express railway through Sofia, permitting endless trains of German munitions and machinery to reach Istanbul."
 TUR_central_powers_war_council:0 "Central Powers Joint Supreme War Council"
 TUR_central_powers_war_council_desc:0 "Ottoman staff delegates confer directly with German and Austro-Hungarian supreme commanders, synchronizing grand offensives against the Entente."
 TUR_shared_munitions_standardization:0 "Allied Munitions Standardization"
 TUR_shared_munitions_standardization_desc:0 "Aligning small-arms ammunition and artillery calibers with German industry ensures direct supply compatibility from Central European arsenals."
 TUR_strict_armed_neutrality:0 "Strict Armed Neutrality"
 TUR_strict_armed_neutrality_desc:0 "The Sublime Porte declines entangling alliances, declaring armed neutrality and mobilizing defensive corps solely to deter foreign encroachment."
 TUR_close_straits_to_all_belligerents:0 "Closure of the Straits to All Warships"
 TUR_close_straits_to_all_belligerents_desc:0 "The Dardanelles and Bosphorus are barred to foreign warships, maintaining legal neutrality while severing Russia's primary Black Sea maritime access."
 TUR_demand_belligerent_transit_tolls:0 "Sovereign Maritime Transit Tolls"
 TUR_demand_belligerent_transit_tolls_desc:0 "Every commercial merchantman transiting the straits pays transit tariffs in gold to the Ottoman Treasury, enriching state coffers without firing a shot."
 TUR_internal_development_focus:0 "Focus on Domestic Anatolian Development"
 TUR_internal_development_focus_desc:0 "Spared the horrors of the European trenches, imperial resources are invested entirely in Anatolian railways, irrigation, and civic literacy."
 TUR_profit_from_wartime_trade:0 "Profiting from Wartime Neutral Trade"
 TUR_profit_from_wartime_trade_desc:0 "The empire sells cotton, grain, leather, and chromium to both warring blocs at premium rates, amassing colossal foreign currency reserves."
 TUR_swiss_of_the_orient_neutrality:0 "The Switzerland of the Orient"
 TUR_swiss_of_the_orient_neutrality_desc:0 "With fortified mountain frontiers and firm diplomatic composure, the Ottoman realm earns recognition as an inviolable sanctuary of regional peace."
 TUR_diplomatic_mediation_summit:0 "Constantinople Peace Mediation Summit"
 TUR_diplomatic_mediation_summit_desc:0 "The Sultan offers the palaces of the Bosphorus as neutral ground for armistice talks between exhausted belligerents, securing moral leadership."
 TUR_neutral_sovereignty_guaranteed:0 "Neutral Sovereignty Fully Guaranteed"
 TUR_neutral_sovereignty_guaranteed_desc:0 "All great powers sign binding instruments recognizing the inviolability of Ottoman borders, guaranteeing long-term peace and prosperity."
 TUR_entente_diplomatic_demands:0 "Diplomatic Demands to the Entente"
 TUR_entente_diplomatic_demands_desc:0 "The Sublime Porte presents strict conditions for any rapprochement with Britain and France, demanding the return of seized warships and treaty revisions."
 TUR_demand_dreadnought_deliveries:0 "Demand Surrender of Seized Dreadnoughts"
 TUR_demand_dreadnought_deliveries_desc:0 "The government demands that London release the seized dreadnoughts or deliver full financial compensation and public apologies for the confiscation."
 TUR_territorial_integrity_guarantees:0 "Territorial Integrity Guarantees"
 TUR_territorial_integrity_guarantees_desc:0 "The Entente powers must issue formal, binding pledges that Ottoman territorial borders will remain inviolable after the European conflict."
 TUR_anglo_ottoman_gulf_treaty:0 "Anglo-Ottoman Persian Gulf Accord"
 TUR_anglo_ottoman_gulf_treaty_desc:0 "Mutual delimitation of spheres of interest along Kuwait and the Persian Gulf establishes regional stability and ends friction with the Royal Navy."
 TUR_neutralize_russian_threat:0 "Neutralizing the Russian Imperial Threat"
 TUR_neutralize_russian_threat_desc:0 "Diplomatic pressure from Britain and France obliges the Russian Empire to officially renounce historic ambitions over Constantinople and the Straits."
 TUR_french_syrian_economic_pact:0 "Franco-Syrian Commercial Accord"
 TUR_french_syrian_economic_pact_desc:0 "French capital investment in the Beirut-Damascus railway and Syrian silk works is channeled under strict Ottoman customs sovereignty."
 TUR_entente_cooperation_treaty:0 "Treaty of Friendship with the Entente"
 TUR_entente_cooperation_treaty_desc:0 "An honorable accommodation with London and Paris secures lucrative reconstruction credits, shielding the empire from war while boosting sea commerce."
 TUR_secured_ottoman_borders:0 "Secured and Recognized Ottoman Borders"
 TUR_secured_ottoman_borders_desc:0 "The sovereign boundaries of the empire receive universal diplomatic recognition, safeguarding imperial peace from Adrianople to Basra."
 TUR_the_sovereign_straits_regime:0 "The Sovereign Straits Regime"
 TUR_the_sovereign_straits_regime_desc:0 "Uncontested sovereign jurisdiction over the Bosphorus and Dardanelles is affirmed, rejecting any foreign supervision or navigation commissions."
 TUR_dardanelles_maritime_hegemony:0 "Dardanelles Maritime Hegemony"
 TUR_dardanelles_maritime_hegemony_desc:0 "Armored gun emplacements and defensive minefields command the entrance to the Sea of Marmara, securing undisputed strategic dominance."
 TUR_levantine_coastal_security:0 "Levantine Coastal Security Network"
 TUR_levantine_coastal_security_desc:0 "Mobile coastal guns and observation posts along Jaffa, Beirut, and Tripoli repel hostile landings and secure vital regional cabotage shipping."
 TUR_sublime_porte_global_standing:0 "Global Standing of the Sublime Porte"
 TUR_sublime_porte_global_standing_desc:0 "The empire is restored to its historic rank as a leading world power, actively courted by embassies across Europe, the Americas, and Asia."
 TUR_destiny_of_the_near_east:0 "Destiny of the Near East"
 TUR_destiny_of_the_near_east_desc:0 "Peoples throughout the Near East look to Istanbul not as a distant master, but as the natural guardian of regional peace and civilizational dignity."
 TUR_pax_osmanica_reasserted:0 "Pax Osmanica Reasserted"
 TUR_pax_osmanica_reasserted_desc:0 "The golden age of regional peace, cultural harmony, and commerce re-emerges across the Levant, Mesopotamia, and Anatolia under the Ottoman banner."
 TUR_the_war_for_imperial_survival:0 "The War for Imperial Survival"
 TUR_the_war_for_imperial_survival_desc:0 "The empire enters the supreme existential trial of its history. Across five simultaneous theaters, every soldier fights for the continued survival of the state."
 TUR_caucasus_logistics_preparation:0 "Caucasus Logistics and Staging Network"
 TUR_caucasus_logistics_preparation_desc:0 "Grain depots, pack mule trains, and winter clothing depots are assembled at Erzurum and Sivas to sustain corps operating in freezing mountain heights."
 TUR_third_army_mountain_offensive:0 "Third Army Mountain Campaign"
 TUR_third_army_mountain_offensive_desc:0 "Adapting tactics to brutal winter conditions, the Third Army maneuvers across alpine ridges to outflank Russian positions in eastern Anatolia."
 TUR_trabzon_supply_lifeline:0 "Trabzon Maritime Supply Lifeline"
 TUR_trabzon_supply_lifeline_desc:0 "Coastal colliers and schooners ship munitions and bread flour from Istanbul to the port of Trabzon, sustaining armies on the Caucasus frontline."
 TUR_retake_kars_ardahan_batum:0 "Recovery of Kars, Ardahan, and Batum"
 TUR_retake_kars_ardahan_batum_desc:0 "The three historic provinces lost in the 1878 war are liberated by advancing Ottoman divisions, restoring long-lost imperial territories."
 TUR_army_of_islam_caucasus:0 "The Army of Islam (Kafkas İslam Ordusu)"
 TUR_army_of_islam_caucasus_desc:0 "Formed under Nuri Pasha, the Army of Islam mobilizes Azerbaijani and Caucasian volunteers to liberate regional capitals from Bolshevik and British control."
 TUR_baku_petroleum_drive:0 "Drive for the Baku Petroleum Basins"
 TUR_baku_petroleum_drive_desc:0 "The capture of the immensely rich oilfields of Baku secures inexhaustible fuel supplies for imperial railways, steamships, and motor vehicles."
 TUR_caspian_flotilla_organization:0 "Caspian Sea Armed Flotilla"
 TUR_caspian_flotilla_organization_desc:0 "Armed steamers and motor launches fitted with naval guns establish Ottoman naval control over the Caspian Sea, protecting transport lanes."
 TUR_caucasian_tribal_auxiliaries:0 "Caucasian Highland Auxiliaries"
 TUR_caucasian_tribal_auxiliaries_desc:0 "Dagestani, Chechen, and Circassian mounted volunteers join imperial columns, executing swift raids against retreating hostile formations."
 TUR_transcaucasian_security_sphere:0 "Transcaucasian Strategic Security Sphere"
 TUR_transcaucasian_security_sphere_desc:0 "Protective accords with Azerbaijan and Georgia erect an enduring defensive buffer shielding eastern Anatolia against northern encroachment."
 TUR_cevat_pasha_artillery_defence:0 "Cevat Pasha's Strait Artillery Triumph"
 TUR_cevat_pasha_artillery_defence_desc:0 "On 18 March 1915, Cevat Pasha orchestrates the devastating fire of coastal batteries, sinking allied battleships and winning an immortal victory."
 TUR_chunuk_bair_counterattack:0 "Mustafa Kemal's Stand at Chunuk Bair"
 TUR_chunuk_bair_counterattack_desc:0 "Leading the 57th Regiment, Lt. Colonel Mustafa Kemal gives the immortal command: 'I do not order you to attack, I order you to die!'—saving Gallipoli."
 TUR_fifth_army_mobile_reserves:0 "Fifth Army Mobile Reserve Maneuvers"
 TUR_fifth_army_mobile_reserves_desc:0 "Under Liman von Sanders, reserve divisions march at breakneck speed along rugged peninsula trails to contain allied landing forces at the beaches."
 TUR_drive_invaders_into_the_sea:0 "Drive the Invaders into the Aegean"
 TUR_drive_invaders_into_the_sea_desc:0 "Fierce bayonet charges and unrelenting counter-bombardments break the resolve of ANZAC and British corps, forcing a humiliating allied evacuation."
 TUR_anafartalar_heroism_legacy:0 "The Immortal Hero of Anafartalar"
 TUR_anafartalar_heroism_legacy_desc:0 "Mustafa Kemal's decisive generalship at Anafartalar secures his reputation throughout the empire as the legendary savior of the capital."
 TUR_fortress_canakkale_permanent:0 "Fortress Çanakkale: Impregnable Guardian"
 TUR_fortress_canakkale_permanent_desc:0 "The peninsula becomes an immortal bastion of national pride: 'Çanakkale Geçilmez'—the Dardanelles is forever barred to hostile armadas."
 TUR_tigris_river_flotilla:0 "Tigris River Gunboat Flotilla"
 TUR_tigris_river_flotilla_desc:0 "River gunboats armed with rapid-firing cannons patrol the winding waters of the Tigris and Euphrates, severing British river logistics."
 TUR_defense_of_kut_al_amara:0 "The Historic Siege of Kut-al-Amara"
 TUR_defense_of_kut_al_amara_desc:0 "The Sixth Army traps General Townshend's 6th Poona Division within the muddy loop of the Tigris at Kut, repulsing three desperate British relief attempts."
 TUR_encirclement_of_townshend_army:0 "The Iron Ring Around Townshend's Force"
 TUR_encirclement_of_townshend_army_desc:0 "Continuous trench networks and heavy bombardment choke British supply lines, bringing the trapped garrison to complete exhaustion and hunger."
 TUR_halil_kut_triumph:0 "Halil Pasha's Kut-al-Amara Triumph"
 TUR_halil_kut_triumph_desc:0 "General Townshend and 13,000 British soldiers surrender unconditionally to Halil Pasha, inflicting the most catastrophic defeat on the British Empire."
 TUR_secure_basra_access:0 "Drive to Reclaim Basra and the Gulf"
 TUR_secure_basra_access_desc:0 "Victorious Mesopotamian army corps push southward through the palm groves to expel colonial garrisons from the strategic port of Basra."
 TUR_shatt_al_arab_defensive_perimeter:0 "Shatt al-Arab Defensive Perimeter"
 TUR_shatt_al_arab_defensive_perimeter_desc:0 "Fortified riverbank emplacements and marshland redoubts secure the Shatt al-Arab estuary, cementing sovereign Ottoman control over Mesopotamia."
 TUR_cross_the_sinai_desert:0 "Crossing the Arid Sinai Desert"
 TUR_cross_the_sinai_desert_desc:0 "Columns under Cemal Pasha execute a legendary night march across the blazing Sinai desert, dragging pontoon bridges to strike the Suez Canal."
 TUR_suez_canal_raids:0 "Suez Canal Assault Raids"
 TUR_suez_canal_raids_desc:0 "Pioneer assault detachments launch pontoons into the canal, disrupting imperial shipping and tying down hundreds of thousands of British defenders."
 TUR_gaza_beersheba_defensive_line:0 "The Gaza-Beersheba Fortified Line"
 TUR_gaza_beersheba_defensive_line_desc:0 "Entrenched redoubts between Gaza and Beersheba repulse two major British assaults with devastating losses, locking the Palestinian front."
 TUR_defense_of_jerusalem:0 "Unshakable Defense of Jerusalem (Al-Quds)"
 TUR_defense_of_jerusalem_desc:0 "The Judean hills and ancient valleys around Jerusalem are fortified into formidable redoubts, shielding the Holy City against hostile encroachment."
 TUR_damascus_bastion:0 "The Central Bastion of Damascus"
 TUR_damascus_bastion_desc:0 "Damascus serves as the logistical hub for the Yıldırım Army Group, staging fresh reserves and munitions arriving from northern trunk railways."
 TUR_levantine_supply_depots:0 "Levantine Supply Depot Network"
 TUR_levantine_supply_depots_desc:0 "Secure depots at Homs, Rayak, and Aleppo store grain and ammunition, guaranteeing steady logistics to every defensive sector in the south."
 TUR_protect_hejaz_railway_garrisons:0 "Hejaz Railway Garrison Defense Network"
 TUR_protect_hejaz_railway_garrisons_desc:0 "Stone blockhouses and cavalry escorts along thousands of kilometers of track protect supply trains from desert raiding parties."
 TUR_fakhri_pasha_medina_defense:0 "Fahreddin Pasha's Defense of Medina"
 TUR_fakhri_pasha_medina_defense_desc:0 "The 'Tiger of the Desert', Fahreddin Pasha, defends the Prophet's tomb in Medina through years of total siege, refusing surrender against all odds."
 TUR_crush_or_reconcile_sharifians:0 "Pacification of the Hejaz Tribes"
 TUR_crush_or_reconcile_sharifians_desc:0 "Employing generous tribal subsidies alongside decisive mobile detachments, the Porte defuses unrest sponsored by British intelligence officers."
 TUR_holy_relics_safeguard:0 "Evacuation of the Sacred Relics to Istanbul"
 TUR_holy_relics_safeguard_desc:0 "Under armed escort, the sacred Islamic relics and priceless manuscripts are conveyed safely from Medina to the vaults of Topkapı Palace."
 TUR_red_sea_desert_patrols:0 "Red Sea Coastal Reconnaissance Patrols"
 TUR_red_sea_desert_patrols_desc:0 "Coastal redoubts along Yanbu and the Hijaz coast monitor hostile warships, protecting small dhows supplying local garrisons."
 TUR_war_bread_and_rationing:0 "War Bread and National Rationing System"
 TUR_war_bread_and_rationing_desc:0 "A national coupon rationing system ensures equitable distribution of flour and essential provisions across urban centers during wartime blockades."
 TUR_requisition_imperial_resources:0 "Patriotic Requisition of War Materials"
 TUR_requisition_imperial_resources_desc:0 "Draft horses, wool cloth, and metal scrap are mobilized across every vilayet to clothe and equip frontline divisions departing for the trenches."
 TUR_teskilat_asymmetric_warfare:0 "Teşkilât-ı Mahsusa Covert Frontier Operations"
 TUR_teskilat_asymmetric_warfare_desc:0 "Covert operatives deployed across the Caucasus, Persia, and North Africa conduct raids on hostile pipelines, railways, and communications."
 TUR_counter_the_blockade:0 "Countering the Naval Blockade"
 TUR_counter_the_blockade_desc:0 "Protected coastal cabotage lanes hugging the coastline deliver Anatolian produce safely to the capital despite Allied naval patrols."
 TUR_total_war_labour_mobilization:0 "Total War Labor Mobilization Battalions"
 TUR_total_war_labour_mobilization_desc:0 "Auxiliary construction battalions construct military highways across high mountain passes, repair rails, and dig immense trench complexes."
 TUR_emergency_war_levies:0 "Emergency National War Levies"
 TUR_emergency_war_levies_desc:0 "Rapid intake of territorial reserves replenishes bloodied frontline regiments, ensuring defensive lines never collapse under pressure."
 TUR_the_eastern_storm_survived:0 "The Eastern Storm Survived"
 TUR_the_eastern_storm_survived_desc:0 "With the collapse of Tsarist Russia and the repulse of Allied landings, the Ottoman Empire emerges victorious across its eastern frontiers."
 TUR_brest_litovsk_claims:0 "Treaty of Brest-Litovsk Territorial Gains"
 TUR_brest_litovsk_claims_desc:0 "Ottoman plenipotentiaries at Brest-Litovsk secure the return of lost territories and international recognition of Caucasus boundary claims."
 TUR_middle_eastern_hegemon:0 "Undisputed Middle Eastern Hegemon"
 TUR_middle_eastern_hegemon_desc:0 "From the Persian Gulf to the Suez Canal and the Caspian Sea, the Sublime Porte consolidates its position as the preeminent power of the region."
 TUR_1918_total_victory_protocol:0 "1918 Total Victory Protocol"
 TUR_1918_total_victory_protocol_desc:0 "All colonial partition schemes are pulverized on the battlefield. The Ottoman Empire triumphs against overwhelming odds, ready to chart its destiny."
 TUR_reborn_empire_destiny:0 "Destiny: The Reborn Ottoman Empire"
 TUR_reborn_empire_destiny_desc:0 "Under a rejuvenated constitutional monarchy, the empire modernizes its economy and leads the Islamic world into an era of sovereign strength."
 TUR_republican_renaissance_destiny:0 "Destiny: Kemalist Republican Renaissance"
 TUR_republican_renaissance_destiny_desc:0 "Led by visionary patriotic officers, the nation embraces progressive civic secularism, national sovereignty, and profound scientific modernization."
 TUR_eternal_sublime_destiny:0 "Destiny: The Eternal Sublime State and Caliphate"
 TUR_eternal_sublime_destiny_desc:0 "The House of Osman and the sacred Caliphate stand as the enduring spiritual and political beacon for hundreds of millions of faithful worldwide."
 TUR_macedonian_and_thracian_veterans:0 "Macedonian and Thracian Veterans"
 TUR_macedonian_and_thracian_veterans_desc:0 "Seasoned veterans and officers blooded in regional frontier skirmishes are integrated into frontline regiments, sharing essential combat experience with new recruits."
 TUR_constantinople_press_syndicate:0 "Constantinople Press Syndicate"
 TUR_constantinople_press_syndicate_desc:0 "Professional regulation of telegraphic dispatches and urban printers shields the imperial capital from defeatist rumors and foreign espionage bulletins."
 TUR_al_fatat_secret_dialogue:0 "Covert Dialogue with Al-Fatat Society"
 TUR_al_fatat_secret_dialogue_desc:0 "Imperial emissaries meet covertly with young Arab nationalist leaders in Damascus, offering broad administrative autonomy to avert armed rebellion."
 TUR_arab_notables_chamber:0 "Levantine Arab Notables Chamber"
 TUR_arab_notables_chamber_desc:0 "Dignified patricians of Jerusalem, Beirut, and Nablus supervise domestic rationing and municipal policing in close liaison with imperial army corps."
 TUR_pontic_coal_shipping:0 "Pontic Coal Shipping Flotilla"
 TUR_pontic_coal_shipping_desc:0 "Armored coastal colliers and sailing barges transport Black Sea coal under armed torpedo-boat escort directly to capital factories."
 TUR_cilicia_irrigation_canals:0 "Cilician Canal Infrastructure"
 TUR_cilicia_irrigation_canals_desc:0 "Hydraulic locks along the Seyhan River turn the Cilician plains into a premier production zone for imperial military rations and textile fibers."
 TUR_aleppo_commercial_hub:0 "Aleppo Continental Commercial Hub"
 TUR_aleppo_commercial_hub_desc:0 "The historic covered bazaars of Aleppo serve as the primary supply depot and rail junction linking Syria with Mesopotamian fronts."
 TUR_syrian_grain_storage:0 "Syrian Central Grain Silos"
 TUR_syrian_grain_storage_desc:0 "Reinforced concrete grain elevators in Hama and the Hauran store durum wheat to sustain southern army corps throughout prolonged campaigns."
 TUR_izmir_naval_seaplane_base:0 "İzmir Naval Hydroplane Base"
 TUR_izmir_naval_seaplane_base_desc:0 "Naval seaplane facilities in the Gulf of Smyrna launch maritime patrol planes to track hostile fleets in the Aegean and protect busy merchant harbors."
 TUR_marmara_anti_submarine_nets:0 "Marmara Anti-Submarine Steel Net Barriers"
 TUR_marmara_anti_submarine_nets_desc:0 "Heavy steel indicator nets and acoustic listening stations block the narrows, entrapping Allied submarines attempting to raid imperial Marmara transports."
 TUR_cavalry_reconnaissance_squadrons:0 "Light Cavalry Reconnaissance Squadrons"
 TUR_cavalry_reconnaissance_squadrons_desc:0 "Circassian and Anatolian light cavalry squadrons range ahead of the corps, severing hostile communications and securing real-time tactical intelligence."
 TUR_harbiye_cadet_battalions:0 "Harbiye Officer Cadet Field Battalions"
 TUR_harbiye_cadet_battalions_desc:0 "Senior cadets from the Harbiye deploy to the trenches as junior lieutenants, imbuing frontline companies with educated, fearless tactical leadership."
 TUR_rome_mediterranean_dialogue:0 "Mediterranean Dialogue with Rome"
 TUR_rome_mediterranean_dialogue_desc:0 "Diplomatic talks with the Italian foreign ministry ease Aegean tensions and delineate commercial spheres in North Africa."
 TUR_paris_credit_negotiations:0 "Paris Financial Credit Negotiations"
 TUR_paris_credit_negotiations_desc:0 "Discussions with Parisian banking syndicates explore favorable refinancing terms for Ottoman railway bonds without compromising sovereign tariffs."
 TUR_persian_border_security:0 "Qajar Persian Border Security Protocol"
 TUR_persian_border_security_desc:0 "Border demarcations with Tehran and garrisons along the Zagros range block Russian incursions through vulnerable Persian borderlands."
 TUR_cyrenaica_desert_posts:0 "Cyrenaican Desert Outposts"
 TUR_cyrenaica_desert_posts_desc:0 "Fortified desert oases maintain clandestine supply trails, keeping Libyan freedom fighters armed and supplied with ammunition."
 TUR_erzurum_fortress_line:0 "Erzurum Fortress Mountain Line"
 TUR_erzurum_fortress_line_desc:0 "The fortified bastions of Erzurum command mountain approach roads, providing an unbreachable shield against Russian armies."
 TUR_trench_warfare_drills_canakkale:0 "Çanakkale Trench Warfare Drills"
 TUR_trench_warfare_drills_canakkale_desc:0 "Sapping trenches within spitting distance of enemy lines and constant grenade skirmishes turn Ottoman infantry into master trench fighters."
 TUR_ctesiphon_defensive_stand:0 "The Battle of Ctesiphon (Selman-ı Pak)"
 TUR_ctesiphon_defensive_stand_desc:0 "Beneath the ancient Arch of Ctesiphon, Colonel Nureddin Bey delivers a crushing counter-attack, shattering Townshend's drive on Baghdad."
 TUR_hejaz_armored_train_patrols:0 "Hejaz Armored Train Patrol Squadrons"
 TUR_hejaz_armored_train_patrols_desc:0 "Locomotives protected by steel boilerplate and armed with Maxim guns patrol desert tracks, driving off hostile raiding parties."

 # --- Expanded WW1 Narrative & Systemic Keys ---
 ww1_ottoman.2.t:0 "The Savior Officers' Ultimatum"
 ww1_ottoman.2.d:0 "Dissident army officers under the Halâskâr Zâbitân movement have issued an ultimatum to the Sublime Porte, demanding the resignation of the Unionist cabinet and free elections."
 ww1_ottoman.2.a:0 "Yield to the officers and invite the liberal opposition."
 ww1_ottoman.2.b:0 "The CUP vanguard will not compromise with factional mutineers!"
 ww1_ottoman.3.t:0 "The Raid on the Sublime Porte"
 ww1_ottoman.3.d:0 "Enver Bey and armed Unionist officers stormed the government council at the Sublime Porte, forcing Grand Vizier Kâmil Pasha to sign his resignation at gunpoint. The Committee of Union and Progress now holds uncontested executive mastery."
 ww1_ottoman.3.a:0 "Consolidate the triumvirate of Enver, Talat, and Cemal!"
 ww1_ottoman.3.b:0 "Seek constitutional harmony with the Sultan and parliament."
 ww1_ottoman.4.t:0 "The First Arab Congress of Paris"
 ww1_ottoman.4.d:0 "Arab delegates assembled in Paris to formulate demands for decentralization, official recognition of the Arabic language in schools and courts, and local military service within Arab provinces."
 ww1_ottoman.4.a:0 "Accept cultural and administrative decentralization."
 ww1_ottoman.4.b:0 "Imperial unity permits no centrifugal concessions!"
 ww1_ottoman.5.t:0 "The German Military Mission of Liman von Sanders"
 ww1_ottoman.5.d:0 "Lieutenant General Otto Liman von Sanders has arrived at Constantinople at the head of a comprehensive German military mission charged with restructuring Ottoman army corps, sparking bitter diplomatic protests in Saint Petersburg."
 ww1_ottoman.5.a:0 "Empower von Sanders and German staff advisors."
 ww1_ottoman.5.b:0 "Restrict the mission to advisory instruction only."
 ww1_ottoman.6.t:0 "The British Naval Mission of Admiral Limpus"
 ww1_ottoman.6.d:0 "Rear-Admiral Arthur Limpus has supervised modern dockyard management and gunnery training for the Ottoman fleet, proposing extensive dreadnought refits."
 ww1_ottoman.6.a:0 "Deepen naval contracts with British shipyards."
 ww1_ottoman.6.b:0 "Develop sovereign Ottoman naval capabilities."
 ww1_ottoman.7.t:0 "The Ottoman Public Debt Administration (OPDA)"
 ww1_ottoman.7.d:0 "Foreign bondholder representatives in the OPDA hold mortgages over salt, silk, and tobacco revenues. The Porte faces a historic crossroads between fiscal subservience and financial independence."
 ww1_ottoman.7.a:0 "Reclaim state monopoly revenues unilaterally!"
 ww1_ottoman.7.b:0 "Renegotiate coupon interest rates amicably."
 ww1_ottoman.8.t:0 "Unilateral Abrogation of the Capitulations"
 ww1_ottoman.8.d:0 "The Porte has issued an imperial irade declaring the immediate abolition of extraterritorial privileges, consular courts, and foreign tax immunities that have hobbled the empire for centuries."
 ww1_ottoman.8.a:0 "The chains of centuries are broken! Long live sovereignty!"
 ww1_ottoman.9.t:0 "The Taurus Mountains Railway Breach"
 ww1_ottoman.9.d:0 "German and Ottoman engineers have successfully linked the railway tunnels through the precipitous Taurus and Amanus mountains, connecting Constantinople directly to Syria and Mesopotamia."
 ww1_ottoman.9.a:0 "The iron artery of the Empire is open!"
 ww1_ottoman.11.t:0 "The Dardanelles Straits Regime"
 ww1_ottoman.11.d:0 "To protect the imperial capital from hostile battlefleets, the Porte considers closing the Straits to all foreign merchantmen and warships, cutting off the Russian Empire's Black Sea lifeline."
 ww1_ottoman.11.a:0 "Mine the Straits and close the Dardanelles!"
 ww1_ottoman.11.b:0 "Keep commercial transit open under strict inspections."
 ww1_ottoman.12.b:0 "Maintain strategic reservation and armed neutrality."
 ww1_ottoman.13.t:0 "The Black Sea Raid"
 ww1_ottoman.13.d:0 "Admiral Souchon has led Yavuz, Midilli, and Ottoman torpedo boats into the Black Sea, bombarding the Russian naval bases of Sevastopol, Odessa, and Novorossiysk."
 ww1_ottoman.13.a:0 "The die is cast: We enter the Great War!"
 ww1_ottoman.13.b:0 "Disavow the raid as an unauthorized German act!"
 ww1_ottoman.14.t:0 "Proclamation of Holy Jihad (Cihad-ı Ekber)"
 ww1_ottoman.14.d:0 "Sultan Mehmed V, in his role as Caliph of all Muslims, has proclaimed a sacred duty of jihad against the Entente powers oppressing Muslim lands in India, North Africa, and Central Asia."
 ww1_ottoman.14.a:0 "Raise the Sacred Banner of the Prophet!"
 ww1_ottoman.14.b:0 "Emphasize civic and constitutional patriotic solidarity."
 ww1_ottoman.16.t:0 "18 March: The Naval Triumph of Çanakkale"
 ww1_ottoman.16.d:0 "Allied dreadnoughts attempting to force the Dardanelles struck minefields laid by the Nusret and faced lethal plunging fire from coastal fortresses. Three battleships were sunk and three crippled."
 ww1_ottoman.16.a:0 "Çanakkale Geçilmez! The Straits are impenetrable!"
 ww1_ottoman.17.t:0 "The Epic Triumph of Gallipoli"
 ww1_ottoman.17.d:0 "Allied invasion armies at Anzac Cove, Suvla Bay, and Cape Helles have been completely repulsed through the tenacity of Ottoman defenders under Mustafa Kemal and Esad Pasha. The invaders have evacuated in defeat."
 ww1_ottoman.17.a:0 "Victory belongs to the steadfast soldiers of Islam!"
 ww1_ottoman.18.t:0 "The Great Locust Plague of the Levant"
 ww1_ottoman.18.d:0 "Devastating swarms of desert locusts stripped crops bare across Syria, Lebanon, and Palestine in 1915, triggering catastrophic bread shortages and threatening the food security of the Fourth Army."
 ww1_ottoman.18.a:0 "Deploy imperial grain reserves and relief brigades."
 ww1_ottoman.18.b:0 "Ration food strictly: The army comes first!"
 ww1_ottoman.19.t:0 "The Arab Revolt in the Hejaz"
 ww1_ottoman.19.d:0 "Sharif Hussein of Mecca, incited by British promises and gold, has fired a rifle shot from his palace window in Mecca, proclaiming rebellion against Ottoman sovereignty."
 ww1_ottoman.19.a:0 "Garrison Medina and rally loyal bedouin tribes!"
 ww1_ottoman.19.b:0 "Offer generous autonomy terms to Arab notables."
 ww1_ottoman.21.t:0 "The Defense of the Gaza-Beersheba Line"
 ww1_ottoman.21.d:0 "Ottoman divisions reinforced by Austrian heavy batteries have entrenched along the desert frontier of Palestine, repulsing British advances from the Sinai."
 ww1_ottoman.21.a:0 "Hold the gates of Jerusalem at all costs!"
 ww1_ottoman.22.t:0 "The Army of Islam Liberates Baku"
 ww1_ottoman.22.d:0 "Nuri Pasha's newly formed Army of Islam has driven British and Bolshevik detachments out of Baku, securing the petroleum wealth of the Caspian Sea and forging solidarity with Azerbaijan."
 ww1_ottoman.22.a:0 "The Caspian petroleum is secured for the Empire!"
 ww1_ottoman.23.t:0 "Ascension of Sultan Mehmed VI Vahideddin"
 ww1_ottoman.23.d:0 "Following the demise of Sultan Mehmed V Reshad in July 1918, his brother Mehmed VI Vahideddin has ascended the imperial throne, pledging to protect the realm amidst turbulent war skies."
 ww1_ottoman.23.a:0 "May Allah grant wisdom to the Padishah!"
 ww1_ottoman.24.t:0 "Founding of the Osmanlı İtibar-ı Millî Bankası"
 ww1_ottoman.24.d:0 "The Porte has chartered the National Credit Bank to mobilize domestic capital, replace foreign-dominated financial syndicates, and issue banknotes backed by national treasuries."
 ww1_ottoman.24.a:0 "A monumental pillar of economic independence!"
 ww1_ottoman.25.b:0 "License concessions with guaranteed imperial royalties."
 ww1_ottoman.26.t:0 "The Treaty of Da'an & Yemen's Loyalty"
 ww1_ottoman.26.d:0 "Through the Treaty of Da'an, the Ottoman Empire has recognized the Zaidi Imam Yahya's internal religious autonomy in exchange for absolute political loyalty to the Caliphate, securing the southern frontier."
 ww1_ottoman.26.a:0 "The southern gateway to the Red Sea is pacified."
 ww1_ottoman.27.t:0 "The Turco-Arab Federal Compact"
 ww1_ottoman.27.d:0 "Delegates from Damascus, Baghdad, Beirut, and Jerusalem have signed a historic charter transforming the empire into a dual Ottoman-Arab commonwealth with shared legislative authority."
 ww1_ottoman.27.a:0 "Brothers in faith and history, united forever!"
 ww1_ottoman.28.t:0 "The Triumph of the Eternal State"
 ww1_ottoman.28.d:0 "Having weathered six years of world conflict, economic siege, and external conspiracies, the Ottoman Empire emerges as a victorious, modernized major power respected across the globe."
 ww1_ottoman.28.a:0 "Devlet-i Aliyye-i Osmaniyye ebed-müddet!"
 ww1_ottoman.29.t:0 "The National Pact (Misak-ı Millî)"
 ww1_ottoman.29.d:0 "Parliament has unanimously adopted the Misak-ı Millî declaration, affirming that territories populated by an Ottoman majority within armistice borders form an indivisible homeland."
 ww1_ottoman.29.a:0 "Not one inch of the motherland shall be surrendered!"
 TUR_milli_iktisat_economy:0 "National Economy (Milli İktisat)"
 TUR_milli_iktisat_economy_desc:0 "Promotion of domestic enterprise, industrialization, and elimination of parasitic commercial middle-men."
 TUR_tax_farming_abolished:0 "Abolition of Tax Farming (İltizam)"
 TUR_tax_farming_abolished_desc:0 "Direct provincial revenue collection by civil bureaucrats replaces extortionate private tax farmers."
 TUR_monetary_gold_lira:0 "Gold Lira Monetary Standard"
 TUR_monetary_gold_lira_desc:0 "A stable national currency backed by bullion shields the Ottoman economy from foreign speculative panic."
 TUR_munitions_directorate_idea:0 "Imperial Munitions Directorate"
 TUR_munitions_directorate_idea_desc:0 "Centralized coordination of foundries, cartridge works, and powder mills maximizes ammunition output."
 TUR_heavy_ordnance_idea:0 "Krupp Heavy Siege Ordnance"
 TUR_heavy_ordnance_idea_desc:0 "Modern heavy howitzers and fortress guns provide overwhelming counter-battery superiority."
 TUR_prusso_ottoman_tactics:0 "Prusso-Ottoman Tactical Doctrines"
 TUR_prusso_ottoman_tactics_desc:0 "Rigorous staff planning, tactical decentralization, and flexible operational maneuver."
 TUR_red_crescent_logistics:0 "Red Crescent Medical Logistics"
 TUR_red_crescent_logistics_desc:0 "Field hospitals, stretcher battalions, and hygienic standards save thousands of wounded soldiers."
 TUR_breadbasket_idea:0 "Imperial Breadbasket Reserves"
 TUR_breadbasket_idea_desc:0 "Strategic grain stores protect both urban populations and army corps from famine and blockades."
 TUR_reformed_ottoman_corps:0 "Reformed Ottoman Corps"
 TUR_reformed_ottoman_corps_desc:0 "Reorganized along modern triangular division standards with organic artillery and communications."
 TUR_mesopotamian_oil_production:0 "Mesopotamian Petroleum Fields"
 TUR_mesopotamian_oil_production_desc:0 "Abundant oil from Kirkuk and Mosul supplies the fleet and armed forces with continuous domestic fuel."
 TUR_emergency_imperial_rally:0 "Emergency Imperial Cohesion Rally"
 TUR_emergency_imperial_rally_desc:0 "Mobilize public proclamations, local notables, and patriotic assemblies to restore imperial cohesion."
 TUR_pacify_levant_notables:0 "Pacify Provincial Notables of the Levant"
 TUR_pacify_levant_notables_desc:0 "Grant budgetary concessions and municipal privileges to Syrian and Iraqi leaders to keep the provinces peaceful."
