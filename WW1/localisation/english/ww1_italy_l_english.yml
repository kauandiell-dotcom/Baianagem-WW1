l_english:
 ITA_ww1_ace_squadrons:0 "The Elite Squadrons"
 ITA_ww1_ace_squadrons_desc:0 "Immediate effect: Major Francesco Baracca's 91st Squadron (Squadriglia degli Assi) achieves legendary renown (+20 air XP).\n\nDecorated with the Prancing Horse emblem (Cavallino Rampante), Baracca, Ruffo di Calabria, and Piccio down dozens of enemy aircraft."
 ITA_ww1_acute_agrarian_crisis:0 "Acute Agrarian Crisis"
 ITA_ww1_acute_agrarian_crisis_desc:0 "Rural scarcity and population exodus disrupt the rural economy."
 ITA_ww1_adriatic_convoys:0 "Adriatic Convoys"
 ITA_ww1_adriatic_convoys_desc:0 "Immediate effect: Safeguards transport convoys sustaining Italian garrisons in Albania and the Aegean (+10 navy XP).\n\nMoving over two hundred thousand Italian and Serbian soldiers across the Adriatic without losing a single major troopship."
 ITA_ww1_adriatic_dispute:0 "Adriatic Dispute"
 ITA_ww1_adriatic_naval_patrols:0 "Adriatic Naval Patrols"
 ITA_ww1_adriatic_naval_patrols_desc:0 "Naval demonstration between Brindisi and Venice."
 ITA_ww1_adriatic_watch:0 "The Adriatic Watch"
 ITA_ww1_adriatic_watch_desc:0 "Immediate effect: Deploys permanent surface patrols and sea mine barriers along the Italian east coast (+15 navy XP).\n\nGuarding the exposed Italian coastline against Austro-Hungarian shore bombardments from Pola and Cattaro."
 ITA_ww1_aero_engine_contracts:0 "Aero-Engine Contracts"
 ITA_ww1_aero_engine_contracts_desc:0 "Immediate effect: State contracts with FIAT and Isotta Fraschini produce high-output aero-engines for military aviation. Immediate effect: Grants a 25% Air research bonus (1 use) and 10 Air Experience."
 ITA_ww1_aeronautical_corps:0 "The Military Aeronautical Corps"
 ITA_ww1_aeronautical_corps_desc:0 "Immediate effect: Reorganises military aviation into an autonomous combat arm (+15 air XP, +25 PP).\n\nForming independent observation, fighter, and heavy bombardment squadrons directly responsive to General Headquarters."
 ITA_ww1_air_autonomy_debate:0 "The Air Autonomy Debate"
 ITA_ww1_air_autonomy_debate_desc:0 "Immediate effect: Lays legislative foundations for an independent Air Ministry and the future Regia Aeronautica.\n\nEstablishing independent air budget lines, specialized test centers at Guidonia, and professional aeronautical officer careers."
 ITA_ww1_albanian_influence_rivalry:0 "Rivalry over Albania"
 ITA_ww1_albanian_protectorate:0 "The Albanian Protectorate"
 ITA_ww1_albanian_protectorate_desc:0 "Immediate effect: General Ferrero proclaims the independence of Albania under the solemn protection of Italy at Gjirokastër. Immediate effect: Grants 25 Political Power and raises Irredentism by 5."
 ITA_ww1_albanian_question:0 "The Albanian Question"
 ITA_ww1_albanian_question_desc:0 "Immediate effect: Preventing any single foreign power from controlling the Strait of Otranto and Vlora. Immediate effect: Triggers the Albanian Question event and grants 20 Political Power."
 ITA_ww1_alpine_hydroelectric_dam:0 "Alpine Hydroelectric Dam"
 ITA_ww1_alpine_hydroelectric_dam_desc:0 "Electrical generation for Lombard industrial plants."
 ITA_ww1_alpini_expansion:0 "Expand the Alpini"
 ITA_ww1_alpini_expansion_desc:0 "Immediate effect: Expands the legendary Alpini mountain regiments; +10 army XP and special forces tech bonus (25%).\n\nRecruiting sturdy mountaineers from the Alpine valleys into autonomous ski battalions trained to fight amidst snow, ice, and dolomite crags."
 ITA_ww1_andrea_doria_class:0 "The Andrea Doria Class"
 ITA_ww1_andrea_doria_class_desc:0 "Immediate effect: Constructs super-dreadnoughts Andrea Doria and Caio Duilio (+15 navy XP).\n\nRefining armor layout, deck protection, and secondary battery barbettes to withstand heavy Austro-Hungarian naval shells."
 ITA_ww1_ansaldo_expansion:0 "Expand the Ansaldo Works"
 ITA_ww1_ansaldo_expansion_desc:0 "Immediate effect: Massive vertical expansion of the Perrone brothers' steel, shipbuilding, and artillery conglomerate. Immediate effect: Adds 1 building slot in Liguria and a 25% Artillery research bonus (1 use)."
 ITA_ww1_anti_submarine_patrols:0 "Anti-Submarine Patrols"
 ITA_ww1_anti_submarine_patrols_desc:0 "Immediate effect: Deploys depth charges, flying boats, and towed hydrophones (+15 navy XP).\n\nOrganizing integrated hunter-killer groups combining naval aircraft and fast sub-chasers to hunt Habsburg submarines."
 ITA_ww1_apulian_aqueduct:0 "The Apulian Aqueduct"
 ITA_ww1_apulian_aqueduct_desc:0 "Immediate effect: Constructing the monumental Acquedotto Pugliese to bring drinking water to parched Apulian plains. Immediate effect: Adds 1 Infrastructure in Apulia and reduces the Southern Gap by 10."
 ITA_ww1_apulian_aqueduct_expansion:0 "Apulian Aqueduct Expansion"
 ITA_ww1_apulian_aqueduct_expansion_desc:0 "Canalisation of drinking water to southern towns."
 ITA_ww1_arditi_assault_schools:0 "Arditi Assault Schools"
 ITA_ww1_arditi_assault_schools_desc:0 "Intensive training in hand-to-hand combat and infiltration."
 ITA_ww1_armed_mediator:0 "Mediate for Peace"
 ITA_ww1_armed_mediator_desc:0 "Immediate effect: Leveraging Italian armed neutrality to broker a negotiated peace between the warring coalitions. Immediate effect: Grants 40 Political Power and +2% Stability."
 ITA_ww1_armed_neutrality_doctrine:0 "Armed Independence"
 ITA_ww1_armed_neutrality_doctrine_desc:0 "Immediate effect: Formulating the doctrine of 'Sacro Egoismo' to prioritize strict national self-interest. Immediate effect: Activates the Sacro Egoismo idea and grants 40 Political Power."
 ITA_ww1_army_budget_cuts:0 "Army Budget Cuts"
 ITA_ww1_army_budget_cuts_desc:0 "Immediate effect: Reduces military appropriations to balance the state treasury (+50 political power).\n\nRestricting annual conscription terms and mothballing heavy ordnance to rescue the national budget from catastrophic debt burdens."
 ITA_ww1_army_demobilisation:0 "Army Demobilisation"
 ITA_ww1_army_demobilisation_desc:0 "Immediate effect: Demobilises four million conscripted soldiers back into civilian life (+3% stability, +40 PP).\n\nReturning soldiers to farming and industrial workshops while avoiding runaway postwar unemployment through phased release schedules."
 ITA_ww1_army_staff_reorganisation:0 "Reorganise the General Staff"
 ITA_ww1_army_staff_reorganisation_desc:0 "Immediate effect: Reorganises staff sections under General Pollio; grants +10 army XP and General Staff idea.\n\nRestructuring operational planning, staff officer assignments, and railway mobilization schedules to modernize the Regio Esercito."
 ITA_ww1_artillery_modernisation:0 "Artillery Modernisation"
 ITA_ww1_artillery_modernisation_desc:0 "Immediate effect: Procures modern 75mm Krupp and Schneider field guns; artillery tech bonus (25%).\n\nReplacing obsolete bronze cannons with quick-firing 75/27 Modello 1906 field guns equipped with modern recoil cylinders."
 ITA_ww1_assault_units:0 "Assault Units"
 ITA_ww1_assault_units_desc:0 "Immediate effect: Founds the famous Arditi stormtrooper corps; grants +20 army XP and special forces tech bonus (25%).\n\nArmed with daggers, Thevenot hand grenades, and Villar Perosa submachine guns, black-flamed Arditi stormtroops spearhead trench assaults."
 ITA_ww1_aviators_battalion:0 "The Aviators' Battalion"
 ITA_ww1_aviators_battalion_desc:0 "Immediate effect: Founds the Battaglione Aviatori under the Army Engineers; grants +15 air XP.\n\nFormed at the Centocelle aerodrome near Rome, Italy's first military aviation unit trains pilots and tests early monoplanes."
 ITA_ww1_bainsizza:0 "The Bainsizza Plateau"
 ITA_ww1_bainsizza_desc:0 "Immediate effect: The heroic crossing of the Isonzo and conquest of the vast Austrian plateau of Bainsizza. Immediate effect: Triggers the Bainsizza Plateau event and grants 15 Army Experience."
 ITA_ww1_balkan_league_crisis:0 "The Balkan League Crisis"
 ITA_ww1_balkan_league_crisis_desc:0 "Immediate effect: Monitoring the rapid collapse of Ottoman authority across Macedonia and Thrace. Immediate effect: Grants 25 Political Power and raises Irredentism by 5."
 ITA_ww1_bank_rescue_consortium:0 "Bank Rescue Consortium"
 ITA_ww1_bank_rescue_consortium_desc:0 "Immediate effect: A state-orchestrated consortium stabilizes the banking sector and protects industrial accounts. Immediate effect: Grants 40 Political Power and reduces Social Tension by 5."
 ITA_ww1_battleship_fleet_in_being:0 "Fleet in Being"
 ITA_ww1_battleship_fleet_in_being_desc:0 "Immediate effect: Preserves the primary dreadnought squadrons intact at Taranto (+15 navy XP, +25 PP).\n\nAdmiral Thaon di Revel's doctrine avoids risking irreplaceable battleships against mines and submarines, pinning down the enemy through menacing potential power."
 ITA_ww1_biennio_rosso:0 "The Red Biennium"
 ITA_ww1_biennio_rosso_desc:0 "Immediate effect: Two turbulent years of mass strikes, peasant land occupations, and bread price riots sweep Italy. Immediate effect: Increases Social Tension by 15 and costs 20 Political Power."
 ITA_ww1_biennio_rosso_strikes:0 "Biennio Rosso Strikes"
 ITA_ww1_biennio_rosso_strikes_desc:0 "Factory occupations and agrarian strikes destabilize the nation's social fabric."
 ITA_ww1_boselli_national_unity:0 "The Boselli National Unity Cabinet"
 ITA_ww1_boselli_national_unity_desc:0 "Immediate effect: Paolo Boselli forms a broad coalition cabinet of national unity encompassing interventionists of all colors. Immediate effect: Grants 35 Political Power and triggers the Boselli Cabinet event."
 ITA_ww1_bread_rationing:0 "Bread Rationing"
 ITA_ww1_bread_rationing_desc:0 "Immediate effect: Instituting grain and bread rationing cards to manage dwindling wheat stocks during the conflict. Immediate effect: Increases Social Tension by 10 and grants 25 Political Power."
 ITA_ww1_brindisi_venice_bases:0 "Brindisi and Venice"
 ITA_ww1_brindisi_venice_bases_desc:0 "Immediate effect: Refits forward destroyer bases at Brindisi and the historic Venetian Arsenal (+10 navy XP).\n\nPositioning fast flotillas and submarine pens at Brindisi to interdict the Otranto straits and at Venice to guard the northern lagoons."
 ITA_ww1_british_coal:0 "Secure British Coal"
 ITA_ww1_british_coal_desc:0 "Immediate effect: Securing priority colliers and credit lines from London to keep Italian blast furnaces burning. Immediate effect: Triggers the British Coal event and grants 25 Political Power."
 ITA_ww1_british_friendship:0 "British Friendship"
 ITA_ww1_british_friendship_desc:0 "Immediate effect: Reaffirming the historic Mediterranean amity linking Rome with the Admiralty in London. Immediate effect: Triggers the British Friendship event and grants 20 Political Power."
 ITA_ww1_budget_balancing:0 "Balance the Budget"
 ITA_ww1_budget_balancing_desc:0 "Immediate effect: De Stefani's fiscal consolidation curbs public debt and restores investor confidence in the lira. Immediate effect: Grants 50 Political Power and reduces Social Tension by 5."
 ITA_ww1_cadorna_chief_of_staff:0 "Cadorna Takes the Staff"
 ITA_ww1_cadorna_chief_of_staff_desc:0 "Immediate effect: General Luigi Cadorna becomes Chief of Staff; imposes rigid offensive discipline (+15 army XP).\n\nLuigi Cadorna imposes unbending central control over division commanders, preparing strict offensive plans aimed directly toward Ljubljana and Vienna."
 ITA_ww1_capital_ship_modernisation:0 "Capital Ship Modernisation"
 ITA_ww1_capital_ship_modernisation_desc:0 "Immediate effect: Refits existing dreadnoughts with upgraded boilers, fire-control towers, and anti-aircraft guns (+20 navy XP).\n\nModernising Conte di Cavour and Andrea Doria classes to maintain operational readiness within Washington treaty limits."
 ITA_ww1_caporetto:0 "Caporetto"
 ITA_ww1_caporetto_desc:0 "Immediate effect: Weathering the catastrophic breakthrough of German infiltration divisions at Caporetto. Immediate effect: Triggers the Caporetto Crisis event and costs 20 Political Power."
 ITA_ww1_caporetto_inquiry:0 "The Caporetto Inquiry"
 ITA_ww1_caporetto_inquiry_desc:0 "Immediate effect: A solemn parliamentary inquest investigates the command failures and logistical breakdown of the 12th Battle of the Isonzo. Immediate effect: Triggers the Caporetto Commission event and grants 20 Political Power."
 ITA_ww1_caproni_bombers:0 "The Caproni Bombers"
 ITA_ww1_caproni_bombers_desc:0 "Immediate effect: Adopts Giovanni Caproni's massive three-engine heavy bombers (Ca.1 and Ca.3); bomber tech bonus (25%).\n\nPioneering heavy multi-engine strategic aviation, capable of carrying half a ton of bombs deep into Austrian rear areas."
 ITA_ww1_carabinieri_reinforcement:0 "Reinforce the Carabinieri"
 ITA_ww1_carabinieri_reinforcement_desc:0 "Immediate effect: Expands the Arma dei Carabinieri to police rural and urban unrest (+3% stability).\n\nStrengthening mobile legions of the royal gendarmerie to maintain public order amid postwar strike waves and ideological clashes."
 ITA_ww1_catholic_social_action:0 "Catholic Social Action"
 ITA_ww1_catholic_social_action_desc:0 "Immediate effect: Catholic agrarian cooperatives and rural savings banks support smallholders in the countryside. Immediate effect: Triggers the Catholic Social Action event and reduces the Southern Gap by 5."
 ITA_ww1_cavour_class:0 "The Cavour-Class Battleships"
 ITA_ww1_cavour_class_desc:0 "Immediate effect: Lays down dreadnoughts Conte di Cavour, Giulio Cesare, and Leonardo da Vinci (+15 navy XP).\n\nArmed with thirteen 305mm guns arranged in innovative triple and twin center-line turrets, these dreadnoughts form the pride of the battle fleet."
 ITA_ww1_central_adriatic_fleet:0 "The Combined Adriatic Fleet"
 ITA_ww1_central_adriatic_fleet_desc:0 "Immediate effect: Uniting the Italian and Austro-Hungarian battle fleets to contest Allied control of the Mediterranean. Immediate effect: Grants 20 Navy Experience and 20 Political Power."
 ITA_ww1_central_concessions_accord:0 "Accept Vienna's Concessions"
 ITA_ww1_central_concessions_accord_desc:0 "Immediate effect: Accepting Vienna's verified pledge to cede the Trentino upon the conclusion of general peace. Immediate effect: Triggers the Austrian Concessions Response event and grants 30 Political Power."
 ITA_ww1_central_joint_command:0 "Joint Command with Vienna"
 ITA_ww1_central_joint_command_desc:0 "Immediate effect: Establishing staff coordination and intelligence sharing with the German and Austrian commands. Immediate effect: Grants 20 Army Experience and 20 Political Power."
 ITA_ww1_central_powers_betrayal:0 "Triple Alliance Betrayal"
 ITA_ww1_central_powers_entry:0 "Enter the War Beside Berlin and Vienna"
 ITA_ww1_central_powers_entry_desc:0 "Immediate effect: Honoring the alliance and entering the war alongside the Central Powers against France. Immediate effect: Grants +3% War Support and declares war on France."
 ITA_ww1_christmas_of_blood:0 "The Christmas of Blood"
 ITA_ww1_christmas_of_blood_desc:0 "Immediate effect: The Italian navy bombards D'Annunzio's palace in Fiume, restoring legal compliance with the Treaty of Rapallo. Immediate effect: Triggers the Natale di Sangue event and grants 30 Political Power."
 ITA_ww1_combatants_opera:0 "National Veterans' Organisation"
 ITA_ww1_combatants_opera_desc:0 "Immediate effect: The Opera Nazionale Combattenti assists returning veterans with vocational training, credit, and settlement land. Immediate effect: Activates the Opera Nazionale Combattenti idea and grants 25 Political Power."
 ITA_ww1_commission_caproni_heavy_bombers:0 "Commission Caproni Heavy Bombers"
 ITA_ww1_commission_caproni_heavy_bombers_desc:0 "Accelerate delivery of three-engine bombers."
 ITA_ww1_constitutional_reform:0 "Constitutional Reform"
 ITA_ww1_constitutional_reform_desc:0 "Immediate effect: Strengthening parliamentary prerogatives and modernizing administrative structures under the Statuto Albertino. Immediate effect: Grants +2% Stability and 35 Political Power."
 ITA_ww1_contain_socialist_agitation:0 "Contain Socialist Agitation"
 ITA_ww1_contain_socialist_agitation_desc:0 "Focused police measures targeting radical strike leaders."
 ITA_ww1_continued_neutrality:0 "Maintain Neutrality"
 ITA_ww1_continued_neutrality_desc:0 "Immediate effect: Definitive commitment to maintain Italian neutrality throughout the Great War. Immediate effect: Grants 50 Political Power and reduces Interventionism by 20."
 ITA_ww1_corfu_incident:0 "The Corfu Incident"
 ITA_ww1_corfu_incident_desc:0 "Immediate effect: Bombarding and occupying Corfu following the murder of General Tellini on the Greek frontier. Immediate effect: Triggers the Corfu Crisis event and grants 25 Political Power."
 ITA_ww1_cyrenaica_pacification:0 "Pacify Cyrenaica"
 ITA_ww1_cyrenaica_pacification_desc:0 "Immediate effect: Reaching administrative accords with local tribal sheikhs and Senussi leaders in Cyrenaica. Immediate effect: Grants 10 Army Experience and lowers Social Tension by 5."
 ITA_ww1_dalmatian_claims:0 "The Dalmatian Claims"
 ITA_ww1_dalmatian_claims_desc:0 "Immediate effect: Maintaining Italian claims over Zara, Sebenico, and the offshore Dalmatian islands. Immediate effect: Raises Irredentism by 10 and grants 25 Political Power."
 ITA_ww1_declare_neutrality:0 "Declare Neutrality"
 ITA_ww1_declare_neutrality_desc:0 "Immediate effect: Declaring that the defensive clauses of the Triple Alliance do not apply to Austria's offensive war. Immediate effect: Triggers the Declaration of Neutrality event and grants 35 Political Power."
 ITA_ww1_declare_war_on_austria:0 "War on Austria-Hungary"
 ITA_ww1_declare_war_on_austria_desc:0 "Immediate effect: Serving the formal declaration of war against the Austro-Hungarian Empire on May 23, 1915. Immediate effect: Grants +4% War Support and triggers the Declaration of War on Austria event."
 ITA_ww1_declare_war_on_germany:0 "War on Germany"
 ITA_ww1_declare_war_on_germany_desc:0 "Immediate effect: Extending the state of war to the German Empire to cement full alliance with the Western Powers. Immediate effect: Triggers the Declaration of War on Germany event and grants 20 Political Power."
 ITA_ww1_denounce_triple_alliance:0 "Denounce the Triple Alliance"
 ITA_ww1_denounce_triple_alliance_desc:0 "Immediate effect: Formally abrogating the 1882 treaty of alliance with Germany and Austria-Hungary. Immediate effect: Triggers the Alliance Denunciation event and grants 25 Political Power."
 ITA_ww1_diaz_takes_command:0 "Diaz Takes Command"
 ITA_ww1_diaz_takes_command_desc:0 "Immediate effect: General Armando Diaz replaces Cadorna; boosts army morale by +15 and grants Humane Leadership idea.\n\nArmando Diaz abolishes summary decimation executions, improves soldier rations, grants regular home leave, and prioritises defensive preservation of lives."
 ITA_ww1_diplomatic_initiatives_category:0 "Diplomatic Initiatives"
 ITA_ww1_diplomatic_initiatives_category_desc:0 "Conduct of foreign relations and compensation accords."
 ITA_ww1_diplomatic_pressure_tripoli:0 "Diplomatic Pressure on Tripoli"
 ITA_ww1_diplomatic_pressure_tripoli_desc:0 "Dispatch formal diplomatic terms to the Porte proposing a Libyan accord."
 ITA_ww1_discount_bank_crisis:0 "The Discount Bank Crisis"
 ITA_ww1_discount_bank_crisis_desc:0 "Immediate effect: The insolvency of the Banca Italiana di Sconto threatens the liquidity of Ansaldo and heavy industry. Immediate effect: Triggers the Discount Bank Crisis event and costs 20 Political Power."
 ITA_ww1_dismounted_cavalry:0 "Dismounted Cavalry"
 ITA_ww1_dismounted_cavalry_desc:0 "Immediate effect: Dismounts elite cavalry regiments to serve as heavy trench assault infantry (+10 army XP).\n\nPrestigious regiments like Genova Cavalleria and Lancieri di Novara fight dismounted on the Carso with carbines and bayonets."
 ITA_ww1_divided_public_opinion:0 "Divided Public Opinion"
 ITA_ww1_divided_public_opinion_desc:0 "The country is split between moderate neutralists and interventionist rallies."
 ITA_ww1_dodecanese_occupation:0 "Occupy the Dodecanese"
 ITA_ww1_dodecanese_occupation_desc:0 "Immediate effect: Naval operations occupy Rhodes and the Aegean Dodecanese archipelago as a strategic pledge. Immediate effect: Grants 15 Navy Experience and raises Irredentism by 5."
 ITA_ww1_economic_mobilisation_category:0 "Economic Mobilisation"
 ITA_ww1_economic_mobilisation_category_desc:0 "Mezzogiorno development and war production."
 ITA_ww1_elastic_defence:0 "Elastic Defence"
 ITA_ww1_elastic_defence_desc:0 "Immediate effect: Adopts defense-in-depth on the Piave River; grants +15 army XP and Defense in Depth idea.\n\nReplacing rigid trench lines with layered outpost zones, machine-gun nests, and pre-sighted artillery killing zones on the Montello."
 ITA_ww1_emergency_police_decrees:0 "Emergency Police Decrees"
 ITA_ww1_emergency_police_decrees_desc:0 "Extraordinary powers to secure wartime internal order."
 ITA_ww1_emigrant_remittances:0 "Emigrant Remittances"
 ITA_ww1_emigrant_remittances_desc:0 "Immediate effect: Harnessing millions of lire sent home by Italian emigrants across North and South America. Immediate effect: Triggers the Emigrant Remittances event and narrows the Southern Gap by 5."
 ITA_ww1_entente_overtures:0 "Overtures to the Entente"
 ITA_ww1_entente_overtures_desc:0 "Immediate effect: Secret diplomatic channels open in London to ascertain what territories the Entente will offer. Immediate effect: Increases Interventionism by 15 and grants 25 Political Power."
 ITA_ww1_expand_ansaldo_artillery_works:0 "Expand Ansaldo Artillery Works"
 ITA_ww1_expand_ansaldo_artillery_works_desc:0 "Capital investment in artillery assembly lines in Genoa."
 ITA_ww1_expand_taranto_naval_arsenal:0 "Expand Taranto Naval Arsenal"
 ITA_ww1_expand_taranto_naval_arsenal_desc:0 "Additional dry docks for dreadnought repairs."
 ITA_ww1_facta_coalition:0 "The Facta Coalition"
 ITA_ww1_facta_coalition_desc:0 "Immediate effect: Luigi Facta presides over an indecisive liberal coalition struggling to curb escalating squadrist violence. Immediate effect: Grants 35 Political Power and lowers Social Tension by 5."
 ITA_ww1_factory_occupations:0 "The Factory Occupations"
 ITA_ww1_factory_occupations_desc:0 "Immediate effect: Over 400,000 metalworkers hoist red and black flags over northern industrial plants, establishing workers' councils. Immediate effect: Triggers the Factory Occupations event and raises Social Tension by 10."
 ITA_ww1_fasci_di_combattimento:0 "The Combat Leagues"
 ITA_ww1_fasci_di_combattimento_desc:0 "Immediate effect: Mussolini gathers war veterans, syndicalists, and Arditi in Milan's Piazza San Sepolcro to launch the Fasci. Immediate effect: Raises Social Tension by 5 and grants 20 Political Power."
 ITA_ww1_fast_cruisers:0 "Fast Scout Cruisers"
 ITA_ww1_fast_cruisers_desc:0 "Immediate effect: Builds fast light cruisers Nino Bixio and Marsala; light cruiser tech bonus (25%).\n\nHigh-speed scouts capable of 27 knots to locate enemy sorties in the narrow waters of the Adriatic Sea."
 ITA_ww1_fiat_lorry_expansion:0 "FIAT Lorry Expansion"
 ITA_ww1_fiat_lorry_expansion_desc:0 "Mass production of military trucks in Turin."
 ITA_ww1_fighter_squadrons:0 "Fighter Squadrons"
 ITA_ww1_fighter_squadrons_desc:0 "Immediate effect: Organises dedicated fighter squadrons (Squadriglie da Caccia) armed with synchronized machine guns.\n\nPupils trained in air deflection shooting fly French Nieuport and SPAD scouts to sweep Austrian reconnaissance craft from the skies."
 ITA_ww1_first_aerial_bombing:0 "The First Aerial Bombing"
 ITA_ww1_first_aerial_bombing_desc:0 "Immediate effect: Lieutenant Giulio Gavotti conducts the world's first aerial bombardment dropping Cipelli grenades near Ain Zara. Immediate effect: Grants 15 Air Experience and a 25% Air Doctrine research bonus (1 use)."
 ITA_ww1_fiume_regency:0 "The Fiume Enterprise"
 ITA_ww1_fiume_regency_desc:0 "Immediate effect: Gabriele D'Annunzio leads mutinous legionaries into Fiume, defying the Allied supreme council. Immediate effect: Triggers the Fiume Occupation event and grants 25 Political Power."
 ITA_ww1_flotilla_warfare:0 "Flotilla Warfare"
 ITA_ww1_flotilla_warfare_desc:0 "Immediate effect: Focuses resources on light craft, submarines, and stealth torpedo boats (+15 navy XP).\n\nRejecting conventional line-of-battle clashes, Italy wages an insidious, aggressive war of ambushes in Dalmatian island channels."
 ITA_ww1_flying_boats:0 "Flying Boats"
 ITA_ww1_flying_boats_desc:0 "Immediate effect: Builds agile Macchi M.5 and M.7 fighter flying boats for Adriatic coastal defense (+15 air XP).\n\nSingle-seat flying boats based in Venice and Brindisi combat Austrian seaplanes and escort anti-submarine drifters."
 ITA_ww1_fortify_carso_plateau:0 "Fortify Carso Plateau"
 ITA_ww1_fortify_carso_plateau_desc:0 "Rock scarps and defensive caverns in Friuli."
 ITA_ww1_franco_italian_agreement:0 "Franco-Italian Understanding"
 ITA_ww1_franco_italian_agreement_desc:0 "Immediate effect: Bilateral assurances in Paris recognize reciprocal spheres in Tripolitania and Morocco. Immediate effect: Triggers the Franco-Italian Understanding event and grants 20 Political Power."
 ITA_ww1_free_trade_opening:0 "Open the Markets"
 ITA_ww1_free_trade_opening_desc:0 "Immediate effect: Lowering agricultural tariffs encourages southern citrus and olive exports. Immediate effect: Grants 30 Political Power and narrows the Southern Gap by 5."
 ITA_ww1_french_alpine_front:0 "The Alpine Front Against France"
 ITA_ww1_french_alpine_front_desc:0 "Immediate effect: Coordinating assault columns to pierce the French fortifications in the Maritime Alps. Immediate effect: Grants 20 Army Experience and raises Army Morale by 5."
 ITA_ww1_frontier_fortifications:0 "Frontier Fortifications"
 ITA_ww1_frontier_fortifications_desc:0 "Immediate effect: Builds armored steel gun turrets and bunkers across the Asiago and Tagliamento barriers.\n\nArming armored fortress complexes (Forte Verena, Forte Campomolon) with rotating steel cupolas to dominate alpine valleys."
 ITA_ww1_gas_defence:0 "Gas Defence"
 ITA_ww1_gas_defence_desc:0 "Immediate effect: Issues British-designed box respirators and Polyvalent masks to frontline divisions (+10 army XP).\n\nFollowing deadly Austrian chemical gas attacks on Mount San Michele, the army distributes effective respirators and decontamination gear."
 ITA_ww1_genoa_shipyards:0 "The Genoa Shipyards"
 ITA_ww1_genoa_shipyards_desc:0 "Immediate effect: Upgrading naval ways and marine engine workshops in the Gulf of Genoa. Immediate effect: Adds 1 building slot in Liguria (Genoa) and grants 10 Navy Experience."
 ITA_ww1_gentiloni_compact:0 "Gentiloni Compact"
 ITA_ww1_gentiloni_compact_desc:0 "Electoral accord with Catholics strengthens stability against radical currents."
 ITA_ww1_gentiloni_pact:0 "The Gentiloni Pact"
 ITA_ww1_gentiloni_pact_desc:0 "Immediate effect: An agreement between the Catholic Electoral Union and liberal candidates secures religious votes against the socialists. Immediate effect: Grants +2% Stability, 30 Political Power, and the Gentiloni Compact national idea."
 ITA_ww1_gentiloni_reconciliation:0 "Catholic Reconciliation"
 ITA_ww1_giolitti_ministry:0 "The Giolitti Ministry"
 ITA_ww1_giolitti_ministry_desc:0 "Immediate effect: Giovanni Giolitti's parliamentary mastery governs through shifting coalitions and pragmatic reform. Immediate effect: Grants 50 Political Power, establishes the Trasformismo political idea, and cools interventionist fervor by 5."
 ITA_ww1_giolitti_parecchio:0 "Giolitti's \"Parecchio\""
 ITA_ww1_giolitti_parecchio_desc:0 "Immediate effect: Giolitti insists Italy can obtain parecchio (a great deal) through patient negotiation with Austria without bloodshed. Immediate effect: Triggers the Parecchio event and grants 30 Political Power."
 ITA_ww1_gorizia:0 "The Capture of Gorizia"
 ITA_ww1_gorizia_desc:0 "Immediate effect: Capturing the city of Gorizia and storming the fortified heights of Monte Sabotino and Podgora. Immediate effect: Triggers the Capture of Gorizia event and grants 15 Army Experience."
 ITA_ww1_grain_requisition:0 "Grain Requisition"
 ITA_ww1_grain_requisition_desc:0 "Immediate effect: Mandatory agricultural quotas and state requisitions supply grain directly to front-line army depots. Immediate effect: Increases Social Tension by 10 and grants 25 Political Power."
 ITA_ww1_grant_universal_suffrage_amnesty:0 "Grant Universal Suffrage Amnesty"
 ITA_ww1_grant_universal_suffrage_amnesty_desc:0 "Relieves civil tension by pardoning minor electoral infractions."
 ITA_ww1_heavy_guns:0 "Heavy Guns"
 ITA_ww1_heavy_guns_desc:0 "Immediate effect: Contracts Ansaldo for 149mm and 210mm heavy siege howitzers; artillery bonus (25%).\n\nRealising that mountain forts and concrete caves require heavy ordnance to crack, the artillery directorate orders heavy siege batteries."
 ITA_ww1_honour_alliance:0 "Honour the Alliance"
 ITA_ww1_honour_alliance_desc:0 "Immediate effect: Mobilising immediately alongside Germany and Austria-Hungary against the Entente powers. Immediate effect: Grants 30 Political Power, +2% War Support, and solidifies ties with Germany."
 ITA_ww1_human_torpedoes:0 "The Human Torpedoes"
 ITA_ww1_human_torpedoes_desc:0 "Immediate effect: Special operations assault swimmers Paolucci and Rossetti sink the Austrian flagship Viribus Unitis at Pola.\n\nInventing the Mignatta steerable torpedo, daring naval divers infiltrate heavily mined enemy anchorages to attach limpet mines to enemy hulls."
 ITA_ww1_hydroelectric_power:0 "Alpine Hydroelectric Power"
 ITA_ww1_hydroelectric_power_desc:0 "Immediate effect: Harnessing Alpine river torrents for white coal (carbon bianco) electricity generation. Immediate effect: Adds 1 Infrastructure in Lombardy and grants a 25% Industrial research bonus (1 use)."
 ITA_ww1_ilva_steel_consortium:0 "The Steel Consortium"
 ITA_ww1_ilva_steel_consortium_desc:0 "Immediate effect: State-backed consolidation of steel blast furnaces at Bagnoli, Piombino, and Portoferraio. Immediate effect: Grants a 25% Industrial research bonus (1 use) and 20 Political Power."
 ITA_ww1_industrial_demobilisation:0 "Industrial Demobilisation"
 ITA_ww1_industrial_demobilisation_desc:0 "Immediate effect: Reconverting war factories to peacetime commercial manufacture triggers painful industrial restructuring. Immediate effect: Increases Social Tension by 10 and grants 25 Political Power."
 ITA_ww1_industrial_mobilisation_committee:0 "Industrial Mobilisation Committee"
 ITA_ww1_industrial_mobilisation_committee_desc:0 "Immediate effect: General Dallolio creates regional committees to subordinate civilian factories to military production. Immediate effect: Grants 30 Political Power and triggers the Industrial Mobilisation event."
 ITA_ww1_industrial_triangle:0 "The Industrial Triangle"
 ITA_ww1_industrial_triangle_desc:0 "Immediate effect: Consolidating the industrial core connecting Turin, Milan, and Genoa. Immediate effect: Grants a 25% Industrial research bonus (1 use) and 20 Political Power."
 ITA_ww1_inflation_management:0 "Manage Inflation"
 ITA_ww1_inflation_management_desc:0 "Immediate effect: Central bank currency stabilisation dampens run-away inflation following the end of hostilities. Immediate effect: Grants 35 Political Power and reduces Social Tension by 5."
 ITA_ww1_inland_oases_campaign:0 "The Inland Oases Campaign"
 ITA_ww1_inland_oases_campaign_desc:0 "Immediate effect: Securing key desert caravan junctions, fortified wells, and interior oases across Tripolitania. Immediate effect: Grants 15 Army Experience and 20 Political Power."
 ITA_ww1_insurance_institute:0 "National Insurance Institute"
 ITA_ww1_insurance_institute_desc:0 "Immediate effect: Establishing the Istituto Nazionale delle Assicurazioni to create a state life insurance monopoly and fund welfare. Immediate effect: Grants 25 Political Power and reduces Social Tension by 5."
 ITA_ww1_integrated_mezzogiorno:0 "Integrated Mezzogiorno"
 ITA_ww1_integrated_mezzogiorno_desc:0 "Investments and public works narrow the historic gap between North and South."
 ITA_ww1_internal_politics_category:0 "Internal Politics & Society"
 ITA_ww1_internal_politics_category_desc:0 "Management of social reforms and civil tension."
 ITA_ww1_interventionist_press:0 "The Interventionist Press"
 ITA_ww1_interventionist_press_desc:0 "Immediate effect: Major dailies such as Corriere della Sera rally bourgeois and intellectual circles behind the interventionist crusade. Immediate effect: Increases Interventionism by 10 and grants 20 Political Power."
 ITA_ww1_irredentist_fervor:0 "Irredentist Fervor"
 ITA_ww1_irredentist_fervor_desc:0 "Uncompromising demands for all historic lands dominate national discourse."
 ITA_ww1_isonzo_offensives:0 "The Isonzo Offensives"
 ITA_ww1_isonzo_offensives_desc:0 "Immediate effect: Launching successive massed assaults against Austro-Hungarian positions along the Isonzo river. Immediate effect: Grants 20 Army Experience and raises Army Morale by 5."
 ITA_ww1_isotta_engines:0 "Isotta Fraschini Engines"
 ITA_ww1_isotta_engines_desc:0 "Immediate effect: Mass-produces reliable 250hp Isotta Fraschini and FIAT A.12 in-line aircraft engines (25% air tech bonus).\n\nSupplying domestic aircraft manufacturers with high-altitude, liquid-cooled engines renowned for their endurance and power."
 ITA_ww1_labour_friction:0 "Labour Friction"
 ITA_ww1_labour_friction_desc:0 "Wage disputes and sporadic strikes affect factory throughput."
 ITA_ww1_land_for_soldiers:0 "Land for the Peasant-Soldiers"
 ITA_ww1_land_for_soldiers_desc:0 "Immediate effect: Public promises of post-war agrarian reform and land redistribution reassure the conscript infantry. Immediate effect: Increases Army Morale by 5 and triggers the Land for Soldiers event."
 ITA_ww1_land_reclamation:0 "Land Reclamation"
 ITA_ww1_land_reclamation_desc:0 "Immediate effect: Drainage and bonifica hydraulic schemes in the Pontine and Tuscan coastal marshes. Immediate effect: Adds 1 Infrastructure in Lazio (Rome) and narrows the Southern Gap by 5."
 ITA_ww1_latin_sisterhood:0 "Latin Sisterhood"
 ITA_ww1_legalitarian_strike:0 "The Legalitarian Strike"
 ITA_ww1_legalitarian_strike_desc:0 "Immediate effect: The anti-fascist Alleanza del Lavoro calls a nationwide general strike in defense of constitutional liberties. Immediate effect: Reduces Social Tension by 10 and costs 20 Political Power."
 ITA_ww1_liberal_restoration:0 "Liberal Restoration"
 ITA_ww1_liberal_restoration_desc:0 "Immediate effect: A concerted effort by constitutional liberals to preserve parliamentary democracy and legal order. Immediate effect: Grants 40 Political Power and lowers Social Tension by 5."
 ITA_ww1_libya_colonisation:0 "Settle the Fourth Shore"
 ITA_ww1_libya_colonisation_desc:0 "Immediate effect: Directing agrarian emigration to Libyan coastal settlements on the Quarta Sponda. Immediate effect: Adds 1 Infrastructure in Tripoli and raises Irredentism by 5."
 ITA_ww1_libya_lessons:0 "Lessons of the Libyan War"
 ITA_ww1_libya_lessons_desc:0 "Immediate effect: Incorporates North African tactical lessons; grants +10 army XP and infantry weapons tech bonus (25%).\n\nAnalysing logistics, desert march discipline, and field wireless telegraphy gathered during colonial operations in Tripoli and Cyrenaica."
 ITA_ww1_libyan_question:0 "The Libyan Question"
 ITA_ww1_libyan_question_desc:0 "Immediate effect: Revisiting Italy's claims over Tripolitania and Cyrenaica under international agreements. Immediate effect: Raises Irredentism by 5 and grants 25 Political Power."
 ITA_ww1_libyan_reconquest:0 "The Reconquest of Libya"
 ITA_ww1_libyan_reconquest_desc:0 "Immediate effect: Reasserting military dominance over interior desert tribes to consolidate the Fourth Shore. Immediate effect: Grants 15 Army Experience and raises Irredentism by 5."
 ITA_ww1_london_conference:0 "The London Conference"
 ITA_ww1_london_conference_desc:0 "Immediate effect: Ambassadors meet in London to delimit Albanian borders and neutralize the Adriatic entrance. Immediate effect: Triggers the London Conference event and grants 25 Political Power."
 ITA_ww1_machine_guns:0 "Machine-Gun Companies"
 ITA_ww1_machine_guns_desc:0 "Immediate effect: Adopts the Fiat-Revelli Modello 1914 water-cooled machine gun; infantry tech bonus (25%).\n\nEquipping every infantry regiment with dedicated automatic fire sections to lay defensive swathes across barbed-wire perimeters."
 ITA_ww1_march_on_rome:0 "The March on Rome"
 ITA_ww1_march_on_rome_desc:0 "Immediate effect: Four fascist quadrumvirs orchestrate armed columns marching on the capital, forcing the crown to concede power. Immediate effect: Triggers the March on Rome Crisis event and grants 30 Political Power."
 ITA_ww1_mas_boats:0 "The MAS Boats"
 ITA_ww1_mas_boats_desc:0 "Immediate effect: Builds Motobarca Armata SVAN (MAS) motor torpedo boats; naval doctrine bonus (25%).\n\nHigh-speed wooden motorboats armed with two torpedoes slip silently past harbor boom defenses, immortalized by D'Annunzio's motto 'Memento Audere Semper'."
 ITA_ww1_mas_stealth_patrols:0 "MAS Stealth Patrols"
 ITA_ww1_mas_stealth_patrols_desc:0 "Rapid torpedo incursions along the Adriatic coast."
 ITA_ww1_mediterranean_balance:0 "The Mediterranean Balance"
 ITA_ww1_mediterranean_balance_desc:0 "Immediate effect: Balancing continental obligations with maritime friendship toward London and Paris. Immediate effect: Grants 30 Political Power and improves relations with Great Britain."
 ITA_ww1_mediterranean_naval_cooperation:0 "Mediterranean Naval Cooperation"
 ITA_ww1_merchant_marine_subsidies:0 "Merchant Marine Subsidies"
 ITA_ww1_merchant_marine_subsidies_desc:0 "Immediate effect: State postal and navigation subsidies modernize Italian oceanic steamship lines. Immediate effect: Grants 15 Navy Experience and 20 Political Power."
 ITA_ww1_mezzogiorno_grain_subsidies:0 "Mezzogiorno Grain Subsidies"
 ITA_ww1_mezzogiorno_grain_subsidies_desc:0 "Agrarian credit for southern smallholders."
 ITA_ww1_mezzogiorno_programme:0 "The Mezzogiorno Programme"
 ITA_ww1_mezzogiorno_programme_desc:0 "Immediate effect: Special state investments, tax reliefs, and rural roads across Southern Italy. Immediate effect: Narrows the Southern Gap by 10 and grants 25 Political Power."
 ITA_ww1_milan_banking:0 "Milan Banking"
 ITA_ww1_milan_banking_desc:0 "Immediate effect: Banca Commerciale Italiana and Credito Italiano mobilize private capital for domestic manufacture. Immediate effect: Grants 40 Political Power and reduces Social Tension by 5."
 ITA_ww1_military_readiness_category:0 "Military & Naval Readiness"
 ITA_ww1_military_readiness_category_desc:0 "Preparation of the Regio Esercito and Regia Marina."
 ITA_ww1_motor_transport:0 "Motor Transport Corps"
 ITA_ww1_motor_transport_desc:0 "Immediate effect: Deploys tens of thousands of FIAT 18 BL military trucks; motorized equipment tech bonus (25%).\n\nAutomotive convoys supply mountain armies with munitions, moving entire divisions between Trentino and Piave within forty-eight hours."
 ITA_ww1_mountain_artillery:0 "Mountain Artillery"
 ITA_ww1_mountain_artillery_desc:0 "Immediate effect: Introduces pack-mule transportable 65mm mountain guns; adds Mountain Howitzers idea (+10 army XP).\n\nMule-carried 65/17 mountain guns can be dismantled into pack loads and carried up sheer dolomite precipices to support Alpini assaults."
 ITA_ww1_munitions_undersecretariat:0 "The Munitions Undersecretariat"
 ITA_ww1_munitions_undersecretariat_desc:0 "Immediate effect: A dedicated government undersecretariat centralizes shell and explosive procurement. Immediate effect: Grants a 25% Weapons research bonus (1 use) and 25 Political Power."
 ITA_ww1_mutilated_victory:0 "The Mutilated Victory"
 ITA_ww1_mutilated_victory_desc:0 "Immediate effect: Disappointment over Dalmatia and Fiume at Versailles gives birth to the bitter myth of the Vittoria Mutilata. Immediate effect: Triggers the Mutilated Victory event and raises Irredentism by 10."
 ITA_ww1_mutilated_victory_syndrome:0 "Mutilated Victory Syndrome"
 ITA_ww1_mutilated_victory_syndrome_desc:0 "Resentment over incomplete fulfillment of the London Pact at Versailles."
 ITA_ww1_national_party:0 "The National Party"
 ITA_ww1_national_party_desc:0 "Immediate effect: Transforming the dispersed combat leagues into the disciplined Partito Nazionale Fascista under Mussolini's central command. Immediate effect: Grants 30 Political Power and raises Irredentism by 5."
 ITA_ww1_nationalist_association:0 "The Nationalist Association"
 ITA_ww1_nationalist_association_desc:0 "Immediate effect: Corradini and Federzoni organise the Associazione Nazionalista Italiana, preaching imperial expansion and irredentism. Immediate effect: Increases Irredentism by 10 and grants 25 Political Power."
 ITA_ww1_nationalist_order:0 "The Nationalist Order"
 ITA_ww1_nationalist_order_desc:0 "Immediate effect: Landowners, industrialists, and middle classes embrace nationalist discipline to restore authority. Immediate effect: Grants 30 Political Power and increases Irredentism by 10."
 ITA_ww1_naval_convention_vienna:0 "Naval Convention with Vienna"
 ITA_ww1_naval_convention_vienna_desc:0 "Immediate effect: Negotiating operational cordons and signaling codes between the Regia Marina and the k.u.k. Kriegsmarine. Immediate effect: Grants 15 Navy Experience and improves naval relations with Austria-Hungary."
 ITA_ww1_naval_estimates:0 "The Naval Estimates"
 ITA_ww1_naval_estimates_desc:0 "Immediate effect: Approves the 1911 naval estimates; grants +10 navy XP and Regia Marina Cadres idea.\n\nAdmiral Bettolo and the naval ministry secure parliament's blessing for long-term construction programmes to match Austro-Hungarian naval expansion."
 ITA_ww1_negotiate_factory_arbitration:0 "Negotiate Factory Arbitration"
 ITA_ww1_negotiate_factory_arbitration_desc:0 "Mediation between unions and industrialists to avert stoppages."
 ITA_ww1_neutral_peace_conference:0 "Host a Neutral Peace Conference"
 ITA_ww1_neutral_peace_conference_desc:0 "Immediate effect: Inviting representatives of the warring factions to Rome for preliminary armistice negotiations. Immediate effect: Grants 50 Political Power and +2% Stability."
 ITA_ww1_neutralist_coalition:0 "The Neutralist Coalition"
 ITA_ww1_neutralist_coalition_desc:0 "Immediate effect: A parliamentary majority composed of Giolittian liberals, socialists, and Catholics organizes to preserve peace. Immediate effect: Reduces Interventionism by 15 and grants 40 Political Power."
 ITA_ww1_neutralist_predominance:0 "Neutralist Predominance"
 ITA_ww1_neutralist_predominance_desc:0 "The majority of parliament and the public favors peace and neutrality."
 ITA_ww1_nice_and_tunisia_claims:0 "Claims on Nice and Tunisia"
 ITA_ww1_nice_and_tunisia_claims_desc:0 "Immediate effect: Asserting historic Italian claims over Nice, Corsica, and the French protectorate of Tunisia. Immediate effect: Raises Irredentism by 15 and grants 25 Political Power."
 ITA_ww1_nitti_cabinet:0 "The Nitti Cabinet"
 ITA_ww1_nitti_cabinet_desc:0 "Immediate effect: Francesco Saverio Nitti takes power seeking fiscal retrenchment, demobilization, and social reconciliation. Immediate effect: Grants 30 Political Power and triggers the Nitti Cabinet event."
 ITA_ww1_north_east_mobilisation:0 "The North-East Mobilisation Plan"
 ITA_ww1_north_east_mobilisation_desc:0 "Immediate effect: Completes railway timetables concentrating the Regio Esercito on the Venetian plain (+15 army XP).\n\nOrganising seventy-two trains per day across the Po Valley to marshal four field armies on the Austrian border in under twenty days."
 ITA_ww1_offensive_doctrine:0 "The Offensive Doctrine"
 ITA_ww1_offensive_doctrine_desc:0 "Immediate effect: Cadorna's 'Red Booklet' preaches mass assault and offensive spirit (+15 army XP).\n\nThe General Staff's official tactical doctrine insists that sheer moral willpower and infantry bayonets will overcome enemy machine guns."
 ITA_ww1_offensive_pressure:0 "Sustained Offensive Pressure"
 ITA_ww1_offensive_pressure_desc:0 "Immediate effect: Mounts persistent probing assaults to exhaust enemy reserves (+15 army XP, +2% war support).\n\nMaintaining constant raids across river sandbars to keep the Austro-Hungarian command under perpetual tension and force early deployment of reserves."
 ITA_ww1_opera_nazionale_combattenti:0 "Opera Nazionale Combattenti"
 ITA_ww1_opera_nazionale_combattenti_desc:0 "State welfare institution for veteran assistance and reintegration."
 ITA_ww1_oppressed_nationalities_liaison:0 "Oppressed Nationalities Liaison"
 ITA_ww1_oppressed_nationalities_liaison_desc:0 "Liaison with Czech and South Slav national committees."
 ITA_ww1_oppressed_peoples_congress:0 "Congress of Oppressed Peoples"
 ITA_ww1_oppressed_peoples_congress_desc:0 "Immediate effect: Convening leaders of Czechs, Yugoslavs, Poles, and Romanians in Rome to undermine Habsburg cohesion. Immediate effect: Triggers the Oppressed Peoples Congress event and grants 25 Political Power."
 ITA_ww1_orlando_government:0 "The Orlando Government"
 ITA_ww1_orlando_government_desc:0 "Immediate effect: Vittorio Emanuele Orlando takes the helm with a single mandate: resistance on the Piave and total national mobilization. Immediate effect: Grants 40 Political Power and triggers the Orlando Government event."
 ITA_ww1_orlando_victory_cabinet:0 "Orlando National Resistance Cabinet"
 ITA_ww1_orlando_victory_cabinet_desc:0 "National determination government for final victory in the Great War."
 ITA_ww1_otranto_barrage:0 "The Otranto Barrage"
 ITA_ww1_otranto_barrage_desc:0 "Immediate effect: Installs submarine net barriers, hydrophones, and armed drifters across the Strait of Otranto.\n\nCooperating with British drifter trawlers, the barrage bottles up German and Austrian U-boats inside the Adriatic, preventing free egress into the Mediterranean."
 ITA_ww1_paris_delegation:0 "The Paris Delegation"
 ITA_ww1_paris_delegation_desc:0 "Immediate effect: Orlando and Sonnino present Italy's comprehensive territorial dossier at the Paris Peace Conference. Immediate effect: Triggers the Paris Delegation event and grants 30 Political Power."
 ITA_ww1_parliament_against_street:0 "Parliament Against the Street"
 ITA_ww1_parliament_against_street_desc:0 "Immediate effect: The neutralist parliamentary majority stands firm against patriotic street intimidation in Rome and Milan. Immediate effect: Grants 35 Political Power and increases Social Tension by 10."
 ITA_ww1_pci_workers_councils:0 "Workers' Factory Councils"
 ITA_ww1_pci_workers_councils_desc:0 "Workers take direct control of production management in occupied plants."
 ITA_ww1_piave_line:0 "The Piave Line"
 ITA_ww1_piave_line_desc:0 "Immediate effect: Rallying the shattered armies on the river Piave and Monte Grappa: 'Tutti eroi! O il Piave o tutti accoppati!'. Immediate effect: Triggers the Piave Line Stand event and raises Army Morale by 15."
 ITA_ww1_pilot_schools:0 "Pilot Schools"
 ITA_ww1_pilot_schools_desc:0 "Immediate effect: Establishes military aviation academies at Cascina Malpensa and Centocelle (+15 air XP).\n\nStandardising pilot training curricula, navigation, and aerobatics to graduate hundreds of qualified military fliers."
 ITA_ww1_popolo_ditalia:0 "A Newspaper for the War"
 ITA_ww1_popolo_ditalia_desc:0 "Immediate effect: Benito Mussolini launches Il Popolo d'Italia with French and industrial subsidies, calling for revolutionary war. Immediate effect: Triggers the Popolo d'Italia event and raises Interventionism by 5."
 ITA_ww1_popular_party:0 "The Italian People's Party"
 ITA_ww1_popular_party_desc:0 "Immediate effect: Don Luigi Sturzo founds the Partito Popolare Italiano, organizing Christian democracy into an independent force. Immediate effect: Triggers the Foundation of PPI event and grants 25 Political Power."
 ITA_ww1_postwar_army_reform:0 "Postwar Army Reform"
 ITA_ww1_postwar_army_reform_desc:0 "Immediate effect: General Badoglio reorganises the peacetime standing army into thirty modern divisions (+15 army XP).\n\nModernising artillery arsenals, retaining assault unit doctrines, and creating unified corps commands across the northern frontiers."
 ITA_ww1_postwar_fleet_review:0 "The Postwar Fleet Review"
 ITA_ww1_postwar_fleet_review_desc:0 "Immediate effect: Victorious fleet review off Venice celebrated by the King (+40 PP, +3% stability).\n\nThe dreadnoughts, scout cruisers, and decorated MAS flotillas assemble in the Venetian lagoon to celebrate total mastery of the Adriatic."
 ITA_ww1_price_controls:0 "Price Controls"
 ITA_ww1_price_controls_desc:0 "Immediate effect: Fixing ceiling prices on essential foodstuffs to protect urban working families from gouging. Immediate effect: Reduces Social Tension by 5 and grants 20 Political Power."
 ITA_ww1_propaganda_service:0 "The Propaganda Service"
 ITA_ww1_propaganda_service_desc:0 "Immediate effect: Servizio P deploys trench illustrators, writers, and lecturers to sustain morale in the Alpine trenches. Immediate effect: Activates the Servizio P Propaganda idea and triggers the Propaganda Service event."
 ITA_ww1_propaganda_service_spirit:0 "Servizio P Troop Morale"
 ITA_ww1_propaganda_service_spirit_desc:0 "Active propaganda and illustrated gazettes sustain the troops' spirit."
 ITA_ww1_propaganda_trench_newspapers:0 "Propaganda Trench Newspapers"
 ITA_ww1_propaganda_trench_newspapers_desc:0 "Patriotic illustrations to bolster soldier morale."
 ITA_ww1_proportional_representation:0 "Proportional Representation"
 ITA_ww1_proportional_representation_desc:0 "Immediate effect: Electoral reform introduces proportional representation, shattering old liberal patron-client networks. Immediate effect: Grants 25 Political Power and lowers Social Tension by 5."
 ITA_ww1_public_order_measures:0 "Restore Public Order"
 ITA_ww1_public_order_measures_desc:0 "Immediate effect: Deployment of military garrisons and Carabinieri patrols restores civil order without provoking widespread insurrection. Immediate effect: Grants 30 Political Power and triggers the Public Order Restoration event."
 ITA_ww1_public_works_programme:0 "Public Works Programme"
 ITA_ww1_public_works_programme_desc:0 "Immediate effect: State-funded road construction, port repairs, and electrification absorb demobilized workers. Immediate effect: Adds 1 Infrastructure in Campania (Naples) and reduces Social Tension by 10."
 ITA_ww1_quarto_rally:0 "The Quarto Speech"
 ITA_ww1_quarto_rally_desc:0 "Immediate effect: Gabriele D'Annunzio delivers an ecstatic patriotic address at Quarto, unleashing nationalist crowds onto the streets. Immediate effect: Grants +2% War Support, raises Interventionism by 15, and triggers the Quarto Rally event."
 ITA_ww1_radiant_fever:0 "Radiant Fever"
 ITA_ww1_radiant_fever_desc:0 "Patriotic crowds dominate public squares demanding the war of liberation."
 ITA_ww1_radiant_may:0 "The Radiant May"
 ITA_ww1_radiant_may_desc:0 "Immediate effect: The intense days of Maggio Radioso force the King and Parliament to reject neutralism and embrace war. Immediate effect: Grants +2% War Support, activates the Radiant May Fervor idea, and triggers the Radiant May event."
 ITA_ww1_radiant_may_fervor:0 "Radiant May Fervor"
 ITA_ww1_radiant_may_fervor_desc:0 "Enthusiastic popular mobilization for the cause of national liberation."
 ITA_ww1_ration_civilian_coal:0 "Ration Civilian Coal"
 ITA_ww1_ration_civilian_coal_desc:0 "Prioritize coal for blast furnaces and military railways."
 ITA_ww1_reassure_berlin_and_vienna:0 "Reassure Berlin and Vienna"
 ITA_ww1_reassure_berlin_and_vienna_desc:0 "Diplomatic talks to preserve the Triple Alliance."
 ITA_ww1_red_week:0 "Red Week"
 ITA_ww1_red_week_aftermath:0 "Red Week Aftermath"
 ITA_ww1_red_week_aftermath_desc:0 "Social tension and police distrust remain heightened following riots."
 ITA_ww1_red_week_desc:0 "Immediate effect: Violent riots and general strikes paralyze Romagna and the Marches following police shootings in Ancona. Immediate effect: Triggers the Red Week event and increases Social Tension by 15."
 ITA_ww1_refugee_relief:0 "Relief for the Refugees"
 ITA_ww1_refugee_relief_desc:0 "Immediate effect: Providing food, shelter, and medical care to over 400,000 citizens displaced by the Caporetto retreat. Immediate effect: Triggers the Venetian Refugee Relief event and grants 25 Political Power."
 ITA_ww1_renew_triple_alliance:0 "Renew the Triple Alliance"
 ITA_ww1_renew_triple_alliance_desc:0 "Immediate effect: Renewing the Triple Alliance treaty in December 1912 with explicit clauses on Mediterranean security. Immediate effect: Triggers the Renewal of the Triple Alliance event and grants 30 Political Power."
 ITA_ww1_repress_squadrist_violence:0 "Repress Squadrist Violence"
 ITA_ww1_repress_squadrist_violence_desc:0 "Disarm illegal armed squads and militias."
 ITA_ww1_reserve_officer_schools:0 "Reserve Officer Schools"
 ITA_ww1_reserve_officer_schools_desc:0 "Immediate effect: Trains thousands of young university and secondary school lieutenants (Sottotenenti di complemento).\n\nRapid training schools at Modena and Parma supply tens of thousands of enthusiastic junior officers to lead frontline platoons."
 ITA_ww1_revolutionary_ferment:0 "Revolutionary Ferment"
 ITA_ww1_revolutionary_ferment_desc:0 "Mass strikes and maximalist agitation paralyze industrial cities."
 ITA_ww1_riviera_offensive:0 "The Riviera Offensive"
 ITA_ww1_riviera_offensive_desc:0 "Immediate effect: Pushing mechanized and cavalry spearheads along the Mediterranean coast toward Nice and Cannes. Immediate effect: Grants 15 Army Experience and raises Irredentism by 10."
 ITA_ww1_sacro_egoismo:0 "Sacro Egoismo Doctrine"
 ITA_ww1_sacro_egoismo_desc:0 "Unconditional defense of Italian geopolitical interest above external pacts."
 ITA_ww1_sacro_egoismo_suspicion:0 "Suspicion over 'Sacro Egoismo'"
 ITA_ww1_saint_jean_de_maurienne:0 "Saint-Jean-de-Maurienne"
 ITA_ww1_saint_jean_de_maurienne_desc:0 "Immediate effect: Negotiating wartime territorial agreements over future zones of influence in Anatolia (Smyrna). Immediate effect: Triggers the Saint-Jean-de-Maurienne event and grants 25 Political Power."
 ITA_ww1_salandra_cabinet:0 "The Salandra Cabinet"
 ITA_ww1_salandra_cabinet_desc:0 "Immediate effect: Antonio Salandra assumes leadership of a conservative cabinet determined to pursue an assertive foreign policy. Immediate effect: Grants 35 Political Power and triggers the Salandra Cabinet event."
 ITA_ww1_salandra_emergency_cabinet:0 "Salandra Emergency Cabinet"
 ITA_ww1_salandra_emergency_cabinet_desc:0 "Conservative leadership focused on military readiness and armed intervention."
 ITA_ww1_salonika_contingent:0 "The Salonika Contingent"
 ITA_ww1_salonika_contingent_desc:0 "Immediate effect: Dispatching the 35th Infantry Division to join Allied operations on the Macedonian front. Immediate effect: Triggers the Salonika Contingent event and grants 10 Army Experience."
 ITA_ww1_sarajevo_crisis:0 "The July Crisis"
 ITA_ww1_sarajevo_crisis_desc:0 "Immediate effect: Austria-Hungary's ultimatum to Serbia triggers the crisis, giving Italy grounds to dispute unconsulted aggression. Immediate effect: Triggers the July Crisis event and grants 30 Political Power."
 ITA_ww1_secret_contacts_with_paris:0 "Secret Contacts with Paris"
 ITA_ww1_secret_contacts_with_paris_desc:0 "Discreet soundings with the French Foreign Ministry."
 ITA_ww1_shattered_discipline:0 "Shattered Discipline"
 ITA_ww1_shattered_discipline_desc:0 "The shock of defeats and military exhaustion shake the army's ranks."
 ITA_ww1_shortcut_dip:0 "Wing: Diplomacy & Alignment"
 ITA_ww1_shortcut_eco:0 "Wing: Economy & Mezzogiorno"
 ITA_ww1_shortcut_mil:0 "Wing: Armed Forces"
 ITA_ww1_shortcut_pol:0 "Wing: Politics & Society"
 ITA_ww1_shortcut_war:0 "Wing: Campaigns & Postwar"
 ITA_ww1_sicilian_sulphur:0 "Sicilian Sulphur"
 ITA_ww1_sicilian_sulphur_desc:0 "Immediate effect: Reorganizing the Sicilian sulphur syndicate to sustain chemical and gunpowder manufacture. Immediate effect: Adds 1 Infrastructure in Sicily and grants 20 Political Power."
 ITA_ww1_social_truce:0 "Social Truce"
 ITA_ww1_social_truce_desc:0 "Agreements between capital and labor secure social peace and productivity."
 ITA_ww1_socialist_congress:0 "Congress of Reggio Emilia"
 ITA_ww1_socialist_congress_desc:0 "Immediate effect: The Reggio Emilia Congress sees the maximalist wing expel reformists and elevate young Benito Mussolini to editor of Avanti!. Immediate effect: Increases Social Tension by 10, costs 15 Political Power, and triggers the Socialist Congress event."
 ITA_ww1_socialist_turn:0 "The Socialist Turn"
 ITA_ww1_socialist_turn_desc:0 "Immediate effect: The Italian labor movement takes an uncompromising revolutionary stance, rejecting bourgeois coalition governance. Immediate effect: Costs 25 Political Power and increases Social Tension by 15."
 ITA_ww1_solstice_battle:0 "The Battle of the Solstice"
 ITA_ww1_solstice_battle_desc:0 "Immediate effect: Repulsing the final massive Austro-Hungarian offensive across Montello and the lower Piave. Immediate effect: Grants +3% War Support and triggers the Battle of the Solstice event."
 ITA_ww1_southern_development_charter:0 "Southern Development Charter"
 ITA_ww1_southern_development_charter_desc:0 "Immediate effect: A comprehensive legislative charter guarantees permanent credit and infrastructure development for the Mezzogiorno. Immediate effect: Narrows the Southern Gap by 15 and grants +2% Stability."
 ITA_ww1_southern_disparity:0 "Southern Disparity"
 ITA_ww1_southern_disparity_desc:0 "Lack of infrastructure and emigration weigh heavily upon southern regions."
 ITA_ww1_southern_inquiry:0 "Inquiry into the South"
 ITA_ww1_southern_inquiry_desc:0 "Immediate effect: A formal parliamentary inquiry into agrarian backwardness and emigration across the Mezzogiorno. Immediate effect: Grants 30 Political Power and narrows the Southern Gap by 5."
 ITA_ww1_squadrist_mobilisation:0 "Mobilise the Squads"
 ITA_ww1_squadrist_mobilisation_desc:0 "Immediate effect: Blackshirt action squads systematically attack socialist printing presses, peasant leagues, and labor halls. Immediate effect: Activates the Squadrist Violence idea and grants 20 Political Power."
 ITA_ww1_squadrist_violence:0 "Squadrist Violence"
 ITA_ww1_squadrist_violence_desc:0 "Blackshirt punitive expeditions terrorize left-wing organizations."
 ITA_ww1_stoic_endurance:0 "Stoic Endurance"
 ITA_ww1_stoic_endurance_desc:0 "Soldiers endure extreme hardship in the mountains and trenches."
 ITA_ww1_strategic_bombing:0 "Strategic Bombing"
 ITA_ww1_strategic_bombing_desc:0 "Immediate effect: Implements Colonel Giulio Douhet's theories of independent strategic air power (+20 air XP).\n\nConcentrated Caproni bomber wings strike Austrian rail junctions, naval arsenals at Pola, and ammunition dumps in deep rear areas."
 ITA_ww1_subdued_claims:0 "Subdued Claims"
 ITA_ww1_subdued_claims_desc:0 "Diplomacy seeks peaceful accommodation and maritime trade preservation."
 ITA_ww1_submarine_programme:0 "The Submarine Programme"
 ITA_ww1_submarine_programme_desc:0 "Immediate effect: Adopts engineer Cesare Laurenti's double-hull submarine designs; submarine tech bonus (25%).\n\nBuilding coastal submarines (Medusa and Nautilus classes) possessing superior submerged stability and reserve buoyancy for Mediterranean operations."
 ITA_ww1_subsidise_catholic_schools:0 "Subsidise Catholic Schools"
 ITA_ww1_subsidise_catholic_schools_desc:0 "Strengthens cooperation with moderate Catholic voters."
 ITA_ww1_suffrage_law:0 "Universal Male Suffrage"
 ITA_ww1_suffrage_law_desc:0 "Immediate effect: Expanding the franchise to all literate males aged 21 and all males aged 30 transforms Italian democracy. Immediate effect: Grants +2% Stability, introduces Universal Male Suffrage, and lowers Social Tension by 5."
 ITA_ww1_supreme_war_council:0 "The Supreme War Council"
 ITA_ww1_supreme_war_council_desc:0 "Immediate effect: Creating the Allied Supreme War Council at Rapallo to coordinate coalition strategic planning. Immediate effect: Grants 15 Army Experience and 25 Political Power."
 ITA_ww1_sva_reconnaissance:0 "SVA Reconnaissance Aircraft"
 ITA_ww1_sva_reconnaissance_desc:0 "Immediate effect: Introduces the fast Ansaldo SVA.5 long-range reconnaissance biplane (25% air tech bonus).\n\nCapable of flying 140 mph with an unprecedented six-hour endurance, the SVA maps Austrian rail networks across the Alps."
 ITA_ww1_taranto_base:0 "The Taranto Base"
 ITA_ww1_taranto_base_desc:0 "Immediate effect: Expands the Mar Grande and Mar Piccolo docks at Taranto into Italy's premier dreadnought base.\n\nDredging navigation channels, building dry docks, and erecting coastal battery fortifications to shelter the primary battle fleet."
 ITA_ww1_tariff_protection:0 "Protective Tariffs"
 ITA_ww1_tariff_protection_desc:0 "Immediate effect: Shielding northern metallurgy and heavy engineering behind protective customs duties. Immediate effect: Grants 30 Political Power and raises Social Tension by 5."
 ITA_ww1_third_giolitti:0 "The Last Giolitti Ministry"
 ITA_ww1_third_giolitti_desc:0 "Immediate effect: The elderly statesman returns to the premiership, choosing neutrality and negotiation over military confrontation. Immediate effect: Grants 35 Political Power and reduces Social Tension by 10."
 ITA_ww1_torpedo_boats:0 "Torpedo Boat Flotillas"
 ITA_ww1_torpedo_boats_desc:0 "Immediate effect: Builds 3PN and Indomito-class high-speed torpedo destroyers; destroyer tech bonus (25%).\n\nFast, heavily armed flotilla craft capable of laying minefields and launching night torpedo attacks against Austrian capital ships."
 ITA_ww1_trade_union_recognition:0 "Recognise the Labour Confederation"
 ITA_ww1_trade_union_recognition_desc:0 "Immediate effect: Pragmatic arbitration recognises the Confederazione Generale del Lavoro as a legitimate bargaining partner. Immediate effect: Decreases Social Tension by 5 and grants 20 Political Power."
 ITA_ww1_train_alpini_mountain_battalions:0 "Train Alpini Mountain Battalions"
 ITA_ww1_train_alpini_mountain_battalions_desc:0 "Advanced training on glaciers and rock walls."
 ITA_ww1_trasformismo_politics:0 "Trasformismo Politics"
 ITA_ww1_trasformismo_politics_desc:0 "The political system is governed by continuous cross-faction compromise."
 ITA_ww1_treaty_of_london:0 "The Treaty of London"
 ITA_ww1_treaty_of_london_desc:0 "Immediate effect: Signing the secret Pact of London promising Trentino, South Tyrol, Trieste, Istria, and Dalmatia. Immediate effect: Grants +3% War Support and triggers the Treaty of London event."
 ITA_ww1_treaty_of_london_solidarity:0 "Treaty of London Solidarity"
 ITA_ww1_treaty_of_ouchy:0 "The Treaty of Ouchy"
 ITA_ww1_treaty_of_ouchy_desc:0 "Immediate effect: Signing the Treaty of Ouchy (First Treaty of Lausanne) confirming Italian sovereignty over Libya. Immediate effect: Triggers the Treaty of Ouchy ratification event and grants 30 Political Power."
 ITA_ww1_treaty_of_rapallo:0 "The Treaty of Rapallo"
 ITA_ww1_treaty_of_rapallo_desc:0 "Immediate effect: Signing the compromise frontier treaty with the Kingdom of Serbs, Croats, and Slovenes. Immediate effect: Triggers the Treaty of Rapallo event and grants +2% Stability."
 ITA_ww1_treaty_of_saint_germain:0 "The Treaty of Saint-Germain"
 ITA_ww1_treaty_of_saint_germain_desc:0 "Immediate effect: Ratifying the treaty that formalizes the dissolution of Austria-Hungary and cedes Trento and Trieste. Immediate effect: Triggers the Saint-Germain Ratification event and grants +2% Stability."
 ITA_ww1_trench_mortars:0 "Trench Mortars"
 ITA_ww1_trench_mortars_desc:0 "Immediate effect: Deploys heavy Bombarda 240mm and 58mm trench mortars to blast enemy wire; artillery bonus (25%).\n\nShort-range mortars lobbing heavy charges of high explosive lobbed directly into enemy trenches clear barbed-wire mazes on the Carso."
 ITA_ww1_trentino_defence:0 "Defend the Trentino"
 ITA_ww1_trentino_defence_desc:0 "Immediate effect: Halting the Austrian Strafexpedition in the high plateau of Asiago and Pasubio. Immediate effect: Grants 15 Army Experience and raises Army Morale by 5."
 ITA_ww1_trento_trieste_integration:0 "Integrate Trento and Trieste"
 ITA_ww1_trento_trieste_integration_desc:0 "Immediate effect: Full administrative, judicial, and linguistic integration of the redeemed provinces into the Kingdom of Italy. Immediate effect: Grants +3% Stability and satisfies Irredentism by 15."
 ITA_ww1_triple_alliance:0 "The Triple Alliance"
 ITA_ww1_triple_alliance_desc:0 "Immediate effect: Reviewing Italy's longstanding diplomatic commitments under the Triple Alliance with Berlin and Vienna. Immediate effect: Triggers the Triple Alliance Consultation event and grants 25 Political Power."
 ITA_ww1_tripoli_landing:0 "The Tripoli Landing"
 ITA_ww1_tripoli_landing_desc:0 "Immediate effect: Deploying naval detachments and marines to secure port facilities along the Libyan coastline. Immediate effect: Grants 10 Navy Experience and 10 Army Experience."
 ITA_ww1_tunisian_landing:0 "The Tunisian Landing"
 ITA_ww1_tunisian_landing_desc:0 "Immediate effect: Executing amphibious landings along the Tunisian coast to liberate Italian settlers in Tunis. Immediate effect: Grants 15 Navy Experience and 15 Army Experience."
 ITA_ww1_turin_motor_industry:0 "Turin and the Motor Industry"
 ITA_ww1_turin_motor_industry_desc:0 "Immediate effect: Expanding FIAT, Lancia, and SCAT automotive engineering facilities in Piedmont. Immediate effect: Adds 1 building slot in Piedmont (Turin) and grants 20 Political Power."
 ITA_ww1_ultimatum_to_the_porte:0 "Ultimatum to the Porte"
 ITA_ww1_ultimatum_to_the_porte_desc:0 "Immediate effect: Delivering diplomatic terms to the Sublime Porte demanding the transfer of administrative control over Libya. Immediate effect: Triggers the Ottoman Diplomatic Offer event and grants 30 Political Power."
 ITA_ww1_universal_suffrage:0 "Universal Male Suffrage"
 ITA_ww1_universal_suffrage_desc:0 "Expanded franchise incorporates millions of peasants and workers into civic life."
 ITA_ww1_unknown_soldier:0 "The Unknown Soldier"
 ITA_ww1_unknown_soldier_desc:0 "Immediate effect: Solemn entombment of the Unknown Soldier at the Altare della Patria in Rome unites the nation in reverence. Immediate effect: Triggers the Unknown Soldier event and grants 35 Political Power."
 ITA_ww1_unredeemed_lands_call:0 "Call of the Unredeemed Lands"
 ITA_ww1_unredeemed_lands_call_desc:0 "The cause of Trent and Trieste gains momentum in political debate."
 ITA_ww1_vatican_peace_note:0 "The Vatican Peace Note"
 ITA_ww1_vatican_peace_note_desc:0 "Immediate effect: Responding diplomatically to Pope Benedict XV's appeals to end the 'useless slaughter'. Immediate effect: Triggers the Vatican Peace Note event and grants 20 Political Power."
 ITA_ww1_vatican_reconciliation_talks:0 "Vatican Reconciliation Talks"
 ITA_ww1_vatican_reconciliation_talks_desc:0 "Institutional rapprochement between the Italian State and the Church."
 ITA_ww1_veteran_resettlement_parcels:0 "Veteran Resettlement Parcels"
 ITA_ww1_veteran_resettlement_parcels_desc:0 "Allotment of agricultural land to ex-combatants."
 ITA_ww1_veterans_land_settlement:0 "Veterans' Land Settlement"
 ITA_ww1_veterans_land_settlement_desc:0 "Immediate effect: Distributing reclaimed agricultural lands to demobilized peasant veterans in Apulia and Sardinia. Immediate effect: Narrows the Southern Gap by 10 and reduces Social Tension by 5."
 ITA_ww1_victorious_ardor:0 "Victorious Ardor"
 ITA_ww1_victorious_ardor_desc:0 "The enthusiasm of recent victories boosts morale and faith in command."
 ITA_ww1_vienna_compensation_talks:0 "Compensation Talks with Vienna"
 ITA_ww1_vienna_compensation_talks_desc:0 "Immediate effect: Diplomatic bargaining under Article VII demands the cession of Trentino in exchange for neutrality. Immediate effect: Triggers the Vienna Compensation Talks event and grants 25 Political Power."
 ITA_ww1_vienna_flight:0 "The Flight over Vienna"
 ITA_ww1_vienna_flight_desc:0 "Immediate effect: D'Annunzio's 87th Serenissima Squadron drops 400,000 tricolor leaflets over the Austrian capital (+40 PP).\n\nCovering seven hundred miles across high mountains without bombs, Italian fliers prove they can strike Vienna at will while showering citizens with peace manifestos."
 ITA_ww1_villa_giusti_armistice:0 "The Villa Giusti Armistice"
 ITA_ww1_villa_giusti_armistice_desc:0 "Immediate effect: Signing the armistice with defeated Austria-Hungary at Villa Giusti outside Padua on November 3, 1918. Immediate effect: Grants +3% Stability and triggers the Villa Giusti Armistice event."
 ITA_ww1_vittorio_veneto:0 "Vittorio Veneto"
 ITA_ww1_vittorio_veneto_desc:0 "Immediate effect: The decisive general offensive shattering the Austro-Hungarian lines and liberating Trento and Trieste. Immediate effect: Grants +3% War Support and triggers the Victory of Vittorio Veneto event."
 ITA_ww1_war_censorship:0 "Wartime Censorship Law"
 ITA_ww1_war_censorship_desc:0 "Immediate effect: Emergency wartime censorship suppresses defeatist propaganda and controls front-line reporting. Immediate effect: Grants 25 Political Power and triggers the War Censorship event."
 ITA_ww1_war_hydropower:0 "Hydropower for the War"
 ITA_ww1_war_hydropower_desc:0 "Immediate effect: Emergency electrification of Piedmontese and Lombard railway arteries reduces reliance on imported coal. Immediate effect: Adds 1 Infrastructure in Lombardy and grants a 25% Industrial research bonus (1 use)."
 ITA_ww1_war_loans:0 "National War Loans"
 ITA_ww1_war_loans_desc:0 "Immediate effect: Flotation of consecutive national war loans mobilizes domestic savings and civic duty. Immediate effect: Grants 50 Political Power and raises Social Tension by 5."
 ITA_ww1_war_of_position:0 "The War of Position"
 ITA_ww1_war_of_position_desc:0 "Immediate effect: Adopts methodical artillery preparation and deep entrenchment doctrine (+15 army XP, +2% stability).\n\nRejecting reckless bayonet charges, this doctrine mandates methodical artillery destruction before committing infantry to the assault."
 ITA_ww1_war_profiteers_inquiry:0 "The Profiteers' Inquiry"
 ITA_ww1_war_profiteers_inquiry_desc:0 "Immediate effect: Taxing windfall war profits (pescecani) recovers public revenue and soothes working-class fury. Immediate effect: Triggers the Profiteers' Inquiry event and grants 30 Political Power."
 ITA_ww1_washington_conference:0 "The Washington Conference"
 ITA_ww1_washington_conference_desc:0 "Immediate effect: Participating in international naval limitation talks and securing parity with France. Immediate effect: Triggers the Washington Conference event and grants 30 Political Power."
 ITA_ww1_wilsonian_conflict:0 "Wilson and the Adriatic"
 ITA_ww1_wilsonian_conflict_desc:0 "Immediate effect: Clashing with President Wilson's Fourteen Points over Italian claims in Dalmatia and Fiume. Immediate effect: Triggers the Wilsonian Conflict event and grants 25 Political Power."
 ITA_ww1_women_war_economy:0 "Women in the War Economy"
 ITA_ww1_women_war_economy_desc:0 "Immediate effect: Hundreds of thousands of women enter munitions plants, textile mills, and agricultural cooperatives. Immediate effect: Triggers the Female Labour Mobilisation event and grants 20 Political Power."
 ITA_ww1_workers_councils:0 "The Workers' Councils"
 ITA_ww1_workers_councils_desc:0 "Immediate effect: Gramsci and the Ordine Nuovo group organize elected factory councils to direct industrial production and political life. Immediate effect: Activates the Workers' Councils idea and grants 20 Political Power."
 ww1_italy.1.a:0 "Enact the comprehensive reform."
 ww1_italy.1.b:0 "Restrict concessions to literate voters."
 ww1_italy.1.d:0 "The expansion of male suffrage alters the balance of political forces."
 ww1_italy.1.t:0 "The Electoral Reform of 1912"
 ww1_italy.10.a:0 "Support interventionist agitation."
 ww1_italy.10.b:0 "Ignore the new publication."
 ww1_italy.10.d:0 "Mussolini breaks with socialist neutrality and launches a new daily."
 ww1_italy.10.t:0 "Il Popolo d'Italia Founded"
 ww1_italy.11.a:0 "Heed the call of the fatherland!"
 ww1_italy.11.b:0 "Restrain patriotic excesses."
 ww1_italy.11.d:0 "Gabriele D'Annunzio calls the Italian people to holy war."
 ww1_italy.11.t:0 "The Quarto Speech"
 ww1_italy.12.a:0 "Negotiate concessions with Vienna."
 ww1_italy.12.b:0 "The hour of diplomacy has passed!"
 ww1_italy.12.d:0 "Giolitti proposes securing Austrian concessions without bloodshed."
 ww1_italy.12.t:0 "Giolitti's 'Parecchio'"
 ww1_italy.13.a:0 "Forward, Italy! For the war of liberation!"
 ww1_italy.13.b:0 "Attempt to calm tempers in the squares."
 ww1_italy.13.d:0 "Impassioned crowds seize Rome and Milan demanding entry into war."
 ww1_italy.13.t:0 "The Radiant May"
 ww1_italy.14.a:0 "Enforce total preventive censorship."
 ww1_italy.14.b:0 "Permit moderate debates."
 ww1_italy.14.d:0 "Emergency decrees restrict front-line reports and criticisms of command."
 ww1_italy.14.t:0 "Wartime Press Censorship"
 ww1_italy.15.a:0 "Unite all national currents."
 ww1_italy.15.b:0 "Prioritize technical efficiency."
 ww1_italy.15.d:0 "Paolo Boselli assumes leadership of a patriotic coalition cabinet."
 ww1_italy.15.t:0 "Boselli's National Unity Cabinet"
 ww1_italy.16.a:0 "Expand childcare and worker assistance."
 ww1_italy.16.b:0 "Maintain temporary contracts."
 ww1_italy.16.d:0 "Thousands of female workers take positions in munitions plants."
 ww1_italy.16.t:0 "Women in Industrial Mobilisation"
 ww1_italy.17.a:0 "Invest in the infantry's morale."
 ww1_italy.17.b:0 "Redirect funds to munitions."
 ww1_italy.17.d:0 "Cultural campaigns and illustrated gazettes encourage the trenches."
 ww1_italy.17.t:0 "Servizio P Soldier Morale"
 ww1_italy.18.a:0 "Solemnly renew the pledge."
 ww1_italy.18.b:0 "Focus on immediate demands."
 ww1_italy.18.d:0 "The government pledges rural parcels to soldiers after victory."
 ww1_italy.18.t:0 "Promise of Land to Peasant-Soldiers"
 ww1_italy.19.a:0 "Punish negligence and restructure command."
 ww1_italy.19.b:0 "Concentrate efforts on the Piave front."
 ww1_italy.19.d:0 "Parliament investigates the military causes of the Isonzo disaster."
 ww1_italy.19.t:0 "Caporetto Commission of Inquiry"
 ww1_italy.2.a:0 "Establish the public monopoly."
 ww1_italy.2.b:0 "Permit private consortia."
 ww1_italy.2.d:0 "The foundation of INA consolidates public pensions and state credit."
 ww1_italy.2.t:0 "The National Insurance Institute"
 ww1_italy.20.a:0 "Resist to the last man!"
 ww1_italy.20.b:0 "Secure rear-area cohesion."
 ww1_italy.20.d:0 "Vittorio Emanuele Orlando proclaims unyielding resistance on the Piave."
 ww1_italy.20.t:0 "Orlando Resistance Cabinet"
 ww1_italy.21.a:0 "Demand full fulfillment of our lands!"
 ww1_italy.21.b:0 "Adopt diplomatic moderation."
 ww1_italy.21.d:0 "Nationalists decry the Allied refusal to fulfill the London Pact."
 ww1_italy.21.t:0 "Cry of the Mutilated Victory"
 ww1_italy.22.a:0 "Stabilize the economy and demobilise."
 ww1_italy.22.b:0 "Maintain active social spending."
 ww1_italy.22.d:0 "Francesco Saverio Nitti seeks fiscal balance and social order."
 ww1_italy.22.t:0 "Nitti Cabinet Takes Office"
 ww1_italy.23.a:0 "Welcome the new democratic party."
 ww1_italy.23.b:0 "Maintain scrutiny over its wings."
 ww1_italy.23.d:0 "Don Luigi Sturzo founds the Italian Christian Democratic Party."
 ww1_italy.23.t:0 "Foundation of the PPI"
 ww1_italy.24.a:0 "Seek peaceful mediation and agreement."
 ww1_italy.24.b:0 "Repress with public forces."
 ww1_italy.24.d:0 "Metalworkers occupy plants and raise management councils."
 ww1_italy.24.t:0 "Turin Factory Occupations"
 ww1_italy.25.a:0 "Avert civil war and appoint new leadership."
 ww1_italy.25.b:0 "Declare state of siege immediately."
 ww1_italy.25.d:0 "Blackshirt columns march on the capital demanding state power."
 ww1_italy.25.t:0 "March on Rome Crisis"
 ww1_italy.26.a:0 "Confirm defensive cooperation."
 ww1_italy.26.b:0 "Highlight our maritime interests."
 ww1_italy.26.d:0 "Diplomatic meeting in Rome reviews mutual defense clauses."
 ww1_italy.26.t:0 "Triple Alliance Consultation"
 ww1_italy.27.a:0 "Sign the treaty extension."
 ww1_italy.27.b:0 "Demand additional guarantees."
 ww1_italy.27.d:0 "The treaty with Germany and Austria-Hungary is formally extended."
 ww1_italy.27.t:0 "Renewal of the Triple Alliance"
 ww1_italy.28.a:0 "Sign naval gentlemen's agreement."
 ww1_italy.28.b:0 "Limit the scope of understandings."
 ww1_italy.28.d:0 "Secret talks ensure safety of Mediterranean sea lanes."
 ww1_italy.28.t:0 "Naval Entente with Great Britain"
 ww1_italy.29.a:0 "Seal Latin reconciliation."
 ww1_italy.29.b:0 "Maintain cautious stance."
 ww1_italy.29.d:0 "Diplomatic accord recognizes spheres in North Africa."
 ww1_italy.29.t:0 "Franco-Italian Understanding"
 ww1_italy.3.a:0 "Welcome patriotic fervor."
 ww1_italy.3.b:0 "Repudiate belligerent rhetoric."
 ww1_italy.3.d:0 "The ANI congress proclaims the imperative of imperial expansion."
 ww1_italy.3.t:0 "The Nationalist Congress in Florence"
 ww1_italy.30.a:0 "Secure Italian presence in Vlora."
 ww1_italy.30.b:0 "Negotiate compromise with Belgrade."
 ww1_italy.30.d:0 "Diplomatic tension over Albanian independence and borders."
 ww1_italy.30.t:0 "Albanian Adriatic Question"
 ww1_italy.31.a:0 "Accept British mediation."
 ww1_italy.31.b:0 "Demand strategic guarantees."
 ww1_italy.31.d:0 "Great powers deliberate on the Balkan settlement."
 ww1_italy.31.t:0 "London Conference on Balkans"
 ww1_italy.32.a:0 "Demand immediate formal compensations."
 ww1_italy.32.b:0 "Await the unfolding of events."
 ww1_italy.32.d:0 "Italy contests Austrian unilateral action in the Balkans."
 ww1_italy.32.t:0 "July Crisis and Article VII"
 ww1_italy.33.a:0 "Preserve the nation's peace."
 ww1_italy.33.b:0 "Initiate secret preparations for war."
 ww1_italy.33.d:0 "The government formally declares Italian neutrality in the conflict."
 ww1_italy.33.t:0 "Italian Declaration of Neutrality"
 ww1_italy.34.a:0 "Listen to proposals with reserve."
 ww1_italy.34.b:0 "Reject partial concessions."
 ww1_italy.34.d:0 "Berlin dispatches envoy to mediate Austrian territorial concessions."
 ww1_italy.34.t:0 "Von Bülow Mission in Rome"
 ww1_italy.35.a:0 "Compact sealed with the Entente!"
 ww1_italy.35.b:0 "Postpone formal ratification."
 ww1_italy.35.d:0 "Italy signs secret treaty with the Allies in Great Britain."
 ww1_italy.35.t:0 "Signing of the London Pact"
