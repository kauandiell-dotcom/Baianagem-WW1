 ww1_italy.18.t:0 "Promise of Land to Peasant-Soldiers"
 ww1_italy.19.a:0 "Punish negligence and restructure command."
 ww1_italy.19.b:0 "Concentrate efforts on the Piave front."
 ww1_italy.19.d:0 "Parliament investigates the military causes of the Isonzo disaster."
