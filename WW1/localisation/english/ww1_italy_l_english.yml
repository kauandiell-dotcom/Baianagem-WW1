 ww1_italy.16.a:0 "Expand childcare and worker assistance."
 ww1_italy.16.b:0 "Maintain temporary contracts."
 ww1_italy.16.d:0 "Thousands of female workers take positions in munitions plants."
 ww1_italy.16.t:0 "Women in Industrial Mobilisation"
 ww1_italy.17.a:0 "Invest in the infantry's morale."
 ww1_italy.17.b:0 "Redirect funds to munitions."
 ww1_italy.17.d:0 "Cultural campaigns and illustrated gazettes encourage the trenches."
 ww1_italy.17.t:0 "Servizio P Soldier Morale"
 ww1_italy.18.a:0 "Solemnly renew the pledge."
 ww1_italy.18.b:0 "Focus on immediate demands."
