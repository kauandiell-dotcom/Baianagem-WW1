 ww1_italy.2.b:0 "Permit private consortia."
 ww1_italy.2.d:0 "The foundation of INA consolidates public pensions and state credit."
 ww1_italy.2.t:0 "The National Insurance Institute"
 ww1_italy.20.a:0 "Resist to the last man!"
 ww1_italy.20.b:0 "Secure rear-area cohesion."
 ww1_italy.20.d:0 "Vittorio Emanuele Orlando proclaims unyielding resistance on the Piave."
