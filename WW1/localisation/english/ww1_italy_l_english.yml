l_english:
 ITA_ww1_ace_squadrons:0 "The Elite Squadrons"
 ITA_ww1_ace_squadrons_desc:0 "Major Francesco Baracca's 91st Squadron (Squadriglia degli Assi) achieves legendary renown. Decorated with the Prancing Horse emblem (Cavallino Rampante), Baracca, Ruffo di Calabria, and Piccio down dozens of enemy aircraft."
 ITA_ww1_acute_agrarian_crisis:0 "Acute Agrarian Crisis"
 ITA_ww1_acute_agrarian_crisis_desc:0 "Rural scarcity and population exodus disrupt the rural economy."
 ITA_ww1_adriatic_convoys:0 "Adriatic Convoys"
 ITA_ww1_adriatic_convoys_desc:0 "Safeguards transport convoys sustaining Italian garrisons in Albania and the Aegean. Moving over two hundred thousand Italian and Serbian soldiers across the Adriatic without losing a single major troopship."
 ITA_ww1_adriatic_dispute:0 "Adriatic Dispute"
 ITA_ww1_adriatic_naval_patrols:0 "Adriatic Naval Patrols"
 ITA_ww1_adriatic_naval_patrols_desc:0 "Naval demonstration between Brindisi and Venice."
 ITA_ww1_adriatic_naval_stations:0 "Adriatic Naval Stations"
 ITA_ww1_adriatic_naval_stations_desc:0 "Dispersed destroyer and torpedo pens at Venice and Brindisi dominating coastal waters."
 ITA_ww1_adriatic_patrol_network:0 "Adriatic Patrol Network"
 ITA_ww1_adriatic_patrol_network_desc:0 "Continuous coastal scouting preventing surprise hostile bombardments from Pola."
 ITA_ww1_adriatic_watch:0 "The Adriatic Watch"
 ITA_ww1_adriatic_watch_desc:0 "Deploys permanent surface patrols and sea mine barriers along the Italian east coast. Guarding the exposed Italian coastline against Austro-Hungarian shore bombardments from Pola and Cattaro."
 ITA_ww1_aero_engine_contracts:0 "Aero-Engine Contracts"
 ITA_ww1_aero_engine_contracts_desc:0 "State contracts with FIAT and Isotta Fraschini produce high-output aero-engines for military aviation."
 ITA_ww1_aeronautical_corps:0 "The Military Aeronautical Corps"
 ITA_ww1_aeronautical_corps_desc:0 "Founds the autonomous wartime air corps, replacing training schools. Forming independent observation, fighter, and heavy bombardment squadrons directly responsive to General Headquarters."
 ITA_ww1_air_autonomy_debate:0 "The Air Autonomy Debate"
 ITA_ww1_air_autonomy_debate_desc:0 "Establishes foundations for an independent Air Ministry, transitioning from wartime air corps. Establishing independent air budget lines, specialized test centers at Guidonia, and professional aeronautical officer careers."
 ITA_ww1_albanian_convoy_routes:0 "Albanian Sea Lifelines"
 ITA_ww1_albanian_convoy_routes_desc:0 "Flawless transport coordination sustaining Italian overseas armies across the straits."
 ITA_ww1_albanian_influence_rivalry:0 "Rivalry over Albania"
 ITA_ww1_albanian_protectorate:0 "The Albanian Protectorate"
 ITA_ww1_albanian_protectorate_desc:0 "General Ferrero proclaims the independence of Albania under the solemn protection of Italy at Gjirokastër."
 ITA_ww1_albanian_question:0 "The Albanian Question"
 ITA_ww1_albanian_question_desc:0 "Preventing any single foreign power from controlling the Strait of Otranto and Vlora."
 ITA_ww1_alpine_hydroelectric_dam:0 "Alpine Hydroelectric Dam"
 ITA_ww1_alpine_hydroelectric_dam_desc:0 "Electrical generation for Lombard industrial plants."
 ITA_ww1_alpini_expansion:0 "Expand the Alpini"
 ITA_ww1_alpini_expansion_desc:0 "Expands the legendary Alpini mountain regiments. Recruiting sturdy mountaineers from the Alpine valleys into autonomous ski battalions trained to fight amidst snow, ice, and dolomite crags."
 ITA_ww1_andrea_doria_class:0 "The Andrea Doria Class"
 ITA_ww1_andrea_doria_class_desc:0 "Constructs super-dreadnoughts Andrea Doria and Caio Duilio. Refining armor layout, deck protection, and secondary battery barbettes to withstand heavy Austro-Hungarian naval shells."
 ITA_ww1_ansaldo_expansion:0 "Expand the Ansaldo Works"
 ITA_ww1_ansaldo_expansion_desc:0 "Massive vertical expansion of the Perrone brothers' steel, shipbuilding, and artillery conglomerate."
 ITA_ww1_anti_submarine_patrols:0 "Anti-Submarine Patrols"
 ITA_ww1_anti_submarine_patrols_desc:0 "Deploys depth charges, flying boats, and towed hydrophones. Organizing integrated hunter-killer groups combining naval aircraft and fast sub-chasers to hunt Habsburg submarines."
 ITA_ww1_apulian_aqueduct:0 "The Apulian Aqueduct"
 ITA_ww1_apulian_aqueduct_desc:0 "Constructing the monumental Acquedotto Pugliese to bring drinking water to parched Apulian plains."
 ITA_ww1_apulian_aqueduct_expansion:0 "Apulian Aqueduct Expansion"
 ITA_ww1_apulian_aqueduct_expansion_desc:0 "Canalisation of drinking water to southern towns."
 ITA_ww1_arditi_assault_schools:0 "Arditi Assault Schools"
 ITA_ww1_arditi_assault_schools_desc:0 "Intensive training in hand-to-hand combat and infiltration."
 ITA_ww1_arditi_shock_raids:0 "Arditi Shock Raids"
 ITA_ww1_arditi_shock_raids_desc:0 "Deploy dagger-and-grenade Arditi shock platoons to storm Austrian forward outposts across the Piave."
 ITA_ww1_arditi_shock_troops:0 "Arditi Stormtrooper Units"
 ITA_ww1_arditi_shock_troops_desc:0 "Daring assault specialists trained in hand-to-hand combat, flamethrowers, and wire-cutting."
 ITA_ww1_armed_mediator:0 "Mediate for Peace"
 ITA_ww1_armed_mediator_desc:0 "Leveraging Italian armed neutrality to broker a negotiated peace between the warring coalitions."
 ITA_ww1_armed_neutrality_doctrine:0 "Armed Independence"
 ITA_ww1_armed_neutrality_doctrine_desc:0 "Formulating the doctrine of 'Sacro Egoismo' to prioritize strict national self-interest."
 ITA_ww1_army_budget_cuts:0 "Army Budget Cuts"
 ITA_ww1_army_budget_cuts_desc:0 "Replaces standing army expansion with Peacetime Fiscal Realism. Restricting annual conscription terms and mothballing heavy ordnance to rescue the national budget from catastrophic debt burdens."
 ITA_ww1_army_demobilisation:0 "Army Demobilisation"
 ITA_ww1_army_demobilisation_desc:0 "Removes wartime frontline combat doctrines, returns soldiers to civilian life. Returning soldiers to farming and industrial workshops while avoiding runaway postwar unemployment through phased release schedules."
 ITA_ww1_army_staff_reorganisation:0 "Reorganise the General Staff"
 ITA_ww1_army_staff_reorganisation_desc:0 "Reorganises staff sections under General Pollio. Restructuring operational planning, staff officer assignments, and railway mobilization schedules to modernize the Regio Esercito."
 ITA_ww1_artillery_modernisation:0 "Artillery Modernisation"
 ITA_ww1_artillery_modernisation_desc:0 "Constructs 1 arms factory in Terni (Tuscany). Replacing obsolete bronze cannons with quick-firing 75/27 Modello 1906 field guns equipped with modern recoil cylinders."
 ITA_ww1_assault_units:0 "Assault Units"
 ITA_ww1_assault_units_desc:0 "Constructs 1 arms factory in Lombardy. Armed with daggers, Thevenot hand grenades, and Villar Perosa submachine guns, black-flamed Arditi stormtroops spearhead trench assaults."
 ITA_ww1_aviators_battalion:0 "The Aviators' Battalion"
 ITA_ww1_aviators_battalion_desc:0 "Founds the Battaglione Aviatori under the Army Engineers. Formed at the Centocelle aerodrome near Rome, Italy's first military aviation unit trains pilots and tests early monoplanes."
 ITA_ww1_badoglio_standing_army:0 "Postwar Professional Army"
 ITA_ww1_badoglio_standing_army_desc:0 "A streamlined standing army preserving the hard-won operational doctrine of the Great War."
 ITA_ww1_bainsizza:0 "The Bainsizza Plateau"
 ITA_ww1_bainsizza_desc:0 "The heroic crossing of the Isonzo and conquest of the vast Austrian plateau of Bainsizza."
 ITA_ww1_balkan_league_crisis:0 "The Balkan League Crisis"
 ITA_ww1_balkan_league_crisis_desc:0 "Monitoring the rapid collapse of Ottoman authority across Macedonia and Thrace."
 ITA_ww1_bank_rescue_consortium:0 "Bank Rescue Consortium"
 ITA_ww1_bank_rescue_consortium_desc:0 "A state-orchestrated consortium stabilizes the banking sector and protects industrial accounts."
 ITA_ww1_baracca_ace_tradition:0 "The Prancing Horse Tradition"
 ITA_ww1_baracca_ace_tradition_desc:0 "Heroic fighter pilot spirit forged by Francesco Baracca and the Squadriglia degli Assi."
 ITA_ww1_battaglione_aviatori:0 "Battaglione Aviatori"
 ITA_ww1_battaglione_aviatori_desc:0 "Pioneering aviation military battalion testing early combat aircraft at Centocelle."
 ITA_ww1_battleship_fleet_in_being:0 "Fleet in Being"
 ITA_ww1_battleship_fleet_in_being_desc:0 "Preserves the primary dreadnought squadrons intact at Taranto. Admiral Thaon di Revel's doctrine avoids risking irreplaceable battleships against mines and submarines, pinning down the enemy through menacing potential power."
 ITA_ww1_biennio_rosso:0 "The Red Biennium"
 ITA_ww1_biennio_rosso_desc:0 "Two turbulent years of mass strikes, peasant land occupations, and bread price riots sweep Italy."
 ITA_ww1_biennio_rosso_strikes:0 "Biennio Rosso Strikes"
 ITA_ww1_biennio_rosso_strikes_desc:0 "Factory occupations and agrarian strikes destabilize the nation's social fabric."
 ITA_ww1_boselli_national_unity:0 "The Boselli National Unity Cabinet"
 ITA_ww1_boselli_national_unity_desc:0 "Paolo Boselli forms a broad coalition cabinet of national unity encompassing interventionists of all colors."
 ITA_ww1_bread_rationing:0 "Bread Rationing"
 ITA_ww1_bread_rationing_desc:0 "Instituting grain and bread rationing cards to manage dwindling wheat stocks during the conflict."
 ITA_ww1_brindisi_venice_bases:0 "Brindisi and Venice"
 ITA_ww1_brindisi_venice_bases_desc:0 "Constructs 1 dockyard in Veneto (Venetian Arsenal), adds Adriatic Naval Stations idea and +10 navy XP. Positioning fast flotillas and submarine pens at Brindisi to interdict the Otranto straits and at Venice to guard the northern lagoons."
 ITA_ww1_british_coal:0 "Secure British Coal"
 ITA_ww1_british_coal_desc:0 "Securing priority colliers and credit lines from London to keep Italian blast furnaces burning."
 ITA_ww1_british_friendship:0 "British Friendship"
 ITA_ww1_british_friendship_desc:0 "Reaffirming the historic Mediterranean amity linking Rome with the Admiralty in London."
 ITA_ww1_budget_balancing:0 "Balance the Budget"
 ITA_ww1_budget_balancing_desc:0 "De Stefani's fiscal consolidation curbs public debt and restores investor confidence in the lira."
 ITA_ww1_cadorna_chief_of_staff:0 "Cadorna Takes the Staff"
 ITA_ww1_cadorna_chief_of_staff_desc:0 "General Luigi Cadorna becomes Chief of Staff; imposes rigid offensive discipline. Luigi Cadorna imposes unbending central control over division commanders, preparing strict offensive plans aimed directly toward Ljubljana and Vienna."
 ITA_ww1_cadorna_discipline:0 "Cadornian Iron Discipline"
 ITA_ww1_cadorna_discipline_desc:0 "Unyielding offensive demands and draconian military discipline across all ranks."
 ITA_ww1_cadornian_offensive_cult:0 "The Cult of the Offensive"
 ITA_ww1_cadornian_offensive_cult_desc:0 "Faith in continuous frontal infantry assault to break through enemy defensive lines."
 ITA_ww1_capital_fleet_modernisation:0 "Capital Ship Modernisation"
 ITA_ww1_capital_fleet_modernisation_desc:0 "Continuous upgrades in armor, anti-aircraft guns, and propulsion preserving fleet power."
 ITA_ww1_capital_ship_modernisation:0 "Capital Ship Modernisation"
 ITA_ww1_capital_ship_modernisation_desc:0 "Modernises capital fleet for peacetime, replacing wartime doctrines. Modernising Conte di Cavour and Andrea Doria classes to maintain operational readiness within Washington treaty limits."
 ITA_ww1_caporetto:0 "Caporetto"
 ITA_ww1_caporetto_desc:0 "Weathering the catastrophic breakthrough of German infiltration divisions at Caporetto."
 ITA_ww1_caporetto_inquiry:0 "The Caporetto Inquiry"
 ITA_ww1_caporetto_inquiry_desc:0 "A solemn parliamentary inquest investigates the command failures and logistical breakdown of the 12th Battle of the Isonzo."
 ITA_ww1_caproni_bombers:0 "The Caproni Bombers"
 ITA_ww1_caproni_bombers_desc:0 "Adopts Giovanni Caproni's massive three-engine heavy bombers (Ca.1 and Ca.3); bomber tech bonus (25%). Pioneering heavy multi-engine strategic aviation, capable of carrying half a ton of bombs deep into Austrian rear areas."
 ITA_ww1_carabinieri_reinforcement:0 "Reinforce the Carabinieri"
 ITA_ww1_carabinieri_reinforcement_desc:0 "Expands the Arma dei Carabinieri to police rural and urban unrest. Strengthening mobile legions of the royal gendarmerie to maintain public order amid postwar strike waves and ideological clashes."
 ITA_ww1_catholic_social_action:0 "Catholic Social Action"
 ITA_ww1_catholic_social_action_desc:0 "Catholic agrarian cooperatives and rural savings banks support smallholders in the countryside."
 ITA_ww1_cavour_class:0 "The Cavour-Class Battleships"
 ITA_ww1_cavour_class_desc:0 "Lays down dreadnoughts Conte di Cavour, Giulio Cesare, and Leonardo da Vinci. Armed with thirteen 305mm guns arranged in innovative triple and twin center-line turrets, these dreadnoughts form the pride of the battle fleet."
 ITA_ww1_central_adriatic_fleet:0 "The Combined Adriatic Fleet"
 ITA_ww1_central_adriatic_fleet_desc:0 "Uniting the Italian and Austro-Hungarian battle fleets to contest Allied control of the Mediterranean."
 ITA_ww1_central_concessions_accord:0 "Accept Vienna's Concessions"
 ITA_ww1_central_concessions_accord_desc:0 "Accepting Vienna's verified pledge to cede the Trentino upon the conclusion of general peace."
 ITA_ww1_central_joint_command:0 "Joint Command with Vienna"
 ITA_ww1_central_joint_command_desc:0 "Establishing staff coordination and intelligence sharing with the German and Austrian commands."
 ITA_ww1_central_powers_betrayal:0 "Triple Alliance Betrayal"
 ITA_ww1_central_powers_entry:0 "Enter the War Beside Berlin and Vienna"
 ITA_ww1_central_powers_entry_desc:0 "Honoring the alliance and entering the war alongside the Central Powers against France."
 ITA_ww1_christmas_of_blood:0 "The Christmas of Blood"
 ITA_ww1_christmas_of_blood_desc:0 "The Italian navy bombards D'Annunzio's palace in Fiume, restoring legal compliance with the Treaty of Rapallo."
 ITA_ww1_combatants_opera:0 "National Veterans' Organisation"
 ITA_ww1_combatants_opera_desc:0 "The Opera Nazionale Combattenti assists returning veterans with vocational training, credit, and settlement land."
 ITA_ww1_commission_caproni_heavy_bombers:0 "Commission Caproni Heavy Bombers"
 ITA_ww1_commission_caproni_heavy_bombers_desc:0 "Accelerate delivery of three-engine bombers."
 ITA_ww1_complimentary_officer_academies:0 "Reserve Sublieutenants Corps"
 ITA_ww1_complimentary_officer_academies_desc:0 "Educated university youth stepping forward to command infantry platoons under fire."
 ITA_ww1_constitutional_reform:0 "Constitutional Reform"
 ITA_ww1_constitutional_reform_desc:0 "Strengthening parliamentary prerogatives and modernizing administrative structures under the Statuto Albertino."
 ITA_ww1_contain_socialist_agitation:0 "Contain Socialist Agitation"
 ITA_ww1_contain_socialist_agitation_desc:0 "Focused police measures targeting radical strike leaders."
 ITA_ww1_continued_neutrality:0 "Maintain Neutrality"
 ITA_ww1_continued_neutrality_desc:0 "Definitive commitment to maintain Italian neutrality throughout the Great War."
 ITA_ww1_continuous_offensive_pressure:0 "Aggressive River Probing"
 ITA_ww1_continuous_offensive_pressure_desc:0 "Constant raiding across river shallows wearing down Austro-Hungarian defensive reserves."
 ITA_ww1_corfu_incident:0 "The Corfu Incident"
 ITA_ww1_corfu_incident_desc:0 "Bombarding and occupying Corfu following the murder of General Tellini on the Greek frontier."
 ITA_ww1_corpo_aeronautico_militare:0 "Corpo Aeronautico Militare"
 ITA_ww1_corpo_aeronautico_militare_desc:0 "Autonomous air corps coordinating observation, fighter combat, and heavy bombardment."
 ITA_ww1_cyrenaica_pacification:0 "Pacify Cyrenaica"
 ITA_ww1_cyrenaica_pacification_desc:0 "Reaching administrative accords with local tribal sheikhs and Senussi leaders in Cyrenaica."
 ITA_ww1_dalmatian_claims:0 "The Dalmatian Claims"
 ITA_ww1_dalmatian_claims_desc:0 "Maintaining Italian claims over Zara, Sebenico, and the offshore Dalmatian islands."
 ITA_ww1_declare_neutrality:0 "Declare Neutrality"
 ITA_ww1_declare_neutrality_desc:0 "Declaring that the defensive clauses of the Triple Alliance do not apply to Austria's offensive war."
 ITA_ww1_declare_war_on_austria:0 "War on Austria-Hungary"
 ITA_ww1_declare_war_on_austria_desc:0 "Serving the formal declaration of war against the Austro-Hungarian Empire on May 23, 1915."
 ITA_ww1_declare_war_on_germany:0 "War on Germany"
 ITA_ww1_declare_war_on_germany_desc:0 "Extending the state of war to the German Empire to cement full alliance with the Western Powers."
 ITA_ww1_defence_in_depth_piave:0 "Piave Defense in Depth"
 ITA_ww1_defence_in_depth_piave_desc:0 "Layered defensive redoubts and pre-ranged artillery curtains shattering enemy bridgeheads."
 ITA_ww1_denounce_triple_alliance:0 "Denounce the Triple Alliance"
 ITA_ww1_denounce_triple_alliance_desc:0 "Formally abrogating the 1882 treaty of alliance with Germany and Austria-Hungary."
 ITA_ww1_diaz_humane_leadership:0 "Diaz Humane Leadership"
 ITA_ww1_diaz_humane_leadership_desc:0 "Compassionate commander prioritizing soldier welfare, decent rations, and defensive preservation."
 ITA_ww1_diaz_takes_command:0 "Diaz Takes Command"
 ITA_ww1_diaz_takes_command_desc:0 "General Armando Diaz replaces Cadorna; removes offensive cult, boosts army morale by +15 and grants Humane Leadership idea. Armando Diaz abolishes summary decimation executions, improves soldier rations."
 ITA_ww1_diplomatic_initiatives_category:0 "Diplomatic Initiatives"
 ITA_ww1_diplomatic_initiatives_category_desc:0 "Conduct of foreign relations and compensation accords."
 ITA_ww1_diplomatic_pressure_tripoli:0 "Diplomatic Pressure on Tripoli"
 ITA_ww1_diplomatic_pressure_tripoli_desc:0 "Dispatch formal diplomatic terms to the Porte proposing a Libyan accord."
 ITA_ww1_discount_bank_crisis:0 "The Discount Bank Crisis"
 ITA_ww1_discount_bank_crisis_desc:0 "The insolvency of the Banca Italiana di Sconto threatens the liquidity of Ansaldo and heavy industry."
 ITA_ww1_dismounted_cavalry:0 "Dismounted Cavalry"
 ITA_ww1_dismounted_cavalry_desc:0 "Dismounts elite cavalry regiments to serve as heavy trench assault infantry. Prestigious regiments like Genova Cavalleria and Lancieri di Novara fight dismounted on the Carso with carbines and bayonets."
 ITA_ww1_dismounted_cavalry_regiments:0 "Dismounted Cavalry Regiments"
 ITA_ww1_dismounted_cavalry_regiments_desc:0 "Elite cavalrymen reinforcing trench lines with disciplined carbine marksmanship."
 ITA_ww1_divided_public_opinion:0 "Divided Public Opinion"
 ITA_ww1_divided_public_opinion_desc:0 "The country is split between moderate neutralists and interventionist rallies."
 ITA_ww1_dodecanese_occupation:0 "Occupy the Dodecanese"
 ITA_ww1_dodecanese_occupation_desc:0 "Naval operations occupy Rhodes and the Aegean Dodecanese archipelago as a strategic pledge."
 ITA_ww1_douhet_air_doctrine:0 "Douhet Strategic Air Doctrine"
 ITA_ww1_douhet_air_doctrine_desc:0 "Independent strategic bombers destroying enemy industrial centers and communications."
 ITA_ww1_dreadnought_fleet_in_being:0 "Battle Fleet in Being"
 ITA_ww1_dreadnought_fleet_in_being_desc:0 "Intact dreadnought squadrons at Taranto dictating naval caution to all Mediterranean powers."
 ITA_ww1_economic_mobilisation_category:0 "Economic Mobilisation"
 ITA_ww1_economic_mobilisation_category_desc:0 "Mezzogiorno development and war production."
 ITA_ww1_elastic_defence:0 "Elastic Defence"
 ITA_ww1_elastic_defence_desc:0 "Evolves command doctrine into Defense in Depth on the Piave. Replacing rigid trench lines with layered outpost zones, machine-gun nests, and pre-sighted artillery killing zones on the Montello."
 ITA_ww1_emergency_grain_rationing:0 "Emergency Grain Rationing"
 ITA_ww1_emergency_grain_rationing_desc:0 "Distribute subsidised flour and cap bread prices to mitigate social agitation in Turin and Milan."
 ITA_ww1_emergency_police_decrees:0 "Emergency Police Decrees"
 ITA_ww1_emergency_police_decrees_desc:0 "Extraordinary powers to secure wartime internal order."
 ITA_ww1_emigrant_remittances:0 "Emigrant Remittances"
 ITA_ww1_emigrant_remittances_desc:0 "Harnessing millions of lire sent home by Italian emigrants across North and South America."
 ITA_ww1_entente_overtures:0 "Overtures to the Entente"
 ITA_ww1_entente_overtures_desc:0 "Secret diplomatic channels open in London to ascertain what territories the Entente will offer."
 ITA_ww1_expand_ansaldo_artillery_works:0 "Expand Ansaldo Artillery Works"
 ITA_ww1_expand_ansaldo_artillery_works_desc:0 "Capital investment in artillery assembly lines in Genoa."
 ITA_ww1_expand_taranto_naval_arsenal:0 "Expand Taranto Naval Arsenal"
 ITA_ww1_expand_taranto_naval_arsenal_desc:0 "Additional dry docks for dreadnought repairs."
 ITA_ww1_facta_coalition:0 "The Facta Coalition"
 ITA_ww1_facta_coalition_desc:0 "Luigi Facta presides over an indecisive liberal coalition struggling to curb escalating squadrist violence."
 ITA_ww1_factory_occupations:0 "The Factory Occupations"
 ITA_ww1_factory_occupations_desc:0 "Over 400,000 metalworkers hoist red and black flags over northern industrial plants, establishing workers' councils."
 ITA_ww1_fasci_di_combattimento:0 "The Combat Leagues"
 ITA_ww1_fasci_di_combattimento_desc:0 "Mussolini gathers war veterans, syndicalists, and Arditi in Milan's Piazza San Sepolcro to launch the Fasci."
 ITA_ww1_fast_cruisers:0 "Fast Scout Cruisers"
 ITA_ww1_fast_cruisers_desc:0 "Builds fast light cruisers Nino Bixio and Marsala; light cruiser tech bonus (25%). High-speed scouts capable of 27 knots to locate enemy sorties in the narrow waters of the Adriatic Sea."
 ITA_ww1_fiat_lorry_expansion:0 "FIAT Lorry Expansion"
 ITA_ww1_fiat_lorry_expansion_desc:0 "Mass production of military trucks in Turin."
 ITA_ww1_fighter_squadrons:0 "Fighter Squadrons"
 ITA_ww1_fighter_squadrons_desc:0 "Organises dedicated fighter squadrons (Squadriglie da Caccia) armed with synchronized machine guns. Pupils trained in air deflection shooting fly French Nieuport and SPAD scouts to sweep Austrian reconnaissance craft from the skies."
 ITA_ww1_first_aerial_bombing:0 "The First Aerial Bombing"
 ITA_ww1_first_aerial_bombing_desc:0 "Lieutenant Giulio Gavotti conducts the world's first aerial bombardment dropping Cipelli grenades near Ain Zara."
 ITA_ww1_fiume_regency:0 "The Fiume Enterprise"
 ITA_ww1_fiume_regency_desc:0 "Gabriele D'Annunzio leads mutinous legionaries into Fiume, defying the Allied supreme council."
 ITA_ww1_flotilla_warfare:0 "Flotilla Warfare"
 ITA_ww1_flotilla_warfare_desc:0 "Focuses resources on light craft, submarines, and stealth torpedo boats. Rejecting conventional line-of-battle clashes, Italy wages an insidious, aggressive war of ambushes in Dalmatian island channels."
 ITA_ww1_flying_boats:0 "Flying Boats"
 ITA_ww1_flying_boats_desc:0 "Builds agile Macchi M.5 and M.7 fighter flying boats for Adriatic coastal defense. Single-seat flying boats based in Venice and Brindisi combat Austrian seaplanes and escort anti-submarine drifters."
 ITA_ww1_fortify_carso_plateau:0 "Fortify Carso Plateau"
 ITA_ww1_fortify_carso_plateau_desc:0 "Rock scarps and defensive caverns in Friuli."
 ITA_ww1_franco_italian_agreement:0 "Franco-Italian Understanding"
 ITA_ww1_franco_italian_agreement_desc:0 "Bilateral assurances in Paris recognize reciprocal spheres in Tripolitania and Morocco."
 ITA_ww1_free_trade_opening:0 "Open the Markets"
 ITA_ww1_free_trade_opening_desc:0 "Lowering agricultural tariffs encourages southern citrus and olive exports."
 ITA_ww1_french_alpine_front:0 "The Alpine Front Against France"
 ITA_ww1_french_alpine_front_desc:0 "Coordinating assault columns to pierce the French fortifications in the Maritime Alps."
 ITA_ww1_frontier_fortifications:0 "Frontier Fortifications"
 ITA_ww1_frontier_fortifications_desc:0 "Builds 2 land forts in Veneto (Asiago) and 1 in Piedmont, adds Alpine Fortresses idea and +10 army XP. Arming armored fortress complexes (Forte Verena, Forte Campomolon) with rotating steel cupolas to dominate alpine valleys."
 ITA_ww1_frontier_fortress_belt:0 "Alpine Armoured Fortresses"
 ITA_ww1_frontier_fortress_belt_desc:0 "Steel cupolas and concrete fortresses sealing alpine passes against enemy advances."
 ITA_ww1_gas_defence:0 "Gas Defence"
 ITA_ww1_gas_defence_desc:0 "Issues British-designed box respirators and Polyvalent masks to frontline divisions. Following deadly Austrian chemical gas attacks on Mount San Michele, the army distributes effective respirators and decontamination gear."
 ITA_ww1_gas_respirators:0 "Trench Gas Protection"
 ITA_ww1_gas_respirators_desc:0 "Effective respirators and chemical decontamination units protecting frontline troops."
 ITA_ww1_general_staff_corps:0 "General Staff Planning"
 ITA_ww1_general_staff_corps_desc:0 "Structured operational planning sections coordinating army mobilization and supplies."
 ITA_ww1_genoa_shipyards:0 "The Genoa Shipyards"
 ITA_ww1_genoa_shipyards_desc:0 "Upgrading naval ways and marine engine workshops in the Gulf of Genoa."
 ITA_ww1_gentiloni_compact:0 "Gentiloni Compact"
 ITA_ww1_gentiloni_compact_desc:0 "Electoral accord with Catholics strengthens stability against radical currents."
 ITA_ww1_gentiloni_pact:0 "The Gentiloni Pact"
 ITA_ww1_gentiloni_pact_desc:0 "An agreement between the Catholic Electoral Union and liberal candidates secures religious votes against the socialists."
 ITA_ww1_gentiloni_reconciliation:0 "Catholic Reconciliation"
 ITA_ww1_giolitti_ministry:0 "The Giolitti Ministry"
 ITA_ww1_giolitti_ministry_desc:0 "Giovanni Giolitti's parliamentary mastery governs through shifting coalitions and pragmatic reform."
 ITA_ww1_giolitti_parecchio:0 "Giolitti's \"Parecchio\""
 ITA_ww1_giolitti_parecchio_desc:0 "Giolitti insists Italy can obtain parecchio (a great deal) through patient negotiation with Austria without bloodshed."
 ITA_ww1_gorizia:0 "The Capture of Gorizia"
 ITA_ww1_gorizia_desc:0 "Capturing the city of Gorizia and storming the fortified heights of Monte Sabotino and Podgora."
 ITA_ww1_grain_requisition:0 "Grain Requisition"
 ITA_ww1_grain_requisition_desc:0 "Mandatory agricultural quotas and state requisitions supply grain directly to front-line army depots."
 ITA_ww1_grant_universal_suffrage_amnesty:0 "Grant Universal Suffrage Amnesty"
 ITA_ww1_grant_universal_suffrage_amnesty_desc:0 "Relieves civil tension by pardoning minor electoral infractions."
 ITA_ww1_guerra_bianca_alpine_sapping:0 "White War Alpine Sapping"
 ITA_ww1_guerra_bianca_alpine_sapping_desc:0 "Drill mine tunnels through Dolomite glaciers to blow up Austrian mountain redoubts."
 ITA_ww1_heavy_guns:0 "Heavy Guns"
 ITA_ww1_heavy_guns_desc:0 "Constructs 1 arms factory in Genoa (Ansaldo). Realising that mountain forts and concrete caves require heavy ordnance to crack, the artillery directorate orders heavy siege batteries."
 ITA_ww1_honour_alliance:0 "Honour the Alliance"
 ITA_ww1_honour_alliance_desc:0 "Mobilising immediately alongside Germany and Austria-Hungary against the Entente powers."
 ITA_ww1_human_torpedoes:0 "The Human Torpedoes"
 ITA_ww1_human_torpedoes_desc:0 "Special operations assault swimmers Paolucci and Rossetti sink the Austrian flagship Viribus Unitis at Pola. Inventing the Mignatta steerable torpedo, daring naval divers infiltrate heavily mined enemy anchorages to attach limpet mines to enemy hulls."
 ITA_ww1_hydroelectric_power:0 "Alpine Hydroelectric Power"
 ITA_ww1_hydroelectric_power_desc:0 "Harnessing Alpine river torrents for white coal (carbon bianco) electricity generation."
 ITA_ww1_ilva_steel_consortium:0 "The Steel Consortium"
 ITA_ww1_ilva_steel_consortium_desc:0 "State-backed consolidation of steel blast furnaces at Bagnoli, Piombino, and Portoferraio."
 ITA_ww1_independent_air_force_charter:0 "Regia Aeronautica Foundations"
 ITA_ww1_independent_air_force_charter_desc:0 "Legislative charter creating an independent third armed service for the skies."
 ITA_ww1_industrial_demobilisation:0 "Industrial Demobilisation"
 ITA_ww1_industrial_demobilisation_desc:0 "Reconverting war factories to peacetime commercial manufacture triggers painful industrial restructuring."
 ITA_ww1_industrial_mobilisation_committee:0 "Industrial Mobilisation Committee"
 ITA_ww1_industrial_mobilisation_committee_desc:0 "General Dallolio creates regional committees to subordinate civilian factories to military production."
 ITA_ww1_industrial_triangle:0 "The Industrial Triangle"
 ITA_ww1_industrial_triangle_desc:0 "Consolidating the industrial core connecting Turin, Milan, and Genoa."
 ITA_ww1_inflation_management:0 "Manage Inflation"
 ITA_ww1_inflation_management_desc:0 "Central bank currency stabilisation dampens run-away inflation following the end of hostilities."
 ITA_ww1_inland_oases_campaign:0 "The Inland Oases Campaign"
 ITA_ww1_inland_oases_campaign_desc:0 "Securing key desert caravan junctions, fortified wells, and interior oases across Tripolitania."
 ITA_ww1_insidious_flotilla_doctrine:0 "Insidious Flotilla Warfare"
 ITA_ww1_insidious_flotilla_doctrine_desc:0 "Aggressive nighttime raids and concealed torpedo boat strikes in narrow island straits."
 ITA_ww1_insurance_institute:0 "National Insurance Institute"
 ITA_ww1_insurance_institute_desc:0 "Establishing the Istituto Nazionale delle Assicurazioni to create a state life insurance monopoly and fund welfare."
 ITA_ww1_integrated_mezzogiorno:0 "Integrated Mezzogiorno"
 ITA_ww1_integrated_mezzogiorno_desc:0 "Investments and public works narrow the historic gap between North and South."
 ITA_ww1_internal_politics_category:0 "Internal Politics & Society"
 ITA_ww1_internal_politics_category_desc:0 "Management of social reforms and civil tension."
 ITA_ww1_interventionist_press:0 "The Interventionist Press"
 ITA_ww1_interventionist_press_desc:0 "Major dailies such as Corriere della Sera rally bourgeois and intellectual circles behind the interventionist crusade."
 ITA_ww1_irredentist_fervor:0 "Irredentist Fervor"
 ITA_ww1_irredentist_fervor_desc:0 "Uncompromising demands for all historic lands dominate national discourse."
 ITA_ww1_isonzo_offensives:0 "The Isonzo Offensives"
 ITA_ww1_isonzo_offensives_desc:0 "Launching successive massed assaults against Austro-Hungarian positions along the Isonzo river."
 ITA_ww1_isotta_engines:0 "Isotta Fraschini Engines"
 ITA_ww1_isotta_engines_desc:0 "Mass-produces reliable 250hp Isotta Fraschini and FIAT A.12 in-line aircraft engines (25% air tech bonus). Supplying domestic aircraft manufacturers with high-altitude, liquid-cooled engines renowned for their endurance and power."
 ITA_ww1_labour_friction:0 "Labour Friction"
 ITA_ww1_labour_friction_desc:0 "Wage disputes and sporadic strikes affect factory throughput."
 ITA_ww1_land_for_soldiers:0 "Land for the Peasant-Soldiers"
 ITA_ww1_land_for_soldiers_desc:0 "Public promises of post-war agrarian reform and land redistribution reassure the conscript infantry."
 ITA_ww1_land_reclamation:0 "Land Reclamation"
 ITA_ww1_land_reclamation_desc:0 "Drainage and bonifica hydraulic schemes in the Pontine and Tuscan coastal marshes."
 ITA_ww1_latin_sisterhood:0 "Latin Sisterhood"
 ITA_ww1_legalitarian_strike:0 "The Legalitarian Strike"
 ITA_ww1_legalitarian_strike_desc:0 "The anti-fascist Alleanza del Lavoro calls a nationwide general strike in defense of constitutional liberties."
 ITA_ww1_liberal_restoration:0 "Liberal Restoration"
 ITA_ww1_liberal_restoration_desc:0 "A concerted effort by constitutional liberals to preserve parliamentary democracy and suppress extremist paramilitary violence."
 ITA_ww1_libya_colonisation:0 "Settle the Fourth Shore"
 ITA_ww1_libya_colonisation_desc:0 "Directing agrarian emigration to Libyan coastal settlements on the Quarta Sponda."
 ITA_ww1_libya_lessons:0 "Lessons of the Libyan War"
 ITA_ww1_libya_lessons_desc:0 "Incorporates North African tactical lessons. Analysing logistics, desert march discipline, and field wireless telegraphy gathered during colonial operations in Tripoli and Cyrenaica."
 ITA_ww1_libyan_question:0 "The Libyan Question"
 ITA_ww1_libyan_question_desc:0 "Revisiting Italy's claims over Tripolitania and Cyrenaica under international agreements."
 ITA_ww1_libyan_reconquest:0 "The Reconquest of Libya"
 ITA_ww1_libyan_reconquest_desc:0 "Reasserting military dominance over interior desert tribes to consolidate the Fourth Shore."
 ITA_ww1_london_conference:0 "The London Conference"
 ITA_ww1_london_conference_desc:0 "Ambassadors meet in London to delimit Albanian borders and neutralize the Adriatic entrance."
 ITA_ww1_machine_guns:0 "Machine-Gun Companies"
 ITA_ww1_machine_guns_desc:0 "Constructs 1 arms factory in Lombardy (Brescia). Equipping every infantry regiment with dedicated automatic fire sections to lay defensive swathes across barbed-wire perimeters."
 ITA_ww1_march_on_rome:0 "The March on Rome"
 ITA_ww1_march_on_rome_desc:0 "Four fascist quadrumvirs orchestrate armed columns marching on the capital, forcing the crown to concede power."
 ITA_ww1_mas_boats:0 "The MAS Boats"
 ITA_ww1_mas_boats_desc:0 "Builds Motobarca Armata SVAN (MAS) motor torpedo boats; naval doctrine bonus (25%). High-speed wooden motorboats armed with two torpedoes slip silently past harbor boom defenses, immortalized by D'Annunzio's motto 'Memento Audere Semper'."
 ITA_ww1_mas_motor_torpedo_boats:0 "MAS Motor Torpedo Flotillas"
 ITA_ww1_mas_motor_torpedo_boats_desc:0 "Daring high-speed wooden torpedo boats piercing enemy harbors and sinking capital ships."
 ITA_ww1_mas_stealth_patrols:0 "MAS Stealth Patrols"
 ITA_ww1_mas_stealth_patrols_desc:0 "Rapid torpedo incursions along the Adriatic coast."
 ITA_ww1_mediterranean_balance:0 "The Mediterranean Balance"
 ITA_ww1_mediterranean_balance_desc:0 "Balancing continental obligations with maritime friendship toward London and Paris."
 ITA_ww1_mediterranean_naval_cooperation:0 "Mediterranean Naval Cooperation"
 ITA_ww1_merchant_marine_subsidies:0 "Merchant Marine Subsidies"
 ITA_ww1_merchant_marine_subsidies_desc:0 "State postal and navigation subsidies modernize Italian oceanic steamship lines."
 ITA_ww1_methodical_firepower_doctrine:0 "Methodical Firepower Doctrine"
 ITA_ww1_methodical_firepower_doctrine_desc:0 "Systematic artillery bombardment and deliberate infantry advances conserving lives."
 ITA_ww1_mezzogiorno_grain_subsidies:0 "Mezzogiorno Grain Subsidies"
 ITA_ww1_mezzogiorno_grain_subsidies_desc:0 "Agrarian credit for southern smallholders."
 ITA_ww1_mezzogiorno_programme:0 "The Mezzogiorno Programme"
 ITA_ww1_mezzogiorno_programme_desc:0 "Special state investments, tax reliefs, and rural roads across Southern Italy."
 ITA_ww1_mignatta_special_raiders:0 "Mignatta Special Naval Raiders"
 ITA_ww1_mignatta_special_raiders_desc:0 "Stealth assault swimmers penetrating enemy harbor booms to attach explosive limpet mines."
 ITA_ww1_milan_banking:0 "Milan Banking"
 ITA_ww1_milan_banking_desc:0 "Banca Commerciale Italiana and Credito Italiano mobilize private capital for domestic manufacture."
 ITA_ww1_military_flight_schools:0 "Military Aviation Academies"
 ITA_ww1_military_flight_schools_desc:0 "Rigorous pilot training producing thousands of skilled combat fliers for the front."
 ITA_ww1_military_readiness_category:0 "Military & Naval Readiness"
 ITA_ww1_military_readiness_category_desc:0 "Preparation of the Regio Esercito and Regia Marina."
 ITA_ww1_motor_transport:0 "Motor Transport Corps"
 ITA_ww1_motor_transport_desc:0 "Constructs 1 arms factory in Piedmont (FIAT lorries). Automotive convoys supply mountain armies with munitions, moving entire divisions between Trentino and Piave within forty-eight hours."
 ITA_ww1_motorized_shock_cadres:0 "Motorized Armoured Squadrons"
 ITA_ww1_motorized_shock_cadres_desc:0 "Fast armoured cars breaking through enemy lines and pursuing retreating columns."
 ITA_ww1_mountain_artillery:0 "Mountain Artillery"
 ITA_ww1_mountain_artillery_desc:0 "Constructs 1 arms factory in Piedmont (Turin), adds Mountain Howitzers idea and +10 army XP. Mule-carried 65/17 mountain guns can be dismantled into pack loads and carried up sheer dolomite precipices to support Alpini assaults."
 ITA_ww1_mountain_howitzers:0 "Alpine Mountain Howitzers"
 ITA_ww1_mountain_howitzers_desc:0 "Mule-transportable artillery pieces providing direct fire support on rocky precipices."
 ITA_ww1_munitions_undersecretariat:0 "The Munitions Undersecretariat"
 ITA_ww1_munitions_undersecretariat_desc:0 "A dedicated government undersecretariat centralizes shell and explosive procurement."
 ITA_ww1_mutilated_victory:0 "The Mutilated Victory"
 ITA_ww1_mutilated_victory_desc:0 "Disappointment over Dalmatia and Fiume at Versailles replaces wartime enthusiasm with the bitter Vittoria Mutilata myth."
 ITA_ww1_mutilated_victory_syndrome:0 "Mutilated Victory Syndrome"
 ITA_ww1_mutilated_victory_syndrome_desc:0 "Resentment over incomplete fulfillment of the London Pact at Versailles."
 ITA_ww1_national_party:0 "The National Party"
 ITA_ww1_national_party_desc:0 "Transforming the dispersed combat leagues into the disciplined Partito Nazionale Fascista under Mussolini's central command."
 ITA_ww1_nationalist_association:0 "The Nationalist Association"
 ITA_ww1_nationalist_association_desc:0 "Corradini and Federzoni organise the Associazione Nazionalista Italiana, preaching imperial expansion and irredentism."
 ITA_ww1_nationalist_order:0 "The Nationalist Order"
 ITA_ww1_nationalist_order_desc:0 "Landowners, industrialists, and middle classes embrace nationalist discipline to restore authority."
 ITA_ww1_naval_convention_vienna:0 "Naval Convention with Vienna"
 ITA_ww1_naval_convention_vienna_desc:0 "Negotiating operational cordons and signaling codes between the Regia Marina and the k.u.k. Kriegsmarine."
 ITA_ww1_naval_estimates:0 "The Naval Estimates"
 ITA_ww1_naval_estimates_desc:0 "Approves the 1911 naval estimates. Admiral Bettolo and the naval ministry secure parliament's blessing for long-term construction programmes to match Austro-Hungarian naval expansion."
 ITA_ww1_negotiate_factory_arbitration:0 "Negotiate Factory Arbitration"
 ITA_ww1_negotiate_factory_arbitration_desc:0 "Mediation between unions and industrialists to avert stoppages."
 ITA_ww1_neutral_peace_conference:0 "Host a Neutral Peace Conference"
 ITA_ww1_neutral_peace_conference_desc:0 "Inviting representatives of the warring factions to Rome for preliminary armistice negotiations."
 ITA_ww1_neutralist_coalition:0 "The Neutralist Coalition"
 ITA_ww1_neutralist_coalition_desc:0 "A parliamentary majority composed of Giolittian liberals, socialists, and Catholics organizes to preserve peace."
 ITA_ww1_neutralist_predominance:0 "Neutralist Predominance"
 ITA_ww1_neutralist_predominance_desc:0 "The majority of parliament and the public favors peace and neutrality."
 ITA_ww1_nice_and_tunisia_claims:0 "Claims on Nice and Tunisia"
 ITA_ww1_nice_and_tunisia_claims_desc:0 "Asserting historic Italian claims over Nice, Corsica, and the French protectorate of Tunisia."
 ITA_ww1_nitti_cabinet:0 "The Nitti Cabinet"
 ITA_ww1_nitti_cabinet_desc:0 "Francesco Saverio Nitti takes power seeking fiscal retrenchment, demobilization, and social reconciliation."
 ITA_ww1_north_east_mobilisation:0 "The North-East Mobilisation Plan"
 ITA_ww1_north_east_mobilisation_desc:0 "Completes railway timetables concentrating the Regio Esercito on the Venetian plain. Organising seventy-two trains per day across the Po Valley to marshal four field armies on the Austrian border in under twenty days."
 ITA_ww1_offensive_doctrine:0 "The Offensive Doctrine"
 ITA_ww1_offensive_doctrine_desc:0 "Replaces Cadornian Discipline with Cult of the Offensive. The General Staff's official tactical doctrine insists that sheer moral willpower and infantry bayonets will overcome enemy machine guns."
 ITA_ww1_offensive_pressure:0 "Sustained Offensive Pressure"
 ITA_ww1_offensive_pressure_desc:0 "Replaces defensive posture with Aggressive River Probing. Maintaining constant raids across river sandbars to keep the Austro-Hungarian command under perpetual tension and force early deployment of reserves."
 ITA_ww1_opera_nazionale_combattenti:0 "Opera Nazionale Combattenti"
 ITA_ww1_opera_nazionale_combattenti_desc:0 "State welfare institution for veteran assistance and reintegration."
 ITA_ww1_oppressed_nationalities_liaison:0 "Oppressed Nationalities Liaison"
 ITA_ww1_oppressed_nationalities_liaison_desc:0 "Liaison with Czech and South Slav national committees."
 ITA_ww1_oppressed_peoples_congress:0 "Congress of Oppressed Peoples"
 ITA_ww1_oppressed_peoples_congress_desc:0 "Convening leaders of Czechs, Yugoslavs, Poles, and Romanians in Rome to undermine Habsburg cohesion."
 ITA_ww1_orlando_government:0 "The Orlando Government"
 ITA_ww1_orlando_government_desc:0 "Vittorio Emanuele Orlando takes the helm with a single mandate: resistance on the Piave and total national mobilization."
 ITA_ww1_orlando_victory_cabinet:0 "Orlando National Resistance Cabinet"
 ITA_ww1_orlando_victory_cabinet_desc:0 "National determination government for final victory in the Great War."
 ITA_ww1_otranto_barrage:0 "The Otranto Barrage"
 ITA_ww1_otranto_barrage_desc:0 "Installs submarine net barriers, hydrophones, and armed drifters across the Strait of Otranto. Cooperating with British drifter trawlers, the barrage bottles up German and Austrian U-boats inside the Adriatic, preventing free egress into the Mediterranean."
 ITA_ww1_otranto_barrage_net:0 "The Otranto Submarine Net"
 ITA_ww1_otranto_barrage_net_desc:0 "Deep netting and hydrophone barriers trapping enemy U-boats within the Adriatic."
 ITA_ww1_paris_delegation:0 "The Paris Delegation"
 ITA_ww1_paris_delegation_desc:0 "Orlando and Sonnino present Italy's comprehensive territorial dossier at the Paris Peace Conference."
 ITA_ww1_parliament_against_street:0 "Parliament Against the Street"
 ITA_ww1_parliament_against_street_desc:0 "The neutralist parliamentary majority stands firm against patriotic street intimidation in Rome and Milan."
 ITA_ww1_pci_workers_councils:0 "Workers' Factory Councils"
 ITA_ww1_pci_workers_councils_desc:0 "Workers take direct control of production management in occupied plants."
 ITA_ww1_peacetime_military_economy:0 "Peacetime Fiscal Realism"
 ITA_ww1_peacetime_military_economy_desc:0 "Prudent reductions in military budgets to facilitate national economic recovery."
 ITA_ww1_piave_line:0 "The Piave Line"
 ITA_ww1_piave_line_desc:0 "Rallying the shattered armies on the river Piave and Monte Grappa: 'Tutti eroi! O il Piave o todos accoppati!'."
 ITA_ww1_pilot_schools:0 "Pilot Schools"
 ITA_ww1_pilot_schools_desc:0 "Replaces experimental aviation battalion with formal flight academies. Standardising pilot training curricula, navigation, and aerobatics to graduate hundreds of qualified military fliers."
 ITA_ww1_popolo_ditalia:0 "A Newspaper for the War"
 ITA_ww1_popolo_ditalia_desc:0 "Benito Mussolini launches Il Popolo d'Italia with French and industrial subsidies, calling for revolutionary war."
 ITA_ww1_popular_party:0 "The Italian People's Party"
 ITA_ww1_popular_party_desc:0 "Don Luigi Sturzo founds the Partito Popolare Italiano, organizing Christian democracy into an independent force."
 ITA_ww1_postwar_army_reform:0 "Postwar Army Reform"
 ITA_ww1_postwar_army_reform_desc:0 "General Badoglio reorganises the peacetime standing army into thirty modern divisions. Modernising artillery arsenals, retaining assault unit doctrines, and creating unified corps commands across the northern frontiers."
 ITA_ww1_postwar_fleet_review:0 "The Postwar Fleet Review"
 ITA_ww1_postwar_fleet_review_desc:0 "Victorious fleet review off Venice celebrated by the King. The dreadnoughts, scout cruisers, and decorated MAS flotillas assemble in the Venetian lagoon to celebrate total mastery of the Adriatic."
 ITA_ww1_price_controls:0 "Price Controls"
 ITA_ww1_price_controls_desc:0 "Fixing ceiling prices on essential foodstuffs to protect urban working families from gouging."
 ITA_ww1_propaganda_service:0 "The Propaganda Service"
 ITA_ww1_propaganda_service_desc:0 "Servizio P deploys trench illustrators, writers, and lecturers to sustain morale in the Alpine trenches."
 ITA_ww1_propaganda_service_spirit:0 "Servizio P Troop Morale"
 ITA_ww1_propaganda_service_spirit_desc:0 "Active propaganda and illustrated gazettes sustain the troops' spirit."
 ITA_ww1_propaganda_trench_newspapers:0 "Propaganda Trench Newspapers"
 ITA_ww1_propaganda_trench_newspapers_desc:0 "Patriotic illustrations to bolster soldier morale."
 ITA_ww1_proportional_representation:0 "Proportional Representation"
 ITA_ww1_proportional_representation_desc:0 "Electoral reform introduces proportional representation, shattering old liberal patron-client networks."
 ITA_ww1_public_order_measures:0 "Restore Public Order"
 ITA_ww1_public_order_measures_desc:0 "Deployment of military garrisons and Carabinieri patrols restores civil order without provoking widespread insurrection."
 ITA_ww1_public_works_programme:0 "Public Works Programme"
 ITA_ww1_public_works_programme_desc:0 "State-funded road construction, port repairs, and electrification absorb demobilized workers."
 ITA_ww1_quarto_rally:0 "The Quarto Speech"
 ITA_ww1_quarto_rally_desc:0 "Gabriele D'Annunzio delivers an ecstatic patriotic address at Quarto, unleashing nationalist crowds onto the streets."
 ITA_ww1_radiant_fever:0 "Radiant Fever"
 ITA_ww1_radiant_fever_desc:0 "Patriotic crowds dominate public squares demanding the war of liberation."
 ITA_ww1_radiant_may:0 "The Radiant May"
 ITA_ww1_radiant_may_desc:0 "The intense days of Maggio Radioso force the King and Parliament to reject neutralism and embrace war."
 ITA_ww1_radiant_may_fervor:0 "Radiant May Fervor"
 ITA_ww1_radiant_may_fervor_desc:0 "Enthusiastic popular mobilization for the cause of national liberation."
 ITA_ww1_railway_mobilisation_plan:0 "Railway Mobilization Grids"
 ITA_ww1_railway_mobilisation_plan_desc:0 "Efficient railway timetables concentrating armies smoothly along the frontier."
 ITA_ww1_ration_civilian_coal:0 "Ration Civilian Coal"
 ITA_ww1_ration_civilian_coal_desc:0 "Prioritize coal for blast furnaces and military railways."
 ITA_ww1_reassure_berlin_and_vienna:0 "Reassure Berlin and Vienna"
 ITA_ww1_reassure_berlin_and_vienna_desc:0 "Diplomatic talks to preserve the Triple Alliance."
 ITA_ww1_red_week:0 "Red Week"
 ITA_ww1_red_week_aftermath:0 "Red Week Aftermath"
 ITA_ww1_red_week_aftermath_desc:0 "Social tension and police distrust remain heightened following riots."
 ITA_ww1_red_week_desc:0 "Violent riots and general strikes paralyze Romagna and the Marches following police shootings in Ancona."
 ITA_ww1_refugee_relief:0 "Relief for the Refugees"
 ITA_ww1_refugee_relief_desc:0 "Providing food, shelter, and medical care to over 400,000 citizens displaced by the Caporetto retreat."
 ITA_ww1_regia_marina_cadres:0 "Regia Marina Officer Cadres"
 ITA_ww1_regia_marina_cadres_desc:0 "Professional naval academy graduates at Livorno mastering modern naval artillery."
 ITA_ww1_renew_triple_alliance:0 "Renew the Triple Alliance"
 ITA_ww1_renew_triple_alliance_desc:0 "Renewing the Triple Alliance treaty in December 1912 with explicit clauses on Mediterranean security."
 ITA_ww1_repress_squadrist_violence:0 "Repress Squadrist Violence"
 ITA_ww1_repress_squadrist_violence_desc:0 "Disarm illegal armed squads and militias."
 ITA_ww1_reserve_officer_schools:0 "Reserve Officer Schools"
 ITA_ww1_reserve_officer_schools_desc:0 "Constructs 1 arms factory in Emilia-Romagna (Modena). Rapid training schools at Modena and Parma supply tens of thousands of enthusiastic junior officers to lead frontline platoons."
 ITA_ww1_revolutionary_ferment:0 "Revolutionary Ferment"
 ITA_ww1_revolutionary_ferment_desc:0 "Mass strikes and maximalist agitation paralyze industrial cities."
 ITA_ww1_riviera_offensive:0 "The Riviera Offensive"
 ITA_ww1_riviera_offensive_desc:0 "Pushing mechanized and cavalry spearheads along the Mediterranean coast toward Nice and Cannes."
 ITA_ww1_sacro_egoismo:0 "Sacro Egoismo Doctrine"
 ITA_ww1_sacro_egoismo_desc:0 "Unconditional defense of Italian geopolitical interest above external pacts."
 ITA_ww1_sacro_egoismo_suspicion:0 "Suspicion over 'Sacro Egoismo'"
 ITA_ww1_saint_jean_de_maurienne:0 "Saint-Jean-de-Maurienne"
 ITA_ww1_saint_jean_de_maurienne_desc:0 "Negotiating wartime territorial agreements over future zones of influence in Anatolia (Smyrna)."
 ITA_ww1_salandra_cabinet:0 "The Salandra Cabinet"
 ITA_ww1_salandra_cabinet_desc:0 "Antonio Salandra assumes leadership of a conservative cabinet, bringing an end to Giolittian trasformismo."
 ITA_ww1_salandra_emergency_cabinet:0 "Salandra Emergency Cabinet"
 ITA_ww1_salandra_emergency_cabinet_desc:0 "Conservative leadership focused on military readiness and armed intervention."
 ITA_ww1_salonika_contingent:0 "The Salonika Contingent"
 ITA_ww1_salonika_contingent_desc:0 "Dispatching the 35th Infantry Division to join Allied operations on the Macedonian front."
 ITA_ww1_sarajevo_crisis:0 "The July Crisis"
 ITA_ww1_sarajevo_crisis_desc:0 "Austria-Hungary's ultimatum to Serbia triggers the crisis, giving Italy grounds to dispute unconsulted aggression."
 ITA_ww1_secret_contacts_with_paris:0 "Secret Contacts with Paris"
 ITA_ww1_secret_contacts_with_paris_desc:0 "Discreet soundings with the French Foreign Ministry."
 ITA_ww1_shattered_discipline:0 "Shattered Discipline"
 ITA_ww1_shattered_discipline_desc:0 "The shock of defeats and military exhaustion shake the army's ranks."
 ITA_ww1_shortcut_dip:0 "Wing: Diplomacy & Alignment"
 ITA_ww1_shortcut_eco:0 "Wing: Economy & Mezzogiorno"
 ITA_ww1_shortcut_mil:0 "Wing: Armed Forces"
 ITA_ww1_shortcut_pol:0 "Wing: Politics & Society"
 ITA_ww1_shortcut_war:0 "Wing: Campaigns & Postwar"
 ITA_ww1_sicilian_sulphur:0 "Sicilian Sulphur"
 ITA_ww1_sicilian_sulphur_desc:0 "Reorganizing the Sicilian sulphur syndicate to sustain chemical and gunpowder manufacture."
 ITA_ww1_social_truce:0 "Social Truce"
 ITA_ww1_social_truce_desc:0 "Agreements between capital and labor secure social peace and productivity."
 ITA_ww1_socialist_congress:0 "Congress of Reggio Emilia"
 ITA_ww1_socialist_congress_desc:0 "The Reggio Emilia Congress sees the maximalist wing expel reformists and elevate young Benito Mussolini to editor of Avanti!."
 ITA_ww1_socialist_turn:0 "The Socialist Turn"
 ITA_ww1_socialist_turn_desc:0 "The Italian labor movement takes an uncompromising revolutionary stance, rejecting bourgeois coalition governance."
 ITA_ww1_solstice_battle:0 "The Battle of the Solstice"
 ITA_ww1_solstice_battle_desc:0 "Repulsing the final massive Austro-Hungarian offensive across Montello and the lower Piave."
 ITA_ww1_southern_development_charter:0 "Southern Development Charter"
 ITA_ww1_southern_development_charter_desc:0 "A comprehensive legislative charter guarantees permanent credit and infrastructure development for the Mezzogiorno."
 ITA_ww1_southern_disparity:0 "Southern Disparity"
 ITA_ww1_southern_disparity_desc:0 "Lack of infrastructure and emigration weigh heavily upon southern regions."
 ITA_ww1_southern_inquiry:0 "Inquiry into the South"
 ITA_ww1_southern_inquiry_desc:0 "A formal parliamentary inquiry into agrarian backwardness and emigration across the Mezzogiorno."
 ITA_ww1_squadrist_mobilisation:0 "Mobilise the Squads"
 ITA_ww1_squadrist_mobilisation_desc:0 "Blackshirt action squads systematically attack socialist printing presses, peasant leagues, and labor halls."
 ITA_ww1_squadrist_violence:0 "Squadrist Violence"
 ITA_ww1_squadrist_violence_desc:0 "Blackshirt punitive expeditions terrorize left-wing organizations."
 ITA_ww1_stoic_endurance:0 "Stoic Endurance"
 ITA_ww1_stoic_endurance_desc:0 "Soldiers endure extreme hardship in the mountains and trenches."
 ITA_ww1_strategic_bombing:0 "Strategic Bombing"
 ITA_ww1_strategic_bombing_desc:0 "Implements Colonel Giulio Douhet's theories of independent strategic air power. Concentrated Caproni bomber wings strike Austrian rail junctions, naval arsenals at Pola, and ammunition dumps in deep rear areas."
 ITA_ww1_strengthened_carabinieri:0 "Strengthened Carabinieri Corps"
 ITA_ww1_strengthened_carabinieri_desc:0 "Prestigious royal gendarmerie enforcing civil order and constitutional legality."
 ITA_ww1_subdued_claims:0 "Subdued Claims"
 ITA_ww1_subdued_claims_desc:0 "Diplomacy seeks peaceful accommodation and maritime trade preservation."
 ITA_ww1_submarine_programme:0 "The Submarine Programme"
 ITA_ww1_submarine_programme_desc:0 "Adopts engineer Cesare Laurenti's double-hull submarine designs; submarine tech bonus (25%). Building coastal submarines (Medusa and Nautilus classes) possessing superior submerged stability and reserve buoyancy for Mediterranean operations."
 ITA_ww1_subsidise_catholic_schools:0 "Subsidise Catholic Schools"
 ITA_ww1_subsidise_catholic_schools_desc:0 "Strengthens cooperation with moderate Catholic voters."
 ITA_ww1_suffrage_law:0 "Universal Male Suffrage"
 ITA_ww1_suffrage_law_desc:0 "Expanding the franchise to all literate males aged 21 and all males aged 30 transforms Italian democracy."
 ITA_ww1_supreme_war_council:0 "The Supreme War Council"
 ITA_ww1_supreme_war_council_desc:0 "Creating the Allied Supreme War Council at Rapallo to coordinate coalition strategic planning."
 ITA_ww1_sva_reconnaissance:0 "SVA Reconnaissance Aircraft"
 ITA_ww1_sva_reconnaissance_desc:0 "Introduces the fast Ansaldo SVA.5 long-range reconnaissance biplane (25% air tech bonus). Capable of flying 140 mph with an unprecedented six-hour endurance, the SVA maps Austrian rail networks across the Alps."
 ITA_ww1_taranto_base:0 "The Taranto Base"
 ITA_ww1_taranto_base_desc:0 "Expands Taranto naval base, adds Taranto Arsenal idea and +10 navy XP. Dredging navigation channels, building dry docks, and erecting coastal battery fortifications to shelter the primary battle fleet."
 ITA_ww1_taranto_naval_arsenal:0 "Taranto Naval Arsenal"
 ITA_ww1_taranto_naval_arsenal_desc:0 "First-class dry docks and repair installations maintaining the battle fleet at high readiness."
 ITA_ww1_tariff_protection:0 "Protective Tariffs"
 ITA_ww1_tariff_protection_desc:0 "Shielding northern metallurgy and heavy engineering behind protective customs duties."
 ITA_ww1_third_giolitti:0 "The Last Giolitti Ministry"
 ITA_ww1_third_giolitti_desc:0 "The elderly statesman returns to the premiership, choosing neutrality and negotiation over military confrontation."
 ITA_ww1_torpedo_boats:0 "Torpedo Boat Flotillas"
 ITA_ww1_torpedo_boats_desc:0 "Builds 3PN and Indomito-class high-speed torpedo destroyers; destroyer tech bonus (25%). Fast, heavily armed flotilla craft capable of laying minefields and launching night torpedo attacks against Austrian capital ships."
 ITA_ww1_trade_union_recognition:0 "Recognise the Labour Confederation"
 ITA_ww1_trade_union_recognition_desc:0 "Pragmatic arbitration recognises the Confederazione Generale del Lavoro as a legitimate bargaining partner."
 ITA_ww1_train_alpini_mountain_battalions:0 "Train Alpini Mountain Battalions"
 ITA_ww1_train_alpini_mountain_battalions_desc:0 "Advanced training on glaciers and rock walls."
 ITA_ww1_trasformismo_politics:0 "Trasformismo Politics"
 ITA_ww1_trasformismo_politics_desc:0 "The political system is governed by continuous cross-faction compromise."
 ITA_ww1_treaty_of_london:0 "The Treaty of London"
 ITA_ww1_treaty_of_london_desc:0 "Signing the secret Pact of London promising Trentino, South Tyrol, Trieste, Istria, and Dalmatia."
 ITA_ww1_treaty_of_london_solidarity:0 "Treaty of London Solidarity"
 ITA_ww1_treaty_of_ouchy:0 "The Treaty of Ouchy"
 ITA_ww1_treaty_of_ouchy_desc:0 "Signing the Treaty of Ouchy (First Treaty of Lausanne) confirming Italian sovereignty over Libya."
 ITA_ww1_treaty_of_rapallo:0 "The Treaty of Rapallo"
 ITA_ww1_treaty_of_rapallo_desc:0 "Signing the compromise frontier treaty with the Kingdom of Serbs, Croats, and Slovenes."
 ITA_ww1_treaty_of_saint_germain:0 "The Treaty of Saint-Germain"
 ITA_ww1_treaty_of_saint_germain_desc:0 "Ratifying the treaty that formalizes the dissolution of Austria-Hungary and cedes Trento and Trieste."
 ITA_ww1_trench_mortars:0 "Trench Mortars"
 ITA_ww1_trench_mortars_desc:0 "Constructs 1 arms factory in Piedmont. Short-range mortars lobbing heavy charges of high explosive lobbed directly into enemy trenches clear barbed-wire mazes on the Carso."
 ITA_ww1_trentino_defence:0 "Defend the Trentino"
 ITA_ww1_trentino_defence_desc:0 "Halting the Austrian Strafexpedition in the high plateau of Asiago and Pasubio."
 ITA_ww1_trento_trieste_integration:0 "Integrate Trento and Trieste"
 ITA_ww1_trento_trieste_integration_desc:0 "Full administrative, judicial, and linguistic integration of the redeemed provinces into the Kingdom of Italy."
 ITA_ww1_triple_alliance:0 "The Triple Alliance"
 ITA_ww1_triple_alliance_desc:0 "Reviewing Italy's longstanding diplomatic commitments under the Triple Alliance with Berlin and Vienna."
 ITA_ww1_tripoli_landing:0 "The Tripoli Landing"
 ITA_ww1_tripoli_landing_desc:0 "Deploying naval detachments and marines to secure port facilities along the Libyan coastline."
 ITA_ww1_tunisian_landing:0 "The Tunisian Landing"
 ITA_ww1_tunisian_landing_desc:0 "Executing amphibious landings along the Tunisian coast to liberate Italian settlers in Tunis."
 ITA_ww1_turin_motor_industry:0 "Turin and the Motor Industry"
 ITA_ww1_turin_motor_industry_desc:0 "Expanding FIAT, Lancia, and SCAT automotive engineering facilities in Piedmont."
 ITA_ww1_ultimatum_to_the_porte:0 "Ultimatum to the Porte"
 ITA_ww1_ultimatum_to_the_porte_desc:0 "Delivering diplomatic terms to the Sublime Porte demanding the transfer of administrative control over Libya."
 ITA_ww1_universal_suffrage:0 "Universal Male Suffrage"
 ITA_ww1_universal_suffrage_desc:0 "Expanded franchise incorporates millions of peasants and workers into civic life."
 ITA_ww1_unknown_soldier:0 "The Unknown Soldier"
 ITA_ww1_unknown_soldier_desc:0 "Solemn entombment of the Unknown Soldier at the Altare della Patria in Rome unites the nation in reverence."
 ITA_ww1_unredeemed_lands_call:0 "Call of the Unredeemed Lands"
 ITA_ww1_unredeemed_lands_call_desc:0 "The cause of Trent and Trieste gains momentum in political debate."
 ITA_ww1_vatican_peace_note:0 "The Vatican Peace Note"
 ITA_ww1_vatican_peace_note_desc:0 "Responding diplomatically to Pope Benedict XV's appeals to end the 'useless slaughter'."
 ITA_ww1_vatican_reconciliation_talks:0 "Vatican Reconciliation Talks"
 ITA_ww1_vatican_reconciliation_talks_desc:0 "Institutional rapprochement between the Italian State and the Church."
 ITA_ww1_veteran_resettlement_parcels:0 "Veteran Resettlement Parcels"
 ITA_ww1_veteran_resettlement_parcels_desc:0 "Allotment of agricultural land to ex-combatants."
 ITA_ww1_veterans_land_settlement:0 "Veterans' Land Settlement"
 ITA_ww1_veterans_land_settlement_desc:0 "Distributing reclaimed agricultural lands to demobilized peasant veterans in Apulia and Sardinia."
 ITA_ww1_victorious_ardor:0 "Victorious Ardor"
 ITA_ww1_victorious_ardor_desc:0 "The enthusiasm of recent victories boosts morale and faith in command."
 ITA_ww1_vienna_compensation_talks:0 "Compensation Talks with Vienna"
 ITA_ww1_vienna_compensation_talks_desc:0 "Diplomatic bargaining under Article VII demands the cession of Trentino in exchange for neutrality."
 ITA_ww1_vienna_flight:0 "The Flight over Vienna"
 ITA_ww1_vienna_flight_desc:0 "D'Annunzio's 87th Serenissima Squadron drops 400,000 tricolor leaflets over the Austrian capital. Covering seven hundred miles across high mountains without bombs, Italian fliers prove they can strike Vienna at will while showering citizens with peace manifestos."
 ITA_ww1_villa_giusti_armistice:0 "The Villa Giusti Armistice"
 ITA_ww1_villa_giusti_armistice_desc:0 "Signing the armistice with defeated Austria-Hungary at Villa Giusti outside Padua on November 3, 1918."
 ITA_ww1_vittorio_veneto:0 "Vittorio Veneto"
 ITA_ww1_vittorio_veneto_desc:0 "The decisive general offensive shattering the Austro-Hungarian lines and liberating Trento and Trieste."
 ITA_ww1_war_censorship:0 "Wartime Censorship Law"
 ITA_ww1_war_censorship_desc:0 "Emergency wartime censorship suppresses defeatist propaganda and controls front-line reporting."
 ITA_ww1_war_hydropower:0 "Hydropower for the War"
 ITA_ww1_war_hydropower_desc:0 "Emergency electrification of Piedmontese and Lombard railway arteries reduces reliance on imported coal."
 ITA_ww1_war_loans:0 "National War Loans"
 ITA_ww1_war_loans_desc:0 "Flotation of consecutive national war loans mobilizes domestic savings and civic duty."
 ITA_ww1_war_of_position:0 "The War of Position"
 ITA_ww1_war_of_position_desc:0 "Replaces Cadornian Discipline with Methodical Firepower Doctrine. Rejecting reckless bayonet charges, this doctrine mandates methodical artillery destruction before committing infantry to the assault."
 ITA_ww1_war_profiteers_inquiry:0 "The Profiteers' Inquiry"
 ITA_ww1_war_profiteers_inquiry_desc:0 "Taxing windfall war profits (pescecani) recovers public revenue and soothes working-class fury."
 ITA_ww1_washington_conference:0 "The Washington Conference"
 ITA_ww1_washington_conference_desc:0 "Participating in international naval limitation talks and securing parity with France."
 ITA_ww1_wilsonian_conflict:0 "Wilson and the Adriatic"
 ITA_ww1_wilsonian_conflict_desc:0 "Clashing with President Wilson's Fourteen Points over Italian claims in Dalmatia and Fiume."
 ITA_ww1_women_war_economy:0 "Women in the War Economy"
 ITA_ww1_women_war_economy_desc:0 "Hundreds of thousands of women enter munitions plants, textile mills, and agricultural cooperatives."
 ITA_ww1_workers_councils:0 "The Workers' Councils"
 ITA_ww1_workers_councils_desc:0 "Gramsci and the Ordine Nuovo group organize elected factory councils to direct industrial production, breaking fascist squad control."
 ww1_italy.1.a:0 "Enact the comprehensive reform."
 ww1_italy.1.b:0 "Restrict concessions to literate voters."
