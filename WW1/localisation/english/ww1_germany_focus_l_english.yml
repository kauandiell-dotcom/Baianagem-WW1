 # --- NEW EVENTS 50 - 66 ---
 ww1_germany_events.50.t:0 "Mutiny in Kiel and Factory Strikes"
 ww1_germany_events.50.d:0 "The embers of socialist revolt have burst into open flame! In Kiel, Wilhelmshaven, and across the heavy industrial basin of the Ruhr, sailors have raised red banners on their dreadnoughts and joined factory workers in armed walkouts. The Imperial authorities struggle to maintain public order."
 ww1_germany_events.50.a:0 "The working class will no longer be silenced!"

 ww1_germany_events.51.t:0 "Outbreak of the German Civil War!"
 ww1_germany_events.51.d:0 "The climax of the Spartacus uprising has arrived. In Berlin, Karl Liebknecht and Rosa Luxemburg have proclaimed the Free Socialist Republic from the palace steps, while revolutionary red guards take over barracks and rail terminals. The Imperial High Command and reactionary officers have fled east to rally monarchist troops and Freikorps regiments. War has begun!"
 ww1_germany_events.51.a:0 "To the barricades! Victory or death!"

 ww1_germany_events.52.t:0 "Victory of the Red Guards: The Socialist Republic"
 ww1_germany_events.52.d:0 "The reactionary forces have collapsed before the overwhelming fervor of the armed workers and revolutionary soldiers. The Imperial throne is permanently abolished. Rosa Luxemburg and Karl Liebknecht address a colossal sea of red banners in the Lustgarten, inaugurating the German Socialist Council Republic."
 ww1_germany_events.52.a:0 "Long live the Free Socialist Republic of Germany!"

 ww1_germany_events.53.t:0 "The Petrograd-Berlin Communist Axis"
 ww1_germany_events.53.d:0 "With the red flag flying over both Berlin and Petrograd, the historic dream of European socialist solidarity has become an unbreakable reality. Envoys from Soviet Russia have arrived in Berlin to establish the Red Internationale, uniting Russian resources and manpower with German industrial mastery."
 ww1_germany_events.53.a:0 "Workers of the world, unite!"

 ww1_germany_events.54.t:0 "Entente Intervention Against Red Germany"
 ww1_germany_events.54.d:0 "The capitalist powers of Great Britain and France view the emergence of a united Soviet-German bloc as an existential threat to world order. Declaring that Bolshevism in Central Europe must be extinguished by fire and sword, the Entente has ordered its armies across our frontiers in a crusade of intervention!"
 ww1_germany_events.54.a:0 "We shall defend the Revolution to our last breath!"

 ww1_germany_events.55.t:0 "Constitutional Crisis: The Prussian Franchise"
 ww1_germany_events.55.d:0 "Chancellor Bethmann-Hollweg has introduced a landmark bill into the Landtag to abolish the archaic Prussian three-class franchise in favor of equal voting rights. The aristocratic Junker landowners and reactionary military officers have erupted in fury, threatening obstruction and constitutional deadlock."
 ww1_germany_events.55.a:0 "The will of the people must prevail over feudal privileges."

 ww1_germany_events.56.t:0 "The October Reforms: A Parliamentary Reich"
 ww1_germany_events.56.d:0 "Facing immense popular demand for democracy and modern governance, Kaiser Wilhelm II has formally enacted the historic October Reforms. The Chancellor and armed forces are now strictly subordinate to the elected Reichstag, and majority coalition leaders take control of the imperial cabinet."
 ww1_germany_events.56.a:0 "The German People now guide their own destiny."

 ww1_germany_events.57.t:0 "Peace Mission to Washington"
 ww1_germany_events.57.d:0 "Bypassing the uncompromising demands of London and Paris, our diplomatic mission has arrived in Washington D.C. to present our government's acceptance of President Woodrow Wilson's Fourteen Points as the framework for a just and lasting peace."
 ww1_germany_events.57.a:0 "May reason and peace triumph over slaughter."

 ww1_germany_events.58.t:0 "The Kapp-Tirpitz Coup d'État!"
 ww1_germany_events.58.d:0 "In the early hours before dawn, heavily armed Freikorps brigades and naval assault battalions entered the capital under the commands of Wolfgang Kapp and Grand Admiral Alfred von Tirpitz. Declaring the civilian chancellor deposed for treason and decadence, the Fatherland Party has seized total executive power!"
 ww1_germany_events.58.a:0 "Order is restored! Hail the Fatherland!"

 ww1_germany_events.59.t:0 "The General Strike in the Ruhr Crushed"
 ww1_germany_events.59.d:0 "In retaliation against the nationalist coup, socialist trade unions declared a total general strike across the coal mines and steel mills of the Ruhr. The government wasted no time: Freikorps iron squads and machine-gun detachments occupied the plants, summarily executing agitators and compelling the workers back to production."
 ww1_germany_events.59.a:0 "Production shall not stop for rebellious saboteurs."

 ww1_germany_events.60.t:0 "The Baltic Crusade of the Landeswehr"
 ww1_germany_events.60.d:0 "German Freikorps and the Baltic-German nobility have initiated a coordinated military offensive across the Baltic coastline. Sweeping through Riga, Reval, and Mitau, our forces are carving out permanent German dominion on the Baltic shores, driving out all hostile partisans."
 ww1_germany_events.60.a:0 "The Teutonic legacy lives anew in the East!"

 ww1_germany_events.61.t:0 "Siegfrieden Annexation Ultimatum"
 ww1_germany_events.61.d:0 "The German Government has issued its final geopolitical demands: the irreversible annexation of the Flemish coast, the fortified redoubts of Liège, Luxembourg, and the iron-rich basin of Longwy-Briey. We refuse any armistice that fails to grant Germany total strategic hegemony in the West."
 ww1_germany_events.61.a:0 "We take what German blood has bought!"

 ww1_germany_events.62.t:0 "The Secret Summit of Björkö"
 ww1_germany_events.62.d:0 "Aboard the imperial yacht Hohenzollern in the secluded Finnish waters of Björkö, Kaiser Wilhelm II and Tsar Nicholas II have concluded private negotiations. The two autocrats have agreed to a secret treaty of mutual non-aggression and defensive cooperation, driving an irreparable wedge between Russia and the Entente!"
 ww1_germany_events.62.a:0 "A continental pact that shatters British encirclement."

 ww1_germany_events.63.t:0 "Continental League Confronts the British Empire"
 ww1_germany_events.63.d:0 "The secret pact of Björkö has borne dramatic fruit. Berlin and Petrograd have formally unveiled the Continental League, declaring war on the British Empire and launching simultaneous campaigns to dismantle British hegemony across the Middle East, the Persian Gulf, and India!"
 ww1_germany_events.63.a:0 "Rule Britannia is at an end!"

 ww1_germany_events.64.t:0 "The Collapse of the Austro-Hungarian Empire"
 ww1_germany_events.64.d:0 "Centuries of Habsburg dominion have unraveled in days. With ethnic rebellions, widespread famine, and the disintegration of the imperial army, Vienna can no longer govern its fractured realms. Chaos reigns throughout the Danubian basin, leaving our southern border exposed."
 ww1_germany_events.64.a:0 "We must act immediately to protect German lands!"

 ww1_germany_events.65.t:0 "The Alpine Clash: War with Italy!"
 ww1_germany_events.65.d:0 "As German divisions march into Vienna, Graz, and Innsbruck to incorporate the German-Austrian homeland into the Reich, Italian armies have crossed the Isonzo and Piave, claiming South Tyrol and Trieste for Rome. German and Italian alpine divisions have engaged in fierce mountain combat!"
 ww1_germany_events.65.a:0 "Drive the Italians back across the Po!"

 ww1_germany_events.66.t:0 "Operation Faustschlag: The March on Baku"
 ww1_germany_events.66.d:0 "Our expeditionary corps has successfully advanced through the mountain passes of the Caucasus, brushing aside scattered resistance and securing the legendary oil derricks of Baku on the Caspian Sea. Direct rail tankers are already dispatching crude fuel westward to Berlin."
 ww1_germany_events.66.a:0 "The lifeblood of modern war is ours!"
