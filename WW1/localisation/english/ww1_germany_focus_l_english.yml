l_english:
 # =========================================================================
 # GERMAN EMPIRE NATIONAL FOCUS TREE LOCALISATION (ENGLISH)
 # =========================================================================

 # Phase I (1911-1914) - Belle Époque & Pre-War Arms Race
 GER_agadir_crisis_gambit: "Agadir Crisis Gambit"
 GER_agadir_crisis_gambit_desc: "In response to French expansionism in Morocco, we dispatch the gunboat SMS Panther to the Atlantic port of Agadir to assert Germany's rightful place in the sun and demand colonial concessions."
 GER_tirpitz_fourth_naval_bill: "Tirpitz's Fourth Naval Bill"
 GER_tirpitz_fourth_naval_bill_desc: "Grand Admiral von Tirpitz presents the Fourth Amendment to the Fleet Acts. The High Seas Fleet must match the Royal Navy in capital dreadnought tonnage to protect German commerce across the seven seas."
 GER_berlin_baghdad_railway: "Berlin-Baghdad Railway"
 GER_berlin_baghdad_railway_desc: "Constructing the grand trans-continental railway through Anatolia and Mesopotamia binds the Sublime Porte to Berlin and secures vital direct land access to Middle Eastern crude oil."
 GER_army_bill_1912: "Army Bill of 1912"
 GER_army_bill_1912_desc: "Facing the Franco-Russian military alliance, the Reichstag authorizes two new army corps, adding 80,000 highly trained men to the standing forces of the Kaiserreich."
 GER_centenary_of_leipzig_1913: "Centenary of Leipzig"
 GER_centenary_of_leipzig_1913_desc: "Celebrating the centennial of the Battle of the Nations at Leipzig unites the German people under the Hohenzollern banner, forging an unbreakable national bond across all classes."
 GER_expand_heavy_howitzers: "Expand Heavy Howitzers"
 GER_expand_heavy_howitzers_desc: "Krupp Essen must accelerate the casting of 420mm siege howitzers—the legendary 'Big Bertha'—engineered specifically to shatter the reinforced concrete ring fortresses of Europe."
 GER_the_blank_cheque: "The Blank Cheque"
 GER_the_blank_cheque_desc: "In the wake of Archduke Franz Ferdinand's assassination in Sarajevo, Kaiser Wilhelm II assures Emperor Franz Joseph of Germany's unconditional, steadfast alliance against Serbian aggression."

 # Phase II (1914-1917) - Operational Choice & Total War
 GER_execute_schlieffen_plan: "Execute the Schlieffen Plan"
 GER_execute_schlieffen_plan_desc: "Following Count von Schlieffen's master strategy, our massive right wing shall sweep through Belgium and Luxembourg in a lightning wheeling motion to envelop Paris within forty days."
 GER_smash_liege_forts: "Smash Liège Fortresses"
 GER_smash_liege_forts_desc: "Deploy our Krupp 420mm siege mortars against the fortified ring of Liège. General Erich Ludendorff shall personally lead the assault to blast open the gateway to France."
 GER_the_miracle_of_tannenberg: "The Miracle of Tannenberg"
 GER_the_miracle_of_tannenberg_desc: "Under the brilliant joint leadership of Field Marshal von Hindenburg and General Ludendorff, the Eighth Army encircles and destroys the invading Russian Second Army in the Masurian forests."
 GER_aufmarsch_ost_focus: "Aufmarsch II Ost"
 GER_aufmarsch_ost_focus_desc: "Rejecting the invasion of neutral Belgium, we anchor our western defenses in the impregnable fortresses of Alsace-Lorraine and concentrate eighty percent of the Imperial Army to smash the Czar in the East."
 GER_haber_bosch_nitrogen_miracle: "Haber-Bosch Nitrogen Miracle"
 GER_haber_bosch_nitrogen_miracle_desc: "Fritz Haber and Carl Bosch have perfected atmospheric nitrogen fixation. This scientific breakthrough provides unlimited synthetic nitrates for explosives, entirely breaking the Allied blockade."
 GER_chemical_warfare_initiative: "Chemical Warfare Initiative"
 GER_chemical_warfare_initiative_desc: "Unleash weaponized chlorine and mustard gas upon enemy trench lines at Ypres. In modern industrial war, chemistry shall become the ultimate arbiter of victory."
 GER_hindenburg_program: "The Hindenburg Program"
 GER_hindenburg_program_desc: "The Supreme Army Command assumes dictatorial control over all national industry. Factories, railways, and coal mines are mobilized into a ruthless engine of total warfare."
 GER_stosstruppen_tactics: "Stosstruppen Infiltration Tactics"
 GER_stosstruppen_tactics_desc: "Discarding rigid massed infantry waves, we train autonomous elite stormtrooper squads equipped with light machine guns, trench mortars, and flamethrowers to bypass enemy strongpoints."

 # Phase III - OHL Military Dictatorship
 GER_silent_dictatorship_ohl: "Silent Military Dictatorship"
 GER_silent_dictatorship_ohl_desc: "The Kaiser recedes into a ceremonial figurehead as Hindenburg and Ludendorff establish total military governance over the Reich, subordinating civilian ministries to the High Command."
 GER_unrestricted_submarine_warfare: "Unrestricted Submarine Warfare"
 GER_unrestricted_submarine_warfare_desc: "Unleash our U-boat wolfpacks to sink any vessel approaching the British Isles without warning. We shall starve Britain into surrender before American aid can reach European soil."
 GER_sealed_train_to_petrograd: "Sealed Train to Petrograd"
 GER_sealed_train_to_petrograd_desc: "Facilitate Vladimir Lenin's passage from Swiss exile across German rails in a sealed train car. The Bolsheviks will incite revolution in Petrograd and take Russia out of the war."
 GER_treaty_of_brest_litovsk: "Treaty of Brest-Litovsk"
 GER_treaty_of_brest_litovsk_desc: "Dictate terms to Soviet Russia at Brest-Litovsk. Russia renounces sovereignty over Poland, the Baltic, Belarus, and Ukraine, securing boundless grain and minerals for Mitteleuropa."
 GER_the_kaiserschlacht_1918: "The Kaiserschlacht"
 GER_the_kaiserschlacht_1918_desc: "Transferred veteran divisions from the Russian front join our stormtroopers in Operation Michael—the ultimate spring offensive to crush the Allied armies and capture Paris."

 # Phase III - Volkskaiserreich (Reformist Monarchy)
 GER_bethmann_civilian_supremacy: "Civilian Parliamentary Supremacy"
 GER_bethmann_civilian_supremacy_desc: "Chancellor von Bethmann-Hollweg reasserts civilian constitutional authority over the military camarilla, preventing reckless escalation and preserving the rule of law."
 GER_prussian_franchise_reform: "Prussian Franchise Reform"
 GER_prussian_franchise_reform_desc: "Abolish the archaic three-class voting system in Prussia. Grant equal, secret, and direct suffrage to all citizens, integrating the social-democratic working class into the state."
 GER_reichstag_peace_resolution: "Reichstag Peace Resolution"
 GER_reichstag_peace_resolution_desc: "The Reichstag approves a historic cross-party resolution declaring that Germany seeks an honorable peace of mutual understanding, without forced annexations or economic subjugation."
 GER_constitutional_monarchy_proclamation: "Constitutional Monarchy Proclamation"
 GER_constitutional_monarchy_proclamation_desc: "Transform the German Empire into a modern constitutional parliamentary monarchy. The Chancellor becomes accountable to the elected Reichstag, safeguarding peace and national unity."

 # Phase III - Deutsche Vaterlandspartei (Radical Annexationist)
 GER_found_vaterlandspartei: "Found the Deutsche Vaterlandspartei"
 GER_found_vaterlandspartei_desc: "Grand Admiral von Tirpitz and Wolfgang Kapp establish the German Fatherland Party to champion uncompromising annexations, total war, and the annihilation of pacifist defeatism."
 GER_total_war_mobilization: "Total War Mobilization"
 GER_total_war_mobilization_desc: "Enact universal compulsory labor conscription for all men and women between fifteen and sixty. Every scrap of metal, bushel of grain, and ounce of labor belongs to the fatherland."
 GER_annexation_of_belgium_and_briey: "Annexation of Belgium and Briey"
 GER_annexation_of_belgium_and_briey_desc: "Declare the permanent incorporation of Belgium and the French Briey-Longwy iron basin into the German Reich. German industrial supremacy in western Europe is secured forever."
 GER_morphed_mitteleuropa_iron_rule: "Mitteleuropa Under Iron Rule"
 GER_morphed_mitteleuropa_iron_rule_desc: "Forge all central and eastern European nations into an imperial economic and military bloc directed solely from Berlin, creating an unshakeable continental hegemony."

 # Easter Eggs & Alt-History
 GER_willy_nicky_telegrams_bjorko: "Willy-Nicky Telegrams: Björkö 2.0"
 GER_willy_nicky_telegrams_bjorko_desc: "Kaiser Wilhelm reaches out directly to his cousin Tsar Nicholas II to resurrect the secret Björkö alliance. Germany and Russia unite their empires, dividing the Old World between them."
 GER_hajj_wilhelm_pan_islamic_crusade: "Hajj Wilhelm: Pan-Islamic Crusade"
 GER_hajj_wilhelm_pan_islamic_crusade_desc: "Embracing Max von Oppenheim's revolutionary strategy, the Kaiser proclaims solidarity with the Islamic world, unleashing Holy War across the British and Russian colonial peripheries."
 GER_spartakusbund_proletarian_revolt: "Spartakusbund Proletarian Revolt"
 GER_spartakusbund_proletarian_revolt_desc: "As the burdens of imperialist war become unbearable, Rosa Luxemburg and Karl Liebknecht lead the revolutionary working class to overthrow the monarchy and establish a socialist republic."
 GER_emergency_danubian_annexation: "Emergency Danubian Annexation"
 GER_emergency_danubian_annexation_desc: "With the Austro-Hungarian state disintegrating on the battlefield, German troops march into Vienna to annex the German-Austrian homelands into the Greater German Reich."

 # National Ideas & Modifiers
 GER_silent_dictatorship_ohl: "Silent Military Dictatorship (OHL)"
 GER_ohl_supreme_command: "OHL Supreme Command"
 GER_schlieffen_momentum: "Schlieffen Plan Momentum"
 GER_civilian_general_staff: "Civilian-Subordinated General Staff"
 GER_unrestricted_submarine_warfare_spirit: "Unrestricted Submarine Campaign"
 GER_vaterlandspartei_rule: "Fatherland Party Governance"
 GER_total_war_labor_conscription: "Total War Labor Conscription"
 GER_belgian_briey_exploitation: "Exploitation of Belgium and Briey"
 GER_pan_islamic_jihad_spirit: "Pan-Islamic Jihad Support"
 GER_constitutional_monarchy_spirit: "Parliamentary Constitutionalism"

 # Event Titles and Descriptions
 ww1_germany_events.1.t: "The Agadir Crisis"
 ww1_germany_events.1.d: "The arrival of SMS Panther off the coast of Morocco has ignited an international firestorm between Germany, France, and Britain."
 ww1_germany_events.1.a: "Demand territorial compensation in the Congo"
 ww1_germany_events.1.b: "Stand firm and demand Moroccan independence"
 ww1_germany_events.2.t: "The Blank Cheque Dispatched"
 ww1_germany_events.2.d: "Berlin has pledged unconditional military support to Vienna in its confrontation with Serbia."
 ww1_germany_events.2.a: "We stand with the Dual Monarchy"
 ww1_germany_events.3.t: "Invasion of Belgium Ordered"
 ww1_germany_events.3.d: "German armies advance through neutral Belgium to strike at Paris, triggering British entry into the war."
 ww1_germany_events.3.a: "Necessity knows no law!"
 ww1_germany_events.4.t: "Aufmarsch II Ost Initiated"
 ww1_germany_events.4.d: "Germany maintains defensive fortifications on the Rhine while concentrating overwhelming force against Russia."
 ww1_germany_events.4.a: "The East is our destiny"
 ww1_germany_events.5.t: "Fall of Liège"
 ww1_germany_events.5.d: "Krupp super-heavy siege howitzers have demolished the formidable ring fortresses defending Liège."
 ww1_germany_events.5.a: "The gateway to the west is open"
 ww1_germany_events.6.t: "Triumph at Tannenberg"
 ww1_germany_events.6.d: "The Russian Second Army has been annihilated in East Prussia, cementing Hindenburg and Ludendorff as national heroes."
 ww1_germany_events.6.a: "A legendary victory"
 ww1_germany_events.7.t: "Poison Gas Unleashed"
 ww1_germany_events.7.d: "Clouds of asphyxiating gas drift across enemy lines, marking a deadly new era in trench warfare."
 ww1_germany_events.7.a: "Let the enemy tremble"
 ww1_germany_events.8.t: "Unrestricted Submarine Warfare Commenced"
 ww1_germany_events.8.d: "U-boats have received orders to sink all merchant shipping supplying the British Isles without warning."
 ww1_germany_events.8.a: "Choke the British lifeline"
 ww1_germany_events.9.t: "Lenin Departs for Petrograd"
 ww1_germany_events.9.d: "The sealed train carrying Vladimir Lenin and fellow Bolsheviks has crossed into Scandinavia en route to Petrograd."
 ww1_germany_events.9.a: "Planting the seeds of revolution"
 ww1_germany_events.10.t: "Treaty of Brest-Litovsk Signed"
 ww1_germany_events.10.d: "Soviet Russia has capitulated to German terms, ceding vast territories across Eastern Europe."
 ww1_germany_events.10.a: "The East is won"
 ww1_germany_events.11.t: "Reichstag Passes Peace Resolution"
 ww1_germany_events.11.d: "A parliamentary majority has voted to seek a negotiated peace without annexations or indemnities."
 ww1_germany_events.11.a: "A path toward reconciliation"
 ww1_germany_events.12.t: "The Spartakus Proclamation"
 ww1_germany_events.12.d: "Revolutionary workers and mutinying sailors have proclaimed the Free Socialist Republic of Germany!"
 ww1_germany_events.12.a: "All power to the workers' councils!"
 ww1_germany_events.13.t: "The Björkö Accord Resurrected"
 ww1_germany_events.13.d: "In a stunning diplomatic coup, Wilhelm and Nicholas have signed a secret pact of eternal brotherhood."
 ww1_germany_events.13.a: "Autocracy reigns supreme"
 ww1_germany_events.14.t: "The Kaiser's Holy War"
 ww1_germany_events.14.d: "The Green Flag of Islam is raised alongside the Hohenzollern eagle in a global holy war against the Entente."
 ww1_germany_events.14.a: "Allahu Akbar and Gott mit uns!"
 ww1_germany_events.15.t: "The Greater German Union"
 ww1_germany_events.15.d: "German troops have entered Vienna to secure the Austrian homelands, uniting all Germans under one crown."
 ww1_germany_events.15.a: "Großdeutschland is realized!"

 # Custom Tooltips
 ww1_ger_agadir_concessions_tt:0 "§YGermany§! secures territorial compensations in the Neukamerun region from France in exchange for recognizing French Morocco."

 # Opinion Modifiers
 ger_berlin_baghdad_railway_op:0 "Berlin-Baghdad Railway Project"
 ger_blank_cheque_op:0 "The Blank Cheque to Vienna"

 # Cosmetic Tags
 GER_socialist:0 "German Socialist Republic"
 GER_socialist_DEF:0 "The German Socialist Republic"
 GER_socialist_ADJ:0 "German"
# --- DECISION CATEGORIES ---
 GER_schlieffen_operations: "Schlieffen Plan Tactical Operations"
 GER_schlieffen_operations_desc: "Timely coordination of the right wing, railway timetables, and siege guns to achieve a rapid, decisive victory against France."
 GER_kriegsrohstoffabteilung: "Kriegsrohstoffabteilung (Raw Materials Office)"
 GER_kriegsrohstoffabteilung_desc: "Industrial state control, scrap recycling, and synthetic chemistry under Walther Rathenau to defeat the British naval blockade."
 GER_food_and_rationing: "Food Supplies & Rationing"
 GER_food_and_rationing_desc: "Distributing food rations, enforcing grain delivery quotas, and managing the severe Turnip Winter to prevent home front collapse."
 GER_eastern_occupation_ober_ost: "Ober Ost Military Administration"
 GER_eastern_occupation_ober_ost_desc: "Exploiting conquered Russian provinces, securing Baltic timber, and extracting agrarian supply chains for the Reich."
 GER_u_boat_campaign: "Imperial U-Boat Campaign"
 GER_u_boat_campaign_desc: "Submarine raiding against Entente merchant fleets across the North Sea, the Channel, and the Atlantic."
 GER_weltpolitik_diplomacy: "Imperial Weltpolitik Diplomacy"
 GER_weltpolitik_diplomacy_desc: "Leveraging alliances, colonial investments, and diplomatic influence across Europe, the Ottoman Empire, and the Americas."

 # --- DECISIONS ---
 ger_schlieffen_reinforce_right_wing: "Reinforce von Kluck's Right Wing"
 ger_schlieffen_reinforce_right_wing_desc: "Transfer reserve divisions and heavy munitions to ensure the enveloping wheel through Belgium does not lose momentum."
 ger_schlieffen_railway_timetables: "Emergency Military Railway Timetables"
 ger_schlieffen_railway_timetables_desc: "Prioritize strategic train redeployment across the Rhineland to keep the frontline army fully supplied."
 ger_schlieffen_liege_siege_howitzers: "Deploy Krupp 420mm Siege Guns at Liège"
 ger_schlieffen_liege_siege_howitzers_desc: "Brought up by special rail, Big Bertha howitzers will obliterate the concrete fortresses blocking our advance."
 ger_schlieffen_violate_luxembourg: "Occupy the Grand Duchy of Luxembourg"
 ger_schlieffen_violate_luxembourg_desc: "Seize control of the vital railway junction at Luxembourg City to support the Western advance."
 ger_kra_requisition_scrap_metals: "National Requisition of Scrap Metals"
 ger_kra_requisition_scrap_metals_desc: "Confiscate church bells, copper roofs, and private brass wares to supply munitions factories."
 ger_kra_buna_rubber_rnd: "Synthetic Buna Rubber R&D"
 ger_kra_buna_rubber_rnd_desc: "Invest in chemical syntheses at Leverkusen to produce synthetic elastomers, freeing us from maritime rubber imports."
 ger_kra_substitute_textiles: "Produce Paper & Nettle Substitute Textiles"
 ger_kra_substitute_textiles_desc: "Weave cellulose fibers and wood pulp into military uniforms and industrial sacking to bypass wool shortages."
 ger_kra_priority_coal_allocations: "Prioritize Coal Allocations to Munitions Foundries"
 ger_kra_priority_coal_allocations_desc: "Divert Ruhr coking coal directly into arms manufacturing, accepting temporary domestic heating shortages."
 ger_rationing_introduce_k_brot: "Introduce Kriegsbrot (K-Brot)"
 ger_rationing_introduce_k_brot_desc: "Mandate the dilution of wheat flour with potato meal and sawdust to stretch the national grain reserve."
 ger_rationing_pomeranian_grain_requisition: "Enforce Pomeranian Grain Quotas"
 ger_rationing_pomeranian_grain_requisition_desc: "Send agricultural inspectors and gendarmes to requisition unharvested grain from agrarian estates."
 ger_rationing_emergency_soup_kitchens: "Fund Emergency Municipal Soup Kitchens"
 ger_rationing_emergency_soup_kitchens_desc: "Provide hot meals to working-class families in Berlin and Essen to keep industrial unrest under control."
 ger_rationing_import_danubian_grain: "Import Danubian Grain from Austria-Hungary"
 ger_rationing_import_danubian_grain_desc: "Negotiate priority grain shipments along the Danube from Hungarian estates to feed German industrial cities."
 ger_ober_ost_bialowieza_timber: "Fell Timber in Białowieża Forest"
 ger_ober_ost_bialowieza_timber_desc: "Establish military sawmills to produce millions of railway ties and trench props from ancient eastern forests."
 ger_ober_ost_polish_regency_council: "Proclaim the Regency Kingdom of Poland"
 ger_ober_ost_polish_regency_council_desc: "Establish an autonomous Polish regency council in Warsaw to rally Polish nationalist volunteers to our cause."
 ger_ober_ost_ukrainian_grain_trains: "Secure Ukrainian Grain Deliveries"
 ger_ober_ost_ukrainian_grain_trains_desc: "Coordinate direct freight lines from Kiev and Odessa to relieve domestic hunger in Germany."
 ger_ober_ost_railway_gauge_conversion: "Convert Eastern Railways to Standard Gauge"
 ger_ober_ost_railway_gauge_conversion_desc: "Re-spike broad Russian track beds to standard European gauge so German locomotives can run directly to the front."
 ger_u_boat_patrol_western_approaches: "Deploy U-Boats to the Western Approaches"
 ger_u_boat_patrol_western_approaches_desc: "Ambush Atlantic convoys entering Liverpool and the English Channel."
 ger_u_boat_mine_celtic_sea: "Sow Naval Mines in the Celtic Sea"
 ger_u_boat_mine_celtic_sea_desc: "Deploy mine-laying submersibles to channel British merchant traffic into kill zones."
 ger_u_boat_prize_rules_compliance: "Strict Adherence to Cruiser Prize Rules"
 ger_u_boat_prize_rules_compliance_desc: "Ensure surfaced U-Boats warn merchant crews and verify papers, calming neutral American outrage."
 ger_weltpolitik_hejaz_railway_subsidy: "Subsidize the Ottoman Hejaz Railway"
 ger_weltpolitik_hejaz_railway_subsidy_desc: "Send Deutsche Bank capital and Prussian engineers to expand rail lines toward Damascus and Medina."
 ger_weltpolitik_bulgarian_mission: "Dispatch Military Mission to Sofia"
 ger_weltpolitik_bulgarian_mission_desc: "Supply German mountain guns and field radios to Tsar Ferdinand to seal Bulgaria's entry into the Central Powers."
 ger_weltpolitik_bribe_italian_press: "Subsidize Neutralist Italian Newspapers"
 ger_weltpolitik_bribe_italian_press_desc: "Finance conservative and Catholic journals in Rome and Milan to counter Entente interventionist propaganda."
 ger_weltpolitik_zimmermann_telegram: "Transmit the Zimmermann Telegram"
 ger_weltpolitik_zimmermann_telegram_desc: "Transmit Arthur Zimmermann's secret alliance proposal to Mexico, offering Texas, New Mexico, and Arizona."

 # --- EVOLUTIONARY NATIONAL SPIRITS ---
 GER_peacetime_industrial_giants: "Peacetime Industrial Hegemony"
 GER_peacetime_industrial_giants_desc: "German chemical, steel, and electrical cartels dominate world markets with unmatched efficiency."
 GER_rathenau_kra_coordination: "KRA War Materials Coordination"
 GER_rathenau_kra_coordination_desc: "Walther Rathenau's War Raw Materials Department centrally plans resources, keeping arms factories operating under blockade."
 GER_hindenburg_total_mobilization: "Hindenburg Total War Program"
 GER_hindenburg_total_mobilization_desc: "The entire civilian and industrial apparatus is subordinated to arms production through the Auxiliary Service Law."
 GER_war_exhaustion_or_triumph: "Post-War Economic Transformation"
 GER_war_exhaustion_or_triumph_desc: "The monumental industrial expansion of the war is demobilized into long-term infrastructure and manufacturing dominance."
 GER_free_seas_trade: "Unhindered Global Trade"
 GER_free_seas_trade_desc: "Unrestricted maritime access allows Germany to import raw materials and food freely from overseas markets."
 GER_naval_blockade_strain: "Distant Naval Blockade"
 GER_naval_blockade_strain_desc: "The Royal Navy's distant cordon in the North Sea is choking imports of rubber, fertilizer, and foodstuffs."
 GER_turnip_winter_crisis: "The Turnip Winter (Steckrübenwinter)"
 GER_turnip_winter_crisis_desc: "With potato crops ruined and bread rationed, turnips have become the staple food of a starving population."
 GER_ukraine_grain_relief: "Ukrainian Agrarian Relief"
 GER_ukraine_grain_relief_desc: "Shipments of grain from the black-soil plains of Ukraine have broken the famine and restored home front morale."
 GER_moltke_generalstab_doctrine: "Moltke Manoeuvre Warfare"
 GER_moltke_generalstab_doctrine_desc: "The General Staff pursues quick envelopment and flexible initiative to secure swift operational decision."
 GER_falkenhayn_attrition_doctrine: "Falkenhayn Strategic Attrition"
 GER_falkenhayn_attrition_doctrine_desc: "Carefully calibrated material battles and deep entrenchment designed to bleed enemy armies white."
 GER_ludendorff_stormtrooper_assault: "Ludendorff Infiltration Tactics"
 GER_ludendorff_stormtrooper_assault_desc: "Specialized Stosstruppen infiltrate enemy lines following intense hurricane bombardments."
 GER_veteran_kaiserheer: "Veterans of the Great War"
 GER_veteran_kaiserheer_desc: "Years of modern industrialized warfare have tempered the German soldier into an incomparable combat veteran."
 GER_parliamentary_friction: "Reichstag Parliamentary Friction"
 GER_parliamentary_friction_desc: "Socialist and progressive deputies are openly demanding constitutional reform and voting transparency."
 GER_reichstag_strike_unrest: "Munitions Strikes & Food Riots"
 GER_reichstag_strike_unrest_desc: "War weariness and hunger have sparked major strikes in Berlin, Leipzig, and the Ruhr shipyards."
 GER_schlieffen_plan_failed: "Failure of the Schlieffen Plan"
 GER_schlieffen_plan_failed_desc: "The Miracle of the Marne has halted our sweep toward Paris. The war of manoeuvre has ossified into trench stagnation."
 GER_fokker_scourge_air_dominance: "The Fokker Scourge"
 GER_fokker_scourge_air_dominance_desc: "Fokker's synchronization gear allows German pilots to fire directly through propeller arcs, commanding the skies."
 GER_zeppelin_strategic_terror: "Zeppelin Strategic Terror"
 GER_zeppelin_strategic_terror_desc: "Navy and Army airships raid enemy capitals, forcing the Allies to divert fighters and searchlights to home defense."
 GER_skagerrak_naval_victory: "Triumph of the High Seas Fleet"
 GER_skagerrak_naval_victory_desc: "The Hochseeflotte inflicted devastating losses on the Grand Fleet at Jutland, severely contesting British sea control."
 GER_skagerrak_naval_stalemate: "North Sea Naval Stalemate"
 GER_skagerrak_naval_stalemate_desc: "While technically unbroken, the High Seas Fleet remains contained in Wilhelmshaven, ceding high seas initiative."
# --- PRE-WAR FOCUSES (1911-1914) ---
 GER_kaiser_wilhelm_personal_rule: "The Kaiser's Personal Rule"
 GER_kaiser_wilhelm_personal_rule_desc: "Wilhelm II has long asserted the imperial prerogative over civil ministries and foreign policy."
 GER_reichstag_1912_elections: "The 1912 Reichstag Elections"
 GER_reichstag_1912_elections_desc: "The Social Democratic Party has won a historic victory in the imperial parliament, challenging the conservative establishment."
 GER_appease_the_junkers: "Reassure the Prussian Junkers"
 GER_appease_the_junkers_desc: "The aristocratic East Elbian agrarian elites must be reassured of the Crown's unwavering protection against socialist demands."
 GER_reichstag_social_concessions: "Compromise with the Centre and Socialists"
 GER_reichstag_social_concessions_desc: "Chancellor Bethmann-Hollweg seeks a working majority with the Catholic Centre Party and moderate socialists to fund the military."
 GER_prussian_franchise_debate: "Debate the Prussian Franchise"
 GER_prussian_franchise_debate_desc: "The antiquated three-class voting system of Prussia has become an unsustainable source of working-class agitation."
 GER_heartland_of_the_ruhr: "Heartland of the Ruhr"
 GER_heartland_of_the_ruhr_desc: "The coal valleys and blast furnaces of Westphalia form the beating industrial heart of the Deutsches Reich."
 GER_krupp_heavy_ordnance_contracts: "Expand Krupp Ordnance Contracts"
 GER_krupp_heavy_ordnance_contracts_desc: "The Krupp armaments empire in Essen is commissioned to design unprecedented heavy siege artillery for the imperial army."
 GER_silesian_coal_and_foundries: "Upper Silesian Industrial Basin"
 GER_silesian_coal_and_foundries_desc: "Vast reserves of black coal, zinc, and iron in Silesia provide the raw material foundation for imperial production."
 GER_saarland_steel_works: "Saarland Heavy Metallurgy"
 GER_saarland_steel_works_desc: "Modernizing the foundries of the Saar basin ensures continuous supply of high-grade steel for guns and armor plate."
 GER_chemical_cartels_basf: "Chemical Cartels of BASF & Bayer"
 GER_chemical_cartels_basf_desc: "German chemical synthesis leads the world, pioneering artificial dyes, pharmaceuticals, and synthetic nitrogen."
 GER_electrical_giants_siemens_aeg: "Electrical Hegemony: Siemens & AEG"
 GER_electrical_giants_siemens_aeg_desc: "Electrification of railways, dynamos, and field telegraph networks gives Germany unmatched infrastructural efficiency."
 GER_reichsbahn_strategic_network: "Imperial Strategic Rail Network"
 GER_reichsbahn_strategic_network_desc: "Upgrading double-track main lines ensures that imperial field armies can redeploy from west to east in days."
 GER_rhine_railway_bridges: "Double-Track the Rhine Bridges"
 GER_rhine_railway_bridges_desc: "Massive railway bridges across the Rhine at Cologne and Remagen form the linchpin of western mobilization timetables."
 GER_east_prussian_supply_depots: "Fortify East Prussian Supply Hubs"
 GER_east_prussian_supply_depots_desc: "Stockpiling grains and munitions at Insterburg and Königsberg ensures our isolated eastern border can hold against Russian hordes."
 GER_dreadnought_battle_squadrons: "Dreadnought Battle Squadrons"
 GER_dreadnought_battle_squadrons_desc: "Laying down heavy modern battleships of the Kaiser and König classes to rival the Royal Navy in the North Sea."
 GER_hipper_battlecruisers: "Hipper's Scouting Battlecruisers"
 GER_hipper_battlecruisers_desc: "Building fast, heavily armored battlecruisers under Admiral Franz von Hipper to outmanoeuvre enemy scouting lines."
 GER_kiel_canal_widening: "Widen the Kaiser-Wilhelm-Kanal"
 GER_kiel_canal_widening_desc: "Dredging and expanding the locks of the Kiel Canal allows dreadnoughts to transit between the Baltic and North Sea without detour."
 GER_heligoland_island_fortress: "Fortress Island of Heligoland"
 GER_heligoland_island_fortress_desc: "Turning the red sandstone rock of Heligoland into an unsinkable dreadnought guarding the mouths of the Elbe and Weser."
 GER_imperial_airship_corps: "Imperial Airship Corps"
 GER_imperial_airship_corps_desc: "Count Ferdinand von Zeppelin's rigid airships provide long-range maritime patrol and psychological terror capability."
 GER_aviator_training_schools: "Döberitz Aviation Grounds"
 GER_aviator_training_schools_desc: "Establishing standardized pilot training for observation, reconnaissance, and forward artillery spotters."
 GER_rumpler_reconnaissance_craft: "Rumpler Observation Biplanes"
 GER_rumpler_reconnaissance_craft_desc: "Procuring reliable, high-altitude reconnaissance craft to map enemy fortifications and troop dispositions."
 GER_army_bill_1913_expansion: "The Great Army Bill of 1913"
 GER_army_bill_1913_expansion_desc: "The largest peacetime army expansion in German history adds two new army corps to meet the expanding Russian threat."
 GER_kriegsakademie_staff_cadres: "General Staff Officer Cadres"
 GER_kriegsakademie_staff_cadres_desc: "The Kriegsakademie produces staff officers trained in rigorous operational calculations and decentralized command initiative."
 GER_machine_gun_detachments_mg08: "Standardize Maschinengewehr 08"
 GER_machine_gun_detachments_mg08_desc: "Equipping every infantry regiment with specialized machine gun companies to dramatically multiply defensive firepower."
 GER_austro_hungarian_staff_coordination: "Dual Alliance Staff Coordination"
 GER_austro_hungarian_staff_coordination_desc: "Coordinating mobilization schedules between Chief of Staff von Moltke and Austrian Field Marshal Conrad von Hötzendorf."
 GER_ottoman_military_mission_sanders: "Military Mission to Constantinople"
 GER_ottoman_military_mission_sanders_desc: "General Otto Liman von Sanders is dispatched to reorganize the Ottoman Army and secure the Turkish Straits for Germany."
 GER_preserve_italian_loyalty: "Maintain the Triple Alliance"
 GER_preserve_italian_loyalty_desc: "Applying diplomatic pressure and loans to keep Rome anchored to the Central Powers despite irredentist claims."

 # --- EVENTS 17-20 ---
 ww1_germany_events.17.t: "The 1912 Reichstag Election Returns"
 ww1_germany_events.17.d: "The imperial election has concluded with a sweeping victory for the Social Democrats, who now hold the largest faction in parliament."
 ww1_germany_events.17.a: "A grave concern for the monarchy"
 ww1_germany_events.17.b: "We shall govern through patriotic duty"
 ww1_germany_events.18.t: "Austro-Hungarian Staff Protocols Concluded"
 ww1_germany_events.18.d: "Field Marshal Conrad von Hötzendorf has agreed to joint railway coordination and forward deployment plans against Russia."
 ww1_germany_events.18.a: "The Dual Alliance stands united"
 ww1_germany_events.19.t: "Liman von Sanders Arrives at the Golden Horn"
 ww1_germany_events.19.d: "German military instructors have taken up command posts across the Ottoman Empire, modernizing Turkish coastal guns and infantry divisions."
 ww1_germany_events.19.a: "Securing the gateway to the Orient"
 ww1_germany_events.20.t: "The Triple Alliance Reaffirmed"
 ww1_germany_events.20.d: "The Italian government has formally acknowledged its commitments under the Triple Alliance, promising neutrality or support."
 ww1_germany_events.20.a: "Italy remains our partner"

 # --- Batch 3 Operational Focuses ---
 GER_sarajevo_reaction:0 "Reaction to Sarajevo"
 GER_sarajevo_reaction_desc:0 "The assassination of Archduke Franz Ferdinand in Sarajevo threatens to ignite the Balkan powder keg. The German Empire must signal unwavering solidarity with Vienna."
 GER_proclaim_state_of_war_danger:0 "State of Imminent War Danger"
 GER_proclaim_state_of_war_danger_desc:0 "Proclaiming the 'Zustand drohender Kriegsgefahr' places the Reich's armed forces, railways, and border posts on immediate war alert, initiating mobilization protocols."
 GER_ultimatum_to_belgium:0 "Ultimatum to Belgium"
 GER_ultimatum_to_belgium_desc:0 "To outflank the formidable French barrier forts along the Meuse and Moselle, the German Army demands unimpeded passage through Belgian territory."
 GER_battle_of_the_frontiers:0 "The Battle of the Frontiers"
 GER_battle_of_the_frontiers_desc:0 "Clashing with French armies attempting Plan XVII in Alsace-Lorraine and the Ardennes, German corps unleash devastating artillery and machine gun firepower."
 GER_crossing_the_marne:0 "Crossing the Marne"
 GER_crossing_the_marne_desc:0 "Von Kluck's First Army and von Bülow's Second Army surge south across the Marne River, bringing Paris within sight of German advance scouts."
 GER_race_to_the_sea:0 "The Race to the Sea"
 GER_race_to_the_sea_desc:0 "As open flanks are turned and armies clash in Flanders and Artois, both sides desperately dig in, creating an unbroken line of trenches from Switzerland to the North Sea."
 GER_battle_of_masurian_lakes:0 "Battle of the Masurian Lakes"
 GER_battle_of_masurian_lakes_desc:0 "Following the destruction of Samsonov's Second Army at Tannenberg, Hindenburg and Ludendorff turn on Rennenkampf's First Army among the treacherous East Prussian lakes."
 GER_relief_of_przemysl:0 "The Relief of Przemyśl"
 GER_relief_of_przemysl_desc:0 "Our Austro-Hungarian allies are besieged in the great Galician fortress of Przemyśl. German army detachments must intervene to stabilize the crumbling Habsburg front."
 GER_gorlice_tarnow_breakthrough:0 "The Gorlice-Tarnów Breakthrough"
 GER_gorlice_tarnow_breakthrough_desc:0 "General August von Mackensen unleashes an unprecedented hurricane bombardment of heavy Krupp howitzers, smashing the Russian Third Army and shattering the Tsar's front."
 GER_the_great_retreat_of_1915:0 "The Great Retreat of 1915"
 GER_the_great_retreat_of_1915_desc:0 "Russian armies abandon Poland, Lithuania, and Courland in chaos. In their wake, the German Imperial Army establishes the military occupation authority of Ober Ost."
 GER_battle_of_verdun_attrition:0 "Operation Gericht: Battle of Verdun"
 GER_battle_of_verdun_attrition_desc:0 "Chief of the General Staff Erich von Falkenhayn resolves to 'bleed the French Army white' by targeting the historic fortress ring of Verdun."
 GER_somme_defensive_elasticity:0 "Elastic Defense on the Somme"
 GER_somme_defensive_elasticity_desc:0 "Against relentless Franco-British bombardments and infantry waves on the Somme, German commanders pioneer deep defense systems and flexible counter-attacks."
 GER_hindenburg_line_construction:0 "The Hindenburg Line (Siegfriedstellung)"
 GER_hindenburg_line_construction_desc:0 "A masterpiece of military engineering, this shortened, deeply fortified defensive bastion allows the German Army to economize manpower and absorb Allied assaults."

 # --- Decisions & Missions ---
 ger_mission_reach_paris:0 "Operation: Reach Paris Before the Offensive Stalls"
 ger_mission_reach_paris_desc:0 "The Schlieffen Plan relies on relentless speed and breakthrough. We must capture Paris within 25 days, or the operational momentum will dissipate into entrenched deadlock."

 # --- Ideas ---
 GER_schlieffen_hangover:0 "Schlieffen Offensive Exhaustion"
 GER_schlieffen_hangover_desc:0 "The rapid dash through Belgium and northern France has pushed our divisions to total physical exhaustion and outrun rail supply heads."
 GER_western_triumph:0 "Triumph in the West"
 GER_western_triumph_desc:0 "The lightning capture of Paris has shattered Allied resistance on the Western Front, delivering an astonishing operational triumph."
 GER_trench_stalemate_western_front:0 "Western Front Trench Stalemate"
 GER_trench_stalemate_western_front_desc:0 "The front has solidified into an impenetrable maze of barbed wire, machine gun redoubts, and deep dugout networks."

 # --- Events ---
 ww1_germany_events.21.t:0 "German Response to Sarajevo"
 ww1_germany_events.21.d:0 "The Kaiser and the Imperial Chancellor have pledged Germany's unconditional loyalty to the Austro-Hungarian Dual Monarchy in its hour of trial."
 ww1_germany_events.21.a:0 "We stand shoulder to shoulder with Vienna."

 ww1_germany_events.22.t:0 "German Ultimatum to Belgium"
 ww1_germany_events.22.d:0 "The German Imperial government demands unimpeded military transit through Belgian territory, claiming French forces intend to violate Belgian neutrality."
 ww1_germany_events.22.a:0 "Belgium is a nation, not a road! (Reject Ultimatum)"
 ww1_germany_events.22.b:0 "We yield under duress. (Accept German Transit)"

 ww1_germany_events.23.t:0 "The Miracle of the Marne"
 ww1_germany_events.23.d:0 "French and British armies have counterattacked along the Marne River. Exhausted German divisions, short on ammunition and out of touch with OHL, are forced to fall back to the Aisne."
 ww1_germany_events.23.a:0 "Fall back to the Aisne and dig in!"

 ww1_germany_events.24.t:0 "The Gorlice-Tarnów Breakthrough"
 ww1_germany_events.24.d:0 "Field Marshal von Mackensen's Eleventh Army has shattered the Russian defenses in Galicia with overwhelming artillery mass, sending the Tsar's forces into full retreat."
 ww1_germany_events.24.a:0 "Mackensen has broken the Russian colossus!"

 ww1_germany_events.25.t:0 "Operation Gericht: The Furnace of Verdun"
 ww1_germany_events.25.d:0 "General von Falkenhayn has launched a relentless assault against the French fortress ring of Verdun. The Meuse hills have become an industrial slaughterhouse."
 ww1_germany_events.25.a:0 "Bleed the French Army white."

 ww1_germany_events.26.t:0 "The Fall of Paris!"
 ww1_germany_events.26.d:0 "In an astounding feat of arms, German advance cavalry and infantry columns have broken through the outer fortifications and entered the French capital! The Eiffel Tower is crowned by the Imperial Black-White-Red standard."
 ww1_germany_events.26.a:0 "Gott mit uns! The West is won!"

 # --- Batch 4A: War Economy & KRA ---
 GER_rathenau_war_raw_materials_board:0 "Kriegsrohstoffabteilung (KRA)"
 GER_rathenau_war_raw_materials_board_desc:0 "Under visionary industrialist Walther Rathenau, the War Raw Materials Board systematically inventories, rations, and coordinates the distribution of critical industrial inputs."
 GER_confiscate_strategic_metals:0 "Confiscation of Strategic Metals"
 GER_confiscate_strategic_metals_desc:0 "To overcome Allied blockades on copper, zinc, and tin, municipal authorities seize bronze church bells, household copper cookware, and brass architecture for the munitions works."
 GER_synthetic_buna_rubber_development:0 "Buna Synthetic Rubber"
 GER_synthetic_buna_rubber_development_desc:0 "With access to natural rubber colonies severed by the Royal Navy, German chemists at Bayer synthesize methyl rubber to keep military vehicles rolling."
 GER_ersatz_materials_industry:0 "Ersatz Materials Production"
 GER_ersatz_materials_industry_desc:0 "Pioneering industrial substitution replaces wool with woven nettle fibers, cotton with wood cellulose, and lubricating oils with coal distillates."
 GER_coal_and_steel_rationing_board:0 "Coal & Steel Rationing Board"
 GER_coal_and_steel_rationing_board_desc:0 "Rationing coal and steel prioritizes Krupp heavy ordnance foundries and ammunition casing production above all civilian and railway uses."
 GER_imperial_war_credits_kriegsanleihen:0 "Imperial War Loans (Kriegsanleihen)"
 GER_imperial_war_credits_kriegsanleihen_desc:0 "Massive public subscription campaigns across banks, schools, and city squares fund the Kaiser's armies with patriotic civilian savings."

 # --- Batch 4A: Food Crisis & Blockade ---
 GER_british_starvation_blockade_strain:0 "The British Starvation Blockade"
 GER_british_starvation_blockade_strain_desc:0 "The Royal Navy's distant blockade in the North Sea strangles commercial shipping, starving the Central Powers of vital grain, fertilizer, and fat imports."
 GER_kriegsbrot_and_flour_rationing:0 "Kriegsbrot (K-Brot) Adulteration"
 GER_kriegsbrot_and_flour_rationing_desc:0 "Flour supplies are stretched by mandating the addition of potato meal, rye bran, and crushed grain husk, producing the dense, dark wartime 'K-Brot'."
 GER_imperial_grain_office:0 "Imperial Grain Office (Reichsgetreidestelle)"
 GER_imperial_grain_office_desc:0 "A centralized monopoly controls all grain threshing, flour milling, and bakery distribution across Prussia and the German federated states."
 GER_swine_massacre_consequences:0 "The Great Swine Massacre"
 GER_swine_massacre_consequences_desc:0 "The emergency cull of nine million pigs preserves precious grain for human consumption, but permanently shatters the nation's fertilizer and animal protein reserves."
 GER_steckrubenwinter_crisis_management:0 "The Turnip Winter (Steckrübenwinter)"
 GER_steckrubenwinter_crisis_management_desc:0 "As the potato crop rots in torrential autumn rains, the civilian populace survives on yellow Swedish turnips, boiled into turnip stew, turnip bread, and turnip coffee."
 GER_danubian_grain_imports:0 "Danubian Grain Convoys"
 GER_danubian_grain_imports_desc:0 "Securing river barge convoys along the Danube channels Austro-Hungarian, Bulgarian, and Wallachian grain straight into the hungry cities of the Ruhr."

 # --- Batch 4A: Naval War & Hochseeflotte ---
 GER_skagerrak_battle_of_jutland_clash:0 "The Clash of Skagerrak (Jutland)"
 GER_skagerrak_battle_of_jutland_clash_desc:0 "Vice-Admiral Reinhard Scheer and Franz von Hipper sortie the High Seas Fleet to trap Beatty's battlecruisers off Denmark, triggering the greatest clash of dreadnoughts in history."
 GER_break_the_distant_blockade_attempt:0 "Break the Distant Blockade"
 GER_break_the_distant_blockade_attempt_desc:0 "High Seas Fleet surface squadrons attempt coordinated sorties into the North Atlantic to sever Allied shipping lanes and challenge the British Grand Fleet."
 GER_commerce_raiding_cruisers:0 "High Seas Commerce Raiders"
 GER_commerce_raiding_cruisers_desc:0 "Disguised merchant cruisers such as SMS Möwe, Wolf, and Seeadler wage devastating asymmetric warfare across the Indian Ocean and South Atlantic."
 GER_unrestricted_u_boat_debate:0 "The Holtzendorff Memorandum"
 GER_unrestricted_u_boat_debate_desc:0 "Admiral von Holtzendorff presents a detailed mathematical calculation: sinking 600,000 tons of Allied shipping per month will force Great Britain to sue for peace within six months."
 GER_sussex_pledge_cruiser_rules_choice:0 "Adhere to the Sussex Pledge"
 GER_sussex_pledge_cruiser_rules_choice_desc:0 "Restricting U-boat operations strictly to Cruiser Prize Rules placates Washington, ensuring the United States remains neutral in the European war."
 GER_torpedo_transatlantic_convoys:0 "Unrestricted Submarine Warfare"
 GER_torpedo_transatlantic_convoys_desc:0 "Unleashing unrestricted submarine warfare orders U-boats to sink all merchant and passenger vessels in the war zone without warning, gambling on British surrender before American intervention."
 GER_operation_albion_baltic_islands:0 "Operation Albion"
 GER_operation_albion_baltic_islands_desc:0 "A model combined amphibious operation lands German corps on the Baltic islands of Ösel and Moon, driving the Russian fleet from the Gulf of Riga."
 GER_submarine_cruiser_u_kreuzer_fleet:0 "Long-Range U-Kreuzer Squadrons"
 GER_submarine_cruiser_u_kreuzer_fleet_desc:0 "Giant long-range submarine cruisers carry heavy 150mm deck guns and massive fuel bunkers capable of striking shipping off the coast of New York and Nova Scotia."

 # --- Batch 4A: Aviation & Aerial Superiority ---
 GER_the_fokker_scourge_dominance:0 "The Fokker Scourge"
 GER_the_fokker_scourge_dominance_desc:0 "Anthony Fokker's synchronization gear allows machine guns to fire through the propeller arc without hitting the blades, giving German monoplanes complete aerial supremacy over the Western Front."
 GER_albatros_diii_fighters:0 "Albatros D.III Scout Squadrons"
 GER_albatros_diii_fighters_desc:0 "Streamlined plywood monocoque fuselages and synchronized twin Spandau machine guns make the Albatros D.III the dread of Allied observation crews during 'Bloody April'."
 GER_dicta_boelcke_air_tactics:0 "Dicta Boelcke Air Doctrine"
 GER_dicta_boelcke_air_tactics_desc:0 "Captain Oswald Boelcke codifies the world's first formal tactical manual for aerial fighter combat: maintain height, attack with the sun, and never fire until within close range."
 GER_richthofens_flying_circus_aces:0 "The Flying Circus (Jagdgeschwader 1)"
 GER_richthofens_flying_circus_aces_desc:0 "Under Manfred von Richthofen, the Red Baron, brightly painted fighter squadrons move rapidly along the front like a traveling circus, hunting Allied formations."
 GER_gotha_bombers_turkenkreuz:0 "Operation Türkenkreuz (Gotha Raids)"
 GER_gotha_bombers_turkenkreuz_desc:0 "Twin-engine Gotha G.IV heavy bombers carry daylight bombing runs over London and the Thames estuary, terrorizing the British public and forcing London to divert front-line squadrons."
 GER_giant_zeppelin_staaken_fleet:0 "Zeppelin-Staaken R-Planes"
 GER_giant_zeppelin_staaken_fleet_desc:0 "Enormous four-engine 'Riesenflugzeuge' drop 1,000-kilogram aerial bombs on key rail junctions and government quarters in Paris and southeast England."
 GER_all_metal_junkers_aircraft:0 "Junkers All-Metal Ground Attackers"
 GER_all_metal_junkers_aircraft_desc:0 "Hugo Junkers pioneers corrugated duralumin armored fuselages, making the J.I virtually immune to enemy rifle and machine gun fire during low-level trench strafing."

 # --- Batch 4A: Total War Mobilization ---
 GER_auxiliary_service_law_hilfsdienst:0 "Auxiliary Service Law (Hilfsdienstgesetz)"
 GER_auxiliary_service_law_hilfsdienst_desc:0 "Field Marshal von Hindenburg imposes mandatory patriotic war service for all German males aged 16 to 60 not serving at the front, regimenting the industrial home front."
 GER_women_in_munitions_industry:0 "Mobilization of Women in War Industry"
 GER_women_in_munitions_industry_desc:0 "Hundreds of thousands of women enter the Krupp foundries, Spandau arsenals, and chemical plants, maintaining high munition outputs while young men fight in the trenches."
 GER_light_machine_guns_mg08_15:0 "MG 08/15 Portable Machine Guns"
 GER_light_machine_guns_mg08_15_desc:0 "Fitting the water-cooled MG 08 with a bipod, pistol grip, and shoulder stock provides tactical stormtrooper squads with devastating mobile automatic firepower."
 GER_flammenwerfer_shock_detachments:0 "Flammentrupp Combat Engineers"
 GER_flammenwerfer_shock_detachments_desc:0 "Specialist pioneer units wielding Kleif and Grof flamethrowers incinerate fortified Allied pillboxes and trench traverses in storm assaults."
 GER_heavy_siege_howitzers_paris_gun:0 "The Paris Gun (Paris-Geschütz)"
 GER_heavy_siege_howitzers_paris_gun_desc:0 "Engineers at Krupp construct a colossal 28-meter long gun firing 210mm shells into the stratosphere, bombarding Paris from a distance of over 120 kilometers."
 GER_first_german_tank_a7v:0 "Sturmpanzerwagen A7V"
 GER_first_german_tank_a7v_desc:0 "Constructed on the Holt tractor chassis, Germany's first armored fighting vehicle bristles with six Maxim machine guns and a 57mm cannon to crush enemy wire."
 GER_salvaged_beutepanzer_corps:0 "Beutepanzer Salvage Regiments"
 GER_salvaged_beutepanzer_corps_desc:0 "Repairing captured British Mark IV tanks and rearming them with German guns allows the OHL to deploy more armor than native factory production alone could deliver."

 # --- Batch 4A: Bilateral Diplomacy ---
 GER_balkan_railway_through_corridor:0 "Balkan Corridor Transit Link"
 GER_balkan_railway_through_corridor_desc:0 "Securing the rail corridors through Morava and Sofia establishes an unbroken direct overland link from Berlin and Vienna to Constantinople."
 GER_sweden_iron_ore_guarantees:0 "Swedish Ore Trade Agreement"
 GER_sweden_iron_ore_guarantees_desc:0 "Germany guarantees the political independence and trade of Sweden in exchange for non-negotiable monthly shipments of Gällivare and Kiruna iron ore."
 GER_bulgarian_triple_alliance_pact:0 "Bulgarian Central Powers Treaty"
 GER_bulgarian_triple_alliance_pact_desc:0 "Promising Tsar Ferdinand all of Serbian Vardar Macedonia and Dobruja secures the entry of the battle-hardened Bulgarian Army on our side."
 GER_danish_strait_mining_pact:0 "Danish Belts Mining Understanding"
 GER_danish_strait_mining_pact_desc:0 "Mining the Great Belt and the Sound under formal understanding with Copenhagen prevents Royal Navy dreadnoughts from penetrating the Baltic Sea."
 GER_romanian_oil_and_grain_pact:0 "Romanian Grain & Oil Agreement"
 GER_romanian_oil_and_grain_pact_desc:0 "Diplomatic and financial pressure forces Bucharest to export petroleum from the Ploiești fields and agricultural yields to German depots."
 GER_swiss_neutral_financial_corridor:0 "Swiss Financial & Diplomatic Corridor"
 GER_swiss_neutral_financial_corridor_desc:0 "Neutral Bern serves as an invaluable clearinghouse for international foreign exchange, medical supplies, and bilateral prisoner repatriations."
 GER_greek_royalist_support_treaty:0 "Support King Constantine of Greece"
 GER_greek_royalist_support_treaty_desc:0 "Backing King Constantine I and royalist factions in Athens resists French and British attempts to force Greece into the war on the Entente side."
 GER_ambassador_bernstorff_us_lobby:0 "Bernstorff's American Peace Lobby"
 GER_ambassador_bernstorff_us_lobby_desc:0 "Ambassador Johann Heinrich von Bernstorff coordinates German-American civic organizations, peace societies, and newspaper campaigns to keep the US strictly neutral."

 # --- Batch 4A: Colonies & Weltpolitik ---
 GER_mittelafrika_colonial_vision:0 "The Vision of Deutsch-Mittelafrika"
 GER_mittelafrika_colonial_vision_desc:0 "Imperial strategists articulate the goal of creating a contiguous German empire spanning from the Atlantic to the Indian Ocean across Central Africa."
 GER_lettow_vorbeck_east_africa_stand:0 "Lettow-Vorbeck's Asymmetric War"
 GER_lettow_vorbeck_east_africa_stand_desc:0 "Commander Paul von Lettow-Vorbeck and his loyal Askaris wage an unparalleled guerrilla campaign in East Africa, drawing tens of thousands of Allied troops away from Europe."
 GER_siege_of_tsingtao_resistance:0 "Defiance at Tsingtao"
 GER_siege_of_tsingtao_resistance_desc:0 "Governor Alfred Meyer-Waldeck and naval infantry garrison Tsingtao, holding out against overwhelming Japanese and British siege forces until ammunition is totally spent."
 GER_support_irish_easter_rising:0 "Support the Irish Easter Rising"
 GER_support_irish_easter_rising_desc:0 "Shipping thousands of Mauser rifles to Dublin on the disguised freighter SMS Libau encourages Roger Casement's Irish Volunteers to strike at the heart of the British Empire."
 GER_boer_maritz_rebellion_backing:0 "Back the Boer Maritz Rebellion"
 GER_boer_maritz_rebellion_backing_desc:0 "Providing rifles, gold, and artillery from German South-West Africa aids General Manie Maritz's Afrikaner rebellion against the British Union of South Africa."
 GER_zimmermann_telegram_proposal:0 "The Zimmermann Telegram"
 GER_zimmermann_telegram_proposal_desc:0 "Foreign Secretary Arthur Zimmermann transmits a coded proposal offering Mexico an anti-American alliance and the return of Texas, Arizona, and New Mexico."

 # --- Batch 4A Ideas & Events ---
 GER_ersatz_materials_production:0 "Ersatz Materials Production"
 GER_ersatz_materials_production_desc:0 "Chemical engineering substitutes provide basic clothing, fuel, and industrial grease in the absence of imported raw materials."
 GER_kriegsbrot_rationing:0 "Kriegsbrot Rationing"
 GER_kriegsbrot_rationing_desc:0 "The populace consumes bread adulterated with potato starch, preserving grain stocks while breeding discontent."
 GER_high_seas_fleet_active:0 "High Seas Fleet in Sortie"
 GER_high_seas_fleet_active_desc:0 "The Kaiser's battle fleet aggressively disputes mastery of the North Sea."
 GER_fokker_scourge_air_dominance:0 "The Fokker Scourge"
 GER_fokker_scourge_air_dominance_desc:0 "German synchronization gears dominate the skies over the Western Front."
 GER_dicta_boelcke_doctrine:0 "Dicta Boelcke Tactics"
 GER_dicta_boelcke_doctrine_desc:0 "Disciplined formation flying and tactical altitude advantage govern all fighter operations."

 ww1_germany_events.27.t:0 "The Swine Massacre of 1915"
 ww1_germany_events.27.d:0 "The German government has carried out the emergency slaughter of millions of pigs to conserve grain. While grain supplies are stabilized, meat and fat shortages loom ominously."
 ww1_germany_events.27.a:0 "A grim necessity for the Reich."

 ww1_germany_events.28.t:0 "Skagerrak - The Clash of Dreadnoughts"
 ww1_germany_events.28.d:0 "In the misty waters off the Danish coast, the High Seas Fleet has traded broadsides with the British Grand Fleet. British battlecruisers have exploded under accurate German salvoes."
 ww1_germany_events.28.a:0 "The German fleet has stood its ground!"

 ww1_germany_events.29.t:0 "The Holtzendorff Memorandum"
 ww1_germany_events.29.d:0 "Chief of the Admiralty Staff von Holtzendorff presents a stark ultimatum to the government: authorize unrestricted submarine warfare or surrender the naval initiative."
 ww1_germany_events.29.a:0 "A fateful calculation."

 ww1_germany_events.30.t:0 "Gothas Over London"
 ww1_germany_events.30.d:0 "German twin-engine Gotha bombers have appeared in daylight skies over London, dropping bombs near Liverpool Street Station. British air defense is caught completely off guard."
 ww1_germany_events.30.a:0 "Bring the war to their doorstep."

 ww1_germany_events.31.t:0 "The Paris Gun Fires"
 ww1_germany_events.31.d:0 "From hidden emplacements in the Crepy forest, Krupp's colossal long-range cannon sends shells screaming into the stratosphere, raining destruction onto the streets of Paris."
 ww1_germany_events.31.a:0 "Paris shudders under Krupp steel."

 ww1_germany_events.32.t:0 "Swedish Iron Ore Treaty"
 ww1_germany_events.32.d:0 "The Swedish government in Stockholm has reaffirmed its neutral commitment to deliver uninterrupted shipments of high-grade Lapland iron ore to German smelters."
 ww1_germany_events.32.a:0 "Our steel works remain fed."

 ww1_germany_events.33.t:0 "Bulgaria Joins the Central Powers"
 ww1_germany_events.33.d:0 "The Kingdom of Bulgaria has formally signed the alliance treaty with Germany and Austria-Hungary, preparing its army to invade Serbia and secure the Balkan route."
 ww1_germany_events.33.a:0 "The road to Constantinople is open!"
 ww1_germany_events.33.b:0 "They remain neutral for now."

 ww1_germany_events.34.t:0 "Romanian Grain & Oil Concessions"
 ww1_germany_events.34.d:0 "Under intense diplomatic pressure from Berlin and Vienna, the Kingdom of Romania has consented to supply critical grain and Ploiești crude oil quotas to the Central Powers."
 ww1_germany_events.34.a:0 "Fuel for our war effort."
 ww1_germany_events.34.b:0 "They defy us at their peril!"

 ww1_germany_events.35.t:0 "Lettow-Vorbeck's Defiance in Africa"
 ww1_germany_events.35.d:0 "In German East Africa, General von Lettow-Vorbeck continues to lead his loyal Askaris through bush, swamp, and mountains, tying down hundreds of thousands of British troops."
 ww1_germany_events.35.a:0 "An unvanquished hero in the tropics."

 ww1_germany_events.36.t:0 "The Easter Rising in Dublin"
 ww1_germany_events.36.d:0 "Irish republicans have seized the General Post Office in Dublin and proclaimed the Irish Republic, battling British forces in the city center with rifles supplied by Germany."
 ww1_germany_events.36.a:0 "A dagger in Britain's flank."

 ww1_germany_events.37.t:0 "The Zimmermann Telegram"
 ww1_germany_events.37.d:0 "Foreign Secretary Arthur Zimmermann's secret diplomatic proposal to Mexico has been intercepted and deciphered. The American public is in an uproar over the offer of Texas and Arizona."
 ww1_germany_events.37.a:0 "A dangerous gamble exposed."

 # --- Batch 4B: Western Front Tactical Campaigns ---
 GER_second_battle_of_ypres_gas:0 "Second Battle of Ypres (Gas Offensive)"
 GER_second_battle_of_ypres_gas_desc:0 "Opening valves on 5,700 cylinders of pressurized chlorine gas creates a ghostly green-yellow chemical cloud drifting across the Gravenstafel ridge."
 GER_champagne_defensive_victories:0 "Defense in Champagne"
 GER_champagne_defensive_victories_desc:0 "German field corps repel General Joffre's massive autumn offensives in Champagne, inflicting staggering casualties from hidden reverse-slope positions."
 GER_operation_alberich_scorched_earth:0 "Operation Alberich (Strategic Withdrawal)"
 GER_operation_alberich_scorched_earth_desc:0 "Executing a ruthless, systematic scorched-earth retreat into the shortened Siegfriedstellung leaves a devastated desert for the advancing Entente armies."
 GER_arras_and_vimy_ridge_stand:0 "The Stand at Arras"
 GER_arras_and_vimy_ridge_stand_desc:0 "Facing massed British tank charges and creeping barrages at Arras, German reserves absorb the initial shock and solidify the defensive line."
 GER_battle_of_cambrai_counterstroke:0 "Cambrai Stormtrooper Counterstroke"
 GER_battle_of_cambrai_counterstroke_desc:0 "In the world's first great combined tank engagement, German infiltration shock troops bypass British strongpoints, rolling up the salient and recapturing lost ground."

 # --- Batch 4B: Alpine, Balkan & Middle East Campaigns ---
 GER_common_army_heeresfront_coordination:0 "Austro-German Heeresfront Coordination"
 GER_common_army_heeresfront_coordination_desc:0 "Unifying high command operational direction under German staff officers stabilizes the multi-national Austro-Hungarian armies on the Eastern front."
 GER_austro_hungarian_naval_danube_flotilla:0 "Danube River Flotilla Support"
 GER_austro_hungarian_naval_danube_flotilla_desc:0 "Reinforcing Austro-Hungarian river monitors along the Danube provides heavy naval artillery fire support for Central Powers ground crossings."
 GER_fourteenth_army_alpine_corps:0 "The Fourteenth Army & Alpenkorps"
 GER_fourteenth_army_alpine_corps_desc:0 "Deploying the elite Bavarian Alpenkorps and the newly formed Fourteenth Army to the Julian Alps prepares a crushing mountain offensive against Italy."
 GER_battle_of_caporetto_breakthrough:0 "The Breakthrough of Caporetto (Flitsch-Tolmein)"
 GER_battle_of_caporetto_breakthrough_desc:0 "Infiltration tactics and gas projector bombardments shatter the Italian Second Army, precipitating a catastrophic 100-kilometer rout to the Piave River."
 GER_invasion_of_romania_falkenhayn:0 "The Romanian Campaign"
 GER_invasion_of_romania_falkenhayn_desc:0 "Field Marshal von Mackensen from the south and General von Falkenhayn from Transylvania converge on Wallachia in a textbook double-envelopment."
 GER_fall_of_bucharest_oil_fields:0 "Capture of Bucharest & Ploiești Oil"
 GER_fall_of_bucharest_oil_fields_desc:0 "Securing the Romanian capital and the Ploiești oil fields salvages the Central Powers from an immediate petroleum and wheat catastrophe."
 GER_asienkorps_palestine_expedition:0 "Expedition of the Asienkorps"
 GER_asienkorps_palestine_expedition_desc:0 "German specialist expeditionary detachments, aviation units, and staff officers deploy to Palestine to assist Ottoman forces in defending Jerusalem."
 GER_siege_of_kut_al_amara_aid:0 "Relief of the Siege of Kut-al-Amara"
 GER_siege_of_kut_al_amara_aid_desc:0 "Field Marshal Colmar von der Goltz-Pasha directs Ottoman forces to besiege and force the unconditional surrender of Townshend's British-Indian division."

 # --- Batch 4B: Eastern Settlements & Mitteleuropa ---
 GER_create_regency_kingdom_of_poland:0 "Establish the Regency Kingdom of Poland"
 GER_create_regency_kingdom_of_poland_desc:0 "The Central Powers proclaim an independent Polish state under a provisional Regency Council, aligning Polish national aspirations with Berlin's sphere."
 GER_liberate_the_ukrainian_hetmanate:0 "The Ukrainian Hetmanate"
 GER_liberate_the_ukrainian_hetmanate_desc:0 "Supporting Hetman Pavlo Skoropadsky establishes a stable, anti-Bolshevik Ukrainian state that immediately fulfills vital grain delivery quotas to Germany."
 GER_establish_united_baltic_duchy:0 "The United Baltic Duchy"
 GER_establish_united_baltic_duchy_desc:0 "Baltic German nobility unite the provinces of Livonia, Estonia, and Courland under a constitutional ducal crown bound to the German Empire."
 GER_kingdom_of_finland_vassal:0 "The Kingdom of Finland"
 GER_kingdom_of_finland_vassal_desc:0 "Prince Frederick Charles of Hesse is elected King of Finland, cementing Finland's liberation from Russian hegemony with German naval and military backing."
 GER_kingdom_of_lithuania_urach:0 "The Kingdom of Lithuania"
 GER_kingdom_of_lithuania_urach_desc:0 "The Council of Lithuania proclaims the restoration of the Lithuanian state, offering the crown to Prince Wilhelm of Urach as King Mindaugas II."
 GER_caucasian_intervention_georgia:0 "German Caucasus Expedition"
 GER_caucasian_intervention_georgia_desc:0 "General Kress von Kressenstein leads German troops into the Democratic Republic of Georgia, securing the vital Transcaucasian railway and Baku oil pipelines."
 GER_mitteleuropa_customs_union:0 "The Mitteleuropa Customs Union"
 GER_mitteleuropa_customs_union_desc:0 "Economic visionary Friedrich Naumann's dream is realized: a vast, self-sufficient Central European economic bloc centered on Berlin's industrial might."
 GER_baltic_german_colonization_order:0 "Baltic Frontier Settlement Scheme"
 GER_baltic_german_colonization_order_desc:0 "Encouraging German agricultural settlement and veterans' estates creates a permanent cultural and defensive bulwark along the eastern Baltic."
 GER_don_and_kuban_cossack_treaties:0 "Treaties with Don and Kuban Cossacks"
 GER_don_and_kuban_cossack_treaties_desc:0 "Recognizing Ataman Pyotr Krasnov's anti-Bolshevik Don Republic secures our eastern frontier and opens trade routes to the Volga basin."

 # --- Batch 4B: OHL Military Dictatorship ---
 GER_oust_bethmann_hollweg:0 "Oust Bethmann-Hollweg"
 GER_oust_bethmann_hollweg_desc:0 "Field Marshal von Hindenburg and General Ludendorff threaten immediate resignation unless Kaiser Wilhelm II dismisses the vacillating Chancellor Bethmann-Hollweg."
 GER_chancellor_michaelis_puppet:0 "Install Chancellor Michaelis"
 GER_chancellor_michaelis_puppet_desc:0 "Appointing the pliable bureaucrat Georg Michaelis as Imperial Chancellor confirms the absolute political supremacy of the Third Supreme Army Command (OHL)."
 GER_krupp_ordnance_dictate:0 "The Krupp Ordnance Dictate"
 GER_krupp_ordnance_dictate_desc:0 "All industrial disputes, wage demands, and factory production allocations are subordinated to direct military command under the Krupp armament syndicate."
 GER_operation_georgette_flanders:0 "Operation Georgette (Battle of the Lys)"
 GER_operation_georgette_flanders_desc:0 "German Sixth Army unleashes a massive assault in Flanders, attempting to capture Hazebrouck and drive the British Expeditionary Force into the sea."
 GER_operation_gneisenau_matz:0 "Operation Gneisenau"
 GER_operation_gneisenau_matz_desc:0 "Eighteenth Army attacks along the Matz River to connect the salient between Montdidier and Noyon, drawing French strategic reserves away from Paris."
 GER_operation_blucher_yorck:0 "Operation Blücher-Yorck"
 GER_operation_blucher_yorck_desc:0 "A thunderous surprise bombardment shatters the Anglo-French lines on the Chemin des Dames, advancing 50 kilometers in three days to reach the Marne."
 GER_the_black_day_of_the_german_army:0 "The Black Day of the German Army"
 GER_the_black_day_of_the_german_army_desc:0 "On August 8, 1918, massed British Mark V tanks break through at Amiens, shattering German operational morale and signaling that the war cannot be won militarily."
 GER_seek_armistice_fourteen_points:0 "Seek Armistice on Wilson's Points"
 GER_seek_armistice_fourteen_points_desc:0 "Facing exhaustion, Prince Max von Baden addresses a diplomatic dispatch to President Woodrow Wilson, requesting an honorable armistice based on the Fourteen Points."
 GER_kiel_sailors_mutiny:0 "The Kiel Sailors' Mutiny"
 GER_kiel_sailors_mutiny_desc:0 "Refusing an OHL order for a suicidal final fleet sortie into the English Channel, stoked sailors extinguish boiler fires in Kiel and raise the red flag."

 # --- Batch 4B: Volkskaiserreich Path ---
 GER_prince_max_von_baden_cabinet:0 "Prince Max von Baden's Cabinet"
 GER_prince_max_von_baden_cabinet_desc:0 "Forming a broad coalition cabinet of Zentrum, Progressives, and Majority Social Democrats institutes responsible civilian parliamentary government."
 GER_repeal_anti_socialist_heritage:0 "Full Legalization of Trade Unions"
 GER_repeal_anti_socialist_heritage_desc:0 "Eliminating the last remnants of Bismarck's anti-socialist laws recognizes organized labor as equal partners in the constitutional development of the Empire."
 GER_three_class_franchise_abolition_law:0 "Abolish the Three-Class Franchise"
 GER_three_class_franchise_abolition_law_desc:0 "Enacting universal, equal, and secret suffrage in Prussia dismantles the political monopoly of the Junker aristocracy and solidifies national unity."
 GER_direct_negotiations_with_woodrow_wilson:0 "Direct Negotiations with Washington"
 GER_direct_negotiations_with_woodrow_wilson_desc:0 "Bypassing the Entente imperialists, civilian representatives negotiate directly with the White House for a fair, democratic peace without annexations."
 GER_federal_constitutional_monarchy:0 "Federal Constitutional Monarchy"
 GER_federal_constitutional_monarchy_desc:0 "Revising the Imperial Constitution subordinates the Chancellor, the military command, and foreign treaties to the democratic vote of the Reichstag."
 GER_post_war_welfare_and_reconstruction:0 "Welfare & Economic Reconstruction"
 GER_post_war_welfare_and_reconstruction_desc:0 "Pioneering state-backed healthcare, unemployment insurance, and veteran pensions turns the wartime economy toward a prosperous civilian future."

 # --- Batch 4B: Vaterlandspartei Path ---
 GER_kapp_and_tirpitz_rally:0 "The Pan-German Rally of Tirpitz & Kapp"
 GER_kapp_and_tirpitz_rally_desc:0 "Grand Admiral von Tirpitz and civil servant Wolfgang Kapp rally millions of ultra-nationalists demanding total annexation of enemy lands and no compromise peace."
 GER_dissolve_the_reichstag:0 "Dissolution of the Reichstag"
 GER_dissolve_the_reichstag_desc:0 "Imperial decree backed by bayonets dissolves the Reichstag sine die, instituting an authoritarian national defense committee."
 GER_annex_the_flemish_coast:0 "Annex the Flemish Coast"
 GER_annex_the_flemish_coast_desc:0 "Permanent annexation of Antwerp, Zeebrugge, and Ostend gives the Imperial Navy direct submarine and naval bases threatening the English Channel."
 GER_colonize_the_eastern_frontier_strip:0 "The Polish Frontier Strip Settlement"
 GER_colonize_the_eastern_frontier_strip_desc:0 "Clearing a buffer zone along the Polish border for German soldier-settlers provides an unbreachable defensive frontier in the East."
 GER_totalitarian_labor_camps:0 "Totalitarian Labor Mobilization"
 GER_totalitarian_labor_camps_desc:0 "Militarizing all industrial workers, prisoners of war, and occupied populations squeezes maximum war material from every available hand."
 GER_unconditional_victory_or_ruin:0 "Sieg oder Untergang"
 GER_unconditional_victory_or_ruin_desc:0 "Refusing any compromise armistice, the Pan-German dictatorship fights to total conquest or glorious national destruction."

 # --- Batch 4B: Spartakusaufstand Path ---
 GER_berlin_january_mass_strikes:0 "The Great January Mass Strikes"
 GER_berlin_january_mass_strikes_desc:0 "Hundreds of thousands of munitions workers in Berlin, Leipzig, and the Ruhr lay down their tools demanding peace, bread, and workers' democracy."
 GER_soldiers_and_workers_councils:0 "Soldiers' & Workers' Councils (Räte)"
 GER_soldiers_and_workers_councils_desc:0 "Elected delegate councils take control of barracks, factories, municipal halls, and telegraph exchanges across the German Reich."
 GER_proclaim_freie_sozialistische_republik:0 "Proclaim the Free Socialist Republic"
 GER_proclaim_freie_sozialistische_republik_desc:0 "From the balcony of the Berlin Stadtschloss, Karl Liebknecht proclaims the Free Socialist Republic of Germany, ending the Hohenzollern monarchy forever."
 GER_dissolve_the_junker_officer_caste:0 "Disband the Junker Officer Caste"
 GER_dissolve_the_junker_officer_caste_desc:0 "Stripping aristocratic Prussian generals of rank and command replaces the old Imperial Army with an egalitarian Red Guards military force."
 GER_alliance_with_soviet_russia:0 "Fraternal Soviet-German Alliance"
 GER_alliance_with_soviet_russia_desc:0 "Signing an international alliance with Soviet Russia combines German industrial genius with Russian boundless resources for the world socialist revolution."
 GER_socialist_land_and_factory_collectivization:0 "Socialization of Heavy Industry & Land"
 GER_socialist_land_and_factory_collectivization_desc:0 "Expropriating Krupp, Thyssen, and the Junker noble estates places the means of production directly in the hands of the working class."
 GER_world_proletarian_revolution:0 "World Proletarian Revolution"
 GER_world_proletarian_revolution_desc:0 "The German Red Army marches west to liberate the workers of France, Belgium, and Britain from capitalist imperialist enslavement."

 # --- Batch 4B: Alt-History & Easter Eggs ---
 GER_willy_nicky_personal_summit:0 "The Willy-Nicky Imperial Summit"
 GER_willy_nicky_personal_summit_desc:0 "Kaiser Wilhelm II and Tsar Nicholas II meet aboard the imperial yachts in the Baltic, resurrecting the secret 1905 Björkö Mutual Defense Treaty."
 GER_partition_of_british_sphere_asia:0 "Partition of the British Sphere in Asia"
 GER_partition_of_british_sphere_asia_desc:0 "Russo-German secret protocols divide Persia, Afghanistan, and northern India into exclusive spheres of economic and political dominance."
 GER_continental_bloc_against_london:0 "The Grand Continental Alliance"
 GER_continental_bloc_against_london_desc:0 "Uniting the Russian, German, and French economies into an invincible continental fortress terminates Great Britain's global maritime dominance."
 GER_max_von_oppenheim_memorandum:0 "Oppenheim's Jihad Revolution Scheme"
 GER_max_von_oppenheim_memorandum_desc:0 "Baron Max von Oppenheim presents his master plan to organize rebellions across Egypt, India, and the Sudan, weaponizing Islamic anti-colonialism."
 GER_bedouin_and_persian_rebellions:0 "Bedouin & Persian Insurgencies"
 GER_bedouin_and_persian_rebellions_desc:0 "German agents arm desert Bedouins and Persian nationalists, sabotaging the Anglo-Persian oil pipelines and isolating British garrisons."
 GER_holy_war_on_the_suez_canal:0 "Assault on the Suez Canal"
 GER_holy_war_on_the_suez_canal_desc:0 "Joint German-Ottoman desert armies cross the Sinai with pontoon bridges, aiming to sever the vital jugular vein of the British Empire at Suez."
 GER_danubian_crisis_annexation_protocol:0 "Danubian Emergency Protocol"
 GER_danubian_crisis_annexation_protocol_desc:0 "With the Habsburg Empire fracturing into ethnic chaos, Berlin prepares emergency contingency measures to protect the Austro-German heartland."
 GER_incorporate_bohemia_and_austria:0 "Greater German Unification (Großdeutschland)"
 GER_incorporate_bohemia_and_austria_desc:0 "Fulfilling the 1848 dream of German unity, Austria and the German lands of Bohemia are directly incorporated into the German Empire."

 # --- Batch 4B Ideas ---
 GER_alpine_corps_offensive:0 "Alpenkorps Mountain Mastery"
 GER_alpine_corps_offensive_desc:0 "Specialized mountain assault training and light artillery tactics excel in extreme terrain."
 GER_caporetto_momentum:0 "Caporetto Breakthrough Momentum"
 GER_caporetto_momentum_desc:0 "The enemy is in headlong retreat, abandoned guns and prisoners clogging every mountain pass."
 GER_romanian_oil_concessions:0 "Ploiești Oil Concessions"
 GER_romanian_oil_concessions_desc:0 "Secured Romanian oil wells keep German diesel engines, planes, and trucks running smoothly."
 GER_mitteleuropa_hegemony:0 "Mitteleuropa Hegemony"
 GER_mitteleuropa_hegemony_desc:0 "A unified customs zone and integrated rail network makes the Central Powers completely self-sufficient."
 GER_proletarian_red_army:0 "Proletarian Red Army"
 GER_proletarian_red_army_desc:0 "Revolutionary zeal and soldiers' councils inspire unprecedented battlefield resilience."
 GER_vaterlandspartei_iron_fist:0 "Vaterlandspartei Total War"
 GER_vaterlandspartei_iron_fist_desc:0 "Militarized factory discipline extracts every ounce of industrial production."
 GER_asienkorps_desert_mastery:0 "Asienkorps Desert Acclimatization"
 GER_asienkorps_desert_mastery_desc:0 "German tropical equipment and sun helmets adapt imperial troops to scorched desert warfare."

 # --- Batch 4B Events ---
 ww1_germany_events.38.t:0 "Second Ypres - The Green Cloud"
 ww1_germany_events.38.d:0 "The opening of chlorine gas cylinders at Ypres has created panic in the Allied lines. Although our forces failed to fully exploit the gap, the era of chemical warfare has begun."
 ww1_germany_events.38.a:0 "A terrifying new weapon."

 ww1_germany_events.39.t:0 "The Miracle of Caporetto"
 ww1_germany_events.39.d:0 "German and Austrian mountain corps have shattered the Italian front on the Isonzo. Over 300,000 Italian soldiers have surrendered, and Cadorna's army is fleeing in total disarray."
 ww1_germany_events.39.a:0 "Italy is brought to its knees!"

 ww1_germany_events.40.t:0 "The Fall of Bucharest"
 ww1_germany_events.40.d:0 "Field Marshal von Mackensen has paraded through the streets of Bucharest. Romanian oil installations and grain granaries are now under German military control."
 ww1_germany_events.40.a:0 "Secure the oil fields!"

 ww1_germany_events.41.t:0 "Proclamation of the Kingdom of Poland"
 ww1_germany_events.41.d:0 "The German and Austro-Hungarian Emperors have issued the Two Emperors' Manifesto, proclaiming the restoration of an independent Kingdom of Poland."
 ww1_germany_events.41.a:0 "Poland joins the European family under our wing."

 ww1_germany_events.42.t:0 "Hetman Skoropadsky's Ukraine"
 ww1_germany_events.42.d:0 "With German military backing, General Pavlo Skoropadsky has been elected Hetman of Ukraine, re-establishing order and releasing vast grain shipments to the West."
 ww1_germany_events.42.a:0 "The breadbasket of the East is open."

 ww1_germany_events.43.t:0 "Operation Michael - The Great Offensive"
 ww1_germany_events.43.d:0 "Over 6,000 German artillery pieces have opened fire simultaneously along the Somme. German Stosstruppen have bypassed enemy strongpoints and broken clean into the British rear!"
 ww1_germany_events.43.a:0 "Der Tag has come!"

 ww1_germany_events.44.t:0 "The Black Day at Amiens"
 ww1_germany_events.44.d:0 "Hundreds of Allied tanks have torn through our exhausted lines at Amiens under thick morning fog. General Ludendorff reports that the offensive spirit of the army has broken."
 ww1_germany_events.44.a:0 "We must seek terms before the front collapses."

 ww1_germany_events.45.t:0 "Red Flags in Kiel"
 ww1_germany_events.45.d:0 "Sailors of the High Seas Fleet in Kiel have refused to obey officers and raised red flags on battleships. Workers' councils are taking power across northern Germany."
 ww1_germany_events.45.a:0 "Order is collapsing!"

 GER_das_grosse_hauptquartier:0 "Großes Hauptquartier (Imperial HQ)"
 GER_das_grosse_hauptquartier_desc:0 "Establishing the wartime Imperial Supreme Headquarters ensures flawless strategic liaison between the Kaiser, the General Staff, and the War Ministry."
 GER_kaiserliche_werften_expansion:0 "Kaiserliche Werften Expansion"
 GER_kaiserliche_werften_expansion_desc:0 "Expanding the imperial naval shipyards in Wilhelmshaven, Kiel, and Danzig accelerates dreadnought overhauls and submarine hull construction."

# --- NATIONAL SPIRITS & IDEAS ---
 GER_spartakusbund_revolutionary_ardor:0 "Spartacist Revolutionary Ardor"
 GER_spartakusbund_revolutionary_ardor_desc:0 "The German proletariat has cast off the chains of imperialism. Soldiers and workers stand shoulder to shoulder, ready to defend the revolution against reactionaries and carry the socialist cause across Europe."
 GER_vaterlandspartei_total_mobilization:0 "Fatherland Party Total Mobilization"
 GER_vaterlandspartei_total_mobilization_desc:0 "The Pan-German Fatherland Party has subordinated every aspect of national life to total warfare. Strikes are treated as treason, factories run day and night, and no sacrifice is too great for final victory."
 GER_haber_bosch_nitrogen_miracle_idea:0 "Haber-Bosch Nitrogen Fixation"
 GER_haber_bosch_nitrogen_miracle_idea_desc:0 "By extracting nitrogen directly from atmospheric air, German chemistry has broken the British saltpeter blockade, providing an endless supply of munitions and synthetic fertilizers."
 GER_unrestricted_submarines_active:0 "Unrestricted Submarine Warfare"
 GER_unrestricted_submarines_active_desc:0 "German U-boats are authorized to sink all merchant vessels entering the war zone around Great Britain without warning. This strangles British commerce, but risks drawing the United States into the war."
 german_infiltration_assault_idea:0 "Sturmtruppen Infiltration Tactics"
 german_infiltration_assault_idea_desc:0 "Bypassing enemy strongpoints under the cover of creeping artillery barrages, specialized shock detachments infiltrate deep into enemy trench networks, restoring operational mobility."
 GER_kaiserschlacht_idea:0 "The Kaiserschlacht Offensive"
 GER_kaiserschlacht_idea_desc:0 "Germany's final, desperate gamble for victory on the Western Front. Elite stormtroopers and massed artillery throw everything into piercing the Allied lines before American reinforcements arrive."
 GER_turnip_winter_crisis_1:0 "Turnip Winter (Mild Shortages)"
 GER_turnip_winter_crisis_1_desc:0 "The British naval blockade and an early frost have devastated the potato crop. Turnips are distributed as substitute food across major cities, causing growing discontent."
 GER_turnip_winter_crisis_2:0 "Turnip Winter (Severe Famine)"
 GER_turnip_winter_crisis_2_desc:0 "Malnutrition, soup kitchens, and bitter winter cold grip the civilian population. Industrial productivity declines as workers struggle with starvation."
 GER_turnip_winter_crisis_3:0 "Turnip Winter (Home Front Starvation)"
 GER_turnip_winter_crisis_3_desc:0 "Widespread bread riots and strikes paralyze the cities. The social fabric of the Empire is pushed to the breaking point by catastrophic food shortages."
 GER_hindenburg_program_victory:0 "Hindenburg Program Triumphs"
 GER_hindenburg_program_victory_desc:0 "The monumental reorganization of industry under the OHL has tripled munitions output and mobilized millions of civilian workers for total war."
 GER_schlieffen_momentum:0 "Schlieffen Operational Momentum"
 GER_schlieffen_momentum_desc:0 "The right wing of the German army is wheeling across Belgium and northern France with overwhelming speed and aggression, racing to envelop Paris."
 GER_schlieffen_hangover:0 "Schlieffen Hangover"
 GER_schlieffen_hangover_desc:0 "The failure to capture Paris has shattered the operational assumptions of the General Staff. Troops are exhausted, supply lines overstretched, and defensive trench warfare sets in."
 GER_western_triumph:0 "Triumph in the West"
 GER_western_triumph_desc:0 "Against all odds, German armies have shattered Allied resistance and captured Paris, forcing the French Republic to seek armistice terms."
 GER_trench_stalemate_western_front:0 "Western Front Trench Stalemate"
 GER_trench_stalemate_western_front_desc:0 "Miles of continuous barbed wire, machine-gun nests, and deep dugouts lock the Western Front in bloody, grinding stalemate."
 GER_caporetto_momentum:0 "Breakthrough at Caporetto"
 GER_caporetto_momentum_desc:0 "German mountain battalions and Austro-Hungarian forces have routed the Italian Second Army, advancing to the Piave River."

