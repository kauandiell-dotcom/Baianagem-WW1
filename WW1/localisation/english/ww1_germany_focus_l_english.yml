 # --- TOOLTIPS ---
 ger_reach_paris_success_tt:0 "§GSuccess§!: Paris captured within the deadline! France will be forced to the negotiating table."
 ger_reach_paris_fail_tt:0 "§RFailure§!: The advance stalls. Moltke is disgraced and the war settles into brutal trench stalemate."
 ger_belgium_neutrality_violated_tt:0 "§RViolates Belgian Neutrality§!: Britain will enter the war to enforce the Treaty of London."
 ger_belgium_transit_accepted_tt:0 "§GBelgium yields military transit§!: German armies may cross Belgian territory without immediate British intervention."
 ger_unrestricted_sub_us_risk_tt:0 "§RHigh Diplomatic Risk§!: Every convoy sunk increases the danger of United States intervention."
 ger_spartakus_revolution_tt:0 "§YThe Proletarian Revolution§!: Rosa Luxemburg and Karl Liebknecht take power. Germany becomes a Socialist Republic."
 ger_volkskaiserreich_transition_tt:0 "§YConstitutional Transformation§!: The Reichstag assumes parliamentary supremacy. Germany becomes a Democratic Constitutional Monarchy."
 ger_vaterlandspartei_takeover_tt:0 "§RNationalist Dictatorship§!: Wolfgang Kapp and Alfred von Tirpitz establish a totalitarian regime dedicated to total annexation."
 ger_ohl_dictatorship_tt:0 "§YMilitary Supremacy§!: Field Marshal Paul von Hindenburg and Erich Ludendorff take complete control of the German Empire."
# --- NEW GERMAN FOCUSES ---
 GER_smash_general_strikes:0 "Smash the Ruhr General Strike"
 GER_smash_general_strikes_desc:0 "Trade unions and socialist workers have declared a nationwide general strike against our patriotic government. Deploy the Freikorps and armed police to secure the factories and pitheads by force."
 GER_siegfrieden_manifesto:0 "The Siegfrieden Manifesto"
 GER_siegfrieden_manifesto_desc:0 "We categorically reject any compromise peace or cowardly surrender. Germany shall fight until total victory, dictating terms and annexations across Europe."
 GER_consolidate_red_republic:0 "Consolidate the Socialist Republic"
 GER_consolidate_red_republic_desc:0 "The armed workers and revolutionary sailors have vanquished the reactionary officers. The Workers' and Soldiers' Councils now assume full sovereign power across the German realm."
 GER_baltic_crusade_landeswehr:0 "The Baltic Crusade of the Landeswehr"
 GER_baltic_crusade_landeswehr_desc:0 "The Baltic-German barons and battle-hardened Freikorps volunteer divisions march northeast to crush Bolshevik partisans and secure the historic provinces of Livonia, Courland, and Estonia for the Reich."
 GER_entente_anti_bolshevik_intervention:0 "Crush the Entente Counter-Revolution"
 GER_entente_anti_bolshevik_intervention_desc:0 "The imperialist powers of London and Paris refuse to coexist with a Red Germany. As their interventionist armies mobilize on our borders, the proletarian red guards prepare to strike the imperialists down."
 GER_caucasus_baku_expedition:0 "Operation Faustschlag: The March to Baku"
 GER_caucasus_baku_expedition_desc:0 "To fuel our war machine and secure the industrial lifeblood of the continent, the German Caucasus expedition must seize the vital oil fields of Baku before British or Turkish forces can claim them."

