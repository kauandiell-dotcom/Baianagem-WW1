 GER_right_wing_momentum: "Right-Wing Imperial Momentum"
 GER_right_wing_momentum_desc: "A surging wave of nationalist, pan-German, and militarist sentiment energizes conservative factions, stiffening the resolve of the officer corps and industrial magnates."
 ger_schlieffen_capture_brussels: "Capture Brussels Spearhead"
 ger_schlieffen_capture_brussels_desc: "Our advance through the Belgian lowlands must seize the Belgian capital quickly, shattering enemy rail networks and clearing the path towards Paris."
 GER_eastern_breadbasket: "Breadbasket of the East"
 GER_eastern_breadbasket_desc: "Securing grain, minerals, and railway lifelines from the fertile lands of Ukraine and the East alleviates civilian rationing and bolsters Imperial logistic sustainability."
 GER_hipper_scouting_tactics: "Hipper's Battlecruiser Tactics"
 GER_hipper_scouting_tactics_desc: "Franz von Hipper's aggressive battlecruiser scouting groups combine superior German gunnery, Krupp cemented armor, and disciplined tactical withdrawal to lure hostile capital ships into lethal ambushes."
 GER_skagerrak_tactical_triumph: "Triumph of Skagerrak"
 GER_skagerrak_tactical_triumph_desc: "The tactical mastery displayed off the Skagerrak proved that superior gunnery optics, internal compartmentalization, and flash-tight powder handling can shatter superior hostile numbers in daylight clash."
 GER_cruiser_raiding_tradition: "Imperial Cruiser Raiding Tradition"
 GER_cruiser_raiding_tradition_desc: "Emulating the legendary exploits of SMS Emden and SMS Karlsruhe, our light cruisers hunt enemy merchantmen across the global sea lanes, diverting vital Allied escorts away from home waters."
 GER_unrestricted_submarine_warfare_spirit_desc: "Total underwater offensive targeting any vessel entering Allied blockade zones, strangling merchant lifelines across the North Sea and Atlantic."
 GER_meuse_preparation: "Meuse Sector Preparation"
 GER_meuse_preparation_desc: "Concentrating artillery parks, ammunition caches, and assault pioneers along the Meuse river bend."
 GER_meuse_offensive: "Meuse River Offensive"
 GER_meuse_offensive_desc: "Heavy assault divisions press across the Meuse river crossings, seeking a decisive breakthrough against French defensive fortifications."
 GER_meuse_exhaustion: "Meuse Exhaustion"
 GER_meuse_exhaustion_desc: "Protracted attrition and mud along the Meuse sector have ground assault momentum to a halt, requiring consolidation."
