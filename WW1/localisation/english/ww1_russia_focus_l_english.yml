l_english:

 SOV_the_empire_of_nicholas_ii:0 "The Empire of Nicholas II"
 SOV_the_empire_of_nicholas_ii_desc:0 "Governing one-sixth of the Earth's landmass, the Russian Autocrat rules by divine right over 160 million souls. Yet behind the imperial splendor of Tsarskoye Selo lies an empire undergoing convulsive transformation."
 SOV_the_stolypin_conundrum:0 "The Stolypin Conundrum"
 SOV_the_stolypin_conundrum_desc:0 "Prime Minister Pyotr Stolypin insists that Russia needs twenty years of peace at home and abroad to become unassailable. His land reforms and relentless repression have earned him bitter enemies among both nobility and revolutionaries."
 SOV_kiev_opera_gala_1911:0 "Gala at the Kiev Opera House"
 SOV_kiev_opera_gala_1911_desc:0 "In September 1911, the Tsar and his ministers attend Rimsky-Korsakov's The Tale of Tsar Saltan in Kiev. In the second intermission, police informant and revolutionary Dmitry Bogrov approaches Stolypin with a loaded Browning pistol."
 SOV_stolypin_martyrdom:0 "Martyrdom of Stolypin"
 SOV_stolypin_martyrdom_desc:0 "Stolypin succumbs to his wounds days after the shooting. With his death, the Russian Empire loses its most decisive modernizing statesman, leaving reformist momentum paralyzed at the worst possible moment."
 SOV_kokovtsov_premiership:0 "Kokovtsov's Prudent Stewardship"
 SOV_kokovtsov_premiership_desc:0 "Vladimir Kokovtsov assumes the premiership. Dedicated to balancing the budget and restraining military adventures, his cautious conservatism preserves financial stability while letting domestic tensions fester."
 SOV_reactionary_resurgence:0 "Reactionary Resurgence"
 SOV_reactionary_resurgence_desc:0 "Right-wing factions in the State Council and court circles assert dominance. Reformist initiatives are shelved in favor of preserving traditional autocratic privileges and church authority."
 SOV_goremykin_stagnation:0 "Goremykin's Complacency"
 SOV_goremykin_stagnation_desc:0 "The elderly Ivan Goremykin, an arch-conservative courtier who openly admits his reluctance to govern, is appointed Chairman of the Council of Ministers, deepening executive paralysis."
 SOV_rasputin_court_influence:0 "Rasputin's Shadow Over Tsarskoye Selo"
 SOV_rasputin_court_influence_desc:0 "The Siberian starets Grigori Rasputin solidifies his mystical hold over Tsarina Alexandra, influencing ministerial appointments and fueling poisonous rumors that discredit the imperial family across all strata of society."
 SOV_stolypin_survives_the_bullet:0 "Stolypin Defies Death"
 SOV_stolypin_survives_the_bullet_desc:0 "The assassin's bullet strikes Stolypin's medal and glances off. Surviving the Kiev plot, the Prime Minister turns public sympathy into absolute authority, driving through his grand design for Russia."
 SOV_stolypins_twenty_years:0 "Twenty Years of Peace"
 SOV_stolypins_twenty_years_desc:0 "'Give the State twenty years of peace at home and abroad, and you will not recognize present-day Russia.' Stolypin redoubles efforts to transform Russia into a realm of prosperous peasant proprietors."
 SOV_curb_gentry_privileges:0 "Curb Landed Gentry Privileges"
 SOV_curb_gentry_privileges_desc:0 "Stolypin breaks the reactionary obstruction in the State Council, subordinating aristocratic land interests to national modernization and judicial uniformity across the provinces."
 SOV_zemstvo_reform_expansion:0 "Zemstvo Administration Expansion"
 SOV_zemstvo_reform_expansion_desc:0 "Local self-government is extended to western provinces and non-gentry populations, building civic infrastructure and primary schools directly funded by the central treasury."
 SOV_the_iron_prime_minister:0 "The Iron Prime Minister"
 SOV_the_iron_prime_minister_desc:0 "Combining sweeping socio-economic reform with uncompromising law and order, Stolypin creates a stable constitutional autocracy capable of weathering any storm."
 SOV_the_third_state_duma:0 "The Third State Duma"
 SOV_the_third_state_duma_desc:0 "Elected under the restrictive 1907 electoral law, the Third Duma is the first to survive its full five-year term, establishing working legislative routines between parliament and the imperial ministers."
 SOV_guchkov_and_the_octobrists:0 "Guchkov and the Octobrists"
 SOV_guchkov_and_the_octobrists_desc:0 "Alexander Guchkov's Union of October 17 seeks a middle path: constitutional monarchy, defense credits, and administrative efficiency without revolutionary disruption."
 SOV_milyukov_and_the_kadets:0 "Milyukov and the Kadets"
 SOV_milyukov_and_the_kadets_desc:0 "Pavel Milyukov's Constitutional Democrats advocate British-style parliamentary rule, civil liberties, universal suffrage, and aggressive defense of Russian foreign interests."
 SOV_the_fourth_state_duma_1912:0 "Elections to the Fourth Duma"
 SOV_the_fourth_state_duma_1912_desc:0 "The 1912 elections seat the Fourth State Duma, presided over by Mikhail Rodzianko. Though fragmented, it quickly becomes the center of national debate as the European arms race intensifies."
 SOV_curb_socialist_deputies:0 "Curb Socialist Agitation"
 SOV_curb_socialist_deputies_desc:0 "Following the Lena goldfields massacre and mounting strike waves, the Okhrana increases surveillance on Bolshevik and Menshevik Duma deputies to prevent clandestine revolutionary coordination."
 SOV_pass_public_health_acts:0 "Workers' Insurance Legislation"
 SOV_pass_public_health_acts_desc:0 "The Duma passes landmark statutory health and accident insurance for industrial laborers, establishing sickness funds jointly managed by workers and factory owners."
 SOV_progressive_bloc_1915:0 "Formation of the Progressive Bloc"
 SOV_progressive_bloc_1915_desc:0 "In August 1915, amid military disaster in Poland, two-thirds of the Duma and State Council unite into the Progressive Bloc, demanding a 'government enjoying the confidence of the nation'."
 SOV_ministry_of_national_confidence:0 "Ministry of National Confidence"
 SOV_ministry_of_national_confidence_desc:0 "The Duma petitions the Tsar to replace unpopular courtiers with capable public figures from civil society and industry to oversee the war mobilization."
 SOV_rodzianko_ultimatum:0 "Milyukov's 'Stupidity or Treason?'"
 SOV_rodzianko_ultimatum_desc:0 "In a blistering Duma address in November 1916, Pavel Milyukov attacks court corruption and defeatist intrigues, famously demanding after each accusation: 'Is this stupidity, or is it treason?'"
 SOV_murder_of_rasputin:0 "Assassination of Rasputin"
 SOV_murder_of_rasputin_desc:0 "Prince Felix Yusupov and Grand Duke Dmitri Pavlovich lure Rasputin to the Moika Palace and assassinate him in a desperate monarchist bid to save the Romanov dynasty from disgrace."
 SOV_february_bread_riots_1917:0 "Petrograd Bread Riots"
 SOV_february_bread_riots_1917_desc:0 "Sub-zero temperatures, severed railway links, and bread queues ignite massive strikes in the capital on International Women's Day. Over 200,000 workers take to the streets of Petrograd."
 SOV_mutiny_of_petrograd_garrison:0 "Mutiny of the Capital Garrison"
 SOV_mutiny_of_petrograd_garrison_desc:0 "Ordered to shoot demonstrators, the Pavlovsky, Volynsky, and Preobrazhensky reserve regiments mutiny, executing their officers and distributing rifles to the revolutionary crowds."
 SOV_abdication_at_pskov:0 "The Abdication at Pskov"
 SOV_abdication_at_pskov_desc:0 "Stranded in his imperial train at Pskov and abandoned by his generals, Nicholas II abdicates the throne for himself and his son Alexei. Three centuries of Romanov rule come to an end."
 SOV_provisional_government_formed:0 "The Provisional Government"
 SOV_provisional_government_formed_desc:0 "Prince Georgy Lvov chairs a provisional cabinet of liberal reformers pledged to uphold civil liberties and continue the war to total victory alongside the Western Allies."
 SOV_petrograd_soviet_order_no_1:0 "Petrograd Soviet Order No. 1"
 SOV_petrograd_soviet_order_no_1_desc:0 "The Petrograd Soviet decrees that military units obey only the Soviet, abolishes officer privileges, and establishes soldiers' committees, mortally undermining army cohesion."
 SOV_prince_lvov_coalition:0 "Prince Lvov's Coalition"
 SOV_prince_lvov_coalition_desc:0 "Attempting to bridge the gulf between bourgeois liberals and socialist workers, moderate socialists like Alexander Kerensky and Irakli Tsereteli are brought into the cabinet."
 SOV_executive_committee_ispolkom:0 "The All-Russian Soviet Executive"
 SOV_executive_committee_ispolkom_desc:0 "The Executive Committee (Ispolkom) exercises true veto power across factories, telecommunications, and garrisons, asserting de facto authority over state organs."
 SOV_the_kerensky_ministry:0 "The Kerensky Ministry"
 SOV_the_kerensky_ministry_desc:0 "Alexander Kerensky rises to Minister-President. With theatrical oratory and fiery appeals to revolutionary patriotism, he attempts to rally the crumbling nation for one final offensive."
 SOV_the_july_days_crisis:0 "The July Days Uprising"
 SOV_the_july_days_crisis_desc:0 "Spontaneous armed riots by sailors and Red Guards in Petrograd threaten to topple the government. Kerensky brandishes evidence of German funding for the Bolsheviks, forcing Lenin underground."
 SOV_the_kornilov_affair:0 "The Kornilov Crisis"
 SOV_the_kornilov_affair_desc:0 "General Lavr Kornilov orders cavalry corps to march on Petrograd to crush the Soviet and restore order. Terrified, Kerensky turns to the Bolshevik Red Guards and arms the workers."
 SOV_all_power_to_the_soviets:0 "All Power to the Soviets!"
 SOV_all_power_to_the_soviets_desc:0 "Bolstered by their role in halting Kornilov, Bolshevik majorities sweep the Petrograd and Moscow Soviets. Leon Trotsky organizes the Military Revolutionary Committee."
 SOV_storming_of_winter_palace:0 "Storming of the Winter Palace"
 SOV_storming_of_winter_palace_desc:0 "The cruiser Aurora fires a blank shot. Red Guards and Kronstadt sailors breach the Winter Palace, arresting the Provisional Government ministers. Lenin proclaims Soviet power."
 SOV_decree_on_peace:0 "Decree on Peace"
 SOV_decree_on_peace_desc:0 "The Soviet Government proposes an immediate armistice and peace without annexations or indemnities, calling on soldiers across Europe to lay down their arms."
 SOV_decree_on_land:0 "Decree on Land"
 SOV_decree_on_land_desc:0 "Landed estates, crown domains, and monastery lands are confiscated without compensation and placed at the disposal of local peasant land committees."
 SOV_founding_of_the_cheka:0 "Creation of the Cheka"
 SOV_founding_of_the_cheka_desc:0 "Felix Dzerzhinsky establishes the All-Russian Extraordinary Commission to combat counter-revolution, sabotage, and speculation with ruthless revolutionary terror."
 SOV_creation_of_the_red_army:0 "Founding of the Red Army"
 SOV_creation_of_the_red_army_desc:0 "Commissar for War Leon Trotsky builds the Workers' and Peasants' Red Army, enlisting former Tsarist military specialists watched over by political commissars."
 SOV_war_communism_decrees:0 "War Communism and Requisitioning"
 SOV_war_communism_decrees_desc:0 "Complete nationalization of heavy industry, strict labor militarization, and forced grain requisition squads (Prodrazvyorstka) are instituted to sustain the Soviet heartland."
 SOV_crush_the_white_armies:0 "Crush the Counter-Revolution"
 SOV_crush_the_white_armies_desc:0 "Red Army armored trains and proletarian divisions defeat Kolchak in Siberia, Denikin on the Don, and Yudenich outside Petrograd, securing the survival of Soviet Russia."
 SOV_kornilov_iron_dictatorship:0 "Kornilov's Iron Dictatorship"
 SOV_kornilov_iron_dictatorship_desc:0 "Kornilov's Savage Division smashes the Soviet barricades. Kerensky is arrested, and the General assumes supreme power over the Russian State."
 SOV_martial_law_in_petrograd:0 "Martial Law in Petrograd"
 SOV_martial_law_in_petrograd_desc:0 "Strikes are outlawed under penalty of death. Revolutionary agitators are court-martialed and executed on the spot."
 SOV_purge_the_soviets:0 "Purge the Soviet Councils"
 SOV_purge_the_soviets_desc:0 "The Smolny Institute and Soviet offices across Russia are stormed by shock officers. Bolshevik, Menshevik, and Left-SR leadership are exiled or hung."
 SOV_restore_capital_punishment:0 "Restoration of Frontline Discipline"
 SOV_restore_capital_punishment_desc:0 "Order No. 1 is repealed. Officers regain full punitive authority, and frontline deserters face immediate execution by firing squad."
 SOV_national_salvation_directory:0 "Directory of National Salvation"
 SOV_national_salvation_directory_desc:0 "Kornilov, Alekseyev, and Kaledin establish a triumvirate dedicated to total mobilization and the defense of the Fatherland."
 SOV_total_frontline_discipline:0 "Mobilize the Shock Regiments"
 SOV_total_frontline_discipline_desc:0 "Officers, cadets, and volunteer battalions form the vanguard of a revitalized national army determined to push the Central Powers back to the frontier."
 SOV_one_and_indivisible_russia:0 "Russia, One and Indivisible!"
 SOV_one_and_indivisible_russia_desc:0 "Separatist movements in the borderlands are suppressed as Kornilov proclaims a united, indivisible Russian state under military hegemony."
 SOV_convene_constituent_assembly:0 "Convene the Constituent Assembly"
 SOV_convene_constituent_assembly_desc:0 "Elections for the All-Russian Constituent Assembly take place with full participation. Millions of peasants and citizens cast free ballots for Russia's future."
 SOV_chernov_and_sr_plurality:0 "Victor Chernov and the SR Victory"
 SOV_chernov_and_sr_plurality_desc:0 "The Socialist Revolutionaries win a decisive majority. Victor Chernov is elected President of the Assembly, championing peasant socialization of land."
 SOV_defend_the_tauride_palace:0 "Defend the Tauride Palace"
 SOV_defend_the_tauride_palace_desc:0 "Loyal socialist guards and veteran soldiers protect the Constituent Assembly against Bolshevik disperse orders, ensuring constitutional supremacy."
 SOV_federal_democratic_republic:0 "Russian Democratic Federative Republic"
 SOV_federal_democratic_republic_desc:0 "The Assembly proclaims Russia a democratic federal republic, establishing fundamental civic rights and parliamentary governance."
 SOV_legal_land_distribution:0 "Orderly Land Socialization"
 SOV_legal_land_distribution_desc:0 "The basic law on land socializes agricultural estates under democratic local zemstvos without civil war violence or arbitrary pillage."
 SOV_autonomy_to_minority_nations:0 "Autonomy to Borderland Nationalities"
 SOV_autonomy_to_minority_nations_desc:0 "Finland, Ukraine, the Caucasus, and Siberia receive extensive legislative autonomy within a voluntary, federal democratic brotherhood."
 SOV_democratic_war_effort:0 "Revolutionary Defense of the Republic"
 SOV_democratic_war_effort_desc:0 "Inspired by the defense of their newly-won liberty, citizen soldiers rally to defend the free Republic against foreign imperialism."
 SOV_social_democracy_victorious:0 "Triumph of Russian Democracy"
 SOV_social_democracy_victorious_desc:0 "Defeating reactionary coups and foreign enemies alike, the Russian Democratic Republic takes its place among the proud democracies of the world."
 SOV_the_tsar_refuses_abdication:0 "The Tsar Refuses Abdication"
 SOV_the_tsar_refuses_abdication_desc:0 "At Pskov station, Nicholas II tosses the draft abdication manifesto into the fire. 'I am accountable for Russia before God Almighty, and no mortal shall tear the crown from my head.'"
 SOV_summon_frontline_cavalry:0 "Summon Frontline Guard Regiments"
 SOV_summon_frontline_cavalry_desc:0 "General Ivanov is dispatched with battle-hardened regiments from the Northern Front to occupy Petrograd and execute all mutinous garrison officers."
 SOV_unleash_the_black_hundreds:0 "Unleash the Union of the Russian People"
 SOV_unleash_the_black_hundreds_desc:0 "Monarchist Black Hundreds militias take to the streets with imperial banners, crushing revolutionary mobs and securing telegraph offices."
 SOV_dissolve_the_rebellious_duma:0 "Dissolve the Rebellious Duma"
 SOV_dissolve_the_rebellious_duma_desc:0 "The State Duma is dissolved by imperial decree. Conspirators of the Progressive Bloc are arrested and confined to the Peter and Paul Fortress."
 SOV_reinforce_fundamental_laws:0 "Reinforce the Fundamental Laws of 1906"
 SOV_reinforce_fundamental_laws_desc:0 "Article 4 is reaffirmed: 'To the Emperor of all the Russias belongs supreme autocratic power. Submission to his authority is commanded by God himself.'"
 SOV_absolutist_restoration:0 "Holy Orthodox Monarchy"
 SOV_absolutist_restoration_desc:0 "The Holy Synod and the imperial crown stand indivisible, mobilizing the devout peasantry across the empire for a holy crusade against foreign invaders."
 SOV_purification_of_the_empire:0 "Purification of the Realm"
 SOV_purification_of_the_empire_desc:0 "Subversive literature, socialist party apparatuses, and separatist newspapers are permanently eradicated by the Special Corps of Gendarmes."
 SOV_divine_right_unbroken:0 "Divine Right Unbroken"
 SOV_divine_right_unbroken_desc:0 "The Romanov throne emerges from the crucible of 1917 unshaken, its divine mandate validated before history and its armies marching toward victory."
 SOV_modernizing_the_colossus:0 "Modernizing the Colossus"
 SOV_modernizing_the_colossus_desc:0 "Between 1906 and 1913, the Russian economy grew at over 6% annually, the fastest in Europe. To maintain our place among great powers, this industrial surge must be directed toward national strength."
 SOV_peasant_land_bank:0 "Peasant Land Bank Expansion"
 SOV_peasant_land_bank_desc:0 "Expand state subsidized mortgage loans through the Krestyansky Pozemelny Bank, allowing hard-working peasants to purchase noble estates and consolidate family holdings."
 SOV_dissolution_of_the_obshchina:0 "Dismantle the Mir Communes"
 SOV_dissolution_of_the_obshchina_desc:0 "Allow individual peasants to formally withdraw from the periodic repartition of the village commune (Mir), turning communal strip-farming into permanent private property."
 SOV_consolidate_khutor_farms:0 "Consolidate Khutors and Otrubs"
 SOV_consolidate_khutor_farms_desc:0 "Surveyors assist enterprising peasants in consolidating scattered strips into unified homesteads (Khutors) and enclosed farms (Otrubs), boosting productivity tenfold."
 SOV_siberian_resettlement_program:0 "Siberian Resettlement Migration"
 SOV_siberian_resettlement_program_desc:0 "Provide free transport in Stolypin wagons and grant 40-desyatina tracts of rich virgin black soil in Western Siberia and the Altai to relieve rural overpopulation in European Russia."
 SOV_zemstvo_agronomists:0 "Zemstvo Agronomic Stations"
 SOV_zemstvo_agronomists_desc:0 "Deploy thousands of trained state agronomists and soil chemists to educate village elders on three-field crop rotation, nitrate fertilizers, and modern seed selection."
 SOV_modern_agricultural_machinery:0 "Import Modern Reapers and Tractors"
 SOV_modern_agricultural_machinery_desc:0 "Subsidize the purchase of American McCormick reapers, mechanical threshers, and iron plows, replacing medieval wooden ards across the black earth belt."
 SOV_altai_grain_harvests:0 "Siberian Butter and Grain Boom"
 SOV_altai_grain_harvests_desc:0 "Siberian cooperative creameries and grain elevators produce export surpluses of world-renowned butter and wheat, turning Siberia into an economic engine of the Empire."
 SOV_ukrainian_sugar_refineries:0 "Ukrainian Beet Sugar Refineries"
 SOV_ukrainian_sugar_refineries_desc:0 "The giant sugar magnates of Kiev and Podolia (Tereshchenko, Brodsky) operate dozens of steam refineries, supplying the entire domestic confectionery and ethanol market."
 SOV_grain_export_monopoly:0 "Black Sea Grain Terminals"
 SOV_grain_export_monopoly_desc:0 "Modernize the giant grain elevators of Odessa, Nikolayev, and Novorossiysk. Russia feeds Europe, supplying over 40% of the global wheat market."
 SOV_state_grain_elevators:0 "State Grain Silo Network"
 SOV_state_grain_elevators_desc:0 "Build massive reinforced-concrete silos along the Volga and Dnieper rivers to prevent spoilage and cushion the domestic market against famine during poor harvests."
 SOV_rural_electrification_initiatives:0 "Rural Electrification Experiments"
 SOV_rural_electrification_initiatives_desc:0 "Hydroelectric flour mills and localized electrical dynamos bring modern power to rural zemstvo towns, bridging the gap between city and countryside."
 SOV_cooperative_credit_societies:0 "All-Russian Peasant Credit Unions"
 SOV_cooperative_credit_societies_desc:0 "Over 30,000 credit cooperatives provide low-interest loans to peasant smallholders, freeing rural producers from village usurers and grain merchants."
 SOV_flourishing_rural_middle_class:0 "The Sturdy Peasant Yeomanry"
 SOV_flourishing_rural_middle_class_desc:0 "Stolypin's dream fulfilled: a broad conservative class of independent landowning peasants, loyal to the social order and resistant to revolutionary promises."
 SOV_putilov_works_expansion:0 "Expand the Putilov Industrial Complex"
 SOV_putilov_works_expansion_desc:0 "The Saint Petersburg Putilov Works employs 30,000 workers. Major investments in its metallurgy foundries, locomotive bays, and naval artillery workshops make it Russia's industrial powerhouse."
 SOV_donbass_coal_and_iron_basin:0 "The Donets Coal Basin (Donbass)"
 SOV_donbass_coal_and_iron_basin_desc:0 "Funded largely by French and Belgian capital, the deep coal pits of Hughesovka (Yuzovka) and Horlivka provide the anthracite coke needed for blast furnaces across the Empire."
 SOV_obukhov_ordnance_works:0 "Obukhov State Steel Cannon Works"
 SOV_obukhov_ordnance_works_desc:0 "The imperial state factory at Obukhovo specializes in giant 12-inch naval guns, armor plate forging, and precision torpedo engine manufacturing."
 SOV_krivoy_rog_iron_mines:0 "Krivoy Rog Open-Cast Iron Mines"
 SOV_krivoy_rog_iron_mines_desc:0 "The extraordinarily rich hematite ores of Krivoy Rog feed blast furnaces in Ekaterinoslav and Mariupol, creating a southern heavy industrial cluster second to none."
 SOV_baku_black_gold_monopoly:0 "Baku's Black Gold Gusher"
 SOV_baku_black_gold_monopoly_desc:0 "The Absheron peninsula in Azerbaijan produces over half the world's refined kerosene and heavy lubricants. Modern electric pumps replace manual extraction."
 SOV_makeyevka_metallurgical_works:0 "Makeyevka Steel Combine"
 SOV_makeyevka_metallurgical_works_desc:0 "Construct ultra-modern blast furnaces in Makeyevka capable of turning out heavy railway rails, structural beams, and boiler plate in record time."
 SOV_urals_heavy_smelters:0 "Revitalize the Ural Smelters"
 SOV_urals_heavy_smelters_desc:0 "Modernize the Demidov and Stroganov steelworks in Nizhny Tagil and Perm, replacing charcoal furnaces with modern open-hearth Siemens-Martin converters."
 SOV_nobel_and_rothschild_refineries:0 "Nobel Brothers Petroleum Engineering"
 SOV_nobel_and_rothschild_refineries_desc:0 "Branobel (The Nobel Brothers Petroleum Company) builds the world's first oil tankers and the Baku-Batumi kerosene pipeline, securing export supremacy to world markets."
 SOV_motovilikha_artillery_plant:0 "Motovilikha Cannon Foundries (Perm)"
 SOV_motovilikha_artillery_plant_desc:0 "Nestled behind the Ural mountains, the Motovilikha works produces massive quantities of field howitzers safe from any enemy bomber or frontline raid."
 SOV_saint_petersburg_heavy_engineering:0 "Petrograd Heavy Machinery Hub"
 SOV_saint_petersburg_heavy_engineering_desc:0 "The Baltic Shipyard, Franco-Russian Works, and Lessner machine plants in the capital form the world's largest concentration of precision mechanical engineering."
 SOV_moscow_textile_and_rubber_mills:0 "Moscow Textile and Chemical Conglomerates"
 SOV_moscow_textile_and_rubber_mills_desc:0 "The Trekhgornaya textile manufactory and the Russian-French Treugolnik rubber works supply boots, canvas, and gas-mask rubber for the entire imperial war machine."
 SOV_domestic_machine_tool_production:0 "Domestic Machine Tool Independence"
 SOV_domestic_machine_tool_production_desc:0 "End reliance on imported German precision lathes and French steam presses by establishing domestic state tool-and-die institutes in Nizhny Novgorod."
 SOV_electrification_of_heavy_industry:0 "Volkhov Hydroelectric Dam Plan"
 SOV_electrification_of_heavy_industry_desc:0 "Harness the rushing waters of the Volkhov River near Lake Ladoga to generate 60,000 horsepower of high-voltage electric current to power Petrograd's factories."
 SOV_trans_siberian_double_tracking:0 "Trans-Siberian Double Tracking"
 SOV_trans_siberian_double_tracking_desc:0 "Lay a continuous second parallel track from Omsk to Vladivostok, eliminating freight bottlenecks and enabling 40 military trains a day to cross Eurasia."
 SOV_circum_baikal_engineering:0 "The Circum-Baikal Mountain Tunnels"
 SOV_circum_baikal_engineering_desc:0 "Reinforce the 39 cliff-side tunnels blasted through the granite cliffs of Lake Baikal with concrete revetments and avalanche sheds."
 SOV_poland_strategic_railway_grid:0 "Polish Salient Strategic Rail Grid"
 SOV_poland_strategic_railway_grid_desc:0 "Dense broad-gauge feeder lines connecting Warsaw, Ivangorod (Deblin), Brest-Litovsk, and Bialystok allow rapid regrouping of whole armies."
 SOV_amur_railway_link:0 "Complete the Amur Railway Circuit"
 SOV_amur_railway_link_desc:0 "Finish the all-Russian domestic route along the Amur River to Vladivostok, bypassing the Chinese Eastern Railway and securing direct military transit to the Pacific."
 SOV_murmansk_ice_free_port_lifeline:0 "The Murman Arctic Railway Lifeline"
 SOV_murmansk_ice_free_port_lifeline_desc:0 "Construct 1,000 kilometers of railway across tundra and frozen bogs to the ice-free Kola Gulf, founding the deep-water port of Romanov-on-Murman (Murmansk)."
 SOV_arkhangelsk_broad_gauge_conversion:0 "Convert Arkhangelsk to Broad Gauge"
 SOV_arkhangelsk_broad_gauge_conversion_desc:0 "Convert the narrow-gauge Vologda-Arkhangelsk line to standard Russian broad gauge, allowing tens of thousands of tons of Allied munitions to flow directly inland."
 SOV_caucasus_mountain_lines:0 "Tiflis-Kars Transcaucasian Railway"
 SOV_caucasus_mountain_lines_desc:0 "Extend the mountain railways from Tiflis (Tbilisi) to the fortress city of Kars, securing reliable heavy artillery resupply for operations against Ottoman Anatolia."
 SOV_white_sea_icebreaker_fleet:0 "White Sea Arctic Icebreaker Fleet"
 SOV_white_sea_icebreaker_fleet_desc:0 "Commission heavy icebreakers like the Yermak and Svyatogor to keep the frozen channels of the White Sea navigable through sub-zero Arctic winters."
 SOV_military_railway_battalions:0 "Special Railway Sapper Battalions"
 SOV_military_railway_battalions_desc:0 "Form dedicated sapper battalions equipped with armored repair draisines, steam pile-drivers, and rapid track-laying equipment to repair severed bridges in hours."
 SOV_broad_gauge_streamlining:0 "Unified Strategic Rolling Stock"
 SOV_broad_gauge_streamlining_desc:0 "Standardize all 50,000 imperial locomotives and freight wagons, equipping them with unified Westinghouse air brakes and centralized military route scheduling."
 SOV_strategic_reserve_depots:0 "Central Logistics Hub at Smolensk"
 SOV_strategic_reserve_depots_desc:0 "Construct cavernous grain and munitions depots at Smolensk, Kursk, and Gomel, positioned safely behind the front lines to sustain prolonged campaigns."
 SOV_special_council_for_defense:0 "Special Council for Defense (Osoboye Soveshchaniye)"
 SOV_special_council_for_defense_desc:0 "Form a supreme coordinating council uniting the War Ministry, Duma leaders, and industrial captains to direct state war contracts and raw material priorities."
 SOV_war_industry_committees_zemgor:0 "Mobilize the War Industry Committees & Zemgor"
 SOV_war_industry_committees_zemgor_desc:0 "Enlist Prince Lvov's Union of Zemstvos and Towns (Zemgor) and Guchkov's War Industry Committees to mobilize small provincial factories for shell production."
 SOV_convert_civilian_foundries:0 "Convert Civilian Machine Shops to Shell Turning"
 SOV_convert_civilian_foundries_desc:0 "Railway repair shops, agricultural implement factories, and private metal foundries are refitted with shell-turning lathes, producing millions of 3-inch shrapnel cases."
 SOV_female_ammunition_workers:0 "Mobilize Women Ammunition Workers"
 SOV_female_ammunition_workers_desc:0 "Recruit over 400,000 peasant and urban women into cartridge factories and shell-filling workshops, maintaining peak industrial output while men fight at the front."
 SOV_centralized_grain_procurement:0 "Fixed Grain Requisition Prices"
 SOV_centralized_grain_procurement_desc:0 "Establish fixed ceiling prices for rye and wheat, utilizing zemstvo statistical committees to guarantee food supplies for the frontline armies and industrial cities."
 SOV_emergency_coal_allotment:0 "Priority Coal and Timber Allocations"
 SOV_emergency_coal_allotment_desc:0 "Ration coal consumption strictly for locomotives and steel furnaces, keeping locomotives running through winter blizzards."
 SOV_end_the_shell_shortage:0 "Overcome the Shell Shortage (1916)"
 SOV_end_the_shell_shortage_desc:0 "By mid-1916, Russian domestic shell production expands forty-fold, exceeding 4.5 million shells a month. The artillery crisis that crippled 1915 is decisively broken."
 SOV_arsenal_of_the_russian_empire:0 "Arsenal of the Russian State"
 SOV_arsenal_of_the_russian_empire_desc:0 "State arsenals in Petrograd, Tula, and Perm run 24-hour shifts, pouring out endless streams of field guns, maxims, cartridges, and shrapnel."
 SOV_integrated_war_production:0 "Total Industrial War Integration"
 SOV_integrated_war_production_desc:0 "Mines, railways, steel mills, and arms factories operate as a single coordinated machine, providing the logistical muscle for total victory."
 SOV_rebuilding_the_empires_shields:0 "Rebuilding the Empire's Shields"
 SOV_rebuilding_the_empires_shields_desc:0 "Traumatized by the catastrophic losses at Tsushima and Port Arthur in 1905, the Admiralty and State Duma sponsor an enormous multi-year naval and aerial rearmament program."
 SOV_baltic_fleet_resurgence:0 "The Baltic Fleet Renaissance"
 SOV_baltic_fleet_resurgence_desc:0 "Under Admiral Nikolai von Essen, the Baltic Fleet is reorganized from the bottom up, instituting rigorous gunnery drills, night torpedo exercises, and modern tactical communications."
 SOV_gangut_class_dreadnoughts:0 "Gangut-Class Dreadnoughts"
 SOV_gangut_class_dreadnoughts_desc:0 "Rush the completion of the four Sevastopol/Gangut dreadnoughts at the Admiralty and Baltic Shipyards. Armed with twelve 12-inch guns in triple turrets, they can match the German Kaiser-class."
 SOV_gulf_of_finland_minefields:0 "Gulf of Finland Mine Barrages"
 SOV_gulf_of_finland_minefields_desc:0 "Russian minelayers deploy over 40,000 explosive naval mines across the Central Position between Porkkala and Reval, turning the Gulf of Finland into an impassable fortress."
 SOV_kronstadt_and_reval_fortresses:0 "Peter the Great Coastal Fortress"
 SOV_kronstadt_and_reval_fortresses_desc:0 "Massive 12-inch and 14-inch armored coastal turrets on Kotlin Island (Kronstadt) and the Estonian coast interlock their arcs of fire to protect the capital from naval bombardment."
 SOV_novik_class_fast_destroyers:0 "Novik-Class Fast Destroyers"
 SOV_novik_class_fast_destroyers_desc:0 "Capably reaching 37 knots, the Novik was the fastest warship in the world at launch. Heavily armed with triple torpedo tubes and 4-inch guns, she terrorizes enemy convoys."
 SOV_bars_class_submarines:0 "Bars-Class Ocean-Going Submarines"
 SOV_bars_class_submarines_desc:0 "Construct the 24 modern Bars-class diesel-electric submarines equipped with Dzhevetsky external dropping collars and deck guns to raid Swedish iron ore convoys."
 SOV_krab_minelaying_submarine:0 "Krab: The World's First Minelaying Submarine"
 SOV_krab_minelaying_submarine_desc:0 "Mikhail Naletov builds the Krab, capable of carrying 60 naval mines internally to sneak into enemy harbors and lay minefields unseen beneath the surface."
 SOV_british_baltic_submarine_flotilla:0 "British Baltic Submarine Flotilla"
 SOV_british_baltic_submarine_flotilla_desc:0 "British E-class submarines (E9, E19 under Commander Max Horton) penetrate the Sound into the Baltic, sinking German cruisers and paralyzing the German ore trade."
 SOV_borodino_battlecruisers_laid_down:0 "Borodino-Class Battlecruisers"
 SOV_borodino_battlecruisers_laid_down_desc:0 "Lay down four colossal 32,000-ton battlecruisers armed with twelve 14-inch guns at the Galerniy Island yards to command the entire Baltic littoral."
 SOV_baltic_mine_offensive:0 "Offensive Minelaying Operations"
 SOV_baltic_mine_offensive_desc:0 "Russian fast cruisers and destroyers slip into German territorial waters under cover of fog, planting minefields off Danzig, Pillau, and the Gulf of Danzig, sinking German cruisers."
 SOV_moonsund_archipelago_defenses:0 "Moonsund Archipelago Fortress"
 SOV_moonsund_archipelago_defenses_desc:0 "Fortify Saaremaa and Hiiumaa islands with heavy 12-inch gun emplacements at Zerel, sealing the Gulf of Riga against German amphibious assault."
 SOV_baltic_sea_denial:0 "Baltic Sea Domination"
 SOV_baltic_sea_denial_desc:0 "The Kaiserliche Marine is held at bay, unable to pierce the mine-and-dreadnought bastions of the Gulf of Finland. The northern flank of Russia stands inviolate."
 SOV_black_sea_fleet_supremacy:0 "The Black Sea Fleet Command"
 SOV_black_sea_fleet_supremacy_desc:0 "Based in the deep natural harbor of Sevastopol, the Black Sea Fleet must prepare to contain the Ottoman Navy and neutralize the German battlecruiser SMS Goeben."
 SOV_imperatritsa_mariya_battleships:0 "Imperatritsa Mariya Dreadnoughts"
 SOV_imperatritsa_mariya_battleships_desc:0 "Commission the powerful dreadnoughts Imperatritsa Mariya, Ekaterina Velikaya, and Aleksandr III at Nikolayev. Their 12-inch salvos easily overmatch the Goeben."
 SOV_bosphorus_raid_doctrine:0 "Bosphorus Bombardment Tactics"
 SOV_bosphorus_raid_doctrine_desc:0 "Admiral Eberhardt initiates aggressive bombardment runs right up to the mouth of the Bosphorus, wrecking Ottoman coastal batteries and lighthouse networks."
 SOV_sevastopol_naval_bastion:0 "Sevastopol Naval Bastion"
 SOV_sevastopol_naval_bastion_desc:0 "Heavily fortify the approaches to Sevastopol with dry docks, mine barriers, and rapid torpedo boat pens, creating an invulnerable operating sanctuary."
 SOV_cut_anatolia_coal_lines:0 "Interdict the Zonguldak Coal Trade"
 SOV_cut_anatolia_coal_lines_desc:0 "Submarines and destroyers systematically sink Turkish colliers sailing from the Zonguldak coal basin to Constantinople, starving the Ottoman capital of fuel and electricity."
 SOV_caucasian_amphibious_raids:0 "Pontic Amphibious Landings"
 SOV_caucasian_amphibious_raids_desc:0 "The Black Sea Fleet coordinates seamlessly with the Caucasian Army, landing troops behind Turkish lines at Atina and Rize to turn the Ottoman flanks."
 SOV_trabzon_amphibious_landing:0 "The Capture of Trebizond (1916)"
 SOV_trabzon_amphibious_landing_desc:0 "A brilliantly executed joint amphibious assault captures the historic port of Trebizond (Trabzon), giving Russia a major forward logistics base in northeastern Anatolia."
 SOV_prepare_for_tsargrad_landing:0 "The Tsargrad Landing Corps"
 SOV_prepare_for_tsargrad_landing_desc:0 "Admiral Kolchak forms a dedicated marine corps of two infantry divisions equipped with landing barges and specialized artillery to storm the Bosphorus forts."
 SOV_black_sea_command_secured:0 "Mastery of the Euxine Sea"
 SOV_black_sea_command_secured_desc:0 "The Black Sea is converted into a Russian lake. With Ottoman naval power broken, the maritime gates to the Mediterranean lie open before the Russian Empire."
 SOV_imperial_russian_air_service:0 "The Imperial Air Fleet Committee"
 SOV_imperial_russian_air_service_desc:0 "Grand Duke Alexander Mikhailovich spearheads the creation of the Imperial Russian Air Service (IRAS), establishing flying schools at Gatchina and Sevastopol."
 SOV_kacha_military_flying_school:0 "Kacha Military Aviation Academy"
 SOV_kacha_military_flying_school_desc:0 "Expand the premier aviation school at Kacha in Crimea. Benefiting from mild southern climates, hundreds of officer pilots graduate with high aerobatic combat skills."
 SOV_sikorsky_ilya_muromets:0 "Sikorsky's Ilya Muromets Giant"
 SOV_sikorsky_ilya_muromets_desc:0 "Igor Sikorsky designs the world's first four-engine strategic bomber at the Russo-Baltic Wagon Works (RBVZ), capable of carrying 800 kilograms of bombs and eight defensive machine guns."
 SOV_lebed_reconnaissance_corps:0 "Lebed Reconnaissance Aircraft"
 SOV_lebed_reconnaissance_corps_desc:0 "The Lebedev and Duks factories manufacture hundreds of reliable two-seat reconnaissance biplanes equipped with aerial cameras and wireless transmitters for frontline artillery spotting."
 SOV_heavy_bombing_squadron_evok:0 "The EVOK Heavy Bomber Squadron"
 SOV_heavy_bombing_squadron_evok_desc:0 "Form the world's first dedicated heavy bomber wing (Eskadra Vozdushnykh Korabley) at Jablonna, carrying out massed strategic strikes on enemy rail hubs, depots, and bridges."
 SOV_nesterov_aerial_ramming_tactics:0 "Nesterov's Loop and Combat Tactics"
 SOV_nesterov_aerial_ramming_tactics_desc:0 "Staff Captain Pyotr Nesterov performs the world's first aerobatic loop and later the first aerial ramming (taran), inspiring a generation of daring Russian combat aviators."
 SOV_anatra_anasal_fighter_fleet:0 "Anatra Anasal Fighter Fleet"
 SOV_anatra_anasal_fighter_fleet_desc:0 "The Anatra factory in Odessa builds high-performance Salmson-engined scout fighters and escort planes to shield the Ilya Muromets bombers during deep penetration raids."
 SOV_kazakov_ace_fighter_groups:0 "Alexander Kazakov's Ace Group"
 SOV_kazakov_ace_fighter_groups_desc:0 "Russia's top ace, Staff Captain Alexander Kazakov (32 victories), commands the 1st Combat Air Group, achieving air superiority over the Galician frontlines."
 SOV_strategic_air_bombardment_doctrine:0 "Long-Range Strategic Doctrine"
 SOV_strategic_air_bombardment_doctrine_desc:0 "Develop comprehensive doctrine for nocturnal area bombing of enemy industrial centers in East Prussia and Austrian oil refineries at Drohobych."
 SOV_seaplane_carriers_in_the_black_sea:0 "Black Sea Seaplane Tenders"
 SOV_seaplane_carriers_in_the_black_sea_desc:0 "Convert merchant ships Almaz, Imperator Nikolai I, and Imperator Aleksandr I into seaplane carriers, launching Grigorovich M-9 flying boats to bomb the Bosphorus forts."
 SOV_integrated_air_naval_reconnaissance:0 "Combined Air-Naval Fire Direction"
 SOV_integrated_air_naval_reconnaissance_desc:0 "Equip naval spotter aircraft with radio equipment to direct dreadnought broadsides over the horizon against shore fortifications and enemy flotillas."
 SOV_mastery_of_the_imperial_skies:0 "Vanguard of the World's Skies"
 SOV_mastery_of_the_imperial_skies_desc:0 "With hundreds of strategic bombers, thousands of reconnaissance aircraft, and elite ace fighter wings, Russia pioneers the future of 20th-century aerial warfare."
 SOV_the_great_military_program:0 "The Great Military Program of 1912"
 SOV_the_great_military_program_desc:0 "Approved by the Duma and Emperor in 1912, the Great Program aims to expand the peacetime Russian army to 1.75 million men and add 3,000 artillery pieces by 1917, terrifying the German General Staff."
 SOV_sukhomlinov_reforms:0 "Sukhomlinov's Corps Reorganization"
 SOV_sukhomlinov_reforms_desc:0 "War Minister General Vladimir Sukhomlinov restructures the field army into standardized army corps, increases machine gun detachments, and accelerates conscript training cycles."
 SOV_grand_duke_nicholas_stavka:0 "Grand Duke Nicholas and Stavka"
 SOV_grand_duke_nicholas_stavka_desc:0 "Standing six feet six inches tall, the towering Grand Duke Nicholas Nikolaevich commands immense prestige among officers and ranks as Supreme Commander of the Imperial Armed Forces."
 SOV_modernize_mosin_nagant_1891:0 "Modernize the Mosin-Nagant M1891"
 SOV_modernize_mosin_nagant_1891_desc:0 "Adopt the 1908 spitzer pointed bullet (L-bullet) and improve tangent sights on the legendary three-line bolt-action rifle, increasing muzzle velocity and flat trajectory range."
 SOV_cossack_hosts_mobilization:0 "Mobilize the Cossack Hosts"
 SOV_cossack_hosts_mobilization_desc:0 "Summon the warrior hosts of the Don, Kuban, Terek, and Orenburg. Born to the saddle and armed with shashka sabers and lances, they form the premier reconnaissance cavalry of Europe."
 SOV_reorganize_military_districts:0 "Warsaw and Vilna Military Districts"
 SOV_reorganize_military_districts_desc:0 "Pre-position permanent corps headquarters in the forward border districts to counter sudden mobilization surges across the East Prussian and Galician frontiers."
 SOV_savage_division_cavalry:0 "The Caucasian Native Cavalry ('Wild Division')"
 SOV_savage_division_cavalry_desc:0 "Form the legendary volunteer cavalry division of Circassian, Chechen, Dagestani, and Ingush horsemen under Grand Duke Michael Alexandrovich, renowned for fearless saber charges."
 SOV_standing_corps_readiness:0 "Standing Corps Mobilization Readiness"
 SOV_standing_corps_readiness_desc:0 "Drill reserve reservists in annual summer camp maneuvers, cutting the imperial mobilization schedule from 30 days down to a startling 18 days."
 SOV_telegraph_and_wireless_corps:0 "Wireless Telegraph Signal Corps"
 SOV_telegraph_and_wireless_corps_desc:0 "Equip all army headquarters with motorized radio telegraph units and enforce strict cipher discipline to eliminate unsecured radio broadcasts between front commanders."
 SOV_praporshchik_accelerated_officers:0 "Ensign (Praporshchik) Crash Officer Schools"
 SOV_praporshchik_accelerated_officers_desc:0 "Open four-month officer training courses for educated university youth and literate peasant sons, creating over 200,000 junior platoon leaders to replace heavy combat losses."
 SOV_imperial_guard_regiments:0 "The Imperial Guard Corps"
 SOV_imperial_guard_regiments_desc:0 "Composed of the Preobrazhensky, Semyonovsky, and Izmaylovsky regiments, the elite Imperial Guard Corps serves as the Tsar's ultimate operational reserve."
 SOV_general_staff_academy_doctrine:0 "Nicholas General Staff Academy Reforms"
 SOV_general_staff_academy_doctrine_desc:0 "Modernize the curriculum of the Imperial Staff College in Saint Petersburg under General Mikhail Alekseyev, emphasizing multi-corps echeloned operations and defensive fire nets."
 SOV_general_headquarters_baranovichi:0 "Stavka Supreme Headquarters (Baranovichi)"
 SOV_general_headquarters_baranovichi_desc:0 "General Mikhail Alekseyev integrates intelligence, rail routing, and frontline supply into a smooth-functioning high command apparatus."
 SOV_the_shell_shortage_crisis:0 "The Great Shell Shortage (1915)"
 SOV_the_shell_shortage_crisis_desc:0 "Expenditures of artillery shells exceed pre-war peacetime stockpiles within four months. In 1915, Russian batteries are limited to three shells a day per gun while under crushing German bombardments."
 SOV_the_great_retreat_to_the_dvina:0 "The Great Retreat to the Dvina"
 SOV_the_great_retreat_to_the_dvina_desc:0 "To save the army from encirclement following the Gorlice-Tarnow breakthrough, Grand Duke Nicholas orders a masterly strategic evacuation of Poland, Lithuania, and Courland, scorching land behind them."
 SOV_tula_and_izhevsk_arms_surge:0 "Tula and Izhevsk Rifles Surge"
 SOV_tula_and_izhevsk_arms_surge_desc:0 "Tula Arms Factory and Izhevsk Works switch to round-the-clock shift rotations, surging production of Mosin rifles and Maxim machine guns to over 100,000 weapons a month."
 SOV_scovill_and_vickers_foreign_shells:0 "Allied Contracts: Vickers and Remington"
 SOV_scovill_and_vickers_foreign_shells_desc:0 "Contract American and British manufacturers (Remington, Winchester, Westinghouse, Vickers) to manufacture millions of rifles and high-explosive shells paid in imperial gold bullion."
 SOV_schneider_and_putilov_heavy_howitzers:0 "Schneider-Putilov Heavy Siege Howitzers"
 SOV_schneider_and_putilov_heavy_howitzers_desc:0 "License-produce the formidable 152mm Model 1910 and 203mm heavy siege howitzers, giving Russian forces the firepower needed to smash Austrian fortress complexes like Przemysl."
 SOV_sokolov_wheeled_maxim_mounts:0 "Sokolov Wheeled Mount for Maxim M1910"
 SOV_sokolov_wheeled_maxim_mounts_desc:0 "Equip all Maxim heavy machine guns with Alexander Sokolov's wheeled mount and armored gun shield, allowing gun crews to drag their deadly weapons across mud and snow."
 SOV_m1902_76mm_putilov_divisional_gun:0 "The Famous 3-Inch Putilov Gun (M1902)"
 SOV_m1902_76mm_putilov_divisional_gun_desc:0 "Affectionately called the 'Trekhdyuymovka', the 76.2mm Putilov quick-firing gun with its high muzzle velocity and flat trajectory is one of the premier field guns of the war."
 SOV_railway_heavy_guns:0 "Naval Guns on Railway Carriages"
 SOV_railway_heavy_guns_desc:0 "Mount spare 10-inch and 12-inch naval rifles from the Sevastopol drydocks onto heavy multi-axle rail platforms, shelling German rail junctions from 25 miles away."
 SOV_massed_artillery_preparation:0 "Short Hurricane Bombardment Tactics"
 SOV_massed_artillery_preparation_desc:0 "Abandon multi-day preliminary bombardments that sacrifice the element of surprise. Adopt short, intense hurricane barrages guided by aerial observation."
 SOV_gas_warfare_and_zelinsky_masks:0 "Zelinsky Activated Charcoal Gas Mask"
 SOV_gas_warfare_and_zelinsky_masks_desc:0 "Chemist Nikolai Zelinsky invents the world's first universal activated charcoal filter gas mask. Mass-produced by the millions, it completely neutralizes German chlorine and phosgene attacks."
 SOV_brusilov_breakthrough_1916:0 "The Brusilov Offensive (June 1916)"
 SOV_brusilov_breakthrough_1916_desc:0 "General Alexei Brusilov launches the master stroke of the war on the Southwestern Front: attacking along a 300-mile front simultaneously, shattering the Austro-Hungarian 4th and 7th Armies."
 SOV_deep_echelon_surprise_assault:0 "Sap-Trenches and Infiltration Tactics"
 SOV_deep_echelon_surprise_assault_desc:0 "Dig underground sap trenches to within 75 yards of enemy barbed wire under cover of night, allowing assault waves to breach the enemy front line before defenders can man their machine guns."
 SOV_shock_battalions_of_death:0 "Shock Battalions of Death (Udarniki)"
 SOV_shock_battalions_of_death_desc:0 "Form volunteer storm battalions wearing black-and-red chevron badges with skull and crossbones insignia, trained in carbines, trench daggers, and bundle grenades to lead dangerous assaults."
 SOV_fedorov_avtomat_early_rifle:0 "Vladimir Fedorov's Automatic Rifle (Avtomat)"
 SOV_fedorov_avtomat_early_rifle_desc:0 "Captain Vladimir Fedorov develops the world's first select-fire assault rifle, chambered in the lightweight 6.5mm Arisaka cartridge with a 25-round detachable box magazine for shock troops."
 SOV_garford_putilov_armored_cars:0 "Garford-Putilov Heavy Armored Cars"
 SOV_garford_putilov_armored_cars_desc:0 "Built on imported American Garford 5-ton truck chassis and armed with a rear-facing 76mm cannon and three machine guns, these 11-ton behemoths crush enemy counter-attacks."
 SOV_bochkareva_womens_battalion:0 "1st Russian Women's Battalion of Death"
 SOV_bochkareva_womens_battalion_desc:0 "Maria Bochkareva forms the famous all-female combat battalion with blessing from the Provisional Government and General Kornilov to shame war-weary male soldiers into fighting."
 SOV_steel_breastplates_shock:0 "Steel Armor Breastplates for Grenadiers"
 SOV_steel_breastplates_shock_desc:0 "Equip shock assault companies with curved ballistic steel breastplates capable of stopping shrapnel fragments and pistol rounds during violent trench clearance."
 SOV_vezdekhod_and_tsar_tank_experiments:0 "Vezdekhod and Tsar Tank Experiments"
 SOV_vezdekhod_and_tsar_tank_experiments_desc:0 "Alexander Porokhovshchikov designs the tracked 'Vezdekhod' while Nikolai Lebedenko tests the gargantuan 40-ton tricycle Tsar Tank with 9-meter front wheels to bridge giant trenches."
 SOV_inelastic_trench_fortifications:0 "Concrete Deep-Bunker Fortification Lines"
 SOV_inelastic_trench_fortifications_desc:0 "Construct deep concrete dugouts, barbed wire belts six rows deep, and interlocking pillboxes along the Dvina and Dniester rivers, forging an impregnable eastern rampart."
 SOV_the_unbreakable_steamroller:0 "The Reborn Russian Steamroller"
 SOV_the_unbreakable_steamroller_desc:0 "Possessing limitless manpower, abundant shells, advanced shock tactics, and armored cars, the Russian Imperial Army stands ready to roll inexorably westward to Berlin and Vienna."
 SOV_third_rome_foreign_policy:0 "Third Rome Foreign Policy"
 SOV_third_rome_foreign_policy_desc:0 "Since the fall of Constantinople in 1453, Moscow stands as the Third Rome. Our holy duty is to protect Orthodox Christians everywhere and preserve the European balance of power."
 SOV_pan_slavic_protectorate:0 "The Pan-Slavic Mandate"
 SOV_pan_slavic_protectorate_desc:0 "Foreign Minister Sergei Sazonov and Russian ambassador Nicholas Hartwig in Belgrade cultivate close fraternal ties with the Balkan Slavic kingdoms to liberate brother peoples from Ottoman rule."
 SOV_the_balkan_league_architect:0 "Broker the Balkan League (1912)"
 SOV_the_balkan_league_architect_desc:0 "Under Russian diplomatic sponsorship, Serbia, Bulgaria, Greece, and Montenegro sign mutual military conventions aimed at expelling the Ottoman Empire from the European continent."
 SOV_sacred_guarantee_to_serbia:0 "Sacred Guarantee to Serbia"
 SOV_sacred_guarantee_to_serbia_desc:0 "Tsar Nicholas II reassures Prince Regent Alexander: 'Russia will never remain indifferent to the fate of Serbia.' An Austrian assault on Belgrade means general war."
 SOV_first_balkan_war_mediation:0 "Mediate the First Balkan War"
 SOV_first_balkan_war_mediation_desc:0 "As Balkan League armies sweep through Macedonia and Thrace, Russian diplomacy restrains Bulgaria from storming Constantinople while securing Kosovo for Serbia."
 SOV_aid_to_serbian_army:0 "Danube Munitions Convoys to Serbia"
 SOV_aid_to_serbian_army_desc:0 "Ship millions of Mosin cartridges and field artillery shells down the Danube to the Serbian port of Prahovo, enabling King Peter's army to crush the initial Austrian invasions."
 SOV_prevent_second_balkan_war:0 "Arbitrate the Vardar Partition"
 SOV_prevent_second_balkan_war_desc:0 "Act as solemn arbitrator between Belgrade and Sofia over the contested Macedonian territory, averting fratricidal war between Slavic brothers and keeping Bulgaria in our orbit."
 SOV_bring_romania_into_the_war:0 "Promise Transylvania to Romania"
 SOV_bring_romania_into_the_war_desc:0 "Tsar Nicholas II visits King Carol and Prime Minister Bratianu in Constanta, promising Transylvania and the Banat if Romania opens a second front against Austria-Hungary."
 SOV_the_july_crisis_mobilization:0 "The General Mobilization Order (July 1914)"
 SOV_the_july_crisis_mobilization_desc:0 "Following Austria's declaration of war on Serbia and despite frantic Willy-Nicky telegrams, Nicholas II signs the fatal ukase ordering general mobilization across all military districts."
 SOV_pan_slavic_triumph:0 "Triumph of Pan-Slavism"
 SOV_pan_slavic_triumph_desc:0 "Under Russian patronage, the Slavic nations of Southeastern Europe stand united, their liberation achieved and their security guaranteed for all generations to come."
 SOV_liberate_south_slavs:0 "Greater Slavic Confederation"
 SOV_liberate_south_slavs_desc:0 "Sponsor the creation of a vast South Slavic kingdom uniting Serbs, Croats, and Slovenes under the Karađorđević dynasty, permanently allied to Petrograd."
 SOV_reaffirm_franco_russian_alliance:0 "Reaffirm the Franco-Russian Alliance"
 SOV_reaffirm_franco_russian_alliance_desc:0 "French President Raymond Poincaré travels to Kronstadt on the battleship France. The two powers reaffirm their binding commitment to march on Berlin simultaneously if either is attacked."
 SOV_anglo_russian_entente_in_persia:0 "Consolidate the Anglo-Russian Entente"
 SOV_anglo_russian_entente_in_persia_desc:0 "Settle outstanding disputes over Persia, Afghanistan, and Tibet with Whitehall, turning former Great Game rivals into brothers-in-arms against German expansionism."
 SOV_french_strategic_loans:0 "French Strategic Railway Loans"
 SOV_french_strategic_loans_desc:0 "Paris banks float billions of gold francs in Russian state railway bonds, tied specifically to the rapid construction of strategic tracks leading to the German frontier."
 SOV_persian_corridor_security:0 "Securing the Persian Trans-Caspian Route"
 SOV_persian_corridor_security_desc:0 "Deploy the Persian Cossack Brigade to secure Tabriz, Tehran, and the Caspian littoral, securing an unblockable southern supply artery to the British Empire."
 SOV_gold_transfers_for_credit:0 "Imperial Gold Reserves to the Bank of England"
 SOV_gold_transfers_for_credit_desc:0 "Ship crates of gold bullion aboard Royal Navy cruisers from Arkhangelsk to London to guarantee unlimited credit lines for munitions purchases in North America."
 SOV_plan_19_galicia_variant:0 "Plan 19: Variant 'A' (Austrian Focus)"
 SOV_plan_19_galicia_variant_desc:0 "Concentrate four whole armies (Southwestern Front) under General Ivanov to overwhelm the Austro-Hungarian armies in Galicia while holding defensively against Germany."
 SOV_plan_19_east_prussia_variant:0 "Plan 19: Variant 'G' (East Prussian Offensive)"
 SOV_plan_19_east_prussia_variant_desc:0 "Hurl the 1st Army (Rennenkampf) and 2nd Army (Samsonov) into East Prussia on Day 15 to draw German corps away from the Western Front and save Paris."
 SOV_sarikamish_counter_encirclement:0 "The Miracle of Sarikamish (Winter 1914)"
 SOV_sarikamish_counter_encirclement_desc:0 "General Nikolai Yudenich outmaneuvers Enver Pasha's 3rd Ottoman Army in blizzard-swept Caucasian passes, annihilating 70,000 Turkish troops in the snow."
 SOV_storming_of_erzurum:0 "Storming the Mountain Fortress of Erzurum"
 SOV_storming_of_erzurum_desc:0 "In February 1916, Russian Siberian riflemen scale frozen cliffs in midwinter blizzards to assault the formidable ring of eleven forts protecting Erzurum, capturing Ottoman eastern Anatolia."
 SOV_expeditionary_corps_to_france:0 "Russian Expeditionary Force to France"
 SOV_expeditionary_corps_to_france_desc:0 "Dispatch two special infantry brigades via Dalian and Marseille to fight in the trenches of Champagne, proving Russian loyalty to the French alliance in blood."
 SOV_claim_tsargrad_and_the_straits:0 "The Constantinople Agreement (March 1915)"
 SOV_claim_tsargrad_and_the_straits_desc:0 "Britain and France officially concede Russia's historic claim: upon victory, Constantinople, the Bosphorus, the Sea of Marmara, and the Dardanelles shall be annexed directly to Russia."
 SOV_liberate_galician_ruthenians:0 "Annexation of Red Ruthenia (Galicia)"
 SOV_liberate_galician_ruthenians_desc:0 "Following the fall of Lemberg (Lviv) and Przemysl, the historic Ruthenian lands of the ancient Kievan Rus are reunited forever with the Russian Motherland."
 SOV_restore_congress_poland_under_crown:0 "The Grand Duke's Manifesto to the Poles"
 SOV_restore_congress_poland_under_crown_desc:0 "Grand Duke Nicholas promises to unite all Polish lands under German, Austrian, and Russian rule into a single autonomous kingdom under the Romanov scepter."
 SOV_cross_over_the_carpathians:0 "Descent into the Hungarian Plain"
 SOV_cross_over_the_carpathians_desc:0 "Russian mountain corps force the snow-choked Dukla and Lupkow passes, debouching onto the lush plains of Hungary and knocking the Habsburg Monarchy out of the war."
 SOV_storm_the_bosphorus_and_dardanelles:0 "The Storming of Tsargrad"
 SOV_storm_the_bosphorus_and_dardanelles_desc:0 "Russian marines and battleships force the Bosphorus. Imperial flags fly over the Sublime Porte, fulfilling five centuries of Russian religious and geopolitical longing."
 SOV_hagia_sophia_cross_restored:0 "The Golden Cross on Hagia Sophia"
 SOV_hagia_sophia_cross_restored_desc:0 "The bells of Hagia Sophia chime again in Orthodox communion. The Tsar of all the Russias is crowned Emperor of Byzantium in the eternal city of Constantine."
 SOV_willy_nicky_secret_correspondence:0 "The Willy-Nicky Correspondence"
 SOV_willy_nicky_secret_correspondence_desc:0 "Kaiser Wilhelm II and Tsar Nicholas II exchange personal telegrams in English, appealing to their dynastic bonds to avert mutual imperial suicide."
 SOV_bjorko_treaty_reborn:0 "The Treaty of Björkö Reborn"
 SOV_bjorko_treaty_reborn_desc:0 "Reviving the secret alliance signed aboard the yacht Hohenzollern in 1905, Germany and Russia sign a mutual defense pact, stunning London and Paris."
 SOV_peace_of_brest_litovsk:0 "The Dictate of Brest-Litovsk (1918)"
 SOV_peace_of_brest_litovsk_desc:0 "Facing absolute military exhaustion and domestic revolution, Russia signs the draconian peace treaty with the Central Powers, surrendering the western borderlands."
 SOV_continental_league_against_britain:0 "The Continental Bloc Against Britain"
 SOV_continental_league_against_britain_desc:0 "Wilhelm and Nicholas unite the two greatest land powers in the world to break the maritime monopoly of the British Empire across Asia and the Middle East."
 SOV_partition_persia_and_india:0 "The Grand March on the Indus"
 SOV_partition_persia_and_india_desc:0 "With German equipment and Russian Cossacks, a combined overland invasion pushes through Afghanistan toward the Khyber Pass to shake British rule in India."
 SOV_treaty_of_berlin_rapprochement:0 "The Berlin-Petrograd Customs Union"
 SOV_treaty_of_berlin_rapprochement_desc:0 "Combine German machine tools and chemical patents with limitless Russian grain, manganese, and petroleum, creating a self-sufficient Eurasian economic fortress."
 SOV_eurasian_imperial_hegemony:0 "Eurasian Imperial Hegemony"
 SOV_eurasian_imperial_hegemony_desc:0 "From the Rhine to Vladivostok, the two Kaiserdoms reign supreme, dictating peace to the Atlantic world and securing the monarchical order forever."
 SOV_brest_demobilization_and_losses:0 "The Shameful Peace"
 SOV_brest_demobilization_and_losses_desc:0 "Surrendering 34% of the population, 54% of industrial enterprises, and 89% of coal fields to German occupation, Russia buys breathing space at a terrible cost."
 SOV_reconstruction_from_the_ashes:0 "Rebuilding in the Russian Heartland"
 SOV_reconstruction_from_the_ashes_desc:0 "Focus all national energy on restoring Moscow, the Volga basin, and the Urals. Roads are rebuilt, blast furnaces relit, and the surviving people fed."
 SOV_prepare_for_inevitable_reckoning:0 "Prepare for the Inevitable Reckoning"
 SOV_prepare_for_inevitable_reckoning_desc:0 "Brest-Litovsk is but a temporary scrap of paper. Whether under Red banner or Imperial eagle, Russia will rise again to reclaim all that was taken."
 SOV_moscow_state_conference:0 "The Moscow State Conference (August 1917)"
 SOV_moscow_state_conference_desc:0 "Kerensky convenes over 2,000 delegates at the Bolshoi Theatre to forge national unity, but the conference only exposes the irreconcilable rift between Kornilov's generals and the socialists."
 SOV_czech_legion_transsiberian_revolt:0 "Uprising of the Czechoslovak Legion"
 SOV_czech_legion_transsiberian_revolt_desc:0 "50,000 veteran Austro-Hungarian POWs formed into the Czechoslovak Legion revolt in Chelyabinsk, seizing all stations along the Trans-Siberian Railway from the Urals to Vladivostok."
 SOV_tambov_peasant_rebellion:0 "The Tambov Green Peasant Rising"
 SOV_tambov_peasant_rebellion_desc:0 "Alexander Antonov leads 50,000 peasants armed with pitchforks and hunting rifles in revolt against grain requisition squads, raising the green flag of peasant emancipation."
 SOV_armed_forces_of_south_russia:0 "Armed Forces of South Russia (VSYUR)"
 SOV_armed_forces_of_south_russia_desc:0 "General Anton Denikin unifies the Volunteer Army, Don Cossacks, and Kuban Host into the Armed Forces of South Russia, launching the Moscow Directive drive."
 SOV_omsk_siberian_government:0 "The Omsk Directorate and Supreme Ruler"
 SOV_omsk_siberian_government_desc:0 "Admiral Alexander Kolchak establishes his provisional seat of government in Omsk, proclaimed 'Supreme Ruler of the Russian State' with control of the imperial gold reserve."
 SOV_ruble_gold_standard_preservation:0 "Preserve the Witte Gold Ruble Standard"
 SOV_ruble_gold_standard_preservation_desc:0 "Sergei Witte's 1897 monetary reform placed the Russian paper ruble on a firm gold convertible basis. Maintaining gold backing guarantees international investment."
 SOV_baku_batumi_pipeline_expansion:0 "Double the Baku-Batumi Oil Conduit"
 SOV_baku_batumi_pipeline_expansion_desc:0 "Construct a second 8-inch high-pressure pipeline through the Surami Pass to Batumi, allowing tens of thousands of barrels of fuel oil to reach Black Sea tankers daily."
 SOV_ural_platinum_reserves:0 "Ural Platinum and Manganese Monopoly"
 SOV_ural_platinum_reserves_desc:0 "Russia produces 90% of the world's refined platinum in Nizhny Tagil and vast manganese deposits in Chiatura, vital for armor plate hardening and explosives."
 SOV_sevkabel_factory_complex:0 "Sevkabel Copper Cable Manufactory"
 SOV_sevkabel_factory_complex_desc:0 "The Siemens & Halske Sevkabel plant in Saint Petersburg turns out millions of meters of insulated field telegraph wire and naval electrical cables."
 SOV_siberian_fur_trade_treasury:0 "State Monopoly on Siberian Sables"
 SOV_siberian_fur_trade_treasury_desc:0 "Siberian sable, ermine, and fox pelts auctioned at the Nizhny Novgorod fair bring tens of millions of rubles in hard currency into the imperial treasury."
 SOV_moonsund_mine_barrage:0 "The Irben Strait Minefield Trap"
 SOV_moonsund_mine_barrage_desc:0 "Layer the shallow waters of Irben Strait with dense acoustic and contact mines, repeatedly damaging German dreadnoughts attempting to enter the Gulf of Riga."
 SOV_rioni_river_torpedo_station:0 "Rioni River Motor Torpedo Boat Station"
 SOV_rioni_river_torpedo_station_desc:0 "Station high-speed Thornycroft motor torpedo boats at Poti and Batumi to strike Ottoman coastal convoys slipping out of Sinop and Trabzon."
 SOV_synchronized_aerial_machine_guns:0 "Synchronized Propeller Gun Gears"
 SOV_synchronized_aerial_machine_guns_desc:0 "Russian engineers adapt synchronized mechanical cams, allowing machine guns to fire directly through rotating propeller blades without shooting off the wooden blades."
 SOV_osowiec_and_novogeorgievsk_forts:0 "Osowiec and Novogeorgievsk Fortress Chains"
 SOV_osowiec_and_novogeorgievsk_forts_desc:0 "Massive concrete bastions and armored artillery cupolas along the Narew and Bobr river marshes hold off entire German field armies for months."
 SOV_attack_of_the_dead_men_1915:0 "The Attack of the Dead Men (August 1915)"
 SOV_attack_of_the_dead_men_1915_desc:0 "Subjected to deadly chlorine and bromine gas at Osowiec, surviving Russian soldiers of the 13th Company charge with bloody bandages, coughing up pieces of their own lungs, routing 7,000 terrified Germans."
 SOV_russian_chemical_flamethrowers:0 "Tovarnitski Portable Flamethrowers"
 SOV_russian_chemical_flamethrowers_desc:0 "Equip shock assault companies with portable compressed-gas flamethrowers designed by military engineer Tovarnitski, clearing machine gun bunkers with jets of liquid fire."
 SOV_optical_rangefinders_and_periscopes:0 "Trench Periscopes and Optical Rangefinders"
 SOV_optical_rangefinders_and_periscopes_desc:0 "Manufacture precision trench periscopes and coincidence rangefinders at the Obukhov optical shops, allowing forward observers to direct indirect artillery fire without exposing their heads."
 SOV_motono_sazonov_treaty_1916:0 "The Russo-Japanese Treaty of 1916"
 SOV_motono_sazonov_treaty_1916_desc:0 "Former enemies unite in mutual defense: Foreign Minister Sazonov and Viscount Motono sign a defensive alliance, securing our Pacific flank and shipping Japanese heavy artillery to Russia."
 SOV_murmansk_convoys_arrival:0 "Arrival of the Arctic Allied Convoys"
 SOV_murmansk_convoys_arrival_desc:0 "Allied merchant fleets laden with British Armstrong shells, French airplanes, and American raw rubber steam safely into the deep ice-free berths of Romanov-on-Murman."
 SOV_red_cross_missions_to_serbia:0 "Red Cross Sanitary Trains to Serbia"
 SOV_red_cross_missions_to_serbia_desc:0 "Dispatch hundreds of Russian doctors, nurses, and hospital trains to Kragujevac to combat typhus epidemics and treat wounded Serbian soldiers in brotherly love."