l_english:
 SER_agrarian_kingdom_finances:0 "Agrarian Kingdom Finances"
 SER_agrarian_kingdom_finances_desc:0 "The Kingdom of Serbia rests upon an overwhelmingly agrarian base of peasant smallholders. Auditing rural credit, stabilizing grain stores, and managing state revenue are essential first steps toward securing the kingdom's fiscal foundation."
 SER_alexander_i:0 "Crown Prince Alexander"
 SER_allied_balkan_coordination:0 "Allied Balkan Coordination"
 SER_allied_balkan_coordination_desc:0 "Coordinating operational plans closely with French General Louis Franchet d'Espèrey prepares the unified Allied Army of the Orient for the great offensive to smash the Balkan front."
 SER_anticorruption_procurement:0 "Anti-Corruption Procurement"
 SER_anticorruption_procurement_desc:0 "Rigorous financial auditing of all military procurement contracts guarantees that every dinar allocated for rifles, shells, and uniforms reaches the frontline soldier without graft."
 SER_appeal_to_tsar_nicholas:0 "Appeal to Tsar Nicholas II"
 SER_appeal_to_tsar_nicholas_desc:0 "Prime Minister Pašić dispatches an urgent telegram to Saint Petersburg, begging the Russian Tsar to stay the hand of Austrian aggression and stand as guardian of Serbian liberty."
 SER_armistice_on_the_danube:0 "Armistice on the Danube"
 SER_armistice_on_the_danube_desc:0 "With Bulgaria knocked out of the war and the Austro-Hungarian Empire collapsing into revolution, imperial envoys sign unconditional armistice terms on the banks of the Danube."
 SER_artillery_park_reorganization:0 "Artillery Park Reorganization"
 SER_artillery_park_reorganization_desc:0 "Vojvoda Petar Bojović directs the modernization of Serbian field artillery regiments, centralizing maintenance, ammunition standardization, and battery coordination with infantry commanders."
 SER_austrian_border_accommodation:0 "Austrian Border Accommodation"
 SER_austrian_border_accommodation_desc:0 "Exploring bilateral de-escalation with Vienna addresses border disputes, river policing, and customs tariffs through diplomatic compromise rather than brinkmanship."
 SER_balkan_diplomatic_initiatives:0 "Balkan Diplomatic Initiatives"
 SER_balkan_diplomatic_initiatives_desc:0 "Small nations must rely on clever diplomacy. Serbia initiates proactive foreign policy across the Balkan Peninsula to secure stable borders, prevent hostile encirclement, and build regional partnerships."
 SER_balkan_equilibrium_accord:0 "Balkan Equilibrium Accord"
 SER_balkan_equilibrium_accord_desc:0 "A grand multilateral framework among Balkan states establishes an enduring regional equilibrium, resisting the meddling and territorial ambitions of predatory Great Powers."
 SER_banque_franco_serbe_credits:0 "Banque Franco-Serbe Credits"
 SER_banque_franco_serbe_credits_desc:0 "French financial syndicates through the Banque Franco-Serbe provide capital for railway expansion, currency stabilization, and industrial contracts on favorable repayment terms."
 SER_battle_of_cer_heroism:0 "Battle of Cer Heroism"
 SER_battle_of_cer_heroism_desc:0 "General Stepa Stepanović leads the Second Army in a blistering August counter-attack on Mount Cer, winning the first Allied victory of the entire Great War and routing Austrian invaders."
 SER_belgrade_nis_rail_artery:0 "Belgrade-Niš Rail Artery"
 SER_belgrade_nis_rail_artery_desc:0 "The single-track railway linking Belgrade to Niš represents the vital circulatory system of the Serbian kingdom. Upgrading rails, expanding sidings, and improving signaling will accelerate internal commerce and military mobilization."
 SER_black_hand_and_national_defense:0 "The Black Hand & National Defense"
 SER_black_hand_and_national_defense_desc:0 "Internal politics in Belgrade are haunted by the shadow of the conspiratorial officer corps. Managing secret societies, gathering cross-border intelligence, and securing frontiers are essential for state stability."
 SER_bor_copper_and_rudnik_mines:0 "Bor Copper and Rudnik Mines"
 SER_bor_copper_and_rudnik_mines_desc:0 "The rich copper deposits at Bor and the lead and silver veins of Mount Rudnik offer essential strategic resources. Expanding domestic processing reduces reliance on costly imports."
 SER_breakthrough_at_dobro_pole:0 "Breakthrough at Dobro Pole"
 SER_breakthrough_at_dobro_pole_desc:0 "In September 1918, Serbian infantry surges up the razor cliffs of Dobro Pole and Veternik, shattering Bulgarian fortifications and driving an irreversible wedge into the enemy front."
 SER_bulgarian_non_aggression_pact:0 "Bulgarian Non-Aggression Pact"
 SER_bulgarian_non_aggression_pact_desc:0 "Signing a formal non-aggression and consultation treaty with Bulgaria secures Serbia's eastern flank, denying Austrian diplomacy an easy avenue of encirclement."
 SER_cer_counterstroke_glory:0 "Glory of the Cer Counter-Attack"
 SER_cer_counterstroke_glory_desc:0 "The electric spirit of the victory at Mount Cer courses through every Serbian battalion, inspiring heroic courage, disciplined entrenchment, and fierce defensive defiance."
 SER_cetinje_military_convention:0 "Cetinje Military Convention"
 SER_cetinje_military_convention_desc:0 "Concluding a joint military coordination accord with Cetinje unifies operational defense between the two Serb kingdoms while fully respecting Montenegro's sovereign dignity."
 SER_civil_military_rivalry:0 "Civil-Military Rivalry"
 SER_civil_military_rivalry_desc:0 "Bitter friction between Nikola Pašić's civilian cabinet and the clandestine military conspirators of the Black Hand hampers government cohesion and inflates political instability."
 SER_civilian_supremacy_charter:0 "Civilian Supremacy Charter"
 SER_civilian_supremacy_charter_desc:0 "Prime Minister Pašić and the Skupština assert absolute constitutional authority over the armed forces, subordinating all military officers to parliamentary laws and civilian ministries."
 SER_civilian_supremacy_established:0 "Civilian Supremacy Established"
 SER_civilian_supremacy_established_desc:0 "Constitutional democracy reigns supreme in Belgrade. The parliament exercises undisputed authority over military expenditures and national policy, solidifying democratic stability."
 SER_clandestine_national_action:0 "Clandestine National Action"
 SER_clandestine_national_action_desc:0 "Authorizing covert operational networks across frontiers enables armed Serbian komitadji and intelligence couriers to safeguard ethnic compatriots under foreign imperial rule."
 SER_constitutional_liberties_bill:0 "Constitutional Liberties Bill"
 SER_constitutional_liberties_bill_desc:0 "Protecting freedom of the press, independent judiciary verdicts, and the right of public assembly cements Serbia's standing as the beacon of liberty among South Slavic lands."
 SER_corfu_declaration_accord:0 "Corfu Declaration Accord"
 SER_corfu_declaration_accord_desc:0 "On July 20, 1917, Nikola Pašić and Ante Trumbić of the Yugoslav Committee sign the historic Corfu Declaration, proclaiming the future unification of Serbs, Croats, and Slovenes under the Karađorđević crown."
 SER_creusot_schneider_contracts:0 "Schneider-Creusot Artillery Contracts"
 SER_creusot_schneider_contracts_desc:0 "Procuring modern French 75mm rapid-fire field artillery from Schneider-Creusot provides Serbian batteries with world-class firepower, leveling the field against larger imperial armies."
 SER_crown_prince_regency_prep:0 "Crown Prince Alexander's Ascendancy"
 SER_crown_prince_regency_prep_desc:0 "As King Peter's physical health declines with age, Crown Prince Alexander assumes greater executive responsibilities, forging deep personal bonds with both army commanders and political leaders."
 SER_curb_secret_societies:0 "Curb Secret Societies"
 SER_curb_secret_societies_desc:0 "Enacting strict penal bans against clandestine political clubs within the officer corps breaks the subversive power of the Black Hand, ensuring the military obeys the constitutional state."
 SER_danubian_flotilla_watch:0 "Danubian Flotilla Watch"
 SER_danubian_flotilla_watch_desc:0 "Belgrade sits directly exposed across the Sava and Danube to Austro-Hungarian guns. Establishing mobile shore batteries and riverine observation posts shields the capital from naval surprise."
 SER_defend_belgrade_perimeter:0 "Defend Belgrade Perimeter"
 SER_defend_belgrade_perimeter_desc:0 "Government ministries evacuate south to Niš while heroic rearguard detachments and artillery hold the northern riverbanks, denying Austrian gunboats passage across the Sava and Danube."
 SER_diplomatic_appeal_corfu:0 "Diplomatic Appeal of Corfu"
 SER_diplomatic_appeal_corfu_desc:0 "Launch an international press and diplomatic campaign in Paris and London on behalf of occupied Serbia."
 SER_diversified_national_industry:0 "Diversified National Industry"
 SER_diversified_national_industry_desc:0 "Through persistent public investment, agricultural modernization, and expanding arms factories, Serbia overcomes its archaic agrarian isolation, constructing a resilient and diversified national economy."
 SER_dobro_pole_breakthrough:0 "Dobro Pole Breakthrough Charge"
 SER_dobro_pole_breakthrough_desc:0 "Driven by years of yearning for their occupied homes, Serbian storm columns advance with unmatched speed and fury, shattering all fortified mountain positions in their path."
 SER_domestic_ammunition_lines:0 "Domestic Ammunition Lines"
 SER_domestic_ammunition_lines_desc:0 "A nation surrounded by potential adversaries cannot afford to fire ammunition it cannot manufacture. Installing modern presses for 7x57mm Mauser cartridges guarantees independence in times of crisis."
 SER_drina_defensive_survey:0 "Drina Defensive Survey"
 SER_drina_defensive_survey_desc:0 "The twisting bends and sheer bluffs of the Drina River form a natural bastion against invasion from Bosnia. Carefully surveying crossing points and entrenching key defiles prepares the ground for future defense."
 SER_drina_railway_ammunition_priority:0 "Railway Ammunition Priority for the Front"
 SER_drina_railway_ammunition_priority_desc:0 "Requisition all civilian rolling stock to rush artillery shells directly to threatened frontline batteries."
 SER_drina_valley_ambush_lines:0 "Drina Valley Ambush Lines"
 SER_drina_valley_ambush_lines_desc:0 "Knowing General Potiorek's armies must cross the swollen Drina, Serbian mountain corps prepare deadly interlocking ambush zones along forested hills and narrow defiles."
 SER_entente_diplomatic_shield:0 "Entente Diplomatic Shield"
 SER_entente_diplomatic_shield_desc:0 "With formal assurances from Petrograd and Paris, Serbia stands firmly sheltered beneath the diplomatic guarantees of the Triple Entente, deterring unilateral aggression."
 SER_entrenchment_and_counterstroke:0 "Entrenchment and Counterstroke"
 SER_entrenchment_and_counterstroke_desc:0 "Vojvoda Živojin Mišić champions the philosophy of active defense: absorbing enemy blows in fortified trenches, conserving operational reserves, and striking with ferocious counter-offensives when the attacker tires."
 SER_evacuation_of_military_cadres:0 "Evacuation of Military Cadres"
 SER_evacuation_of_military_cadres_desc:0 "Allied naval squadrons embark the starving, frostbitten remnants of the Serbian army on the Adriatic coast, transporting soldiers to the safety of the Greek island of Corfu."
 SER_expand_livestock_and_grain_trade:0 "Expand Livestock and Grain Trade"
 SER_expand_livestock_and_grain_trade_desc:0 "Following the painful tariff barriers of the recent Pig War, Serbia must diversify its commercial channels, expanding livestock and cereal exports through Salonika, Romania, and Western markets."
 SER_face_austrian_ultimatum:0 "Face the Austrian Ultimatum"
 SER_face_austrian_ultimatum_desc:0 "On July 23, 1914, Baron Giesl delivers Vienna's humiliating 48-hour ultimatum. Serbia formulates a masterful, conciliatory response, accepting almost all points while defending sovereignty."
 SER_field_medical_directorate:0 "Field Medical Directorate"
 SER_field_medical_directorate_desc:0 "In Balkan warfare, disease and infection often claim more lives than enemy bullets. Establishing structured medical clearing stations, sterile surgical tents, and epidemic controls preserves Serbian manpower."
 SER_foreign_medical_missions:0 "Foreign Medical Missions"
 SER_foreign_medical_missions_desc:0 "Welcoming voluntary hospital units, doctors, and nurses from Britain, France, Russia, and Switzerland brings cutting-edge medicine and international sympathy to the Serbian frontlines."
 SER_french_chauchats_and_75mm:0 "French Chauchats and 75mm Guns"
 SER_french_chauchats_and_75mm_desc:0 "Equipping Serbian infantry with French Adrian helmets, Chauchat light machine guns, and batteries of 75mm guns turns the reconstituted army into a lethal offensive force."
 SER_french_logistical_coordination:0 "French Intendance Coordination"
 SER_french_logistical_coordination_desc:0 "Coordinate supply manifests directly with the French Armée d'Orient to receive rifles, uniforms, and shoes."
 SER_french_serbian_trade_accord:0 "Franco-Serbian Trade Accord"
 SER_french_serbian_trade_accord_desc:0 "Benefiting from French financial backing and privileged commercial links, Serbia secures modern arms, machinery, and investments on highly favorable terms."
 SER_general_mobilization_order:0 "General Mobilization Order"
 SER_general_mobilization_order_desc:0 "With diplomatic rupture imminent, the royal decree is published: all three Pozivs are mobilized. Peasant-soldiers abandon their scythes and rush to the colors across the kingdom."
 SER_government_in_exile_corfu:0 "Government-in-Exile at Corfu"
 SER_government_in_exile_corfu_desc:0 "The Serbian parliament convenes in the municipal theatre of Corfu. Though their homeland is occupied, the Serbian state endures unbroken, sovereign, and recognized across the world."
 SER_greater_serbia_ideal:0 "Greater Serbian Strategy"
 SER_greater_serbia_ideal_desc:0 "Prioritizing the direct unification and liberation of all lands inhabited by ethnic Serbs strengthens national martial zeal, channeling all resources toward sovereign territorial expansion."
 SER_greater_serbian_strategy:0 "Greater Serbian Strategy"
 SER_greater_serbian_strategy_desc:0 "Focusing strictly on national consolidation, Belgrade directs all efforts toward liberating and uniting territories with historic Serbian populations under the royal crown."
 SER_greek_commercial_transit:0 "Greek Commercial Transit"
 SER_greek_commercial_transit_desc:0 "Negotiating unhindered duty-free transit through the vital Aegean port of Salonika provides landlocked Serbia with an indispensable commercial gateway to the wider world."
 SER_independent_radicals_dialogue:0 "Independent Radicals Dialogue"
 SER_independent_radicals_dialogue_desc:0 "Reaching across parliamentary aisles to the Independent Radical opposition led by Ljubomir Stojanović builds broad democratic consensus, ensuring political stability during perilous times."
 SER_infiltrate_bosnian_intelligence_network:0 "Infiltrate Intelligence Across the Drina"
 SER_infiltrate_bosnian_intelligence_network_desc:0 "Expand secret observation posts and informants across the border to detect imperial military movements early."
 SER_internal_inquiry_on_conspirators:0 "Internal Inquiry on Conspirators"
 SER_internal_inquiry_on_conspirators_desc:0 "The Pašić government opens an immediate official investigation to uncover whether rogue officers or border officials assisted the Sarajevo conspirators without state consent."
 SER_investigate_officer_conspiracies:0 "Investigate Officer Conspiracies"
 SER_investigate_officer_conspiracies_desc:0 "Disturbing intelligence reports indicate that secret officer cliques formed after the 1903 May Coup are operating outside civilian oversight, meddling in diplomacy and national policy."
 SER_kolubara_maneuver_mastery:0 "Kolubara Maneuver Mastery"
 SER_kolubara_maneuver_mastery_desc:0 "Channeling General Mišić's brilliant tactical timing, Serbian divisions strike with ferocious suddenness against overextended enemy salients, rolling back hostile armies."
 SER_kragujevac_arsenal_expansion:0 "Kragujevac Arsenal Expansion"
 SER_kragujevac_arsenal_expansion_desc:0 "New smelting workshops, cartridge tooling machinery, and modernized foundry halls at Kragujevac elevate domestic arms and ammunition manufacturing capacity."
 SER_kragujevac_military_workshops:0 "Kragujevac Military Workshops"
 SER_kragujevac_military_workshops_desc:0 "The Vojno-Tehnički Zavod at Kragujevac is the sole industrial beating heart of Serbian military production. Expanding its foundries and workshops is indispensable for national sovereignty."
 SER_liberation_of_the_homeland:0 "Liberation of the Homeland"
 SER_liberation_of_the_homeland_desc:0 "Marching hundreds of kilometers in weeks, Serbian divisions outpace Allied supply trains, liberating Niš, Valjevo, and entering Belgrade in triumph amid delirious popular tears of joy."
 SER_macedonian_autonomy_proposal:0 "Macedonian Autonomy Proposal"
 SER_macedonian_autonomy_proposal_desc:0 "Proposing cultural and administrative autonomy for Ottoman Macedonia satisfies local aspirations while preventing disastrous territorial clashes between Belgrade and Sofia."
 SER_military_intelligence_network:0 "Military Intelligence Network"
 SER_military_intelligence_network_desc:0 "Expanding the General Staff's intelligence bureau provides critical insights into Austro-Hungarian troop concentrations, imperial garrisons, and diplomatic maneuvers in the Balkans."
 SER_military_officer_ascendancy:0 "Military Officer Ascendancy"
 SER_military_officer_ascendancy_desc:0 "The patriotic officer corps exercises paramount influence over national policy, prioritizing uncompromising military readiness and national expansion above all else."
 SER_military_telegraph_corps:0 "Military Telegraph Corps"
 SER_military_telegraph_corps_desc:0 "Rapid field communication across rugged mountain ridges is decisive for operational success. Expanding portable telegraph wires and heliographs links division headquarters directly to the General Staff."
 SER_misic_kolubara_counteroffensive:0 "Mišić's Kolubara Counter-Offensive"
 SER_misic_kolubara_counteroffensive_desc:0 "When all seemed lost in the winter mud, General Živojin Mišić ordered a daring operational retreat, rested his men, and struck back along the Kolubara River, recapturing Belgrade."
 SER_mobilization_timetables:0 "Mobilization Timetables"
 SER_mobilization_timetables_desc:0 "Rigorous rail schedules and predetermined assembly points allow Serbian divisions to concentrate on threatened borders days ahead of enemy projections, turning geography into an impenetrable shield."
 SER_modernize_trepca_prospects:0 "Modernize Geological Prospects"
 SER_modernize_trepca_prospects_desc:0 "Comprehensive geological surveying across Serbian highlands will locate untapped metallic reserves, bringing modern mining engineers and technology to bolster national industry."
 SER_monarchic_arbiter:0 "Monarchic Arbitration"
 SER_monarchic_arbiter_desc:0 "When bitter factional disputes flare between parliamentarians and fiery army officers, the Crown intervenes as a neutral, respected mediator, restoring institutional balance."
 SER_monitor_ultranationalist_cells:0 "Monitor Ultranationalist Cells"
 SER_monitor_ultranationalist_cells_desc:0 "Deploy gendarmerie agents to watch radical national clubs in Belgrade, reducing internal volatility."
 SER_montenegrin_dynastic_ties:0 "Montenegrin Dynastic Ties"
 SER_montenegrin_dynastic_ties_desc:0 "The sacred bloodlines of the Karađorđević and Petrović-Njegoš houses unite Serbia and Montenegro. King Peter himself was married to Princess Zorka, daughter of King Nikola I."
 SER_montenegrin_dynastic_union:0 "Montenegrin Dynastic Union"
 SER_montenegrin_dynastic_union_desc:0 "Bound by shared blood, mountain resilience, and centuries of defiance against Ottoman and Habsburg hegemony, Montenegro stands united with Serbia under the royal union."
 SER_montenegrin_mountain_levies:0 "Call Montenegrin Mountain Volunteers"
 SER_montenegrin_mountain_levies_desc:0 "Rally the fierce mountain warriors of Lovćen and Durmitor to reinforce the Serbian army in battle."
 SER_montenegrin_mountain_levies_tt:0 "Thousands of hardened mountain fighters take up their rifles in defense of the realm."
 SER_montenegrin_rearguard_stand:0 "Montenegrin Rearguard Stand"
 SER_montenegrin_rearguard_stand_desc:0 "At the Battle of Mojkovac on Orthodox Christmas 1916, Montenegrin mountain warriors under Serdar Janko Vukotić heroically hold Austro-Hungarian columns, ensuring the Serbian retreat succeeds."
 SER_morava_valley_logistics:0 "Morava Valley Logistics"
 SER_morava_valley_logistics_desc:0 "The great Morava river corridor forms the natural geographic spine of Serbian defense and economy. Establishing fortified depots and supply nodes along its valley ensures smooth transit during peace and war."
 SER_mountain_warfare_detachments:0 "Mountain Warfare Detachments"
 SER_mountain_warfare_detachments_desc:0 "Fighting among the craggy heights of Cer, Kolubara, and the Balkan ranges requires specialized light infantry trained in high-altitude skirmishing, pack mule supply, and night ambushes."
 SER_narodna_odbrana_patronage:0 "Narodna Odbrana Patronage"
 SER_narodna_odbrana_patronage_desc:0 "The patriotic civic organization Narodna Odbrana mobilizes volunteers, funds cultural defense, and organizes border watch networks across Serbian frontiers."
 SER_national_bank_monetary_stability:0 "National Bank Monetary Stability"
 SER_national_bank_monetary_stability_desc:0 "Strengthening the Serbian Dinar through gold reserves and disciplined monetary policy protects state solvency, attracting foreign loans on favorable terms without sacrificing political liberty."
 SER_national_unity_covenant:0 "National Unity Covenant"
 SER_national_unity_covenant_desc:0 "All parliamentary factions, ministers, and military commanders set aside partisan quarrels, pledging an unbreakable covenant of national solidarity in defense of the Serbian fatherland."
 SER_nikola_pasic:0 "Nikola Pašić"
 SER_officer_corps_ascendancy:0 "Officer Corps Ascendancy"
 SER_officer_corps_ascendancy_desc:0 "Recognizing that existential threats surround the nation, the cabinet accommodates the patriotic demands of Apis and his officers, granting the military leadership decisive influence over national defense."
 SER_officer_corps_meritocracy:0 "Officer Corps Meritocracy"
 SER_officer_corps_meritocracy_desc:0 "The Royal Serbian Army can tolerate no aristocratic complacency. Promotions must flow strictly from tactical competence, battlefield leadership, and devotion to the men in the ranks."
 SER_patriotic_press_censorship:0 "Patriotic Press Moderation"
 SER_patriotic_press_censorship_desc:0 "Restraining inflammatory yellow journalism prevents irresponsible newspaper editors from triggering unnecessary foreign diplomatic crises during delicate international moments."
 SER_peacetime_infantry_cadre:0 "Peacetime Infantry Cadre"
 SER_peacetime_infantry_cadre_desc:0 "Investing heavily in non-commissioned officers, rifle marksmanship, and unit cohesion ensures that peacetime Serbian cadres expand seamlessly into battle-hardened regiments upon mobilization."
 SER_podgorica_assembly_unification:0 "Podgorica Great National Assembly"
 SER_podgorica_assembly_unification_desc:0 "In November 1918, the Great National Assembly in Podgorica votes enthusiastically to depose King Nikola and proclaim the permanent, brotherly union of Montenegro with the Kingdom of Serbia."
 SER_proclamation_of_yugoslavia:0 "Proclamation of Yugoslavia"
 SER_proclamation_of_yugoslavia_desc:0 "On December 1, 1918, Prince Regent Alexander proclaims the Kingdom of Serbs, Croats, and Slovenes. From the ashes of imperial war rises the united homeland of the South Slavic nation."
 SER_professional_civil_service:0 "Professional Civil Service"
 SER_professional_civil_service_desc:0 "Instituting competitive examinations and merit-based promotions transforms state administration into an efficient, professional civil service capable of governing in crisis."
 SER_purge_army_clandestine_officers:0 "Purge Clandestine Military Officers"
 SER_purge_army_clandestine_officers_desc:0 "Remove conspiratorial Black Hand loyalists from key brigade commands, cementing civilian supremacy."
 SER_purge_army_clandestine_officers_tt:0 "Civilian control over the armed forces is permanently secured."
 SER_radical_party_cabinet:0 "People's Radical Party Cabinet"
 SER_radical_party_cabinet_desc:0 "Led by the seasoned statesman Nikola Pašić, the People's Radical Party dominates Serbian political life, commanding the trust of the peasant masses and championing national statecraft."
 SER_radomir_putnik_doctrine:0 "Radomir Putnik Doctrine"
 SER_radomir_putnik_doctrine_desc:0 "Chief of the General Staff Vojvoda Radomir Putnik has dedicated decades to transforming Serbia's peasant levies into a disciplined, adaptable European fighting force capable of decisive defensive counter-maneuvers."
 SER_rapid_fire_field_guns:0 "Rapid-Fire Field Guns"
 SER_rapid_fire_field_guns_desc:0 "Mastering concentrated shrapnel and high-explosive barrages from quick-firing guns provides Serbian infantry with the overwhelming tactical edge needed to break enemy advances across river valleys."
 SER_rebuild_army_in_salonika:0 "Rebuild Army in Salonika"
 SER_rebuild_army_in_salonika_desc:0 "Nourished and reclothed by French allies, 150,000 Serbian veterans are regrouped into combat corps and deployed to the Macedonian Front outside Salonika, eager to fight for their homeland."
 SER_rebuilt_salonika_corps:0 "Rebuilt Army of the Orient Corps"
 SER_rebuilt_salonika_corps_desc:0 "Equipped with modern Allied ordnance, disciplined by grueling trials, and unified under tested veteran generals, the resurrected Serbian army is ready for the liberation of the fatherland."
 SER_recruit_south_slav_pow_volunteers:0 "Recruit South Slav POW Volunteers"
 SER_recruit_south_slav_pow_volunteers_desc:0 "Enlist thousands of Czech, Croat, and Slovene prisoners of war willing to fight for South Slav liberation."
 SER_regency_of_alexander:0 "Proclamation of Prince Alexander's Regency"
 SER_regency_of_alexander_desc:0 "On June 24, 1914, King Peter I formally transfers royal prerogatives to his son, Crown Prince Alexander, establishing energetic young leadership at the helm of the Serbian state."
 SER_reign_of_peter_i:0 "Reign of Peter I Karađorđević"
 SER_reign_of_peter_i_desc:0 "King Peter I embodies the ideal of a liberal, constitutional monarch. Respected for translating John Stuart Mill's 'On Liberty', he rules strictly through parliament and constitutional law."
 SER_requisition_emergency_grain:0 "Requisition Emergency Grain Reserves"
 SER_requisition_emergency_grain_desc:0 "Collect grain reserves from rural cooperatives to feed bread rations to besieged urban centers."
 SER_restored_sovereign_serbia:0 "Restored Sovereign Serbia"
 SER_restored_sovereign_serbia_desc:0 "Rejecting complicated federal experiments, Serbia consolidates its historic borders and newly liberated territories as a centralized, victorious, and unconquered sovereign kingdom."
 SER_romanian_danube_understanding:0 "Romanian Danube Understanding"
 SER_romanian_danube_understanding_desc:0 "Maintaining cordial relations with King Carol I and Bucharest secures the peaceful navigation of the Danube River and anchors stability across the northern Carpathians."
 SER_saint_petersburg_arms_loans:0 "Saint Petersburg Arms Credits"
 SER_saint_petersburg_arms_loans_desc:0 "Negotiating generous Russian military loans provides thousands of modern Mosin-Nagant rifles, artillery batteries, and ammunition shipments to Serbian arsenals."
 SER_salonika_and_corfu_exile:0 "Salonika & Corfu Exile Governance"
 SER_salonika_and_corfu_exile_desc:0 "Operating as a government-in-exile, Serbia coordinates with Allied forces, recruits South Slav volunteers, and manages diplomacy from afar until the sacred soil of the homeland can be liberated."
 SER_salonika_trial_of_apis:0 "The Salonika Trial of Apis"
 SER_salonika_trial_of_apis_desc:0 "In 1917, the royal government uncovers a purported assassination plot against Prince Alexander. Colonel Apis and Black Hand ringleaders are tried and executed, ending military conspiracy forever."
 SER_sarajevo_aftermath_crisis:0 "Sarajevo Aftermath Crisis"
 SER_sarajevo_aftermath_crisis_desc:0 "The shots fired in Sarajevo on June 28, 1914, have plunged Europe into convulsion. Accused by Vienna of orchestrating the assassination, Serbia faces an unprecedented imperial storm."
 SER_serbo_austrian_economic_pact:0 "Serbo-Austrian Economic Pact"
 SER_serbo_austrian_economic_pact_desc:0 "A peaceful commercial settlement with the Dual Monarchy provides guaranteed export quotas for Serbian livestock and grain across central European railways."
 SER_serbo_austrian_trade_treaty:0 "Serbo-Austrian Trade Treaty"
 SER_serbo_austrian_trade_treaty_desc:0 "A comprehensive commercial agreement with the Dual Monarchy opens vast Austro-Hungarian markets to Serbian livestock and grain, laying past economic wars to rest."
 SER_serbo_bulgarian_dialogue:0 "Serbo-Bulgarian Dialogue"
 SER_serbo_bulgarian_dialogue_desc:0 "Opening friendly bilateral channels with Sofia dispels mutual suspicions, seeking equitable compromise and peaceful coexistence between the two brother Slavic kingdoms."
 SER_south_slav_cultural_links:0 "South Slav Cultural Links"
 SER_south_slav_cultural_links_desc:0 "Supporting cultural organizations like Matica Srpska and Prosvjeta fosters fraternal ties among Serbs, Croats, and Slovenes across the Balkan lands."
 SER_strengthen_border_watch:0 "Strengthen Sava and Drina Border Watch"
 SER_strengthen_border_watch_desc:0 "Station vigilant territorial watch detachments at river fords and mountain passes."
 SER_strengthen_narodna_skupstina:0 "Strengthen the Narodna Skupština"
 SER_strengthen_narodna_skupstina_desc:0 "Reaffirming the supremacy of the National Assembly over state finances, military appropriations, and civil rights guarantees transparent democratic governance in Belgrade."
 SER_sublime_porte_normalization:0 "Sublime Porte Normalization"
 SER_sublime_porte_normalization_desc:0 "Normalizing diplomatic intercourse with Constantinople establishes consular protections for Christian populations in border vilayets, defusing tensions without armed strife."
 SER_suppress_anti_habsburg_agitation:0 "Suppress Anti-Habsburg Agitation"
 SER_suppress_anti_habsburg_agitation_desc:0 "Demonstrating good faith to Vienna, the Serbian government strictly polices radical anti-Habsburg pamphlets and agitators, removing justifications for imperial retaliation."
 SER_supreme_command_preparedness:0 "Supreme Command Preparedness"
 SER_supreme_command_preparedness_desc:0 "With staff planning complete, supply nodes established, and operational reserves organized, the Vrhovna Komanda stands ready to direct the defense of the kingdom against any aggression."
 SER_the_albanian_golgotha:0 "The Albanian Golgotha"
 SER_the_albanian_golgotha_desc:0 "Overwhelmed by coordinated German, Austrian, and Bulgarian armies, the Serbian army refuses surrender. The King, government, and 300,000 soldiers trek through the frozen peaks of Albania."
 SER_the_shadow_of_apis:0 "The Shadow of Apis"
 SER_the_shadow_of_apis_desc:0 "Colonel Dragutin Dimitrijević, codenamed 'Apis', heads military intelligence and wields immense clandestine influence through the shadowy 'Unification or Death' society—the feared Black Hand."
 SER_three_ban_conscription_system:0 "Three-Ban Conscription System"
 SER_three_ban_conscription_system_desc:0 "Codifying the three-tier mobilization structure—I Poziv (active troops aged 21-31), II Poziv (reserves aged 31-38), and III Poziv (territorial militia aged 38-45)—ensures every able-bodied Serbian male answers the call to arms."
 SER_total_defensive_war:0 "Total Defensive War"
 SER_total_defensive_war_desc:0 "The die is cast. Confronting the full might of an empire ten times its size, Serbia mobilizes every ounce of its soul, soil, and strength in a holy war of national survival."
 SER_traditional_russian_patronage:0 "Traditional Russian Patronage"
 SER_traditional_russian_patronage_desc:0 "Imperial Russia has long stood as the protector of Slavic and Orthodox nations. Reaffirming close fraternal bonds with Tsar Nicholas II anchors Serbia's diplomatic shield."
 SER_typhus_epidemic_containment:0 "Typhus Epidemic Containment"
 SER_typhus_epidemic_containment_desc:0 "A devastating typhus epidemic sweeps Serbia in 1915, claiming hundreds of thousands of soldiers and civilians. Desperate quarantine measures and foreign medical aid race against extinction."
 SER_typhus_epidemic_crisis:0 "Typhus Epidemic Crisis"
 SER_typhus_epidemic_crisis_desc:0 "Louse-borne typhus is ravaging frontline trenches, crowded hospital wards, and refugee villages, draining national manpower and demoralizing army formations."
 SER_typhus_quarantine_and_triage:0 "Typhus Quarantine and Medical Triage"
 SER_typhus_quarantine_and_triage_desc:0 "Implement strict disinfection procedures, delousing stations, and field hospital triage to halt the epidemic."
 SER_underdeveloped_agrarian_economy:0 "Underdeveloped Agrarian Economy"
 SER_underdeveloped_agrarian_economy_desc:0 "Dependent on smallholder peasant agriculture and lacking heavy metallurgical industry, Serbia struggles to finance modernization following years of economic isolation."
 SER_veteran_serbian_soldier:0 "The Serbian Soldier (Srpski Vojnik)"
 SER_veteran_serbian_soldier_desc:0 "Toughened by mountain life, patriotic devotion, and unwavering stoicism, the Serbian peasant-soldier possesses extraordinary stamina and fighting spirit, respected by friend and foe alike."
 SER_wartime_emergency_measures:0 "Wartime Emergency Measures"
 SER_wartime_emergency_measures_desc:0 "During total war, the state must take drastic measures to ensure frontlines remain supplied, grain reaches starving cities, and deadly epidemics are halted in their tracks."
 SER_yugoslav_brotherhood_charter:0 "Yugoslav Brotherhood Charter"
 SER_yugoslav_brotherhood_charter_desc:0 "Pledging equal constitutional rights, regional autonomy, and cultural brotherhood to Croats, Slovenes, and Serbs forges enduring multi-ethnic solidarity across the South Slavic lands."
 SER_yugoslav_federal_ideal:0 "Yugoslav Federal Ideal"
 SER_yugoslav_federal_ideal_desc:0 "Embracing the vision of a shared South Slavic homeland, Serbia reaches out to Croat and Slovene leaders to prepare a democratic, egalitarian federation of brother peoples."
 SER_zadruga_cooperative_network:0 "Zadruga Cooperative Network"
 SER_zadruga_cooperative_network_desc:0 "Centuries of communal family cooperatives—the Zadruga—anchor Serbian rural society. Providing institutional state backing, fair grain credit, and agricultural tools will stabilize peasant livelihoods and reinforce social cohesion."
 decision_cost_command_power_15:0 "Costs 15 Command Power"
 ww1_serbia.1.a:0 "Long live the constitutional monarchy of King Peter!"
 ww1_serbia.1.b:0 "Ensure the National Assembly maintains fiscal control."
 ww1_serbia.1.d:0 "King Peter I Karađorđević rules through parliamentary democracy. Nikola Pašić's Radical Party holds the reins of governance, yet tensions between civilian ministries and national defense remain a delicate balancing act."
 ww1_serbia.1.t:0 "The Pašić Ministry and Constitutional Stability"
 ww1_serbia.10.a:0 "A legendary triumph! Belgrade is free!"
 ww1_serbia.10.d:0 "After weeks of grueling retreat in freezing mud, General Živojin Mišić unleashed a thunderous counter-attack along the Kolubara River, shattering the Austrian Fifth and Sixth Armies and driving them from Serbian soil."
 ww1_serbia.10.t:0 "The Miracle of Kolubara"
 ww1_serbia.11.a:0 "We retreat today so that Serbia may rise tomorrow!"
 ww1_serbia.11.d:0 "Faced with overwhelming simultaneous offensives from Germany, Austria-Hungary, and Bulgaria, the Serbian army refuses surrender. The King and army undertake the grueling winter march across the mountains of Albania."
 ww1_serbia.11.t:0 "The Albanian Golgotha: The Great Retreat"
 ww1_serbia.12.a:0 "Serbia lives on! We shall return in triumph!"
 ww1_serbia.12.d:0 "Rescued by Allied fleets, the Serbian government, parliament, and soldiers have reassembled on the Greek island of Corfu. Though displaced from our homeland, our state sovereignty endures unbroken."
 ww1_serbia.12.t:0 "The Resurrected Kingdom: Exile in Corfu"
 ww1_serbia.13.a:0 "Constitutional authority is permanently restored."
 ww1_serbia.13.d:0 "In 1917, the royal government uncovers a purported plot against Prince Alexander. Colonel Apis and the leadership of the Black Hand are tried and executed, ending military conspiracy once and for all."
 ww1_serbia.13.t:0 "The Salonika Trial: The Fall of the Black Hand"
 ww1_serbia.14.a:0 "A glorious dawn for the South Slavic nation!"
 ww1_serbia.14.d:0 "Prime Minister Nikola Pašić and Ante Trumbić of the Yugoslav Committee sign the historic Corfu Declaration, pledging that Serbs, Croats, and Slovenes shall unite in a constitutional monarchy under the Karađorđević dynasty."
 ww1_serbia.14.t:0 "The Corfu Declaration: Pact of South Slav Unity"
 ww1_serbia.15.a:0 "Forward to victory! The homeland awaits!"
 ww1_serbia.15.d:0 "Serbian divisions charge up the sheer cliffs of Dobro Pole, breaking through enemy lines and precipitating the total collapse of the Central Powers in the Balkans."
 ww1_serbia.15.t:0 "The Breakthrough at Dobro Pole"
 ww1_serbia.16.a:0 "Živeo Kralj! Long live united Yugoslavia!"
 ww1_serbia.16.d:0 "On December 1, 1918, Prince Regent Alexander formally proclaims the unified Kingdom of Serbs, Croats, and Slovenes in Belgrade. A new era begins for the South Slavic peoples."
 ww1_serbia.16.t:0 "Proclamation of the Kingdom of Serbs, Croats, and Slovenes"
 ww1_serbia.2.a:0 "We must keep close watch over these fiery officers."
 ww1_serbia.2.b:0 "Their patriotic devotion will shield the fatherland."
 ww1_serbia.2.d:0 "Founded by nationalist military officers under Colonel Dragutin Dimitrijević 'Apis', the clandestine organization 'Unification or Death' (known popularly as the Black Hand) wields immense underground power across the army and press."
 ww1_serbia.2.t:0 "The Shadow of Apis: The Secret Society Unification or Death"
 ww1_serbia.3.a:0 "A splendid financial foundation for national defense."
 ww1_serbia.3.d:0 "French financiers and diplomats have finalized generous credit agreements with the government in Belgrade, providing capital for railways, debt refinancing, and artillery orders from Creusot."
 ww1_serbia.3.t:0 "The Banque Franco-Serbe Credits"
 ww1_serbia.4.a:0 "Slavic brotherhood must triumph over imperial intrigue."
 ww1_serbia.4.b:0 "Proceed cautiously and protect Serbian interests."
 ww1_serbia.4.d:0 "Envoys from Belgrade and Sofia have initiated high-level consultations to address frontier security and prevent fratricidal Slavic conflict in Ottoman border provinces."
 ww1_serbia.4.t:0 "Bilateral Talks with Sofia"
 ww1_serbia.5.a:0 "Two crowns, one heroic soul! Živela Srbija i Crna Gora!"
 ww1_serbia.5.d:0 "King Nikola I of Montenegro and King Peter I reaffirm their historic dynastic and fraternal solidarity. The two Serb realms pledge eternal mutual defense."
 ww1_serbia.5.t:0 "The Dynastic Accord with King Nikola of Montenegro"
 ww1_serbia.6.a:0 "Long live Prince Regent Alexander!"
 ww1_serbia.6.d:0 "On June 24, 1914, King Peter I Karađorđević transfers full royal executive prerogatives to his energetic son, Crown Prince Alexander, due to declining physical health."
 ww1_serbia.6.t:0 "The Regency of Crown Prince Alexander"
 ww1_serbia.7.a:0 "A terrible tragedy. We must prepare for imperial rage."
 ww1_serbia.7.d:0 "Archduke Franz Ferdinand and Sophie Duchess of Hohenberg have been assassinated in Sarajevo by Gavrilo Princip. Vienna places full blame upon Belgrade."
 ww1_serbia.7.t:0 "The Sarajevo Outrage: Storm Clouds Gather"
 ww1_serbia.8.a:0 "Accept all reasonable points, but defend our sovereign courts!"
 ww1_serbia.8.b:0 "Total defiance! We shall never bow to imperial arrogance!"
 ww1_serbia.8.d:0 "On July 23, Baron Giesl delivers Vienna's ten-point ultimatum, demanding an answer within 48 hours. Several demands infringe upon Serbia's national judicial sovereignty."
 ww1_serbia.8.t:0 "The Austro-Hungarian Ultimatum"
 ww1_serbia.9.a:0 "For King, Fatherland, and Liberty!"
 ww1_serbia.9.d:0 "With diplomacy broken, Vojvoda Radomir Putnik orders all three Pozivs to take their stations. Over 400,000 Serbian soldiers take up arms for their homes."
 ww1_serbia.9.t:0 "Putnik Proclaims General Mobilization"
