l_english:
 AUH_ww1_constitutional_audit:0 "[Historical] Constitutional Audit"
 AUH_ww1_constitutional_audit_desc:0 "The Compromise of 1867 is fraying at every seam. If the Habsburg Monarchy is to survive the storm engulfing Europe, the Crown must thoroughly audit the imperial constitution and chart a path between dualist inertia, federal reform, trialist autonomy, or martial rule."
 AUH_ww1_dualism:0 "[Historical - Dualism] Dualism of Iron"
 AUH_ww1_dualism_desc:0 "Preserve the 1867 Compromise and double down on the alliance between the Austrian Germans and the Magyar aristocracy. Power shall remain shared strictly between Vienna and Budapest, uncompromising against minority agitations."
 AUH_ww1_tisza_alliance:0 "[Dualism] The Tisza Pact"
 AUH_ww1_tisza_alliance_desc:0 "Prime Minister István Tisza commands the Hungarian Parliament with an iron grip. By securing his unconditional loyalty and guaranteeing Hungarian agrarian hegemony, the Crown ensures the grain fields of the Great Plain remain open to the imperial war effort."
 AUH_ww1_magyar_cavalry_corps:0 "[Dualism] Magyar Hussar Formations"
 AUH_ww1_magyar_cavalry_corps_desc:0 "The Royal Hungarian Honvéd boasts storied equestrian traditions. By expanding the light cavalry regiments and mounting aggressive border reconnaissance patrols, we fortify the Carpathian gates against eastern threats."
 AUH_ww1_trialism:0 "[Alternative - Trialism] Habsburg Trialism"
 AUH_ww1_trialism_desc:0 "End the dual monopoly of power by elevating the South Slav lands into a third equal kingdom within the Monarchy. Archduke Franz Ferdinand's favored vision establishes a unified Croato-Slav crown under Habsburg rule."
 AUH_ww1_zagreb_coronation:0 "[Trialism] The Zagreb Coronation"
 AUH_ww1_zagreb_coronation_desc:0 "Convene the Croatian Sabor in Zagreb and solemnize the union of Croatia, Slavonia, Dalmatia, and Bosnia-Herzegovina as the Kingdom of Illyria, binding South Slav loyalty eternally to the imperial throne."
 AUH_ww1_pacify_south_slavs:0 "[Trialism] Pacify the South Slavs"
 AUH_ww1_pacify_south_slavs_desc:0 "Neutralize Serbian irredentism and Narodna Odbrana agitators by granting complete administrative parity, native language rights, and regional self-government to our southern subjects."
 AUH_ww1_federalism:0 "[Alternative - Federalism] Danubian Mega-Federation"
 AUH_ww1_federalism_desc:0 "Dismantle the rigid Dualist compromise in favor of an enlightened federation of equal nationalities. Following Aurel Popovici's doctrine, every major ethnolinguistic group shall govern its homeland under a federal imperial mantle."
 AUH_ww1_popovici_manifesto:0 "[Federalism] The Popovici Manifesto"
 AUH_ww1_popovici_manifesto_desc:0 "Promulgate the principles of the United States of Greater Austria. Drawing fifteen ethnic autonomous states with redrawn cantonal borders guarantees the civil rights and cultural preservation of Germans, Magyars, Czechs, Poles, Ruthenians, and Romanians alike."
 AUH_ww1_proclaim_danubian_federation:0 "[Federalism] Proclaim the Danubian Mega-Federation"
 AUH_ww1_proclaim_danubian_federation_desc:0 "Sign the historic imperial charter releasing Hungary, Bohemia, Croatia, and Galicia as autonomous constituent states under the House of Habsburg-Lorraine. Bound by common defense and single foreign representation, the Empire is reborn."
 AUH_ww1_military_dictatorship:0 "[Alternative - Junta] AOK Military Dictatorship"
 AUH_ww1_military_dictatorship_desc:0 "Suspend constitutional niceties, dissolve obstinate parliamentary diets, and subordinate the civilian ministries directly to the Armeeoberkommando. In this supreme hour, iron martial discipline and the bayonet alone shall govern the realm."
 AUH_ww1_conrad_supreme_command:0 "[Military Junta] Conrad's Supreme Command"
 AUH_ww1_conrad_supreme_command_desc:0 "Vest Field Marshal Count Franz Conrad von Hötzendorf with dictatorial wartime authority over all strategic assets, mobilization depots, and domestic communications. Offensive boldness shall override all timid civilian reservations."
 AUH_ww1_war_surveillance_office:0 "[Military Junta] The War Surveillance Office"
 AUH_ww1_war_surveillance_office_desc:0 "Establish the Kriegsüberwachungsamt to supervise civilian industry, enforce strict press censorship, intercept seditious correspondence, and ruthlessly eliminate defeatism across all crown lands."
 AUH_ww1_skoda_contracts:0 "Expand Škoda Works Contracts"
 AUH_ww1_skoda_contracts_desc:0 "Direct vast state subsidies to the Škoda armament foundries in Pilsen. Heavy metallurgy and specialized siege artillery development shall establish Austro-Hungarian gunsmiths as world leaders."
 AUH_ww1_steyr_small_arms:0 "Steyr Arms Manufacturing"
 AUH_ww1_steyr_small_arms_desc:0 "Contract the Österreichische Waffenfabriks-Gesellschaft in Steyr to ramp up mass fabrication of Mannlicher M.95 straight-pull rifles and Roth-Steyr service pistols for the imperial infantry."
 AUH_ww1_trieste_yards:0 "Trieste Naval Dockyards"
 AUH_ww1_trieste_yards_desc:0 "Enlarge the slipways and drydocks of the Stabilimento Tecnico Triestino and Monfalcone. The K.u.K. Kriegsmarine must construct dreadnoughts capable of contesting dominance over the Adriatic waters."
 AUH_ww1_isonzo_plan:0 "The Isonzo Defensive Plan"
 AUH_ww1_isonzo_plan_desc:0 "Survey the limestone cliffs, karst plateaus, and treacherous gorges of the Isonzo river valley. In-depth fortifications and alpine gun batteries will bar any invasion through the Gorizia gate."
 AUH_idea_dualism_iron:0 "Dualism of Iron"
 AUH_idea_dualism_iron_desc:0 "Austro-Hungarian dualism preserves the historic partnership of German and Hungarian ruling classes, commanding resolute obedience from imperial subjects at the cost of Slavic grievances."
 AUH_idea_habsburg_trialism:0 "Habsburg Trialism"
 AUH_idea_habsburg_trialism_desc:0 "By recognizing a South Slav crown alongside Austria and Hungary, the Monarchy secures the loyalty of its southern provinces and permanently shields its flanks from Balkan irredentism."
 AUH_idea_danubian_federation_spirit:0 "Danubian Federal Spirit"
 AUH_idea_danubian_federation_spirit_desc:0 "A brotherhood of nationalities united under an enlightened Habsburg constitution. Broad regional autonomy fuels unprecedented civic cooperation, economic vigor, and social harmony."
 AUH_idea_aok_military_dictatorship:0 "AOK Military Dictatorship"
 AUH_idea_aok_military_dictatorship_desc:0 "The Armeeoberkommando holds absolute sway over state resources and citizen life. Every train, factory, and harvest is ruthlessly commandeered for the front, sparking civilian despair beneath a facade of relentless martial resolve."
 AUH_danubian_federal_member:0 "Danubian Federal Member"
 AUH_danubian_federal_member_desc:0 "As an autonomous constituent state of the Danubian Mega-Federation, this realm manages its internal cultural and judicial affairs while pooling military production, manpower levies, and fiscal revenue under the common imperial crown."
 AUH_skoda_305_howitzer:0 "Škoda 30.5 cm Heavy Siege Howitzers"
 AUH_skoda_305_howitzer_desc:0 "The Škoda 30.5 cm M.11 Motormörser delivers catastrophic high-explosive ordnance against hardened enemy forts and entrenched frontlines, pulverizing all resistance."
 AUH_steyr_mannlicher:0 "Steyr-Mannlicher Munitions Conglomerate"
 AUH_steyr_mannlicher_desc:0 "Precision Austrian firearm manufacture equips the imperial rank and file with dependable straight-pull Mannlicher rifles and cutting-edge small arms technology."
 AUH_ganz_danubius:0 "Ganz-Danubius Shipbuilders"
 AUH_ganz_danubius_desc:0 "Hungary's premier maritime and heavy engineering works constructs cruisers, destroyers, and submarines to protect Adriatic lifelines and project dual naval might."
 AUH_conrad_offensive_doctrine:0 "Conrad's Cult of the Offensive"
 AUH_conrad_offensive_doctrine_desc:0 "Chief of the General Staff Franz Conrad von Hötzendorf prioritizes ceaseless offensive momentum and daring enveloping maneuvers, accepting severe tactical casualties in pursuit of grand strategic triumph."
 AUH_borojevic_alpine_defense:0 "Boroević's Alpine Defense"
 AUH_borojevic_alpine_defense_desc:0 "Field Marshal Svetozar Boroević von Bojna excels in unyielding static defense, utilizing rugged karst mountain terrain and stone parapets to turn hostile offensives into bloody catastrophes."
 AUH_crown_dashboard:0 "The Imperial Crown Dashboard"
 AUH_crown_dashboard_desc:0 "Monitoring the three vital pillars of the Austro-Hungarian state during total war: War Weariness, Imperial Cohesion, and Vienna Grain Stockpiles. Balancing these competing vectors is essential to preventing famine riots and ethnic dissolution."
 AUH_dec_requisition_banat_grain:0 "Requisition Banat Grain Harvests"
 AUH_dec_requisition_banat_grain_desc:0 "Despatch imperial requisition commissars into the fertile Banat and Vojvodina agricultural zones to feed the hungry workers and bread queues of Vienna, risking friction with local Magyar landowners."
 AUH_dec_bread_rationing_cards:0 "Institute Imperial Bread Rationing"
 AUH_dec_bread_rationing_cards_desc:0 "Issue strict rationing coupons across Cisleithania to manage dwindling flour stockpiles. Bread consumption is curtailed, preserving strategic reserves at the price of popular discontent."
 AUH_dec_appease_budapest_diet:0 "Appease the Budapest Diet"
 AUH_dec_appease_budapest_diet_desc:0 "Offer fiscal concessions and reaffirm political guarantees to the Hungarian Parliament, soothing aristocratic outrage and preserving imperial cohesion between Vienna and Budapest."
 AUH_dec_galician_food_corps:0 "Organize Galician Agricultural Corps"
 AUH_dec_galician_food_corps_desc:0 "Mobilize civilian labor and auxiliary logistics brigades in Galicia to harvest and transport agricultural supplies back to the imperial capital."
 AUH_dec_skoda_siege_howitzers:0 "Commission Škoda 30.5 cm Siege Howitzers"
 AUH_dec_skoda_siege_howitzers_desc:0 "Authorize urgent priority production of Škoda's motor-drawn super-heavy siege howitzers, providing frontline divisions with devastating fortification-busting firepower."
 AUH_dec_galician_oil_extraction:0 "Intensify Boryslav Oilfield Extraction"
 AUH_dec_galician_oil_extraction_desc:0 "Drill deeper wells and build modern refinery cracking plants in the Galician Boryslav basin, supplying vital petroleum products for the imperial military machine."
 AUH_dec_steep_alpine_redoubts:0 "Construct Steep Alpine Fortified Redoubts"
 AUH_dec_steep_alpine_redoubts_desc:0 "Carve cavernous gun embrasures, barbed wire belts, and concrete pillboxes directly into the granite peaks of the Dolomites and the Isonzo river sector."
 AUH_dec_prince_wied_albania:0 "Support Prince Wilhelm of Wied in Albania"
 AUH_dec_prince_wied_albania_desc:0 "Extend diplomatic and financial patronage to Prince Wilhelm of Wied's sovereignty over the newly established Principality of Albania, checking Italian and Serbian ambitions."
 AUH_dec_danubian_customs_union:0 "Propose the Danubian Customs Union"
 AUH_dec_danubian_customs_union_desc:0 "Establish a comprehensive Mitteleuropa customs union spanning the entire Danube basin, eliminating internal tariffs and cementing regional trade under Austrian auspices."
 ww1_austria_collapse.1.t:0 "The Bohemian Revolt: Czech Secession"
 ww1_austria_collapse.1.d:0 "Crushed beneath relentless military disaster, food shortages, and severe war weariness, the Czech National Committee in Prague has declared complete independence. Czech regiments have mutinied, raising the white-and-red banner over the Hradčany Castle and repudiating their allegiance to the Habsburg Crown."
 ww1_austria_collapse.1.a:0 "Traitors! Mobilize loyal garrisons to crush the rebellion!"
 ww1_austria_collapse.2.t:0 "The Hungarian Diet Dissolves the Union"
 ww1_austria_collapse.2.d:0 "Furious over wartime centralization, devastating casualties, and perceived imperial betrayal of the Compromise of 1867, the Hungarian Parliament in Budapest has proclaimed the dissolution of the Austro-Hungarian Union. Hungarian units are recalled from the frontlines to defend the fatherland."
 ww1_austria_collapse.2.a:0 "The Crown of Saint Stephen cannot sever its sacred oath!"
 ww1_austria_collapse.3.t:0 "The South Slav Rebellion in Zagreb"
 ww1_austria_collapse.3.d:0 "The Croatian Sabor and representatives of the Slovenes, Croats, and Serbs in Zagreb have renounced all ties to the Dual Monarchy. Disillusioned soldiers returning from the front have established a National Council, demanding complete South Slav sovereignty."
 ww1_austria_collapse.3.a:0 "The Empire will never relinquish the Adriatic coast!"
 ww1_austria_collapse.10.t:0 "Imperial Authority Restored"
 ww1_austria_collapse.10.d:0 "Loyal imperial-royal forces have recaptured rebel provincial capitals, decisively breaking the back of the insurrection. Separatist ringleaders have been arrested or driven into exile, and the rebellious provinces are restored directly under the Habsburg crown."
 ww1_austria_collapse.10.a:0 "Gott erhalte Franz den Kaiser! The Monarchy endures!"
 ww1_austria_diplomacy.1.t:0 "The Colonel Redl Espionage Affair"
 ww1_austria_diplomacy.1.d:0 "A catastrophic security breach has shaken the Evidenzbureau to its very foundations. Colonel Alfred Redl, former head of counter-intelligence and Chief of Staff of the VIII Corps in Prague, has been unmasked as a high-level Russian spy. Deep in debt and blackmailed over his private life, Redl has sold Austria's complete mobilization plans—Plan B for the Balkans and Plan R for Russia—directly to the Tsar's General Staff. Confronted in his Vienna hotel room, Redl took his own life with a service revolver left by investigators."
 ww1_austria_diplomacy.1.a:0 "Overhaul mobilization schedules and revise Plan B and R immediately!"
 ww1_austria_diplomacy.1.b:0 "Cover up the scandal to protect the honor of the officer corps."
 ww1_austria_diplomacy.10.t:0 "The Sixtus Affair: Secret Peace Feelers"
 ww1_austria_diplomacy.10.d:0 "Young Emperor Karl I, despairing over the horrific slaughter of World War I and the impending collapse of the Habsburg dynasty, has initiated clandestine diplomatic overtures toward the Entente. Utilizing his brother-in-law, Prince Sixte of Bourbon-Parma serving as an officer in the Belgian army, Karl has sent a secret handwritten letter to French President Poincaré, offering to support France's just claims to Alsace-Lorraine and restore Belgian sovereignty in exchange for an honorable separate peace."
 ww1_austria_diplomacy.10.a:0 "Pursue the secret peace feelers through Prince Sixte."
 ww1_austria_diplomacy.10.b:0 "Reaffirm steadfast fidelity to the German alliance."
 ww1_austria_diplomacy.11.t:0 "Austrian Peace Overtures Received in Paris"
 ww1_austria_diplomacy.11.d:0 "Prince Sixte of Bourbon-Parma has delivered a secret personal letter from Emperor Karl of Austria-Hungary to the Élysée Palace. Vienna hints at recognizing French sovereignty over Alsace-Lorraine and restoring Belgium if a separate peace can be concluded."
 ww1_austria_diplomacy.11.a:0 "Study Vienna's terms with cautious interest."
 ww1_austria_diplomacy.11.b:0 "Reject separate talks without total Entente consensus."
 ww1_austria_diplomacy.12.t:0 "Vienna Reaffirms the German Pact"
 ww1_austria_diplomacy.12.d:0 "Emperor Karl I has assured the German Supreme Command of Austria-Hungary's unwavering commitment to the Central Powers, renouncing all separate negotiations with Paris or London."
 ww1_austria_diplomacy.12.a:0 "Together until final victory!"
 ww1_austria_diplomacy.20.t:0 "The Austro-Polish Solution"
 ww1_austria_diplomacy.20.d:0 "Following the expulsion of Russian imperial forces from Congress Poland, the future political status of the Polish lands must be decided. Austrian diplomats advocate the Austro-Polish Solution: uniting Russian Poland with Austrian Galicia under a constitutional kingdom headed by Archduke Karl Stephan of Habsburg, binding a resurrected Poland permanently to Vienna."
 ww1_austria_diplomacy.20.a:0 "Crown Archduke Karl Stephan as King of Poland!"
 ww1_austria_diplomacy.20.b:0 "Cede governance to the German authorities in Warsaw."
 ww1_austria_diplomacy.30.t:0 "The Brotfrieden: Bread Peace with Ukraine"
 ww1_austria_diplomacy.30.d:0 "Famine conditions grip Vienna and Austrian industrial centers, with workers collapsing in bread lines and food riots erupting weekly. At Brest-Litovsk, Austro-Hungarian delegates have negotiated a separate peace treaty with the Ukrainian People's Republic. In exchange for diplomatic recognition and territorial assurances in the Kholm region, Ukraine agrees to deliver one million tons of grain, sugar, and livestock to relieve the starving Dual Monarchy."
 ww1_austria_diplomacy.30.a:0 "Ratify the treaty! Grain will save the Monarchy!"
 ww1_austria_diplomacy.30.b:0 "Refuse concessions over the disputed Kholm territory."
 HUN_AUS_danubian_state:0 "Kingdom of Hungary"
 HUN_AUS_danubian_state_DEF:0 "The Kingdom of Hungary"
