 POL_AUS_danubian_state_DEF:0 "The Kingdom of Poland"
 AUH_war_weariness:0 "Imperial War Weariness"
 AUH_cohesion:0 "Imperial Cohesion"
 AUH_vienna_grain:0 "Vienna Grain Stockpile"
 ww1_austria_diplomacy.1.a_tt:0 "Mobilization plans will be restructured, removing Russian advance intelligence advantages."
 ww1_austria_diplomacy.1.b_tt:0 "Covering up Redl's espionage leaves Austrian deployment schedules compromised against Russia."
 ww1_austria_diplomacy.10.a_tt:0 "Secret envoys will approach Paris to explore conditions for a separate peace."
 ww1_austria_diplomacy.10.b_tt:0 "Austria affirms iron loyalty to the Central Powers, reassuring Germany."
 ww1_austria_diplomacy.20.a_tt:0 "Archduke Karl Stephan takes the Polish crown, establishing a loyal Habsburg client state."
 ww1_austria_diplomacy.20.b_tt:0 "Germany will govern Warsaw, improving bilateral relations at the cost of Austrian influence."
 ww1_austria_diplomacy.30.a_tt:0 "Agricultural shipments from Ukraine arrive in Vienna, filling grain reserves by §G+40§! and subduing war weariness."
 ww1_austria_diplomacy.30.b_tt:0 "Refusing the treaty deepens famine in Austrian cities, driving war weariness up by §R+15§!."
 AUH_dec_prince_wied_albania_tt:0 "Extends diplomatic backing to Albania, enhancing Habsburg prestige in the southern Balkans."
 AUH_dec_danubian_customs_union_tt:0 "Fosters trade across the Danube river basin, boosting grain reserves and cohesion."
 AUH_ww1_alliance_renewed:0 "Alliance Reaffirmed"
