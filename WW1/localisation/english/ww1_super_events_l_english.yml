l_english:
 ww1_super_event_dispatch_header:0 "EXTRAORDINARY DISPATCH"
 ww1_super_event_outbreak_title:0 "THE GREAT WAR"
 ww1_super_event_outbreak_quote:0 "Mobilization orders cross the continent.\nPeace now rests with those who march."
 ww1_super_event_outbreak_button:0 "The future is in our hands."
 ww1_outbreak.1.t:0 "Shots in Sarajevo"
 ww1_outbreak.1.d:0 "Archduke Franz Ferdinand and his wife Sophie have been shot dead during their visit to Sarajevo. The heir to the Austro-Hungarian throne had continued his public engagements after an earlier attempt against his motorcade. A second attack on the Appel Quay proved fatal.\n\nThe arrested gunman, Gavrilo Princip, belongs to the revolutionary milieu of Young Bosnia. The investigation into his accomplices has only begun. Officials in Vienna are already demanding answers from Belgrade, while the Serbian government fears that accusations may become an ultimatum.\n\nMourning has spread across the Habsburg lands. Behind closed doors, ministers and military staffs are weighing measures whose consequences may reach far beyond the Balkans."
 ww1_outbreak.1.a:0 "The empire must learn who stands behind this."
 ww1_outbreak.1.b:0 "Our response must protect Serbia from catastrophe."
 ww1_outbreak.1.c:0 "Diplomacy faces its gravest test."
 ww1_outbreak.2.t:0 "General War in Europe"
 ww1_outbreak.2.d:0 "Diplomatic exchanges have given way to mobilization orders. Railways carry reservists toward the frontiers, ports prepare for wartime traffic, and governments ask their citizens to accept sacrifices whose duration no one can honestly predict.\n\nThe conflict has drawn the great powers into opposing camps. Each declaration now changes the calculations of countries still outside the fighting. Alliances, trade routes and the security of distant territories are becoming part of the same war.\n\nCrowds cheer the departing regiments. Their families wait for letters. The outcome will depend on armies and factories, transport and diplomacy, and the endurance of societies that have yet to discover the price of a modern war."
 ww1_outbreak.2.a:0 "We must bring our people through this war."
 ww1_outbreak.2.b:0 "Neutrality will demand vigilance."
 ww1_great_war_dispatch:0 "The Great War — Extraordinary Dispatch"
