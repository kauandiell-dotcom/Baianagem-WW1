l_english:
 ww1_super_event_outbreak_title:0 "§Y--- THE GREAT WAR (1914 - 1918) ---§!"
 ww1_super_event_outbreak_quote:0 "\"The lamps are going out all over Europe; we shall not see them lit again in our lifetime.\"\n§7— Sir Edward Grey, 3 August 1914§!"
 ww1_super_event_outbreak_button:0 "§RMay God have mercy on our souls.§!"

 ww1_news.1914_sarajevo_assassination.t:0 "The Guns of Sarajevo: Archduke Assassinated!"
 ww1_news.1914_sarajevo_assassination.d:0 "On a sunny morning in Sarajevo, Bosnia, two pistol shots shattered the peace of the civilized world. Archduke Franz Ferdinand, heir to the Austro-Hungarian throne, and his beloved wife Sophie, Duchess of Hohenberg, have been brutally gunned down during an official motorcade along the Appel Quay.\n\nThe assassin, a nineteen-year-old Bosnian Serb radical named Gavrilo Princip affiliated with the nationalist secret society 'The Black Hand', was captured immediately by imperial gendarmes. In Vienna, Emperor Franz Joseph is reported to be in deep mourning, while military circles in the Ballhausplatz clamor for unconditional retribution against Belgrade. In Belgrade, panic and defiance mingle as Slavic patriots brace for the Austrian response.\n\nThe spark has been lit in the Balkan powder keg. What follows may well decide the destiny of all European empires."
 ww1_news.1914_sarajevo_assassination.a:0 "Retribution shall be swift and pitiless!"
 ww1_news.1914_sarajevo_assassination.b:0 "We shall defend our freedom to the last breath!"
 ww1_news.1914_sarajevo_assassination.c:0 "A grave tragedy has struck Europe..."

 ww1_news.1914_great_war_outbreak.t:0 "THE GREAT WAR HAS BEGUN!"
 ww1_news.1914_great_war_outbreak.d:0 "The diplomatic machinery of the Old World has collapsed irrevocably into the abyss. Following the expiration of the Austro-Hungarian ultimatum to Serbia, the mobilization orders of the Russian Empire, and the German violation of Belgian neutrality, the continent of Europe is consumed by general war.\n\nFrom the cobblestones of London to the grand boulevards of Paris, the Unter den Linden of Berlin, and the Winter Palace of Petrograd, millions of young men don wool tunics and shoulder rifles amidst cheering crowds convinced they will be home before the leaves fall from the trees.\n\nYet along the frontiers, heavy siege howitzers open fire with thunderous drumfire, cutting down cavalry charges with scythe-like Maxim machine guns and turning pastoral fields into muddy labyrinths of barbed wire and blood. The Concert of Europe is dead. The Great War has begun."
 ww1_news.1914_great_war_outbreak.central_powers:0 "Gott mit uns! Victory before autumn!"
 ww1_news.1914_great_war_outbreak.entente:0 "For freedom and civilization! We shall not yield!"
 ww1_news.1914_great_war_outbreak.neutrals:0 "The civilized world descends into darkness..."
