l_english:
 AUH_ww1_admiralty_review:0 "Review the Admiralty"
 AUH_ww1_admiralty_review_desc:0 "The narrow Adriatic calls for a navy compatible with existing resources and bases."
 AUH_ww1_adriatic_civil_compact:0 "A Civil Compact on the Adriatic"
 AUH_ww1_adriatic_civil_compact_desc:0 "Coastal administration requires local safeguards even when diplomacy fails."
 AUH_ww1_adriatic_consultation:0 "Adriatic Consultations"
 AUH_ww1_adriatic_consultation_desc:0 "The consultation channel renews confidence only while the relationship has not become a war. Immediate effect: +15 political power, +1 provincial confidence."
 AUH_ww1_adriatic_rail:0 "The Adriatic Corridor"
 AUH_ww1_adriatic_rail_desc:0 "Connecting Vienna to the coast supports the port and Italian front while the line remains open. Immediate effect: level 2 railway between Lower Austria (Vienna) and Littoral/Trieste, +2 provincial confidence."
 AUH_ww1_adriatic_supply:0 "Sustain the Adriatic Bases"
 AUH_ww1_adriatic_supply_desc:0 "Bases require land connections and a coast retained under control. Immediate effect: +2 food reserves, +2 navy experience."
 AUH_ww1_aerial_observation:0 "Aerial Observation"
 AUH_ww1_aerial_observation_desc:0 "Reconnaissance is a role for early aviation without free air supremacy."
 AUH_ww1_aeronautical_testing:0 "Aeronautical Trials"
 AUH_ww1_aeronautical_testing_desc:0 "Trials improve research into available modules without ahead-of-time bonuses."
 AUH_ww1_agreement:0 "Understanding with Vienna"
 AUH_ww1_agricultural_tools:0 "Tools for the Countryside"
 AUH_ww1_agricultural_tools_desc:0 "Agricultural methods and simple equipment help retain workers in the countryside."
 AUH_ww1_air_artillery_liaison:0 "Liaison Between Airmen and Batteries"
 AUH_ww1_air_artillery_liaison_desc:0 "Joint training provides air experience to organise the existing force."
 AUH_ww1_air_service_manual:0 "Air Service Manual"
 AUH_ww1_air_service_manual_desc:0 "The service learns for a limited time within current doctrines, preserving the scale of early aviation."
 AUH_ww1_air_training:0 "Air Service Training"
 AUH_ww1_airfield_services:0 "Airfield Services"
 AUH_ww1_airfield_services_desc:0 "Air infrastructure must be built before supporting larger forces. Immediate effect: +1 air base in Lower Austria (Vienna), +2 air experience, −10 political power."
 AUH_ww1_albanian_contacts:0 "Contacts in Albania"
 AUH_ww1_albanian_contacts_desc:0 "Civil assistance is proposed to the Albanian government; no protectorate is imposed for free."
 AUH_ww1_alliance_independence:0 "Preserve Autonomy Within the Alliance"
 AUH_ww1_alliance_independence_desc:0 "The monarchy chooses between greater political dependence and more limited cost coordination."
 AUH_ww1_alliance_renewed:0 "Alliance renewed with Vienna"
 AUH_ww1_alpine_routes:0 "Alpine Supply Routes"
 AUH_ww1_alpine_routes_desc:0 "Alpine works benefit a concrete region without uniform protection across the monarchy. Immediate effect: +1 infrastructure in Tyrol (Innsbruck), +2 army experience, −10 political power."
 AUH_ww1_ammunition_inspection:0 "Ammunition Inspection"
 AUH_ww1_ammunition_inspection_desc:0 "Ammunition quality must be researched and produced rather than guaranteeing victories through a focus."
 AUH_ww1_armistice_delegates:0 "Armistice Delegates"
 AUH_ww1_armistice_delegates_desc:0 "A proposal requires the consent of every country still fighting the monarchy. Immediate effect: +30 political power, −1% war support."
 AUH_ww1_armistice_proposal:0 "Send an Armistice Proposal"
 AUH_ww1_armistice_proposal_desc:0 "A proposal without annexations is delivered to every current enemy. Each government may accept or refuse. War continues during talks; authorisations expire in 120 days."
 AUH_ww1_arsenal_standards:0 "Common Arsenal Standards"
 AUH_ww1_arsenal_standards_desc:0 "Inspections replace the initial generic Škoda advantage with a modest production and retention improvement. Immediate effect: +2 consent, −15 political power."
 AUH_ww1_arsenal_subsidy:0 "Subsidise the Arsenals"
 AUH_ww1_arsenal_subsidy_desc:0 "Two civilian factories for 90 days fund advance orders: +4% production efficiency for 120 days, +2% consumer goods demanded and one more debt level. Requires spare debt limit."
 AUH_ww1_arsenals_initial:0 "Specialised Arsenals, Different Standards"
 AUH_ww1_arsenals_initial_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_arsenals_standardised:0 "Common Arsenal Standards"
 AUH_ww1_arsenals_standardised_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_artillery_reserves:0 "Ammunition Reserves by Front"
 AUH_ww1_artillery_reserves_desc:0 "Operational reserves are assembled from actual stocks and used for limited preparation. Immediate effect: −15 political power, +2 army experience."
 AUH_ww1_aviatik_contracts:0 "Aviatik Contracts"
 AUH_ww1_aviatik_contracts_desc:0 "Contracts prepare fighter research without adding aircraft to stocks."
 AUH_ww1_balanced_accounts:0 "Balance the Peacetime Accounts"
 AUH_ww1_balanced_accounts_desc:0 "Repaying obligations reduces fiscal pressure; no focus automatically erases accumulated debt. Immediate effect: −1 debt level, −20 political power."
 AUH_ww1_balkan_plan:0 "Reassess the Balkan Plan"
 AUH_ww1_balkan_plan_desc:0 "The operation requires a real war against Serbia, ammunition and territorial conquest to count as a success. Immediate effect: +2 army experience, +10 command power."
 AUH_ww1_balkan_restraint:0 "Limit Commitments in the Balkans"
 AUH_ww1_balkan_restraint_desc:0 "Accommodation reduces internal political pressure, but makes new war justifications slower. Immediate effect: +0.5% stability."
 AUH_ww1_ballhausplatz:0 "Review Ballhausplatz Policy"
 AUH_ww1_ballhausplatz_desc:0 "The monarchy must choose between regional accommodation and diplomatic pressure, without a generic war-justification bonus."
 AUH_ww1_banat_council:0 "A Council for the Banat"
 AUH_ww1_banat_council_desc:0 "Negotiating regional services reduces administrative conflict without eliminating national disagreements. Immediate effect: +1 building slot in Banat, +2 provincial confidence, +2 food reserves."
 AUH_ww1_battery_survey:0 "Survey the Batteries"
 AUH_ww1_battery_survey_desc:0 "Surveying calibres provides experience for adjusting division designs."
 AUH_ww1_belgrade_channel:0 "Open a Channel to Belgrade"
 AUH_ww1_belgrade_channel_desc:0 "Trade normalisation depends on Serbian acceptance and applies only in peacetime."
 AUH_ww1_berlin_mission:0 "A Mission to Berlin"
 AUH_ww1_berlin_mission_desc:0 "Germany may accept or reject a joint military commission; Vienna does not decide for it."
 AUH_ww1_bohemian_landtag:0 "The Bohemian Landtag"
 AUH_ww1_bohemian_landtag_desc:0 "Local representation must reach administration and budgets, beyond an imperial declaration. Immediate effect: +1 building slot in Bohemia (Plzeň/Prague), +2 provincial confidence, +1 consent, one 10% research bonus (industry)."
 AUH_ww1_bond_issue:0 "Issue a Series of War Bonds"
 AUH_ww1_bond_issue_desc:0 "An issue funds industry for 180 days: +2.5% output, with debt raised by one level. Civilian consumption for debt service persists until repayment. Six-series limit."
 AUH_ww1_bosnian_civil_security:0 "Civil Security in Bosnia"
 AUH_ww1_bosnian_civil_security_desc:0 "Security may be negotiated or imposed; repression increases internal tensions and does not prevent events by decree."
 AUH_ww1_bosnian_guarantees:0 "Guarantees for Bosnia"
 AUH_ww1_bosnian_guarantees_desc:0 "The third Crown cannot turn Bosnia's population into a mere extension of Zagreb. Immediate effect: +1 building slot in Bosnia (Sarajevo), +3 provincial confidence, −1 consent."
 AUH_ww1_bosnian_rail:0 "Rail Access to Bosnia"
 AUH_ww1_bosnian_rail_desc:0 "Balkan logistics requires real corridors through allied territory. Immediate effect: level 2 railway between Central Hungary (Budapest) and Bosnia (Sarajevo), +2 provincial confidence."
 AUH_ww1_bucharest_channel:0 "A Mission to Bucharest"
 AUH_ww1_bucharest_channel_desc:0 "Romania decides whether to accept the agricultural pact; Transylvanian territory is neither ceded nor expanded by the focus."
 AUH_ww1_budapest_compact:0 "The Budapest Compact"
 AUH_ww1_budapest_compact_desc:0 "Magyar support comes with concessions to Hungarian elites; other provinces notice the price. Immediate effect: +0.5% stability, +20 political power."
 AUH_ww1_budget_federal:0 "Agreed Federal Finances"
 AUH_ww1_budget_federal_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_budget_negotiated:0 "Negotiated Common Budget"
 AUH_ww1_budget_negotiated_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_budget_settled:0 "Dualist Contributions"
 AUH_ww1_budget_settled_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_budget_trialist:0 "Three Crowns Contributions"
 AUH_ww1_budget_trialist_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_budget_unsettled:0 "Contested Common Budget"
 AUH_ww1_budget_unsettled_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_bukovina_compact:0 "The Bukovina Compact"
 AUH_ww1_bukovina_compact_desc:0 "A diverse province requires shared representation, without automatic loyalty from any group. Immediate effect: +1 building slot in Bukovina, +2 provincial confidence, +1 consent."
 AUH_ww1_carpathian_survey:0 "Survey the Carpathians"
 AUH_ww1_carpathian_survey_desc:0 "Defence depends on retained regions and projects completed before the enemy offensive. Immediate effect: +2 army experience."
 AUH_ww1_central_power_liaison:0 "Permanent Allied Liaison"
 AUH_ww1_central_power_liaison_desc:0 "Military liaison funds temporary courses while diplomatic relations permit. Immediate effect: +1 consent, +1% war support, +2 army experience."
 AUH_ww1_civil_cabinet:0 "Civil Wartime Coordination"
 AUH_ww1_civil_cabinet_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_civil_war_cabinet:0 "Fund the Civil War Cabinet"
 AUH_ww1_civil_war_cabinet_desc:0 "A 180-day cabinet costs influence and civilian consumption, offering only limited production coordination."
 AUH_ww1_civilian_conversion:0 "Prepare Industrial Reconversion"
 AUH_ww1_civilian_conversion_desc:0 "A civilian project can diversify industry, but occupies capacity for a full year. Immediate effect: +0.5% stability, −15 political power."
 AUH_ww1_civilian_service:0 "Peacetime Civil Services"
 AUH_ww1_civilian_service_desc:0 "Administration leaves the emergency and retains a limited budget for common services. Immediate effect: +0.5% stability."
 AUH_ww1_coastal_course:0 "Coastal Observation Course"
 AUH_ww1_coastal_course_desc:0 "A 90-day course occupies one civilian factory, consumes 0 rifles and 20 support equipment and grants 4 experience. No divisions or aircraft are created."
 AUH_ww1_coastal_observation:0 "Coastal Observation Posts"
 AUH_ww1_coastal_observation_desc:0 "Preparing observation requires personnel and support; it does not replace actual patrol missions. Immediate effect: +3 navy experience."
 AUH_ww1_combined_staff:0 "Coordination Between Fronts"
 AUH_ww1_combined_staff_desc:0 "Coordination generates experience for doctrine and organisational changes without stacked combat statistics."
 AUH_ww1_common_army_review:0 "Review the Common Army"
 AUH_ww1_common_army_review_desc:0 "Army organisation depends on budgets, communication and reserves, not ethnic inferiority."
 AUH_ww1_common_bank:0 "The Austro-Hungarian Bank"
 AUH_ww1_common_bank_desc:0 "Emergency credit can finance the war, with obligations that persist afterwards. Immediate effect: +30 political power."
 AUH_ww1_common_customs:0 "One Customs Area, Three Crowns"
 AUH_ww1_common_customs_desc:0 "A common market preserves revenue, but funding three administrations is not free. Immediate effect: +0.5% stability, +20 political power."
 AUH_ww1_common_food_board:0 "A Common Food Commission"
 AUH_ww1_common_food_board_desc:0 "The commission may negotiate purchases or requisition stocks. Each choice affects consent and cohesion."
 AUH_ww1_common_statistics:0 "Common Economic Statistics"
 AUH_ww1_common_statistics_desc:0 "Comparable data supports production research within the limits of available technology."
 AUH_ww1_common_war_assessment:0 "Joint Assessment of the War"
 AUH_ww1_common_war_assessment_desc:0 "Joint planning provides experience and remains subordinate to actual fronts."
 AUH_ww1_conclude_armistice:0 "Conclude the Agreed Armistice"
 AUH_ww1_conclude_armistice_desc:0 "Requires valid authorisation from every current enemy. The monarchy leaves its faction and concludes white peace with belligerents; it grants no annexations and does not guarantee its allies' peace."
 AUH_ww1_conference_mandate:0 "A Mandate for the Conference"
 AUH_ww1_conference_mandate_desc:0 "The government may conclude negotiations only once all enemies have consented. Immediate effect: +30 political power."
 AUH_ww1_constantinople_mission:0 "Send a Mission to Constantinople"
 AUH_ww1_constantinople_mission_desc:0 "A 45-day mission improves Turkish opinion of us, and Turkey also views the monarchy more favourably. It creates no alliance."
 AUH_ww1_constitutional_audit:0 "Review the Compromise of 1867"
 AUH_ww1_constitutional_audit_desc:0 "An announcement is not a reform. We must decide who yields power and who pays for it."
 AUH_ww1_constitutional_convention:0 "The Constitutional Convention"
 AUH_ww1_constitutional_convention_desc:0 "Delegates must negotiate the distribution of powers before promulgating the constitution. Immediate effect: +3 consent, +2 provincial confidence, −20 political power."
 AUH_ww1_constitutional_session:0 "Negotiate the Convention"
 AUH_ww1_constitutional_session_desc:0 "A session funds the convention and raises consent and confidence by 4 points, consuming civilian capacity for 90 days."
 AUH_ww1_consular_network:0 "The Consular Network"
 AUH_ww1_consular_network_desc:0 "Consular contacts open proposal channels that require a response from the other country. Immediate effect: +25 political power, +1 consent."
 AUH_ww1_coronation_city_visit:0 "Imperial Visit to Budapest"
 AUH_ww1_coronation_city_visit_desc:0 "A 30-day visit to the city of the Crown of St Stephen grants +4 consent at a cost of −1 confidence in the other provinces."
 AUH_ww1_council:0 "Council of the Provinces"
 AUH_ww1_council_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_council_of_peoples:0 "A Council of Peoples"
 AUH_ww1_council_of_peoples_desc:0 "Provincial representation limits executive freedom and makes negotiation a permanent obligation. Immediate effect: +3 provincial confidence, −15 political power."
 AUH_ww1_counter_battery:0 "Counter-Battery Studies"
 AUH_ww1_counter_battery_desc:0 "Gunnery experience can fund adaptations to military organisation."
 AUH_ww1_credit_expansion:0 "Temporary Industrial Credit"
 AUH_ww1_credit_expansion_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_croatian_diet:0 "Convene the Sabor"
 AUH_ww1_croatian_diet_desc:0 "The Croatian parliament receives a civilian autonomy project; the common army remains subject to negotiation. Immediate effect: +1 building slot in Croatia, +3 provincial confidence, −1 consent."
 AUH_ww1_crown:0 "The Crown and the Provinces"
 AUH_ww1_crown_arbitration:0 "Crown Arbitration"
 AUH_ww1_crown_arbitration_desc:0 "A dispute between administrations offers a choice between imposing a decision and accepting mediation."
 AUH_ww1_crown_council:0 "Convene the Crown Council"
 AUH_ww1_crown_council_desc:0 "Vienna and Budapest must decide what their common monarchy can actually finance."
 AUH_ww1_crown_desc:0 "Administrative consent: §Y[?auh_ww1_consent|0]/100§!\nProvincial confidence: §Y[?auh_ww1_cohesion|0]/100§!\nFood reserves: §Y[?auh_ww1_provisions|0]/100§!\nDebt obligations: §Y[?auh_ww1_debt|0]/6§!\nActive civilian projects: §Y[?auh_ww1_projects_active|0]/2§!\n\nFood shortages hamper production. Existing military crises continue to respond to the war situation; there is no automatic calendar collapse."
 AUH_ww1_crownland_hearings:0 "Hear the Crownlands"
 AUH_ww1_crownland_hearings_desc:0 "Provincial representatives gain access to consultations, without promises of automatic loyalty. Immediate effect: +3 provincial confidence, −1 consent."
 AUH_ww1_dalmatian_ports:0 "Dalmatian Coastal Facilities"
 AUH_ww1_dalmatian_ports_desc:0 "Land facilities support the coast without creating a global naval empire. Immediate effect: +1 naval base in Dalmatia, +2 provincial confidence, +2 navy experience."
 AUH_ww1_dalmatian_services:0 "Civil Services in Dalmatia"
 AUH_ww1_dalmatian_services_desc:0 "The Adriatic coast also needs civilian administration, beyond naval bases. Immediate effect: +1 building slot in Dalmatia, +2 provincial confidence, +1 consent."
 AUH_ww1_danube_services:0 "Commercial Services on the Danube"
 AUH_ww1_danube_services_desc:0 "River navigation requires facilities, access and investment rather than free abstract trade. Immediate effect: +1 infrastructure in Western Hungary (Danube), +3 food reserves, +1 consent."
 AUH_ww1_danubian_reconciliation:0 "Fund Administrative Reconciliation"
 AUH_ww1_danubian_reconciliation_desc:0 "One civilian factory for 90 days restores 4 consent and 3 confidence during peace."
 AUH_ww1_danubian_services:0 "Reconcile the Administrations"
 AUH_ww1_danubian_services_desc:0 "Reconciliation continues to require concessions without declaring every national conflict solved. Immediate effect: +3 consent, +3 provincial confidence."
 AUH_ww1_debt_1:0 "Limited War Obligations"
 AUH_ww1_debt_1_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_debt_2:0 "Indebted Budget"
 AUH_ww1_debt_2_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_debt_3:0 "Heavy Debt Service"
 AUH_ww1_debt_3_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_defensive_manual:0 "Borojević's Defensive Manual"
 AUH_ww1_defensive_manual_desc:0 "A defensive school brings modest preparation improvements and limits offensive planning speed. Immediate effect: +3 army experience."
 AUH_ww1_defensive_staff:0 "Defensive Staff"
 AUH_ww1_defensive_staff_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_delegation_session:0 "Negotiate with the Delegations"
 AUH_ww1_delegation_session_desc:0 "A 60-day session costs influence and raises consent by 6 points. It is useful only while support is below 85."
 AUH_ww1_delegations:0 "The Delegations of 1911"
 AUH_ww1_delegations_desc:0 "Regular negotiations with both delegations can secure consent, but consume political influence. Immediate effect: +3 consent, +20 political power."
 AUH_ww1_demobilisation:0 "Negotiated Demobilisation"
 AUH_ww1_demobilisation_desc:0 "Peace requires choosing the pace of return to civilian life and paying for reintegration."
 AUH_ww1_diplomacy:0 "Diplomatic Channels"
 AUH_ww1_diplomacy_desc:0 "Administrative consent: §Y[?auh_ww1_consent|0]/100§!\nProvincial confidence: §Y[?auh_ww1_cohesion|0]/100§!\nFood reserves: §Y[?auh_ww1_provisions|0]/100§!\nDebt obligations: §Y[?auh_ww1_debt|0]/6§!\nActive civilian projects: §Y[?auh_ww1_projects_active|0]/2§!\n\nFood shortages hamper production. Existing military crises continue to respond to the war situation; there is no automatic calendar collapse."
 AUH_ww1_diplomatic_accounts:0 "International Obligations"
 AUH_ww1_diplomatic_accounts_desc:0 "Both administrations must know the cost of external commitments."
 AUH_ww1_diplomatic_restraint:0 "Regional Accommodation"
 AUH_ww1_diplomatic_restraint_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_doctrine_lessons:0 "Learn from Operations"
 AUH_ww1_doctrine_lessons_desc:0 "Experience and temporary learning support the version 1.19 doctrine system; they do not replace combat."
 AUH_ww1_dual_war_cabinet:0 "Two Governments, One War Cabinet"
 AUH_ww1_dual_war_cabinet_desc:0 "Wartime coordination is temporary and can only be activated with both administrations in agreement. Immediate effect: +2% war support, +15 political power."
 AUH_ww1_dualism:0 "Renew Dualism"
 AUH_ww1_dualism_desc:0 "Preserving two centres of power requires a negotiated budget and retains contested privileges."
 AUH_ww1_dynastic_protocol:0 "Revised Dynastic Protocol"
 AUH_ww1_dynastic_protocol_desc:0 "Succession follows the situation of the imperial house. Civil reforms do not guarantee preventing the Sarajevo assassination."
 AUH_ww1_eastern_contingency:0 "The Eastern Contingency"
 AUH_ww1_eastern_contingency_desc:0 "Defensive planning remains relevant if Russia rejects an understanding. Immediate effect: +3 army experience, −15 political power."
 AUH_ww1_eastern_refugees:0 "Assist Eastern Refugees"
 AUH_ww1_eastern_refugees_desc:0 "Assistance consumes civilian capacity and helps sustain confidence, without refugee recruitment bonuses. Immediate effect: +3 provincial confidence, −2 food reserves."
 AUH_ww1_economic_coordination:0 "Coordinate the Two Economies"
 AUH_ww1_economic_coordination_desc:0 "An economic office coordinates priorities without conjuring instant factories. Immediate effect: +3 consent, +25 political power."
 AUH_ww1_economic_inventory:0 "Survey the Monarchy's Economy"
 AUH_ww1_economic_inventory_desc:0 "Bohemian industry and Hungarian agriculture are complementary, but answer to different administrations."
 AUH_ww1_economy:0 "The Common Economy"
 AUH_ww1_economy_desc:0 "Administrative consent: §Y[?auh_ww1_consent|0]/100§!\nProvincial confidence: §Y[?auh_ww1_cohesion|0]/100§!\nFood reserves: §Y[?auh_ww1_provisions|0]/100§!\nDebt obligations: §Y[?auh_ww1_debt|0]/6§!\nActive civilian projects: §Y[?auh_ww1_projects_active|0]/2§!\n\nFood shortages hamper production. Existing military crises continue to respond to the war situation; there is no automatic calendar collapse."
 AUH_ww1_electrical_workshops:0 "Electrical and Communications Workshops"
 AUH_ww1_electrical_workshops_desc:0 "Electrical research remains tied to the technologies of its period."
 AUH_ww1_emergency_shifts:0 "Emergency Shifts"
 AUH_ww1_emergency_shifts_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_escort_design:0 "Escort Designs"
 AUH_ww1_escort_design_desc:0 "Light-ship designs compete with research into larger hulls."
 AUH_ww1_factory_canteens:0 "Factory Canteens"
 AUH_ww1_factory_canteens_desc:0 "Feeding workers competes with other spending, but helps sustain a prolonged effort. Immediate effect: +4 food reserves, +2 provincial confidence."
 AUH_ww1_factory_inspection:0 "Inspect Factory Conditions"
 AUH_ww1_factory_inspection_desc:0 "Longer shifts may raise production temporarily, but take a toll on workers."
 AUH_ww1_fair_rationing:0 "Equitable Ration Distribution"
 AUH_ww1_fair_rationing_desc:0 "More regular distribution protects reserves, but still diverts resources from the war economy. Immediate effect: +4 food reserves, +0.5% stability."
 AUH_ww1_federal_common_army:0 "A Federal Common Army"
 AUH_ww1_federal_common_army_desc:0 "The constitution retains common defence, with funded training and supervised recruitment. Immediate effect: +4 army experience, +2 provincial confidence."
 AUH_ww1_federal_constitution:0 "Promulgate the Federal Constitution"
 AUH_ww1_federal_constitution_desc:0 "Ratification requires administrative and provincial support; the state's name reflects its constitutional change."
 AUH_ww1_federal_course:0 "Federal Army Course"
 AUH_ww1_federal_course_desc:0 "A 90-day course occupies one civilian factory, consumes 300 rifles and 30 support equipment and grants 6 experience. No divisions or aircraft are created."
 AUH_ww1_federal_tax_compact:0 "The Federal Tax Compact"
 AUH_ww1_federal_tax_compact_desc:0 "The federation must decide how much each province retains and how much funds common services."
 AUH_ww1_federal_war_cabinet:0 "Federal Emergency Cabinet"
 AUH_ww1_federal_war_cabinet_desc:0 "An emergency may coordinate production, but does not erase provincial rights. Immediate effect: +2% war support, +15 political power."
 AUH_ww1_federalism:0 "Prepare a Federal Monarchy"
 AUH_ww1_federalism_desc:0 "A federal compact is a plausible alternative, but faces aristocratic and Magyar opposition."
 AUH_ww1_field_telephones:0 "Field Telephones"
 AUH_ww1_field_telephones_desc:0 "Order transmission must be researched and issued to the troops."
 AUH_ww1_fire_control:0 "Fire-Control Procedures"
 AUH_ww1_fire_control_desc:0 "Better communications must reach the field through research and support equipment."
 AUH_ww1_fiscal_reserve:0 "Reserves for the Postwar Years"
 AUH_ww1_fiscal_reserve_desc:0 "Preparing debt repayment keeps peace from merely prolonging the fiscal emergency. Immediate effect: −1 debt level, −20 political power."
 AUH_ww1_fleet_cautious:0 "Fleet Preservation"
 AUH_ww1_fleet_cautious_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_fleet_course:0 "Fleet Exercises"
 AUH_ww1_fleet_course_desc:0 "A 90-day course occupies one civilian factory, consumes 0 rifles and 40 support equipment and grants 6 experience. No divisions or aircraft are created."
 AUH_ww1_fleet_gunnery:0 "Fleet Gunnery Exercises"
 AUH_ww1_fleet_gunnery_desc:0 "Exercises cost civilian capacity and support equipment; their experience can fund doctrine. Immediate effect: +3 navy experience."
 AUH_ww1_fleet_in_being:0 "Preserve the Battle Fleet"
 AUH_ww1_fleet_in_being_desc:0 "A cautious posture favours withdrawal and preservation, but reduces operational speed. Immediate effect: +1 provincial confidence, +2 navy experience."
 AUH_ww1_fleet_signalling:0 "Fleet Signalling"
 AUH_ww1_fleet_signalling_desc:0 "Signalling training provides experience for organising the fleet."
 AUH_ww1_food_pressure_1:0 "Food Reserves Under Pressure"
 AUH_ww1_food_pressure_1_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_food_pressure_2:0 "Critical Urban Supply"
 AUH_ww1_food_pressure_2_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_food_pressure_3:0 "Urban Supply Breakdown"
 AUH_ww1_food_pressure_3_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_foreign_programme:0 "A Foreign Policy with Limits"
 AUH_ww1_foreign_programme_desc:0 "Alliances and agreements will be reciprocal proposals with war and sovereignty conditions. Immediate effect: +20 political power."
 AUH_ww1_fortress_inspection:0 "Fortress Belt Inspected"
 AUH_ww1_fortress_inspection_desc:0 "Fortress garrisons and depots were inspected: +6% entrenchment speed, +2% supply consumption."
 AUH_ww1_front_crisis:0 "Front-Line Crisis"
 AUH_ww1_front_crisis_desc:0 "Spent reserves and broken plans: −5% army organisation and −5% planning speed."
 AUH_ww1_galician_autonomy:0 "Civil Autonomy in Galicia"
 AUH_ww1_galician_autonomy_desc:0 "Poles and Ruthenians need safeguards that survive mobilisation. Immediate effect: +1 building slot in Galicia (Kraków/Przemyśl), +2 provincial confidence, +2 food reserves."
 AUH_ww1_galician_oil:0 "Galician Oil"
 AUH_ww1_galician_oil_desc:0 "Local production reduces a limited vulnerability; it does not make the monarchy self-sufficient. Immediate effect: +4 oil in East Galicia (Drohobych), +1 infrastructure in East Galicia (Drohobych), +15 political power, +1 provincial confidence."
 AUH_ww1_galician_plan:0 "The Plan to Recover Galicia"
 AUH_ww1_galician_plan_desc:0 "Recovering territory depends on the current map; there will be no automatic victory over Russia. Immediate effect: +2 army experience, +10 command power."
 AUH_ww1_galician_rail:0 "The Galician Railway"
 AUH_ww1_galician_rail_desc:0 "A better corridor moves reserves east without raising the speed of every division. Immediate effect: level 2 railway between Central Hungary (Budapest) and Galicia (Kraków/Przemyśl), +2 provincial confidence."
 AUH_ww1_german_exchange:0 "Fund the German Military Commission"
 AUH_ww1_german_exchange_desc:0 "One civilian factory for 90 days generates 8 land experience if Germany accepted the commission and remains at peace with us."
 AUH_ww1_german_staff_exchange:0 "Staff Exchange with Germany"
 AUH_ww1_german_staff_exchange_desc:0 "The exchange can occur only if Germany agreed and we remain allied or at peace with each other. Immediate effect: +3 army experience."
 AUH_ww1_german_supply_protocol:0 "Allied Supply Protocol"
 AUH_ww1_german_supply_protocol_desc:0 "Supply coordination supports research; it does not transfer German equipment without permission."
 AUH_ww1_governors_conference:0 "Convene the Provincial Governors"
 AUH_ww1_governors_conference_desc:0 "A 60-day conference grants +4 provincial confidence and −1 consent, as Budapest views the meeting with suspicion."
 AUH_ww1_grain_purchase:0 "Purchase and Distribute Hungarian Grain"
 AUH_ww1_grain_purchase_desc:0 "Two civilian factories for 60 days purchase and transport grain: +10 food reserves and −2 consent. The agricultural region must remain under control."
 AUH_ww1_granaries:0 "Grain Warehouses"
 AUH_ww1_granaries_desc:0 "Warehouses provide a buffer against disruption, without infinite supplies. Immediate effect: +6 food reserves, −20 political power."
 AUH_ww1_harvest_leave:0 "Contingents Released for Harvest"
 AUH_ww1_harvest_leave_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_harvest_leave_grant:0 "Grant Harvest Leave"
 AUH_ww1_harvest_leave_grant_desc:0 "Part of the contingent receives leave: reserves rise by 8 after 90 days, with slower mobilisation during the season."
 AUH_ww1_honved_contract:0 "Fulfil the Honvéd Contract"
 AUH_ww1_honved_contract_desc:0 "A 90-day course occupies one civilian factory, consumes 300 rifles and 30 support equipment and grants 6 experience. No divisions or aircraft are created."
 AUH_ww1_honved_course:0 "Honvéd Course"
 AUH_ww1_honved_course_desc:0 "A 90-day course occupies one civilian factory, consumes 300 rifles and 20 support equipment and grants 5 experience. No divisions or aircraft are created."
 AUH_ww1_honved_safeguards:0 "Honvéd Safeguards"
 AUH_ww1_honved_safeguards_desc:0 "The Hungarian contingent will be funded through training and equipment contracts, rather than appearing from nothing. Immediate effect: +3 consent, −1 provincial confidence, +2 army experience."
 AUH_ww1_honved_training:0 "Honvéd Training"
 AUH_ww1_honved_training_desc:0 "Hungarian training depends on the consent of the Budapest administration. Immediate effect: +3 army experience, +2 consent."
 AUH_ww1_hungarian_harvest:0 "The Hungarian Harvest"
 AUH_ww1_hungarian_harvest_desc:0 "Urban reserves depend on purchasing and transporting grain, not merely owning farmland. Immediate effect: +6 food reserves, −1 consent."
 AUH_ww1_industrial_training:0 "Fund Worker Training"
 AUH_ww1_industrial_training_desc:0 "One civilian factory for 90 days raises confidence by 3 and grants one 15% industrial research bonus, without an ahead-of-time reduction."
 AUH_ww1_infantry_field_manual:0 "A Common Infantry Field Manual"
 AUH_ww1_infantry_field_manual_desc:0 "A shared manual provides experience for reorganising existing units."
 AUH_ww1_inspect_fortress_belt:0 "Inspect the Fortress Belt"
 AUH_ww1_inspect_fortress_belt_desc:0 "In war, one civilian factory for 45 days checks garrisons and depots: +6% entrenchment speed and +2% supply consumption for 120 days."
 AUH_ww1_inst_investment_board:0 "Investment Board"
 AUH_ww1_inst_investment_board_desc:0 "Credit and contracts coordinated between Vienna and Budapest: +2% industrial capacity, with +1% consumer goods demanded."
 AUH_ww1_inst_pilot_school:0 "Pilot School"
 AUH_ww1_inst_pilot_school_desc:0 "A regular flying course speeds training: +5% air experience gain."
 AUH_ww1_inst_sapper_school:0 "Sapper School"
 AUH_ww1_inst_sapper_school_desc:0 "Military engineers prepare better defensive positions: +5% maximum entrenchment, at a small civilian cost."
 AUH_ww1_inst_staff_college:0 "Staff College"
 AUH_ww1_inst_staff_college_desc:0 "Vienna-trained officers learn more from the campaign and plan slightly faster: +5% army experience gain and +3% planning speed."
 AUH_ww1_investment_board:0 "An Investment Board"
 AUH_ww1_investment_board_desc:0 "The board authorises limited projects; the player must commit civilian capacity to carry them out. Immediate effect: creates the “Investment Board” institution, −20 political power."
 AUH_ww1_investment_review:0 "Investment Review"
 AUH_ww1_isonzo_plan:0 "Plan the Defence of the Isonzo"
 AUH_ww1_isonzo_plan_desc:0 "The sector receives preparation only during war with Italy and while the coast remains under our control. Immediate effect: +2 army experience, +10 command power."
 AUH_ww1_italian_consultations:0 "Hold an Adriatic Consultation"
 AUH_ww1_italian_consultations_desc:0 "A 60-day consultation grants 3 confidence if the pact with Rome remains valid; it does not prevent Italy changing its policy."
 AUH_ww1_italian_contingency:0 "Prepare for a Break with Italy"
 AUH_ww1_italian_contingency_desc:0 "Preparation is activated only during an actual war, consuming support equipment. Immediate effect: +3 army experience, +1% war support, −1 provincial confidence."
 AUH_ww1_italian_minorities:0 "Rights of Italian Communities"
 AUH_ww1_italian_minorities_desc:0 "Limited civil rights cost administrative capacity and do not cancel Italian claims. Immediate effect: +2 provincial confidence."
 AUH_ww1_joint_budget:0 "Ratify the Common Budget"
 AUH_ww1_joint_budget_desc:0 "An agreed contribution reduces budget obstruction without abolishing the duplicated administration. Immediate effect: +2 consent, −20 political power."
 AUH_ww1_junior_officers:0 "Career Junior Officers"
 AUH_ww1_junior_officers_desc:0 "A professional corps improves communication and replaces the previous reform stage. Immediate effect: +3 army experience, +1 provincial confidence."
 AUH_ww1_karl_foreign_review:0 "Karl Reviews the War Aims"
 AUH_ww1_karl_foreign_review_desc:0 "The new sovereign may limit aims and open negotiations at a political prestige cost."
 AUH_ww1_karl_name:0 "Karl I"
 AUH_ww1_labour_arbitration:0 "Labour Arbitration"
 AUH_ww1_labour_arbitration_desc:0 "Negotiating with workers reduces administrative risk at the cost of a share of maximum output. Immediate effect: +3 provincial confidence, +1% stability."
 AUH_ww1_labour_compact:0 "Labour Arbitration Compact"
 AUH_ww1_labour_compact_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_labour_mediation:0 "Fund Labour Mediation"
 AUH_ww1_labour_mediation_desc:0 "A 90-day mediation restores 6 confidence points at a civilian capacity and influence cost."
 AUH_ww1_landwehr_course:0 "Landwehr Course"
 AUH_ww1_landwehr_course_desc:0 "A 90-day course occupies one civilian factory, consumes 300 rifles and 20 support equipment and grants 5 experience. No divisions or aircraft are created."
 AUH_ww1_landwehr_training:0 "Landwehr Training"
 AUH_ww1_landwehr_training_desc:0 "Training territorial forces requires equipment drawn from stocks and civilian capacity. Immediate effect: +3 army experience, +1 consent."
 AUH_ww1_language_rights:0 "Civil Language Rights"
 AUH_ww1_language_rights_desc:0 "Recognising provincial languages strengthens local confidence, but meets resistance from those fearing lost influence. Immediate effect: +1% stability."
 AUH_ww1_languages_reformed:0 "Reformed Military Communications"
 AUH_ww1_languages_reformed_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_languages_staff:0 "A Common Officer Corps"
 AUH_ww1_languages_staff_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_languages_trained:0 "Regimental Instructors"
 AUH_ww1_languages_trained_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_languages_untrained:0 "Insufficient Regimental Communications"
 AUH_ww1_languages_untrained_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_logistics_organised:0 "Common Railway Dispatch"
 AUH_ww1_logistics_organised_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_lohner_workshops:0 "The Lohner Workshops"
 AUH_ww1_lohner_workshops_desc:0 "Aeronautical research receives limited assistance; modern aircraft remain subject to technological dates."
 AUH_ww1_luftfahrtruppen:0 "Organise the Luftfahrtruppen"
 AUH_ww1_luftfahrtruppen_desc:0 "An emerging air service requires training, equipment and missions suited to its period."
 AUH_ww1_machine_gun_sections:0 "Machine Gun Sections"
 AUH_ww1_machine_gun_sections_desc:0 "Machine guns are researched as infantry equipment without a general attack bonus."
 AUH_ww1_mannlicher_standards:0 "Standardise the Mannlicher Rifles"
 AUH_ww1_mannlicher_standards_desc:0 "Rifle inspection assists research and avoids supplying weapons without production."
 AUH_ww1_medical_services:0 "Field Medical Services"
 AUH_ww1_medical_services_desc:0 "Field medicine reduces vulnerabilities through researched and equipped companies."
 AUH_ww1_merchant_course:0 "Merchant Marine Course"
 AUH_ww1_merchant_course_desc:0 "A 90-day course occupies one civilian factory, consumes 0 rifles and 20 support equipment and grants 4 experience. No divisions or aircraft are created."
 AUH_ww1_merchant_training:0 "Merchant Marine Training"
 AUH_ww1_merchant_training_desc:0 "Training generates naval experience at a civilian cost; the player still builds convoys. Immediate effect: +3 navy experience, +1 food reserves."
 AUH_ww1_military:0 "Preparing the Fronts"
 AUH_ww1_military_desc:0 "Administrative consent: §Y[?auh_ww1_consent|0]/100§!\nProvincial confidence: §Y[?auh_ww1_cohesion|0]/100§!\nFood reserves: §Y[?auh_ww1_provisions|0]/100§!\nDebt obligations: §Y[?auh_ww1_debt|0]/6§!\nActive civilian projects: §Y[?auh_ww1_projects_active|0]/2§!\n\nFood shortages hamper production. Existing military crises continue to respond to the war situation; there is no automatic calendar collapse."
 AUH_ww1_military_programme:0 "A Sustainable Military Programme"
 AUH_ww1_military_programme_desc:0 "The monarchy must choose its priority among equipment, reserves and coordination."
 AUH_ww1_mission_carpathians:0 "Hold the Carpathian Sector: objective"
 AUH_ww1_mission_carpathians_desc:0 "Preparing this mission costs 40 political power, 30 command power, 30 artillery and 50 support equipment. The deadline is 90 days. Hold state 73. Preparation only improves planning or entrenchment speed by 8%; it grants no combat strength. Failure lowers war support by 2 percentage points and slows planning for 45 days."
 AUH_ww1_mission_galicia:0 "Recover Eastern Galicia: objective"
 AUH_ww1_mission_galicia_desc:0 "Preparing this mission costs 40 political power, 30 command power, 30 artillery and 50 support equipment. The deadline is 90 days. Capture state 91. Preparation only improves planning or entrenchment speed by 8%; it grants no combat strength. Failure lowers war support by 2 percentage points and slows planning for 45 days."
 AUH_ww1_mission_isonzo:0 "Hold the Isonzo Sector: objective"
 AUH_ww1_mission_isonzo_desc:0 "Preparing this mission costs 40 political power, 30 command power, 30 artillery and 50 support equipment. The deadline is 90 days. Hold state 736. Preparation only improves planning or entrenchment speed by 8%; it grants no combat strength. Failure lowers war support by 2 percentage points and slows planning for 45 days."
 AUH_ww1_mission_serbia:0 "Limited Offensive in Serbia: objective"
 AUH_ww1_mission_serbia_desc:0 "Preparing this mission costs 40 political power, 30 command power, 30 artillery and 50 support equipment. The deadline is 90 days. Capture state 107. Preparation only improves planning or entrenchment speed by 8%; it grants no combat strength. Failure lowers war support by 2 percentage points and slows planning for 45 days."
 AUH_ww1_mobilisation_tables:0 "Revised Mobilisation Tables"
 AUH_ww1_mobilisation_tables_desc:0 "Reservists require rifles, officers and time; the plan does not create free divisions. Immediate effect: +3 army experience, −15 political power."
 AUH_ww1_monarchy_future:0 "The Future of the Danubian State"
 AUH_ww1_monarchy_future_desc:0 "The campaign's outcome depends on the territory, constitution and social support preserved by the player."
 AUH_ww1_montenegrin_channel:0 "A Channel to Montenegro"
 AUH_ww1_montenegrin_channel_desc:0 "A non-aggression pact exists only if both sides agree."
 AUH_ww1_moravian_compromise:0 "Extend the Moravian Compromise"
 AUH_ww1_moravian_compromise_desc:0 "The Moravian precedent offers a limited model of linguistic accommodation. Immediate effect: +1 building slot in Moravia, +2 provincial confidence, +1 consent."
 AUH_ww1_mountain_cadres:0 "Train Mountain Cadres"
 AUH_ww1_mountain_cadres_desc:0 "One civilian factory for 90 days and 30 support equipment fund the Alpine school: +4 army experience. No division is created."
 AUH_ww1_municipal_taxation:0 "Municipal Tax Agreements"
 AUH_ww1_municipal_taxation_desc:0 "Negotiated taxation strengthens confidence in funding common services."
 AUH_ww1_naval_artillery:0 "Škoda Naval Artillery"
 AUH_ww1_naval_artillery_desc:0 "The contract assists naval artillery research without delivering completed battleships."
 AUH_ww1_naval_lessons:0 "Lessons from Adriatic Operations"
 AUH_ww1_naval_lessons_desc:0 "Naval learning follows the current doctrine system and lasts for a defined period."
 AUH_ww1_naval_patrols:0 "Train Coastal Patrols"
 AUH_ww1_naval_patrols_desc:0 "Experience comes from patrol exercises without automatically revealing the enemy fleet."
 AUH_ww1_naval_programme:0 "A Limited Naval Programme"
 AUH_ww1_naval_programme_desc:0 "The navy competes with the army for funding, research and industrial capacity. Immediate effect: +3 navy experience, −20 political power."
 AUH_ww1_naval_refit_priority:0 "Naval Refitting Priority"
 AUH_ww1_naval_refit_priority_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_naval_repair:0 "Organise Naval Workshops"
 AUH_ww1_naval_repair_desc:0 "Refitting receives a limited improvement at the cost of part of shipbuilding capacity. Immediate effect: +2 navy experience."
 AUH_ww1_naval_spares:0 "Naval Spare Parts"
 AUH_ww1_naval_spares_course:0 "Naval Maintenance Course"
 AUH_ww1_naval_spares_course_desc:0 "A 90-day course occupies one civilian factory, consumes 0 rifles and 30 support equipment and grants 4 experience. No divisions or aircraft are created."
 AUH_ww1_naval_spares_desc:0 "Maintenance courses depend on material drawn from stocks. Immediate effect: +2 navy experience, −10 political power."
 AUH_ww1_naval_training:0 "Fleet Training"
 AUH_ww1_naval_unrest:0 "Naval Unrest"
 AUH_ww1_naval_unrest_desc:0 "Discontented crews delay sorties and refits: −5% naval speed and −10% refit speed."
 AUH_ww1_observation_sections:0 "Gunnery Observation Sections"
 AUH_ww1_observation_sections_desc:0 "Observers require training to connect reconnaissance and fire."
 AUH_ww1_offensive_audit:0 "Audit Conrad's Plans"
 AUH_ww1_offensive_audit_desc:0 "The staff may prioritise offensives or preserve reserves. The choice replaces the previous institution."
 AUH_ww1_offensive_staff:0 "Offensive Staff"
 AUH_ww1_offensive_staff_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_ombudsman_hearing:0 "Address Ombudsman Complaints"
 AUH_ww1_ombudsman_hearing_desc:0 "Resolving complaints costs influence and restores confidence. It does not automatically change the military situation."
 AUH_ww1_operation_carpathians:0 "Carpathian Preparation"
 AUH_ww1_operation_carpathians_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_operation_exhausted:0 "Preparation Spent Without Results"
 AUH_ww1_operation_exhausted_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_operation_galicia:0 "Galician Front Preparation"
 AUH_ww1_operation_galicia_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_operation_isonzo:0 "Isonzo Preparation"
 AUH_ww1_operation_isonzo_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_operation_serbia:0 "Serbian Front Preparation"
 AUH_ww1_operation_serbia_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_operational_lessons:0 "Operational Learning"
 AUH_ww1_pack_artillery:0 "Pack Artillery in the Alps"
 AUH_ww1_pack_artillery_desc:0 "Mountain transport supports specialist training without turning the entire army into elite troops."
 AUH_ww1_peace_administration:0 "Common Peacetime Services"
 AUH_ww1_peace_administration_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_peace_credit:0 "Credit for Reconstruction"
 AUH_ww1_peace_credit_desc:0 "Credit may be contracted or refused, with real debt in the country's administration. Immediate effect: +20 political power."
 AUH_ww1_peace_credit_line:0 "Contract Reconstruction Credit"
 AUH_ww1_peace_credit_line_desc:0 "A credit line speeds construction by 3% for 180 days and creates a debt obligation. Credit may be declined by leaving the decision unused."
 AUH_ww1_peace_diplomacy:0 "Diplomacy for Peace"
 AUH_ww1_peace_diplomacy_desc:0 "Civil diplomacy remains available after the war, subject to other countries' sovereignty. Immediate effect: +1% stability, +25 political power."
 AUH_ww1_peacetime_elections:0 "Peacetime Political Representation"
 AUH_ww1_peacetime_elections_desc:0 "The government must choose between binding elections and consultative representation; the choice changes the regime and its rules."
 AUH_ww1_pilot_course:0 "Pilot Course"
 AUH_ww1_pilot_course_desc:0 "A 90-day course occupies one civilian factory, consumes 0 rifles and 30 support equipment and grants 6 experience. No divisions or aircraft are created."
 AUH_ww1_pilot_school:0 "The Pilot School"
 AUH_ww1_pilot_school_desc:0 "Pilot courses consume support equipment and civilian capacity. Immediate effect: creates the “Pilot School” institution, +3 air experience."
 AUH_ww1_pilsen_tooling:0 "Toolmaking in Plzeň"
 AUH_ww1_pilsen_tooling_desc:0 "Expanding a factory requires sustained civilian investment in Bohemia. Immediate effect: +1 military factory and building slot in Bohemia (Plzeň/Prague), one 10% research bonus (artillery)."
 AUH_ww1_pola_maintenance:0 "Maintenance at Pola"
 AUH_ww1_pola_maintenance_desc:0 "Workshops study maintenance; starting ships are not replaced by modern hulls."
 AUH_ww1_pola_review:0 "Review the Fleet at Pola"
 AUH_ww1_pola_review_desc:0 "In peacetime, a 30-day review and exercises grant +4 navy experience."
 AUH_ww1_polytechnic_network:0 "The Polytechnic Network"
 AUH_ww1_polytechnic_network_desc:0 "Technical institutes study production and maintenance without accelerating all research indefinitely."
 AUH_ww1_porte_contacts:0 "Mission to Constantinople"
 AUH_ww1_postwar_constitution:0 "Revisit the Constitutional Compact"
 AUH_ww1_postwar_constitution_desc:0 "The war experience may justify retaining the monarchy, extending federation or convening a republican assembly."
 AUH_ww1_postwar_inventory:0 "The Postwar Inventory"
 AUH_ww1_postwar_inventory_desc:0 "Reconstruction begins with actual peace and the accumulated cost of the campaign."
 AUH_ww1_prague_vienna_rail:0 "The Prague–Vienna Railway"
 AUH_ww1_prague_vienna_rail_desc:0 "Bohemian industry only supplies the armies if freight reaches distribution centres. Immediate effect: level 2 railway between Bohemia (Plzeň/Prague) and Lower Austria (Vienna), +2 provincial confidence."
 AUH_ww1_prepare_carpathians:0 "Hold the Carpathian Sector"
 AUH_ww1_prepare_carpathians_desc:0 "Preparing this mission costs 40 political power, 30 command power, 30 artillery and 50 support equipment. The deadline is 90 days. Hold state 73. Preparation only improves planning or entrenchment speed by 8%; it grants no combat strength. Failure lowers war support by 2 percentage points and slows planning for 45 days."
 AUH_ww1_prepare_galicia:0 "Recover Eastern Galicia"
 AUH_ww1_prepare_galicia_desc:0 "Preparing this mission costs 40 political power, 30 command power, 30 artillery and 50 support equipment. The deadline is 90 days. Capture state 91. Preparation only improves planning or entrenchment speed by 8%; it grants no combat strength. Failure lowers war support by 2 percentage points and slows planning for 45 days."
 AUH_ww1_prepare_isonzo:0 "Hold the Isonzo Sector"
 AUH_ww1_prepare_isonzo_desc:0 "Preparing this mission costs 40 political power, 30 command power, 30 artillery and 50 support equipment. The deadline is 90 days. Hold state 736. Preparation only improves planning or entrenchment speed by 8%; it grants no combat strength. Failure lowers war support by 2 percentage points and slows planning for 45 days."
 AUH_ww1_prepare_serbia:0 "Limited Offensive in Serbia"
 AUH_ww1_prepare_serbia_desc:0 "Preparing this mission costs 40 political power, 30 command power, 30 artillery and 50 support equipment. The deadline is 90 days. Capture state 107. Preparation only improves planning or entrenchment speed by 8%; it grants no combat strength. Failure lowers war support by 2 percentage points and slows planning for 45 days."
 AUH_ww1_price_audit:0 "Inspect Municipal Distribution"
 AUH_ww1_price_audit_desc:0 "An inspection restores 3 reserve and 2 confidence points, with administrative work for 90 days."
 AUH_ww1_price_inspection:0 "Price Inspection"
 AUH_ww1_price_inspection_desc:0 "Combating distribution abuses requires personnel and influence; inspections do not create grain. Immediate effect: +3 food reserves, +1 consent."
 AUH_ww1_project_adriatic_rail:0 "Expand the Adriatic Corridor"
 AUH_ww1_project_adriatic_rail_desc:0 "Two civilian factories are committed for 180 days. Both regions must remain under our control. The railway follows allied territory."
 AUH_ww1_project_adriatic_supply:0 "Improve the Connection Between Bases"
 AUH_ww1_project_adriatic_supply_desc:0 "Two civilian factories are committed for 180 days. Both regions must remain under our control. The railway follows allied territory."
 AUH_ww1_project_airfield:0 "Expand Austrian Airfields"
 AUH_ww1_project_airfield_desc:0 "Two civilian factories for 120 days expand the Austrian air base by one level."
 AUH_ww1_project_alpine_routes:0 "Improve Alpine Routes"
 AUH_ww1_project_alpine_routes_desc:0 "Two civilian factories are committed for 120 days. Completes one infrastructure level; losing the region cancels the project."
 AUH_ww1_project_banat:0 "Banat Municipal Council"
 AUH_ww1_project_banat_desc:0 "The regional administration receives permanent civilian autonomy: resource extraction falls in return for better services and local support. The regional benefit applies only to Austria-Hungary."
 AUH_ww1_project_bohemia:0 "Bohemian Provincial Council"
 AUH_ww1_project_bohemia_desc:0 "The regional administration receives permanent civilian autonomy: resource extraction falls in return for better services and local support. The regional benefit applies only to Austria-Hungary."
 AUH_ww1_project_bosnia:0 "Civil Guarantees in Bosnia"
 AUH_ww1_project_bosnia_desc:0 "The regional administration receives permanent civilian autonomy: resource extraction falls in return for better services and local support. The regional benefit applies only to Austria-Hungary."
 AUH_ww1_project_bosnian_rail:0 "Expand Access to Bosnia"
