 AUH_ww1_project_vienna_budapest:0 "Double the Vienna–Budapest Connection"
 AUH_ww1_project_vienna_budapest_desc:0 "Two civilian factories are committed for 180 days. Both regions must remain under our control. The railway follows allied territory."
 AUH_ww1_project_vitkovice:0 "Invest in Vítkovice Facilities"
 AUH_ww1_project_vitkovice_desc:0 "Two civilian factories for 180 days develop four steel units in Moravia."
 AUH_ww1_project_workers_housing:0 "Industrial Housing Works"
 AUH_ww1_project_workers_housing_desc:0 "Two civilian factories are committed for 120 days. Completes one infrastructure level; losing the region cancels the project."
 AUH_ww1_projects:0 "Works and Services of the Monarchy"
 AUH_ww1_projects_desc:0 "Administrative consent: §Y[?auh_ww1_consent|0]/100§!\nProvincial confidence: §Y[?auh_ww1_cohesion|0]/100§!\nFood reserves: §Y[?auh_ww1_provisions|0]/100§!\nDebt obligations: §Y[?auh_ww1_debt|0]/6§!\nActive civilian projects: §Y[?auh_ww1_projects_active|0]/2§!\n\nFood shortages hamper production. Existing military crises continue to respond to the war situation; there is no automatic calendar collapse."
 AUH_ww1_provincial_council:0 "Provincial Civil Council"
 AUH_ww1_provincial_council_desc:0 "Administrative autonomy with lower resource extraction and more capacity for local services."
 AUH_ww1_provincial_hearings:0 "Hold Provincial Hearings"
 AUH_ww1_provincial_hearings_desc:0 "A 60-day hearing raises confidence by 5 points at a political influence cost."
 AUH_ww1_provincial_ombudsman:0 "A Provincial Ombudsman"
 AUH_ww1_provincial_ombudsman_desc:0 "A permanent complaints channel reduces the distance between administrations and their subjects. Immediate effect: +3 provincial confidence, +1% stability."
 AUH_ww1_provincial_petitions:0 "Provincial Right of Petition"
 AUH_ww1_provincial_petitions_desc:0 "Recognising petitions partly offsets the exclusion of nationalities at a cost to government influence."
 AUH_ww1_przemysl_supply:0 "Supply Przemyśl"
 AUH_ww1_przemysl_supply_desc:0 "The fortress depends on a retained supply corridor; the focus does not prevent its fall. Immediate effect: +2 land forts in Galicia (Kraków/Przemyśl), −15 political power, +2 army experience."
 AUH_ww1_public_accounts:0 "Publish the Common Accounts"
 AUH_ww1_public_accounts_desc:0 "Transparent accounts help negotiate new contributions and limit executive freedom."
 AUH_ww1_quota_revision:0 "Revise the Economic Quotas"
 AUH_ww1_quota_revision_desc:0 "A stable budget still costs a permanent share of civilian consumption. Immediate effect: +3 consent, −25 political power."
 AUH_ww1_railway_dispatch:0 "Unified Railway Dispatch"
 AUH_ww1_railway_dispatch_desc:0 "Common timetables replace improvisation; supply consumption savings remain limited. Immediate effect: +2 food reserves, −15 political power."
 AUH_ww1_ratify_federation:0 "Resubmit the Federal Constitution"
 AUH_ww1_ratify_federation_desc:0 "Ratification requires consent of 50 and confidence of 60. The vote can be refused."
 AUH_ww1_ratify_trialism:0 "Resubmit the Trialist Charter"
 AUH_ww1_ratify_trialism_desc:0 "A new vote allows ratification once consent reaches 45 and confidence reaches 50."
 AUH_ww1_ration_distribution:0 "Reinforce Ration Distribution"
 AUH_ww1_ration_distribution_desc:0 "One civilian factory for 60 days improves distribution: +5 reserves. Equitable distribution must have been adopted."
 AUH_ww1_rationing:0 "Common Food Distribution"
 AUH_ww1_rationing_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_reconnaissance_cavalry:0 "Reconnaissance Cavalry"
 AUH_ww1_reconnaissance_cavalry_desc:0 "Cavalry retains a reconnaissance role without becoming an anachronistic breakthrough force."
 AUH_ww1_reconstruction_board:0 "A Reconstruction Board"
 AUH_ww1_reconstruction_board_desc:0 "The board unlocks territorial projects that can restore services and adapt the peacetime budget. Immediate effect: +40 political power, +2 consent."
 AUH_ww1_reconstruction_credit:0 "Temporary Reconstruction Credit"
 AUH_ww1_reconstruction_credit_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_refugee_assistance:0 "Fund Refugee Assistance"
 AUH_ww1_refugee_assistance_desc:0 "Two civilian factories for 90 days provide assistance and restore 5 confidence. There is no free refugee recruitment."
 AUH_ww1_regimental_languages:0 "Instructors in Regimental Languages"
 AUH_ww1_regimental_languages_desc:0 "Language training reduces part of the opening communication penalty, with institutional costs. Immediate effect: +3 army experience."
 AUH_ww1_regional_defence:0 "Defence by Regional Sectors"
 AUH_ww1_regional_defence_desc:0 "Sectors receive temporary preparation and territorial-control objectives, with failure possible. Immediate effect: +2 provincial confidence, +2 army experience."
 AUH_ww1_regional_reconstruction:0 "Regional Reconstruction"
 AUH_ww1_regional_reconstruction_desc:0 "Regional recovery requires retained territory and completed civilian works. Immediate effect: +3 provincial confidence, +3 food reserves."
 AUH_ww1_rehabilitation_centres:0 "Rehabilitation Centres"
 AUH_ww1_rehabilitation_centres_desc:0 "Reintegrating survivors and wounded veterans is a civilian obligation without permanent military bonuses. Immediate effect: +3 provincial confidence, +0.5% stability."
 AUH_ww1_renew_albanian_assistance:0 "Reopen: civil assistance"
 AUH_ww1_renew_albanian_assistance_desc:0 "After a refusal, the delegation may resubmit the proposal. The recipient retains the right to refuse; sending costs another 35 political power."
 AUH_ww1_renew_german_commission:0 "Reopen: joint military commission"
 AUH_ww1_renew_german_commission_desc:0 "After a refusal, the delegation may resubmit the proposal. The recipient retains the right to refuse; sending costs another 35 political power."
 AUH_ww1_renew_italian_consultation:0 "Reopen: Adriatic consultations"
 AUH_ww1_renew_italian_consultation_desc:0 "After a refusal, the delegation may resubmit the proposal. The recipient retains the right to refuse; sending costs another 35 political power."
 AUH_ww1_renew_montenegrin_pact:0 "Reopen: non-aggression pact"
 AUH_ww1_renew_montenegrin_pact_desc:0 "After a refusal, the delegation may resubmit the proposal. The recipient retains the right to refuse; sending costs another 35 political power."
 AUH_ww1_renew_romanian_grain:0 "Reopen: grain contract"
 AUH_ww1_renew_romanian_grain_desc:0 "After a refusal, the delegation may resubmit the proposal. The recipient retains the right to refuse; sending costs another 35 political power."
 AUH_ww1_renew_russian_consultation:0 "Reopen: diplomatic consultations"
 AUH_ww1_renew_russian_consultation_desc:0 "After a refusal, the delegation may resubmit the proposal. The recipient retains the right to refuse; sending costs another 35 political power."
 AUH_ww1_renew_serbian_trade:0 "Reopen: trade normalisation"
 AUH_ww1_renew_serbian_trade_desc:0 "After a refusal, the delegation may resubmit the proposal. The recipient retains the right to refuse; sending costs another 35 political power."
 AUH_ww1_renew_sixtus_channel:0 "Reopen: mediation through the Sixtus channel"
 AUH_ww1_renew_sixtus_channel_desc:0 "After a refusal, the delegation may resubmit the proposal. The recipient retains the right to refuse; sending costs another 35 political power."
 AUH_ww1_renounce_annexations:0 "Renounce Wartime Annexations"
 AUH_ww1_renounce_annexations_desc:0 "Renunciation helps legitimise internal negotiation, but reduces support for continuing the war."
 AUH_ww1_repay_debt:0 "Repay Common Obligations"
 AUH_ww1_repay_debt_desc:0 "Three civilian factories for 180 days and 70 political power repay one debt level. Debt service falls according to the thresholds shown by the spirit."
 AUH_ww1_replacement_depots:0 "Replacement Depots"
 AUH_ww1_replacement_depots_desc:0 "The final reform removes the initial communication penalty without turning the army into an exceptional force. Immediate effect: +2 army experience, +1 provincial confidence."
 AUH_ww1_replanned_deployment:0 "Replanned Deployment"
 AUH_ww1_replanned_deployment_desc:0 "Concentration plans were rewritten after the Redl affair: −6% planning speed, +4% entrenchment speed."
 AUH_ww1_research_program:0 "Monarchy Research Programme"
 AUH_ww1_reserve_template:0 "Reserve Infantry Organisation"
 AUH_ww1_reserve_template_desc:0 "The new organisation offers a smaller reserve division which the player must still recruit and equip."
 AUH_ww1_reserve_training:0 "Train Reserve Cadres"
 AUH_ww1_reserve_training_desc:0 "A 90-day course occupies one civilian factory, consumes 400 rifles and 20 support equipment and grants 6 experience. No divisions or aircraft are created."
 AUH_ww1_rest_rotation:0 "Organise Rest and Rotation"
 AUH_ww1_rest_rotation_desc:0 "Two civilian factories for 60 days organise transport and rest: +5 confidence, with slower training during the period."
 AUH_ww1_romanian_grain:0 "Romanian Grain Contracts"
 AUH_ww1_romanian_grain_desc:0 "Purchases require an active agreement, peace and civilian transport capacity. Immediate effect: +4 food reserves."
 AUH_ww1_romanian_purchase:0 "Execute the Romanian Grain Contract"
 AUH_ww1_romanian_purchase_desc:0 "Two civilian factories for 60 days add 8 food reserves. The contract ends during war with Romania or if it disappears."
 AUH_ww1_rome_channel:0 "Talks with Rome"
 AUH_ww1_rome_channel_desc:0 "Rome may accept a consultation pact or refuse. The pact does not guarantee permanent neutrality."
 AUH_ww1_rotation:0 "Unit Rotation"
 AUH_ww1_rotation_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_rural_exemptions:0 "Seasonal Agricultural Exemptions"
 AUH_ww1_rural_exemptions_desc:0 "Releasing part of the contingent for harvest carries a temporary mobilisation cost. Immediate effect: +3 food reserves, −1% war support."
 AUH_ww1_russian_channel:0 "A Russian Diplomatic Channel"
 AUH_ww1_russian_channel_desc:0 "A consultation pact offers room for prewar negotiation, with refusal possible."
 AUH_ww1_ruthenian_schools:0 "Ruthenian Schools"
 AUH_ww1_ruthenian_schools_desc:0 "Funding services in the local language builds confidence at a real administrative cost. Immediate effect: +1 building slot in Ruthenia/Stanislau, +3 provincial confidence, −1 consent."
 AUH_ww1_sapper_school:0 "The Sapper School"
 AUH_ww1_sapper_school_desc:0 "Sappers require research and equipment to support real divisions. Immediate effect: creates the “Sapper School” institution."
 AUH_ww1_sarajevo_services:0 "Public Services in Sarajevo"
 AUH_ww1_sarajevo_services_desc:0 "Civil investment strengthens administration without promising to eliminate nationalism. Immediate effect: +1 infrastructure in Bosnia (Sarajevo), +3 provincial confidence, −15 political power."
 AUH_ww1_seaplane_trials:0 "Seaplane Trials"
 AUH_ww1_seaplane_trials_desc:0 "Maritime aviation receives period-appropriate research without modern aircraft carriers."
 AUH_ww1_sector_training:0 "Sector Command Instruction"
 AUH_ww1_seitz_name:0 "Karl Seitz"
 AUH_ww1_serbian_trade:0 "Execute Serbian Trade Normalisation"
 AUH_ww1_serbian_trade_desc:0 "One civilian factory for 60 days organises civilian purchases and adds 4 food reserves. Normalisation ends during war with Serbia."
 AUH_ww1_service_allied_liaison:0 "Fund Liaison with the Allied Front"
 AUH_ww1_service_allied_liaison_desc:0 "The service requires 40 political power, 1 civilian factory and 90 days. Its effect arrives only when work finishes."
 AUH_ww1_service_artillery_supply:0 "Prepare Artillery Depots"
 AUH_ww1_service_artillery_supply_desc:0 "The service requires 35 political power, 1 civilian factory and 60 days. Its effect arrives only when work finishes. It consumes 20 artillery and 30 support equipment on commissioning."
 AUH_ww1_service_defensive_sectors:0 "Train Sector Defence Commands"
 AUH_ww1_service_defensive_sectors_desc:0 "The service requires 40 political power, 1 civilian factory and 90 days. Its effect arrives only when work finishes."
 AUH_ww1_service_eastern_contingency:0 "Rehearse the Eastern Contingency"
 AUH_ww1_service_eastern_contingency_desc:0 "The service requires 35 political power, 1 civilian factory and 60 days. Its effect arrives only when work finishes."
 AUH_ww1_service_economic_coordination:0 "Coordinate Common Statistics"
 AUH_ww1_service_economic_coordination_desc:0 "The service requires 35 political power, 1 civilian factory and 60 days. Its effect arrives only when work finishes."
 AUH_ww1_service_foreign_programme:0 "Negotiate a Common Diplomatic Mandate"
 AUH_ww1_service_foreign_programme_desc:0 "The service requires 40 political power, 0 civilian factory and 60 days. Its effect arrives only when work finishes."
 AUH_ww1_service_investments:0 "Evaluate Investment Projects"
 AUH_ww1_service_investments_desc:0 "The service requires 40 political power, 1 civilian factory and 90 days. Its effect arrives only when work finishes."
 AUH_ww1_service_italian_contingency:0 "Rehearse the Italian Contingency"
 AUH_ww1_service_italian_contingency_desc:0 "The service requires 35 political power, 1 civilian factory and 60 days. Its effect arrives only when work finishes."
 AUH_ww1_service_naval_programme:0 "Fund Admiralty Cadres"
 AUH_ww1_service_naval_programme_desc:0 "The service requires 35 political power, 1 civilian factory and 90 days. Its effect arrives only when work finishes."
 AUH_ww1_service_peace_accounts:0 "Audit the Peacetime Budget"
 AUH_ww1_service_peace_accounts_desc:0 "The service requires 40 political power, 1 civilian factory and 90 days. Its effect arrives only when work finishes."
 AUH_ww1_service_postwar_diplomacy:0 "Organise the Peacetime Trade Delegation"
 AUH_ww1_service_postwar_diplomacy_desc:0 "The service requires 40 political power, 1 civilian factory and 90 days. Its effect arrives only when work finishes."
 AUH_ww1_service_reconstruction:0 "Fund Reconstruction Administration"
 AUH_ww1_service_reconstruction_desc:0 "The service requires 40 political power, 1 civilian factory and 90 days. Its effect arrives only when work finishes."
 AUH_ww1_shortcut_admiralty_review:0 "Go to: Navy"
 AUH_ww1_shortcut_ballhausplatz:0 "Go to: Diplomacy and Alliances"
 AUH_ww1_shortcut_common_army_review:0 "Go to: Army and Air Service"
 AUH_ww1_shortcut_crown_council:0 "Go to: Constitution and Crownlands"
 AUH_ww1_shortcut_economic_inventory:0 "Go to: Economy and Infrastructure"
 AUH_ww1_shortcut_postwar_inventory:0 "Go to: Postwar Settlement"
 AUH_ww1_siege_logistics:0 "Heavy Artillery Logistics"
 AUH_ww1_siege_logistics_desc:0 "Technological progress reduces transport problems without granting permanent heavy attack."
 AUH_ww1_siege_school:0 "The Siege Artillery School"
 AUH_ww1_siege_school_desc:0 "Arsenal expertise supports research; capturing fortresses still depends on combat."
 AUH_ww1_silesian_municipalities:0 "Silesian Municipalities"
 AUH_ww1_silesian_municipalities_desc:0 "Municipal services and local revenue are negotiated without changing borders by decree. Immediate effect: +1 building slot in Austrian Silesia, +2 provincial confidence, +1 consent."
 AUH_ww1_sixtus_channel:0 "Open the Sixtus Channel"
 AUH_ww1_sixtus_channel_desc:0 "France may accept or reject mediation. An open channel is not automatic peace."
 AUH_ww1_skoda_contracts:0 "Škoda Contracts"
 AUH_ww1_skoda_contracts_desc:0 "Industrial specialisation supports artillery research without raising every army attack statistic."
 AUH_ww1_slavic_officer_school:0 "South Slav Officer Training"
 AUH_ww1_slavic_officer_school_desc:0 "Opening the officer corps improves access to training without granting combat superiority by nationality."
 AUH_ww1_slovak_petitions:0 "Slovak Petitions"
 AUH_ww1_slovak_petitions_desc:0 "Provincial negotiation confronts concentrated power in the Hungarian administration. Immediate effect: +1 building slot in Slovakia, +2 provincial confidence, −2 consent."
 AUH_ww1_sofia_contacts:0 "Contacts with Sofia"
 AUH_ww1_sound_out_sofia:0 "Sound Out Sofia"
 AUH_ww1_sound_out_sofia_desc:0 "A 45-day mission improves Bulgarian opinion of us, and Bulgaria also views the monarchy more favourably. It creates no alliance."
 AUH_ww1_staff_college:0 "The Staff College"
 AUH_ww1_staff_college_desc:0 "Officer training provides experience usable in organising the forces. Immediate effect: creates the “Staff College” institution."
 AUH_ww1_staff_priority_review:0 "Reassess Staff Priorities"
 AUH_ww1_staff_priority_review_desc:0 "Reopens the choice between defensive and offensive preparation. The spirits replace each other."
 AUH_ww1_steyr_small_arms:0 "Steyr Small Arms"
 AUH_ww1_steyr_small_arms_desc:0 "Standardising weapons assists research without handing out thousands of free rifles. Immediate effect: +1 military factory and building slot in Upper Austria (Steyr), −15 political power."
 AUH_ww1_strike_settlement:0 "Agreements to Avoid Stoppages"
 AUH_ww1_strike_settlement_desc:0 "Mediation offers limited economic relief conditional on administrative support. Immediate effect: +3 provincial confidence, −15 political power."
 AUH_ww1_strike_wave:0 "Strike Wave"
 AUH_ww1_strike_wave_desc:0 "Factory stoppages: −4% industrial capacity."
 AUH_ww1_submarine_school:0 "The Submarine School"
 AUH_ww1_submarine_school_desc:0 "Submarine training creates neither vessels nor impossible oceanic range."
 AUH_ww1_subsidised_arsenals:0 "Arsenal Subsidy"
 AUH_ww1_subsidised_arsenals_desc:0 "Advance orders to the arsenals: +4% production efficiency gain, with +2% consumer goods demanded."
 AUH_ww1_technical_apprentices:0 "Technical Apprentices"
 AUH_ww1_technical_apprentices_desc:0 "Technical training improves research into maintaining available equipment."
 AUH_ww1_third_crown_charter:0 "Charter of the Third Crown"
 AUH_ww1_third_crown_charter_desc:0 "The agreement can only be ratified with sufficient consent; refusal leaves the monarchy negotiating."
 AUH_ww1_torpedo_workshop:0 "Torpedo Workshops"
 AUH_ww1_torpedo_workshop_desc:0 "Torpedoes are researched, manufactured and used by the existing fleet."
 AUH_ww1_transport_columns:0 "Transport Columns"
 AUH_ww1_transport_columns_desc:0 "Field transport must fit within the supply budget."
 AUH_ww1_transylvanian_dialogue:0 "Dialogue with the Municipalities"
 AUH_ww1_transylvanian_dialogue_desc:0 "Local dialogue strengthens administration without declaring that a population abandoned its identity."
 AUH_ww1_transylvanian_guarantees:0 "Transylvanian Guarantees"
 AUH_ww1_transylvanian_guarantees_desc:0 "Romanians, Magyars and Saxons contest influence; the agreement creates no additional cores or territory. Immediate effect: +1 building slot in Transylvania, +2 provincial confidence, −1 consent."
 AUH_ww1_trench_rotation:0 "Trench Unit Rotation"
 AUH_ww1_trench_rotation_desc:0 "Withdrawing contingents for rest reduces internal pressure, but requires time and expense. Immediate effect: +2 provincial confidence, +1% war support."
 AUH_ww1_trentino_council:0 "The Trentino Council"
 AUH_ww1_trentino_council_desc:0 "Local rights do not resolve irredentism, but make remaining in the monarchy less burdensome. Immediate effect: +1 building slot in Trentino, +2 provincial confidence, +1 consent, −10 political power."
 AUH_ww1_trialism:0 "Negotiate a Third Crown"
 AUH_ww1_trialism_desc:0 "A South Slav kingdom changes the relationship with Budapest and requires safeguards for Serbs, Croats and Bosnians."
 AUH_ww1_trialist_compensation:0 "Compensate the Hungarian Administration"
 AUH_ww1_trialist_compensation_desc:0 "Recovering support in Budapest requires real concessions before ratifying the new compact."
 AUH_ww1_trialist_war_cabinet:0 "The Three Crowns Cabinet"
 AUH_ww1_trialist_war_cabinet_desc:0 "The new Crown participates in administering the war and bearing the cost of recruitment. Immediate effect: +2% war support, +15 political power."
 AUH_ww1_trieste_yards:0 "The Trieste Shipyards"
 AUH_ww1_trieste_yards_desc:0 "An additional dockyard requires four civilian factories for one year; no ship is free. Immediate effect: +1 dockyard and building slot in Littoral/Trieste, −15 political power, +2 navy experience."
 AUH_ww1_tyrolean_services:0 "Services for Tyrol"
 AUH_ww1_tyrolean_services_desc:0 "The Alpine frontier needs administration and transport as well as imperial symbols. Immediate effect: +1 infrastructure in South Tyrol, +2 provincial confidence, −10 political power."
 AUH_ww1_urban_reconstruction:0 "Urban Recovery"
 AUH_ww1_urban_reconstruction_desc:0 "Cities require investment after prolonged mobilisation. Immediate effect: +3 food reserves, +2 consent."
 AUH_ww1_veteran_assistance:0 "Organise Veteran Assistance"
 AUH_ww1_veteran_assistance_desc:0 "One civilian factory for 90 days restores 4 confidence in peace."
 AUH_ww1_veterans:0 "Veteran Pensions"
 AUH_ww1_veterans_desc:0 "This institution applies the costs and benefits listed below. Reforms of the same institution replace its previous stage; spending on different services still adds up."
 AUH_ww1_veterans_pensions:0 "Veterans' Pensions"
 AUH_ww1_veterans_pensions_desc:0 "Pensions sustain confidence but remain a civilian budget expense. Immediate effect: +3 provincial confidence."
 AUH_ww1_veterans_registry:0 "Register the Veterans"
 AUH_ww1_veterans_registry_desc:0 "Veteran assistance requires regular civilian spending without returning all casualties to recruitment. Immediate effect: +2 provincial confidence, −10 political power."
 AUH_ww1_vienna_budapest_rail:0 "The Vienna–Budapest Connection"
 AUH_ww1_vienna_budapest_rail_desc:0 "The railway axis between the capitals needs completed works to carry more freight. Immediate effect: level 2 railway between Lower Austria (Vienna) and Central Hungary (Budapest), +2 consent, −15 political power."
 AUH_ww1_vitkovice_steel:0 "Vítkovice Steel"
 AUH_ww1_vitkovice_steel_desc:0 "Coal, metallurgy and transport determine how much steel reaches the arsenals. Immediate effect: +4 steel in Moravia, +1 civilian factory and building slot in Moravia, +1 provincial confidence, one 10% research bonus (industry)."
 AUH_ww1_war_staff_review:0 "Wartime Staff Review"
 AUH_ww1_war_staff_review_desc:0 "Periodic reviews allow a change in institutional priorities, paying again for preparation. Immediate effect: +3 army experience, −20 political power."
 AUH_ww1_wartime_credit:0 "Limits on War Credit"
 AUH_ww1_wartime_credit_desc:0 "A debt issue requires choosing between immediate capacity and future fiscal pressure."
 AUH_ww1_weiss_csepel:0 "The Csepel Workshops"
 AUH_ww1_weiss_csepel_desc:0 "Hungarian industry can sustain the common effort if given time and capital. Immediate effect: +1 military factory and building slot in Central Hungary (Budapest), +2 consent, +15 political power."
 AUH_ww1_winter_equipment:0 "Winter Equipment"
 AUH_ww1_winter_equipment_desc:0 "Winter reserves require support equipment and prepare operations for a limited period. Immediate effect: +1% war support, +2 army experience."
 AUH_ww1_winter_manoeuvres:0 "Hold Winter Manoeuvres"
 AUH_ww1_winter_manoeuvres_desc:0 "In peacetime, one civilian factory for 90 days and 40 support equipment fund manoeuvres: +5 army experience and −5% training time for 120 days."
 AUH_ww1_winter_stores:0 "Prepare Winter Stores"
 AUH_ww1_winter_stores_desc:0 "Sixty support equipment and one civilian factory for 60 days fund logistics instruction: +6 land experience."
 AUH_ww1_winter_training:0 "Winter Manoeuvres"
 AUH_ww1_winter_training_desc:0 "Units trained in the field: −5% army training time, with +1% consumer goods demanded."
 AUH_ww1_women_in_industry:0 "Women in War Industry"
 AUH_ww1_women_in_industry_desc:0 "Hiring requires training and labour safeguards; labour does not appear without cost. Immediate effect: +15 political power, −1 provincial confidence."
 AUH_ww1_workers_housing:0 "Workers' Housing"
 AUH_ww1_workers_housing_desc:0 "Housing and services in industrial areas require civilian capacity rather than unlimited permanent bonuses. Immediate effect: +1 infrastructure in Upper Austria (Steyr), +3 provincial confidence, −15 political power."
 AUS_ww1_federal:0 "Danubian Federal Monarchy"
 AUS_ww1_federal_ADJ:0 "Danubian"
 AUS_ww1_federal_DEF:0 "Danubian Federal Monarchy"
 AUS_ww1_republic:0 "Danubian Federal Republic"
 AUS_ww1_republic_ADJ:0 "Danubian"
 AUS_ww1_republic_DEF:0 "Danubian Federal Republic"
 AUS_ww1_trialist:0 "Monarchy of the Three Crowns"
 AUS_ww1_trialist_ADJ:0 "Danubian"
 AUS_ww1_trialist_DEF:0 "Monarchy of the Three Crowns"
 ww1_auh.1.a:0 "Hear both delegations."
 ww1_auh.1.b:0 "Convene provincial representatives."
 ww1_auh.1.d:0 "The monarchy enters 1911 with significant resources and administrations competing over priorities. We must secure support without promising every difference will disappear."
 ww1_auh.1.t:0 "Two Capitals, One Crown"
 ww1_auh.10.a:0 "Gather information from both administrations."
 ww1_auh.10.b:0 "Prioritise supply services."
 ww1_auh.10.d:0 "Industry and agriculture must be coordinated without pretending the common budget controls every decision in Vienna and Budapest."
 ww1_auh.10.t:0 "A Complementary but Divided Economy"
 ww1_auh.100.a:0 "Pass the bill with concessions to Budapest."
 ww1_auh.100.b:0 "Ask the Crown to impose the bill."
 ww1_auh.100.c:0 "Postpone the vote to the next session."
 ww1_auh.100.d:0 "Budapest ties the increase in the annual contingent to concessions over the language of command and the Honvéd. The general staff wants the bill; the Hungarian delegation wants to collect its price."
 ww1_auh.100.t:0 "The Army Bill and Hungarian Obstruction"
 ww1_auh.101.a:0 "Partially mobilise Bosnia and Galicia."
 ww1_auh.101.b:0 "Seek mediation by the Great Powers."
 ww1_auh.101.c:0 "Consult Berlin on allied support."
 ww1_auh.101.d:0 "Serbia, Bulgaria, Greece and Montenegro unite against the Ottoman Empire. The monarchy must decide how much a show of force on the southern border should cost."
 ww1_auh.101.t:0 "The Balkan League Mobilises"
 ww1_auh.102.a:0 "Send a naval demonstration to the Adriatic."
 ww1_auh.102.b:0 "Accept the London Conference compromise."
 ww1_auh.102.c:0 "Send an ultimatum to Montenegro."
 ww1_auh.102.d:0 "Montenegro besieges Scutari despite the Powers' decision to create an independent Albania. The monarchy may show force in the Adriatic or accept a conference solution."
 ww1_auh.102.t:0 "The Scutari Crisis"
 ww1_auh.103.a:0 "Rewrite the mobilisation plans."
 ww1_auh.103.b:0 "Hush up the scandal and keep the plans."
 ww1_auh.103.d:0 "Colonel Alfred Redl, head of counter-intelligence, had been selling the army's concentration plans. Everything the general staff knows about mobilisation is compromised."
 ww1_auh.103.t:0 "The Redl Affair"
 ww1_auh.104.a:0 "Study the Belvedere proposals."
 ww1_auh.104.b:0 "Keep the heir at a distance."
 ww1_auh.104.d:0 "The heir to the throne gathers advisers who favour federal reforms and a monarchy less dependent on Budapest. His ideas divide the court."
 ww1_auh.104.t:0 "The Belvedere Circle"
 ww1_auh.105.a:0 "Reinforce the Balkans with troops from Galicia."
 ww1_auh.105.b:0 "Replace the command and hold the defensive."
 ww1_auh.105.d:0 "The Balkan army retreats before the Serbian counter-attack and its command demands reinforcements. Any reinforcement will come from another front."
 ww1_auh.105.t:0 "Kolubara: The Serbian Campaign Fails"
 ww1_auh.106.a:0 "Order the winter offensive."
 ww1_auh.106.b:0 "Hold the line and prepare the fortress's surrender."
 ww1_auh.106.d:0 "Przemyśl is surrounded and Conrad proposes a winter offensive to break the ring. The men have little clothing, little bread and one mountain road."
 ww1_auh.106.t:0 "The Carpathian Winter and Przemyśl"
 ww1_auh.107.a:0 "Accept German direction of the operation."
 ww1_auh.107.b:0 "Demand Austro-Hungarian participation in command."
 ww1_auh.107.d:0 "The Austro-German offensive breaks the Russian front. The German command offers to direct the operation; accepting brings quick victory but also dependence."
 ww1_auh.107.t:0 "Gorlice and Tarnów"
 ww1_auh.108.a:0 "Request German reinforcements."
 ww1_auh.108.b:0 "Transfer divisions from the Italian front."
 ww1_auh.108.c:0 "Fall back to the Carpathian line."
 ww1_auh.108.d:0 "The Russians break the front in Galicia and Bukovina. The reserves were sent to the Trentino, and any solution will cost something elsewhere."
 ww1_auh.108.t:0 "The Brusilov Offensive"
 ww1_auh.109.a:0 "Open municipal kitchens."
 ww1_auh.109.b:0 "Requisition Hungarian grain."
 ww1_auh.109.c:0 "Ask the population for patience."
 ww1_auh.109.d:0 "The queues outside the bakeries grow every week. The city waits for the government to choose between municipal kitchens, requisition or patience."
 ww1_auh.109.t:0 "Bread Queues in Vienna"
 ww1_auh.11.a:0 "Purchase grain and compensate producers."
 ww1_auh.11.b:0 "Requisition stocks."
 ww1_auh.11.d:0 "The food commission may negotiate purchases or requisition grain. Requisition meets the emergency but deepens conflict with the Hungarian administration."
 ww1_auh.11.t:0 "Who Pays for Bread?"
 ww1_auh.110.a:0 "Negotiate with the workers' councils."
 ww1_auh.110.b:0 "Repress the stoppages."
 ww1_auh.110.d:0 "Hundreds of thousands of workers stop work in the factories of Vienna, Wiener Neustadt and Budapest. They ask for bread, peace and representation. The government may negotiate or repress."
 ww1_auh.110.t:0 "The January Strike"
 ww1_auh.111.a:0 "Open talks on autonomy."
 ww1_auh.111.b:0 "Ignore the declaration."
 ww1_auh.111.d:0 "Czech, Slovak and Slovene deputies demand self-determination within a democratic state. The declaration weakens the Reichsrat's loyalty and challenges Budapest."
 ww1_auh.111.t:0 "The Epiphany Declaration"
 ww1_auh.112.a:0 "Investigate grievances and make concessions."
 ww1_auh.112.b:0 "Suppress the mutiny and punish the ringleaders."
 ww1_auh.112.d:0 "Sailors of several nationalities raise the red flag on the ships at Cattaro. The mutiny asks for bread, peace and better treatment."
 ww1_auh.112.t:0 "The Cattaro Mutiny"
 ww1_auh.113.a:0 "Launch the offensive."
 ww1_auh.113.b:0 "Hold the line and inspect the fortifications."
 ww1_auh.113.d:0 "The staff wants a final offensive on the Piave before the Italian harvest and the arrival of more allies. The depots are empty."
 ww1_auh.113.t:0 "The Piave Offensive"
 ww1_auh.114.a:0 "Issue the manifesto."
 ww1_auh.114.b:0 "Refuse the manifesto."
 ww1_auh.114.d:0 "Karl may proclaim a federation of peoples within the Empire. The measure is late, but it still changes the relationship with the provinces."
 ww1_auh.114.t:0 "The Peoples' Manifesto"
 ww1_auh.115.a:0 "Store the surplus."
 ww1_auh.115.b:0 "Sell the surplus and raise credit."
 ww1_auh.115.c:0 "Set grain aside for the army."
 ww1_auh.115.d:0 "Reports from the agricultural districts reach Vienna. The government must decide whether to store the surplus, sell it or keep reserves for the army."
 ww1_auh.115.t:0 "The Harvest Report"
 ww1_auh.116.a:0 "Make budget concessions."
 ww1_auh.116.b:0 "Approve the credits by emergency decree."
 ww1_auh.116.d:0 "The delegations of Vienna and Budapest meet to vote the common credits. The monarchy may buy goodwill or govern by decree."
 ww1_auh.116.t:0 "The Session of the Delegations"
 ww1_auh.117.a:0 "Renew with a naval convention."
 ww1_auh.117.b:0 "Renew without additional commitments."
 ww1_auh.117.d:0 "Berlin and Rome propose renewing the Triple Alliance early. A naval convention expands cooperation; a plain text avoids new commitments."
 ww1_auh.117.t:0 "The Renewal of the Triple Alliance"
 ww1_auh.118.a:0 "Expand the Diet's budget powers."
 ww1_auh.118.b:0 "Strengthen the gendarmerie."
 ww1_auh.118.d:0 "The governor reports that the Bosnian Diet has popular support but is distrusted by officials and police. Annexation did not resolve local grievances."
 ww1_auh.118.t:0 "The Governor's Report from Bosnia"
 ww1_auh.12.a:0 "Negotiate working conditions."
 ww1_auh.12.b:0 "Adopt emergency shifts for 90 days."
 ww1_auh.12.d:0 "An emergency may extend shifts for 90 days. The alternative is funding negotiations and preserving confidence, with less immediate output."
 ww1_auh.12.t:0 "Production and Its Workers"
 ww1_auh.13.a:0 "Issue a limited series."
 ww1_auh.13.b:0 "Retain the credit limit."
 ww1_auh.13.d:0 "Bonds can fund a temporary 2.5% industrial expansion for 180 days, but debt service remains in the economy until repayment."
 ww1_auh.13.t:0 "A Credit Issue"
 ww1_auh.14.a:0 "Audit officer training."
 ww1_auh.14.b:0 "Consult territorial commands."
 ww1_auh.14.d:0 "Army unity depends on training and supply. Communication problems can be reformed; national diversity does not imply military incapacity."
 ww1_auh.14.t:0 "An Army of Several Administrations"
 ww1_auh.15.a:0 "Prioritise arsenal research."
 ww1_auh.15.b:0 "Prioritise reserve organisation."
 ww1_auh.15.d:0 "Schools and arsenals compete for resources. One priority offers limited research assistance; another provides experience to reorganise reserves."
 ww1_auh.15.t:0 "The Military Programme's Priority"
 ww1_auh.16.a:0 "Adopt the defensive school."
 ww1_auh.16.b:0 "Adopt the offensive school."
 ww1_auh.16.d:0 "The staff must choose a priority. Preparing offensives speeds planning and raises supply consumption. The defensive school favours entrenchment and plans offensives more slowly."
 ww1_auh.16.t:0 "Offensives and Reserves"
 ww1_auh.17.a:0 "Invest in accommodation."
 ww1_auh.17.b:0 "Maintain a pressure policy."
 ww1_auh.17.d:0 "The monarchy's Balkan position does not guarantee a short war. External pressure may raise war support, but costs provincial confidence."
 ww1_auh.17.t:0 "Foreign Policy and Its Limits"
 ww1_auh.18.a:0 "Prepare succession administration."
 ww1_auh.18.d:0 "The dynasty must prepare continuity in common services. The protocol does not change the international Sarajevo assassination chain; Karl's accession follows Franz Joseph's death."
 ww1_auh.18.t:0 "The Imperial House and Continuity"
 ww1_auh.19.a:0 "Preserve Vienna's control."
 ww1_auh.19.b:0 "Fund more joint courses."
 ww1_auh.19.d:0 "The German connection can assist the staff, but deeper coordination costs Vienna influence. The decision cedes neither territory nor armies to the ally."
 ww1_auh.19.t:0 "Coordination Without Submission?"
 ww1_auh.2.a:0 "Prioritise government consent."
 ww1_auh.2.b:0 "Prioritise provincial confidence."
 ww1_auh.2.d:0 "Revisiting the 1867 agreement offers different paths. A budget compromise pleases governments; a provincial consultation gives a voice to those excluded."
 ww1_auh.2.t:0 "Reopen the Compromise"
 ww1_auh.20.a:0 "Negotiate civil guarantees."
 ww1_auh.20.b:0 "Impose exceptional measures."
 ww1_auh.20.d:0 "Imperial presence may rely on civil negotiation or repressive measures. Neither alternative guarantees preventing international assassinations."
 ww1_auh.20.t:0 "Civil Security in Bosnia"
 ww1_auh.21.a:0 "Prepare a negotiated solution."
 ww1_auh.21.b:0 "Retain existing aims."
 ww1_auh.21.d:0 "The new emperor finds a state sustaining several fronts and negotiating its continuity. Limiting aims costs war support, but helps internal confidence."
 ww1_auh.21.t:0 "Karl and the War Aims"
 ww1_auh.22.a:0 "Study battle hulls."
 ww1_auh.22.b:0 "Prioritise light ships and escorts."
 ww1_auh.22.d:0 "Funding large hulls and preserving the fleet are different aims. The programme chooses a limited research priority without creating ships."
 ww1_auh.22.t:0 "A Navy for the Adriatic"
 ww1_auh.23.a:0 "Prioritise survivors' confidence."
 ww1_auh.23.b:0 "Prioritise the administrative agreement."
 ww1_auh.23.d:0 "Peace ends the military emergency, but does not erase debt or the need to reintegrate veterans. Rebuilding services requires budget choices."
 ww1_auh.23.t:0 "Peace and Its Accounts"
 ww1_auh.24.a:0 "Fund civilian reintegration."
 ww1_auh.24.b:0 "Adopt a slower transition."
 ww1_auh.24.d:0 "Reintegration has a political and civilian cost. Actual division demobilisation remains in the player's hands; the dead are not returned to recruitment."
 ww1_auh.24.t:0 "Demobilise Without Abandoning"
 ww1_auh.25.a:0 "Retain the current constitution."
 ww1_auh.25.b:0 "Extend the federal compact."
 ww1_auh.25.d:0 "The state may continue under the dynasty or negotiate a federal constitution. Reform still requires 50 consent and 60 confidence, even after peace."
 ww1_auh.25.t:0 "The Compact After the War"
 ww1_auh.26.a:0 "Preserve the Crown and expand consultations."
 ww1_auh.26.b:0 "Convene a federal republican assembly."
 ww1_auh.26.d:0 "A republican assembly may replace the dynasty with parliamentary representation. This alternative requires peace, provincial confidence of 60 and a major concession to administrations. A consultation preserves the monarchy."
 ww1_auh.26.t:0 "Binding or Consultative Representation"
 ww1_auh.27.a:0 "Renew the compact of common services."
 ww1_auh.27.d:0 "The outcome is not a guaranteed victory reward. Retaining the state required controlling its territory and negotiating food, budgets and representation. Continuity still depends on those choices."
 ww1_auh.27.t:0 "The Future of the Danubian State"
 ww1_auh.28.a:0 "Fund emergency concessions."
 ww1_auh.28.b:0 "Retain existing powers."
 ww1_auh.28.d:0 "Provincial confidence has fallen below 25. The government may fund an emergency concession or preserve its budget and accept continuing tension. The event does not partition the country by date."
 ww1_auh.28.t:0 "The Internal Compact Is at Risk"
 ww1_auh.29.a:0 "Buy an emergency reserve."
 ww1_auh.29.b:0 "Manage the shortage with current resources."
 ww1_auh.29.d:0 "Reserves have fallen below 30. Cities put pressure on industrial production and poor distribution undermines confidence. Obtaining grain requires retaining control of the agricultural region."
 ww1_auh.29.t:0 "Bread Has Become an Emergency"
 ww1_auh.3.a:0 "Affirm the compact with Budapest."
 ww1_auh.3.b:0 "Retain the compact with provincial consultations."
 ww1_auh.3.d:0 "Retaining the compact between Vienna and Budapest avoids an immediate institutional rupture, but makes negotiating common services essential."
 ww1_auh.3.t:0 "Renew Dualism"
 ww1_auh.30.a:0 "Send a formal proposal."
 ww1_auh.30.b:0 "Conserve diplomatic resources."
 ww1_auh.30.d:0 "The proposal for joint military commission exists only if the recipient government accepts. We must fund the delegation and await its reply."
 ww1_auh.30.t:0 "One Proposal, Two Governments"
 ww1_auh.31.a:0 "Accept the proposal under current conditions."
 ww1_auh.31.b:0 "Refuse the proposal."
 ww1_auh.31.d:0 "Vienna proposes joint military commission. We may accept the channel or refuse. Acceptance does not compel entry into wars or change borders."
 ww1_auh.31.t:0 "A Proposal from Vienna"
 ww1_auh.32.a:0 "Send a formal proposal."
 ww1_auh.32.b:0 "Conserve diplomatic resources."
 ww1_auh.32.d:0 "The proposal for trade normalisation exists only if the recipient government accepts. We must fund the delegation and await its reply."
 ww1_auh.32.t:0 "One Proposal, Two Governments"
 ww1_auh.33.a:0 "Accept the proposal under current conditions."
 ww1_auh.33.b:0 "Refuse the proposal."
 ww1_auh.33.d:0 "Vienna proposes trade normalisation. We may accept the channel or refuse. Acceptance does not compel entry into wars or change borders."
 ww1_auh.33.t:0 "A Proposal from Vienna"
 ww1_auh.34.a:0 "Send a formal proposal."
 ww1_auh.34.b:0 "Conserve diplomatic resources."
 ww1_auh.34.d:0 "The proposal for civil assistance exists only if the recipient government accepts. We must fund the delegation and await its reply."
 ww1_auh.34.t:0 "One Proposal, Two Governments"
 ww1_auh.35.a:0 "Accept the proposal under current conditions."
 ww1_auh.35.b:0 "Refuse the proposal."
 ww1_auh.35.d:0 "Vienna proposes civil assistance. We may accept the channel or refuse. Acceptance does not compel entry into wars or change borders."
 ww1_auh.35.t:0 "A Proposal from Vienna"
 ww1_auh.36.a:0 "Send a formal proposal."
 ww1_auh.36.b:0 "Conserve diplomatic resources."
 ww1_auh.36.d:0 "The proposal for non-aggression pact exists only if the recipient government accepts. We must fund the delegation and await its reply."
 ww1_auh.36.t:0 "One Proposal, Two Governments"
 ww1_auh.37.a:0 "Accept the proposal under current conditions."
 ww1_auh.37.b:0 "Refuse the proposal."
 ww1_auh.37.d:0 "Vienna proposes non-aggression pact. We may accept the channel or refuse. Acceptance does not compel entry into wars or change borders."
 ww1_auh.37.t:0 "A Proposal from Vienna"
 ww1_auh.38.a:0 "Send a formal proposal."
 ww1_auh.38.b:0 "Conserve diplomatic resources."
 ww1_auh.38.d:0 "The proposal for Adriatic consultations exists only if the recipient government accepts. We must fund the delegation and await its reply."
 ww1_auh.38.t:0 "One Proposal, Two Governments"
 ww1_auh.39.a:0 "Accept the proposal under current conditions."
 ww1_auh.39.b:0 "Refuse the proposal."
 ww1_auh.39.d:0 "Vienna proposes Adriatic consultations. We may accept the channel or refuse. Acceptance does not compel entry into wars or change borders."
 ww1_auh.39.t:0 "A Proposal from Vienna"
 ww1_auh.4.a:0 "Fund mediation."
 ww1_auh.4.b:0 "The Crown will decide."
 ww1_auh.4.d:0 "The two governments disagree over common spending. Imposing a decision saves time but harms confidence; negotiating consumes influence."
 ww1_auh.4.t:0 "A Dispute Between Administrations"
 ww1_auh.40.a:0 "Send a formal proposal."
 ww1_auh.40.b:0 "Conserve diplomatic resources."
 ww1_auh.40.d:0 "The proposal for grain contract exists only if the recipient government accepts. We must fund the delegation and await its reply."
 ww1_auh.40.t:0 "One Proposal, Two Governments"
 ww1_auh.41.a:0 "Accept the proposal under current conditions."
 ww1_auh.41.b:0 "Refuse the proposal."
 ww1_auh.41.d:0 "Vienna proposes grain contract. We may accept the channel or refuse. Acceptance does not compel entry into wars or change borders."
 ww1_auh.41.t:0 "A Proposal from Vienna"
 ww1_auh.42.a:0 "Send a formal proposal."
 ww1_auh.42.b:0 "Conserve diplomatic resources."
 ww1_auh.42.d:0 "The proposal for diplomatic consultations exists only if the recipient government accepts. We must fund the delegation and await its reply."
 ww1_auh.42.t:0 "One Proposal, Two Governments"
 ww1_auh.43.a:0 "Accept the proposal under current conditions."
 ww1_auh.43.b:0 "Refuse the proposal."
 ww1_auh.43.d:0 "Vienna proposes diplomatic consultations. We may accept the channel or refuse. Acceptance does not compel entry into wars or change borders."
 ww1_auh.43.t:0 "A Proposal from Vienna"
 ww1_auh.44.a:0 "Send a formal proposal."
 ww1_auh.44.b:0 "Conserve diplomatic resources."
 ww1_auh.44.d:0 "The proposal for mediation through the Sixtus channel exists only if the recipient government accepts. We must fund the delegation and await its reply."
 ww1_auh.44.t:0 "One Proposal, Two Governments"
 ww1_auh.45.a:0 "Accept the proposal under current conditions."
 ww1_auh.45.b:0 "Refuse the proposal."
 ww1_auh.45.d:0 "Vienna proposes mediation through the Sixtus channel. We may accept the channel or refuse. Acceptance does not compel entry into wars or change borders."
 ww1_auh.45.t:0 "A Proposal from Vienna"
 ww1_auh.46.a:0 "Authorise the conference for 120 days."
 ww1_auh.46.b:0 "Continue the war."
 ww1_auh.46.d:0 "Vienna offers peace without annexations and requests authorisation for a conference. War continues while any belligerent refuses. Authorisation, if granted, expires in 120 days."
 ww1_auh.46.t:0 "An Armistice Proposal from the Monarchy"
 ww1_auh.48.a:0 "Fund implementation of the agreement."
 ww1_auh.48.d:0 "The recipient government accepted our negotiation channel. Commitments depend on their diplomatic validity and do not guarantee another country's future behaviour."
 ww1_auh.48.t:0 "The Proposal Was Accepted"
 ww1_auh.49.a:0 "Reassess our position."
 ww1_auh.49.d:0 "The recipient government did not accept our proposal. Diplomatic expenditure has already occurred, and no guarantee or treaty advantage entered into force."
 ww1_auh.49.t:0 "The Proposal Was Refused"
 ww1_auh.5.a:0 "Accept the cost of negotiation."
 ww1_auh.5.d:0 "A new South Slav unit faces resistance in Budapest and local mistrust. The project needs safeguards and compensation before ratification."
 ww1_auh.5.t:0 "The Third Crown Proposal"
 ww1_auh.50.a:0 "Preserve continuity of services."
 ww1_auh.50.d:0 "Franz Joseph has died. Karl assumes leadership of the monarchy with the constitution and difficulties left by the campaign. His accession removes neither debt, hunger nor military crises."
 ww1_auh.50.t:0 "Karl's Accession"
 ww1_auh.6.a:0 "Ratify the charter."
 ww1_auh.6.b:0 "Continue negotiations."
 ww1_auh.6.d:0 "The third Crown becomes an institution only when administrations and provinces accept its charter. We require 45 consent and 50 confidence."
 ww1_auh.6.t:0 "The Vote on the Trialist Charter"
 ww1_auh.7.a:0 "Prepare the convention."
 ww1_auh.7.d:0 "Recognising provinces as parties to a federal compact changes the balance between governments. Opposition must be overcome through negotiation, not a proclamation."
 ww1_auh.7.t:0 "A Federal Project"
 ww1_auh.8.a:0 "Guarantee provincial revenue."
 ww1_auh.8.b:0 "Prioritise common ministries."
 ww1_auh.8.d:0 "Provinces request resources for their own services; common ministries request stable revenue. No solution fully satisfies both."
 ww1_auh.8.t:0 "Federal Fiscal Distribution"
 ww1_auh.9.a:0 "Promulgate the constitution."
 ww1_auh.9.b:0 "Defer ratification."
 ww1_auh.9.d:0 "The constitution requires 50 consent and 60 confidence. The monarchy remains under the dynasty, with recognised provincial powers and agreed common costs."
 ww1_auh.9.t:0 "Ratify the Federal Constitution"
