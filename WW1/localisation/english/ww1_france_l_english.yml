l_english:
 FRA_1914_fiscal_solvency:0 "1914 Fiscal Solvency"
 FRA_1914_fiscal_solvency_desc:0 "Fiscal reforms passed on the eve of war secure state credit and budgetary stability."
 FRA_abattre_la_gueuse:0 "Down with 'La Gueuse'"
 FRA_abattre_la_gueuse_desc:0 "Denouncing the parliamentary republic as a corrupt, foreign-influenced system that sold France in 1870, royalists rally conservatives to bring down the regime."
 FRA_accord_colonial_franco_allemand:0 "Franco-German Colonial Settlement"
 FRA_accord_colonial_franco_allemand_desc:0 "Premier Joseph Caillaux concludes a pragmatic bilateral exchange: France cedes part of the French Congo (Neukamerun) in exchange for Germany's recognition of France in Morocco."
 FRA_accord_sur_le_minerai_et_le_charbon:0 "Briey-Ruhr Coal & Iron Compact"
 FRA_accord_sur_le_minerai_et_le_charbon_desc:0 "Forging an industrial syndicate linking the minette iron mines of Briey with the coking coal of the Ruhr, creating mutual economic interdependence."
 FRA_accords_navals_franco_britanniques:0 "1912 Anglo-French Naval Accords"
 FRA_accords_navals_franco_britanniques_desc:0 "Winston Churchill and Boué de Lapeyrère agree to strategic maritime division: France concentrates her battle fleet in the Mediterranean, while Britain assumes defense of the Channel and Atlantic."
 FRA_activate_la_voie_sacree:0 "Activate La Voie Sacrée Truck Corridor"
 FRA_activate_la_voie_sacree_desc:0 "Mobilize civilian trucks and territorial stone-layers to maintain uninterrupted resupply to the Verdun fortress."
 FRA_adopter_fermement_trois_ans:0 "Adopt the Full Three-Year Service"
 FRA_adopter_fermement_trois_ans_desc:0 "Despite socialist strikes and protests led by Jaurès, the law passes in August 1913, increasing the French standing peacetime army to 820,000 men on the eve of war."
 FRA_adopter_le_casque_adrian_m1915:0 "Adoption of the Adrian M1915 Helmet"
 FRA_adopter_le_casque_adrian_m1915_desc:0 "Designed by Intendant Louis Adrian, the pressed-steel crested helmet cuts head wounds and shell-splinter casualties among frontline poilus by over two-thirds."
 FRA_adoption_du_plan_xvii:0 "Deployment of Plan XVII"
 FRA_adoption_du_plan_xvii_desc:0 "Concentrating five field armies along the eastern frontier from Belfort to Mézières prepares a massive head-on drive into recovered Alsace and Lorraine."
 FRA_adrian_helmet_protection:0 "M1915 Adrian Steel Helmet"
 FRA_adrian_helmet_protection_desc:0 "Stamping millions of steel helmets drastically reduces shrapnel fatalities and head wounds among frontline soldiers."
 FRA_adriatic_naval_blockade:0 "Otranto Barrage & Adriatic Patrols"
 FRA_adriatic_naval_blockade_desc:0 "Continuous naval patrols bottle up the Austro-Hungarian fleet and protect Allied transports heading for Salonika."
 FRA_aerial_photo_reconnaissance:0 "Aerial Photographic Reconnaissance"
 FRA_aerial_photo_reconnaissance_desc:0 "Daily aerial photographic sorties map enemy trench networks and gun emplacements with unmatched accuracy."
 FRA_affectes_speciaux_rappel_ouvriers:0 "Recall of Skilled Mechanics from the Front"
 FRA_affectes_speciaux_rappel_ouvriers_desc:0 "Recognizing that precision toolmakers are more valuable turning artillery shells than holding a trench line, half a million skilled soldiers are reassigned as 'affectés spéciaux'."
 FRA_afrique_occidentale_francaise_aof:0 "French West Africa Federation (AOF)"
 FRA_afrique_occidentale_francaise_aof_desc:0 "Coordinating administrative policy from Saint-Louis and Dakar guarantees peaceful governance across Senegal, French Guinea, Ivory Coast, and Dahomey."
 FRA_air_ground_tsf_radio_coordination:0 "Air-Ground Wireless (TSF) Artillery Spotting"
 FRA_air_ground_tsf_radio_coordination_desc:0 "Airborne wireless telegraphy transmits immediate target corrections to heavy artillery batteries."
 FRA_air_supremacy_spad:0 "SPAD Air Supremacy"
 FRA_air_supremacy_spad_desc:0 "French pursuit squadrons dominate the Western Front skies."
 FRA_albert_thomas_munitions_boom:0 "Albert Thomas Industrial Mobilization"
 FRA_albert_thomas_munitions_boom_desc:0 "Under Socialist Undersecretary Albert Thomas, private factories, arsenals, and civil workshops unite in record shell production."
 FRA_algerian_spahis_cavalry:0 "Algerian Spahis Reconnaissance"
 FRA_algerian_spahis_cavalry_desc:0 "Skilled North African light cavalry excel at rapid flank screening, pursuit, and battlefield scouting."
 FRA_alliance_avec_l_italie_et_l_espagne:0 "Treaty of the Latin Sisters"
 FRA_alliance_avec_l_italie_et_l_espagne_desc:0 "Formalizing military and naval conventions across the Western Mediterranean, securing our southern flank and coordinating North African development."
 FRA_alliance_democratique:0 "Democratic Alliance Center-Right"
 FRA_alliance_democratique_desc:0 "Raymond Poincaré and the moderates provide financial orthodoxy, national patriotism, and administrative competence, counterbalancing socialist radicalism with bourgeois respectability."
 FRA_alsace_lorraine_reclaimed:0 "Alsace-Lorraine Reclaimed"
 FRA_alsace_lorraine_reclaimed_desc:0 "The lost provinces return to the Republic. The long national mourning is over, and French honor is vindicated."
 FRA_american_aef_arrival:0 "Arrival of the American AEF"
 FRA_american_aef_arrival_desc:0 "General Pershing’s doughboys arrive in vast numbers, turning the strategic manpower balance irreversibly in the Allies’ favor."
 FRA_apaiser_les_tensions_sociales:0 "Appease Social Unrest"
 FRA_apaiser_les_tensions_sociales_desc:0 "By opening channels with trade unions and moderating labor policing, the government prevents general strikes and maintains social calm across industrial basins."
 FRA_appel_au_tigre:0 "Call to The Tiger (Clemenceau)"
 FRA_appel_au_tigre_desc:0 "Swallowing personal antipathy, President Poincaré summons 76-year-old Georges Clemenceau, 'The Tiger', to form a government of unbending iron will."
 FRA_armee_moderne_motorisee:0 "Fully Motorised Combined-Arms Army"
 FRA_armee_moderne_motorisee_desc:0 "With forty thousand Renault and Peugeot trucks hauling supplies, French mechanized logistical muscle outpaces rail reliance, sealing tactical breakthroughs."
 FRA_armer_l_armee_americaine:0 "Equipping the Doughboys with French Arms"
 FRA_armer_l_armee_americaine_desc:0 "Because US industry is slow to retool, French arsenals supply American divisions with 3,000 75mm guns, 250 heavy howitzers, 40,000 Chauchat rifles, and 300 Renault FT tanks."
 FRA_arret_des_offensives_ludendorff:0 "Halting Ludendorff's 1918 Spring Offensives"
 FRA_arret_des_offensives_ludendorff_desc:0 "Absorbing the shock of German Sturmtruppen on the Matz and the Marne, French counter-attacks at Villers-Cotterêts in July 1918 turn the tide of the war forever."
 FRA_arrivee_du_corps_expeditionnaire_americain:0 "'Lafayette, nous voilà!' (AEF Arrival)"
 FRA_arrivee_du_corps_expeditionnaire_americain_desc:0 "General John J. Pershing lands in France. At Picpus cemetery, Colonel Stanton declares: 'Lafayette, we are here!' Two million American Doughboys prepare to take their place on the line."
 FRA_arsenaux_de_toulon_et_brest:0 "Great Arsenals of Toulon & Brest"
 FRA_arsenaux_de_toulon_et_brest_desc:0 "Modernising graving docks in Toulon (Bouches-du-Rhône) and Brest (Brittany) accommodates mammoth 25,000-tonne dreadnought hulls and continuous engine refits."
 FRA_artillerie_speciale_cadres:0 "Artillerie Spéciale (Tank Corps Cadres)"
 FRA_artillerie_speciale_cadres_desc:0 "Pioneered by General Estienne, dedicated assault vehicle units train in mechanized breakthrough and trench crossing."
 FRA_assassinat_de_jean_jaures:0 "Assassination of Jean Jaurès"
 FRA_assassinat_de_jean_jaures_desc:0 "On 31 July 1914 at Café du Croissant in Paris, fanatic nationalist Raoul Villain murders Jean Jaurès. The death of the great pacifist removes the final obstacle to total national cohesion."
 FRA_ateliers_de_puteaux_et_tulle:0 "Puteaux & Tulle Precision Arsenals"
 FRA_ateliers_de_puteaux_et_tulle_desc:0 "Atelier de Construction de Puteaux (APX) specializes in hydro-pneumatic recoil mechanisms for the 75mm gun, while Tulle manufactures machine gun components."
 FRA_autogestion_des_usines:0 "Factory Self-Management"
 FRA_autogestion_des_usines_desc:0 "The Schneider arms foundries and Renault works are taken over by factory shop stewards, producing armaments for the emancipation of mankind."
 FRA_aviation_navale_et_porte_hydravions:0 "Naval Aviation & Seaplane Carriers"
 FRA_aviation_navale_et_porte_hydravions_desc:0 "Operating the seaplane carrier Foudre and coastal hydroplane stations pioneers maritime air spotting, mine detection, and torpedo air strikes."
 FRA_avions_d_attaque_au_sol_salmson:0 "Salmson 2A2 Ground Assault"
 FRA_avions_d_attaque_au_sol_salmson_desc:0 "Water-cooled radial engines and self-sealing fuel tanks allow Salmson biplanes to strafe retreating German columns from tree-top height."
 FRA_avions_de_chasse_de_nuit:0 "Night Fighter Defense of Paris"
 FRA_avions_de_chasse_de_nuit_desc:0 "Special night-fighting squadrons guided by ground searchlight rings intercept German Gotha and Giant bombers raiding Paris in the dark."
 FRA_avions_de_reconnaissance_farman_voisin:0 "Farman & Voisin Reconnaissance Biplanes"
 FRA_avions_de_reconnaissance_farman_voisin_desc:0 "The pusher-propeller Maurice Farman MF.11 and Gabriel Voisin Type III biplanes spot Von Kluck's wheeling turn towards the Marne, proving that aviation alters strategy."
 FRA_avions_torpilleurs_marins:0 "Coastal Torpedo & Patrol Seaplanes"
 FRA_avions_torpilleurs_marins_desc:0 "Twin-float seaplanes developed by Tellier and FBA patrol shipping lanes, detecting submerged U-boat silhouettes from the air and releasing depth charges."
 FRA_aviso_et_patrouilleurs_q_ships:0 "Q-Ships & Armed Coastal Avisos"
 FRA_aviso_et_patrouilleurs_q_ships_desc:0 "Disguised merchantmen concealing 75mm guns behind folding canvas screens lure surfaced U-boats into close-range gun duels, sinking unsuspecting raiders."
 FRA_balanced_siege_and_field_artillery:0 "Balanced Field & Heavy Siege Artillery"
 FRA_balanced_siege_and_field_artillery_desc:0 "Combining quick-firing 75mm guns with 155mm howitzers and 220mm mortars gives French commanders tactical flexibility."
 FRA_ballons_captifs_saucisses:0 "Caquot Observation Balloons ('Les Saucisses')"
 FRA_ballons_captifs_saucisses_desc:0 "Albert Caquot's teardrop-shaped kite balloons remain stable in 90 km/h winds, providing observers with telephone links to artillery commanders."
 FRA_bank_of_france_gold_bullion:0 "Bank of France Gold Reserves"
 FRA_bank_of_france_gold_bullion_desc:0 "Substantial gold bullion reserves provide extraordinary creditworthiness and stable foreign exchange for vital overseas imports."
 FRA_base_navale_de_bizerte:0 "Fortified Naval Bastion of Bizerte"
 FRA_base_navale_de_bizerte_desc:0 "Transforming the Tunisian saltwater lake into a protected submarine and torpedo boat harbor dominates the Sicilian Narrows and guards the western Mediterranean basin."
 FRA_base_navale_de_saigon:0 "Saïgon River Arsenal & Dry Dock"
 FRA_base_navale_de_saigon_desc:0 "Maintaining gunboats, colonial sloops, and repair basins in Saïgon secures French maritime presence in the South China Sea and safeguards trade routes."
 FRA_bassin_chimique_marseille:0 "Marseille Chemical & Oleochemical Plants"
 FRA_bassin_chimique_marseille_desc:0 "Processing colonial peanut and palm oils into glycerin provides the key raw ingredient for nitroglycerin, smokeless cordite, and soap."
 FRA_bassin_parisien_metallurgie:0 "Paris Basin Manufacturing"
 FRA_bassin_parisien_metallurgie_desc:0 "The suburbs along the Seine from Boulogne-Billancourt to Saint-Denis form a dense manufacturing hive, providing precision tooling, motors, and advanced engineering."
 FRA_bassin_siderurgique_de_briey:0 "Briey Iron Ore Basin"
 FRA_bassin_siderurgique_de_briey_desc:0 "The minette iron deposits of Briey and Longwy supply 90% of French ore. Modern blast furnaces ensure our metallurgists produce world-class cast iron."
 FRA_bassin_textile_et_chimique_lille:0 "Lille Textile & Chemical Basin"
 FRA_bassin_textile_et_chimique_lille_desc:0 "Lille, Roubaix, and Tourcoing form the textile heart of France, spinning wool, linen, and uniforms for both export markets and military stockpiles."
 FRA_bataille_des_frontieres:0 "Battle of the Frontiers (August 1914)"
 FRA_bataille_des_frontieres_desc:0 "Over two million men clash in the Ardennes, Charleroi, and Morhange in the largest opening clash in human history, meeting German flanking armies head-on."
 FRA_bataillons_coloniaux_au_front:0 "Colonial Divisions on the Frontline"
 FRA_bataillons_coloniaux_au_front_desc:0 "General Mangin's 1st Colonial Corps forms the spearhead of decisive allied counter-offensives, proving their peerless devotion to the tricolor flag."
 FRA_bataillons_indochinois_et_malgaches:0 "Indochinese & Malagasy Pioneer Battalions"
 FRA_bataillons_indochinois_et_malgaches_desc:0 "Over one hundred thousand Vietnamese and Malagasy recruits serve in ammunition factories, motor transport columns, hospital units, and trench excavation details."
 FRA_bef_channel_ports_coordination:0 "BEF Channel Flank Coordination"
 FRA_bef_channel_ports_coordination_desc:0 "Coordinated defense of Dunkirk, Calais, and Boulogne ensures unobstructed British reinforcements into northern France."
 FRA_biplans_farman_reconnaissance:0 "Farman HF.20 Reconnaissance"
 FRA_biplans_farman_reconnaissance_desc:0 "The stable pusher-biplanes of the Farman brothers map enemy trench layouts and troop movements, providing headquarters with daily aerial photography."
 FRA_blaise_diagne_citizenship_reforms:0 "Blaise Diagne Citizenship Reforms"
 FRA_blaise_diagne_citizenship_reforms_desc:0 "Extending full French civic rights to decorated colonial soldiers recognizes supreme service to the Republic."
 FRA_blocus_de_l_adriatique:0 "Adriatic Blockade & Otranto Barrage"
 FRA_blocus_de_l_adriatique_desc:0 "Bottling up the Austro-Hungarian fleet in Pola and Cattaro prevents enemy battleships from venturing into the Mediterranean or severing French troop convoys."
 FRA_blocus_du_canal_d_otrante:0 "The Otranto Barrage Blockade"
 FRA_blocus_du_canal_d_otrante_desc:0 "Joining British and Italian flotillas across the Strait of Otranto, French destroyers and drifters bottle up the Austro-Hungarian fleet in Pola."
 FRA_bombardement_strategique_usines_rhenanes:0 "Strategic Raids on the Rhineland"
 FRA_bombardement_strategique_usines_rhenanes_desc:0 "French heavy bombers fly deep into Germany to strike the blast furnaces of Völklingen and the chemical works of Ludwigshafen, disrupting enemy production."
 FRA_bombardiers_breguet_14:0 "Breguet 14 All-Metal Bomber"
 FRA_bombardiers_breguet_14_desc:0 "Louis Breguet constructs the first mass-produced aircraft using duralumin metal framing. Sturdy and fast, the Breguet 14 bombs enemy railheads and tactical columns with impunity."
 FRA_bons_de_la_defense_nationale:0 "National Defense War Bonds"
 FRA_bons_de_la_defense_nationale_desc:0 "'Pour la France qui vient de loin, souscrivez!' Popular short-term bonds and patriotic posters mobilize household savings into billions of francs for victory."
 FRA_boue_de_lapeyrere_naval_law:0 "Boué de Lapeyrère Naval Program"
 FRA_boue_de_lapeyrere_naval_law_desc:0 "A deliberate focus on modern dreadnoughts and fleet modernization revitalizes French maritime supremacy."
 FRA_british_coal_imports:0 "British Maritime Coal Lifeline"
 FRA_british_coal_imports_desc:0 "Guaranteed shipments of high-grade British coal replace lost production from the occupied Nord coal basins."
 FRA_british_naval_entente:0 "Anglo-French Naval Partition"
 FRA_british_naval_entente_desc:0 "The Royal Navy guards the North Sea and English Channel, allowing the Marine Nationale to secure absolute dominance across the Western Mediterranean and French African sea lanes."
 FRA_canon_de_75mm_modele_1897:0 "75mm Mle 1897 Rapid-Fire Supremacy"
 FRA_canon_de_75mm_modele_1897_desc:0 "Capable of firing fifteen aimed shrapnel shells per minute without re-aiming, the French 75 remains the undisputed king of field artillery."
 FRA_canons_sur_voie_ferree_alvf:0 "ALVF Railway Super-Heavy Siege Guns"
 FRA_canons_sur_voie_ferree_alvf_desc:0 "Mounting 320mm and 400mm naval barrels onto specialized railroad carriages allows pulverizing deep reinforced concrete bunkers from twenty miles away."
 FRA_caoutchouc_et_riz_d_indochine:0 "Indochinese Rubber & Rice Harvests"
 FRA_caoutchouc_et_riz_d_indochine_desc:0 "Expanding Hevea rubber plantations in the red earth regions of Cambodia and Cochinchina feeds Michelin's pneumatic tyre mills, insulating France from rubber shortages."
 FRA_capitulation_de_la_bulgarie:0 "The Armistice of Salonica (Bulgarian Collapse)"
 FRA_capitulation_de_la_bulgarie_desc:0 "Bulgaria signs the Armistice of Salonica on 29 September 1918, shattering the Central Powers' Balkan bridge to Istanbul and exposing Austria's southern frontier."
 FRA_caquot_observation_balloons:0 "Caquot Aerodynamic Observation Balloons"
 FRA_caquot_observation_balloons_desc:0 "Tethered kite balloons designed by Albert Caquot remain stable in high winds, providing continuous artillery spotting."
 FRA_catastrophe_du_chemin_des_dames:0 "Catastrophe on the Chemin des Dames"
 FRA_catastrophe_du_chemin_des_dames_desc:0 "April 16, 1917: Assaulting the impregnable limestone ridge in sleet and freezing rain, 100,000 French soldiers fall in days against German machine-gun caverns."
 FRA_censure_et_bourrage_de_crane:0 "Press Censorship & War Morale"
 FRA_censure_et_bourrage_de_crane_desc:0 "The military press bureau ('Anastasie') excises military leaks, defeats, and defeatist defeatism from newspapers, preserving home-front calm despite grim trench reality."
 FRA_cent_jours_combined_arms:0 "Cent Jours Combined Arms Surge"
 FRA_cent_jours_combined_arms_desc:0 "Bounded final offensive: synchronized tanks, creeping barrages, and aircraft breaking the Hindenburg Line."
 FRA_cent_jours_final_offensive:0 "The Hundred Days Allied Offensive"
 FRA_cent_jours_final_offensive_desc:0 "Synchronize tanks, aviation, and rolling barrages under unified command to shatter the Hindenburg Line and force an armistice."
 FRA_chantiers_navals_saint_nazaire:0 "Saint-Nazaire Chantiers de l'Atlantique"
 FRA_chantiers_navals_saint_nazaire_desc:0 "The sprawling shipyards of Saint-Nazaire and Nantes construct large merchant hulls, troopships, and boiler machinery to defy German commerce raiders."
 FRA_char_leger_renault_ft:0 "The Revolutionary Renault FT-17"
 FRA_char_leger_renault_ft_desc:0 "Engineered by Louis Renault and Estienne, the FT-17 invents modern tank layout: engine in back, driver in front, and a fully rotating 360-degree top turret."
 FRA_charles_maurras_doctrine_politique:0 "The Maurrassian Integral State"
 FRA_charles_maurras_doctrine_politique_desc:0 "Integral nationalism: hereditary monarchy, corporate guilds, anti-parliamentarism, and the restoration of France's historic provinces."
 FRA_chars_schneider_ca1_et_saint_chamond:0 "Schneider CA1 & Saint-Chamond Assault Tanks"
 FRA_chars_schneider_ca1_et_saint_chamond_desc:0 "The first French armored vehicles surmount trenches with forward trench-cutting bows and short 75mm guns, testing armored warfare at Berry-au-Bac."
 FRA_chasseurs_de_nuit_et_projecteurs:0 "Night Air Interception & Searchlights"
 FRA_chasseurs_de_nuit_et_projecteurs_desc:0 "Establishing rings of anti-aircraft searchlights and night-patrol fighters around Paris and Nancy shields civilian populations from German Gotha and Zeppelin bombers."
 FRA_chasseurs_de_sous_marins_sub_chaser:0 "American Wooden Sub-Chaser Contracts"
 FRA_chasseurs_de_sous_marins_sub_chaser_desc:0 "Purchasing 110-foot wooden sub-chasers from US shipyards supplements French escorts with agile, mass-produced anti-submarine screening craft."
 FRA_chasseurs_nieuport_11_bebe:0 "Nieuport 11 'Bébé' Fighter Biplane"
 FRA_chasseurs_nieuport_11_bebe_desc:0 "Gustave Delage's lightweight sesquiplane out-turns and out-climbs the German Fokker Eindeckers, putting an end to the 'Fokker Scourge' over the Verdun front."
 FRA_chasseurs_spad_vii_et_xiii:0 "SPAD VII & XIII Heavy Pursuit Fighters"
 FRA_chasseurs_spad_vii_et_xiii_desc:0 "Built around the 220hp Hispano-Suiza engine, Louis Béchereau's SPAD XIII is a diving gun-platform capable of over 210 km/h, flown by all top Allied aces."
 FRA_chasseurs_spad_vii_hispano:0 "SPAD VII & Hispano-Suiza V8"
 FRA_chasseurs_spad_vii_hispano_desc:0 "Powered by Marc Birkigt's cast-aluminum water-cooled V8 engine, the SPAD VII is rugged, heavy, and capable of devastating high-speed diving attacks."
 FRA_chasseurs_spad_xiii_suprematie:0 "SPAD XIII Aerial Supremacy"
 FRA_chasseurs_spad_xiii_suprematie_desc:0 "Carrying twin synchronized Vickers guns and a 220 hp engine, the SPAD XIII outclimbs and outdives every German opponent across the 1918 battlefields."
 FRA_chemical_explosives_industry:0 "Chemical Explosives Syndicate"
 FRA_chemical_explosives_industry_desc:0 "Advanced chemical plants along the Rhône synthesize cordite, nitrocellulose, and trinitrotoluene on a massive scale."
 FRA_chemin_de_fer_dakar_niger:0 "Dakar-Niger Railway Construction"
 FRA_chemin_de_fer_dakar_niger_desc:0 "Extending railway lines through French Sudan to Bamako unlocks peanut exports and accelerates colonial troop transport from the interior to coastal ports."
 FRA_chemin_de_fer_yunnan_vietnam:0 "The Yunnan-Vietnam Strategic Railway"
 FRA_chemin_de_fer_yunnan_vietnam_desc:0 "A monumental feat of French civil engineering, the narrow-gauge railway from Haiphong to Kunming penetrates deep into Southwest China, securing commercial primacy."
 FRA_chemins_de_fer_de_l_est:0 "Compagnie des Chemins de Fer de l'Est"
 FRA_chemins_de_fer_de_l_est_desc:0 "Double-tracked arterial lines direct from Paris through Châlons-sur-Marne straight to the fortress cities of Verdun, Toul, Nancy, and Épinal, tailored for rapid strategic deployment."
 FRA_chemins_de_fer_du_nord:0 "Compagnie des Chemins de Fer du Nord"
 FRA_chemins_de_fer_du_nord_desc:0 "Heavily engineered trackways link Paris to Amiens, Arras, Lille, and the Belgian border, guaranteeing heavy transport for northern coal and industrial freight."
 FRA_chemins_de_fer_nord_africains:0 "Trans-Maghreb Railway Interconnection"
 FRA_chemins_de_fer_nord_africains_desc:0 "Standardising track gauge and completing the trunk lines linking Casablanca, Fez, Algiers, and Tunis enables rapid east-west troop movements across French North Africa."
 FRA_chemins_de_fer_sahariens:0 "Saharan Outpost Supply Lines"
 FRA_chemins_de_fer_sahariens_desc:0 "Expanding caravan trails and light desert railway tracks from Biskra to Touggourt secures waterholes, camel corps outposts, and southern borders."
 FRA_chimie_industrielle_du_rhone:0 "Rhône Chemical Conglomerates"
 FRA_chimie_industrielle_du_rhone_desc:0 "Chemical works at Saint-Fons and Lyon synthesize synthetic dyes, nitrocellulose, and picric acid, laying the technical foundation for modern high-explosive munition fillings."
 FRA_chimie_industrielle_saint_fons:0 "Saint-Fons Chemical & Explosives Hub"
 FRA_chimie_industrielle_saint_fons_desc:0 "The chemical plants of Lyon and Saint-Fons synthesize nitric acid, Poudre B nitrocellulose, and melinite, securing independent production of high-explosive charges."
 FRA_citoyennete_et_recompenses_coloniales:0 "Blaise Diagne's Citizenship Reforms"
 FRA_citoyennete_et_recompenses_coloniales_desc:0 "Senegalese deputy Blaise Diagne secures full French citizenship for residents of the Four Communes of Senegal in exchange for enthusiastic military enlistment."
 FRA_citoyennete_francaise_elargie:0 "Universal Imperial Citizenship"
 FRA_citoyennete_francaise_elargie_desc:0 "Extending full civic equality to all subjects of the overseas departments, cementing loyalty to the tricolor through liberty, equality, and fraternity."
 FRA_clemenceau_iron_resolve:0 "Je Fais la Guerre (Clemenceau)"
 FRA_clemenceau_iron_resolve_desc:0 "Georges Clemenceau embodies absolute determination: no compromise, no pacifism, only total victory."
 FRA_colonel_duval_air_division:0 "Massed Air Division (Colonel Duval)"
 FRA_colonel_duval_air_division_desc:0 "Concentrating hundreds of bombers and fighters under unified tactical command crushes enemy frontline concentrations."
 FRA_colonial_logistics_labor:0 "Colonial Labor & Logistics Corps"
 FRA_colonial_logistics_labor_desc:0 "Indochinese and North African worker contingents maintain port handling, rail maintenance, and ammunition dumps."
 FRA_colonial_order_aof:0 "Order of French West Africa"
 FRA_colonial_order_aof_desc:0 "The colonial administration in Dakar ensures civic stability and steady resource extraction across French West Africa."
 FRA_comite_de_guerre_secret:0 "Secret War Committee"
 FRA_comite_de_guerre_secret_desc:0 "Meeting behind closed doors, key parliamentary leaders examine logistics, shell shortages, and general staff decisions without alerting enemy espionage."
 FRA_comite_des_forges_coordination:0 "Heavy Industry Coordination Compact"
 FRA_comite_des_forges_coordination_desc:0 "The Comité des Forges negotiates price ceilings and guaranteed steel allocations with ministry officials, keeping blast furnaces operating day and night."
 FRA_comites_de_soldats_rouges:0 "Red Soldier Councils"
 FRA_comites_de_soldats_rouges_desc:0 "Abolishing aristocratic officer privileges, units elect their commanders. Discipline is forged in political consciousness and egalitarian brotherhood."
 FRA_communaute_imperiale_unie:0 "La Plus Grande France"
 FRA_communaute_imperiale_unie_desc:0 "A united empire of 100 million Frenchmen standing together across five continents, forever safeguarding the civilization and power of France."
 FRA_commune_revolutionary_ardor:0 "Revolutionary Ardor of the Commune"
 FRA_commune_revolutionary_ardor_desc:0 "The resurrected French Commune mobilizes workers' militias and revolutionary enthusiasm, willing to fight to the last brick in defense of proletarian liberty."
 FRA_competent_civil_administration:0 "Meritocratic Civil Administration"
 FRA_competent_civil_administration_desc:0 "Rigorous competitive examinations and professional prefectures ensure administrative efficiency throughout metropolitan France."
 FRA_compromis_colonial_allemand:0 "Congo-Cameroon Colonial Compromise"
 FRA_compromis_colonial_allemand_desc:0 "Ceding marshland territory in French Equatorial Congo to German Neukamerun in exchange for uncontested German recognition of France's Moroccan protectorate preserves European peace."
 FRA_compromis_des_deux_ans_et_demi:0 "Two-and-a-Half Year Compromise"
 FRA_compromis_des_deux_ans_et_demi_desc:0 "A middle path between the army high command and socialist opposition: service is modestly extended, avoiding widespread domestic strikes while moderately boosting reserves."
 FRA_concentrate_heavy_artillery_meuse:0 "Concentrate Heavy Artillery on the Meuse"
 FRA_concentrate_heavy_artillery_meuse_desc:0 "Mass siege guns and railway howitzers to pulverize enemy assault staging areas."
 FRA_concentration_des_cinq_armees:0 "Concentration of the Five Armies"
 FRA_concentration_des_cinq_armees_desc:0 "Deploying the 1st Army (Dubail), 2nd Army (Castelnau), 3rd Army (Ruffey), 4th Army (de Langle de Cary), and 5th Army (Lanrezac) along the eastern frontier."
 FRA_condominium_d_alsace_lorraine:0 "Condominium of Alsace-Lorraine"
 FRA_condominium_d_alsace_lorraine_desc:0 "Proposing that Alsace-Lorraine become a neutral autonomous federal territory with dual Franco-German cultural rights and free trade, eliminating the spark of war."
 FRA_conseil_supreme_de_guerre_versailles:0 "Supreme War Council in Versailles"
 FRA_conseil_supreme_de_guerre_versailles_desc:0 "Established at Trianon Palace, the Supreme War Council coordinates allied strategic decisions, shipping, raw materials, and unified military reserves across the Entente."
 FRA_controle_total_de_la_mediterranee:0 "Total Mediterranean Mastery"
 FRA_controle_total_de_la_mediterranee_desc:0 "With safe sea lanes, hundreds of thousands of African soldiers, grain shipments, and colonial supplies reach French ports uninterrupted throughout the conflict."
 FRA_conversion_des_ateliers_civils:0 "Civilian Workshop Conversion"
 FRA_conversion_des_ateliers_civils_desc:0 "Bicycle manufacturers assemble rifle bolts, clockmakers turn artillery timers, and perfume distilleries produce ether for smokeless powder."
 FRA_cooperation_air_artillerie_tsf:0 "Air-Ground Wireless Radio (TSF) Link"
 FRA_cooperation_air_artillerie_tsf_desc:0 "Equipping observation aircraft with wireless Morse transmitters directs artillery fire directly onto concealed German batteries within seconds of spotting."
 FRA_coordination_des_etats_majors_haig_joffre:0 "Haig-Joffre Staff Liaison Coordination"
 FRA_coordination_des_etats_majors_haig_joffre_desc:0 "Bilingual liaison officers stationed at British GHQ in Montreuil and French GQG in Chantilly coordinate boundary lines, artillery zones, and supply railheads."
 FRA_coordination_sur_les_deux_fronts:0 "Two-Front Allied War Coordination"
 FRA_coordination_sur_les_deux_fronts_desc:0 "General Janin in Petrograd and General Ignatiev in Paris synchronize operations, coordinating Grand Duke Nicholas' East Prussian drive to draw German corps away from Paris."
 FRA_credit_lyonnais_et_haute_banque:0 "Crédit Lyonnais & Haute Banque"
 FRA_credit_lyonnais_et_haute_banque_desc:0 "With the Bank of France holding massive reserves of physical gold bullion, Paris acts as the chief lender to world powers, financing strategic foreign infrastructure and domestic credit."
 FRA_credit_national_de_reconstruction:0 "National Reconstruction Credit Bank"
 FRA_credit_national_de_reconstruction_desc:0 "Establishing a specialized public financial institution channels indemnities and state capital directly into rebuilding industrial factories and homes in the devastated north."
 FRA_credits_financiers_anglo_americains:0 "Anglo-American Financial Credits"
 FRA_credits_financiers_anglo_americains_desc:0 "Coordinating with the British Treasury and J.P. Morgan & Co. in New York secures vital foreign exchange to buy American copper, cotton, and grain without currency collapse."
 FRA_creer_l_aeronautique_militaire:0 "Founding of the Aéronautique Militaire"
 FRA_creer_l_aeronautique_militaire_desc:0 "By decree of March 1912, aviation is formally organized as an independent military service, pioneering organized military aviation with dedicated regiments, airfields, and depots."
 FRA_crise_des_munitions_1914:0 "The Great Shell Crisis of 1914"
 FRA_crise_des_munitions_1914_desc:0 "The peacetime calculation of 13,000 shells a day collapses when battle consumes 50,000 daily. Empty depots threaten our artillery with starvation unless industry mobilizes."
 FRA_crise_des_mutineries_1917:0 "The 1917 Poilu Mutinies Crisis"
 FRA_crise_des_mutineries_1917_desc:0 "Disillusioned by futile slaughter on the Chemin des Dames, half of all French combat divisions refuse suicidal attacks, singing the 'Chanson de Craonne'."
 FRA_croiseurs_auxiliaires_et_q_ships:0 "Auxiliary Cruisers & Decoy Ships"
 FRA_croiseurs_auxiliaires_et_q_ships_desc:0 "Concealing heavy 138mm naval guns behind dummy cargo crates, French Q-ships lure surfaced U-boats into close-range ambushes."
 FRA_croiseurs_cuirasses_classe_waldeck_rousseau:0 "Armored Cruisers (Waldeck-Rousseau Class)"
 FRA_croiseurs_cuirasses_classe_waldeck_rousseau_desc:0 "Fast armored cruisers armed with 194mm guns patrol open sea lanes, hunt enemy commerce raiders, and provide fleet reconnaissance."
 FRA_cuirasses_classe_bretagne:0 "Bretagne-Class Super-Dreadnoughts"
 FRA_cuirasses_classe_bretagne_desc:0 "Mounting ten 340mm guns along the centerline, Bretagne, Provence, and Lorraine elevate French firepower to counter any dreadnought built by Vienna or Berlin."
 FRA_culte_de_l_offensive_a_outrance:0 "Doctrine of 'Offensive à Outrance'"
 FRA_culte_de_l_offensive_a_outrance_desc:0 "Influenced by Colonel de Grandmaison, the École de Guerre preaches that sheer morale, cold steel, and fierce bayonet charges will conquer all enemy fire."
 FRA_dakar_atlantic_hub:0 "Dakar Atlantic Naval Hub"
 FRA_dakar_atlantic_hub_desc:0 "Deep-water berths and coal bunkering facilities secure maritime lines of communication connecting Europe, South America, and Africa."
 FRA_dakar_niger_logistics:0 "Dakar-Niger Logistic Corridor"
 FRA_dakar_niger_logistics_desc:0 "Extending railway lines into the African interior facilitates rapid dispatch of tropical commodities and volunteers."
 FRA_defence_of_verdun:0 "The Furnace of Verdun & La Voie Sacrée"
 FRA_defence_of_verdun_desc:0 "Organize logistical lifelines and division rotations to hold the Meuse fortresses against relentless German assault."
 FRA_defense_bonds_liquidity:0 "National Defense Bond Liquidity"
 FRA_defense_bonds_liquidity_desc:0 "Popular patriotic loans mobilize household savings to finance wartime purchases without hyperinflation."
 FRA_defense_de_dixmude_1914:0 "The Immortal Stand at Dixmude"
 FRA_defense_de_dixmude_1914_desc:0 "Holding Dixmude on the Yser against three German army corps for three desperate weeks, the Fusiliers Marins saved the allied flank and anchored the race to the sea."
 FRA_deploy_gallieni_mobile_reserves:0 "Deploy Gallieni's Capital Reserves"
 FRA_deploy_gallieni_mobile_reserves_desc:0 "Sortie the garrisons of the Camp Retranché de Paris to smash von Kluck's exposed western flank."
 FRA_depots_reglements_du_genie:0 "Military Engineering Supply Depots"
 FRA_depots_reglements_du_genie_desc:0 "Pre-positioning bridge timbers, narrow-gauge Decauville track sections, and fuel oil along the eastern borders allows military engineers to maintain frontline logistics under any strain."
 FRA_developpement_des_chars_d_assaut:0 "Colonel Estienne & 'Artillerie Spéciale'"
 FRA_developpement_des_chars_d_assaut_desc:0 "'Victory will belong to whoever puts a gun on a caterpillar track first,' writes Jean-Baptiste Estienne, founding the French armored combat branch."
 FRA_dirigeables_et_ballons_d_observation:0 "Caquot Tethered Observation Balloons"
 FRA_dirigeables_et_ballons_d_observation_desc:0 "Captain Albert Caquot designs aerodynamic kite-balloons ('saucisses') that remain rock-steady in high winds, providing artillery spotters telephone links to gun batteries."
 FRA_discipline_sociale_et_patronat:0 "Industrial Compact & Discipline"
 FRA_discipline_sociale_et_patronat_desc:0 "Partnering with the Comité des Forges and heavy industrial leaders, the executive guarantees labor peace through paternalistic social programs and mandatory arbitration."
 FRA_dissolution_du_bloc_des_gauches:0 "Dismantle the Left Bloc"
 FRA_dissolution_du_bloc_des_gauches_desc:0 "Breaking the legislative stranglehold of anti-clerical radicals, conservative republicans forge a broad National Bloc committed to social order and fiscal responsibility."
 FRA_division_aerienne_du_colonel_duval:0 "Colonel Duval's Mass Air Division"
 FRA_division_aerienne_du_colonel_duval_desc:0 "Forming the world's first independent tactical air division—over 600 fighters and bombers massed under a single commander—delivers decisive aerial hammer blows wherever the enemy strikes."
 FRA_doctrine_d_emploi_des_blindes_estienne:0 "Estienne's Swarm Armor Doctrine"
 FRA_doctrine_d_emploi_des_blindes_estienne_desc:0 "Instead of lone leviathans, France deploys thousands of small, agile FT-17 tanks operating in tight swarms with infantry and artillery, overwhelming trench lines."
 FRA_doctrine_petain_feu_et_materiel:0 "Pétain's Doctrine: 'Firepower Kills'"
 FRA_doctrine_petain_feu_et_materiel_desc:0 "'Firepower kills!' General Pétain's revolutionary motto replaces wasteful infantry charges with devastating artillery barrages, deep trench belts, and elastic defense."
 FRA_draconian_decimation_repression:0 "Draconian Decimation & Executions"
 FRA_draconian_decimation_repression_desc:0 "Enforce brutal military code to shoot mutineers pour encourager les autres. High risk of national strike!"
 FRA_dragage_des_mines_de_mer:0 "Minesweeping Flotillas"
 FRA_dragage_des_mines_de_mer_desc:0 "Clearing the deadly minefields sown across the English Channel and the Gulf of Lion ensures allied troopships sail with minimal losses."
 FRA_dreadnoughts_classe_courbet:0 "Courbet-Class Dreadnoughts"
 FRA_dreadnoughts_classe_courbet_desc:0 "Commissioning Jean Bart, Courbet, Paris, and France delivers twelve 305mm heavy guns in six turrets, giving the French battle line true dreadnought striking power."
 FRA_eastern_front_containment:0 "Russian Pressure on the East"
 FRA_eastern_front_containment_desc:0 "Russian offensives in East Prussia and Galicia pin down vast German corps away from Paris."
 FRA_echec_de_l_offensive_initiale:0 "The Brutal Shock of Modern War"
 FRA_echec_de_l_offensive_initiale_desc:0 "Losing 27,000 dead on August 22 alone, the bloodiest day in French history exposes the catastrophe of charging concealed machine guns across open fields."
 FRA_ecole_normale_et_instituteurs:0 "Republic's Black Hussars (Teachers)"
 FRA_ecole_normale_et_instituteurs_desc:0 "The secular schoolmasters ('Hussards noirs') form the moral backbone of every commune, teaching scientific method, French history, and unyielding civic duty."
 FRA_ecoles_d_aviation_pau_avord:0 "Aviation Academies: Pau & Avord"
 FRA_ecoles_d_aviation_pau_avord_desc:0 "Thousands of cadet pilots are trained through rigorous aerobatic regimens, stunt maneuvers, and aerial gunnery on the sunny plains of southwestern France."
 FRA_ecoles_de_pilotage_pau_et_etampes:0 "Flight Schools of Pau & Étampes"
 FRA_ecoles_de_pilotage_pau_et_etampes_desc:0 "Civilian flying schools founded by Blériot and Farman are militarized to train hundreds of military aviators in aerobatics, navigation, and cross-country reconnaissance."
 FRA_election_presidentielle_1913:0 "Presidential Election of 1913"
 FRA_election_presidentielle_1913_desc:0 "Meeting at the Palace of Versailles, the National Assembly must choose the successor to President Armand Fallières. The contest between Raymond Poincaré and Jules Pams will define French foreign resolve."
 FRA_electrification_du_midi:0 "Electrification of Midi & Pyrenees Railways"
 FRA_electrification_du_midi_desc:0 "Harnessing Pyrenean water turbines powers electric locomotives on the Midi network, saving precious coal and boosting transit between Toulouse and the coast."
 FRA_employer_union_compact:0 "Tripartite Social Accord"
 FRA_employer_union_compact_desc:0 "State arbitration between employers and workers prevents paralyzing strikes during vital infrastructure projects."
 FRA_emprunts_nationaux_de_la_defense:0 "National Defense War Loans"
 FRA_emprunts_nationaux_de_la_defense_desc:0 "'Pour la France qui combat, pour la France qui sera victorieuse!' French families open their savings, pouring gold into national bonds to finance victory."
 FRA_emprunts_russes_chemin_de_fer:0 "French Loans for Russian Strategic Rail"
 FRA_emprunts_russes_chemin_de_fer_desc:0 "French bondholders subscribe hundreds of millions of francs to fund double-track strategic railways across Poland and Western Russia, cutting Russian mobilization time in half."
 FRA_entente_cordiale_brotherhood:0 "Entente Cordiale Brotherhood"
 FRA_entente_cordiale_brotherhood_desc:0 "Centuries of Anglo-French rivalry give way to staunch military cooperation against continental hegemony."
 FRA_entente_diplomacy:0 "Entente Coalition Coordination"
 FRA_entente_diplomacy_desc:0 "Coordinate military planning with Great Britain, the Russian Empire, Italy, and the arriving American Expeditionary Force."
 FRA_epuration_des_defaitistes:0 "Purge of Defeatists & Pacifists"
 FRA_epuration_des_defaitistes_desc:0 "Clemenceau orders the arrest of former Premier Joseph Caillaux, Minister Louis Malvy, and the editors of Bonnet Rouge. Defeatism is treated as high treason against the Republic."
 FRA_equip_doughboys_with_french_equipment:0 "Equip American Doughboys with French Arms"
 FRA_equip_doughboys_with_french_equipment_desc:0 "Supply arriving US divisions with French 75mm guns, Chauchat automatic rifles, and FT tanks."
 FRA_escadre_de_l_atlantique_brest:0 "Brest Atlantic Squadron"
 FRA_escadre_de_l_atlantique_brest_desc:0 "Guarding the approaches to the English Channel and the Bay of Biscay, the squadron at Brest patrols transatlantic commerce and escorts incoming troop transports."
 FRA_escadrille_des_cigognes_et_as_du_ciel:0 "Escadrille des Cigognes (Flying Aces)"
 FRA_escadrille_des_cigognes_et_as_du_ciel_desc:0 "Pilots like Georges Guynemer, René Fonck, and Charles Nungesser of Groupe de Chasse 12 ('The Storks') become national legends, inspiring the whole nation with chivalric valor."
 FRA_escadrille_la_fayette:0 "L'Escadrille La Fayette"
 FRA_escadrille_la_fayette_desc:0 "American volunteer pilots flock to France under the emblem of a Sioux warrior head, flying hazardous combat missions long before US official entry."
 FRA_escadrilles_de_protection_du_gqg:0 "High Command Air Escort Groups"
 FRA_escadrilles_de_protection_du_gqg_desc:0 "Elite fighter flights circle overhead allied railway hubs and army command headquarters, shooting down German reconnaissance scouts."
 FRA_escorted_maritime_convoys:0 "Allied Escorted Maritime Convoys"
 FRA_escorted_maritime_convoys_desc:0 "Grouping merchantmen under rigorous naval destroyer escorts sharply reduces losses to unrestricted submarine warfare."
 FRA_escorteurs_rapides_classe_ailette:0 "Ailette Fast Convoy Escorts"
 FRA_escorteurs_rapides_classe_ailette_desc:0 "Purpose-built shallow-draft escort sloops protect merchant shipping convoys from Saint-Nazaire and Bordeaux against coastal mining and U-boat raids."
 FRA_essor_de_la_belle_epoque:0 "Belle Époque Economic Prosperity"
 FRA_essor_de_la_belle_epoque_desc:0 "The Parisian stock exchange, flourishing trade, and rapid urban growth embody France's golden era of commercial wealth and cultural prestige."
 FRA_essor_de_la_sfio:0 "Rise of the SFIO Socialists"
 FRA_essor_de_la_sfio_desc:0 "Led by the eloquent Jean Jaurès, the Section Française de l'Internationale Ouvrière champions working-class rights, universal pensions, and international peace, rallying workers to constitutional socialism."
 FRA_etablissements_schneider_le_creusot:0 "Schneider-Creusot Ordnance Works"
 FRA_etablissements_schneider_le_creusot_desc:0 "The Schneider family empire produces advanced rapid-fire howitzers, mountain guns, and fortress cupolas rivaling Krupp and Škoda in engineering excellence."
 FRA_etoile_ferroviaire_de_paris:0 "The Paris Railway Radial Star"
 FRA_etoile_ferroviaire_de_paris_desc:0 "Six major terminal stations connect Paris to every province of the Republic. Modernizing track switches and marshaling yards ensures that military trains can traverse the hub in hours."
 FRA_execute_plan_xvii_mission:0 "Execute Plan XVII Operational Breakthrough"
 FRA_execute_plan_xvii_mission_desc:0 "Joffre's grand offensive into the lost provinces of Alsace and Lorraine. We must capture Strasbourg and Colmar within 25 days!"
 FRA_exhausted_classes_crisis:0 "Demographic Exhaustion of 1917"
 FRA_exhausted_classes_crisis_desc:0 "Years of attritional warfare on the Western Front have bled France's youth dry. Calling up older classes and wounded veterans strains the very fabric of French society."
 FRA_expand_munitionnettes_workforce:0 "Expand Munitionnettes Industrial Force"
 FRA_expand_munitionnettes_workforce_desc:0 "Recruit female workers into state arms plants to maximize shell output."
 FRA_exploiter_la_guerre_sous_marine_a_outrance:0 "Outrage Over Unrestricted Submarine Warfare"
 FRA_exploiter_la_guerre_sous_marine_a_outrance_desc:0 "German sinkings of neutral passenger liners like the Sussex and Lusitania are publicized worldwide, turning global and American sympathy decisively toward the Entente."
 FRA_federation_coloniale_associee:0 "Associated Colonial Federation"
 FRA_federation_coloniale_associee_desc:0 "Replacing colonial subjugation with an autonomous federal commonwealth, granting representation and internal home-rule to Indochina, Madagascar, and Africa."
 FRA_federation_des_bourses_du_travail:0 "Federation of Bourses du Travail"
 FRA_federation_des_bourses_du_travail_desc:0 "Decentralized communes coordinate production, distribution, and mutual aid across the cantons of France without bureaucratic parasitic centralization."
 FRA_ferdinand_foch_commandement_unique:0 "Foch: Supreme Allied Commander & Marshal"
 FRA_ferdinand_foch_commandement_unique_desc:0 "At Doullens in March 1918, General Ferdinand Foch is elevated to supreme commander over all Allied forces on the Western Front, receiving the baton of Maréchal de France for guiding the nation to victory."
 FRA_fermete_diplomatique_agadir:0 "Firm Resolve Against German Gunboats"
 FRA_fermete_diplomatique_agadir_desc:0 "Backed by British Chancellor Lloyd George's Mansion House speech, Premier Joseph Caillaux rejects German intimidation, demonstrating Entente unity."
 FRA_firepower_doctrine:0 "Firepower Superiority Doctrine"
 FRA_firepower_doctrine_desc:0 "Artillery conquers, infantry occupies. Heavy guns pound enemy works relentlessly before any soldier advances."
 FRA_flotte_de_haute_mer_mediterranee:0 "1st High Seas Army in the Mediterranean"
 FRA_flotte_de_haute_mer_mediterranee_desc:0 "Stationing all modern battleships in Toulon and Mers-el-Kébir creates a formidable striking fist, ready to intercept the German battlecruiser Goeben or crush the Austrian fleet."
 FRA_flotte_de_la_mediterranee_toulon:0 "Toulon Mediterranean Battle Fleet"
 FRA_flotte_de_la_mediterranee_toulon_desc:0 "The Arsenal of Toulon concentrates our premier naval power, safeguarding the sea lanes between Marseille and Algiers against Austrian and Ottoman ambitions."
 FRA_flotte_de_la_victoire_1918:0 "The Triumphant Marine Nationale"
 FRA_flotte_de_la_victoire_1918_desc:0 "Entering the Dardanelles, Sevastopol, and Pola, the victorious French fleet stands as one of the world's foremost naval powers, decorated with steadfast naval honor."
 FRA_flottilles_de_sous_marins_narval:0 "Brumaire & Pluviôse Submarine Flotillas"
 FRA_flottilles_de_sous_marins_narval_desc:0 "Deploying steam-and-diesel submarines into the Adriatic lays defensive minefields and harasses Austro-Hungarian battleships leaving naval anchorages."
 FRA_fonderies_de_lorraine:0 "Lorraine Steel Foundries"
 FRA_fonderies_de_lorraine_desc:0 "Constructing state-of-the-art Thomas-Gilchrist converter towers turns phosphoric iron ore into high-tensile structural steel for railways and bridge spans."
 FRA_force_noire_integration:0 "La Force Noire Integration"
 FRA_force_noire_integration_desc:0 "Conceived by General Charles Mangin, colonial infantry units bridge the metropolitan demographic shortfall with bravery."
 FRA_foreign_legion_cadres:0 "Légion Étrangère Elite Cadres"
 FRA_foreign_legion_cadres_desc:0 "Foreign volunteers bound by sacred legionary brotherhood defend French colors to the last breath."
 FRA_fortify_paris_camp_retranche:0 "Fortify Camp Retranché de Paris"
 FRA_fortify_paris_camp_retranche_desc:0 "Dig trenches and lay wire across the outer Parisian belt to ensure the capital can withstand any siege."
 FRA_franco_russian_sacred_alliance:0 "Franco-Russian Sacred Alliance"
 FRA_franco_russian_sacred_alliance_desc:0 "The cornerstone of French security: binding mutual defense guarantees that force Germany to fight on two fronts."
 FRA_front_d_orient_a_salonique:0 "Allied Army of the Orient at Salonica"
 FRA_front_d_orient_a_salonique_desc:0 "General Sarrail builds the fortified 'Birdcage' around Salonica, welcoming Serbian, British, Italian, and Greek divisions to tie down German and Bulgarian armies in the Balkans."
 FRA_fully_motorised_logistics:0 "Motorized Supply Columns"
 FRA_fully_motorised_logistics_desc:0 "Replacing horse carts with fleets of Renault and Berliet trucks accelerates tactical redeployments."
 FRA_fusil_mitrailleur_chauchat:0 "Chauchat CSRG Light Automatic Rifle"
 FRA_fusil_mitrailleur_chauchat_desc:0 "Mass-produced from stamped sheet metal, the Chauchat equips every infantry combat squad with marching fire capacity, supporting attacks with mobile automatic bursts."
 FRA_fusiliers_marins_amiral_ronarch:0 "Admiral Ronarc'h's Fusiliers Marins"
 FRA_fusiliers_marins_amiral_ronarch_desc:0 "When the front cracked in 1914, Admiral Pierre-Alexis Ronarc'h organized 6,000 Breton sailors into the Brigade des Fusiliers Marins to fight as infantry."
 FRA_garantie_de_la_neutralite_belge:0 "Guarantor of the 1839 Treaty of London"
 FRA_garantie_de_la_neutralite_belge_desc:0 "Reaffirming France and Britain's solemn pledge to uphold Belgian perpetual neutrality protects the Low Countries against Prussian encroachment."
 FRA_general_joffre_chef_d_etat_major:0 "General Joffre's Staff Centralisation"
 FRA_general_joffre_chef_d_etat_major_desc:0 "General Joseph Joffre imposes imperturbable calm, weeding out political favorites and appointing capable tacticians to lead army corps regardless of faction."
 FRA_gestion_du_collapsus_russe_1917:0 "Handling the 1917 Russian Collapse"
 FRA_gestion_du_collapsus_russe_1917_desc:0 "When revolution disintegrates the Russian front and the Bolsheviks sign the Brest-Litovsk peace, France stiffens her Western Front defenses against forty transferred German divisions."
 FRA_gouvernement_de_defense_nationale:0 "National Defense Government"
 FRA_gouvernement_de_defense_nationale_desc:0 "Premier René Viviani reorganizes the cabinet to include socialist leaders Jules Guesde and Marcel Sembat alongside Alexandre Millerand, cementing national unity across the political spectrum."
 FRA_gouvernement_militaire_de_paris_gallieni:0 "General Gallieni Defends Paris"
 FRA_gouvernement_militaire_de_paris_gallieni_desc:0 "'I have been given the mandate to defend Paris against the invader. This mandate I shall fulfill to the end.' Gallieni turns Paris into an active army bastion."
 FRA_grand_quartier_general:0 "Grand Quartier Général (GQG)"
 FRA_grand_quartier_general_desc:0 "Establishing the supreme military headquarters in Chantilly unifies operational command, communications, intelligence, and logistical movement across all French field armies."
 FRA_grande_retraite_organisee:0 "The Great Organized Retreat"
 FRA_grande_retraite_organisee_desc:0 "Under scorching August heat, Joffre maintains iron composure, executing a Fighting Retreat for 200 kilometers without allowing his armies to be encircled or crushed."
 FRA_grenades_anti_sous_marines_guiraud:0 "Guiraud Depth Charges & Hydrophones"
 FRA_grenades_anti_sous_marines_guiraud_desc:0 "Invented by French naval engineers, hydrostatic depth charges and underwater listening hydrophones allow surface escorts to strike submerged U-boats."
 FRA_greve_generale_insurrectionnelle:0 "General Insurrectionary Strike"
 FRA_greve_generale_insurrectionnelle_desc:0 "Factories fall silent, railway wheels stop turning, and the red flag is raised over the Bourses du Travail. The working class claims sovereignty over production."
 FRA_guerre_des_mines_vauquois:0 "Underground Mine Warfare at Vauquois"
 FRA_guerre_des_mines_vauquois_desc:0 "Sappeur miners tunnel hundreds of meters beneath the chalk hills to detonate 60-ton ammonal charges under enemy strongpoints, ripping the terrain into lunar craters."
 FRA_hauts_fourneaux_de_lorraine:0 "Lorraine Blast Furnaces"
 FRA_hauts_fourneaux_de_lorraine_desc:0 "The minette iron ore deposits of Briey and Longwy feed dozens of towering blast furnaces, making French Lorraine one of Europe's primary metallurgical engines."
 FRA_heritage_aeronautique_victorieux:0 "Victorious French Aerospace Industry"
 FRA_heritage_aeronautique_victorieux_desc:0 "Having produced over fifty thousand military aircraft during the war, French aerospace constructors lead the world into the era of commercial flight and national glory."
 FRA_hispano_suiza_aero_engines:0 "Hispano-Suiza & Gnome-Rhône Engine Works"
 FRA_hispano_suiza_aero_engines_desc:0 "Aluminum-block V8 engines provide superior power-to-weight ratios for French combat aircraft."
 FRA_horizon_blue_uniforms_idea:0 "Bleu Horizon Low-Visibility Uniforms"
 FRA_horizon_blue_uniforms_idea_desc:0 "Replacing bright red trousers with subdued horizon blue blend French infantry into misty European battlegrounds."
 FRA_houille_blanche_des_alpes:0 "Alpine Hydroelectricity (Houille Blanche)"
 FRA_houille_blanche_des_alpes_desc:0 "Tapping glacial torrents in Grenoble and Savoy generates clean hydroelectric power for aluminum smelters, electrometallurgy, and synthetic calcium carbide."
 FRA_ils_ne_passeront_pas:0 "'Ils Ne Passeront Pas!'"
 FRA_ils_ne_passeront_pas_desc:0 "Proclaimed by Nivelle and Pétain, the rallying cry echoes across Fort Vaux, Fleury, and Dead Man's Hill. France stood unbreakable; the German offensive was broken."
 FRA_imperial_blood_solidarity:0 "Imperial Blood Solidarity"
 FRA_imperial_blood_solidarity_desc:0 "Shared sacrifice on the battlefield creates unbreakable ties between the metropole and overseas peoples."
 FRA_importations_de_charbon_anglais:0 "British Welsh Coal Convoys"
 FRA_importations_de_charbon_anglais_desc:0 "To replace the lost coalfields of the Nord, cargo fleets under naval escort deliver millions of tons of high-grade Welsh coal to Rouen and Le Havre."
 FRA_importations_de_charbon_britannique:0 "British Coal Sea Convoys"
 FRA_importations_de_charbon_britannique_desc:0 "To replace lost northern coal pits, colliers ship millions of tonnes from Cardiff and Newcastle directly into Rouen, Brest, and Bordeaux under naval escort."
 FRA_improve_trench_soup_and_wine:0 "Improve Poilu Trench Rations (Pinard & Soup)"
 FRA_improve_trench_soup_and_wine_desc:0 "Ensure hot food transport and regular wine rations directly to front trenches."
 FRA_industrie_automobile_renault_panhard:0 "Automotive Giants: Renault & Panhard"
 FRA_industrie_automobile_renault_panhard_desc:0 "Louis Renault and Panhard & Levassor pioneered the modern internal combustion automobile. French motor output leads Europe, creating an invaluable motorized industrial base."
 FRA_instruction_militaire_des_doughboys:0 "French Officer Training for US Troops"
 FRA_instruction_militaire_des_doughboys_desc:0 "French veteran officers and NCOs instruct newly arrived American divisions in gas warfare, hand grenade tactics, crawling under wire, and trench raid methods."
 FRA_integration_des_conscrits_de_1913:0 "Incorporate the Class of 1913"
 FRA_integration_des_conscrits_de_1913_desc:0 "Barracks across France absorb the new recruits, subjecting them to intense bayonet drills, forced marches, and field maneuvers before August 1914."
 FRA_intervention_a_odessa_mar_noir:0 "Black Sea Naval Expedition to Odessa"
 FRA_intervention_a_odessa_mar_noir_desc:0 "French naval divisions sail to Odessa and Sevastopol to safeguard allied armaments and assist anti-Bolshevik White Russian forces."
 FRA_intervention_a_odessa_mer_noire:0 "Black Sea & Odessa Expedition"
 FRA_intervention_a_odessa_mer_noire_desc:0 "Following the collapse of Russian authority, French squadrons and colonial landing parties anchor in Odessa and Sevastopol to secure grain and protect southern allied interests."
 FRA_issue_national_defense_bonds:0 "Issue National Defense Loans"
 FRA_issue_national_defense_bonds_desc:0 "Raise patriotic domestic capital without fueling currency inflation."
 FRA_je_fais_la_guerre:0 "'Je fais la guerre' (I Wage War)"
 FRA_je_fais_la_guerre_desc:0 "'Home policy? I wage war. Foreign policy? I wage war. Russia deserts us? I wage war. Until the final quarter of an hour!' Clemenceau galvanizes the French soul to victory."
 FRA_joffre_supreme_staff:0 "Grand Quartier Général (Joffre Staff)"
 FRA_joffre_supreme_staff_desc:0 "Centralized operational control from GQG coordinates rail mobilizations and strategic troop redeployments."
 FRA_joint_franco_american_staff:0 "Franco-American Combined Staff"
 FRA_joint_franco_american_staff_desc:0 "French instructors train arriving American divisions in modern artillery spotting, gas defense, and trench tactics."
 FRA_joint_liaison_missions:0 "Balkan Allied Military Liaison"
 FRA_joint_liaison_missions_desc:0 "French advisory missions in Serbia and Romania coordinate supplies and counter-offensives across southeastern Europe."
 FRA_journee_de_huit_heures:0 "The Eight-Hour Work Day"
 FRA_journee_de_huit_heures_desc:0 "The historic demand of the international labor movement is codified into French law. Eight hours of work, eight hours of rest, eight hours of leisure."
 FRA_justice_militaire_mesuree:0 "Measured Military Justice & Pardons"
 FRA_justice_militaire_mesuree_desc:0 "Refusing draconian decimation demanded by reactionaries, Pétain pardons hundreds of condemned soldiers, executing only fifty-five ringleaders and quelling rebellion."
 FRA_kaiser_offensive_halted:0 "Repulse of the Kaiserschlacht"
 FRA_kaiser_offensive_halted_desc:0 "Weathering the German spring stormtroopers through depth and artillery prepares the stage for the final Allied victory."
 FRA_l_alliance_franco_russe:0 "The Franco-Russian Sacred Alliance"
 FRA_l_alliance_franco_russe_desc:0 "Sealed in 1892 between the Republic and Tsar Alexander III, the Franco-Russian military convention guarantees mutual assistance in the event of German aggression, pinning Germany between two fronts."
 FRA_l_empire_colonial_francais:0 "The French Colonial Empire"
 FRA_l_empire_colonial_francais_desc:0 "Covering over ten million square kilometres across Africa and Asia, the overseas empire provides strategic depth, vital raw materials, and millions of devoted subjects to the tricolor."
 FRA_l_entente_cordiale:0 "The Anglo-French Entente Cordiale"
 FRA_l_entente_cordiale_desc:0 "Forged in 1904 by Théophile Delcassé and King Edward VII, the Entente dissolves centuries of colonial rivalry, uniting the two great liberal democracies in diplomatic defense against German ambition."
 FRA_l_indochine_francaise:0 "French Indochina & The Red River"
 FRA_l_indochine_francaise_desc:0 "Governor-General Albert Sarraut modernizes colonial governance across Tonkin, Annam, and Cochin-China, building schools, medical stations, and dikes in the rice deltas."
 FRA_la_bataille_de_la_somme_soutien:0 "Battle of the Somme (French 6th Army)"
 FRA_la_bataille_de_la_somme_soutien_desc:0 "South of the Somme river, General Fayolle's 6th Army achieves remarkable tactical gains with creeping artillery barrages, relieving intense pressure on Verdun."
 FRA_la_course_a_la_mer:0 "The Race to the Sea (Flanders Front)"
 FRA_la_course_a_la_mer_desc:0 "Both armies race northwards in furious flanking attempts, ending when French marines, Belgians at the Yser, and the BEF seal the front at the English Channel."
 FRA_la_crise_des_munitions_1914:0 "Address the 1914 Shell Crisis"
 FRA_la_crise_des_munitions_1914_desc:0 "Consumption of 75mm artillery shells reached 80,000 per day during the Marne, while daily production was only 10,000. Emergency contracts are dispatched across France."
 FRA_la_crise_politique_de_1917:0 "The Political Crisis of 1917"
 FRA_la_crise_politique_de_1917_desc:0 "After three years of trench bloodbaths, strikes erupt in munitions factories, the Russian ally collapses, and political infighting brings down cabinets in rapid succession."
 FRA_la_demande_d_armistice_allemande:0 "The German Armistice Request"
 FRA_la_demande_d_armistice_allemande_desc:0 "With their armies in full retreat, their allies crumbling, and the fleet mutinying at Kiel, the German High Command sends Matthias Erzberger to sue for peace."
 FRA_la_doctrine_nivelle_rupture:0 "Nivelle's Grand Rupture Doctrine"
 FRA_la_doctrine_nivelle_rupture_desc:0 "Flushed with success recapturing Fort Douaumont, General Robert Nivelle promises parliament to rupture the German front lines within 48 hours with a rolling barrage."
 FRA_la_force_noire_de_mangin:0 "General Mangin's 'La Force Noire'"
 FRA_la_force_noire_de_mangin_desc:0 "Lieutenant-Colonel Charles Mangin's prophetic treatise urges tapping the vast manpower of French West Africa to offset Germany's massive demographic advantage in Europe."
 FRA_la_force_noire_du_general_mangin:0 "General Mangin's 'La Force Noire'"
 FRA_la_force_noire_du_general_mangin_desc:0 "Colonel Charles Mangin's 1910 thesis proved prophetic: African troops possessed the physical stamina and martial bravery needed to compensate for France's low birth rate."
 FRA_la_fournaise_de_verdun:0 "The Furnace of Verdun: 'Ils ne passeront pas!'"
 FRA_la_fournaise_de_verdun_desc:0 "'They shall not pass!' Facing Falkenhayn's meatgrinder offensive, the French army stands firm on the hills of Douaumont and Vaux in a test of national will."
 FRA_la_france_commune_invincible:0 "The Invincible Commune"
 FRA_la_france_commune_invincible_desc:0 "The revolution has taken root. A new world has been born in the land of 1789, ready to defend its liberty against all imperialist coalitions."
 FRA_la_loi_des_trois_ans_1913:0 "The Three-Year Law Debate (1913)"
 FRA_la_loi_des_trois_ans_1913_desc:0 "Facing the German Army Law of 1912, France must act. With only 39 million citizens against 65 million Germans, extending conscription to 3 years is a life-or-death decision."
 FRA_la_paix_de_versailles_imposition:0 "The Treaty of Versailles in the Hall of Mirrors"
 FRA_la_paix_de_versailles_imposition_desc:0 "On 28 June 1919 in the very hall where the German Empire was proclaimed in 1871, Georges Clemenceau presides over the signing of the Treaty of Versailles, securing French triumph."
 FRA_la_republique_autoritaire:0 "The Resolute Republic"
 FRA_la_republique_autoritaire_desc:0 "France has constructed an unshakeable executive republic, fusing democratic legitimacy with authoritarian command to meet any trial of history."
 FRA_la_victoire_de_la_republique:0 "Victory of the Republic"
 FRA_la_victoire_de_la_republique_desc:0 "The democratic republic has endured the greatest storm in human history without collapsing into tyranny, proving to the world that free citizens can defeat autocracy."
 FRA_la_voie_sacree_convoy:0 "La Voie Sacrée Logistics Pipeline"
 FRA_la_voie_sacree_convoy_desc:0 "Bar-le-Duc to Verdun road kept open 24/7 by thousands of trucks and stone-spreading territorial troops."
 FRA_laicite_republicaine:0 "Republican Secularism (Laïcité)"
 FRA_laicite_republicaine_desc:0 "The 1905 law separating Church and State consolidated the secular school system. The children of France are educated as free citizens of the Republic, immune to clerical reaction."
 FRA_le_bloc_latin_mediterraneen:0 "The Latin Mediterranean Entente"
 FRA_le_bloc_latin_mediterraneen_desc:0 "Turning away from eastern entanglements, France unites the Romanic world—France, Italy, Spain, and Portugal—into a powerful Mediterranean customs and defense union."
 FRA_le_creusot_schneider:0 "Schneider et Cie at Le Creusot"
 FRA_le_creusot_schneider_desc:0 "Founded by Eugène Schneider, the gargantuan steelworks and foundry at Le Creusot design the world's most sophisticated heavy artillery, armor plates, and naval guns."
 FRA_le_pain_et_la_paix_juste:0 "Bread & Just Peace"
 FRA_le_pain_et_la_paix_juste_desc:0 "France stands as a beacon of progressive democracy, demonstrating to the workers of Europe that a peaceful socialist republic is possible without tyranny."
 FRA_le_parti_radical:0 "The Radical-Socialist Party"
 FRA_le_parti_radical_desc:0 "Neither reactionary nor collectivist, the Radical Party of Joseph Caillaux defends small property owners, secular schooling, and civic freedom as the true center of gravity of French politics."
 FRA_le_royaume_de_france_ressuscite:0 "The Kingdom Resurrected"
 FRA_le_royaume_de_france_ressuscite_desc:0 "With the tricolor crowned with gold lilies, the oldest kingdom of Christendom stands re-established, determined to reclaim its natural frontiers along the Rhine."
 FRA_le_sang_de_l_empire:0 "Blood of the Empire (Brotherhood of Arms)"
 FRA_le_sang_de_l_empire_desc:0 "Over six hundred thousand colonial troops have fought across European battlefields. Their sacrifices irrevocably forge an enduring bond of mutual respect within the republic."
 FRA_le_scandale_calmette_caillaux:0 "The Calmette-Caillaux Affair"
 FRA_le_scandale_calmette_caillaux_desc:0 "In March 1914, Henriette Caillaux shot Gaston Calmette, editor of Le Figaro, after he threatened to publish private letters. The sensational trial transfixes the nation on the eve of the European crisis."
 FRA_le_wagon_de_rethondes_a_compiegne:0 "The Armistice at Compiègne (Rethondes)"
 FRA_le_wagon_de_rethondes_a_compiegne_desc:0 "On 11 November 1918 in Marshal Foch's railway coach in the forest of Compiègne, the German delegation signs the unconditional cessation of hostilities at the eleventh hour."
 FRA_lecons_sanglantes_des_frontieres:0 "Bloody Lessons of the Frontiers"
 FRA_lecons_sanglantes_des_frontieres_desc:0 "Suffering twenty-seven thousand casualties in a single day at Rossignol shatters obsolete dogma: machine guns and shrapnel kill blind heroism. Tactical reality must prevail."
 FRA_legendary_flying_aces:0 "Les As de la Chasse (Flying Aces)"
 FRA_legendary_flying_aces_desc:0 "Heroes like Guynemer, Fonck, and Nungesser inspire the nation and demoralize enemy aviators."
 FRA_les_as_de_la_chasse_guynemer:0 "Les As: Guynemer & Les Cigognes"
 FRA_les_as_de_la_chasse_guynemer_desc:0 "Georges Guynemer and the legendary 'Escadrille des Cigognes' become immortal national symbols. Their duels in the clouds inspire a war-weary population."
 FRA_les_camelots_du_roi:0 "Les Camelots du Roi"
 FRA_les_camelots_du_roi_desc:0 "The militant youth league of Action Française sells Charles Maurras's paper on the boulevards, breaks up radical meetings, and rallies patriotic students around the fleur-de-lis."
 FRA_les_munitionnettes:0 "Les Munitionnettes (Women in War Industry)"
 FRA_les_munitionnettes_desc:0 "Hundreds of thousands of French women enter lathe workshops and powder mills, machining fuses, assembling artillery shells, and keeping the republic armed."
 FRA_les_munitionnettes_ouvrieres:0 "The Heroic Munitionnettes"
 FRA_les_munitionnettes_ouvrieres_desc:0 "Over 400,000 French women take their places at lathes, chemical presses, and assembly lines. Their tireless patriotism keeps the guns roaring day and night."
 FRA_les_mutineries_des_poilus:0 "The Poilus Mutinies of 1917"
 FRA_les_mutineries_des_poilus_desc:0 "Singing the Chanson de Craonne, sixty-eight divisions mutiny. The soldiers refuse to participate in suicidal butcheries, though promising to defend their trenches."
 FRA_lessons_of_the_frontiers:0 "Lessons of the Frontiers"
 FRA_lessons_of_the_frontiers_desc:0 "The bloody repulse of August 1914 shattered blind faith in naked assault, teaching the supremacy of cover and firepower."
 FRA_light_machinegun_fireteams:0 "Chauchat Tactical Fireteams"
 FRA_light_machinegun_fireteams_desc:0 "Distributing automatic rifles down to the squad level gives infantry organic marching fire capability."
 FRA_loi_des_retraites_ouvrieres:0 "Workers' Pensions Law"
 FRA_loi_des_retraites_ouvrieres_desc:0 "Implementing modest state retirement pensions for industrial and agricultural workers pacifies labor unrest and deepens peasant loyalty to the republic."
 FRA_loi_des_trois_ans_1913:0 "The 1913 Three-Year Military Law"
 FRA_loi_des_trois_ans_1913_desc:0 "Faced with Germany's rising peacetime army, Premier Louis Barthou passes the Three-Year Law, extending compulsory military service to keep 750,000 active troops under arms."
 FRA_lyautey_moroccan_order:0 "Lyautey Moroccan Protectorate Order"
 FRA_lyautey_moroccan_order_desc:0 "Respect for local customs combined with modern economic development maintains tranquil stability across Morocco."
 FRA_madagascar_strategic_minerals:0 "Madagascan Strategic Minerals"
 FRA_madagascar_strategic_minerals_desc:0 "Graphite, mica, and precious metals extracted from the island bolster French high-precision instrumentation."
 FRA_maintien_du_parlementarisme_guerre:0 "Parliamentary Oversight in War"
 FRA_maintien_du_parlementarisme_guerre_desc:0 "Unlike Germany's military dictatorship under Ludendorff, France preserves legislative supremacy. Civilian parliamentarians regularly inspect frontline hospital trains and trenches."
 FRA_maitrise_definitive_de_la_mediterranee:0 "Mastery of the Mediterranean"
 FRA_maitrise_definitive_de_la_mediterranee_desc:0 "From Gibraltar to Port Said, the tricolor rules the waves. The central powers remain blockaded, while French colonial lines flow without hindrance."
 FRA_manufacture_d_armes_saint_etienne:0 "Saint-Étienne National Arsenal (MAS)"
 FRA_manufacture_d_armes_saint_etienne_desc:0 "Manufacture d'Armes de Saint-Étienne mass-produces the standard-issue Lebel M1886 and Berthier rifles, ensuring precision rifling and interchangeability."
 FRA_mass_swarm_tank_tactics:0 "Mass Swarm Light Armor Tactics"
 FRA_mass_swarm_tank_tactics_desc:0 "Deploying hundreds of inexpensive, nimble light tanks in tight mutual support overwhelms enemy defensive belts."
 FRA_measured_justice_and_pardons:0 "Measured Military Justice & Pardons"
 FRA_measured_justice_and_pardons_desc:0 "Limit executions to ringleaders and pardon ordinary mutineers to heal frontline morale."
 FRA_mediterranean_battlefleet:0 "1ère Armée Navale (Toulon)"
 FRA_mediterranean_battlefleet_desc:0 "France concentrates its capital ship strength in the Mediterranean to neutralize Austro-Hungarian and Ottoman threats."
 FRA_mediterranean_dominance:0 "Mediterranean Naval Dominance"
 FRA_mediterranean_dominance_desc:0 "Complete command of the Mediterranean sea lanes safeguards troop movements from North Africa and the Levant."
 FRA_mines_de_charbon_du_nord:0 "Coal Pits of Nord-Pas-de-Calais"
 FRA_mines_de_charbon_du_nord_desc:0 "From Lens to Valenciennes, hundreds of thousands of miners extract anthracite to power France's locomotives, factories, and domestic hearths."
 FRA_mines_de_fer_de_l_ouenza:0 "Ouenza Iron Ore Deposits"
 FRA_mines_de_fer_de_l_ouenza_desc:0 "Opening the mammoth open-cast iron deposits of Ouenza in eastern Algeria sends high-grade hematite ore via rail to Bône port, directly feeding metropolitan blast furnaces."
 FRA_ministere_de_l_armement_albert_thomas:0 "Albert Thomas' Ministry of Armament"
 FRA_ministere_de_l_armement_albert_thomas_desc:0 "Socialist deputy Albert Thomas organizes national munitions committees, coordinates private industrialists, and standardizes contracts, raising shell output from 10,000 to 200,000 a day."
 FRA_ministere_de_la_marine:0 "Ministry of the Navy Reorganisation"
 FRA_ministere_de_la_marine_desc:0 "Admiral Auguste Boué de Lapeyrère sweeps away bureaucratic inertia on Rue Royale, establishing an aggressive battle fleet doctrine focused on battleships and Mediterranean command."
 FRA_miracle_of_the_marne:0 "Miracle of the Marne Spirit"
 FRA_miracle_of_the_marne_desc:0 "The desperate counter-offensive that saved Paris forged an unbreakable bond of resilience across all ranks."
 FRA_mise_en_valeur_de_l_algerie:0 "Development of French Algeria"
 FRA_mise_en_valeur_de_l_algerie_desc:0 "Treated as integral departments of France, Algiers and Oran receive modern agricultural equipment, vineyards, and expanded ports to supply the mainland with grain, wine, and livestock."
 FRA_mission_militaire_en_roumanie_berthelot:0 "General Berthelot's Romanian Mission"
 FRA_mission_militaire_en_roumanie_berthelot_desc:0 "General Henri Berthelot and hundreds of French staff officers reorganize the shattered Romanian army in Moldavia, teaching modern trench tactics that hold Mărășești."
 FRA_mission_viviani_joffre_aux_usa:0 "Joffre & Viviani Diplomatic Mission to Washington"
 FRA_mission_viviani_joffre_aux_usa_desc:0 "Marshal Joffre visits the White House in spring 1917 to thunderous American acclaim, urging President Woodrow Wilson to dispatch US divisions to France without delay."
 FRA_missions_medicales_coloniales_calmette:0 "Pasteur Institutes & Tropical Hygiene"
 FRA_missions_medicales_coloniales_calmette_desc:0 "Pasteur institutes in Saigon, Tunis, and Dakar eradicate malaria, sleeping sickness, and dysentery, safeguarding both native populations and troops."
 FRA_mitrailleuses_vickers_d_aviation:0 "Synchronized Vickers Machine Guns"
 FRA_mitrailleuses_vickers_d_aviation_desc:0 "Adopting the Alkan-Hamy mechanical synchronizer allows belt-fed Vickers machine guns to fire through the propeller arc without bullet deflectors."
 FRA_mobilisation_des_esprits:0 "Mobilisation of the Minds"
 FRA_mobilisation_des_esprits_desc:0 "Intellectuals, teachers, scientists, and the Académie Française rally in cultural defense of civilization against Germanic militarism, instilling enduring resolve across all schools."
 FRA_modernisation_du_creusot:0 "Le Creusot Heavy Foundry Expansion"
 FRA_modernisation_du_creusot_desc:0 "Installing massive 100-ton hydraulic steam hammers at Schneider et Cie enables casting mammoth gun barrels and thick armor plate for dreadnoughts."
 FRA_modernisation_du_port_du_havre:0 "Expansion of Le Havre & Rouen Docks"
 FRA_modernisation_du_port_du_havre_desc:0 "Installing deep-water steam cranes and expanding rail connections on the Seine estuary allows unloading hundreds of thousands of tonnes of transatlantic freight weekly."
 FRA_monarchie_traditionnelle_et_corporative:0 "Corporate Kingdom & Guilds"
 FRA_monarchie_traditionnelle_et_corporative_desc:0 "Replacing cutthroat party competition with professional corporations and provincial assemblies, labor and capital are united under the paternal protection of the Crown."
 FRA_monoplans_morane_saulnier:0 "Morane-Saulnier Monoplanes"
 FRA_monoplans_morane_saulnier_desc:0 "The parasol-wing monoplanes of Morane-Saulnier offer superb downward visibility and speed, serving as our primary scout and observation machines."
 FRA_morocco_treaty_of_fez:0 "Treaty of Fez Sovereignty"
 FRA_morocco_treaty_of_fez_desc:0 "French protectorate status over Morocco is formally confirmed by international treaty."
 FRA_mortiers_de_tranchee_crapouillots:0 "'Crapouillot' Trench Mortars"
 FRA_mortiers_de_tranchee_crapouillots_desc:0 "Improvised from old bronze fortress mortars, 'crapouillots' lob high-trajectory aerial torpedoes directly into enemy traverses, blowing apart barbed-wire entanglements."
 FRA_moteurs_hispano_suiza_et_gnome:0 "Hispano-Suiza & Gnome Aero Engines"
 FRA_moteurs_hispano_suiza_et_gnome_desc:0 "Marc Birkigt's cast-aluminum V8 Hispano-Suiza engine and Gnome rotary engines deliver unprecedented power-to-weight ratios, propelling French aircraft to world supremacy."
 FRA_munitionnettes_workforce:0 "Les Munitionnettes"
 FRA_munitionnettes_workforce_desc:0 "Hundreds of thousands of courageous French women take over lathe benches and explosive assembly lines."
 FRA_mutinies_crisis_management:0 "Crisis of the French Army (1917 Mutinies)"
 FRA_mutinies_crisis_management_desc:0 "Resolve widespread disobedience and despair among the poilus following the catastrophic Chemin des Dames offensive."
 FRA_national_credit_solvency:0 "Crédit National Solvency"
 FRA_national_credit_solvency_desc:0 "A dedicated state credit entity coordinates reparations, reconstruction funding, and postwar industrial retooling."
 FRA_nationalisation_des_mines_et_chemins_de_fer:0 "Nationalize Strategic Mines & Rails"
 FRA_nationalisation_des_mines_et_chemins_de_fer_desc:0 "The private railway cartels and northern coal combines are converted into democratic public utilities, directed toward collective welfare rather than private dividends."
 FRA_negocier_avec_l_italie_traite_de_londres:0 "Secret Treaty of London with Italy (1915)"
 FRA_negocier_avec_l_italie_traite_de_londres_desc:0 "French and British diplomacy tempts Rome away from the Triple Alliance, promising Trentino, Trieste, Istria, and Dalmatian territories in exchange for attacking Austria-Hungary."
 FRA_night_interception_patrols:0 "Night Air Interception Patrols"
 FRA_night_interception_patrols_desc:0 "Coordinated searchlights, acoustic detectors, and night-fighter patrols intercept enemy Gotha bombing raids."
 FRA_nineteenth_corps_african_army:0 "19th Army Corps (Armée d’Afrique)"
 FRA_nineteenth_corps_african_army_desc:0 "Hardened veterans of Algerian and Tunisian campaigns form the shock vanguard of French expeditionary warfare."
 FRA_nivelle_offensive_mission:0 "Chemin des Dames Breakthrough Operation"
 FRA_nivelle_offensive_mission_desc:0 "Concentrate massive artillery and assault forces to rupture the German positions along the Aisne within 45 days."
 FRA_nivelle_offensive_surge:0 "Chemin des Dames Rupture Attempt"
 FRA_nivelle_offensive_surge_desc:0 "Temporary bounded assault bonus: massive artillery preparation across the Aisne. Expires quickly with severe exhaustion if prolonged."
 FRA_offensive_des_cent_jours:0 "Foch's Grand Hundred Days Offensive"
 FRA_offensive_des_cent_jours_desc:0 "'Everyone to battle!' Foch unleashes continuous, synchronized attacks along the entire Western Front with tanks, airplanes, and infantry, breaking the Hindenburg Line."
 FRA_offensive_du_vardar_franchet_d_esperey:0 "Franchet d'Espèrey's Vardar Breakthrough"
 FRA_offensive_du_vardar_franchet_d_esperey_desc:0 "In September 1918, General Franchet d'Espèrey ('Desperate Frankie') smashes Bulgarian mountain positions at Dobro Pole, compelling Bulgaria to sign the first armistice of the war."
 FRA_offensive_nivelle_chemin_des_dames:0 "The Nivelle Offensive at Chemin des Dames"
 FRA_offensive_nivelle_chemin_des_dames_desc:0 "General Robert Nivelle promises rupture in forty-eight hours. The bloody assault against fortified ridges in April 1917 triggers a moral reckoning."
 FRA_offensive_school:0 "Offensive Doctrine School"
 FRA_offensive_school_desc:0 "Belief in aggressive maneuver and bayonet spirit drives the early French battle doctrine."
 FRA_offensives_de_champagne_et_artois:0 "The Attritional Bloodbaths of 1915"
 FRA_offensives_de_champagne_et_artois_desc:0 "Testing the creeping barrage doctrine in Champagne, Artois, and Neuve-Chapelle, the French Army proves that raw courage without heavy shell saturation achieves only martyrdom."
 FRA_operation_de_la_marne:0 "Miracle of the Marne & Gallieni's Taxis"
 FRA_operation_de_la_marne_desc:0 "General Gallieni requisitions Parisian taxis to rush the 7th Division to the Ourcq. Joffre strikes Von Kluck's exposed flank, saving Paris and repelling the invader."
 FRA_optiques_aeriennes_de_precision:0 "Aerial Photographic Mapping"
 FRA_optiques_aeriennes_de_precision_desc:0 "Mounting precision focal lenses underneath aircraft fuselages maps enemy trench lines, pillboxes, and artillery positions with daily photographic accuracy."
 FRA_or_des_francais_pour_la_patrie:0 "Gold for the Fatherland Campaign"
 FRA_or_des_francais_pour_la_patrie_desc:0 "Citizens willingly exchange their gold Napoléon coins at bank counters for paper banknotes, stocking Banque de France vaults with immense reserves to back foreign loans."
 FRA_ordre_moral_et_republicain:0 "Moral & Republican Order"
 FRA_ordre_moral_et_republicain_desc:0 "Reconciling conservative Catholics with the republican regime, the state ends secular hostilities and honors church heritage as an essential pillar of national cohesion."
 FRA_organisation_de_la_voie_sacree:0 "La Voie Sacrée (The Sacred Road)"
 FRA_organisation_de_la_voie_sacree_desc:0 "Three thousand trucks run bumper-to-bumper 24 hours a day along the Bar-le-Duc artery, carrying 50,000 tonnes of ammunition and 90,000 men weekly into Verdun."
 FRA_pacification_du_maroc_lyautey:0 "Resident-General Hubert Lyautey"
 FRA_pacification_du_maroc_lyautey_desc:0 "General Lyautey pacifies rebellious tribes with diplomacy, schools, and roads rather than brutal destruction: 'Show strength so as not to have to use it.'"
 FRA_pacifisme_de_jean_jaures:0 "Jean Jaurès' Crusade for Peace"
 FRA_pacifisme_de_jean_jaures_desc:0 "Through impassioned oratory and the pages of L'Humanité, Jaurès warns of the impending slaughter of European youth, urging solidarity among French and German workers to avert the catastrophe."
 FRA_pacifisme_et_arbitrage_international:0 "Internationalist Arbitration"
 FRA_pacifisme_et_arbitrage_international_desc:0 "Jaurès's grand vision: resolving border disputes and imperial rivalry through open international tribunals and socialist conferences rather than secret military alliances."
 FRA_pacte_de_non_agression_continental:0 "Continental Non-Aggression Pact"
 FRA_pacte_de_non_agression_continental_desc:0 "France and Germany sign a mutual pledge of non-aggression, dismantling the explosive alliance tripwires that threatened to drag Europe into self-destruction."
 FRA_pams_conciliatory_presidency:0 "Pams Conciliatory Presidency"
 FRA_pams_conciliatory_presidency_desc:0 "Jules Pams pursues a moderate, pacifist policy aimed at defusing European flashpoints through multilateral arbitration."
 FRA_parc_d_artillerie_lourde_rimailho:0 "Heavy Artillery Expansion (Schneider 155mm)"
 FRA_parc_d_artillerie_lourde_rimailho_desc:0 "Rectifying prewar blindness, massive orders of 155mm Schneider short howitzers and 220mm siege mortars give the army crushing counter-battery punch."
 FRA_parliamentary_equilibrium:0 "Parliamentary Equilibrium"
 FRA_parliamentary_equilibrium_desc:0 "Careful coalitions between radicals and moderates maintain steady republican governance through parliamentary consensus."
 FRA_parliamentary_mutiny_turmoil:0 "Parliamentary Turmoil of 1917"
 FRA_parliamentary_mutiny_turmoil_desc:0 "Following the collapse of the Nivelle Offensive, strikes in Paris and mutinies in the trenches threaten to topple the civilian government."
 FRA_pasteur_colonial_hygiene:0 "Pasteur Overseas Medical Network"
 FRA_pasteur_colonial_hygiene_desc:0 "Inoculation campaigns and tropical disease prevention preserve military garrisons and native populations alike."
 FRA_patrouilles_anti_sous_marines:0 "Anti-Submarine Patrols & Escorts"
 FRA_patrouilles_anti_sous_marines_desc:0 "Arming trawlers, torpedo boats, and fast yachts with depth charges and searchlights counters the growing menace of unrestricted German submarine warfare."
 FRA_perte_des_mines_du_nord_repli:0 "Emergency Evacuation of Heavy Machinery"
 FRA_perte_des_mines_du_nord_repli_desc:0 "With German armies invading the Briey basin and Nord departments, machine tools, blueprints, and skilled metalworkers are swiftly evacuated southward to the Loire and Massif Central."
 FRA_petain_commandant_en_chef:0 "Pétain Appointed Commander-in-Chief"
 FRA_petain_commandant_en_chef_desc:0 "Replacing the reckless Nivelle, Philippe Pétain restores faith in high command by personally visiting over ninety divisions, promising no more butchery."
 FRA_petain_elastic_defense:0 "Pétain Elastic Defense in Depth"
 FRA_petain_elastic_defense_desc:0 "Holding frontlines lightly and crushing penetrations with massive artillery and immediate counter-attacks."
 FRA_petain_welfare_and_leave_reform:0 "Pétain Frontline Welfare & Leave Reform"
 FRA_petain_welfare_and_leave_reform_desc:0 "Grant regular home leaves, hot food rations, and end suicidal frontal assaults to restore army confidence."
 FRA_phosphates_de_tunisie:0 "Tunisian Phosphate Mines of Gafsa"
 FRA_phosphates_de_tunisie_desc:0 "The phosphate deposits of Gafsa provide essential raw material for chemical fertilizers, nitric acid synthesis, and munitions manufacturing across metropolitan plants."
 FRA_pilot_training_corps:0 "Aeronautique Flight Schools"
 FRA_pilot_training_corps_desc:0 "Standardized flight curriculums at Pau and Étampes train high-caliber aviators in aerobatics and aerial gunnery."
 FRA_plan_xvii_concentration:0 "Plan XVII Concentration"
 FRA_plan_xvii_concentration_desc:0 "Carefully pre-planned railway timetables concentrate five French armies along the Lorraine and Ardennes frontier."
 FRA_plans_de_debarquement_du_bef:0 "Secret BEF Landing & Deployment Plans"
 FRA_plans_de_debarquement_du_bef_desc:0 "General Henry Wilson and French staff secretly map disembarkation timetables at Le Havre, Boulogne, and Rouen, aligning the British Expeditionary Force on the French left flank."
 FRA_poincare_national_firmness:0 "Poincaré National Firmness"
 FRA_poincare_national_firmness_desc:0 "Firm patriotic leadership strengthens national unity and signals unwavering commitment to France’s treaty allies."
 FRA_poincare_presidency:0 "Poincaré Presidency"
 FRA_poincare_presidency_desc:0 "Raymond Poincaré brings unyielding firmness, national pride, and diplomatic resolve to the Élysée Palace."
 FRA_port_strategique_de_dakar:0 "Strategic Deep-Water Port of Dakar"
 FRA_port_strategique_de_dakar_desc:0 "Deepening harbor basins, installing coal bunkering facilities, and fortifying Cap-Vert makes Dakar the premier naval pivot for French transatlantic and South Atlantic shipping."
 FRA_porte_hydravions_foudre:0 "Seaplane Tender 'La Foudre'"
 FRA_porte_hydravions_foudre_desc:0 "The world's first operational seaplane carrier, La Foudre launches Farman and Caudron floatplanes to scout enemy coastlines and spot naval gunfire."
 FRA_ports_charbonniers_rouen:0 "Rouen River Coal Transshipment Docks"
 FRA_ports_charbonniers_rouen_desc:0 "Deepening the Seine channel allows British colliers to steam directly into Rouen, offloading fuel onto river barges headed straight to Paris power stations."
 FRA_ports_de_madagascar:0 "Deep-Water Port of Tamatave"
 FRA_ports_de_madagascar_desc:0 "Developing quays and breakwaters at Tamatave and Diego Suarez establishes secure Indian Ocean coaling stations for colonial cruising squadrons."
 FRA_ports_de_saigon_et_haiphong:0 "Modernize Saigon & Haiphong Ports"
 FRA_ports_de_saigon_et_haiphong_desc:0 "Dredging channels and expanding dry docks in Cochin-China enables heavy merchant freighters and Far East cruisers to service the Pacific trade network."
 FRA_pourparlers_d_etat_major_joffre_jilinsky:0 "Joffre-Zhilinsky Staff Convention"
 FRA_pourparlers_d_etat_major_joffre_jilinsky_desc:0 "General Joffre and General Yakov Zhilinsky pledge that Russia will launch an immediate offensive into East Prussia by the 15th day of mobilization, compelling Germany to fight on two fronts."
 FRA_prep_eastern_railway_priority:0 "Eastern Railway Mobilization Priority"
 FRA_prep_eastern_railway_priority_desc:0 "Grant Compagnie de l'Est top priority to move 50 trainloads of artillery shells per day to the Lorraine front."
 FRA_prep_first_army_belfort:0 "Mobilize 1st Army at Belfort"
 FRA_prep_first_army_belfort_desc:0 "Concentrate infantry corps and mountain artillery at the Belfort gap to spearhead the breakthrough into Mulhouse."
 FRA_prep_second_army_morhange:0 "Deploy 2nd Army at Nancy & Morhange"
 FRA_prep_second_army_morhange_desc:0 "General Castelnau's army must breach the German frontier fortresses and liberate Sarrebourg."
 FRA_preserver_la_republique:0 "Preserve the Third Republic"
 FRA_preserver_la_republique_desc:0 "Born from the ashes of Sedan in 1870, the Third Republic stands as the beacon of liberty, secular democracy, and citizen equality. Despite parliamentary turbulence, the republican regime remains our sacred sanctuary."
 FRA_presidence_pams:0 "Jules Pams Conciliatory Presidency"
 FRA_presidence_pams_desc:0 "Supported by Clemenceau and the left radicals, Jules Pams emphasizes domestic welfare reforms, reduction of diplomatic friction, and constitutional harmony over revanchist militarism."
 FRA_presidence_poincare:0 "Poincaré's Patriotic Presidency"
 FRA_presidence_poincare_desc:0 "A son of Lorraine who witnessed German victory in 1870, Raymond Poincaré brings dignified firmness to the Élysée, determined that France shall never bow to foreign ultimatums."
 FRA_presidential_executive_authority:0 "Strong Presidential Republic"
 FRA_presidential_executive_authority_desc:0 "Under constitutional overhaul, the President exercises extensive executive powers free from parliamentary instability, steering national policy with decisive authority."
 FRA_presse_populaire_et_illustres:0 "Mass Press & Popular Broadsheets"
 FRA_presse_populaire_et_illustres_desc:0 "Le Petit Journal, Le Matin, and L'Écho de Paris foster a shared civic culture, linking Parisian debate with provincial villages through affordable print."
 FRA_proclamer_la_commune_francaise:0 "Proclaim the French Commune"
 FRA_proclamer_la_commune_francaise_desc:0 "1871 is avenged! The parliamentary republic is dissolved in favor of the Commune des Travailleurs de France, governed by elected workers' and soldiers' councils."
 FRA_proclamer_union_sacree:0 "Proclaim the Sacred Union"
 FRA_proclamer_union_sacree_desc:0 "'Nothing will break the Sacred Union of all Frenchmen in the face of the enemy,' proclaims President Poincaré. Catholics, socialists, radicals, and royalists stand shoulder-to-shoulder in the trenches."
 FRA_projet_cuirasses_classe_lyon:0 "Lyon-Class Quadruple Turret Project"
 FRA_projet_cuirasses_classe_lyon_desc:0 "Conceived with sixteen 340mm guns in four revolutionary quadruple turrets, the Lyon project points the way toward future naval mastery."
 FRA_protection_de_jean_jaures:0 "Shield Jean Jaurès"
 FRA_protection_de_jean_jaures_desc:0 "By assigning security and unmasking nationalist conspiracies, France prevents the tragic assassination of Jean Jaurès in July 1914, preserving the conscience of the nation."
 FRA_protectorat_de_tunisie:0 "Tunisian Protectorate Administration"
 FRA_protectorat_de_tunisie_desc:0 "Established under the Treaty of Bardo, the protectorate in Tunis expands railway networks and exports rich agricultural harvests and minerals to Marseille."
 FRA_protectorat_marocain_lyautey:0 "Lyautey's Moroccan Protectorate"
 FRA_protectorat_marocain_lyautey_desc:0 "General Hubert Lyautey administers Morocco with profound respect for indigenous institutions, pacifying tribal dissidence through economic building, roads, and medical dispensaries."
 FRA_puissance_industrielle_de_1918:0 "Industrial Titan of 1918"
 FRA_puissance_industrielle_de_1918_desc:0 "By 1918, France has become the arsenal of the Entente, supplying not only her own armies but equipping American and allied divisions with artillery, aircraft, and tanks."
 FRA_q_ships_and_coastal_avisos:0 "Coastal Avisos & Q-Ships"
 FRA_q_ships_and_coastal_avisos_desc:0 "Arming civilian vessels with concealed quick-firing guns creates deadly traps for surfaced enemy submarines."
 FRA_question_du_maroc_1911:0 "The Moroccan Crisis (Agadir 1911)"
 FRA_question_du_maroc_1911_desc:0 "The arrival of the German gunboat SMS Panther at Agadir sparks a grave European standoff. France must defend her special rights in North Africa without precipitating general war."
 FRA_race_to_the_sea_entrenchment:0 "Continuous Trench Frontline"
 FRA_race_to_the_sea_entrenchment_desc:0 "Connecting trenches from Switzerland to the North Sea prevents any further outflanking maneuvers."
 FRA_radicalisation_de_la_cgt:0 "Radicalization of the CGT"
 FRA_radicalisation_de_la_cgt_desc:0 "The Confédération Générale du Travail adopts the Charter of Amiens as revolutionary creed. Frustrated by wartime suffering, revolutionary syndicalists demand worker control."
 FRA_railway_super_heavy_artillery:0 "ALVF Railway Super-Heavy Artillery"
 FRA_railway_super_heavy_artillery_desc:0 "Monstrous 320mm and 400mm naval guns mounted on railroad wagons demolish deep enemy concrete fortifications."
 FRA_rationnement_du_pain_et_charbon:0 "Strict Rationing & Supply Management"
 FRA_rationnement_du_pain_et_charbon_desc:0 "Introducing national ration cards for bread, sugar, and heating fuel ensures fair distribution to civilian families while prioritizing front supply trains."
 FRA_rationnement_et_ravitaillement:0 "Bread, Sugar & Coal Rationing"
 FRA_rationnement_et_ravitaillement_desc:0 "Introducing ration cards and maximum prices prevents price-gouging, guarantees fair distribution among city workers, and ensures coal reaches frontline kitchens."
 FRA_ravitaillement_naval_du_front_salonique:0 "Naval Lifeline to Salonika"
 FRA_ravitaillement_naval_du_front_salonique_desc:0 "Maintaining uninterrupted transport and hospital ship runs across the Aegean keeps General Sarrail's multinational Army of the Orient supplied."
 FRA_reconciliation_avec_les_catholiques:0 "Reconciliation with Catholics"
 FRA_reconciliation_avec_les_catholiques_desc:0 "Clergy serving as stretcher-bearers and officers in the trenches dissolve anticlerical resentment, uniting believers and freethinkers under the tricolor."
 FRA_reconstitution_des_territoires_liberes:0 "Reconstruction of Liberated Basins"
 FRA_reconstitution_des_territoires_liberes_desc:0 "Planning the clearing of minefields, restoration of flooded coal pits in Lens, and rebuilding destroyed canal locks prepares France for postwar renewal."
 FRA_reconversion_industrielle_totale:0 "Total Civilian Industrial Reconversion"
 FRA_reconversion_industrielle_totale_desc:0 "Bicycle shops produce machine gun mountings, perfume distilleries brew chemical weapons, and jewelry artisans turn artillery shell fuses across Lyon and Bordeaux."
 FRA_recrutement_des_legions_etrangeres:0 "French Foreign Legion (Sidi Bel Abbès)"
 FRA_recrutement_des_legions_etrangeres_desc:0 "From their cradle at Sidi Bel Abbès, the battle-hardened regiments of the Foreign Legion welcome thousands of foreign volunteers rushing to defend Paris."
 FRA_recrutement_des_spahis_algeriens:0 "Algerian Spahis Cavalry Regiments"
 FRA_recrutement_des_spahis_algeriens_desc:0 "Dashing horsemen mounted on hardy North African barbs provide mobile reconnaissance, outpost screening, and pursuit cavalry on the Aisne and Champagne plains."
 FRA_reforme_des_permissions_et_soupe:0 "Trench Rest, Rations & Regular Leave"
 FRA_reforme_des_permissions_et_soupe_desc:0 "Pétain guarantees regular seven-day furloughs to families, cleans frontline canteens, and ensures hot soup and fresh wine reach the forward dugouts daily."
 FRA_reforme_des_statuts_indigenes:0 "Reform the Indigénat Code"
 FRA_reforme_des_statuts_indigenes_desc:0 "Deputy Blaise Diagne negotiates French citizenship rights for Senegalese volunteers: 'They shed their blood on the battlefields of France; they are sons of the Republic.'"
 FRA_reforme_fiscale_impot_revenu:0 "The 1914 Income Tax Reform"
 FRA_reforme_fiscale_impot_revenu_desc:0 "After bitter parliamentary battles, Joseph Caillaux's progressive income tax bill passes into law, granting the Republic a modern tax base to finance impending state obligations."
 FRA_reforme_millerand_executif_fort:0 "Millerand's Executive Reform"
 FRA_reforme_millerand_executif_fort_desc:0 "Alexandre Millerand articulates the necessity of a strong President capable of dissolving parliament, appointing ministers freely, and securing national defense without parliamentary paralysis."
 FRA_regiments_de_chasseurs_alpins:0 "Chasseurs Alpins ('Les Diables Bleus')"
 FRA_regiments_de_chasseurs_alpins_desc:0 "The elite mountain regiments wearing wide berets and dark blue tunics master the rocky heights of the Vosges and the Alpine passes with peerless grit."
 FRA_regiments_de_tirailleurs_marocains:0 "Moroccan Goumiers & Tirailleurs"
 FRA_regiments_de_tirailleurs_marocains_desc:0 "Organized into swift shock battalions, Moroccan tirailleurs demonstrate unmatched ferocity and mountain navigation in the Argonne and Vosges."
 FRA_reglage_d_artillerie_par_tsh:0 "Wireless Artillery Spotting (TSH)"
 FRA_reglage_d_artillerie_par_tsh_desc:0 "Equipping observation aircraft with Télégraphie Sans Fil (TSH) allows airborne observers to correct artillery fire in real time onto hidden German batteries."
 FRA_relations_financieres_avec_les_usa:0 "American Commercial & Financial Ties"
 FRA_relations_financieres_avec_les_usa_desc:0 "Massive French grain and copper purchases from the United States forge deep economic interdependency, laying the groundwork for Washington's eventual entry into the conflict."
 FRA_renault_ft_revolution:0 "Renault FT Turreted Tank Concept"
 FRA_renault_ft_revolution_desc:0 "The revolutionary fully rotating 360-degree turret and rear engine layout defines modern armored warfare."
 FRA_renouveau_nationaliste:0 "Nationalist Revival"
 FRA_renouveau_nationaliste_desc:0 "Echoing the patriotic leagues of Paul Déroulède and Maurice Barrès, conservative republicans call for moral rearmament, respect for the army, and devotion to the nation."
 FRA_reorganisation_post_guerre:0 "Post-War Institutional Renewal"
 FRA_reorganisation_post_guerre_desc:0 "Streamlining parliamentary commissions and updating prefectural powers prepares the state to manage reconstruction and demobilization."
 FRA_repli_du_gouvernement_a_bordeaux:0 "Government Relocation to Bordeaux"
 FRA_repli_du_gouvernement_a_bordeaux_desc:0 "With German cavalry scouts nearing Paris in September 1914, the government and the Banque de France temporarily relocate to Bordeaux, ensuring state continuity while Gallieni defends the capital."
 FRA_reponse_a_la_menace_sous_marine:0 "Anti-Submarine Countermeasures"
 FRA_reponse_a_la_menace_sous_marine_desc:0 "German U-boat raids in the Mediterranean sink merchantmen and troop transports. The navy rushes hydrophones, depth charge projectors, and coastal patrol flights into service."
 FRA_reponse_au_coup_d_agadir:0 "Response to the Agadir Crisis"
 FRA_reponse_au_coup_d_agadir_desc:0 "July 1911: The German gunboat SMS Panther anchors at the Atlantic port of Agadir to challenge French hegemony. Paris refuses to be intimidated by gunboat diplomacy."
 FRA_repression_mesuree_des_meneurs:0 "Measured Discipline & Pardons"
 FRA_repression_mesuree_des_meneurs_desc:0 "Refusing mass executions, Pétain commutes hundreds of death sentences to hard labor, executing only 49 undeniable mutiny leaders while healing the army's spirit."
 FRA_repressions_du_defaitisme:0 "Prosecution of Defeatism"
 FRA_repressions_du_defaitisme_desc:0 "Subversive pacifist networks, German-funded publications like Le Bonnet Rouge, and corrupt officials are unmasked and prosecuted to maintain civilian courage."
 FRA_republican_vigilance:0 "Republican Vigilance"
 FRA_republican_vigilance_desc:0 "The institutions of the Third Republic stand guarded against monarchist, clerical, and authoritarian intrigue through civic dedication."
 FRA_republique_sociale_et_democratique:0 "The Social & Democratic Republic"
 FRA_republique_sociale_et_democratique_desc:0 "Transforming the bourgeois state, the new government enacts landmark welfare protections, workers' sickness insurance, and pensions for laboring veterans."
 FRA_requisition_parisian_taxis:0 "Requisition Parisian Taxis de la Marne"
 FRA_requisition_parisian_taxis_desc:0 "Order police to requisition 600 Renault AG-1 taxis in Paris to rush infantry reinforcements to the Ourcq."
 FRA_reseau_de_forts_sere_de_rivieres:0 "Séré de Rivières Fortress System"
 FRA_reseau_de_forts_sere_de_rivieres_desc:0 "The fortified barrier camps of Verdun, Toul, Épinal, and Belfort funnel any German invasion into prepared killing corridors along the Meuse and Moselle."
 FRA_reseau_ferroviaire_du_nord_et_est:0 "Nord & Est Railway Trunk Lines"
 FRA_reseau_ferroviaire_du_nord_et_est_desc:0 "Upgrading the strategic double-track lines connecting Paris to Reims, Nancy, and Verdun ensures heavy freight and mobilization timetables run flawlessly."
 FRA_ressources_de_l_aef_brazzaville:0 "AEF & Equatorial Concessions"
 FRA_ressources_de_l_aef_brazzaville_desc:0 "French Equatorial Africa opens up the vast timber and rubber resources of the Congo Basin, sustaining war material production across the Atlantic trade lanes."
 FRA_ressources_de_l_aof_dakar:0 "AOF & Port of Dakar"
 FRA_ressources_de_l_aof_dakar_desc:0 "French West Africa funnels rubber, peanuts, and hardwoods through the fortified Atlantic deep-water port of Dakar, safe from Central Powers interdiction."
 FRA_ressources_de_madagascar:0 "Madagascar Graphite & Strategic Minerals"
 FRA_ressources_de_madagascar_desc:0 "Madagascar supplies crucial flake graphite for metallurgy crucibles, mica for electrical insulation, and beef shipments for frontline poilu rations."
 FRA_restauration_du_duc_d_orleans:0 "Coronation of Philippe VIII"
 FRA_restauration_du_duc_d_orleans_desc:0 "The Duke of Orléans returns from exile to Reims Cathedral, consecrated as King of France and Navarre, restoring the unbroken chain of forty kings who built France."
 FRA_retour_de_l_alsace_lorraine:0 "Return of the Lost Daughters: Alsace-Lorraine"
 FRA_retour_de_l_alsace_lorraine_desc:0 "After forty-seven years of sorrow, French troops march into Strasbourg and Metz amid tears of joy. The black veil is lifted from the statue of Strasbourg on Place de la Concorde."
 FRA_revanche_accomplished:0 "Revanche Accomplished"
 FRA_revanche_accomplished_desc:0 "The stain of 1870 is finally washed away. Alsace and Lorraine have returned to the bosom of the Republic, restoring French pride and continental pre-eminence."
 FRA_riz_et_mines_d_indochine:0 "Indochinese Rice & Rubber Riches"
 FRA_riz_et_mines_d_indochine_desc:0 "The Union of Indochina ships hundreds of thousands of tons of grain from the Mekong Delta, alongside high-grade rubber and Tonkin anthracite coal."
 FRA_rotate_frontline_divisions_noria:0 "Execute Noria Division Rotation"
 FRA_rotate_frontline_divisions_noria_desc:0 "Regularly pull exhausted divisions out of the line to recover morale and reconstitute fighting strength."
 FRA_rotation_de_la_noria_petain:0 "Pétain's 'Noria' Division Rotation"
 FRA_rotation_de_la_noria_petain_desc:0 "Instead of leaving units to be bled dry in the line, seventy out of ninety-five French divisions rotate through Verdun for brief, intense stints before relief."
 FRA_rouen_coal_dispatch:0 "Rouen Maritime Coal Terminal"
 FRA_rouen_coal_dispatch_desc:0 "Dredged docks and specialized cranes unload Welsh and Scottish coal swiftly into river barges heading for Paris."
 FRA_royalist_catholic_order:0 "Traditional Monarchy & Catholic Order"
 FRA_royalist_catholic_order_desc:0 "Action Française has restored the throne of Saint Louis. Corporation councils, traditional provincial liberties, and firm hierarchy replace parliamentary decadence."
 FRA_rupture_de_la_ligne_hindenburg:0 "Break the Hindenburg Line"
 FRA_rupture_de_la_ligne_hindenburg_desc:0 "Storming the deepest trench fortresses of the Siegfriedstellung, French, British, and American divisions smash through the German defenses, forcing Germany to capitulate."
 FRA_russian_steamroller_pledge:0 "Russian Steamroller M+15 Commitment"
 FRA_russian_steamroller_pledge_desc:0 "Under the Joffre-Zhilinsky staff protocols, the Imperial Russian Army pledges an immediate general invasion of East Prussia by the 15th day of mobilization, forcing Germany to divide its forces."
 FRA_secular_civic_order:0 "Secular Civic Order"
 FRA_secular_civic_order_desc:0 "The separation of church and state has solidified civil society and public education as the foundation of modern French democracy."
 FRA_senat_et_chambre_des_deputes:0 "Senate & Chamber of Deputies"
 FRA_senat_et_chambre_des_deputes_desc:0 "Balancing the conservative wisdom of the Senate with the lively democratic passions of the Palais Bourbon ensures legislative equilibrium and protects the Republic against any autocrat or military adventurer."
 FRA_shell_crisis_1914:0 "The Shell Crisis of 1914"
 FRA_shell_crisis_1914_desc:0 "Unprecedented artillery consumption has emptied metropolitan arsenals, forcing emergency rationing of 75mm shells."
 FRA_siderurgie_electrique_ugine:0 "Ugine Special Steels & Alloys"
 FRA_siderurgie_electrique_ugine_desc:0 "Paul Girod's electric arc furnaces produce high-grade chrome, nickel, and tungsten alloys essential for armor-piercing artillery projectiles and aircraft engines."
 FRA_skilled_workforce_recall:0 "Affectés Spéciaux (Mechanic Recall)"
 FRA_skilled_workforce_recall_desc:0 "Skilled machinists, metallurgists, and chemists are recalled from frontline trenches to staff high-precision war factories."
 FRA_socialist_labor_peace:0 "Socialist Labor Compact"
 FRA_socialist_labor_peace_desc:0 "Constructive dialogue with reformist socialists and labor unions maintains social peace in crucial industrial sectors."
 FRA_socialist_welfare_state:0 "The Social and Democratic Republic"
 FRA_socialist_welfare_state_desc:0 "Guided by Jean Jaurès and the SFIO, France has enacted the 8-hour workday, progressive income taxation, and industrial arbitration, creating a model of social justice."
 FRA_solidarite_avec_la_belgique:0 "Sacred Solidarity with Heroic Belgium"
 FRA_solidarite_avec_la_belgique_desc:0 "When German armies violate Belgian neutrality on 4 August 1914, France rushes division columns northwards to assist King Albert I's valiant defense of Liège and Namur."
 FRA_solidarite_nationale_veufs_orphelins:0 "Pupils of the Nation (War Widows & Orphans)"
 FRA_solidarite_nationale_veufs_orphelins_desc:0 "The Republic adopts war orphans as 'Pupilles de la Nation', guaranteeing state funding for their education, healthcare, and livelihood."
 FRA_somme_artillery_coordination:0 "Creeping Barrage & Rolling Fire"
 FRA_somme_artillery_coordination_desc:0 "Timing artillery curtains to march precisely 100 meters ahead of advancing infantry neutralizes machinegun nests."
 FRA_sous_marins_classe_pluviose:0 "Pluviôse & Brumaire Submarines"
 FRA_sous_marins_classe_pluviose_desc:0 "French steam and diesel submersibles prove their endurance in the Adriatic and Aegean Seas, penetrating defended enemy anchorages."
 FRA_soutien_du_cabinet_britannique:0 "British Mansion House Solidarity"
 FRA_soutien_du_cabinet_britannique_desc:0 "David Lloyd George declares that Britain will not allow peace to be bought at the price of humiliation, standing shoulder-to-shoulder with France against German sabre-rattling."
 FRA_soutien_financier_au_tsar:0 "Arms & Shell Shipments to Russia"
 FRA_soutien_financier_au_tsar_desc:0 "Despite our own shell famine, thousands of tons of heavy artillery, machine guns, and ammunition are shipped to the Russian army via Archangelsk and Vladivostok."
 FRA_soutien_inconditionnel_a_la_serbie:0 "Rescue & Evacuation of the Serbian Army"
 FRA_soutien_inconditionnel_a_la_serbie_desc:0 "Following the heroic winter retreat through the Albanian mountains, French naval vessels evacuate 140,000 Serbian troops to Corfu, rearming them with French rifles and 75mm guns."
 FRA_spad_fighter_supremacy:0 "SPAD Fighter Superiority"
 FRA_spad_fighter_supremacy_desc:0 "Robust SPAD VII and XIII biplanes powered by Hispano-Suiza V8 engines dominate high-altitude dogfights."
 FRA_stabilisation_du_front_de_tranchees:0 "Trench System Engineering"
 FRA_stabilisation_du_front_de_tranchees_desc:0 "From the Swiss border to the North Sea, sappers excavate three parallel defense lines with traverses, deep dugouts, parapets, and dense barbed-wire aprons."
 FRA_stabilisation_du_front_occidental:0 "Western Front Trench Stalemate"
 FRA_stabilisation_du_front_occidental_desc:0 "The war of movement has ended. In deep mud and chalk dugouts, two million French poilus dig in behind barbed wire, awaiting the artillery storms."
 FRA_stabilite_ministerielle_garantie:0 "Guaranteed Cabinet Stability"
 FRA_stabilite_ministerielle_garantie_desc:0 "New constitutional rules restrict votes of no-confidence to a two-thirds threshold, preventing opportunistic cabinet collapses and ensuring multi-year governmental programs."
 FRA_standardisation_des_calibres:0 "Standardisation of Ordnance Calibres"
 FRA_standardisation_des_calibres_desc:0 "Retiring obsolete 19th-century fortress artillery calibres focuses manufacturing exclusively on 75mm field shells, 155mm howitzers, and 8mm rifle cartridges."
 FRA_standardised_war_tooling:0 "Standardized War Tooling"
 FRA_standardised_war_tooling_desc:0 "Rigorous technical standardization across all armaments factories streamlines production lines and ammunition logistics."
 FRA_statut_des_fonctionnaires:0 "Civil Service Merit Code"
 FRA_statut_des_fonctionnaires_desc:0 "Professionalising the prefects and ministry bureaucracy ensures transparent administration, fiscal integrity, and swift mobilization."
 FRA_statut_naval_boue_de_lapeyrere:0 "Lapeyrère's Naval Organic Statute"
 FRA_statut_naval_boue_de_lapeyrere_desc:0 "Admiral Boué de Lapeyrère's ambitious 1912 program ended the confusion of the Jeune École, committing France to a modern battle fleet of 28 modern dreadnoughts."
 FRA_statut_naval_de_1912:0 "Naval Expansion Law of 1912"
 FRA_statut_naval_de_1912_desc:0 "Passing Boué de Lapeyrère's multi-year naval law funds construction of twenty-eight first-class dreadnought battleships to maintain naval superiority over Austro-Italian fleets."
 FRA_suffrage_et_citoyennete:0 "Universal Suffrage & Civic Equality"
 FRA_suffrage_et_citoyennete_desc:0 "Consolidating direct universal male suffrage and defending local municipal councils deepens grassroots loyalty to the Third Republic across rural communes."
 FRA_superdreadnoughts_classe_bretagne:0 "Bretagne-Class Super-Dreadnoughts"
 FRA_superdreadnoughts_classe_bretagne_desc:0 "Upgrading to ten 340mm guns mounted along the centerline, the Bretagne, Provence, and Lorraine represent the pinnacle of French wartime naval architecture."
 FRA_suprematie_aerienne_absolue:0 "Absolute Air Supremacy Over the Front"
 FRA_suprematie_aerienne_absolue_desc:0 "By late 1918, French squadrons dominate the skies over the Western Front, blinding German artillery while strafing retreating enemy columns across the Hindenburg Line."
 FRA_supreme_allied_command:0 "Supreme Allied Command (Foch)"
 FRA_supreme_allied_command_desc:0 "Marshal Ferdinand Foch directs all British, American, and French armies under a unified operational strategy."
 FRA_supreme_combined_arms:0 "Allied Supreme Command & Combined Arms"
 FRA_supreme_combined_arms_desc:0 "Under Supreme Commander Ferdinand Foch, coordinated waves of Renault FT tanks, tactical aviation, and massed artillery sweep forward in decisive breakthrough operations."
 FRA_supreme_industrial_mobilisation:0 "Supreme Industrial Mobilization"
 FRA_supreme_industrial_mobilisation_desc:0 "Total economic coordination between automotive giants, heavy steelworks, and chemical conglomerates."
 FRA_surveillance_du_detroit_de_gibraltar:0 "Gibraltar Strait Surveillance"
 FRA_surveillance_du_detroit_de_gibraltar_desc:0 "Coordinating with the British garrison at the Rock, French maritime patrol aircraft and patrol craft seal the western entrance to the Mediterranean."
 FRA_synchronisation_de_mitrailleuse_garros:0 "Roland Garros' Gun Interrupter Deflector"
 FRA_synchronisation_de_mitrailleuse_garros_desc:0 "Roland Garros and Raymond Saulnier fit steel deflector wedges to propeller blades, allowing a forward-firing machine gun to aim through the propeller disc."
 FRA_synchronized_vickers_guns:0 "Deflector Wedges & Synchronizer Gears"
 FRA_synchronized_vickers_guns_desc:0 "Machineguns firing directly through the propeller arc turn French pursuit planes into lethal dogfighters."
 FRA_tactique_des_convois_maritimes:0 "Mandatory Escorted Convoy System"
 FRA_tactique_des_convois_maritimes_desc:0 "Grouping merchantmen into large convoys escorted by destroyers, armed trawlers, and flying boats reduces shipping losses by over eighty percent."
 FRA_tamatave_port_infrastructure:0 "Tamatave Harbor Facilities"
 FRA_tamatave_port_infrastructure_desc:0 "Modernized piers and cargo cranes safeguard vital Indian Ocean sea lanes."
 FRA_technological_manpower_substitution:0 "Technological Manpower Substitution"
 FRA_technological_manpower_substitution_desc:0 "As advocated by General Pétain, machines and firepower must replace human flesh. Renault FT light tanks and massed artillery batteries preserve French soldiers' lives."
 FRA_the_tiger_dictatorship:0 "Le Tigre War Ministry"
 FRA_the_tiger_dictatorship_desc:0 "Clemenceau exercises supreme political willpower over the nation. Parliament is held in line and all industrial and civilian energy is subordinated to the war effort."
 FRA_they_shall_not_pass:0 "'Ils Ne Passeront Pas!'"
 FRA_they_shall_not_pass_desc:0 "The sacred vow of the poilus at Verdun. No German division shall breach the ring of forts, no matter the sacrifice demanded."
 FRA_third_republic_politics:0 "Politics of the Third Republic"
 FRA_third_republic_politics_desc:0 "Manage the delicate balance of parliamentary power between Radicals, Socialists, and Conservatives, and respond to civil emergencies."
 FRA_three_year_conscription:0 "Three-Year Service Law"
 FRA_three_year_conscription_desc:0 "Extending compulsory service to three years offsets France’s demographic deficit, providing active divisions ready at the border."
 FRA_three_year_law_and_colonial_ranks:0 "Extended Conscription & Colonial Ranks"
 FRA_three_year_law_and_colonial_ranks_desc:0 "Combining metropolitan three-year service with recruitment from North and West Africa ensures substantial strategic reserves."
 FRA_tir_a_travers_l_helice_garros:0 "Roland Garros Armored Deflector Blades"
 FRA_tir_a_travers_l_helice_garros_desc:0 "Aviator Roland Garros fitted armored steel wedges to his propeller blades, enabling his Hotchkiss machine gun to fire directly through the propeller arc."
 FRA_tirailleurs_algeriens_et_goumiers:0 "Algerian Tirailleurs & Moroccan Goumiers"
 FRA_tirailleurs_algeriens_et_goumiers_desc:0 "Hardened North African infantry and mounted Spahis display unparalleled bravery and discipline, holding key defense sectors at Douaumont and the Chemin des Dames."
 FRA_tirailleurs_marocains_shock:0 "Tirailleurs Marocains Shock Cadres"
 FRA_tirailleurs_marocains_shock_desc:0 "Renowned for ferocious assault capabilities in trench fighting, Moroccan regiments lead frontline counter-offensives."
 FRA_tirailleurs_senegalais:0 "Tirailleurs Sénégalais Shock Battalions"
 FRA_tirailleurs_senegalais_desc:0 "Equipped with Lebel rifles and distinctive red chechias, the disciplined Senegalese tirailleurs serve with legendary courage at Ypres, the Somme, and Chemin des Dames."
 FRA_tirailleurs_senegalais_valor:0 "Tirailleurs Sénégalais Tenacity"
 FRA_tirailleurs_senegalais_valor_desc:0 "Unshakable courage under severe enemy artillery fire earns West African riflemen legendary status."
 FRA_torpilleurs_de_haute_mer_arabe:0 "Arabe-Class Fleet Torpedo Destroyers"
 FRA_torpilleurs_de_haute_mer_arabe_desc:0 "Built in Japanese and French shipyards, these fast destroyers provide agile screening and torpedo salvos for French heavy divisions."
 FRA_torpilleurs_et_contre_torpilleurs:0 "Mass Torpedo-Boat Destroyer Production"
 FRA_torpilleurs_et_contre_torpilleurs_desc:0 "Mass-producing the Bouclier and Bisson class destroyers provides swift, seaworthy escorts to hunt enemy submarines and shield battleship squadrons."
 FRA_traite_de_fez_1912:0 "Treaty of Fez (Moroccan Protectorate)"
 FRA_traite_de_fez_1912_desc:0 "Sultan Abdelhafid signs the Treaty of Fez, formally establishing the French Protectorate in Morocco under General Lyautey while recognizing Spanish interests in the north."
 FRA_transition_vers_l_economie_de_guerre:0 "Transition to Total War Economy"
 FRA_transition_vers_l_economie_de_guerre_desc:0 "With the northeastern industrial departments falling into German hands in August 1914, France must reorganize the entire remaining nation into a single military workshop."
 FRA_travailleurs_coloniaux_de_marseille:0 "Colonial Labor Battalions at Marseille"
 FRA_travailleurs_coloniaux_de_marseille_desc:0 "Over 100,000 Indochinese, Malagasy, and North African contract laborers unload convoy ships, pave roads, and staff ammunition factories across southern France."
 FRA_treaty_of_london_1839_guarantor:0 "1839 Treaty of London Guarantor"
 FRA_treaty_of_london_1839_guarantor_desc:0 "France stands unconditionally behind Belgian neutrality and sovereignty against imperial aggression."
 FRA_trench_soup_and_wine_rations:0 "Improved Poilu Rations (Pinard & Warm Soup)"
 FRA_trench_soup_and_wine_rations_desc:0 "Providing hot meals and regular pinard wine rations directly to frontline trenches raises morale."
 FRA_uniformes_horizon_bleu:0 "Adoption of 'Bleu Horizon' Uniforms"
 FRA_uniformes_horizon_bleu_desc:0 "Discarding the deadly crimson red trousers ('pantalons rouges') that made French infantry easy targets, troops receive drab blue-grey camouflage suited to mud and chalk."
 FRA_uniformes_pantalon_rouge_tradition:0 "Traditional Red Trousers ('Le Pantalon Rouge')"
 FRA_uniformes_pantalon_rouge_tradition_desc:0 "Minister of War Eugène Étienne proclaimed: 'Abolish the red trousers? Never! The red trousers are France!' The brilliant garance trousers remain sacred tradition."
 FRA_union_sacree_spirit:0 "L'Union Sacrée"
 FRA_union_sacree_spirit_desc:0 "All political rivalries dissolve into solemn solidarity to defend France against foreign invasion."
 FRA_us_financial_pipeline:0 "J.P. Morgan Credit Pipeline"
 FRA_us_financial_pipeline_desc:0 "American investment banking houses open multi-billion dollar credit lines for French munitions purchases, raw materials, and agricultural food shipments."
 FRA_usines_automobiles_renault_panhard:0 "Renault, Panhard & Peugeot Motor Works"
 FRA_usines_automobiles_renault_panhard_desc:0 "France leads Europe in automobile production. Expanding the Boulogne-Billancourt lines of Louis Renault establishes mass assembly of lorries, ambulances, and taxis."
 FRA_usines_de_poudre_saint_fons:0 "National Explosives & Powder Mills"
 FRA_usines_de_poudre_saint_fons_desc:0 "Expanding the state powder monopolies at Bergerac, Ripault, and Saint-Médard ensures hundreds of tonnes of stable smokeless propellant are bottled daily."
 FRA_usines_du_nord_et_pas_de_calais:0 "Nord & Pas-de-Calais Coal Basins"
 FRA_usines_du_nord_et_pas_de_calais_desc:0 "Deep coal pits at Lens, Douai, and Valenciennes extract tens of millions of tons of black diamonds annually, powering French locomotives and metallurgical furnaces."
 FRA_verdun_resilience:0 "Verdun Fortress Defense (Active Surge)"
 FRA_verdun_resilience_desc:0 "Temporary bounded combat surge: heroic resilience at Fort Douaumont and Vaux. Lasts strictly during the crisis."
 FRA_verdun_resilience_mission:0 "Verdun Fortress Stand"
 FRA_verdun_resilience_mission_desc:0 "Hold Fort Douaumont, Fort Vaux, and the Meuse line against relentless enemy assaults. Every day held preserves France."
 FRA_verdun_exhaustion:0 "Post-Verdun Combat Exhaustion"
 FRA_verdun_exhaustion_desc:0 "Following months of relentless bombardment and bitter struggle in the muddy trenches of Verdun, divisions are cycled through rest camps to restore fighting spirit."
 FRA_versailles_supreme_guarantor:0 "Guarantor of European Order"
 FRA_versailles_supreme_guarantor_desc:0 "Victorious and resolute, France stands as the principal guarantor of peace and democratic treaties in continental Europe."
 FRA_victoire_electorale_socialiste:0 "Socialist Electoral Triumph"
 FRA_victoire_electorale_socialiste_desc:0 "Riding widespread popular revulsion against military adventurism, the SFIO and independent socialists secure an unprecedented majority in the Chamber of Deputies."
 FRA_victorious_aero_industry:0 "Victorious Aeronautical Industry"
 FRA_victorious_aero_industry_desc:0 "France produces more combat aircraft and engines than any other nation in the Great War."
 FRA_visite_de_poincare_a_saint_petersbourg:0 "Poincaré's State Visit to St. Petersburg"
 FRA_visite_de_poincare_a_saint_petersbourg_desc:0 "In July 1914 aboard the battleship France, President Poincaré sails to Peterhof, reaffirming absolute, unshakeable French fidelity to Tsar Nicholas II as the July Crisis gathers storm."
 FRA_voie_du_rapprochement_franco_allemand:0 "Franco-German Rapprochement (Caillaux Vision)"
 FRA_voie_du_rapprochement_franco_allemand_desc:0 "Advocated by Joseph Caillaux, this vision seeks to overcome the blood-feud of 1870 through economic partnership between French capital and German industrial dynamism."
 FRA_wagons_de_mobilisation_rapide:0 "Standardized Rolling Stock ('Hommes 40, Chevaux 8')"
 FRA_wagons_de_mobilisation_rapide_desc:0 "Every French boxcar is standardized with military markings: 40 men or 8 horses. Thousands of locomotives stand fueled in reserve, ready for instant mobilization day."
 FRA_war_cabinet_discipline:0 "War Cabinet Executive Discipline"
 FRA_war_cabinet_discipline_desc:0 "Streamlined executive authority ensures prompt wartime decisions and decisive resource coordination."
 FRA_war_economy_and_munitions:0 "Wartime Economic Mobilization"
 FRA_war_economy_and_munitions_desc:0 "Convert domestic industry, expand heavy shell manufacturing, issue national defense loans, and manage civilian rationing."
 FRA_wards_of_the_nation_care:0 "Pupilles de la Nation"
 FRA_wards_of_the_nation_care_desc:0 "The Republic adopts the war orphans and cares for widowed families, cementing societal gratitude and moral strength."
 FRA_wearing_union_sacree:0 "Strain on the Sacred Union"
 FRA_wearing_union_sacree_desc:0 "The endless slaughter at Verdun and the Somme has rekindled parliamentary friction, socialist pacifism, and trade union strike threats."
 FRA_western_front_operations:0 "Western Front Operations"
 FRA_western_front_operations_desc:0 "Strategic decisions and emergency command orders along the Western Front."
 FRA_ww1_division_rotation:0 "Noria Division Rotation System"
 FRA_ww1_division_rotation_desc:0 "Regularly rotating frontline units prevents morale collapse and maintains high unit cohesion."
 FRA_ww1_field_fortification:0 "Deep Concrete Field Fortifications"
 FRA_ww1_field_fortification_desc:0 "Reinforced concrete pillboxes, deep underground shelters, and multiple barbed wire belts withstand bombardment."
 FRA_ww1_rationing:0 "Fair Wartime Food Supply"
 FRA_ww1_rationing_desc:0 "Rationing coupons and municipal bread cards ensure urban workers and soldiers receive adequate sustenance."
 FRA_ww1_salonika_transport:0 "Armée d’Orient (Salonika Lifeline)"
 FRA_ww1_salonika_transport_desc:0 "Specialized transport convoys maintain the multinational allied front in northern Greece and the Balkans."
 FRA_zouaves_et_spahis_d_afrique:0 "19th Army Corps (Zouaves, Spahis & Chasseurs)"
 FRA_zouaves_et_spahis_d_afrique_desc:0 "The storied 19th Army Corps from Algeria and Morocco deploys elite colonial divisions to France, spearheaded by fierce Berber horsemen and veteran settler infantry."
 ww1_france.1.a:0 "Consult our British allies firmly."
 ww1_france.1.b:0 "Negotiate a bilateral colonial compromise."
 ww1_france.1.d:0 "On July 1, 1911, the German gunboat SMS Panther cast anchor off the Moroccan port of Agadir under the pretext of defending German commercial interests. Berlin seeks to challenge French paramountcy in Morocco."
 ww1_france.1.t:0 "Agadir Crisis: The Panther in Agadir"
 ww1_france.10.a:0 "France expands its civilizing mission"
 ww1_france.10.d:0 "Sultan Abdelhafid signs the Treaty of Fez establishing the French Protectorate in Morocco under General Hubert Lyautey."
 ww1_france.10.t:0 "Treaty of Fez: The French Protectorate"
 ww1_france.101.a:0 "Pour la France! Until total victory!"
 ww1_france.101.d:0 "November 1917: At 76 years of age, Georges Clemenceau forms a government of iron will. 'Home policy? I wage war. Foreign policy? I wage war. All the time, I wage war!'"
 ww1_france.101.t:0 "Clemenceau 'Le Tigre' Takes Power"
 ww1_france.111.a:0 "The New World arrives to save the Old!"
 ww1_france.111.d:0 "Colonel Stanton proclaims at Picpus Cemetery: 'Lafayette, we are here!' Doughboys disembark in Saint-Nazaire and Brest, bringing inexhaustible fresh strength."
 ww1_france.111.t:0 "Arrival of Pershing & American Doughboys"
 ww1_france.131.a:0 "Victory! The nightmare has ended!"
 ww1_france.131.d:0 "At the 11th hour of the 11th day of the 11th month, the guns fall silent. In Foch's railway carriage at Rethondes, Germany signs the armistice terms."
 ww1_france.131.t:0 "O Armistício de Compiègne"
 ww1_france.132.a:0 "Vive l'Alsace! Vive la Lorraine! Vive la France!"
 ww1_france.132.d:0 "Forty-eight years of German occupation are over. French poilus enter Strasbourg, Colmar, and Metz under triumphal arches of flowers. France is whole once more!"
 ww1_france.132.t:0 "Reintegration of Alsace and Lorraine"
 ww1_france.2.a:0 "The Entente Cordiale stands unbreakable"
 ww1_france.2.d:0 "Chancellor David Lloyd George delivers a resolute speech at Mansion House: Britain will not allow its allies to be treated as of no account when European peace is at stake."
 ww1_france.2.t:0 "British Support: The Mansion House Speech"
 ww1_france.20.a:0 "France stands ready to defend herself"
 ww1_france.20.b:0 "A compromise preserves social peace."
 ww1_france.20.d:0 "The National Assembly votes to extend compulsory military service from two to three years, countering Germany's growing demographic dominance."
 ww1_france.20.t:0 "Passage of the Three-Year Conscription Law"
 ww1_france.201.a:0 "Accept French gold and build strategic lines."
 ww1_france.201.b:0 "Refuse foreign financial tutelage."
 ww1_france.201.d:0 "Paris proposes a massive loan package to modernise the Imperial Russian rail network, speeding mobilization toward the East Prussian and Galician frontiers."
 ww1_france.201.t:0 "French Strategic Railway Loans Offer"
 ww1_france.202.a:0 "The Russian Steamroller accelerates!"
 ww1_france.202.d:0 "Tsar Nicholas II ratifies the railway agreement. French bondholders rejoice as Russian engineer battalions begin laying double-tracks toward Grodno and Warsaw."
 ww1_france.202.t:0 "Russia Accepts Strategic Railway Accord"
 ww1_france.203.a:0 "A disappointing setback for allied coordination"
 ww1_france.203.d:0 "Stavka insists on full autonomy over railway spending, refusing Paris's timetable mandates."
 ww1_france.203.t:0 "Russia Rebuffs French Rail Demands"
 ww1_france.204.a:0 "Pledge the Russian Steamroller by M+15!"
 ww1_france.204.b:0 "Stavka prioritizes the Austro-Hungarian front"
 ww1_france.204.d:0 "General Joffre requests an ironclad guarantee from Russia: an all-out offensive into East Prussia by the 15th day of mobilization to divide German forces."
 ww1_france.204.t:0 "Joffre-Zhilinsky Protocols: Day 15 Commitment"
 ww1_france.205.a:0 "Our alliance is forged in steel!"
 ww1_france.205.d:0 "Grand Duke Nicholas signs the protocol. In August 1914, Russian armies will march into East Prussia, preventing Germany from concentrating exclusively on Paris."
 ww1_france.205.t:0 "Russia Pledges Day 15 East Prussia Offensive"
 ww1_france.206.a:0 "France must rely primarily on its own arms."
 ww1_france.206.d:0 "Stavka declines to tie its deployment to fixed dates, warning that vast Russian distances require measured concentration."
 ww1_france.206.t:0 "Russia Declines Fixed Mobilization Timetable"
 ww1_france.207.a:0 "Vive l'Alliance Franco-Russe!"
 ww1_france.207.d:0 "The Imperial Russian government has dispatched promised raw materials, grain, and strategic munitions through Arctic and Mediterranean convoys, cementing our allied cooperation."
 ww1_france.207.t:0 "Russian Strategic Shipments Arrive"
 ww1_france.210.a:0 "Ratify the Mediterranean-Channel division"
 ww1_france.210.b:0 "Maintain Splendid Isolation; avoid binding commitments"
 ww1_france.210.d:0 "Paris proposes a formal division of naval responsibility: the Royal Navy assumes primary defense of the English Channel and North Sea, while the Marine Nationale guards the Mediterranean."
 ww1_france.210.t:0 "Anglo-French Naval Partition of 1912"
 ww1_france.211.a:0 "The Entente Cordiale dominates the seas!"
 ww1_france.211.d:0 "First Lord of the Admiralty Winston Churchill confirms the agreement. Britain protects the Channel; France commands the Mediterranean."
 ww1_france.211.t:0 "Great Britain Ratifies Naval Convention"
 ww1_france.212.a:0 "We must maintain strong Channel flotillas ourselves"
 ww1_france.212.d:0 "The British Cabinet shies away from formal naval division, preserving Admiralty freedom of action."
 ww1_france.212.t:0 "Great Britain Declines Naval Partition"
 ww1_france.213.a:0 "Ratify the BEF deployment timetable"
 ww1_france.213.b:0 "Retain the regular army for home defense"
 ww1_france.213.d:0 "General Henry Wilson presents secret timetables to land six British divisions at Le Havre and concentrate them on the left flank of the French Army at Mons."
 ww1_france.213.t:0 "General Wilson's BEF Deployment Plans"
 ww1_france.214.a:0 "The khaki ranks will stand beside our poilus!"
 ww1_france.214.d:0 "London approves the mobilization timetable. The British Expeditionary Force will march beside our 5th Army upon the outbreak of hostilities."
 ww1_france.214.t:0 "Gabinete Britânico Aprova o Envio da BEF"
 ww1_france.215.a:0 "We must extend our left wing alone"
 ww1_france.215.d:0 "The British Cabinet refuses advance troop commitments to continental soil."
 ww1_france.215.t:0 "London Withholds Military Deployment Pledges"
 ww1_france.216.a:0 "Unified command guarantees victory"
 ww1_france.216.d:0 "Allied heads of state establish the Supreme War Council at Versailles, ensuring coordinated strategy across the Western, Italian, and Balkan fronts."
 ww1_france.216.t:0 "Supreme Allied War Council at Versailles"
 ww1_france.220.a:0 "Sign the Treaty of London! Reclaim our lands!"
 ww1_france.220.b:0 "Sacro Egoismo: Strict Neutrality"
 ww1_france.220.c:0 "Demand French Corsica, Nice, and Tunisia instead!"
 ww1_france.220.d:0 "The Entente powers offer Italy Trentino, South Tyrol, Trieste, Istria, and Dalmatian islands in exchange for joining the war against the Central Powers."
 ww1_france.220.t:0 "Secret Treaty of London Proposal"
 ww1_france.221.a:0 "Avanti Savoia! The ring tightens around Vienna!"
 ww1_france.221.d:0 "Rome breaks with the Triple Alliance and declares war on Austria-Hungary! An entire new southern front opens across the Isonzo."
 ww1_france.221.t:0 "Italy Enters the Entente!"
 ww1_france.222.a:0 "Disappointing, but our Alpine border is safe."
 ww1_france.222.d:0 "Giolitti's neutralists prevail in Rome. Italy will remain neutral, selling war materiel to both sides."
 ww1_france.222.t:0 "Italy Chooses Strict Neutrality"
 ww1_france.223.a:0 "Outrageous Italian insolence! Reinforce the Alps!"
 ww1_france.223.d:0 "Italian nationalists claim Nice, Savoy, Corsica, and Tunisia as historical Italian heritage!"
 ww1_france.223.t:0 "Italy Demands French Possessions!"
 ww1_france.230.a:0 "Accept French weaponry and liberate the homeland!"
 ww1_france.230.d:0 "French warships evacuate 140,000 exhausted Serbian troops to the island of Corfu. France offers modern Lebel rifles, 75mm artillery, and medical rearmament."
 ww1_france.230.t:0 "Reorganization of the Serbian Army at Corfu"
 ww1_france.231.a:0 "Heroic Serbia fights on!"
 ww1_france.231.d:0 "Restored to fighting strength by French supplies, the Serbian Army embarks for the Salonika front, burning to avenge Belgrade."
 ww1_france.231.t:0 "The Serbian Army Resurrected at Corfu"
 ww1_france.232.a:0 "Welcome General Berthelot and modern arms!"
 ww1_france.232.d:0 "Paris dispatches General Henri Berthelot with French officers and weapons shipments to reorganize the Romanian Army in Moldavia."
 ww1_france.232.t:0 "General Berthelot's Romanian Military Mission"
 ww1_france.233.a:0 "Romania stands firm in the East!"
 ww1_france.233.d:0 "Under Berthelot's guidance, Romanian divisions entrench along the Siret line, halting enemy assaults at Mărășești."
 ww1_france.233.t:0 "General Berthelot Reorganizes Romania"
 ww1_france.234.a:0 "Welcome the Allied forces to Salonika."
 ww1_france.234.b:0 "Protest this violation of neutral sovereignty!"
 ww1_france.234.d:0 "Allied divisions arrive at the port of Salonika to support Serbia and establish a southern front in the Balkans."
 ww1_france.234.t:0 "Allied Disembarkation at Salonika"
 ww1_france.235.a:0 "The Balkan bridgehead is secure!"
 ww1_france.235.d:0 "Prime Minister Eleftherios Venizelos welcomes Allied troops, anchoring the Salonika Front."
 ww1_france.235.t:0 "Greece Authorizes Salonika Bridgehead"
 ww1_france.236.a:0 "A delicate diplomatic complication"
 ww1_france.236.d:0 "King Constantine protests the Allied presence, dividing Greece between royalist Athens and venizelist Salonika."
 ww1_france.236.t:0 "The Greek National Schism"
 ww1_france.237.a:0 "Sign the Armistice of Salonika and exit the war!"
 ww1_france.237.d:0 "General Franchet d'Espèrey's multinational army ruptures the Bulgarian defenses at Dobro Pole. Facing collapse, Sofia petitions for an immediate armistice."
 ww1_france.237.t:0 "Breakthrough of Salonika: Armistice"
 ww1_france.238.a:0 "The dominoes begin to fall!"
 ww1_france.238.d:0 "Bulgaria becomes the first Central Power to capitulate. The back door to Vienna and Constantinople is wide open!"
 ww1_france.238.t:0 "Bulgaria Capitulates at Salonika!"
 ww1_france.250.a:0 "Authorize Wall Street war bonds for France."
 ww1_france.250.b:0 "Maintain strict neutral non-involvement"
 ww1_france.250.d:0 "The French Republic requests authorization for J.P. Morgan & Co. to float hundreds of millions of dollars in commercial war bonds across American markets."
 ww1_france.250.t:0 "J.P. Morgan War Credits Authorization"
 ww1_france.251.a:0 "American financial might powers our war industry!"
 ww1_france.251.d:0 "Billions of dollars in American capital flow to purchase food, copper, steel, and cotton, linking American financial success directly to French victory."
 ww1_france.251.t:0 "Wall Street Credits Open for France"
 ww1_france.252.a:0 "We must tighten our domestic belts"
 ww1_france.252.d:0 "President Wilson prohibits loans to belligerents, forcing France to finance its imports through gold reserves."
 ww1_france.252.t:0 "Washington Enforces Strict Financial Embargo"
 ww1_france.253.a:0 "Standardize US forces with French artillery."
 ww1_france.253.d:0 "With American munitions plants still tooling up, France offers to supply arriving AEF divisions with Canon de 75mm field guns, Chauchat automatics, and Renault FT tanks."
 ww1_france.253.t:0 "Equipping Pershing's American Doughboys"
 ww1_france.254.a:0 "Together we strike the final blow!"
 ww1_france.254.d:0 "General Pershing's doughboys march to the front with French 75s and Renault FTs, forming an unstoppable allied battering ram."
 ww1_france.254.t:0 "American Doughboys Equipped with French Arms"
 ww1_france.260.a:0 "Accept the olive branch! Form the Briey syndicate!"
 ww1_france.260.b:0 "Spurn French weakness! Germany relies only on the sword!"
 ww1_france.260.d:0 "French Premier Joseph Caillaux proposes a historic reconciliation: end the blood-feud of 1870, create a Briey-Ruhr coal-and-steel industrial syndicate, and ensure continental peace."
 ww1_france.260.t:0 "Caillaux's Franco-German Initiative"
 ww1_france.261.a:0 "A new dawn of peace in Europe!"
 ww1_france.261.d:0 "Berlin embraces Caillaux's proposal! The industrial combines of France and Germany unite in mutual prosperity, defusing European war fever."
 ww1_france.261.t:0 "Germany Accepts Historic Reconciliation!"
 ww1_france.262.a:0 "Has France forgotten the sacred alliance?"
 ww1_france.262.d:0 "St. Petersburg expresses outrage at the Franco-German agreement, viewing it as a betrayal of the Dual Alliance."
 ww1_france.262.t:0 "Russia Denounces Franco-German Détente"
 ww1_france.263.a:0 "A continental colossus is born..."
 ww1_france.263.d:0 "The British Foreign Office views a Franco-German economic bloc with deep suspicion, fearing British commercial isolation."
 ww1_france.263.t:0 "Britain Alarmed by Franco-German Accord"
 ww1_france.264.a:0 "Militarism blinds Berlin to reason"
 ww1_france.264.d:0 "The German Kaiser and General Staff reject Caillaux's proposal, reaffirming that German destiny will be forged in blood and iron."
 ww1_france.264.t:0 "Berlin Spurns the Olive Branch"
 ww1_france.265.a:0 "Agree to the neutral autonomous Condominium"
 ww1_france.265.b:0 "Never! Reichsland Elsaß-Lothringen is German soil!"
 ww1_france.265.d:0 "Paris proposes that Alsace-Lorraine become a neutral autonomous European territory under joint Franco-German protection, removing the greatest obstacle to eternal peace."
 ww1_france.265.t:0 "Proposal for Condominium of Alsace-Lorraine"
 ww1_france.266.a:0 "Peace reigns along the Rhine!"
 ww1_france.266.d:0 "In Strasbourg Cathedral, representatives sign the accord. The lost provinces become a bridge of friendship rather than a ditch of blood."
 ww1_france.266.t:0 "Condominium Accord Signed in Strasbourg!"
 ww1_france.267.a:0 "The wound of 1870 remains unhealed"
 ww1_france.267.d:0 "Berlin declares Alsace-Lorraine non-negotiable. German sovereignty will never be shared."
 ww1_france.267.t:0 "Germany Refuses Any Deal on Reichsland"
 ww1_france.268.a:0 "Sign the Continental Non-Aggression Pact"
 ww1_france.268.b:0 "Reject any paper pact with our hereditary rival"
 ww1_france.268.d:0 "France proposes a solemn bilateral non-aggression pact with Germany, effectively neutralizing European tensions."
 ww1_france.268.t:0 "Continental Non-Aggression Pact Proposal"
 ww1_france.269.a:0 "Europe is saved from catastrophe!"
 ww1_france.269.d:0 "Peace is secured! France and Germany pledge never to bear arms against one another, ushering in an era of unprecedented continental cooperation."
 ww1_france.269.t:0 "Continental Non-Aggression Pact Ratified!"
 ww1_france.270.a:0 "Join Latin Entente with our sister republic!"
 ww1_france.270.b:0 "Decline membership; Italy charts its own course"
 ww1_france.270.d:0 "France invites the Italian Kingdom to form a grand Latin bloc across the Western Mediterranean, coordinating naval defense, trade, and colonial affairs."
 ww1_france.270.t:0 "The Latin Mediterranean Entente"
 ww1_france.271.a:0 "Join the Latin Entente with France!"
 ww1_france.271.b:0 "Maintain Spain's traditional neutral isolation"
 ww1_france.271.d:0 "France extends an invitation to the Kingdom of Spain to join the Latin Mediterranean Entente, securing mutual defense and customs cooperation."
 ww1_france.271.t:0 "The Latin Mediterranean Entente (Spain)"
 ww1_france.3.a:0 "Agree to the colonial exchange for Morocco."
 ww1_france.3.b:0 "Reject all German blackmail!"
 ww1_france.3.d:0 "Berlin demands vast territories across French Congo and Oubangui-Chari in exchange for recognizing French claims in Morocco."
 ww1_france.3.t:0 "German Demands over Equatorial Africa"
 ww1_france.30.a:0 "A president of resolute resolve"
 ww1_france.30.b:0 "Jules Pams will seek domestic harmony"
 ww1_france.30.d:0 "Conservative statesman Raymond Poincaré is elected President of the Third Republic, pledging unwavering resolve against German aggression."
 ww1_france.30.t:0 "Election of Raymond Poincaré as President"
 ww1_france.4.a:0 "A bitter compromise, but peace is preserved"
 ww1_france.4.b:0 "No concession of sacred soil!"
 ww1_france.4.d:0 "After months of tense negotiations, France cedes a corridor in the Congo to German Cameroon in return for undisputed French protectorate rights over Morocco."
 ww1_france.4.t:0 "The Franco-German Accord of 1911"
 ww1_france.40.a:0 "Our last voice for peace has been silenced..."
 ww1_france.40.d:0 "July 31, 1914: Nationalist fanatic Raoul Villain shoots socialist peace leader Jean Jaurès at Café du Croissant. France loses its greatest voice for peace on the eve of catastrophe."
 ww1_france.40.t:0 "The Assassination of Jean Jaurès"
 ww1_france.41.a:0 "L'Union Sacrée! Pour la Patrie!"
 ww1_france.41.d:0 "Church bells ring across every village in France. Over three million reservists take their rifles and march to the railway stations with flowers in their gun barrels."
 ww1_france.41.t:0 "Mobilização Geral: 1º de Agosto de 1914"
 ww1_france.5.a:0 "France shall not be intimidated!"
 ww1_france.5.d:0 "With negotiations collapsing, the German press clamors for war and military demonstrations off the African coast."
 ww1_france.5.t:0 "German Sabre-Rattling over Agadir Breakdown"
 ww1_france.50.a:0 "Order the fighting retreat to save the armies!"
 ww1_france.50.d:0 "August 1914: Charging against fortified German machine guns in red trousers, French armies suffer catastrophic casualties. The offensive doctrine collapses under lead and shrapnel."
 ww1_france.50.t:0 "Battle of the Frontiers in Alsace"
 ww1_france.51.a:0 "The lost provinces are redeemed!"
 ww1_france.51.d:0 "Against all odds, French armies rupture the German front and march into Strasbourg and Metz! The tricolor flies once more across the Rhine!"
 ww1_france.51.t:0 "Plan XVII Triumphs: Alsace Liberated!"
 ww1_france.52.a:0 "Consolidate defensive lines along the Meuse"
 ww1_france.52.d:0 "Heavy German counter-attacks halt the French advance with severe losses. Both sides dig in for a war of attrition."
 ww1_france.52.t:0 "Plan XVII Repulsed: The Frontier Stalemate"
 ww1_france.61.a:0 "Paris is saved! The invader is thrown back!"
 ww1_france.61.d:0 "General Gallieni requisitions 600 Parisian taxis to rush 6,000 reserves to the Ourcq. Joffre strikes von Kluck's exposed flank, halting the German march on Paris."
 ww1_france.61.t:0 "The Miracle of the Marne: Taxis Save Paris"
 ww1_france.71.a:0 "Ils ne passeront pas! Verdun will hold!"
 ww1_france.71.d:0 "February 21, 1916: 1,400 German guns unleash hell on the Meuse forts to bleed France white. Verdun becomes the sacred altar of French defiance."
 ww1_france.71.t:0 "The Furnace of Verdun: Falkenhayn Strikes"
 ww1_france.81.a:0 "The offensive is an unmitigated slaughter..."
 ww1_france.81.d:0 "April 1917: General Nivelle's promised rupture is pulverized on the limestone slopes of Craonne. Over 100,000 casualties in days break the army's endurance."
 ww1_france.81.t:0 "Catastrophe on the Chemin des Dames"
 ww1_france.91.a:0 "The soul of the army is crying out..."
 ww1_france.91.d:0 "Singing the Chanson de Craonne, sixty-eight divisions refuse suicidal offensives while pledging to defend their trenches against enemy assault."
 ww1_france.91.t:0 "The Poilus Mutinies of 1917"
 ww1_france.92.a:0 "Faith is restored to the ranks"
 ww1_france.92.d:0 "Appointed Commander-in-Chief, Philippe Pétain improves warm food rations, grants leaves, and halts butcheries: 'I am waiting for the tanks and the Americans.'"
 ww1_france.92.t:0 "General Pétain Restores Order & Hope"
 FRA_le_tigre_clemenceau: "Le Tigre — Georges Clemenceau"
 FRA_le_tigre_clemenceau_desc: "Georges Clemenceau's relentless iron will governs the Republic. Refusing defeatism and strikes, the 'Father of Victory' directs every national resource to one single unbending purpose: total victory."
 FRA_ils_ne_passeront_pas: "They Shall Not Pass!"
 FRA_ils_ne_passeront_pas_desc: "The heroic stand of the French infantry in the furnace of Verdun demonstrated unmatched courage, proving to the world that French soil will never be conquered."
 FRA_poilus_reconcilies: "Reconciled Poilus"
 FRA_poilus_reconcilies_desc: "General Pétain's measured military justice, improved rotations, fresh bread, and regular leave have restored the trust and morale of the French soldiers in the trenches."
 FRA_taxis_de_la_marne: "Requisition Parisian Taxis"
 FRA_taxis_de_la_marne_desc: "Order the military governor of Paris, General Gallieni, to requisition thousands of civilian Parisian taxi cabs to rush reserve infantry directly to the frontlines along the Ourcq and Marne rivers."
 FRA_taxis_de_la_marne_active: "Taxis of the Marne"
 FRA_taxis_de_la_marne_active_desc: "Civilian motor convoys speed fresh battalions directly to threatened flanks, halting the enemy encirclement of Paris."
