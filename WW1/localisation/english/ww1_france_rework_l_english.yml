l_english:
 ENG_agadir_home_fleet_alert:0 "Place the Home Fleet on War Footing"
 ENG_agadir_home_fleet_alert_desc:0 "Concentrate British battle squadrons at Portland and Scapa Flow, making it unmistakable that the Royal Navy stands shoulder-to-shoulder with France in the Channel."
 ENG_agadir_mansion_house_speech:0 "Lloyd George's Mansion House Speech"
 ENG_agadir_mansion_house_speech_desc:0 "Chancellor David Lloyd George delivers a stern address warning Berlin that Britain will not permit its vital global interests to be sidelined by unilateral German threats."
 ENG_agadir_urge_moderation:0 "Urge Entente Moderation and Compromise"
 ENG_agadir_urge_moderation_desc:0 "Counsel Paris to seek an equitable colonial accommodation, avoiding an unprovoked conflagration over secondary West African river valleys."
 FRA_abattre_la_gueuse:0 "[Alternative - Monarchist] Abattre la Gueuse"
 FRA_abattre_la_gueuse_desc:0 ""Down with the Whore!" Action Française leagues and Camelots du Roi mobilize in the streets to sweep away the corrupt parliamentary republic and prepare the royalist restoration."
 FRA_action_francaise_monarchy:0 "Integral Nationalist Monarchy"
 FRA_action_francaise_monarchy_desc:0 "Charles Maurras's integral nationalism blends traditional royal authority, Catholic heritage, and martial discipline into an authoritarian state."
 FRA_agadir_caillaux_secret_channel:0 "Caillaux's Secret Diplomatic Channel"
 FRA_agadir_caillaux_secret_channel_desc:0 "Premier Joseph Caillaux opens confidential back-channel communications with Berlin to negotiate a pragmatic territorial settlement away from hawkish interference."
 FRA_agadir_concede_congo_accord:0 "Ratify the Morocco-Congo Exchange Accord"
 FRA_agadir_concede_congo_accord_desc:0 "Conclude the bilateral agreement ceding sections of French Equatorial Africa to German Kamerun in exchange for Berlin's formal recognition of our Moroccan protectorate."
 FRA_agadir_concede_naval_station:0 "Concede Naval Coaling Base to Germany"
 FRA_agadir_concede_naval_station_desc:0 "Capitulate to the Kaiser's demands and grant Germany sovereign coaling rights in Agadir, preserving fragile European peace at the heavy cost of national prestige."
 FRA_agadir_delcasse_firm_resolve:0 "Delcassé's Policy of Resolute Defiance"
 FRA_agadir_delcasse_firm_resolve_desc:0 "The Minister of the Navy Théophile Delcassé urges unwavering resistance against German blackmail, rallying public opinion and coordinating closely with London."
 FRA_agadir_financial_sanctions:0 "Withdraw French Capital from Berlin"
 FRA_agadir_financial_sanctions_desc:0 "Order French financial houses to liquidate short-term loans and pull credit from German markets, inducing an immediate liquidity squeeze on the Berlin stock exchange."
 FRA_charbon_et_acier:0 "Charbon et Acier (Coal & Steel)"
 FRA_charbon_et_acier_famine:0 "Critical Coal & Steel Deficit"
 FRA_charbon_et_acier_famine_desc:0 "With the northern metallurgical basin in German hands and merchant shipping squeezed, acute shortages of coking coal cripple national weapons manufacture."
 FRA_charbon_et_acier_surplus:0 "Abundant Coal & Steel"
 FRA_charbon_et_acier_surplus_desc:0 "Sustained domestic extraction and allied maritime supply lines keep French foundries, blast furnaces, and shell-machining shops operating at peak efficiency."
 FRA_charles_maurras:0 "Charles Maurras"
 FRA_clemenceau_je_fais_la_guerre:0 "[Historical] Je Fais la Guerre"
 FRA_clemenceau_je_fais_la_guerre_desc:0 "Install Georges Clemenceau as Premier with sweeping war powers to purge defeatism, invigorate the high command, and relentlessly pursue complete victory."
 FRA_comite_de_salut_public_1917:0 "[Alternative - Socialist] Revolutionary Committee of Public Safety"
 FRA_comite_de_salut_public_1917_desc:0 "Revive the jacobin legacy of 1793. Empower an emergency Committee of Public Safety to requisition private wealth, purge reactionary officers, and arm the proletariat for revolutionary defense."
 FRA_commune_de_paris_spirit:0 "Spirit of the Paris Commune"
 FRA_commune_de_paris_spirit_desc:0 "Revolutionary proletarian fervor transforms the imperialist conflagration into an emancipatory struggle for workers' liberation."
 FRA_dec_british_channel_coal:0 "British Channel Coal Convoys"
 FRA_dec_british_channel_coal_desc:0 "Organize dedicated coal convoys escorted across the English Channel to supply Welsh steam coal directly to French coastal munitions plants and foundries."
 FRA_dec_call_up_class_1917:0 "Call Up the Class of 1917 (Les Bleuets)"
 FRA_dec_call_up_class_1917_desc:0 "Mobilize the youthful conscript contingent ahead of statutory age to reconstitute shattered frontline divisions, notwithstanding the tragic human cost."
 FRA_dec_colonial_recruitment_tirailleurs:0 "Colonial Conscription: Tirailleurs Sénégalais"
 FRA_dec_colonial_recruitment_tirailleurs_desc:0 "Intensify troop levies across French West Africa, the Maghreb, and Indochina to furnish courageous colonial formations for frontline duty in Europe."
 FRA_dec_evacuate_briey_machinery:0 "Evacuate Briey & Longwy Industrial Machinery"
 FRA_dec_evacuate_briey_machinery_desc:0 "Dismantle heavy machine tooling, steam presses, and metallurgical equipment from the vulnerable northeastern frontier and relocate them securely southward to Lyon."
 FRA_dec_fort_douaumont_reinforcement:0 "Reinforce Fort Douaumont & Meuse Redoubts"
 FRA_dec_fort_douaumont_reinforcement_desc:0 "Reinstall armored turrets, casemate guns, and reinforced concrete underground bunkers at Fort Douaumont to establish an unbreachable bastion guarding Verdun."
 FRA_dec_inter_allied_supreme_war_council:0 "Establish Inter-Allied Supreme War Council"
 FRA_dec_inter_allied_supreme_war_council_desc:0 "Form an overarching strategic council of Entente political and military leaders at Versailles to coordinate grand offensives across the Western and Italian fronts."
 FRA_dec_lyon_chemical_complex:0 "Expand Lyon Gunpowder & Chemical Complex"
 FRA_dec_lyon_chemical_complex_desc:0 "Channel substantial capital into the chemical manufacturing facilities of the Rhône valley to massively expand output of high explosives, nitrocellulose, and artillery shells."
 FRA_dec_schneider_creusot_heavy_guns:0 "Mobilize Schneider-Creusot Heavy Artillery Works"
 FRA_dec_schneider_creusot_heavy_guns_desc:0 "Commission the heavy industrial foundries of Le Creusot to prioritize production of heavy siege howitzers and railway guns to overpower German fortification lines."
 FRA_dec_union_sacree_cross_party_pact:0 "Union Sacrée Cross-Party Concordat"
 FRA_dec_union_sacree_cross_party_pact_desc:0 "Gather leaders of all parliamentary groups in the Palais Bourbon to renew mutual pledges of national unity and suspend partisan discord until victory is achieved."
 FRA_dec_us_morgan_bank_credit_line:0 "Secure J.P. Morgan & Co. New York Credit Line"
 FRA_dec_us_morgan_bank_credit_line_desc:0 "Contract crucial loan agreements with the House of Morgan in New York to finance emergency purchases of American steel, nitrates, copper, and foodstuffs."
 FRA_dec_voix_sacree_truck_convoys:0 "La Voie Sacrée Emergency Truck Convoys"
 FRA_dec_voix_sacree_truck_convoys_desc:0 "Organize a relentless stream of Berliet motor trucks along the Bar-le-Duc artery, transporting reinforcements and artillery ammunition day and night to hold Verdun."
 FRA_defence_of_verdun:0 "Defence of Verdun & Fortress Line"
 FRA_defence_of_verdun_desc:0 "Tactical redeployments, artillery concentrations, and supply lifelines safeguarding the Meuse defensive bastions."
 FRA_directoire_militaire_gqg:0 "[Alternative - Military Junta] GQG Military Directory"
 FRA_directoire_militaire_gqg_desc:0 "Tired of civilian incompetence and political interference, the Grand Quartier Général suspends parliamentary oversight and assumes absolute military executive control."
 FRA_entente_diplomacy:0 "Entente Diplomacy & Coalition Warfare"
 FRA_entente_diplomacy_desc:0 "Bilateral treaties, allied strategic synchronization, and overseas war financing to sustain coalition solidarity."
 FRA_etat_de_siege_permanent:0 "[Alternative - Military Junta] Permanent State of Siege"
 FRA_etat_de_siege_permanent_desc:0 "Extend the state of siege indefinitely across all departments, placing transport, war industry, the press, and civil governance under regional military tribunals."
 FRA_fernand_loriot:0 "Fernand Loriot"
 FRA_georges_clemenceau:0 "Georges Clemenceau"
 FRA_gqg_military_directory:0 "GQG Supreme Directory"
 FRA_gqg_military_directory_desc:0 "A stern military junta under the general staff subordinates the entire civil economy to the uncompromising imperatives of operational warfare."
 FRA_jean_longuet:0 "Jean Longuet"
 FRA_jusqu_au_bout_endsieg:0 "Jusqu'au Bout! (Total War to the End)"
 FRA_jusqu_au_bout_endsieg_desc:0 ""Home policy? I wage war. Foreign policy? I wage war. All the time, I wage war!" Premier Georges Clemenceau directs the total physical and moral willpower of France toward final victory."
 FRA_king_jean_iii:0 "Jean III"
 FRA_morocco_treaty_of_fez:0 "Treaty of Fez & Moroccan Protectorate"
 FRA_morocco_treaty_of_fez_desc:0 "The peaceful resolution of the Agadir Crisis confirms our sovereign protectorate over Morocco, securing French dominance across Northwest Africa."
 FRA_munitionnettes_strike:0 "Munitionnettes Strike Waves"
 FRA_munitionnettes_strike_desc:0 "Female arms factory workers across Paris have walked off the assembly lines, striking against intolerable inflation, starvation wages, and grueling fourteen-hour shifts."
 FRA_mutinies_crisis_management:0 "1917 Mutinies Crisis Management"
 FRA_mutinies_crisis_management_desc:0 "Emergency civil and military initiatives to calm industrial unrest, suppress sedition, and rebuild infantry fighting spirit."
 FRA_petain_welfare_and_leave_reform:0 "Pétain's Welfare & Leave Reforms"
 FRA_petain_welfare_and_leave_reform_desc:0 "Enact General Pétain's vital welfare program: guaranteed seven-day furloughs, hygienic rest cantonments, warm rations, and strict limits on tactical offensive operations until allied material superiority is ensured."
 FRA_petain_welfare_reforms_unlocked_tt:0 "§GUnlocks Pétain's Welfare & Leave Reform decision to resolve the mutiny crisis.§!"
 FRA_poilu_morale:0 "Poilu Morale"
 FRA_poilu_morale_demoralized:0 "Demoralized Poilus"
 FRA_poilu_morale_demoralized_desc:0 "Repeated meatgrinder offensives and miserable frontline conditions have eroded the fighting will of the infantry, breeding widespread despair and insubordination."
 FRA_poilu_morale_high:0 "High Poilu Morale"
 FRA_poilu_morale_high_desc:0 "The French soldier stands resolute in the muddy trenches, buoyed by profound patriotic devotion and unshakable faith in ultimate victory."
 FRA_poilus_reconcilies:0 "Reconciled Poilus (Pétain's Reforms)"
 FRA_poilus_reconcilies_desc:0 "General Philippe Pétain has rebuilt frontline confidence through compassionate leadership: regular leave, nutritious food, decent rest camps, and an end to futile human-wave attacks."
 FRA_poincare_national_firmness:0 "Poincaré's Policy of Firmness"
 FRA_poincare_national_firmness_desc:0 "Raymond Poincaré brings uncompromising resolve to French diplomacy, consolidating the Entente Cordiale and deterring German aggression."
 FRA_republique_des_soviets_de_paris:0 "[Alternative - Socialist] The Paris Soviet Republic"
 FRA_republique_des_soviets_de_paris_desc:0 "Proclaim the Second Paris Commune! Dissolve the bourgeois parliament and transfer executive power to revolutionary worker councils and soldier soviets."
 FRA_republique_union_sacree:0 "[Historical] The Union Sacrée Republic"
 FRA_republique_union_sacree_desc:0 "Reaffirm the sacred truce of the Third Republic, uniting all French citizens regardless of political allegiance or religious creed in common defense of the motherland."
 FRA_reserves_humaines:0 "Réserves Humaines (Manpower Pool)"
 FRA_restauration_orleaniste_jean_iii:0 "[Alternative - Monarchist] Orléanist Restoration: King Jean III"
 FRA_restauration_orleaniste_jean_iii_desc:0 "Crowning the Duke of Guise as King Jean III of France, restoring the historic House of Orléans to establish an integral nationalist and constitutional monarchy."
 FRA_schneider_creusot_artillery_bonus:0 "Schneider-Creusot Artillery Modernization"
 FRA_third_republic_politics:0 "Third Republic Politics"
 FRA_third_republic_politics_desc:0 "Managing cross-party alliances, cabinet stability, civil-military relations, and the political cohesion of the Republic."
 FRA_trench_mutiny_crisis_2:0 "1917 French Army Mutinies"
 FRA_trench_mutiny_crisis_2_desc:0 "In the catastrophic wake of the Nivelle Offensive along the Chemin des Dames, widespread mutinies have erupted. Troops refuse suicidal frontal assaults while pledging to defend their own trenches."
 FRA_union_sacree_cohesion:0 "Union Sacrée Cohesion"
 FRA_union_sacree_fractured:0 "Fractured Union Sacrée"
 FRA_union_sacree_fractured_desc:0 "Partisan recriminations, ideological clashes, and war weariness have severely undermined political consensus, threatening parliamentary paralysis."
 FRA_union_sacree_spirit:0 "Spirit of the Union Sacrée"
 FRA_union_sacree_spirit_desc:0 "The indomitable political truce that knits together French society against foreign aggression, overcoming historical sectarian divisions."
 FRA_union_sacree_strong:0 "Resilient Union Sacrée"
 FRA_union_sacree_strong_desc:0 "From socialist syndicalists to royalist conservatives, the entire French political spectrum observes a sacred domestic truce in steadfast defense of the Fatherland."
 FRA_verdun_mission_timeout_tt:0 "§YThe Meuse fortress line holds! Verdun stands victorious! "Ils ne passeront pas!"§!"
 FRA_war_economy_and_munitions:0 "War Economy & Munitions Production"
 FRA_war_economy_and_munitions_desc:0 "Strategic management of industrial relocations, arms manufactories, synthetic chemistry works, and coal distribution for total warfare."
 FRA_western_front_operations:0 "Western Front Operational Missions"
 FRA_western_front_operations_desc:0 "Major tactical initiatives, offensive breakthroughs, and emergency defensive stands along the trench lines."
 GER_agadir_back_down_gracefully:0 "Withdraw the Panther and De-escalate"
 GER_agadir_back_down_gracefully_desc:0 "With financial panic on the Berlin Börse and the Royal Navy mobilizing, prudent withdrawal avoids an untimely world war before our High Seas Fleet is completed."
 GER_agadir_demand_congo_compensation:0 "Demand Neukamerun Colonial Compensation"
 GER_agadir_demand_congo_compensation_desc:0 "If France claims Morocco as an exclusive sphere of influence, Germany must receive substantial territorial cessions in French Equatorial Africa to enlarge Kamerun."
 GER_agadir_demand_naval_base:0 "Demand Atlantic Naval Station at Agadir"
 GER_agadir_demand_naval_base_desc:0 "Assert the Kaiserliche Marine's right to establish a fortified coaling base on the Atlantic coast of Morocco, securing a permanent German strategic foothold."
 GER_agadir_send_sms_berlin:0 "Dispatch SMS Berlin as Reinforcement"
 GER_agadir_send_sms_berlin_desc:0 "Reinforce SMS Panther with the light cruiser SMS Berlin, demonstrating Imperial Germany's unwavering resolve to back its diplomatic demands with naval steel."
 ww1_agadir.1.a:0 "Germany demands its place in the sun!"
 ww1_agadir.1.b:0 "Disavow the deployment and preserve peace"
 ww1_agadir.1.d:0 "On July 1, 1911, the German gunboat SMS Panther dropped anchor in the closed Moroccan port of Agadir under the pretext of shielding German merchants. In truth, Berlin seeks to fracture the Anglo-French Entente and demand substantial colonial spoils in Africa. The capitals of Europe are gripped by tension."
 ww1_agadir.1.t:0 "The Panthersprung: SMS Panther at Agadir"
 ww1_agadir.10.a:0 "Peace is secured through diplomatic compromise."
 ww1_agadir.10.d:0 "Diplomacy and compromise have triumphed over conflict. France and Germany have concluded the Franco-German Accord and Treaty of Fez. Germany acknowledges France's protectorate over Morocco, while France transfers 275,000 square kilometers of equatorial territory to German Kamerun (Neukamerun). The crisis is laid to rest."
 ww1_agadir.10.t:0 "The Morocco-Congo Accord & Treaty of Fez"
 ww1_agadir.11.a:0 "A peaceful settlement."
 ww1_agadir.11.d:0 "The diplomatic agreement settling Moroccan status and Congolese border adjustments has been officially ratified by the signatory powers."
 ww1_agadir.11.t:0 "Morocco Accord Ratified"
 ww1_agadir.2.a:0 "The Republic will never yield to blackmail!"
 ww1_agadir.2.d:0 "News of the Panther's arrival in Moroccan waters has provoked intense patriotic fury in Paris. The press and parliament denounce this naked act of gunboat diplomacy as a flagrant violation of the Act of Algeciras."
 ww1_agadir.2.t:0 "French Outrage over the Agadir Intrusion"
 ww1_agadir.20.a:0 "A monumental shift in the balance of naval power."
 ww1_agadir.20.d:0 "In an astonishing diplomatic capitulation, the French government has ceded naval port privileges in Agadir to the German Empire. The Kaiserliche Marine gains a heavily fortified Atlantic station flanking British trade corridors. Nationalist circles in Berlin celebrate a historic coup, while Paris reels in bitter humiliation."
 ww1_agadir.20.t:0 "Pan-German Triumph: Naval Station at Agadir"
 ww1_agadir.3.a:0 "Britain stands beside France."
 ww1_agadir.3.d:0 "The British Cabinet regards the presence of a German warship on Morocco's Atlantic coast as a direct peril to the vital sea lanes flanking Gibraltar. Whitehall firmly affirms its diplomatic solidarity with France."
 ww1_agadir.3.t:0 "British Alarm over German Naval Ambitions"
 ww1_agadir.30.a:0 "A humiliating diplomatic defeat for Berlin."
 ww1_agadir.30.d:0 "Staring down British naval mobilization and an accelerating financial crisis on the Berlin stock market, the Imperial German government has ordered the Panther to weigh anchor and depart Agadir without obtaining any colonial concessions. France celebrates an unmitigated triumph of deterrence."
 ww1_agadir.30.t:0 "The German Retreat: Panther Recalled"
 ww1_agadir.4.a:0 "Categorically reject! Not an inch of territory!"
 ww1_agadir.4.b:0 "Accede to avoid an immediate war"
 ww1_agadir.4.d:0 "The German government submits an ambitious memorandum insisting upon sovereign coaling facilities in Agadir, asserting that Germany requires a permanent base to protect its Atlantic commercial navigation."
 ww1_agadir.4.t:0 "German Demand: Atlantic Naval Base"
 ww1_agadir.40.a:0 "Aux armes, citoyens!"
 ww1_agadir.40.d:0 "Unrelenting escalation, aggressive naval posturing, and uncompromising ultimata have shattered European diplomacy. What began as a colonial dispute in Morocco has ignited a catastrophic clash between the Entente and the Central Powers. The Great War has erupted three years early!"
 ww1_agadir.40.t:0 "The Premature Conflagration: World War in 1911"
 ww1_agadir.5.a:0 "Open diplomatic negotiations on colonial frontiers"
 ww1_agadir.5.b:0 "Refuse to entertain German extortion!"
 ww1_agadir.5.d:0 "Berlin indicates that German objections to France's Moroccan protectorate can be resolved if Paris transfers expansive riverine territories in the French Congo to enlarge German Kamerun."
 ww1_agadir.5.t:0 "Berlin Proposes Neukamerun Border Compensation"
 ww1_agadir_crisis:0 "Agadir Crisis of 1911"
 ww1_agadir_crisis_desc:0 "The arrival of the gunboat SMS Panther in the Moroccan port of Agadir has triggered an acute international confrontation. The European powers must navigate ultimata, naval mobilizations, and colonial compensations to prevent early world war."
 ww1_agadir_crisis_tension:0 "Agadir Crisis Tension"
 ww1_agadir_tension_decrease_tt:0 "§GDecreases Agadir Crisis Tension§!"
 ww1_agadir_tension_increase_tt:0 "§RIncreases Agadir Crisis Tension§!"
 ww1_france.210.a:0 "General Nivelle must be relieved of command immediately!"
 ww1_france.210.d:0 "The horrific bloodshed of General Nivelle's promised breakthrough at the Chemin des Dames has exhausted the endurance of the French infantry. Mutinous demonstrations have spread across dozens of frontline divisions. Weary poilus refuse orders to launch senseless frontal assaults against unsuppressed German machine gun redoubts."
 ww1_france.210.t:0 "The 1917 French Army Mutinies"
 ww1_france.211.a:0 "Implement Pétain's humanitarian and welfare reforms"
 ww1_france.211.b:0 "Impose strict disciplinary tribunals and firing squads"
 ww1_france.211.d:0 "Philippe Pétain, the architect of defense at Verdun, has been elevated to Commander-in-Chief of the French armies. He promises an end to reckless bloodbaths, pledging to await tanks and American divisions while fundamentally reforming troop welfare, rest cycles, and home leave."
 ww1_france.211.t:0 "General Pétain Appointed Commander-in-Chief"
 ww1_france.215.a:0 "Grant wage increases and maternal work reforms"
 ww1_france.215.b:0 "Suppress the strikes through police force"
 ww1_france.215.d:0 "Inflation and crushing war burdens have pushed the female workforce in Parisian armaments factories to the breaking point. Thousands of women have downed tools to demand cost-of-living bonuses, shorter work hours, and immediate peace."
 ww1_france.215.t:0 "Munitionnettes Strike in the Capital"
 ww1_france.220.a:0 "Jusqu'au bout! Victory or death!"
 ww1_france.220.d:0 "Taking the reins of government at age 76, Georges Clemenceau electrifies the Chamber of Deputies with uncompromising oratorical fury: "No more pacifist illusions! No more defeatist propaganda! Neither treason nor semi-treason: war! Nothing but war!" The entire nation rallies with fierce resolve."
 ww1_france.220.t:0 "Clemenceau's Declaration: "Je Fais la Guerre!""
