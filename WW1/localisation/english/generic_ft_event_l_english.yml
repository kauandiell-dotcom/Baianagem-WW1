l_english: 
  generic_ft_general_event.1.t:0 "[ROOT.GetName]'s Request for Advisors"
  generic_ft_general_event.1.desc:0 "[ROOT.GetName] is an eager study and wishes for us to hire a foreign military advisor, in order to receive tutelage. [ROOT.GetHerHisCap] has found three worthy candidates for us to decide upon. From which tradition of military thought should we decide upon?"
  generic_ft_general_event.1.a:0 "The French School."
  generic_ft_general_event.1.b:0 "The Russian School."
  generic_ft_general_event.1.c:0 "The German School."

  generic_ft_general_event.2.t:0 "[ROOT.GetName]'s Mock Battle"
  generic_ft_general_event.2.desc:0 "[ROOT.GetName] is particularly skilled in manipulating terrain to gain advantage on the battlefield. [ROOT.GetHerHisCap] skills can be further enhanced by enacting a mock battle. Where should we host this mock battle?"
  generic_ft_general_event.2.a:0 "In the Sands."
  generic_ft_general_event.2.b:0 "In the Rainforests."
  generic_ft_general_event.2.c:0 "In the Marshes."
  generic_ft_general_event.2.d:0 "In the Woods."
  generic_ft_general_event.2.e:0 "In the Hills."
  generic_ft_general_event.2.f:0 "In the Mountains."
  generic_ft_general_event.2.g:0 "In the Tundras."

  generic_ft_general_event.3.t:0 "[ROOT.GetName]'s Request for Staff"
  generic_ft_general_event.3.desc:0 "[ROOT.GetName] is a field marshal and one of the highest ranking officers in our army command. [ROOT.GetSheHeCap] has recently returned from abroad and has received tutelage from a venerable European marshal. Having heard of the number of men at [ROOT.GetHerHis] tutor's disposal, [ROOT.GetName] has requested to improve the quality of [ROOT.GetHerHis] staff, in order for [ROOT.GetHerHim] to better fulfill [ROOT.GetHerHis] duties."
  generic_ft_general_event.3.a:0 "Hire quality staff."
  generic_ft_general_event.3.b:0 "Hire loads of staff!"

  generic_ft_general_event.4.t:0 "Especialização em Escolta de [ROOT.GetName]"
  generic_ft_general_event.4.desc:0 "[ROOT.GetName] is very talented at employing both destroyers and cruisers to support capital ships and ward off harassing enemy ships. The trait that best describes [ROOT.GetHerHimCap]..."
  generic_ft_general_event.4.a:0 "[ROOT.GetSheHeCap] is very perceptive."
  generic_ft_general_event.4.b:0 "[ROOT.GetSheHeCap] is very protective."
  generic_ft_general_event.4.c:0 "[ROOT.GetSheHeCap] is very calculating."

  generic_ft_general_event.5.t:0 "[ROOT.GetName]'s Subversive Training"
  generic_ft_general_event.5.desc:0 "With the advent of the submarine, [ROOT.GetName] has come up with some innovative ideas for their application in the modern naval landscape. [ROOT.GetSheHeCap] has set up a training exercise for our submarines, in order to improve our doctrine."
  generic_ft_general_event.5.a:0 "Focus on enemy convoys."
  generic_ft_general_event.5.b:0 "Focus on harassing warships."

  generic_ft_general_event.6.t:0 "[ROOT.GetName]'s Plan for Decisive Battle"
  generic_ft_general_event.6.desc:0 "[ROOT.GetName] is especially enthused by the… grander ships that can make up our navy. We only have so much naval capacity, so which should [ROOT.GetSheHeCap] focus on?"
  generic_ft_general_event.6.a:0 "The carrier is the future!"
  generic_ft_general_event.6.b:0 "The battleship is still best!"

  generic_ft_general_event.7.t:0 "$unique_model_fascism_focus$"
  generic_ft_general_event.7.desc:0 "[ROOT.GetFascistLeader] has forged a new path for [ROOT.GetAdjectiveCap] fascism, which is subtly different from both the Italian fascists and the German national socialists. [ROOT.GetFascistLeader] has a defining style which is different from all other totalitarians, which comes in the form of..."
  generic_ft_general_event.7.a:0 "Fiery, unyielding belief."
  generic_ft_general_event.7.b:0 "Practical approaches to ideology."
  generic_ft_general_event.7.c:0 "Divinity directly from the Heavens."

  generic_ft_general_event.8.t:0 "Election of [GetYear]"
  generic_ft_general_event.8.desc:0 "The [GetYear] Election has occurred in [ROOT.GetName]. Constitutional democratic parties have had a successful year, warding off any radical communist and fascist parties. Yet one party came out on top and secured government, that party being..."
  generic_ft_general_event.8.a:0 "The Socialists!"
  generic_ft_general_event.8.b:0 "The Liberals!"
  generic_ft_general_event.8.c:0 "The Conservatives!"

  generic_ft_general_event.9.t:0 "Snap Election of [GetYear]"
  generic_ft_general_event.9.desc:0 "The [GetYear] Election has occurred in [ROOT.GetName]. Constitutional democratic parties have had a successful year, warding off any radical communist and fascist parties. Yet one party came out on top and secured government, that party being..."
  generic_ft_general_event.9.a:0 "The Socialists!"
  generic_ft_general_event.9.b:0 "The Liberals!"
  generic_ft_general_event.9.c:0 "The Conservatives!"

  generic_ft_general_event.10.t:0 "Moderate Politics in [ROOT.GetName]"
  generic_ft_general_event.10.desc:0 "The regime in [ROOT.GetName] is characterised by its restraint and non-committal attitude. The leader, [ROOT.GetNeutralLeader] is a cautious figure, unwilling to get caught out at any moment."
  generic_ft_general_event.10.a:0 "Moderation is the way."
  generic_ft_general_event.10.b:0 "Centrism is the most prudent."
  generic_ft_general_event.10.c:0 "We will reform towards democracy."
generic_ft.12.t:0 "Request for Military Assistance"
  generic_ft.12.d:0 "[FROM.GetName] has formally requested military aid, guarantees, and weaponry to modernize their defenses."
  generic_ft.12.a:0 "We will support them."
  generic_ft.12.b:0 "Decline their request."
  generic_ft.13.t:0 "Military Aid Accepted"
  generic_ft.13.d:0 "[FROM.GetName] has agreed to provide equipment and technical assistance to our armed forces."
  generic_ft.13.a:0 "Splendid news!"
  generic_ft.14.t:0 "Military Aid Refused"
  generic_ft.14.d:0 "[FROM.GetName] has turned down our request for military assistance."
  generic_ft.14.a:0 "We will remember this."
  generic_ft.15.t:0 "Request for Industrial Aid"
  generic_ft.15.d:0 "[FROM.GetName] has petitioned for industrial investment and construction aid to bolster their arms output."
  generic_ft.16.t:0 "Industrial Cooperation Approved"
  generic_ft.16.d:0 "Foreign factories have begun assisting our war production."
  generic_ft.17.t:0 "Call for Great Power Involvement"
  generic_ft.17.d:0 "[FROM.GetName] has requested our direct geopolitical backing against foreign aggression."
  generic.1.t:0 "Military Mission Concluded"
  Host:0 "Host Tool"
  HostTool:0 "Host Tool"
