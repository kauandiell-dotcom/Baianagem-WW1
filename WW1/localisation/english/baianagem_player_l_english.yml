 ww1_agadir.1.t:0 "The Agadir Crisis"
 ww1_agadir.1.d:0 "In response to French military deployments in Morocco, SMS Panther has arrived in the closed port of Agadir to protect German commercial interests and demand territorial compensation."
 ww1_agadir.1.a:0 "Send the Panther and assert German prestige!"
 ww1_agadir.1.b:0 "Maintain diplomatic restraint."
 ww1_agadir.2.t:0 "Panthersprung: The Panther in Agadir"
 ww1_agadir.2.d:0 "The German Empire has dispatched a gunboat to Agadir in direct challenge to French dominance in Morocco!"
 ww1_agadir.2.a:0 "We will not yield to gunboat diplomacy!"
 ww1_agadir.3.t:0 "The Agadir Crisis & The Mansion House Speech"
 ww1_agadir.3.d:0 "Chancellor of the Exchequer Lloyd George warns that national honor is paramount and Britain stands firmly by France against German aggression."
 ww1_agadir.3.a:0 "The Entente stands firm!"