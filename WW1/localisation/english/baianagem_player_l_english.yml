 GATHERING_STORM_NAME:0 "La Belle Époque (1911)"
 GATHERING_STORM_DESC:0 "June 1911. The great empires of Europe stand at the peak of the Belle Époque in an era of armed peace and intense industrial and naval rivalry. As the Moroccan Agadir Crisis brews and the Balkans approach boiling point, the continent hurtles inexorably toward the catastrophe of the Great War."
 GER_GATHERING_STORM_DESC:0 "Under Kaiser Wilhelm II, the German Empire boasts Europe's most formidable army and a rapidly expanding High Seas Fleet. Hemmed in by the Franco-Russian alliance, Berlin adheres to the Schlieffen Plan and the Triple Alliance with Vienna and Rome."
 AUS_GATHERING_STORM_DESC:0 "The Austro-Hungarian Dual Monarchy under the elderly Emperor Franz Joseph I faces simmering nationalist unrest across the Balkans. Tensions with Serbia threaten to drag the empire into a continental conflagration."
 TUR_GATHERING_STORM_DESC:0 "The Ottoman Empire, ruled by Sultan Mehmed V and the reforming Young Turk administration, strives to modernize its administration and military amid European territorial appetites and looming Balkan insurgencies."
 ENG_GATHERING_STORM_DESC:0 "The British Empire under King George V and Prime Minister H. H. Asquith commands the world's greatest naval power and sprawling colonial dominions, determined to maintain the Two-Power Standard and preserve the European balance of power."
 FRA_GATHERING_STORM_DESC:0 "The French Third Republic, guided by the memory of 1870 and the loss of Alsace-Lorraine, leans upon its rigid military alliance with Imperial Russia and the Entente Cordiale with Britain to counter German might."
 SOV_GATHERING_STORM_DESC:0 "The Russian Empire under Tsar Nicholas II recovers from the 1905 revolution with sweeping military modernization and agrarian reforms, standing firm as the protector of the Slavic peoples in the Balkans."
 ITA_GATHERING_STORM_DESC:0 "The Kingdom of Italy under King Victor Emmanuel III and Giovanni Giolitti is formally allied to the Central Powers, yet covets Austrian-held Italia Irredenta and casts ambitious eyes toward Ottoman Tripolitania in North Africa."
 USA_GATHERING_STORM_DESC:0 "The United States under President William Howard Taft follows a doctrine of Dollar Diplomacy and domestic progressive expansion, maintaining a strong peacetime economy while remaining aloof from European entanglements."

 ww1_agadir.1.t:0 "The Agadir Crisis"
 ww1_agadir.1.d:0 "In response to French military deployments in Morocco, SMS Panther has arrived in the closed port of Agadir to protect German commercial interests and demand territorial compensation."
 ww1_agadir.1.a:0 "Send the Panther and assert German prestige!"
 ww1_agadir.1.b:0 "Maintain diplomatic restraint."
 ww1_agadir.2.t:0 "Panthersprung: The Panther in Agadir"
 ww1_agadir.2.d:0 "The German Empire has dispatched a gunboat to Agadir in direct challenge to French dominance in Morocco!"
 ww1_agadir.2.a:0 "We will not yield to gunboat diplomacy!"
 ww1_agadir.3.t:0 "The Agadir Crisis & The Mansion House Speech"
 ww1_agadir.3.d:0 "Chancellor of the Exchequer Lloyd George warns that national honor is paramount and Britain stands firmly by France against German aggression."
 ww1_agadir.3.a:0 "The Entente stands firm!"
