l_english:
 SOV_backward_agrarian_system:0 "Backward Agrarian System"
 SOV_backward_agrarian_system_desc:0 "Centuries of communal strip-farming, medieval wooden ards, and periodic land repartition by the Mir communes have left the Russian peasantry economically impoverished and land-hungry."
 SOV_stolypin_reforms_spirit:0 "Stolypin's Agrarian Reforms"
 SOV_stolypin_reforms_spirit_desc:0 "Prime Minister Pyotr Stolypin's legislation allows individual peasants to leave the commune, consolidate private homesteads (khutors), and obtain low-interest mortgages from the Peasant Land Bank."
 SOV_stolypin_unbroken_reforms:0 "Triumph of Stolypin's Vision"
 SOV_stolypin_unbroken_reforms_desc:0 "With twenty years of unbroken peace and determined administrative drive, the Russian countryside is transformed into a bulwark of prosperous, property-owning yeoman farmers loyal to the Crown."
 SOV_prosperous_kulaks:0 "Prosperous Peasant Freeholders"
 SOV_prosperous_kulaks_desc:0 "The emergence of a thriving rural middle class has dramatically increased grain yields, modernized harvesting tools, and established durable domestic consumer demand."
 SOV_private_peasant_ownership:0 "Private Peasant Land Ownership"
 SOV_private_peasant_ownership_desc:0 "Guaranteed constitutional property rights over agricultural land have stimulated private investment in drainage, fertilizers, and crop rotation across the black earth belt."
 SOV_siberian_butter_and_grain:0 "Siberian Agricultural Boom"
 SOV_siberian_butter_and_grain_desc:0 "Millions of resettled pioneer families along the Trans-Siberian Railway produce vast export surpluses of world-renowned butter, wheat, and livestock."
 SOV_peasant_unrest:0 "Simmering Rural Discontent"
 SOV_peasant_unrest_desc:0 "Disappointed hopes for land redistribution and resentment against noble manor houses breed sullen hostility and periodic arson attacks throughout the provinces."
 SOV_agrarian_collapse:0 "Total Agrarian Breakdown"
 SOV_agrarian_collapse_desc:0 "Widespread peasant jacqueries, land seizures, and draft animal requisitions have devastated commercial food deliveries, precipitating starvation in the industrial cities."
 SOV_witte_industrialization_legacy:0 "Legacy of Sergei Witte"
 SOV_witte_industrialization_legacy_desc:0 "Count Witte's ambitious industrialization policies have spurred massive foreign capital investment, expanding Russian heavy metallurgy and the national railway grid at breakneck speed."
 SOV_witte_gold_standard:0 "The Imperial Gold Standard"
 SOV_witte_gold_standard_desc:0 "The gold-backed Imperial Ruble guarantees sovereign international credit, stabilizes state finances, and attracts steady flows of French and British commercial loans."
 SOV_war_industry_mobilization:0 "Special Council for State Defense"
 SOV_war_industry_mobilization_desc:0 "Centralized coordination of industrial contracts, fuel allocations, and metals requisitions ensures steady deliveries of materiel to the frontline armies."
 SOV_zemgor_mobilization:0 "Zemgor Civic War Mobilization"
 SOV_zemgor_mobilization_desc:0 "The joint committee of Zemstvos and Municipalities mobilizes private factories, sets up field hospitals, and produces millions of uniforms and shells for the soldiers."
 SOV_war_communism_regime:0 "War Communism Regime"
 SOV_war_communism_regime_desc:0 "Forced grain requisitions (Prodrazvyorstka), nationalization of all industrial enterprises, and strict militarization of labor enforce total resource concentration for revolutionary survival."
 SOV_war_communism_economy:0 "Militarized Proletarian Economy"
 SOV_war_communism_economy_desc:0 "Strict rationing, the elimination of private trade, and direct state distribution of essential provisions sustain the Red Army at the expense of civilian consumption."
 SOV_denikin_free_market:0 "White Free Enterprise Restoration"
 SOV_denikin_free_market_desc:0 "The Special Council under the Armed Forces of South Russia guarantees private property, restores industrial assets to rightful owners, and invites foreign commercial partnerships."
 SOV_reconstruction_drive:0 "Post-War Reconstruction Drive"
 SOV_reconstruction_drive_desc:0 "National focus turns toward rebuilding shattered bridges, clearing ruined trackbeds, and restoring production lines across the devastated battlefields of the Empire."
 SOV_great_military_program_spirit:0 "The Great Military Program of 1914"
 SOV_great_military_program_spirit_desc:0 "A monumental multi-year rearmament plan aimed at increasing peacetime army strength to over two million men, vastly modernizing artillery, and expanding railway concentration networks."
 SOV_sukhomlinov_administration:0 "Sukhomlinov's Ministry of War"
 SOV_sukhomlinov_administration_desc:0 "General Vladimir Sukhomlinov's charming courtiership masks deep administrative dysfunction, procurement rivalries, and dangerous neglect of heavy shell reserves."
 SOV_stavka_operational_clarity:0 "Stavka Operational Centralization"
 SOV_stavka_operational_clarity_desc:0 "Reorganization of the Imperial General Headquarters at Mogilev establishes clear command hierarchies between the Northwestern and Southwestern Fronts."
 SOV_shell_shortage_crisis:0 "The Great Shell Crisis (Snaryadny Golod)"
 SOV_shell_shortage_crisis_desc:0 "Frontline artillery batteries are restricted to three shells per day per gun, forcing infantry divisions to endure horrific enemy barrages without counter-battery fire."
 SOV_brusilov_doctrine_victory:0 "Brusilov Infiltration Doctrine"
 SOV_brusilov_doctrine_victory_desc:0 "By discarding rigid multi-day barrages in favor of sudden concentrated artillery strikes and simultaneous shock advances along broad fronts, Russian infantry shatters fortified lines."
 SOV_shock_battalions_spirit:0 "Death Battalions & Shock Detachments"
 SOV_shock_battalions_spirit_desc:0 "Elite volunteers wearing black-and-red chevron badges spearhead trench assaults, demonstrating unmatched personal heroism to restore frontline offensive spirit."
 SOV_unbreakable_steamroller:0 "The Russian Steamroller Unstoppable"
 SOV_unbreakable_steamroller_desc:0 "With millions of well-drilled soldiers, boundless reserves of ammunition, and supreme command confidence, the Russian Empire overwhelms all opposition on the Eastern Front."
 SOV_reborn_red_army:0 "The Workers' and Peasants' Red Army"
 SOV_reborn_red_army_desc:0 "Forged in revolutionary fire under Leon Trotsky, political commissars, former Tsarist military specialists (voenspets), and iron revolutionary discipline forge a terrifying military machine."
 SOV_white_martial_law:0 "White Movement Martial Law"
 SOV_white_martial_law_desc:0 "Military governors-general govern with absolute decree, suspending civil courts and ruthlessly eradicating socialist cells and strike agitation behind the front."
 SOV_draconian_discipline:0 "Restoration of Military Death Penalty"
 SOV_draconian_discipline_desc:0 "Summary courts-martial and firing squads for deserters and agitators re-establish iron order among exhausted units in the trenches."
 SOV_vsyur_high_command:0 "Armed Forces of South Russia (VSYUR)"
 SOV_vsyur_high_command_desc:0 "General Anton Denikin unifies the Volunteer Army, Don Cossacks, and Kuban hosts into a disciplined anti-Bolshevik army marching upon Moscow."
 SOV_supreme_ruler_regime:0 "Regime of the Supreme Ruler"
 SOV_supreme_ruler_regime_desc:0 "Admiral Alexander Kolchak assumes supreme power in Omsk, leading the Russian state in a crusade to restore 'One, Great, Indivisible Russia'."
 SOV_czech_legion_control_of_transsiberian:0 "Czechoslovak Legion Trans-Siberian Patrol"
 SOV_czech_legion_control_of_transsiberian_desc:0 "Veteran Czechoslovak legionnaires control key railway junctions, armored trains, and supply depots from the Volga riverbanks to Vladivostok."
 SOV_tsarist_autocracy_and_duma:0 "Tsarist Autocracy & Uneasy Duma"
 SOV_tsarist_autocracy_and_duma_desc:0 "The Emperor's divine autocratic prerogatives coexist in fragile tension with the elected State Duma, generating perpetual friction between court ministers and parliamentary deputies."
 SOV_rasputin_court_intrigues:0 "Rasputin's Shadow Over Tsarskoye Selo"
 SOV_rasputin_court_intrigues_desc:0 "The Siberian healer's intimate influence over the Tsarina fuels poisonous public rumors of ministerial leapfrog and aristocratic betrayal, mortally discrediting the Romanov dynasty."
 SOV_dual_power_dvoevlastie:0 "Dual Power (Dvoevlastie)"
 SOV_dual_power_dvoevlastie_desc:0 "Paralyzing division between the bourgeois Provisional Government in the Winter Palace and the radical Petrograd Soviet representing armed soldiers and factory workers."
 SOV_petrograd_order_no_1:0 "Petrograd Soviet Order No. 1"
 SOV_petrograd_order_no_1_desc:0 "Elected soldiers' committees take control of regimental weapons and abolish officer titles and saluting, effectively destroying the chain of command across the Imperial Army."
 SOV_dictatorship_of_the_proletariat:0 "Dictatorship of the Proletariat"
 SOV_dictatorship_of_the_proletariat_desc:0 "All power to the Soviets! The working class and revolutionary soldiers wield absolute state authority to suppress counter-revolution and build socialism."
 SOV_salvation_directory_rule:0 "Directory of National Salvation"
 SOV_salvation_directory_rule_desc:0 "An emergency executive cabinet established to hold back military defeat and quell domestic radicalism until the national elections."
 SOV_constituent_assembly_defense:0 "Constituent Assembly Sovereignty"
 SOV_constituent_assembly_defense_desc:0 "The democratically elected sovereign parliament embodies the legitimate, universal will of all Russian citizens regardless of class or confession."
 SOV_russian_federal_republic:0 "Russian Democratic Federal Republic"
 SOV_russian_federal_republic_desc:0 "A modern constitutional republic granting extensive autonomy to national minorities, safeguarding civil liberties, and securing the rights of labor."
 SOV_absolute_autocracy_triumphant:0 "Absolute Autocracy Restored"
 SOV_absolute_autocracy_triumphant_desc:0 "The Tsar reigns supreme with unchecked divine authority. All radical and parliamentary challenges have been crushed with an iron hand."
 SOV_enlightened_constitutional_autocracy:0 "Enlightened Constitutional Autocracy"
 SOV_enlightened_constitutional_autocracy_desc:0 "A harmonious synthesis of strong imperial leadership, professional ministerial administration, and constructive parliamentary partnership with the Duma."
 SOV_brest_humiliation:0 "Humiliation of Brest-Litovsk"
 SOV_brest_humiliation_desc:0 "The catastrophic loss of the western borderlands, fertile grain fields, and industrial heartlands leaves the nation isolated, weakened, and scarred."
 SOV_tsargrad_liberated:0 "Liberation of Tsargrad & The Straits"
 SOV_tsargrad_liberated_desc:0 "The historic Byzantine dream is realized: the Russian cross crowns Hagia Sophia, and the Russian fleet commands the Bosphorus and Dardanelles."
 SOV_slavic_brotherhood:0 "Slavic Brotherhood & Balkan Hegemony"
 SOV_slavic_brotherhood_desc:0 "Russia fulfills her historic mission as the protector of all Orthodox and Slavic peoples, forging an unbreakable alliance across the Balkans."
 SOV_arctic_lifeline:0 "Arctic Ocean Supply Lifeline"
 SOV_arctic_lifeline_desc:0 "Icebreaker convoys and the newly opened Murmansk railway route keep Allied munitions flowing into the Russian interior year-round."
 SOV_arsenal_of_the_russian_state:0 "Arsenal of the Russian State"
 SOV_arsenal_of_the_russian_state_desc:0 "State and private factories operate on continuous shifts, pumping hundreds of thousands of shells, rifles, and artillery pieces to the battlefronts."
 SOV_triumph_of_pan_slavism:0 "Triumph of Pan-Slavism"
 SOV_triumph_of_pan_slavism_desc:0 "The liberation and confederation of the Slavic nations under Russian leadership reshapes the geopolitical map of Central and Southeastern Europe forever."
 SOV_modern_broad_gauge_network:0 "Modernized Broad-Gauge Railway Grid"
 SOV_modern_broad_gauge_network_desc:0 "Double-tracking, high-capacity American Baldwin locomotives, and expanded marshaling yards allow unprecedented strategic troop redeployments."
SOV_goremykin_reactionary_cabinet:0 "Goremykin Reactionary Cabinet"
 SOV_goremykin_reactionary_cabinet_desc:0 "The elderly Premier Goremykin oversees a paralyzed, bureaucratic administration that resists cooperation with the Duma."
 SOV_progressive_coalition_cabinet:0 "Progressive Coalition Cabinet"
 SOV_progressive_coalition_cabinet_desc:0 "A broad coalition of public figures, industrial magnates, and Duma delegates working together to mobilize the home front."
 SOV_petrograd_soviet_order_no_1:0 "Petrograd Soviet Order No. 1"
 SOV_petrograd_soviet_order_no_1_desc:0 "Soldiers committees and dual power paralyze officer authority and undermine combat discipline."
 SOV_land_socialization_decree:0 "Decree on Land Socialization"
 SOV_land_socialization_decree_desc:0 "Transfer of landed estates to peasant agrarian soviets fulfills the centuries-old dream of land and liberty."
 SOV_all_russian_cheka:0 "All-Russian Extraordinary Commission (Cheka)"
 SOV_all_russian_cheka_desc:0 "The revolutionary sword and shield against counter-revolution, sabotage, and foreign espionage."
 SOV_declaration_rights_peoples:0 "Declaration of Rights of the Peoples of Russia"
 SOV_declaration_rights_peoples_desc:0 "Guarantees self-determination, autonomy, and cultural equality across the borderland nations."
 SOV_black_hundreds_paramilitaries:0 "Black Hundreds Armed Leagues"
 SOV_black_hundreds_paramilitaries_desc:0 "Fiercely loyal monarchist leagues patrol the streets to crush revolutionary sentiment."
 SOV_divine_autocracy:0 "Sacred Autocracy Restored"
 SOV_divine_autocracy_desc:0 "Nicholas II rules as the God-appointed sovereign over Holy Mother Russia."
 SOV_imperial_secret_police:0 "Purified Imperial Okhrana"
 SOV_imperial_secret_police_desc:0 "Relentless surveillance and counter-insurgency protect the imperial throne from subversion."
 SOV_undivided_autocratic_will:0 "Undivided Imperial Will"
 SOV_undivided_autocratic_will_desc:0 "Dissolution of the Duma removes parliamentary obstacles to direct imperial decrees."
 SOV_sacred_romanov_autocracy:0 "Sacred Romanov Dynasty"
 SOV_sacred_romanov_autocracy_desc:0 "Three hundred years of Romanov rule stands vindicated and unchallenged."
 SOV_grain_procurement_system:0 "Centralized Grain Requisition"
 SOV_grain_procurement_system_desc:0 "State monopoly over agricultural surpluses ensures rations reach army depots and munitions workers."
 SOV_defender_of_orthodox_christendom:0 "Defender of Orthodox Christendom"
 SOV_defender_of_orthodox_christendom_desc:0 "The Russian Empire stands as the rightful shield of all Orthodox peoples."
 SOV_shield_of_the_slavs:0 "Shield of the South Slavs"
 SOV_shield_of_the_slavs_desc:0 "Russia will not permit Austria-Hungary to extinguish Serbian independence."
 SOV_pan_slavic_patronage:0 "Pan-Slavic Patronage"
 SOV_pan_slavic_patronage_desc:0 "Diplomatic and military guarantees bind the Slavic nations under Russian leadership."
 GER_wartime_rationing_spirit:0 "Wartime Rationing (Kriegsbrot)"
 GER_wartime_rationing_spirit_desc:0 "Strict state rationing of flour and food staples protects civilian reserves during the naval blockade."
 GER_kaiserliche_weltmacht:0 "Kaiserliche Weltmacht"
 GER_kaiserliche_weltmacht_desc:0 "Germany's place in the sun is permanently cemented by decisive military victory."
 GER_democratic_franchise_reform:0 "Equal Universal Franchise"
 GER_democratic_franchise_reform_desc:0 "Abolition of the archaic Prussian three-class voting system establishes true representative democracy."
 GER_democratic_legitimacy:0 "Democratic Parliamentary Legitimacy"
 GER_democratic_legitimacy_desc:0 "The Reichstag and the Kaiser rule in harmonious constitutional partnership."
 SOV_polivanov_staff_reforms:0 "Polivanov's War Ministry Reforms"
 SOV_polivanov_staff_reforms_desc:0 "Following the dismissal of Sukhomlinov, General Alexei Polivanov coordinates closely with the Duma and the defense industry, cutting red tape and gradually restoring operational clarity."
 SOV_sukhomlinov_administration_tier2:0 "Initial Army Reorganization"
 SOV_sukhomlinov_administration_tier2_desc:0 "Sukhomlinov's early corps directives have begun standardizing field divisions and streamlining recruitment, slightly alleviating command delays, though artillery stockpiles and strategic planning remain sluggish."
 SOV_sukhomlinov_administration_tier3:0 "Overhauled Military Districts"
 SOV_sukhomlinov_administration_tier3_desc:0 "The reorganization of European Russia into unified military districts with integrated logistics has restored tactical morale and cut mobilization delays in half."
 SOV_modern_imperial_general_staff:0 "Modern Imperial General Staff"
 SOV_modern_imperial_general_staff_desc:0 "Through methodical pre-war reforms, doctrine overhauls, and staff coordination, the Russian Imperial Army has eliminated bureaucratic paralysis and established an agile, modern high command."
 SOV_shell_shortage_stage_2:0 "Shell Famine: Industrial Mobilization"
 SOV_shell_shortage_stage_2_desc:0 "Through the Special Council for Defense and War Industries Committees (VPK), domestic arms production surges, though artillery units still face ammunition rationing."
 SOV_shell_shortage_stage_3:0 "Shell Famine: Arctic Supply Lifeline"
 SOV_shell_shortage_stage_3_desc:0 "Allied munitions shipments through Archangelsk and the new Murmansk railway ease the acute deficit, leaving only minor ammunition constraints."
 SOV_vpk_mobilization_spirit:0 "War Industries Committees (VPK)"
 SOV_vpk_mobilization_spirit_desc:0 "Private manufacturing works and local municipal workshops are mobilized into state shell contracts to supply the frontline armies."
 SOV_strategic_depth_and_rasputitsa:0 "Strategic Depth & The Rasputitsa"
 SOV_strategic_depth_and_rasputitsa_desc:0 "The colossal territorial depth of the Russian Empire and the seasonal mud of the rasputitsa turn any hostile invasion into an agonizing logistical nightmare. Invading armies are inexorably ground down by vast distances, brutal winter cold, and impassable quagmires."
 SOV_order_restored_spirit:0 "Triumph of Imperial Order"
 SOV_order_restored_spirit_desc:0 "Through rigorous administrative vigilance, decisive food logistics, and unwavering frontline loyalty, the revolutionary conspiracy has been extinguished. The throne is secure, and peace reigns across the empire."
 SOV_aviation_school_program:0 "Imperial Aviation Officer Schools"
 SOV_aviation_school_program_desc:0 "Standardized aeronautical instruction programs at Gatchina and Sevastopol prepare pilots in aerial tactics, engine maintenance, and combat navigation."
 SOV_aviation_combat_school:0 "Advanced Combat Flight Academy"
 SOV_aviation_combat_school_desc:0 "Intensive dogfighting maneuvers, formation tactics, and live-fire gunnery training for Russian military aviators."
 SOV_ace_training_system:0 "Imperial Ace Pilot Doctrine"
 SOV_ace_training_system_desc:0 "Fostering individual pilot initiative and aggressive aerial marksmanship inspired by legendary aces like Alexander Kazakov."
 SOV_aerial_recon_network:0 "Corps Aerial Reconnaissance Network"
 SOV_aerial_recon_network_desc:0 "Systematic aerial photography and artillery spotting squadrons directly attached to army corps headquarters provide real-time battlefield intelligence."
 SOV_air_naval_coordination:0 "Black Sea Air-Naval Spotting"
 SOV_air_naval_coordination_desc:0 "Seaplane carriers and maritime air patrols directing long-range naval bombardments against Ottoman coastal batteries and Bosphorus fortifications."
 SOV_integrated_air_service:0 "Imperial Military Air Fleet (EVF)"
 SOV_integrated_air_service_desc:0 "A fully integrated, autonomous air arm equipped with Ilya Muromets heavy bombers, scouts, and pursuit squadrons operating under centralized staff command."
 SOV_southwestern_preparation:0 "Preparation for the Southwestern Offensive"
 SOV_southwestern_preparation_desc:0 "General Brusilov's meticulously organized assault preparations, digging advanced saps close to Austro-Hungarian trenches and drilling shock formations."
 SOV_southwestern_offensive:0 "The Brusilov Breakthrough"
 SOV_southwestern_offensive_desc:0 "Simultaneous shock attacks along the entire Southwestern Front shattering the Austro-Hungarian Fourth and Seventh Armies in a display of tactical brilliance."
 SOV_southwestern_exhaustion:0 "Post-Breakthrough Exhaustion"
 SOV_southwestern_exhaustion_desc:0 "Heavy casualties and logistical depletion following the intensive operations in Galicia and Volhynia require operational consolidation."
 SOV_serbian_medical_mission:0 "Russian Imperial Red Cross in Serbia"
 SOV_serbian_medical_mission_desc:0 "Medical detachments, field hospitals, and epidemic relief missions aiding Serbian allied forces on the Balkan front in Christian brotherhood."
 WHT_provisional_all_russian_government:0 "All-Russian Provisional Government"
 WHT_provisional_all_russian_government_desc:0 "The unified civil authority claiming legitimate sovereignty over all territories of the former Russian Empire."
 WHT_trans_siberian_artery:0 "Trans-Siberian Lifeline"
 WHT_trans_siberian_artery_desc:0 "Continuous rail convoys along the Trans-Siberian corridor transport supplies from Pacific harbors to the Urals front."
 WHT_supreme_ruler_authority:0 "Authority of the Supreme Ruler"
 WHT_supreme_ruler_authority_desc:0 "Admiral Kolchak's supreme military mandate centralizes civil and military power in defense of the fatherland."
 WHT_ice_march_heroism:0 "Spirit of the Ice March"
 WHT_ice_march_heroism_desc:0 "The sacrificial heroism of the initial winter campaigns inspires White volunteers with an unbending determination to endure."
 WHT_volunteer_officer_spirit:0 "Volunteer Officer Ethos"
 WHT_volunteer_officer_spirit_desc:0 "Battalions of dedicated officers fight as common infantrymen, providing peerless tactical assault capabilities."
 WHT_denikin_general_command:0 "Denikin's Strategic High Command"
 WHT_denikin_general_command_desc:0 "Methodical planning and orthodox military doctrine coordinating simultaneous army group maneuvers toward central Russia."
 WHT_cossack_allegiance:0 "Cossack Host Alliances"
 WHT_cossack_allegiance_desc:0 "Traditional Cossack horsemen provide fierce cavalry formations that dominate open plains and strike terror into enemy rear lines."
 WHT_shock_officer_regiments:0 "Elite Colored Shock Regiments"
 WHT_shock_officer_regiments_desc:0 "The Kornilov, Markov, and Drozdovsky regiments lead every breakthrough assault with unmatched bravery."
 WHT_moscow_directive_spirit:0 "The Moscow Directive Drive"
 WHT_moscow_directive_spirit_desc:0 "All resources and divisions are concentrated upon a single glorious objective: the liberation of the holy city of Moscow."
 WHT_wrangel_agrarian_order:0 "Wrangel's Agrarian Settlements"
 WHT_wrangel_agrarian_order_desc:0 "Pragmatic land laws win the active support of small-holding peasants and guarantee agricultural supplies for the army."
 WHT_reorganized_russian_army:0 "Reorganized Russian Army"
 WHT_reorganized_russian_army_desc:0 "Professional command structures, unified supply standards, and strict military discipline under General Baron Wrangel."
 WHT_british_military_mission:0 "British Military Assistance"
 WHT_british_military_mission_desc:0 "Generous shipments of British uniforms, Lee-Enfield rifles, and military advisors bolster our operational effectiveness."
 WHT_french_munitions_pipeline:0 "French Munitions Pipeline"
 WHT_french_munitions_pipeline_desc:0 "French naval convoys transport artillery ammunition and equipment through Black Sea ports."
 WHT_stevens_railway_mission:0 "Stevens' American Railway Corps"
 WHT_stevens_railway_mission_desc:0 "American engineering expertise drastically improves locomotive turnaround times and railway capacity."
 WHT_entente_diplomatic_recognition:0 "Entente Diplomatic Recognition"
 WHT_entente_diplomatic_recognition_desc:0 "Official liaison with the Allied Supreme War Council grants international legitimacy and opens overseas credit lines."
 WHT_arsenal_of_democracy_aid:0 "Allied Material Deliveries"
 WHT_arsenal_of_democracy_aid_desc:0 "Steady streams of Allied machine tools, trucks, and small arms flow through our maritime supply hubs."
 WHT_russia_one_and_indivisible_spirit:0 "Russia, One and Indivisible"
 WHT_russia_one_and_indivisible_spirit_desc:0 "Uncompromising defense of the territorial integrity and sovereign unity of the Russian State."
 WHT_republican_constitution:0 "Republican Constitutional Legitimacy"
 WHT_republican_constitution_desc:0 "A commitment to universal suffrage, civic freedoms, and an accountable legislative assembly."
 WHT_supreme_military_dictate:0 "Iron Military Dictatorship"
 WHT_supreme_military_dictate_desc:0 "Uncompromising executive dictatorship enforcing absolute civil obedience and eliminating subversive disruption."
 WHT_restored_state_gendarmerie:0 "State Security & Gendarmerie"
 WHT_restored_state_gendarmerie_desc:0 "Vigilant counter-espionage agents root out clandestine revolutionary cells and preserve order across liberated cities."
 WHT_crowned_regency:0 "Supreme Crowned Regency"
 WHT_crowned_regency_desc:0 "A traditional regency council prepares for the restoration of legitimate Christian monarchy in Russia."
 WHT_holy_orthodox_symphonia:0 "Orthodox Spiritual Symphonia"
 WHT_holy_orthodox_symphonia_desc:0 "Harmonious unity between church authority and state power revitalizes the spiritual soul of the Russian nation."
 SOV_duma_and_court_politics:0 "Imperial Duma & Court Politics"
 SOV_duma_and_court_politics_desc:0 "Manage relations between the State Duma, the conservative State Council, and the Imperial Court."
 SOV_convene_imperial_duma:0 "Convene the Imperial State Duma"
 SOV_convene_imperial_duma_desc:0 "Call the State Duma into session to rally national unity and debate emergency war appropriations."
 SOV_prorogue_the_duma:0 "Prorogue the State Duma"
 SOV_prorogue_the_duma_desc:0 "Issue an imperial ukase temporarily suspending the Duma to curb subversive rhetoric and liberal criticism."
 SOV_conspiracy_rasputin:0 "Remove Court Intrigues"
 SOV_conspiracy_rasputin_desc:0 "Purge the influence of irresponsible courtiers and shadowy confidants from the imperial residence."
 SOV_establish_vpk_committees:0 "Establish Regional VPK Committees"
 SOV_establish_vpk_committees_desc:0 "Organize regional War Industries Committees to coordinate factories and subcontract shell manufacture."
 SOV_mobilize_machine_shops:0 "Convert Private Workshops to Munitions"
 SOV_mobilize_machine_shops_desc:0 "Re-tool provincial metalworking and lathe workshops into specialized shell and fuse production."
 SOV_zemgor_medical_union:0 "Support the Zemgor Union"
 SOV_zemgor_medical_union_desc:0 "Fund the joint committee of Zemstvos and Town Councils to provide medical trains and frontline supplies."
 SOV_british_shell_presses:0 "Procure British Shell Presses"
 SOV_british_shell_presses_desc:0 "Import modern hydraulic shell-forging presses and tooling machinery from Britain via Archangelsk."
 SOV_evacuate_industrial_machinery:0 "Evacuate Western Industrial Machinery"
 SOV_evacuate_industrial_machinery_desc:0 "Dismantle manufacturing machinery and railway rolling stock from frontline western provinces and relocate them eastward."
 SOV_prepare_southwestern_offensive:0 "Prepare the Southwestern Front Offensive"
 SOV_prepare_southwestern_offensive_desc:0 "Stockpile artillery ammunition, concentrate shock corps, and plan surprise breakthroughs across the Galician lines."
